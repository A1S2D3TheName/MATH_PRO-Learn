# Дерево программы MATH_PRO: от счёта до олимпиадной ступени.
#
# Основа — кандидат C1 c01a10cc9 (drafts/tree/candidates/c01a10cc9.yaml), выбранная ревьюером V4;
# в неё перенесены узлы и разбиения второго кандидата c01a10cc7. Оба кандидата восходят к графу
# PR15 (research/curriculum/candidates/pr15.md) с применением правок раздела 3 и закрытием
# пробелов раздела 2 ревью (research/curriculum/REVIEW.md).
# Порядок тем — порядок изучения: каждый пререквизит стоит выше зависимой темы.
# Каждая связь проверена ревьюером: отчёт, список правок и переносов — в drafts/tree/REVIEW.md.
# Заметки авторов кандидатов лежат в их ветках (drafts/tree/NOTES.md).

format_version: 1

stages:
  - id: 1
    title: Счёт и натуральная арифметика
    outcome: >
      Считает, читает и пишет многозначные числа, понимает разряды, выполняет четыре действия
      устно и столбиком, делит уголком с остатком и проверяет результат обратным действием.
      Решает одно- и двухшаговые задачи, в том числе простое движение. Измеряет длину, угол,
      время и массу, находит периметр и площадь прямоугольника. Читает таблицы и пиктограммы,
      видит дробь как долю целого.
    grades: "1–4"
  - id: 2
    title: Дроби и рациональная арифметика
    outcome: >
      Свободно работает с обыкновенными и десятичными дробями, отношениями, пропорциями
      и процентами, называет базу процента. Знает делимость, НОД и НОК, понимает отрицательные
      числа на прямой и владеет действиями со знаками. Строит диаграммы, считает среднее,
      перебирает варианты деревом, различает пример и контрпример.
    grades: "5–6"
  - id: 3
    title: Язык алгебры и начала доказательств
    outcome: >
      Различает роли буквы, преобразует выражения, работает со степенями, многочленами
      и формулами сокращённого умножения. Решает линейные уравнения, неравенства и системы,
      переводит задачу в уравнение, строит график линейной функции. Доказывает признаки
      равенства треугольников, свойства параллельных прямых и сумму углов. Владеет связками
      и множествами, считает классическую вероятность, применяет простейшие кружковые идеи.
    grades: "7"
  - id: 4
    title: Основная школа — алгебра и планиметрия
    outcome: >
      Решает квадратные, дробно-рациональные, биквадратные и иррациональные уравнения
      и неравенства, задачи с модулем. Работает с корнями и действительными числами, строит
      параболу, гиперболу и график корня, выполняет преобразования графиков. Знает
      четырёхугольники, площади, теорему Пифагора, подобие, окружность, синус острого угла
      и замечательные точки треугольника. Применяет кванторы, сравнения по модулю
      и комбинаторные формулы.
    grades: "8–9"
  - id: 5
    title: Профильная основа
    outcome: >
      Работает с векторами и координатами на плоскости, движениями и гомотетией, теоремами
      синусов и косинусов. Знает прогрессии и индукцию, степени с рациональным показателем,
      показательную и логарифмическую функции, тригонометрию на окружности с формулами
      и уравнениями. Решает задачи на условную вероятность и схему Бернулли, линейные задачи
      с параметром, применяет неравенство о средних.
    grades: "9–10"
  - id: 6
    title: Физмат-ядро
    outcome: >
      Применяет производную и интеграл. Решает показательные, логарифмические
      и тригонометрические неравенства, квадратные и графические задачи с параметром.
      Владеет стереометрией с сечениями, углами, объёмами и векторно-координатным методом,
      случайными величинами, комплексными числами, неравенством Коши — Буняковского,
      диофантовыми уравнениями, малой теоремой Ферма, инвариантами и оценками.
    grades: "10–11"
  - id: 7
    title: Олимпиадное расширение и мост в вуз
    outcome: >
      Решает функциональные уравнения, олимпиадные задачи на многочлены, графы
      и геометрические преобразования, включая инверсию. Знает теоремы Менелая и Чевы,
      вероятностный метод, эпсилон-язык и теорему о среднем. Умеет собрать и проверить
      полное решение нестандартной задачи и довести прикладную модель до проверки допущений.
    grades: "11+"

sections:
  - id: num
    title: Натуральные числа и вычисления
    about: счёт, запись, разряды, четыре действия устно и письменно, порядок действий, округление и прикидка
  - id: frac
    title: Дроби и десятичные
    about: доля, дробь на прямой, равные дроби, действия, смешанные числа, десятичная запись, переводы, периодические дроби
  - id: ratio
    title: Отношения, пропорции, проценты
    about: отношение, масштаб, пропорция, прямая и обратная пропорциональность, проценты, процентное изменение
  - id: numsys
    title: Числовые системы
    about: отрицательные, рациональные и действительные числа, модуль, промежутки, иррациональность, комплексные числа
  - id: nt
    title: Делимость и теория чисел
    about: делители, признаки, простые числа, НОД и НОК, алгоритм Евклида, сравнения, диофантовы уравнения, Ферма и Эйлер, целая часть
  - id: alg
    title: Выражения и преобразования
    about: буква, выражения, степени и корни, многочлены, формулы сокращённого умножения, разложение, деление многочленов и Безу, алгебраические дроби
  - id: eq
    title: Уравнения, неравенства, системы
    about: линейные, квадратные, дробно-рациональные, иррациональные, с модулем, показательные и логарифмические, метод интервалов, системы
  - id: func
    title: Функции и последовательности
    about: понятие функции, графики и преобразования, элементарные функции, обратная функция, прогрессии
  - id: param
    title: Задачи с параметром
    about: от линейных к квадратным, графическим, модульным, тригонометрическим и логарифмическим
  - id: geom
    title: Планиметрия
    about: фигуры и измерение, доказательная геометрия, треугольники, окружность, площади, подобие, острый угол, векторы, координаты, движения и гомотетия, построения
  - id: trig
    title: Тригонометрия
    about: радианы, единичная окружность, функции, тождества, формулы, обратные функции, уравнения и неравенства
  - id: stereo
    title: Стереометрия
    about: аксиомы, параллельность и перпендикулярность, углы и расстояния, многогранники, сечения, тела вращения, объёмы, векторно-координатный метод
  - id: calc
    title: Начала анализа
    about: предел и непрерывность, производная и приложения, первообразная, интеграл, мост к строгому анализу
  - id: comb
    title: Комбинаторика и графы
    about: перебор, правила суммы и произведения, перестановки и сочетания, бином, включения-исключения, рекурренты, элементы графов
  - id: prob
    title: Вероятность и статистика
    about: данные и диаграммы, меры центра и разброса, выборка, события, классическая, геометрическая и условная вероятность, Бернулли, случайная величина
  - id: logic
    title: Логика, множества, доказательства
    about: высказывания, связки, кванторы, множества, необходимое и достаточное, прямое доказательство, от противного, индукция
  - id: model
    title: Величины, текстовые задачи, моделирование
    about: единицы и время, движение, работа, смеси, финансы, перевод задачи в уравнение, итоговое моделирование
  - id: olymp
    title: Олимпиадные методы
    about: чётность и инварианты, раскраски, Дирихле, крайний элемент, классические неравенства, функциональные уравнения, олимпиадная геометрия и многочлены, вероятностный метод
  # Раздел code — не отдельный курс программирования, а мини-курс языка, встроенный в математику:
  # тема языка вводится там, где без неё не решается математическая задача (решение владельца 3
  # из research/SUMMARY.md, волна R5). Часы — гипотеза пилота.
  - id: code
    title: Python для математики
    about: мини-курс Python внутри математики — выражения и print, переменные, условия, циклы, функции, списки, точные дроби, тесты, рекурсия, SymPy и графики

