    - скорость путь время
    - цена количество стоимость
    - производительность и объём работы
    - простые задачи на движение
    - сколько стоит несколько штук
    - сколько проедет за время
    - сколько сделает за час
    - табличная запись условия задачи
    - задачи на цену и количество
    - задачи на работу и время
    - движение цена работа
  questions:
    - Как найти путь, если известны скорость и время?
    - Как найти стоимость нескольких одинаковых предметов?
    - Как найти объём работы по производительности?
    - Что такое скорость?
    - Что такое производительность?
    - Как записать условие задачи в таблицу?
    - Как найти время по пути и скорости?
    - Как узнать, какое предложение выгоднее?
    - Как проверить ответ в задаче на движение?

