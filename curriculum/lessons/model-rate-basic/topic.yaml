outcomes:
  - id: LO-01
    short: Считает путь, стоимость и работу
    action: вычисляет путь по скорости и времени, стоимость по цене и количеству, объём работы по
      производительности и времени и записывает данные условия в таблицу
    conditions: натуральные числа; все данные величины названы в условии; без калькулятора
    criterion: верно выбирает умножение связанных величин и записывает искомое, включая пропуски
      таблицы условия
    level: core
    sections: [T01, T02, T03, T04]
  - id: LO-02
    short: Находит пропущенное и сравнивает
    action: находит пропущенную величину обратным действием и сравнивает предложения по цене за
      одну штуку
    conditions: натуральные числа; каждая величина делится без остатка; среди данных не менее двух
      связанных величин
    criterion: верно выбирает обратное действие или сравнение по цене за единицу и проверяет ответ
      прямым действием
    level: deep
    sections: [T01, T02, T03, T04]

