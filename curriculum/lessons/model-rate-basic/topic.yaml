id: model-rate-basic
title: Простые задачи на движение, цену и работу
section: model
stage: 1
hours: 3
grade: "3–4"
prerequisites: [model-two-step, model-units]
scope: >
  Только натуральные числа и готовые значения; дробные скорости и совместная работа — в
  model-rate.
version: 1.0.0
summary: >
  Тема собирает три простые связи величин: путь равен скорости, умноженной на время, стоимость —
  цене, умноженной на количество, объём работы — производительности, умноженной на время.
  Ученик учится находить пропущенную величину по двум данным, записывать условие в таблицу и
  сравнивать два предложения по цене за штуку.

