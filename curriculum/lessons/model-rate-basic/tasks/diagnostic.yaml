# Входная диагностика (STANDARD.md §6, правила 15 и 160): 4 задачи по прямым пререквизитам
# model-two-step и model-units. Внимание: правило 160 требует вести sections в пакет
# пререквизита, но схема sectionRef (^T[0-9]{2}$) этого не допускает — см. вопрос в PR.
tasks:
- id: D-01
  type: number
  role: diagnostic
  purpose: procedure
  level: 1
  outcome: model-two-step/LO-01
  sections:
  - T02
  minutes: 2
  prompt: В пачке 8 фломастеров. Купили 3 пачки и ещё отдельно 5 фломастеров. Сколько фломастеров всего?
  answer: 29
  hints:
  - Сначала посчитайте фломастеры в трёх пачках.
  - 'Пачки — это равные группы: 8 + 8 + 8.'
  - К трем пачкам прибавьте ещё 5 отдельных фломастеров.
  solution: |
    ### Ответ
    29 фломастеров.

    ### Идея
    Задача в два действия: сначала равные группы, потом добавка.

    ### Шаги
    1. 3 пачки по 8: 8 × 3 = 24.
    2. Добавка: 24 + 5 = 29.

    ### Проверка
    29 − 5 = 24 = 8 × 3 — пачки восстанавливаются.

    ### Типичная ошибка
    E-model-rate-basic-price-add: сложить 8 и 3 вместо умножения.
  feedback:
    correct: 'Верно: сначала посчитаны пачки, потом добавка.'
    wrong:
      what: Итог посчитан неверно.
      why: Возможно, пропущено умножение на число пачек.
      fix: Равные группы считаются умножением, затем идёт сложение.
      next: 'Проверьте вычитанием: итог минус 5 должно дать три пачки.'
  errors:
  - E-model-rate-basic-price-add
- id: D-02
  type: number
  role: diagnostic
  purpose: procedure
  level: 1
  outcome: model-two-step/LO-02
  sections:
  - T04
  minutes: 2
  prompt: Книга стоит 90 руб., а тетрадь в 3 раза дешевле книги. Сколько стоят книга и тетрадь вместе?
  answer: 120
  hints:
  - «В 3 раза дешевле» — это деление.
  - Сначала посчитайте стоимость тетради.
  - Сложите стоимость книги и тетради.
  solution: |
    ### Ответ
    120 руб.

    ### Идея
    Задача в два действия: промежуточный результат — тетрадь, потом сумма.

    ### Шаги
    1. Тетрадь: 90 ÷ 3 = 30 руб.
    2. Всего: 90 + 30 = 120 руб.

    ### Проверка
    120 − 90 = 30 = 90 ÷ 3 — тетрадь восстанавливается.

    ### Типичная ошибка
    E-model-rate-basic-price-add: сложить 90 и 3 вместо деления.
  feedback:
    correct: 'Верно: сначала найдена тетрадь, потом общая сумма.'
    wrong:
      what: Итог посчитан неверно.
      why: Возможно, кратность сложили с ценой.
      fix: «В 3 раза дешевле» — деление; затем сложение.
      next: 'Проверьте: стоимость тетради умножьте на 3 — получится книга.'
  errors:
  - E-model-rate-basic-price-add
- id: D-03
  type: number
  role: diagnostic
  purpose: procedure
  level: 1
  outcome: model-units/LO-01
  sections:
  - T01
  minutes: 1
  prompt: Переведите 3 м в сантиметры. Введите число сантиметров.
  answer: 300
  hints:
  - В одном метре 100 сантиметров.
  - Перевод единиц — умножение на 100.
  - Умножьте 3 на 100.
  solution: |
    ### Ответ
    300

    ### Идея
    Метры переводятся в сантиметры умножением на 100.

    ### Шаги
    1. 1 м = 100 см.
    2. 3 м = 3 × 100 = 300 см.

    ### Проверка
    300 ÷ 100 = 3 м — исходная длина восстанавливается.

    ### Типичная ошибка
    E-model-rate-basic-speed-div: разделить 3 на 100 вместо умножения.
  feedback:
    correct: 'Верно: 3 м — это 300 см.'
    wrong:
      what: Перевод выполнен неверно.
      why: Возможно, метры разделили на 100.
      fix: Большую единицу переводят в меньшую умножением.
      next: 'Проверьте: 100 см в одном метре.'
  errors:
  - E-model-rate-basic-speed-div
- id: D-04
  type: number
  role: diagnostic
  purpose: procedure
  level: 1
  outcome: model-units/LO-02
  sections:
  - T03
  minutes: 1
  prompt: Сколько минут в 3 часах? Введите число минут.
  answer: 180
  hints:
  - В одном часе 60 минут.
  - Часы переводят в минуты умножением на 60.
  - Умножьте 3 на 60.
  solution: |
    ### Ответ
    180

    ### Идея
    Часы переводятся в минуты умножением на 60.

    ### Шаги
    1. 1 ч = 60 мин.
    2. 3 ч = 3 × 60 = 180 мин.

    ### Проверка
    180 ÷ 60 = 3 ч — исходное время восстанавливается.

    ### Типичная ошибка
    E-model-rate-basic-speed-add: сложить 3 и 60 вместо умножения.
  feedback:
    correct: 'Верно: 3 часа — это 180 минут.'
    wrong:
      what: Перевод выполнен неверно.
      why: Возможно, часы сложили с 60.
      fix: Часы переводят в минуты умножением на 60.
      next: 'Проверьте: в одном часе ровно 60 минут.'
  errors:
  - E-model-rate-basic-speed-add
