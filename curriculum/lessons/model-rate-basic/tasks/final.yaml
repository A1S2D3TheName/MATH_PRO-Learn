- id: F-04
  type: number
  role: final-step
  purpose: method
  level: 2
  outcome: LO-01
  sections:
  - T02
  - T04
  minutes: 3
  prompt: Дополнительно платят {{b|pl:рубль,рубля,рублей}} за каждый час работы. Поездка длилась {{t|pl:час,часа,часов}}. Сколько всего заплатят
    курьеру за поездку?
  answer: 390
  hints:
  - 'Итог складывается из двух плат: за километры и за часы.'
  - Плата за путь уже посчитана, плата за часы — {{b}} на время поездки.
  - Сложите обе платы.
  solution: |
    ### Ответ
    ({{c}} × {{v}} × {{t}} + {{b}} × {{t}}) руб.

    ### Идея
    Итоговая плата складывается из двух частей: за километры и за часы работы.

    ### Шаги
    1. Плата за путь: {{c}} × {{v}} × {{t}} = ({{c}} × {{v}} × {{t}}) руб.
    2. Плата за часы: {{b}} × {{t}} = ({{b}} × {{t}}) руб.
    3. Всего: ({{c}} × {{v}} × {{t}}) + ({{b}} × {{t}}) = ({{c}} × {{v}} × {{t}} + {{b}} × {{t}}) руб.

    ### Проверка
    ({{c}} × {{v}} × {{t}} + {{b}} × {{t}}) − ({{b}} × {{t}}) = ({{c}} × {{v}} × {{t}}) руб. — плата за путь восстанавливается.

    ### Типичная ошибка
    E-model-rate-basic-price-add: сложить ставку и часы ({{c}} + {{b|pl:рубль,рубля,рублей}}), не умножая их на путь и время.
  feedback:
    correct: 'Верно: обе части оплаты сложены.'
    wrong:
      what: Итоговая плата посчитана неверно.
      why: Возможно, учтена только одна часть оплаты.
      fix: Плата за путь плюс плата за часы — это и есть итог.
      next: 'Вычтите из итога плату за путь: должна остаться плата за часы.'
  errors:
  - E-model-rate-basic-price-add
  depends_on:
  - F-02
  variants:
  - params:
      v: 40
      t: 3
      c: 2
      b: 50
      m: 300
      w: 2
    answer: 390
    solution: |
      ### Ответ
      390 руб.

      ### Идея
      Итоговая плата складывается из двух частей: за километры и за часы работы.

      ### Шаги
      1. Плата за путь: 2 × 40 × 3 = 240 руб.
      2. Плата за часы: 50 × 3 = 150 руб.
      3. Всего: 240 + 150 = 390 руб.

      ### Проверка
      390 − 150 = 240 руб. — плата за путь восстанавливается.

      ### Типичная ошибка
      E-model-rate-basic-price-add: сложить ставку и часы (2 + 50 руб.), не умножая их на путь и время.
  - params:
      v: 60
      t: 4
      c: 3
      b: 40
      m: 800
      w: 2
    answer: 880
