- id: F-03
  type: number
  role: final-step
  purpose: procedure
  level: 2
  outcome: LO-01
  sections:
  - T02
  - T04
  minutes: 3
  prompt: Курьеру дали купюру {{m|pl:рубль,рубля,рублей}}. Сколько рублей сдачи он получит с платы за
    путь?
  answer: 60
  hints:
  - Сдача — разность между купюрой и платой за путь.
  - Плата за путь — результат второго шага.
  - Вычтите плату за путь из {{m}}.
  solution: |
    ### Ответ
    ({{m}} − {{c}} × {{v}} × {{t}}) руб.

    ### Идея
    Сдача — это разность между заплаченной купюрой и начисленной платой.

    ### Шаги
    1. Плата за путь: {{c}} × {{v}} × {{t}} = ({{c}} × {{v}} × {{t}}) руб.
    2. Сдача: {{m}} − ({{c}} × {{v}} × {{t}}) = ({{m}} − {{c}} × {{v}} × {{t}}) руб.

    ### Проверка
    ({{c}} × {{v}} × {{t}}) + ({{m}} − {{c}} × {{v}} × {{t}}) = {{m|pl:рубль,рубля,рублей}} — купюра восстанавливается.

    ### Типичная ошибка
    E-model-rate-basic-first-part: вычесть только один километр пути или забыть про плату за путь.
  feedback:
    correct: 'Верно: сдача найдена вычитанием платы за путь.'
    wrong:
