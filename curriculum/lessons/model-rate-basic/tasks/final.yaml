      1. За час проходят 40 км.
      2. Часов 3: путь равен 40 × 3.
      3. Вычисляем произведение: 40 × 3 = 120 км.

      ### Проверка
      120 ÷ 3 = 40 км/ч — скорость из условия.

      ### Типичная ошибка
      E-model-rate-basic-speed-add: сложить скорость и время (40 + 3 = 43 км) — получится другой отрезок.
