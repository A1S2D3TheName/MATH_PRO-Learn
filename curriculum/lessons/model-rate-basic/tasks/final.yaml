# Финальная цепочка (STANDARD.md §8): доставка курьера, 5 шагов, 6 вариантов с общими
# параметрами; 4 шага из 5 используют результат предыдущего (правило 177).
title: Доставка курьера
context_id: courier-delivery
tasks:
- id: F-01
  type: number
  role: final-step
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T01
  minutes: 2
  prompt: Курьер ехал {{t|pl:час,часа,часов}} со скоростью {{v}} км/ч. Сколько километров проехал курьер?
  answer: 120
  hints:
  - Путь за час равен скорости курьера.
  - Одинаковых часовых отрезков столько, сколько часов поездки.
  - Умножьте {{v}} на {{t}}.
  solution: |
    ### Ответ
    ({{v}} × {{t}}) км

    ### Идея
    За каждый час проходят одинаковый отрезок пути, поэтому скорость умножается на число часов.

    ### Шаги
    1. За час проходят {{v}} км.
    2. Часов {{t}}: путь равен {{v}} × {{t}}.
    3. Вычисляем произведение: {{v}} × {{t}} = ({{v}} × {{t}}) км.

    ### Проверка
    ({{v}} × {{t}}) ÷ {{t}} = {{v}} км/ч — скорость из условия.

    ### Типичная ошибка
    E-model-rate-basic-speed-add: сложить скорость и время ({{v}} + {{t}} = ({{v}} + {{t}}) км) — получится другой отрезок.
  feedback:
    correct: 'Верно: путь курьера найден умножением скорости на время.'
    wrong:
      what: Путь посчитан неверно.
      why: Возможно, скорость и время сложили.
      fix: Путь — произведение скорости и времени.
      next: 'Проверьте делением: путь ÷ время должно вернуть скорость.'
    misconceptions:
    - id: E-model-rate-basic-speed-add
      when:
        expr: v + t
      message: Похоже, скорость и время сложили.
  errors:
  - E-model-rate-basic-speed-add
  depends_on: []
  variants:
