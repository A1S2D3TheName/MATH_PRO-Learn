- id: R-04
  type: number
  role: refresh
  purpose: procedure
  level: 2
  outcome: LO-02
  sections:
  - T02
  minutes: 3
  prompt: 'Первое предложение: {{n1|pl:штука,штуки,штук}} за {{s1|pl:рубль,рубля,рублей}}; второе: {{n2|pl:штука,штуки,штук}}
    за {{s2|pl:рубль,рубля,рублей}}. На сколько рублей дешевле штука у более выгодного предложения?'
  answer: 1
  hints:
  - Сравнивают цены за одну штуку.
  - 'Посчитайте обе цены: {{s1}} ÷ {{n1}} и {{s2}} ÷ {{n2}}.'
  - Из большей цены вычтите меньшую.
  solution: |
    ### Ответ
    |{{s1}} ÷ {{n1}} − {{s2}} ÷ {{n2}}| руб.

    ### Идея
    Цены за одну штуку сравнивают напрямую: делят каждую стоимость на своё количество.

    ### Шаги
    1. Первое предложение: {{s1}} ÷ {{n1}} = {{s1}} ÷ {{n1|pl:рубль,рубля,рублей}} за штуку.
    2. Второе: {{s2}} ÷ {{n2}} = {{s2}} ÷ {{n2|pl:рубль,рубля,рублей}} за штуку.
    3. Разность: |{{s1}} ÷ {{n1}} − {{s2}} ÷ {{n2}}| = |{{s1}} ÷ {{n1}} − {{s2}} ÷ {{n2}}| руб.

    ### Проверка
    {{s1}} ÷ {{n1}} × {{n1}} = {{s1}} и {{s2}} ÷ {{n2}} × {{n2}} = {{s2}} — обе стоимости восстанавливаются.

    ### Типичная ошибка
    E-model-rate-basic-cost-times-count: делить не на количество, а умножать стоимость на количество ({{s1}} × {{n1}}).
  feedback:
    correct: 'Верно: разность цен за штуку найдена.'
    wrong:
      what: Разность посчитана неверно.
      why: Возможно, вычитали общие стоимости.
      fix: Делите каждую стоимость на своё количество, затем вычитайте.
      next: 'Проверьте: обе цены за штуку должны быть целыми числами.'
  errors:
  - E-model-rate-basic-cost-times-count
  variants:
  - params:
      n1: 3
      s1: 30
      n2: 4
      s2: 36
    answer: 1
    solution: |
      ### Ответ
      1 руб.

      ### Идея
      Цены за одну штуку сравнивают напрямую: делят каждую стоимость на своё количество.

      ### Шаги
      1. Первое предложение: 30 ÷ 3 = 10 руб. за штуку.
      2. Второе: 36 ÷ 4 = 9 руб. за штуку.
      3. Разность: |10 − 9| = 1 руб.

      ### Проверка
      10 × 3 = 30 и 9 × 4 = 36 — обе стоимости восстанавливаются.

      ### Типичная ошибка
      E-model-rate-basic-cost-times-count: делить не на количество, а умножать стоимость на количество (30 × 3).
  - params:
      n1: 2
      s1: 26
      n2: 5
      s2: 45
    answer: 4
    solution: |
      ### Ответ
      4 руб.

      ### Идея
      Цены за одну штуку сравнивают напрямую: делят каждую стоимость на своё количество.

      ### Шаги
      1. Первое предложение: 26 ÷ 2 = 13 руб. за штуку.
      2. Второе: 45 ÷ 5 = 9 руб. за штуку.
      3. Разность: |13 − 9| = 4 руб.

      ### Проверка
      13 × 2 = 26 и 9 × 5 = 45 — обе стоимости восстанавливаются.

      ### Типичная ошибка
      E-model-rate-basic-cost-times-count: делить не на количество, а умножать стоимость на количество (26 × 2).
  - params:
      n1: 4
      s1: 44
      n2: 3
      s2: 39
    answer: 2
    solution: |
      ### Ответ
      2 руб.

      ### Идея
      Цены за одну штуку сравнивают напрямую: делят каждую стоимость на своё количество.

      ### Шаги
      1. Первое предложение: 44 ÷ 4 = 11 руб. за штуку.
      2. Второе: 39 ÷ 3 = 13 руб. за штуку.
      3. Разность: |11 − 13| = 2 руб.

      ### Проверка
      11 × 4 = 44 и 13 × 3 = 39 — обе стоимости восстанавливаются.

      ### Типичная ошибка
      E-model-rate-basic-cost-times-count: делить не на количество, а умножать стоимость на количество (44 × 4).
