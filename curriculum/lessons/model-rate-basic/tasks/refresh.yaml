# Интервальное повторение (STANDARD.md §8): 5 задач, у каждой 3 параметрических варианта.
# Числа не повторяют практику, финал и контрольную (правило 172).
tasks:
- id: R-01
  type: number
  role: refresh
  purpose: procedure
  level: 2
  outcome: LO-02
  sections:
  - T01
  minutes: 3
  prompt: Курьер проехал {{t|pl:час,часа,часов}} со скоростью {{v}} км/ч, а потом прошёл ещё {{d}} км.
    Сколько километров всего?
  answer: 84
  hints:
  - Путь состоит из поездки и добавки.
  - Сначала умножьте скорость на время.
  - К поездке прибавьте оставшиеся {{d}} км.
  solution: |
    ### Ответ
    ({{v}} × {{t}} + {{d}}) км

    ### Идея
    Путь складывается из двух отрезков: основного и добавки; сначала считают каждый отрезок.

    ### Шаги
    1. Основной отрезок: {{v}} × {{t}} = ({{v}} × {{t}}) км.
    2. Добавка — ещё {{d}} км.
    3. Всего: ({{v}} × {{t}}) + {{d}} = ({{v}} × {{t}} + {{d}}) км.

    ### Проверка
    ({{v}} × {{t}} + {{d}}) − {{d}} = ({{v}} × {{t}}) км = {{v}} × {{t}} — основной отрезок восстанавливается.

    ### Типичная ошибка
    E-model-rate-basic-first-part: оставить только основной отрезок (({{v}} × {{t}}) км) и не прибавить {{d}} км.
  feedback:
    correct: 'Верно: оба отрезка пути посчитаны и сложены.'
    wrong:
      what: Общий путь посчитан неверно.
      why: Возможно, добавка не прибавлена.
      fix: Посчитайте поездку произведением и прибавьте пешую часть.
      next: Вычтите из ответа {{d}} — должен остаться путь поездки.
    misconceptions:
    - id: E-model-rate-basic-first-part
      when:
        expr: v * t
      message: Похоже, учтён только путь поездки.
  errors:
  - E-model-rate-basic-first-part
  variants:
  - params:
      v: 22
      t: 3
      d: 18
    answer: 84
    solution: |
      ### Ответ
      84 км

      ### Идея
      Путь складывается из двух отрезков: основного и добавки; сначала считают каждый отрезок.

      ### Шаги
      1. Основной отрезок: 22 × 3 = 66 км.
      2. Добавка — ещё 18 км.
      3. Всего: 66 + 18 = 84 км.

      ### Проверка
      84 − 18 = 66 км = 22 × 3 — основной отрезок восстанавливается.

      ### Типичная ошибка
      E-model-rate-basic-first-part: оставить только основной отрезок (66 км) и не прибавить 18 км.
  - params:
      v: 36
      t: 2
      d: 28
    answer: 100
    solution: |
      ### Ответ
      100 км

      ### Идея
      Путь складывается из двух отрезков: основного и добавки; сначала считают каждый отрезок.

      ### Шаги
      1. Основной отрезок: 36 × 2 = 72 км.
      2. Добавка — ещё 28 км.
      3. Всего: 72 + 28 = 100 км.

      ### Проверка
      100 − 28 = 72 км = 36 × 2 — основной отрезок восстанавливается.

      ### Типичная ошибка
      E-model-rate-basic-first-part: оставить только основной отрезок (72 км) и не прибавить 28 км.
  - params:
      v: 18
      t: 5
      d: 25
    answer: 115
    solution: |
      ### Ответ
      115 км

      ### Идея
      Путь складывается из двух отрезков: основного и добавки; сначала считают каждый отрезок.

      ### Шаги
      1. Основной отрезок: 18 × 5 = 90 км.
      2. Добавка — ещё 25 км.
      3. Всего: 90 + 25 = 115 км.

      ### Проверка
      115 − 25 = 90 км = 18 × 5 — основной отрезок восстанавливается.

      ### Типичная ошибка
      E-model-rate-basic-first-part: оставить только основной отрезок (90 км) и не прибавить 25 км.
- id: R-02
  type: number
  role: refresh
  purpose: procedure
  level: 2
  outcome: LO-02
  sections:
  - T02
  minutes: 3
  prompt: За {{n|pl:штука,штуки,штук}} заплатили {{s|pl:рубль,рубля,рублей}}. Сколько заплатят за {{n2|pl:штука,штуки,штук}}
    по той же цене?
  answer: 48
  hints:
  - Нужна цена одной штуки.
  - Разделите {{s}} на {{n}}.
  - Найденную цену умножьте на {{n2}}.
  solution: |
    ### Ответ
    (({{s}} ÷ {{n}}) × {{n2}}) руб.

    ### Идея
    Сначала находят цену за одну штуку — промежуточный результат, потом умножают на новое количество.

    ### Шаги
    1. Цена за штуку: {{s}} ÷ {{n}} = ({{s}} ÷ {{n}}) руб.
    2. Штук в новой покупке: {{n2}}.
    3. Стоимость: ({{s}} ÷ {{n}}) × {{n2}} = (({{s}} ÷ {{n}}) × {{n2}}) руб.

    ### Проверка
    (({{s}} ÷ {{n}}) × {{n2}}) ÷ {{n2}} = ({{s}} ÷ {{n}}) руб. — та же цена за штуку.

    ### Типичная ошибка
    E-model-rate-basic-cost-times-count: умножить стоимость на количество ({{s}} × {{n2}} = ({{s}} × {{n2}})) без деления на {{n}}.
  feedback:
    correct: 'Верно: цена штуки найдена и перенесена на новое количество.'
    wrong:
      what: Стоимость новой покупки неверна.
      why: Возможно, стоимость умножили на количество без деления.
      fix: Деление даёт цену штуки — только потом умножение.
      next: 'Проверьте: ответ ÷ {{n2}} должен вернуть цену штуки.'
    misconceptions:
    - id: E-model-rate-basic-cost-times-count
      when:
        expr: s * n2
      message: Похоже, старую стоимость умножили на количество.
  errors:
  - E-model-rate-basic-cost-times-count
  variants:
  - params:
      n: 4
      s: 32
      n2: 6
    answer: 48
    solution: |
      ### Ответ
      48 руб.

      ### Идея
      Сначала находят цену за одну штуку — промежуточный результат, потом умножают на новое количество.

      ### Шаги
      1. Цена за штуку: 32 ÷ 4 = 8 руб.
      2. Штук в новой покупке: 6.
      3. Стоимость: 8 × 6 = 48 руб.

      ### Проверка
      48 ÷ 6 = 8 руб. — та же цена за штуку.

      ### Типичная ошибка
      E-model-rate-basic-cost-times-count: умножить стоимость на количество (32 × 6 = 192) без деления на 4.
  - params:
      n: 5
      s: 50
      n2: 7
    answer: 70
    solution: |
      ### Ответ
      70 руб.

      ### Идея
      Сначала находят цену за одну штуку — промежуточный результат, потом умножают на новое количество.

      ### Шаги
      1. Цена за штуку: 50 ÷ 5 = 10 руб.
      2. Штук в новой покупке: 7.
      3. Стоимость: 10 × 7 = 70 руб.

      ### Проверка
      70 ÷ 7 = 10 руб. — та же цена за штуку.

      ### Типичная ошибка
      E-model-rate-basic-cost-times-count: умножить стоимость на количество (50 × 7 = 350) без деления на 5.
  - params:
      n: 3
      s: 33
      n2: 8
    answer: 88
    solution: |
      ### Ответ
      88 руб.

      ### Идея
      Сначала находят цену за одну штуку — промежуточный результат, потом умножают на новое количество.

      ### Шаги
      1. Цена за штуку: 33 ÷ 3 = 11 руб.
      2. Штук в новой покупке: 8.
      3. Стоимость: 11 × 8 = 88 руб.

      ### Проверка
      88 ÷ 8 = 11 руб. — та же цена за штуку.

      ### Типичная ошибка
      E-model-rate-basic-cost-times-count: умножить стоимость на количество (33 × 8 = 264) без деления на 3.
- id: R-03
  type: number
  role: refresh
  purpose: procedure
  level: 2
  outcome: LO-02
  sections:
  - T03
  minutes: 3
  prompt: За {{t|pl:час,часа,часов}} станок сделал {{w|pl:деталь,детали,деталей}}. Сколько деталей он
    сделает за {{t2|pl:час,часа,часов}} с той же производительностью?
  answer: 63
  hints:
  - Производительность станка не меняется.
  - Сначала разделите {{w}} на {{t}} — это объём за час.
  - Умножьте часовой объём на {{t2}}.
  solution: |
    ### Ответ
    (({{w}} ÷ {{t}}) × {{t2}}) дет.

    ### Идея
    Сначала находят производительность за час, потом переносят её на другое время.

    ### Шаги
    1. За час делают: {{w}} ÷ {{t}} = ({{w}} ÷ {{t}}) дет.
    2. Часов станет {{t2}}: ({{w}} ÷ {{t}}) × {{t2}} = (({{w}} ÷ {{t}}) × {{t2}}) дет.

    ### Проверка
    (({{w}} ÷ {{t}}) × {{t2}}) ÷ {{t2}} = ({{w}} ÷ {{t}}) дет/ч — производительность та же.

    ### Типичная ошибка
    E-model-rate-basic-rate-mul: умножить объём на время ({{w}} × {{t2}} = ({{w}} × {{t2}})) без деления на прежние часы.
  feedback:
    correct: 'Верно: производительность перенесена на новое время.'
    wrong:
      what: Объём за новое время посчитан неверно.
      why: Возможно, прежний объём умножили на новое время.
      fix: Сначала деление на прежние часы, потом умножение на новые.
      next: 'Проверьте: ответ ÷ {{t2}} должен вернуть объём за час.'
  errors:
  - E-model-rate-basic-rate-mul
  variants:
  - params:
      w: 36
      t: 4
      t2: 7
    answer: 63
    solution: |
      ### Ответ
      63 дет.

      ### Идея
      Сначала находят производительность за час, потом переносят её на другое время.

      ### Шаги
      1. За час делают: 36 ÷ 4 = 9 дет.
      2. Часов станет 7: 9 × 7 = 63 дет.

      ### Проверка
      63 ÷ 7 = 9 дет/ч — производительность та же.

      ### Типичная ошибка
      E-model-rate-basic-rate-mul: умножить объём на время (36 × 7 = 252) без деления на прежние часы.
  - params:
      w: 48
      t: 6
      t2: 5
    answer: 40
    solution: |
      ### Ответ
      40 дет.

      ### Идея
      Сначала находят производительность за час, потом переносят её на другое время.

      ### Шаги
      1. За час делают: 48 ÷ 6 = 8 дет.
      2. Часов станет 5: 8 × 5 = 40 дет.

      ### Проверка
      40 ÷ 5 = 8 дет/ч — производительность та же.

      ### Типичная ошибка
      E-model-rate-basic-rate-mul: умножить объём на время (48 × 5 = 240) без деления на прежние часы.
  - params:
      w: 55
      t: 5
      t2: 9
    answer: 99
    solution: |
      ### Ответ
      99 дет.

      ### Идея
      Сначала находят производительность за час, потом переносят её на другое время.

      ### Шаги
      1. За час делают: 55 ÷ 5 = 11 дет.
      2. Часов станет 9: 11 × 9 = 99 дет.

      ### Проверка
      99 ÷ 9 = 11 дет/ч — производительность та же.

      ### Типичная ошибка
