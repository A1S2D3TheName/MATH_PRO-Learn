      66 дет.

      ### Идея
      За каждый час работы добавляется одинаковый объём, поэтому производительность умножают на часы.

      ### Шаги
      1. За час делают 22 дет.
      2. Часов 3: объём равен 22 × 3.
      3. Вычисляем произведение: 22 × 3 = 66 дет.

      ### Проверка
      66 ÷ 3 = 22 дет/ч — производительность из условия.

      ### Типичная ошибка
      E-model-rate-basic-rate-add: сложить производительность и время (22 + 3 = 25) — получится не объём работы.
