    - T01
    minutes: 2
    prompt: Путь 96 км, скорость 12 км/ч. За сколько часов проедут этот путь?
    answer: 8
    points: 1
    hints:
    - Время — это число часовых отрезков в пути.
    - Отрезок за час — 12 км.
    - Разделите 96 на 12.
    solution: |
      ### Ответ
      8 ч

      ### Идея
      Время показывает, сколько часовых отрезков по 12 км помещается в пути 96 км.

      ### Шаги
      1. Отрезок за один час — 12 км.
      2. Делим путь на скорость: 96 ÷ 12.
      3. Получаем 8 ч.

      ### Проверка
      12 × 8 = 96 км — путь из условия.

      ### Типичная ошибка
      E-model-rate-basic-time-mul: умножить путь на скорость (96 × 12 = 1152) — время получится слишком большим.
    feedback:
      correct: 'Верно: 96 км делят на 12 км/ч — получается 8 ч.'
      wrong:
        what: Время посчитано неверно.
        why: Возможно, путь умножили на скорость.
        fix: Время — частное пути и скорости.
        next: 'Проверьте умножением: 12 × ответ должно вернуть 96.'
    errors:
    - E-model-rate-basic-time-mul
