  - id: EA-12
    type: number
    role: exam
    purpose: transfer
    level: 4
    outcome: LO-02
    sections:
    - T02
    - T04
    minutes: 5
    prompt: 'Первое предложение: 5 штук за 75 руб. Второе: 4 штуки за 48 руб. На сколько рублей дешевле
      обойдутся 10 штук у более выгодного предложения?'
    answer: 30
    points: 1
    hints:
    - Сравнивать нужно цены за одну штуку.
    - 'Посчитайте обе цены: 75 ÷ 5 и 48 ÷ 4.'
    - Разность цен штук умножьте на 10.
    solution: |
      ### Ответ
      30 руб.

      ### Идея
      Выгоду считают на одну штуку, затем умножают разность цен на число штук.

      ### Шаги
      1. Цена за штуку первого предложения: 75 ÷ 5 = 15 руб.
      2. Цена за штуку второго: 48 ÷ 4 = 12 руб.
      3. Разность цен за штуку: |15 − 12| = 3 руб.
      4. Экономия на 10 штук: 3 × 10 = 30 руб.

      ### Проверка
      15 × 10 − 12 × 10 = 30 руб. — та же разность другим способом.

      ### Типичная ошибка
      E-model-rate-basic-cost-times-count: цену штуки считают умножением стоимости на количество (75 × 5) вместо деления.
    feedback:
      correct: 'Верно: экономия на 10 штук найдена через цены за штуку.'
