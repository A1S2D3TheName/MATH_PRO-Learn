# Две контрольные (STANDARD.md §8): по 12 задач, сопоставимое покрытие outcomes и подтем,
# часы и подтемы сбалансированы; числа не повторяют практику и примеры (правило 172).
variants:
- id: A
  tasks:
  - id: EA-01
    type: number
    role: exam
    purpose: procedure
    level: 1
    outcome: LO-01
    sections:
    - T01
    minutes: 2
    prompt: Автобус идёт 4 часа со скоростью 75 км/ч. Сколько километров проедет автобус?
    answer: 300
    points: 1
    hints:
    - Путь за час равен скорости автобуса.
    - Часовых отрезков четыре.
    - Умножьте 75 на 4.
    solution: |
      ### Ответ
      300 км

      ### Идея
      За каждый час проходят одинаковый отрезок пути, поэтому скорость умножается на число часов.

      ### Шаги
      1. За час проходят 75 км.
      2. Часов 4: путь равен 75 × 4.
      3. Вычисляем произведение: 75 × 4 = 300 км.

      ### Проверка
      300 ÷ 4 = 75 км/ч — скорость из условия.

      ### Типичная ошибка
      E-model-rate-basic-speed-add: сложить скорость и время (75 + 4 = 79 км) — получится другой отрезок.
    feedback:
      correct: 'Верно: путь автобуса найден умножением скорости на время.'
      wrong:
        what: Путь посчитан неверно.
        why: Возможно, скорость и время сложили.
        fix: Путь — произведение скорости и времени.
        next: 'Проверьте делением: путь ÷ 4 должно вернуть 75.'
    errors:
    - E-model-rate-basic-speed-add
    - E-model-rate-basic-speed-div
  - id: EA-02
    type: number
    role: exam
    purpose: procedure
    level: 1
    outcome: LO-01
    sections:
    - T02
    minutes: 2
    prompt: Билет стоит 17 руб. Сколько заплатят за 5 билетов?
    answer: 85
    points: 1
    hints:
    - Каждый билет стоит одинаково.
    - Платёж за билет повторяется пять раз.
    - Умножьте 17 на 5.
    solution: |
      ### Ответ
      85 руб.

      ### Идея
      За каждую штуку платят одинаковую цену, поэтому цену умножают на количество штук.

      ### Шаги
      1. Цена одной штуки — 17 руб.
      2. Штук 5: стоимость равна 17 × 5.
      3. Вычисляем произведение: 17 × 5 = 85 руб.

      ### Проверка
      85 ÷ 5 = 17 руб. — цена из условия.

      ### Типичная ошибка
      E-model-rate-basic-price-add: сложить цену и количество (17 + 5 = 22 руб.) — получится не стоимость.
    feedback:
      correct: 'Верно: стоимость билетов получена умножением.'
      wrong:
        what: Стоимость посчитана неверно.
        why: Возможно, цену и количество сложили.
        fix: Стоимость — произведение цены и количества.
        next: 'Проверьте делением: ответ ÷ 5 должно вернуть 17.'
    errors:
    - E-model-rate-basic-price-add
