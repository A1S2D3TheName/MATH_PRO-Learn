    - s2
    - s3
    - s4
    points: 1
    hints:
    - Условие записывают до вычислений.
    - Действие выбирают по смыслу связи цены, количества и стоимости.
    - Проверка обратным действием завершает решение.
    solution: |
      ### Ответ
      Порядок: записать условие → выбрать действие → вычислить → проверить.

      ### Идея
      План решения одинаков для всех задач на три величины.

      ### Шаги
      1. Сначала данные и искомое.
      2. Действие выбирают по связи величин.
      3. Вычисление даёт ответ.
      4. Обратное действие проверяет ответ.

      ### Проверка
      Умножение проверяют делением, деление — умножением.

