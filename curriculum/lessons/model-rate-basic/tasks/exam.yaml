  - id: EA-10
    type: number
    role: exam
    purpose: transfer
    level: 3
    outcome: LO-01
    sections:
    - T01
    - T02
    minutes: 4
    prompt: Тетрадь стоит 23 руб., а папка — в 3 раза дороже тетради. Сколько стоят тетрадь и папка вместе?
    answer: 92
    points: 1
    hints:
    - «В 3 раза дороже» — это умножение.
    - Сначала посчитайте стоимость папки.
    - Сложите стоимость тетради и папки.
    solution: |
      ### Ответ
      92 руб.

      ### Идея
      Вторая покупка дороже в 3 раза: сначала её стоимость, потом общая сумма.

      ### Шаги
      1. Вторая покупка: 23 × 3 = 69 руб.
      2. Обе покупки: 23 + 69 = 92 руб.

      ### Проверка
      92 − 23 = 69 руб., и 69 ÷ 23 = 3 — кратность восстанавливается.

      ### Типичная ошибка
      E-model-rate-basic-price-add: сложить цену и кратность (23 + 3) вместо умножения.
    feedback:
      correct: 'Верно: сначала найдена папка, потом общая сумма.'
      wrong:
        what: Стоимость обеих покупок неверна.
        why: Возможно, кратность сложили с ценой.
        fix: «В 3 раза» — умножение; затем сложение.
        next: 'Проверьте: стоимость папки делится на 3 без остатка.'
    errors:
    - E-model-rate-basic-price-add
