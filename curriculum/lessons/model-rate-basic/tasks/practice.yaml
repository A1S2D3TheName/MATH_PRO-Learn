- id: P-08
  type: number
  role: supported
  purpose: procedure
  level: 1
  outcome: LO-02
  sections:
  - T01
  minutes: 2
  prompt: Путь {{s}} км, скорость {{v}} км/ч. За сколько часов проедут этот путь?
  answer: 6
  hints:
  - Время показывает, сколько часовых отрезков помещается в пути.
  - Длина одного отрезка — {{v}} км.
  - 'Разделите {{s}} на {{v}}: получится число часов.'
  solution: |
    ### Ответ
    ({{s}} ÷ {{v}}) ч

    ### Идея
    Время показывает, сколько часовых отрезков по {{v}} км помещается в пути {{s}} км.

    ### Шаги
    1. Отрезок за один час — {{v}} км.
    2. Делим путь на скорость: {{s}} ÷ {{v}}.
    3. Получаем ({{s}} ÷ {{v}}) ч.

    ### Проверка
    {{v}} × ({{s}} ÷ {{v}}) = {{s}} км — путь из условия.

    ### Типичная ошибка
    E-model-rate-basic-time-mul: умножить путь на скорость ({{s}} × {{v}} = ({{s}} × {{v}})) — время получится слишком большим.
  feedback:
    correct: 'Верно: время найдено делением пути на скорость.'
    wrong:
      what: Время посчитано неверно.
      why: Возможно, путь умножили на скорость.
      fix: 'Время — это частное пути и скорости: запишите деление.'
      next: 'Проверьте: скорость, умноженная на найденное время, вернёт путь.'
    misconceptions:
    - id: E-model-rate-basic-time-mul
      when:
        expr: s * v
      message: Похоже, путь умножили на скорость.
  errors:
  - E-model-rate-basic-time-mul
  variants:
  - params:
      s: 48
      v: 8
    answer: 6
    solution: |
      ### Ответ
      6 ч

      ### Идея
      Время показывает, сколько часовых отрезков по 8 км помещается в пути 48 км.

      ### Шаги
      1. Отрезок за один час — 8 км.
      2. Делим путь на скорость: 48 ÷ 8.
      3. Получаем 6 ч.

      ### Проверка
      8 × 6 = 48 км — путь из условия.

      ### Типичная ошибка
      E-model-rate-basic-time-mul: умножить путь на скорость (48 × 8 = 384) — время получится слишком большим.
  - params:
      s: 72
      v: 9
    answer: 8
    solution: |
      ### Ответ
      8 ч

      ### Идея
      Время показывает, сколько часовых отрезков по 9 км помещается в пути 72 км.

      ### Шаги
      1. Отрезок за один час — 9 км.
      2. Делим путь на скорость: 72 ÷ 9.
      3. Получаем 8 ч.

      ### Проверка
      9 × 8 = 72 км — путь из условия.

      ### Типичная ошибка
      E-model-rate-basic-time-mul: умножить путь на скорость (72 × 9 = 648) — время получится слишком большим.
