      60 км

      ### Идея
      Считают оба пути при одном и том же времени и берут их разность.

      ### Шаги
      1. Путь при 50 км/ч: 50 × 4 = 200 км.
      2. Путь при 35 км/ч: 35 × 4 = 140 км.
      3. Разность: 200 − 140 = 60 км.

      ### Проверка
      140 + 60 = 200 км — больший путь восстанавливается.

      ### Типичная ошибка
      E-model-rate-basic-first-part: посчитать только один путь и не вычесть второй.
