  - T04
  minutes: 4
  prompt: Расставьте шаги сравнения двух предложений в том порядке, в котором их выполняют.
  answer:
  - step-1
  - step-2
  - step-3
  - step-4
  hints:
  - Сравнение начинается с записи условий, а не с деления.
  - Цена за штуку — промежуточный результат, его считают после таблицы.
  - Вывод делают после сравнения найденных цен.
  solution: |
    ### Ответ
    Порядок: выписать условия → найти цены за штуку → сравнить цены → сделать вывод.

    ### Идея
    Сравнение идёт по промежуточному результату — цене за штуку.

    ### Шаги
    1. Условия обоих предложений фиксируют в таблице.
    2. Для каждого предложения считают стоимость одной штуки.
    3. Найденные цены сравнивают между собой.
    4. Меньшая цена штуки — более выгодное предложение.

    ### Проверка
    Обратный ход: умножив цену штуки на количество, получаем исходные стоимости предложений.

    ### Типичная ошибка
    E-model-rate-basic-price-add: сделать вывод по общей стоимости без деления на количество.
  feedback:
    correct: 'Верно: шаги сравнения расставлены по порядку.'
    wrong:
      what: Порядок шагов нарушен.
      why: Возможно, вывод сделан до нахождения цен штук.
      fix: Цены за штуку считаются после записи условий, вывод — после сравнения.
      next: Проверьте, что деление идёт после таблицы, а не до неё.
  errors:
  - E-model-rate-basic-price-add
  items:
  - id: step-1
    text: Выписать условия обоих предложений в таблицу
  - id: step-2
    text: Найти цену за одну штуку у каждого предложения
  - id: step-3
    text: Сравнить найденные цены за штуку
  - id: step-4
    text: Сделать вывод, какое предложение выгоднее
- id: P-26
  type: number
  role: independent
  purpose: transfer
  level: 4
  outcome: LO-02
  sections:
  - T01
  minutes: 5
  prompt: При скорости {{v}} км/ч за {{t|pl:час,часа,часов}} проходят один путь, а при скорости {{v2}}
    км/ч за то же время — другой. На сколько километров первый путь длиннее?
  answer: 60
  hints:
  - Оба движения длятся одно и то же время {{t|pl:час,часа,часов}}.
  - 'Посчитайте оба пути: {{v}} × {{t}} и {{v2}} × {{t}}.'
  - Из большего пути вычтите меньший.
  solution: |
    ### Ответ
    ({{v}} × {{t}} − {{v2}} × {{t}}) км

    ### Идея
    Считают оба пути при одном и том же времени и берут их разность.

    ### Шаги
    1. Путь при {{v}} км/ч: {{v}} × {{t}} = ({{v}} × {{t}}) км.
    2. Путь при {{v2}} км/ч: {{v2}} × {{t}} = ({{v2}} × {{t}}) км.
    3. Разность: ({{v}} × {{t}}) − ({{v2}} × {{t}}) = ({{v}} × {{t}} − {{v2}} × {{t}}) км.

    ### Проверка
    ({{v2}} × {{t}}) + ({{v}} × {{t}} − {{v2}} × {{t}}) = ({{v}} × {{t}}) км — больший путь восстанавливается.

    ### Типичная ошибка
    E-model-rate-basic-first-part: посчитать только один путь и не вычесть второй.
  feedback:
    correct: 'Верно: оба пути посчитаны и разность найдена.'
    wrong:
      what: Разность путей посчитана неверно.
      why: Возможно, посчитан только один путь.
      fix: 'Нужны два произведения и их разность: время у обоих движений одно.'
      next: 'Проверьте: меньший путь плюс ответ должен дать больший.'
    misconceptions:
    - id: E-model-rate-basic-first-part
      when:
        expr: v * t
      message: Похоже, оставлен только больший путь.
  errors:
  - E-model-rate-basic-first-part
  variants:
  - params:
      v: 50
      v2: 35
      t: 4
    answer: 60
    solution: |
