- id: P-04
  type: number
  role: supported
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T01
  minutes: 2
  prompt: Машина едет {{t|pl:час,часа,часов}} со скоростью {{v}} км/ч. Сколько километров проедет машина?
  answer: 300
  hints:
  - Путь за час равен скорости в км/ч.
  - Часовые отрезки одинаковы, их столько, сколько часов.
  - Умножьте {{v}} на {{t}} и запишите произведение.
  solution: |
    ### Ответ
    ({{v}} × {{t}}) км

    ### Идея
    За каждый час проходят одинаковый отрезок пути, поэтому скорость умножается на число часов.

    ### Шаги
    1. За час проходят {{v}} км.
    2. Часов {{t}}: путь равен {{v}} × {{t}}.
    3. Вычисляем произведение: {{v}} × {{t}} = ({{v}} × {{t}}) км.

    ### Проверка
    ({{v}} × {{t}}) ÷ {{t}} = {{v}} км/ч — скорость из условия.

    ### Типичная ошибка
    E-model-rate-basic-speed-add: сложить скорость и время ({{v}} + {{t}} = ({{v}} + {{t}}) км) — получится другой отрезок.
  feedback:
    correct: 'Верно: путь собран из одинаковых часовых отрезков.'
    wrong:
      what: Путь посчитан неверно.
      why: Возможно, скорость и время сложили вместо умножения.
      fix: Перепишите действие «скорость × время» и вычислите заново.
      next: 'Проверьте ответ делением: путь ÷ время должно дать скорость.'
    misconceptions:
    - id: E-model-rate-basic-speed-add
      when:
        expr: v + t
      message: Похоже, скорость и время сложили.
    - id: E-model-rate-basic-speed-div
      when:
        expr: v / t
      message: Похоже, скорость разделили на время.
  errors:
  - E-model-rate-basic-speed-add
  - E-model-rate-basic-speed-div
  variants:
  - params:
      v: 60
      t: 5
    answer: 300
    solution: |
      ### Ответ
      300 км

      ### Идея
      За каждый час проходят одинаковый отрезок пути, поэтому скорость умножается на число часов.

      ### Шаги
      1. За час проходят 60 км.
      2. Часов 5: путь равен 60 × 5.
      3. Вычисляем произведение: 60 × 5 = 300 км.

      ### Проверка
      300 ÷ 5 = 60 км/ч — скорость из условия.

      ### Типичная ошибка
      E-model-rate-basic-speed-add: сложить скорость и время (60 + 5 = 65 км) — получится другой отрезок.
  - params:
      v: 45
      t: 4
    answer: 180
    solution: |
      ### Ответ
      180 км

      ### Идея
      За каждый час проходят одинаковый отрезок пути, поэтому скорость умножается на число часов.

      ### Шаги
      1. За час проходят 45 км.
      2. Часов 4: путь равен 45 × 4.
      3. Вычисляем произведение: 45 × 4 = 180 км.

      ### Проверка
      180 ÷ 4 = 45 км/ч — скорость из условия.

      ### Типичная ошибка
      E-model-rate-basic-speed-add: сложить скорость и время (45 + 4 = 49 км) — получится другой отрезок.
