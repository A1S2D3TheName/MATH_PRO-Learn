# Сквозной сюжет практики — три связи величин: движение, покупка, работа.
tasks:
- id: P-01
  type: table-fill
  role: warmup
  purpose: procedure
  level: 0
  outcome: LO-01
  sections:
  - T04
  minutes: 1
  prompt: 'Заполните таблицу данными условия: скорость 60 км/ч, время 5 ч. Путь пока неизвестен.'
  answer:
  - r: 0
    c: 1
    value: 60
  - r: 1
    c: 1
    value: 5
  shape:
  - 3
  - 2
  hints:
  - Каждая величина условия записывается в свою строку.
  - Скорость измеряется в км/ч, время — в часах.
  - Впишите 60 в строку скорости, а 5 — в строку времени.
  solution: |
    ### Ответ
    В строках стоят 60 км/ч и 5 ч.

    ### Идея
    Данные условия переносят в строки таблицы: каждая величина — в свою строку.

    ### Шаги
    1. Скорость и время записаны в условии.
    2. Каждое число встаёт в строку своей величины.
    3. Пропуск строки пути — это искомое, его пока не заполняем.

    ### Проверка
    Строка пути пуста: искомое не выдаётся за данное.

    ### Типичная ошибка
    E-model-rate-basic-speed-add: записать в строку пути сумму данных вместо пропуска.
  feedback:
    correct: 'Верно: данные условия стоят в своих строках.'
    wrong:
      what: Таблица заполнена неверно.
      why: Возможно, величины попали в чужие строки.
      fix: 'Перепишите: скорость 60 км/ч — в первую строку, время 5 ч — во вторую.'
      next: Проследите, чтобы единицы совпадали со строкой.
  table:
    caption: Условие задачи на движение
    columns:
    - Величина
    - Значение
    rows:
    - - Скорость
      - null
    - - Время
      - null
    - - Путь
      - null
