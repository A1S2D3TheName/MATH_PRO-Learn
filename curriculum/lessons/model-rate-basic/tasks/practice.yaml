  minutes: 1
  prompt: 'Заполните таблицу данными условия: цена 25 руб., количество 4 шт. Стоимость пока неизвестна.'
  answer:
  - r: 0
    c: 1
    value: 25
  - r: 1
    c: 1
    value: 4
  shape:
  - 3
  - 2
  hints:
  - Данные покупки раскладываются по строкам величин.
  - Цена — стоимость одной штуки, количество — сколько штук.
  - Впишите 25 в строку цены, а 4 — в строку количества.
  solution: |
    ### Ответ
    В строках стоят 25 руб. и 4 шт.

    ### Идея
    Данные покупки переносят в строки таблицы: цена — в строку цены, количество — в строку количества.

    ### Шаги
    1. Цена 25 руб. — стоимость одной штуки: пишем в строку «Цена».
    2. Количество 4 шт. — пишем в строку «Количество».
    3. Строка «Стоимость» остаётся пустой: это искомое.

    ### Проверка
    В строках стоят те же числа, что в условии: 25 руб. и 4 шт.; пустой остаётся только строка стоимости.

    ### Типичная ошибка
    E-model-rate-basic-price-add: записать в строку стоимости сумму цены и количества (25 + 4) вместо пропуска.

  feedback:
    correct: 'Верно: цена и количество записаны в свои строки.'
    wrong:
      what: Строки таблицы заполнены неверно.
      why: Возможно, цена и количество перепутаны местами.
      fix: Цена — всегда стоимость одной штуки, количество — всегда число штук.
      next: Сверьте подписи строк с условием.
