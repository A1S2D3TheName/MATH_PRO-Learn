  minutes: 2
  prompt: Один билет стоит {{c|pl:рубль,рубля,рублей}}. Сколько заплатят за {{n|pl:билет,билета,билетов}}?
  answer: 100
  hints:
  - Стоимость одного билета уже известна.
  - За каждый билет платят одинаково, значит, платежей столько, сколько билетов.
  - 'Умножьте {{c}} на {{n}}: получится стоимость всех билетов.'
  solution: |
    ### Ответ
    ({{c}} × {{n}}) руб.

    ### Идея
    За каждую штуку платят одинаковую цену, поэтому цену умножают на количество штук.

    ### Шаги
    1. Цена одной штуки — {{c|pl:рубль,рубля,рублей}}
    2. Штук {{n}}: стоимость равна {{c}} × {{n}}.
    3. Вычисляем произведение: {{c}} × {{n}} = ({{c}} × {{n}}) руб.

    ### Проверка
    ({{c}} × {{n}}) ÷ {{n}} = {{c|pl:рубль,рубля,рублей}} — цена из условия.

    ### Типичная ошибка
    E-model-rate-basic-price-add: сложить цену и количество ({{c}} + {{n}} = ({{c}} + {{n}}) руб.) — получится не стоимость.
  feedback:
    correct: 'Верно: стоимость получена умножением цены на количество.'
    wrong:
      what: Стоимость посчитана неверно.
      why: Возможно, цену и количество сложили.
      fix: Запишите «цена × количество» и пересчитайте.
      next: 'Разделите ответ на число билетов: должна получиться цена одного.'
    misconceptions:
    - id: E-model-rate-basic-price-add
      when:
        expr: c + n
      message: Похоже, цену и количество сложили.
  errors:
  - E-model-rate-basic-price-add
  variants:
  - params:
      c: 25
      n: 4
    answer: 100
    solution: |
      ### Ответ
      100 руб.

      ### Идея
      За каждую штуку платят одинаковую цену, поэтому цену умножают на количество штук.

      ### Шаги
      1. Цена одной штуки — 25 руб.
      2. Штук 4: стоимость равна 25 × 4.
      3. Вычисляем произведение: 25 × 4 = 100 руб.

      ### Проверка
      100 ÷ 4 = 25 руб. — цена из условия.

      ### Типичная ошибка
      E-model-rate-basic-price-add: сложить цену и количество (25 + 4 = 29 руб.) — получится не стоимость.
  - params:
      c: 15
      n: 6
    answer: 90
    solution: |
      ### Ответ
      90 руб.

      ### Идея
      За каждую штуку платят одинаковую цену, поэтому цену умножают на количество штук.

      ### Шаги
      1. Цена одной штуки — 15 руб.
      2. Штук 6: стоимость равна 15 × 6.
      3. Вычисляем произведение: 15 × 6 = 90 руб.

