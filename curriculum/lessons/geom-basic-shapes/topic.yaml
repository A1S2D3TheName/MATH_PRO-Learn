# Паспорт темы (STANDARD.md §3). Поля section/stage/hours/grade/prerequisites/scope скопированы из
# tree.yaml дословно (правило 6).
#
# · Правило 152: единственный прямой пререквизит `num-line` назван в T01 (числовой луч — это
#   геометрический луч с началом в точке 0; по координатам проверяется, лежит ли точка на отрезке
#   или луче) и работает в задачах P-02…P-04, P-07…P-09, R-01, R-02, F-01.
# · Правило 153: все четыре подтемы дерева входят в outcomes уровня core (LO-01, LO-02); deep-исход
#   LO-03 только углубляет их счётом фигур (раздел T05).
# · Правило 181: слова «параллельные» и «перпендикулярные» не используются — это материал тем
#   geom-parallel и geom-angle; случай «прямые не пересекаются» описан через одинаковый просвет.
id: geom-basic-shapes
title: "Точка, прямая, отрезок, луч и угол"
section: geom
stage: 1
hours: 3
grade: "1–3"
prerequisites: [num-line]
scope: >
  Наглядный уровень; измерение углов транспортиром — в geom-measure.
version: "1.0.0"
summary: >
  Тема вводит основные фигуры геометрии: точку, прямую, отрезок, луч и угол. Вы научитесь
  различать их по концам и направлениям, определять вид угла сравнением с моделью прямого угла
  и решать, пересекаются ли две прямые, даже если на чертеже они не встретились.

search:
  synonyms:
    - точка прямая отрезок луч
    - что такое отрезок
    - что такое луч в геометрии
    - геометрический луч
    - чем луч отличается от отрезка
    - что такое угол
    - вершина и стороны угла
    - виды углов
    - острый прямой тупой угол
    - развёрнутый угол
    - пересекающиеся прямые
    - взаимное расположение двух прямых
    - обозначение угла тремя буквами
    - начала геометрии для взрослых
  questions:
    - Чем отрезок отличается от луча?
    - Что такое прямая в геометрии?
    - Как обозначают луч двумя буквами?
    - Какая буква в записи угла обозначает вершину?
    - Как без инструментов отличить острый угол от тупого?
    - Чем прямой угол отличается от развёрнутого?
    - Как понять, пересекутся ли две прямые, если на рисунке они не встретились?
    - Сколько общих точек может быть у двух прямых?
    - Сколько отрезков образуют четыре точки на прямой?

subtopics:
  - id: geom-basic-shapes/point-line-segment-ray
    title: "Точка, прямая, отрезок, луч"
    tree_ref: "Точка, прямая, отрезок, луч"
    synonyms: [концы отрезка, начало луча, обозначение отрезка и луча, точки на отрезке]
    sections: [T01, T05]
  - id: geom-basic-shapes/angle-vertex-sides
    title: "Угол, вершина, стороны угла"
    tree_ref: "Угол, вершина, стороны угла"
    synonyms: [что такое угол, запись угла тремя буквами, сравнение углов наложением]
    sections: [T02, T05]
  - id: geom-basic-shapes/angle-types
    title: "Виды углов на глаз и по модели"
    tree_ref: "Виды углов на глаз и по модели"
    synonyms: [острый угол, прямой угол, тупой угол, развёрнутый угол, модель прямого угла]
    sections: [T03]
  - id: geom-basic-shapes/two-lines
    title: "Взаимное расположение двух прямых"
    tree_ref: "Взаимное расположение двух прямых"
    synonyms: [пересекающиеся прямые, точка пересечения, прямые не пересекаются, совпадающие прямые]
    sections: [T04, T05]

outcomes:
  - id: LO-01
    short: Различает прямую, отрезок и луч
    action: >
      называет фигуру по описанию или буквенной записи, отбирает точки, лежащие на отрезке или
      луче, и определяет, пересекаются ли две прямые
    conditions: >
      фигуры заданы словами, буквами или отметками числового луча с координатами до 20; прямые —
      просветом между ними на клетчатом листе; без измерений
    criterion: >
      верный ответ в 4 случаях из 5, в том числе когда конец отрезка или начало луча совпадает
      с проверяемой отметкой
    level: core
    sections: [T01, T04]
  - id: LO-02
    short: Находит угол и определяет его вид
    action: >
      называет вершину и стороны угла по записи из трёх букв, считает углы при общей вершине и
      относит угол к острым, прямым, тупым или развёрнутым сравнением с моделью прямого угла
    conditions: >
      углы заданы лучами по отметкам циферблата или сторонам света, отрезками с общим концом или
      бытовой моделью; не больше 4 лучей с общим началом; без измерительных инструментов
    criterion: >
      верно называет вершину, число углов и вид угла в 4 случаях из 5, не принимая развёрнутый
      угол за прямой
    level: core
    sections: [T02, T03]
  - id: LO-03
    short: Считает фигуры без пропусков и повторов
    action: >
      считает отрезки, лучи, углы, прямые и точки пересечения перебором пар и объясняет, почему
      ни одна пара не пропущена и не взята дважды
    conditions: >
      до 7 точек на прямой, до 8 различных лучей с общим началом, до 9 прямых; при счёте
      перекрёстков — два направления и при необходимости отдельный проспект. Итоговые ответы
      задач не больше 20; промежуточные количества пар могут достигать 28
    criterion: >
      верное число и перечень пар без повторов в 4 случаях из 5, включая случай трёх точек на
      одной прямой
    level: deep
    sections: [T05]

errors:
  - E-geom-basic-shapes-gaps-not-marks
  - E-geom-basic-shapes-ends-excluded
  - E-geom-basic-shapes-drawn-part-ends
  - E-geom-basic-shapes-neighbors-only
  - E-geom-basic-shapes-pair-twice
  - E-geom-basic-shapes-right-as-straight
  - E-geom-basic-shapes-all-pairs-cross
  - E-geom-basic-shapes-collinear-ignored
