# Повторение (STANDARD.md §8): 6 задач, у каждой 3 варианта; числа и формулировки не
# совпадают с практикой, примерами теории, финалом и контрольной (правило 172).
tasks:
- id: R-01
  type: number
  role: refresh
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T01
  minutes: 2
  prompt: На числовом луче закрасили отрезок от точки {{a}} до точки {{b}}. Сколько отметок с числами оказалось
    на закрашенной части вместе с её концами?
  answer: 6
  variants:
  - params:
      a: 2
      b: 7
    answer: 6
    solution: |
      ### Ответ
      6

      ### Идея
      Закрашенная часть — отрезок с концами; считаем его отметки вместе с концами.

      ### Шаги
      1. Отметки от 2 до 7: 2, 3, 4, 5, 6, 7.
      2. Их 6.

      ### Проверка
      Шагов между отметками 5, отметок на одну больше — 6.

      ### Типичная ошибка
      Посчитать шаги (5, E-geom-basic-shapes-gaps-not-marks) или пропустить концы (4, E-geom-basic-shapes-ends-excluded).
  - params:
      a: 9
      b: 15
    answer: 7
    solution: |
      ### Ответ
      7

      ### Идея
      Закрашенная часть — отрезок с концами; считаем его отметки вместе с концами.

      ### Шаги
      1. Отметки от 9 до 15: 9, 10, 11, 12, 13, 14, 15.
      2. Их 7.

      ### Проверка
      Шагов между отметками 6, отметок на одну больше — 7.

      ### Типичная ошибка
      Посчитать шаги (6, E-geom-basic-shapes-gaps-not-marks) или пропустить концы (5, E-geom-basic-shapes-ends-excluded).
  - params:
      a: 11
      b: 19
    answer: 9
    solution: |
      ### Ответ
      9

      ### Идея
      Закрашенная часть — отрезок с концами; считаем его отметки вместе с концами.

      ### Шаги
      1. Отметки от 11 до 19: 11, 12, 13, 14, 15, 16, 17, 18, 19.
      2. Их 9.

      ### Проверка
      Шагов между отметками 8, отметок на одну больше — 9.

      ### Типичная ошибка
      Посчитать шаги (8, E-geom-basic-shapes-gaps-not-marks) или пропустить концы (7, E-geom-basic-shapes-ends-excluded).
  hints:
  - Концы закрашенного отрезка тоже на нём.
  - Назовите отметки подряд от левого конца до правого.
  - Начните счёт с отметки {{a}} и закончите на {{b}}.
  solution: |
    ### Ответ
    Число отметок от {{a}} до {{b}} включительно.

    ### Идея
    Концы входят в отрезок.

    ### Шаги
    1. Перечисляем отметки.
    2. Считаем их.

    ### Проверка
    Отметок на одну больше, чем шагов.

    ### Типичная ошибка
    Посчитать шаги (E-geom-basic-shapes-gaps-not-marks).
  feedback:
    correct: 'Верно: закрашенный отрезок посчитан вместе с концами.'
    wrong:
      what: Число отметок не совпало.
      why: Возможно, посчитаны промежутки или потеряны концы.
      fix: Перечислите вслух отметки от {{a}} до {{b}} и сосчитайте их.
      next: Перечитайте выжимку раздела T01.
    misconceptions:
    - id: E-geom-basic-shapes-gaps-not-marks
      when:
        expr: b - a
      message: Похоже, посчитаны шаги между отметками, а не отметки.
    - id: E-geom-basic-shapes-ends-excluded
      when:
        expr: b - a - 1
      message: Похоже, концы закрашенного отрезка не посчитаны.
- id: R-02
  type: set
  role: refresh
  purpose: procedure
  level: 2
  outcome: LO-01
  sections:
  - T01
  minutes: 2
  prompt: На числовом луче точка $O$ стоит у отметки {{o}}, а точка $A$ — у отметки {{x}}. Какие из отметок {{p}},
    {{q}}, {{r}}, {{u}}, {{v}} принадлежат лучу $OA$? Перечислите их через точку с запятой.
  answer: &id001
  - 0
  - 3
  - 6
  variants:
  - params:
      p: 0
      q: 3
      r: 6
      u: 9
      v: 15
      o: 6
      x: 2
    answer: *id001
    solution: |
      ### Ответ
      0, 3, 6

      ### Идея
      Первая буква записи луча — начало, вторая задаёт направление.

      ### Шаги
      1. Начало $O$ — точка 6; точка $A$ — 2, поэтому луч идёт влево.
      2. На луче начало и точки левее: 0, 3 и 6.

      ### Проверка
      Отброшенные точки лежат по другую сторону от точки 6, где луча нет.

      ### Типичная ошибка
      Принять за начало вторую букву записи.
  - params:
      p: 4
      q: 8
      r: 10
      u: 13
      v: 20
      o: 10
      x: 17
    answer:
    - 10
    - 13
    - 20
    solution: |
      ### Ответ
      10, 13, 20

      ### Идея
      Первая буква записи луча — начало, вторая задаёт направление.

      ### Шаги
      1. Начало $O$ — точка 10; точка $A$ — 17, поэтому луч идёт вправо.
      2. На луче начало и точки правее: 10, 13 и 20.

      ### Проверка
      Отброшенные точки лежат по другую сторону от точки 10, где луча нет.

      ### Типичная ошибка
      Принять за начало вторую букву записи.
  - params:
      p: 5
      q: 11
      r: 14
      u: 16
      v: 18
      o: 13
      x: 5
    answer:
    - 5
    - 11
    solution: |
      ### Ответ
      5, 11

      ### Идея
      Первая буква записи луча — начало, вторая задаёт направление.

      ### Шаги
      1. Начало $O$ — точка 13; точка $A$ — 5, поэтому луч идёт влево.
      2. На луче начало и точки левее: 5 и 11.

      ### Проверка
      Отброшенные точки лежат по другую сторону от точки 13, где луча нет.

      ### Типичная ошибка
      Принять за начало вторую букву записи.
  hints:
  - Начало луча $OA$ — точка $O$.
  - Луч идёт от $O$ в ту сторону, где лежит $A$.
  - 'Сравните {{x}} и {{o}}: в какую сторону от начала идёт луч?'
  solution: |
    ### Ответ
    Отметка {{o}} и отметки по ту сторону от неё, где лежит {{x}}.

    ### Идея
    Первая буква — начало.

    ### Шаги
    1. Находим начало и направление.
    2. Отбираем отметки.

    ### Проверка
    Сравните с лучом $AO$.

    ### Типичная ошибка
    Перепутать начало и направление.
  feedback:
    correct: 'Верно: начало и направление луча прочитаны по записи $OA$.'
    wrong:
      what: Набор отметок не совпал.
      why: Возможно, перепутаны начало и направление луча.
      fix: Начало — первая буква, направление — к точке второй буквы.
      next: Перечитайте карточку раздела T01.
- id: R-03
  type: number
  role: refresh
  purpose: procedure
  level: 1
  outcome: LO-02
  sections:
  - T03
  minutes: 2
  prompt: 'Посмотрите на стену сверху: она — прямая линия. От стены отходят {{k|pl:полка,полки,полок}}, каждая под
    прямым углом к стене. Сколько прямых углов образуют полки со стеной?'
  answer: 8
  variants:
  - params:
      k: 4
    answer: 8
    solution: |
      ### Ответ
      8

      ### Идея
      Полка, отходящая от стены под прямым углом, образует со стеной два прямых угла; две половины стены дают развёрнутый угол.

      ### Шаги
      1. У каждой полки два прямых угла — по обе стороны от неё.
      2. 4 полки по 2 прямых угла — 8.

      ### Проверка
      Модель прямого угла прикладывается у каждой полки дважды: 8 положений.

      ### Типичная ошибка
      Добавить развёрнутые углы и получить 12 (E-geom-basic-shapes-right-as-straight).
  - params:
      k: 6
    answer: 12
    solution: |
      ### Ответ
      12

      ### Идея
      Полка, отходящая от стены под прямым углом, образует со стеной два прямых угла; две половины стены дают развёрнутый угол.

      ### Шаги
      1. У каждой полки два прямых угла — по обе стороны от неё.
      2. 6 полок по 2 прямых угла — 12.

      ### Проверка
      Модель прямого угла прикладывается у каждой полки дважды: 12 положений.

      ### Типичная ошибка
      Добавить развёрнутые углы и получить 18 (E-geom-basic-shapes-right-as-straight).
  - params:
      k: 7
    answer: 14
    solution: |
      ### Ответ
      14

      ### Идея
      Полка, отходящая от стены под прямым углом, образует со стеной два прямых угла; две половины стены дают развёрнутый угол.

      ### Шаги
      1. У каждой полки два прямых угла — по обе стороны от неё.
      2. 7 полок по 2 прямых угла — 14.

      ### Проверка
      Модель прямого угла прикладывается у каждой полки дважды: 14 положений.

      ### Типичная ошибка
      Добавить развёрнутые углы и получить 21 (E-geom-basic-shapes-right-as-straight).
  hints:
  - 'Разберите одну полку: какие углы у места, где она примыкает к стене?'
  - У места примыкания полка и две половины стены; угол между половинами стены — развёрнутый.
  - У одной полки два прямых угла; полок {{k}}.
  solution: |
    ### Ответ
    По два прямых угла у каждой полки; полок {{k}}.

    ### Идея
    Развёрнутый угол не прямой.

    ### Шаги
    1. Два прямых угла у полки.
    2. Считаем у всех полок.

    ### Проверка
    Модель прикладывается дважды.

    ### Типичная ошибка
    Считать развёрнутые углы прямыми (E-geom-basic-shapes-right-as-straight).
  feedback:
    correct: 'Верно: у каждой полки два прямых угла, развёрнутый угол не посчитан.'
    wrong:
      what: Число прямых углов не совпало.
      why: Возможно, развёрнутые углы посчитаны прямыми.
      fix: У места примыкания полки найдите два прямых угла и один развёрнутый.
      next: Перечитайте предупреждение о прямом и развёрнутом угле в разделе T03.
    misconceptions:
    - id: E-geom-basic-shapes-right-as-straight
      when:
        expr: 3 * k
      message: Похоже, развёрнутый угол у стены посчитан прямым.
- id: R-04
  type: set
  role: refresh
  purpose: procedure
  level: 2
  outcome: LO-02
  sections:
  - T03
  minutes: 2
  prompt: Минутная стрелка указывает на 12. В какие из моментов — ровно {{h1}}, {{h2}}, {{h3}} или {{h4}} часов
    — стрелки образуют острый угол? Перечислите часы через точку с запятой.
  answer: &id002
  - 1
  - 11
  variants:
  - params:
      h1: 1
      h2: 3
      h3: 7
      h4: 11
    answer: *id002
    solution: |
      ### Ответ
      1, 11

      ### Идея
      Острый угол меньше прямого — меньше угла между стрелками в 3 часа (и в 9 часов).

      ### Шаги
      1. Виды углов: 1 ч — острый; 3 ч — прямой; 7 ч — тупой; 11 ч — острый.
      2. Острые: 1 и 11.

      ### Проверка
      В выбранные моменты угол между стрелками помещается внутри модели прямого угла.

      ### Типичная ошибка
      Взять больший угол между стрелками после 6 часов и назвать острый угол тупым.
  - params:
      h1: 2
      h2: 4
      h3: 9
      h4: 10
    answer:
    - 2
    - 10
    solution: |
      ### Ответ
      2, 10

      ### Идея
      Острый угол меньше прямого — меньше угла между стрелками в 3 часа (и в 9 часов).

      ### Шаги
      1. Виды углов: 2 ч — острый; 4 ч — тупой; 9 ч — прямой; 10 ч — острый.
      2. Острые: 2 и 10.

      ### Проверка
      В выбранные моменты угол между стрелками помещается внутри модели прямого угла.

      ### Типичная ошибка
      Взять больший угол между стрелками после 6 часов и назвать острый угол тупым.
  - params:
      h1: 5
      h2: 6
      h3: 8
      h4: 11
    answer:
    - 11
    solution: |
      ### Ответ
      11

      ### Идея
      Острый угол меньше прямого — меньше угла между стрелками в 3 часа (и в 9 часов).

      ### Шаги
      1. Виды углов: 5 ч — тупой; 6 ч — развёрнутый; 8 ч — тупой; 11 ч — острый.
      2. Острые: 11.

      ### Проверка
      В выбранные моменты угол между стрелками помещается внутри модели прямого угла.

      ### Типичная ошибка
      Взять больший угол между стрелками после 6 часов и назвать острый угол тупым.
  hints:
  - Острый угол меньше прямого.
  - Прямой угол стрелки образуют в 3 и в 9 часов.
  - 'Начните с момента «ровно {{h1|pl:час,часа,часов}}»: угол меньше, чем в 3 часа?'
  solution: |
    ### Ответ
    Моменты, когда угол меньше прямого.

    ### Идея
    Сравниваем с 3 и 9 часами.

    ### Шаги
    1. Определяем вид каждого угла.
    2. Отбираем острые.

    ### Проверка
    Проверьте моделью.

    ### Типичная ошибка
    Взять больший угол.
  feedback:
    correct: 'Верно: отобраны моменты, когда угол между стрелками меньше прямого.'
    wrong:
      what: Набор часов не совпал.
      why: Возможно, после 6 часов взят больший угол между стрелками.
      fix: Для каждого момента сравните меньший угол между стрелками с прямым.
      next: Перечитайте таблицу видов углов в разделе T03.
- id: R-05
  type: number
  role: refresh
  purpose: procedure
  level: 2
  outcome: LO-03
  sections:
  - T05
  minutes: 3
  prompt: От одной беседки внутри одного прямого угла веером расходятся прямые тропинки, всего их {{n}}; никакие две не продолжают друг друга. Каждые
    две тропинки образуют угол. Сколько всего углов?
  answer: 3
  variants:
  - params:
      n: 3
    answer: 3
    solution: |
      ### Ответ
      3

      ### Идея
      Угол задаётся парой тропинок; пары перебираем по порядку.

      ### Шаги
      1. Назовём тропинки A, B и C.
      2. Пары: с тропинкой A: AB, AC; с тропинкой B: BC.
      3. Пар 3.

      ### Проверка
      Каждая тропинка входит в 2 пары — с каждой другой.

      ### Типичная ошибка
      Только соседние пары (2, E-geom-basic-shapes-neighbors-only) или каждая пара дважды (6, E-geom-basic-shapes-pair-twice).
  - params:
      n: 4
    answer: 6
    solution: |
      ### Ответ
      6

      ### Идея
      Угол задаётся парой тропинок; пары перебираем по порядку.

      ### Шаги
      1. Назовём тропинки A, B, C и D.
      2. Пары: с тропинкой A: AB, AC, AD; с тропинкой B: BC, BD; с тропинкой C: CD.
      3. Пар 6.

      ### Проверка
      Каждая тропинка входит в 3 пары — с каждой другой.

      ### Типичная ошибка
      Только соседние пары (3, E-geom-basic-shapes-neighbors-only) или каждая пара дважды (12, E-geom-basic-shapes-pair-twice).
  - params:
      n: 5
    answer: 10
    solution: |
      ### Ответ
      10

      ### Идея
      Угол задаётся парой тропинок; пары перебираем по порядку.

      ### Шаги
      1. Назовём тропинки A, B, C, D и E.
      2. Пары: с тропинкой A: AB, AC, AD, AE; с тропинкой B: BC, BD, BE; с тропинкой C: CD, CE; с тропинкой D: DE.
      3. Пар 10.

      ### Проверка
      Каждая тропинка входит в 4 пары — с каждой другой.

      ### Типичная ошибка
      Только соседние пары (4, E-geom-basic-shapes-neighbors-only) или каждая пара дважды (20, E-geom-basic-shapes-pair-twice).
  hints:
  - Угол — пара тропинок с общим началом у беседки.
  - 'Перебирайте пары: первая тропинка с каждой следующей, потом вторая с каждой следующей.'
  - Назовите {{n|pl:тропинку,тропинки,тропинок}} буквами и выпишите сначала пары с первой.
  solution: |
    ### Ответ
    Число пар тропинок; тропинок {{n}}.

    ### Идея
    Угол — пара тропинок.

    ### Шаги
    1. Перебираем пары.
    2. Считаем.

    ### Проверка
    Каждая тропинка в одинаковом числе пар.

    ### Типичная ошибка
    Только соседние пары (E-geom-basic-shapes-neighbors-only).
  feedback:
    correct: 'Верно: все пары тропинок перебраны, каждая — один раз.'
    wrong:
      what: Число углов не совпало.
      why: Возможно, пропущены широкие углы или пара посчитана дважды.
      fix: Выпишите пары тропинок по порядку и сосчитайте.
      next: Перечитайте карточку раздела T05.
    misconceptions:
    - id: E-geom-basic-shapes-neighbors-only
      when:
        expr: n - 1
      message: Похоже, посчитаны только углы между соседними тропинками.
    - id: E-geom-basic-shapes-pair-twice
      when:
        expr: n * (n - 1)
      message: Похоже, каждая пара тропинок посчитана дважды.
- id: R-06
  type: number
  role: refresh
  purpose: meaning
  level: 2
  outcome: LO-01
  sections:
  - T04
  minutes: 2
  trivial_answer_ok: true
  prompt: Две прямые на клетчатом листе на чертеже не встречаются, одна идёт выше другой. Просвет между ними у левого
    края — {{g|pl:клетка,клетки,клеток}}, у правого — {{h|pl:клетка,клетки,клеток}}. Сколько у прямых общих точек?
  answer: 0
  variants:
  - params:
      g: 5
      h: 5
    answer: 0
    solution: |
      ### Ответ
      0

      ### Идея
      Одинаковый просвет — прямые идут рядом.

      ### Шаги
      1. Просвет и слева, и справа — 5 клеток.
      2. Прямые не сближаются, общих точек нет.

      ### Проверка
      Если бы прямые пересекались, с одной стороны просвет уменьшался бы.

      ### Типичная ошибка
      Ответить 1, решив, что любые две прямые пересекаются.
  - params:
      g: 2
      h: 6
    answer: 1
    solution: |
      ### Ответ
      1

      ### Идея
      Разный просвет — прямые сближаются и встречаются в одной точке.

      ### Шаги
      1. Просветы 2 и 6 разные.
