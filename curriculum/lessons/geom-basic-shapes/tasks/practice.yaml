  - Острый меньше прямого, тупой больше, у развёрнутого стороны лежат на одной прямой.
  - 'Начните с первой из 4 карточек слева — острого угла: он меньше модели; где окажется его вторая сторона?'
  solution: |
    ### Ответ
    Острый — вторая сторона внутри модели; прямой — совпала со стороной модели; тупой — снаружи и не продолжает первую; развёрнутый — стороны составляют одну прямую. Лишнее описание — «одна из сторон угла — кривая линия».

    ### Идея
    Вид угла определяют сравнением с моделью прямого угла.

    ### Шаги
    1. Острый угол меньше прямого — его вторая сторона помещается внутри модели.
    2. Прямой угол совпадает с моделью.
    3. Тупой угол больше прямого — вторая сторона снаружи, но ещё не на одной прямой с первой.
    4. У развёрнутого угла стороны составляют прямую.
    5. Фигура с кривой стороной — вообще не угол, поэтому это описание лишнее.

    ### Проверка
    Приложите модель к уголку книги, к стрелкам в 2 часа и в 5 часов — и сравните с выбранными описаниями.

    ### Типичная ошибка
    Перепутать острый и тупой угол: острый меньше прямого, тупой больше.
