  minutes: 1
  prompt: Из точки $O$ внутри одного прямого угла веером выходят {{n|pl:луч,луча,лучей}}, никакие два из них не лежат на одной прямой. Сколько углов
    образуют эти лучи? Каждая пара лучей — один угол; перечислите пары по порядку.
  answer: 3
  variants:
  - params:
      n: 3
    answer: 3
    solution: |
      ### Ответ
      3

      ### Идея
      Угол — пара лучей с общим началом; пары перебираем по порядку, не возвращаясь назад.

      ### Шаги
      1. Назовём лучи $OA$, $OB$ и $OC$.
      2. Пары с лучом $OA$: $\angle AOB$ и $\angle AOC$.
      3. Остальные пары: $\angle BOC$.
      4. Всего 3 угла.

      ### Проверка
      Каждый луч стоит ровно в 2 записях — с каждым из других лучей, — значит, ни одна пара не пропущена.

      ### Типичная ошибка
      Посчитать только углы между соседними лучами — 2 (E-geom-basic-shapes-neighbors-only) — или записать $\angle AOB$ и $\angle BOA$ как разные углы — 6 (E-geom-basic-shapes-pair-twice).
  - params:
