      2. Пары с лучом $OA$: $\angle AOB$, $\angle AOC$ и $\angle AOD$.
      3. Остальные пары: $\angle BOC$, $\angle BOD$ и $\angle COD$.
      4. Всего 6 углов.

      ### Проверка
