# Основной банк (STANDARD.md §6–§8): 29 задач без challenge + 1 challenge (P-30).
# Роли: warmup 4, supported 10, independent 15. Уровни: L0 3, L1 8, L2 9, L3 6, L4 3.
# LO-01 — P-01…P-09, LO-02 — P-11…P-19, LO-03 (deep) — P-10, P-20…P-29. Контексты: числовой луч,
# циферблат, стороны света, схема района, столбики и полки; ни один не занимает больше половины.
tasks:
- id: P-01
  type: match
  role: warmup
  purpose: meaning
  level: 0
  outcome: LO-01
  sections:
  - T01
  minutes: 1
  prompt: Сопоставьте каждую фигуру с её описанием. Одно описание справа лишнее.
  left:
  - id: pt
    text: Точка
  - id: seg
    text: Отрезок
  - id: ray
    text: Луч
  - id: line
    text: Прямая
  right:
  - id: place
    text: Место на листе без длины и ширины
  - id: two-ends
    text: Часть прямой между двумя точками вместе с ними
  - id: one-start
    text: Часть прямой с началом, которая продолжается без конца в одну сторону
  - id: no-ends
    text: Ровная линия без концов, продолжается в обе стороны
  - id: curve
    text: Кривая линия без концов
  answer:
  - left: pt
    right: place
  - left: seg
    right: two-ends
  - left: ray
    right: one-start
  - left: line
    right: no-ends
  hints:
  - Сравнивайте фигуры по тому, сколько у них концов и куда они продолжаются.
  - У отрезка два конца, у луча одно начало, у прямой концов нет — ищите описание с тем же признаком.
  - 'Начните с карточки «Прямая»: без концов справа описаны 2 линии, но одна из них кривая, а прямая — ровная.'
  solution: |
    ### Ответ
    Точка — место на листе без длины и ширины; отрезок — часть прямой между двумя точками вместе с ними; луч — часть прямой с началом, которая продолжается без конца в одну сторону; прямая — ровная линия без концов, продолжается в обе стороны. Лишнее описание — «кривая линия без концов».

    ### Идея
    Фигуры различают по концам: два конца, одно начало или ни одного.

    ### Шаги
    1. У точки нет размеров — ей подходит «место без длины и ширины».
    2. Два конца есть только у отрезка.
    3. Одно начало и продолжение в одну сторону — у луча.
    4. Без концов — прямая; она ровная, поэтому кривая линия без концов — лишнее описание.

    ### Проверка
    Нарисуйте каждую фигуру по выбранному описанию: кривую линию нельзя провести по линейке, значит, это не прямая и не её часть.

    ### Типичная ошибка
    Принять кривую линию без концов за прямую: концов нет у обеих, но прямая обязательно ровная.
  feedback:
    correct: 'Верно: фигуры различены по числу концов, а кривая линия отброшена.'
    wrong:
      what: Какая-то пара не совпала.
      why: Возможно, перепутаны луч и отрезок или кривая линия принята за прямую.
      fix: Для каждой фигуры назовите число её концов и найдите описание с тем же числом.
      next: Перечитайте таблицу фигур в разделе T01.
- id: P-02
  type: set
  role: warmup
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T01
  minutes: 1
  prompt: На числовом луче отмечены точки {{p}}, {{q}}, {{r}}, {{s}} и {{t}}. Какие из них лежат на отрезке с концами
    {{a}} и {{b}}? Перечислите их координаты через точку с запятой.
  answer: &id001
  - 4
  - 7
  - 10
  variants:
  - params:
      p: 1
      q: 4
      r: 7
      s: 10
      t: 13
      a: 4
      b: 10
    answer: *id001
    solution: |
      ### Ответ
      4, 7, 10

      ### Идея
      Отрезок с концами 4 и 10 состоит из этих концов и всех точек между ними.

      ### Шаги
      1. Точка 1 левее конца 4 — на отрезке её нет.
      2. Точки 4 и 10 — концы отрезка, они принадлежат ему.
      3. Точка 7 лежит между концами 4 и 10 — на отрезке.
      4. Точка 13 правее конца 10 — на отрезке её нет.

      ### Проверка
      Пройдите по числовому лучу от 4 до 10: из отмеченных точек по пути встретятся только 4, 7, 10.

      ### Типичная ошибка
      Не включить концы отрезка, будто отрезок — только то, что между концами (E-geom-basic-shapes-ends-excluded).
  - params:
      p: 2
      q: 5
      r: 8
      s: 12
      t: 15
      a: 3
      b: 12
    answer:
    - 5
    - 8
    - 12
    solution: |
      ### Ответ
      5, 8, 12

      ### Идея
      Отрезок с концами 3 и 12 состоит из этих концов и всех точек между ними.

      ### Шаги
      1. Точка 2 левее конца 3 — на отрезке её нет.
      2. Точка 12 — конец отрезка, она принадлежит ему.
      3. Точки 5 и 8 лежат между концами 3 и 12 — на отрезке.
      4. Точка 15 правее конца 12 — на отрезке её нет.

      ### Проверка
      Пройдите по числовому лучу от 3 до 12: из отмеченных точек по пути встретятся только 5, 8, 12.

      ### Типичная ошибка
      Не включить конец отрезка, будто отрезок — только то, что между концами (E-geom-basic-shapes-ends-excluded).
  hints:
  - Отрезку принадлежат оба его конца и все точки между ними.
  - 'Сравните каждую координату с концами: подходит та, что не левее левого конца и не правее правого.'
  - 'Начните с точки {{p}}: она левее конца {{a}} или нет?'
  solution: |
    ### Ответ
    Те из точек {{p}}, {{q}}, {{r}}, {{s}}, {{t}}, что лежат не левее {{a}} и не правее {{b}}.

    ### Идея
    Отрезок состоит из двух концов и всех точек между ними.

    ### Шаги
    1. Сравниваем каждую точку с левым концом {{a}}.
    2. Сравниваем каждую точку с правым концом {{b}}.
    3. Оставляем точки между концами и сами концы.

    ### Проверка
    Пройдите по лучу от {{a}} до {{b}} и отметьте встреченные точки.

    ### Типичная ошибка
    Потерять концы отрезка (E-geom-basic-shapes-ends-excluded).
  feedback:
    correct: 'Верно: отобраны концы отрезка и точки между ними.'
    wrong:
      what: Набор точек не совпал.
      why: Возможно, потерян конец отрезка или взята точка за его пределами.
      fix: Сравните каждую координату с обоими концами и не забудьте сами концы.
      next: Разберите пример 2 раздела T01.
- id: P-03
  type: number
  role: supported
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T01
  minutes: 1
  prompt: Сколько отметок числового луча лежит на отрезке с концами {{a}} и {{b}}, если считать и сами концы? Перечислите
    отметки по порядку, начиная с {{a}}, и сосчитайте их.
  answer: 7
  variants:
  - params:
      a: 3
      b: 9
    answer: 7
    solution: |
      ### Ответ
      7

      ### Идея
      Считаем отметки, а не шаги между ними; оба конца входят в отрезок.

      ### Шаги
      1. Перечисляем отметки от 3 до 9 по порядку: 3, 4, 5, 6, 7, 8, 9.
      2. Считаем их: 7 отметок.

      ### Проверка
      Шагов между соседними отметками от 3 до 9 — 6, а отметок на одну больше, чем шагов: 7.

      ### Типичная ошибка
      Посчитать шаги вместо отметок и получить 6 (E-geom-basic-shapes-gaps-not-marks) или забыть оба конца и получить 5 (E-geom-basic-shapes-ends-excluded).
  - params:
      a: 6
      b: 11
    answer: 6
    solution: |
      ### Ответ
      6

      ### Идея
      Считаем отметки, а не шаги между ними; оба конца входят в отрезок.

      ### Шаги
      1. Перечисляем отметки от 6 до 11 по порядку: 6, 7, 8, 9, 10, 11.
      2. Считаем их: 6 отметок.

      ### Проверка
      Шагов между соседними отметками от 6 до 11 — 5, а отметок на одну больше, чем шагов: 6.

      ### Типичная ошибка
      Посчитать шаги вместо отметок и получить 5 (E-geom-basic-shapes-gaps-not-marks) или забыть оба конца и получить 4 (E-geom-basic-shapes-ends-excluded).
  - params:
      a: 12
      b: 16
    answer: 5
    solution: |
      ### Ответ
      5

      ### Идея
      Считаем отметки, а не шаги между ними; оба конца входят в отрезок.

      ### Шаги
      1. Перечисляем отметки от 12 до 16 по порядку: 12, 13, 14, 15, 16.
      2. Считаем их: 5 отметок.

      ### Проверка
      Шагов между соседними отметками от 12 до 16 — 4, а отметок на одну больше, чем шагов: 5.

      ### Типичная ошибка
      Посчитать шаги вместо отметок и получить 4 (E-geom-basic-shapes-gaps-not-marks) или забыть оба конца и получить 3 (E-geom-basic-shapes-ends-excluded).
  hints:
  - Отрезку принадлежат и концы, и все отметки между ними.
  - Называйте отметки подряд, начиная с левого конца, и считайте каждую названную.
  - Первая отметка ряда — сам конец {{a}}; последняя — конец {{b}}.
  solution: |
    ### Ответ
    Число отметок в ряду от {{a}} до {{b}} включительно.

    ### Идея
    Считаем отметки, а не шаги; концы входят в отрезок.

    ### Шаги
    1. Перечисляем отметки от {{a}} до {{b}}.
    2. Считаем перечисленные отметки.

    ### Проверка
    Отметок на одну больше, чем шагов между ними.

    ### Типичная ошибка
    Посчитать шаги (E-geom-basic-shapes-gaps-not-marks) или забыть концы (E-geom-basic-shapes-ends-excluded).
  feedback:
    correct: 'Верно: оба конца посчитаны вместе с отметками между ними.'
    wrong:
      what: Число отметок не совпало.
      why: Возможно, посчитаны шаги между отметками или пропущены концы.
      fix: Назовите отметки вслух подряд — от левого конца до правого — и сосчитайте названные.
      next: Перечитайте предупреждение об отметках и шагах в разделе T01.
    misconceptions:
    - id: E-geom-basic-shapes-gaps-not-marks
      when:
        expr: b - a
      message: 'Похоже, посчитаны шаги между отметками, а не сами отметки: отметок на одну больше.'
    - id: E-geom-basic-shapes-ends-excluded
      when:
        expr: b - a - 1
      message: Похоже, концы отрезка не посчитаны, а они тоже лежат на отрезке.
- id: P-04
  type: set
  role: supported
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T01
  minutes: 1
  prompt: 'Луч начинается на числовом луче в точке с координатой {{s}} и идёт вправо. Какие из отметок {{p}}, {{q}},
    {{r}}, {{u}} и {{v}} лежат на этом луче? Помните: начало тоже принадлежит лучу. Перечислите координаты через
    точку с запятой.'
  answer: &id002
  - 6
  - 9
  - 14
  - 18
  variants:
  - params:
      p: 2
      q: 6
      r: 9
      u: 14
      v: 18
      s: 6
    answer: *id002
    solution: |
      ### Ответ
      6, 9, 14, 18

      ### Идея
      Луч с началом 6, идущий вправо, — это точка 6 и все точки с большими координатами.

      ### Шаги
      1. Луч начинается в точке 6 и идёт вправо: на нём лежат начало и всё правее.
      2. Точка 6 — начало луча, она на луче.
      3. Точки 9, 14 и 18 правее начала — на луче.
      4. Точка 2 левее начала — не на луче.

      ### Проверка
      Каждая выбранная координата не меньше 6, а каждая отброшенная меньше 6.

      ### Типичная ошибка
      Потерять начало луча, если оно есть в списке: начало принадлежит лучу (E-geom-basic-shapes-ends-excluded — та же ошибка, что с концами отрезка).
  - params:
      p: 3
      q: 7
      r: 11
      u: 15
      v: 19
      s: 10
    answer:
    - 11
    - 15
    - 19
    solution: |
      ### Ответ
      11, 15, 19

      ### Идея
      Луч с началом 10, идущий вправо, — это точка 10 и все точки с большими координатами.

      ### Шаги
      1. Луч начинается в точке 10 и идёт вправо: на нём лежат начало и всё правее.
      2. Точки 11, 15 и 19 правее начала — на луче.
      3. Точки 3 и 7 левее начала — не на луче.

      ### Проверка
      Каждая выбранная координата не меньше 10, а каждая отброшенная меньше 10.

      ### Типичная ошибка
      Потерять начало луча, если оно есть в списке: начало принадлежит лучу (E-geom-basic-shapes-ends-excluded — та же ошибка, что с концами отрезка).
  - params:
      p: 1
      q: 4
      r: 5
      u: 13
      v: 20
      s: 4
    answer:
    - 4
    - 5
    - 13
    - 20
    solution: |
      ### Ответ
      4, 5, 13, 20

      ### Идея
      Луч с началом 4, идущий вправо, — это точка 4 и все точки с большими координатами.

      ### Шаги
      1. Луч начинается в точке 4 и идёт вправо: на нём лежат начало и всё правее.
      2. Точка 4 — начало луча, она на луче.
      3. Точки 5, 13 и 20 правее начала — на луче.
      4. Точка 1 левее начала — не на луче.

      ### Проверка
      Каждая выбранная координата не меньше 4, а каждая отброшенная меньше 4.

      ### Типичная ошибка
      Потерять начало луча, если оно есть в списке: начало принадлежит лучу (E-geom-basic-shapes-ends-excluded — та же ошибка, что с концами отрезка).
  hints:
  - Луч, идущий вправо, содержит своё начало и всё, что правее него.
  - Точка правее, если её координата больше; сравните каждую отметку с началом луча.
  - Сравните первую отметку {{p}} с началом {{s}}.
  solution: |
    ### Ответ
    Те из отметок {{p}}, {{q}}, {{r}}, {{u}}, {{v}}, что не левее {{s}}.

    ### Идея
    Луч вправо — начало и все точки правее.

    ### Шаги
    1. Сравниваем каждую отметку с началом {{s}}.
    2. Оставляем начало и отметки правее.

    ### Проверка
    Все отобранные числа не меньше {{s}}.

    ### Типичная ошибка
    Потерять начало луча.
  feedback:
    correct: 'Верно: взяты начало луча и все отметки правее него.'
    wrong:
      what: Набор отметок не совпал.
      why: Возможно, потеряно начало луча или взята отметка левее него.
      fix: 'Сравните каждую отметку с началом: подходит само начало и всё, что правее.'
      next: Перечитайте абзац «Числовой луч — тоже луч» в разделе T01.
- id: P-05
  type: numbers
  role: supported
  purpose: meaning
  level: 2
  outcome: LO-01
  sections:
  - T01
  minutes: 1
  prompt: На прямой отмечены {{n|pl:точка,точки,точек}}. На сколько частей эти точки делят прямую? Сколько среди
    этих частей лучей?
  fields:
  - id: parts
    label: Всего частей
  - id: rays
    label: Из них лучей
  answer: &id003
    parts: 4
    rays: 2
  variants:
  - params:
      n: 3
    answer: *id003
    solution: |
      ### Ответ
      Всего частей — 4, из них лучей — 2.

      ### Идея
      Прямая не кончается на крайних точках: по краям остаются два луча.

      ### Шаги
      1. Между соседними точками получаются отрезки: 2 отрезка.
      2. Левее первой точки и правее последней прямая продолжается без конца — это два луча.
      3. Всего частей: 2 отрезка и 2 луча — 4.

      ### Проверка
      Разрежьте прямую в 3 местах: кусков получится на один больше, чем разрезов, — 4.

      ### Типичная ошибка
      Считать, что прямая кончается на крайних точках, и насчитать 2 части (E-geom-basic-shapes-drawn-part-ends).
  - params:
      n: 4
    answer:
      parts: 5
      rays: 2
    solution: |
      ### Ответ
      Всего частей — 5, из них лучей — 2.

      ### Идея
      Прямая не кончается на крайних точках: по краям остаются два луча.

      ### Шаги
      1. Между соседними точками получаются отрезки: 3 отрезка.
      2. Левее первой точки и правее последней прямая продолжается без конца — это два луча.
      3. Всего частей: 3 отрезка и 2 луча — 5.

      ### Проверка
      Разрежьте прямую в 4 местах: кусков получится на один больше, чем разрезов, — 5.

      ### Типичная ошибка
      Считать, что прямая кончается на крайних точках, и насчитать 3 части (E-geom-basic-shapes-drawn-part-ends).
  - params:
      n: 5
    answer:
      parts: 6
      rays: 2
    solution: |
      ### Ответ
      Всего частей — 6, из них лучей — 2.

      ### Идея
      Прямая не кончается на крайних точках: по краям остаются два луча.

      ### Шаги
      1. Между соседними точками получаются отрезки: 4 отрезка.
      2. Левее первой точки и правее последней прямая продолжается без конца — это два луча.
      3. Всего частей: 4 отрезка и 2 луча — 6.

      ### Проверка
      Разрежьте прямую в 5 местах: кусков получится на один больше, чем разрезов, — 6.

      ### Типичная ошибка
      Считать, что прямая кончается на крайних точках, и насчитать 4 части (E-geom-basic-shapes-drawn-part-ends).
  hints:
  - Прямая не кончается на крайних отмеченных точках.
  - Части прямой — это отрезки между соседними точками и два луча по краям.
  - Нарисуйте прямую с {{n|pl:точкой,точками,точками}} и закрасьте по очереди каждую часть, включая крайние.
  solution: |
    ### Ответ
    Частей на одну больше, чем точек; лучей 2.

    ### Идея
    По краям прямой остаются два луча.

    ### Шаги
    1. Отрезки между соседними точками.
    2. Два луча по краям.
    3. Считаем все части.

    ### Проверка
    Кусков на один больше, чем разрезов.

    ### Типичная ошибка
    Потерять крайние лучи (E-geom-basic-shapes-drawn-part-ends).
  feedback:
