  prompt: Сколько точек пересечения может быть у трёх различных прямых? Перечислите все возможные числа через точку
    с запятой.
  answer:
  - 0
  - 1
  - 2
  - 3
  hints:
  - Переберите случаи по тому, сколько прямых идут в одном направлении с одинаковым просветом.
  - Если все три прямые проходят через одну точку, точек пересечения меньше, чем пар прямых.
  - 'Начните с 3 прямых одного направления с одинаковыми просветами: сколько у них общих точек?'
  solution: |
    ### Ответ
    0, 1, 2, 3

    ### Идея
    Каждая пара прямых даёт не больше одной общей точки; разбираем все возможные расположения.

    ### Шаги
    1. Все три прямые идут в одном направлении с одинаковыми просветами — точек пересечения 0.
    2. Две идут в одном направлении, третья пересекает обе — 2 точки.
    3. Все три пересекаются попарно, но не в одной точке — 3 точки.
    4. Все три проходят через одну точку — 1 точка.
    5. Больше трёх не бывает: пар прямых три, и каждая пара даёт не больше одной точки.

    ### Проверка
    Нарисуйте все четыре случая по линейке на клетчатом листе: каждый из них действительно получается.

    ### Типичная ошибка
    Забыть случай одной общей точки для всех трёх прямых или решить, что три прямые всегда дают три точки.
