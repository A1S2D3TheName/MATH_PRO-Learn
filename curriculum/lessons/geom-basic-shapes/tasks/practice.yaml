  answer: &id005
  - 4
  - 8
  variants:
  - params:
      h1: 1
      h2: 4
      h3: 6
      h4: 8
    answer: *id005
    solution: |
      ### Ответ
      4, 8

      ### Идея
      Тупой угол больше прямого (стрелки в 3 часа), но меньше развёрнутого (стрелки в 6 часов).

      ### Шаги
      1. В 1 час часовая стрелка ближе к 12, чем отметка 3, — угол острый.
      2. В 4 часа часовая стрелка дальше отметки 3, но не дошла до 6, — угол тупой.
      3. В 6 часов стрелки смотрят в противоположные стороны — угол развёрнутый.
      4. В 8 часов меньший угол идёт от 12 назад, стрелка прошла 9, но не дошла до 6, — угол тупой.

      ### Проверка
      Приложите к стрелкам модель прямого угла: у выбранных моментов вторая стрелка снаружи модели и не смотрит в противоположную сторону.

