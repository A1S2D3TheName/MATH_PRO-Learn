  prompt: Сопоставьте запись угла и его вершину. Одна буква справа лишняя.
  left:
  - id: klm
    text: $\angle KLM$
  - id: pqr
    text: $\angle PQR$
  - id: def
    text: $\angle DEF$
  right:
  - id: v-l
    text: $L$
  - id: v-q
    text: $Q$
  - id: v-e
    text: $E$
  - id: v-k
    text: $K$
  answer:
  - left: klm
    right: v-l
  - left: pqr
    right: v-q
  - left: def
    right: v-e
  hints:
  - Вершина — общее начало сторон угла.
  - В записи угла из трёх букв вершина стоит в середине.
  - В записи $\angle KLM$ из 3 букв посмотрите на вторую по счёту.
  solution: |
    ### Ответ
    $\angle KLM$ — вершина $L$, $\angle PQR$ — вершина $Q$, $\angle DEF$ — вершина $E$; буква $K$ лишняя.

    ### Идея
    Буква вершины в записи угла стоит в середине.

    ### Шаги
    1. В $\angle KLM$ средняя буква — $L$.
    2. В $\angle PQR$ средняя буква — $Q$.
    3. В $\angle DEF$ средняя буква — $E$.
    4. Буква $K$ стоит в записи первой — это точка на стороне, а не вершина.

    ### Проверка
    Прочитайте запись по-другому: $\angle MLK$, $\angle RQP$, $\angle FED$ — средние буквы не изменились.

    ### Типичная ошибка
    Принять за вершину первую букву записи: в $\angle KLM$ точка $K$ лежит на стороне угла.
  feedback:
    correct: 'Верно: в каждой записи вершина — средняя буква.'
    wrong:
      what: Какая-то вершина выбрана неверно.
      why: Возможно, за вершину принята первая буква записи.
      fix: Найдите в каждой записи среднюю букву — это и есть вершина.
