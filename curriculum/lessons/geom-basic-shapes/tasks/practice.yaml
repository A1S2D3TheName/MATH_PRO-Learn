      4. Итого: острых — 2, прямых — 0, тупых — 2, развёрнутых — 2.

      ### Проверка
      Все шесть пар разобраны: каждая дорожка встречается ровно в трёх парах — с каждой из трёх других.

      ### Типичная ошибка
      Пропустить пары дорожек, которые не соседствуют, или назвать прямым развёрнутый угол между противоположными направлениями.
  hints:
  - Направления на север и на восток образуют прямой угол — это ваша модель.
  - Северо-восток лежит между севером и востоком, поэтому угол «север — северо-восток» меньше прямого, а «север
    — юг» — развёрнутый.
  - 'Выпишите все пары: {{d1}} и {{d2}}, {{d1}} и {{d3}}, … — и для каждой сравните угол с прямым.'
  solution: |
    ### Ответ
    Число острых, прямых, тупых и развёрнутых углов среди шести пар дорожек.

    ### Идея
    Модель прямого угла — «север — восток».

    ### Шаги
    1. Выписываем шесть пар.
    2. Определяем вид каждого угла.
    3. Считаем углы каждого вида.

    ### Проверка
    Каждая дорожка входит в три пары.

    ### Типичная ошибка
    Пропустить несоседние пары.
  feedback:
    correct: 'Верно: все шесть пар дорожек разобраны и каждый угол сравнён с прямым углом «север — восток».'
    wrong:
      what: Число углов какого-то вида не совпало.
      why: Возможно, пропущена пара дорожек или развёрнутый угол между противоположными направлениями назван прямым.
      fix: Выпишите все шесть пар дорожек и для каждой найдите вид угла по модели «север — восток».
      next: Перечитайте шаги «Как определить вид угла по модели» в разделе T03.
