      Промежутков между столбами 3, а столбов на один больше — 4.

      ### Типичная ошибка
      Посчитать промежутки (3, E-geom-basic-shapes-gaps-not-marks) или не посчитать столбы у остановок (2, E-geom-basic-shapes-ends-excluded).
