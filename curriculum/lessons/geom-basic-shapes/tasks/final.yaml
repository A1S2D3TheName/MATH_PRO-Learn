  feedback:
    correct: 'Верно: участок посчитан вместе со столбами у обеих остановок.'
    wrong:
      what: Число столбов не совпало.
      why: Возможно, посчитаны промежутки между столбами или пропущены столбы у остановок.
      fix: Назовите номера столбов подряд от {{a}} до {{b}} и сосчитайте их.
      next: Перечитайте предупреждение об отметках и шагах в разделе T01.
    misconceptions:
    - id: E-geom-basic-shapes-gaps-not-marks
      when:
        expr: b - a
      message: Похоже, посчитаны промежутки между столбами, а не сами столбы.
    - id: E-geom-basic-shapes-ends-excluded
