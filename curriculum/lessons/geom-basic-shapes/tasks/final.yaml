# Финальная цепочка (STANDARD.md §8): один сюжет, 4 шага, 6 согласованных вариантов (общие a и b).
# F-02, F-03 и F-04 используют результат F-01 — число столбов участка (правило 177).
title: Трамвайная линия на схеме района
context_id: tram-line
scenario: Трамвайная линия начинается у депо и уходит за край схемы. Вдоль неё через равные промежутки стоят столбы
  с номерами 0, 1, 2 и так далее, как отметки числового луча; у столбов a и b стоят остановки «Рынок» и «Парк».
tasks:
- id: F-01
  type: number
  role: final-step
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T01
  minutes: 1
  depends_on: []
  prompt: Трамвайная линия начинается у депо и уходит за край схемы; вдоль неё через равные промежутки стоят столбы
    с номерами 0, 1, 2 и так далее, как отметки числового луча. Остановка «Рынок» стоит у столба {{a}}, остановка
    «Парк» — у столба {{b}}. Сколько столбов стоит на участке от «Рынка» до «Парка», считая столбы у обеих остановок?
  answer: 3
  variants:
  - params:
      a: 4
      b: 6
    answer: 3
    solution: |
      ### Ответ
      3

      ### Идея
      Участок между остановками — отрезок числового луча; столбы считаем вместе с концами.

      ### Шаги
      1. Столбы участка: 4, 5, 6.
      2. Их 3.

      ### Проверка
      Промежутков между столбами 2, а столбов на один больше — 3.

      ### Типичная ошибка
      Посчитать промежутки (2, E-geom-basic-shapes-gaps-not-marks) или не посчитать столбы у остановок (1, E-geom-basic-shapes-ends-excluded).
  - params:
      a: 5
      b: 8
    answer: 4
    solution: |
      ### Ответ
      4

