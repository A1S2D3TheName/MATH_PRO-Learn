  - Первый столб участка — {{a}}, последний — {{b}}.
  solution: |
    ### Ответ
    Число столбов от {{a}} до {{b}} включительно.

    ### Идея
    Концы участка входят в счёт.

    ### Шаги
    1. Перечисляем столбы.
