  prompt: От каждого столба этого участка в одну сторону, под прямым углом к трамвайной линии, отходит переулок.
    Сколько прямых углов образуют переулки с трамвайной линией?
  answer: 6
  variants:
  - params:
      a: 4
      b: 6
      k: 3
    answer: 6
    solution: |
      ### Ответ
      6

      ### Идея
      Переулок, отходящий под прямым углом, образует с линией два прямых угла и один развёрнутый.

      ### Шаги
      1. Переулков столько же, сколько столбов участка, — 3 (шаг F-01).
      2. У каждого переулка два прямых угла с линией — по обе стороны; развёрнутый угол не считаем.
      3. 3 переулка по 2 прямых угла — 6.

      ### Проверка
      Модель прямого угла прикладывается у каждого переулка дважды — 6 положений.

      ### Типичная ошибка
      Посчитать прямым и развёрнутый угол и получить 9 (E-geom-basic-shapes-right-as-straight).
