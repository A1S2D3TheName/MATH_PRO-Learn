  prompt: На каждом столбе этого участка висит фонарь. Электрик соединяет проводом каждые два фонаря участка — отдельный
    провод для каждой пары. Сколько проводов понадобится? Число фонарей возьмите из предыдущего шага.
  answer: 3
  variants:
  - params:
      a: 4
      b: 6
      n: 3
    answer: 3
    solution: |
      ### Ответ
      3

      ### Идея
      Провод соединяет пару фонарей; пары перебираем по порядку.

      ### Шаги
      1. Фонарей столько же, сколько столбов участка, — 3 (шаг F-01).
      2. Назовём фонари A, B и C; пары: от A: AB, AC; от B: BC.
      3. Пар, а значит, проводов — 3.

      ### Проверка
      Сгруппируйте провода по длине: между соседними фонарями 2, через один — 1 и так далее до одного самого длинного — вместе снова 3.

      ### Типичная ошибка
      Соединить только соседние фонари (2, E-geom-basic-shapes-neighbors-only) или посчитать каждую пару дважды (6, E-geom-basic-shapes-pair-twice).
