    prompt: Две прямые пересекаются в точке $K$, которая не отмечена. На первой прямой отмечено 2 точки, на второй
      — 5 точек. Сколько отрезков с концами в отмеченных точках целиком лежит на одной из этих прямых?
    answer: 11
    hints:
    - Отрезок между точками разных прямых не лежит ни на одной из них.
    - Переберите пары точек сначала на одной прямой, потом на другой.
    - 'Начните с прямой, на которой 2 точки: выпишите пары её точек.'
    solution: |
      ### Ответ
      11

      ### Идея
      Считаем пары точек на каждой прямой отдельно; отрезки между прямыми не подходят.

      ### Шаги
      1. Первая прямая: 2 точки — 1 отрезок.
      2. Вторая прямая: 5 точек — 10 отрезков.
      3. Продолжаем счёт: 1 и ещё 10 — всего 11.

      ### Проверка
      Перечислите пары точек на каждой прямой по порядку и сосчитайте записи.

      ### Типичная ошибка
      Добавить отрезки, соединяющие точки разных прямых.
