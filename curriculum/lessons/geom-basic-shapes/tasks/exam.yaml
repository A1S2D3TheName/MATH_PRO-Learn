      correct: 'Верно: 1 отрезок на первой прямой и 10 на второй.'
      wrong:
        what: Число отрезков не совпало.
        why: Возможно, в счёт попали отрезки между точками разных прямых.
        fix: Выпишите пары точек первой прямой, затем второй, и сосчитайте.
        next: Разберите пример 1 раздела T05.
