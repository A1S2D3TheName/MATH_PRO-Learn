# Контрольная (STANDARD.md §8, правила 80–81, 172–175): варианты A и B по 15 задач, 34 минуты,
# 20 баллов. У каждого outcome в каждом варианте — 2 procedure, meaning, method, transfer.
# Уровни не убывают. Задачи с детекторами имеют один вариант с params, чтобы детектор
# связывался с формулой каталога (§7, правило 165).
variants:
- id: A
  tasks:
  - id: EA-01
    type: match
    role: exam
    purpose: procedure
    level: 0
    outcome: LO-02
    sections:
    - T02
    minutes: 1
    points: 1
    prompt: Сопоставьте запись угла и букву его вершины. Одна буква справа лишняя.
    left:
    - id: a1
      text: $\angle BCD$
    - id: a2
      text: $\angle STU$
    - id: a3
      text: $\angle FGH$
    right:
    - id: v-c
      text: $C$
    - id: v-t
      text: $T$
    - id: v-g
      text: $G$
    - id: v-b
      text: $B$
    answer:
    - left: a1
      right: v-c
    - left: a2
      right: v-t
    - left: a3
      right: v-g
    hints:
    - Вершина угла — общее начало его сторон.
    - В записи из трёх букв вершина стоит в середине.
    - Посмотрите на вторую из 3 букв записи $\angle BCD$.
    solution: |
      ### Ответ
      $\angle BCD$ — вершина $C$; $\angle STU$ — вершина $T$; $\angle FGH$ — вершина $G$; буква $B$ лишняя.

      ### Идея
      Вершина — средняя буква записи угла.

      ### Шаги
      1. В $\angle BCD$ средняя буква — $C$.
      2. В $\angle STU$ средняя буква — $T$.
      3. В $\angle FGH$ средняя буква — $G$.

      ### Проверка
      Прочитайте каждую запись в обратном порядке: средняя буква не меняется.

      ### Типичная ошибка
      Принять за вершину первую букву записи, например $B$.
    feedback:
      correct: 'Верно: в записях $\angle BCD$, $\angle STU$, $\angle FGH$ вершины — средние буквы.'
      wrong:
        what: Какая-то вершина выбрана неверно.
        why: Возможно, за вершину принята крайняя буква.
        fix: Найдите в каждой записи среднюю букву.
        next: Перечитайте карточку раздела T02.
  - id: EA-02
    type: set
    role: exam
    purpose: procedure
    level: 0
    outcome: LO-01
    sections:
    - T01
    minutes: 1
    points: 1
    prompt: На числовом луче отмечены точки 3, 7, 10, 14 и 18. Какие из них лежат на отрезке с концами 7 и 14? Перечислите
      координаты через точку с запятой.
    answer:
    - 7
    - 10
    - 14
    hints:
    - Отрезку принадлежат его концы и всё между ними.
    - Сравните каждую точку с обоими концами.
    - 'Начните с точки 3: где она относительно конца 7?'
    solution: |
      ### Ответ
      7, 10, 14

      ### Идея
      Отрезок с концами 7 и 14 — это концы и все точки между ними.

      ### Шаги
      1. Концы 7 и 14 принадлежат отрезку, точки между ними — тоже.
      2. Точки 3 и 18 лежат за концами — не на отрезке.
      3. На отрезке: 7, 10 и 14.

      ### Проверка
      Пройдите по лучу от 7 до 14: по пути встретятся 7, 10 и 14.

      ### Типичная ошибка
      Не включить концы отрезка (E-geom-basic-shapes-ends-excluded).
    feedback:
      correct: 'Верно: на отрезке с концами 7 и 14 лежат 7, 10 и 14.'
      wrong:
        what: Набор точек не совпал.
        why: Возможно, пропущен конец отрезка или взята точка за его пределами.
        fix: Сравните каждую точку с обоими концами и не забудьте сами концы.
        next: Перечитайте выжимку раздела T01.
  - id: EA-03
    type: number
    role: exam
    purpose: procedure
    level: 1
    outcome: LO-01
    sections:
    - T01
    minutes: 2
    points: 1
    prompt: Какое количество отметок числового луча попадает на отрезок с концами {{a}} и {{b}}, если концы тоже
      считать?
    answer: 9
    variants:
    - params:
        a: 4
        b: 12
      answer: 9
      solution: |
        ### Ответ
        9

        ### Идея
        Считаем отметки вместе с концами, а не шаги между ними.

        ### Шаги
        1. Отметки от 4 до 12: 4, 5, 6, 7, 8, 9, 10, 11, 12.
        2. Их 9.

        ### Проверка
        Шагов между соседними отметками 8, отметок на одну больше — 9.

        ### Типичная ошибка
        Посчитать шаги (8, E-geom-basic-shapes-gaps-not-marks) или пропустить концы (7, E-geom-basic-shapes-ends-excluded).
    hints:
    - Концы отрезка тоже считаются.
    - Перечислите отметки подряд от левого конца.
    - Первая отметка — {{a}}, последняя — {{b}}.
    solution: |
      ### Ответ
      Число отметок от {{a}} до {{b}} включительно.

      ### Идея
      Концы входят в отрезок.

      ### Шаги
      1. Перечисляем отметки.
      2. Считаем.

      ### Проверка
      Отметок на одну больше, чем шагов.

      ### Типичная ошибка
      Посчитать шаги (E-geom-basic-shapes-gaps-not-marks).
    feedback:
      correct: 'Верно: от 4 до 12 посчитаны все отметки вместе с концами.'
      wrong:
        what: Число отметок не совпало.
        why: Возможно, посчитаны шаги или потеряны концы.
        fix: Перечислите вслух отметки от {{a}} до {{b}} и сосчитайте.
        next: Перечитайте предупреждение об отметках и шагах в разделе T01.
      misconceptions:
      - id: E-geom-basic-shapes-gaps-not-marks
        when:
          expr: b - a
        message: Похоже, посчитаны шаги между отметками, а не сами отметки.
      - id: E-geom-basic-shapes-ends-excluded
        when:
          expr: b - a - 1
        message: Похоже, концы отрезка не посчитаны.
  - id: EA-04
    type: number
    role: exam
    purpose: procedure
    level: 1
    outcome: LO-02
    sections:
    - T03
    minutes: 2
    points: 1
    prompt: Вдоль прямой линии бордюра вкопаны {{k|pl:столбик,столбика,столбиков}} ограждения, каждый под прямым
      углом к бордюру. Сколько прямых углов образуют столбики с линией бордюра?
    answer: 16
    variants:
    - params:
        k: 8
      answer: 16
      solution: |
        ### Ответ
        16

        ### Идея
        Там, где столбик касается прямой, два прямых угла и один развёрнутый.

        ### Шаги
        1. Столбик с каждой половиной линии бордюра образует прямой угол — два прямых угла.
        2. Две половины линии бордюра вместе — развёрнутый угол, он не прямой.
        3. 8 столбиков по 2 прямых угла — 16.

        ### Проверка
        Модель прямого угла прикладывается у каждой опоры дважды — 16 раз.

        ### Типичная ошибка
        Считать развёрнутые углы прямыми и получить 24 (E-geom-basic-shapes-right-as-straight).
    hints:
    - Разберите углы у основания одного столбика.
    - 'Столбик и две половины линии бордюра: сколько среди этих углов прямых?'
    - У одного столбика прямых углов два; столбиков {{k}}.
    solution: |
      ### Ответ
      По два прямых угла у каждой опоры.

      ### Идея
      Развёрнутый угол не прямой.

      ### Шаги
      1. Два прямых угла у опоры.
      2. Считаем у всех.

      ### Проверка
      Модель прикладывается дважды.

      ### Типичная ошибка
      Считать развёрнутые прямыми (E-geom-basic-shapes-right-as-straight).
    feedback:
      correct: 'Верно: у каждой из опор по два прямых угла, всего 16.'
      wrong:
        what: Число прямых углов не совпало.
        why: Возможно, развёрнутые углы посчитаны прямыми.
        fix: В месте, где столбик касается прямой, найдите два прямых угла и один развёрнутый.
        next: Перечитайте предупреждение о прямом и развёрнутом угле в разделе T03.
      misconceptions:
      - id: E-geom-basic-shapes-right-as-straight
        when:
          expr: 3 * k
        message: Похоже, развёрнутый угол у опоры посчитан прямым.
  - id: EA-05
    type: number
    role: exam
    purpose: procedure
    level: 1
    outcome: LO-03
    sections:
    - T05
    minutes: 2
    points: 1
    prompt: Из центра циферблата проведены {{n|pl:луч,луча,лучей}} — на отметки 1, 2, 3, 4 и 5. Каждая пара лучей
      образует угол. Сколько всего углов?
    answer: 10
    variants:
    - params:
        n: 5
      answer: 10
      solution: |
        ### Ответ
        10

        ### Идея
        Угол — пара лучей с общим началом; пары перебираем по порядку.

        ### Шаги
        1. Пары: с лучом на 1: 1–2, 1–3, 1–4, 1–5; с лучом на 2: 2–3, 2–4, 2–5; с лучом на 3: 3–4, 3–5; с лучом на 4: 4–5.
        2. Пар 10 — столько и углов.

        ### Проверка
        Каждый луч входит в 4 пары — с каждым из остальных лучей.

        ### Типичная ошибка
        Посчитать только соседние углы (4, E-geom-basic-shapes-neighbors-only) или каждый угол дважды (20, E-geom-basic-shapes-pair-twice).
    hints:
    - Угол задаётся парой лучей.
    - 'Перебирайте пары: первый луч с каждым следующим, затем второй.'
    - Выпишите все пары с лучом на отметку 1.
    solution: |
      ### Ответ
      Число пар лучей; лучей {{n}}.

      ### Идея
      Угол — пара лучей.

      ### Шаги
      1. Перебираем пары.
      2. Считаем.

      ### Проверка
      Каждый луч в одинаковом числе пар.

      ### Типичная ошибка
      Только соседние пары (E-geom-basic-shapes-neighbors-only).
    feedback:
      correct: 'Верно: лучи на отметки 1, 2, 3, 4 и 5 дают 10 разных пар.'
      wrong:
        what: Число углов не совпало.
        why: Возможно, посчитаны только соседние углы или пара взята дважды.
        fix: Выпишите пары лучей по порядку и сосчитайте.
        next: Разберите пример 2 раздела T05.
      misconceptions:
      - id: E-geom-basic-shapes-neighbors-only
        when:
          expr: n - 1
        message: Похоже, посчитаны только углы между соседними лучами.
      - id: E-geom-basic-shapes-pair-twice
        when:
          expr: n * (n - 1)
        message: Похоже, каждый угол посчитан дважды.
  - id: EA-06
    type: number
    role: exam
    purpose: meaning
    level: 2
    outcome: LO-01
    sections:
    - T04
    minutes: 2
    points: 1
    trivial_answer_ok: true
    prompt: На клетчатом листе две прямые; на чертеже они не встречаются, одна идёт выше другой. У левого края чертежа
      просвет между ними 5 клеток, у правого — 2 клетки. Сколько общих точек у этих прямых?
    answer: 1
    hints:
    - Судите по просвету, а не по рисунку.
    - Меняется просвет — прямые встретятся; не меняется — нет.
    - Сравните просветы 5 и 2.
    solution: |
      ### Ответ
      1

      ### Идея
      Разный просвет — прямые сближаются и встречаются в одной точке.

      ### Шаги
      1. Просвет 5 у левого края и 2 у правого — разный.
      2. Прямые сойдутся справа, там, где просвет меньше.
      3. Общая точка одна.

      ### Проверка
      Двух общих точек у разных прямых не бывает, а при одинаковом просвете не было бы ни одной.

      ### Типичная ошибка
      Ответить 0, потому что на чертеже прямые не встретились.
    feedback:
      correct: 'Верно: просветы 5 и 2 показывают, сближаются ли прямые.'
      wrong:
        what: Число общих точек не совпало.
        why: Возможно, вывод сделан по рисунку.
        fix: Сравните просветы у левого и правого края.
        next: Перечитайте признак на клетчатом листе в разделе T04.
  - id: EA-07
    type: number
    role: exam
    purpose: transfer
    level: 2
    outcome: LO-01
    sections:
    - T04
    minutes: 2
    points: 1
    trivial_answer_ok: true
    prompt: На клетчатом листе три прямые; на чертеже они не встречаются, первая выше второй, вторая выше третьей.
      Просвет между первой и второй прямыми у левого края — 2 клетки, у правого — 2 клетки. Между второй и третьей
      — 4 клетки слева и 1 клетка справа. Сколько точек пересечения у этих трёх прямых?
    answer: 2
    hints:
    - Для каждой пары соседних прямых решите по просвету, пересекаются ли они.
    - Прямые с одинаковым просветом идут в одном направлении; прямая другого направления пересекает каждую из них.
    - 'Просвет между первой и второй прямыми: 2 и 2 — одинаковый или нет?'
    solution: |
      ### Ответ
      2

      ### Идея
      О пересечении каждой пары прямых судим по просвету.

      ### Шаги
      1. Просвет между первой и второй прямыми одинаковый — они не пересекаются.
      2. Просвет между второй и третьей прямыми меняется — они пересекаются.
      3. Две прямые идут в одном направлении, третья — в другом и пересекает каждую из них в своей точке: точек 2.

      ### Проверка
      Две прямые с одинаковым просветом не встречаются, поэтому трёх точек быть не может; а третья прямая сближается со второй и, значит, сближается и с первой, которая идёт рядом со второй: точек ровно две.

      ### Типичная ошибка
      Посчитать точкой пересечения и пару прямых с одинаковым просветом.
    feedback:
      correct: 'Верно: по просветам видно, что две прямые идут в одном направлении, а третья их пересекает.'
      wrong:
        what: Число точек пересечения не совпало.
        why: Возможно, пересекающимися посчитаны прямые с одинаковым просветом или наоборот.
        fix: Разберите по просвету каждую пару соседних прямых, затем первую и третью.
        next: Перечитайте признак на клетчатом листе в разделе T04.
  - id: EA-08
    type: numbers
    role: exam
    purpose: meaning
    level: 2
    outcome: LO-02
    sections:
    - T02
    - T03
    minutes: 2
    points: 1
    prompt: 'Через центр циферблата проведены две прямые: через отметки 12 и 6 и через отметки 4 и 10. Сколько среди
      четырёх углов между соседними лучами острых, прямых и тупых?'
    fields:
    - id: acute
      label: Острых
    - id: right
      label: Прямых
    - id: obtuse
      label: Тупых
    answer:
      acute: 2
      right: 0
      obtuse: 2
    hints:
    - Две прямые через центр дают четыре луча и четыре угла между соседними лучами.
    - Каждый угол сравните с прямым углом между отметками 12 и 3.
    - 'Расставьте лучи по кругу: 12, 4, 6 и 10 — и начните с угла между 12 и 4.'
    solution: |
      ### Ответ
      Острых — 2, прямых — 0, тупых — 2.

      ### Идея
      Сравниваем каждый из четырёх углов с прямым углом «12 — 3».

      ### Шаги
      1. Лучи по кругу: 12, 4, 6 и 10.
      2. Углы между соседними лучами: 12 и 4 — тупой; 4 и 6 — острый; 6 и 10 — тупой; 10 и 12 — острый.

      ### Проверка
      Приложите модель прямого угла к каждому лучу: острый угол помещается в модели, тупой — нет.

      ### Типичная ошибка
      Считать все четыре угла одинаковыми, не сравнив каждый с моделью.
    feedback:
      correct: 'Верно: прямые через 12–6 и 4–10 дают острых 2, тупых 2.'
      wrong:
        what: Число углов какого-то вида не совпало.
        why: Возможно, перепутаны острый и тупой углы.
        fix: Расставьте лучи по кругу и сравните каждый угол с прямым углом «12 — 3».
        next: Перечитайте таблицу видов углов в разделе T03.
  - id: EA-09
    type: number
    role: exam
    purpose: meaning
    level: 2
    outcome: LO-03
    sections:
    - T05
    minutes: 2
    points: 1
    trivial_answer_ok: true
    prompt: Из точки $O$ выходят 5 лучей, и все углы между ними уже посчитаны. Из точки $O$ провели ещё один луч,
      который не лежит на одной прямой ни с одним из прежних. Сколько новых углов появилось?
    answer: 5
    hints:
    - Новые углы — только те, у которых одна сторона — новый луч.
    - Вторая сторона нового угла — один из прежних лучей.
    - Назовите новый луч $OX$ и выпишите его углы с каждым из 5 прежних лучей.
    solution: |
      ### Ответ
      5

      ### Идея
      Новый угол — пара «новый луч и один из прежних».

      ### Шаги
      1. Прежние углы не меняются.
      2. Новый луч $OX$ образует угол с каждым прежним лучом: $\angle XOA$, $\angle XOB$, $\angle XOC$, $\angle XOD$ и $\angle XOE$.
      3. Новых углов 5.

      ### Проверка
      Было 10 углов, стало 15; среди них ровно 5 со стороной $OX$.

      ### Типичная ошибка
      Назвать общее число углов вместо числа новых.
    feedback:
      correct: 'Верно: новый луч образует по углу с каждым из 5 прежних лучей.'
      wrong:
        what: Число новых углов не совпало.
        why: Возможно, посчитаны все углы, а не только новые.
        fix: Посчитайте углы, у которых одна сторона — новый луч.
        next: Перечитайте раздел T05.
  - id: EA-10
    type: number
    role: exam
    purpose: procedure
    level: 2
    outcome: LO-03
    sections:
    - T05
    minutes: 2
    points: 1
    prompt: На прямой отмечено {{n|pl:точка,точки,точек}}. Сколько всего существует отрезков, оба конца которых
      — отмеченные точки?
    answer: 15
    variants:
    - params:
        n: 6
      answer: 15
      solution: |
        ### Ответ
        15

        ### Идея
        Отрезок задаётся парой концов; пары перебираем вперёд по списку точек.

        ### Шаги
        1. Назовём точки A, B, C, D, E и F.
        2. Пары: от A: AB, AC, AD, AE, AF; от B: BC, BD, BE, BF; от C: CD, CE, CF; от D: DE, DF; от E: EF.
        3. Пар 15.

        ### Проверка
        Каждая точка входит в 5 пар — с каждой другой точкой.

        ### Типичная ошибка
        Посчитать только соседние отрезки (5, E-geom-basic-shapes-neighbors-only) или каждую пару дважды (30, E-geom-basic-shapes-pair-twice).
    hints:
    - Отрезок задаётся парой концов.
