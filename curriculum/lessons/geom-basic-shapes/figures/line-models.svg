<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" role="img" aria-labelledby="title desc">
<title id="title">Отрезок, луч и прямая</title>
<desc id="desc">Отрезок AB ограничен двумя концами. Луч OA начинается в O и идёт через A вправо. Прямая AB продолжается в обе стороны.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#17364b"/></marker></defs>
<rect width="700" height="240" fill="#f4f7f9"/>
<g stroke="#17364b" stroke-width="3"><path d="M240 50H520"/><path d="M240 120H640" marker-end="url(#arrow)"/><path d="M200 190H640" marker-start="url(#arrow)" marker-end="url(#arrow)"/></g>
<g fill="#17364b"><circle cx="240" cy="50" r="5"/><circle cx="520" cy="50" r="5"/><circle cx="240" cy="120" r="5"/><circle cx="480" cy="120" r="5"/><circle cx="300" cy="190" r="5"/><circle cx="520" cy="190" r="5"/></g>
<g font-family="sans-serif" font-size="22" fill="#17364b"><text x="24" y="57">Отрезок AB</text><text x="24" y="127">Луч OA</text><text x="24" y="197">Прямая AB</text><text x="230" y="33">A</text><text x="510" y="33">B</text><text x="230" y="103">O</text><text x="470" y="103">A</text><text x="290" y="173">A</text><text x="510" y="173">B</text></g>
</svg>
