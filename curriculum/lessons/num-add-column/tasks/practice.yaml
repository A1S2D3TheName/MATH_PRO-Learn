          1. Разряд единиц: $6 - 2 = 4$.
          2. Разряд десятков: $7 - 3 = 4$.
          3. Разряд сотен: $9 - 4 = 5$.
          4. Разряд тысяч: $8 - 5 = 3$.
          5. Разряд десятков тысяч: $4 - 0 = 4$.

          ### Проверка
          Проверка сложением: $43544 + 5432 = 48976$ — получилось уменьшаемое.

          ### Типичная ошибка
          E-num-add-column-misaligned: записать 5432 с левого края. Тогда вычитать пришлось бы 54320, а это больше 48976 — значит, числа записаны не по разрядам.
