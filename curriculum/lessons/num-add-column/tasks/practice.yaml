# Практика темы (STANDARD.md §8): лестница уровней — warmup, supported, independent,
# challenge. Тексты шагов посчитаны алгоритмом столбиком; пересчёт — verify.py.
tasks:
  - id: P-01
    type: number
    role: warmup
    purpose: procedure
    level: 0
    outcome: LO-01
    sections:
      - T01
    minutes: 1
    prompt: "Запишите сумму столбиком и вычислите: {{a}} + {{b}}."
    answer: 367
    variants:
      - params:
          a: 342
          b: 25
        answer: 367
        solution: |
          ### Ответ
          367

          ### Идея
          Число 25 короче, поэтому его правая цифра встаёт под правой цифрой 342, а место под сотнями остаётся пустым. Дальше складываем столбцы справа налево.

          ### Шаги
          1. Разряд единиц: $2 + 5 = 7$ — пишем 7, переносить нечего.
          2. Разряд десятков: $4 + 2 = 6$ — пишем 6, переносить нечего.
          3. Разряд сотен: у второго числа цифры нет — переписываем 3.

          ### Проверка
          Проверка вычитанием: $367 - 25 = 342$ — получилось первое слагаемое.

          ### Типичная ошибка
          E-num-add-column-misaligned: записать 25 с левого края, под старшими цифрами 342. Тогда на самом деле складывают 342 и 250 и получают 592 вместо 367.
      - params:
          a: 513
          b: 46
        answer: 559
        solution: |
          ### Ответ
          559

          ### Идея
          Число 46 короче, поэтому его правая цифра встаёт под правой цифрой 513, а место под сотнями остаётся пустым. Дальше складываем столбцы справа налево.

          ### Шаги
          1. Разряд единиц: $3 + 6 = 9$ — пишем 9, переносить нечего.
          2. Разряд десятков: $1 + 4 = 5$ — пишем 5, переносить нечего.
          3. Разряд сотен: у второго числа цифры нет — переписываем 5.

          ### Проверка
          Проверка вычитанием: $559 - 46 = 513$ — получилось первое слагаемое.

          ### Типичная ошибка
          E-num-add-column-misaligned: записать 46 с левого края, под старшими цифрами 513. Тогда на самом деле складывают 513 и 460 и получают 973 вместо 559.
