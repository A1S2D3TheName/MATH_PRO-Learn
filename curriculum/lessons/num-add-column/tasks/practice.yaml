      - params:
          a: 48976
          b: 5432
        answer: 43544
        solution: |
          ### Ответ
          43544

          ### Идея
          Вычитаемое 5432 короче, его правую цифру ставим под правой цифрой 48976. В каждом столбце верхняя цифра не меньше нижней, поэтому занимать не нужно.

