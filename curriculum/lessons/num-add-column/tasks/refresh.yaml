          3. Разряд сотен: здесь был 0, он разменял единицу старшего разряда и отдал одну дальше — осталось 9: $9 - 8 = 1$.
          4. Разряд тысяч: цифра 5 отдала единицу, осталось 4: $4 - 1 = 3$.

