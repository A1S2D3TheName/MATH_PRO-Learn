  - id: R-02
    type: number
    role: refresh
    purpose: procedure
    level: 2
    outcome: LO-02
    sections:
      - T02
    minutes: 2
    prompt: "Вычислите столбиком: {{a}} + {{b}}."
    answer: 4222
    variants:
      - params:
          a: 2768
          b: 1454
        answer: 4222
        solution: |
          ### Ответ
          4222

          ### Идея
          Перенос возникает в трёх столбцах подряд: каждый раз пишем цифру единиц суммы, а десяток прибавляем в следующем столбце.

          ### Шаги
          1. Разряд единиц: $8 + 4 = 12$ — пишем 2, переносим 1.
          2. Разряд десятков: $6 + 5 + 1 = 12$ — пишем 2, переносим 1.
          3. Разряд сотен: $7 + 4 + 1 = 12$ — пишем 2, переносим 1.
          4. Разряд тысяч: $2 + 1 + 1 = 4$ — пишем 4, переносить нечего.

          ### Проверка
          Проверка вычитанием: $4222 - 1454 = 2768$ — получилось первое слагаемое.

          ### Типичная ошибка
          E-num-add-column-carry-lost-units: не прибавить в разряде десятков единицу, перенесённую из единиц, — получится 4212, на 10 меньше верного.
