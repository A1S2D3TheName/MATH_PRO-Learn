# Повторение темы (STANDARD.md §8): короткие задачи на ключевые приёмы столбика.
tasks:
  - id: R-01
    type: number
    role: refresh
    purpose: procedure
    level: 1
    outcome: LO-01
    sections:
      - T01
    minutes: 2
    prompt: "Найдите сумму, записав числа столбиком: {{a}} + {{b}}."
    answer: 5887
    variants:
      - params:
          a: 5214
          b: 673
        answer: 5887
        solution: |
          ### Ответ
          5887

          ### Идея
          Трёхзначное 673 выравниваем по разряду единиц числа 5214; переносов нет.

          ### Шаги
          1. Разряд единиц: $4 + 3 = 7$ — пишем 7, переносить нечего.
          2. Разряд десятков: $1 + 7 = 8$ — пишем 8, переносить нечего.
          3. Разряд сотен: $2 + 6 = 8$ — пишем 8, переносить нечего.
          4. Разряд тысяч: у второго числа цифры нет — переписываем 5.

          ### Проверка
          Проверка вычитанием: $5887 - 673 = 5214$ — получилось первое слагаемое.

          ### Типичная ошибка
          E-num-add-column-misaligned: записать 673 с левого края, под старшими цифрами 5214. Тогда на самом деле складывают 5214 и 6730 и получают 11944 вместо 5887.
      - params:
          a: 3402
          b: 586
        answer: 3988
        solution: |
          ### Ответ
          3988

          ### Идея
          Трёхзначное 586 выравниваем по разряду единиц числа 3402; переносов нет.

          ### Шаги
          1. Разряд единиц: $2 + 6 = 8$ — пишем 8, переносить нечего.
          2. Разряд десятков: $0 + 8 = 8$ — пишем 8, переносить нечего.
          3. Разряд сотен: $4 + 5 = 9$ — пишем 9, переносить нечего.
          4. Разряд тысяч: у второго числа цифры нет — переписываем 3.

          ### Проверка
