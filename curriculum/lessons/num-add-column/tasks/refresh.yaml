        solution: |
          ### Ответ
          356

          ### Идея
          Занимаем дважды: у десятков и у сотен; каждый разряд, у которого заняли, уменьшаем.

          ### Шаги
          1. Разряд единиц: $4 < 8$ — занимаем единицу у разряда десятков: $14 - 8 = 6$.
