  - id: R-03
    type: number
    role: refresh
    purpose: procedure
    level: 2
    outcome: LO-02
    sections:
      - T03
    minutes: 3
    prompt: "Найдите разность, записав числа столбиком: {{a}} − {{b}}."
    answer: 543
    variants:
      - params:
          a: 900
          b: 357
        answer: 543
        solution: |
          ### Ответ
          543

          ### Идея
          Занимаем у ближайшего ненулевого разряда, каждый ноль на пути становится девяткой.

          ### Шаги
          1. Разряд единиц: $0 < 7$ — занимаем единицу у разряда сотен через ноль в разряде десятков: $10 - 7 = 3$.
          2. Разряд десятков: здесь был 0, он разменял единицу старшего разряда и отдал одну дальше — осталось 9: $9 - 5 = 4$.
          3. Разряд сотен: цифра 9 отдала единицу, осталось 8: $8 - 3 = 5$.

          ### Проверка
          Проверка сложением: $543 + 357 = 900$ — получилось уменьшаемое.

          ### Типичная ошибка
          E-num-add-column-zero-chain: оставить в разряде десятков 10 вместо 9 — получится 553, на 10 больше верного.
