          wrong:
            what: Разность не совпала с вычислением по разрядам.
            why: Возможно, разряд, у которого заняли, не уменьшен.
            fix: Надписывайте уменьшенную цифру над каждым разрядом, у которого занимали.
            next: "Раздел T02: занятие разряда."
