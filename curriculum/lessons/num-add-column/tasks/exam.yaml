          Занимаем трижды подряд; каждый разряд, у которого заняли, уменьшаем на единицу.

          ### Шаги
          1. Разряд единиц: $5 < 8$ — занимаем единицу у разряда десятков: $15 - 8 = 7$.
          2. Разряд десятков: цифра 3 отдала единицу, осталось 2; $2 < 7$ — занимаем единицу у разряда сотен: $12 - 7 = 5$.
          3. Разряд сотен: цифра 1 отдала единицу, осталось 0; $0 < 6$ — занимаем единицу у разряда тысяч: $10 - 6 = 4$.
          4. Разряд тысяч: цифра 9 отдала единицу, осталось 8: $8 - 4 = 4$.

          ### Проверка
          Проверка сложением: $4457 + 4678 = 9135$ — получилось уменьшаемое.

          ### Типичная ошибка
          E-num-add-column-borrow-unused: занять единицу у разряда сотен и не уменьшить его цифру — получится 4557, на 100 больше верного.
        feedback:
