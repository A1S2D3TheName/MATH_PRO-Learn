        solution: |
          ### Ответ
          7365

          ### Идея
          Переносы возникают в трёх столбцах подряд: пишем цифру единиц суммы, десяток прибавляем в следующем столбце.

          ### Шаги
          1. Разряд единиц: $8 + 7 = 15$ — пишем 5, переносим 1.
          2. Разряд десятков: $6 + 9 + 1 = 16$ — пишем 6, переносим 1.
          3. Разряд сотен: $7 + 5 + 1 = 13$ — пишем 3, переносим 1.
          4. Разряд тысяч: $4 + 2 + 1 = 7$ — пишем 7, переносить нечего.

          ### Проверка
          Проверка вычитанием: $7365 - 2597 = 4768$ — получилось первое слагаемое.

          ### Типичная ошибка
          E-num-add-column-carry-lost-tens: потерять перенос из разряда десятков в разряд сотен — получится 7265, на 100 меньше верного.
        feedback:
          correct: 'Верно: все три переноса прибавлены в своих столбцах: ответ 7365.'
          wrong:
            what: Сумма не совпала с вычислением по разрядам.
            why: Возможно, один из переносов потерян.
            fix: Пересчитайте столбцы и прибавьте каждую перенесённую единицу.
            next: "Раздел T02: перенос через разряд."
