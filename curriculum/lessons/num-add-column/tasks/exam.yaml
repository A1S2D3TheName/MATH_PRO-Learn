        prompt: "Запишите разность столбиком и вычислите: 58 697 − 6354."
        answer: 52343
        hints:
          - Вычитаемое ставят под уменьшаемым по разрядам.
          - В каждом столбце верхняя цифра не меньше нижней.
          - 'Начните с единиц: $7 - 4$.'
        solution: |
          ### Ответ
          52343

          ### Идея
          Вычитаемое выравниваем по единицам; в каждом столбце верхняя цифра не меньше нижней, занимать не нужно.

          ### Шаги
          1. Разряд единиц: $7 - 4 = 3$.
          2. Разряд десятков: $9 - 5 = 4$.
          3. Разряд сотен: $6 - 3 = 3$.
          4. Разряд тысяч: $8 - 6 = 2$.
          5. Разряд десятков тысяч: $5 - 0 = 5$.

          ### Проверка
          Проверка сложением: $52343 + 6354 = 58697$ — получилось уменьшаемое.

          ### Типичная ошибка
          E-num-add-column-misaligned: записать 6354 с левого края. Тогда вычитать пришлось бы 63540, а это больше 58697 — значит, числа записаны не по разрядам.
        feedback:
          correct: 'Верно: столбцы выровнены по разрядам и посчитаны без занятий: ответ 52343.'
          wrong:
            what: Разность не совпала с вычислением по разрядам.
            why: Возможно, вычитаемое записано не под своими разрядами.
            fix: Выровняйте числа по правой цифре и вычтите столбцы заново.
            next: "Раздел T01: запись столбиком по разрядам."
      - id: EA-03
        type: choice
        role: exam
        purpose: meaning
        level: 1
        outcome: LO-01
        sections:
          - T01
        minutes: 2
        points: 1
        prompt: "Числа 6083 и 59 складывают столбиком. Под какой цифрой числа 6083 встанет цифра 5?"
        options:
          - id: a
            text: Под цифрой 8, в разряде десятков.
            why: Цифра 5 числа 59 — десятки, она встаёт под десятками.
          - id: b
            text: Под цифрой 6, в разряде тысяч.
            misconception: E-num-add-column-misaligned
            why: 'Так встаёт число, записанное с левого края: 5 дала бы пять тысяч.'
          - id: c
            text: Под цифрой 0, в разряде сотен.
            misconception: E-num-add-column-misaligned
            why: 'Это сдвиг на столбец влево: 5 дала бы пять сотен.'
          - id: d
            text: Под цифрой 3, в разряде единиц.
            misconception: E-num-add-column-misaligned
            why: Под единицами встаёт цифра 9, а не 5.
        answer: a
        hints:
          - Определите разряд цифры 5 в числе 59.
          - Найдите цифру того же разряда в числе 6083.
          - 'Цифра 5 — не единицы числа 59: посмотрите, какая цифра стоит у 6083 в том же разряде.'
        solution: |
          ### Ответ
          Под цифрой 8, в разряде десятков.

          ### Идея
          Разряд цифры задаётся её местом в записи, поэтому цифру второго числа ставят под цифрой того же разряда первого числа.

          ### Шаги
          1. Цифра 5 в числе 59 стоит в разряде десятков.
          2. В числе 6083 в разряде десятков стоит цифра 8.
          3. Значит, цифра 5 встаёт под цифрой 8.

          ### Проверка
          Запись по разрядам: под единицами 3 встаёт 9, под десятками 8 — 5, а в сотнях и тысячах у числа 59 цифр нет.

          ### Типичная ошибка
          E-num-add-column-misaligned: выровнять 59 по левому краю — цифра 5 окажется под цифрой 6, в разряде тысяч.
        feedback:
          correct: 'Верно: цифра 5 — десятки, и она встаёт под десятками числа 6083.'
          wrong:
            what: Разряд выбран неверно.
            why: Возможно, короткое число выровнено по левому краю.
            fix: 'Отсчитайте разряды от правой цифры: единицы, десятки, сотни, тысячи.'
            next: "Раздел T01: запись столбиком по разрядам."
