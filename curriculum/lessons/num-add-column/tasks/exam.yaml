          - Число 7436 не меньше 7000.
        solution: |
          ### Ответ
          4000

          ### Идея
          Меньше всего разность при меньшем уменьшаемом и большем вычитаемом.

          ### Шаги
          1. 7436 не меньше 7000.
          2. 2785 меньше 3000.
          3. Нижняя граница: $7000 - 3000 = 4000$.

          ### Проверка
          Точный счёт: $7436 - 2785 = 4651$ — больше 4000.

          ### Типичная ошибка
          E-num-add-column-bound-one-side: взять $7000 - 2000 = 5000$ — это больше настоящей разности 4651, а не нижняя граница.
        feedback:
          correct: 'Верно: граница взята честно — уменьшаемое меньше, вычитаемое больше: ответ 4000.'
          wrong:
            what: Нижняя граница найдена неверно.
            why: Возможно, оба числа заменены меньшими круглыми тысячами.
            fix: Для нижней границы уменьшаемое берите меньше, а вычитаемое — больше.
            next: "Раздел T04: прикидка по старшему разряду."
