          Вычитание проверяют сложением: записанная разность плюс вычитаемое должны дать уменьшаемое.

          ### Шаги
          1. Складываем $3728 + 3586$.
          2. Разряд единиц: $8 + 6 = 14$ — пишем 4, переносим 1.
          3. Разряд десятков: $2 + 8 + 1 = 11$ — пишем 1, переносим 1.
          4. Разряд сотен: $7 + 5 + 1 = 13$ — пишем 3, переносим 1.
          5. Разряд тысяч: $3 + 3 + 1 = 7$ — пишем 7, переносить нечего.
          6. Сумма 7314 не равна уменьшаемому 7214 — запись неверна, верная разность 3628.

          ### Проверка
          Обратное действие: $7314 - 3586 = 3728$ — вернулась записанная разность.

          ### Типичная ошибка
          E-num-add-column-carry-lost-units: не прибавить в разряде десятков единицу, перенесённую из единиц, — получится 7304, на 10 меньше верного.
