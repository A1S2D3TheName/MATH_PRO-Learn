          4. Разряд сотен: цифра 3 отдала единицу, осталось 2; $2 < 8$ — занимаем единицу у разряда тысяч: $12 - 8 = 4$.
          5. Разряд тысяч: цифра 7 отдала единицу, осталось 6: $6 - 2 = 4$.

