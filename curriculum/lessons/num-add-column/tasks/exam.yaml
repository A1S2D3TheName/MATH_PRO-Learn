      - id: EA-01
        type: number
        role: exam
        purpose: procedure
        level: 1
        outcome: LO-01
        sections:
          - T01
        minutes: 2
        points: 1
        prompt: "Сложите столбиком: 6152 + 734."
        answer: 6886
        hints:
          - Правую цифру второго числа ставят под правой цифрой первого.
          - В разряде тысяч у числа 734 цифры нет.
          - 'Начните с единиц: $2 + 4$.'
        solution: |
          ### Ответ
          6886

          ### Идея
          734 короче — выравниваем по разряду единиц, переносов нет.

          ### Шаги
          1. Разряд единиц: $2 + 4 = 6$ — пишем 6, переносить нечего.
          2. Разряд десятков: $5 + 3 = 8$ — пишем 8, переносить нечего.
          3. Разряд сотен: $1 + 7 = 8$ — пишем 8, переносить нечего.
          4. Разряд тысяч: у второго числа цифры нет — переписываем 6.

          ### Проверка
          Проверка вычитанием: $6886 - 734 = 6152$ — получилось первое слагаемое.

          ### Типичная ошибка
          E-num-add-column-misaligned: записать 734 с левого края, под старшими цифрами 6152. Тогда на самом деле складывают 6152 и 7340 и получают 13492 вместо 6886.
        feedback:
          correct: 'Верно: 734 стоит под своими разрядами, тысячи переписаны: ответ 6886.'
          wrong:
            what: Сумма не совпала с вычислением по разрядам.
            why: Возможно, трёхзначное число записано с левого края.
            fix: Поставьте последнюю цифру второго числа под последней цифрой первого.
            next: "Раздел T01: запись столбиком по разрядам."
