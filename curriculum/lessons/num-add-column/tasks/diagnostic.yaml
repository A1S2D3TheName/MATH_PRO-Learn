# Диагностика пререквизитов (STANDARD.md §8): разряды многозначных чисел и сложение и
# вычитание в пределах 100. Ссылки на разделы — локальные (вопрос к стандарту, REPORT §5).
tasks:
  - id: D-01
    type: number
    role: diagnostic
    purpose: procedure
    level: 0
    outcome: num-place-large/LO-01
    sections:
      - T01
    minutes: 1
    prompt: "В записи числа 4 507 000 найдите цифру разряда тысяч и введите её."
    answer: 7
    hints:
      - Разряды считают справа налево, начиная с единиц.
      - Тысячи — четвёртый разряд справа.
      - Отсчитайте от правого края числа 4 507 000 четыре разряда.
    solution: |
      ### Ответ
      7

      ### Идея
      Разряд тысяч — четвёртый разряд справа; его цифра показывает, сколько в числе единиц тысяч.

      ### Шаги
      1. Считаем разряды справа налево: единицы, десятки, сотни, тысячи.
      2. В числе 4 507 000 на четвёртом месте справа стоит цифра 7.

      ### Проверка
      Разложение по разрядам: 4 507 000 = 4 000 000 + 500 000 + 7 000. Слагаемое 7 000 даёт 7 единиц тысяч.

      ### Типичная ошибка
      Считать разряды слева направо и назвать цифру 4 — это разряд миллионов.
    feedback:
      correct: Верно, в разряде тысяч стоит цифра 7.
      wrong:
        what: Названа другая цифра.
        why: Возможно, разряды посчитаны слева направо.
        fix: Отсчитайте от правого края четыре разряда и назовите цифру этого столбца.
        next: "Повторите разряды и классы в теме про многозначные числа."
  - id: D-02
    type: number
    role: diagnostic
    purpose: procedure
    level: 0
    outcome: num-place-large/LO-03
    sections:
      - T01
    minutes: 1
    prompt: "Число состоит из 6 единиц тысяч, 0 сотен, 3 десятков и 5 единиц. Введите это число."
    answer: 6035
    hints:
      - Каждая цифра записывается в свой разряд.
      - Ноль сотен — это цифра 0 в разряде сотен, её нельзя пропустить.
      - 'Запишите по порядку: 6 тысяч, 0 сотен, 3 десятка, 5 единиц.'
    solution: |
      ### Ответ
      6035

      ### Идея
      Число собирают из разрядных слагаемых: каждая цифра встаёт в свой разряд.

      ### Шаги
      1. Единицы тысяч — 6, значит первая цифра 6.
      2. Сотен нет — в разряде сотен стоит 0.
      3. Десятки — 3, единицы — 5.

      ### Проверка
      Разложение собранного числа: 6 035 = 6 000 + 0 + 30 + 5 — все разряды совпали с условием.

      ### Типичная ошибка
      Пропустить ноль сотен и записать 635: число станет трёхзначным и потеряет разряд тысяч.
    feedback:
      correct: Верно, все разряды записаны на своих местах.
      wrong:
        what: Число собрано неверно.
        why: Возможно, разряд сотен пропущен или цифры переставлены.
        fix: Выпишите разряды подряд от тысяч до единиц и поставьте ноль там, где разряд пуст.
        next: "Повторите разложение числа по разрядам."
  - id: D-03
    type: number
    role: diagnostic
    purpose: procedure
    level: 1
    outcome: num-add-100/LO-01
    sections:
      - T02
    minutes: 1
    prompt: "Вычислите 35 + 57."
    answer: 92
    hints:
      - Складывайте по разрядам, начиная с единиц.
      - В разряде единиц сумма больше десяти.
      - Десяток из суммы единиц 5 + 7 прибавьте к десяткам.
    solution: |
      ### Ответ
      92

      ### Идея
      Сложение с переходом через десяток: десять единиц заменяются одним десятком.

      ### Шаги
      1. Единицы: $5 + 7 = 12$ — пишем 2, а десяток прибавляем к десяткам.
      2. Десятки: $3 + 5 + 1 = 9$.

      ### Проверка
      Проверка вычитанием: $92 - 57 = 35$ — получилось первое слагаемое.

      ### Типичная ошибка
      Забыть десяток из суммы единиц и получить 82 — на десять меньше верного.
    feedback:
      correct: Верно, переход через десяток выполнен.
      wrong:
        what: Сумма не совпала.
        why: Возможно, десяток из суммы единиц не прибавлен к десяткам.
        fix: Сложите десятки вместе с десятком из единиц и проверьте вычитанием.
        next: "Повторите сложение с переходом через десяток."
  - id: D-04
    type: number
    role: diagnostic
    purpose: method
    level: 1
    outcome: num-add-100/LO-03
    sections:
      - T04
    minutes: 2
    prompt: "Петя записал: 81 − 43 = 42. Проверьте запись сложением и введите сумму, которая получится при проверке."
    answer: 85
    hints:
      - Проверка вычитания — сложение.
      - Складывают записанную разность и вычитаемое.
      - Сложите 42 и 43 и сравните с 81.
    solution: |
      ### Ответ
      85

      ### Идея
      Если разность записана верно, разность плюс вычитаемое дают уменьшаемое.

      ### Шаги
      1. Складываем записанную разность и вычитаемое: $42 + 43 = 85$.
      2. 85 не равно 81 — запись неверна.
      3. Верная разность: $81 - 43 = 38$, и $38 + 43 = 81$.

      ### Проверка
      Обратное действие к проверке: $85 - 43 = 42$ — вернулась записанная разность.

      ### Типичная ошибка
      E-num-add-column-digital-diff: в единицах вычесть 1 из 3 «наоборот», без занятия, — так и получилась запись 42; повторное вычитание тех же чисел эту ошибку только повторит.
    feedback:
      correct: Верно, сумма проверки 85 показывает, что запись неверна.
      wrong:
        what: Сумма проверки найдена неверно.
        why: Возможно, сложены не записанная разность и вычитаемое.
        fix: Сложите 42 и 43 и сравните результат с уменьшаемым.
        next: "Повторите проверку вычитания сложением."
