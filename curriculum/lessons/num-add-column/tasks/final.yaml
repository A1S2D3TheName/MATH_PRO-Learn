    minutes: 2
    depends_on:
      - F-02
    prompt: "Из всех полученных книг {{s|pl:книга оказалась,книги оказались,книг оказались}} повреждёнными, их вернули. Сколько книг осталось?"
    answer: 5636
    variants:
      - params:
          p1: 3152
          p2: 424
          p3: 3428
          s: 1368
        answer: 5636
        solution: |
          ### Ответ
          5636

          ### Идея
          Из всех полученных книг, 7004, убираем возвращённые; в числе 7004 нули, занимать придётся через них.

          ### Шаги
          1. Вычитаем: $7004 - 1368$.
          2. Разряд единиц: $4 < 8$ — занимаем единицу у разряда тысяч через нули в разрядах десятков и сотен: $14 - 8 = 6$.
          3. Разряд десятков: здесь был 0, он разменял единицу старшего разряда и отдал одну дальше — осталось 9: $9 - 6 = 3$.
          4. Разряд сотен: здесь был 0, он разменял единицу старшего разряда и отдал одну дальше — осталось 9: $9 - 3 = 6$.
          5. Разряд тысяч: цифра 7 отдала единицу, осталось 6: $6 - 1 = 5$.

          ### Проверка
          Проверка сложением: $5636 + 1368 = 7004$ — получилось число полученных книг.

          ### Типичная ошибка
          E-num-add-column-zero-chain: оставить в разряде десятков 10 вместо 9 — получится 5646, на 10 больше верного.
