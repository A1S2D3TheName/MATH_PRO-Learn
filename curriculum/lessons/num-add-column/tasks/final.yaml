    prompt: "Библиотека получила две партии книг: {{p1|pl:книгу,книги,книг}} и {{p2|pl:книгу,книги,книг}}. Сколько книг в двух партиях вместе?"
    answer: 3576
    variants:
      - params:
          p1: 3152
          p2: 424
        answer: 3576
        solution: |
          ### Ответ
          3576

          ### Идея
          Книги двух партий складываем; 424 короче, его выравниваем по разряду единиц.

          ### Шаги
          1. Разряд единиц: $2 + 4 = 6$ — пишем 6, переносить нечего.
          2. Разряд десятков: $5 + 2 = 7$ — пишем 7, переносить нечего.
          3. Разряд сотен: $1 + 4 = 5$ — пишем 5, переносить нечего.
          4. Разряд тысяч: у второго числа цифры нет — переписываем 3.

          ### Проверка
          Проверка вычитанием: $3576 - 424 = 3152$ — получилось первое слагаемое.

          ### Типичная ошибка
          E-num-add-column-misaligned: записать 424 с левого края, под старшими цифрами 3152. Тогда на самом деле складывают 3152 и 4240 и получают 7392 вместо 3576.
