id: num-add-column
title: "Письменное сложение и вычитание многозначных чисел"
section: num
stage: 1
hours: 4
grade: "2–3"
prerequisites:
  - num-place-large
  - num-add-100
version: 0.1.0
summary: "Тема о письменных вычислениях столбиком: выравнивание по разрядам, перенос через разряд при сложении, занятие разряда при вычитании, случаи с нулями внутри числа, проверка результата обратным действием и прикидкой по старшему разряду, поиск ошибки в записи."
search:
  synonyms:
    - сложение в столбик
    - вычитание в столбик
    - запись в столбик
    - письменное сложение
    - письменное вычитание
    - поразрядное сложение
    - перенос через разряд
    - занятие разряда
    - вычитание с нулями
    - проверка результата сложением
    - проверка результата вычитанием
    - алгоритм сложения и вычитания
  questions:
    - "Как записать сложение многозначных чисел столбиком?"
    - "Почему цифры одного разряда ставят друг под другом?"
    - "Как перенести единицу в следующий разряд при сложении?"
    - "Как занять единицу у старшего разряда при вычитании?"
    - "Что делать, если в уменьшаемом стоят нули?"
    - "Как проверить результат вычитания сложением?"
    - "Как проверить результат сложения вычитанием?"
    - "Как найти уменьшаемое, если известны разность и вычитаемое?"
    - "Как восстановить неизвестное слагаемое по сумме?"
subtopics:
  - id: num-add-column/zapis-v-stolbik-po
    title: "Запись столбиком по разрядам"
    tree_ref: "Запись в столбик по разрядам"
    synonyms: [выравнивание разрядов, цифра под цифрой, запись в столбик]
    sections: [T01]
  - id: num-add-column/perenos-cherez-razryad-i
    title: "Перенос через разряд и занятие разряда"
    tree_ref: "Перенос через разряд и занятие разряда"
    synonyms: [перенос единицы, занятие единицы, переход через разряд]
    sections: [T02]
  - id: num-add-column/sluchai-s-nulyami-vnutri
    title: "Случаи с нулями внутри числа"
    tree_ref: "Случаи с нулями внутри числа"
    synonyms: [ноль в середине числа, занятие через ноль, вычитание из числа с нулями]
    sections: [T03]
  - id: num-add-column/proverka-obratnym-deystviem-i
    title: "Проверка обратным действием и прикидкой"
    tree_ref: "Проверка обратным действием и прикидкой"
    synonyms: [проверка результата, обратное действие, прикидка порядка результата]
    sections: [T04, T05]

outcomes:
  - id: LO-01
    short: Пишет столбиком и считает по разрядам
    action: выравнивает числа по разрядам и находит сумму или разность поразрядно, начиная с разряда единиц
    conditions: натуральные числа до миллиона, два компонента; в каждом разряде сумма цифр меньше десяти, а цифра уменьшаемого не меньше цифры вычитаемого — переносить и занимать не требуется
    criterion: запись выровнена по разрядам, каждая цифра результата совпадает с поразрядным вычислением, сумма не меньше каждого слагаемого, разность не больше уменьшаемого
    level: core
    sections: [T01]
  - id: LO-02
    short: Переносит, занимает и проверяет
    action: переносит единицу в следующий разряд при сложении, занимает единицу у старшего разряда при вычитании, в том числе через нули внутри уменьшаемого, и проверяет результат обратным действием и прикидкой по старшему разряду
    conditions: натуральные числа до миллиона, два компонента; в записи есть перенос, занятие или нули внутри уменьшаемого; вычитание проверяется сложением, сложение — вычитанием, прикидка даёт границы по старшему разряду
    criterion: в каждом разряде учтена перенесённая или занятая единица, нули на пути занятия стали девятками, результат совпал с поразрядным пересчётом и подтверждён обратным действием, неверная запись не прошла проверку
    level: standard
    sections: [T02, T03, T04]
  - id: LO-03
    short: Находит ошибку и восстанавливает число
    action: по неверной записи находит разряд, в котором она расходится с верным результатом, и причину ошибки, восстанавливает неизвестное уменьшаемое или вычитаемое и стёртую цифру записи
    conditions: натуральные числа до миллиона; в записи одна ошибка — забытая единица переноса или занятия; неизвестен один компонент вычитания или одна цифра записи
    criterion: разряд и причина ошибки названы верно, неизвестный компонент найден обратным действием и подтверждён подстановкой в запись
    level: deep
    sections: [T05]

errors:
  - E-num-add-column-misaligned
  - E-num-add-column-carry-lost-units
  - E-num-add-column-carry-lost-tens
  - E-num-add-column-digital-diff
  - E-num-add-column-borrow-unused
  - E-num-add-column-zero-chain
  - E-num-add-column-inverse-wrong
  - E-num-add-column-bound-one-side
