outcomes:
  - id: LO-01
    level: core
    short: Записывает разряды и числа до 100
    action: определяет число десятков и единиц по модели или описанию, записывает и читает двузначные числа и число 100
    conditions: количества от 0 до 100, заданные десятками и единицами, словами или двузначной записью; без калькулятора
    criterion: верно указывает цифру десятков, цифру единиц и их значения в единицах без перестановки разрядов и потери нуля
    sections: [T01, T02, T03]

  - id: LO-02
    level: standard
    short: Обменивает десятки и сравнивает числа
    action: переводит нестандартный набор десятков и единиц в двузначное число обменом 10 единиц на 1 десяток и сравнивает двузначные числа по разрядам
    conditions: двузначные числа от 10 до 99 и наборы десятков и единиц с общим количеством до 100
    criterion: верно приводит набор к стандартному виду с числом единиц от 0 до 9 и определяет большее или меньшее число сначала по десяткам, а при равных десятках — по единицам
    sections: [T02, T04]

  - id: LO-03
    level: deep
    short: Проверяет разряды и перебирает числа
    action: проверяет условия на цифры разрядов, находит наибольшее и наименьшее двузначное число из заданных цифр и считает все подходящие двузначные числа
    conditions: двузначные числа от 10 до 99 и конечные наборы цифр от 0 до 9
    criterion: верно отсеивает записи с нулём в разряде десятков или перепутанными разрядами и перечисляет подходящие двузначные числа без пропусков и повторов
    sections: [T01, T04, T05]

