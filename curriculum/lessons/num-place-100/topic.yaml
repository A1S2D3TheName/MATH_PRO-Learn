id: num-place-100
title: Десятки и единицы, числа до 100
section: num
stage: 1
hours: 3
grade: "1–2"
prerequisites:
  - num-digits
version: "0.1.0"

summary: |
  Переходим от счёта до двадцати к позиционной записи двузначных чисел и числа 100: десять
  отдельных единиц объединяются в новую счётную единицу — десяток. В двузначном числе левая
  цифра стоит в разряде десятков и показывает число целых десятков, а правая цифра стоит в
  разряде единиц и показывает число отдельных единиц. Разбираем обмен десяти единиц на один
  десяток, чтение и запись чисел до 100 без пропуска нуля и поразрядное сравнение двузначных чисел.

