  synonyms:
    - разряд десятков
    - разряд единиц
    - двузначное число
    - десятки и единицы
    - позиционная запись до 100
    - сколько десятков и единиц
    - обмен десяти единиц на десяток
    - поразрядное сравнение двузначных чисел
    - круглые десятки и сотня
    - состав двузначного числа
    - таблица разрядов
  questions:
    - Как определить, сколько в двузначном числе десятков и сколько единиц?
    - Почему цифра слева в двузначном числе означает десятки, а справа — единицы?
    - Зачем в круглых десятках вроде 40 и 70 пишут цифру 0 на конце?
    - Как записать двузначное число, если отдельных единиц больше девяти?
    - Почему при сравнении двузначных чисел сначала смотрят на десятки, а не на единицы?
    - Какое двузначное число самое маленькое и какое самое большое?
    - Как записать число, если в условии единицы названы раньше десятков?
    - Сколько отдельных единиц содержится в одном десятке и в одной сотне?

