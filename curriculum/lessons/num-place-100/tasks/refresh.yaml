tasks:
- id: R-01
  type: number
  role: refresh
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T01
  minutes: 3
  prompt: На почте приготовили к отправке {{d|pl:полная связка,полные связки,полных связок}} по 10 писем и {{u|pl:отдельное письмо,отдельных письма,отдельных писем}}. Сколько всего писем? Запишите число цифрами.
  answer: 57
  variants:
  - params:
      d: 5
      u: 7
    answer: 57
    solution: |
      ### Ответ
      57

      ### Идея
      Полная связка — это десяток писем: число полных связок даёт цифру разряда десятков (слева), число отдельных писем — цифру разряда единиц (справа).

      ### Шаги
      1. Полных связок — 5: это 5 десятков писем, в разряд десятков пишем 5.
      2. Отдельных писем — 7: в разряд единиц пишем 7.
      3. Десятки слева, единицы справа: 57.

      ### Проверка
      Считаем десятками: десять, двадцать, тридцать, сорок, пятьдесят — и ещё семь: пятьдесят семь. Запись 57 читается так же.

      ### Типичная ошибка
      E-num-place-100-add-digits: сложить 5 и 7 как одинаковые штуки и получить 12 вместо 57 — но каждая связка — это 10 писем.
  - params:
      d: 9
      u: 3
    answer: 93
    solution: |
      ### Ответ
      93

      ### Идея
      Полная связка — это десяток писем: число полных связок даёт цифру разряда десятков (слева), число отдельных писем — цифру разряда единиц (справа).

      ### Шаги
      1. Полных связок — 9: это 9 десятков писем, в разряд десятков пишем 9.
      2. Отдельных писем — 3: в разряд единиц пишем 3.
      3. Десятки слева, единицы справа: 93.

      ### Проверка
      Считаем десятками: десять, двадцать, тридцать, сорок, пятьдесят, шестьдесят, семьдесят, восемьдесят, девяносто — и ещё три: девяносто три. Запись 93 читается так же.

      ### Типичная ошибка
      E-num-place-100-add-digits: сложить 9 и 3 как одинаковые штуки и получить 12 вместо 93 — но каждая связка — это 10 писем.
  - params:
      d: 2
      u: 6
    answer: 26
    solution: |
      ### Ответ
      26

      ### Идея
      Полная связка — это десяток писем: число полных связок даёт цифру разряда десятков (слева), число отдельных писем — цифру разряда единиц (справа).

      ### Шаги
      1. Полных связок — 2: это 2 десятка писем, в разряд десятков пишем 2.
      2. Отдельных писем — 6: в разряд единиц пишем 6.
      3. Десятки слева, единицы справа: 26.

      ### Проверка
      Считаем десятками: десять, двадцать — и ещё шесть: двадцать шесть. Запись 26 читается так же.

      ### Типичная ошибка
      E-num-place-100-add-digits: сложить 2 и 6 как одинаковые штуки и получить 8 вместо 26 — но каждая связка — это 10 писем.
  hints:
  - Связка по 10 писем — десяток, отдельные письма — единицы.
  - Число полных связок встанет в разряд десятков, отдельные письма — в разряд единиц.
  - Связок {{d}} — значит, писем в связках {{d|pl:десяток,десятка,десятков}}. Какой цифрой закончится запись?
  solution: |
    ### Ответ
    Число писем: десятков — {{d}}, единиц — {{u}}.

    ### Идея
    Связка — десяток.

    ### Шаги
    1. Десятки: {{d}}.
    2. Единицы: {{u}}.

    ### Проверка
    Считаем десятками.

    ### Типичная ошибка
    E-num-place-100-add-digits: сложить связки и письма как штуки.
  feedback:
    correct: 'Верно: связки писем дали десятки, отдельные письма — единицы.'
    wrong:
      what: Число писем записано неверно.
      why: Возможно, связки посчитаны как отдельные письма.
      fix: 'Помните, что в каждой связке 10 писем: число связок пишут слева.'
      next: 'Раздел T01: таблица разрядов и пример «Чтение разрядов».'
    misconceptions:
    - id: E-num-place-100-add-digits
      when:
        expr: d + u
      message: Связки посчитаны как отдельные письма, а в каждой связке их 10.
    - id: E-num-place-100-swap-digits
      when:
        expr: 10 * u + d
      message: 'Цифры поменялись местами: слева пишут число связок ({{d}}).'
- id: R-02
  type: number
  role: refresh
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T03
  minutes: 3
  prompt: Кладовщик услышал в рации число «{{w}}». Запишите его цифрами.
  answer: 13
  variants:
  - params:
      w: тринадцать
    answer: 13
    solution: |
      ### Ответ
      13

      ### Идея
      В названиях на «-надцать» первой звучит часть единиц, а десяток один («… на десяте»). Запись от этого не меняется: десяток слева.

      ### Шаги
      1. «-надцать» — это «на десяте»: в числе один десяток, слева пишем 1.
      2. «три-» — 3 единицы: справа пишем 3.
      3. Десяток слева, единицы справа: 13.

      ### Проверка
      Читаем 13: один десяток и 3 единицы — «тринадцать».

      ### Типичная ошибка
      E-num-place-100-swap-digits: записать цифры в порядке звучания и получить 31 вместо 13.
  - params:
      w: шестьдесят четыре
    answer: 64
    solution: |
      ### Ответ
      64

      ### Идея
      В названиях от двадцати до девяноста девяти первое слово называет десятки, второе — отдельные единицы.

      ### Шаги
      1. «шестьдесят» — 6 десятков: в разряд десятков пишем 6.
      2. «четыре» — 4 единицы: в разряд единиц пишем 4.
      3. Десятки слева, единицы справа: 64.

      ### Проверка
      Читаем запись 64 слева направо: «шестьдесят четыре» — совпадает с продиктованным.

      ### Типичная ошибка
      E-num-place-100-glue-ten-value: записать «шестьдесят» как 60 и приписать 4 — получится 604 вместо 64.
  - params:
      w: восемьдесят
    answer: 80
    solution: |
      ### Ответ
      80

      ### Идея
      Название круглого числа называет только десятки; отдельных единиц нет, и в разряд единиц ставят 0.

      ### Шаги
      1. «восемьдесят» — 8 десятков: в разряд десятков пишем 8.
      2. Второго слова нет — отдельных единиц нет: в разряд единиц пишем 0.
      3. Получаем 80.

      ### Проверка
      Считаем десятками: десять, двадцать, тридцать, сорок, пятьдесят, шестьдесят, семьдесят, восемьдесят — это «восемьдесят», запись 80.

      ### Типичная ошибка
      E-num-place-100-add-digits: принять 8 десятков за 8 единиц и записать одну цифру 8 вместо 80.
  hints:
  - Разложите название на десятки и единицы.
  - В числах на «-надцать» десяток один, а первой звучит часть единиц; в остальных первое слово — десятки.
  - Назовите отдельно, сколько десятков и сколько единиц в числе «{{w}}».
  solution: |
    ### Ответ
    Число «{{w}}» цифрами.

    ### Идея
    Десятки — слева, единицы — справа.

    ### Шаги
    1. Десятки.
    2. Единицы.

    ### Проверка
    Прочитайте запись вслух.

    ### Типичная ошибка
    E-num-place-100-swap-digits: писать цифры в порядке звучания.
  feedback:
    correct: 'Верно: услышанное по рации число записано по разрядам.'
    wrong:
      what: Запись услышанного числа неверна.
      why: Возможно, цифры стоят в порядке звучания или потерян ноль.
      fix: Определите десятки и единицы и запишите десятки слева.
      next: 'Раздел T03: правило записи по названию.'
- id: R-03
  type: number
  role: refresh
  purpose: procedure
  level: 2
  outcome: LO-02
  sections:
  - T02
  minutes: 3
  prompt: На складе канцтоваров лежат {{d|pl:полная пачка,полные пачки,полных пачек}} по 10 карандашей и {{u|pl:отдельный карандаш,отдельных карандаша,отдельных карандашей}}. Сколько всего карандашей? Запишите число цифрами.
  answer: 36
  variants:
  - params:
      d: 2
      u: 16
    answer: 36
    solution: |
      ### Ответ
      36

      ### Идея
      В разряде единиц помещается цифра от 0 до 9, поэтому из 16 карандашей сначала собирают полные десятки, а потом записывают число.

      ### Шаги
      1. Из 16 отдельных карандашей откладываем 10 — получается ещё один полный десяток, отдельно остаётся 6 карандашей.
      2. Полных десятков до обмена — 2, с новым — 3. В разряд десятков пишем 3.
      3. В разряд единиц пишем 6. Число — 36.

      ### Проверка
      Пересчитаем десятками без обмена: десять, двадцать (2 десятка), затем десятки из россыпи — тридцать, и ещё шесть: тридцать шесть.

      ### Типичная ошибка
      E-num-place-100-drop-regrouped-ten: записать справа 6, а собранные из россыпи десятки не добавить и получить 26 вместо 36.
  - params:
      d: 6
      u: 15
    answer: 75
    solution: |
      ### Ответ
      75

      ### Идея
      В разряде единиц помещается цифра от 0 до 9, поэтому из 15 карандашей сначала собирают полные десятки, а потом записывают число.

      ### Шаги
      1. Из 15 отдельных карандашей откладываем 10 — получается ещё один полный десяток, отдельно остаётся 5 карандашей.
      2. Полных десятков до обмена — 6, с новым — 7. В разряд десятков пишем 7.
      3. В разряд единиц пишем 5. Число — 75.

      ### Проверка
      Пересчитаем десятками без обмена: десять, двадцать, тридцать, сорок, пятьдесят, шестьдесят (6 десятков), затем десятки из россыпи — семьдесят, и ещё пять: семьдесят пять.

      ### Типичная ошибка
      E-num-place-100-drop-regrouped-ten: записать справа 5, а собранные из россыпи десятки не добавить и получить 65 вместо 75.
  - params:
      d: 4
      u: 19
    answer: 59
    solution: |
      ### Ответ
      59

      ### Идея
      В разряде единиц помещается цифра от 0 до 9, поэтому из 19 карандашей сначала собирают полные десятки, а потом записывают число.

      ### Шаги
      1. Из 19 отдельных карандашей откладываем 10 — получается ещё один полный десяток, отдельно остаётся 9 карандашей.
      2. Полных десятков до обмена — 4, с новым — 5. В разряд десятков пишем 5.
      3. В разряд единиц пишем 9. Число — 59.

      ### Проверка
      Пересчитаем десятками без обмена: десять, двадцать, тридцать, сорок (4 десятка), затем десятки из россыпи — пятьдесят, и ещё девять: пятьдесят девять.

      ### Типичная ошибка
      E-num-place-100-drop-regrouped-ten: записать справа 9, а собранные из россыпи десятки не добавить и получить 49 вместо 59.
  hints:
  - Отдельных карандашей больше девяти — сначала нужен обмен.
  - Десять отдельных карандашей образуют ещё одну полную пачку.
  - Из {{u}} отдельных карандашей соберите пачку. Сколько пачек станет вместо {{d}}?
  solution: |
    ### Ответ
    Число карандашей после обмена.

    ### Идея
    Десять отдельных — пачка.

    ### Шаги
    1. Собираем пачку из {{u}}.
    2. Добавляем к {{d}}.

    ### Проверка
    Считаем десятками.

    ### Типичная ошибка
    E-num-place-100-drop-regrouped-ten: потерять новую пачку.
  feedback:
    correct: 'Верно: из отдельных карандашей собрана пачка, и она добавлена к остальным.'
    wrong:
      what: Число карандашей после обмена записано неверно.
      why: Возможно, собранная пачка не добавлена к десяткам или отдельные карандаши приписаны целиком.
      fix: Соберите из отдельных карандашей пачку, добавьте её к остальным пачкам и запишите остаток.
      next: 'Раздел T02: обмен десяти единиц на десяток.'
    misconceptions:
    - id: E-num-place-100-drop-regrouped-ten
      when:
        expr: 10 * d + mod (u, 10)
      message: Остаток записан справа, но пачка из отдельных карандашей не добавлена к десяткам ({{d}}).
    - id: E-num-place-100-unexchanged-ten
      when:
        expr: 100 * d + u
      message: Отдельные карандаши приписаны целиком, а в разряде единиц помещается одна цифра.
- id: R-04
  type: number
  role: refresh
  purpose: method
  level: 2
  outcome: LO-02
  sections:
  - T02
  - T04
  minutes: 4
  prompt: В первой партии {{n|pl:деталь,детали,деталей}}, во второй — {{d|pl:кассета,кассеты,кассет}} по 10 деталей и {{u|pl:отдельная деталь,отдельные детали,отдельных деталей}}. Сколько деталей в той партии, где их больше?
  answer: 68
  variants:
  - params:
      n: 64
      d: 5
      u: 18
    answer: 68
    solution: |
      ### Ответ
      68

      ### Идея
      Набор с лишними единицами сначала обменивают и записывают обычным числом, потом сравнивают по разрядам.

      ### Шаги
      1. Первая партия — 64.
      2. Вторая: 5 десятков и 18 единиц; из россыпи собираем десяток — 68.
      3. Сравниваем 64 и 68: десятков поровну (6), единиц 4 и 8 — больше 68.

      ### Проверка
      Без обмена во второй партии кажется 5 десятков, но россыпь 18 добавляет ещё один десяток.

      ### Типичная ошибка
      Сравнить 64 с числом кассет второй партии (5) без обмена россыпи.
  - params:
      n: 71
      d: 6
      u: 14
    answer: 74
    solution: |
      ### Ответ
      74

      ### Идея
      Набор с лишними единицами сначала обменивают и записывают обычным числом, потом сравнивают по разрядам.

      ### Шаги
      1. Первая партия — 71.
      2. Вторая: 6 десятков и 14 единиц; из россыпи собираем десяток — 74.
      3. Сравниваем 71 и 74: десятков поровну (7), единиц 1 и 4 — больше 74.

      ### Проверка
      Без обмена во второй партии кажется 6 десятков, но россыпь 14 добавляет ещё один десяток.

      ### Типичная ошибка
      Сравнить 71 с числом кассет второй партии (6) без обмена россыпи.
  - params:
      n: 55
      d: 4
      u: 12
    answer: 55
    solution: |
      ### Ответ
      55

      ### Идея
      Набор с лишними единицами сначала обменивают и записывают обычным числом, потом сравнивают по разрядам.

      ### Шаги
      1. Первая партия — 55.
      2. Вторая: 4 десятка и 12 единиц; из россыпи собираем десяток — 52.
      3. Сравниваем 55 и 52: десятков поровну (5), единиц 5 и 2 — больше 55.

      ### Проверка
      Без обмена во второй партии кажется 4 десятка, но россыпь 12 добавляет ещё один десяток.

      ### Типичная ошибка
      Сравнить 55 с числом кассет второй партии (4) без обмена россыпи.
  hints:
  - Сравнивать удобно два обычных двузначных числа.
  - 'Переведите вторую партию в обычную запись: отдельных деталей больше девяти.'
  - Из {{u}} отдельных деталей соберите десяток. Сколько десятков станет во второй партии вместо {{d}}?
  solution: |
    ### Ответ
    Большее из двух количеств.

    ### Идея
    Сначала обмен, потом сравнение.

    ### Шаги
    1. Вторую партию записываем числом.
    2. Сравниваем с {{n}}.

    ### Проверка
    Сравните десятки после обмена.

    ### Типичная ошибка
    Сравнивать без обмена.
  feedback:
    correct: 'Верно: вторая партия переведена в обычную запись и сравнена с первой по разрядам.'
    wrong:
      what: Большая партия деталей определена неверно.
      why: Возможно, вторая партия сравнивалась до обмена.
      fix: Сначала запишите вторую партию обычным числом, затем сравните десятки и единицы.
      next: 'Раздел T04: алгоритм поразрядного сравнения.'
- id: R-05
  type: number
  role: refresh
  purpose: method
  level: 3
  outcome: LO-03
  sections:
  - T05
  minutes: 4
  prompt: Из трёх трафаретов с цифрами 0, {{a}} и {{b}} (каждый — один раз) составляют двузначный номер стеллажа. Какой наименьший номер можно составить?
  answer: 40
  variants:
  - params:
      a: 4
      b: 9
    answer: 40
    solution: |
      ### Ответ
      40

      ### Идея
      В разряде десятков двузначного числа нуля быть не может, а в разряде единиц ноль разрешён и делает число меньше.

      ### Шаги
      1. В разряд десятков ставим меньшую ненулевую цифру: 4.
      2. Из оставшихся (0 и 9) в разряд единиц ставим меньшую: 0.
      3. Получаем 40.

      ### Проверка
      Все числа из двух трафаретов набора: 40, 49, 90 и 94. Самое маленькое — 40.

      ### Типичная ошибка
      E-num-place-100-skip-zero-in-ones: отложить ноль в сторону и записать 49 вместо 40.
  - params:
      a: 1
      b: 8
    answer: 10
    solution: |
      ### Ответ
      10

      ### Идея
      В разряде десятков двузначного числа нуля быть не может, а в разряде единиц ноль разрешён и делает число меньше.

      ### Шаги
      1. В разряд десятков ставим меньшую ненулевую цифру: 1.
      2. Из оставшихся (0 и 8) в разряд единиц ставим меньшую: 0.
      3. Получаем 10.

      ### Проверка
      Все числа из двух трафаретов набора: 10, 18, 80 и 81. Самое маленькое — 10.

      ### Типичная ошибка
      E-num-place-100-skip-zero-in-ones: отложить ноль в сторону и записать 18 вместо 10.
