title: Ревизия поддонов на складе «Винт»
context_id: warehouse-vint-audit
scenario: |
  Кладовщик склада «Винт» принимает два поддона с болтами в кассетах по 10 штук и россыпью: записывает число болтов первого поддона после обмена, читает его разряды, сравнивает поддоны, исправляет ошибку в ведомости и выбирает номер ячейки для большего поддона. Каждый следующий шаг опирается на ответ предыдущего.
tasks:
- id: F-01
  type: number
  role: final-step
  purpose: procedure
  level: 2
  outcome: LO-02
  sections:
  - T02
  minutes: 2
  depends_on: []
  prompt: Шаг 1 ревизии. На первом поддоне {{d|pl:полная кассета,полные кассеты,полных кассет}} по 10 болтов и {{u|pl:отдельный болт,отдельных болта,отдельных болтов}}. Сколько болтов на первом поддоне? Запишите число цифрами.
  answer: 53
  variants:
  - params:
      d: 4
      u: 13
      c: 5
      m: 8
    answer: 53
    solution: |
      ### Ответ
      53

      ### Идея
      В разряде единиц помещается цифра от 0 до 9, поэтому из 13 болтов сначала собирают полные десятки, а потом записывают число.

      ### Шаги
      1. Из 13 отдельных болтов откладываем 10 — получается ещё один полный десяток, отдельно остаётся 3 болта.
      2. Полных десятков до обмена — 4, с новым — 5. В разряд десятков пишем 5.
      3. В разряд единиц пишем 3. Число — 53.

      ### Проверка
      Пересчитаем десятками без обмена: десять, двадцать, тридцать, сорок (4 десятка), затем десятки из россыпи — пятьдесят, и ещё три: пятьдесят три.

      ### Типичная ошибка
      E-num-place-100-drop-regrouped-ten: записать справа 3, а собранные из россыпи десятки не добавить и получить 43 вместо 53.
  - params:
      d: 3
      u: 16
      c: 4
      m: 9
    answer: 46
    solution: |
      ### Ответ
      46

      ### Идея
      В разряде единиц помещается цифра от 0 до 9, поэтому из 16 болтов сначала собирают полные десятки, а потом записывают число.

      ### Шаги
      1. Из 16 отдельных болтов откладываем 10 — получается ещё один полный десяток, отдельно остаётся 6 болтов.
      2. Полных десятков до обмена — 3, с новым — 4. В разряд десятков пишем 4.
      3. В разряд единиц пишем 6. Число — 46.

      ### Проверка
      Пересчитаем десятками без обмена: десять, двадцать, тридцать (3 десятка), затем десятки из россыпи — сорок, и ещё шесть: сорок шесть.

      ### Типичная ошибка
      E-num-place-100-drop-regrouped-ten: записать справа 6, а собранные из россыпи десятки не добавить и получить 36 вместо 46.
