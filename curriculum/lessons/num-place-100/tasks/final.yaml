  hints:
  - Отдельных болтов на поддоне больше девяти.
  - Соберите из отдельных болтов полную кассету и только потом записывайте число.
  - Из {{u}} отдельных болтов выходит одна кассета. Сколько кассет станет вместо {{d}} и сколько болтов останется?
  solution: |
    ### Ответ
    Число болтов первого поддона.

    ### Идея
    Обмен десяти единиц на десяток.

    ### Шаги
    1. Собираем кассету из {{u}}.
    2. Добавляем к {{d}}.

    ### Проверка
    Считаем десятками.

    ### Типичная ошибка
    E-num-place-100-drop-regrouped-ten: потерять новую кассету.
  feedback:
    correct: 'Верно: отдельные болты первого поддона собраны в кассету, число записано.'
    wrong:
      what: Число болтов первого поддона записано неверно.
      why: Возможно, кассета из отдельных болтов не добавлена к остальным.
      fix: Сначала соберите из отдельных болтов кассету, затем запишите число по разрядам.
      next: 'Раздел T02: обмен десяти единиц на десяток.'
    misconceptions:
    - id: E-num-place-100-drop-regrouped-ten
      when:
        expr: 10 * d + mod (u, 10)
      message: Справа остаток, но кассета из отдельных болтов не добавлена к остальным кассетам ({{d}}).
    - id: E-num-place-100-unexchanged-ten
      when:
        expr: 100 * d + u
      message: Отдельные болты приписаны целиком; в разряде единиц помещается одна цифра.
