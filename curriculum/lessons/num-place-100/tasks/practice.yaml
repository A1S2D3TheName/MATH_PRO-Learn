      1. В разряде десятков ноль не стоит ни у одного двузначного числа.
      2. В разряде единиц ноль стоит у круглых чисел: 10, 20, …, 90 — их девять.
      3. Всего ноль встречается 9 раз.

      ### Проверка
      Перечислим: 10, 20, 30, 40, 50, 60, 70, 80, 90 — девять записей, в каждой по одному нулю.

      ### Типичная ошибка
      Посчитать число с двумя одинаковыми цифрами один раз или забыть один из разрядов.
