tasks:
- id: P-01
  type: number
  role: warmup
  purpose: procedure
  level: 0
  outcome: LO-01
  sections:
  - T01
  minutes: 1
  prompt: На складе крепежа лежат {{d|pl:полная кассета,полные кассеты,полных кассет}} по 10 болтов и {{u|pl:отдельный болт,отдельных болта,отдельных болтов}}. Сколько всего болтов? Запишите число цифрами.
  answer: 25
  variants:
  - params:
      d: 2
      u: 5
    answer: 25
    solution: |
      ### Ответ
      25

      ### Идея
      Полная кассета — это десяток болтов: число полных кассет даёт цифру разряда десятков (слева), число отдельных болтов — цифру разряда единиц (справа).

      ### Шаги
      1. Полных кассет — 2: это 2 десятка болтов, в разряд десятков пишем 2.
      2. Отдельных болтов — 5: в разряд единиц пишем 5.
      3. Десятки слева, единицы справа: 25.

      ### Проверка
      Считаем десятками: десять, двадцать — и ещё пять: двадцать пять. Запись 25 читается так же.

      ### Типичная ошибка
      E-num-place-100-swap-digits: начать запись с отдельных болтов и получить 52 вместо 25.
  - params:
      d: 4
      u: 8
    answer: 48
    solution: |
      ### Ответ
      48

      ### Идея
      Полная кассета — это десяток болтов: число полных кассет даёт цифру разряда десятков (слева), число отдельных болтов — цифру разряда единиц (справа).

      ### Шаги
      1. Полных кассет — 4: это 4 десятка болтов, в разряд десятков пишем 4.
      2. Отдельных болтов — 8: в разряд единиц пишем 8.
      3. Десятки слева, единицы справа: 48.

      ### Проверка
      Считаем десятками: десять, двадцать, тридцать, сорок — и ещё восемь: сорок восемь. Запись 48 читается так же.

      ### Типичная ошибка
      E-num-place-100-swap-digits: начать запись с отдельных болтов и получить 84 вместо 48.
  - params:
      d: 6
      u: 1
    answer: 61
    solution: |
      ### Ответ
      61

      ### Идея
      Полная кассета — это десяток болтов: число полных кассет даёт цифру разряда десятков (слева), число отдельных болтов — цифру разряда единиц (справа).

      ### Шаги
      1. Полных кассет — 6: это 6 десятков болтов, в разряд десятков пишем 6.
      2. Отдельных болтов — 1: в разряд единиц пишем 1.
      3. Десятки слева, единицы справа: 61.

      ### Проверка
      Считаем десятками: десять, двадцать, тридцать, сорок, пятьдесят, шестьдесят — и ещё один: шестьдесят один. Запись 61 читается так же.

      ### Типичная ошибка
      E-num-place-100-swap-digits: начать запись с отдельных болтов и получить 16 вместо 61.
  hints:
  - Кассета по 10 болтов — это один десяток, отдельные болты — единицы.
  - Число полных кассет станет цифрой разряда десятков, число отдельных болтов — цифрой разряда единиц.
  - Полных кассет {{d}} — значит, в разряде десятков стоит цифра {{d}}. Какая цифра встанет справа?
  solution: |
    ### Ответ
    Число болтов: десятков — {{d}}, отдельных — {{u}}.

    ### Идея
    Кассета — десяток, отдельные болты — единицы.

    ### Шаги
    1. В разряд десятков пишем {{d}}.
    2. В разряд единиц пишем {{u}}.

    ### Проверка
    Считаем десятками и досчитываем отдельные болты.

    ### Типичная ошибка
    E-num-place-100-swap-digits: начать запись с отдельных болтов.
  feedback:
    correct: 'Верно: кассеты дали цифру десятков, отдельные болты — цифру единиц.'
    wrong:
      what: Число болтов записано неверно.
      why: Возможно, цифры кассет и отдельных болтов поменялись местами или сложились.
      fix: Сначала поставьте слева число полных кассет, затем справа — число отдельных болтов.
      next: 'Раздел T01: таблица разрядов и пример «Чтение разрядов».'
    misconceptions:
    - id: E-num-place-100-swap-digits
      when:
        expr: 10 * u + d
      message: 'Цифры поменялись местами: слева пишут число полных кассет ({{d}}), справа — отдельные болты ({{u}}).'
    - id: E-num-place-100-add-digits
      when:
        expr: d + u
      message: Кассеты посчитаны как отдельные болты, а в каждой кассете 10 болтов.
- id: P-02
  type: numbers
  role: warmup
  purpose: meaning
  level: 0
  outcome: LO-01
  sections:
  - T01
  minutes: 1
  prompt: На ящике с шайбами написано число {{n}}. Сколько в этом числе полных десятков и сколько отдельных единиц?
  fields:
  - id: tens
    label: Полных десятков
  - id: ones
    label: Отдельных единиц
  answer:
    tens: 3
    ones: 9
  variants:
  - params:
      n: 39
    answer:
      tens: 3
      ones: 9
    solution: |
      ### Ответ
      десятков: 3, единиц: 9

      ### Идея
      Левая цифра двузначного числа показывает полные десятки, правая — отдельные единицы.

      ### Шаги
      1. В записи 39 слева стоит 3 — это 3 десятка.
      2. Справа стоит 9 — это 9 единиц сверх полных десятков.

      ### Проверка
      Собираем обратно: 3 десятка — тридцать, и ещё девять: тридцать девять, то есть 39.

      ### Типичная ошибка
      E-num-place-100-swap-digits: перепутать места и назвать 9 десятков и 3 единицы — это число 93, а не 39.
  - params:
      n: 62
    answer:
      tens: 6
      ones: 2
    solution: |
      ### Ответ
      десятков: 6, единиц: 2

      ### Идея
      Левая цифра двузначного числа показывает полные десятки, правая — отдельные единицы.

      ### Шаги
      1. В записи 62 слева стоит 6 — это 6 десятков.
      2. Справа стоит 2 — это 2 единицы сверх полных десятков.

      ### Проверка
      Собираем обратно: 6 десятков — шестьдесят, и ещё два: шестьдесят два, то есть 62.

      ### Типичная ошибка
      E-num-place-100-swap-digits: перепутать места и назвать 2 десятка и 6 единиц — это число 26, а не 62.
  - params:
      n: 85
    answer:
      tens: 8
      ones: 5
    solution: |
      ### Ответ
      десятков: 8, единиц: 5

      ### Идея
      Левая цифра двузначного числа показывает полные десятки, правая — отдельные единицы.

      ### Шаги
      1. В записи 85 слева стоит 8 — это 8 десятков.
      2. Справа стоит 5 — это 5 единиц сверх полных десятков.

      ### Проверка
      Собираем обратно: 8 десятков — восемьдесят, и ещё пять: восемьдесят пять, то есть 85.

      ### Типичная ошибка
      E-num-place-100-swap-digits: перепутать места и назвать 5 десятков и 8 единиц — это число 58, а не 85.
  hints:
  - В двузначной записи левое место занимает разряд десятков, правое — разряд единиц.
  - 'Прочитайте число вслух: первым звучит число десятков.'
  - Прочитайте вслух число {{n}} и решите, какое слово отвечает за десятки.
  solution: |
    ### Ответ
    Цифры записи {{n}} по разрядам.

    ### Идея
    Левая цифра — десятки, правая — единицы.

    ### Шаги
    1. Левая цифра числа {{n}} — полные десятки.
    2. Правая цифра — отдельные единицы.

    ### Проверка
    Соберите число из найденных десятков и единиц.

    ### Типичная ошибка
    E-num-place-100-swap-digits: перепутать места цифр.
  feedback:
    correct: 'Верно: в числе на ящике левая цифра — десятки шайб, правая — отдельные шайбы.'
    wrong:
      what: Разряды числа указаны неверно.
      why: Возможно, перепутаны левое и правое места записи.
      fix: 'Вспомните таблицу разрядов: разряд десятков слева, разряд единиц справа.'
      next: 'Раздел T01: таблица разрядов и пример «Чтение разрядов».'
- id: P-03
  type: number
  role: warmup
  purpose: procedure
  level: 0
  outcome: LO-01
  sections:
  - T02
  minutes: 1
  prompt: В архив сдали {{d|pl:полную папку,полные папки,полных папок}} по 10 листов, отдельных листов нет. Сколько листов сдали? Запишите число цифрами.
  answer: 30
  variants:
  - params:
      d: 3
    answer: 30
    solution: |
      ### Ответ
      30

      ### Идея
      Папка по 10 листов — десяток; если отдельных листов нет, место единиц занимает ноль.

      ### Шаги
      1. Каждая папка — десяток листов: папок 3, значит, 3 десятка.
      2. Отдельных листов нет — в разряд единиц пишем 0.
      3. Десятки слева, ноль справа: 30.

      ### Проверка
      Считаем папки десятками: десять, двадцать, тридцать. Последнее число — тридцать, его записывают как 30.

      ### Типичная ошибка
      E-num-place-100-add-digits: принять 3 десятка за 3 листа и записать 3 вместо 30.
  - params:
      d: 7
    answer: 70
    solution: |
      ### Ответ
      70

      ### Идея
      Папка по 10 листов — десяток; если отдельных листов нет, место единиц занимает ноль.

      ### Шаги
      1. Каждая папка — десяток листов: папок 7, значит, 7 десятков.
      2. Отдельных листов нет — в разряд единиц пишем 0.
      3. Десятки слева, ноль справа: 70.

      ### Проверка
      Считаем папки десятками: десять, двадцать, тридцать, сорок, пятьдесят, шестьдесят, семьдесят. Последнее число — семьдесят, его записывают как 70.

      ### Типичная ошибка
      E-num-place-100-add-digits: принять 7 десятков за 7 листов и записать 7 вместо 70.
  - params:
      d: 8
    answer: 80
    solution: |
      ### Ответ
      80

      ### Идея
      Папка по 10 листов — десяток; если отдельных листов нет, место единиц занимает ноль.

      ### Шаги
      1. Каждая папка — десяток листов: папок 8, значит, 8 десятков.
      2. Отдельных листов нет — в разряд единиц пишем 0.
      3. Десятки слева, ноль справа: 80.

      ### Проверка
      Считаем папки десятками: десять, двадцать, тридцать, сорок, пятьдесят, шестьдесят, семьдесят, восемьдесят. Последнее число — восемьдесят, его записывают как 80.

      ### Типичная ошибка
      E-num-place-100-add-digits: принять 8 десятков за 8 листов и записать 8 вместо 80.
  hints:
  - 'Каждая папка — десяток листов; папки можно считать десятками: десять, двадцать, тридцать…'
  - 'Отдельных листов нет, поэтому разряд единиц не пустует: в нём пишут 0.'
  - 'Начните счёт папками: одна — десять листов, две — двадцать. Досчитайте до {{d|pl:папки,папок,папок}}.'
  solution: |
    ### Ответ
    Число листов: десятков — {{d}}, единиц нет.

    ### Идея
    Папка — десяток, единиц нет.

    ### Шаги
    1. Считаем папки десятками.
    2. В разряд единиц пишем 0.

    ### Проверка
    Пересчитайте десятками ещё раз.

    ### Типичная ошибка
    E-num-place-100-add-digits: записать число папок без нуля.
  feedback:
    correct: 'Верно: папки посчитаны десятками, а ноль удержал место единиц.'
    wrong:
      what: Число листов найдено неверно.
      why: Возможно, папки посчитаны как отдельные листы или потерян ноль на месте единиц.
      fix: Пересчитайте папки десятками и проверьте, что в записи осталось место для единиц.
      next: 'Раздел T02: обмен десяти единиц на десяток.'
- id: P-04
  type: number
  role: supported
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T03
  minutes: 1
  prompt: Диспетчер продиктовал по телефону число «{{w}}». Запишите его цифрами.
  answer: 53
  variants:
  - params:
      w: пятьдесят три
    answer: 53
    solution: |
      ### Ответ
      53

      ### Идея
      В названиях от двадцати до девяноста девяти первое слово называет десятки, второе — отдельные единицы.

      ### Шаги
      1. «пятьдесят» — 5 десятков: в разряд десятков пишем 5.
      2. «три» — 3 единицы: в разряд единиц пишем 3.
      3. Десятки слева, единицы справа: 53.

      ### Проверка
      Читаем запись 53 слева направо: «пятьдесят три» — совпадает с продиктованным.

      ### Типичная ошибка
      E-num-place-100-glue-ten-value: записать «пятьдесят» как 50 и приписать 3 — получится 503 вместо 53.
  - params:
      w: восемнадцать
    answer: 18
    solution: |
      ### Ответ
      18

      ### Идея
      В названиях на «-надцать» первой звучит часть единиц, а десяток один («… на десяте»). Запись от этого не меняется: десяток слева.

      ### Шаги
      1. «-надцать» — это «на десяте»: в числе один десяток, слева пишем 1.
      2. «восем-» — 8 единиц: справа пишем 8.
      3. Десяток слева, единицы справа: 18.

      ### Проверка
      Читаем 18: один десяток и 8 единиц — «восемнадцать».

      ### Типичная ошибка
      E-num-place-100-swap-digits: записать цифры в порядке звучания и получить 81 вместо 18.
  - params:
      w: сто
    answer: 100
    solution: |
      ### Ответ
      100

      ### Идея
      Сто — это десять десятков. В разряде десятков помещается цифра не больше 9, поэтому сотню записывают тремя цифрами.

      ### Шаги
      1. «Сто» — десять десятков.
      2. Десять десятков не помещаются в разряд десятков: нужно третье место слева.
      3. Записываем 100: единица на третьем месте и два нуля.

      ### Проверка
      Считаем десятками: десять, двадцать, … девяносто — девять десятков; следующий, десятый десяток — сто, 100.

      ### Типичная ошибка
      E-num-place-100-add-digits: посчитать десять десятков как десять отдельных единиц и записать 10 вместо 100.
  hints:
  - В названиях от двадцати до девяноста девяти сначала звучат десятки, в названиях на «-надцать» — сначала единицы.
  - Определите по названию, сколько в числе десятков и сколько отдельных единиц.
  - 'Разберите «{{w}}»: какое слово или какая часть слова называет десятки?'
  solution: |
    ### Ответ
    Число «{{w}}», записанное цифрами.

    ### Идея
    Название раскладывают на десятки и единицы.

    ### Шаги
    1. Находим в «{{w}}» десятки.
    2. Находим единицы.
    3. Записываем десятки слева.

    ### Проверка
    Прочитайте запись вслух.

    ### Типичная ошибка
    E-num-place-100-glue-ten-value: склеить круглый десяток с единицами.
  feedback:
    correct: 'Верно: продиктованное число разобрано на десятки и единицы и записано по разрядам.'
    wrong:
      what: Запись продиктованного числа неверна.
      why: Возможно, лишний ноль от круглого десятка остался в записи или цифры стоят в порядке звучания.
      fix: Определите число десятков и единиц и запишите десятки слева, единицы справа.
      next: 'Раздел T03: правило записи по названию.'
- id: P-05
  type: number
  role: supported
  purpose: meaning
  level: 1
  outcome: LO-01
  sections:
  - T01
  - T03
  minutes: 1
  prompt: На бирке контейнера номер {{n}}. Сколько отдельных единиц означает левая цифра этого номера?
  answer: 40
  variants:
  - params:
      n: 46
    answer: 40
    solution: |
      ### Ответ
      40

      ### Идея
      Левая цифра стоит в разряде десятков: она показывает столько полных десятков, а в каждом десятке 10 единиц.

      ### Шаги
      1. В номере 46 слева стоит цифра 4 — это 4 десятка.
      2. Считаем десятками: десять, двадцать, тридцать, сорок — 40 единиц.
      3. Правая цифра 6 сюда не входит: она означает 6 единиц.

      ### Проверка
      40 единиц и ещё шесть — «сорок шесть», то есть 46.

      ### Типичная ошибка
      E-num-place-100-digit-for-value: назвать саму цифру 4 вместо 40.
  - params:
      n: 72
    answer: 70
    solution: |
      ### Ответ
      70

      ### Идея
      Левая цифра стоит в разряде десятков: она показывает столько полных десятков, а в каждом десятке 10 единиц.

      ### Шаги
      1. В номере 72 слева стоит цифра 7 — это 7 десятков.
      2. Считаем десятками: десять, двадцать, тридцать, сорок, пятьдесят, шестьдесят, семьдесят — 70 единиц.
      3. Правая цифра 2 сюда не входит: она означает 2 единицы.

      ### Проверка
      70 единиц и ещё два — «семьдесят два», то есть 72.

      ### Типичная ошибка
      E-num-place-100-digit-for-value: назвать саму цифру 7 вместо 70.
  - params:
      n: 95
    answer: 90
    solution: |
      ### Ответ
      90

      ### Идея
      Левая цифра стоит в разряде десятков: она показывает столько полных десятков, а в каждом десятке 10 единиц.

      ### Шаги
      1. В номере 95 слева стоит цифра 9 — это 9 десятков.
      2. Считаем десятками: десять, двадцать, тридцать, сорок, пятьдесят, шестьдесят, семьдесят, восемьдесят, девяносто — 90 единиц.
      3. Правая цифра 5 сюда не входит: она означает 5 единиц.

      ### Проверка
      90 единиц и ещё пять — «девяносто пять», то есть 95.

      ### Типичная ошибка
      E-num-place-100-digit-for-value: назвать саму цифру 9 вместо 90.
  hints:
