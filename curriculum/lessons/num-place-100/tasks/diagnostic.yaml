tasks:
- id: D-01
  type: number
  role: diagnostic
  purpose: procedure
  level: 0
  outcome: num-digits/LO-01
  sections:
  - T01
  minutes: 1
  prompt: 'Кладовщик пересчитал болты на лотке: их семь. Запишите это количество цифрой.'
  answer: 7
  hints:
  - Количество, которое называют одним словом от «один» до «девять», записывают одной цифрой.
  - Вспомните, какой знак ставят на ценнике, когда предметов семь.
  - 'Пересчитайте по порядку, начиная с 1: один, два, … семь — какой цифрой записывают последнее число?'
  solution: |
    ### Ответ
    7

    ### Идея
    Числа первого десятка записывают одной цифрой из десяти: 0, 1, …, 9.

    ### Шаги
    1. Называем количество: семь болтов.
    2. Число «семь» записывают цифрой 7.

    ### Проверка
    Считаем по одному: один, два, три, четыре, пять, шесть, семь — седьмое число записано цифрой 7.

    ### Типичная ошибка
    Записать соседнюю цифру (6 или 8), сбившись при пересчёте.
  feedback:
    correct: 'Верно: «семь» записывают одной цифрой 7.'
    wrong:
      what: Количество записано неверной цифрой.
      why: Возможно, при пересчёте пропущен или повторён один болт.
      fix: Пересчитайте болты по одному и запишите последнее названное число одной цифрой.
      next: 'Тема «Цифры и запись чисел до 20»: запись чисел первого десятка (повторение в T01).'
- id: D-02
  type: number
  role: diagnostic
  purpose: meaning
  level: 0
  outcome: num-digits/LO-01
  sections:
  - T01
  minutes: 1
  prompt: Число одиннадцать записали цифрами. Сколько раз в этой записи встречается цифра 1?
  answer: 2
  hints:
  - Цифра — это знак, а число — количество; одно число может записываться несколькими цифрами.
  - Вспомните, как выглядит запись числа «одиннадцать».
  - Запишите «одиннадцать» цифрами и пересчитайте в записи знаки 1.
  solution: |
    ### Ответ
    2

    ### Идея
    Число одиннадцать — это один десяток и ещё одна единица; в записи две цифры, и обе — единицы.

    ### Шаги
    1. «Одиннадцать» записывают как 11.
    2. В записи 11 два знака, и оба — цифра 1.

    ### Проверка
    Левая цифра 1 означает десяток, правая — одну единицу: всего одиннадцать, и цифра 1 стоит дважды.

    ### Типичная ошибка
    Ответить «1», путая число одиннадцать с цифрой 1.
  feedback:
    correct: 'Верно: в записи 11 цифра 1 стоит два раза — слева и справа.'
    wrong:
      what: Число цифр 1 в записи 11 найдено неверно.
      why: Возможно, число «одиннадцать» спутано с цифрой 1.
      fix: Запишите «одиннадцать» цифрами и посмотрите на оба места записи.
      next: 'Тема «Цифры и запись чисел до 20»: число и цифра (повторение в T01).'
- id: D-03
  type: number
  role: diagnostic
  purpose: procedure
  level: 1
  outcome: num-digits/LO-02
  sections:
  - T03
  minutes: 1
  prompt: Диспетчер продиктовал по телефону число «четырнадцать». Запишите его цифрами.
  answer: 14
  hints:
  - Числа от одиннадцати до девятнадцати состоят из одного десятка и нескольких единиц.
  - «Четырнадцать» — это «четыре на десяте», то есть сверх десятка.
  - «Четырнадцать» — это 1 десяток и сколько единиц? Десяток записывают слева.
  solution: |
    ### Ответ
    14

    ### Идея
    В слове «четырнадцать» сначала слышится «четыре», но в записи десяток стоит слева.

    ### Шаги
    1. «Четырнадцать» — один десяток и четыре единицы.
    2. Слева пишем 1, справа 4: 14.

    ### Проверка
    Читаем запись 14: десять и ещё четыре — «четырнадцать».

    ### Типичная ошибка
    Записать цифры в порядке звучания и получить 41.
  feedback:
    correct: 'Верно: «четырнадцать» — десяток и четыре единицы, запись 14.'
    wrong:
      what: Запись числа «четырнадцать» неверна.
      why: Возможно, цифры записаны в порядке звучания слова.
      fix: Выделите в слове десяток и единицы и поставьте десяток слева.
      next: 'Тема «Цифры и запись чисел до 20»: чтение записи вслух (повторение в T03).'
- id: D-04
  type: number
  role: diagnostic
  purpose: procedure
  level: 1
  outcome: num-digits/LO-02
  sections:
  - T02
  minutes: 1
  prompt: В пачке 10 конвертов, рядом лежат ещё 6 отдельных конвертов. Сколько всего конвертов? Запишите число цифрами.
  answer: 16
  hints:
  - Числа второго десятка — это десять и ещё несколько.
  - Пачка из 10 конвертов — это один десяток.
  - 'Досчитайте от 10 ещё 6 отдельных конвертов: одиннадцать, двенадцать, …'
  solution: |
    ### Ответ
    16

    ### Идея
    Пачка — десяток; число второго десятка записывают как 1 десяток и несколько единиц.

    ### Шаги
    1. Пачка — 10 конвертов, один десяток.
    2. Ещё 6 отдельных: шестнадцать, запись 16.

    ### Проверка
    Досчитаем от десяти: одиннадцать, двенадцать, тринадцать, четырнадцать, пятнадцать, шестнадцать.

    ### Типичная ошибка
    Сложить «1 пачка и 6 конвертов» как 7 штук, забыв, что в пачке 10.
  feedback:
    correct: 'Верно: десять конвертов в пачке и шесть отдельных — шестнадцать.'
    wrong:
      what: Число конвертов найдено неверно.
      why: Возможно, пачка посчитана как один конверт.
      fix: Начните счёт с десяти — столько конвертов в пачке — и досчитайте отдельные.
      next: 'Тема «Цифры и запись чисел до 20»: состав чисел второго десятка (повторение в T02).'
