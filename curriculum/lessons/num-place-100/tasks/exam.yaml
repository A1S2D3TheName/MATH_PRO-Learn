    hints:
    - Замена гири в 10 граммов десятью граммовыми гирями массу не меняет.
    - Сначала найдите число граммовых гирь, потом массу.
    - К {{u|pl:гире,гирям,гирям}} по 1 грамму добавили десять. Какое число второго десятка получилось?
    solution: |
      ### Ответ
      Граммовые гири и масса.

      ### Идея
      Размен десятка.

      ### Шаги
      1. Добавляем 10 граммовых гирь.
      2. Масса прежняя.

      ### Проверка
      Соберите десяток обратно.

      ### Типичная ошибка
      Считать, что масса изменилась.
    feedback:
      correct: 'Верно: граммовых гирь на весах стало на десяток больше, масса прежняя.'
      wrong:
        what: Число гирь или масса найдены неверно.
        why: Возможно, вместо десяти гирь добавлена одна или изменена масса.
        fix: Проверьте, что одна гиря в 10 граммов заменена ровно десятью гирями по 1 грамму.
        next: 'Раздел T02: обмен десяти единиц на десяток.'
  - id: EB-10
    type: number
    role: exam
    purpose: procedure
    level: 2
    outcome: LO-03
    sections:
    - T05
    minutes: 2
    points: 1
    prompt: Из трафаретов с цифрами 0, {{a}} и {{b}} (каждый — один раз) составляют двузначный номер. Какой наибольший номер можно составить?
    answer: 72
    variants:
    - params:
        a: 2
        b: 7
      answer: 72
      solution: |
        ### Ответ
        72

        ### Идея
        Чтобы число было наибольшим, в разряд десятков ставят самую большую цифру набора, а в разряд единиц — самую большую из оставшихся.

        ### Шаги
        1. В разряд десятков ставим самую большую цифру: 7.
        2. Остались 0 и 2; в разряд единиц ставим большую — 2.
        3. Получаем 72.

        ### Проверка
        Все числа из двух трафаретов: 20, 27, 70 и 72. Самое большое — 72.

        ### Типичная ошибка
        E-num-place-100-reuse-card: поставить 7 и в десятки, и в единицы и получить 77 — но второго такого знака в наборе нет.
    hints:
    - Решающий разряд — десятки.
    - Самая большая цифра — в десятки, затем большая из оставшихся — в единицы.
    - В десятки встанет {{b}}. Какой из трафаретов 0 и {{a}} лучше поставить справа?
    solution: |
      ### Ответ
      Наибольшее число из 0, {{a}}, {{b}}.

      ### Идея
      Большая цифра — в десятки.

      ### Шаги
      1. Десятки — {{b}}.
      2. Единицы — {{a}}.

      ### Проверка
      Выпишите все числа.

      ### Типичная ошибка
      E-num-place-100-reuse-card: взять цифру дважды.
    feedback:
      correct: 'Верно: наибольший номер составлен из двух разных трафаретов.'
      wrong:
        what: Наибольшее число составлено неверно.
        why: Возможно, одна цифра взята дважды или в десятках не самая большая цифра.
        fix: Каждую цифру можно взять один раз; самая большая из них встаёт в десятки.
        next: 'Раздел T05: составление чисел из набора цифр.'
      misconceptions:
      - id: E-num-place-100-reuse-card
        when:
          expr: 10 * b + b
        message: Цифра {{b}} взята дважды, а каждую можно использовать один раз.
  - id: EB-11
    type: number
    role: exam
    purpose: meaning
    level: 2
    outcome: LO-03
    sections:
    - T01
    - T05
    minutes: 2
    points: 1
    prompt: 'На ящиках написаны номера: {{s}}. Сколько из этих записей — двузначные числа?'
    answer: 4
    variants:
    - params:
        s: 04, 40, 4, 44, 400, 14, 41
      answer: 4
      solution: |
        ### Ответ
        4

        ### Идея
        Двузначное число записано двумя цифрами, и слева не ноль.

        ### Шаги
        1. Подходят: 40, 44, 14 и 41.
        2. Не подходят: 04, 4 и 400.
        3. Двузначных — 4.

        ### Проверка
        Запись с нулём слева — однозначное число, сто и больше — три цифры.

        ### Типичная ошибка
        Посчитать двузначной запись с нулём слева.
    hints:
    - Двузначное число — две цифры.
    - Ноль слева означает, что десятков нет.
    - 'Проверьте каждую запись из {{s}}: две ли в ней цифры и не ноль ли слева?'
    solution: |
      ### Ответ
      Число двузначных записей.

      ### Идея
      Две цифры и не ноль слева.

      ### Шаги
      1. Число цифр.
      2. Левая цифра.

      ### Проверка
      Прочитайте записи.

      ### Типичная ошибка
      Считать запись с нулём слева.
    feedback:
      correct: 'Верно: найдены все записи из двух цифр без нуля слева.'
      wrong:
        what: Число двузначных записей найдено неверно.
        why: Возможно, посчитана запись с нулём слева или из трёх цифр.
        fix: Проверьте у каждой записи число цифр и левую цифру.
        next: 'Раздел T05: составление чисел из набора цифр.'
  - id: EB-12
    type: number
    role: exam
    purpose: method
    level: 3
    outcome: LO-02
    sections:
    - T02
    - T04
    minutes: 3
    points: 2
    prompt: В первом ящике {{d|pl:пачка,пачки,пачек}} по 10 карандашей и {{u|pl:отдельный карандаш,отдельных карандаша,отдельных карандашей}}, во втором — {{c|pl:пачка,пачки,пачек}} по 10 карандашей и {{m|pl:отдельный карандаш,отдельных карандаша,отдельных карандашей}}. Сколько карандашей в том ящике, где их больше?
    answer: 59
    variants:
    - params:
        d: 2
        u: 33
        c: 5
        m: 9
      answer: 59
      solution: |
        ### Ответ
        59

        ### Идея
        Число пачек можно сравнивать только после обмена: в россыпи бывают целые десятки.

        ### Шаги
        1. Первый набор: 2 десятка и 33 единицы; после обмена — 53.
        2. Второй набор: 5 десятков и 9 единиц — 59.
        3. Десятков поровну (5), сравниваем единицы: 3 и 9. Больше 59.

        ### Проверка
        Россыпь 33 — это 3 десятка и ещё 3 единицы: первый набор равен 53.

        ### Типичная ошибка
        Сравнить число пачек до обмена (2 и 5).
    hints:
    - Сравнивать число пачек до обмена нельзя.
    - Запишите оба ящика обычными числами.
    - 'В первом ящике {{u}} отдельных карандашей: сколько из них выйдет пачек и сколько пачек станет вместо {{d}}?'
    solution: |
      ### Ответ
      Большее количество.

      ### Идея
      Обмен, затем сравнение.

      ### Шаги
      1. Первый набор числом.
      2. Второй набор числом.
      3. Сравнение.

      ### Проверка
      Сравните после обмена.

      ### Типичная ошибка
      Сравнить пачки до обмена.
    feedback:
      correct: 'Верно: карандаши первого ящика обменяны на пачки, и ящики сравнены по разрядам.'
      wrong:
        what: Больший набор определён неверно.
        why: Возможно, сравнивалось число пачек до обмена.
        fix: Запишите каждый набор обычным числом и только потом сравните по разрядам.
        next: 'Раздел T04: алгоритм поразрядного сравнения.'
  - id: EB-13
    type: number
    role: exam
    purpose: procedure
    level: 3
    outcome: LO-03
    sections:
    - T05
    minutes: 3
    points: 1
    prompt: Сколько двузначных чисел имеют цифру десятков {{d}} и цифру единиц больше {{u}}?
    answer: 3
    variants:
    - params:
        d: 8
        u: 6
      answer: 3
      solution: |
        ### Ответ
        3

        ### Идея
        Цифра десятков задана, цифры единиц перебираем от 0 до 9 и оставляем подходящие.

        ### Шаги
        1. Десятки — 8.
        2. Цифры единиц больше 6: 7, 8 и 9.
        3. Числа: 87, 88 и 89 — 3 числа.

        ### Проверка
        86 не подходит: цифра единиц равна 6, а нужна больше.

        ### Типичная ошибка
        Посчитать и само число 86 и получить 4 вместо 3.
    hints:
    - Цифры единиц — от 0 до 9.
    - Нужны только цифры единиц, которые больше заданной.
    - Начните с числа, у которого десятки {{d}}, а единицы — цифра, следующая за {{u}}.
    solution: |
      ### Ответ
      Количество чисел.

      ### Идея
      Перебор цифр единиц.

      ### Шаги
      1. Десятки {{d}}.
      2. Единицы больше {{u}}.

      ### Проверка
      Выпишите числа.

      ### Типичная ошибка
      Посчитать границу.
    feedback:
      correct: 'Верно: подходящие цифры единиц перебраны полностью.'
      wrong:
        what: Количество чисел найдено неверно.
        why: Возможно, посчитана граница или пропущена цифра.
        fix: Выпишите все подходящие числа и пересчитайте.
        next: 'Раздел T05: составление чисел из набора цифр.'
  - id: EB-14
    type: number
    role: exam
    purpose: method
    level: 3
    outcome: LO-03
    sections:
    - T05
    minutes: 3
    points: 1
    prompt: Номера мест — двузначные числа, у которых цифра десятков — {{s}}, а цифра единиц любая. Сколько таких номеров?
    answer: 40
    variants:
    - params:
        s: 1, 2, 5 или 9
      answer: 40
      solution: |
        ### Ответ
        40

        ### Идея
        Каждая цифра десятков даёт десяток чисел: цифра единиц пробегает 0–9.

        ### Шаги
        1. Цифры десятков: 1, 2, 5 и 9 — 4 цифры.
        2. Каждой цифре соответствует десяток чисел: 10–19; 20–29; 50–59; 90–99.
        3. 4 десятка чисел — 40.

        ### Проверка
        Считаем десятками: десять, двадцать, тридцать, сорок — сорок.

        ### Типичная ошибка
        E-num-place-100-digit-for-value: ответить 4 — числом десятков, а не числом номеров.
    hints:
    - Выписывать все номера не нужно.
    - Одна цифра десятков даёт десяток номеров.
    - Цифры десятков — {{s}}. Сколько это десятков номеров?
    solution: |
      ### Ответ
      Число номеров.

      ### Идея
      Десяток чисел на цифру десятков.

      ### Шаги
      1. Считаем цифры десятков.
      2. Считаем десятками.

      ### Проверка
      Счёт десятками.

      ### Типичная ошибка
      Назвать число цифр.
    feedback:
      correct: 'Верно: номера мест посчитаны десятками.'
      wrong:
        what: Число номеров найдено неверно.
        why: Возможно, названо число цифр десятков, а не число номеров.
        fix: Посчитайте, сколько номеров даёт одна цифра десятков, и сосчитайте десятками.
        next: 'Раздел T05: составление чисел из набора цифр.'
  - id: EB-15
    type: number
    role: exam
    purpose: transfer
    level: 4
    outcome: LO-03
    sections:
    - T05
    minutes: 4
    points: 2
    prompt: Номер камеры хранения — двузначное число из цифр {{s}}; цифры могут повторяться. Сколько разных номеров можно составить?
    answer: 12
    variants:
    - params:
        s: 0, 2, 5 и 6
      answer: 12
