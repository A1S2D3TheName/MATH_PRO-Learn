    - Номер не начинается с нуля.
    - Перебирайте номера по цифре десятков, затем по цифре единиц.
    - Выпишите все номера с цифрой десятков 2 из набора {{s}}; затем — с 5 и с 6.
    solution: |
      ### Ответ
      Число кодов.

      ### Идея
      Перебор по разрядам.

      ### Шаги
      1. Цифры десятков без нуля.
      2. Все цифры единиц.

      ### Проверка
      Пересчитайте.

      ### Типичная ошибка
      Ноль слева.
    feedback:
      correct: 'Верно: номера камер перебраны по разрядам, ноль слева не ставился.'
      wrong:
        what: Число кодов найдено неверно.
        why: Возможно, посчитаны коды с нулём слева или пропущены коды с повтором.
        fix: Выпишите коды по цифре десятков, затем по цифре единиц.
        next: 'Раздел T05: составление чисел из набора цифр.'
