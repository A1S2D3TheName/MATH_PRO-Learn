        Перебираем коды по цифре десятков (без нуля), внутри — по цифре единиц.

        ### Шаги
        1. С цифрой десятков 2: 20, 22, 25 и 26.
        2. С цифрой десятков 5: 50, 52, 55 и 56.
        3. С цифрой десятков 6: 60, 62, 65 и 66.
        4. Всего 12 кодов.

        ### Проверка
        Пересчёт списка даёт 12; кодов с нулём слева нет — это не двузначные числа.

        ### Типичная ошибка
        Посчитать запись с нулём слева, например 07, двузначным кодом.
