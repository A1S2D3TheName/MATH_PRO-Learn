      Граммовые гири и масса.

      ### Идея
      Размен десятка.

      ### Шаги
      1. Добавляем 10 граммовых гирь.
      2. Масса прежняя.

      ### Проверка
      Соберите десяток обратно.

      ### Типичная ошибка
      Считать, что масса изменилась.
    feedback:
      correct: 'Верно: граммовых гирь стало на десяток больше, масса не изменилась.'
      wrong:
        what: Число гирь или масса найдены неверно.
        why: Возможно, вместо десяти гирь добавлена одна или изменена масса.
        fix: Проверьте, что одна гиря в 10 граммов заменена ровно десятью гирями по 1 грамму.
        next: 'Раздел T02: обмен десяти единиц на десяток.'
  - id: EA-10
