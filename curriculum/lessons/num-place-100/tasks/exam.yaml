  - id: EA-12
    type: number
    role: exam
    purpose: method
    level: 3
    outcome: LO-02
    sections:
    - T02
    - T04
    minutes: 3
    points: 2
    prompt: На первом складе {{d|pl:пачка,пачки,пачек}} по 10 конвертов и {{u|pl:отдельный конверт,отдельных конверта,отдельных конвертов}}, на втором — {{c|pl:пачка,пачки,пачек}} по 10 конвертов и {{m|pl:отдельный конверт,отдельных конверта,отдельных конвертов}}. Сколько конвертов на том складе, где их больше?
    answer: 58
    variants:
