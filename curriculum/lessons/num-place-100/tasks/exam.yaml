        В названиях от двадцати до девяноста девяти первое слово называет десятки, второе — отдельные единицы.

        ### Шаги
        1. «сорок» — 4 десятка: в разряд десятков пишем 4.
        2. «один» — 1 единица: в разряд единиц пишем 1.
        3. Десятки слева, единицы справа: 41.

        ### Проверка
        Читаем запись 41 слева направо: «сорок один» — совпадает с продиктованным.

        ### Типичная ошибка
        E-num-place-100-glue-ten-value: записать «сорок» как 40 и приписать 1 — получится 401 вместо 41.
    hints:
    - В названии сначала звучат десятки, потом единицы.
    - У двузначного числа два места; круглое число целиком не пишут.
    - Сколько десятков и сколько единиц называет «{{w}}»?
    solution: |
      ### Ответ
      Число «{{w}}» цифрами.

      ### Идея
      Десятки слева, единицы справа.

      ### Шаги
      1. Десятки.
      2. Единицы.

      ### Проверка
      Прочитайте запись.

      ### Типичная ошибка
      E-num-place-100-glue-ten-value: оставить лишний ноль.
    feedback:
      correct: 'Верно: названное водителем число записано по разрядам.'
      wrong:
        what: Запись числа по названию неверна.
        why: Возможно, в записи остался лишний ноль или цифры стоят в порядке звучания.
        fix: Найдите в названии десятки и единицы и запишите их по разрядам.
        next: 'Раздел T03: правило записи по названию.'
  - id: EB-02
    type: number
    role: exam
    purpose: procedure
    level: 1
    outcome: LO-01
    sections:
    - T03
    minutes: 2
    points: 2
    prompt: 'В накладной записано: «{{u|pl:отдельная втулка,отдельные втулки,отдельных втулок}} и {{d|pl:полная кассета,полные кассеты,полных кассет}} по 10 втулок». Сколько всего втулок? Запишите число цифрами.'
    answer: 69
    variants:
    - params:
        d: 6
        u: 9
      answer: 69
      solution: |
        ### Ответ
        69

        ### Идея
        Порядок слов в описи не меняет разряды: число полных десятков всегда пишут слева, отдельные единицы — справа.

        ### Шаги
        1. Полных кассет — 6: это 6 десятков, в разряд десятков пишем 6.
