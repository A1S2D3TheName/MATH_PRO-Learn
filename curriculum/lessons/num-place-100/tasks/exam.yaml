variants:
- id: A
  tasks:
  - id: EA-01
    type: number
    role: exam
    purpose: procedure
    level: 1
    outcome: LO-01
    sections:
    - T03
    minutes: 2
    points: 2
    prompt: Бригадир продиктовал по телефону число «{{w}}». Запишите его цифрами.
    answer: 75
    variants:
    - params:
        w: семьдесят пять
      answer: 75
      solution: |
        ### Ответ
        75

        ### Идея
        В названиях от двадцати до девяноста девяти первое слово называет десятки, второе — отдельные единицы.

        ### Шаги
        1. «семьдесят» — 7 десятков: в разряд десятков пишем 7.
        2. «пять» — 5 единиц: в разряд единиц пишем 5.
        3. Десятки слева, единицы справа: 75.

        ### Проверка
        Читаем запись 75 слева направо: «семьдесят пять» — совпадает с продиктованным.

        ### Типичная ошибка
        E-num-place-100-glue-ten-value: записать «семьдесят» как 70 и приписать 5 — получится 705 вместо 75.
    hints:
    - Первое слово названия — десятки, второе — единицы.
    - 'Не пишите круглое число целиком: у двузначного числа ровно два места.'
    - Сколько десятков называет первое слово в «{{w}}» и сколько единиц — второе?
    solution: |
      ### Ответ
      Число «{{w}}» цифрами.

      ### Идея
      Десятки слева, единицы справа.

      ### Шаги
      1. Десятки.
      2. Единицы.

      ### Проверка
      Прочитайте запись.

      ### Типичная ошибка
      E-num-place-100-glue-ten-value: оставить лишний ноль.
    feedback:
      correct: 'Верно: продиктованное бригадиром число записано двумя цифрами по разрядам.'
      wrong:
        what: Запись числа по названию неверна.
        why: Возможно, в записи остался лишний ноль или цифры стоят в порядке звучания.
        fix: Найдите в названии десятки и единицы и запишите их по разрядам.
        next: 'Раздел T03: правило записи по названию.'
  - id: EA-02
    type: number
    role: exam
    purpose: procedure
    level: 1
    outcome: LO-01
    sections:
    - T03
    minutes: 2
    points: 2
    prompt: 'В инвентарной карточке записано: «{{u|pl:отдельный шплинт,отдельных шплинта,отдельных шплинтов}} и {{d|pl:полная пачка,полные пачки,полных пачек}} по 10 шплинтов». Сколько всего шплинтов? Запишите число цифрами.'
    answer: 96
    variants:
    - params:
        d: 9
        u: 6
      answer: 96
      solution: |
        ### Ответ
        96

        ### Идея
        Порядок слов в описи не меняет разряды: число полных десятков всегда пишут слева, отдельные единицы — справа.

        ### Шаги
        1. Полных пачек — 9: это 9 десятков, в разряд десятков пишем 9.
        2. Отдельных шплинтов — 6: в разряд единиц пишем 6.
        3. Записываем десятки слева, единицы справа: 96, хотя в описи единицы названы первыми.

        ### Проверка
        Читаем 96: «девяносто шесть» — 9 десятков и 6 единиц. Запись 69 означала бы 6 десятков и 9 единиц.

        ### Типичная ошибка
        E-num-place-100-swap-digits: записать числа в порядке описи и получить 69 вместо 96.
    hints:
    - Порядок слов в карточке не определяет порядок цифр.
    - Пачки — десятки, отдельные шплинты — единицы.
    - 'Полных пачек {{d}}: эта цифра пойдёт в разряд десятков. Какая — в разряд единиц?'
    solution: |
      ### Ответ
      Число: десятков — {{d}}, единиц — {{u}}.

      ### Идея
      Десятки слева при любом порядке слов.

      ### Шаги
      1. Десятки: {{d}}.
      2. Единицы: {{u}}.

      ### Проверка
      Прочитайте число.

      ### Типичная ошибка
      E-num-place-100-swap-digits: писать в порядке описи.
    feedback:
      correct: 'Верно: пачки шплинтов встали в разряд десятков, хотя в карточке названы вторыми.'
      wrong:
        what: Число записано неверно.
        why: Возможно, цифры записаны в порядке, в каком названы в карточке.
        fix: Поставьте слева число полных пачек, даже если в карточке оно названо вторым.
        next: 'Раздел T03: правило записи по названию.'
      misconceptions:
      - id: E-num-place-100-swap-digits
        when:
          expr: 10 * u + d
        message: 'Цифры стоят в порядке карточки: отдельные предметы попали в разряд десятков.'
      - id: E-num-place-100-add-digits
        when:
          expr: d + u
        message: Пачки посчитаны как отдельные предметы, а в каждой пачке их 10.
  - id: EA-03
    type: number
    role: exam
    purpose: meaning
    level: 1
    outcome: LO-01
    sections:
    - T01
    - T03
    minutes: 2
    points: 2
    prompt: На табло склада горит номер {{n}}. Сколько отдельных единиц означает левая цифра этого номера?
    answer: 80
    variants:
    - params:
        n: 83
      answer: 80
      solution: |
        ### Ответ
        80

        ### Идея
        Левая цифра — разряд десятков: столько полных десятков, в каждом 10 единиц.

        ### Шаги
        1. В числе 83 слева цифра 8 — это 8 десятков.
        2. Считаем десятками: десять, двадцать, тридцать, сорок, пятьдесят, шестьдесят, семьдесят, восемьдесят — 80 единиц.
        3. Правая цифра 3 означает 3 единицы и в ответ не входит.

        ### Проверка
        80 единиц и ещё три — «восемьдесят три», то есть 83.

        ### Типичная ошибка
        E-num-place-100-digit-for-value: назвать саму цифру 8 вместо 80.
    hints:
    - Спрашивают о значении цифры, а не о самой цифре.
    - Левая цифра — полные десятки; в каждом десятке 10 единиц.
    - Сколько полных десятков показывает левая цифра номера {{n}}? Посчитайте их десятками.
    solution: |
      ### Ответ
      Значение левой цифры {{n}}.

      ### Идея
      Цифра десятков — полные десятки.

      ### Шаги
      1. Левая цифра.
      2. Считаем десятками.

      ### Проверка
      Добавьте правую цифру.

      ### Типичная ошибка
      E-num-place-100-digit-for-value: назвать саму цифру.
    feedback:
      correct: 'Верно: левая цифра номера на табло пересчитана в единицы.'
      wrong:
        what: Значение цифры найдено неверно.
        why: Возможно, названа сама цифра или всё число.
        fix: Посчитайте, сколько единиц в полных десятках, которые показывает левая цифра.
        next: 'Раздел T01: таблица разрядов и пример «Чтение разрядов».'
      misconceptions:
      - id: E-num-place-100-digit-for-value
        when:
          expr: floor (n / 10)
        message: 'Это сама цифра, а спрашивают, сколько единиц она означает: в каждом десятке их 10.'
  - id: EA-04
    type: number
    role: exam
    purpose: method
    level: 1
    outcome: LO-01
    sections:
    - T01
    minutes: 2
    points: 2
    prompt: 'В типографии отпечатали {{n|pl:открытку,открытки,открыток}}: их уложили в коробки по 10, а остаток, меньше десяти, оставили отдельно. Сколько открыток лежит отдельно?'
    answer: 6
    variants:
    - params:
        n: 76
      answer: 6
      solution: |
        ### Ответ
        6

        ### Идея
        Полные коробки по 10 — десятки числа, отдельные открытки (меньше десяти) — его единицы.

        ### Шаги
        1. В числе 76 — 7 десятков и 6 единиц.
        2. 7 десятков — это полные коробки по 10.
        3. Отдельно лежат единицы: 6.

        ### Проверка
        Коробки по 10: 7, и ещё шесть — «семьдесят шесть».

        ### Типичная ошибка
        Назвать число коробок (7) вместо числа отдельных открыток.
    hints:
    - Коробки по 10 — десятки, отдельные открытки — единицы.
    - Считать открытки не нужно — достаточно записи числа.
    - Разложите {{n}} на десятки и единицы. Какой разряд отвечает за открытки вне коробок?
    solution: |
      ### Ответ
      Цифра единиц {{n}}.

      ### Идея
      Отдельные — единицы.

      ### Шаги
      1. Раскладываем {{n}}.
      2. Берём единицы.

      ### Проверка
      Соберите число.

      ### Типичная ошибка
      Назвать число пачек.
    feedback:
      correct: 'Верно: открытки вне коробок — это разряд единиц числа.'
      wrong:
        what: Число отдельных предметов найдено неверно.
        why: Возможно, названо число полных пачек.
        fix: Разложите число на десятки и единицы и выберите разряд, который отвечает за отдельные предметы.
        next: 'Раздел T01: таблица разрядов и пример «Чтение разрядов».'
  - id: EA-05
    type: number
    role: exam
    purpose: transfer
    level: 1
    outcome: LO-01
    sections:
    - T02
    minutes: 1
    points: 1
    prompt: В кассе {{d|pl:монета,монеты,монет}} по 10 рублей, а монет по 1 рублю нет. Сколько это рублей?
    answer: 100
    variants:
    - params:
        d: 10
      answer: 100
      solution: |
        ### Ответ
        100

        ### Идея
        Десять десятков — сотня; в разряде десятков помещается цифра не больше 9, поэтому сотню записывают тремя цифрами.

        ### Шаги
        1. Монета в 10 рублей — десяток рублей: их 10, это десять десятков.
        2. Девять десятков — девяносто; десятый десяток даёт сто.
        3. Записываем 100.

        ### Проверка
        Считаем десятками: десять, двадцать, тридцать, сорок, пятьдесят, шестьдесят, семьдесят, восемьдесят, девяносто, сто.

        ### Типичная ошибка
        E-num-place-100-add-digits: посчитать десять десятков как десять единиц и записать 10 вместо 100.
    hints:
    - Монета в 10 рублей — десяток рублей.
    - 'Считайте монеты десятками рублей: десять, двадцать, …'
    - Монет по 10 рублей {{d}}. Как называется столько десятков и как это записать?
    solution: |
      ### Ответ
      Сто.

      ### Идея
      Десять десятков — сотня.

      ### Шаги
      1. Считаем десятками.

      ### Проверка
      Десятый десяток — сто.

      ### Типичная ошибка
      E-num-place-100-add-digits: записать 10.
    feedback:
      correct: 'Верно: десять монет по 10 рублей — десять десятков, сто рублей.'
      wrong:
        what: Число найдено неверно.
        why: Возможно, десятки посчитаны как единицы.
        fix: Считайте десятками до конца и вспомните, как называется десять десятков.
        next: 'Раздел T02: обмен десяти единиц на десяток.'
  - id: EA-06
    type: number
    role: exam
    purpose: procedure
    level: 1
    outcome: LO-02
    sections:
    - T02
    minutes: 2
    points: 1
    prompt: На монтажном столе {{d|pl:полная кассета,полные кассеты,полных кассет}} по 10 винтов и {{u|pl:отдельный винт,отдельных винта,отдельных винтов}}. Сколько всего винтов? Запишите число цифрами.
    answer: 76
    variants:
    - params:
        d: 6
        u: 16
      answer: 76
      solution: |
        ### Ответ
        76

        ### Идея
        В разряде единиц помещается цифра от 0 до 9, поэтому из 16 винтов сначала собирают полные десятки, а потом записывают число.

        ### Шаги
        1. Из 16 отдельных винтов откладываем 10 — получается ещё один полный десяток, отдельно остаётся 6 винтов.
        2. Полных десятков до обмена — 6, с новым — 7. В разряд десятков пишем 7.
        3. В разряд единиц пишем 6. Число — 76.

        ### Проверка
        Пересчитаем десятками без обмена: десять, двадцать, тридцать, сорок, пятьдесят, шестьдесят (6 десятков), затем десятки из россыпи — семьдесят, и ещё шесть: семьдесят шесть.

        ### Типичная ошибка
        E-num-place-100-drop-regrouped-ten: записать справа 6, а собранные из россыпи десятки не добавить и получить 66 вместо 76.
    hints:
    - Отдельных винтов больше девяти.
    - Десять отдельных винтов — ещё одна полная кассета.
    - Из {{u}} отдельных винтов соберите кассету. Сколько кассет станет вместо {{d}}?
    solution: |
      ### Ответ
      Число после обмена.

      ### Идея
      Десять отдельных — десяток.

      ### Шаги
      1. Собираем десятки из {{u}}.
      2. Добавляем к {{d}}.

      ### Проверка
      Считаем десятками.

      ### Типичная ошибка
      E-num-place-100-drop-regrouped-ten: потерять новые десятки.
    feedback:
      correct: 'Верно: из отдельных винтов собрана кассета, и она добавлена к остальным.'
      wrong:
        what: Число после обмена записано неверно.
        why: Возможно, собранные из россыпи десятки не добавлены или россыпь приписана целиком.
        fix: Соберите из россыпи полные десятки, добавьте их к пачкам и запишите остаток справа.
        next: 'Раздел T02: обмен десяти единиц на десяток.'
      misconceptions:
      - id: E-num-place-100-drop-regrouped-ten
        when:
          expr: 10 * d + mod (u, 10)
        message: Остаток записан справа, но десятки из россыпи не добавлены к {{d}}.
      - id: E-num-place-100-unexchanged-ten
        when:
          expr: 100 * d + u
        message: Россыпь приписана целиком, а в разряде единиц помещается одна цифра.
      - id: E-num-place-100-add-digits
        when:
          expr: d + u
        message: Пачки посчитаны как отдельные предметы, а в каждой их 10.
  - id: EA-07
    type: number
    role: exam
    purpose: meaning
    level: 1
    outcome: LO-02
    sections:
    - T04
    minutes: 2
    points: 1
    prompt: В первой партии {{d|pl:полный десяток,полных десятка,полных десятков}} гаек и {{u|pl:отдельная гайка,отдельные гайки,отдельных гаек}}, во второй — {{c|pl:полный десяток,полных десятка,полных десятков}} и {{m|pl:отдельная гайка,отдельные гайки,отдельных гаек}}. Сколько гаек в той партии, где их больше?
    answer: 72
    variants:
    - params:
        d: 7
        u: 2
        c: 6
        m: 9
      answer: 72
      solution: |
        ### Ответ
        72

        ### Идея
        Сравнение начинают с десятков: девять отдельных единиц меньше одного десятка.

        ### Шаги
        1. Первая партия: 7 десятков и 2 единицы — 72.
        2. Вторая партия: 6 десятков и 9 единиц — 69.
        3. Десятков больше в первой (7 и 6): больше 72.

        ### Проверка
        Второй партии до 7 десятков не хватает одной единицы, а в первой они уже есть, да ещё 2 единицы.

        ### Типичная ошибка
        E-num-place-100-compare-by-ones: выбрать вторую партию, потому что 9 больше 2, и ответить 69.
    hints:
    - Сравнение начинают с десятков.
    - Запишите обе партии числами и сравните их левые цифры.
    - В первой партии {{d|pl:десяток,десятка,десятков}}, во второй — {{c|pl:десяток,десятка,десятков}}. Что решает сравнение?
    solution: |
      ### Ответ
      Большее количество.

      ### Идея
      Сначала десятки.

      ### Шаги
      1. Записываем партии числами.
      2. Сравниваем десятки.

      ### Проверка
      Сколько не хватает до десятка.

      ### Типичная ошибка
      E-num-place-100-compare-by-ones: сравнить по единицам.
    feedback:
      correct: 'Верно: лишний десяток гаек перевесил девять отдельных гаек.'
      wrong:
        what: Большая партия выбрана неверно.
        why: Возможно, сравнивались отдельные единицы, а не десятки.
        fix: Сначала сравните число полных десятков; единицы важны, только если десятков поровну.
        next: 'Раздел T04: алгоритм поразрядного сравнения.'
      misconceptions:
      - id: E-num-place-100-compare-by-ones
        when:
          expr: 10 * c + m
        message: У этой партии больше единиц, но меньше десятков, а десятки решают раньше.
  - id: EA-08
    type: number
    role: exam
    purpose: procedure
    level: 2
    outcome: LO-02
    sections:
    - T02
    minutes: 3
    points: 1
    prompt: В кассе театра {{d|pl:полная пачка,полные пачки,полных пачек}} по 10 билетов и коробка россыпи — {{u|pl:отдельный билет,отдельных билета,отдельных билетов}}. Сколько всего билетов? Запишите число цифрами.
    answer: 56
    variants:
    - params:
        d: 3
        u: 26
      answer: 56
      solution: |
        ### Ответ
        56

        ### Идея
        В разряде единиц помещается цифра от 0 до 9, поэтому из 26 билетов сначала собирают полные десятки, а потом записывают число.

        ### Шаги
        1. Из 26 отдельных билетов откладываем по 10 два раза — получается 2 новых полных десятка, отдельно остаётся 6 билетов.
        2. Полных десятков до обмена — 3; считаем дальше по одному на каждый новый десяток: 4, 5. В разряд десятков пишем 5.
        3. В разряд единиц пишем 6. Число — 56.

        ### Проверка
        Пересчитаем десятками без обмена: десять, двадцать, тридцать (3 десятка), затем десятки из россыпи — сорок, пятьдесят, и ещё шесть: пятьдесят шесть.

        ### Типичная ошибка
        E-num-place-100-drop-regrouped-ten: записать справа 6, а собранные из россыпи десятки не добавить и получить 36 вместо 56.
    hints:
    - В россыпи больше девяти билетов — в ней прячутся целые десятки.
    - Откладывайте из россыпи по 10, пока не останется меньше десяти.
    - Сколько полных десятков в россыпи {{u}}? Столько пачек добавится к {{d}}.
    solution: |
      ### Ответ
      Число после обмена.

      ### Идея
      Десять отдельных — десяток.

      ### Шаги
      1. Собираем десятки из {{u}}.
      2. Добавляем к {{d}}.

      ### Проверка
      Считаем десятками.

      ### Типичная ошибка
      E-num-place-100-drop-regrouped-ten: потерять новые десятки.
    feedback:
      correct: 'Верно: все десятки из россыпи билетов добавлены к пачкам.'
      wrong:
        what: Число после обмена записано неверно.
        why: Возможно, собранные из россыпи десятки не добавлены или россыпь приписана целиком.
        fix: Соберите из россыпи полные десятки, добавьте их к пачкам и запишите остаток справа.
        next: 'Раздел T02: обмен десяти единиц на десяток.'
      misconceptions:
      - id: E-num-place-100-drop-regrouped-ten
        when:
          expr: 10 * d + mod (u, 10)
        message: Остаток записан справа, но десятки из россыпи не добавлены к {{d}}.
      - id: E-num-place-100-unexchanged-ten
        when:
          expr: 100 * d + u
        message: Россыпь приписана целиком, а в разряде единиц помещается одна цифра.
      - id: E-num-place-100-add-digits
        when:
          expr: d + u
        message: Пачки посчитаны как отдельные предметы, а в каждой их 10.
  - id: EA-09
    type: numbers
    role: exam
    purpose: transfer
    level: 2
    outcome: LO-02
    sections:
    - T02
    minutes: 3
    points: 1
    prompt: На чаше весов {{d|pl:гиря,гири,гирь}} по 10 граммов и {{u|pl:гиря,гири,гирь}} по 1 грамму. Одну гирю в 10 граммов заменили десятью гирями по 1 грамму. Сколько теперь на чаше гирь по 1 грамму и сколько всего граммов?
    fields:
    - id: small
      label: Гирь по 1 грамму
    - id: total
      label: Всего граммов
    answer:
      small: 13
      total: 63
    variants:
    - params:
        d: 6
        u: 3
      answer:
        small: 13
        total: 63
      solution: |
        ### Ответ
        граммовых гирь: 13, всего граммов: 63

        ### Идея
        Гиря в 10 граммов весит как десять гирь по 1 грамму: замена не меняет массу.

        ### Шаги
        1. Граммовых гирь было 3, добавили десять — тринадцать, 13.
        2. Одна гиря в 10 граммов ушла с чаши.
        3. Масса прежняя: 6 десятков граммов и 3 грамма — 63.

        ### Проверка
        Соберём десяток граммовых гирь обратно: снова 6 десятков граммов и 3 грамма, 63.

        ### Типичная ошибка
        Считать, что после замены масса изменилась, и указать другое число вместо 63.
    hints:
