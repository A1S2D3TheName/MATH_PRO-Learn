  hints:
  - Для каждой карточки определите делимое и делитель.
  - При записи частного дробью делимое ставят над чертой, число групп — под чертой.
  - 'Для первой карточки начните с деления 11 : 6 и сохраните порядок чисел.'
  solution: |
    ### Ответ
    11 м кабеля между 6 стойками — 11/6; 5 л состава в 9 ёмкостей — 5/9; 8 листов в 3 комплекта — 8/3

    ### Идея
    Количество материала — делимое и числитель, число групп — делитель и знаменатель.

    ### Шаги
    1. 11 м кабеля между 6 стойками дают 11/6 метра на стойку.
    2. 5 л состава в 9 ёмкостей дают 5/9 литра на ёмкость.
    3. 8 листов в 3 комплекта дают 8/3 листа на комплект.

    ### Проверка
    В каждой паре дробь читается как исходное деление количества материала на число групп.

    ### Типичная ошибка
    E-frac-notation-swap: число групп ставят в числитель, а материал — в знаменатель.
  feedback:
    correct: 'Верно: каждое распределение записано дробью без перестановки делимого и делителя.'
    wrong:
