- id: P-05
  type: number
  role: supported
  purpose: meaning
  level: 1
  outcome: LO-01
  sections:
  - T01
  minutes: 1
  prompt: Ленту разрезали на {{b}} равных частей и взяли {{a|pl:часть,части,частей}}. Запишите взятую часть ленты дробью.
  answer: 2/7
  variants:
  - params:
      a: 2
      b: 7
    answer: 2/7
    solution: |
      ### Ответ
      2/7

      ### Идея
      Взятые части ленты дают числитель, все равные части — знаменатель.

      ### Шаги
      1. Лента разрезана на 7 частей — знаменатель 7.
      2. Взято 2 части — числитель 2.
      3. Запись: 2/7.

      ### Проверка
      Осталось 5 частей; взятые и оставшиеся вместе дают 7 частей ленты.

      ### Типичная ошибка
      E-frac-notation-swap: числитель и знаменатель поменяли местами.
  - params:
      a: 5
      b: 9
    answer: 5/9
    solution: |
      ### Ответ
      5/9

      ### Идея
      Взятые части ленты дают числитель, все равные части — знаменатель.

      ### Шаги
      1. Лента разрезана на 9 частей — знаменатель 9.
      2. Взято 5 частей — числитель 5.
      3. Запись: 5/9.

      ### Проверка
      Осталось 4 частей; взятые и оставшиеся вместе дают 9 частей ленты.

      ### Типичная ошибка
      E-frac-notation-swap: числитель и знаменатель поменяли местами.
  hints:
  - Число частей, на которые разрезали ленту, становится знаменателем.
  - Число взятых частей ленты становится числителем.
  - Запишите взятые части над всеми частями ленты.
  solution: |
    ### Ответ
    {{a}}/{{b}}

    ### Идея
    Взятые части ленты дают числитель, все равные части — знаменатель.

    ### Шаги
    1. Лента разрезана на {{b|pl:часть,части,частей}} — знаменатель {{b}}.
    2. Взято {{a|pl:часть,части,частей}} — числитель {{a}}.
    3. Запись: {{a}}/{{b}}.

    ### Проверка
    Оставшиеся части вместе со взятыми составляют всю ленту из {{b}} частей.

    ### Типичная ошибка
    E-frac-notation-swap: числитель и знаменатель поменяли местами.
  feedback:
    correct: 'Верно: взятая часть ленты записана дробью {{a}}/{{b}}.'
    wrong:
      what: Дробь для ленты записана неверно.
      why: Возможно, разрезанные и взятые части поменялись ролями.
      fix: Под чертой — число частей разреза, над чертой — взятые части.
      next: Раздел T01, пример 1.
- id: P-06
  type: number
  role: supported
  purpose: procedure
  level: 1
  outcome: LO-02
  sections:
  - T02
  minutes: 1
  prompt: Целое разделили на {{b}} равных частей. Запишите одну такую часть дробью.
  answer: 1/6
  variants:
  - params:
      b: 6
    answer: 1/6
    solution: |
      ### Ответ
      1/6

      ### Идея
      Одна часть из равных — единичная дробь со знаменателем, равным числу частей.

      ### Шаги
      1. Целое разделено на 6 частей.
      2. Одна часть записывается 1/6.

      ### Проверка
      Таких частей 6 составляют целое: 6 долей по 1/6.

      ### Типичная ошибка
      E-frac-notation-unit: дробь приняли за одну единичную долю, не посчитав доли по числителю.
  - params:
      b: 9
    answer: 1/9
    solution: |
      ### Ответ
      1/9

      ### Идея
      Одна часть из равных — единичная дробь со знаменателем, равным числу частей.

      ### Шаги
      1. Целое разделено на 9 частей.
      2. Одна часть записывается 1/9.

      ### Проверка
      Таких частей 9 составляют целое: 9 долей по 1/9.

      ### Типичная ошибка
      E-frac-notation-unit: дробь приняли за одну единичную долю, не посчитав доли по числителю.
  hints:
  - Одна взятая часть из равных записывается единичной дробью.
  - Знаменатель единичной дроби равен числу частей целого.
  - Запишите единицу над числом частей целого.
  solution: |
    ### Ответ
    1/{{b}}

    ### Идея
    Одна часть из равных — единичная дробь со знаменателем, равным числу частей.

    ### Шаги
    1. Целое разделено на {{b}} частей.
    2. Одна часть записывается 1/{{b}}.

    ### Проверка
    Такие части в числе {{b}} составляют целое.

    ### Типичная ошибка
    E-frac-notation-unit: дробь приняли за одну единичную долю, не посчитав доли по числителю.
  feedback:
    correct: 'Верно: одна часть целого записана единичной дробью.'
    wrong:
      what: Одна часть записана неверно.
      why: Возможно, число частей целого не стало знаменателем.
      fix: Единицу пишите над числом равных частей.
      next: Раздел T02.
