tasks:
- id: P-01
  type: number
  role: warmup
  purpose: procedure
  level: 0
  outcome: LO-01
  sections:
  - T01
  minutes: 1
  prompt: Запишите дробь с числителем {{a}} и знаменателем {{b}}.
  answer: 2/5
  variants:
  - params:
      a: 2
      b: 5
    answer: 2/5
    solution: |
      ### Ответ
      2/5

      ### Идея
      Числитель ставят над чертой, знаменатель — под чертой.

      ### Шаги
      1. Над чертой пишем 2.
      2. Под чертой пишем 5.
      3. Получаем запись 2/5.

      ### Проверка
      Чтение записи: числитель 2, доля по знаменателю 5 — взято 2 долей из 5 равных.

      ### Типичная ошибка
      E-frac-notation-swap: числитель и знаменатель поменяли местами.
  - params:
      a: 3
      b: 4
    answer: 3/4
    solution: |
      ### Ответ
      3/4

      ### Идея
      Числитель ставят над чертой, знаменатель — под чертой.

      ### Шаги
      1. Над чертой пишем 3.
      2. Под чертой пишем 4.
      3. Получаем запись 3/4.

      ### Проверка
      Чтение записи: числитель 3, доля по знаменателю 4 — взято 3 долей из 4 равных.

      ### Типичная ошибка
      E-frac-notation-swap: числитель и знаменатель поменяли местами.
  hints:
  - Над дробной чертой пишут числитель, под чертой — знаменатель.
  - Сначала поставьте число взятых частей, затем число частей целого.
  - Запишите первое из названных чисел над чертой, второе — под чертой.
  solution: |
    ### Ответ
    {{a}}/{{b}}

    ### Идея
    Числитель ставят над чертой, знаменатель — под чертой.

    ### Шаги
    1. Над чертой пишем {{a}}.
    2. Под чертой пишем {{b}}.
    3. Получаем запись {{a}}/{{b}}.

    ### Проверка
    Чтение записи: числитель {{a}}, доля по знаменателю {{b}}.

    ### Типичная ошибка
    E-frac-notation-swap: числитель и знаменатель поменяли местами.
  feedback:
    correct: 'Верно: дробь записана с числителем {{a}} над чертой и знаменателем {{b}} под чертой.'
    wrong:
      what: Запись дроби неверна.
      why: Возможно, числа над и под чертой поменялись местами.
      fix: Над чертой пишите числитель, под чертой — знаменатель.
      next: Раздел T01, пример 2.
- id: P-02
  type: number
  role: warmup
  purpose: meaning
  level: 0
  outcome: LO-01
  sections:
  - T01
  minutes: 1
  prompt: Полоска разделена на {{b}} равных частей, закрашено {{a}} частей. Запишите закрашенную часть дробью.
  answer: 3/7
  variants:
  - params:
      a: 3
      b: 7
    answer: 3/7
    solution: |
      ### Ответ
      3/7

      ### Идея
      Закрашенные части дают числитель, все части полоски — знаменатель.

      ### Шаги
      1. Всего равных частей: 7.
      2. Закрашено частей: 3.
      3. Запись: 3/7.

      ### Проверка
      Свободных частей 4; вместе с закрашенными это 7 частей — вся полоска.

      ### Типичная ошибка
      E-frac-notation-swap: числитель и знаменатель поменяли местами.
  - params:
      a: 2
      b: 9
    answer: 2/9
    solution: |
      ### Ответ
      2/9

      ### Идея
      Закрашенные части дают числитель, все части полоски — знаменатель.

      ### Шаги
      1. Всего равных частей: 9.
      2. Закрашено частей: 2.
      3. Запись: 2/9.

      ### Проверка
      Свободных частей 7; вместе с закрашенными это 9 частей — вся полоска.

      ### Типичная ошибка
      E-frac-notation-swap: числитель и знаменатель поменяли местами.
  hints:
  - Знаменатель полоски равен числу всех её равных частей.
  - Числитель равен числу закрашенных частей.
  - Запишите закрашенные части над всеми частями полоски.
  solution: |
    ### Ответ
    {{a}}/{{b}}

    ### Идея
    Закрашенные части дают числитель, все части полоски — знаменатель.

    ### Шаги
    1. Всего равных частей: {{b}}.
    2. Закрашено частей: {{a}}.
    3. Запись: {{a}}/{{b}}.

    ### Проверка
    Свободных частей на полоске меньше, чем закрашенных и свободных вместе: всего частей {{b}}.

    ### Типичная ошибка
    E-frac-notation-swap: числитель и знаменатель поменяли местами.
  feedback:
    correct: 'Верно: закрашено {{a}} частей из {{b}}, запись дроби составлена по полоске.'
    wrong:
      what: Дробь по полоске записана неверно.
      why: Возможно, закрашенные части и все части поменялись местами.
      fix: Числитель — закрашенные части, знаменатель — все части.
      next: Раздел T01, пример 1.
- id: P-03
  type: number
  role: warmup
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
