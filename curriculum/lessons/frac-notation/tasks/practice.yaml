    solution: |
      ### Ответ
      4

      ### Идея
      Числитель — число над дробной чертой.

      ### Шаги
      1. В записи 4/9 над чертой стоит 4.
      2. Числитель равен 4.

      ### Проверка
      Под чертой стоит 9 — это знаменатель, а не числитель.

      ### Типичная ошибка
      E-frac-notation-swap: числитель и знаменатель поменяли местами.
  - params:
      a: 6
      b: 11
    answer: 6
    solution: |
      ### Ответ
      6

      ### Идея
      Числитель — число над дробной чертой.

      ### Шаги
      1. В записи 6/11 над чертой стоит 6.
      2. Числитель равен 6.

      ### Проверка
      Под чертой стоит 11 — это знаменатель, а не числитель.

      ### Типичная ошибка
      E-frac-notation-swap: числитель и знаменатель поменяли местами.
  hints:
  - Числитель стоит над дробной чертой.
  - Посмотрите на верхнее число записи дроби.
  - Верхнее число дроби и есть искомый числитель.
  solution: |
    ### Ответ
    {{a}}

    ### Идея
    Числитель — число над дробной чертой.

    ### Шаги
    1. В записи {{a}}/{{b}} над чертой стоит {{a}}.
    2. Числитель равен {{a}}.

    ### Проверка
    Под чертой стоит {{b}} — это знаменатель, другое число записи.

    ### Типичная ошибка
    E-frac-notation-swap: числитель и знаменатель поменяли местами.
  feedback:
    correct: 'Верно: числитель дроби {{a}}/{{b}} назван правильно.'
    wrong:
      what: Числитель назван неверно.
      why: Возможно, названо число под чертой.
      fix: Ищите число над дробной чертой.
      next: Раздел T01.
