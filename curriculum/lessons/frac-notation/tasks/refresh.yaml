tasks:
- id: R-01
  type: number
  role: refresh
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T01
  minutes: 3
  prompt: Запишите дробь с числителем {{a}} и знаменателем {{b}}.
  answer: 4/7
  variants:
  - params:
      a: 4
      b: 7
    answer: 4/7
    solution: |
      ### Ответ
      4/7

      ### Идея
      Числитель ставят над чертой, знаменатель — под чертой.

      ### Шаги
      1. Над чертой пишем 4.
      2. Под чертой пишем 7.
      3. Получаем запись 4/7.

      ### Проверка
      Чтение записи: числитель 4, доля по знаменателю 7 — взято 4 долей из 7 равных.

      ### Типичная ошибка
      E-frac-notation-swap: числитель и знаменатель поменяли местами.
  - params:
      a: 3
      b: 11
    answer: 3/11
    solution: |
      ### Ответ
      3/11

      ### Идея
      Числитель ставят над чертой, знаменатель — под чертой.

      ### Шаги
      1. Над чертой пишем 3.
      2. Под чертой пишем 11.
      3. Получаем запись 3/11.

      ### Проверка
      Чтение записи: числитель 3, доля по знаменателю 11 — взято 3 долей из 11 равных.

      ### Типичная ошибка
      E-frac-notation-swap: числитель и знаменатель поменяли местами.
  - params:
      a: 6
      b: 11
    answer: 6/11
    solution: |
      ### Ответ
      6/11

      ### Идея
      Числитель ставят над чертой, знаменатель — под чертой.

      ### Шаги
      1. Над чертой пишем 6.
      2. Под чертой пишем 11.
      3. Получаем запись 6/11.

      ### Проверка
      Чтение записи: числитель 6, доля по знаменателю 11 — взято 6 долей из 11 равных.

      ### Типичная ошибка
      E-frac-notation-swap: числитель и знаменатель поменяли местами.
  hints:
  - Сначала найдите в условии число, названное числителем.
  - Второе названное число задаёт знаменатель и остаётся под чертой.
  - Верхняя позиция — {{a}}, нижняя — {{b}}.
  solution: |
    ### Ответ
    {{a}}/{{b}}

    ### Идея
    Числитель над чертой, знаменатель под чертой.

    ### Шаги
    1. Над чертой пишем {{a}}.
    2. Под чертой пишем {{b}}.

    ### Проверка
    Чтение записи называет числитель {{a}} и долю по знаменателю {{b}}.

    ### Типичная ошибка
    E-frac-notation-swap: числитель и знаменатель поменяли местами.
  feedback:
    correct: 'Верно: дробь с числителем {{a}} и знаменателем {{b}} записана верно.'
    wrong:
      what: Запись дроби неверна.
      why: Возможно, числа над и под чертой поменялись.
      fix: Числитель пишите сверху.
      next: Раздел T01.
- id: R-02
  type: number
  role: refresh
  purpose: meaning
  level: 2
  outcome: LO-02
  sections:
  - T02
  minutes: 3
  prompt: Целое разделили на {{b}} равных частей. Запишите одну такую часть дробью.
  answer: 1/8
  variants:
  - params:
      b: 8
    answer: 1/8
    solution: |
      ### Ответ
      1/8

      ### Идея
      Одна часть из равных — единичная дробь со знаменателем, равным числу частей.

      ### Шаги
      1. Целое разделено на 8 частей.
      2. Одна часть записывается 1/8.

      ### Проверка
      Таких частей 8 составляют целое: 8 долей по 1/8.

      ### Типичная ошибка
      E-frac-notation-unit: дробь приняли за одну единичную долю, не посчитав доли по числителю.
  - params:
      b: 7
    answer: 1/7
    solution: |
      ### Ответ
      1/7

      ### Идея
      Одна часть из равных — единичная дробь со знаменателем, равным числу частей.

      ### Шаги
      1. Целое разделено на 7 частей.
      2. Одна часть записывается 1/7.

      ### Проверка
      Таких частей 7 составляют целое: 7 долей по 1/7.

      ### Типичная ошибка
      E-frac-notation-unit: дробь приняли за одну единичную долю, не посчитав доли по числителю.
  - params:
      b: 11
    answer: 1/11
    solution: |
      ### Ответ
      1/11

      ### Идея
      Одна часть из равных — единичная дробь со знаменателем, равным числу частей.

      ### Шаги
      1. Целое разделено на 11 частей.
      2. Одна часть записывается 1/11.

      ### Проверка
      Таких частей 11 составляют целое: 11 долей по 1/11.

      ### Типичная ошибка
      E-frac-notation-unit: дробь приняли за одну единичную долю, не посчитав доли по числителю.
  hints:
  - Речь идёт ровно об одной из равных частей.
  - Число {{b}} показывает весь разрез целого.
  - Оставьте единицу сверху, а число частей поставьте снизу.
  solution: |
    ### Ответ
    1/{{b}}

    ### Идея
    Одна часть из равных — единичная дробь.

    ### Шаги
    1. Целое разделено на {{b}} частей.
    2. Одна часть: 1/{{b}}.

    ### Проверка
    В числе {{b}} такие части составляют целое.

    ### Типичная ошибка
    E-frac-notation-unit: дробь приняли за одну единичную долю, не посчитав доли по числителю.
  feedback:
    correct: 'Верно: одна часть целого записана как 1/{{b}}.'
    wrong:
      what: Одна часть записана неверно.
      why: Возможно, число частей не стало знаменателем.
      fix: Единицу пишите над числом частей.
      next: Раздел T02.
- id: R-03
  type: number
  role: refresh
  purpose: transfer
  level: 3
  outcome: LO-03
  sections:
  - T03
  minutes: 3
  prompt: 'Запишите частное {{a}} : {{b}} в виде дроби.'
  answer: 8/3
  variants:
  - params:
      a: 8
      b: 3
    answer: 8/3
    solution: |
      ### Ответ
      8/3

      ### Идея
      Частное записывают дробью: делимое над чертой, делитель под чертой.

      ### Шаги
      1. Делимое равно 8 — числитель.
      2. Делитель равен 3 — знаменатель.
      3. Запись: 8/3.

      ### Проверка
      Чтение дроби как деления даёт 8 разделить на 3 — исходное частное.

      ### Типичная ошибка
      E-frac-notation-sum-parts: дробную черту ошибочно приняли за знак сложения.
  - params:
      a: 9
      b: 5
    answer: 9/5
    solution: |
      ### Ответ
      9/5

      ### Идея
      Частное записывают дробью: делимое над чертой, делитель под чертой.

      ### Шаги
      1. Делимое равно 9 — числитель.
      2. Делитель равен 5 — знаменатель.
      3. Запись: 9/5.

      ### Проверка
      Чтение дроби как деления даёт 9 разделить на 5 — исходное частное.

      ### Типичная ошибка
      E-frac-notation-sum-parts: дробную черту ошибочно приняли за знак сложения.
  - params:
      a: 11
      b: 7
    answer: 11/7
    solution: |
      ### Ответ
      11/7

      ### Идея
      Частное записывают дробью: делимое над чертой, делитель под чертой.

      ### Шаги
      1. Делимое равно 11 — числитель.
      2. Делитель равен 7 — знаменатель.
      3. Запись: 11/7.

      ### Проверка
      Чтение дроби как деления даёт 11 разделить на 7 — исходное частное.

      ### Типичная ошибка
      E-frac-notation-sum-parts: дробную черту ошибочно приняли за знак сложения.
  hints:
  - Дробная черта заменяет знак деления.
  - Делимое частного становится числителем.
  - Поставьте делимое над чертой, делитель под ней.
  solution: |
    ### Ответ
    {{a}}/{{b}}

    ### Идея
    Частное записывают дробью: делимое над чертой, делитель под чертой.

    ### Шаги
    1. Делимое равно {{a}}.
    2. Делитель равен {{b}}.
    3. Запись: {{a}}/{{b}}.

    ### Проверка
    Чтение дроби делением возвращает частное {{a}} : {{b}}.

    ### Типичная ошибка
    E-frac-notation-sum-parts: дробную черту ошибочно приняли за знак сложения.
  feedback:
    correct: 'Верно: частное {{a}} : {{b}} — записано дробью верно.'
    wrong:
      what: Частное записано неверно.
      why: Возможно, делимое и делитель поменялись местами.
      fix: Делимое пишите над чертой.
      next: Раздел T03, пример 2.
- id: R-04
  type: choice
  role: refresh
  purpose: meaning
  level: 2
  outcome: LO-01
  sections:
  - T04
  minutes: 3
  prompt: Как читается дробь 5/6?
  options:
  - id: a
    text: Пять шестых
  - id: b
    text: Шесть пятых
    misconception: E-frac-notation-swap
    why: Числа названия переставлены.
  - id: c
    text: Одна шестая
    misconception: E-frac-notation-unit
    why: Названа одна доля вместо пяти.
  - id: d
    text: Пятьдесят шесть
    misconception: E-frac-notation-concat
    why: Дробная черта исчезла, а цифры склеены в число 56.
  answer: a
  hints:
  - Словесная запись должна сохранить верхнее число 5 как количество долей.
  - Знаменатель 6 даёт слово «шестых».
  - Ищите вариант, где количество названо раньше размера доли.
  solution: |
    ### Ответ
    Пять шестых

    ### Идея
    Чтение начинают с числителя, затем называют долю по знаменателю.

    ### Шаги
    1. Числитель равен 5 — «пять».
    2. Доля по знаменателю 6 — «шестых».
    3. Название: пять шестых.

    ### Проверка
    Запись по названию «пять шестых» даёт 5/6 — исходная дробь.

    ### Типичная ошибка
    E-frac-notation-concat: числа по разные стороны черты склеили в одно натуральное число.
  feedback:
    correct: 'Верно: дробь 5/6 прочитана как «пять шестых».'
    wrong:
      what: Название дроби неверно.
      why: Возможно, названа одна доля вместо нескольких.
      fix: Читайте верхнее число и имя доли по нижнему.
      next: Раздел T04, пример 1.
- id: R-05
  type: number
  role: refresh
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T01
  minutes: 3
  prompt: Назовите числитель дроби {{a}}/{{b}}.
  answer: 5
  variants:
  - params:
      a: 5
      b: 6
    answer: 5
    solution: |
      ### Ответ
      5

      ### Идея
      Числитель — число над дробной чертой.

      ### Шаги
      1. В записи 5/6 над чертой стоит 5.
      2. Числитель равен 5.

      ### Проверка
      Под чертой стоит 6 — это знаменатель, а не числитель.

      ### Типичная ошибка
      E-frac-notation-swap: числитель и знаменатель поменяли местами.
  - params:
      a: 7
      b: 10
    answer: 7
    solution: |
      ### Ответ
      7

      ### Идея
      Числитель — число над дробной чертой.

      ### Шаги
      1. В записи 7/10 над чертой стоит 7.
      2. Числитель равен 7.

      ### Проверка
      Под чертой стоит 10 — это знаменатель, а не числитель.

      ### Типичная ошибка
      E-frac-notation-swap: числитель и знаменатель поменяли местами.
  - params:
      a: 4
      b: 11
    answer: 4
    solution: |
      ### Ответ
      4

      ### Идея
      Числитель — число над дробной чертой.

      ### Шаги
      1. В записи 4/11 над чертой стоит 4.
      2. Числитель равен 4.

      ### Проверка
      Под чертой стоит 11 — это знаменатель, а не числитель.

      ### Типичная ошибка
      E-frac-notation-swap: числитель и знаменатель поменяли местами.
  hints:
  - Числитель дроби стоит над чертой.
  - Верхнее число показывает число взятых долей.
  - Назовите верхнее число записи.
  solution: |
    ### Ответ
    {{a}}

    ### Идея
    Числитель — число над дробной чертой.

    ### Шаги
    1. В записи {{a}}/{{b}} над чертой стоит {{a}}.
    2. Числитель равен {{a}}.

    ### Проверка
    Число {{b}} под чертой — знаменатель записи.

    ### Типичная ошибка
    E-frac-notation-swap: числитель и знаменатель поменяли местами.
  feedback:
    correct: 'Верно: числитель дроби {{a}}/{{b}} назван верно.'
    wrong:
      what: Числитель назван неверно.
      why: Возможно, названо число под чертой.
      fix: Числитель ищите над чертой.
      next: Раздел T01.
