variants:
- id: A
  tasks:
  - id: EA-01
    type: number
    role: exam
    purpose: procedure
    level: 1
    points: 1
    outcome: LO-01
    sections:
    - T01
    minutes: 2
    prompt: Запишите дробь с числителем 3 и знаменателем 8.
    answer: 3/8
    hints:
    - Числитель пишут над дробной чертой.
    - Знаменатель пишут под дробной чертой.
    - Запишите число взятых долей над числом долей целого.
    solution: |
      ### Ответ
      3/8

      ### Идея
      Числитель над чертой, знаменатель под чертой.

      ### Шаги
      1. Над чертой пишем 3.
      2. Под чертой пишем 8.
      3. Запись: 3/8.

      ### Проверка
      Чтение записи: числитель 3, доля по знаменателю 8.

      ### Типичная ошибка
      E-frac-notation-swap: числитель и знаменатель поменяли местами.
    feedback:
      correct: 'Верно: дробь 3/8 записана с правильным порядком чисел.'
      wrong:
        what: Запись дроби неверна.
        why: Возможно, числа над и под чертой поменялись местами.
        fix: Над чертой пишите числитель.
        next: Раздел T01.
  - id: EA-02
    type: number
    role: exam
    purpose: procedure
    level: 1
    points: 1
    outcome: LO-01
    sections:
    - T01
    minutes: 2
    prompt: Назовите знаменатель дроби 5/11.
    answer: 11
    hints:
    - Знаменатель стоит под дробной чертой.
    - Нижнее число показывает число частей целого.
    - Назовите нижнее число записи.
    solution: |
      ### Ответ
      11

      ### Идея
      Знаменатель — число под дробной чертой.

      ### Шаги
      1. В записи 5/11 под чертой стоит 11.
      2. Знаменатель равен 11.

      ### Проверка
      Число 5 над чертой — числитель записи.

      ### Типичная ошибка
      E-frac-notation-swap: числитель и знаменатель поменяли местами.
    feedback:
      correct: 'Верно: знаменатель дроби 5/11 назван правильно.'
      wrong:
        what: Знаменатель назван неверно.
        why: Возможно, названо число над чертой.
        fix: Знаменатель ищите под чертой.
        next: Раздел T01.
  - id: EA-03
    type: number
    role: exam
    purpose: meaning
    level: 1
    points: 1
    outcome: LO-02
    sections:
    - T02
    minutes: 2
    prompt: Целое разделили на 7 равных частей. Запишите одну такую часть дробью.
    answer: 1/7
    hints:
    - Одна часть из равных записывается единичной дробью.
    - Знаменатель равен числу частей целого.
    - Запишите единицу над числом частей.
    solution: |
      ### Ответ
      1/7

      ### Идея
      Одна из 7 равных частей — единичная доля со знаменателем 7.

      ### Шаги
      1. Целое разделено на 7 частей.
      2. Одна часть записывается 1/7.

      ### Проверка
      Семь таких частей составляют целое.

      ### Типичная ошибка
      E-frac-notation-unit: дробь приняли за одну единичную долю, не посчитав доли по числителю.
    feedback:
      correct: 'Верно: одна часть из семи записана как 1/7.'
      wrong:
        what: Одна часть записана неверно.
        why: Возможно, число частей не стало знаменателем.
        fix: Единицу пишите над числом частей.
        next: Раздел T02.
  - id: EA-04
    type: number
    role: exam
    purpose: procedure
    level: 2
    points: 2
    outcome: LO-01
    sections:
    - T01
    minutes: 3
    prompt: Торт разрезали на 10 равных кусков и взяли 4 куска. Запишите взятую часть торта дробью.
    answer: 4/10
    hints:
    - Знаменатель задаёт разрез торта на равные куски.
    - Числитель считает взятые куски торта.
    - Запишите взятые куски над всеми кусками разреза.
    solution: |
      ### Ответ
      4/10

      ### Идея
      Взятые куски дают числитель, разрез торта — знаменатель.

      ### Шаги
      1. Торт разрезан на 10 кусков.
      2. Взято 4 куска.
      3. Запись: 4/10.

      ### Проверка
      Оставшиеся 6 кусков вместе со взятыми дают 10 кусков торта.

      ### Типичная ошибка
      E-frac-notation-swap: числитель и знаменатель поменяли местами.
    feedback:
      correct: 'Верно: взятая часть торта записана дробью 4/10.'
      wrong:
        what: Часть торта записана неверно.
        why: Возможно, взятые куски и разрез поменялись ролями.
        fix: Над чертой — взятые куски торта.
        next: Раздел T01, пример 1.
  - id: EA-05
    type: number
    role: exam
    purpose: meaning
    level: 2
    points: 2
    outcome: LO-02
    sections:
    - T02
    minutes: 3
    prompt: Сколько единичных долей составляет дробь 6/11? Введите число долей.
    answer: 6
    hints:
    - Единичная доля имеет числитель, равный единице.
    - Число единичных долей читают по числителю.
    - Число долей равно верхнему числу дроби.
    solution: |
      ### Ответ
      6

      ### Идея
      Числитель считает единичные доли в дроби.

      ### Шаги
      1. Единичная доля — 1/11.
      2. В дроби 6/11 таких долей 6.

      ### Проверка
      Счёт долей по одной собирает дробь 6/11.

      ### Типичная ошибка
      E-frac-notation-unit: дробь приняли за одну единичную долю, не посчитав доли по числителю.
    feedback:
      correct: 'Верно: в дроби 6/11 сосчитано шесть единичных долей.'
      wrong:
        what: Число единичных долей неверно.
        why: Возможно, дробь принята за одну долю.
        fix: Доли считайте по числителю.
        next: Раздел T02, пример 2.
