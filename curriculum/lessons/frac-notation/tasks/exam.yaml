    minutes: 3
    prompt: Один и тот же арбуз на рисунке разрезан на 4 части, а на другом рисунке — на 9 частей. Введите знаменатель большей
      единичной доли.
    answer: 4
    hints:
    - Единичные доли сравнивают по числу частей разреза.
    - При большем числе частей доля того же арбуза меньше.
    - Большей доле отвечает меньший знаменатель.
    solution: |
      ### Ответ
      4

      ### Идея
      Единичная доля больше у разреза с меньшим числом частей.

      ### Шаги
      1. Доли: 1/4 и 1/9.
      2. Меньшее число частей — 4.
      3. Большей доле отвечает знаменатель 4.

      ### Проверка
      Разрез на 4 части даёт более крупные доли, чем разрез на 9 частей.

      ### Типичная ошибка
      E-frac-notation-unit: дробь приняли за одну единичную долю, не посчитав доли по числителю.
    feedback:
      correct: 'Верно: большая единичная доля арбуза определена по меньшему знаменателю.'
      wrong:
        what: Большая доля выбрана неверно.
        why: Возможно, большим назван больший знаменатель.
        fix: Меньше частей разреза — крупнее доля.
        next: Раздел T02, пример 1.
  - id: EA-11
    type: number
    role: exam
    purpose: transfer
    level: 3
    points: 3
    outcome: LO-03
    sections:
    - T03
    minutes: 3
    prompt: 11 метров верёвки разрезают на 6 равных кусков. Запишите дробью длину одного куска в метрах.
    answer: 11/6
    hints:
    - Длина куска — частное всей верёвки и числа кусков.
    - Частное записывают дробью с делимым над чертой.
    - Поставьте всю верёвку над числом кусков.
    solution: |
      ### Ответ
      11/6

      ### Идея
      Длина одного куска — частное 11 : 6, записанное дробью.

      ### Шаги
      1. Вся верёвка 11 метров, кусков 6: деление 11 : 6.
      2. Запись дробью: 11/6.

      ### Проверка
      Обратный счёт: 6 кусков по 11/6 метра дают 66 шестых — 11 метров.

      ### Типичная ошибка
      E-frac-notation-sum-parts: дробную черту ошибочно приняли за знак сложения.
    feedback:
      correct: 'Верно: длина одного куска верёвки записана дробью 11/6.'
      wrong:
        what: Длина куска записана неверно.
        why: Возможно, верёвка и куски поменялись местами в дроби.
        fix: Вся верёвка — делимое, число кусков — делитель.
        next: Раздел T03, пример 3.
  - id: EA-12
    type: number
    role: exam
    purpose: transfer
    level: 3
    points: 3
    outcome: LO-02
    sections:
    - T02
    minutes: 3
    prompt: Сколько единичных долей со знаменателем 8 нужно взять, чтобы получить ровно два целых? Введите число долей.
    answer: 16
    hints:
    - Одно целое состоит из стольких долей, каков знаменатель.
    - Два целых требуют удвоенного числа долей.
    - Удвойте число долей одного целого.
    solution: |
      ### Ответ
      16

      ### Идея
      Одно целое собирают из 8 долей, два целых — из удвоенного числа.

      ### Шаги
      1. Одно целое — 8 долей размера 1/8.
      2. Два целых — 8 + 8 = 16 долей.

      ### Проверка
      Деление 16 долей на 8 долей в целом даёт 2 целых.

      ### Типичная ошибка
      E-frac-notation-unit: дробь приняли за одну единичную долю, не посчитав доли по числителю.
    feedback:
      correct: 'Верно: два целых собраны из шестнадцати восьмых долей.'
      wrong:
        what: Число долей для двух целых неверно.
        why: Возможно, посчитаны доли одного целого.
        fix: Найдите доли одного целого и удвойте.
        next: Раздел T02, пример 2.
