  - id: EA-08
    type: number
    role: exam
    purpose: procedure
    level: 2
    points: 2
    outcome: LO-01
    sections:
    - T04
    minutes: 3
    prompt: 'Запишите дробь по названию: четыре девятых. Введите числитель этой дроби.'
    answer: 4
    hints:
    - Название дроби содержит количество долей первым словом.
    - Имя доли в названии даёт знаменатель.
    - Числитель равен первому числу названия.
    solution: |
      ### Ответ
      4

      ### Идея
      По названию числитель — количество долей, имя доли даёт знаменатель.

      ### Шаги
      1. Название «четыре девятых»: количество — четыре.
      2. Доля «девятых» даёт знаменатель 9.
      3. Дробь 4/9, числитель равен 4.

      ### Проверка
      Чтение дроби 4/9 даёт «четыре девятых» — исходное название.

      ### Типичная ошибка
      E-frac-notation-swap: числитель и знаменатель поменяли местами.
    feedback:
      correct: 'Верно: числитель дроби «четыре девятых» найден по названию.'
      wrong:
        what: Числитель по названию неверен.
        why: Возможно, названо число частей из имени доли.
        fix: Числитель берите из первого слова названия.
        next: Раздел T04, пример 3.
  - id: EA-09
    type: choice
    role: exam
    purpose: meaning
    level: 2
    points: 2
    outcome: LO-01
    sections:
    - T04
    minutes: 3
    prompt: Как читается дробь 2/7?
    options:
    - id: a
      text: Семь вторых
      misconception: E-frac-notation-swap
      why: Числа названия переставлены.
    - id: b
      text: Одна седьмая
      misconception: E-frac-notation-unit
      why: Названа одна доля вместо двух.
    - id: c
      text: Две седьмых
    - id: d
      text: Двадцать семь
      misconception: E-frac-notation-concat
      why: Дробная черта исчезла, а цифры ошибочно склеены в одно натуральное число.
    answer: c
    hints:
    - Название начинают с числителя дроби.
    - Имя доли берут по знаменателю дроби.
    - Сопоставьте первое слово названия с верхним числом.
    solution: |
      ### Ответ
      Две седьмых

      ### Идея
      Чтение начинают с числителя, затем называют долю по знаменателю.

      ### Шаги
      1. Числитель равен 2 — «две».
      2. Доля по знаменателю 7 — «седьмых».
      3. Название: две седьмых.

      ### Проверка
      Запись по названию «две седьмых» даёт 2/7 — исходная дробь.

      ### Типичная ошибка
      E-frac-notation-concat: числа по разные стороны черты склеили в одно натуральное число.
    feedback:
      correct: 'Верно: дробь 2/7 прочитана как «две седьмых».'
      wrong:
        what: Название дроби неверно.
        why: Возможно, переставлены количество и имя доли.
        fix: Читайте верхнее число и имя доли по нижнему.
        next: Раздел T04, пример 1.
  - id: EA-10
    type: number
    role: exam
    purpose: method
    level: 3
    points: 2
    outcome: LO-02
    sections:
