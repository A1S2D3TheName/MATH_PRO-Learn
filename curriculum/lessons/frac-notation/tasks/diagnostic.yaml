tasks:
- id: D-01
  type: number
  role: diagnostic
  purpose: meaning
  level: 1
  outcome: frac-unit/LO-01
  sections:
  - T01
  minutes: 1
  prompt: Целое разделили на 6 равных частей. Запишите дробью одну такую часть.
  answer: 1/6
  hints:
  - 'Вспомните тему о доле целого: одна часть записывается дробью со знаменателем, равным числу частей.'
  - Числитель у одной взятой части равен единице.
  - Запишите единицу над числом всех равных частей.
  solution: |
    ### Ответ
    1/6

    ### Идея
    Одна из 6 равных частей — единичная доля со знаменателем 6.

    ### Шаги
    1. Число равных частей целого равно 6.
    2. Берётся 1 часть.
    3. Запись: 1/6.

    ### Проверка
    Шесть таких частей составляют целое: 6 долей по 1/6 дают 6/6.

    ### Типичная ошибка
    E-frac-notation-swap: одну часть записали над неверным числом всех частей.
  feedback:
    correct: 'Верно: одна из шести равных частей записана как 1/6.'
    wrong:
      what: Доля записана неверно.
      why: Возможно, число частей целого не стало знаменателем.
      fix: Поставьте под чертой число равных частей, а над чертой — одну взятую часть.
      next: Повторите единичную дробь в теме frac-unit.
- id: D-02
  type: number
  role: diagnostic
  purpose: meaning
  level: 1
  outcome: frac-unit/LO-01
  sections:
  - T01
  minutes: 1
  prompt: Полоску разделили на 8 равных частей. Сколько равных частей составляет вся полоска?
  answer: 8
  hints:
  - Вспомните модель полоски из темы о долях целого.
  - Нужно сосчитать все равные части, а не только одну выбранную.
  - Назовите число частей, на которые разделена вся полоска.
  solution: |
    ### Ответ
    8

    ### Идея
    Вся полоска состоит из всех равных частей её разреза.

    ### Шаги
    1. Полоска разделена на равные части.
    2. По условию таких частей 8.
    3. Вся полоска состоит из 8 частей.

    ### Проверка
    Если взять все 8 частей, ни одна часть полоски не останется вне собранного целого.

    ### Типичная ошибка
    Сосчитать только одну выбранную долю вместо всех равных частей целого.
  feedback:
    correct: 'Верно: вся полоска состоит из восьми равных частей.'
    wrong:
      what: Число частей всей полоски названо неверно.
      why: Возможно, посчитана одна доля вместо всего разреза.
      fix: Сосчитайте все равные части полоски.
      next: Повторите модель полоски в теме frac-unit.
- id: D-03
  type: number
  role: diagnostic
  purpose: meaning
  level: 1
  outcome: frac-unit/LO-02
  sections:
  - T02
  minutes: 2
  prompt: В коробке 10 карандашей. Сколько карандашей составляет половина коробки?
  answer: 5
  hints:
  - Половина — это одна из двух равных частей группы.
  - Разделите число карандашей на две равные группы.
  - Сосчитайте карандаши в одной из двух равных групп.
  solution: |
    ### Ответ
    5

    ### Идея
    Половина группы из 10 предметов — одна из двух равных групп по 5.

    ### Шаги
    1. Всего карандашей 10.
    2. Делим на 2 равные группы.
    3. В одной группе 5 карандашей.

    ### Проверка
    Две группы по 5 карандашей дают 10 — исходная коробка.

    ### Типичная ошибка
    Половиной называют одну из двух равных групп; нельзя оставить группы разного размера.
  feedback:
    correct: 'Верно: половина коробки из 10 карандашей — это 5 карандашей.'
    wrong:
      what: Размер половины найден неверно.
      why: Возможно, группа разделена не на две равные части.
      fix: Разделите 10 карандашей на две группы с одинаковым числом предметов.
      next: Повторите долю от группы предметов в теме frac-unit.
- id: D-04
  type: number
  role: diagnostic
  purpose: meaning
  level: 1
  outcome: frac-unit/LO-02
  sections:
  - T02
  minutes: 2
  prompt: Ленту разрезали на 3 равные части. Запишите дробью длину одной части ленты.
  answer: 1/3
  hints:
  - Одна часть из трёх равных — треть ленты.
  - Знаменатель дроби равен числу равных частей ленты.
  - Запишите одну взятую часть над числом всех частей.
  solution: |
    ### Ответ
    1/3

    ### Идея
    Одна из 3 равных частей — треть, единичная доля со знаменателем 3.

    ### Шаги
    1. Лента разрезана на 3 равные части.
    2. Берётся 1 часть.
    3. Запись: 1/3.

    ### Проверка
    Три такие части составляют всю ленту: 3 доли по 1/3 дают 3/3.

    ### Типичная ошибка
    E-frac-notation-swap: одну треть перевернули и записали как 3/1.
  feedback:
    correct: 'Верно: одна часть ленты из трёх равных записана как 1/3.'
    wrong:
      what: Доля записана неверно.
      why: Возможно, число частей не стало знаменателем.
      fix: Поставьте под чертой число, на которое разрезали ленту.
      next: Повторите половину, треть и четверть в теме frac-unit.
