    sections: [T01]
  - id: frac-notation/smysl-znamenatelya-kak-chisla
    title: "Смысл знаменателя как числа равных долей"
    tree_ref: "Смысл знаменателя как числа равных долей"
    synonyms: [знаменатель, число равных долей, размер доли]
    sections: [T02]
  - id: frac-notation/drob-kak-rezultat-deleniya
    title: "Дробь как результат деления"
    tree_ref: "Дробь как результат деления"
    synonyms: [дробь как деление, частное, делимое и делитель]
    sections: [T03, T05]
