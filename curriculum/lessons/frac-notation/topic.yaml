outcomes:
  - id: LO-01
    short: Записывает и читает дробь
    action: записывает дробь по числителю и знаменателю, по рисунку и по названию
    conditions: числитель и знаменатель не больше 12
    criterion: верная запись и верное чтение в 4 случаях из 5
    level: core
    sections: [T01, T04]
  - id: LO-02
    short: Объясняет смысл знаменателя
    action: называет число равных долей целого, считает единичные доли и сравнивает единичные доли одного целого
    conditions: знаменатель от 2 до 12, сравниваемые единичные доли относятся к одному целому
    criterion: верный ответ с объяснением через число и размер равных долей в 4 случаях из 5
    level: standard
    sections: [T02]
  - id: LO-03
    short: Связывает дробь с делением
    action: записывает частное дробью, а дробь — делением, и находит делимое и делитель
    conditions: делимое и делитель натуральные, делитель не равен нулю
    criterion: верная запись в обе стороны в 4 случаях из 5
    level: deep
    sections: [T03, T04, T05]

errors:
  - E-frac-notation-swap
  - E-frac-notation-unit
  - E-frac-notation-sum-parts
  - E-frac-notation-concat
