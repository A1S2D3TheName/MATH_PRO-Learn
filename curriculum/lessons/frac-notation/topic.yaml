id: frac-notation
title: "Числитель, знаменатель и запись дроби"
section: frac
stage: 1
hours: 2
grade: "3–4"
prerequisites: [frac-unit]
version: "1.0.0"
summary: >
  Дробь записывают двумя числами через дробную черту: числитель считает выбранные
  равные доли, знаменатель показывает, на сколько равных долей разделено целое.
  Запись дроби читают вслух и понимают как результат деления числителя на знаменатель.

search:
  synonyms:
    - дробь
    - запись дроби
    - числитель
    - знаменатель
    - дробная черта
    - единичная дробь
    - чтение дроби
    - дробь как деление
    - доля целого
    - части целого
    - a/b
    - как читать дробь
  questions:
    - Как записать дробь?
    - Что такое числитель?
    - Что такое знаменатель?
    - Как читать дробь вслух?
    - Почему дробь можно считать делением?
    - Как записать три четверти?
    - Как назвать дробь 5/2?
    - Что показывает знаменатель?
    - Как по рисунку записать дробь?
    - Чем одна треть отличается от одной пятой?

