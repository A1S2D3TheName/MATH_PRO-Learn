    title: "Разряды и классы, разрядная сетка"
    tree_ref: "Разряды и классы, разрядная сетка"
    synonyms: [разряд, место цифры, класс разрядов, разрядная сетка, значение цифры]
    sections: [T01, T05]
  - id: num-place-large/read-write
    title: "Чтение и запись многозначных чисел"
    tree_ref: "Чтение и запись многозначных чисел"
    synonyms: [чтение числа, запись числа, нули-заполнители, запись по классам]
    sections: [T02, T05]
  - id: num-place-large/compare
    title: "Сравнение по старшему разряду"
    tree_ref: "Сравнение по старшему разряду"
    synonyms: [сравнение чисел, старший разряд, большее число, упорядочивание чисел]
