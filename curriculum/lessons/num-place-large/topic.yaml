outcomes:
  - id: LO-01
    short: Класс и разряд цифры, чтение числа
    action: называет класс и разряд цифры и её значение, читает многозначное число по классам
    conditions: >
      целые числа от 0 до 999 999 999, записанные с разбивкой на классы и без неё; в записи
      встречаются нули внутри класса и пустые старшие разряды; без калькулятора
    criterion: >
      верно называет класс и разряд заданной цифры, её значение и читает число по классам,
      не пропуская нули-заполнители
    level: core
    sections: [T01, T02]
  - id: LO-02
    short: Сравнение и разрядные слагаемые
    action: сравнивает многозначные числа по старшему разряду и записывает разрядное слагаемое заданного разряда
    conditions: >
      целые числа от 0 до 999 999 999; в паре различается число цифр либо цифры начиная
      со старшего разряда; указан разряд искомого слагаемого
    criterion: >
      называет разряд, в котором числа впервые различаются, выбирает большее число и верно
      вычисляет разрядное слагаемое
    level: standard
    sections: [T03, T04]
  - id: LO-03
    short: Проверка и восстановление записи
    action: >
      находит первое расхождение в разложении длинного числа, восстанавливает число по описанию
      разрядов и перебирает числа, которые можно составить из заданных цифр
    conditions: >
      целые числа от 0 до 999 999 999 999; записи с нулями-заполнителями, описания вида
      «в разряде десятков тысяч стоит 3», наборы различных цифр
    criterion: >
      указывает первый неверный разряд при сравнении с суммой разрядных слагаемых, собирает
      все числа из набора цифр без пропусков и повторов
    level: deep
    sections: [T05, T06]

errors:
