# Паспорт темы (STANDARD.md §3). Поля section/stage/hours/grade/prerequisites скопированы из
# tree.yaml — не редактируйте их здесь (правило 6).
id: num-place-large
title: "Многозначные числа, классы и разряды"
section: num
stage: 1
hours: 3
grade: "3–4"
prerequisites: [num-place-100]
version: "1.0.0"
summary: >
  Место цифры в записи многозначного числа задаёт её значение, а тройки разрядов объединяются
  в классы: единиц, тысяч, миллионов. Тема учит называть класс и разряд цифры, читать и
  записывать числа по классам вместе с нулями-заполнителями, сравнивать числа по старшему
  разряду и записывать их суммой разрядных слагаемых.

search:
  synonyms:
    - разряды и классы
    - класс разрядов
    - разрядная сетка
    - чтение многозначных чисел
    - запись многозначных чисел
    - сколько разрядов в числе
    - значение цифры в числе
    - вес разряда
    - разложение числа по разрядам
    - разрядные слагаемые
    - сравнение многозначных чисел
    - сравнение по старшему разряду
    - как читать большое число
    - миллионы и тысячи
    - нули внутри записи числа
  questions:
    - Что такое разряд и чем он отличается от класса разрядов?
    - Как называется место цифры в записи числа?
    - Почему цифра 8 в числе 48 000 значит 8 000?
    - Как читается многозначное число?
    - Как записать число по разрядам, если часть разрядов пуста?
    - Что такое разрядная сетка?
    - Как сравнить два многозначных числа?
    - Почему при сравнении чисел смотрят на старший разряд?
    - Как разложить число на разрядные слагаемые?
    - Как проверить, что число записано по разрядам правильно?
    - Сколько классов в числе 12 480 000?
    - Что будет, если пропустить нуль в середине записи?

