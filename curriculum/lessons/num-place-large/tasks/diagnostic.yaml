# Входная диагностика по прямому пререквизиту (§6, правило 15): 4 задачи по теме
# num-place-100 «Десятки и единицы до 100», outcome записан как `<тема>/LO-NN`.
tasks:
  - id: D-01
    type: number
    role: diagnostic
    purpose: procedure
    level: 1
    outcome: num-place-100/LO-01
    sections:
      - T01
    minutes: 1
    errors:
      - E-num-place-large-place-down
    prompt: 'В теме про десятки и единицы: в числе 47 цифра 4 стоит в разряде десятков. Чему равно значение этой цифры?'
    answer: 40
    hints:
      - Разряд десятков — второе место справа в двузначном числе.
      - Одна единица разряда десятков равна десяти единицам разряда единиц.
      - Умножьте цифру десятков на десять и запишите результат.
    solution: |
      ### Ответ
      Значение цифры 4 в разряде десятков равно 40.

      ### Идея
      Значение цифры в разряде десятков считают умножением на десять.

      ### Шаги
      1. Находим цифру в разряде десятков: это 4.
      2. Одна единица разряда десятков равна 10, значит 4 десятка — это 40.
      3. Записываем ответ.

      ### Проверка
      В числе 47 четыре десятка и семь единиц: 40 + 7 = 47.

      ### Типичная ошибка
      E-num-place-large-place-down: посчитать 4 десятка за 4 единицы и получить 4 вместо 40.
    feedback:
      correct: 'Верно: четыре десятка — это 40.'
      wrong:
        what: Значение цифры посчитано как единицы.
        why: Цифра в разряде десятков значит десятки, а не единицы.
        fix: Умножьте цифру разряда десятков на десять.
        next: Повторите материал темы про десятки и единицы до 100.
  - id: D-02
    type: number
    role: diagnostic
    purpose: procedure
    level: 1
    outcome: num-place-100/LO-03
    sections:
      - T03
    minutes: 1
    errors:
      - E-num-place-large-compare-direction
    prompt: 'В теме про десятки и единицы: какое из чисел больше — 68 или 71? Введите большее число.'
    answer: 71
    hints:
      - Сравнивайте числа по старшему разряду — разряду десятков.
      - Шесть десятков меньше семи десятков.
      - После сравнения десятков проверьте, какое число названо в ответе.
    solution: |
      ### Ответ
      Больше число 71.

      ### Идея
      Двузначные числа сравнивают по разряду десятков, а при равенстве — по разряду единиц.

      ### Шаги
      1. Сравниваем десятки: 6 против 7.
      2. Семи десяткам отвечает число 71, шести — 68.
      3. Значит, больше 71.

      ### Проверка
      На числовой прямой 68 стоит левее 71, поэтому 71 больше.

      ### Типичная ошибка
      E-num-place-large-compare-direction: назвать меньшее число, сравнив единицы (8 больше 1).
    feedback:
      correct: 'Верно: 71 больше 68, потому что семь десятков больше шести.'
      wrong:
        what: Названо не то число.
        why: Сравнение пошло по разряду единиц, хотя разряд десятков уже различался.
        fix: Сравнивайте числа по разряду десятков, а единицы — только при равных десятках.
        next: Повторите сравнение двузначных чисел.
  - id: D-03
    type: numbers
    role: diagnostic
    purpose: procedure
    level: 1
    outcome: num-place-100/LO-01
    sections:
      - T01
    minutes: 2
    errors:
      - E-num-place-large-place-down
    prompt: 'В теме про десятки и единицы: в числе 85 назовите цифру разряда десятков и цифру разряда единиц.'
    answer:
      t: 8
      u: 5
    fields:
      - id: t
        label: Цифра разряда десятков
      - id: u
        label: Цифра разряда единиц
    hints:
      - 'Разряды в двузначном числе идут справа налево: единицы, потом десятки.'
      - Первая цифра записи стоит в разряде десятков, вторая — в разряде единиц.
      - Записывайте только цифры, без слов.
    solution: |
      ### Ответ
      В разряде десятков стоит 8, в разряде единиц — 5.

      ### Идея
      Место цифры в записи задаёт её разряд.

      ### Шаги
      1. Читаем запись слева направо: 8, затем 5.
      2. Первая цифра занимает разряд десятков.
      3. Вторая цифра занимает разряд единиц.

      ### Проверка
      Число 85 состоит из восьми десятков и пяти единиц: 80 + 5 = 85.

      ### Типичная ошибка
      E-num-place-large-place-down: поменять разряды и назвать в разряде десятков цифру 5.
    feedback:
      correct: 'Верно: 8 десятков и 5 единиц.'
      wrong:
        what: Цифры разрядов перепутаны.
        why: 'Разряды идут справа налево: последняя цифра записи — единицы.'
        fix: Отсчитайте разряды от правого края записи.
        next: Разберите запись двузначных чисел.
  - id: D-04
    type: number
    role: diagnostic
    purpose: procedure
    level: 1
    outcome: num-place-100/LO-02
    sections:
      - T01
    minutes: 2
    errors:
      - E-num-place-large-skip-zeros
    prompt: 'В теме про десятки и единицы: запишите число, в котором шесть десятков и ни одной единицы.'
    answer: 60
    hints:
      - Десятки занимают первое место записи двузначного числа.
      - Если единиц нет, на их месте стоит нуль.
      - Запись из одних десятков всё равно двузначная.
    solution: |
      ### Ответ
      Число, в котором шесть десятков и ни одной единицы, — это 60.

      ### Идея
      Разряд единиц может быть пустым, и тогда его место занимает нуль.

      ### Шаги
      1. Ставим цифру 6 в разряд десятков.
      2. Разряд единиц пуст, ставим на его место нуль.
      3. Получаем запись 60.

      ### Проверка
      Разложим: шесть десятков — это 60, нуль единиц ничего не добавляет.

      ### Типичная ошибка
      E-num-place-large-skip-zeros: записать только цифру 6 и получить однозначное число вместо 60.
    feedback:
      correct: 'Верно: шесть десятков записывают как 60.'
      wrong:
        what: Запись потеряла нуль разряда единиц.
        why: Без нуля запись читается как шесть единиц, а не шесть десятков.
        fix: Ставьте нуль в пустой разряд, чтобы запись сохранила свой размер.
        next: Повторите запись круглых чисел.
