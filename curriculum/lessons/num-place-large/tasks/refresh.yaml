  - id: R-03
    type: choice
    role: refresh
    purpose: meaning
    level: 2
    outcome: LO-01
    sections:
      - T02
    minutes: 3
    errors:
      - E-num-place-large-skip-zeros
      - E-num-place-large-place-up
      - E-num-place-large-place-down
    prompt: Какая запись соответствует числу «пять миллионов сорок тысяч»?
    answer: a
    options:
      - id: a
        text: 5 040 000
        why: Класс миллионов — 5, класс тысяч — 040, класс единиц пуст.
      - id: b
        text: 5 000 040
        why: Здесь сорок стоит в классе единиц, а не в классе тысяч.
        misconception: E-num-place-large-place-down
      - id: c
        text: 5 400 000
        why: Здесь сорок тысяч записаны как четыреста тысяч — на ступень старше.
        misconception: E-num-place-large-place-up
      - id: d
        text: 5 040
        why: Здесь потерян класс единиц и запись короче нужной.
        misconception: E-num-place-large-skip-zeros
    hints:
      - 'Названы два класса: миллионы и тысячи.'
      - Сорок тысяч — это 040 в классе тысяч, то есть 4 в разряде десятков тысяч.
      - Не забудьте закрыть нулями пустой класс единиц.
    solution: |
      ### Ответ
      Верна запись 5 040 000.

      ### Идея
      Число записывают по классам: сначала миллионы, затем тысячи, затем единицы.

      ### Шаги
      1. Класс миллионов: 5.
      2. Класс тысяч: сорок тысяч — это 040.
      3. Класс единиц пуст, ставим 000.
      4. Собираем запись: 5 | 040 | 000.

      ### Проверка
      Читаем запись по классам: пять миллионов сорок тысяч — слова совпадают с условием.

      ### Типичная ошибка
      E-num-place-large-place-down: записать сорок тысяч как 40 в классе единиц.
    feedback:
      correct: 'Верно: классы расставлены по своим местам.'
      wrong:
        what: Выбрана запись со сдвинутым или потерянным классом.
        why: Класс тысяч занимает три разряда, и его место нельзя занимать цифрами класса единиц.
        fix: Запишите классы отдельными тройками и заполните пустые места нулями.
        next: Разберите пример 2 раздела T02.
