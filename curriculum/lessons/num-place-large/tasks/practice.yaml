# Основной банк (STANDARD.md §6–§8): 26 задач без challenge и одна задача «на подумать»,
# роли warmup/supported/independent, доли уровней 10/30/30/20/10 (±5 п.п.).
# Сквозной сюжет — числа из документов условного города Нижнегорска.
tasks:
  - id: P-01
    type: number
    role: warmup
    purpose: procedure
    level: 0
    outcome: LO-01
    sections:
      - T01
    minutes: 1
    errors:
      - E-num-place-large-place-up
      - E-num-place-large-place-down
    prompt: В числе {{n}} цифра {{d}} стоит в разряде тысяч. Чему равно значение этой цифры?
    answer: 2000
    variants:
      - params:
          n: 32000
          d: 2
        answer: 2000
        solution: |
          ### Ответ
          2000

          ### Идея
          Значение цифры задаётся её разрядом: цифру умножают на цену места, на котором она стоит.

          ### Шаги
          1. Разряд единиц тысяч — четвёртое место справа, цена места равна 1000.
          2. Умножаем цифру {{d}} на цену места: {{d}} · 1000.
          3. Записываем ответ без пробелов между цифрами.

          ### Проверка
          Одна единица разряда тысяч равна тысяче единиц, значит цифра в этом разряде даёт столько тысяч, сколько показывает сама цифра.

          ### Типичная ошибка
          E-num-place-large-place-down: посчитать цифру в разряде сотен ({{d}} · 100) — получится значение в десять раз меньше нужного.
      - params:
          n: 75000
          d: 5
        answer: 5000
        solution: |
          ### Ответ
          5000

          ### Идея
          Значение цифры задаётся её разрядом: цифру умножают на цену места, на котором она стоит.

          ### Шаги
          1. Разряд единиц тысяч — четвёртое место справа, цена места равна 1000.
          2. Умножаем цифру {{d}} на цену места: {{d}} · 1000.
          3. Записываем ответ без пробелов между цифрами.

          ### Проверка
          Одна единица разряда тысяч равна тысяче единиц, значит цифра в этом разряде даёт столько тысяч, сколько показывает сама цифра.

          ### Типичная ошибка
          E-num-place-large-place-down: посчитать цифру в разряде сотен ({{d}} · 100) — получится значение в десять раз меньше нужного.
    hints:
      - Смотрите не на саму цифру, а на место, которое она занимает в записи числа.
      - Разряд единиц тысяч — четвёртое место справа; он в тысячу раз старше разряда единиц.
      - Посчитайте, сколько единиц помещается в разряде тысяч, и умножьте на них саму цифру.
    solution: |
      ### Ответ
      2000

      ### Идея
      Значение цифры задаётся её разрядом: цифру умножают на цену места, на котором она стоит.

      ### Шаги
      1. Разряд единиц тысяч — четвёртое место справа, цена места равна 1000.
      2. Умножаем цифру {{d}} на цену места: {{d}} · 1000.
      3. Записываем ответ без пробелов между цифрами.

      ### Проверка
      Одна единица разряда тысяч равна тысяче единиц, значит цифра в этом разряде даёт столько тысяч, сколько показывает сама цифра.

      ### Типичная ошибка
      E-num-place-large-place-down: посчитать цифру в разряде сотен ({{d}} · 100) — получится значение в десять раз меньше нужного.
    feedback:
      correct: 'Верно: цифра в разряде единиц тысяч даёт тысячи.'
      wrong:
        what: Значение цифры не совпало с ценой её разряда.
        why: 'Цифра умножена не на цену своего места: разряд единиц тысяч стоит в тысячу раз старше разряда единиц.'
        fix: Найдите разряд цифры по сетке и умножьте цифру на цену этого места.
        next: Разберите пример 1 раздела T01.
      misconceptions:
        - id: E-num-place-large-place-up
          when:
            expr: answer * 10
          message: Значение считается как у разряда десятков тысяч — на ступень старше названного.
        - id: E-num-place-large-place-down
          when:
            expr: answer / 10
          message: Значение считается как у разряда сотен — на ступень младше названного.
  - id: P-02
    type: numbers
    role: warmup
    purpose: procedure
    level: 0
    outcome: LO-01
    sections:
      - T01
    minutes: 1
    errors:
      - E-num-place-large-place-up
      - E-num-place-large-place-down
    prompt: В числе {{n}} найдите цифры двух названных разрядов и введите их.
    answer:
      ht: 4
      h: 5
    fields:
      - id: ht
        label: Цифра в разряде сотен тысяч
      - id: h
        label: Цифра в разряде сотен
    variants:
      - params:
          n: 2480500
        answer:
          ht: 4
          h: 5
        solution: |
          ### Ответ
          Цифра в разряде сотен тысяч — 4; Цифра в разряде сотен — 5

          ### Идея
          Цифру разряда находят по разрядной сетке: сначала класс, потом место внутри класса.

          ### Шаги
          1. Разбиваем запись на тройки: класс единиц, класс тысяч, класс миллионов.
          2. Читаем цифру в первом разряде класса тысяч — это сотни тысяч.
          3. Читаем цифру в первом разряде класса единиц — это сотни.
          4. Если место пустое, в ответе стоит нуль.

          ### Проверка
          Каждая найденная цифра стоит в том разряде, который назван в условии: проверяем по столбцам сетки.

          ### Типичная ошибка
          E-num-place-large-place-down: цифру соседнего, более младшего разряда принять за цифру названного разряда.
      - params:
          n: 305070
        answer:
          ht: 3
          h: 0
        solution: |
          ### Ответ
          Цифра в разряде сотен тысяч — 3; Цифра в разряде сотен — 0

          ### Идея
          Цифру разряда находят по разрядной сетке: сначала класс, потом место внутри класса.

          ### Шаги
          1. Разбиваем запись на тройки: класс единиц, класс тысяч, класс миллионов.
          2. Читаем цифру в первом разряде класса тысяч — это сотни тысяч.
          3. Читаем цифру в первом разряде класса единиц — это сотни.
          4. Если место пустое, в ответе стоит нуль.

          ### Проверка
          Каждая найденная цифра стоит в том разряде, который назван в условии: проверяем по столбцам сетки.

          ### Типичная ошибка
          E-num-place-large-place-down: цифру соседнего, более младшего разряда принять за цифру названного разряда.
    hints:
      - 'Разбейте запись на тройки справа: каждая тройка — свой класс.'
      - Разряд сотен тысяч — первый разряд класса тысяч, а разряд сотен — первый разряд класса единиц.
      - 'Нуль на месте разряда тоже ответ: он показывает, что разряд пуст.'
    solution: |
      ### Ответ
      Цифра в разряде сотен тысяч — 4; Цифра в разряде сотен — 5

      ### Идея
      Цифру разряда находят по разрядной сетке: сначала класс, потом место внутри класса.

      ### Шаги
      1. Разбиваем запись на тройки: класс единиц, класс тысяч, класс миллионов.
      2. Читаем цифру в первом разряде класса тысяч — это сотни тысяч.
      3. Читаем цифру в первом разряде класса единиц — это сотни.
      4. Если место пустое, в ответе стоит нуль.

      ### Проверка
      Каждая найденная цифра стоит в том разряде, который назван в условии: проверяем по столбцам сетки.

      ### Типичная ошибка
      E-num-place-large-place-down: цифру соседнего, более младшего разряда принять за цифру названного разряда.
    feedback:
      correct: 'Верно: обе цифры взяты из названных разрядов.'
      wrong:
        what: Цифра не из того разряда или пропущен нуль.
        why: Место цифры определяют по тройкам, а не по порядковому номеру с начала записи.
        fix: Разбейте запись на тройки и отметьте нужный столбец сетки.
        next: Перечитайте пример 2 раздела T01.
  - id: P-03
    type: choice
    role: warmup
    purpose: procedure
    level: 0
    outcome: LO-02
    sections:
      - T03
    minutes: 1
    errors:
      - E-num-place-large-place-up
      - E-num-place-large-place-down
    prompt: В каком числе цифра 7 значит 70 000?
    answer: c
    options:
      - id: a
        text: 5 700 000
        why: Здесь семёрка стоит в разряде сотен тысяч и значит 700 000.
        misconception: E-num-place-large-place-up
      - id: b
        text: 5 720 000
        why: Здесь семёрка стоит в разряде сотен тысяч и значит 700 000.
        misconception: E-num-place-large-place-down
      - id: c
        text: 5 070 000
        why: 'Семёрка стоит в разряде десятков тысяч: 7 · 10 000 = 70 000.'
      - id: d
        text: 5 007 000
        why: Здесь семёрка стоит в разряде единиц тысяч и значит 7 000.
        misconception: E-num-place-large-place-down
    hints:
      - Значение цифры определяет её разряд, а не соседние цифры в записи.
      - Разряд десятков тысяч — второй разряд класса тысяч, сразу слева от разряда единиц тысяч.
      - Найдите в каждом числе разряд семёрки и сравните его с разрядом десятков тысяч.
    solution: |
      ### Ответ
      Подходит число 5 070 000.

      ### Идея
      У чисел в условии семёрка стоит в разных разрядах, поэтому её значение разное.

      ### Шаги
      1. Разбиваем каждое число на классы и находим в нём разряд семёрки.
      2. Нужен разряд десятков тысяч — второй разряд класса тысяч.
      3. В числе 5 070 000 класс тысяч записан как 070, значит семёрка стоит в разряде десятков тысяч.
      4. Это даёт 70 000.

      ### Проверка
      Проверим остальные: 700 000, 7 000 и 7 000 — ни одно значение не равно 70 000.

      ### Типичная ошибка
      E-num-place-large-place-up: в числе 5 700 000 семёрку считают стоящей на ступень старше, чем она стоит.
    feedback:
      correct: 'Верно: семёрка стоит в разряде десятков тысяч.'
      wrong:
        what: Выбрано число, где у семёрки другое значение.
        why: Соседние разряды различаются в десять раз, поэтому ошибка на одну ступень меняет ответ.
        fix: Проверяйте значение цифры по разрядной сетке, а не по внешнему виду записи.
        next: Разберите пример 1 раздела T01.
      misconceptions:
        - id: E-num-place-large-place-up
          when:
            option: a
          message: Семёрка в разряде сотен тысяч читается на ступень старше — как 700 000.
        - id: E-num-place-large-place-down
          when:
            option: b
          message: Семёрка в разряде единиц тысяч читается на ступень младше — как 7 000.
