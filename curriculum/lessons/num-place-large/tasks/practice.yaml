      - Лишняя карточка справа не подходит ни одной паре — она про меньшее число в паре из семизначных чисел.
    solution: |
      ### Ответ
      Пары собраны так: 5 070 000 и 5 700 000 — большее 5 700 000; 45 032 и 45 117 — большее 45 117; 990 000 и 1 000 000 — большее 1 000 000; 4 072 500 и 4 071 900 — большее 4 072 500.

      ### Идея
      Пару решает первый разряд, в котором числа различаются.

      ### Шаги
      1. В первой паре различие в разряде сотен тысяч: 5 против 7 — больше 5 700 000.
      2. Во второй паре различие в разряде сотен: 0 против 1 — больше 45 117.
      3. В третьей паре разное число цифр: семь против шести — больше 1 000 000.
      4. В четвёртой паре различие в разряде единиц тысяч: 2 против 1 — больше 4 072 500.

      ### Проверка
      Каждое найденное различие стоит в разряде старше всех следующих за ним, поэтому ответ не изменится.

      ### Типичная ошибка
      E-num-place-large-compare-direction: поставить в пару меньшее число, решив по последним цифрам записи.
