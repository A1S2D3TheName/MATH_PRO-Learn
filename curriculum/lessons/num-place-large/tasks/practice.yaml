    outcome: LO-03
    sections:
      - T06
    minutes: 4
    errors:
      - E-num-place-large-swap-places
      - E-num-place-large-skip-zeros
    prompt: Составьте число из цифр 1, 0, 2 и 5 так, чтобы каждая цифра встречалась один раз, цифра 5 стояла в разряде сотен, а число было наименьшим из возможных. Запишите его.
    answer: 1502
    hints:
      - Цифра 5 уже заняла разряд сотен — её место закреплено условием.
      - Остальные три цифры занимают разряды тысяч, десятков и единиц.
      - Наименьшее число начинается с наименьшей цифры, которая не нуль.
    solution: |
      ### Ответ
      Наименьшее подходящее число — 1502.

      ### Идея
      Условие закрепляет цифру 5 в разряде сотен, остальные цифры расставляют по старшинству разрядов.

      ### Шаги
      1. Ставим цифру 5 в разряд сотен.
      2. В разряд тысяч выбираем наименьшую из оставшихся ненулевых цифр — 1.
      3. Оставшиеся цифры 0 и 2 ставим по возрастанию: нуль в разряд десятков, двойку в разряд единиц.
      4. Получаем 1502.

      ### Проверка
      Проверяем условие: цифры 1, 5, 0 и 2 использованы по разу, пятёрка стоит в разряде сотен, а число четырёхзначное.

      ### Типичная ошибка
      E-num-place-large-skip-zeros: поставить нуль в разряд тысяч, после чего запись станет трёхзначной.
    feedback:
      correct: 'Верно: пятёрка в разряде сотен, число наименьшее из возможных.'
      wrong:
        what: Число не удовлетворяет всем условиям сразу.
        why: Либо пятёрка не в разряде сотен, либо младшие цифры расставлены не по возрастанию.
        fix: Закрепите пятёрку в разряде сотен и расставьте остальные цифры по возрастанию старшинства разрядов.
        next: Разберите пример 2 раздела T06.
