      prompt: В числе 6 407 000 цифра 4 стоит в разряде сотен тысяч. Чему равно значение этой цифры?
      answer: 400000
      hints:
        - Разбивайте запись на классы справа, чтобы увидеть место цифры.
        - Разряд сотен тысяч — первый разряд класса тысяч.
        - Умножьте цифру на цену её разряда и запишите результат без пробелов.
      solution: |
        ### Ответ
        Ответ: 400000.

        ### Идея
        Значение цифры равно произведению цифры на цену её разряда.

        ### Шаги
        1. Находим разряд цифры 4 по разрядной сетке числа 6 407 000.
        2. Разряд сотен тысяч имеет цену 100 000.
        3. Умножаем: 4 · 100 000 = 400 000.

        ### Проверка
        Разложение числа по разрядам содержит слагаемое 400 000, значит значение найдено верно.

        ### Типичная ошибка
        E-num-place-large-place-up: Считать цифру на ступень старше её разряда — значение выйдет в десять раз больше.
