    minutes: 4
    prompt: Найдите больший корень $(x-t)^2+10(x-t)+7=0$. Введите точное выражение через sqrt, без округления. Здесь
      t — известный действительный параметр; ответ запишите как выражение с t. Можно обозначить $y=x-t$.
    answer: t + (-5 + 3*sqrt(2))
    hints:
    - Сначала найдите больший корень уравнения относительно $y=x-t$, затем верните сдвиг.
    - Оставьте квадратный корень в выражении и выберите большую ветвь.
    - Начните с квадрата $b=10$ и свободного члена $c=7$; знаменатель здесь равен 2a.
    solution: |
      ### Ответ
      $x=t+(-5+3\sqrt{2})$ (ввод: `t + (-5 + 3*sqrt(2))`).

      ### Идея
      Полагаем $y=x-t$, поэтому $x=t+y$. Не округляем квадратный корень; условие просит только большую ветвь.

      ### Шаги
      1. $a=1$, $b=10$, $c=7$.
      2. $D=10^2-4\cdot1\cdot7=72>0$.
      3. При положительном a больший корень соответствует плюсу: $y=\frac{-10+\sqrt{72}}{2}=-5+3\sqrt{2}$.
      4. Возвращаемся к $x=t+y$: получаем выражение из ответа.

      ### Проверка
      Подстановка даёт $(2ay+b)^2=D=72$, значит исходное уравнение выполнено. Корень с минусом меньше, поскольку a положителен.

      ### Типичная ошибка
      Ошибочно округлять точный ответ или терять знак свободного члена в D: E-eq-wrong-discriminant.
    feedback:
      correct: 'Верно: $\sqrt{72}=6\sqrt{2}$ упрощён, и к большему y прибавлен сдвиг t.'
      wrong:
        what: Выражение не даёт больший корень сдвинутого уравнения.
        why: Могли потеряться сдвиг t, знак перед b или знак в D.
        fix: Решите $y^2+10y+7=0$, упростите корень из D и прибавьте t к большему y.
        next: 'T02: точный корень и возврат после сдвига.'
