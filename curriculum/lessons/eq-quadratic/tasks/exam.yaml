    prompt: При каких действительных k уравнение $kx^2+11x+5=0$ имеет ровно один различный действительный корень?
      Введите множество значений k.
    answer:
    - 0
    - 121/20
    hints:
    - Проверьте, не может ли старший коэффициент обратиться в нуль.
    - Если $k\ne0$, нужен дискриминант, равный нулю.
    - При $k=0$ остаётся $11x+5=0$; при $k\ne0$ запишите $D=121-20k$.
    solution: |
      ### Ответ
      $\{0; \frac{121}{20}\}$.

      ### Идея
      Ровно один различный корень возможен в линейной ветви и при нулевом D квадратной ветви.

      ### Шаги
      1. При $k=0$ уравнение $11x+5=0$ линейное; поскольку $b\ne0$, у него единственный корень $-\frac{5}{11}$.
      2. При $k\ne0$ нужно $D=121-20k=0$.
      3. Отсюда $k=\frac{121}{20}\ne0$, двойной корень $x=-\frac{10}{11}$.

      ### Проверка
      Линейная ветвь: $11\cdot(-\frac{5}{11})+5=0$. Квадратная: $\frac{121}{20}\cdot(-\frac{10}{11})^2+11\cdot(-\frac{10}{11})+5=0$.

      ### Типичная ошибка
      Сразу приравнять $D=121-20k$ к нулю и потерять $k=0$ — E-eq-quadratic-lose-a-zero.
    feedback:
      correct: 'Верно: $k=0$ даёт линейное $11x+5=0$, а $k=\frac{121}{20}$ — двойной корень.'
      wrong:
        what: Список значений параметра неполный или содержит лишнее.
        why: Нулевая ветвь могла быть пропущена либо два одинаковых значения посчитаны разными корнями.
        fix: При $k=0$ решите $11x+5=0$; при $k\ne0$ решите $121-20k=0$.
        next: 'T06: уравнение с параметром.'
    errors:
    - E-eq-quadratic-lose-a-zero
    points: 1
