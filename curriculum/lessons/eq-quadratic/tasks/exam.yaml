    minutes: 3
    prompt: Решите $x^2+15x+44=0$. Введите множество всех действительных корней.
    answer:
    - -11
    - -4
    hints:
    - Посмотрите, все ли три члена присутствуют в уравнении.
    - Оба корня могут оказаться отрицательными — это не ошибка.
    - Начните с коэффициентов $a=1$, $b=15$, $c=44$ и вычислите дискриминант.
    solution: |
      ### Ответ
      $\{-11; -4\}$

      ### Идея
      Выбираем формулу: она учитывает все коэффициенты и не требует подбора.

      ### Шаги
      1. Коэффициенты: $a=1$, $b=15$, $c=44$.
      2. $D=15^2-4\cdot1\cdot44=49$.
      3. $\sqrt{49}=7$, знаменатель $2a=2$.
      4. $x=\frac{-15\pm 7}{2}$, получаем $\{-11; -4\}$.

      ### Проверка
      $1\cdot(-11)^2+15\cdot(-11)+44=0$; $1\cdot(-4)^2+15\cdot(-4)+44=0$

      ### Типичная ошибка
      Нельзя заменить разность суммой (E-eq-wrong-discriminant) или потерять одну ветвь (E-eq-lost-negative).
    feedback:
      correct: 'Верно: при $D=49$ обе ветви $\frac{-15\pm7}{2}$ отрицательны, и обе сохранены.'
      wrong:
        what: Множество корней не совпало с уравнением.
        why: Возможна ошибка знака или знаменателя формулы.
        fix: Вычислите D для $a=1$, $b=15$, $c=44$ и не отбрасывайте отрицательные корни.
        next: Вернитесь к формуле и проверке в T02.
