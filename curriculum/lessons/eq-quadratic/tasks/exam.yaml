    - T06
    minutes: 4
    prompt: При каких действительных k уравнение $kx^2+7x+3=0$ имеет ровно один различный действительный корень?
      Введите множество значений k.
    answer:
    - 0
    - 49/12
    hints:
    - При одном значении k уравнение перестаёт быть квадратным — найдите его.
    - Для остальных k ровно один различный корень означает нулевой дискриминант.
    - При $k=0$ остаётся $7x+3=0$; при $k\ne0$ запишите $D=49-12k$.
    solution: |
      ### Ответ
      $\{0; \frac{49}{12}\}$.

      ### Идея
      Ровно один различный корень возможен в линейной ветви и при нулевом D квадратной ветви.

      ### Шаги
      1. При $k=0$ уравнение $7x+3=0$ линейное; поскольку $b\ne0$, у него единственный корень $-\frac{3}{7}$.
      2. При $k\ne0$ нужно $D=49-12k=0$.
      3. Отсюда $k=\frac{49}{12}\ne0$, двойной корень $x=-\frac{6}{7}$.

      ### Проверка
      Линейная ветвь: $7\cdot(-\frac{3}{7})+3=0$. Квадратная: $\frac{49}{12}\cdot(-\frac{6}{7})^2+7\cdot(-\frac{6}{7})+3=0$.

      ### Типичная ошибка
      Сразу приравнять $D=49-12k$ к нулю и потерять $k=0$ — E-eq-quadratic-lose-a-zero.
    feedback:
      correct: 'Верно: $k=0$ даёт линейное $7x+3=0$, а $k=\frac{49}{12}$ — двойной корень.'
      wrong:
        what: Список значений параметра неполный или содержит лишнее.
        why: Нулевая ветвь могла быть пропущена либо два одинаковых значения посчитаны разными корнями.
        fix: При $k=0$ решите $7x+3=0$; при $k\ne0$ решите $49-12k=0$.
        next: 'T06: уравнение с параметром.'
