    prompt: При каких целых k от $-3$ до $6$ включительно уравнение $3x^2+7x+k=0$ имеет два различных действительных
      корня? Введите множество k.
    answer:
    - -3
    - -2
    - -1
    - 0
    - 1
    - 2
    - 3
    - 4
    hints:
    - Ответ — набор значений k, при которых выполняется условие о корнях.
    - Условие «два различных корня» означает положительный дискриминант.
    - 'Для $3x^2+7x+k=0$ дискриминант равен $49-12k$: вычислите его при $k=-3$ и при $k=6$.'
    solution: |
      ### Ответ
      $\{-3; -2; -1; 0; 1; 2; 3; 4\}$.

      ### Идея
      Два различных корня требуют положительного дискриминанта; при переходе к следующему целому k он меняется на одно и то же число.

      ### Шаги
      1. $D=49-12k$.
      2. При увеличении k на 1 дискриминант уменьшается на 12.
      3. На границе: при $k=4$ получаем $D=1$, при $k=5$ — $D=-11$; поэтому в диапазоне от $-3$ до $6$ подходят $\{-3; -2; -1; 0; 1; 2; 3; 4\}$.

      ### Проверка
      Значения D по порядку от $k=-3$ до $k=6$: $85, 73, 61, 49, 37, 25, 13, 1, -11, -23$. Положительны ровно при выбранных k.

      ### Типичная ошибка
      Взять и $k=5$, где $D=-11$: при отрицательном дискриминанте знак «±» не даёт действительных корней — E-eq-negative-d-two-roots.
    feedback:
      correct: 'Верно: оставлены все целые k из диапазона, при которых $49-12k$ положительно.'
      wrong:
        what: Множество k не совпало с условием двух различных корней.
        why: Возможно, взяты k с нулевым или отрицательным дискриминантом либо пропущен край диапазона.
        fix: Вычислите $49-12k$ для крайних k диапазона и найдите, где меняется знак.
        next: 'T06, пример 6: целый параметр в ограниченном диапазоне.'
    points: 1
