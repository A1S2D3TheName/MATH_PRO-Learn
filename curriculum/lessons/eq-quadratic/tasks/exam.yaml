    solution: |
      ### Ответ
      $\{\frac{-5}{3}; \frac{5}{3}\}$

      ### Идея
      Линейного члена нет: выражаем $x^2$ и смотрим на знак правой части, формула не нужна.

      ### Шаги
      1. Переносим свободный член и делим на $9$: $x^2=\frac{25}{9}$.
      2. Правая часть положительна, поэтому корней два: $x=\frac{5}{3}$ или $x=-\frac{5}{3}$.

      ### Проверка
      $9\cdot(\frac{5}{3})^2-25=25-25=0$; у $-\frac{5}{3}$ тот же квадрат.

      ### Типичная ошибка
      Оставить только арифметический корень $\frac{5}{3}$ и потерять $-\frac{5}{3}$ — E-eq-lost-negative.
    feedback:
