  tasks:
  - id: EA-01
    type: numbers
    role: exam
    purpose: procedure
    level: 1
    outcome: LO-01
    sections:
    - T01
    minutes: 2
    prompt: Приведите $(x+4)^2=3x+11$ к стандартному виду. Введите a, b, c.
    answer:
      a: 1
      b: 5
      c: 5
    hints:
    - Название коэффициента относится к приведённой записи.
    - Раскройте квадрат и вычтите всю правую часть.
    - Начните с удвоенного произведения x и 4; затем соберите члены после переноса.
    solution: |
      ### Ответ
      $a=1$, $b=5$, $c=5$.

      ### Идея
      Нужно сначала раскрыть квадрат и вычесть правую часть.

      ### Шаги
      1. $(x+4)^2=x^2+8x+16$.
      2. После вычитания $3x+11$ получаем $x^2+5x+5=0$.
      3. Читаем коэффициенты: $a=1$, $b=5$, $c=5$.

      ### Проверка
      Прибавление вычтенной правой части к $x^2+5x+5$ возвращает $x^2+8x+16$.

      ### Типичная ошибка
      Потеря среднего слагаемого при раскрытии — E-eq-quadratic-square-parts.
    feedback:
      correct: 'Верно: из $(x+4)^2$ взято среднее слагаемое $8x$, а $3x+11$ вычтено целиком.'
      wrong:
        what: Коэффициенты не совпали с приведённой записью.
        why: Возможно, потеряно среднее слагаемое квадрата или знак переноса.
        fix: Раскройте $(x+4)^2=x^2+8x+16$ и вычтите $3x+11$ из обеих частей.
        next: 'T01: стандартный вид и проверка раскрытием.'
    fields:
    - id: a
      label: a
    - id: b
      label: b
    - id: c
      label: c
    points: 1
  - id: EA-02
    type: number
    role: exam
    purpose: procedure
    level: 1
    outcome: LO-02
    sections:
    - T03
    minutes: 1
    prompt: Вычислите D для $4x^2-9x-2=0$. Введите число.
    answer: 113
    hints:
    - Знак свободного члена нужен внутри произведения.
    - Вычислите квадрат b и произведение 4ac, затем вычтите.
    - Для $a=4$, $b=-9$, $c=-2$ начните с произведения 4ac.
    solution: |
      ### Ответ
      $D=113$.

      ### Идея
      Раздельное вычисление квадрата и произведения защищает от ошибки знака.

      ### Шаги
      1. $a=4$, $b=-9$, $c=-2$.
      2. $b^2=(-9)^2=81$, $4ac=4\cdot4\cdot(-2)=-32$.
      3. $D=81-(-32)=113$.

      ### Проверка
      Обратное сложение: $(-32)+113=81$.

      ### Типичная ошибка
      Сумма вместо разности воспроизводит E-eq-wrong-discriminant.
    feedback:
      correct: 'Верно: $D=81-(-32)=113$ — минус перед отрицательным $4ac$ учтён.'
      wrong:
        what: Полученное значение дискриминанта не совпало.
        why: Квадрат b или произведение 4ac могли быть вычислены со знаком ошибки.
        fix: Вычислите $(-9)^2$ и $4\cdot4\cdot(-2)$ отдельно, затем вычтите второе из первого.
        next: 'T03: знак дискриминанта и его смысл.'
    points: 1
  - id: EA-03
    type: set
    role: exam
    purpose: procedure
    level: 2
    outcome: LO-01
    sections:
    - T02
    minutes: 3
    prompt: Решите $x^2-13x+30=0$. Введите множество всех действительных корней.
    answer:
    - 3
    - 10
    hints:
    - После переноса проверьте, какие из трёх членов есть в уравнении.
    - Все три коэффициента ненулевые — короткого пути через вынесение нет.
    - Начните с коэффициентов $a=1$, $b=-13$, $c=30$ и вычислите дискриминант.
    solution: |
      ### Ответ
      $\{3; 10\}$

      ### Идея
      Выбираем формулу: она учитывает все коэффициенты и не требует подбора.

      ### Шаги
      1. Коэффициенты: $a=1$, $b=-13$, $c=30$.
      2. $D=(-13)^2-4\cdot1\cdot30=49$.
      3. $\sqrt{49}=7$, знаменатель $2a=2$.
      4. $x=\frac{13\pm 7}{2}$, получаем $\{3; 10\}$.

      ### Проверка
      $1\cdot3^2-13\cdot3+30=0$; $1\cdot10^2-13\cdot10+30=0$

      ### Типичная ошибка
      Нельзя заменить разность суммой (E-eq-wrong-discriminant) или потерять одну ветвь (E-eq-lost-negative).
    feedback:
      correct: 'Верно: $D=49$, и обе ветви $\frac{13\pm7}{2}$ дают корни уравнения.'
      wrong:
        what: Множество корней не совпало с уравнением.
        why: Возможна ошибка знака или знаменателя формулы.
        fix: Вычислите D для $a=1$, $b=-13$, $c=30$ ещё раз и подставьте корень из него в обе ветви.
        next: Вернитесь к формуле и проверке в T02.
    points: 1
    errors:
    - E-eq-wrong-discriminant
  - id: EA-04
    type: set
    role: exam
    purpose: procedure
    level: 2
    outcome: LO-01
    sections:
    - T02
    minutes: 3
    prompt: Решите $3x^2-10x-8=0$. Введите множество всех действительных корней.
    answer:
    - -2/3
    - 4
    hints:
    - 'Старший коэффициент не равен единице: следите за знаменателем формулы.'
    - Вычислите D и проверьте, извлекается ли корень точно.
    - Для $a=3$, $b=-10$, $c=-8$ сначала найдите $4ac$ со знаком.
    solution: |
      ### Ответ
      $\{\frac{-2}{3}; 4\}$

      ### Идея
      Выбираем формулу: она учитывает все коэффициенты и не требует подбора.

      ### Шаги
      1. Коэффициенты: $a=3$, $b=-10$, $c=-8$.
      2. $D=(-10)^2-4\cdot3\cdot(-8)=196$.
      3. $\sqrt{196}=14$, знаменатель $2a=6$.
      4. $x=\frac{10\pm 14}{6}$, получаем $\{\frac{-2}{3}; 4\}$.

      ### Проверка
      $3\cdot(-\frac{2}{3})^2-10\cdot(-\frac{2}{3})-8=0$; $3\cdot4^2-10\cdot4-8=0$

      ### Типичная ошибка
      Нельзя заменить разность суммой (E-eq-wrong-discriminant) или потерять одну ветвь (E-eq-lost-negative).
    feedback:
      correct: 'Верно: знаменатель $2a=6$ дал дробный корень, второй корень $4$ тоже найден.'
      wrong:
        what: Множество корней не совпало с уравнением.
        why: Возможна ошибка знака или знаменателя формулы.
        fix: Для $a=3$ знаменатель формулы равен 6; проверьте обе ветви подстановкой в $3x^2-10x-8$.
        next: Вернитесь к формуле и проверке в T02.
    points: 1
    errors:
    - E-eq-wrong-discriminant
  - id: EA-05
    type: set
    role: exam
    purpose: procedure
    level: 2
    outcome: LO-02
    sections:
    - T04
    minutes: 2
    prompt: Решите $7x^2-9x=0$. Введите множество всех действительных корней.
    answer:
    - 0
    - 9/7
    hints:
    - 'Сравните уравнение со стандартным видом: какого члена не хватает?'
    - Без свободного члена можно вынести общий множитель.
    - Вынесите $x$ из $7x^2-9x$ и приравняйте к нулю каждый множитель.
    solution: |
      ### Ответ
      $\{0; \frac{9}{7}\}$

      ### Идея
      Свободного члена нет: выносим $x$ и применяем правило нулевого произведения, не деля на $x$.

      ### Шаги
      1. Выносим общий множитель: $x(7x-9)=0$.
      2. Произведение равно нулю, если $x=0$ или $7x-9=0$.
      3. Из $7x-9=0$ получаем $x=\frac{9}{7}$.

      ### Проверка
      $7\cdot0^2-9\cdot0=0$; $7\cdot(\frac{9}{7})^2-9\cdot(\frac{9}{7})=\frac{81}{7}-\frac{81}{7}=0$.

      ### Типичная ошибка
      Разделить $7x^2-9x=0$ на $x$ и оставить только $\frac{9}{7}$, потеряв корень $0$ — E-eq-div-zero-factor.
    feedback:
      correct: 'Верно: $x(7x-9)=0$ даёт и $0$, и $\frac{9}{7}$.'
      wrong:
        what: В множестве корней неполного уравнения есть пропуск или лишнее значение.
        why: Мог быть потерян случай $x=0$ либо неверно решена линейная скобка.
        fix: 'Вынесите $x$: $x(7x-9)=0$, затем решите $x=0$ и $7x-9=0$.'
        next: 'T04: нулевое произведение и сохранение корня ноль.'
    points: 1
    errors:
    - E-eq-div-zero-factor
  - id: EA-06
    type: set
    role: exam
    purpose: procedure
    level: 2
    outcome: LO-02
    sections:
    - T04
    minutes: 2
    prompt: Решите $4x^2-81=0$. Введите множество всех действительных корней.
    answer:
    - -9/2
    - 9/2
    hints:
    - Здесь нет члена с первой степенью x.
    - Выразите $x^2$ и посмотрите на знак правой части.
    - Перенесите 81 вправо и разделите обе части на 4.
    solution: |
      ### Ответ
      $\{\frac{-9}{2}; \frac{9}{2}\}$

      ### Идея
      Линейного члена нет: выражаем $x^2$ и смотрим на знак правой части, формула не нужна.

      ### Шаги
      1. Переносим свободный член и делим на $4$: $x^2=\frac{81}{4}$.
      2. Правая часть положительна, поэтому корней два: $x=\frac{9}{2}$ или $x=-\frac{9}{2}$.

      ### Проверка
      $4\cdot(\frac{9}{2})^2-81=81-81=0$; у $-\frac{9}{2}$ тот же квадрат.

      ### Типичная ошибка
      Оставить только арифметический корень $\frac{9}{2}$ и потерять $-\frac{9}{2}$ — E-eq-lost-negative.
    feedback:
      correct: 'Верно: $x^2=\frac{81}{4}$ имеет два противоположных корня, и оба записаны.'
      wrong:
        what: Множество решений равенства квадратов не совпало.
        why: Возможна потеря отрицательного знака или ошибка в переносе свободного члена.
        fix: Получите $x^2=\frac{81}{4}$ и возьмите оба знака корня.
        next: 'T04: неполный случай без линейного члена.'
    points: 1
    errors:
    - E-eq-lost-negative
  - id: EA-07
    type: expression
    role: exam
    purpose: procedure
    level: 2
    outcome: LO-01
    sections:
    - T02
    minutes: 4
    prompt: Найдите больший корень $(x-t)^2-8(x-t)+5=0$. Введите точное выражение через sqrt, без округления. Здесь
      t — известный действительный параметр; ответ запишите как выражение с t. Можно обозначить $y=x-t$.
    answer: t + (4 + sqrt(11))
    hints:
    - 'Обозначьте $y=x-t$: уравнение для y — обычное квадратное.'
    - Оставьте квадратный корень в выражении и выберите большую ветвь.
    - Начните с квадрата $b=-8$ и свободного члена $c=5$; знаменатель здесь равен 2a.
    solution: |
      ### Ответ
      $x=t+(4+\sqrt{11})$ (ввод: `t + (4 + sqrt(11))`).

      ### Идея
      Полагаем $y=x-t$, поэтому $x=t+y$. Не округляем квадратный корень; условие просит только большую ветвь.

      ### Шаги
      1. $a=1$, $b=-8$, $c=5$.
      2. $D=(-8)^2-4\cdot1\cdot5=44>0$.
      3. При положительном a больший корень соответствует плюсу: $y=\frac{8+\sqrt{44}}{2}=4+\sqrt{11}$.
      4. Возвращаемся к $x=t+y$: получаем выражение из ответа.

      ### Проверка
      Подстановка даёт $(2ay+b)^2=D=44$, значит исходное уравнение выполнено. Корень с минусом меньше, поскольку a положителен.

      ### Типичная ошибка
      Ошибочно округлять точный ответ или терять знак свободного члена в D: E-eq-wrong-discriminant.
    feedback:
      correct: 'Верно: $y=4+\sqrt{11}$, и к нему прибавлен сдвиг t без округления.'
      wrong:
        what: Выражение не даёт больший корень сдвинутого уравнения.
        why: Могли потеряться сдвиг t, знак перед b или знак в D.
        fix: Решите $y^2-8y+5=0$ без округления, возьмите больший корень и прибавьте t.
        next: 'T02: точный корень и возврат после сдвига.'
    points: 1
    vars:
    - t
    domain:
    - name: t
      min: -5
      max: 5
  - id: EA-08
    type: numbers
    role: exam
    purpose: meaning
    level: 2
    outcome: LO-02
    sections:
    - T03
    minutes: 3
    prompt: 'Сколько различных действительных корней у каждого уравнения: 1) $3x^2-24x+48=0$; 2) $2x^2+2x+7=0$?
      Введите два количества.'
    answer:
      first: 1
      second: 0
    hints:
    - Различные значения и кратность — не одно и то же.
    - Рассчитайте D отдельно для каждой записи.
    - 'Начните с первого уравнения: квадрат -24 сравните с произведением 4, 3, 48.'
    solution: |
      ### Ответ
      Первое уравнение: 1; второе: 0.

      ### Идея
      В каждой записи отдельно определяется число различных корней.

      ### Шаги
      1. Первое: $D=(-24)^2-4\cdot3\cdot48=0$.
      2. Нулевой D даёт один различный двойной корень $x=4$.
      3. Второе: $D=2^2-4\cdot2\cdot7=-52<0$: корней нет.

      ### Проверка
      Первое: $3x^2-24x+48=3(x-4)^2$ — ноль только при $x=4$. Второе: $2x^2+2x+7=2(x+\frac{1}{2})^2+\frac{13}{2}$ — больше нуля при любом x.

      ### Типичная ошибка
      E-eq-negative-d-two-roots: два знака не создают действительных значений при $D<0$.
    feedback:
      correct: 'Верно: нулевой D первого уравнения дал один двойной корень, отрицательный D второго — ни одного.'
      wrong:
        what: Количество корней не согласуется со знаком дискриминанта.
        why: Двойной корень могли посчитать дважды или не проверить знак D.
        fix: 'Вычислите D для каждого уравнения отдельно: при нулевом D корень один, при отрицательном — ни одного.'
        next: Сравните с равенством $(2ax+b)^2=D$ в T02–T03.
    fields:
    - id: first
      label: Первое уравнение
    - id: second
      label: Второе уравнение
    points: 1
  - id: EA-09
    type: match
    role: exam
    purpose: method
    level: 3
    outcome: LO-01
    sections:
    - T01
    - T02
    - T04
    minutes: 2
    prompt: Подберите к каждому уравнению самый короткий способ решения, при котором не теряются корни. Два способа
      справа лишние.
    answer:
    - left: l1
      right: r2
    - left: l2
      right: r3
    - left: l3
      right: r1
    hints:
    - Перенесите всё в одну часть и посмотрите, какие члены остались.
    - Если нет линейного или свободного члена, есть путь короче формулы.
    - 'Для $5x^2=35x$ после переноса получится $5x^2-35x=0$: какого члена нет?'
    solution: |
      ### Ответ
      l1 → r2; l2 → r3; l3 → r1.

      ### Идея
      Выбираем короткий способ по структуре, а не по одному и тому же шаблону для всех записей.

      ### Шаги
      1. В $5x^2=35x$ после переноса нет свободного члена: выносим $x$.
      2. В $3x^2=2x+9$ после переноса остаются все три члена: подходит формула.
      3. В $5x^2=320$ нет линейного члена: выражаем $x^2$ и проверяем знак.

      ### Проверка
      Коэффициент при $x^2$ ни в одной записи не исчезает, поэтому способы r4 и r5 не нужны.

      ### Типичная ошибка
      Разделить $5x^2=35x$ на $x$ и потерять корень ноль — E-eq-div-zero-factor.
    feedback:
      correct: 'Верно: $5x^2=35x$ — вынесение $x$, $3x^2=2x+9$ — формула, $5x^2=320$ — выражение $x^2$.'
      wrong:
        what: Одна из пар не соответствует структуре уравнения.
        why: Могли смешаться неполный, полный и вырожденный случаи.
        fix: Перенесите правую часть влево в $5x^2=35x$, $3x^2=2x+9$, $5x^2=320$ и определите, какого члена нет.
        next: 'T04: неполные случаи; T01: стандартный вид.'
    left:
    - id: l1
      text: $5x^2=35x$
    - id: l2
      text: $3x^2=2x+9$
    - id: l3
      text: $5x^2=320$
    right:
    - id: r1
      text: Выразить $x^2$ и рассмотреть знак правой части.
    - id: r2
      text: Перенести всё в одну часть, вынести x и применить нулевое произведение.
    - id: r3
      text: Перенести всё в одну часть; для полного квадратного уравнения использовать формулу.
    - id: r4
      text: После сокращения $x^2$ решить линейное уравнение.
    - id: r5
      text: После сокращения переменной проверить постоянное равенство.
    points: 1
  - id: EA-10
    type: numbers
    role: exam
    purpose: transfer
    level: 3
    outcome: LO-03
    sections:
    - T01
    - T02
    - T06
    minutes: 4
    prompt: Площадь прямоугольной зоны 234 м², длина на 5 м больше ширины. Найдите положительные ширину и длину.
    answer:
      width: 13
      length: 18
    hints:
    - 'Обозначьте ширину x: длина тогда на 5 м больше.'
    - Обозначьте ширину x и выразите длину через неё.
    - Начните с $x(x+5)=234$; после раскрытия перенесите площадь в левую часть.
    solution: |
      ### Ответ
      Ширина $13$ м, длина $18$ м.

      ### Идея
      Размеры положительны; уравнение площади может иметь и недопустимый отрицательный корень.

      ### Шаги
      1. Пусть ширина $x>0$; длина $x+5$.
      2. $x(x+5)=234$, то есть $x^2+5x-234=0$.
      3. $D=5^2+4\cdot234=961$, корни $\{-18; 13\}$.
      4. Отрицательный корень исключаем по условию $x>0$; длина $13+5=18$.

      ### Проверка
      $13\cdot18=234$ м², разница сторон $18-13=5$ м.

      ### Типичная ошибка
      Нельзя терять отрицательный корень при решении уравнения (E-eq-lost-negative); в модели его исключают с названной причиной.
    feedback:
      correct: 'Верно: ширина 13 м и длина 18 м дают площадь $13\cdot18=234$ м².'
      wrong:
        what: Размеры не удовлетворяют условию.
        why: Возможна ошибка модели площади или отбора корня.
        fix: Запишите $x(x+5)=234$, решите и оставьте положительный корень как ширину.
        next: 'T01 и T06: уравнение и ограничения модели.'
    fields:
    - id: width
      label: Ширина
      unit: м
    - id: length
      label: Длина
      unit: м
    points: 1
  - id: EA-11
    type: set
    role: exam
    purpose: method
    level: 4
    outcome: LO-03
    sections:
    - T01
