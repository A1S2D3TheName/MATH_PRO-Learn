    prompt: Площадь прямоугольной зоны 280 м², длина на 6 м больше ширины. Найдите положительные ширину и длину.
    answer:
      width: 14
      length: 20
    hints:
    - Площадь прямоугольника равна произведению длины и ширины.
    - Обозначьте ширину x и выразите длину через неё.
    - Начните с $x(x+6)=280$; после раскрытия перенесите площадь в левую часть.
    solution: |
      ### Ответ
      Ширина $14$ м, длина $20$ м.

      ### Идея
      Размеры положительны; уравнение площади может иметь и недопустимый отрицательный корень.

      ### Шаги
      1. Пусть ширина $x>0$; длина $x+6$.
      2. $x(x+6)=280$, то есть $x^2+6x-280=0$.
      3. $D=6^2+4\cdot280=1156$, корни $\{-20; 14\}$.
      4. Отрицательный корень исключаем по условию $x>0$; длина $14+6=20$.

      ### Проверка
      $14\cdot20=280$ м², разница сторон $20-14=6$ м.

      ### Типичная ошибка
      Нельзя терять отрицательный корень при решении уравнения (E-eq-lost-negative); в модели его исключают с названной причиной.
    feedback:
      correct: 'Верно: $14\cdot20=280$, а отрицательный корень $-20$ отброшен как размер.'
      wrong:
        what: Размеры не удовлетворяют условию.
        why: Возможна ошибка модели площади или отбора корня.
        fix: Запишите $x(x+6)=280$, решите и оставьте положительный корень как ширину.
        next: 'T01 и T06: уравнение и ограничения модели.'
    fields:
    - id: width
      label: Ширина
      unit: м
    - id: length
      label: Длина
      unit: м
