    - Для $a=4$, $b=15$, $c=-4$ сначала найдите $4ac$ со знаком.
    solution: |
      ### Ответ
      $\{-4; \frac{1}{4}\}$

      ### Идея
      Выбираем формулу: она учитывает все коэффициенты и не требует подбора.

      ### Шаги
      1. Коэффициенты: $a=4$, $b=15$, $c=-4$.
      2. $D=15^2-4\cdot4\cdot(-4)=289$.
      3. $\sqrt{289}=17$, знаменатель $2a=8$.
      4. $x=\frac{-15\pm 17}{8}$, получаем $\{-4; \frac{1}{4}\}$.

      ### Проверка
      $4\cdot(-4)^2+15\cdot(-4)-4=0$; $4\cdot(\frac{1}{4})^2+15\cdot\frac{1}{4}-4=0$

      ### Типичная ошибка
      Нельзя заменить разность суммой (E-eq-wrong-discriminant) или потерять одну ветвь (E-eq-lost-negative).
    feedback:
      correct: 'Верно: знаменатель $2a=8$ дал дробный корень $\frac{1}{4}$, второй корень $-4$ тоже найден.'
