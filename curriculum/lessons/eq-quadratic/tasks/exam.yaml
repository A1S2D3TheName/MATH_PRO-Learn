    - 'Начните с первого уравнения: квадрат $-4$ сравните с произведением 4, 3 и 6.'
    solution: |
      ### Ответ
      Первое уравнение: 0; второе: 1.

      ### Идея
      В каждой записи отдельно определяется число различных корней.

      ### Шаги
      1. Первое: $D=(-4)^2-4\cdot3\cdot6=-56<0$: корней нет.
      2. Второе: $D=40^2-4\cdot4\cdot100=0$.
      3. Нулевой D даёт один различный двойной корень $x=-5$.

      ### Проверка
      Первое: $3x^2-4x+6=3(x-\frac{2}{3})^2+\frac{14}{3}$ — больше нуля при любом x. Второе: $4x^2+40x+100=4(x+5)^2$ — ноль только при $x=-5$.

      ### Типичная ошибка
      E-eq-negative-d-two-roots: два знака не создают действительных значений при $D<0$.
    feedback:
      correct: 'Верно: отрицательный D первого уравнения не даёт корней, нулевой D второго — один двойной корень.'
      wrong:
        what: Количество корней не согласуется со знаком дискриминанта.
