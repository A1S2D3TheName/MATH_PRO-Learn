    minutes: 4
    prompt: При каких целых k от $-2$ до $7$ включительно уравнение $5x^2+11x+k=0$ имеет два различных действительных
      корня? Введите множество k.
    answer:
    - -2
    - -1
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    hints:
    - Здесь ищут значения параметра, а не корни одного уравнения.
    - Два различных корня — это строго положительный дискриминант.
    - 'Для $5x^2+11x+k=0$ дискриминант равен $121-20k$: вычислите его при $k=-2$ и при $k=7$.'
    solution: |
      ### Ответ
      $\{-2; -1; 0; 1; 2; 3; 4; 5; 6\}$.

      ### Идея
      Два различных корня требуют положительного дискриминанта; при переходе к следующему целому k он меняется на одно и то же число.

      ### Шаги
      1. $D=121-20k$.
      2. При увеличении k на 1 дискриминант уменьшается на 20.
      3. На границе: при $k=6$ получаем $D=1$, при $k=7$ — $D=-19$; поэтому в диапазоне от $-2$ до $7$ подходят $\{-2; -1; 0; 1; 2; 3; 4; 5; 6\}$.

      ### Проверка
      Значения D по порядку от $k=-2$ до $k=7$: $161, 141, 121, 101, 81, 61, 41, 21, 1, -19$. Положительны ровно при выбранных k.

      ### Типичная ошибка
      Взять и $k=7$, где $D=-19$: при отрицательном дискриминанте знак «±» не даёт действительных корней — E-eq-negative-d-two-roots.
    feedback:
      correct: 'Верно: оставлены все целые k из диапазона, при которых $121-20k$ положительно.'
      wrong:
        what: Множество k не совпало с условием двух различных корней.
        why: Возможно, взяты k с нулевым или отрицательным дискриминантом либо пропущен край диапазона.
        fix: Вычислите $121-20k$ для крайних k диапазона и найдите, где меняется знак.
        next: 'T06, пример 6: целый параметр в ограниченном диапазоне.'
