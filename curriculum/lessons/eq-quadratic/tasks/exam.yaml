      right: r3
    hints:
    - Для каждой записи выясните, есть ли после переноса член с первой степенью x и свободный член.
    - Полное уравнение решают по формуле, неполные — короче.
    - 'Для $7x^2=847$ разделите обе части на 7: что получится в правой части?'
    solution: |
      ### Ответ
      l1 → r1; l2 → r2; l3 → r3.

      ### Идея
      Выбираем короткий способ по структуре, а не по одному и тому же шаблону для всех записей.

      ### Шаги
      1. В $7x^2=847$ нет линейного члена: выражаем $x^2=121$ и проверяем знак.
      2. В $4x^2=-36x$ после переноса нет свободного члена: выносим $x$.
      3. В $2x^2=-7x+8$ после переноса остаются все три члена: подходит формула.

      ### Проверка
      Коэффициент при $x^2$ ни в одной записи не исчезает, поэтому способы r4 и r5 не нужны.

      ### Типичная ошибка
      Разделить $4x^2=-36x$ на $x$ и потерять корень ноль — E-eq-div-zero-factor.
    feedback:
      correct: 'Верно: $7x^2=847$ — выражение $x^2$, $4x^2=-36x$ — вынесение $x$, $2x^2=-7x+8$ — формула.'
      wrong:
        what: Одна из пар не соответствует структуре уравнения.
        why: Могли смешаться неполный, полный и вырожденный случаи.
        fix: Приведите $7x^2=847$, $4x^2=-36x$ и $2x^2=-7x+8$ к нулю и сравните, какие члены остались.
        next: 'T04: неполные случаи; T01: стандартный вид.'
    left:
    - id: l1
      text: $7x^2=847$
    - id: l2
      text: $4x^2=-36x$
    - id: l3
      text: $2x^2=-7x+8$
    right:
    - id: r1
      text: Выразить $x^2$ и рассмотреть знак правой части.
    - id: r2
      text: Перенести всё в одну часть, вынести x и применить нулевое произведение.
    - id: r3
      text: Перенести всё в одну часть; для полного квадратного уравнения использовать формулу.
    - id: r4
      text: После сокращения $x^2$ решить линейное уравнение.
    - id: r5
      text: После сокращения переменной проверить постоянное равенство.
