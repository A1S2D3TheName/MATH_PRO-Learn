    prompt: Вычислите D для $3x^2+11x-1=0$. Введите число.
    answer: 133
    hints:
    - В произведение $4ac$ свободный член входит со своим знаком.
    - Вычислите квадрат b и произведение 4ac, затем вычтите.
    - Для $a=3$, $b=11$, $c=-1$ начните с произведения 4ac.
    solution: |
      ### Ответ
      $D=133$.

      ### Идея
      Раздельное вычисление квадрата и произведения защищает от ошибки знака.

      ### Шаги
      1. $a=3$, $b=11$, $c=-1$.
      2. $b^2=11^2=121$, $4ac=4\cdot3\cdot(-1)=-12$.
      3. $D=121-(-12)=133$.

      ### Проверка
      Обратное сложение: $(-12)+133=121$.

      ### Типичная ошибка
      Сумма вместо разности воспроизводит E-eq-wrong-discriminant.
    feedback:
      correct: 'Верно: $D=121-(-12)=133$, знак свободного члена $-1$ учтён в произведении.'
      wrong:
        what: Полученное значение дискриминанта не совпало.
        why: Квадрат b или произведение 4ac могли быть вычислены со знаком ошибки.
        fix: Вычислите $11^2$ и $4\cdot3\cdot(-1)$ отдельно, затем вычтите второе из первого.
        next: 'T03: знак дискриминанта и его смысл.'
