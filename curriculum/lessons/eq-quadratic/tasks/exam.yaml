    prompt: Приведите $(x-5)^2=-3x+7$ к стандартному виду. Введите a, b, c.
    answer:
      a: 1
      b: -7
      c: 18
    hints:
    - Коэффициенты читают только после раскрытия скобок и переноса.
    - Раскройте квадрат и вычтите всю правую часть.
    - Начните с удвоенного произведения x и -5; затем соберите члены после переноса.
    solution: |
      ### Ответ
      $a=1$, $b=-7$, $c=18$.

      ### Идея
      Нужно сначала раскрыть квадрат и вычесть правую часть.

      ### Шаги
      1. $(x-5)^2=x^2-10x+25$.
      2. После вычитания $-3x+7$ получаем $x^2-7x+18=0$.
      3. Читаем коэффициенты: $a=1$, $b=-7$, $c=18$.

      ### Проверка
      Прибавление вычтенной правой части к $x^2-7x+18$ возвращает $x^2-10x+25$.

      ### Типичная ошибка
      Потеря среднего слагаемого при раскрытии — E-eq-quadratic-square-parts.
    feedback:
      correct: 'Верно: $(x-5)^2=x^2-10x+25$, и при вычитании $-3x+7$ знак линейного члена изменился.'
