    prompt: Решите $5x^2+13x=0$. Введите множество всех действительных корней.
    answer:
    - -13/5
    - 0
    hints:
    - Определите, какого коэффициента нет в стандартном виде.
    - Если свободного члена нет, нулевое произведение быстрее формулы.
    - Вынесите $x$ из $5x^2+13x$ и рассмотрите оба множителя.
    solution: |
      ### Ответ
      $\{\frac{-13}{5}; 0\}$

      ### Идея
      Свободного члена нет: выносим $x$ и применяем правило нулевого произведения, не деля на $x$.

      ### Шаги
      1. Выносим общий множитель: $x(5x+13)=0$.
      2. Произведение равно нулю, если $x=0$ или $5x+13=0$.
      3. Из $5x+13=0$ получаем $x=-\frac{13}{5}$.

      ### Проверка
      $5\cdot0^2+13\cdot0=0$; $5\cdot(-\frac{13}{5})^2+13\cdot(-\frac{13}{5})=\frac{169}{5}-\frac{169}{5}=0$.

      ### Типичная ошибка
      Разделить $5x^2+13x=0$ на $x$ и оставить только $-\frac{13}{5}$, потеряв корень $0$ — E-eq-div-zero-factor.
    feedback:
      correct: 'Верно: $x(5x+13)=0$ сохраняет корень ноль и даёт отрицательный корень скобки.'
      wrong:
        what: В множестве корней неполного уравнения есть пропуск или лишнее значение.
        why: Мог быть потерян случай $x=0$ либо неверно решена линейная скобка.
        fix: 'Вынесите $x$: $x(5x+13)=0$, затем решите $x=0$ и $5x+13=0$.'
