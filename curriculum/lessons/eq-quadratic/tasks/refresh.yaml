      $x=t+(-2+\frac{\sqrt{15}}{3})$ (ввод: `t + (-2 + 1/3*sqrt(15))`).

      ### Идея
      Полагаем $y=x-t$, поэтому $x=t+y$. Не округляем квадратный корень; условие просит только большую ветвь.

      ### Шаги
      1. $a=3$, $b=12$, $c=7$.
      2. $D=12^2-4\cdot3\cdot7=60>0$.
      3. При положительном a больший корень соответствует плюсу: $y=\frac{-12+\sqrt{60}}{6}=-2+\frac{\sqrt{15}}{3}$.
      4. Возвращаемся к $x=t+y$: получаем выражение из ответа.

      ### Проверка
      Подстановка даёт $(2ay+b)^2=D=60$, значит исходное уравнение выполнено. Корень с минусом меньше, поскольку a положителен.

      ### Типичная ошибка
      Ошибочно округлять точный ответ или терять знак свободного члена в D: E-eq-wrong-discriminant.
  vars:
