tasks:
- id: R-01
  type: number
  role: refresh
  purpose: procedure
  level: 1
  outcome: LO-02
  sections:
  - T03
  minutes: 1
  prompt: Вычислите D для ${{a|coef}}x^{2} {{b|+coef}}x{{c|+}}=0$. Введите число.
  answer: 193
  hints:
  - Восстановите смысл дискриминанта, прежде чем считать.
  - Отдельно вычислите квадрат b и произведение 4ac.
  - 'В этом варианте $a={{a}}$, $b={{b}}$, $c={{c}}$: проверьте знак произведения 4ac.'
  solution: |
    ### Ответ
    $D=b^2-4ac$.

    ### Идея
    Коэффициенты уже в стандартном виде.

    ### Шаги
    1. Считаем две части формулы.
    2. Вычитаем произведение 4ac.

    ### Проверка
    Обратное сложение проверяет вычитание.

    ### Типичная ошибка
    E-eq-wrong-discriminant: сумма вместо разности.
  feedback:
    correct: 'Верно: в повторении снова сработала разность $b^2-4ac$, а произведение $4\cdot{{a|()}}\cdot{{c|()}}$
      посчитано отдельно.'
    wrong:
      what: Полученное значение дискриминанта не совпало.
      why: Квадрат b или произведение 4ac могли быть вычислены со знаком ошибки.
      fix: Запишите $D={{b|()}}^2-4\cdot{{a|()}}\cdot{{c|()}}$ и посчитайте каждую часть отдельно.
      next: 'T03: знак дискриминанта и его смысл.'
  variants:
  - params:
      a: 3
      b: -13
      c: -2
    answer: 193
    solution: |
      ### Ответ
      $D=193$.

      ### Идея
      Раздельное вычисление квадрата и произведения защищает от ошибки знака.

      ### Шаги
      1. $a=3$, $b=-13$, $c=-2$.
      2. $b^2=(-13)^2=169$, $4ac=4\cdot3\cdot(-2)=-24$.
      3. $D=169-(-24)=193$.

      ### Проверка
      Обратное сложение: $(-24)+193=169$.

      ### Типичная ошибка
      Сумма вместо разности воспроизводит E-eq-wrong-discriminant.
  - params:
      a: 4
      b: 13
      c: -3
    answer: 217
    solution: |
      ### Ответ
      $D=217$.

      ### Идея
      Раздельное вычисление квадрата и произведения защищает от ошибки знака.

      ### Шаги
      1. $a=4$, $b=13$, $c=-3$.
      2. $b^2=13^2=169$, $4ac=4\cdot4\cdot(-3)=-48$.
      3. $D=169-(-48)=217$.

      ### Проверка
      Обратное сложение: $(-48)+217=169$.

      ### Типичная ошибка
      Сумма вместо разности воспроизводит E-eq-wrong-discriminant.
  - params:
      a: 5
      b: -6
      c: 4
    answer: -44
    solution: |
      ### Ответ
      $D=-44$.

      ### Идея
      Раздельное вычисление квадрата и произведения защищает от ошибки знака.

      ### Шаги
      1. $a=5$, $b=-6$, $c=4$.
      2. $b^2=(-6)^2=36$, $4ac=4\cdot5\cdot4=80$.
      3. $D=36-80=-44$.

      ### Проверка
      Обратное сложение: $80+(-44)=36$.

      ### Типичная ошибка
      Сумма вместо разности воспроизводит E-eq-wrong-discriminant.
- id: R-02
  type: set
  role: refresh
  purpose: procedure
  level: 2
  outcome: LO-01
  sections:
  - T02
  minutes: 3
  prompt: Решите ${{a|coef}}x^{2} {{b|+coef}}x{{c|+}}=0$. Введите множество точных корней.
  answer:
  - 3/2
  - 5
  hints:
  - Повторите общий алгоритм, включая проверку.
  - Найдите D, затем обе ветви с ненулевым знаменателем.
  - Сначала для $a={{a}}$, $b={{b}}$, $c={{c}}$ посчитайте D; знаменатель формулы будет 2a.
  solution: |
    ### Ответ
    При $D>0$ два значения $x=(-b\pm\sqrt D)/(2a)$; при $D=0$ одно, при $D<0$ множество пусто.

    ### Идея
    Формула применяется после приведения к стандартному виду при ненулевом a.

    ### Шаги
    1. Выписываем коэффициенты и считаем $D=b^2-4ac$.
    2. Разбираем знак D и выполняем допустимые ветви формулы.

    ### Проверка
    Подстановка каждого найденного числа должна дать ноль.

    ### Типичная ошибка
    Потеря знака в $D$ — E-eq-wrong-discriminant.
  feedback:
    correct: 'Верно: формула корней восстановлена полностью — дискриминант, обе ветви и знаменатель $2a$.'
    wrong:
      what: Множество корней не совпало с уравнением.
      why: Возможна ошибка знака или знаменателя формулы.
      fix: 'Повторите шаги: D, корень из него, обе ветви со знаменателем $2\cdot{{a|()}}$, подстановка.'
      next: Вернитесь к формуле и проверке в T02.
  variants:
  - params:
      a: 2
      b: -13
      c: 15
    answer:
    - 3/2
    - 5
    solution: |
      ### Ответ
      $\{\frac{3}{2}; 5\}$

      ### Идея
      Выбираем формулу: она учитывает все коэффициенты и не требует подбора.

      ### Шаги
      1. Коэффициенты: $a=2$, $b=-13$, $c=15$.
      2. $D=(-13)^2-4\cdot2\cdot15=49$.
      3. $\sqrt{49}=7$, знаменатель $2a=4$.
      4. $x=\frac{13\pm 7}{4}$, получаем $\{\frac{3}{2}; 5\}$.

      ### Проверка
      $2\cdot(\frac{3}{2})^2-13\cdot\frac{3}{2}+15=0$; $2\cdot5^2-13\cdot5+15=0$

      ### Типичная ошибка
      Нельзя заменить разность суммой (E-eq-wrong-discriminant) или потерять одну ветвь (E-eq-lost-negative).
  - params:
      a: 3
      b: 19
      c: 20
    answer:
    - -5
    - -4/3
    solution: |
      ### Ответ
      $\{-5; \frac{-4}{3}\}$

      ### Идея
      Выбираем формулу: она учитывает все коэффициенты и не требует подбора.

      ### Шаги
      1. Коэффициенты: $a=3$, $b=19$, $c=20$.
      2. $D=19^2-4\cdot3\cdot20=121$.
      3. $\sqrt{121}=11$, знаменатель $2a=6$.
      4. $x=\frac{-19\pm 11}{6}$, получаем $\{-5; \frac{-4}{3}\}$.

      ### Проверка
      $3\cdot(-5)^2+19\cdot(-5)+20=0$; $3\cdot(-\frac{4}{3})^2+19\cdot(-\frac{4}{3})+20=0$

      ### Типичная ошибка
      Нельзя заменить разность суммой (E-eq-wrong-discriminant) или потерять одну ветвь (E-eq-lost-negative).
  - params:
      a: 4
      b: -17
      c: 4
    answer:
    - 1/4
    - 4
    solution: |
      ### Ответ
      $\{\frac{1}{4}; 4\}$

      ### Идея
      Выбираем формулу: она учитывает все коэффициенты и не требует подбора.

      ### Шаги
      1. Коэффициенты: $a=4$, $b=-17$, $c=4$.
      2. $D=(-17)^2-4\cdot4\cdot4=225$.
      3. $\sqrt{225}=15$, знаменатель $2a=8$.
      4. $x=\frac{17\pm 15}{8}$, получаем $\{\frac{1}{4}; 4\}$.

      ### Проверка
      $4\cdot(\frac{1}{4})^2-17\cdot\frac{1}{4}+4=0$; $4\cdot4^2-17\cdot4+4=0$

      ### Типичная ошибка
      Нельзя заменить разность суммой (E-eq-wrong-discriminant) или потерять одну ветвь (E-eq-lost-negative).
- id: R-03
  type: number
  role: refresh
  purpose: meaning
  level: 2
  outcome: LO-02
  sections:
  - T03
  minutes: 2
  prompt: Сколько различных действительных корней у ${{a|coef}}x^{2} {{b|+coef}}x{{c|+}}=0$? Введите количество.
  answer: 1
  hints:
  - Само значение D не является количеством корней.
  - Определите знак подкоренного выражения.
  - Начните с $b={{b}}$ и произведения $4\cdot{{a|()}}\cdot{{c|()}}$; только после вычитания назовите количество.
  solution: |
    ### Ответ
    Количество определяет знак D.

    ### Идея
    Нужно различать число разных корней и кратность.

    ### Шаги
    1. Считаем D.
    2. Сопоставляем знак с тремя ветвями.

    ### Проверка
    Проверяем смысл равенства квадрата и D.

    ### Типичная ошибка
    E-eq-negative-d-two-roots: знак ± не гарантирует два действительных числа.
  feedback:
    correct: 'Верно: число различных корней прочитано по знаку дискриминанта, двойной корень посчитан один раз.'
    wrong:
      what: Количество корней не согласуется со знаком дискриминанта.
      why: Двойной корень могли посчитать дважды или не проверить знак D.
      fix: Вычислите $D={{b|()}}^2-4\cdot{{a|()}}\cdot{{c|()}}$ и назовите количество по его знаку.
      next: Сравните с равенством $(2ax+b)^2=D$ в T02–T03.
  variants:
  - params:
      a: 5
      b: -60
      c: 180
    answer: 1
    solution: |
      ### Ответ
      Количество: 1.

      ### Идея
      Достаточно знака D; вычислять корни не требуется.

      ### Шаги
      1. $a=5\ne0$, $b=-60$, $c=180$.
      2. $D=(-60)^2-4\cdot5\cdot180=0$.
      3. По знаку D: один различный двойной корень.

      ### Проверка
      Выделение квадрата: $5x^2-60x+180=5(x-6)^2$ — ноль только при $x=6$.

      ### Типичная ошибка
      Посчитать двойной корень дважды и ответить 2: при $D=0$ обе ветви дают одно число $x=6$.
  - params:
      a: 3
      b: 5
      c: 7
    answer: 0
    solution: |
      ### Ответ
      Количество: 0.

      ### Идея
      Достаточно знака D; вычислять корни не требуется.

      ### Шаги
      1. $a=3\ne0$, $b=5$, $c=7$.
      2. $D=5^2-4\cdot3\cdot7=-59$.
      3. По знаку D: действительных решений нет.

      ### Проверка
      Выделение квадрата: $3x^2+5x+7=3(x+\frac{5}{6})^2+\frac{59}{12}$ — при любом x это больше нуля, корней нет.

      ### Типичная ошибка
      Подставить в формулу $|D|=59$ вместо отрицательного D и «найти» два корня — E-eq-negative-d-two-roots.
  - params:
      a: 2
      b: 13
      c: -1
    answer: 2
    solution: |
      ### Ответ
      Количество: 2.

      ### Идея
      Достаточно знака D; вычислять корни не требуется.

      ### Шаги
      1. $a=2\ne0$, $b=13$, $c=-1$.
      2. $D=13^2-4\cdot2\cdot(-1)=177$.
      3. По знаку D: два различных значения.

      ### Проверка
      Выделение квадрата: $2x^2+13x-1=2(x+\frac{13}{4})^2-\frac{177}{8}$; равенство нулю даёт $(x+\frac{13}{4})^2=\frac{177}{16}>0$ — два противоположных значения скобки, два корня.

      ### Типичная ошибка
      Ввести само значение $D=177$ вместо количества: число корней задаёт знак D, а не его величина.
- id: R-04
  type: set
  role: refresh
  purpose: procedure
  level: 1
  outcome: LO-02
  sections:
  - T04
  minutes: 2
  prompt: Решите ${{a|coef}}x^{2} {{b|+coef}}x=0$ без потери корней. Введите множество.
  answer:
  - 0
  - 7/4
  hints:
  - Вспомните, какое слагаемое отсутствует.
  - Вынесите общий неизвестный множитель и рассмотрите два случая.
  - Начните с $x({{a|coef}}x{{b|+}})=0$; сокращать на x нельзя до проверки нуля.
  solution: |
    ### Ответ
    Корни $0$ и $-b/a$.

    ### Идея
    Вынесение сохраняет нулевой случай.

    ### Шаги
    1. Разлагаем $x(ax+b)=0$.
    2. Решаем оба множителя.

    ### Проверка
    Каждый корень обнуляет произведение.

    ### Типичная ошибка
    E-eq-div-zero-factor: потеря корня ноль.
  feedback:
    correct: 'Верно: без сокращения на $x$ получены оба корня — ноль и корень линейной скобки.'
    wrong:
      what: В множестве корней неполного уравнения есть пропуск или лишнее значение.
      why: Мог быть потерян случай $x=0$ либо неверно решена линейная скобка.
      fix: 'Не делите на $x$: запишите $x({{a|coef}}x{{b|+}})=0$ и рассмотрите оба множителя.'
      next: 'T04: нулевое произведение и сохранение корня ноль.'
  variants:
  - params:
      a: 4
      b: -7
    answer:
    - 0
    - 7/4
    solution: |
      ### Ответ
      $\{0; \frac{7}{4}\}$

      ### Идея
      Свободного члена нет: выносим $x$ и применяем правило нулевого произведения, не деля на $x$.

      ### Шаги
      1. Выносим общий множитель: $x(4x-7)=0$.
      2. Произведение равно нулю, если $x=0$ или $4x-7=0$.
      3. Из $4x-7=0$ получаем $x=\frac{7}{4}$.

      ### Проверка
      $4\cdot0^2-7\cdot0=0$; $4\cdot(\frac{7}{4})^2-7\cdot(\frac{7}{4})=\frac{49}{4}-\frac{49}{4}=0$.

      ### Типичная ошибка
      Разделить $4x^2-7x=0$ на $x$ и оставить только $\frac{7}{4}$, потеряв корень $0$ — E-eq-div-zero-factor.
  - params:
      a: 3
      b: 11
    answer:
    - -11/3
    - 0
    solution: |
      ### Ответ
      $\{\frac{-11}{3}; 0\}$

      ### Идея
      Свободного члена нет: выносим $x$ и применяем правило нулевого произведения, не деля на $x$.

      ### Шаги
      1. Выносим общий множитель: $x(3x+11)=0$.
      2. Произведение равно нулю, если $x=0$ или $3x+11=0$.
      3. Из $3x+11=0$ получаем $x=-\frac{11}{3}$.

      ### Проверка
      $3\cdot0^2+11\cdot0=0$; $3\cdot(-\frac{11}{3})^2+11\cdot(-\frac{11}{3})=\frac{121}{3}-\frac{121}{3}=0$.

      ### Типичная ошибка
      Разделить $3x^2+11x=0$ на $x$ и оставить только $-\frac{11}{3}$, потеряв корень $0$ — E-eq-div-zero-factor.
  - params:
      a: -5
      b: 2
    answer:
    - 0
    - 2/5
    solution: |
      ### Ответ
      $\{0; \frac{2}{5}\}$

      ### Идея
      Свободного члена нет: выносим $x$ и применяем правило нулевого произведения, не деля на $x$.

      ### Шаги
      1. Выносим общий множитель: $x(-5x+2)=0$.
      2. Произведение равно нулю, если $x=0$ или $-5x+2=0$.
      3. Из $-5x+2=0$ получаем $x=\frac{2}{5}$.

      ### Проверка
      $-5\cdot0^2+2\cdot0=0$; $-5\cdot(\frac{2}{5})^2+2\cdot(\frac{2}{5})=-\frac{4}{5}+\frac{4}{5}=0$.

      ### Типичная ошибка
      Разделить $-5x^2+2x=0$ на $x$ и оставить только $\frac{2}{5}$, потеряв корень $0$ — E-eq-div-zero-factor.
  errors:
  - E-eq-div-zero-factor
- id: R-05
  type: numbers
  role: refresh
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T01
  minutes: 2
  prompt: Приведите $(x+{{k|()}})^2={{u|coef}}x{{v|+}}$ к стандартному виду. Введите a, b, c.
  answer:
    a: 1
    b: 13
    c: 54
  hints:
  - Сначала восстановите формулу квадрата суммы.
  - Соберите слагаемые после вычитания правой части.
  - В $(x+{{k|()}})^2$ найдите среднее слагаемое $2\cdot{{k|()}}\cdot x$, затем вычтите ${{u|coef}}x{{v|+}}$ из
    обеих частей.
  solution: |
    ### Ответ
    Коэффициенты после раскрытия: $a=1$, $b=2k-u$, $c=k^2-v$.

    ### Идея
    Стандартный вид получается вычитанием правой части.

    ### Шаги
    1. Раскрываем $(x+k)^2=x^2+2kx+k^2$.
    2. Собираем $x^2+(2k-u)x+(k^2-v)=0$.

    ### Проверка
    Обратное раскрытие возвращает исходную запись.

    ### Типичная ошибка
    Не раскрывайте квадрат по частям: E-eq-quadratic-square-parts.
  feedback:
    correct: 'Верно: после раскрытия $(x+{{k|()}})^2$ и вычитания правой части коэффициенты прочитаны со знаками.'
    wrong:
      what: Коэффициенты не совпали с приведённой записью.
      why: Возможно, потеряно среднее слагаемое квадрата или знак переноса.
      fix: Раскройте $(x+{{k|()}})^2$ с удвоенным произведением и вычтите ${{u|coef}}x{{v|+}}$.
      next: 'T01: стандартный вид и проверка раскрытием.'
  variants:
  - params:
      k: 8
      u: 3
      v: 10
    answer:
      a: 1
      b: 13
      c: 54
    solution: |
      ### Ответ
      $a=1$, $b=13$, $c=54$.

      ### Идея
      Нужно сначала раскрыть квадрат и вычесть правую часть.

      ### Шаги
      1. $(x+8)^2=x^2+16x+64$.
      2. После вычитания $3x+10$ получаем $x^2+13x+54=0$.
      3. Читаем коэффициенты: $a=1$, $b=13$, $c=54$.

      ### Проверка
      Прибавление вычтенной правой части к $x^2+13x+54$ возвращает $x^2+16x+64$.

      ### Типичная ошибка
      Потеря среднего слагаемого при раскрытии — E-eq-quadratic-square-parts.
  - params:
      k: 9
      u: 4
      v: 16
    answer:
      a: 1
      b: 14
      c: 65
    solution: |
      ### Ответ
      $a=1$, $b=14$, $c=65$.

      ### Идея
      Нужно сначала раскрыть квадрат и вычесть правую часть.

      ### Шаги
      1. $(x+9)^2=x^2+18x+81$.
      2. После вычитания $4x+16$ получаем $x^2+14x+65=0$.
      3. Читаем коэффициенты: $a=1$, $b=14$, $c=65$.

      ### Проверка
      Прибавление вычтенной правой части к $x^2+14x+65$ возвращает $x^2+18x+81$.

      ### Типичная ошибка
      Потеря среднего слагаемого при раскрытии — E-eq-quadratic-square-parts.
  - params:
      k: -6
      u: 2
      v: 9
    answer:
      a: 1
      b: -14
      c: 27
    solution: |
      ### Ответ
      $a=1$, $b=-14$, $c=27$.

      ### Идея
      Нужно сначала раскрыть квадрат и вычесть правую часть.

      ### Шаги
      1. $(x-6)^2=x^2-12x+36$.
      2. После вычитания $2x+9$ получаем $x^2-14x+27=0$.
      3. Читаем коэффициенты: $a=1$, $b=-14$, $c=27$.

      ### Проверка
      Прибавление вычтенной правой части к $x^2-14x+27$ возвращает $x^2-12x+36$.

      ### Типичная ошибка
      Потеря среднего слагаемого при раскрытии — E-eq-quadratic-square-parts.
  fields:
  - id: a
    label: a
  - id: b
    label: b
  - id: c
    label: c
- id: R-06
  type: expression
  role: refresh
  purpose: procedure
  level: 2
  outcome: LO-01
  sections:
  - T02
  minutes: 4
  prompt: Найдите больший корень ${{a|coef}}(x-t)^{2} {{b|+coef}}(x-t){{c|+}}=0$. Введите точное выражение через
    sqrt. Здесь t — известный действительный параметр; ответ запишите как выражение с t. Можно обозначить $y=x-t$.
  answer: t + (6 + sqrt(19))
  hints:
  - Обозначьте $y=x-t$ и решите уравнение для y; t вернётся только в конце.
  - После вычисления D используйте большую ветвь формулы при положительном a.
  - Для $a={{a}}$, $b={{b}}$, $c={{c}}$ начните с вычисления D; не превращайте корень в десятичное число.
  solution: |
    ### Ответ
    Для x прибавьте t к большему корню уравнения для y.
    Больший корень x — t плюс больший корень y $(-b+\sqrt D)/(2a)$ при $a>0$, $D>0$.

    ### Идея
    Обозначаем $y=x-t$, затем возвращаемся к $x=t+y$. Точность сохраняет запись с корнем.

    ### Шаги
    1. Считаем D.
    2. Подставляем в большую ветвь.

    ### Проверка
    Проверяем $(2ay+b)^2=D$.

    ### Типичная ошибка
    E-eq-wrong-discriminant: неверное подкоренное выражение.
  feedback:
    correct: 'Верно: корень из D оставлен точным, и к большему значению y прибавлено t.'
    wrong:
      what: Выражение не даёт больший корень сдвинутого уравнения.
      why: Могли потеряться сдвиг t, знак перед b или знак в D.
      fix: Решите ${{a|coef}}y^{2} {{b|+coef}}y{{c|+}}=0$ точно; к большему y прибавьте t.
      next: 'T02: точный корень и возврат после сдвига.'
  variants:
  - params:
      a: 1
      b: -12
      c: 17
    answer: t + (6 + sqrt(19))
    solution: |
      ### Ответ
      $x=t+(6+\sqrt{19})$ (ввод: `t + (6 + sqrt(19))`).

      ### Идея
      Полагаем $y=x-t$, поэтому $x=t+y$. Не округляем квадратный корень; условие просит только большую ветвь.

      ### Шаги
      1. $a=1$, $b=-12$, $c=17$.
      2. $D=(-12)^2-4\cdot1\cdot17=76>0$.
      3. При положительном a больший корень соответствует плюсу: $y=\frac{12+\sqrt{76}}{2}=6+\sqrt{19}$.
      4. Возвращаемся к $x=t+y$: получаем выражение из ответа.

      ### Проверка
      Подстановка даёт $(2ay+b)^2=D=76$, значит исходное уравнение выполнено. Корень с минусом меньше, поскольку a положителен.

      ### Типичная ошибка
      Ошибочно округлять точный ответ или терять знак свободного члена в D: E-eq-wrong-discriminant.
  - params:
      a: 2
      b: 8
      c: 3
    answer: t + (-2 + 1/2*sqrt(10))
    solution: |
      ### Ответ
      $x=t+(-2+\frac{\sqrt{10}}{2})$ (ввод: `t + (-2 + 1/2*sqrt(10))`).

      ### Идея
      Полагаем $y=x-t$, поэтому $x=t+y$. Не округляем квадратный корень; условие просит только большую ветвь.

      ### Шаги
      1. $a=2$, $b=8$, $c=3$.
      2. $D=8^2-4\cdot2\cdot3=40>0$.
      3. При положительном a больший корень соответствует плюсу: $y=\frac{-8+\sqrt{40}}{4}=-2+\frac{\sqrt{10}}{2}$.
      4. Возвращаемся к $x=t+y$: получаем выражение из ответа.

      ### Проверка
      Подстановка даёт $(2ay+b)^2=D=40$, значит исходное уравнение выполнено. Корень с минусом меньше, поскольку a положителен.

      ### Типичная ошибка
      Ошибочно округлять точный ответ или терять знак свободного члена в D: E-eq-wrong-discriminant.
