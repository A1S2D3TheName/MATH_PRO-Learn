tasks:
- id: C-01
  type: code
  role: supported
  purpose: transfer
  level: 2
  outcome: LO-02
  sections:
  - T03
  minutes: 7
  lang: python
  runtime: cpython>=3.12
  mode: code-function
  code_topics:
  - code-first-steps
  - code-variables
  - code-conditions
  - code-functions
  goal: Различить число разных действительных корней, кратность и вырожденную линейную ветвь по точным коэффициентам.
  entry: number_of_roots
  prompt: |
    Напишите функцию `number_of_roots(a, b, c)`, возвращающую число различных действительных
    корней уравнения $a x^{2} + b x + c = 0$ (целое 0, 1 или 2). Гарантируется, что при
    $a = 0$ число $b \ne 0$. Модули `fractions` и `math` использовать нельзя.
  starter: |
    def number_of_roots(a, b, c):
        # Число действительных корней a*x^2 + b*x + c = 0.
        # При a = 0 гарантируется b != 0.
        ...
  reference: |
    def number_of_roots(a, b, c):
        if a == 0:
            return 1
        d = b * b - 4 * a * c
        if d < 0:
            return 0
        if d == 0:
            return 1
        return 2
  visible_tests:
  - args:
    - 1
    - -5
    - 6
    expected: 2
  - args:
    - 1
    - 4
    - 4
    expected: 1
  - args:
    - 1
    - 1
    - 1
    expected: 0
  hidden_tests:
  - args:
    - 0
    - 5
    - -3
    expected: 1
    edge_case: true
  - args:
    - 2
    - 0
    - 5
    expected: 0
  - args:
    - -1
    - 0
    - -1
    expected: 0
  - args:
    - 1
    - -2
    - 1
    expected: 1
  - seed: 20261001
    count: 20
    generator: fraction_and_integer
    check: equals_reference
  wrong_solutions:
  - code: |
      def number_of_roots(a, b, c):
          d = b * b - 4 * a * c
          return 2 if d >= 0 else 0
    expect: fails
    note: '`d == 0` засчитано как два корня; случай `a == 0` не выделен'
  - code: |
      def number_of_roots(a, b, c):
          if a == 0:
              return 0
          d = b * b - 4 * a * c
          return 2 if d > 0 else (1 if d == 0 else 0)
    error: E-eq-quadratic-lose-a-zero
    expect: fails
    note: при `a == 0` уравнение линейное — корень один
  - code: |
      def number_of_roots(a, b, c):
          if a == 0:
              return 1
          d = b * b + 4 * a * c
          return 2 if d > 0 else (1 if d == 0 else 0)
    expect: fails
    note: знак в дискриминанте перепутан
  - code: |
      import math

      def number_of_roots(a, b, c):
          return math.gcd(a, b, c)
    expect: forbidden
    note: запрещённый модуль
  allowed_imports: []
  forbidden:
  - name: math
    why: число корней задаётся знаком дискриминанта — библиотеки здесь не нужны
  - name: random
    why: 'случайности нет: на фиксированном вводе число корней определено однозначно'
  timeout_ms: 1000
  output_limit: 10000
  check: exact
  followup: Почему функция возвращает 1 при $a=0$ — это баг или осознанное поведение, и как бы вы оформили случай
    $a=0$, $b=0$?
  qa:
    question: Конечные тесты прошли. Почему это не доказательство для всех коэффициентов? Какие условия делают классификацию
      полной?
    answer: 'Конечный набор — проверка, не доказательство. При $a=0$ по гарантии $b\ne0$ остаётся линейное уравнение
      с одним корнем. При $a\ne0$ равносильность $(2ax+b)^2=D$ объясняет три ветви: $D<0$ — 0, $D=0$ — 1, $D>0$
      — 2 различных корня.'
    graded: false
  answer: см. reference
  hints:
  - Сначала проверьте, действительно ли уравнение квадратное; по условию вырожденная ветвь не является постоянным
    равенством.
  - Для ненулевого старшего коэффициента нужна классификация по знаку дискриминанта, а не вычисление самих корней.
  - 'Отдельно протестируйте коэффициенты (1, 4, 4): нулевой дискриминант означает одно различное значение; сравните
    с отрицательным D.'
  solution: |
    ### Ответ

    Функция из эталона: ветка `a == 0`, затем дискриминант и его знак.

    ### Идея

    Число действительных корней задаётся знаком дискриминанта: $D<0$ — нет,
    $D=0$ — один, $D>0$ — два; при $a=0$ и гарантированном $b\ne0$ уравнение линейное.

    ### Шаги

    1. Если `a == 0`, верните 1: по условию $b\ne0$, уравнение линейное.
    2. Посчитайте `d = b * b - 4 * a * c`.
    3. Если `d < 0`, верните 0; если `d == 0`, верните 1; иначе 2.

    ### Проверка

    (1, −5, 6) → 2, (1, 4, 4) → 1, (1, 1, 1) → 0, (0, 5, −3) → 1.

    ### Типичная ошибка

    E-eq-wrong-discriminant: сумма $b^2+4ac$ вместо разности меняет знак D, например при коэффициентах $(2, -3, -5)$. Другая ошибка — `return 2 if d >= 0 else 0`: при `d == 0` корень один, а не два.
  feedback:
    correct: Функция прошла конечный набор тестов. Полноту классификации обосновывает разбор ветвей, а не количество
      прогонов.
    wrong:
      what: Хотя бы один тест не пройден.
      why: Не выделен случай $a=0$ или $D=0$ засчитан как два корня.
      fix: 'Проверьте вручную: $D=0$ даёт один корень; $a=0$ — линейное уравнение.'
      next: 'Раздел T03: дискриминант и число корней.'
- id: C-02
  type: code
  role: independent
  purpose: meaning
  level: 2
  outcome: LO-03
  sections:
  - T03
  - T06
  minutes: 7
  lang: python
  runtime: cpython>=3.12
  mode: code-insert
  code_topics:
  - code-first-steps
  - code-variables
  - code-conditions
  - code-functions
  - code-loops
  goal: Исследовать, сколько целых значений свободного члена дают два различных действительных корня в конечном
    диапазоне, и исключить границу $D=0$.
  entry: count_two
  prompt: |
    В семействе $ax^2+bx+k=0$ параметр k пробегает все целые от $-|n|$ до $|n|$. Даны целые a, b, n; b ненулевой. Функция count_two(a, b, n) должна вернуть количество этих k, при которых уравнение имеет два различных действительных корня. Цикл и вычисление D уже готовы: замените только условие SLOT. Не используйте модули.
  starter: |
    def count_two(a, b, n):
        if a == 0:
            return 0
        total = 0
        for k in range(-abs(n), abs(n) + 1):
            d = b * b - 4 * a * k
            if d >= 0:  # SLOT
                total += 1
        return total
  slot: 'if d >= 0:  # SLOT'
  reference: |
    if d > 0:
  visible_tests:
  - args:
    - 1
    - 2
    - 2
    expected: 3
  - args:
    - -1
    - 2
    - 2
    expected: 3
  - args:
    - 0
    - 5
    - 3
    expected: 0
  hidden_tests:
  - args:
    - 1
    - 4
    - 4
    expected: 8
    edge_case: true
  - args:
    - 1
    - 1
    - 0
    expected: 1
  - args:
    - 1
    - 3
    - 1
    expected: 3
  - seed: 20261008
    count: 20
    generator: fraction_and_integer
    check: equals_reference
  wrong_solutions:
  - code: |
      if d >= 0:
    expect: fails
    note: Граница $D=0$ ошибочно засчитана как два различных корня.
  - code: |
      if d < 0:
    expect: fails
    note: Отрицательный D ошибочно принят за допустимое значение.
  - code: |
      if d == 0:
    expect: fails
    note: Вместо двух различных корней выбирается двойной.
  - code: |
      import sympy
      if d > 0:
    expect: forbidden
    note: Внешняя библиотека не нужна для знака точного целого выражения.
  allowed_imports: []
  forbidden:
  - name: sympy
    why: Классификация по знаку D доказывается элементарно, без внешнего решателя.
  - name: math
    why: 'Квадратный корень не нужен: требуется знак целого дискриминанта.'
  timeout_ms: 1000
  output_limit: 10000
  check: exact
  followup: Как меняется дискриминант $b^2-4ak$ при переходе от k к $k+1$, если $a>0$ и если $a<0$? Объясните, почему
    подходящие k идут подряд.
  qa:
    question: Для $a=1$, $b=2$, $n=2$ какие k засчитываются? Почему программа помогает исследованию, но не доказывает
      общий закон?
    answer: 'Здесь $D=4-4k$. При $k=-2$, $-1$, $0$ дискриминант положителен (12, 8 и 4); при $k=1$ он равен нулю
      — корень двойной и не засчитывается; при $k=2$ получаем $D=-4$, решений нет. Перебор проверяет конечный список.
      Общий закон даёт сам дискриминант: при $a\ne0$ два различных корня бывают ровно при положительном D, а при
      $a=0$ и ненулевом b уравнение линейное.'
    graded: false
  answer: см. reference
  hints:
  - Требуется число значений параметра, не число корней одного выбранного уравнения.
  - 'Нужно различить положительный дискриминант и нулевую границу: слово «различных» существенно.'
  - Для $a=1$, $b=2$ найдите k, при котором дискриминант равен нулю, и проверьте, что это значение не увеличивает
    счётчик двух различных корней.
  solution: |
    ### Ответ
    Условие вставки: `if d > 0:`.

    ### Идея
    Цикл проверяет весь конечный диапазон, а строгий положительный знак D выбирает ровно два различных корня. При $a=0$, $b\ne0$ каждый член семейства линейный и таких k нет.

    ### Шаги
    1. Отделяем $a=0$: ответ 0 уже задан каркасом.
    2. Для каждого целого k вычисленный D определяет число корней.
    3. При $D=0$ один корень кратности 2: этот случай не засчитываем.
    4. Счётчик увеличивается только при $D>0$.

    ### Проверка
    При (1, 2, 2) подходят −2, −1, 0: ответ 3. При (−1, 2, 2) подходят 0, 1, 2: тоже 3. При (0, 5, 3) два различных корня невозможны: ответ 0.

    ### Типичная ошибка
    Подмена D его модулем (E-eq-negative-d-two-roots) или допуск нулевой границы засчитает неподходящие значения параметра.
  feedback:
    correct: Конечный диапазон посчитан; нулевая граница не принята за два разных корня. Сверьте результат с примером
      6 из T06.
    wrong:
      what: Счётчик включает лишние значения или пропускает допустимые.
      why: Вероятно, перепутаны строгий знак D и нулевая граница.
      fix: Разберите вручную $D=0$ и $D<0$, не меняя готовый цикл.
      next: 'T03: различный и двойной корень; T06: целый параметр в диапазоне.'
