tasks:
- id: D-01
  type: set
  role: diagnostic
  purpose: procedure
  level: 1
  outcome: alg-factor/LO-01
  sections:
  - T04
  minutes: 2
  prompt: Решите уравнение $(x-2)(x+5)=0$. Введите множество корней.
  answer:
  - -5
  - 2
  hints:
  - В данном равенстве уже выделены два множителя.
  - Проверяйте обе скобки по правилу нулевого произведения.
  - Начните с уравнения $x-2=0$, затем исследуйте скобку $x+5$.
  solution: |
    ### Ответ
    Множество корней: $-5$ и $2$.

    ### Идея
    Если произведение равно нулю, хотя бы один из его множителей равен нулю.

    ### Шаги
    1. Приравниваем первый множитель к нулю: $x-2=0$, откуда $x=2$.
    2. Приравниваем второй множитель к нулю: $x+5=0$, откуда $x=-5$.
    3. Объединяем решения двух случаев: $x=2$ или $x=-5$.

    ### Проверка
    При $x=2$ первый множитель равен нулю, при $x=-5$ второй; в обоих случаях всё произведение равно нулю.

    ### Типичная ошибка

    E-eq-one-product-root: Решить только первый множитель или сократить на неизвестное выражение.
  feedback:
    correct: 'Верно: вы рассмотрели оба множителя и получили ровно те числа, при которых произведение равно нулю.'
    wrong:
      what: Проверьте оба множителя произведения.
      why: Рассмотрен только один случай нулевого произведения.
      fix: Выпишите равенства $x-2=0$ и $x+5=0$ и проверьте оба корня подстановкой.
      next: 'T04: правило нулевого произведения, обе скобки.'
- id: D-02
  type: number
  role: diagnostic
  purpose: procedure
  level: 1
  outcome: alg-sqrt/LO-01
  sections:
  - T02
  minutes: 2
  prompt: Вычислите $\sqrt{{{r}}}$. Введите только число.
  answer: 7
  hints:
  - Вспомните, что именно обозначает знак квадратного корня.
  - Найдите неотрицательное число, квадрат которого равен 49.
  - Из двух чисел, дающих в квадрате 49, в ответ идёт только неотрицательное.
  solution: |
    ### Ответ
    $\sqrt{49}=7$.

    ### Идея
    Знак $\sqrt{\phantom{x}}$ обозначает арифметический квадратный корень: это неотрицательное число, квадрат которого равен подкоренному выражению. Поэтому значение $\sqrt{49}$ одно, а не пара чисел.

    ### Шаги
    1. Ищем неотрицательное число, квадрат которого равен 49.
    2. $7^2=49$, значит $\sqrt{49}=7$.
    3. Проверяем знак: $7\ge0$, условие арифметического корня выполнено.

    ### Проверка
    Подстановка в определение: $7^2=49$ — сходится с подкоренным числом.

    ### Типичная ошибка

    E-eq-quadratic-sqrt-two-signs: Записать $\pm7$ по аналогии с решением уравнения $x^2=49$: два знака появляются у корней уравнения, а значение $\sqrt{49}$ одно и неотрицательно.
  feedback:
    correct: 'Верно: $\sqrt{49}$ — это одно неотрицательное число 7.'
    wrong:
      what: Проверьте, что означает знак корня в записи $\sqrt{49}$.
      why: Знак $\sqrt{\phantom{x}}$ даёт одно неотрицательное значение, а не пару $\pm7$.
      fix: Найдите неотрицательное число, квадрат которого равен 49, и введите его.
      next: Повторите определение арифметического квадратного корня.
    misconceptions:
    - id: E-eq-quadratic-sqrt-two-signs
      when:
        expr: -answer
      message: Такой ответ может получиться при выборе отрицательного корня уравнения вместо арифметического корня.
        Значение знака √ неотрицательно.
    - id: E-eq-quadratic-sqrt-half
      when:
        expr: r/2
      message: 'Ответ 24,5: корень — не половина подкоренного числа; нужно число, квадрат которого равен 49.'
  errors:
  - E-eq-quadratic-sqrt-two-signs
  - E-eq-quadratic-sqrt-half
  variants:
  - params:
      r: 49
    answer: 7
- id: D-03
  type: set
  role: diagnostic
  purpose: procedure
  level: 1
  outcome: alg-factor/LO-01
  sections:
  - T04
  minutes: 2
  prompt: Решите уравнение $x(x-4)=0$. Введите множество корней.
  answer:
  - 0
  - 4
  hints:
  - Одна из скобок — сам неизвестный множитель.
  - Рассмотрите нулевой каждый множитель, не деля на неизвестное.
  - Проверьте случай $x=0$ и отдельно равенство $x-4=0$.
  solution: |
    ### Ответ
    Множество корней: $0$ и $4$.

    ### Идея
    Если произведение равно нулю, хотя бы один из его множителей равен нулю.

    ### Шаги
    1. Приравниваем первый множитель к нулю: $x=0$.
    2. Приравниваем второй множитель к нулю: $x-4=0$, откуда $x=4$.
    3. Объединяем решения двух случаев: $x=0$ или $x=4$.

    ### Проверка
    При $x=0$ первый множитель равен нулю, при $x=4$ второй; в обоих случаях всё произведение равно нулю.

    ### Типичная ошибка

    E-eq-div-zero-factor: сократить обе части на $x$ и потерять корень $0$.
  feedback:
    correct: 'Верно: вы сохранили оба множителя, включая отдельный множитель $x$ с корнем 0.'
    wrong:
      what: Проверьте оба множителя произведения.
      why: Рассмотрен только один случай нулевого произведения.
      fix: Рассмотрите отдельно $x=0$ и $x-4=0$; делить на $x$ нельзя.
      next: 'T04: нулевое произведение и потеря нуля при сокращении.'
- id: D-04
  type: number
  role: diagnostic
  purpose: procedure
  level: 1
  outcome: alg-sqrt/LO-01
  sections:
  - T02
  minutes: 2
  prompt: Вычислите $\sqrt{16\cdot 25}$. Введите только число.
  answer: 20
  hints:
  - Внутри корня произведение двух положительных чисел.
  - Можно вычислить корень каждого множителя и перемножить результаты.
  - Для множителей 16 и 25 сначала найдите неотрицательные числа с такими квадратами.
  solution: |
    ### Ответ
    $\sqrt{16\cdot25}=20$.

    ### Идея
    Корень из произведения неотрицательных чисел равен произведению корней: $\sqrt{ab}=\sqrt{a}\cdot\sqrt{b}$. Это позволяет считать по частям.

    ### Шаги
    1. Разбиваем корень из произведения: $\sqrt{16\cdot25}=\sqrt{16}\cdot\sqrt{25}$.
    2. $\sqrt{16}=4$ и $\sqrt{25}=5$.
    3. $4\cdot5=20$.

    ### Проверка
    $20^2=400=16\cdot25$, значит корень найден верно.

    ### Типичная ошибка

    Сложить корни множителей: $\sqrt{16}+\sqrt{25}=9$, но $9^2=81\ne400$. Другой механизм — взять половину подкоренного числа, $400:2=200$ (E-eq-quadratic-sqrt-half).
  feedback:
    correct: 'Верно: вы разбили корень из произведения на два корня и перемножили результаты.'
    wrong:
      what: Проверьте, извлечён ли корень из каждого множителя.
      why: Корень из произведения равен произведению корней, поэтому важны оба множителя.
      fix: Вычислите $\sqrt{16}$ и $\sqrt{25}$ по отдельности, затем перемножьте.
      next: Повторите свойства квадратного корня.
- id: D-05
  type: choice
  role: diagnostic
  purpose: meaning
  level: 1
  outcome: alg-factor/LO-01
  sections:
  - T01
  minutes: 2
  prompt: Какое выражение тождественно равно $(x+3)^2$?
  answer: o1
  options:
  - id: o1
    text: $x^2+6x+9$
    why: 'Формула $(a+b)^2=a^2+2ab+b^2$: здесь $2\cdot x\cdot3=6x$ и $3^2=9$.'
  - id: o2
    text: $x^2+9$
    misconception: E-eq-quadratic-square-parts
    why: Каждое слагаемое возведено в квадрат отдельно, удвоенное произведение $2\cdot x\cdot3$ пропущено.
  - id: o3
    text: $x^2+3x+9$
    misconception: E-eq-quadratic-square-undoubled
    why: В среднем слагаемом взято b вместо 2b, должно быть $2\cdot x\cdot3=6x$.
  - id: o4
    text: $x^2+6x-9$
    misconception: E-eq-quadratic-square-constant-sign
    why: 'Потерян знак перед $b^2$: величина $3^2=9$ входит в формулу со знаком плюс.'
  hints:
  - Напишите формулу квадрата суммы $(a+b)^2$.
  - Подставьте $a=x$ и $b=3$; вычислите удвоенное произведение и квадрат $b$ отдельно.
  - 'Проверьте себя числом: подставьте $x=1$ и в квадрат суммы, и в выбранное выражение.'
  solution: |
    ### Ответ

    $x^2+6x+9$.

    ### Идея

    Квадрат суммы раскрывается по формуле $(a+b)^2=a^2+2ab+b^2$, а не «каждое слагаемое в квадрат».

    ### Шаги

    1. Записываем $(x+3)^2=x^2+2\cdot x\cdot3+3^2$.
    2. Вычисляем $2\cdot x\cdot3=6x$ и $3^2=9$.
    3. Получаем $x^2+6x+9$.

    ### Проверка

    При $x=1$: $(1+3)^2=16$ и $1+6+9=16$ — значения совпадают.

    ### Типичная ошибка

    E-eq-quadratic-square-parts: раскрыть «по частям» и получить $x^2+9$: при $x=1$ это дало бы 10 вместо 16.
  feedback:
    correct: 'Верно: формула квадрата суммы применена полностью.'
    wrong:
      what: Выбрано неверное раскрытие квадрата суммы.
      why: Пропущено удвоенное произведение $2ab$ или потерян знак перед $b^2$.
      fix: 'В раскрытии три слагаемых: $a^2$, удвоенное произведение $2ab$ и $b^2$.'
      next: Раздел T01, заметка «Потерянное удвоенное произведение».
  errors:
  - E-eq-quadratic-square-parts
  - E-eq-quadratic-square-undoubled
  - E-eq-quadratic-square-constant-sign
