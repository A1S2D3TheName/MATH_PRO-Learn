  solution: |
    ### Ответ
    Пункты a, b, d.

    ### Идея
    Знак D и кратность — разные характеристики.

    ### Шаги
    1. При $D>0$ получаются два различных значения: a верен.
    2. При $D=0$ одно значение имеет кратность 2: b и d верны.
    3. При $D<0$ исходных действительных корней нет. Замена D на |D| меняет уравнение, поэтому c неверен.

    ### Проверка
    Все три случая следуют из $(2ax+b)^2=D$ при $a\ne0$.

    ### Типичная ошибка
    Считать две ветви действительными при $D<0$ — E-eq-negative-d-two-roots.
