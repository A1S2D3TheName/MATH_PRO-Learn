  hints:
  - Сначала посмотрите, какие члены остаются после переноса.
  - Отсутствие линейного или свободного члена позволяет сократить алгоритм.
  - Для 2x^2=3x+5 сначала вычтите правую часть и проверьте, есть ли все три члена.
  solution: |
    ### Ответ
    l1 → r3; l2 → r1; l3 → r2.

    ### Идея
    Выбираем короткий способ по структуре, а не по одному и тому же шаблону для всех записей.

    ### Шаги
    1. Для первой записи после переноса остаются все три члена: подходит формула.
    2. Во второй нет линейного члена: выражаем $x^2$ и проверяем знак.
    3. В третьей после переноса нет свободного члена: выносим x.

    ### Проверка
    Коэффициент при $x^2$ ни в одной карточке не исчезает; варианты r4 и r5 не нужны.

    ### Типичная ошибка
    Делить третье уравнение на x и терять ноль — E-eq-div-zero-factor.
