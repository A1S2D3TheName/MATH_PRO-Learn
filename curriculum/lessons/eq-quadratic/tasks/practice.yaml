      $x=t+(1+\frac{2}{3}\sqrt{3})$ (ввод: `t + (1 + 2/3*sqrt(3))`).

      ### Идея
      Полагаем $y=x-t$, поэтому $x=t+y$. Не округляем квадратный корень; условие просит только большую ветвь.

      ### Шаги
      1. $a=3$, $b=-6$, $c=-1$.
      2. $D=(-6)^2-4\cdot3\cdot(-1)=48>0$.
      3. При положительном a больший корень соответствует плюсу: $y=\frac{6+\sqrt{48}}{6}=1+\frac{2}{3}\sqrt{3}$.
      4. Возвращаемся к $x=t+y$: получаем выражение из ответа.

      ### Проверка
      Подстановка даёт $(2ay+b)^2=D=48$, значит исходное уравнение выполнено. Корень с минусом меньше, поскольку a положителен.

      ### Типичная ошибка
      Ошибочно округлять точный ответ или терять знак свободного члена в D: E-eq-wrong-discriminant.
  vars:
  - t
  domain:
  - name: t
    min: -5
    max: 5
