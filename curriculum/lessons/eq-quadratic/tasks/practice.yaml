    - 8
    solution: |
      ### Ответ
      $\{5; 8\}$.

      ### Идея
      Второе число выражаем через первое из суммы, затем используем произведение.

      ### Шаги
      1. Пусть первое число x, второе $13-x$.
      2. $x(13-x)=40$, то есть $x^2-13x+40=0$.
      3. $D=13^2-4\cdot40=9$, корни $\{5; 8\}$.

      ### Проверка
      $5+8=13$, $5\cdot8=40$. Отрицательные числа допустимы: задачи о размерах здесь нет.

      ### Типичная ошибка
      Остановиться на одном числе $5$: второе число $13-5=8$ — тоже корень уравнения. Потеря одной ветви формулы — E-eq-lost-negative.
