tasks:
- id: P-01
  type: set
  role: warmup
  purpose: procedure
  level: 0
  outcome: LO-01
  sections:
  - T02
  - T04
  minutes: 1
  prompt: Решите уравнение $x^2={{r}}$ и введите множество всех корней.
  answer:
  - -5
  - 5
  hints:
  - Сравните квадрат неизвестного с положительным числом.
  - Рассмотрите два противоположных значения, а не только арифметический корень.
  - Найдите число, квадрат которого равен {{r}}, затем учтите оба знака.
  solution: |
    ### Ответ
    Корни $-\sqrt r$ и $\sqrt r$ при $r>0$.

    ### Идея
    Равенство квадратов требует двух знаков.

    ### Шаги
    1. Из $x^2=r$ получаем $x=\sqrt r$ или $x=-\sqrt r$.
    2. Объединяем оба значения в множество.

    ### Проверка
    Квадрат каждого значения равен r.

    ### Типичная ошибка
    Один положительный корень вместо двух — E-eq-lost-negative.
  feedback:
    correct: Оба противоположных корня записаны.
    wrong:
      what: Проверьте полноту множества.
      why: Возможно, оставлен только арифметический корень.
      fix: Запишите обе ветви равенства квадратов.
      next: 'T02 и T04: два знака при положительной правой части.'
    misconceptions:
    - id: E-eq-lost-negative
      when:
        expr: sqrt(r)
      message: Такой ответ может означать, что оставлен только положительный корень.
  variants:
  - params:
      r: 25
    answer:
    - -5
    - 5
    solution: |
      ### Ответ
      $\{-5; 5\}$

      ### Идея
      Положительное число имеет два противоположных квадратных корня.

      ### Шаги
      1. $\sqrt{25}=5$.
      2. По двум знакам получаем $\{-5; 5\}$.

      ### Проверка
      $(-5)^2=25$; $5^2=25$

      ### Типичная ошибка
      Потерянный отрицательный корень — E-eq-lost-negative.
  - params:
      r: 49
    answer:
    - -7
    - 7
    solution: |
      ### Ответ
      $\{-7; 7\}$

      ### Идея
      Положительное число имеет два противоположных квадратных корня.

      ### Шаги
      1. $\sqrt{49}=7$.
      2. По двум знакам получаем $\{-7; 7\}$.

      ### Проверка
      $(-7)^2=49$; $7^2=49$

      ### Типичная ошибка
      Потерянный отрицательный корень — E-eq-lost-negative.
  errors:
  - E-eq-lost-negative
- id: P-02
  type: number
  role: warmup
  purpose: procedure
  level: 0
  outcome: LO-02
  sections:
  - T03
  minutes: 1
  prompt: Вычислите дискриминант $x^{2} {{b|+coef}}x{{c|+}}=0$. Введите число.
  answer: 1
  hints:
  - У приведённого уравнения старший коэффициент равен единице.
  - Дискриминант — разность квадрата линейного коэффициента и произведения четырёх со свободным членом.
  - Для $b={{b}}$, $c={{c}}$ сначала вычислите квадрат b и отдельно $4c$.
  solution: |
    ### Ответ
    $D=b^2-4c$.

    ### Идея
    Считываем коэффициенты со знаками.

    ### Шаги
    1. Здесь $a=1$.
    2. Вычитаем 4c из квадрата b.

    ### Проверка
    Сложение D и 4c возвращает квадрат b.

    ### Типичная ошибка
    E-eq-wrong-discriminant: разность заменена суммой.
  feedback:
    correct: 'Верно: у приведённого уравнения $D=b^2-4c$, и знак $c={{c}}$ учтён в произведении.'
    wrong:
      what: Полученное значение дискриминанта не совпало.
      why: Квадрат b или произведение 4ac могли быть вычислены со знаком ошибки.
      fix: Вычислите ${{b|()}}^2$ и $4\cdot{{c|()}}$ отдельно, затем вычтите второе из первого.
      next: 'T03: знак дискриминанта и его смысл.'
  variants:
  - params:
      b: 5
      c: 6
    answer: 1
    solution: |
      ### Ответ
      $D=1$.

      ### Идея
      Раздельное вычисление квадрата и произведения защищает от ошибки знака.

      ### Шаги
      1. $a=1$, $b=5$, $c=6$.
      2. $b^2=5^2=25$, $4ac=4\cdot1\cdot6=24$.
      3. $D=25-24=1$.

      ### Проверка
      Обратное сложение: $24+1=25$.

      ### Типичная ошибка
      Сумма вместо разности воспроизводит E-eq-wrong-discriminant.
  - params:
      b: 7
      c: 10
    answer: 9
    solution: |
      ### Ответ
      $D=9$.

      ### Идея
      Раздельное вычисление квадрата и произведения защищает от ошибки знака.

      ### Шаги
      1. $a=1$, $b=7$, $c=10$.
      2. $b^2=7^2=49$, $4ac=4\cdot1\cdot10=40$.
      3. $D=49-40=9$.

      ### Проверка
      Обратное сложение: $40+9=49$.

      ### Типичная ошибка
      Сумма вместо разности воспроизводит E-eq-wrong-discriminant.
- id: P-03
  type: set
  role: supported
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T04
  minutes: 1
  prompt: Решите уравнение $({{u|coef}}x{{v|+}})({{w|coef}}x{{z|+}})=0$. Введите множество корней.
  answer:
  - -4
  - 4
  hints:
  - Здесь уже дано произведение, равное нулю.
  - Приравняйте к нулю каждый множитель отдельно.
  - Начните с ${{u|coef}}x{{v|+}}=0$, затем рассмотрите вторую скобку.
  solution: |
    ### Ответ
    Корни $-v/u$ и $-z/w$.

    ### Идея
    Правило нулевого произведения сохраняет оба случая.

    ### Шаги
    1. Решаем $ux+v=0$.
    2. Решаем $wx+z=0$ и объединяем значения.

    ### Проверка
    Каждый корень обнуляет свою скобку.

    ### Типичная ошибка
    E-eq-one-product-root: рассмотрена только первая скобка.
  feedback:
    correct: Оба множителя дали свои корни.
    wrong:
      what: Проверьте обе скобки.
      why: Один из случаев нулевого произведения мог быть пропущен.
      fix: Приравняйте к нулю каждую скобку.
      next: 'T04: нулевое произведение.'
    misconceptions:
    - id: E-eq-one-product-root
      when:
        expr: -v/u
      message: Введено только значение, обнуляющее первую скобку; вторую тоже нужно проверить.
  variants:
  - params:
      u: 1
      v: -4
      w: 1
      z: 4
    answer:
    - -4
    - 4
    solution: |
      ### Ответ
      $\{-4; 4\}$

      ### Идея
      Произведение равно нулю, если нулю равна хотя бы одна скобка.

      ### Шаги
      1. $x-4=0$ даёт $x=4$.
      2. $x+4=0$ даёт $x=-4$.

      ### Проверка
      При $x=4$ первая скобка $4-4=0$; при $x=-4$ вторая $(-4)+4=0$. В обоих случаях произведение равно нулю.

      ### Типичная ошибка
      E-eq-one-product-root: решена только первая скобка.
  - params:
      u: 1
      v: -6
      w: 1
      z: 6
    answer:
    - -6
    - 6
    solution: |
      ### Ответ
      $\{-6; 6\}$

      ### Идея
      Произведение равно нулю, если нулю равна хотя бы одна скобка.

      ### Шаги
      1. $x-6=0$ даёт $x=6$.
      2. $x+6=0$ даёт $x=-6$.

      ### Проверка
      При $x=6$ первая скобка $6-6=0$; при $x=-6$ вторая $(-6)+6=0$. В обоих случаях произведение равно нулю.

      ### Типичная ошибка
      E-eq-one-product-root: решена только первая скобка.
  errors:
  - E-eq-one-product-root
- id: P-04
  type: numbers
  role: supported
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T01
  minutes: 2
  prompt: Приведите $(x+{{k|()}})^2={{u|coef}}x{{v|+}}$ к виду $ax^2+bx+c=0$. Введите a, b, c.
  answer:
    a: 1
    b: -2
    c: 3
  hints:
  - Коэффициенты нельзя читать до раскрытия скобок.
  - Раскройте квадрат суммы и вычтите правую часть целиком.
  - В квадрате $(x+{{k|()}})^2$ найдите удвоенное произведение x и {{k|()}}; затем объедините члены при x.
  solution: |
    ### Ответ
    Коэффициенты после раскрытия: $a=1$, $b=2k-u$, $c=k^2-v$.

    ### Идея
    Стандартный вид получается вычитанием правой части.

    ### Шаги
    1. Раскрываем $(x+k)^2=x^2+2kx+k^2$.
    2. Собираем $x^2+(2k-u)x+(k^2-v)=0$.

    ### Проверка
    Обратное раскрытие возвращает исходную запись.

    ### Типичная ошибка
    Не раскрывайте квадрат по частям: E-eq-quadratic-square-parts.
  feedback:
    correct: 'Верно: удвоенное произведение $2\cdot{{k|()}}\cdot x$ сохранено, а правая часть вычтена целиком.'
    wrong:
      what: Коэффициенты не совпали с приведённой записью.
      why: Возможно, потеряно среднее слагаемое квадрата или знак переноса.
      fix: Раскройте $(x+{{k|()}})^2$ полностью и вычтите ${{u|coef}}x{{v|+}}$ целиком.
      next: 'T01: стандартный вид и проверка раскрытием.'
  variants:
  - params:
      k: 2
      u: 6
      v: 1
    answer:
      a: 1
      b: -2
      c: 3
    solution: |
      ### Ответ
      $a=1$, $b=-2$, $c=3$.

      ### Идея
      Нужно сначала раскрыть квадрат и вычесть правую часть.

      ### Шаги
      1. $(x+2)^2=x^2+4x+4$.
      2. После вычитания $6x+1$ получаем $x^2-2x+3=0$.
      3. Читаем коэффициенты: $a=1$, $b=-2$, $c=3$.

      ### Проверка
      Прибавление вычтенной правой части к $x^2-2x+3$ возвращает $x^2+4x+4$.

      ### Типичная ошибка
      Потеря среднего слагаемого при раскрытии — E-eq-quadratic-square-parts.
  - params:
      k: 3
      u: 4
      v: 10
    answer:
      a: 1
      b: 2
      c: -1
    solution: |
      ### Ответ
      $a=1$, $b=2$, $c=-1$.

      ### Идея
      Нужно сначала раскрыть квадрат и вычесть правую часть.

      ### Шаги
      1. $(x+3)^2=x^2+6x+9$.
      2. После вычитания $4x+10$ получаем $x^2+2x-1=0$.
      3. Читаем коэффициенты: $a=1$, $b=2$, $c=-1$.

      ### Проверка
      Прибавление вычтенной правой части к $x^2+2x-1$ возвращает $x^2+6x+9$.

      ### Типичная ошибка
      Потеря среднего слагаемого при раскрытии — E-eq-quadratic-square-parts.
  fields:
  - id: a
    label: a
  - id: b
    label: b
  - id: c
    label: c
- id: P-05
  type: set
  role: supported
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T02
  minutes: 2
  prompt: Для $x^{2} {{b|+coef}}x{{c|+}}=0$ уже вычислены $D={{d}}$ и $\sqrt D={{sd}}$. Найдите множество корней
    по формуле.
  answer:
  - -3
  - -2
  hints:
  - Для вычисления двух ветвей нужно сохранить знак перед линейным коэффициентом.
  - Подставьте заданный квадратный корень в обе ветви формулы.
  - При $b={{b}}$ запишите числитель с противоположным знаком перед b; значение $\sqrt D$ уже дано.
  solution: |
    ### Ответ
    При $D>0$ два значения $x=(-b\pm\sqrt D)/(2a)$; при $D=0$ одно, при $D<0$ множество пусто.

    ### Идея
    Формула применяется после приведения к стандартному виду при ненулевом a.

    ### Шаги
    1. Выписываем коэффициенты и считаем $D=b^2-4ac$.
    2. Разбираем знак D и выполняем допустимые ветви формулы.

    ### Проверка
    Подстановка каждого найденного числа должна дать ноль.

    ### Типичная ошибка
    Потеря знака в $D$ — E-eq-wrong-discriminant.
  feedback:
    correct: 'Верно: данное число ${{sd}}$ подставлено в обе ветви формулы вместе с противоположным b.'
    wrong:
      what: Множество корней не совпало с уравнением.
      why: Возможна ошибка знака или знаменателя формулы.
      fix: Подставьте $\sqrt D={{sd}}$ в обе ветви $\frac{-b\pm\sqrt D}{2}$ при $b={{b}}$.
      next: Вернитесь к формуле и проверке в T02.
  variants:
  - params:
      b: 5
      c: 6
      d: 1
      sd: 1
    answer:
    - -3
    - -2
    solution: |
      ### Ответ
      $\{-3; -2\}$

      ### Идея
      Выбираем формулу: она учитывает все коэффициенты и не требует подбора.

      ### Шаги
      1. Коэффициенты: $a=1$, $b=5$, $c=6$.
      2. $D=5^2-4\cdot1\cdot6=1$.
      3. $\sqrt{1}=1$, знаменатель $2a=2$.
      4. $x=\frac{-5\pm 1}{2}$, получаем $\{-3; -2\}$.

      ### Проверка
      $1\cdot(-3)^2+5\cdot(-3)+6=0$; $1\cdot(-2)^2+5\cdot(-2)+6=0$

      ### Типичная ошибка
      Нельзя заменить разность суммой (E-eq-wrong-discriminant) или потерять одну ветвь (E-eq-lost-negative).
  - params:
      b: -5
      c: 6
      d: 1
      sd: 1
    answer:
    - 2
    - 3
    solution: |
      ### Ответ
      $\{2; 3\}$

      ### Идея
      Выбираем формулу: она учитывает все коэффициенты и не требует подбора.

      ### Шаги
      1. Коэффициенты: $a=1$, $b=-5$, $c=6$.
      2. $D=(-5)^2-4\cdot1\cdot6=1$.
      3. $\sqrt{1}=1$, знаменатель $2a=2$.
      4. $x=\frac{5\pm 1}{2}$, получаем $\{2; 3\}$.

      ### Проверка
      $1\cdot2^2-5\cdot2+6=0$; $1\cdot3^2-5\cdot3+6=0$

      ### Типичная ошибка
      Нельзя заменить разность суммой (E-eq-wrong-discriminant) или потерять одну ветвь (E-eq-lost-negative).
- id: P-06
  type: set
  role: supported
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T02
  minutes: 2
  prompt: Для ${{a|coef}}x^{2} {{b|+coef}}x{{c|+}}=0$ уже вычислены $D={{d}}$ и $\sqrt D={{sd}}$. Найдите множество
    корней по формуле.
  answer:
  - -3/2
  - 1
  hints:
  - У неприведённого уравнения знаменатель зависит от старшего коэффициента.
  - Сначала вычислите знаменатель 2a, затем подставьте заданный квадратный корень.
  - Для $a={{a}}$, $b={{b}}$ определите отдельно 2a и противоположное b; только потом сложите числители ветвей.
  solution: |
    ### Ответ
    При $D>0$ два значения $x=(-b\pm\sqrt D)/(2a)$; при $D=0$ одно, при $D<0$ множество пусто.

    ### Идея
    Формула применяется после приведения к стандартному виду при ненулевом a.

    ### Шаги
    1. Выписываем коэффициенты и считаем $D=b^2-4ac$.
    2. Разбираем знак D и выполняем допустимые ветви формулы.

    ### Проверка
    Подстановка каждого найденного числа должна дать ноль.

    ### Типичная ошибка
    Потеря знака в $D$ — E-eq-wrong-discriminant.
  feedback:
    correct: 'Верно: знаменатель $2a=2\cdot{{a|()}}$ учтён в обеих ветвях, а дроби сокращены.'
    wrong:
      what: Множество корней не совпало с уравнением.
      why: Возможна ошибка знака или знаменателя формулы.
      fix: Знаменатель равен $2\cdot{{a|()}}$; подставьте ${{sd}}$ в обе ветви и сократите дроби.
      next: Вернитесь к формуле и проверке в T02.
  variants:
  - params:
      a: 2
      b: 1
      c: -3
      d: 25
      sd: 5
    answer:
    - -3/2
    - 1
    solution: |
      ### Ответ
      $\{\frac{-3}{2}; 1\}$

      ### Идея
      Выбираем формулу: она учитывает все коэффициенты и не требует подбора.

      ### Шаги
      1. Коэффициенты: $a=2$, $b=1$, $c=-3$.
      2. $D=1^2-4\cdot2\cdot(-3)=25$.
      3. $\sqrt{25}=5$, знаменатель $2a=4$.
      4. $x=\frac{-1\pm 5}{4}$, получаем $\{\frac{-3}{2}; 1\}$.

      ### Проверка
      $2\cdot(-\frac{3}{2})^2+1\cdot(-\frac{3}{2})-3=0$; $2\cdot1^2+1\cdot1-3=0$

      ### Типичная ошибка
      Нельзя заменить разность суммой (E-eq-wrong-discriminant) или потерять одну ветвь (E-eq-lost-negative).
  - params:
      a: 3
      b: 4
      c: 1
      d: 4
      sd: 2
    answer:
    - -1
    - -1/3
    solution: |
      ### Ответ
      $\{-1; \frac{-1}{3}\}$

      ### Идея
      Выбираем формулу: она учитывает все коэффициенты и не требует подбора.

      ### Шаги
      1. Коэффициенты: $a=3$, $b=4$, $c=1$.
      2. $D=4^2-4\cdot3\cdot1=4$.
      3. $\sqrt{4}=2$, знаменатель $2a=6$.
      4. $x=\frac{-4\pm 2}{6}$, получаем $\{-1; \frac{-1}{3}\}$.

      ### Проверка
      $3\cdot(-1)^2+4\cdot(-1)+1=0$; $3\cdot(-\frac{1}{3})^2+4\cdot(-\frac{1}{3})+1=0$

      ### Типичная ошибка
      Нельзя заменить разность суммой (E-eq-wrong-discriminant) или потерять одну ветвь (E-eq-lost-negative).
- id: P-07
  type: number
  role: supported
  purpose: procedure
  level: 1
  outcome: LO-02
  sections:
  - T03
  minutes: 1
  prompt: Найдите дискриминант ${{a|coef}}x^{2} {{b|+coef}}x{{c|+}}=0$. Введите число.
  answer: 25
  hints:
  - Свободный член входит в произведение вместе со знаком.
  - Вычислите квадрат b и произведение 4ac отдельно.
  - Начните с $4\cdot{{a|()}}\cdot{{c|()}}$, затем вычтите это произведение из квадрата {{b|()}}.
  solution: |
    ### Ответ
    $D=b^2-4ac$.

    ### Идея
    Раздельное вычисление защищает знак c.

    ### Шаги
    1. Считаем квадрат b.
    2. Вычитаем произведение 4ac.

    ### Проверка
    Обратное сложение возвращает квадрат b.

    ### Типичная ошибка
    E-eq-wrong-discriminant: минус между частями потерян.
  feedback:
    correct: 'Верно: произведение $4\cdot{{a|()}}\cdot{{c|()}}$ вычтено из квадрата ${{b|()}}$ вместе со знаками.'
    wrong:
      what: Полученное значение дискриминанта не совпало.
