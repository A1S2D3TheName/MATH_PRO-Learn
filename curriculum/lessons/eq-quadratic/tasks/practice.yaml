  - T06
  minutes: 4
  prompt: Сумма двух различных действительных чисел {{p}}, произведение {{q}}. Найдите множество этих чисел.
  answer:
  - 5
  - 8
  hints:
  - Сумма позволяет выразить второе число через первое.
  - Обозначьте первое число x, затем используйте произведение.
  - Начните с $x({{p}}-x)={{q}}$; раскройте скобки и перенесите всё в одну часть.
  solution: |
    ### Ответ
    Искомые числа — корни $x^2-px+q=0$.

    ### Идея
    Используем два соотношения условия, не правило о готовых корнях.

    ### Шаги
    1. Выражаем второе число как $p-x$.
    2. Из $x(p-x)=q$ получаем квадратное уравнение и решаем его.

    ### Проверка
    Проверяем отдельно сумму и произведение.

    ### Типичная ошибка
    E-eq-lost-negative: введено только одно число.
  feedback:
    correct: Найденные числа дают указанную сумму и произведение.
    wrong:
      what: Пара чисел не удовлетворяет двум соотношениям.
      why: Возможно, неверно выражено второе число или знак при раскрытии произведения.
      fix: Запишите второе число как сумму минус первое и составьте произведение.
      next: Проверьте и сложение, и умножение; T06, пример с двумя числами.
