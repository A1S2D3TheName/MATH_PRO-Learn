- id: P-12
  type: numbers
  role: independent
  purpose: meaning
  level: 2
  outcome: LO-01
  sections:
  - T01
  minutes: 2
  prompt: Для $(x+{{k}})^2={{q|coef}}x^{2} {{u|+coef}}x{{v|+}}$ найдите a, b, c в приведённой записи $ax^2+bx+c=0$
    и определите, квадратное ли уравнение. Введите коэффициенты и 1 для квадратного, 0 для неквадратного.
  answer:
    a: 0
    b: 1
    c: -4
    quadratic: 0
  hints:
  - Наличие $x^2$ в исходной записи ещё не определяет степень после сокращения.
  - Раскройте квадрат, вычтите правую часть и только затем назовите коэффициенты.
  - 'После раскрытия $(x+{{k}})^2$ при $x^2$ слева стоит 1, справа ${{q}}$: сравните их. Затем найдите удвоенное
    произведение $2\cdot{{k}}\cdot x$ и перенесите ${{u|coef}}x{{v|+}}$ влево.'
  solution: |
    ### Ответ
    Коэффициенты $a=1-q$, $b=2k-u$, $c=k^2-v$. Уравнение квадратное тогда и только тогда, когда $a\ne0$.

    ### Идея
    Сначала приводим обе части, затем определяем степень по старшему коэффициенту.

    ### Шаги
    1. Раскрываем $(x+k)^2=x^2+2kx+k^2$.
    2. Вычитаем правую часть: $(1-q)x^2+(2k-u)x+(k^2-v)=0$.
    3. Читаем три коэффициента и проверяем, не уничтожился ли член $x^2$.

