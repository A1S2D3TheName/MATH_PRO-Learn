  - Для коэффициентов 2, −3, −2 начните с дискриминанта; затем спросите, какой шаг использует именно его значение.
  solution: |
    ### Ответ

    s1 → s2 → s3 → s4 → s5.

    ### Идея

    Формула корней работает по цепочке: $D$, затем $\sqrt D$, затем подстановка, корни и проверка.

    ### Шаги

    1. Дискриминант: $D=9+16=25$.
    2. Корень: $\sqrt{25}=5$.
    3. Формула: $x=\dfrac{3\pm5}{4}$.
    4. Корни: $x_1=2$, $x_2=-\dfrac12$.
    5. Проверка подстановкой: $8-6-2=0$ и $\dfrac12+\dfrac32-2=0$.

    ### Проверка

    Порядок согласован с примером 2 раздела T02: каждый шаг использует результат предыдущего.

    ### Типичная ошибка

    E-eq-wrong-discriminant: неверный расчёт D разрушит всю цепочку. Извлечь корень, не вычислив $D$: $\sqrt D$ берут из конкретного числа, а не «на глаз».
  feedback:
    correct: 'Верно: цепочка шагов выстроена в правильном порядке.'
    wrong:
      what: Порядок шагов нарушен.
      why: Корень извлекают до вычисления дискриминанта или проверку ставят раньше корней.
      fix: 'Цепочка: $D\to\sqrt D\to$ формула $\to$ корни $\to$ проверка.'
      next: Раздел T02, пример 2 — то же уравнение, решённое по шагам.
- id: P-22
  type: set
  role: challenge
  optional: true
  purpose: method
  level: 5
  outcome: LO-03
  sections:
  - T03
  - T06
  minutes: 5
  prompt: При каких целых значениях $k$ уравнение $x^2+kx+k=0$ имеет целочисленные корни? Введите множество всех
    таких значений.
  answer:
  - 0
  - 4
  hints:
  - Целые корни возможны только когда $D=k^2-4k$ — точный квадрат.
  - 'Выделите квадрат: $D=(k-2)^2-4$; обозначьте $\sqrt D=m$ и приравняйте к $m^2$.'
  - 'Разложите разность квадратов: $(k-2-m)(k-2+m)=4$; оба множителя одной чётности.'
  solution: |
    ### Ответ

    $\{0; 4\}$.

    ### Идея

    Целочисленность корней требует, чтобы $D=k^2-4k=(k-2)^2-4$ было точным квадратом целого числа $m$.

    ### Шаги

    1. Записываем $(k-2)^2-m^2=4$, где $m=\sqrt D\ge0$.
    2. Раскладываем разность квадратов: $(k-2-m)(k-2+m)=4$.
    3. Множители одной чётности (их сумма $2(k-2)$ чётна), а их произведение $4$, поэтому оба чётные: подходят только пары $(2,2)$ и $(-2,-2)$.
    4. Из пары $(2,2)$: $k-2=2$, $m=0$, значит $k=4$; из пары $(-2,-2)$: $k-2=-2$, $m=0$, значит $k=0$.

    ### Проверка

    $k=0$: уравнение $x^2=0$, корень $0$ — целый. $k=4$: $x^2+4x+4=0$, то есть $(x+2)^2=0$, корень $-2$ — целый. Других пар множителей той же чётности с произведением $4$ нет, поэтому значений $k$ ровно два.

    ### Типичная ошибка

    E-eq-lost-negative: после сведения к $(k-2)^2=4$ нельзя оставить лишь $k-2=2$; отрицательная ветвь тоже нужна. Полноту сначала доказывают через пары множителей, а не перебором наугад.
  feedback:
    correct: Найдены все значения k. Машина проверяет множество; полноту рассуждения сверяют с разбором.
    wrong:
      what: Множество значений $k$ неполное или лишнее.
      why: Потерян случай $m=0$ или не учтена одинаковая чётность множителей.
      fix: Разложите разность квадратов и рассмотрите пары множителей произведения одинаковой чётности.
      next: Раздел T03 — дискриминант и число действительных корней.
