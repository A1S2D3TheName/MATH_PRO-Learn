      ### Шаги
      1. Пусть первое число x, второе $-x$.
      2. $x\cdot(-x)=-9$, то есть $x^2-9=0$.
      3. Уравнение неполное: $x^2=9$, корни $\{-3; 3\}$.

      ### Проверка
      $(-3)+3=0$, $(-3)\cdot3=-9$. Отрицательные числа допустимы: задачи о размерах здесь нет.

