  solution: |
    ### Ответ
    Допустимые моменты — корни $5t^2-v_0t+h=0$ при $t\ge0$.

    ### Идея
    Уравнение записывает заданную высоту.

    ### Шаги
    1. Приравниваем высоту к h.
    2. Решаем полученное квадратное уравнение и проверяем время.

    ### Проверка
