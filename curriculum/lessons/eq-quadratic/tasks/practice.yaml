  prompt: Мяч бросили вертикально вверх с земли со скоростью {{v0}} м/с. В идеализированной модели ($g=10$ м/с²,
    без сопротивления воздуха) через $t$ с после броска мяч находится на высоте ${{v0}}t-5t^2$ м; время рассматриваем
    от броска до приземления. В какие моменты (с) высота равна {{h}} м? Введите множество моментов.
  answer:
  - 1
  - 4
  hints:
  - Искомая высота задаёт равенство относительно времени.
  - Приравняйте модель высоты к заданной высоте и приведите запись к нулю.
