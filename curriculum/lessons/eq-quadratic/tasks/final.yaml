title: 'Размеры прямоугольной зоны: уравнение, корни, ограничения'
context_id: rectangular-zone
scenario: Площадь прямоугольной зоны известна, длина больше ширины. На каждом шаге используется один и тот же выбранный
  набор данных; размер должен быть положительным.
tasks:
- id: F-01
  type: numbers
  role: final-step
  purpose: transfer
  level: 2
  outcome: LO-01
  sections:
  - T01
  minutes: 2
  prompt: Площадь зоны {{s}} м², длина на {{d}} м больше ширины x. Составьте уравнение площади и введите все коэффициенты
    a, b, c после переноса в левую часть.
  answer:
    a: 1
    b: 4
    c: -77
  hints:
  - Переведите два соотношения про стороны в одно равенство.
  - Выразите длину через ширину и используйте произведение сторон.
  - Для площади {{s}} и разницы {{d}} начните с $x(x+{{d}})={{s}}$, затем раскройте скобки.
  solution: |
    ### Ответ
    $a=1$, $b=d$, $c=-s$.

    ### Идея
    Площадь равна произведению сторон.

    ### Шаги
    1. Составляем $x(x+d)=s$.
    2. Раскрываем и переносим s влево.

    ### Проверка
    Обратное раскрытие возвращает площадь.

    ### Типичная ошибка
    Перенести площадь без смены знака и записать $c=s$ вместо $c=-s$; обратное раскрытие это показывает.
  feedback:
    correct: 'Верно: уравнение площади $x(x+{{d}})={{s}}$ приведено к нулю, и площадь стала свободным членом со
      знаком минус.'
    wrong:
      what: Коэффициенты не совпали с уравнением площади.
      why: Возможно, стороны сложены вместо умножения или площадь перенесена без смены знака.
      fix: Запишите $x(x+{{d}})={{s}}$, раскройте скобки и вычтите {{s}} из обеих частей.
      next: 'T01, пример 1: уравнение площади и стандартный вид.'
  variants:
  - params:
      s: 77
      d: 4
    answer:
      a: 1
      b: 4
      c: -77
    solution: |
      ### Ответ
      $a=1$, $b=4$, $c=-77$.

      ### Идея
      Произведение сторон задаёт модель.

      ### Шаги
      1. $x(x+4)=77$.
      2. После раскрытия и переноса $x^2+4x-77=0$.

      ### Проверка
      Прибавляем площадь обратно: $x^2+4x-77+77=x^2+4x=x(x+4)$, то есть снова $x(x+4)=77$.

      ### Типичная ошибка
      Записать $c=77$ вместо $c=-77$: при переносе площади из правой части в левую знак меняется.
