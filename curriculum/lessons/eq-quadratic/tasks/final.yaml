- id: F-02
  type: number
  role: final-step
  purpose: procedure
  level: 1
  outcome: LO-02
  sections:
  - T03
  minutes: 1
  prompt: Для той же зоны {{s}} м² с разницей сторон {{d}} м вычислите дискриминант уравнения из первого шага.
  answer: 324
  hints:
  - Используйте найденные коэффициенты, а не новый набор.
  - Свободный член отрицателен; учтите его знак в произведении.
  - Подставьте $b={{d}}$, $c=-{{s}}$ в разность квадрата b и произведения 4ac.
  solution: |
    ### Ответ
    $D=d^2+4s$.

    ### Идея
    Отрицательный c даёт положительное слагаемое после вычитания.

    ### Шаги
    1. Берём коэффициенты F-01.
    2. Вычисляем D.

    ### Проверка
    D вместе с 4ac возвращает квадрат b.

    ### Типичная ошибка
    E-eq-wrong-discriminant: ошибка знака c.
  feedback:
    correct: 'Верно: для зоны {{s}} м² отрицательный свободный член превратил вычитание $4ac$ в прибавление $4\cdot{{s}}$.'
    wrong:
      what: Полученное значение дискриминанта не совпало.
      why: Квадрат b или произведение 4ac могли быть вычислены со знаком ошибки.
      fix: 'Подставьте $b={{d}}$ и $c=-{{s}}$: $4ac=-4\cdot{{s}}$, а вычитание отрицательного числа даёт плюс.'
      next: 'T03: знак дискриминанта и его смысл.'
  variants:
  - params:
      s: 77
      d: 4
    answer: 324
    solution: |
      ### Ответ
      $D=324$.

      ### Идея
      Раздельное вычисление квадрата и произведения защищает от ошибки знака.

      ### Шаги
      1. $a=1$, $b=4$, $c=-77$.
      2. $b^2=4^2=16$, $4ac=4\cdot1\cdot(-77)=-308$.
      3. $D=16-(-308)=324$.

      ### Проверка
      Обратное сложение: $(-308)+324=16$.

      ### Типичная ошибка
      Сумма вместо разности воспроизводит E-eq-wrong-discriminant.
