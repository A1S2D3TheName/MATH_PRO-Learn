  minutes: 1
  prompt: Из корней, найденных на третьем шаге, выберите допустимую ширину и вычислите длину зоны. Площадь {{s}}
    м², разница сторон {{d}} м. Введите оба положительных размера.
  answer:
    width: 7
    length: 11
  hints:
  - Размер должен удовлетворять ограничениям модели.
  - Выберите положительный корень; длина больше ширины на указанную величину.
  - Для разницы {{d}} прибавьте её к выбранной ширине и проверьте произведение сторон с площадью {{s}}.
  solution: |
    ### Ответ
    Ширина — положительный корень, длина больше на d.

    ### Идея
    Площадь равна произведению положительных сторон.

    ### Шаги
    1. Составляем $x(x+d)=s$, то есть $x^2+dx-s=0$.
    2. Решаем уравнение и отбираем корень по $x>0$.

    ### Проверка
    Произведение сторон должно быть s, разность — d.

    ### Типичная ошибка
    E-eq-lost-negative: неполное решение уравнения без объяснения отбора.
  feedback:
    correct: 'Верно: из корней предыдущего шага взята положительная ширина, и произведение сторон дало {{s}} м².'
