      2. $D=2^2-4\cdot1\cdot(-\frac{21}{4})=25$.
      3. $\sqrt{25}=5$, знаменатель $2a=2$.
      4. $x=\frac{-2\pm 5}{2}$, получаем $\{\frac{-7}{2}; \frac{3}{2}\}$.

      ### Проверка
