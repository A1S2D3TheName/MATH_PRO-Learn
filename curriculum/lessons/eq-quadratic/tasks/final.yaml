- id: F-03
  type: set
  role: final-step
  purpose: procedure
  level: 2
  outcome: LO-01
  sections:
  - T02
  minutes: 2
  prompt: Решите уравнение зоны $x^2+{{d}}x-{{s}}=0$, используя дискриминант из второго шага. Введите оба математических
    корня.
  answer:
  - -11
  - 7
  hints:
  - Здесь пока нужны корни уравнения, не только допустимая ширина.
  - Используйте дискриминант предыдущего шага и обе ветви формулы.
  - Для $x^2+{{d}}x-{{s}}=0$ сначала найдите квадратный корень из уже вычисленного D; затем подставьте противоположное
    b.
  solution: |
    ### Ответ
    При $D>0$ два значения $x=(-b\pm\sqrt D)/(2a)$; при $D=0$ одно, при $D<0$ множество пусто.

    ### Идея
    Формула применяется после приведения к стандартному виду при ненулевом a.

    ### Шаги
    1. Выписываем коэффициенты и считаем $D=b^2-4ac$.
    2. Разбираем знак D и выполняем допустимые ветви формулы.

    ### Проверка
    Подстановка каждого найденного числа должна дать ноль.

    ### Типичная ошибка
    Потеря знака в $D$ — E-eq-wrong-discriminant.
  feedback:
    correct: 'Верно: найдены оба корня уравнения зоны, включая отрицательный; отбор размера — на следующем шаге.'
    wrong:
      what: Множество корней не совпало с уравнением.
      why: 'Возможно, потерян отрицательный корень: на этом шаге нужны оба корня уравнения.'
      fix: Возьмите D из второго шага, извлеките корень и подставьте в обе ветви при $b={{d}}$.
      next: Вернитесь к формуле и проверке в T02.
  variants:
  - params:
      s: 77
      d: 4
    answer:
    - -11
    - 7
    solution: |
      ### Ответ
      $\{-11; 7\}$

      ### Идея
      Выбираем формулу: она учитывает все коэффициенты и не требует подбора.

      ### Шаги
      1. Коэффициенты: $a=1$, $b=4$, $c=-77$.
      2. $D=4^2-4\cdot1\cdot(-77)=324$.
      3. $\sqrt{324}=18$, знаменатель $2a=2$.
      4. $x=\frac{-4\pm 18}{2}$, получаем $\{-11; 7\}$.

      ### Проверка
      $1\cdot(-11)^2+4\cdot(-11)-77=0$; $1\cdot7^2+4\cdot7-77=0$

      ### Типичная ошибка
      Нельзя заменить разность суммой (E-eq-wrong-discriminant) или потерять одну ветвь (E-eq-lost-negative).
