      2. $D=5^2-4\cdot1\cdot(-126)=529$.
      3. $\sqrt{529}=23$, знаменатель $2a=2$.
      4. $x=\frac{-5\pm 23}{2}$, получаем $\{-14; 9\}$.

      ### Проверка
      $1\cdot(-14)^2+5\cdot(-14)-126=0$; $1\cdot9^2+5\cdot9-126=0$

      ### Типичная ошибка
      Нельзя заменить разность суммой (E-eq-wrong-discriminant) или потерять одну ветвь (E-eq-lost-negative).
