id: eq-quadratic
title: Квадратное уравнение и дискриминант
section: eq
stage: 4
hours: 4
grade: '8'
prerequisites:
- alg-factor
- alg-sqrt
scope: 'Формула корней опирается на квадратный корень: без alg-sqrt тема не имеет смысла (исправление системной
  ошибки pr17, № 19).'
version: 1.2.0
summary: Решает квадратные уравнения через выделение квадрата и формулу, связывает знак дискриминанта с числом различных
  действительных корней, распознаёт неполные и вырожденные случаи; в deep исследует параметры и ограничения моделей.
search:
  synonyms:
  - квадратное уравнение
  - формула корней
  - дискриминант
  - D квадратного уравнения
  - неполное квадратное уравнение
  - приведённое квадратное уравнение
  - неприведённое квадратное уравнение
  - выделение полного квадрата
  - число корней
  - как найти корни квадратного уравнения
  questions:
  - Как решить квадратное уравнение?
  - Что такое дискриминант?
  - Почему у квадратного уравнения бывает два корня?
  - Когда квадратное уравнение не имеет действительных корней?
  - Как решить неполное квадратное уравнение?
  - Чем приведённое уравнение отличается от неприведённого?
  - Как проверить корни квадратного уравнения?
  - Зачем выделять полный квадрат?
