outcomes:
- id: LO-01
  short: Решает квадратное уравнение
  action: решает приведённые и неприведённые квадратные уравнения и проверяет найденные корни
  conditions: действительные коэффициенты со старшим ненулевым; точные целые, дробные и иррациональные корни
  criterion: не менее 4 верных решений из 5, включая выбор способа и проверку подстановкой
  level: core
  sections:
  - T01
  - T02
  - T03
  - T04
  - T05
  - T06
- id: LO-02
  short: Использует дискриминант
  action: вычисляет дискриминант, определяет число различных действительных корней и распознаёт неполный случай
  conditions: целые коэффициенты, старший ненулевой; вырожденный случай явно отделяется до вычисления D
  criterion: не менее 4 верных ответов из 5, включая объяснение смысла знака D
  level: standard
  sections:
  - T03
  - T04
  - T06
- id: LO-03
  short: Моделирует и исследует смешанные случаи
  action: составляет уравнение из соотношений и исследует влияние параметра на число допустимых корней
  conditions: даны модели площади, высоты или суммы и произведения; в параметрических задачах указан диапазон или
    область параметра
  criterion: разбирает нулевую и ненулевую ветви, обосновывает отбор корней и проверяет ответ по исходным условиям
  level: deep
  sections:
  - T01
  - T02
  - T03
  - T06
