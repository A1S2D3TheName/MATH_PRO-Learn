# Поля программы дословно перенесены из tree.yaml; оценка и границы задачи в outcomes.
id: num-mult-column
title: Письменное умножение многозначных чисел
section: num
stage: 1
hours: 4
grade: "3–4"
prerequisites: [num-mult-table, num-place-large]
version: "1.0.0"
summary: >
  Разбивает множитель по разрядам, находит и выравнивает неполные произведения,
  умножает многозначные натуральные числа столбиком, в том числе при нулях в записи.
  Проверяет порядок результата прикидкой и последнюю цифру табличным произведением.
search:
  synonyms:
    - умножение в столбик
    - письменное умножение чисел
    - многозначное умножение
    - умножение с переносом разряда
    - неполное произведение
    - как умножить двузначные числа
    - сдвиг строки при умножении
    - умножение трёхзначного на двузначное
    - умножение на круглое число
    - умножение чисел с нулями
    - проверка умножения прикидкой
    - письменное умножение на сотни
  questions:
    - Почему при умножении столбиком вторую строку сдвигают влево?
    - Как умножить трёхзначное число на двузначное?
    - Что обозначает неполное произведение в записи столбиком?
    - Как переносить десятки при умножении на однозначное число?
    - Куда записать ноль, если в множителе нет десятков?
    - Как умножить число на двадцать или триста?
    - Как быстро заметить потерянный разряд в произведении?
    - Как оценить число цифр произведения без точного счёта?
    - Чем проверить произведение двух многозначных чисел?
subtopics:
  - id: num-mult-column/partial-shift
    title: Неполные произведения и их сдвиг
    tree_ref: Неполные произведения и их сдвиг
    synonyms: [произведение разрядных частей, строка десятков]
    sections: [T01, T02, T05]
  - id: num-mult-column/algorithm
    title: Алгоритм умножения в столбик
    tree_ref: Алгоритм умножения в столбик
    synonyms: [запись по разрядам, перенос при умножении]
    sections: [T02]
  - id: num-mult-column/zeroes
    title: Умножение на числа с нулями
    tree_ref: Умножение на числа с нулями
    synonyms: [ноль посередине множителя, умножение на десятки]
    sections: [T03]
  - id: num-mult-column/estimate
    title: Оценка порядка результата
    tree_ref: Оценка порядка результата
    synonyms: [прикидка произведения, правдоподобие ответа]
    sections: [T04]
outcomes:
  - id: LO-01
    short: Умножает и оценивает произведение
    action: вычисляет произведение столбиком, объясняет значение и сдвиг строк, проверяет результат прикидкой
    conditions: неотрицательные целые множители до четырёх и трёх разрядов, включая нули; результат целый
    criterion: верно получает и располагает неполные произведения, находит итог и обнаруживает ошибку порядка величины
    level: core
    sections: [T01, T02, T03, T04]
  - id: LO-02
    short: Разбирает ошибки в записи
    action: проверяет строки и переносы, обнаруживает ошибочный или пропущенный разряд и восстанавливает запись другим способом
    conditions: неотрицательные целые множители до четырёх и трёх разрядов, включая нули; дан черновик, пропуск строки/цифры или запрос на независимый пересчёт
    criterion: верно восстанавливает строку, цифру или итог и подтверждает результат независимым пересчётом
    level: deep
    sections: [T02, T03, T04, T05]
errors:
  - E-num-mult-column-no-shift
  - E-num-mult-column-carry
  - E-num-mult-column-zero-place
