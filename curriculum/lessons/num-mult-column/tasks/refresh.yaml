  prompt: В ${{a}}\cdot{{b}}$ насчитали {{w}} без сдвига десятков. Какое число получается после исправления?
  answer: 3536
  hints:
  - Сумма с цифрой десятков без её разряда меньше верной.
  - Замените вторую строку произведением на десятки.
  - Для {{a}} и {{b}} найдите правильную строку от десятков и прибавьте строку единиц.
  solution: |
    ### Ответ
    3536

    ### Идея
    Сначала найдём верный расчёт; в черновике 476, потому что цифра десятков второго множителя использована как единицы. Назовите неверную строку перед исправлением числа.

    ### Шаги
    1. Разбиваем 52 на разрядные группы: 50 и 2.
    2. Для группы 2: $68\cdot2=136$.
    3. Для группы 50: $68\cdot50=3400$.
    4. Складываем неполные произведения: $136+3400=3536$.

    ### Проверка
    Независимое разбиение первого множителя: $60\cdot52=3120$ и $8\cdot52=416$; $3120+416=3536$.

    ### Типичная ошибка
    Цифра десятков второго множителя использована как единицы: черновик 476 расходится с разрядным счётом.
