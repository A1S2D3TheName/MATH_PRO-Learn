  prompt: В расчёте ${{a}}\cdot{{b}}$ назовите значение строки от **десятков** второго множителя.
  answer: 2680
  hints:
  - Вторую цифру множителя нужно читать с её позицией.
  - Выделите десятки числа {{b}}, не трогая единицы.
  - Начните умножать {{a}} на десятки из {{b}}, оставив место для нуля.
  solution: |
    ### Ответ
    2680

    ### Идея
    Цифра 4 в множителе 43 означает 40 групп, а не 4 группы.

    ### Шаги
    1. Выделяем разряд 10: в 43 это 40 групп.
    2. Строка: $67\cdot40=2680$.

    ### Проверка
    2680 — это 268 десятков, а $67\cdot4=268$: строка действительно считает 4 десятка групп.

    ### Типичная ошибка
    Записать $67\cdot4=268$ без нуля: строка 268 вместо 2680 потеряет разряд десятков.
