- id: R-02
  type: number
  role: refresh
  purpose: procedure
  level: 2
  outcome: LO-01
  sections:
  - T02
  minutes: 3
  prompt: По заказу ${{a}}\cdot{{b}}$ посчитайте число деталей без готового столбика.
  answer: 2294
  hints:
  - Найдите сначала разряд единиц второго множителя.
  - Запишите две строки с разными начальными разрядами.
  - Для {{a}} и {{b}} начните со строки единиц, затем допишите нуль к строке десятков.
  solution: |
    ### Ответ
    2294

    ### Идея
    Записываем разрядные строки вместо механического умножения видимых цифр.

    ### Шаги
    1. Разбиваем 37 на разрядные группы: 30 и 7.
    2. Для группы 7: $62\cdot7=434$.
    3. Для группы 30: $62\cdot30=1860$.
    4. Складываем неполные произведения: $434+1860=2294$.

    ### Проверка
    Независимое разбиение первого множителя: $60\cdot37=2220$ и $2\cdot37=74$; $2220+74=2294$.

    ### Типичная ошибка
    Сложить строки без сдвига: $62\cdot7+62\cdot3=620$ вместо 2294.
