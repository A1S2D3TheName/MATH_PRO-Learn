  minutes: 3
  prompt: В независимой ревизии умножьте ${{a}}\cdot{{b}}$, сохраняя нулевой разряд.
  answer: 21112
  hints:
  - У числа {{b}} есть сотни и единицы.
  - Десятки можно не считать, но их место удерживает сотни.
  - Запишите отдельно {{a}} на сотни и {{a}} на единицы числа {{b}}.
  solution: |
    ### Ответ
    21112

    ### Идея
    Нуль внутри числа не удаляет место для сотен; нулевую строку не пишем.

    ### Шаги
    1. Разбиваем 406 на разрядные группы: 400 и 6.
    2. Для группы 6: $52\cdot6=312$.
    3. Для группы 400: $52\cdot400=20800$.
    4. Складываем неполные произведения: $312+20800=21112$.

    ### Проверка
    Независимое разбиение первого множителя: $50\cdot406=20300$ и $2\cdot406=812$; $20300+812=21112$.

    ### Типичная ошибка
    Стереть нуль из 406 и посчитать $52\cdot46=2392$ вместо 21112: сотни станут десятками.
