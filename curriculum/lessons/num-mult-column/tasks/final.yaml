  prompt: В учебном заказе {{b|pl:лист,листа,листов}}, на каждом {{a|pl:метка,метки,меток}}. Сколько меток даёт неполное произведение
    от единиц числа листов?
  answer: 224
  hints:
  - Посмотрите на последнюю цифру числа листов.
  - Первая строка считает лишь листы из разряда единиц.
  - Умножьте {{a}} на единицы числа {{b}}; к десяткам переходите после этой строки.
  solution: |
    ### Ответ
    224

    ### Идея
    Цифра 4 в конце множителя 24 означает 4 листа.

    ### Шаги
    1. Выделяем разряд единиц: в 24 это 4 листа.
    2. Строка: $56\cdot4=224$.

    ### Проверка
    Разбиение первого множителя: $50\cdot4=200$ и $6\cdot4=24$; $200+24=224$.

    ### Типичная ошибка
    Взять в эту строку и десятки листов: $56\cdot24$ — это уже весь заказ, а не строка единиц.
