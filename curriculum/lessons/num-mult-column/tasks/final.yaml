  prompt: 'В акте вторая строка этого заказа записана как {{wrow}}: её не сдвинули. Сколько меток на самом деле даёт строка
    от десятков числа {{b}}?'
  answer: 1120
  hints:
  - Цифра десятков числа листов означает десятки листов, а не листы.
  - Верная строка десятков оканчивается нулём.
  - Умножьте {{a}} на число десятков в {{b}} и запишите результат в десятках.
  solution: |
    ### Ответ
    1120

    ### Идея
    Запись 112 — это $56\cdot2$ без сдвига; строка должна считать десятки листов.

    ### Шаги
    1. В числе 24 цифра 2 — это 2 десятка листов.
    2. $56\cdot2=112$ — столько десятков меток: $56\cdot20=1120$.
    3. Запись 112 в акте — та же строка без нуля справа.

    ### Проверка
    Разбиение первого множителя: $50\cdot20=1000$ и $6\cdot20=120$; $1000+120=1120$.

    ### Типичная ошибка
    Оставить 112: без нуля строка считает 2 листа, а не 2 десятка листов.
  feedback:
    correct: 'Строка десятков восстановлена: запись акта получила свой разряд.'
    wrong:
      what: Исправленная строка десятков не совпала.
      why: Вероятно, оставлена запись акта {{wrow}} без нуля справа.
      fix: Умножьте {{a}} на цифру десятков числа {{b}} и запишите результат в десятках.
