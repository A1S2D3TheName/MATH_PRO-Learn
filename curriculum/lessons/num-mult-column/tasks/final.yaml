  prompt: К первому заказу добавили ещё {{c|pl:лист,листа,листов}} по {{a|pl:метка,метки,меток}}. Сколько меток нужно на весь
    заказ? Используйте итог F-03.
  answer: 1736
  hints:
  - Новые листы — отдельная группа; метки на них считают так же.
  - Найдите метки на добавленных листах и прибавьте их к итогу F-03.
  - Умножьте {{a}} на {{c}} и прибавьте к своему результату F-03.
  solution: |
    ### Ответ
    1736

    ### Идея
    Добавленные листы — ещё одна стопка; её метки прибавляем к итогу первого заказа.

    ### Шаги
    1. Итог первого заказа из F-03: 1344.
    2. Добавленные листы: $56\cdot7=392$.
    3. Весь заказ: $1344+392=1736$.

    ### Проверка
    Другим порядком: всего листов $24+7=31$; $56\cdot31=1736$.

    ### Типичная ошибка
    Прибавить к итогу число листов, а не метки на них: $1344+7=1351$.
