- id: P-04
  type: number
  role: supported
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T02
  minutes: 2
  prompt: 'Найдите ${{a}}\cdot{{b}}$ столбиком: учитывайте десятки от умножения единиц. В черновике без переноса было {{w}}.'
  answer: 108
  hints:
  - Сначала умножьте единицы первого множителя на {{b}}.
  - При двузначном результате перенесите десятки.
  - Для {{a}} запишите единицы первого шага отдельно, перенос поставьте над разрядом десятков.
  solution: |
    ### Ответ
    108

    ### Идея
    Переносите полные десятки из одной колонки в следующую, не теряя их при записи цифр.

    ### Шаги
    1. Разряд единиц: $7\cdot4=28$; пишем 8; переносим 2 в следующую колонку.
    2. Разряд десятков: $2\cdot4+2=10$; пишем 0; переносим 1 в следующую колонку.
    3. Оставшийся старший перенос 1 ставим слева; выходит 108.

    ### Проверка
    Независимое разбиение первого множителя: $20\cdot4=80$ и $7\cdot4=28$; $80+28=108$.

    ### Типичная ошибка
    Десятки из умножения единиц не перенесены: черновик 88 расходится с разрядным счётом.
  feedback:
    correct: В столбике для {{a}} перенесён разряд после умножения на {{b}}.
    wrong:
      what: Однострочное произведение не совпало.
      why: Скорее всего, десятки переноса не добавлены.
      fix: Разложите произведение единиц на десятки и единицы.
      next: Вернитесь к обмену фишек в T02.
    misconceptions:
    - id: E-num-mult-column-carry
      when:
