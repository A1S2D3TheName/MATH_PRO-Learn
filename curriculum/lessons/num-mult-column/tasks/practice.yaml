- id: P-05
  type: number
  role: supported
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T01
  - T02
  minutes: 2
  prompt: Вычислите ${{a}}\cdot{{b}}$. При записи без сдвига строк получили {{w}}; расположите строки верно.
  answer: 902
  hints:
  - Прочитайте десятки во втором множителе.
  - Отдельно умножьте {{a}} на единицы и на десятки.
  - Под строкой единиц сделайте место справа для строки от десятков числа {{b}}.
  solution: |
    ### Ответ
    902

    ### Идея
    Записываем разрядные строки вместо механического умножения видимых цифр.

    ### Шаги
    1. Разбиваем 22 на разрядные группы: 20 и 2.
    2. Для группы 2: $41\cdot2=82$.
    3. Для группы 20: $41\cdot20=820$.
    4. Складываем неполные произведения: $82+820=902$.

    ### Проверка
    Независимое разбиение первого множителя: $40\cdot22=880$ и $1\cdot22=22$; $880+22=902$.

    ### Типичная ошибка
    Цифра десятков второго множителя использована как единицы: черновик 164 расходится с разрядным счётом.
  feedback:
    correct: Две строки второго множителя сложены строго по разрядам.
    wrong:
      what: Итог двух строк неверен.
      why: Возможно, одна из строк начата без сдвига.
      fix: Проверьте десятки второго множителя по записи.
      next: Сопоставьте схему T01 и столбик T02.
    misconceptions:
    - id: E-num-mult-column-no-shift
      when:
        expr: w
      message: 'Похоже, строку десятков посчитали как единицы: проверьте значение второй цифры.'
  errors:
  - E-num-mult-column-no-shift
  variants:
  - params:
      a: 41
      b: 22
      w: 164
    answer: 902
    solution: |
      ### Ответ
      902

      ### Идея
