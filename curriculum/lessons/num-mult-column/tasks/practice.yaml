- id: P-03
  type: number
  role: supported
  purpose: method
  level: 1
  outcome: LO-01
  sections:
  - T04
  minutes: 2
  prompt: Не вычисляя произведение точно, определите, сколько цифр в числе ${{a}}\cdot{{b}}$. Введите количество цифр.
  answer: 4
  hints:
  - Какие удобные круглые числа чуть меньше и чуть больше каждого множителя?
  - 'Перемножьте меньшие круглые числа и большие: получится диапазон для произведения.'
  - Возьмите для {{a}} и {{b}} ближайшие круглые числа снизу и сверху; перемножьте нижние и верхние и сравните, сколько цифр
    у этих произведений.
  solution: |
    ### Ответ
    4

    ### Идея
    Число цифр даёт прикидка: произведение лежит между произведениями меньших и больших удобных чисел.

    ### Шаги
    1. Нижняя граница: $46>40$ и $73>70$, поэтому произведение больше $40\cdot70=2800$.
    2. Верхняя граница: $46<50$ и $73<80$, поэтому произведение меньше $50\cdot80=4000$.
    3. Обе границы четырёхзначные, значит, в произведении 4 цифры.

    ### Проверка
    Точный счёт: $46\cdot3=138$, $46\cdot70=3220$; $138+3220=3358$ — 4 цифры.

    ### Типичная ошибка
    Решить по одной нижней границе 2800: без верхней границы 4000 нельзя исключить лишнюю цифру.
  feedback:
