      ### Шаги
      1. Разбиваем 22 на разрядные группы: 20 и 2.
      2. Для группы 2: $41\cdot2=82$.
      3. Для группы 20: $41\cdot20=820$.
      4. Складываем неполные произведения: $82+820=902$.

      ### Проверка
      Независимое разбиение первого множителя: $40\cdot22=880$ и $1\cdot22=22$; $880+22=902$.

      ### Типичная ошибка
      Цифра десятков второго множителя использована как единицы: черновик 164 расходится с разрядным счётом.
  - params:
