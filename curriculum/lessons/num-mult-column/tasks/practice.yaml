      1. Разряд единиц: $7\cdot4=28$; пишем 8; переносим 2 в следующую колонку.
      2. Разряд десятков: $2\cdot4+2=10$; пишем 0; переносим 1 в следующую колонку.
      3. Оставшийся старший перенос 1 ставим слева; выходит 108.

