  - params:
      a: 72
      b: 20
    answer: 1440
    solution: |
      ### Ответ
      1440

      ### Идея
      Множитель 20 — это 2 десятка групп: считаем группы, а результат записываем в десятках.

      ### Шаги
      1. Цифра 2 в числе 20 — 2 десятка групп: $72\cdot2=144$.
      2. Это 144 десятка, то есть $72\cdot20=1440$.

      ### Проверка
      Независимое разбиение первого множителя: $70\cdot20=1400$ и $2\cdot20=40$; $1400+40=1440$.

      ### Типичная ошибка
      Записать $72\cdot2=144$ как ответ и потерять десяток: 144 вместо 1440.
- id: P-02
  type: number
  role: warmup
  purpose: procedure
  level: 0
  outcome: LO-01
  sections:
  - T01
  minutes: 1
  prompt: Найдите ${{a}}\cdot{{b}}$, не рисуя группы; здесь перенос из единиц не нужен.
  answer: 62
  hints:
  - Прочтите десятки и единицы верхнего числа.
  - Умножайте две части отдельно на {{b}}.
  - Начните с единиц числа {{a}}, затем умножьте его десятки и объедините части.
  solution: |
    ### Ответ
    62

    ### Идея
    Умножаем десятки и единицы первого множителя отдельно; переноса нет, потому что каждое произведение меньше десяти.

    ### Шаги
    1. Разряд единиц: $1\cdot2=2$; пишем 2.
    2. Разряд десятков: $3\cdot2=6$; пишем 6.

    ### Проверка
    Независимое разбиение первого множителя: $30\cdot2=60$ и $1\cdot2=2$; $60+2=62$.

    ### Типичная ошибка
    Умножить только единицы и забыть десятки: получится лишь $1\cdot2=2$ вместо 62.
  feedback:
    correct: Десятки и единицы первого множителя умножены на {{b}} отдельно, без лишнего переноса.
    wrong:
      what: Произведение для небольшого числа неверно.
      why: Могли пропустить десятки первого множителя.
      fix: Сложите отдельные результаты для десятков и единиц.
      next: В T01 повторите состав двузначного числа.
