# Переход от опоры к самостоятельной проверке. Каждый independent имеет шесть численно разных вариантов.
# Конкретный разбор лежит в variants[].solution; общий solution показывает первый вариант (§7).
tasks:
- id: P-01
  type: number
  role: warmup
  purpose: procedure
  level: 0
  outcome: LO-01
  sections:
  - T01
  minutes: 1
  prompt: Умножьте ${{a}}$ на ${{b}}$ как на целое число десятков. Введите количество единиц.
  answer: 430
  hints:
  - Что означает один десяток в записи второго множителя?
  - Сначала посчитайте несколько групп по {{a}}.
  - Переведите полученные группы в десятки, потому что множитель {{b}} содержит десятки.
  solution: |
    ### Ответ
    430

    ### Идея
    Множитель 10 — это 1 десяток групп: считаем группы, а результат записываем в десятках.

    ### Шаги
    1. Цифра 1 в числе 10 — 1 десяток групп: $43\cdot1=43$.
    2. Это 43 десятка, то есть $43\cdot10=430$.

    ### Проверка
    Независимое разбиение первого множителя: $40\cdot10=400$ и $3\cdot10=30$; $400+30=430$.

    ### Типичная ошибка
    Записать $43\cdot1=43$ как ответ и потерять десяток: 43 вместо 430.
  feedback:
    correct: Число от групп по {{a}} сохранено после перехода к десяткам.
    wrong:
      what: Значение групп по десяткам не совпало.
      why: Десятки могли быть приняты за единицы.
      fix: Переведите табличное произведение в десятки.
      next: В T01 сопоставьте цифру множителя с её разрядом.
