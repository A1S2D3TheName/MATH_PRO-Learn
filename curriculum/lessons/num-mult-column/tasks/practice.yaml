    solution: |
      ### Ответ
      180

      ### Идея
      Переносите полные десятки из одной колонки в следующую, не теряя их при записи цифр.

      ### Шаги
      1. Разряд единиц: $6\cdot5=30$; пишем 0; переносим 3 в следующую колонку.
      2. Разряд десятков: $3\cdot5+3=18$; пишем 8; переносим 1 в следующую колонку.
