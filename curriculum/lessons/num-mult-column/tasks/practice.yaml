- id: P-06
  type: number
  role: supported
  purpose: meaning
  level: 1
  outcome: LO-01
  sections:
  - T01
  minutes: 2
  prompt: В записи ${{a}}\cdot{{b}}$ найдите неполное произведение от **десятков** второго множителя. Введите его значение.
  answer: 760
  hints:
  - Нужно не полное произведение, а одна строка.
  - Назовите разряд второй цифры множителя {{b}}.
  - Умножьте {{a}} на число десятков в {{b}} и запишите результат в десятках — с нулём справа.
  solution: |
    ### Ответ
    760

    ### Идея
    Цифра 2 в множителе 24 означает 20 групп, а не 2 группы.

    ### Шаги
    1. Выделяем разряд 10: в 24 это 20 групп.
    2. Строка: $38\cdot20=760$.

    ### Проверка
