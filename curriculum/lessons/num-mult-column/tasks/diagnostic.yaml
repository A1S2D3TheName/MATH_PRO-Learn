tasks:
- id: D-01
  type: number
  role: diagnostic
  purpose: procedure
  level: 0
  outcome: num-mult-table/LO-01
  sections:
  - T01
  minutes: 2
  prompt: Вычислите табличное произведение $7\cdot8$. Введите число.
  answer: 56
  hints:
  - Посчитайте одинаковые группы, а не сумму двух данных чисел.
  - Вспомните таблицу для семи групп по восемь или две партии по четыре группы.
  - Начните с семи групп по четыре, затем удвойте количество групп.
  solution: |
    ### Ответ
    56

    ### Идея
    Табличный факт: семь групп по восемь предметов.

    ### Шаги
    1. Есть 7 групп по 8 предметов.
    2. По таблице умножения $7\cdot8=56$.

    ### Проверка
    Обратное табличное соотношение: $8\cdot7=56$.

    ### Типичная ошибка
    Сложить числа вместо умножения: $7+8=15$ вместо 56.
  feedback:
    correct: Табличное умножение семи одинаковых групп выполнено верно.
    wrong:
      what: Количество семи групп не совпало.
      why: Табличный факт мог быть заменён суммой двух чисел.
      fix: Сравните 7 на 8 с двумя порциями по четыре группы.
      next: Откройте пререквизит num-mult-table перед новой попыткой.
- id: D-02
  type: number
  role: diagnostic
  purpose: procedure
  level: 0
  outcome: num-mult-table/LO-01
  sections:
  - T01
  minutes: 2
  prompt: Вычислите $6\cdot9$ по таблице умножения. Ответ — число.
  answer: 54
  hints:
  - Девять групп по шесть — это умножение, не сложение двух слагаемых.
  - 'Вспомните соседний табличный факт: девять групп по шесть — это восемь групп и ещё одна.'
  - Начните с $6\cdot8=48$ и прибавьте ещё одну группу по 6.
  solution: |
    ### Ответ
    54

    ### Идея
    Табличный факт: девять групп по шесть предметов.

    ### Шаги
    1. Девять групп содержат по 6 предметов.
    2. По таблице $6\cdot9=54$.

    ### Проверка
    Соседний факт: $6\cdot8+6=48+6=54$.

    ### Типичная ошибка
    Перепутать с соседним фактом $6\cdot8=48$ и потерять одну группу.
  feedback:
    correct: Девять групп по шесть найдены без столбика.
    wrong:
      what: Произведение для девяти групп неверно.
      why: Количество групп могло перепутаться с размером группы.
      fix: Посчитайте восемь групп по шесть и добавьте ещё одну группу.
      next: Откройте пререквизит num-mult-table перед новой попыткой.
- id: D-03
  type: number
  role: diagnostic
  purpose: meaning
  level: 1
  outcome: num-place-large/LO-01
  sections:
  - T01
  minutes: 2
  prompt: В числе 4 306 сколько единиц обозначает цифра 3? Введите число единиц.
  answer: 300
  hints:
  - Распознайте не цифру саму по себе, а её место в записи числа.
  - Разбейте 4 306 на тысячи, сотни, десятки и единицы.
  - Найдите, какой разряд занимает цифра 3 в 4 306, и умножьте на величину разряда.
  solution: |
    ### Ответ
    300

    ### Идея
    Значение цифры зависит от разряда, в котором она стоит.

    ### Шаги
    1. Число 4 306 включает тысячи, сотни, десятки и единицы.
    2. Цифра 3 находится в сотнях: $3\cdot100=300$.

    ### Проверка
    Сборка по разрядам: $4000+300+0+6=4306$ — цифра 3 даёт ровно 300.

    ### Типичная ошибка
    Ответить 3 — назвать саму цифру, а не число единиц, которое она обозначает.
  feedback:
    correct: Цифра 3 распознана как три сотни, а не три единицы.
    wrong:
      what: Значение цифры 3 в записи определено неверно.
      why: Разряд сотен мог быть принят за десятки.
      fix: Запишите число по колонкам разрядной сетки.
      next: Откройте пререквизит num-place-large перед новой попыткой.
- id: D-04
  type: number
  role: diagnostic
  purpose: meaning
  level: 1
  outcome: num-place-large/LO-01
  sections:
  - T03
  minutes: 2
  prompt: Запишите число из 5 сотен, 0 десятков и 8 единиц. Введите целое число.
  answer: 508
  hints:
  - Пустой разряд десятков не стирает сотни.
  - Расположите сотни, десятки и единицы на своих местах.
  - 'Начните с пяти сотен: 500; в разряд десятков запишите 0, затем допишите единицы.'
  solution: |
    ### Ответ
    508

    ### Идея
    Нуль держит пустой разряд десятков между сотнями и единицами.

    ### Шаги
    1. Сотни, десятки и единицы занимают разные позиции.
    2. Разряды собираются: $500+0+8=508$.

    ### Проверка
    Разбор записи 508 вновь даёт 5 сотен, 0 десятков и 8 единиц.

    ### Типичная ошибка
    Пропустить нуль и записать 58: пять сотен превратятся в пять десятков.
  feedback:
    correct: Нулевой десяток сохранён между сотнями и единицами.
    wrong:
      what: Число из трёх разрядов записано иначе.
      why: Место пустых десятков могло исчезнуть.
      fix: Запишите 0 в разряд десятков — без него пятёрка окажется в десятках.
      next: Откройте пререквизит num-place-large перед новой попыткой.
