    prompt: Сколько изделий в $30$ упаковках по $46$? Введите число изделий.
    answer: 1380
    hints:
    - У числа 30 есть разряд десятков, хотя единиц нет.
    - Посчитайте число групп по 46, затем учтите десятки в 30.
    - 'Начните с ненулевой цифры числа 30: сколько таких групп по 46? Затем верните десяток.'
    solution: |
      ### Ответ
      1380

      ### Идея
      Число упаковок 30 — это 3 десятка: считаем 3 упаковки, а результат записываем в десятках.

      ### Шаги
      1. Цифра 3 в числе 30 — 3 десятка упаковок: $46\cdot3=138$.
      2. Это 138 десятков изделий: $46\cdot30=1380$.

      ### Проверка
      Независимое разбиение первого множителя: $40\cdot30=1200$ и $6\cdot30=180$; $1200+180=1380$.

      ### Типичная ошибка
      Остановиться на $46\cdot3=138$ и потерять десяток: 138 вместо 1380.
    feedback:
      correct: 'Верно: группы десятков переведены в единицы количества изделий (30, 46).'
      wrong:
        what: Изделия в 30 упаковках посчитаны неверно.
        why: Вероятно, после $46\cdot3$ не учтено, что упаковок 3 десятка.
        fix: Найдите $46\cdot3$ и запишите результат в десятках — с нулём справа.
        next: Повторите пример 1 в T03.
    points: 1
