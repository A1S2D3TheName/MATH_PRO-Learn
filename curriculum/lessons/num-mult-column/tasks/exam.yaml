    prompt: Не вычисляя произведение точно, определите, сколько цифр в числе $58\cdot74$. Введите количество цифр.
    answer: 4
    hints:
    - Какие удобные круглые числа чуть меньше и чуть больше каждого множителя?
    - 'Перемножьте меньшие круглые числа и большие: получится диапазон для произведения.'
    - Начните с нижней границы 50 на 70 и верхней 60 на 80; сравните, сколько цифр у этих произведений.
    solution: |
      ### Ответ
      4

      ### Идея
      Число цифр даёт прикидка: произведение лежит между произведениями меньших и больших удобных чисел.

      ### Шаги
      1. Нижняя граница: $58>50$ и $74>70$, поэтому произведение больше $50\cdot70=3500$.
      2. Верхняя граница: $58<60$ и $74<80$, поэтому произведение меньше $60\cdot80=4800$.
      3. Обе границы четырёхзначные, значит, в произведении 4 цифры.

      ### Проверка
      Точный счёт: $58\cdot4=232$, $58\cdot70=4060$; $232+4060=4292$ — 4 цифры.

      ### Типичная ошибка
      Решить по одной нижней границе 3500: без верхней границы 4800 нельзя исключить лишнюю цифру.
    feedback:
      correct: Длина произведения определена по двум границам, без точного столбика ($58\cdot74$).
      wrong:
        what: Число цифр произведения определено неверно.
        why: Возможно, взята одна граница или сложено число цифр множителей.
        fix: Найдите произведения меньших и больших круглых чисел и сравните их длину.
        next: Повторите пример 2 в T04.
    points: 1
