    prompt: При $39\cdot8$ получили 242, не прибавив десятки переноса от единиц. Сколько **десятков** не прибавили? Введите
      число десятков.
    answer: 7
    hints:
    - Вопрос о количестве десятков переноса, не обо всём произведении.
    - Сравните число из черновика 242 с правильным расчётом.
    - Умножьте единицы числа 39 на 8; отделите полные десятки от единиц.
    solution: |
      ### Ответ
      7

      ### Идея
      Перенос — это десятки, получившиеся при умножении единиц; их и потеряли.

      ### Шаги
      1. Единицы: $9\cdot8=72$ — 2 пишем, 7 десятков переносим.
      2. В черновике 242: в десятках стоит $3\cdot8=24$ без прибавленного переноса.
      3. Значит, не прибавили 7 десятков.

      ### Проверка
      Возвращаем перенос: $3\cdot8+7=31$, то есть 31 десяток и 2 единицы — 312; разбиением $30\cdot8+9\cdot8=240+72=312$.

      ### Типичная ошибка
      Ввести всё произведение 312 или цифру единиц 2 вместо числа потерянных десятков.
    feedback:
      correct: 'Верно: названо количество потерянных десятков, а не само произведение ($39\cdot8$).'
      wrong:
        what: Число потерянных десятков названо неверно.
        why: Возможно, введено всё произведение или цифра единиц, а не десятки переноса.
        fix: 'Разложите $9\cdot8=72$ на десятки и единицы: перенос — это десятки.'
        next: Повторите пример 1 в T02.
    points: 1
