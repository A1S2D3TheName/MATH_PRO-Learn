    - В черновике 490 ошибочна не таблица умножения, а положение строки.
    - Десятки множителя должны дать строку со сдвигом.
    - Для 49 и 37 начните со строки от 7 единиц, затем посчитайте десятки групп.
    solution: |
      ### Ответ
      1813

      ### Идея
      Сначала найдём верный расчёт; в черновике 490, потому что цифра десятков второго множителя использована как единицы. Назовите неверную строку перед исправлением числа.

      ### Шаги
      1. Разбиваем 37 на разрядные группы: 30 и 7.
      2. Для группы 7: $49\cdot7=343$.
      3. Для группы 30: $49\cdot30=1470$.
      4. Складываем неполные произведения: $343+1470=1813$.

      ### Проверка
      Независимое разбиение первого множителя: $40\cdot37=1480$ и $9\cdot37=333$; $1480+333=1813$.

      ### Типичная ошибка
      Цифра десятков второго множителя использована как единицы: черновик 490 расходится с разрядным счётом.
    feedback:
