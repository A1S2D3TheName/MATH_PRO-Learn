    prompt: Вычислите $72\cdot304$ при нуле внутри второго множителя.
    answer: 21888
    hints:
    - В множителе 304 средний разряд пуст.
    - Нулевая строка отсутствует, но сотенная не становится десятковой.
    - Для 304 отдельно посчитайте группы сотен и 4 группы единиц по 72.
    solution: |
      ### Ответ
      21888

      ### Идея
      Нуль внутри числа не удаляет место для сотен; нулевую строку не пишем.

      ### Шаги
      1. Разбиваем 304 на разрядные группы: 300 и 4.
      2. Для группы 4: $72\cdot4=288$.
      3. Для группы 300: $72\cdot300=21600$.
      4. Складываем неполные произведения: $288+21600=21888$.

      ### Проверка
      Независимое разбиение первого множителя: $70\cdot304=21280$ и $2\cdot304=608$; $21280+608=21888$.

      ### Типичная ошибка
      Стереть нуль из 304 и посчитать $72\cdot34=2448$ вместо 21888.
    feedback:
      correct: 'Верно: нулевой десяток не уменьшил число сотен ($72\cdot304$).'
      wrong:
        what: Произведение с нулём в множителе неверно.
        why: Возможно, нуль из 304 стёрли и посчитали $72\cdot34$.
        fix: Сложите строки $72\cdot4$ и $72\cdot300$; строку сотен сдвиньте на два разряда.
        next: Повторите пример 2 в T03.
    points: 1
