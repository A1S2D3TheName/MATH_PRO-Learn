    prompt: Вычислите $93\cdot7$, сохранив перенос между разрядами.
    answer: 651
    hints:
    - Для 93 на 7 запись начинается с единиц первого множителя.
    - Получившийся полный десяток перенесите в следующую колонку.
    - Начните с последней цифры 93 на 7; оставьте единицу, запомните десятки.
    solution: |
      ### Ответ
      651

      ### Идея
      Умножаем по разрядам справа налево; десятки от $3\cdot7$ переносим в следующий разряд.

      ### Шаги
      1. Разряд единиц: $3\cdot7=21$; пишем 1; переносим 2 в следующую колонку.
      2. Разряд десятков: $9\cdot7+2=65$; пишем 5; переносим 6 в следующую колонку.
      3. Оставшийся старший перенос 6 ставим слева; выходит 651.

      ### Проверка
      Независимое разбиение первого множителя: $90\cdot7=630$ и $3\cdot7=21$; $630+21=651$.

      ### Типичная ошибка
      Потерять перенос из единиц: получится 631 вместо 651.
    feedback:
      correct: 'Верно: перенос при однозначном множителе доведён до следующего разряда ($93\cdot7$).'
      wrong:
        what: Произведение 93 на 7 неверно.
        why: Мог потеряться перенос 2 десятков от $3\cdot7=21$.
        fix: Запишите 1 в единицы, а 2 десятка прибавьте к $9\cdot7$.
        next: Повторите пример 1 в T02.
    points: 1
