    prompt: 'В черновике $87\cdot46$ записаны две строки: 482 и 3480, итог 3962. Одна строка записана неверно. Найдите её
      и введите правильное значение этой строки.'
    answer: 522
    hints:
    - 'Проверьте каждую строку отдельно: от какой разрядной части второго множителя она должна получиться?'
    - Строка от единиц — первый множитель на цифру единиц; строка от десятков оканчивается нулём.
    - Пересчитайте 87 на единицы и на десятки числа 46 и сравните результаты с 482 и 3480.
    solution: |
      ### Ответ
      522

      ### Идея
      Проверяем строки по одной: каждая должна равняться первому множителю, умноженному на свою разрядную часть.

      ### Шаги
      1. Строка единиц: $87\cdot6=522$ — в черновике 482, неверно: потеряны 4 десятка переноса от $7\cdot6=42$.
      2. Строка десятков: $87\cdot40=3480$ — в черновике 3480, верно.
      3. Исправленная строка — 522; итог становится $522+3480=4002$.

      ### Проверка
      Итог с исправленной строкой — разбиением первого множителя: $80\cdot46=3680$ и $7\cdot46=322$; $3680+322=4002$.

      ### Типичная ошибка
      «Исправить» верную строку 3480 или ввести итог 4002 вместо значения строки.
    feedback:
      correct: В контрольной найдена и восстановлена именно та строка, которая не соответствует своему разряду ($87\cdot46$).
      wrong:
        what: Значение неверной строки не совпало.
        why: Возможно, исправлена верная строка 3480 или введён итог.
        fix: Пересчитайте $87\cdot6$ и $87\cdot40$ и сравните с 482 и 3480.
