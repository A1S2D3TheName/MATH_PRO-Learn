    prompt: В учебной партии число коробок 28, деталей в каждой коробке 53. Сколько деталей в партии?
    answer: 1484
    hints:
    - Число коробок 28 — это число одинаковых групп.
    - Группы от единиц и десятков надо записывать отдельно.
    - Сначала посчитайте 8 коробок по 53, затем переходите к десяткам множителя.
    solution: |
      ### Ответ
      1484

      ### Идея
      Коробки — одинаковые группы по 53: $28=20+8$, каждая часть даёт свою строку.

      ### Шаги
      1. Разбиваем 28 на разрядные группы: 20 и 8.
      2. Для группы 8: $53\cdot8=424$.
      3. Для группы 20: $53\cdot20=1060$.
      4. Складываем неполные произведения: $424+1060=1484$.

      ### Проверка
      Независимое разбиение первого множителя: $50\cdot28=1400$ и $3\cdot28=84$; $1400+84=1484$.

      ### Типичная ошибка
      Сложить строки без сдвига: $53\cdot8+53\cdot2=530$ вместо 1484.
    feedback:
      correct: 'Верно: партия коробок сосчитана по двум разрядным строкам (28, 53).'
      wrong:
        what: Число деталей в партии неверно.
        why: Строку от 2 десятков коробок могли записать без нуля или потерять перенос в строке $53\cdot8$.
        fix: Посчитайте $53\cdot8$ и $53\cdot20$ отдельно и сложите по разрядам.
        next: Повторите пример 2 в T02.
    points: 1
