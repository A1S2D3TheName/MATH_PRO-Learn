    prompt: В ведомости для $89\cdot27$ указано 2393. Количество разрядов и единицы похожи на верные. Сколько требуется на
      самом деле?
    answer: 2403
    hints:
    - У записи 2393 подходящая последняя цифра ещё не доказывает точность.
    - 'Смените разбиение: проверьте десятки и единицы первого множителя.'
    - Отдельно умножьте 80 и 9 на 27, затем объедините результаты.
    solution: |
      ### Ответ
      2403

      ### Идея
      Правдоподобный черновик перепроверяем разбиением другого множителя: так прежняя ошибка не повторится.

      ### Шаги
      1. Разбиваем первый множитель: $89=80+9$.
      2. $80\cdot27=2160$.
      3. $9\cdot27=243$.
      4. $2160+243=2403$ — запись 2393 неверна.

      ### Проверка
      Столбик по второму множителю: $89\cdot7=623$, $89\cdot20=1780$; $623+1780=2403$.

      ### Типичная ошибка
      Принять 2393 за ответ: число цифр и последняя цифра совпадают, но прикидка точности не доказывает.
    feedback:
      correct: 'Верно: правдоподобный черновик перепроверен другим разбиением ($89\cdot27$).'
      wrong:
        what: Пересчёт правдоподобного числа неверен.
