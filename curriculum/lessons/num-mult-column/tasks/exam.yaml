    prompt: В записи $54\cdot36$ укажите численное значение строки от **десятков** второго множителя.
    answer: 1620
    hints:
    - Спрашивают одну разрядную строку, а не полный результат.
    - В 36 цифра десятков показывает количество десятков групп.
    - Умножьте 54 на десятки из 36, оставив место нулевым единицам.
    solution: |
      ### Ответ
      1620

      ### Идея
      Цифра 3 в множителе 36 означает 30 групп, а не 3 группы.

      ### Шаги
      1. Выделяем разряд 10: в 36 это 30 групп.
      2. Строка: $54\cdot30=1620$.

      ### Проверка
      1620 — это 162 десятка, а $54\cdot3=162$: строка действительно считает 3 десятка групп.

      ### Типичная ошибка
      Записать $54\cdot3=162$ без нуля: строка 162 вместо 1620 потеряет разряд десятков.
    feedback:
      correct: 'Верно: строка десятков названа с её разрядом ($54\cdot36$).'
      wrong:
        what: Значение строки десятков неверно.
        why: Цифру 3 из 36 могли посчитать как 3 группы, а не как 3 десятка групп.
        fix: Умножьте 54 на 3 и запишите результат в десятках.
        next: Вернитесь к ключевой заметке T01 о сдвиге.
    points: 1
