outcomes:
  - id: LO-01
    short: Переводит единицы и читает часы
    action: переводит секунды, минуты, часы, сутки, недели и месяцы друг в друга и определяет время по циферблату до минуты
    conditions: целые числа, перевод внутри пары соседних единиц времени, время от нуля до двадцати четырёх часов с делениями минутной стрелки, кратными единице
    criterion: верно переводит единицы в обе стороны, называет часы и минуты по положению стрелок и проверяет себя обратным переводом
    level: core
    sections:
      - T01
      - T02
  - id: LO-02
    short: Работает с календарём
    action: называет дни недели и месяцы по порядку, число дней в месяце и находит день недели при сдвиге на целое число дней
    conditions: сдвиг в пределах года, год обычный с двадцатью восемью днями в феврале; число дней в месяце берётся из календаря
    criterion: верно определяет день недели после сдвига на несколько дней и называет длину названного месяца
    level: standard
    sections: [T03]
  - id: LO-03
    short: Считает длительность и момент времени
    action: находит длительность между двумя моментами, момент окончания по началу и длительности и момент начала по окончанию
    conditions: время в пределах суток, ответ в минутах, промежуток может переходить через границу часа и через полночь
    criterion: верно считает длительность обоими способами — по частям через границы и разностью минут от полуночи
    level: deep
    sections: [T04]

