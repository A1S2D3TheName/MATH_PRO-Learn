# tree.yaml дословно (правило 6).
id: model-time
title: "Время, часы и календарь"
section: model
stage: 1
hours: 2
grade: "1–3"
prerequisites: [num-line]
version: "1.0.0"
summary: >
  Время — это величина: секунды, минуты, часы, сутки, недели, месяцы и год собраны друг из друга,
  поэтому перевод между ними идёт умножением или делением. Ученик читает время по циферблату,
  разбирается с днями недели и месяцами календаря, считает длительность между двумя моментами
  и находит момент окончания, переходя через границу часа и через полночь.

