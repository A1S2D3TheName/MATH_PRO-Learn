  synonyms:
    - единицы времени
    - сколько минут в часе
    - сколько секунд в минуте
    - перевод единиц времени
    - чтение циферблата
    - определение времени по часам
    - часовая и минутная стрелка
    - который час
    - календарь дни недели месяцы
    - сколько дней в месяце
    - длительность события
    - промежуток между моментами времени
  questions:
    - Сколько минут в одном часе?
    - Сколько секунд в одной минуте?
    - Сколько часов в сутках?
    - Как определить время по циферблату?
    - Как понять, какая стрелка показывает часы, а какая минуты?
    - Сколько дней в неделе и как они называются по порядку?
    - Сколько дней в каждом месяце?
    - Как найти, сколько времени прошло между двумя моментами?
    - Как узнать время окончания, если известны начало и длительность?
    - Что происходит со счётом времени, когда промежуток переходит через полночь?

