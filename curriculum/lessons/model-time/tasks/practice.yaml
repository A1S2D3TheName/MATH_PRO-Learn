- id: P-23
  type: number
  role: challenge
  purpose: transfer
  level: 5
  outcome: LO-03
  sections:
  - T04
  minutes: 6
  optional: true
  prompt: Экскурсия началась в 10:20 и длилась 2 ч 45 мин. Сколько минут прошло от полуночи до конца экскурсии?
  answer: 785
  hints:
  - 'Длительность дана в часах и минутах: сначала переведите её в минуты.'
  - Момент начала тоже удобно выразить в минутах от полуночи.
  - Сложите минуты начала и минуты длительности.
  solution: |
    ### Ответ
    785

    ### Идея
    И длительность, и момент начала выражаются в минутах от полуночи, после чего остаётся сложение.

    ### Шаги
    1. Переводим начало в минуты от полуночи: 60 · 10 + 20 = 620.
    2. Переводим длительность в минуты: 60 · 2 + 45 = 165.
    3. Складываем: 620 + 165 = 785 минут прошло от полуночи до конца экскурсии.

    ### Проверка
    Проверка: 785 минут — это 13 ч 5 мин, то есть на 2 ч 45 мин позже начала в 10:20.

    ### Типичная ошибка
    Прибавить к моменту начала только часы длительности и получить 740 вместо 785.
  feedback:
    correct: 'Верно: и момент, и длительность выражены в минутах от полуночи.'
