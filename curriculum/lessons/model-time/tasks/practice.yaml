# Основной банк (STANDARD.md §6–§8): 22 задачи без challenge + 1 challenge, роли warmup/supported/
# independent, доли уровней 10/30/30/20/10 (±5 п.п.). Сквозной сюжет — учебный день и поездки.
tasks:
- id: P-01
  type: number
  role: warmup
  purpose: procedure
  level: 0
  outcome: LO-01
  sections:
  - T01
  minutes: 1
  prompt: Сколько минут в {{h}} часах?
  answer: 120
  variants:
  - params:
      h: 2
    answer: 120
    solution: |
      ### Ответ
      120

      ### Идея
      Час и минута — соседние единицы времени, и в одном часе ровно шестьдесят минут. Значит, часы переводятся в минуты умножением на шестьдесят.

      ### Шаги
      1. Один час — это шестьдесят минут.
      2. Умножаем число часов на шестьдесят: 60 · 2 = 120.
      3. Получаем 120 минут в 2 часах.

      ### Проверка
      Обратный перевод: словами это 2 часа — столько же, сколько было в условии.

      ### Типичная ошибка
      Принять час за сто минут и ответить 200 вместо 120.
  - params:
      h: 3
    answer: 180
    solution: |
      ### Ответ
      180

      ### Идея
      Час и минута — соседние единицы времени, и в одном часе ровно шестьдесят минут. Значит, часы переводятся в минуты умножением на шестьдесят.

      ### Шаги
      1. Один час — это шестьдесят минут.
      2. Умножаем число часов на шестьдесят: 60 · 3 = 180.
      3. Получаем 180 минут в 3 часах.

      ### Проверка
      Обратный перевод: словами это 3 часа — столько же, сколько было в условии.

      ### Типичная ошибка
      Принять час за сто минут и ответить 300 вместо 180.
  - params:
      h: 4
    answer: 240
    solution: |
      ### Ответ
      240

      ### Идея
      Час и минута — соседние единицы времени, и в одном часе ровно шестьдесят минут. Значит, часы переводятся в минуты умножением на шестьдесят.

      ### Шаги
      1. Один час — это шестьдесят минут.
      2. Умножаем число часов на шестьдесят: 60 · 4 = 240.
      3. Получаем 240 минут в 4 часах.

      ### Проверка
      Обратный перевод: словами это 4 часа — столько же, сколько было в условии.

      ### Типичная ошибка
      Принять час за сто минут и ответить 400 вместо 240.
  hints:
  - 'Час и минута — соседние единицы: одна крупная единица заменяется целой группой мелких.'
  - В одном часе шестьдесят минут — это постоянное соотношение, а не сто.
  - Умножьте число часов на шестьдесят, и получится столько минут.
  solution: |
    ### Ответ
    Минуты считаются по шестьдесят в каждом часе.

    ### Идея
    Чтобы перевести часы в минуты, умножаем число часов на шестьдесят.

    ### Шаги
    1. Берём число часов из условия.
    2. Умножаем его на шестьдесят.
    3. Записываем результат в минутах.

    ### Проверка
    Обратный перевод возвращает исходное число часов.

    ### Типичная ошибка
    Считать, что в часе сто минут.
  feedback:
    correct: 'Верно: часы переведены в минуты по шестьдесят минут в часе.'
    wrong:
      what: Перевод часов в минуты не совпал.
      why: Возможно, использован множитель сто вместо шестидесяти.
      fix: Умножьте число часов на шестьдесят.
      next: Соотношение единиц времени разобрано в разделе T01.
    misconceptions:
    - id: E-model-time-sixty-as-hundred
      when:
        expr: h * 100
      message: 'Час — это шестьдесят минут, а не сто: умножьте число часов на шестьдесят.'
- id: P-02
  type: number
  role: warmup
  purpose: procedure
  level: 0
  outcome: LO-02
  sections:
  - T03
  minutes: 1
  prompt: Сколько дней в {{w|pl:неделе,неделях,неделях}}?
  answer: 14
  variants:
  - params:
      w: 2
    answer: 14
    solution: |
      ### Ответ
      14

      ### Идея
      Неделя — это семь суток, поэтому число недель переводится в дни умножением на семь.

      ### Шаги
      1. Одна неделя — это семь дней.
      2. Умножаем число недель на семь: 7 · 2 = 14.
      3. Значит, в 2 неделях 14 дней.

      ### Проверка
      Разделим 14 дней на семь: получится 2 — столько же недель, сколько было в условии.

      ### Типичная ошибка
      Считать неделю шестидневной и получить на один день за каждую неделю меньше.
  - params:
      w: 3
    answer: 21
    solution: |
      ### Ответ
      21

      ### Идея
      Неделя — это семь суток, поэтому число недель переводится в дни умножением на семь.

      ### Шаги
      1. Одна неделя — это семь дней.
      2. Умножаем число недель на семь: 7 · 3 = 21.
      3. Значит, в 3 неделях 21 день.

      ### Проверка
      Разделим 21 день на семь: получится 3 — столько же недель, сколько было в условии.

      ### Типичная ошибка
      Считать неделю шестидневной и получить на один день за каждую неделю меньше.
  - params:
      w: 5
    answer: 35
    solution: |
      ### Ответ
      35

      ### Идея
      Неделя — это семь суток, поэтому число недель переводится в дни умножением на семь.

      ### Шаги
      1. Одна неделя — это семь дней.
      2. Умножаем число недель на семь: 7 · 5 = 35.
      3. Значит, в 5 неделях 35 дней.

      ### Проверка
      Разделим 35 дней на семь: получится 5 — столько же недель, сколько было в условии.

      ### Типичная ошибка
      Считать неделю шестидневной и получить на один день за каждую неделю меньше.
  hints:
  - Неделя — это семь суток подряд, счёт дней идёт семёрками.
  - Каждая следующая неделя добавляет ещё семь дней.
  - Умножьте число недель на семь — получится число дней.
  solution: |
    ### Ответ
    Дни считаются по семь в каждой неделе.

    ### Идея
    Число недель переводится в дни умножением на семь.

    ### Шаги
    1. Берём число недель из условия.
    2. Умножаем его на семь.
    3. Записываем результат в днях.

    ### Проверка
    Обратный перевод возвращает исходное число недель.

    ### Типичная ошибка
    Считать неделю короче или длиннее семи дней.
  feedback:
    correct: 'Верно: недели переведены в дни по семь дней в неделе.'
    wrong:
      what: Перевод недель в дни не совпал.
      why: Возможно, неделя принята за шесть или восемь дней.
      fix: Умножьте число недель на семь.
      next: Дни недели и их число разобраны в разделе T03.
- id: P-03
  type: number
  role: warmup
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T01
  minutes: 1
  prompt: Сколько часов в {{d}} сутках?
  answer: 48
  variants:
  - params:
      d: 2
    answer: 48
    solution: |
      ### Ответ
      48

      ### Идея
      Сутки включают и день, и ночь, поэтому в сутках двадцать четыре часа.

      ### Шаги
      1. Одни сутки равны двадцати четырём часам.
      2. Умножаем число суток на двадцать четыре: 24 · 2 = 48.
      3. Получаем 48 часов.

      ### Проверка
      Разделим 48 часов на двадцать четыре и получим 2 суток — столько же, сколько в условии.

      ### Типичная ошибка
      Принять сутки за день и ответить 24 вместо 48.
  - params:
      d: 3
    answer: 72
    solution: |
      ### Ответ
      72

      ### Идея
      Сутки включают и день, и ночь, поэтому в сутках двадцать четыре часа.

      ### Шаги
      1. Одни сутки равны двадцати четырём часам.
      2. Умножаем число суток на двадцать четыре: 24 · 3 = 72.
      3. Получаем 72 часов.

      ### Проверка
      Разделим 72 часов на двадцать четыре и получим 3 суток — столько же, сколько в условии.

      ### Типичная ошибка
      Принять сутки за день и ответить 36 вместо 72.
  - params:
      d: 4
    answer: 96
    solution: |
      ### Ответ
      96

      ### Идея
      Сутки включают и день, и ночь, поэтому в сутках двадцать четыре часа.

      ### Шаги
      1. Одни сутки равны двадцати четырём часам.
      2. Умножаем число суток на двадцать четыре: 24 · 4 = 96.
      3. Получаем 96 часов.

      ### Проверка
      Разделим 96 часов на двадцать четыре и получим 4 суток — столько же, сколько в условии.

      ### Типичная ошибка
      Принять сутки за день и ответить 48 вместо 96.
  hints:
  - Сутки — это целый день и целая ночь вместе.
  - В сутках двадцать четыре часа.
  - Умножьте число суток на двадцать четыре.
  solution: |
    ### Ответ
    Часы считаются по двадцать четыре в каждых сутках.

    ### Идея
    Число суток переводится в часы умножением на двадцать четыре.

    ### Шаги
    1. Берём число суток из условия.
    2. Умножаем его на двадцать четыре.
    3. Записываем результат в часах.

    ### Проверка
    Обратный перевод возвращает исходное число суток.

    ### Типичная ошибка
    Считать сутки светлым временем суток.
  feedback:
    correct: 'Верно: сутки переведены в часы по двадцать четыре часа.'
    wrong:
      what: Перевод суток в часы не совпал.
      why: Возможно, сутки приравнены к светлому дню или к двенадцати часам.
      fix: Умножьте число суток на двадцать четыре.
      next: Соотношения единиц времени разобраны в разделе T01.
    misconceptions:
    - id: E-model-time-day-twelve-hours
      when:
        expr: d * 12
      message: 'Сутки — это день и ночь вместе: в них двадцать четыре часа, а не двенадцать.'
- id: P-04
  type: number
  role: supported
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T01
  minutes: 2
  prompt: Сколько минут в {{h}} ч {{mm}} мин?
  answer: 75
  variants:
  - params:
      h: 1
      mm: 15
    answer: 75
    solution: |
      ### Ответ
      75

      ### Идея
      Часы и минуты переводятся по отдельности: целые часы дают группы по шестьдесят минут, а отдельные минуты просто прибавляются.

      ### Шаги
      1. Переводим часы в минуты: 60 · 1 = 60.
      2. Прибавляем отдельные минуты: 60 + 15 = 75.
      3. Всего получаем 75 минут.

      ### Проверка
      Обратный перевод: 75 минут — это 1 ч 15 мин, ведь 60 минут дают ровно 1 ч, а остаток равен 15 мин.

      ### Типичная ошибка
      Перевести только часы и ответить 60 вместо 75.
  - params:
      h: 2
      mm: 45
    answer: 165
    solution: |
      ### Ответ
      165

      ### Идея
      Часы и минуты переводятся по отдельности: целые часы дают группы по шестьдесят минут, а отдельные минуты просто прибавляются.

      ### Шаги
      1. Переводим часы в минуты: 60 · 2 = 120.
      2. Прибавляем отдельные минуты: 120 + 45 = 165.
      3. Всего получаем 165 минут.

      ### Проверка
      Обратный перевод: 165 минут — это 2 ч 45 мин, ведь 120 минут дают ровно 2 ч, а остаток равен 45 мин.

      ### Типичная ошибка
      Перевести только часы и ответить 120 вместо 165.
  - params:
      h: 1
      mm: 40
    answer: 100
    solution: |
      ### Ответ
      100

      ### Идея
      Часы и минуты переводятся по отдельности: целые часы дают группы по шестьдесят минут, а отдельные минуты просто прибавляются.

      ### Шаги
      1. Переводим часы в минуты: 60 · 1 = 60.
      2. Прибавляем отдельные минуты: 60 + 40 = 100.
      3. Всего получаем 100 минут.

      ### Проверка
      Обратный перевод: 100 минут — это 1 ч 40 мин, ведь 60 минут дают ровно 1 ч, а остаток равен 40 мин.

      ### Типичная ошибка
      Перевести только часы и ответить 60 вместо 100.
  hints:
  - Переведите часы в минуты, а отдельные минуты прибавьте к результату.
  - Один час — это шестьдесят минут, минуты прибавляются к этому числу.
  - Сначала посчитайте минуты за целые часы, потом добавьте данные минуты.
  solution: |
    ### Ответ
    Часы переводятся в минуты, затем прибавляются данные минуты.

    ### Идея
    Каждый целый час даёт шестьдесят минут, остаток прибавляется отдельно.

    ### Шаги
    1. Переводим целые часы в минуты умножением на шестьдесят.
    2. Прибавляем к результату отдельные минуты.
    3. Записываем общее число минут.

    ### Проверка
    Обратный перевод возвращает исходные часы и минуты.

    ### Типичная ошибка
    Забыть прибавить отдельные минуты.
  feedback:
    correct: 'Верно: целые часы переведены в минуты, отдельные минуты прибавлены.'
    wrong:
      what: Общее число минут не совпало.
      why: Возможно, отдельные минуты не прибавлены к переведённым часам.
      fix: После умножения часов на шестьдесят прибавьте данные минуты.
      next: Разбор перевода часов и минут — в разделе T01.
    misconceptions:
    - id: E-model-time-minutes-dropped
      when:
        expr: h * 60
      message: 'Отдельные минуты тоже входят в ответ: после перевода часов прибавьте их к результату.'
- id: P-05
  type: number
  role: supported
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T01
  minutes: 2
  prompt: Сколько часов в {{m}} минутах?
  answer: 2
  variants:
  - params:
      m: 120
    answer: 2
    solution: |
      ### Ответ
      2

      ### Идея
      Здесь переходим к более крупной единице, поэтому минуты собираются в группы по шестьдесят.

      ### Шаги
      1. В одном часе шестьдесят минут.
      2. Делим число минут на шестьдесят: 120 : 60 = 2.
      3. Значит, в 120 минутах ровно 2 ч.

      ### Проверка
      Проверим умножением: 2 · 60 = 120, то есть столько минут и было в условии.

      ### Типичная ошибка
      Умножить минуты на шестьдесят и ответить 7200 вместо 2.
  - params:
      m: 180
    answer: 3
    solution: |
      ### Ответ
      3

      ### Идея
      Здесь переходим к более крупной единице, поэтому минуты собираются в группы по шестьдесят.

      ### Шаги
      1. В одном часе шестьдесят минут.
      2. Делим число минут на шестьдесят: 180 : 60 = 3.
      3. Значит, в 180 минутах ровно 3 ч.

      ### Проверка
      Проверим умножением: 3 · 60 = 180, то есть столько минут и было в условии.

      ### Типичная ошибка
      Умножить минуты на шестьдесят и ответить 10800 вместо 3.
  - params:
      m: 240
    answer: 4
    solution: |
      ### Ответ
      4

      ### Идея
      Здесь переходим к более крупной единице, поэтому минуты собираются в группы по шестьдесят.

      ### Шаги
      1. В одном часе шестьдесят минут.
      2. Делим число минут на шестьдесят: 240 : 60 = 4.
      3. Значит, в 240 минутах ровно 4 ч.

      ### Проверка
      Проверим умножением: 4 · 60 = 240, то есть столько минут и было в условии.

      ### Типичная ошибка
      Умножить минуты на шестьдесят и ответить 14400 вместо 4.
  hints:
  - Единица становится крупнее, поэтому число при переводе уменьшается.
  - Минуты собираются в группы по шестьдесят — это и есть часы.
  - Разделите число минут на шестьдесят.
  solution: |
    ### Ответ
    Крупная единица собирается из мелких: минуты делят на шестьдесят.

    ### Идея
    Если единица становится крупнее, число уменьшается: шестьдесят минут дают один час.

    ### Шаги
    1. Считаем, сколько групп по шестьдесят минут помещается в данном числе.
    2. Каждая группа — один час.
    3. Записываем число часов.

    ### Проверка
    Умножение полученного числа часов на шестьдесят возвращает исходные минуты.

    ### Типичная ошибка
    Умножать вместо деления при переходе к крупной единице.
  feedback:
    correct: 'Верно: минуты собраны в часы по шестьдесят минут.'
    wrong:
      what: Число часов не совпало.
      why: Возможно, минуты умножены на шестьдесят вместо деления.
      fix: Разделите число минут на шестьдесят.
      next: Переход к крупной единице разобран в разделе T01.
    misconceptions:
    - id: E-model-time-wrong-direction
      when:
        expr: m * 60
      message: 'Часов получается меньше, чем минут: минуты делят на шестьдесят, а не умножают.'
