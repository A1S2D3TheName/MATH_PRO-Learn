    Полученный остаток вместе с полными сутками даёт момент окончания.

    ### Типичная ошибка
    Забыть, что полночь уже прошла.
  feedback:
    correct: 'Верно: полные сутки вычтены, время найдено после полуночи.'
    wrong:
      what: Время после полуночи не совпало.
      why: Возможно, из полученного момента не вычтены полные сутки.
      fix: Вычтите из момента окончания полные сутки.
      next: Переход через полночь разобран в разделе T04.
    misconceptions:
    - id: E-model-time-midnight-not-crossed
      when:
        expr: 60 * h + m + d
      message: 'Полночь уже прошла: из полученного времени нужно вычесть полные сутки.'
