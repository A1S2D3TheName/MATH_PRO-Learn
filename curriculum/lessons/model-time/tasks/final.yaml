  - T04
  minutes: 1
  prompt: Учебный день начинается в {{h}} ч {{m}} мин. Сколько минут прошло от полуночи до начала занятий?
  answer: 580
  variants:
  - params:
      h: 9
      m: 40
      d: 25
      b: 10
      k: 4
      n: 2
    answer: 580
    solution: |
      ### Ответ
      580

      ### Идея
      Моменту суток соответствует число минут, прошедших от полуночи: 9 ч 40 мин — это 60 · 9 + 40 минут.

      ### Шаги
      1. Переводим часы начала в минуты: 60 · 9 = 540.
      2. Прибавляем минуты: 540 + 40 = 580.
      3. Значит, от полуночи до начала занятий прошло 580 минут.

      ### Проверка
      Обратный перевод: 580 минут — это 9 ч 40 мин.

      ### Типичная ошибка
      Забыть прибавить минуты к переведённым часам.
  - params:
      h: 8
      m: 50
      d: 30
      b: 15
      k: 5
      n: 1
    answer: 530
    solution: |
      ### Ответ
      530

      ### Идея
      Моменту суток соответствует число минут, прошедших от полуночи: 8 ч 50 мин — это 60 · 8 + 50 минут.

