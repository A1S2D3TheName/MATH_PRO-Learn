# Финальная цепочка (STANDARD.md §8): один сюжет «учебный день», 5 шагов, общие параметры вариантов.
title: Учебный день
context_id: model-time-school-day
scenario: 'Один учебный день: его начало, первый урок, перемена и второй урок. Все шаги считают минуты от полуночи,
  поэтому результаты согласованы между собой.'
