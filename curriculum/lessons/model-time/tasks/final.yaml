  prompt: После первого урока была перемена {{b}} минут. Сколько минут прошло от полуночи до конца перемены?
  answer: 615
  variants:
  - params:
      h: 9
      m: 40
      d: 25
      b: 10
      k: 4
      n: 2
    answer: 615
    solution: |
      ### Ответ
      615

      ### Идея
      Конец перемены — это конец урока плюс её длительность, всё в одних единицах.

      ### Шаги
      1. К звонку с первого урока прошло 60 · 9 + 40 + 25 = 605 минут.
      2. Прибавляем перемену: 605 + 10 = 615.
      3. До конца перемены прошло 615 минут от полуночи.

      ### Проверка
      Вычитание длительности перемены возвращает момент звонка: 615 − 10 = 605.

      ### Типичная ошибка
      Забыть, что перемена начинается после урока, и не прибавить длительность урока.
