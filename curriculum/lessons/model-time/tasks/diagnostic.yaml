# Входная диагностика (STANDARD.md §6, правило 15): 4 задачи по прямому пререквизиту num-line,
# outcome записывается как `num-line/LO-NN` (пакет пререквизита ещё не опубликован).
tasks:
- id: D-01
  type: number
  role: diagnostic
  purpose: procedure
  level: 0
  outcome: num-line/LO-01
  sections:
  - T01
  minutes: 1
  prompt: На числовом луче точка A стоит на 7 единичных отрезков правее нуля. Введите координату точки A.
  answer: 7
  hints:
  - Точка отсчитывается от нуля вправо.
  - Каждый единичный отрезок сдвигает счёт на одно число.
  - Отсчитайте от нуля семь отрезков по одному и назовите последнее число.
  solution: |
    ### Ответ
    7

    ### Идея
    Координата точки — это число единичных отрезков от нуля до этой точки.

    ### Шаги
    1. Начинаем с нуля и идём вправо по одному отрезку.
    2. Седьмой отрезок заканчивается там, где стоит точка A.

    ### Проверка
    Между началом отсчёта и точкой укладывается ровно семь единичных отрезков.

    ### Типичная ошибка
    Посчитать сам ноль первым шагом и назвать число, на единицу меньшее.
  feedback:
    correct: Верно, координата определена по числу единичных отрезков.
    wrong:
      what: Ответ не совпал с координатой на луче.
      why: Возможно, счёт начат не с числа, идущего сразу за началом отсчёта.
      fix: Отсчитайте от нуля единичные отрезки по порядку и назовите последнее число.
      next: Повторите координату точки в теме про числовой луч.
- id: D-02
  type: number
  role: diagnostic
  purpose: procedure
  level: 0
  outcome: num-line/LO-02
  sections:
  - T01
  minutes: 1
  prompt: Какое число на числовом луче стоит сразу после числа 8? Введите это число.
  answer: 9
  hints:
  - Числа на луче идут по порядку слева направо.
  - Сосед справа всегда на единицу больше.
  - Сделайте от отметки один шаг вправо и назовите число, у которого остановились.
  solution: |
    ### Ответ
    9

    ### Идея
    Сосед числа справа — следующее по счёту число, оно на единицу больше.

    ### Шаги
    1. Находим на луче число 8.
    2. Один шаг вправо ведёт к следующему числу, оно на единицу больше.

    ### Проверка
    Между соседними числами укладывается ровно один единичный отрезок.

    ### Типичная ошибка
    Взять число слева и перепутать направление луча.
  feedback:
    correct: Верно, координата определена по числу единичных отрезков.
    wrong:
      what: Ответ не совпал с координатой на луче.
      why: Возможно, счёт начат не с числа, идущего сразу за началом отсчёта.
      fix: Отсчитайте от нуля единичные отрезки по порядку и назовите последнее число.
      next: Повторите координату точки в теме про числовой луч.
