- id: D-04
  type: number
  role: diagnostic
  purpose: procedure
  level: 1
  outcome: num-line/LO-01
  sections:
  - T01
  minutes: 1
  prompt: Сколько единичных отрезков укладывается на луче между числами 0 и 12? Введите число.
  answer: 12
  hints:
  - Считайте не отметки, а промежутки между соседними числами.
  - Каждый отрезок соединяет два соседних числа.
  - Пройдите от нуля до конца по одному шагу и посчитайте шаги.
  solution: |
    ### Ответ
    12

    ### Идея
    Число единичных отрезков от нуля до числа равно самому этому числу.

    ### Шаги
    1. От нуля до первого числа укладывается один отрезок.
    2. Каждый следующий шаг добавляет ещё один отрезок; до конца их столько же, сколько единиц в числе.

    ### Проверка
    Столько же шагов по одному приводят из нуля в конечную точку.

    ### Типичная ошибка
    Посчитать числа-отметки вместо промежутков между ними и получить на одно число больше.
  feedback:
    correct: Верно, координата определена по числу единичных отрезков.
    wrong:
      what: Ответ не совпал с координатой на луче.
      why: Возможно, счёт начат не с числа, идущего сразу за началом отсчёта.
      fix: Отсчитайте от нуля единичные отрезки по порядку и назовите последнее число.
      next: Повторите координату точки в теме про числовой луч.
