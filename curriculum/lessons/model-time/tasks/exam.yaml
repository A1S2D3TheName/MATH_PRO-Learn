    prompt: Теплоход вышел в 22:40 и шёл 100 минут. На сколько минут позже полуночи он пришёл?
    answer: 20
    hints:
    - Длительность выводит за границу суток, поэтому отсчёт начинается заново.
    - Найдите время от полуночи до начала и прибавьте длительность.
    - Если результат больше числа минут в сутках, вычтите полные сутки.
    solution: |
      ### Ответ
      20

      ### Идея
      Рейс выходит за границу суток, поэтому из момента прибытия вычитаются полные сутки.

      ### Шаги
      1. От полуночи до выхода прошло 60 · 22 + 40 = 1360 минут.
      2. До полуночи оставалось 1440 − 1360 = 80 минут.
      3. Ход занял 100 минут, значит, после полуночи прошло 100 − 80 = 20 минут.

      ### Проверка
      Проверка: 22:40 плюс 100 минут даёт 00:20, то есть 20 минут после полуночи.

      ### Типичная ошибка
      Не проверять границу суток и ответить 1460.
    feedback:
      correct: 'Верно: теплоход пришёл в 00:20, через 20 минут после полуночи.'
