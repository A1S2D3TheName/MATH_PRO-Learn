# Повторение (STANDARD.md §8): 5 задач, у каждой не меньше трёх вариантов.
tasks:
- id: R-01
  type: number
  role: refresh
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T01
  minutes: 3
  prompt: 'Переведите в минуты: {{h}} ч.'
  answer: 300
  variants:
  - params:
      h: 5
    answer: 300
    solution: |
      ### Ответ
      300

      ### Идея
      Повторяем основное соотношение: один час содержит шестьдесят минут.

      ### Шаги
      1. Один час — шестьдесят минут.
      2. Переводим: 60 · 5 = 300.
      3. В 5 часах 300 минут.

      ### Проверка
      Разделим 300 на шестьдесят: получится 5 — число часов вернулось.

      ### Типичная ошибка
      Ответить 500 вместо 300, приняв час за сто минут.
  - params:
      h: 6
    answer: 360
    solution: |
      ### Ответ
      360

      ### Идея
      Повторяем основное соотношение: один час содержит шестьдесят минут.

      ### Шаги
      1. Один час — шестьдесят минут.
      2. Переводим: 60 · 6 = 360.
      3. В 6 часах 360 минут.

      ### Проверка
      Разделим 360 на шестьдесят: получится 6 — число часов вернулось.

      ### Типичная ошибка
      Ответить 600 вместо 360, приняв час за сто минут.
  - params:
      h: 7
    answer: 420
    solution: |
      ### Ответ
      420

      ### Идея
      Повторяем основное соотношение: один час содержит шестьдесят минут.

      ### Шаги
      1. Один час — шестьдесят минут.
      2. Переводим: 60 · 7 = 420.
      3. В 7 часах 420 минут.

      ### Проверка
      Разделим 420 на шестьдесят: получится 7 — число часов вернулось.

      ### Типичная ошибка
      Ответить 700 вместо 420, приняв час за сто минут.
  hints:
  - Существует постоянное соотношение между часом и минутой.
  - Час состоит из шестидесяти минут.
  - Умножьте число часов на шестьдесят.
  solution: |
    ### Ответ
    Часы переводятся в минуты умножением на шестьдесят.

    ### Идея
    Соотношение часов и минут постоянное: час — шестьдесят минут.

    ### Шаги
    1. Берём число часов.
    2. Умножаем на шестьдесят.
    3. Записываем минуты.

    ### Проверка
    Обратный перевод возвращает исходное число часов.

    ### Типичная ошибка
    Считать, что в часе сто минут.
  feedback:
    correct: 'Верно: часы переведены в минуты по шестьдесят минут в часе.'
    wrong:
      what: Перевод не совпал.
      why: Возможно, использован неверный множитель.
      fix: Умножьте число часов на шестьдесят.
      next: Соотношения единиц времени — в разделе T01.
    misconceptions:
    - id: E-model-time-sixty-as-hundred
      when:
        expr: h * 100
      message: 'В часе шестьдесят минут: умножьте число часов на шестьдесят.'
- id: R-02
  type: number
  role: refresh
  purpose: procedure
  level: 2
  outcome: LO-01
  sections:
  - T02
  minutes: 3
  prompt: Минутная стрелка показывает на {{k}}-е деление. Сколько минут она показывает?
  answer: 15
  variants:
  - params:
      k: 3
    answer: 15
    solution: |
      ### Ответ
      15

      ### Идея
      Напоминаем чтение циферблата: каждое деление минутной стрелки — пять минут.

      ### Шаги
      1. Стрелка стоит на 3-м делении.
      2. Считаем по пять минут: 5 · 3 = 15.
      3. Минутная стрелка показывает 15 минут.

      ### Проверка
      Проверка: 15 минут — это 3 группы по пять минут.

      ### Типичная ошибка
      Сбиться на деление и ответить 10 вместо 15.
  - params:
      k: 10
    answer: 50
    solution: |
      ### Ответ
      50

      ### Идея
      Напоминаем чтение циферблата: каждое деление минутной стрелки — пять минут.

      ### Шаги
      1. Стрелка стоит на 10-м делении.
      2. Считаем по пять минут: 5 · 10 = 50.
      3. Минутная стрелка показывает 50 минут.

      ### Проверка
      Проверка: 50 минут — это 10 групп по пять минут.

      ### Типичная ошибка
      Сбиться на деление и ответить 45 вместо 50.
  - params:
      k: 7
    answer: 35
    solution: |
      ### Ответ
      35

      ### Идея
      Напоминаем чтение циферблата: каждое деление минутной стрелки — пять минут.

      ### Шаги
      1. Стрелка стоит на 7-м делении.
      2. Считаем по пять минут: 5 · 7 = 35.
      3. Минутная стрелка показывает 35 минут.

      ### Проверка
      Проверка: 35 минут — это 7 групп по пять минут.

      ### Типичная ошибка
      Сбиться на деление и ответить 30 вместо 35.
  hints:
  - Деления циферблата отсчитывают минуты пятёрками.
  - Каждое деление минутной стрелки — пять минут.
  - Умножьте номер деления на пять.
  solution: |
    ### Ответ
    Минуты читаются по делениям циферблата пятёрками.

    ### Идея
    Каждое деление минутной стрелки соответствует пяти минутам.

    ### Шаги
    1. Считаем деления от начала часа.
    2. Умножаем их число на пять.
    3. Записываем число минут.

    ### Проверка
    Обратный счёт пятёрками возвращает номер деления.

    ### Типичная ошибка
    Называть номер деления вместо числа минут.
  feedback:
    correct: 'Верно: минуты посчитаны по пять за деление.'
    wrong:
      what: Число минут не совпало.
      why: Возможно, назван номер деления вместо числа минут.
      fix: Умножьте номер деления на пять.
      next: Чтение циферблата — в разделе T02.
    misconceptions:
    - id: E-model-time-minute-hand-five-off
      when:
        expr: 5 * k - 5
      message: 'Каждое деление — пять минут: считайте все деления до этого места.'
- id: R-03
  type: number
  role: refresh
  purpose: procedure
  level: 1
  outcome: LO-02
  sections:
  - T03
  minutes: 4
  prompt: Номер дня недели равен {{n}} (понедельник — первый). Какой номер будет у дня недели через {{k|pl:день,дня,дней}},
    если неделя ещё не закончилась?
  answer: 5
  variants:
  - params:
      n: 2
      k: 3
    answer: 5
    solution: |
      ### Ответ
      5

      ### Идея
      Повторяем счёт дней недели по номерам: вперёд номер увеличивается на число дней.

      ### Шаги
      1. День недели имеет номер 2.
      2. Отсчитываем вперёд 3 дня.
      3. Получаем день недели с номером 5.

      ### Проверка
      Обратный отсчёт на 3 дня возвращает номер 2.

      ### Типичная ошибка
      Отсчитать на один день меньше и назвать 4 вместо 5.
  - params:
      n: 4
      k: 2
    answer: 6
    solution: |
      ### Ответ
      6

      ### Идея
      Повторяем счёт дней недели по номерам: вперёд номер увеличивается на число дней.

      ### Шаги
      1. День недели имеет номер 4.
      2. Отсчитываем вперёд 2 дня.
      3. Получаем день недели с номером 6.

      ### Проверка
      Обратный отсчёт на 2 дня возвращает номер 4.

      ### Типичная ошибка
      Отсчитать на один день меньше и назвать 5 вместо 6.
  - params:
      n: 1
      k: 6
    answer: 7
    solution: |
      ### Ответ
      7

      ### Идея
      Повторяем счёт дней недели по номерам: вперёд номер увеличивается на число дней.

      ### Шаги
      1. День недели имеет номер 1.
      2. Отсчитываем вперёд 6 дней.
      3. Получаем день недели с номером 7.

      ### Проверка
      Обратный отсчёт на 6 дней возвращает номер 1.

      ### Типичная ошибка
      Отсчитать на один день меньше и назвать 6 вместо 7.
  hints:
  - Дни недели идут по порядку, номера увеличиваются на каждый следующий день.
  - Начинайте счёт со следующего дня после данного.
  - Прибавьте число дней к номеру дня недели.
  solution: |
    ### Ответ
    Номер дня недели увеличивается на число дней.

    ### Идея
    Внутри недели дни просто идут по порядку номеров.

    ### Шаги
    1. Берём номер дня недели.
    2. Прибавляем число дней.
    3. Записываем получившийся номер.

    ### Проверка
    Отсчёт назад возвращает исходный номер дня.

    ### Типичная ошибка
    Считать дни от исходного дня, а не от следующего.
  feedback:
    correct: 'Верно: номер дня недели увеличился на число дней.'
    wrong:
      what: Номер дня недели не совпал.
      why: Возможно, счёт начат с самого дня, а не со следующего за ним.
      fix: Прибавьте число дней к номеру дня недели.
      next: Порядок дней недели — в разделе T03.
- id: R-04
  type: number
  role: refresh
  purpose: procedure
  level: 2
  outcome: LO-03
  sections:
  - T04
  minutes: 4
  prompt: Сколько минут длится перерыв с {{h1}}:{{m1}} до {{h2}}:{{m2}}?
  answer: 45
  variants:
  - params:
      h1: 10
      m1: 50
      h2: 11
      m2: 35
    answer: 45
    solution: |
      ### Ответ
      45

      ### Идея
      Повторяем счёт промежутка: его удобно разбить на части по границам часов.

      ### Шаги
      1. От 10:50 до 11:00 проходит 10 минут.
      2. Остальные минуты считаем от начала следующего часа до 11:35.
      3. Складываем части и получаем 45 минут.

      ### Проверка
      Проверка разностью: 695 − 650 = 45 минут.

      ### Типичная ошибка
      Вычесть минуты и ответить 15 вместо 45.
  - params:
      h1: 9
      m1: 40
      h2: 11
      m2: 25
    answer: 105
    solution: |
      ### Ответ
      105

      ### Идея
      Повторяем счёт промежутка: его удобно разбить на части по границам часов.

      ### Шаги
      1. От 9:40 до 10:00 проходит 20 минут.
      2. Остальные минуты считаем от начала следующего часа до 11:25.
      3. Складываем части и получаем 105 минут.

      ### Проверка
      Проверка разностью: 685 − 580 = 105 минут.

      ### Типичная ошибка
      Вычесть минуты и ответить 15 вместо 105.
  - params:
      h1: 8
      m1: 15
      h2: 9
      m2: 50
    answer: 95
    solution: |
      ### Ответ
      95

      ### Идея
      Повторяем счёт промежутка: его удобно разбить на части по границам часов.

      ### Шаги
      1. От 8:15 до 9:00 проходит 45 минут.
      2. Остальные минуты считаем от начала следующего часа до 9:50.
      3. Складываем части и получаем 95 минут.

      ### Проверка
      Проверка разностью: 590 − 495 = 95 минут.

      ### Типичная ошибка
      Вычесть минуты и ответить 35 вместо 95.
  hints:
  - Промежуток удобно считать по частям, переходя через границы часов.
  - Сначала считайте до ближайшего целого часа.
  - Затем прибавьте минуты, прошедшие после этого часа.
  solution: |
    ### Ответ
    Промежуток считается по частям через границы часов.

    ### Идея
    Длительность перерыва — промежуток между двумя моментами.

    ### Шаги
    1. Считаем минуты до ближайшего целого часа.
    2. Прибавляем остаток до второго момента.
    3. Записываем длительность.

    ### Проверка
    Разность минут от полуночи даёт ту же длительность.

    ### Типичная ошибка
    Терять целые часы.
  feedback:
    correct: 'Верно: промежуток посчитан по частям.'
    wrong:
      what: Длительность перерыва не совпала.
      why: Возможно, целые часы между моментами не учтены.
      fix: Считайте промежуток по частям через границы часов.
      next: Промежуток между моментами — в разделе T04.
    misconceptions:
    - id: E-model-time-elapsed-loses-hour
      when:
        expr: abs(m2 - m1)
      message: 'Между моментами прошли целые часы: считайте промежуток по частям.'
- id: R-05
  type: number
  role: refresh
  purpose: method
  level: 2
  outcome: LO-03
  sections:
  - T04
  minutes: 4
  prompt: Самолёт вылетел в {{h}}:{{m}} и был в воздухе {{d}} минут. Сколько минут прошло от полуночи до посадки?
  answer: 435
  variants:
  - params:
      h: 6
      m: 25
      d: 50
    answer: 435
    solution: |
      ### Ответ
      435

      ### Идея
      Повторяем связь момента и длительности: момент выражается в минутах от полуночи.

      ### Шаги
      1. От полуночи до вылета прошло 60 · 6 + 25 = 385 минут.
      2. Прибавляем время в воздухе: 385 + 50 = 435.
      3. До посадки от полуночи прошло 435 минут.

      ### Проверка
      Проверка вычитанием: 435 − 50 = 385 — это момент вылета.

      ### Типичная ошибка
      Забыть прибавить время в воздухе и ответить 385 вместо 435.
  - params:
      h: 13
      m: 40
      d: 35
    answer: 855
    solution: |
      ### Ответ
      855

      ### Идея
      Повторяем связь момента и длительности: момент выражается в минутах от полуночи.

      ### Шаги
      1. От полуночи до вылета прошло 60 · 13 + 40 = 820 минут.
      2. Прибавляем время в воздухе: 820 + 35 = 855.
      3. До посадки от полуночи прошло 855 минут.

      ### Проверка
      Проверка вычитанием: 855 − 35 = 820 — это момент вылета.

      ### Типичная ошибка
      Забыть прибавить время в воздухе и ответить 820 вместо 855.
  - params:
      h: 20
      m: 10
      d: 45
    answer: 1255
    solution: |
      ### Ответ
      1255

      ### Идея
      Повторяем связь момента и длительности: момент выражается в минутах от полуночи.

      ### Шаги
      1. От полуночи до вылета прошло 60 · 20 + 10 = 1210 минут.
      2. Прибавляем время в воздухе: 1210 + 45 = 1255.
      3. До посадки от полуночи прошло 1255 минут.

      ### Проверка
      Проверка вычитанием: 1255 − 45 = 1210 — это момент вылета.

      ### Типичная ошибка
      Забыть прибавить время в воздухе и ответить 1210 вместо 1255.
  hints:
  - Момент удобно выражать числом минут от полуночи.
  - Сначала найдите минуты от полуночи до вылета.
  - Прибавьте время в воздухе.
  solution: |
    ### Ответ
    Момент выражается в минутах от полуночи, затем прибавляется длительность.

    ### Идея
    Любому моменту суток соответствует число минут от полуночи.

    ### Шаги
    1. Переводим время вылета в минуты от полуночи.
    2. Прибавляем время в воздухе.
    3. Записываем результат в минутах.

    ### Проверка
    Вычитание длительности возвращает момент вылета.

    ### Типичная ошибка
    Забыть прибавить длительность к моменту вылета.
  feedback:
    correct: 'Верно: момент выражен в минутах, длительность прибавлена.'
    wrong:
      what: Число минут не совпало.
      why: Возможно, время в воздухе не прибавлено.
      fix: Переведите время вылета в минуты от полуночи и прибавьте время в воздухе.
      next: Связь момента и длительности — в разделе T04.
