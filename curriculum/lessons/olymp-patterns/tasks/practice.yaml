  - T01
  minutes: 1
  prompt: Пересчитайте знаки группы «{{group}}». Введите её длину.
  answer: 3
  hints:
  - Отделите один знак или одно место от соседнего.
  - Назовите номер каждого знака слева направо.
  - Назовите номера знаков группы {{group}} слева направо.
  solution: |
    ### Ответ
    3

    ### Идея
    Порядковый счёт связывает место с количеством пройденных элементов.

    ### Шаги
    1. Начинаем счёт с первого элемента.
    2. Каждому следующему элементу даём следующий номер.
    3. Последний названный номер даёт искомое количество или место.

    ### Проверка
    Пересчитайте элементы справа налево: количество не изменится.

    ### Типичная ошибка
    Не включайте в группу знаки за её границами (E-olymp-patterns-group-restart).
