- id: P-03
  type: numbers
  role: supported
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T02
  minutes: 2
  prompt: 'Перед вами числовой ряд: {{a}}, {{b}}, {{c}}, {{d}}. Продолжайте с тем же постоянным шагом. Введите два
    следующих числа.'
  answer:
    first: 14
    second: 16
  hints:
  - Определите направление изменения чисел.
  - Измерьте счётом переход между соседями и сверьте его на остальных парах.
  - Начните со счёта от {{a}} до {{b}}, затем сравните с переходом от {{b}} до {{c}}.
  solution: |
    ### Ответ
    Следующее число: 14; Число после него: 16

    ### Идея
    Продолжение сохраняет размер и направление соседнего перехода.

    ### Шаги
    1. От {{a}} к {{b}}, от {{b}} к {{c}} и от {{c}} к {{d}} проходят по два числа вперёд.
    2. После {{d}} называем 13, 14; первое поле — 14.
    3. Ещё один такой переход заканчивается числом 16.

    ### Проверка
    От 16 пройдите тот же шаг в обратную сторону: получится 14, затем {{d}}. Это возвращает нас к исходному ряду.

    ### Типичная ошибка
    Следующее число обычного счёта не заменяет шаг ряда (E-olymp-patterns-next-counting).
  feedback:
    correct: Продолжение числовой ряд сохраняет оба соседних перехода, а не пропускает одно место.
    wrong:
