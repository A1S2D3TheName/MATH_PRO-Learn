    prompt: 'Записано 4, 6, 8, 11. Догадка: шаг 2 вперёд. На переходе к какому записанному числу догадка впервые
      нарушена?'
    answer: 11
    hints:
    - Отличайте ожидаемое число от наблюдаемого.
    - Сверьте прогноз с правым числом каждой пары.
    - Начните с перехода 4 → 6.
    solution: |
      ### Ответ
      11

      ### Идея
      Ответом служит наблюдение, а не исправление записи.

      ### Шаги
      1. Первые два перехода имеют шаг 2.
      2. Последний переход имеет шаг 3.
      3. Несовпадение на числе 11.

      ### Проверка
      От 8 до 11 нужно назвать 3 чисел, а не 2.

      ### Типичная ошибка
      Не подменяйте данные прогнозом.
    feedback:
