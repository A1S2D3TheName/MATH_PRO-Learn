      step: 17
    hints:
    - Сравните начало и конец каждого фрагмента.
    - Решите, где начинается группа заново, а где продолжается рост.
    - В А переход 9 → 5 идёт назад; сравните это с Б.
    solution: |
      ### Ответ
      {'repeat': 5, 'step': 17}

      ### Идея
      Одна возрастающая пара не задаёт способ всего ряда.

      ### Шаги
      1. А повторяет 5, 9.
      2. Б имеет шаг четыре вперёд.
      3. Продолжения: {'repeat': 5, 'step': 17}.

      ### Проверка
      В А после продолжения начнётся та же пара; в Б обратный шаг четыре возвращает 13.

      ### Типичная ошибка
      Не переносите шаг Б на повторяющийся ряд А.
    feedback:
