    minutes: 3
    points: 1
    prompt: 'Группа «круг, ромб, звезда» повторяется с начала. Показано: круг, ромб, звезда, круг, ромб, звезда,
      круг. Сколько знаков входит в одну заданную группу?'
    answer: 3
    hints:
    - Отделите одну группу от её повторов.
    - Считайте знаки внутри кавычек, а не во всей строке.
    - Начните со знака «круг» и присвойте ему номер 1.
    solution: |
      ### Ответ
      3

      ### Идея
      Длина относится к группе, а не ко всей записи.

      ### Шаги
      1. Заданная группа: круг, ромб, звезда.
      2. Пересчёт её знаков даёт 3.

      ### Проверка
      Две группы содержат 6 знаков; это вдвое больше длины одной.

      ### Типичная ошибка
      Не считайте весь фрагмент вместо группы.
    feedback:
      correct: Две группы содержат 6 знаков; это вдвое больше длины одной.
      wrong:
        what: Полученная запись не соответствует заданию.
        why: Не считайте весь фрагмент вместо группы.
        fix: Считайте знаки внутри кавычек, а не во всей строке.
        next: Вернитесь к разделу T01 и проверьте показанные места по порядку.
