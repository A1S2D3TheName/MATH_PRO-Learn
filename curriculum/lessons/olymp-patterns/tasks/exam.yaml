    - Измерьте один переход и сверьте остальные.
    - Посчитайте числа от 11 до 14, не включая начальное.
    solution: |
      ### Ответ
      {'first': 23, 'second': 26}

      ### Идея
      Одинаковый переход повторяется от последнего числа.

      ### Шаги
      1. Шаг — 3 вперёд.
      2. От 20 получаем 23.
      3. Ещё один переход даёт 26.

      ### Проверка
      Обратные переходы на 3 возвращают к 20 через 23.

      ### Типичная ошибка
      Не заменяйте размер шага соседним числом счёта.
    feedback:
      correct: Обратные переходы на 3 возвращают к 20 через 23.
      wrong:
        what: Полученная запись не соответствует заданию.
        why: Не заменяйте размер шага соседним числом счёта.
        fix: Измерьте один переход и сверьте остальные.
        next: Вернитесь к разделу T02 и проверьте показанные места по порядку.
