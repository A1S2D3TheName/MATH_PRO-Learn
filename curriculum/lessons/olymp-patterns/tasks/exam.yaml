      1. В первых четырёх местах записи совпадают.
      2. У А пятое место открывает пару: 7.
      3. У Б на пятом месте завершение группы: 10.

      ### Проверка
      Сверка мест 1–4 исключает более раннее различие; на месте 5 числа 7 и 10 различаются.

      ### Типичная ошибка
      Не выбирайте более привычное правило без проверки.
