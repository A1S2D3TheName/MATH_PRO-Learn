          19

          ### Идея
          Чтобы проверить предложенное правило ряда, нужно пройти по каждому показанному переходу слева направо и отметить то место, где фактическое число ряда расходится с догадкой.

          ### Шаги
          1. Проверим переходы `2 → 6`, `6 → 10` и `10 → 14`: на каждом из них называют четыре числа вперёд — догадка выполняется.
          2. От 14 четыре числа вперёд дают 18, а в ряду записано число 19 (пять чисел вперёд). Значит, догадка впервые нарушается на переходе к числу 19.

          ### Проверка
          Пересчитаем переход от 14 до 19: пятнадцать, шестнадцать, семнадцать, восемнадцать, девятнадцать — здесь пять шагов вперёд, а не четыре.

          ### Типичная ошибка
          Вписать ожидаемое по догадке число 18 вместо реального числа 19 из ряда, на котором догадка не подтвердилась.
      - params: {p1: 3, p2: 5, p3: 7, a: 9, last: 12, k: 2}
        answer: 12
        solution: |
          ### Ответ
          12

          ### Идея
          Чтобы проверить предложенное правило ряда, нужно пройти по каждому показанному переходу слева направо и отметить то место, где фактическое число ряда расходится с догадкой.

          ### Шаги
          1. Проверим переходы `3 → 5`, `5 → 7` и `7 → 9`: на каждом из них называют два числа вперёд — догадка выполняется.
          2. От 9 два числа вперёд дают 11, а в ряду записано число 12 (три числа вперёд). Значит, догадка впервые нарушается на переходе к числу 12.

          ### Проверка
          Пересчитаем переход от 9 до 12: десять, одиннадцать, двенадцать — здесь три шага вперёд, а не два.

          ### Типичная ошибка
          Вписать ожидаемое по догадке число 11 вместо реального числа 12 из ряда, на котором догадка не подтвердилась.
    feedback:
      correct: "Верно: вы проверили все переходы подряд и точно указали число ряда, на котором догадка перестала работать."
      wrong:
        what: Число из ряда, на переходе к которому нарушается догадка, указано неверно.
        why: Возможно, вы проверили не все переходы или записали ожидаемое по догадке число вместо того, которое реально стоит в ряду.
        fix: Проверьте переход от {{a}} к последнему числу ряда и выпишите само это число из условия.
        next: Перечитайте в разделе T03, как проверять догадку на всех показанных переходах.
      misconceptions:
