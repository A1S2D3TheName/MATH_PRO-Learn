# Короткий набор для режима «Освежить память» (STANDARD.md §8, таблица размеров банка):
# 6 параметрических задач (не менее 3 вариантов у каждой), суммарно 16 минут
# (вместе с выжимками и карточками 2,6 мин — 18,6 мин при бюджете режима 15–25 мин).
# Покрывают все 3 результата обучения (LO-01, LO-02, LO-03) и все 4 раздела теории (T01–T04).
tasks:
  - id: R-01
    type: number
    role: refresh
    purpose: procedure
    level: 1
    outcome: LO-01
    sections: [T01]
    minutes: 2
    prompt: "На световом табло по кругу повторяется одна и та же группа из трёх чисел (внутри самой тройки переход между соседними числами равен {{k}} вперёд): {{a}}, {{b}}, {{c}}, {{a}}, {{b}}, {{c}}, … Какое число загорится следующим?"
    answer: 3
    hints:
      - Посмотрите на весь ряд целиком и выделите группу из нескольких чисел, которая повторяется с самого начала.
      - Проверьте, на каком месте внутри повторяющейся группы остановилась показанная часть ряда.
      - Показаны две полные тройки подряд; после последнего числа второй тройки ряд возвращается к самому началу группы.
    solution: |
      ### Ответ
      {{a}}

      ### Идея
      В периодическом ряду после завершения очередной повторяющейся группы ряд не продолжает счёт дальше по шагу `{{k}}`, а начинается заново с первого элемента группы.

      ### Шаги
      1. Выделим в записи `{{a}}, {{b}}, {{c}}, {{a}}, {{b}}, {{c}}` повторяющуюся группу: `({{a}}, {{b}}, {{c}})`.
      2. Вторая группа полностью завершилась на числе `{{c}}`, поэтому на следующем месте стоит первое число третьей такой же группы — `{{a}}`.

      ### Проверка
      Припишем число `{{a}}` справа: `{{a}}, {{b}}, {{c}} | {{a}}, {{b}}, {{c}} | {{a}}` — третья группа начинается точно так же, как первые две.

      ### Типичная ошибка
      Продолжить счёт от числа `{{c}}` ещё на `{{k}}` вперёд внутри группы, не заметив возврата к началу цикла.
    variants:
      - params: {a: 3, b: 5, c: 7, k: 2}
        answer: 3
        solution: |
          ### Ответ
          3

          ### Идея
          В периодическом ряду после завершения очередной повторяющейся группы ряд не продолжает счёт дальше по шагу 2, а начинается заново с первого элемента группы.

          ### Шаги
          1. Выделим в записи `3, 5, 7, 3, 5, 7` повторяющуюся группу из трёх чисел: `(3, 5, 7)`.
          2. Вторая группа полностью завершилась на числе 7, поэтому следующим загорится первое число новой группы — 3.

          ### Проверка
          Разделим ряд по тройкам: `3, 5, 7 | 3, 5, 7 | 3` — третья группа начинается с того же числа 3, что и первые две.

          ### Типичная ошибка
          Продолжить счёт от 7 ещё на 2 вперёд (восемь, девять) и ответить 9 вместо возврата к началу повторяющейся тройки.
      - params: {a: 1, b: 4, c: 7, k: 3}
        answer: 1
        solution: |
          ### Ответ
          1

          ### Идея
          В периодическом ряду после завершения очередной повторяющейся группы ряд не продолжает счёт дальше по шагу 3, а начинается заново с первого элемента группы.

          ### Шаги
          1. Выделим в записи `1, 4, 7, 1, 4, 7` повторяющуюся группу из трёх чисел: `(1, 4, 7)`.
          2. Вторая группа полностью завершилась на числе 7, поэтому следующим загорится первое число новой группы — 1.

          ### Проверка
          Разделим ряд по тройкам: `1, 4, 7 | 1, 4, 7 | 1` — третья группа начинается с того же числа 1, что и первые две.

          ### Типичная ошибка
          Продолжить счёт от 7 ещё на 3 вперёд (восемь, девять, десять) и ответить 10 вместо возврата к началу повторяющейся тройки.
      - params: {a: 4, b: 6, c: 8, k: 2}
        answer: 4
        solution: |
          ### Ответ
          4

          ### Идея
          В периодическом ряду после завершения очередной повторяющейся группы ряд не продолжает счёт дальше по шагу 2, а начинается заново с первого элемента группы.

          ### Шаги
          1. Выделим в записи `4, 6, 8, 4, 6, 8` повторяющуюся группу из трёх чисел: `(4, 6, 8)`.
          2. Вторая группа полностью завершилась на числе 8, поэтому следующим загорится первое число новой группы — 4.

          ### Проверка
          Разделим ряд по тройкам: `4, 6, 8 | 4, 6, 8 | 4` — третья группа начинается с того же числа 4, что и первые две.

          ### Типичная ошибка
          Продолжить счёт от 8 ещё на 2 вперёд (девять, десять) и ответить 10 вместо возврата к началу повторяющейся тройки.
    feedback:
      correct: "Верно: после завершения второй тройки ряд возвращается к первому числу повторяющейся группы."
      wrong:
        what: Следующее число периодического ряда названо неверно.
        why: Скорее всего, счёт был продолжен вперёд от последнего числа вместо возврата к началу повторяющейся группы.
        fix: Выделите повторяющуюся тройку чисел и посмотрите, с какого числа она начинается.
        next: Перечитайте в разделе T01, как находить границу повторяющейся группы.
      misconceptions:
        - id: E-olymp-patterns-group-restart
          when: {expr: "c + k"}
          message: "Вы продолжили отсчитывать шаг внутри тройки вместо возврата к началу повторяющейся группы (E-olymp-patterns-group-restart): разделите ряд на одинаковые тройки и назовите первое число новой тройки (раздел T01)."

  - id: R-02
    type: number
    role: refresh
    purpose: procedure
    level: 1
    outcome: LO-01
    sections: [T02]
    minutes: 3
    prompt: "На табло лифта числа идут в сторону уменьшения с постоянным шагом — на каждом переходе называют {{k}} {{k|pl:число,числа,чисел}} назад: {{p1}}, {{p2}}, {{p3}}, {{a}}, … Какое число загорится следующим?"
    answer: 4
    hints:
      - Обратите внимание на направление ряда — числа при движении слева направо становятся меньше.
      - На каждом переходе от предыдущего числа отсчитывают постоянное количество чисел назад.
      - Оттолкнитесь от последнего показанного числа ряда и назовите столько чисел назад по порядку, каков шаг ряда.
    solution: |
      ### Ответ
      шаг на {{k}} назад от {{a}}

      ### Идея
      В убывающем числовом ряду с постоянным шагом следующее число находят счётом назад от последнего показанного числа `{{a}}` на `{{k}}` шагов.

      ### Шаги
      1. Проверим направление и шаг на показанных переходах `{{p1}} → {{p2}} → {{p3}} → {{a}}`: везде счёт идёт на `{{k}}` назад.
      2. От числа `{{a}}` отсчитаем `{{k}}` {{k|pl:число,числа,чисел}} назад по порядку и получим следующее число ряда.

      ### Проверка
      Если от найденного числа отсчитать `{{k}}` вперёд, мы вернёмся ровно в последнее показанное число `{{a}}`.

      ### Типичная ошибка
      Пойти от `{{a}}` по привычке вперёд вместо счёта назад или назвать соседнее число при счёте по одному.
    variants:
      - params: {p1: 16, p2: 13, p3: 10, a: 7, k: 3}
        answer: 4
        solution: |
          ### Ответ
          4

          ### Идея
          В убывающем числовом ряду с постоянным шагом следующее число находят счётом назад от последнего показанного числа 7 на 3 шага.

          ### Шаги
          1. Проверим переходы: от 16 до 13 — три числа назад (пятнадцать, четырнадцать, тринадцать); от 13 до 10 и от 10 до 7 — тоже по три числа назад.
          2. От числа 7 назовём три числа назад: шесть, пять, четыре. Следующее число ряда — 4.

          ### Проверка
          Сделаем обратный переход от 4 на три числа вперёд: пять, шесть, семь — вернулись ровно в число 7.

          ### Типичная ошибка
          Пойти от 7 на три числа вперёд и ответить 10 вместо счёта назад.
      - params: {p1: 19, p2: 15, p3: 11, a: 7, k: 4}
        answer: 3
        solution: |
          ### Ответ
          3

          ### Идея
          В убывающем числовом ряду с постоянным шагом следующее число находят счётом назад от последнего показанного числа 7 на 4 шага.

          ### Шаги
          1. Проверим переходы: от 19 до 15, от 15 до 11 и от 11 до 7 каждый раз называют четыре числа назад.
          2. От числа 7 назовём четыре числа назад: шесть, пять, четыре, три. Следующее число ряда — 3.

          ### Проверка
          Сделаем обратный переход от 3 на четыре числа вперёд: четыре, пять, шесть, семь — вернулись ровно в число 7.

          ### Типичная ошибка
          Пойти от 7 на четыре числа вперёд и ответить 11 вместо счёта назад.
      - params: {p1: 13, p2: 11, p3: 9, a: 7, k: 2}
        answer: 5
        solution: |
          ### Ответ
          5

          ### Идея
          В убывающем числовом ряду с постоянным шагом следующее число находят счётом назад от последнего показанного числа 7 на 2 шага.

          ### Шаги
          1. Проверим переходы: от 13 до 11, от 11 до 9 и от 9 до 7 каждый раз называют два числа назад.
          2. От числа 7 назовём два числа назад: шесть, пять. Следующее число ряда — 5.

          ### Проверка
          Сделаем обратный переход от 5 на два числа вперёд: шесть, семь — вернулись ровно в число 7.

          ### Типичная ошибка
          Пойти от 7 на два числа вперёд и ответить 9 вместо счёта назад.
    feedback:
      correct: "Верно: вы сохранили направление счёта назад и отсчитали нужный шаг от последнего числа."
      wrong:
        what: Следующее число убывающего ряда найдено неверно.
        why: Возможно, перепутано направление счёта (вперёд вместо назад) или сделан неверный шаг от числа 7.
        fix: Отсчитайте от последнего числа ряда указанное количество чисел в сторону уменьшения.
        next: Повторите примеры убывающих числовых рядов в разделе T02.
      misconceptions:
        - id: E-olymp-patterns-step-sign
          when: {expr: "a + k"}
          message: "Вы нашли размер шага верно, но пошли от последнего числа вперёд вместо счёта назад (E-olymp-patterns-step-sign): назовите от числа {{a}} ровно {{k}} {{k|pl:число,числа,чисел}} назад в сторону уменьшения (раздел T02)."
        - id: E-olymp-patterns-next-counting
          when: {expr: "a + 1"}
          message: "Вы назвали следующее по порядку счёта число вместо продолжения убывающего ряда по его шагу (E-olymp-patterns-next-counting): отсчитайте от {{a}} шаг назад (раздел T02)."

  - id: R-03
    type: number
    role: refresh
    purpose: meaning
    level: 2
    outcome: LO-01
    sections: [T02]
    minutes: 3
    prompt: "В ряду карточек на первой карточке нарисованы 2 треугольника и 1 квадрат, на второй — 3 треугольника и 2 квадрата, на третьей — 4 треугольника и 3 квадрата. По правилу при переходе к следующей карточке добавляют один треугольник и один квадрат. Сколько всего фигур (треугольников и квадратов вместе) будет на карточке с номером {{n}}, если выложить обе группы в один ряд и пересчитать подряд?"
    answer: 11
    hints:
      - Проследите отдельно за количеством треугольников и отдельно за количеством квадратов от карточки к карточке.
      - На каждой следующей карточке и треугольников, и квадратов становится на один больше, чем на предыдущей.
      - Найдите, сколько треугольников и сколько квадратов на карточке с номером {{n}}, а затем от числа треугольников назовите вперёд столько чисел по порядку, сколько на этой карточке квадратов.
    solution: |
      ### Ответ
      общее число фигур на карточке {{n}}

      ### Идея
      Когда у элементов ряда меняются сразу два признака, нужно проследить шаг каждого признака отдельно до карточки с номером `{{n}}`, а затем пересчитать обе группы подряд.

      ### Шаги
      1. Проследим за треугольниками: на 1-й карточке — 2, на 2-й — 3, на 3-й — 4; на каждой карточке треугольников на один больше её номера.
      2. Проследим за квадратами: на 1-й карточке — 1, на 2-й — 2, на 3-й — 3; на каждой карточке квадратов ровно столько, каков номер карточки `{{n}}`.
      3. Доведём счёт по треугольникам на карточке `{{n}}` и от этого числа назовём ещё `{{n}}` {{n|pl:число,числа,чисел}} вперёд по квадратам.

      ### Проверка
      Общее число фигур от карточки к карточке образует ряд `3, 5, 7, …`, где на каждом переходе называют два числа вперёд.

      ### Типичная ошибка
      Увеличить на последнем переходе только число треугольников, а количество квадратов оставить таким же, как на предыдущей карточке.
    variants:
      - params: {n: 5}
        answer: 11
        solution: |
          ### Ответ
          11

          ### Идея
          Когда у элементов ряда меняются сразу два признака, нужно проследить шаг каждого признака отдельно до 5-й карточки, а затем пересчитать обе группы подряд.

          ### Шаги
          1. Считаем треугольники по карточкам с 1-й по 5-ю: 2, 3, 4, 5, 6 — на 5-й карточке 6 треугольников.
          2. Считаем квадраты по карточкам с 1-й по 5-ю: 1, 2, 3, 4, 5 — на 5-й карточке 5 квадратов.
          3. От шести треугольников назовём пять чисел вперёд по квадратам: семь, восемь, девять, десять, одиннадцать. Всего 11 фигур.

          ### Проверка
          Проверим ряд общих количеств фигур по карточкам с 1-й по 5-ю (шаг — два числа вперёд): 3, 5, 7, 9, 11 — на 5-й карточке 11 фигур.

          ### Типичная ошибка
          Продолжить только ряд треугольников до 6, а квадратов оставить 4 (как на 4-й карточке) и получить 10.
      - params: {n: 6}
        answer: 13
        solution: |
          ### Ответ
          13

          ### Идея
          Когда у элементов ряда меняются сразу два признака, нужно проследить шаг каждого признака отдельно до 6-й карточки, а затем пересчитать обе группы подряд.

          ### Шаги
          1. Считаем треугольники по карточкам с 1-й по 6-ю: 2, 3, 4, 5, 6, 7 — на 6-й карточке 7 треугольников.
          2. Считаем квадраты по карточкам с 1-й по 6-ю: 1, 2, 3, 4, 5, 6 — на 6-й карточке 6 квадратов.
          3. От семи треугольников назовём шесть чисел вперёд по квадратам: восемь, девять, десять, одиннадцать, двенадцать, тринадцать. Всего 13 фигур.

          ### Проверка
          Проверим ряд общих количеств фигур по карточкам с 1-й по 6-ю (шаг — два числа вперёд): 3, 5, 7, 9, 11, 13 — на 6-й карточке 13 фигур.

          ### Типичная ошибка
          Продолжить только ряд треугольников до 7, а квадратов оставить 5 (как на 5-й карточке) и получить 12.
      - params: {n: 7}
        answer: 15
        solution: |
          ### Ответ
          15

          ### Идея
          Когда у элементов ряда меняются сразу два признака, нужно проследить шаг каждого признака отдельно до 7-й карточки, а затем пересчитать обе группы подряд.

          ### Шаги
          1. Считаем треугольники по карточкам с 1-й по 7-ю: 2, 3, 4, 5, 6, 7, 8 — на 7-й карточке 8 треугольников.
          2. Считаем квадраты по карточкам с 1-й по 7-ю: 1, 2, 3, 4, 5, 6, 7 — на 7-й карточке 7 квадратов.
          3. От восьми треугольников назовём семь чисел вперёд по квадратам: девять, десять, одиннадцать, двенадцать, тринадцать, четырнадцать, пятнадцать. Всего 15 фигур.

          ### Проверка
          Проверим ряд общих количеств фигур по карточкам с 1-й по 7-ю (шаг — два числа вперёд): 3, 5, 7, 9, 11, 13, 15 — на 7-й карточке 15 фигур.

          ### Типичная ошибка
          Продолжить только ряд треугольников до 8, а квадратов оставить 6 (как на 6-й карточке) и получить 14.
    feedback:
      correct: "Верно: вы проследили изменение обоих видов фигур до нужной карточки и пересчитали их вместе."
      wrong:
        what: Общее количество фигур на карточке определено неверно.
        why: Вероятно, учтено изменение только одного вида фигур или пропущен один шаг при счёте по карточкам.
        fix: Запишите отдельно ряд чисел для треугольников и ряд чисел для квадратов до карточки с номером {{n}}.
        next: Перечитайте пример с карточками из двух видов деталей в разделе T02.
      misconceptions:
        - id: E-olymp-patterns-one-attribute
          when: {expr: "2 * n"}
          message: "Вы увеличили на последнем шаге только количество треугольников, а количество квадратов оставили прежним (E-olymp-patterns-one-attribute): на карточке {{n}} число квадратов тоже выросло на единицу и стало равно {{n}} (раздел T02)."

  - id: R-04
    type: number
    role: refresh
    purpose: method
    level: 1
    outcome: LO-02
    sections: [T03]
    minutes: 2
    prompt: "Ученик выдвинул догадку, что в ряду {{p1}}, {{p2}}, {{p3}}, {{a}}, {{last}} на каждом переходе называют число на {{k}} вперёд от предыдущего. Пройдите по всем переходам слева направо и укажите число из этого ряда, на переходе к которому догадка ученика впервые нарушается."
    answer: 14
    hints:
      - Догадку по первому переходу нельзя считать правилом без проверки на всех остальных переходах ряда.
      - Сравните по очереди каждый переход слева направо с шагом, который предположил ученик.
      - На первых трёх переходах догадка выполняется, а на последнем переходе от {{a}} реальное число ряда расходится с ожидаемым — запишите это реальное число из условия.
    solution: |
      ### Ответ
      {{last}}

      ### Идея
      Чтобы проверить предложенное правило ряда, нужно пройти по каждому показанному переходу слева направо и отметить то место, где фактическое число ряда расходится с догадкой.

      ### Шаги
      1. Проверим первые три перехода `{{p1}} → {{p2}}`, `{{p2}} → {{p3}}` и `{{p3}} → {{a}}`: на каждом из них действительно отсчитывают `{{k}}` вперёд.
      2. Проверим последний переход от числа `{{a}}`: по догадке ученика дальше должно идти другое число, а в ряду стоит `{{last}}` — именно на переходе к числу `{{last}}` догадка нарушается.

      ### Проверка
      Посчитаем реальный шаг от `{{a}}` до `{{last}}`: он не совпадает с шагом `{{k}}` на предыдущих переходах.

      ### Типичная ошибка
      Записать вместо реального числа `{{last}}`, на котором сломалось правило, то число, которое «должно было получиться» по неподтверждённой догадке.
    variants:
      - params: {p1: 1, p2: 4, p3: 7, a: 10, last: 14, k: 3}
        answer: 14
        solution: |
          ### Ответ
          14

          ### Идея
          Чтобы проверить предложенное правило ряда, нужно пройти по каждому показанному переходу слева направо и отметить то место, где фактическое число ряда расходится с догадкой.

          ### Шаги
          1. Проверим переходы `1 → 4`, `4 → 7` и `7 → 10`: на каждом из них называют три числа вперёд — догадка выполняется.
          2. От 10 три числа вперёд дают 13, а в ряду записано число 14 (четыре числа вперёд). Значит, догадка впервые нарушается на переходе к числу 14.

          ### Проверка
          Пересчитаем переход от 10 до 14: одиннадцать, двенадцать, тринадцать, четырнадцать — здесь четыре шага вперёд, а не три.

          ### Типичная ошибка
          Вписать ожидаемое по догадке число 13 вместо реального числа 14 из ряда, на котором догадка не подтвердилась.
      - params: {p1: 2, p2: 6, p3: 10, a: 14, last: 19, k: 4}
        answer: 19
        solution: |
