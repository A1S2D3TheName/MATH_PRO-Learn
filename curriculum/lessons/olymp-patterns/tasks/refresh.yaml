          when: {expr: "a + k"}
          message: "Вы записали число, которое получилось бы по догадке ученика, вместо реального числа из ряда, где догадка нарушилась (E-olymp-patterns-rule-over-data): выпишите последнее число из самого ряда условия (раздел T03)."

  - id: R-05
    type: number
    role: refresh
    purpose: meaning
    level: 2
    outcome: LO-02
    sections: [T03]
    minutes: 3
    prompt: "Для ряда {{p1}}, {{p2}}, {{p3}}, {{a}}, … предложено правило: «на каждом переходе называют число на {{k}} вперёд от предыдущего». Убедитесь, что это правило выполняется на всех трёх показанных переходах, и назовите следующее число ряда."
    answer: 22
    hints:
      - Сначала проверьте каждый из трёх переходов `{{p1}} → {{p2}}`, `{{p2}} → {{p3}}` и `{{p3}} → {{a}}`.
      - Когда правило подтвердилось на всех показанных переходах, сделайте ровно один такой же шаг от последнего числа `{{a}}`.
      - Назовите от числа `{{a}}` ровно `{{k}}` {{k|pl:число,числа,чисел}} вперёд по порядку и остановитесь.
    solution: |
      ### Ответ
      шаг на {{k}} вперёд от {{a}}

      ### Идея
      После того как предложенное правило проверено на каждом из показанных переходов ряда, следующий элемент находят ровно одним шагом на `{{k}}` вперёд от последнего числа `{{a}}`.

      ### Шаги
      1. Проверим переходы `{{p1}} → {{p2}}`, `{{p2}} → {{p3}}` и `{{p3}} → {{a}}`: на каждом переходе называют ровно `{{k}}` {{k|pl:число,числа,чисел}} вперёд — правило подтверждено на всём ряду.
      2. От числа `{{a}}` назовём `{{k}}` {{k|pl:число,числа,чисел}} вперёд по порядку и получим следующее число ряда.

      ### Проверка
      От найденного числа отсчитаем `{{k}}` назад — мы вернёмся ровно в число `{{a}}`.

      ### Типичная ошибка
      Сделать от последнего числа `{{a}}` сразу два шага по `{{k}}` вместо одного или назвать следующее по счёту число.
    variants:
      - params: {p1: 2, p2: 7, p3: 12, a: 17, k: 5}
        answer: 22
        solution: |
          ### Ответ
          22

          ### Идея
          После того как предложенное правило проверено на каждом из показанных переходов ряда, следующий элемент находят ровно одним шагом на 5 вперёд от последнего числа 17.

          ### Шаги
          1. Проверим переходы `2 → 7`, `7 → 12` и `12 → 17`: везде называют пять чисел вперёд — правило выполняется без сбоев.
          2. От числа 17 назовём пять чисел вперёд: восемнадцать, девятнадцать, двадцать, двадцать один, двадцать два. Следующее число — 22.

          ### Проверка
          Отсчитаем от 22 пять чисел назад: двадцать один, двадцать, девятнадцать, восемнадцать, семнадцать — вернулись в 17.

          ### Типичная ошибка
          Отсчитать от 17 шаг дважды (десять чисел вперёд) и получить 27 или назвать соседнее при счёте число 18.
      - params: {p1: 5, p2: 9, p3: 13, a: 17, k: 4}
        answer: 21
        solution: |
          ### Ответ
          21

          ### Идея
          После того как предложенное правило проверено на каждом из показанных переходов ряда, следующий элемент находят ровно одним шагом на 4 вперёд от последнего числа 17.

          ### Шаги
          1. Проверим переходы `5 → 9`, `9 → 13` и `13 → 17`: везде называют четыре числа вперёд — правило выполняется без сбоев.
          2. От числа 17 назовём четыре числа вперёд: восемнадцать, девятнадцать, двадцать, двадцать один. Следующее число — 21.

          ### Проверка
          Отсчитаем от 21 четыре числа назад: двадцать, девятнадцать, восемнадцать, семнадцать — вернулись в 17.

          ### Типичная ошибка
          Отсчитать от 17 шаг дважды (восемь чисел вперёд) и получить 25 или назвать соседнее при счёте число 18.
      - params: {p1: 1, p2: 4, p3: 7, a: 10, k: 3}
        answer: 13
        solution: |
          ### Ответ
          13

          ### Идея
          После того как предложенное правило проверено на каждом из показанных переходов ряда, следующий элемент находят ровно одним шагом на 3 вперёд от последнего числа 10.

          ### Шаги
          1. Проверим переходы `1 → 4`, `4 → 7` и `7 → 10`: везде называют три числа вперёд — правило выполняется без сбоев.
          2. От числа 10 назовём три числа вперёд: одиннадцать, двенадцать, тринадцать. Следующее число — 13.

          ### Проверка
          Отсчитаем от 13 три числа назад: двенадцать, одиннадцать, десять — вернулись в 10.

          ### Типичная ошибка
          Отсчитать от 10 шаг дважды (шесть чисел вперёд) и получить 16 или назвать соседнее при счёте число 11.
    feedback:
      correct: "Верно: правило подтвердилось на всех трёх переходах, и вы сделали ровно один шаг вперёд от последнего числа."
      wrong:
        what: Следующее число ряда найдено неверно.
        why: Возможно, при счёте вперёд от {{a}} сделан двойной шаг или названо соседнее число счёта.
        fix: Отсчитайте от {{a}} ровно {{k}} {{k|pl:число,числа,чисел}} вперёд по одному.
        next: Перечитайте алгоритм проверки и продолжения ряда в разделе T03.
      misconceptions:
        - id: E-olymp-patterns-double-step
          when: {expr: "a + 2 * k"}
          message: "Вы сделали от последнего числа два шага подряд и перескочили через одно место ряда (E-olymp-patterns-double-step): назовите от числа {{a}} ровно {{k}} {{k|pl:число,числа,чисел}} вперёд и остановитесь (раздел T03)."
        - id: E-olymp-patterns-next-counting
          when: {expr: "a + 1"}
          message: "Вы назвали следующее при обычном счёте число вместо шага на {{k}} вперёд (E-olymp-patterns-next-counting): отсчитайте от {{a}} вперёд ровно {{k}} {{k|pl:число,числа,чисел}}, как на всех предыдущих переходах (раздел T03)."

  - id: R-06
    type: number
    role: refresh
    purpose: transfer
    level: 2
    outcome: LO-03
    sections: [T04]
    minutes: 3
    prompt: "Чтобы записать словесное правило для числового ряда {{a}}, {{b}}, {{c}}, {{d}}, …, нужно указать начальное число и постоянный шаг между соседними числами: «Ряд начинается с числа {{a}}, а каждое следующее число называют на ___ вперёд от предыдущего». Какое число нужно вписать на место пропуска?"
    answer: 4
    hints:
      - В словесной формулировке правила шаг измеряют между двумя соседними числами ряда, а не между краями.
      - Возьмите первое и второе числа ряда и посчитайте, сколько чисел вперёд называют при переходе между ними.
      - Убедитесь, что точно такой же переход ведёт от второго числа к третьему и от третьего к четвёртому, и запишите этот шаг числом.
    solution: |
      ### Ответ
      шаг между соседними числами ряда {{a}}, {{b}}, {{c}}, {{d}}

      ### Идея
      Полная словесная формулировка правила числового ряда указывает начальное число `{{a}}` и постоянный шаг перехода между любыми двумя соседними числами.

      ### Шаги
      1. Посчитаем шаг на первом переходе от `{{a}}` к `{{b}}`, называя числа подряд вперёд.
      2. Проверим, что на переходах `{{b}} → {{c}}` и `{{c}} → {{d}}` называют столько же чисел вперёд; это число и вписывается в словесное правило.

      ### Проверка
      Восстановим ряд по полученному правилу от числа `{{a}}`: три последовательных шага вперёд дают `{{b}}`, `{{c}}` и `{{d}}` — ряд совпал с условием.

      ### Типичная ошибка
      Посчитать скачок от первого числа `{{a}}` сразу до третьего числа `{{c}}` вместо шага между соседними числами `{{a}}` и `{{b}}`.
    variants:
      - params: {a: 3, b: 7, c: 11, d: 15}
        answer: 4
        solution: |
          ### Ответ
          4

          ### Идея
          Полная словесная формулировка правила числового ряда указывает начальное число 3 и постоянный шаг перехода между любыми двумя соседними числами.

          ### Шаги
          1. Посчитаем шаг от первого числа 3 до второго числа 7: четыре, пять, шесть, семь — названо 4 числа вперёд.
          2. Проверим следующие переходы: от 7 до 11 (восемь, девять, десять, одиннадцать) и от 11 до 15 — везде по 4 числа вперёд. Значит, на место пропуска нужно вписать число 4.

          ### Проверка
          Восстановим ряд по правилу «начинается с 3, каждое следующее на 4 вперёд»: 3, затем 7, затем 11, затем 15 — получили исходный ряд.

          ### Типичная ошибка
          Измерить переход через одно число (от 3 до 11) и вписать 8 вместо шага 4 между соседними числами.
      - params: {a: 1, b: 6, c: 11, d: 16}
        answer: 5
        solution: |
          ### Ответ
          5

          ### Идея
          Полная словесная формулировка правила числового ряда указывает начальное число 1 и постоянный шаг перехода между любыми двумя соседними числами.

          ### Шаги
          1. Посчитаем шаг от первого числа 1 до второго числа 6: два, три, четыре, пять, шесть — названо 5 чисел вперёд.
          2. Проверим следующие переходы: от 6 до 11 и от 11 до 16 — везде по 5 чисел вперёд. Значит, на место пропуска нужно вписать число 5.

          ### Проверка
          Восстановим ряд по правилу «начинается с 1, каждое следующее на 5 вперёд»: 1, затем 6, затем 11, затем 16 — получили исходный ряд.

          ### Типичная ошибка
          Измерить переход через одно число (от 1 до 11) и вписать 10 вместо шага 5 между соседними числами.
      - params: {a: 8, b: 11, c: 14, d: 17}
        answer: 3
        solution: |
          ### Ответ
          3

          ### Идея
          Полная словесная формулировка правила числового ряда указывает начальное число 8 и постоянный шаг перехода между любыми двумя соседними числами.

          ### Шаги
          1. Посчитаем шаг от первого числа 8 до второго числа 11: девять, десять, одиннадцать — названо 3 числа вперёд.
          2. Проверим следующие переходы: от 11 до 14 и от 14 до 17 — везде по 3 числа вперёд. Значит, на место пропуска нужно вписать число 3.

          ### Проверка
          Восстановим ряд по правилу «начинается с 8, каждое следующее на 3 вперёд»: 8, затем 11, затем 14, затем 17 — получили исходный ряд.

          ### Типичная ошибка
          Измерить переход через одно число (от 8 до 14) и вписать 6 вместо шага 3 между соседними числами.
    feedback:
      correct: "Верно: вы нашли постоянный шаг между соседними числами и дополнили словесное правило ряда."
      wrong:
        what: Шаг в словесной формулировке правила указан неверно.
        why: Возможно, взят переход между первым и третьим числом или названо само начальное число ряда.
        fix: Посчитайте, сколько чисел вперёд называют при переходе от первого числа {{a}} ко второму числу {{b}}.
        next: Перечитайте в разделе T04, из каких двух частей складывается словесное правило ряда.
      misconceptions:
        - id: E-olymp-patterns-step-from-first
          when: {expr: "c - a"}
          message: "Вы измерили скачок от первого числа {{a}} сразу до третьего числа {{c}}, перепрыгнув через второе число {{b}} (E-olymp-patterns-step-from-first): посчитайте переход только между соседними числами {{a}} и {{b}} (раздел T04)."
