# Входная диагностика по прямому пререквизиту num-counting (STANDARD.md §6, правило 15):
# 4 короткие задачи, покрывающие ключевые результаты пререквизита (num-counting/LO-01 и num-counting/LO-02):
# количественный счёт, правило последнего названного числа, порядковый счёт и равночисленность по парам.
#
# Примечание по правилам 15 и 160 (отражено в «Вопросах к мейнтейнеру» в PR):
# 1. Правило 15 говорит о диагностике без подсказок, но схема `schemas/task.schema.json` требует
#    обязательное поле `hints` из 3 строк. Подсказки заполнены без утечки ответа (`HINT-LEAK`).
# 2. Правило 160 требует в `sections` путь `<prereq-id>/Tnn`, но `schemas/common.schema.json`
#    (`sectionRef: ^T[0-9]{2}$`) и `tools/validate.py` (`REF-SECTION`) принимают только разделы
#    текущего пакета. Указаны разделы `T01` и `T02`, а связь с пререквизитом задана в `outcome`.
tasks:
  - id: D-01
    type: number
    role: diagnostic
    purpose: procedure
    level: 0
    outcome: num-counting/LO-01
    sections: [T01]
    minutes: 1
    prompt: "На информационной ленте выставлены знаки в один ряд: `● ● ● ● ● ● ●`. Посчитайте знаки по порядку, называя каждому ровно одно число. Сколько всего знаков в ряду?"
    answer: 7
    hints:
      - Начните счёт с крайнего левого знака и двигайтесь подряд к правому краю.
      - Каждому кругу сопоставьте ровно одно слово счёта, не пропуская знаки и не называя один знак дважды.
      - "Назовите первому кругу «один», второму — «два» и доведите счёт до последнего круга справа: последнее названное число и есть ответ."
    solution: |
      ### Ответ
      7

      ### Идея
      При количественном счёте каждому знаку называют ровно одно число по порядку, а последнее названное число отвечает на вопрос «сколько всего».

      ### Шаги
      1. Начинаем с левого края и называем кругам числа подряд: один, два, три, четыре, пять, шесть, семь.
      2. Последнему кругу названо число семь — значит, всего в ряду 7 знаков.

      ### Проверка
      Пересчитаем ряд справа налево: один, два, три, четыре, пять, шесть, семь. Порядок обхода изменился, а итоговое число осталось 7.

      ### Типичная ошибка
      Пропустить один знак при беглом взгляде или назвать два числа одному и тому же кругу — тогда счёт собьётся на единицу.
    feedback:
      correct: "Верно: каждому кругу названо ровно одно число, и счёт завершился на числе 7."
      wrong:
        what: Количество знаков в ряду определено неверно.
        why: Вероятно, при счёте один круг был пропущен или назван дважды.
        fix: Пройдите ряд слева направо, отмечая взглядом каждый круг под одно слово счёта.
        next: Повторите количественный счёт предметов в теме num-counting.

  - id: D-02
    type: number
    role: diagnostic
    purpose: meaning
    level: 0
    outcome: num-counting/LO-01
    sections: [T01]
    minutes: 1
    prompt: "Дежурный пересчитывал жетоны на столе по одному без пропусков и повторов: «один, два, три, четыре, пять, шесть, семь, восемь, девять». На слове «девять» жетоны закончились. Сколько всего жетонов на столе? Введите число."
    answer: 9
    hints:
      - Вспомните, какое именно слово правильного счёта отвечает на вопрос «сколько всего».
      - Если каждый предмет назван ровно один раз, пересчитывать группу заново не нужно — ответ уже прозвучал в конце счёта.
      - Посмотрите, каким числительным закончился пересчёт жетонов в условии, и запишите это количество числом.
    solution: |
      ### Ответ
      9

      ### Идея
      Когда предметы пересчитаны по одному без пропусков и повторов, последнее названное число выражает общее количество всей группы.

      ### Шаги
      1. По условию каждому жетону соответствовало ровно одно названное число.
      2. Счёт закончился на слове «девять», значит, в группе 9 жетонов.

      ### Проверка
      В списке названных слов («один, два, три, четыре, пять, шесть, семь, восемь, девять») ровно девять слов, и каждому слову отвечал один жетон — всего 9 жетонов.

      ### Типичная ошибка
      Назвать предыдущее слово счёта (8) или следующее по порядку число (10) вместо последнего произнесённого числа.
    feedback:
      correct: "Верно: последнее названное при правильном счёте число отвечает на вопрос «сколько всего»."
      wrong:
        what: Общее количество жетонов названо неверно.
        why: Возможно, взято соседнее число счёта вместо того, на котором пересчёт остановился.
        fix: Найдите в условии последнее слово, произнесённое при пересчёте жетонов.
        next: Повторите правило последнего названного числа в теме num-counting.

  - id: D-03
    type: number
    role: diagnostic
    purpose: procedure
    level: 1
    outcome: num-counting/LO-02
    sections: [T01]
    minutes: 1
    prompt: "Знаки выложены в ряд слева направо: `○ ○ ○ ○ ★ ○ ○`. Считайте места подряд от левого края: первое, второе, третье… На котором по счёту месте слева стоит звезда `★`? Введите число."
    answer: 5
    hints:
      - Вопрос «на котором по счёту месте» требует порядкового счёта от указанного края, а не подсчёта всех знаков ряда.
      - Начинайте счёт с крайнего левого круга и останавливайтесь сразу на звезде `★`.
      - Назовите по порядку все круги левее звезды (первый, второй, третий, четвёртый) и определите номер следующего места, на котором стоит `★`.
    solution: |
      ### Ответ
      5

      ### Идея
      Место предмета в ряду при порядковом счёте определяется числом, которое называют самому этому предмету при движении от выбранного края.

      ### Шаги
      1. Ведём счёт слева направо: первый — `○`, второй — `○`, третий — `○`, четвёртый — `○`.
      2. Следующий знак — `★`, ему соответствует пятое место, то есть номер 5.

      ### Проверка
      Левее звезды стоят четыре круга; место сразу после четвёртого по порядку — пятое (5).

      ### Типичная ошибка
      Посчитать только круги перед звездой и ответить 4 либо сосчитать все знаки в ряду до конца и ответить 7.
    feedback:
      correct: "Верно: при счёте слева направо звезда стоит на пятом месте."
      wrong:
        what: Номер места звезды определён неверно.
        why: Вероятно, посчитаны только знаки до звезды, взято общее число знаков ряда или счёт начат с правого края.
        fix: Ведите счёт от левого края и назовите номер того места, на котором стоит сама звезда.
        next: Повторите порядковый счёт и определение места предмета в ряду в теме num-counting.

  - id: D-04
    type: number
    role: diagnostic
    purpose: meaning
    level: 1
    outcome: num-counting/LO-02
    sections: [T02]
    minutes: 1
    prompt: "Каждую чашку с верхней полки поставили в пару ровно с одним блюдцем с нижней полки — свободных чашек и свободных блюдец не осталось. На верхней полке стоят чашки: `● ● ● ● ● ● ● ●`. Сколько блюдец на нижней полке?"
    answer: 8
    hints:
      - Если две группы предметов разбиты на пары один к одному без остатка, то предметов в обеих группах поровну.
      - Узнайте количество чашек на верхней полке — блюдец на нижней полке столько же.
      - "Пересчитайте знаки `●` верхней полки подряд слева направо от первого до последнего: полученное число чашек равно числу блюдец."
    solution: |
      ### Ответ
      8

      ### Идея
      Взаимно однозначное соответствие (разбиение на пары без остатка) означает равночисленность групп: блюдец столько же, сколько чашек.

      ### Шаги
      1. Пересчитаем чашки на верхней полке: один, два, три, четыре, пять, шесть, семь, восемь — всего 8 чашек.
      2. Каждой чашке отвечает ровно одно блюдце и свободных предметов нет, поэтому блюдец тоже 8.

      ### Проверка
      Восемь пар «чашка — блюдце» содержат ровно 8 чашек и 8 блюдец, ни один предмет не остался без пары.

      ### Типичная ошибка
      Посчитать общее число предметов в обеих группах (16) или сбиться на единицу при пересчёте восьми знаков (7 или 9).
    feedback:
      correct: "Верно: разбиение на пары без остатка показывает, что блюдец столько же, сколько чашек, — 8."
      wrong:
        what: Количество блюдец не совпало.
        why: Возможно, при пересчёте знаков верхней полки допущен пропуск или посчитаны обе полки вместе.
        fix: "Пересчитайте круги `●` верхней полки по одному: в равночисленной группе столько же блюдец."
        next: Повторите равночисленность групп и сопоставление парами в теме num-counting.
