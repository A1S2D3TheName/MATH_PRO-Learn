# Финальная цепочка темы olymp-patterns (STANDARD.md §8, таблица размеров банка):
# 5 связанных шагов единого сюжета (library-alley), по 6 параметрических вариантов на шаг
# с общим набором параметров для всего прогона и явными связями depends_on на шагах F-02..F-05.
# Покрывает все 3 результата обучения (LO-01, LO-02, LO-03) и все 4 раздела теории (T01–T04).
context_id: library-alley
title: "Дорожка читательского марафона в школьной библиотеке"
scenario: >
  В школьной библиотеке вдоль длинной полки оформляют выставку читательского марафона.
  Над полкой по кругу повторяется световая гирлянда из номеров читальных залов, а на пяти стендах
  выставки (с первого по пятый) расставляют стопки книг и коробки с закладками.
  Пройдите все пять шагов проверки и помогите дежурному подготовить выставку без ошибок.
tasks:
  - id: F-01
    type: number
    role: final-step
    purpose: procedure
    level: 1
    outcome: LO-01
    sections: [T01]
    minutes: 1
    depends_on: []
    prompt: "Над полкой выставки по кругу повторяется одна и та же тройка чисел (внутри самой тройки на каждом переходе называют на {{k}} вперёд): {{s1}}, {{b}}, {{c}}, {{s1}}, {{b}}, {{c}}, … Какое число стоит на седьмом месте этой гирлянды (сразу после второй полной тройки)? Именно столько книг поставили на первый стенд выставки."
    answer: 1
    hints:
      - Выделите в записи гирлянды повторяющуюся группу из первых трёх чисел.
      - Проверьте, сколько мест занимают две полные тройки подряд и где начинается третья тройка.
      - После окончания второй тройки гирлянда возвращается к самому началу повторяющейся группы — назовите её начальное число.
    solution: |
      ### Ответ
      {{s1}}

      ### Идея
      В периодическом ряду после завершения второй повторяющейся тройки седьмое место открывает третью такую же тройку и совпадает с её первым числом `{{s1}}`.

      ### Шаги
      1. Выделим повторяющуюся группу из трёх чисел: `({{s1}}, {{b}}, {{c}})`.
      2. Первые две полные тройки занимают шесть мест (`{{s1}}, {{b}}, {{c}} | {{s1}}, {{b}}, {{c}}`), поэтому на седьмом месте стоит первое число третьей группы — `{{s1}}`.

      ### Проверка
      Запишем семь мест подряд с разбивкой по группам: `{{s1}}, {{b}}, {{c}} | {{s1}}, {{b}}, {{c}} | {{s1}}` — третья группа начинается с числа `{{s1}}`.

      ### Типичная ошибка
      Продолжить счёт от `{{c}}` ещё на `{{k}}` вперёд вместо возврата к началу повторяющейся тройки.
