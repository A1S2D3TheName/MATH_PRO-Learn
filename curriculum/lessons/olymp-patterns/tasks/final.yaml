      - Чтобы перейти от третьего стенда к четвёртому, нужно сделать ещё один такой же шаг вперёд.
      - Отсчитайте от числа книг третьего стенда указанный шаг вперёд по порядку счёта.
    solution: |
      ### Ответ
      {{s4}}

      ### Идея
      В возрастающем ряду с постоянным шагом `{{k}}` количество книг на четвёртом стенде находят счётом на `{{k}}` вперёд от числа книг третьего стенда `{{a}}`.

      ### Шаги
      1. С учётом ответа `{{s1}}` из шага F-01 ряд стопок на первых трёх стендах имеет вид `{{s1}}, {{b}}, {{a}}` с постоянным шагом `{{k}}` вперёд.
      2. От числа `{{a}}` назовём `{{k}}` {{k|pl:число,числа,чисел}} вперёд и получим `{{s4}}` на четвёртом стенде.

      ### Проверка
