    depends_on: [F-01]
    prompt: "На первом стенде стоит столько книг, сколько вы нашли в шаге F-01. В отличие от циклической гирлянды, стопки книг на стендах не возвращаются к началу, а растут с постоянным шагом: на втором стенде стоит {{b}}, на третьем — {{a}} (на каждом переходе называют {{k}} {{k|pl:число,числа,чисел}} вперёд). Сколько книг должно стоять на четвёртом стенде?"
    answer: 7
    hints:
