# Паспорт темы olymp-patterns (STANDARD.md §3). Поля section/stage/hours/grade/prerequisites/scope
# скопированы из tree.yaml дословно (правило 6).
id: olymp-patterns
title: "Закономерности и продолжение ряда"
section: olymp
stage: 1
hours: 2
grade: "1–2"
prerequisites: [num-counting]
version: "1.0.0"
scope: >
  Ранняя кружковая привычка искать правило; доказательство и символы появляются позже.
summary: >
  Ученик замечает повторяющуюся группу или постоянный шаг в ряду, продолжает ряд
  по выбранному правилу, проверяет догадку на показанных переходах и формулирует
  правило словами.

search:
  synonyms:
    - закономерность
    - закономерности
    - продолжить ряд
    - как продолжить ряд
    - следующий элемент ряда
    - правило ряда
    - шаг ряда
    - повторяющаяся группа
    - числовой ряд
    - предметный ряд
    - узор из фигур
    - последовательность фигур
    - что дальше в ряду
    - кружок закономерности
  questions:
    - Как найти закономерность в ряду?
    - Как продолжить числовой ряд?
    - Что такое шаг ряда?
    - Как найти шаг в числовом ряду?
    - Как сформулировать правило ряда словами?
    - Какая группа повторяется в ряду?
    - Как проверить догадку о правиле?
    - Чем повторяющийся ряд отличается от ряда с шагом?
    - Что будет следующим в узоре из фигур?
    - Какое число стоит следующим в ряду?

subtopics:
  - id: olymp-patterns/nablyudenie-povtora-i-shaga
    title: "Наблюдение повтора и шага ряда"
    tree_ref: "Наблюдение повтора и шага ряда"
    synonyms: [повторяющаяся группа, цикл ряда, повтор узора]
    sections: [T01, T02]
  - id: olymp-patterns/prodolzhenie-chislovoy-i-predmetnoy
    title: "Продолжение числовой и предметной последовательности"
    tree_ref: "Продолжение числовой и предметной последовательности"
    synonyms: [продолжить ряд, следующий элемент, дописать ряд]
    sections: [T01, T02, T05]
  - id: olymp-patterns/proverka-dogadki-na-sleduyuschem
    title: "Проверка догадки на следующем шаге"
    tree_ref: "Проверка догадки на следующем шаге"
    synonyms: [проверка правила, сверка прогноза, догадка верна]
    sections: [T03, T07]
  - id: olymp-patterns/slovesnaya-formulirovka-pravila
    title: "Словесная формулировка правила"
    tree_ref: "Словесная формулировка правила"
    synonyms: [описать правило словами, правило своими словами]
    sections: [T04, T06, T07]

outcomes:
  - id: LO-01
    short: Находит повтор или шаг
    action: Находит повторяющуюся группу или постоянный шаг ряда и называет следующие элементы
    conditions: Предметной или числовой ряд из 4–8 элементов; повторяющаяся группа длины 2–4 либо постоянный шаг в пределах от 1 до 5
    criterion: Верно называет группу или шаг и продолжает ряд не менее чем на два элемента
    level: core
    sections: [T01, T02]
  - id: LO-02
    short: Проверяет догадку на данных
    action: Проверяет предложенное правило на показанных переходах и отмечает переход, которому правило не соответствует
    conditions: Числовой или предметный ряд из 4–6 элементов и предложенное правило продолжения
    criterion: Верно подтверждает правило или находит переход, на котором прогноз расходится с наблюдением
    level: standard
    sections: [T03, T04]
  - id: LO-03
    short: Ведёт правило к далёкому месту и выбору
    action: Применяет правило ряда к далёкому номеру места, двум признакам и фрагменту с несколькими правилами и называет условие выбора
    conditions: Ряд с правилом по номеру места или двумя признаками; фрагмент, который допускает более одного правила
    criterion: Формулирует правило словами, получает по нему значение для далёкого номера и называет условие, выбирающее правило из нескольких
    level: deep
    sections: [T04, T05, T06, T07]

errors:
  - E-olymp-patterns-group-restart
  - E-olymp-patterns-next-counting
  - E-olymp-patterns-double-step
  - E-olymp-patterns-step-sign
  - E-olymp-patterns-step-from-first
  - E-olymp-patterns-rule-over-data
  - E-olymp-patterns-one-attribute
  - E-olymp-patterns-rule-last-only
