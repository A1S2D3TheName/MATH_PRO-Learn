  - id: P-05
    type: numbers
    role: supported
    purpose: meaning
    level: 1
    outcome: LO-01
    sections: [T01, T02]
    minutes: 2
    errors: [E-num-counting-double-told]
    prompt:
      "Кружки: {{top}}. Флажки: {{bottom}}. Посчитай каждую группу и ответь двумя числами: сколько кружков и сколько флажков."
    fields: [{id: krug, label: сколько кружков}, {id: flag, label: сколько флажков}]
    answer: {krug: 6, flag: 6}
    variants:
      - params: {top: о о о о о о, bottom: ф ф ф ф ф ф}
        answer: {krug: 6, flag: 6}
        solution: |
          ### Ответ
          кружков 6, флажков 6

          ### Идея
          Каждую группу считаем своим рядом чисел.

          ### Шаги
          1. Верхний ряд: 1, 2, 3, 4, 5, 6 — кружков 6.
          2. Нижний ряд: 1, 2, 3, 4, 5, 6 — флажков 6.
          3. Числа 6 и 6: группам поровну.

          ### Проверка
          Ряды сравнили и по парам: остатка нет ровно тогда, когда числа совпали.

          ### Типичная ошибка
          E-num-counting-double-told: ряд чисел правильный, но на предмет их приходится по два.
      - params: {top: о о о о о о о о, bottom: ф ф ф ф ф}
        answer: {krug: 8, flag: 5}
        solution: |
          ### Ответ
          кружков 8, флажков 5

          ### Идея
          Каждую группу считаем своим рядом чисел.

          ### Шаги
          1. Верхний ряд: 1, 2, 3, 4, 5, 6, 7, 8 — кружков 8.
          2. Нижний ряд: 1, 2, 3, 4, 5 — флажков 5.
          3. Числа 8 и 5: группам не поровну.

          ### Проверка
          Ряды сравнили и по парам: остатка нет ровно тогда, когда числа совпали.

          ### Типичная ошибка
          E-num-counting-double-told: ряд чисел правильный, но на предмет их приходится по два.
    hints:
      - Группы считают по отдельности, каждой — свой ряд чисел.
      - "Не переноси итог одной группы на другую: ряды могут быть разной длины."
      - "Верхний ряд начинается так: {{top}} — поставь на каждый значок по числу."
    solution: |
      ### Ответ
      ответ задачи

      ### Идея
      Число — количество одной группы; сравнивать числа можно, только посчитав обе группы.

      ### Шаги
      1. Считаем верхний ряд.
      2. Считаем нижний ряд.
      3. Сравниваем два итога.

      ### Проверка
      Обе группы пересчитаны в другом порядке — итоги те же.

      ### Типичная ошибка
      E-num-counting-double-told: ряд чисел правильный, но на предмет их приходится по два.
    feedback:
      correct: "Верно, P-05: обе группы посчитаны отдельно."
      wrong:
        what: Одна из групп посчитана неверно.
        why: Итог одной группы приписали другой или счёт сбился.
        fix: Пересчитайте каждую группу по одному, отодвигая предметы.
        next: Пример 2 раздела T02.
  - id: P-06
    type: choice
    role: supported
    purpose: meaning
    level: 1
    outcome: LO-01
    sections: [T01]
    minutes: 1
    errors:
      - E-num-counting-double-told
      - E-num-counting-skip-one
      - E-num-counting-gaps-counted
    prompt:
      Дети аккуратно посчитали коробки и назвали последнее число 8. Что означает это число?
    options:
      - id: a
        text: коробок столько же, сколько названных чисел
        why: Аккуратный счёт даёт равные группы чисел и предметов.
      - id: b
        text: коробок на одну меньше, чем названных чисел
        why: Так считается группа, если одно число повторили.
        misconception: E-num-counting-double-told
      - id: c
        text: коробок на одну больше, чем названных чисел
        why: Так считается группа, если одно число пропустили.
        misconception: E-num-counting-skip-one
      - id: d
        text: число мест, которые коробки занимают на столе
        why: Число предметов и число занятых мест — разное.
        misconception: E-num-counting-gaps-counted
    answer: a
    hints:
      - Сравнивают не слова, а число предметов и число названных чисел.
      - "Проверь каждый ответ: какое число даёт аккуратный счёт?"
      - "В условии прозвучало 8 чисел: посчитай, сколько это предметов при счёте по одному."
    solution: |
      ### Ответ
      коробок столько же, сколько названных чисел.

      ### Идея
      Последнее названное число и есть количество группы.

      ### Шаги
      1. Каждой коробке досталось по одному числу.
      2. Всего прозвучало 8 чисел.
      3. Ответ: коробок 8.

      ### Проверка
      Чисел и коробок одинаковое количество.

      ### Типичная ошибка
      E-num-counting-skip-one: искать сбой там, где счёт шёл ровно.
    feedback:
      correct: "Верно, P-06: выбран ответ, который даёт аккуратный счёт."
      wrong:
        what: Выбран ответ, который описывает сбой счёта.
        why: Число предметов и число названных чисел перепутали.
        fix: Пересчитайте группу, отодвигая посчитанные предметы.
        next: Примеры раздела T01.
  - id: P-07
    type: match
    role: supported
    purpose: method
    level: 1
    outcome: LO-02
    sections: [T02]
    minutes: 2
    errors: [E-num-counting-gaps-counted]
    prompt: "Соедини каждую карточку с выводом о парах. Сопоставляй по одному, а не сравнивай длину рядов."
    left:
      - {id: m1, text: "Кружки: о о о о о. Флажки: ф ф ф ф"}
      - {id: m2, text: "Кружки: о о о. Флажки: ф ф ф ф ф ф"}
      - {id: m3, text: "Кружки: о о о о о о о. Флажки: ф ф ф ф ф ф ф"}
      - {id: m4, text: "Кружки: о о о о о о о о. Флажки: ф ф ф ф ф ф"}
    right:
      - {id: r1, text: "поровну: пары составили все предметы"}
      - {id: r2, text: остался 1 кружок без флажка}
      - {id: r3, text: остались флажки без кружка}
      - {id: r4, text: "кружков на 2 больше, чем флажков"}
      - {id: r5, text: кружков и флажков по 10}
    answer:
      - {left: m1, right: r2}
      - {left: m2, right: r3}
      - {left: m3, right: r1}
      - {left: m4, right: r4}
    hints:
      - "Вывод зависит от остатка, а не от того, какой ряд длиннее."
      - "Соедини по одному все предметы короткого ряда и посмотри, что осталось."
      - "Начни с первой карточки: Кружки: о о о о о. Флажки: ф ф ф ф — соедини по одному и посмотри, кто остался без пары."
    solution: |-
      ### Ответ
      m1 — r2 (остался 1 кружок без флажка); m2 — r3 (остались флажки без кружка); m3 — r1 (поровну: пары составили все предметы); m4 — r4 (кружков на 2 больше, чем флажков).
      
      ### Идея
      Ряды сравнивают парами, а не длиной: вывод зависит от того, кто остался без пары.
      
      ### Шаги
      1. Карточка 1: кружки 5, флажки 4 — остался 1 кружок без флажка
      2. Карточка 2: кружки 3, флажки 6 — остались флажки без кружка
      3. Карточка 3: кружки 7, флажки 7 — поровну: пары составили все предметы
      4. Карточка 4: кружки 8, флажки 6 — кружков на 2 больше, чем флажков
      5. Вывод r5 остался лишним: таких рядов в задании нет
      
      ### Проверка
      Каждый вывод использован один раз, лишний описывает ряды, которых в задании нет.
      
      ### Типичная ошибка
      E-num-counting-gaps-counted: длина ряда принята за количество предметов.
