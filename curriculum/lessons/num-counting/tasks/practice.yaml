# Основной банк (STANDARD.md §6–§8): 26 задач основного банка + 1 задача «на подумать» (уровень 5).
# Роли: warmup 3, supported 9, independent 14; доли уровней 10/30/30/20/10 по основному банку.
# Сквозной сюжет — класс готовит ярмарку: ложки и гости, ленты с флажками, коробки, салфетки.
# Условия перечисляют предметы рядом значков, поэтому ответ рождается счётом условия, а не числом,
# переписанным из условия (число предметов в условии не называется намеренно).
tasks:
  - id: P-01
    type: number
    role: warmup
    purpose: procedure
    level: 0
    outcome: LO-01
    sections: [T01]
    minutes: 1
    errors: [E-num-counting-skip-one]
    prompt:
      "Ложки на столе: {{row}}. Посчитай их и ответь числом: сколько ложек на столе?"
    answer: 5
    variants:
      - params: {row: о о о о о}
        answer: 5
        solution: |
          ### Ответ
          5

          ### Идея
          Каждому предмету — своё число; ответ — последнее названное число.

          ### Шаги
          1. Считаем по порядку: 1, 2, 3, 4, 5 — по числу на каждую ложку.
          2. Последнее названное число — 5, его и называем ответом.
          3. Пересчитываем с другого края ряда: итог тот же.

          ### Проверка
          Названных чисел 5 — столько же, сколько ложек.

          ### Типичная ошибка
          E-num-counting-skip-one: счёт сбился на одно число, и итог не совпал с количеством предметов.
      - params: {row: о о о о о о о}
        answer: 7
        solution: |
          ### Ответ
          7

          ### Идея
          Каждому предмету — своё число; ответ — последнее названное число.

          ### Шаги
          1. Считаем по порядку: 1, 2, 3, 4, 5, 6, 7 — по числу на каждую ложку.
          2. Последнее названное число — 7, его и называем ответом.
          3. Пересчитываем с другого края ряда: итог тот же.

          ### Проверка
          Названных чисел 7 — столько же, сколько ложек.

          ### Типичная ошибка
          E-num-counting-skip-one: счёт сбился на одно число, и итог не совпал с количеством предметов.
    hints:
      - Дотрагивайся до каждой ложки и только тогда называй новое число.
      - "Начни с любого края ряда: первое названное число — «один»."
      - "В условии ряд значков: {{row}} — поставь на каждый по одному числу."
    solution: |
      ### Ответ
      ответ задачи

      ### Идея
      Считаем группу по одному предмету: одно число — один предмет.

      ### Шаги
      1. Дотрагиваемся до первого предмета и называем «один».
      2. Переходим к следующему предмету — следующее число по порядку.
      3. Последнее названное число и есть ответ на вопрос «сколько?».

      ### Проверка
      Чисел названо столько же, сколько предметов в ряду.

      ### Типичная ошибка
      E-num-counting-skip-one: счёт сбился на одно число, и итог не совпал с количеством предметов.
    feedback:
      correct: "Верно, P-01: группа посчитана по одному предмету."
      wrong:
        what: Ложек посчитано неверно.
        why: Одно число могло достаться двум предметам или не достаться ни одному.
        fix: Пересчитайте, отодвигая посчитанные предметы в сторону.
        next: Пример 1 раздела T01.
  - id: P-02
    type: number
    role: warmup
    purpose: procedure
    level: 0
    outcome: LO-01
    sections: [T01]
    minutes: 1
    errors: [E-num-counting-skip-one]
    prompt: "Мальчик считал чашки и назвал числа: {{row}}. Сколько чашек он посчитал?"
    answer: 6
    variants:
      - params: {row: "1, 2, 3, 4, 5, 6"}
        answer: 6
        solution: |
          ### Ответ
          6

          ### Идея
          Сколько чисел названо, столько предметов посчитано.

          ### Шаги
          1. Числа идут по порядку: 1, 2, 3, 4, 5, 6.
          2. Всего названо 6 чисел, значит чашек 6.
          3. Последнее число ряда совпадает с количеством названных чисел.

          ### Проверка
          Ряд начался с единицы и шёл без пропусков: 6 чисел — 6 чашек.

          ### Типичная ошибка
          E-num-counting-skip-one: число пропущено, и итог меньше количества предметов.
      - params: {row: "1, 2, 3, 4, 5, 6, 7, 8"}
        answer: 8
        solution: |
          ### Ответ
          8

          ### Идея
          Сколько чисел названо, столько предметов посчитано.

          ### Шаги
          1. Числа идут по порядку: 1, 2, 3, 4, 5, 6, 7, 8.
          2. Всего названо 8 чисел, значит чашек 8.
          3. Последнее число ряда совпадает с количеством названных чисел.

          ### Проверка
          Ряд начался с единицы и шёл без пропусков: 8 чисел — 8 чашек.

          ### Типичная ошибка
          E-num-counting-skip-one: число пропущено, и итог меньше количества предметов.
    hints:
      - "Считай названные числа: по одному на каждое слово."
      - Ряд начался с числа «один» и шёл по порядку.
      - "Посчитай числа в ряду: {{row}}."
    solution: |
      ### Ответ
      ответ задачи

      ### Идея
      Каждому предмету соответствует одно названное число.

      ### Шаги
      1. Считаем, сколько чисел прозвучало.
      2. Сверяем с числом предметов.
      3. Отвечаем числом предметов.

      ### Проверка
      Последнее названное число и количество названных чисел совпадают.

      ### Типичная ошибка
      E-num-counting-skip-one: число пропущено, и итог меньше количества предметов.
    feedback:
      correct: "Верно, P-02: названных чисел и предметов одинаковое количество."
      wrong:
        what: Число названных чисел и число предметов разошлись.
        why: В ряду чисел мог быть пропуск или повтор.
        fix: Прочитайте ряд чисел ещё раз и посчитайте слова по одному.
        next: Пример 3 раздела T01.
  - id: P-03
    type: table-fill
    role: warmup
    purpose: procedure
    level: 0
    outcome: LO-02
    sections: [T02]
    minutes: 1
    errors: [E-num-counting-gaps-counted]
    prompt:
      В таблице записано, сколько гостей ждёт и сколько предметов приготовили для ярмарки. Заполни последнюю колонку словами «да» или «нет», составляя пары по одному.
    table:
      columns: [что раздаём, гостей, предметов, хватит ли каждому]
      rows: [[ложек, 5, 5, null], [стаканов, 7, 5, null], [салфеток, 4, 6, null]]
    shape: [3, 4]
    answer: [{r: 0, c: 3, value: да}, {r: 1, c: 3, value: нет}, {r: 2, c: 3, value: да}]
    hints:
      - Каждому гостю — один предмет.
      - Сравнивай количество гостей и предметов, а не то, какая строка длиннее.
      - В первой строке гостей 5 — начни с неё и посчитай пары.
    solution: |
      ### Ответ
      ложек — да; стаканов — нет; салфеток — да.

      ### Идея
      Предметов хватает, когда после составления пар не осталось ни одного гостя без пары.

      ### Шаги
      1. ложек: гостей 5, предметов 5; остатка нет
      2. стаканов: гостей 7, предметов 5; без пары остаются 2 гостей
      3. салфеток: гостей 4, предметов 6; остатка нет

      ### Проверка
      Там, где остатка нет, пары составили всех гостей.

      ### Типичная ошибка
      E-num-counting-gaps-counted: сравнить ряды по длине вместо сопоставления по одному.
    feedback:
      correct: "Верно, P-03: вывод сделан по остатку пар."
      wrong:
        what: Вывод в таблице неверный.
        why: Числа сравнили на глаз или перепутали колонки.
        fix: "Посчитайте по одному: хватит ли предмета каждому гостю."
        next: Виджет-таблица в разделе T02.
