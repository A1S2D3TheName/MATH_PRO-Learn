context_id: fair-table
scenario:
  "Класс накрывает стол для ярмарки: ложки, чашки и лента с флажками. Каждый шаг цепочки опирается на предыдущие: сначала считают группы, затем составляют из них пары, затем проверяют, что перекладывание число не меняет, и находят место предмета на ленте."
