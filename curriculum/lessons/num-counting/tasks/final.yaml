        answer: 8
        solution: |
          ### Ответ
          8

          ### Идея
          Каждой ложке — своё число; ответ — последнее названное число.

          ### Шаги
          1. Считаем по порядку: 1, 2, 3, 4, 5, 6, 7, 8.
          2. Последнее число — 8, его и называем.
          3. Начали с другого края — получилось то же число.

          ### Проверка
          Чисел названо 8 — столько же, сколько ложек.

