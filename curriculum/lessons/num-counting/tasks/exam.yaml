      - id: EA-01
        type: number
        role: exam
        purpose: procedure
        level: 0
        outcome: LO-01
        sections: [T01]
        minutes: 2
        points: 1
        errors: [E-num-counting-skip-one]
        prompt:
          "На верёвке сушатся носки: б б б б б б. Посчитай их и ответь числом: сколько носков на верёвке?"
        answer: 6
        hints:
          - Дотрагивайся до каждого носка и только тогда называй новое число.
          - "Начни с любого края верёвки: первое число — «один»."
          - Первому носку дай число 1, второму — 2, и так до конца верёвки.
        solution: |
          ### Ответ
          6

          ### Идея
          Каждому предмету — своё число; ответ — последнее названное число.

          ### Шаги
          1. Считаем по порядку: 1, 2, 3, 4, 5, 6.
          2. Последнее число — 6.
          3. Пересчитали с другого края — снова 6.

          ### Проверка
          Чисел названо 6 — столько же, сколько носков.

          ### Типичная ошибка
          E-num-counting-skip-one: носок остался без числа, итог меньше на единицу.
        feedback:
          correct: "Верно, EA-01: счёт не сбился."
          wrong:
            what: Ответ не совпал с пересчётом группы.
            why: "Вероятен сбой счёта: число пропущено или повторено."
            fix: Пересчитайте, отодвигая посчитанные предметы.
            next: Разбор в разделе теории.
