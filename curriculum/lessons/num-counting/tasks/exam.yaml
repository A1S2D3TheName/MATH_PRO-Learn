      - id: EA-03
        type: table-fill
        role: exam
        purpose: procedure
        level: 1
        outcome: LO-02
        sections: [T02]
        minutes: 3
        points: 1
        errors: [E-num-counting-gaps-counted]
        prompt:
          "В таблице записано, сколько детей встало в очередь к прилавку и сколько пряников им приготовили. Заполни последнюю колонку словами «да» или «нет»: хватит ли пряник каждому ребёнку."
        answer:
          - {r: 0, c: 2, value: да}
          - {r: 1, c: 2, value: нет}
          - {r: 2, c: 2, value: да}
        hints:
          - Каждому ребёнку — один пряник.
          - Сравнивай количество детей и пряников, а не то, какая строка длиннее.
          - "В первой строке детей 6: посчитай пары и начни с неё."
        solution: |
          ### Ответ
          первая строка — да, вторая — нет, третья — да

          ### Идея
          Пряников хватает, когда после составления пар ни один ребёнок не остался без пряника.

          ### Шаги
          1. Строка 1: детей 6, пряников 6 — остатка нет, хватит.
          2. Строка 2: детей 8, пряников 6 — двое остались без пряника, не хватит.
          3. Строка 3: детей 5, пряников 9 — пар хватает всем, да.

          ### Проверка
          Там, где детей не больше, чем пряников, остатка нет.

          ### Типичная ошибка
          E-num-counting-gaps-counted: сравнивать ряды по длине вместо сопоставления по одному.
        feedback:
          correct: "Верно, EA-03: счёт не сбился."
          wrong:
            what: Ответ не совпал с пересчётом группы.
            why: "Вероятен сбой счёта: число пропущено или повторено."
            fix: Пересчитайте, отодвигая посчитанные предметы.
            next: Разбор в разделе теории.
        table:
