          m1 — r2 (остались 2 кружка без звёздочки); m2 — r1 (поровну: пары составили все предметы); m3 — r3 (звёздочек на 4 больше, чем кружков); m4 — r4 (кружков на 4 больше, чем звёздочек).
          
