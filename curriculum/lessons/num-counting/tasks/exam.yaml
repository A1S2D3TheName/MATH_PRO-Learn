          ### Ответ
          a

          ### Идея
          Число, названное одному предмету, — это его место в ряду.

          ### Шаги
          1. Мальчик дошёл до третьего яблока.
          2. Остановился он на нём, а не на конце ряда.
          3. Значит, названо место яблока.

          ### Проверка
          Место не больше числа всех яблок в ряду.

          ### Типичная ошибка
          E-num-counting-ordinal-to-end: на вопрос о месте ответить числом всей группы.
        feedback:
