# Паспорт темы (STANDARD.md §3). Поля section/stage/hours/grade/prerequisites/scope скопированы из
# tree.yaml — не редактируйте их здесь (правило 6).
id: num-counting
title: "Счёт предметов и смысл количества"
section: num
stage: 1
hours: 2
grade: "1"
prerequisites: []
scope: >
  Только количество и порядок; запись цифрами — в num-digits.
version: "0.1.0"
summary: >
  Тема учит считать группу предметов так, чтобы последнее названное число было ответом на вопрос
  «сколько всего», сравнивать две группы сопоставлением по одному без пересчёта и различать вопросы
  «сколько всего?» и «который по счёту?». Отдельный раздел показывает, что если предметы
  переложить, число не меняется, и учит считать большую группу рядами, отодвигая посчитанные.

search:
  synonyms:
    - счёт предметов
    - количество предметов
    - пересчёт группы
    - «один предмет — одно число»
    - которое число названо последним
    - порядковый счёт
    - который по счёту
    - равночисленность групп
    - сопоставление двух групп по одному
    - взаимно однозначное соответствие
    - сохранение количества при перестановке
    - счёт рядами до двадцати
  questions:
    - Как научить первоклассника считать предметы и не сбиваться?
    - Что значит «число как ответ на вопрос сколько»?
    - Как объяснить разницу между «сколько всего» и «который по счёту»?
    - Как сравнить две группы, не пересчитывая ни одну из них?
    - Что такое равночисленность групп в первом классе?
    - Почему ребёнок правильно называет числа, но ошибается в итоге счёта?
    - Как считать предметы рядами, чтобы не потерять начало и конец?
    - Как проверить, что число предметов не изменилось, если их раздвинуть или сложить в стопку?
    - Что делать, если ученик считает пустые места между предметами?
    - Как проверить, что ученик понимает счёт, а не повторяет числа наизусть?

subtopics:
  - id: num-counting/kolichestvo-i-vzaimno-odnoznachnoe
    title: "Количество и взаимно однозначное соответствие"
    tree_ref: "Количество и взаимно однозначное соответствие"
    synonyms: ["сопоставление по одному", "пара предмет — число", "один предмет — одно число"]
    sections: [T01, T02, T03, T04]
  - id: num-counting/poryadkovyy-i-kolichestvennyy-schet
    title: "Порядковый и количественный счёт"
    tree_ref: "Порядковый и количественный счёт"
    synonyms: ["который по счёту", "место предмета в ряду", "количество группы"]
    sections: [T03, T05]
  - id: num-counting/ravnochislennost-grupp-bez-perescheta
    title: "Равночисленность групп без пересчёта"
    tree_ref: "Равночисленность групп без пересчёта"
    synonyms: ["сравнение групп парами", "хватит ли всем", "поровну ли без счёта"]
    sections: [T02]
  - id: num-counting/chislo-kak-otvet-na
    title: "Число как ответ на вопрос «сколько»"
    tree_ref: "Число как ответ на вопрос «сколько»"
    synonyms: ["итог счёта", "последнее названное число", "сколько всего"]
    sections: [T01, T04, T05]

outcomes:
  - id: LO-01
    short: "Счёт группы и итоговое число"
    action: >-
      Считает группу предметов, называя каждому по одному числу, и называет число — ответ на вопрос
      «сколько всего»
    conditions: >-
      группа до 10 предметов, лежащих в ряд или вразброс; начало счёта и направление выбирают сами;
      ответ называют числом, а не записью
    criterion: >-
      названное число совпадает с числом предметов, при повторном счёте получается то же число, а
      названных чисел столько же, сколько предметов
    level: core
    sections: [T01]
  - id: LO-02
    short: "Пары и место в ряду"
    action: >-
      Сравнивает две группы сопоставлением по одному и называет место предмета в ряду при счёте
      с любого края
    conditions: >-
      в каждой группе до 10 предметов; сравнение ведут без пересчёта, по остатку пар; вопрос о месте
      задан после указания края, с которого начинают счёт
    criterion: >-
      вывод «поровну» или «больше та группа, где остался остаток» сделан по парам; место предмета
      названо числом, произнесённым самому предмету, и не больше числа всех предметов ряда
    level: standard
    sections: [T02, T03]
  - id: LO-03
    short: "Счёт до двадцати и сохранение"
    action: >-
      Считает группу до 20 предметов рядами и пометками, проверяет пересчётом и объясняет, что
      если предметы переложить, их число не меняется
    conditions: >-
      группа от 11 до 20 предметов; предметы перекладывают, раскладывают стопками или раздвигают;
      ответ проверяют вторым счётом в другом порядке
    criterion: >-
      после перекладывания названо то же число, два пересчёта в разном порядке дают одно число,
      ряд названных чисел идёт без пропусков и повторов
    level: deep
    sections: [T04, T05]

errors:
  - E-num-counting-skip-one
  - E-num-counting-double-told
  - E-num-counting-twice-each
  - E-num-counting-ordinal-to-end
  - E-num-counting-ordinal-before
  - E-num-counting-gaps-counted
