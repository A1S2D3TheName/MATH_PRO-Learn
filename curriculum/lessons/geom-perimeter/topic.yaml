# Паспорт темы (STANDARD.md §3). Поля section/stage/hours/grade/prerequisites скопированы из
# tree.yaml без изменений (правило 6); поля scope у темы в дереве нет.
id: geom-perimeter
title: "Периметр многоугольника"
section: geom
stage: 1
hours: 2
grade: "2–3"
prerequisites: [geom-measure, num-add-column]
version: "0.1.0"
summary: >-
  Периметр — длина границы фигуры: сумма длин всех её сторон в одной единице длины. Тема учит
  находить периметр многоугольника, прямоугольника и квадрата, восстанавливать сторону по
  периметру и отличать периметр от числа клеток внутри фигуры.

search:
  synonyms:
    - периметр
    - периметр многоугольника
    - периметр прямоугольника
    - периметр квадрата
    - формула периметра прямоугольника
    - длина границы фигуры
    - сумма длин сторон
    - обход фигуры по контуру
    - длина забора вокруг участка
    - сколько нужно плинтуса
    - сторона по периметру
    - периметр и площадь
  questions:
    - Как найти периметр многоугольника?
    - Как найти периметр прямоугольника, если известны длина и ширина?
    - Как найти периметр квадрата по его стороне?
    - Как найти сторону квадрата, если известен периметр?
    - Как найти ширину прямоугольника по периметру и длине?
    - Чем периметр отличается от площади?
    - Сколько метров забора нужно, чтобы огородить прямоугольный участок?
    - Почему прямоугольники с одинаковым периметром могут занимать разное место?
    - Какими единицами измеряют периметр?

subtopics:
  - id: geom-perimeter/perimetr-kak-summa-dlin
    title: "Периметр как сумма длин сторон"
    tree_ref: "Периметр как сумма длин сторон"
    synonyms: [длина границы, обход по контуру, сумма сторон многоугольника]
    sections: [T01]
  - id: geom-perimeter/perimetr-pryamougolnika-i-kvadrata
    title: "Периметр прямоугольника и квадрата"
    tree_ref: "Периметр прямоугольника и квадрата"
    synonyms: [формула периметра прямоугольника, периметр квадрата, длина и ширина]
    sections: [T02]
  - id: geom-perimeter/nahozhdenie-storony-po-perimetru
    title: "Нахождение стороны по периметру"
    tree_ref: "Нахождение стороны по периметру"
    synonyms: [неизвестная сторона, ширина по периметру, сторона квадрата по периметру]
    sections: [T03]
  - id: geom-perimeter/sravnenie-perimetra-i-ploschadi
    title: "Сравнение периметра и площади на одной фигуре"
    tree_ref: "Сравнение периметра и площади на одной фигуре"
    synonyms: [периметр или площадь, граница и клетки внутри, забор или газон]
    sections: [T04, T05]

outcomes:
  - id: LO-01
    short: Находит периметр и сторону по периметру
    action: >-
      вычисляет периметр многоугольника сложением длин сторон, у прямоугольника и квадрата
      восстанавливает неподписанные стороны и находит неизвестную сторону по периметру
    conditions: >-
      длины сторон — натуральные числа до 1000 в одной единице или в метрах и сантиметрах с
      переводом; сложение и вычитание письменно; без калькулятора
    criterion: >-
      учитывает каждую сторону ровно один раз, записывает ответ в единицах длины и проверяет
      найденную сторону сложением всех сторон
    level: core
    sections: [T01, T02, T03]
  - id: LO-02
    short: Отличает периметр от площади
    action: >-
      определяет, что нужно найти в ситуации — длину границы или число клеток внутри, — и
      вычисляет обе величины для фигуры на клетчатой бумаге
    conditions: >-
      прямоугольники и фигуры из клеток с длиной стороны до 12 клеток; сторона клетки — единица
      длины
    criterion: >-
      называет величину и её единицы (отрезки границы или клетки) и не подменяет одну величину другой
    level: standard
    sections: [T04]
  - id: LO-03
    short: Исследует фигуры с одним периметром
    action: >-
      перебирает прямоугольники с данным периметром и целыми сторонами, сравнивает их площади и
      определяет, как меняется периметр при перекраивании фигуры из клеток
    conditions: >-
      периметр — чётное число до 40 единиц, стороны — натуральные числа; фигуры из клеток до 100 клеток
    criterion: >-
      перечисляет все прямоугольники без пропусков и повторов и обосновывает ответ пересчётом границы
    level: deep
    sections: [T04, T05]

