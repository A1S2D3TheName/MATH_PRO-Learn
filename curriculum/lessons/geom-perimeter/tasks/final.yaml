      2. Пополам: $14 + 14 = 28$.
      3. Ещё пополам: $7 + 7 = 14$.

      ### Проверка
      $7 + 7 + 7 + 7 = 28$.

      ### Типичная ошибка
      Ответить 14 — это две стороны квадрата.
