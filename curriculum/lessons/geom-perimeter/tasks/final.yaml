- id: F-02
  type: number
  role: final-step
  purpose: transfer
  level: 2
  outcome: LO-01
  sections:
  - T02
  minutes: 1
  prompt: Участок {{a}} м на {{b}} м огораживают забором по всей границе, оставляя проём для ворот шириной {{g}}
    м. Сколько метров забора нужно?
  depends_on:
  - F-01
  answer: 22
  hints:
  - Забор идёт по периметру, кроме ворот.
  - Периметр минус ширина ворот.
  - Возьмите периметр участка из прошлого шага и вычтите {{g}}.
  solution: |
    ### Ответ
    Периметр без ворот.

    ### Идея
    Минус проём.

    ### Шаги
    1. Периметр.
    2. Вычитание.

    ### Проверка
    Сумма.

    ### Типичная ошибка
    Ворота.
  feedback:
    correct: 'Верно: забор — периметр участка без проёма ворот.'
    wrong:
      what: Длина забора не совпала.
      why: Возможно, ворота не вычтены.
      fix: Вычтите {{g}} из периметра участка.
      next: T02, пример 2.
  variants:
  - params:
      a: 8
      b: 4
      g: 2
    answer: 22
    solution: |
      ### Ответ
      22 м забора

      ### Идея
      Забор — периметр без проёма ворот.

      ### Шаги
      1. Периметр: $8 + 4 + 8 + 4 = 24$ м.
      2. Без ворот: $24 - 2 = 22$ м.

      ### Проверка
      $22 + 2 = 24$.

      ### Типичная ошибка
      Не вычесть ворота и ответить 24.
  - params:
      a: 9
      b: 5
      g: 3
    answer: 25
    solution: |
