# Финальная цепочка: один сюжет «дача», 6 шагов, 6 вариантов с общими параметрами.
title: Забор и клетки на даче
context_id: dacha-plots
scenario: |
  Дачный участок — прямоугольник {{a}} м на {{b}} м. Его огораживают, размечают на клетки 1 м на 1 м и сравнивают с соседними участками.
tasks:
- id: F-01
  type: number
  role: final-step
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T02
  minutes: 1
  prompt: Участок — прямоугольник {{a}} м на {{b}} м. Найдите его периметр в метрах.
  answer: 24
  hints:
  - Периметр — длина границы участка.
  - Две длины и две ширины.
  - 'Половина обхода: {{a}} + {{b}}; весь обход — две такие половины.'
  solution: |
    ### Ответ
    Периметр участка.

    ### Идея
    Две длины и две ширины.

    ### Шаги
    1. Стороны.
    2. Сумма.

    ### Проверка
    По кругу.

    ### Типичная ошибка
    Половина.
  feedback:
    correct: 'Верно: периметр участка — две длины и две ширины.'
    wrong:
      what: Периметр участка не совпал.
      why: Возможно, сложены только длина и ширина или посчитаны клетки.
      fix: Сложите {{a}} + {{b}} + {{a}} + {{b}}.
      next: T02, пример 1.
    misconceptions:
    - id: E-geom-perimeter-half
      when:
        expr: a + b
      message: 'Это половина границы участка: добавьте вторую длину и вторую ширину.'
    - id: E-geom-perimeter-area
      when:
        expr: a * b
      message: Это число клеток 1 м на 1 м внутри, а периметр — длина границы.
  variants:
  - params:
      a: 8
      b: 4
    answer: 24
    solution: |
      ### Ответ
      $P = 24$ м

      ### Идея
      У прямоугольника противоположные стороны равны, поэтому обход — длина, ширина, длина, ширина.

      ### Шаги
      1. Восстанавливаем стороны: 8, 4, 8, 4 м.
      2. Половина обхода: $8 + 4 = 12$.
      3. Весь обход — две половины: $12 + 12 = 24$.

      ### Проверка
      Сложим по кругу: $8 + 4 + 8 + 4 = 24$.

      ### Типичная ошибка
      Сложить только подписанные стороны: $8 + 4 = 12$ — это половина периметра, а не весь.
  - params:
      a: 9
      b: 5
    answer: 28
    solution: |
      ### Ответ
      $P = 28$ м

      ### Идея
      У прямоугольника противоположные стороны равны, поэтому обход — длина, ширина, длина, ширина.

      ### Шаги
      1. Восстанавливаем стороны: 9, 5, 9, 5 м.
      2. Половина обхода: $9 + 5 = 14$.
      3. Весь обход — две половины: $14 + 14 = 28$.

      ### Проверка
