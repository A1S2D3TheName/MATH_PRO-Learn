      1. Периметр: $9 + 5 + 9 + 5 = 28$ м.
      2. Без ворот: $28 - 3 = 25$ м.

      ### Проверка
      $25 + 3 = 28$.

      ### Типичная ошибка
      Не вычесть ворота и ответить 28.
  - params:
