- id: F-05
  type: number
  role: final-step
  purpose: meaning
  level: 2
  outcome: LO-02
  sections:
  - T04
  minutes: 1
  prompt: 'Сравните участки: прямоугольный {{a}} м на {{b}} м и квадратный с тем же периметром. На сколько клеток
    1 м на 1 м внутри квадратного участка больше?'
  depends_on:
  - F-03
  - F-04
  answer: 4
  hints:
  - Одинаковый периметр не означает одинаковое число клеток.
  - Посчитайте клетки квадратного участка по рядам и сравните с прямоугольным.
  - Сторона квадрата найдена в прошлом шаге; число клеток прямоугольника — в третьем.
  solution: |
    ### Ответ
    Разница клеток.

    ### Идея
    Периметр один — клеток разное число.

    ### Шаги
    1. Квадрат.
    2. Прямоугольник.
    3. Разница.

    ### Проверка
    Сложение.

    ### Типичная ошибка
    Ответить 0.
  feedback:
    correct: 'Верно: при одинаковом периметре у квадрата больше клеток внутри.'
    wrong:
      what: Разница не совпала.
      why: Возможно, решено, что при одном периметре клеток поровну.
      fix: Посчитайте клетки обоих участков и вычтите.
      next: T04, пример 2.
  variants:
  - params:
      a: 8
      b: 4
    answer: 4
    solution: |
      ### Ответ
      На 4 клетки

      ### Идея
      Периметры равны, а клеток внутри разное число: у квадрата больше.

      ### Шаги
      1. Сторона квадрата 6 м, клеток: $6 + 6 + 6 + 6 + 6 + 6 = 36$.
      2. У прямоугольника 32 клеток.
      3. Разница: $36 - 32 = 4$.

      ### Проверка
