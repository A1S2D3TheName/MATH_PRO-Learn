- id: F-03
  type: number
  role: final-step
  purpose: meaning
  level: 1
  outcome: LO-02
  sections:
  - T04
  minutes: 1
  prompt: План участка {{a}} м на {{b}} м разбит на клетки 1 м на 1 м. Сколько клеток внутри участка?
  depends_on:
  - F-01
  answer: 32
  hints:
  - Теперь нужна не граница, а клетки внутри.
  - Считайте по рядам.
  - В ряду {{a|pl:клетка,клетки,клеток}}; рядов столько, какова ширина.
  solution: |
    ### Ответ
    Клетки внутри.

    ### Идея
    По рядам.

    ### Шаги
    1. Ряды.
    2. Сумма.

    ### Проверка
    По столбцам.

    ### Типичная ошибка
    Периметр.
  feedback:
    correct: 'Верно: клетки внутри посчитаны по рядам.'
    wrong:
      what: Число клеток не совпало.
      why: Возможно, взят периметр вместо клеток.
      fix: Сложите ряды по {{a}}.
      next: T04, пример 1.
  variants:
  - params:
      a: 8
      b: 4
    answer: 32
    solution: |
      ### Ответ
      32 клетки

      ### Идея
      Клетки внутри считают по рядам.

      ### Шаги
      1. 4 ряда по 8 клеток.
      2. $8 + 8 + 8 + 8 = 32$.

      ### Проверка
      По столбцам: $4 + 4 + 4 + 4 + 4 + 4 + 4 + 4 = 32$.

      ### Типичная ошибка
      Назвать периметр 24 вместо числа клеток.
  - params:
      a: 9
      b: 5
    answer: 45
    solution: |
      ### Ответ
      45 клеток

      ### Идея
