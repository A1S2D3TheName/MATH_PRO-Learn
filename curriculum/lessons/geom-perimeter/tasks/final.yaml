      ### Идея
      Клетки внутри считают по рядам.

      ### Шаги
      1. 7 рядов по 9 клеток.
      2. $9 + 9 + 9 + 9 + 9 + 9 + 9 = 63$.

      ### Проверка
      По столбцам: $7 + 7 + 7 + 7 + 7 + 7 + 7 + 7 + 7 = 63$.

      ### Типичная ошибка
