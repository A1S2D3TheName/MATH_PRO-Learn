      ### Проверка
      По столбцам: $5 + 5 + 5 + 5 + 5 + 5 + 5 + 5 + 5 = 45$.

      ### Типичная ошибка
      Назвать периметр 28 вместо числа клеток.
  - params:
      a: 10
      b: 4
    answer: 40
    solution: |
      ### Ответ
      40 клеток

      ### Идея
      Клетки внутри считают по рядам.

      ### Шаги
      1. 4 ряда по 10 клеток.
      2. $10 + 10 + 10 + 10 = 40$.

      ### Проверка
      По столбцам: $4 + 4 + 4 + 4 + 4 + 4 + 4 + 4 + 4 + 4 = 40$.

      ### Типичная ошибка
      Назвать периметр 28 вместо числа клеток.
  - params:
      a: 7
      b: 3
    answer: 21
    solution: |
      ### Ответ
      21 клетка

      ### Идея
      Клетки внутри считают по рядам.

      ### Шаги
      1. 3 ряда по 7 клеток.
      2. $7 + 7 + 7 = 21$.

      ### Проверка
      По столбцам: $3 + 3 + 3 + 3 + 3 + 3 + 3 = 21$.

      ### Типичная ошибка
