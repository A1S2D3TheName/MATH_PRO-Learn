      Сторона 5 м

      ### Идея
      Периметр квадрата такой же; делим его пополам дважды.

      ### Шаги
      1. Периметр: $7 + 3 + 7 + 3 = 20$ м.
      2. Пополам: $10 + 10 = 20$.
      3. Ещё пополам: $5 + 5 = 10$.

      ### Проверка
