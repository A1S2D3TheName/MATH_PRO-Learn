- id: F-04
  type: number
  role: final-step
  purpose: procedure
  level: 2
  outcome: LO-01
  sections:
  - T03
  minutes: 1
  prompt: Соседний участок квадратный, и забор вокруг него такой же длины, как периметр участка {{a}} м на {{b}}
    м. Найдите сторону квадратного участка в метрах.
  depends_on:
  - F-01
  answer: 6
  hints:
  - Периметры одинаковые.
  - Периметр квадрата пополам — две стороны, ещё пополам — одна.
  - Возьмите периметр из первого шага и разделите его пополам.
  solution: |
    ### Ответ
    Четверть периметра.

    ### Идея
    Дважды пополам.

    ### Шаги
    1. Периметр.
    2. Пополам.
    3. Ещё раз.

    ### Проверка
    Четыре стороны.

    ### Типичная ошибка
    Одна половина.
  feedback:
    correct: 'Верно: периметр квадрата разделён на четыре равные стороны.'
    wrong:
      what: Сторона не совпала.
      why: Возможно, периметр разделён пополам только один раз.
      fix: Разделите периметр пополам дважды.
      next: T03, пример 3.
  variants:
  - params:
      a: 8
      b: 4
    answer: 6
    solution: |
      ### Ответ
      Сторона 6 м

      ### Идея
      Периметр квадрата такой же; делим его пополам дважды.

      ### Шаги
      1. Периметр: $8 + 4 + 8 + 4 = 24$ м.
      2. Пополам: $12 + 12 = 24$.
      3. Ещё пополам: $6 + 6 = 12$.

      ### Проверка
      $6 + 6 + 6 + 6 = 24$.

      ### Типичная ошибка
      Ответить 12 — это две стороны квадрата.
