    answer: 56
    hints:
    - Периметр у всех вариантов один.
    - Сравните пары с одной суммой; ближе к квадрату — больше клеток.
    - Половина от 30 — сумма длины и ширины.
    solution: |
      ### Ответ
      56 клеток

      ### Идея
      При одном периметре больше всего клеток у прямоугольника с самыми близкими сторонами.

      ### Шаги
      1. $15 + 15 = 30$; стороны с суммой 15: ближе всего 7 и 8.
      2. 7 рядов по 8: $8 + 8 + 8 + 8 + 8 + 8 + 8 = 56$.

      ### Проверка
      Пара 6 и 9 даёт $9 + 9 + 9 + 9 + 9 + 9 = 54$ — меньше.

      ### Типичная ошибка
      Выбрать вытянутый вольер.
    feedback:
