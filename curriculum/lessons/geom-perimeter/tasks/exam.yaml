  - id: EA-06
    type: number
    role: exam
    purpose: procedure
    level: 2
    points: 2
    outcome: LO-01
    sections:
    - T03
    minutes: 3
    prompt: Периметр прямоугольника 64 см, длина 19 см. Найдите ширину в сантиметрах.
    answer: 13
    hints:
    - Периметр — две длины и две ширины.
    - Вычтите обе длины, остаток поделите пополам.
    - 'Две длины: 19 + 19.'
    solution: |
      ### Ответ
      Ширина 13 см

      ### Идея
      Периметр — две длины и две ширины. Известную сторону вычитаем дважды, остаток делим поровну.

      ### Шаги
      1. Две известные стороны: $19 + 19 = 38$.
      2. Остаток на две другие стороны: $64 - 38 = 26$.
      3. Половина остатка: $13 + 13 = 26$, значит, ширина 13 см.

      ### Проверка
      $19 + 13 + 19 + 13 = 64$ — совпадает с периметром.

      ### Типичная ошибка
      Вычесть известную сторону один раз: $64 - 19 = 45$ — такой стороны быть не может, она больше половины периметра. Или забыть разделить остаток: 26 — это две стороны вместе.
    feedback:
      correct: 'Верно: две длины вычтены, остаток разделён на две ширины.'
      wrong:
        what: Ширина не совпала.
        why: Возможно, длина вычтена один раз или остаток не разделён.
        fix: Проверьте сложением сторон.
        next: T03, пример 2.
