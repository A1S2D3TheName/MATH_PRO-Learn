  tasks:
  - id: EA-01
    type: number
    role: exam
    purpose: procedure
    level: 0
    points: 1
    outcome: LO-01
    sections:
    - T01
    minutes: 2
    prompt: Стороны треугольного газона — 14 м, 9 м и 17 м. Найдите его периметр в метрах.
    answer: 40
    hints:
    - Периметр — сумма сторон.
    - Сложите три стороны по одной.
    - Начните с 14 + 9.
    solution: |
      ### Ответ
      $P = 40$ м

      ### Идея
      Периметр газона — сумма длин всех его сторон, каждая берётся один раз.

      ### Шаги
      1. Сторон 3, все в одной единице — м.
      2. Складываем по очереди: $14 + 9 = 23$, $23 + 17 = 40$.
      3. Периметр равен 40 м.

      ### Проверка
      Сложим в обратном порядке: $17 + 9 = 26$, $26 + 14 = 40$. Итог тот же.

      ### Типичная ошибка
      Пропустить одну сторону: без последней стороны получится 23 м — это не весь обход. Отмечайте стороны по кругу.
    feedback:
      correct: 'Верно: три стороны газона дают периметр.'
      wrong:
        what: Периметр газона не совпал.
        why: Возможно, пропущена сторона.
        fix: Сложите три стороны и проверьте в обратном порядке.
        next: T01, пример 1.
  - id: EA-02
    type: number
    role: exam
    purpose: procedure
    level: 1
    points: 1
    outcome: LO-01
    sections:
    - T02
    minutes: 2
    prompt: Прямоугольная площадка имеет длину 23 м и ширину 15 м. Сколько метров ограды нужно вокруг неё?
    answer: 76
    hints:
    - Ограда идёт по периметру.
    - Две длины и две ширины.
    - 'Половина обхода: 23 + 15.'
    solution: |
      ### Ответ
      $P = 76$ м

      ### Идея
      У прямоугольника противоположные стороны равны, поэтому обход — длина, ширина, длина, ширина.

      ### Шаги
      1. Восстанавливаем стороны: 23, 15, 23, 15 м.
      2. Половина обхода: $23 + 15 = 38$.
      3. Весь обход — две половины: $38 + 38 = 76$.

      ### Проверка
      Сложим по кругу: $23 + 15 + 23 + 15 = 76$.

      ### Типичная ошибка
      Сложить только подписанные стороны: $23 + 15 = 38$ — это половина периметра, а не весь.
    feedback:
      correct: 'Верно: ограда обходит две длины и две ширины площадки.'
      wrong:
        what: Длина ограды не совпала.
        why: Возможно, сложены только длина и ширина.
        fix: Подпишите все четыре стороны и сложите.
        next: T02, пример 2.
