      $P = 72$ см

      ### Идея
      У квадрата четыре равные стороны; периметр — их сумма.

      ### Шаги
      1. Две стороны: $18 + 18 = 36$.
      2. Четыре стороны — две такие пары: $36 + 36 = 72$.

      ### Проверка
      Сложим по одной: $18 + 18 + 18 + 18 = 72$.

      ### Типичная ошибка
      Остановиться на двух сторонах и ответить 36 — это только половина обхода.
