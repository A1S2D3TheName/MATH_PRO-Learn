      Граница состоит из сторон клеток на контуре.

      ### Шаги
      1. $8 + 3 + 8 + 3 = 22$.

      ### Проверка
      Половина: $8 + 3 = 11$, две половины — 22.

      ### Типичная ошибка
      Посчитать клетки внутри (24) или клетки вдоль края (18).
