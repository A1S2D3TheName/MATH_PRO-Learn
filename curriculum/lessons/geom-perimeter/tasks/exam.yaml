    outcome: LO-01
    sections:
    - T01
    minutes: 3
    prompt: 'Стороны многоугольного поля: 136 м, 94 м, 158 м, 107 м, 85 м. Найдите периметр поля в метрах.'
    answer: 580
    hints:
    - Периметр — сумма всех сторон.
    - Складывайте письменно, следите за переносом.
    - Начните с 136 + 94.
    solution: |
      ### Ответ
      $P = 580$ м

      ### Идея
      Периметр поля — сумма длин всех его сторон, каждая берётся один раз.

      ### Шаги
      1. Сторон 5, все в одной единице — м.
      2. Складываем по очереди: $136 + 94 = 230$, $230 + 158 = 388$, $388 + 107 = 495$, $495 + 85 = 580$.
      3. Периметр равен 580 м.

      ### Проверка
      Сложим в обратном порядке: $85 + 107 = 192$, $192 + 158 = 350$, $350 + 94 = 444$, $444 + 136 = 580$. Итог тот же.

      ### Типичная ошибка
      Пропустить одну сторону: без последней стороны получится 495 м — это не весь обход. Отмечайте стороны по кругу.
    feedback:
      correct: 'Верно: стороны поля сложены без пропусков.'
      wrong:
        what: Периметр поля не совпал.
        why: Возможно, ошибка переноса или пропущена сторона.
        fix: Сложите в столбик и проверьте.
        next: T01, пример 2.
  - id: EB-06
    type: number
    role: exam
    purpose: procedure
    level: 2
    points: 2
    outcome: LO-01
    sections:
    - T03
    minutes: 3
    prompt: Периметр прямоугольника 58 см, длина 17 см. Найдите ширину в сантиметрах.
    answer: 12
    hints:
    - Периметр — две длины и две ширины.
    - Вычтите обе длины, остаток поделите пополам.
    - 'Две длины: 17 + 17.'
    solution: |
      ### Ответ
      Ширина 12 см

      ### Идея
      Периметр — две длины и две ширины. Известную сторону вычитаем дважды, остаток делим поровну.

      ### Шаги
      1. Две известные стороны: $17 + 17 = 34$.
      2. Остаток на две другие стороны: $58 - 34 = 24$.
      3. Половина остатка: $12 + 12 = 24$, значит, ширина 12 см.

      ### Проверка
      $17 + 12 + 17 + 12 = 58$ — совпадает с периметром.

      ### Типичная ошибка
      Вычесть известную сторону один раз: $58 - 17 = 41$ — такой стороны быть не может, она больше половины периметра. Или забыть разделить остаток: 24 — это две стороны вместе.
    feedback:
      correct: 'Верно: две длины вычтены, остаток разделён на две ширины.'
      wrong:
        what: Ширина не совпала.
        why: Возможно, длина вычтена один раз или остаток не разделён.
        fix: Проверьте сложением сторон.
        next: T03, пример 2.
