# Практика темы geom-perimeter (STANDARD.md §8). Сгенерировано и проверено сценарием автора;
# каждый ответ независимо пересчитывает verify.py.
tasks:
- id: P-01
  type: number
  role: warmup
  purpose: procedure
  level: 0
  outcome: LO-01
  sections:
  - T01
  minutes: 1
  prompt: Стороны треугольника — {{a}} см, {{b}} см и {{c}} см. Найдите периметр треугольника в сантиметрах.
  answer: 17
  hints:
  - 'Периметр — длина границы: обойдите треугольник по сторонам.'
  - Сложите длины трёх сторон, каждую по одному разу.
  - 'Начните с первых двух сторон: {{a}} + {{b}}, затем прибавьте третью.'
  solution: |
    ### Ответ
    Сумма трёх сторон: {{a}}, {{b}} и {{c}} см.

    ### Идея
    Периметр треугольника — сумма длин его сторон.

    ### Шаги
    1. Складываем две стороны.
    2. Прибавляем третью.

    ### Проверка
    Сложение в другом порядке даёт тот же итог.

    ### Типичная ошибка
    Пропустить сторону и сложить только две.
  feedback:
    correct: 'Верно: стороны {{a}}, {{b}} и {{c}} см вместе дают периметр треугольника.'
    wrong:
      what: Сумма не совпала с периметром треугольника.
      why: Возможно, пропущена сторона или сбой при сложении.
      fix: Сложите {{a}} + {{b}} + {{c}} по одной стороне и проверьте сложением в обратном порядке.
      next: 'T01, пример 1: треугольник на листе.'
  variants:
  - params:
      a: 4
      b: 6
      c: 7
    answer: 17
    solution: |
      ### Ответ
      $P = 17$ см

      ### Идея
      Периметр треугольника — сумма длин всех его сторон, каждая берётся один раз.

      ### Шаги
      1. Сторон 3, все в одной единице — см.
      2. Складываем по очереди: $4 + 6 = 10$, $10 + 7 = 17$.
      3. Периметр равен 17 см.

      ### Проверка
      Сложим в обратном порядке: $7 + 6 = 13$, $13 + 4 = 17$. Итог тот же.

      ### Типичная ошибка
      Пропустить одну сторону: без последней стороны получится 10 см — это не весь обход. Отмечайте стороны по кругу.
  - params:
      a: 8
      b: 5
      c: 9
    answer: 22
    solution: |
      ### Ответ
      $P = 22$ см

      ### Идея
      Периметр треугольника — сумма длин всех его сторон, каждая берётся один раз.

      ### Шаги
      1. Сторон 3, все в одной единице — см.
      2. Складываем по очереди: $8 + 5 = 13$, $13 + 9 = 22$.
      3. Периметр равен 22 см.

      ### Проверка
      Сложим в обратном порядке: $9 + 5 = 14$, $14 + 8 = 22$. Итог тот же.

      ### Типичная ошибка
      Пропустить одну сторону: без последней стороны получится 13 см — это не весь обход. Отмечайте стороны по кругу.
  - params:
      a: 3
      b: 10
      c: 12
    answer: 25
    solution: |
      ### Ответ
      $P = 25$ см

      ### Идея
      Периметр треугольника — сумма длин всех его сторон, каждая берётся один раз.

      ### Шаги
      1. Сторон 3, все в одной единице — см.
      2. Складываем по очереди: $3 + 10 = 13$, $13 + 12 = 25$.
      3. Периметр равен 25 см.

      ### Проверка
      Сложим в обратном порядке: $12 + 10 = 22$, $22 + 3 = 25$. Итог тот же.

      ### Типичная ошибка
      Пропустить одну сторону: без последней стороны получится 13 см — это не весь обход. Отмечайте стороны по кругу.
- id: P-02
  type: number
  role: warmup
  purpose: procedure
  level: 0
  outcome: LO-01
  sections:
  - T02
  minutes: 1
  prompt: Сторона квадрата {{a}} см. Найдите периметр квадрата в сантиметрах.
  answer: 24
  hints:
  - У квадрата четыре стороны, и они равны.
  - Сложите сторону саму с собой четыре раза.
  - 'Две стороны: {{a}} + {{a}}; затем сложите две такие пары.'
  solution: |
    ### Ответ
    Четыре стороны по {{a}} см.

    ### Идея
    У квадрата четыре равные стороны.

    ### Шаги
    1. Складываем две стороны.
    2. Удваиваем результат.

    ### Проверка
    Сложение четырёх сторон по одной.

    ### Типичная ошибка
    Остановиться на двух сторонах.
  feedback:
    correct: 'Верно: четыре стороны квадрата по {{a}} см дают его периметр.'
    wrong:
      what: Периметр квадрата не совпал.
      why: Возможно, учтены не четыре стороны, а две.
      fix: Сложите {{a}} + {{a}} + {{a}} + {{a}}.
      next: 'T02, пример 3: рамка для квадратной плитки.'
  variants:
  - params:
      a: 6
    answer: 24
    solution: |
      ### Ответ
      $P = 24$ см

      ### Идея
      У квадрата четыре равные стороны; периметр — их сумма.

      ### Шаги
      1. Две стороны: $6 + 6 = 12$.
      2. Четыре стороны — две такие пары: $12 + 12 = 24$.

      ### Проверка
      Сложим по одной: $6 + 6 + 6 + 6 = 24$.

      ### Типичная ошибка
      Остановиться на двух сторонах и ответить 12 — это только половина обхода.
  - params:
      a: 11
    answer: 44
    solution: |
      ### Ответ
      $P = 44$ см

      ### Идея
      У квадрата четыре равные стороны; периметр — их сумма.

      ### Шаги
      1. Две стороны: $11 + 11 = 22$.
      2. Четыре стороны — две такие пары: $22 + 22 = 44$.

      ### Проверка
      Сложим по одной: $11 + 11 + 11 + 11 = 44$.

      ### Типичная ошибка
      Остановиться на двух сторонах и ответить 22 — это только половина обхода.
  - params:
      a: 15
    answer: 60
    solution: |
      ### Ответ
      $P = 60$ см

      ### Идея
      У квадрата четыре равные стороны; периметр — их сумма.

      ### Шаги
      1. Две стороны: $15 + 15 = 30$.
      2. Четыре стороны — две такие пары: $30 + 30 = 60$.

      ### Проверка
      Сложим по одной: $15 + 15 + 15 + 15 = 60$.

      ### Типичная ошибка
      Остановиться на двух сторонах и ответить 30 — это только половина обхода.
- id: P-03
  type: number
  role: warmup
  purpose: procedure
  level: 0
  outcome: LO-02
  sections:
  - T04
  minutes: 1
  prompt: 'Прямоугольник на клетчатой бумаге: {{a|pl:клетка,клетки,клеток}} в длину и {{b|pl:клетка,клетки,клеток}}
    в ширину. Сколько клеток внутри прямоугольника?'
  answer: 8
  hints:
  - Клетки внутри считают по рядам, а не по краю.
  - В каждом ряду столько клеток, какова длина; рядов столько, какова ширина.
  - В ряду {{a|pl:клетка,клетки,клеток}}; сложите столько таких рядов, какова ширина.
  solution: |
    ### Ответ
    Число клеток по рядам.

    ### Идея
    Клетки внутри считают по рядам.

    ### Шаги
    1. Ряд — длина.
    2. Рядов — ширина.

    ### Проверка
    Подсчёт по столбцам.

    ### Типичная ошибка
    Посчитать отрезки границы.
  feedback:
    correct: 'Верно: клетки внутри посчитаны по рядам.'
    wrong:
      what: Число клеток не совпало.
      why: Возможно, посчитаны отрезки границы вместо клеток.
      fix: 'Сложите ряды по {{a}}: их столько, какова ширина.'
      next: 'T04, пример 1: лента и плиты для газона.'
  variants:
  - params:
      a: 4
      b: 2
    answer: 8
    solution: |
      ### Ответ
      8 клеток

      ### Идея
      Клетки внутри считают по рядам: в каждом ряду столько клеток, какова длина.

      ### Шаги
      1. В одном ряду 4 клетки, рядов 2.
      2. Складываем ряды: $4 + 4 = 8$.

      ### Проверка
      Посчитаем по столбцам: столбцов 4, в каждом по 2: $2 + 2 + 2 + 2 = 8$.

      ### Типичная ошибка
      Посчитать отрезки границы вместо клеток: $4 + 2 + 4 + 2 = 12$ — это периметр, а не число клеток.
  - params:
      a: 5
      b: 3
    answer: 15
    solution: |
      ### Ответ
      15 клеток

      ### Идея
      Клетки внутри считают по рядам: в каждом ряду столько клеток, какова длина.

      ### Шаги
      1. В одном ряду 5 клеток, рядов 3.
      2. Складываем ряды: $5 + 5 + 5 = 15$.

      ### Проверка
      Посчитаем по столбцам: столбцов 5, в каждом по 3: $3 + 3 + 3 + 3 + 3 = 15$.

      ### Типичная ошибка
      Посчитать отрезки границы вместо клеток: $5 + 3 + 5 + 3 = 16$ — это периметр, а не число клеток.
  - params:
      a: 6
      b: 2
    answer: 12
    solution: |
      ### Ответ
      12 клеток

      ### Идея
      Клетки внутри считают по рядам: в каждом ряду столько клеток, какова длина.

      ### Шаги
      1. В одном ряду 6 клеток, рядов 2.
      2. Складываем ряды: $6 + 6 = 12$.

      ### Проверка
      Посчитаем по столбцам: столбцов 6, в каждом по 2: $2 + 2 + 2 + 2 + 2 + 2 = 12$.

      ### Типичная ошибка
      Посчитать отрезки границы вместо клеток: $6 + 2 + 6 + 2 = 16$ — это периметр, а не число клеток.
- id: P-04
  type: number
  role: supported
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T01
  minutes: 2
  prompt: Участок имеет форму пятиугольника со сторонами {{a}} м, {{b}} м, {{c}} м, {{d}} м и {{g}} м. Сколько метров
    забора нужно, чтобы огородить участок без запаса?
  answer: 140
  hints:
  - Забор идёт по границе — нужен периметр.
  - 'Сложите пять сторон: в столбик или парами, выписывая промежуточные суммы.'
  - Начните с пары {{a}} + {{b}}, к результату прибавляйте остальные стороны по очереди.
  solution: |
    ### Ответ
    Сумма пяти сторон участка.

    ### Идея
    Длина забора — периметр.

    ### Шаги
    1. Отмечаем стороны по кругу.
    2. Складываем по очереди.

    ### Проверка
    Сложение в обратном порядке.

    ### Типичная ошибка
    Пропустить сторону.
