  optional: true
  answer: 8
  hints:
  - Сумма длины и ширины — половина периметра.
  - Переберите пары с этой суммой и посчитайте клетки внутри каждой.
  - Половина от 26 — 13; начните с пары 1 и 12.
  solution: |
    ### Ответ
    Длина 8 см

    ### Идея
    Длина и ширина вместе — половина периметра; среди пар с этой суммой ищем ту, где клеток 40.

    ### Шаги
    1. Половина периметра: $13 + 13 = 26$.
    2. Пары и клетки: 1 и 12 — 12; 2 и 11 — 22; 3 и 10 — 30; 4 и 9 — 36; 5 и 8 — 40; 6 и 7 — 42.
    3. Подходит пара 5 и 8: длина 8 см.

    ### Проверка
    $8 + 5 + 8 + 5 = 26$, клетки: $8 + 8 + 8 + 8 + 8 = 40$.

    ### Типичная ошибка
    Назвать ширину 5 вместо длины или остановиться на паре 6 и 7, где клеток 42.
