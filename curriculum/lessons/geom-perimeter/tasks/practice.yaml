      3. Периметр равен 140 м.

      ### Проверка
      Сложим в обратном порядке: $40 + 27 = 67$, $67 + 18 = 85$, $85 + 31 = 116$, $116 + 24 = 140$. Итог тот же.

      ### Типичная ошибка
      Пропустить одну сторону: без последней стороны получится 100 м — это не весь обход. Отмечайте стороны по кругу.
