      У прямоугольника противоположные стороны равны, поэтому обход — длина, ширина, длина, ширина.

      ### Шаги
      1. Восстанавливаем стороны: 12, 7, 12, 7 м.
      2. Половина обхода: $12 + 7 = 19$.
      3. Весь обход — две половины: $19 + 19 = 38$.

      ### Проверка
      Сложим по кругу: $12 + 7 + 12 + 7 = 38$.

      ### Типичная ошибка
      Сложить только подписанные стороны: $12 + 7 = 19$ — это половина периметра, а не весь.
  - params:
