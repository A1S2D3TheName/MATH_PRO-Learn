  - Половина от {{p}} — длина плюс ширина; при ширине 1 найдите длину.
  solution: |
    ### Ответ
    Клетки самой узкой полоски.

    ### Идея
    Вытянутая полоска — меньше всего клеток.

    ### Шаги
    1. Половина периметра.
    2. Ширина 1.

    ### Проверка
    Сравнение со следующей парой.

    ### Типичная ошибка
