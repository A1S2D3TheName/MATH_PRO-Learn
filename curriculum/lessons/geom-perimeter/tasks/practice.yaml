- id: P-05
  type: number
  role: supported
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T02
  minutes: 1
  prompt: Длина прямоугольной клумбы {{a}} м, ширина {{b}} м. Сколько метров бордюра нужно на весь её край?
  answer: 28
  hints:
  - Край клумбы — это граница, то есть периметр.
  - 'У прямоугольника противоположные стороны равны: восстановите неподписанные.'
  - 'Обойдите край: {{a}} + {{b}} + {{a}} + {{b}}.'
  solution: |
    ### Ответ
    Периметр клумбы: две длины и две ширины.

    ### Идея
    Противоположные стороны равны.

    ### Шаги
    1. Восстанавливаем стороны.
    2. Складываем по кругу.

    ### Проверка
    Две половины по длине и ширине.

    ### Типичная ошибка
    Сложить только длину и ширину.
  feedback:
    correct: 'Верно: две длины по {{a}} м и две ширины по {{b}} м — весь край клумбы.'
    wrong:
      what: Длина бордюра не совпала.
      why: Возможно, сложены только длина и ширина или посчитаны клетки внутри.
      fix: 'Подпишите все четыре стороны: {{a}}, {{b}}, {{a}}, {{b}} — и сложите их.'
      next: 'T02, пример 1: плинтус для комнаты.'
