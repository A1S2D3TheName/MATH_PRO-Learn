    - id: E-geom-perimeter-half
      when:
        expr: a + b
      message: Это сумма длины и ширины — половина края. Неподписанные стороны равны противоположным, их тоже нужно
        сложить.
    - id: E-geom-perimeter-area
      when:
        expr: a * b
      message: 'Так считают квадраты внутри клумбы, а бордюр идёт по краю: сложите четыре стороны.'
  variants:
  - params:
      a: 9
      b: 5
    answer: 28
    solution: |
      ### Ответ
      $P = 28$ м

      ### Идея
      У прямоугольника противоположные стороны равны, поэтому обход — длина, ширина, длина, ширина.

      ### Шаги
      1. Восстанавливаем стороны: 9, 5, 9, 5 м.
      2. Половина обхода: $9 + 5 = 14$.
      3. Весь обход — две половины: $14 + 14 = 28$.

      ### Проверка
      Сложим по кругу: $9 + 5 + 9 + 5 = 28$.

      ### Типичная ошибка
      Сложить только подписанные стороны: $9 + 5 = 14$ — это половина периметра, а не весь.
  - params:
