      $P = 46$ м

      ### Идея
      У прямоугольника противоположные стороны равны, поэтому обход — длина, ширина, длина, ширина.

      ### Шаги
      1. Восстанавливаем стороны: 15, 8, 15, 8 м.
      2. Половина обхода: $15 + 8 = 23$.
      3. Весь обход — две половины: $23 + 23 = 46$.

      ### Проверка
      Сложим по кругу: $15 + 8 + 15 + 8 = 46$.

      ### Типичная ошибка
      Сложить только подписанные стороны: $15 + 8 = 23$ — это половина периметра, а не весь.
- id: P-06
  type: number
  role: supported
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T03
  minutes: 2
  prompt: Периметр прямоугольника {{p}} см, длина {{a}} см. Найдите ширину в сантиметрах.
  answer: 5
  hints:
  - 'Периметр — сумма четырёх сторон: двух длин и двух ширин.'
  - Уберите из периметра обе длины, а остаток поделите поровну между двумя ширинами.
  - 'Две длины: {{a}} + {{a}}; вычтите эту сумму из {{p}}.'
  solution: |
    ### Ответ
    Ширина — половина остатка после вычитания двух длин.

    ### Идея
    Длин две, ширин две.

    ### Шаги
    1. Вычитаем две длины.
    2. Делим остаток пополам.

    ### Проверка
    Сумма сторон равна периметру.

    ### Типичная ошибка
    Вычесть длину один раз.
  feedback:
    correct: 'Верно: после двух длин остаток разделён на две равные ширины.'
    wrong:
      what: Ширина не совпала.
      why: Возможно, длина вычтена один раз или остаток не разделён на две ширины.
      fix: Вычтите обе длины из {{p}}, остаток поделите пополам и проверьте сложением сторон.
      next: 'T03, пример 2: загон у сарая.'
    misconceptions:
    - id: E-geom-perimeter-subtract-one-side
      when:
        expr: p - a
      message: Длина вычтена один раз, но длин у прямоугольника две. Такая ширина больше половины периметра — она
        невозможна.
    - id: E-geom-perimeter-width-no-halve
      when:
        expr: p - a - a
      message: Это две ширины вместе. Одна ширина — половина этого числа.
  variants:
  - params:
      p: 26
      a: 8
