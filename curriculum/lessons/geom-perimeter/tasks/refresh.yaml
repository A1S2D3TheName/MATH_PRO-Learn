# Повторение: 5 коротких задач по три варианта; числа не пересекаются с практикой и примерами.
tasks:
- id: R-01
  type: number
  role: refresh
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T01
  minutes: 3
  prompt: Пол беседки — шестиугольник со сторонами {{a}} дм, {{b}} дм, {{c}} дм, {{d}} дм, {{g}} дм и {{h}} дм.
    Сколько дециметров бортика нужно по краю пола?
  answer: 92
  hints:
  - Бортик идёт по границе — это периметр.
  - Сложите шесть сторон, отмечая их по кругу.
  - 'Сложите стороны парами: {{a}} + {{b}}, {{c}} + {{d}}, {{g}} + {{h}}, затем суммы пар.'
  solution: |
    ### Ответ
    Периметр шестиугольника.

    ### Идея
    Сумма сторон.

    ### Шаги
    1. По кругу.
    2. Сложение.

    ### Проверка
    Обратный порядок.

    ### Типичная ошибка
    Пропустить сторону.
  feedback:
    correct: 'Верно: шесть сторон пола сложены без пропусков.'
    wrong:
      what: Длина бортика не совпала.
      why: Возможно, пропущена сторона.
      fix: Отметьте шесть сторон по кругу и сложите их.
      next: T01, пример 2.
  variants:
  - params:
      a: 14
      b: 18
      c: 15
      d: 16
      g: 17
      h: 12
    answer: 92
    solution: |
      ### Ответ
      $P = 92$ дм

      ### Идея
      Периметр беседки — сумма длин всех его сторон, каждая берётся один раз.

      ### Шаги
      1. Сторон 6, все в одной единице — дм.
      2. Складываем по очереди: $14 + 18 = 32$, $32 + 15 = 47$, $47 + 16 = 63$, $63 + 17 = 80$, $80 + 12 = 92$.
      3. Периметр равен 92 дм.

      ### Проверка
      Сложим в обратном порядке: $12 + 17 = 29$, $29 + 16 = 45$, $45 + 15 = 60$, $60 + 18 = 78$, $78 + 14 = 92$. Итог тот же.

      ### Типичная ошибка
      Пропустить одну сторону: без последней стороны получится 80 дм — это не весь обход. Отмечайте стороны по кругу.
  - params:
      a: 21
      b: 19
      c: 23
      d: 20
      g: 18
      h: 22
    answer: 123
    solution: |
      ### Ответ
      $P = 123$ дм

      ### Идея
      Периметр беседки — сумма длин всех его сторон, каждая берётся один раз.

      ### Шаги
      1. Сторон 6, все в одной единице — дм.
      2. Складываем по очереди: $21 + 19 = 40$, $40 + 23 = 63$, $63 + 20 = 83$, $83 + 18 = 101$, $101 + 22 = 123$.
      3. Периметр равен 123 дм.

      ### Проверка
      Сложим в обратном порядке: $22 + 18 = 40$, $40 + 20 = 60$, $60 + 23 = 83$, $83 + 19 = 102$, $102 + 21 = 123$. Итог тот же.

      ### Типичная ошибка
      Пропустить одну сторону: без последней стороны получится 101 дм — это не весь обход. Отмечайте стороны по кругу.
  - params:
      a: 25
      b: 27
      c: 24
      d: 26
      g: 28
      h: 23
    answer: 153
    solution: |
      ### Ответ
      $P = 153$ дм

      ### Идея
      Периметр беседки — сумма длин всех его сторон, каждая берётся один раз.

      ### Шаги
      1. Сторон 6, все в одной единице — дм.
      2. Складываем по очереди: $25 + 27 = 52$, $52 + 24 = 76$, $76 + 26 = 102$, $102 + 28 = 130$, $130 + 23 = 153$.
      3. Периметр равен 153 дм.

      ### Проверка
      Сложим в обратном порядке: $23 + 28 = 51$, $51 + 26 = 77$, $77 + 24 = 101$, $101 + 27 = 128$, $128 + 25 = 153$. Итог тот же.

      ### Типичная ошибка
      Пропустить одну сторону: без последней стороны получится 130 дм — это не весь обход. Отмечайте стороны по кругу.
- id: R-02
  type: number
  role: refresh
  purpose: procedure
  level: 2
  outcome: LO-01
  sections:
  - T01
  - T02
  minutes: 3
  prompt: 'Столешница прямоугольная: длина {{m}} м, ширина {{c}} см. Сколько сантиметров кромочной ленты нужно,
    чтобы оклеить её край?'
  answer: 340
  hints:
  - Стороны в разных единицах — переведите их в одну.
  - 1 м = 100 см; периметр — длина, ширина, длина, ширина.
  - Запишите длину {{m}} м в сантиметрах и сложите по кругу с шириной {{c}} см.
  solution: |
    ### Ответ
    Периметр в сантиметрах.

    ### Идея
    Одна единица.

    ### Шаги
    1. Перевод.
    2. Сложение.

    ### Проверка
    Две половины.

    ### Типичная ошибка
    Без перевода.
  feedback:
    correct: 'Верно: длина переведена в сантиметры, и периметр посчитан в одной единице.'
    wrong:
      what: Длина ленты не совпала.
      why: Возможно, метры сложены с сантиметрами без перевода.
      fix: Переведите {{m}} м в сантиметры до сложения.
      next: T01, пример 3.
    misconceptions:
    - id: E-geom-perimeter-mixed-units
      when:
        expr: 2*m + 2*c
      message: Метры и сантиметры сложены без перевода. Сначала замените метры сантиметрами.
  variants:
  - params:
      m: 1
      c: 70
    answer: 340
    solution: |
      ### Ответ
      $P = 340$ см

      ### Идея
      Сначала одна единица: 1 м = 100 см, затем периметр прямоугольника.

      ### Шаги
      1. Длина 1 м — это 100 см.
      2. $100 + 70 + 100 + 70 = 340$ см.

      ### Проверка
      Половина: $100 + 70 = 170$, две половины: $170 + 170 = 340$.

      ### Типичная ошибка
      Сложить без перевода: $1 + 70 + 1 + 70 = 142$.
  - params:
      m: 2
      c: 80
    answer: 560
    solution: |
      ### Ответ
      $P = 560$ см

      ### Идея
      Сначала одна единица: 1 м = 100 см, затем периметр прямоугольника.

      ### Шаги
      1. Длина 2 м — это 200 см.
      2. $200 + 80 + 200 + 80 = 560$ см.

      ### Проверка
      Половина: $200 + 80 = 280$, две половины: $280 + 280 = 560$.

      ### Типичная ошибка
      Сложить без перевода: $2 + 80 + 2 + 80 = 164$.
  - params:
      m: 1
      c: 85
    answer: 370
    solution: |
      ### Ответ
      $P = 370$ см

      ### Идея
      Сначала одна единица: 1 м = 100 см, затем периметр прямоугольника.

      ### Шаги
      1. Длина 1 м — это 100 см.
      2. $100 + 85 + 100 + 85 = 370$ см.

      ### Проверка
      Половина: $100 + 85 = 185$, две половины: $185 + 185 = 370$.

      ### Типичная ошибка
      Сложить без перевода: $1 + 85 + 1 + 85 = 172$.
- id: R-03
  type: number
  role: refresh
  purpose: procedure
  level: 2
  outcome: LO-01
  sections:
  - T03
  minutes: 3
  prompt: Забор вокруг прямоугольного сада — {{p}} м, ширина сада {{a}} м. Найдите длину сада в метрах.
  answer: 15
  hints:
  - 'Забор идёт по периметру: две длины и две ширины.'
  - Вычтите обе ширины из периметра и поделите остаток на две длины.
  - 'Две ширины: {{a}} + {{a}}; вычтите сумму из {{p}}.'
  solution: |
    ### Ответ
    Длина — половина остатка.

    ### Идея
    Две ширины и две длины.

    ### Шаги
    1. Вычитание.
    2. Пополам.

    ### Проверка
    Сумма сторон.

    ### Типичная ошибка
    Одна ширина.
  feedback:
    correct: 'Верно: после двух ширин остаток поделён на две равные длины.'
    wrong:
      what: Длина сада не совпала.
      why: Возможно, ширина вычтена один раз или остаток не разделён пополам.
      fix: Вычтите две ширины из {{p}} и разделите остаток пополам.
      next: T03, пример 2.
    misconceptions:
    - id: E-geom-perimeter-subtract-one-side
      when:
        expr: p - a
      message: Ширина вычтена один раз, а ширин две. Такая длина больше половины забора.
    - id: E-geom-perimeter-width-no-halve
      when:
        expr: p - a - a
      message: Это две длины вместе. Одна длина — половина этого числа.
  variants:
  - params:
      p: 50
      a: 10
    answer: 15
    solution: |
      ### Ответ
      Длина 15 м

      ### Идея
      Периметр — две ширины и две длины. Известную сторону вычитаем дважды, остаток делим поровну.

      ### Шаги
      1. Две известные стороны: $10 + 10 = 20$.
      2. Остаток на две другие стороны: $50 - 20 = 30$.
      3. Половина остатка: $15 + 15 = 30$, значит, длина 15 м.

      ### Проверка
      $10 + 15 + 10 + 15 = 50$ — совпадает с периметром.

      ### Типичная ошибка
      Вычесть известную сторону один раз: $50 - 10 = 40$ — такой стороны быть не может, она больше половины периметра. Или забыть разделить остаток: 30 — это две стороны вместе.
  - params:
      p: 64
      a: 12
    answer: 20
    solution: |
      ### Ответ
      Длина 20 м

      ### Идея
      Периметр — две ширины и две длины. Известную сторону вычитаем дважды, остаток делим поровну.

      ### Шаги
      1. Две известные стороны: $12 + 12 = 24$.
      2. Остаток на две другие стороны: $64 - 24 = 40$.
      3. Половина остатка: $20 + 20 = 40$, значит, длина 20 м.

      ### Проверка
      $12 + 20 + 12 + 20 = 64$ — совпадает с периметром.

      ### Типичная ошибка
      Вычесть известную сторону один раз: $64 - 12 = 52$ — такой стороны быть не может, она больше половины периметра. Или забыть разделить остаток: 40 — это две стороны вместе.
  - params:
      p: 58
      a: 13
    answer: 16
    solution: |
      ### Ответ
      Длина 16 м

      ### Идея
      Периметр — две ширины и две длины. Известную сторону вычитаем дважды, остаток делим поровну.

      ### Шаги
      1. Две известные стороны: $13 + 13 = 26$.
      2. Остаток на две другие стороны: $58 - 26 = 32$.
      3. Половина остатка: $16 + 16 = 32$, значит, длина 16 м.

      ### Проверка
      $13 + 16 + 13 + 16 = 58$ — совпадает с периметром.

      ### Типичная ошибка
      Вычесть известную сторону один раз: $58 - 13 = 45$ — такой стороны быть не может, она больше половины периметра. Или забыть разделить остаток: 32 — это две стороны вместе.
- id: R-04
  type: number
  role: refresh
  purpose: procedure
  level: 1
  outcome: LO-02
  sections:
  - T04
  minutes: 2
  prompt: 'Прямоугольник нарисован по линиям клеток: {{a|pl:клетка,клетки,клеток}} в длину и {{b|pl:клетка,клетки,клеток}}
    в ширину, сторона клетки 1 см. Чему равен его периметр в сантиметрах?'
  answer: 26
  hints:
  - Периметр — отрезки на границе, а не клетки.
  - Две длины и две ширины.
  - 'Сложите по контуру: {{a}} + {{b}} + {{a}} + {{b}}.'
  solution: |
    ### Ответ
    Отрезки контура.

    ### Идея
    Граница.

    ### Шаги
    1. Стороны.
    2. Сумма.

    ### Проверка
    Две половины.

    ### Типичная ошибка
    Клетки внутри.
  feedback:
    correct: 'Верно: посчитаны отрезки границы.'
    wrong:
      what: Периметр не совпал.
      why: Возможно, посчитаны клетки внутри или вдоль края.
      fix: Обведите контур и сложите четыре стороны.
      next: T04, пример 1.
    misconceptions:
    - id: E-geom-perimeter-area
      when:
        expr: a * b
      message: Это число клеток внутри. Периметр — длина границы.
    - id: E-geom-perimeter-border-cells
      when:
        expr: 2*a + 2*b - 4
      message: Посчитаны клетки вдоль края; угловая клетка даёт два отрезка границы.
    - id: E-geom-perimeter-half
      when:
        expr: a + b
      message: Это половина контура. Добавьте вторую длину и вторую ширину.
  variants:
  - params:
      a: 9
      b: 4
    answer: 26
    solution: |
      ### Ответ
      $P = 26$ см

      ### Идея
      Периметр на клетчатой бумаге — отрезки контура, по 1 см каждый.

      ### Шаги
      1. Две длины по 9 и две ширины по 4.
      2. $9 + 4 + 9 + 4 = 26$.

      ### Проверка
      Половина: $9 + 4 = 13$; две половины — 26.

      ### Типичная ошибка
      Посчитать клетки внутри (36) вместо отрезков границы.
  - params:
      a: 10
      b: 3
    answer: 26
    solution: |
      ### Ответ
      $P = 26$ см

      ### Идея
      Периметр на клетчатой бумаге — отрезки контура, по 1 см каждый.

      ### Шаги
      1. Две длины по 10 и две ширины по 3.
      2. $10 + 3 + 10 + 3 = 26$.

      ### Проверка
      Половина: $10 + 3 = 13$; две половины — 26.

      ### Типичная ошибка
      Посчитать клетки внутри (30) вместо отрезков границы.
  - params:
      a: 6
      b: 5
    answer: 22
    solution: |
      ### Ответ
      $P = 22$ см

      ### Идея
      Периметр на клетчатой бумаге — отрезки контура, по 1 см каждый.

      ### Шаги
      1. Две длины по 6 и две ширины по 5.
      2. $6 + 5 + 6 + 5 = 22$.

      ### Проверка
      Половина: $6 + 5 = 11$; две половины — 22.

      ### Типичная ошибка
      Посчитать клетки внутри (30) вместо отрезков границы.
- id: R-05
  type: number
  role: refresh
  purpose: procedure
  level: 2
  outcome: LO-01
  sections:
  - T03
  minutes: 2
  prompt: Квадратную рамку согнули из куска проволоки длиной {{p}} см без остатка. Найдите длину стороны рамки в
    сантиметрах.
  answer: 12
  hints:
  - Длина проволоки — периметр квадрата.
  - Периметр квадрата пополам — две стороны, ещё пополам — одна.
  - Найдите число, которое при сложении с собой даёт {{p}}.
  solution: |
    ### Ответ
    Четверть периметра.

    ### Идея
    Дважды пополам.

    ### Шаги
    1. Пополам.
    2. Ещё пополам.

    ### Проверка
    Четыре стороны.

    ### Типичная ошибка
    Одна половина.
  feedback:
    correct: 'Верно: длина проволоки разделена на четыре равные стороны.'
    wrong:
      what: Сторона не совпала.
      why: Возможно, периметр разделён пополам один раз.
      fix: Разделите {{p}} пополам и ещё раз пополам.
      next: T03, пример 3.
    misconceptions:
    - id: E-geom-perimeter-square-side-half
      when:
        expr: p / 2
      message: Половина периметра квадрата — две стороны, а не одна.
  variants:
  - params:
      p: 48
    answer: 12
    solution: |
      ### Ответ
      Сторона 12 см

      ### Идея
      Проволока — периметр квадрата; делим пополам дважды.

      ### Шаги
      1. Две стороны: $24 + 24 = 48$, вместе 24 см.
      2. Одна сторона: $12 + 12 = 24$.

      ### Проверка
      $12 + 12 + 12 + 12 = 48$.

      ### Типичная ошибка
      Ответить 24 — это две стороны.
  - params:
      p: 68
    answer: 17
    solution: |
      ### Ответ
      Сторона 17 см

      ### Идея
      Проволока — периметр квадрата; делим пополам дважды.

      ### Шаги
      1. Две стороны: $34 + 34 = 68$, вместе 34 см.
      2. Одна сторона: $17 + 17 = 34$.

      ### Проверка
      $17 + 17 + 17 + 17 = 68$.

      ### Типичная ошибка
      Ответить 34 — это две стороны.
  - params:
      p: 88
    answer: 22
    solution: |
      ### Ответ
      Сторона 22 см

      ### Идея
      Проволока — периметр квадрата; делим пополам дважды.

      ### Шаги
      1. Две стороны: $44 + 44 = 88$, вместе 44 см.
      2. Одна сторона: $22 + 22 = 44$.

      ### Проверка
      $22 + 22 + 22 + 22 = 88$.

      ### Типичная ошибка
      Ответить 44 — это две стороны.
