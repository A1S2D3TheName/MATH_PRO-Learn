# Входная диагностика: по две задачи на каждый прямой пререквизит (geom-measure, num-add-column).
# sections — локальные T-разделы, где пререквизит используется (схема требует ^T[0-9]{2}$).
tasks:
- id: D-01
  type: number
  role: diagnostic
  purpose: procedure
  level: 0
  outcome: geom-measure/LO-01
  sections:
  - T01
  minutes: 1
  prompt: 'Отрезок приложили к линейке: его начало у отметки 2 см, конец у отметки 9 см. Какова длина отрезка в
    сантиметрах?'
  answer: 7
  hints:
  - Длина — сколько сантиметров между началом и концом, а не отметка у конца.
  - Если начало не у нуля, из отметки конца вычитают отметку начала.
  - Сосчитайте сантиметровые промежутки от отметки 2 до отметки 9.
  solution: |
    ### Ответ
    7 см

    ### Идея
    Длина отрезка — число единичных отрезков линейки между его концами.

    ### Шаги
    1. Начало у отметки 2, конец у отметки 9.
    2. $9 - 2 = 7$.

    ### Проверка
    Если сдвинуть отрезок к нулю, конец окажется у отметки 7.

    ### Типичная ошибка
    Прочитать отметку у конца и ответить 9, хотя начало стоит не у нуля.
  feedback:
    correct: 'Верно: длина — разность отметок конца и начала.'
    wrong:
      what: Длина отрезка не совпала.
      why: Возможно, взята отметка конца, хотя начало не у нуля.
      fix: Вычтите отметку начала из отметки конца или передвиньте отрезок к нулю.
      next: Повторите измерение длины линейкой в теме про измерение длины.
- id: D-02
  type: number
  role: diagnostic
  purpose: procedure
  level: 1
  outcome: geom-measure/LO-01
  sections:
  - T01
  minutes: 1
  prompt: Доска имеет длину 3 м 40 см. Сколько это сантиметров?
  answer: 340
  hints:
  - В одном метре 100 сантиметров.
  - Переведите метры в сантиметры и прибавьте оставшиеся сантиметры.
  - Три метра — это три раза по 100 см; к ним прибавьте 40 см.
  solution: |
    ### Ответ
    340 см

    ### Идея
    Метры переводят в сантиметры: 1 м = 100 см.

    ### Шаги
    1. $100 + 100 + 100 = 300$ см.
    2. $300 + 40 = 340$ см.

    ### Проверка
    Обратно: 340 см — это 3 полных метра и ещё 40 см.

    ### Типичная ошибка
    Записать 3 м 40 см как 43 или 3040: метр — это 100 сантиметров, а не 10 и не 1000.
  feedback:
    correct: 'Верно: 3 м 40 см — это 340 см.'
    wrong:
      what: Перевод не совпал.
      why: Возможно, метр принят не за 100 сантиметров.
      fix: Замените каждый метр на 100 см и прибавьте 40 см.
      next: Повторите перевод единиц длины в теме про единицы измерения.
- id: D-03
  type: number
  role: diagnostic
  purpose: procedure
  level: 1
  outcome: num-add-column/LO-01
  sections:
  - T01
  minutes: 2
  prompt: 'Вычислите письменно: 347 + 286.'
  answer: 633
  hints:
  - 'Складывайте поразрядно: единицы, десятки, сотни.'
  - Если в разряде получилось 10 или больше, перенесите единицу в следующий разряд.
  - 'Единицы: 7 + 6; запишите единицы результата и перенесите десяток.'
  solution: |
    ### Ответ
    633

    ### Идея
    Письменное сложение по разрядам с переносом.

    ### Шаги
    1. Единицы: $7 + 6 = 13$ — пишем 3, переносим 1.
    2. Десятки: $4 + 8 + 1 = 13$ — пишем 3, переносим 1.
    3. Сотни: $3 + 2 + 1 = 6$.

    ### Проверка
    $633 - 286 = 347$.

    ### Типичная ошибка
    Забыть перенос и получить 523.
  feedback:
    correct: 'Верно: 347 + 286 = 633, оба переноса учтены.'
    wrong:
      what: Сумма не совпала.
      why: Возможно, пропущен перенос через разряд.
      fix: Сложите по разрядам и запишите переносы над числом.
      next: Повторите письменное сложение с переносом.
- id: D-04
  type: number
  role: diagnostic
  purpose: procedure
  level: 1
  outcome: num-add-column/LO-01
  sections:
  - T03
  minutes: 2
  prompt: 'Вычислите письменно: 502 − 168.'
  answer: 334
  hints:
  - Вычитайте поразрядно, начиная с единиц.
  - Если в разряде уменьшаемого цифра меньше, займите единицу у старшего разряда.
  - 'В единицах 2 меньше 8: займите десяток; в десятках ноль, поэтому сначала займите сотню.'
  solution: |
    ### Ответ
    334

    ### Идея
    Письменное вычитание по разрядам с заимствованием.

    ### Шаги
    1. Занимаем: 502 — это 4 сотни, 9 десятков и 12 единиц.
    2. Единицы: $12 - 8 = 4$; десятки: $9 - 6 = 3$; сотни: $4 - 1 = 3$.

    ### Проверка
    $334 + 168 = 502$.

    ### Типичная ошибка
    Вычесть меньшую цифру из большей в каждом разряде и получить 466.
  feedback:
    correct: 'Верно: 502 − 168 = 334.'
    wrong:
      what: Разность не совпала.
      why: Возможно, в разряде из меньшей цифры вычтена большая наоборот.
      fix: Проверьте заимствование через нулевой десяток и сделайте проверку сложением.
      next: Повторите письменное вычитание с заимствованием.
