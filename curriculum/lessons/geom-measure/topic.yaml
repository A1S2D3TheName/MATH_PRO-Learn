    - отрезок не от нуля
    - две шкалы транспортира
    - построить угол транспортиром
    - угол между стрелками часов
  questions:
    - Как измерить длину отрезка, если линейка сломана и нуля нет?
    - Как пользоваться транспортиром?
    - Какую шкалу транспортира читать?
    - Что такое градус?
    - Чем острый угол отличается от тупого?
    - Что такое цена деления?
    - Какая погрешность у линейки с миллиметрами?
    - Почему измерение не бывает точным?
    - Как построить угол заданной величины?
    - Какой угол между стрелками часов в 4 часа?

