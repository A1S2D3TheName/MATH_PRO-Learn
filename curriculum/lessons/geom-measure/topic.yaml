id: geom-measure
title: "Измерение длины и угла"
section: geom
stage: 1
hours: 3
grade: "2–5"
prerequisites: [geom-basic-shapes, model-units]
version: "1.0.0"
summary: >
  Длина отрезка — число единичных промежутков между его концами, а градусная мера угла — число
  одноградусных углов в нём. Тема учит читать линейку и транспортир, называть вид угла по числу
  градусов и оценивать погрешность измерения по цене деления шкалы.

