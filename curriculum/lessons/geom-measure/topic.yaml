outcomes:
  - id: LO-01
    short: Измеряет длину отрезка по линейке
    action: >
      измеряет и откладывает отрезок по линейке: совмещает ноль с концом или считает единичные
      промежутки между отметками концов, досчитывает миллиметры после подписи, записывает длину
      с единицей по ближайшей отметке и выбирает линейку с подходящей ценой деления
    conditions: >
      отметки — целые числа от 0 до 300; единицы мм, см и м; цена деления 1 мм или 1 см; отрезок
      может начинаться не с нуля, а ноль линейки — отстоять от её края; вычислений нет, только счёт
      промежутков и перевод единиц
    criterion: >
      верно называет длину с единицей, в том числе когда отрезок начинается не с нуля или к нему
      приложен край линейки; записывает ближайшую отметку; выбирает инструмент, у которого хватает
      длины шкалы и мелкости делений
    level: core
    sections: [T01, T04]
  - id: LO-02
    short: Измеряет угол и называет его вид
    action: >
      измеряет и строит угол транспортиром: совмещает центр с вершиной, читает шкалу, у которой ноль
      лежит на стороне угла, досчитывает мелкие штрихи; называет вид угла — острый, прямой, тупой или
      развёрнутый — по градусной мере
    conditions: >
      углы от 1° до 180° с целым числом градусов; транспортир с двумя шкалами от 0 до 180, подписи
      через 10°, мелкие штрихи через 1°; длина сторон на рисунке любая
    criterion: >
      верно называет градусную меру, не путая шкалы, и вид угла, включая углы в нескольких градусах
      от 90° и 180°; не сравнивает углы по длине сторон
    level: core
    sections: [T02, T03, T04]
  - id: LO-03
    short: Оценивает точность измерения
    action: >
      оценивает точность измерения: находит наибольшую погрешность отсчёта и промежуток для
      настоящего значения, сверяет показания двух инструментов, выбирает инструмент под допуск,
      оценивает накопленную ошибку при нескольких укладках и проверяет результат прикидкой по опорным
      углам и длинам
    conditions: >
      цена деления 1 мм, 2 мм, 1 см, 10 см, 1° или 10°; отсчёт по ближайшей отметке; не больше
      десяти укладок со сдвигом до 1 мм; опоры — уголок листа, лист A4 и циферблат в целый час
    criterion: >
      верно называет наибольшую погрешность и пределы настоящего значения, находит несогласованную
      запись, выбирает подходящий инструмент и называет угол между стрелками в целый час
    level: deep
    sections: [T05, T06]

