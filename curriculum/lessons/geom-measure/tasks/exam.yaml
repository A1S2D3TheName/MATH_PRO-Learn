      - id: EA-07
        type: match
        role: exam
        purpose: method
        level: 2
        outcome: LO-01
        sections: [T01]
        minutes: 3
        points: 2
        prompt: "Подберите к каждому измерению подходящий инструмент. Один инструмент останется лишним."
        left:
          - id: l1
            text: "длина садовой грядки около 3 м за одно приложение"
          - id: l2
            text: "толщина стекла, нужна точность до 1 мм"
          - id: l3
            text: "обхват головы для шапки"
        right:
          - id: r1
            text: "рулетка 5 м с сантиметровыми делениями"
          - id: r2
            text: "линейка 20 см с миллиметровыми делениями"
          - id: r3
            text: "гибкая сантиметровая лента 150 см"
          - id: r4
            text: "транспортир"
        answer:
          - {left: "l1", right: "r1"}
          - {left: "l2", right: "r2"}
          - {left: "l3", right: "r3"}
        hints:
          - "Одно из измерений требует миллиметровых делений."
          - "Для каждого измерения проверьте длину шкалы и цену деления."
          - "Грядка около 3 м за одно приложение требует шкалы длиннее 3 м."
        solution: |
          ### Ответ
          Грядка — рулетка 5 м, стекло — линейка с миллиметрами, голова — гибкая лента; транспортир лишний.

          ### Идея
          Инструмент выбирают по виду величины, длине шкалы и цене деления.

          ### Шаги
          1. Грядку около 3 м за одно приложение покрывает только рулетка 5 м.
          2. Точность до 1 мм дают только миллиметровые деления — линейка.
          3. Обхват головы кривой — его повторяет гибкая лента.
          4. Транспортир меряет углы, а углов здесь нет.

          ### Проверка
          Каждый инструмент проверен по длине шкалы, цене деления и гибкости; лишний инструмент меряет другую величину.

          ### Типичная ошибка
          Мерить толщину стекла рулеткой: её сантиметровые деления не дают точности до миллиметра.
        feedback:
          correct: "Верно: каждому измерению подобран инструмент с подходящей шкалой."
          wrong:
            what: "Хотя бы одна пара подобрана неверно."
            why: "Вероятно, учтена только длина шкалы или только цена деления."
            fix: "Для каждой пары проверьте: та ли величина, хватит ли шкалы, мелкие ли деления."
            next: "Раздел T01, абзац «Выбор масштаба линейки»."

