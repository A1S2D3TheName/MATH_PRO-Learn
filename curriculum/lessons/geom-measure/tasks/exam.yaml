# Контрольная (STANDARD.md §8, правила 80–81): два варианта по 13 задач, 35 минут, 22 балла.
# Задачи с параметрами записаны одним вариантом: так детекторы связаны с формулами каталога.
variants:
  - id: A
    tasks:
      - id: EA-01
        type: number
        role: exam
        purpose: procedure
        level: 0
        outcome: LO-01
        sections: [T01]
        minutes: 2
        points: 1
        trivial_answer_ok: true
        unit: "см"
        prompt: "Сантиметровую ленту приложили нулём к началу шнурка; конец шнурка — у отметки {{b}} см. Какова длина шнурка в сантиметрах?"
        answer: 38
        variants:
          - params: {b: 38}
            answer: 38
            solution: |
              ### Ответ
              38 см

              ### Идея
              Начало совмещено с нулём, поэтому отметка у второго конца и есть длина шнурка.

              ### Шаги
              1. Ноль стоит у начала — отдельно считать промежутки не нужно.
              2. У второго конца отметка 38: длина шнурка 38 см.

              ### Проверка
              От нуля до 38 — 38 сантиметровых промежутков: 1, 2, …, 38.

              ### Типичная ошибка
              Посчитать штрихи вместе с нулевым и получить 39.
        hints:
          - "Посмотрите, где у ленты начало отсчёта."
          - "При начале на нуле число у второго конца показывает длину."
          - "Конец шнурка у отметки {{b}}, начало — у отметки 0: от какой отметки идёт счёт?"
        solution: |
          ### Ответ
          38 см

          ### Идея
          Начало совмещено с нулём, поэтому отметка у второго конца и есть длина шнурка.

          ### Шаги
          1. Ноль стоит у начала — отдельно считать промежутки не нужно.
          2. У второго конца отметка 38: длина шнурка 38 см.

          ### Проверка
          От нуля до 38 — 38 сантиметровых промежутков: 1, 2, …, 38.

          ### Типичная ошибка
          Посчитать штрихи вместе с нулевым и получить 39.
        feedback:
          correct: "Верно: начало шнурка на нуле, поэтому длину показывает отметка у конца."
          wrong:
            what: "Длина названа неверно."
            why: "Возможно, посчитаны штрихи вместе с нулевым."
            fix: "При начале на нуле длина равна отметке у второго конца."
            next: "Раздел T01, абзац об отрезке на шкале."

      - id: EA-02
        type: number
        role: exam
        purpose: procedure
        level: 1
        outcome: LO-01
        sections: [T01]
        minutes: 2
        points: 1
        unit: "см"
        prompt: "Карандаш лежит вдоль линейки: один конец у отметки {{a}} см, другой — у отметки {{b}} см. Какова длина карандаша в сантиметрах?"
        answer: 13
        variants:
          - params: {a: 2, b: 15}
            answer: 13
            solution: |
              ### Ответ
              13 см

              ### Идея
              Первый конец не на нуле — считаем промежутки от 2 до 15.

              ### Шаги
              1. Десятками: 12 — 1 десяток.
              2. Затем единицами: 13, 14, 15 — 3 шага.
              3. Вместе 1 десяток и 3 единицы, то есть 13 см.

              ### Проверка
              Мысленный сдвиг на ноль: 13 шагов от нуля приводят к отметке 13.

              ### Типичная ошибка
              Ответить 15 см — числом у второго конца.
        hints:
          - "Ни один конец карандаша не на нуле."
          - "Длина — число сантиметровых промежутков между отметками концов."
          - "Отсчитайте от {{a}} шаги по одному сантиметру до отметки {{b}}."
        solution: |
          ### Ответ
          13 см

          ### Идея
          Первый конец не на нуле — считаем промежутки от 2 до 15.

          ### Шаги
          1. Десятками: 12 — 1 десяток.
          2. Затем единицами: 13, 14, 15 — 3 шага.
          3. Вместе 1 десяток и 3 единицы, то есть 13 см.

          ### Проверка
          Мысленный сдвиг на ноль: 13 шагов от нуля приводят к отметке 13.

          ### Типичная ошибка
          Ответить 15 см — числом у второго конца.
        feedback:
          correct: "Верно: длина карандаша посчитана по промежуткам между отметками."
          wrong:
            what: "Длина не совпала."
            why: "Вероятно, взято число у второго конца или посчитаны штрихи."
            fix: "Посчитайте промежутки от {{a}} до {{b}}."
            next: "Раздел T01, пример 1 «Отрезок не от нуля»."
          misconceptions:
            - id: E-geom-measure-end-mark
              when: {expr: "b"}
              message: "Это отметка второго конца — расстояние от нуля, а первый конец у отметки {{a}}."
            - id: E-geom-measure-count-marks
              when: {expr: "b - a + 1"}
              message: "На один больше: посчитаны штрихи, а не промежутки."

      - id: EA-03
        type: number
        role: exam
        purpose: procedure
        level: 1
        outcome: LO-02
        sections: [T02]
        minutes: 2
        points: 1
        trivial_answer_ok: true
        unit: "°"
        prompt: "Центр транспортира — в вершине O, сторона OA проходит через 0 внутренней шкалы. У стороны OB внешняя шкала показывает {{p}}, внутренняя — {{q}}. Найдите угол AOB в градусах."
        answer: 55
        variants:
          - params: {p: 125, q: 55}
            answer: 55
            solution: |
              ### Ответ
              55°

              ### Идея
              Ноль внутренней шкалы лежит на OA — читаем её.

              ### Шаги
              1. Ноль на OA принадлежит внутренней шкале.
              2. Её число у OB — 55: угол AOB равен 55°.

              ### Проверка
              55 меньше 90 — угол острый; число 125 дало бы тупой угол.

              ### Типичная ошибка
              Записать 125° — число другой шкалы.
        hints:
          - "Определите шкалу, ноль которой лежит на стороне OA."
          - "У второй стороны берут число именно этой шкалы."
          - "Ноль на OA — у внутренней шкалы; выберите её число из {{p}} и {{q}}, затем сверьте вид угла с 90°."
        solution: |
          ### Ответ
          55°

          ### Идея
          Ноль внутренней шкалы лежит на OA — читаем её.

          ### Шаги
          1. Ноль на OA принадлежит внутренней шкале.
          2. Её число у OB — 55: угол AOB равен 55°.

          ### Проверка
          55 меньше 90 — угол острый; число 125 дало бы тупой угол.

          ### Типичная ошибка
          Записать 125° — число другой шкалы.
        feedback:
          correct: "Верно: угол прочитан по внутренней шкале, ноль которой на OA."
          wrong:
            what: "Угол назван неверно."
            why: "Скорее всего, прочитана шкала, ноль которой не на OA."
            fix: "Возьмите число внутренней шкалы."
            next: "Раздел T02, предупреждение «Две шкалы — один ответ»."
          misconceptions:
            - id: E-geom-measure-wrong-scale
              when: {expr: "p"}
              message: "Это число шкалы, ноль которой лежит не на стороне OA."

      - id: EA-04
        type: match
        role: exam
        purpose: meaning
        level: 1
        outcome: LO-02
        sections: [T03]
        minutes: 2
        points: 1
        prompt: "Соедините каждый угол с его видом. Один вид останется лишним."
        left:
          - id: l1
            text: "угол 35°"
          - id: l2
            text: "угол 90°"
          - id: l3
            text: "угол 140°"
        right:
          - id: r1
            text: "острый"
          - id: r2
            text: "прямой"
          - id: r3
            text: "тупой"
          - id: r4
            text: "развёрнутый"
        answer:
          - {left: "l1", right: "r1"}
          - {left: "l2", right: "r2"}
          - {left: "l3", right: "r3"}
        hints:
          - "Вид угла задают границы 90° и 180°."
          - "Ровно 90° и ровно 180° — отдельные виды."
          - "Сравните с 90 числа 35, 90 и 140."
        solution: |
          ### Ответ
          35° — острый, 90° — прямой, 140° — тупой; один вид лишний.

          ### Идея
          Вид угла определяют сравнением градусной меры с 90° и 180°.

          ### Шаги
          1. 35° меньше 90° — острый.
          2. 90° ровно 90° — прямой.
          3. 140° больше 90° и меньше 180° — тупой.

          ### Проверка
          Каждому углу достался ровно один вид, а оставшийся вид не подходит ни к одному числу.

          ### Типичная ошибка
          Принять 140° за развёрнутый угол: развёрнутый — ровно 180°.
        feedback:
          correct: "Верно: все три угла отнесены к видам по сравнению с 90° и 180°."
          wrong:
            what: "Хотя бы один угол отнесён не к тому виду."
            why: "Возможно, граничное значение 90° или 180° отнесено к соседнему виду."
            fix: "Сравните каждую градусную меру с 90 и 180."
            next: "Раздел T03, определения видов углов."

