          Ноль внешней шкалы на OA: берём её подпись и досчитываем мелкие деления.

          ### Шаги
          1. Ноль на OA принадлежит внешней шкале; число 104 другой шкалы отбрасываем.
          2. Последняя подпись перед OB — 70.
          3. Мелкие деления: 71, 72, 73, 74, 75, 76 — угол 76°.

          ### Проверка
          76 меньше 90 — угол острый; 76 лежит между подписями 70 и 80.

