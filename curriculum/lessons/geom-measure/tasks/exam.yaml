        solution: |
          ### Ответ
          89° — острый, 180° — развёрнутый, 95° — тупой; один вид лишний.

          ### Идея
          Вид угла определяют сравнением градусной меры с 90° и 180°.

          ### Шаги
          1. 89° меньше 90° — острый.
          2. 180° ровно 180° — развёрнутый.
          3. 95° больше 90° и меньше 180° — тупой.

          ### Проверка
          Каждому углу достался ровно один вид, а оставшийся вид не подходит ни к одному числу.

          ### Типичная ошибка
          Назвать 89° прямым «на глаз»: по числу он острый.
