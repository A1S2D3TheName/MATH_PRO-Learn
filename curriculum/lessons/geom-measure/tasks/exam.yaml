      - id: EB-12
        type: number
        role: exam
        purpose: transfer
        level: 3
        outcome: LO-03
        sections: [T06]
        minutes: 3
        points: 2
        unit: "°"
        prompt: "Какой угол между часовой и минутной стрелками ровно в {{h|pl:час,часа,часов}}? Введите градусную меру."
        answer: 30
        variants:
          - params: {h: 1}
            answer: 30
            solution: |
              ### Ответ
              30°

              ### Идея
              Ровно в целый час минутная стрелка на 12, часовая — на числе часов.

              ### Шаги
              1. Часовая стрелка на 1.
              2. Короткий путь от 12 вперёд: 1 — 1 промежуток.
              3. По таблице — 30°.

              ### Проверка
              30 меньше 90 — угол острый, что согласуется с положением стрелок относительно прямого угла в 3 часа.

              ### Типичная ошибка
              Считать по длинному пути — 11 промежутков.
        hints:
          - "Минутная стрелка ровно в целый час стоит на 12."
          - "Угол зависит от числа часовых промежутков между стрелками по короткому пути."
          - "Часовая стрелка на {{h}}: сколько промежутков отделяет её от 12?"
        solution: |
          ### Ответ
          30°

          ### Идея
          Ровно в целый час минутная стрелка на 12, часовая — на числе часов.

          ### Шаги
          1. Часовая стрелка на 1.
          2. Короткий путь от 12 вперёд: 1 — 1 промежуток.
          3. По таблице — 30°.

          ### Проверка
          30 меньше 90 — угол острый, что согласуется с положением стрелок относительно прямого угла в 3 часа.

          ### Типичная ошибка
          Считать по длинному пути — 11 промежутков.
        feedback:
          correct: "Верно: угол найден по числу часовых промежутков между стрелками."
          wrong:
            what: "Угол между стрелками не совпал."
            why: "Возможно, промежутки посчитаны по длинному пути."
            fix: "Считайте часовые промежутки от 12 по короткому пути."
            next: "Раздел T06, таблица опорных углов."

      - id: EB-13
        type: numbers
        role: exam
        purpose: method
        level: 4
        outcome: LO-03
        sections: [T01, T04]
        minutes: 4
        points: 3
        prompt: "Ноль сантиметровой ленты отстоит от её края на {{m}} мм. Ленту приложили краем к началу планки, а второй конец планки ближе всего к отметке {{c}} см. Между какими значениями в миллиметрах лежит длина планки?"
        fields:
          - {id: low, label: "Наименьшее значение, мм"}
          - {id: high, label: "Наибольшее значение, мм"}
        answer: {low: 478, high: 488}
        variants:
          - params: {m: 3, c: 48}
            answer: {low: 478, high: 488}
            solution: |
              ### Ответ
              От 478 до 488 мм.

              ### Идея
              Сначала пределы по ближайшей отметке, затем сдвиг на зазор.

              ### Шаги
              1. 48 см = 480 мм; по ближайшей отметке — от 475 до 485 мм от нуля.
              2. От края до нуля ещё 3 мм.
              3. Сдвигаем обе границы на 3 мм: от 478 до 488 мм.

              ### Проверка
              Ширина промежутка — десять миллиметровых шагов, одно деление.

              ### Типичная ошибка
              Забыть зазор: от 475 до 485 мм.
        hints:
          - "Нужны две поправки: на погрешность отсчёта и на зазор края."
          - "Сначала пределы от записанной отметки, затем сдвиг обеих границ."
          - "От {{c}} см, переведённых в миллиметры, отступите на 5 мм в обе стороны, затем досчитайте по {{m}} мм к границам."
        solution: |
          ### Ответ
          От 478 до 488 мм.

          ### Идея
          Сначала пределы по ближайшей отметке, затем сдвиг на зазор.

          ### Шаги
          1. 48 см = 480 мм; по ближайшей отметке — от 475 до 485 мм от нуля.
          2. От края до нуля ещё 3 мм.
          3. Сдвигаем обе границы на 3 мм: от 478 до 488 мм.

          ### Проверка
          Ширина промежутка — десять миллиметровых шагов, одно деление.

          ### Типичная ошибка
          Забыть зазор: от 475 до 485 мм.
        feedback:
          correct: "Верно: пределы длины планки учитывают половину деления и зазор."
          wrong:
            what: "Пределы длины не совпали."
            why: "Возможно, забыт зазор или взято целое деление."
            fix: "Отступите от {{c}} см на 5 мм в обе стороны и досчитайте {{m}} мм."
            next: "Раздел T04 и предупреждение «Край линейки — не ноль» в T01."
          misconceptions:
            - id: E-geom-measure-edge-zero
              when: {field: {id: low, expr: "10 * c - 5"}}
              message: "Нижняя граница без зазора между краем ленты и нулём."
            - id: E-geom-measure-edge-zero
              when: {field: {id: high, expr: "10 * c + 5"}}
              message: "Верхняя граница без зазора между краем ленты и нулём."
