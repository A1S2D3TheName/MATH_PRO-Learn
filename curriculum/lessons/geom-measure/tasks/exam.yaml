        solution: |
          ### Ответ
          95 мм

          ### Идея
          Подпись — целые сантиметры от нуля, короткие штрихи после неё — миллиметры.

          ### Шаги
          1. 9 см = 90 мм.
          2. Ещё 5 мм: 91, 92, 93, 94, 95.
          3. Итого 9 см 5 мм, то есть 95 мм.

          ### Проверка
          95 мм лежит между подписями 9 и 10 см.

