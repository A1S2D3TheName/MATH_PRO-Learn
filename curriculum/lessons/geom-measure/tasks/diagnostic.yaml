# Входная диагностика (STANDARD.md §6, правило 15): по две задачи на каждый прямой пререквизит.
# Пакетов model-units и geom-basic-shapes ещё нет, поэтому ID outcome (`<тема>/LO-NN`) — предположение;
# sections ведут в разделы этой темы, где навык пререквизита повторяется (схема sectionRef не допускает
# `<тема>/Tnn`, см. вопросы к мейнтейнеру в PR).
tasks:
  - id: D-01
    type: number
    role: diagnostic
    purpose: procedure
    level: 0
    outcome: model-units/LO-02
    sections: [T01]
    minutes: 1
    unit: "мм"
    prompt: "Переведите в миллиметры: 6 см 4 мм."
    answer: 64
    hints:
      - "Вспомните, сколько миллиметров в одном сантиметре."
      - "Сантиметры дают десятки миллиметров, оставшиеся миллиметры — единицы."
      - "6 см — это 6 десятков миллиметров, и к ним ещё 4 мм."
    solution: |
      ### Ответ
      64 мм

      ### Идея
      1 см = 10 мм, поэтому 6 см — это 6 десятков миллиметров.

      ### Шаги
      1. 6 см = 60 мм.
      2. Ещё 4 мм встают в разряд единиц: 64 мм.

      ### Проверка
      64 мм — это 6 десятков и 4 единицы миллиметров, то есть 6 см 4 мм.

      ### Типичная ошибка
      Записать 10 мм или 604 мм, перепутав разряды.
    feedback:
      correct: "Верно: сантиметры стали десятками миллиметров, а миллиметры встали в разряд единиц."
      wrong:
        what: "Перевод в миллиметры неверен."
        why: "Возможно, забыто, что 1 см = 10 мм."
        fix: "Запишите 6 см как 60 мм и поставьте 4 мм в разряд единиц."
        next: "Повторите перевод единиц длины в теме про величины и единицы измерения; кратко — раздел T01."

  - id: D-02
    type: number
    role: diagnostic
    purpose: procedure
    level: 0
    outcome: model-units/LO-02
    sections: [T01]
    minutes: 1
    unit: "см"
    prompt: "Сколько сантиметров в 3 м?"
    answer: 300
    hints:
      - "Вспомните, сколько сантиметров в одном метре."
      - "Каждый метр — это одна сотня сантиметров."
      - "3 м — это 3 сотни сантиметров; запишите это число."
    solution: |
      ### Ответ
      300 см

      ### Идея
      1 м = 100 см.

      ### Шаги
      1. В каждом метре сотня сантиметров.
      2. 3 м — три сотни сантиметров, то есть 300 см.

      ### Проверка
      300 см — это 3 сотни сантиметров, то есть 3 м.

      ### Типичная ошибка
      Записать 30 см, перепутав метры с дециметрами.
    feedback:
      correct: "Верно: каждый метр дал сотню сантиметров."
      wrong:
        what: "Число сантиметров не совпало."
        why: "Похоже, забыто, что в метре 100 см."
        fix: "Запишите 3 м как 3 сотни сантиметров."
        next: "Повторите таблицу единиц длины в теме про величины; кратко — раздел T01."

  - id: D-03
    type: number
    role: diagnostic
    purpose: meaning
    level: 1
    outcome: geom-basic-shapes/LO-02
    sections: [T02]
    minutes: 1
    prompt: "Из точки O выходят три луча: OA, OB и OC. Каждая пара этих лучей образует угол с вершиной O. Сколько таких углов?"
    answer: 3
    hints:
      - "Угол — это вершина и два луча-стороны."
      - "Переберите пары лучей так, чтобы ни одна пара не повторилась."
      - "Начните с луча OA: он образует угол с OB и с OC; что остаётся без OA?"
    solution: |
      ### Ответ
      3 угла

      ### Идея
      Угол задаётся парой лучей с общей вершиной.

      ### Шаги
      1. Пары с лучом OA: углы AOB и AOC.
      2. Пара без OA: угол BOC.
      3. Всего три угла.

      ### Проверка
      Каждый луч входит ровно в два угла: OA — в AOB и AOC, OB — в AOB и BOC, OC — в AOC и BOC.

      ### Типичная ошибка
      Посчитать угол BOA отдельно от AOB — это один и тот же угол.
    feedback:
      correct: "Верно: каждая пара лучей посчитана один раз."
      wrong:
        what: "Число углов не совпало."
        why: "Возможно, одна пара лучей посчитана дважды или пропущена."
        fix: "Выпишите пары: OA и OB, OA и OC, OB и OC."
        next: "Повторите понятие угла в теме про точку, прямую, отрезок, луч и угол; кратко — раздел T02."

  - id: D-04
    type: number
    role: diagnostic
    purpose: meaning
    level: 0
    outcome: geom-basic-shapes/LO-03
    sections: [T03]
    minutes: 1
    trivial_answer_ok: true
    prompt: "Ровно в 3 часа стрелки часов образуют прямой угол — такой же, как уголок листа бумаги. В какой из моментов — ровно в 1 час, ровно в 4 часа или ровно в 6 часов — угол между стрелками тупой, то есть шире прямого, но стрелки не лежат на одной прямой? Введите число часов."
    answer: 4
    hints:
      - "Сравните каждый угол с уголком листа: уже он или шире."
      - "Если стрелки смотрят в противоположные стороны, они лежат на одной прямой."
      - "В 1 час часовая стрелка ближе к 12, чем в 3 часа, а в 6 часов она смотрит прямо вниз."
    solution: |
      ### Ответ
      4

      ### Идея
      Тупой угол шире прямого, но его стороны не лежат на одной прямой.

      ### Шаги
      1. В 1 час стрелки ближе друг к другу, чем в 3 часа, — угол острый.
      2. В 6 часов стрелки смотрят в противоположные стороны — угол развёрнутый.
      3. В 4 часа часовая стрелка ушла дальше, чем в 3 часа, но ещё не вниз — угол тупой.

      ### Проверка
      Сравните с уголком листа: в 4 часа стрелки разведены шире, чем в 3 часа, где угол прямой, но часовая стрелка ещё не смотрит прямо вниз, как в 6 часов, — значит, угол шире прямого и не развёрнутый.

      ### Типичная ошибка
      Выбрать 6 часов: этот угол шире прямого, но стрелки лежат на одной прямой.
    feedback:
      correct: "Верно: тупой угол шире прямого, а стрелки в 4 часа не лежат на одной прямой."
      wrong:
        what: "Выбран не тот момент."
        why: "Возможно, развёрнутый угол принят за тупой или острый угол оценён на глаз неверно."
        fix: "Сравните каждый угол с уголком листа и проверьте, не лежат ли стрелки на одной прямой."
        next: "Повторите виды углов на глаз в теме про угол; кратко — раздел T03."
