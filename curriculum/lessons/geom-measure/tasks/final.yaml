    unit: "°"
    depends_on: []
    prompt: "Угол кронштейна проверяют транспортиром: центр — в вершине, одна сторона проходит через 0 {{s}} шкалы. У другой стороны внешняя шкала показывает {{p}}, внутренняя — {{q}}. Сколько градусов в угле кронштейна?"
    answer: 94
    variants:
      - params: {a: 3, b: 41, n: 35, s: "внешней", p: 94, q: 86}
        answer: 94
        solution: |
          ### Ответ
          94°

          ### Идея
          Ноль внешней шкалы лежит на первой стороне кронштейна, поэтому читаем эту шкалу.

          ### Шаги
          1. Первая сторона — на нуле внешней шкалы.
          2. У второй стороны внешней шкала показывает 94.
          3. Угол кронштейна 94°.

          ### Проверка
          94 больше 90 — угол тупой; число другой шкалы, 86, считает угол от противоположного конца прямого края.

          ### Типичная ошибка
          Взять 86° — число шкалы, ноль которой не на первой стороне.
