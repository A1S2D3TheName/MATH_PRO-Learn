      Сдвинуть рейку на ноль.

      ### Типичная ошибка
      Прочитать число у правого конца.
    feedback:
      correct: "Верно: длина рейки посчитана по промежуткам, стёртый край не помешал."
      wrong:
        what: "Длина рейки не совпала."
        why: "Вероятно, взято число у правого конца или посчитаны штрихи."
