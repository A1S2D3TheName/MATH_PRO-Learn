          2. У второй стороны внутренней шкала показывает 87.
          3. Угол кронштейна 87°.

          ### Проверка
          87 меньше 90 — угол острый; число другой шкалы, 93, считает угол от противоположного конца прямого края.

          ### Типичная ошибка
