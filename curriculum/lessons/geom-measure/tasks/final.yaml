          1. Десятками: 16, 26, 36, 46, 56 — 5 десятков.
          2. Затем единицами: 57, 58 — 2 шага.
          3. Вместе 5 десятков и 2 единицы, то есть 52 см.

          ### Проверка
          Мысленно сдвинем рейку левым концом на ноль: правый конец окажется у отметки 52.

          ### Типичная ошибка
          Назвать 58 см — число у правого конца — вместо длины.
