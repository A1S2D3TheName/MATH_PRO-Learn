# Финальная цепочка (STANDARD.md §8): один сюжет, 5 шагов, общие параметры во всех вариантах.
# Реальные зависимости: F-02 использует длину рейки из F-01, F-04 — угол из F-03, F-05 — кусок из F-02.
title: Полка в прихожей
context_id: hallway-shelf
scenario: >
  Вы делаете настенную полку: меряете рейку рулеткой со стёртым краем, решаете, сколько отпилить,
  проверяете угол кронштейна транспортиром и оцениваете, насколько точно размечен отпиливаемый кусок.
tasks:
  - id: F-01
    type: number
    role: final-step
    purpose: procedure
    level: 1
    outcome: LO-01
    sections: [T01]
    minutes: 1
    unit: "см"
    depends_on: []
    prompt: "Рейку для полки положили вдоль рулетки со стёртым краем: левый конец рейки — у отметки {{a}} см, правый — у отметки {{b}} см. Какова длина рейки в сантиметрах?"
    answer: 38
    variants:
      - params: {a: 3, b: 41, n: 35, s: "внешней", p: 94, q: 86}
        answer: 38
        solution: |
          ### Ответ
          38 см

          ### Идея
          Край рулетки стёрт, поэтому длину считаем по промежуткам между отметками концов.

          ### Шаги
          1. Десятками: 13, 23, 33 — 3 десятка.
          2. Затем единицами: 34, 35, …, 41 — 8 шагов.
          3. Вместе 3 десятка и 8 единиц, то есть 38 см.

          ### Проверка
          Мысленно сдвинем рейку левым концом на ноль: правый конец окажется у отметки 38.

          ### Типичная ошибка
          Назвать 41 см — число у правого конца — вместо длины.
