# Повторение (STANDARD.md §8): 5 задач по 3 варианта; числа и условия не совпадают с практикой и примерами.
tasks:
  - id: R-01
    type: number
    role: refresh
    purpose: procedure
    level: 1
    outcome: LO-01
    sections: [T01]
    minutes: 2
    unit: "см"
    prompt: "Рейку положили вдоль рулетки: один её конец напротив отметки {{a}} см, другой — напротив отметки {{b}} см. Какова длина рейки в сантиметрах?"
    answer: 12
    variants:
      - params: {a: 7, b: 19}
        answer: 12
        solution: |
          ### Ответ
          12 см

          ### Идея
          Длина рейки — число сантиметровых промежутков между отметками её концов.

          ### Шаги
          1. Десятками: 17 — 1 десяток.
          2. Затем единицами: 18, 19 — 2 шага.
          3. Вместе 1 десяток и 2 единицы, то есть 12 см.

          ### Проверка
          Сдвинем рейку одним концом на ноль: второй конец окажется у отметки 12.

          ### Типичная ошибка
          Назвать 19 см — число у второго конца — или 13 см, посчитав штрихи.
      - params: {a: 14, b: 30}
        answer: 16
        solution: |
          ### Ответ
          16 см

          ### Идея
          Длина рейки — число сантиметровых промежутков между отметками её концов.

          ### Шаги
          1. Десятками: 24 — 1 десяток.
          2. Затем единицами: 25, 26, 27, 28, 29, 30 — 6 шагов.
          3. Вместе 1 десяток и 6 единиц, то есть 16 см.

          ### Проверка
          Сдвинем рейку одним концом на ноль: второй конец окажется у отметки 16.

          ### Типичная ошибка
          Назвать 30 см — число у второго конца — или 17 см, посчитав штрихи.
      - params: {a: 5, b: 23}
        answer: 18
        solution: |
          ### Ответ
          18 см

          ### Идея
          Длина рейки — число сантиметровых промежутков между отметками её концов.

          ### Шаги
          1. Десятками: 15 — 1 десяток.
          2. Затем единицами: 16, 17, …, 23 — 8 шагов.
          3. Вместе 1 десяток и 8 единиц, то есть 18 см.

          ### Проверка
          Сдвинем рейку одним концом на ноль: второй конец окажется у отметки 18.

          ### Типичная ошибка
          Назвать 23 см — число у второго конца — или 19 см, посчитав штрихи.
    hints:
      - "Ни один конец не на нуле: число у конца — это расстояние от нуля рулетки."
      - "Считайте сантиметровые шаги между отметками, длинный путь — сначала десятками."
      - "От отметки {{a}} отсчитайте десяток и посмотрите, сколько ещё шагов осталось до {{b}}."
    solution: |
      ### Ответ
      Число сантиметровых промежутков между отметками концов.

      ### Идея
      Счёт промежутков.

      ### Шаги
      1. Отсчитать десятки.
      2. Досчитать единицы.

      ### Проверка
      Сдвинуть рейку на ноль.

      ### Типичная ошибка
      Прочитать число у конца.
    feedback:
      correct: "Верно: длина рейки найдена счётом промежутков от одной отметки до другой."
      wrong:
        what: "Длина рейки не совпала."
        why: "Вероятно, взято число у конца или посчитаны штрихи."
        fix: "Считайте шаги от {{a}} до {{b}}: сначала десяток, затем единицы."
        next: "Раздел T01, пример 1 «Отрезок не от нуля»."
      misconceptions:
        - id: E-geom-measure-end-mark
          when: {expr: "b"}
          message: "Это число у второго конца, расстояние от нуля рулетки, а первый конец стоит у отметки {{a}}."
        - id: E-geom-measure-count-marks
          when: {expr: "b - a + 1"}
          message: "На один больше, чем нужно: похоже, посчитаны штрихи, а не промежутки."

  - id: R-02
    type: number
    role: refresh
    purpose: procedure
    level: 1
    outcome: LO-01
    sections: [T01]
    minutes: 2
    unit: "мм"
    prompt: "Длину гвоздя меряют линейкой: шляпка — у нулевого штриха, острие — на {{m}} мм дальше подписи {{c}} см. Какова длина гвоздя в миллиметрах?"
    answer: 68
    variants:
      - params: {m: 8, c: 6}
        answer: 68
        solution: |
          ### Ответ
          68 мм

          ### Идея
          Подпись даёт сантиметры от нуля, короткие штрихи после неё — миллиметры.

          ### Шаги
          1. 6 см = 60 мм.
          2. После подписи ещё 8 мм: 61, 62, …, 68.
          3. Длина гвоздя 68 мм.

          ### Проверка
          68 мм лежит между подписями 6 и 7 см, то есть между 60 и 70 мм.

          ### Типичная ошибка
          Записать 60 мм, потеряв миллиметры после подписи.
      - params: {m: 5, c: 4}
        answer: 45
        solution: |
          ### Ответ
          45 мм

          ### Идея
          Подпись даёт сантиметры от нуля, короткие штрихи после неё — миллиметры.

          ### Шаги
          1. 4 см = 40 мм.
          2. После подписи ещё 5 мм: 41, 42, 43, 44, 45.
          3. Длина гвоздя 45 мм.

          ### Проверка
          45 мм лежит между подписями 4 и 5 см, то есть между 40 и 50 мм.

          ### Типичная ошибка
          Записать 40 мм, потеряв миллиметры после подписи.
      - params: {m: 3, c: 10}
        answer: 103
        solution: |
          ### Ответ
          103 мм

          ### Идея
          Подпись даёт сантиметры от нуля, короткие штрихи после неё — миллиметры.

          ### Шаги
          1. 10 см = 100 мм.
          2. После подписи ещё 3 мм: 101, 102, 103.
          3. Длина гвоздя 103 мм.

          ### Проверка
          103 мм лежит между подписями 10 и 11 см, то есть между 100 и 110 мм.

          ### Типичная ошибка
          Записать 100 мм, потеряв миллиметры после подписи.
    hints:
      - "Начало гвоздя на нуле, поэтому важно только, где кончается острие."
      - "Подпись — целые сантиметры; переведите их в миллиметры и досчитайте короткие штрихи."
      - "{{c}} см — это {{c|pl:десяток,десятка,десятков}} миллиметров; к этой отметке досчитайте {{m}} мм."
    solution: |
      ### Ответ
      Сантиметры подписи в миллиметрах вместе с миллиметрами после неё.

      ### Идея
      Подпись и короткие штрихи.

      ### Шаги
      1. Перевести подпись.
      2. Досчитать миллиметры.

      ### Проверка
      Сравнить с соседними подписями.

      ### Типичная ошибка
      Потерять миллиметры.
    feedback:
      correct: "Верно: подпись переведена в миллиметры, и короткие штрихи после неё досчитаны."
      wrong:
        what: "Длина гвоздя не совпала."
        why: "Похоже, потеряны миллиметры после подписи."
        fix: "Запишите {{c}} см в миллиметрах и досчитайте {{m}} мм."
        next: "Раздел T01, пример 3 «Миллиметры после подписи»."
      misconceptions:
        - id: E-geom-measure-label-only
          when: {expr: "10 * c"}
          message: "Это только подпись {{c}} см. Острие ушло дальше ещё на {{m}} мм."

  - id: R-03
    type: number
    role: refresh
    purpose: procedure
    level: 2
    outcome: LO-02
    sections: [T02]
    minutes: 3
    unit: "°"
    prompt: "Сторона OA проходит через 0 {{s}} шкалы. Сторона OB проходит на {{k|pl:мелкое деление,мелких деления,мелких делений}} дальше подписи {{p}} этой же шкалы, в сторону больших чисел; другая шкала в этой точке показывает {{r}}. Сколько градусов в угле AOB?"
    answer: 56
    variants:
      - params: {s: "внешней", k: 6, p: 50, r: 124}
        answer: 56
        solution: |
          ### Ответ
          56°

          ### Идея
          Ноль внешней шкалы лежит на OA — читаем её: подпись и мелкие деления после неё.

          ### Шаги
          1. Шкала — та, у которой ноль на OA; число 124 другой шкалы не нужно.
          2. Последняя подпись перед OB — 50.
          3. Досчитываем: 51, 52, 53, 54, 55, 56 — угол 56°.

          ### Проверка
          56 меньше 90 — угол острый, а число 124 дало бы тупой угол: это отсчёт от другого конца прямого края.

          ### Типичная ошибка
          Записать 124° — число другой шкалы — или 50° — подпись без мелких делений.
      - params: {s: "внутренней", k: 2, p: 130, r: 48}
        answer: 132
        solution: |
          ### Ответ
          132°

          ### Идея
          Ноль внутренней шкалы лежит на OA — читаем её: подпись и мелкие деления после неё.

          ### Шаги
          1. Шкала — та, у которой ноль на OA; число 48 другой шкалы не нужно.
          2. Последняя подпись перед OB — 130.
          3. Досчитываем: 131, 132 — угол 132°.

          ### Проверка
          132 больше 90 — угол тупой, а число 48 дало бы острый угол: это отсчёт от другого конца прямого края.

          ### Типичная ошибка
          Записать 48° — число другой шкалы — или 130° — подпись без мелких делений.
      - params: {s: "внешней", k: 4, p: 10, r: 166}
        answer: 14
        solution: |
          ### Ответ
          14°

          ### Идея
          Ноль внешней шкалы лежит на OA — читаем её: подпись и мелкие деления после неё.

          ### Шаги
          1. Шкала — та, у которой ноль на OA; число 166 другой шкалы не нужно.
          2. Последняя подпись перед OB — 10.
          3. Досчитываем: 11, 12, 13, 14 — угол 14°.

          ### Проверка
          14 меньше 90 — угол острый, а число 166 дало бы тупой угол: это отсчёт от другого конца прямого края.

          ### Типичная ошибка
          Записать 166° — число другой шкалы — или 10° — подпись без мелких делений.
    hints:
      - "Шкалу выбирают по нулю на первой стороне угла."
      - "По выбранной шкале возьмите подпись и досчитайте мелкие деления; число другой шкалы отложите."
      - "OA проходит через 0 {{s}} шкалы; от подписи {{p}} этой шкалы сделайте шаги по мелким делениям."
    solution: |
      ### Ответ
      Подпись шкалы с нулём на OA и мелкие деления после неё.

      ### Идея
      Выбор шкалы и досчёт делений.

      ### Шаги
      1. Выбрать шкалу.
      2. Взять подпись.
      3. Досчитать деления.

      ### Проверка
      Сверить вид угла.

      ### Типичная ошибка
      Взять число другой шкалы.
    feedback:
      correct: "Верно: выбрана шкала с нулём на OA, и к подписи досчитаны мелкие деления."
      wrong:
        what: "Угол AOB назван неверно."
        why: "Возможно, прочитана другая шкала или не досчитаны мелкие деления."
        fix: "Возьмите подпись {{p}} {{s}} шкалы и досчитайте {{k|pl:мелкое деление,мелких деления,мелких делений}}."
        next: "Раздел T02, порядок «Как измерить угол транспортиром»."
      misconceptions:
        - id: E-geom-measure-wrong-scale
          when: {expr: "r"}
          message: "Это число другой шкалы: её ноль лежит не на стороне OA."
        - id: E-geom-measure-label-only
          when: {expr: "p"}
          message: "Это только подпись {{p}} — мелкие деления после неё не досчитаны."

  - id: R-04
    type: numbers
    role: refresh
    purpose: meaning
    level: 2
    outcome: LO-02
    sections: [T03]
    minutes: 3
    prompt: "Углы пяти кронштейнов: {{x1}}°, {{x2}}°, {{x3}}°, {{x4}}° и {{x5}}°. Сколько из них острых и сколько тупых?"
    fields:
      - {id: acute, label: "Острых углов"}
      - {id: obtuse, label: "Тупых углов"}
    answer: {acute: 2, obtuse: 2}
    errors: [E-geom-measure-near-right]
    variants:
      - params: {x1: 90, x2: 87, x3: 135, x4: 179, x5: 12}
        answer: {acute: 2, obtuse: 2}
        solution: |
          ### Ответ
          Острых — 2, тупых — 2.

          ### Идея
          Сравниваем каждый угол с 90° и 180°.

          ### Шаги
          1. Меньше 90°: 87°, 12° — острых 2.
          2. Больше 90° и меньше 180°: 135°, 179° — тупых 2.
          3. Остальные: 90° — прямой.

          ### Проверка
          Пять углов разложены полностью: 2 острых, 2 тупых и 1 — граничные значения 90° или 180°.

          ### Типичная ошибка
          Считать угол в нескольких градусах от 90° прямым или 180° — тупым.
      - params: {x1: 93, x2: 88, x3: 150, x4: 179, x5: 90}
        answer: {acute: 1, obtuse: 3}
        solution: |
          ### Ответ
          Острых — 1, тупых — 3.

          ### Идея
          Сравниваем каждый угол с 90° и 180°.

          ### Шаги
          1. Меньше 90°: 88° — острых 1.
          2. Больше 90° и меньше 180°: 93°, 150°, 179° — тупых 3.
          3. Остальные: 90° — прямой.

          ### Проверка
          Пять углов разложены полностью: 1 острых, 3 тупых и 1 — граничные значения 90° или 180°.

          ### Типичная ошибка
          Считать угол в нескольких градусах от 90° прямым или 180° — тупым.
      - params: {x1: 30, x2: 86, x3: 92, x4: 180, x5: 75}
        answer: {acute: 3, obtuse: 1}
        solution: |
          ### Ответ
          Острых — 3, тупых — 1.

          ### Идея
          Сравниваем каждый угол с 90° и 180°.

          ### Шаги
          1. Меньше 90°: 30°, 86°, 75° — острых 3.
          2. Больше 90° и меньше 180°: 92° — тупых 1.
          3. Остальные: 180° — развёрнутый.

          ### Проверка
          Пять углов разложены полностью: 3 острых, 1 тупых и 1 — граничные значения 90° или 180°.

          ### Типичная ошибка
          Считать угол в нескольких градусах от 90° прямым или 180° — тупым.
    hints:
      - "Острый угол меньше 90°, тупой — больше 90° и меньше 180°."
      - "Ровно 90° и ровно 180° — не острые и не тупые."
      - "Начните с угла {{x2}}°: сравните его с 90 и 180."
    solution: |
      ### Ответ
      Число острых и тупых углов.

      ### Идея
      Сравнение с 90° и 180°.

      ### Шаги
      1. Отобрать острые.
      2. Отобрать тупые.

      ### Проверка
      Все углы попали в один из видов.

      ### Типичная ошибка
      Считать почти прямой угол прямым.
    feedback:
      correct: "Верно: каждый кронштейн отнесён к виду по сравнению с 90° и 180°."
      wrong:
        what: "Число острых или тупых углов не совпало."
        why: "Возможно, угол около 90° посчитан прямым или 180° — тупым."
        fix: "Сравните каждое число с 90 и 180 по цифрам, а не на глаз."
        next: "Раздел T03, определения видов углов."

  - id: R-05
    type: numbers
    role: refresh
    purpose: procedure
    level: 2
    outcome: LO-01
    sections: [T04]
    minutes: 3
    prompt: "Ремень меряют сантиметровой лентой без миллиметровых штрихов; его конец прошёл отметку {{a}} см на {{m}} мм. Какую отметку записать по ближайшему делению и на сколько миллиметров эта запись отличается от настоящей длины?"
    fields:
      - {id: mark, label: "Записанная отметка, см"}
      - {id: error, label: "Расхождение, мм"}
    answer: {mark: 87, error: 2}
    variants:
      - params: {a: 86, m: 8}
        answer: {mark: 87, error: 2}
        solution: |
          ### Ответ
          Отметка 87 см, расхождение 2 мм.

          ### Идея
          Записывают ближайшую отметку; расхождение — путь от конца до этой отметки.

          ### Шаги
          1. До отметки 86 — 8 мм, до отметки 87 — 2 мм.
          2. Ближе отметка 87 см — её и записывают.
          3. От конца до отметки 87 — 2 мм: это и есть погрешность записи.

          ### Проверка
          2 мм не больше половины деления ленты, 5 мм, — так и должно быть при отсчёте по ближайшей отметке.

          ### Типичная ошибка
          Записать пройденную отметку 86 см без сравнения расстояний.
      - params: {a: 64, m: 3}
        answer: {mark: 64, error: 3}
        solution: |
          ### Ответ
          Отметка 64 см, расхождение 3 мм.

          ### Идея
          Записывают ближайшую отметку; расхождение — путь от конца до этой отметки.

          ### Шаги
          1. До отметки 64 — 3 мм, до отметки 65 — 7 мм.
          2. Ближе отметка 64 см — её и записывают.
          3. От конца до отметки 64 — 3 мм: это и есть погрешность записи.

          ### Проверка
          3 мм не больше половины деления ленты, 5 мм, — так и должно быть при отсчёте по ближайшей отметке.

          ### Типичная ошибка
          Записать следующую отметку 65 см: до неё 7 мм, дальше, чем до 64.
      - params: {a: 105, m: 6}
        answer: {mark: 106, error: 4}
        solution: |
          ### Ответ
          Отметка 106 см, расхождение 4 мм.

          ### Идея
          Записывают ближайшую отметку; расхождение — путь от конца до этой отметки.

          ### Шаги
          1. До отметки 105 — 6 мм, до отметки 106 — 4 мм.
          2. Ближе отметка 106 см — её и записывают.
          3. От конца до отметки 106 — 4 мм: это и есть погрешность записи.

          ### Проверка
          4 мм не больше половины деления ленты, 5 мм, — так и должно быть при отсчёте по ближайшей отметке.

          ### Типичная ошибка
          Записать пройденную отметку 105 см без сравнения расстояний.
    hints:
      - "Сравните, до какой из двух соседних отметок от конца ближе."
      - "Расхождение — это путь от конца ремня до записанной отметки."
      - "Конец ушёл за отметку {{a}} на {{m}} мм, а промежуток между отметками — 10 мм: где конец относительно середины промежутка?"
    solution: |
      ### Ответ
      Ближайшая отметка и путь от конца до неё.

      ### Идея
      Отсчёт по ближайшему делению.

      ### Шаги
      1. Сравнить расстояния до соседних отметок.
      2. Записать ближайшую.
      3. Найти расхождение.

      ### Проверка
      Расхождение не больше 5 мм.

      ### Типичная ошибка
      Брать пройденную отметку без сравнения.
    feedback:
      correct: "Верно: записана ближайшая отметка, и расхождение не превышает половины деления."
      wrong:
        what: "Отметка или расхождение не совпали."
        why: "Возможно, записана пройденная отметка без сравнения расстояний."
        fix: "Сравните {{m}} мм с путём до следующей отметки и возьмите меньшее."
        next: "Раздел T04, абзац «Какая отметка ближе»."
