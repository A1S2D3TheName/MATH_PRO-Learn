          При сдвиге линейки длина бруска не меняется: между отметками концов по-прежнему 21 сантиметровых промежуток.

          ### Шаги
          1. Длина бруска — 21 см: так показала линейка, приложенная нулём; откладываем её от отметки 4.
          2. Десятками: 14, 24 — 2 десятка.
          3. Затем единицами: 25 — 1 шаг.
          4. Правый конец — у отметки 25.

          ### Проверка
          Между отметками 4 и 25 снова 21 промежуток — длина бруска та же.

          ### Типичная ошибка
          Ответить 21: число у правого конца изменилось вместе со сдвигом линейки, а длина — нет.
    hints:
