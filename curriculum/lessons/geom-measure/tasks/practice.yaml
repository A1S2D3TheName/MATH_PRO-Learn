      - "Точность 1 мм требует миллиметровых делений, а 4 м за одно приложение — шкалы длиннее 4 м."
    solution: |
      ### Ответ
      Фанера — линейка с миллиметрами; запястье — гибкая лента; комната — рулетка 5 м; пандус — транспортир; метровая рейка лишняя.

      ### Идея
      Инструмент выбирают по трём признакам: что измеряем (длину или угол), хватит ли длины шкалы и достаточно ли мелкие деления.

      ### Шаги
      1. Угол меряют транспортиром — он достаётся пандусу.
      2. Точность до 1 мм даёт только шкала с миллиметровыми делениями — линейка для фанеры.
      3. Обхват запястья кривой, его повторяет только гибкая лента.
      4. Комнату около 4 м за одно приложение покрывает только рулетка 5 м: лента 150 см и метровая рейка короче.

      ### Проверка
      Рейка с отметками через 10 см не подходит ни к одному измерению: для фанеры у неё слишком крупные деления, запястье она не обогнёт, а для комнаты она слишком короткая.

      ### Типичная ошибка
      Взять для фанеры рулетку: она длиннее, но её сантиметровые деления не дают точности до миллиметра.
    feedback:
