# Практика (STANDARD.md §8): 30 задач основного банка. LO-01 и LO-02 (core) — режим «С нуля за час»,
# LO-03 (deep) — только «Подробно». trivial_answer_ok: ответ — одно из чисел условия, но задача требует
# выбора (какую отметку или шкалу читать), а не переписывания числа (правило 60).
tasks:
  - id: P-01
    type: number
    role: warmup
    purpose: procedure
    level: 0
    outcome: LO-01
    sections: [T01]
    minutes: 1
    trivial_answer_ok: true
    unit: "см"
    prompt: "Брусок приложили к линейке так, что его левый конец совпал с нулевым штрихом, а правый оказался у отметки {{b}} см. Какова длина бруска в сантиметрах?"
    answer: 6
    variants:
      - params: {b: 6}
        answer: 6
        solution: |
          ### Ответ
          6 см

          ### Идея
          Начало бруска на нуле, поэтому отметка у второго конца — это и есть длина.

          ### Шаги
          1. Левый конец совмещён с нулевым штрихом — отдельно считать промежутки не нужно.
          2. У правого конца стоит 6: длина бруска 6 см.

          ### Проверка
          Шаги от нуля заканчиваются на 1, 2, 3, 4, 5, 6 — 6 промежутков.

          ### Типичная ошибка
          Посчитать штрихи вместе с нулевым и получить 7: штрихов на один больше, чем промежутков.
      - params: {b: 9}
        answer: 9
        solution: |
          ### Ответ
          9 см

          ### Идея
          Начало бруска на нуле, поэтому отметка у второго конца — это и есть длина.

          ### Шаги
          1. Левый конец совмещён с нулевым штрихом — отдельно считать промежутки не нужно.
          2. У правого конца стоит 9: длина бруска 9 см.

          ### Проверка
          Шаги от нуля заканчиваются на 1, 2, …, 9 — 9 промежутков.

          ### Типичная ошибка
          Посчитать штрихи вместе с нулевым и получить 10: штрихов на один больше, чем промежутков.
    hints:
      - "Подумайте, от какой отметки отсчитывается число у каждого штриха."
      - "Если начало бруска лежит на нуле, считать промежутки отдельно не нужно."
      - "Правый конец у отметки {{b}}, левый — у отметки 0: от какой отметки считаются сантиметры у штриха?"
    solution: |
      ### Ответ
      Длина бруска равна отметке у правого конца, в сантиметрах.

      ### Идея
      Начало на нуле: число у второго конца показывает длину.

      ### Шаги
      1. Убедиться, что левый конец на нулевом штрихе.
      2. Прочитать число у правого конца.

      ### Проверка
      Посчитать сантиметровые промежутки от нуля до правого конца.

      ### Типичная ошибка
      Считать штрихи вместе с нулевым — получится на один больше.
    feedback:
      correct: "Верно: ноль совмещён с началом бруска, поэтому отметка у правого конца и есть его длина."
      wrong:
        what: "Длина бруска названа неверно."
        why: "Возможно, посчитаны штрихи вместе с нулевым или прочитана соседняя подпись."
        fix: "Найдите число у правого конца: при начале на нуле оно равно длине."
        next: "Раздел T01, абзац об отрезке на шкале и нулевом штрихе."

  - id: P-02
    type: number
    role: warmup
    purpose: procedure
    level: 0
    outcome: LO-01
    sections: [T01]
    minutes: 1
    unit: "мм"
    prompt: "На линейке между соседними сантиметровыми подписями по 10 миллиметровых промежутков. Сколько миллиметров от нулевого штриха до подписи {{c}} см?"
    answer: 70
    variants:
      - params: {c: 7}
        answer: 70
        solution: |
          ### Ответ
          70 мм

          ### Идея
          Каждый сантиметр — это 10 мм, поэтому 7 см — это 7 десятков миллиметров.

          ### Шаги
          1. От нуля до подписи 7 — 7 сантиметровых промежутков.
          2. В каждом 10 мм, то есть всего 7 десятков миллиметров: 70 мм.

          ### Проверка
          Обратный перевод: 70 мм — это 7 десятков миллиметров, то есть 7 см.

          ### Типичная ошибка
          Записать 7 мм, забыв перевести сантиметры в миллиметры.
      - params: {c: 12}
        answer: 120
        solution: |
          ### Ответ
          120 мм

          ### Идея
          Каждый сантиметр — это 10 мм, поэтому 12 см — это 12 десятков миллиметров.

          ### Шаги
          1. От нуля до подписи 12 — 12 сантиметровых промежутков.
          2. В каждом 10 мм, то есть всего 12 десятков миллиметров: 120 мм.

          ### Проверка
          Обратный перевод: 120 мм — это 12 десятков миллиметров, то есть 12 см.

          ### Типичная ошибка
          Записать 12 мм, забыв перевести сантиметры в миллиметры.
    hints:
      - "Вспомните, сколько миллиметров в одном сантиметре."
      - "Каждый сантиметровый промежуток — это один десяток миллиметров."
      - "До подписи {{c}} столько десятков миллиметров, сколько сантиметров; запишите это число десятков."
    solution: |
      ### Ответ
      Число сантиметров, записанное десятками миллиметров.

      ### Идея
      1 см = 10 мм.

      ### Шаги
      1. Посчитать сантиметровые промежутки до подписи.
      2. Записать их как десятки миллиметров.

      ### Проверка
      Перевести ответ обратно в сантиметры.

      ### Типичная ошибка
      Оставить число сантиметров без перевода.
    feedback:
      correct: "Верно: каждый из сантиметров дал десяток миллиметров."
      wrong:
        what: "Число миллиметров не совпало."
        why: "Похоже, сантиметры не переведены в миллиметры."
        fix: "Запишите число сантиметров как число десятков миллиметров."
        next: "Раздел T01: перевод 1 см = 10 мм и цена деления школьной линейки."

  - id: P-03
    type: number
    role: supported
    purpose: procedure
    level: 1
    outcome: LO-01
    sections: [T01]
    minutes: 1
    unit: "см"
    prompt: "Отрезок лежит вдоль линейки: левый конец — у отметки {{a}} см, правый — у отметки {{b}} см. Посчитайте сантиметровые промежутки между отметками и введите длину отрезка в сантиметрах."
    answer: 5
    variants:
      - params: {a: 3, b: 8}
        answer: 5
        solution: |
          ### Ответ
          5 см

          ### Идея
          Левый конец не на нуле, поэтому считаем шаги от отметки 3 до отметки 8.

          ### Шаги
          1. Первый шаг заканчивается на отметке 4.
          2. Шаги: 4, 5, 6, 7, 8 — их 5.
          3. Длина отрезка 5 см.

          ### Проверка
          Сдвинем отрезок левым концом на ноль: 5 шагов от нуля приводят к отметке 5, отрезок помещается между 0 и 5.

          ### Типичная ошибка
          Ответ 8 см — это расстояние от нуля до правого конца, а ответ 6 см получается, если считать штрихи вместо промежутков.
      - params: {a: 4, b: 11}
        answer: 7
        solution: |
          ### Ответ
          7 см

          ### Идея
          Левый конец не на нуле, поэтому считаем шаги от отметки 4 до отметки 11.

          ### Шаги
          1. Первый шаг заканчивается на отметке 5.
          2. Шаги: 5, 6, …, 11 — их 7.
          3. Длина отрезка 7 см.

          ### Проверка
          Сдвинем отрезок левым концом на ноль: 7 шагов от нуля приводят к отметке 7, отрезок помещается между 0 и 7.

          ### Типичная ошибка
          Ответ 11 см — это расстояние от нуля до правого конца, а ответ 8 см получается, если считать штрихи вместо промежутков.
      - params: {a: 6, b: 10}
        answer: 4
        solution: |
          ### Ответ
          4 см

          ### Идея
          Левый конец не на нуле, поэтому считаем шаги от отметки 6 до отметки 10.

          ### Шаги
          1. Первый шаг заканчивается на отметке 7.
          2. Шаги: 7, 8, 9, 10 — их 4.
          3. Длина отрезка 4 см.

          ### Проверка
          Сдвинем отрезок левым концом на ноль: 4 шага от нуля приводят к отметке 4, отрезок помещается между 0 и 4.

          ### Типичная ошибка
          Ответ 10 см — это расстояние от нуля до правого конца, а ответ 5 см получается, если считать штрихи вместо промежутков.
    hints:
      - "Число у штриха считает сантиметры от нуля, а левый конец отрезка не на нуле."
      - "Считайте шаги от штриха к штриху, начиная со штриха сразу после левого конца."
      - "Первый шаг — от {{a}} к следующей отметке, последний шаг заканчивается на отметке {{b}}."
    solution: |
      ### Ответ
      Число сантиметровых промежутков между отметками концов.

      ### Идея
      Длина — число единичных промежутков между концами.

      ### Шаги
      1. Начать со штриха после отметки левого конца.
      2. Считать шаги до отметки правого конца.

      ### Проверка
      Мысленно сдвинуть отрезок левым концом на ноль.

      ### Типичная ошибка
      Прочитать число у правого конца или посчитать штрихи.
    feedback:
      correct: "Верно: длина — это число сантиметровых промежутков между отметками концов, а не число у правого конца."
      wrong:
        what: "Длина отрезка названа неверно."
        why: "Вероятно, прочитано число у правого конца или посчитаны штрихи вместо промежутков."
        fix: "Отсчитайте шаги от отметки {{a}} до отметки {{b}} по одному."
        next: "Раздел T01, пример 1 «Отрезок не от нуля»."
      misconceptions:
        - id: E-geom-measure-end-mark
          when: {expr: "b"}
          message: "Вы назвали число у правого конца. Это расстояние от нуля линейки, а левый конец отрезка стоит у отметки {{a}}."
        - id: E-geom-measure-count-marks
          when: {expr: "b - a + 1"}
          message: "Похоже, посчитаны штрихи вместе с начальным: штрихов на один больше, чем промежутков."

  - id: P-04
    type: number
    role: supported
    purpose: procedure
    level: 1
    outcome: LO-01
    sections: [T01]
    minutes: 1
    unit: "мм"
    prompt: "Левый конец карандаша совмещён с нулём линейки, а правый ушёл за подпись {{c}} см ещё на {{m}} мм. Какова длина карандаша в миллиметрах?"
    answer: 147
    variants:
      - params: {c: 14, m: 7}
        answer: 147
        solution: |
          ### Ответ
          147 мм

          ### Идея
          Подпись 14 — это 14 см, то есть 14 десятков миллиметров; к ним досчитываем миллиметры после подписи.

          ### Шаги
          1. 14 см = 140 мм.
          2. После подписи ещё 7 мм: 141, 142, …, 147.
          3. Длина — 14 см 7 мм, то есть 147 мм.

          ### Проверка
          147 мм лежит между 140 и 150 мм, ближе к 150, — так и стоит конец карандаша между подписями 14 и 15.

          ### Типичная ошибка
          Остановиться на подписи и записать 140 мм: миллиметры после подписи тоже входят в длину.
      - params: {c: 12, m: 3}
        answer: 123
        solution: |
          ### Ответ
          123 мм

          ### Идея
          Подпись 12 — это 12 см, то есть 12 десятков миллиметров; к ним досчитываем миллиметры после подписи.

          ### Шаги
          1. 12 см = 120 мм.
          2. После подписи ещё 3 мм: 121, 122, 123.
          3. Длина — 12 см 3 мм, то есть 123 мм.

          ### Проверка
          123 мм лежит между 120 и 130 мм, ближе к 120, — так и стоит конец карандаша между подписями 12 и 13.

          ### Типичная ошибка
          Остановиться на подписи и записать 120 мм: миллиметры после подписи тоже входят в длину.
    hints:
      - "Начало карандаша на нуле, поэтому подпись и штрихи после неё показывают длину целиком."
      - "Переведите сантиметры подписи в миллиметры, а затем досчитайте миллиметры после неё."
      - "Подпись {{c}} см — это {{c}} десятков миллиметров; от этой отметки отсчитайте ещё столько шагов, сколько миллиметров после подписи: {{m}}."
    solution: |
      ### Ответ
      Сантиметры подписи в миллиметрах и миллиметры после неё.

      ### Идея
      Подпись — целые сантиметры, короткие штрихи — миллиметры.

      ### Шаги
      1. Перевести подпись в миллиметры.
      2. Досчитать миллиметры после подписи.

      ### Проверка
      Сравнить ответ с соседними подписями.

      ### Типичная ошибка
      Отбросить миллиметры после подписи.
    feedback:
      correct: "Верно: сантиметры подписи переведены в миллиметры, и короткие штрихи после неё досчитаны."
      wrong:
        what: "Длина в миллиметрах не совпала."
        why: "Возможно, отброшены миллиметры после подписи или сантиметры не переведены в миллиметры."
        fix: "Запишите {{c}} см как {{c}} десятков миллиметров и досчитайте ещё {{m}} мм."
        next: "Раздел T01, пример 3 «Миллиметры после подписи»."
      misconceptions:
        - id: E-geom-measure-label-only
          when: {expr: "10 * c"}
          message: "Вы остановились на подписи {{c}} см. Миллиметры после неё — тоже часть длины."

  - id: P-05
    type: number
    role: supported
    purpose: procedure
    level: 1
    outcome: LO-01
    sections: [T04]
    minutes: 1
    trivial_answer_ok: true
    unit: "см"
    prompt: "Шнурок меряют сантиметровой лентой без миллиметровых штрихов. Конец шнурка прошёл отметку {{a}} см на {{m}} мм, а до отметки {{b}} см ему осталось {{r}} мм. Какую отметку записать по ближайшему делению? Введите число сантиметров."
    answer: 24
    variants:
      - params: {a: 23, m: 7, b: 24, r: 3}
        answer: 24
        solution: |
          ### Ответ
          24 см

          ### Идея
          Записывают ту отметку, до которой от конца ближе; середина промежутка — в 5 мм от каждой отметки.

          ### Шаги
          1. До отметки 23 — 7 мм, до отметки 24 — 3 мм.
          2. 3 мм меньше 7 мм — ближе отметка 24 см.
          3. Записываем 24 см.

          ### Проверка
          Конец прошёл середину промежутка (5 мм от отметки 23), значит, ближайшая — правая отметка.

          ### Типичная ошибка
          Записать последнюю пройденную отметку 23 см: конец ушёл за середину промежутка, и ближе отметка 24 см.
      - params: {a: 31, m: 2, b: 32, r: 8}
        answer: 31
        solution: |
          ### Ответ
          31 см

          ### Идея
          Записывают ту отметку, до которой от конца ближе; середина промежутка — в 5 мм от каждой отметки.

          ### Шаги
          1. До отметки 31 — 2 мм, до отметки 32 — 8 мм.
          2. 2 мм меньше 8 мм — ближе отметка 31 см.
          3. Записываем 31 см.

          ### Проверка
          Конец не дошёл до середины промежутка (5 мм от отметки 31), значит, ближайшая — левая отметка.

          ### Типичная ошибка
          Записать следующую отметку 32 см «с запасом»: до неё 8 мм, дальше, чем до отметки 31.
      - params: {a: 17, m: 6, b: 18, r: 4}
        answer: 18
        solution: |
          ### Ответ
          18 см

          ### Идея
          Записывают ту отметку, до которой от конца ближе; середина промежутка — в 5 мм от каждой отметки.

          ### Шаги
          1. До отметки 17 — 6 мм, до отметки 18 — 4 мм.
          2. 4 мм меньше 6 мм — ближе отметка 18 см.
          3. Записываем 18 см.

          ### Проверка
          Конец прошёл середину промежутка (5 мм от отметки 17), значит, ближайшая — правая отметка.

          ### Типичная ошибка
          Записать последнюю пройденную отметку 17 см: конец ушёл за середину промежутка, и ближе отметка 18 см.
    hints:
      - "Ближайшая отметка — та, до которой от конца шнурка меньше миллиметров."
      - "Сравните два расстояния: до пройденной отметки и до следующей."
      - "От конца до отметки {{a}} — {{m}} мм, до отметки {{b}} — {{r}} мм: какое расстояние меньше?"
    solution: |
      ### Ответ
      Отметка, до которой от конца шнурка ближе.

      ### Идея
      Отсчёт по ближайшему делению.

      ### Шаги
      1. Сравнить расстояния до двух соседних отметок.
      2. Выбрать отметку с меньшим расстоянием.

      ### Проверка
      Сравнить положение конца с серединой промежутка.

      ### Типичная ошибка
      Всегда записывать последнюю пройденную отметку.
    feedback:
      correct: "Верно: записана отметка, до которой от конца шнурка ближе."
      wrong:
        what: "Записана не ближайшая отметка."
        why: "Похоже, взята отметка без сравнения расстояний до соседних штрихов."
        fix: "Сравните {{m}} мм и {{r}} мм и выберите отметку с меньшим расстоянием."
        next: "Раздел T04, абзац «Какая отметка ближе»."

  - id: P-06
    type: number
    role: supported
    purpose: procedure
    level: 2
    outcome: LO-01
    sections: [T01]
    minutes: 1
    unit: "мм"
    prompt: "У линейки нулевой штрих отстоит от края на {{m}} мм. Брусок приложили не к нулю, а к краю линейки, и его второй конец оказался у отметки {{b}} мм. Какова длина бруска в миллиметрах?"
    answer: 64
    variants:
      - params: {m: 4, b: 60}
        answer: 64
        solution: |
          ### Ответ
          64 мм

          ### Идея
          От края до нуля ещё 4 мм, которых показание не учитывает; их надо досчитать.

          ### Шаги
          1. Отметка 60 — расстояние от нуля до второго конца.
          2. Между краем линейки, то есть началом бруска, и нулём ещё 4 мм.
          3. Досчитываем от 60: 61, 62, 63, 64 — длина 64 мм.

          ### Проверка
          Обратный ход: от 64 отсчитаем назад 4 шага — придём к 60, к показанию у второго конца.

          ### Типичная ошибка
          Записать 60 мм — отметку у конца без поправки на зазор между краем и нулём.
      - params: {m: 3, b: 85}
        answer: 88
        solution: |
          ### Ответ
          88 мм

          ### Идея
          От края до нуля ещё 3 мм, которых показание не учитывает; их надо досчитать.

          ### Шаги
