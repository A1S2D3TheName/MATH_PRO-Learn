# Паспорт темы (STANDARD.md §3). Поля section/stage/hours/grade/prerequisites/scope скопированы из
# tree.yaml — не редактируйте их здесь (правило 6).
id: num-line
title: "Натуральные числа на числовом луче"
section: num
stage: 1
hours: 2
grade: "1"
prerequisites: [num-compare]
version: "0.1.0"
summary: "Числовой луч как место, где числа живут: от начала отсчёта отсчитываются равные
единичные отрезки, по отметке читается координата точки, по соседним отметкам — предыдущее и
следующее число, а по самому положению точек — сравнение."

search:
  synonyms:  # не менее 10
    - числовой луч
    - единичный отрезок
    - координата точки
    - начало отсчёта
    - цена деления
    - отметка на луче
    - подпись отметки
    - луч с началом
    - шкала чисел
    - соседи числа
    - предыдущее число
    - следующее число
    - отсчёт делений
  questions:  # не менее 8 естественных русских вопросов
    - Как устроен числовой луч?
    - Что такое начало отсчёта?
    - Чем единичный отрезок отличается от соседнего?
    - Как по отметке найти координату точки?
    - Как называется число слева от данного?
    - Как сравнить два числа по их положению на луче?
    - Что такое цена деления и зачем она нужна?
    - Как нарисовать числовой луч, на котором подписаны не все отметки?

subtopics:
  - id: num-line/luch-nachalo-otscheta-edinichnyy
    title: "Луч, начало отсчёта, единичный отрезок"
    tree_ref: "Луч, начало отсчёта, единичный отрезок"
    synonyms: [числовой луч, начало отсчёта, единичный отрезок, луч с началом, шкала]
    sections: [T01]
  - id: num-line/koordinata-tochki
    title: "Координата точки"
    tree_ref: "Координата точки"
    synonyms: [координата точки, координата на луче, отметка, подпись, цена деления]
    sections: [T02, T05]
  - id: num-line/sosedi-chisla-predyduschee-i
    title: "Соседи числа, предыдущее и следующее"
    tree_ref: "Соседи числа, предыдущее и следующее"
    synonyms: [соседи числа, предыдущее число, следующее число, число слева, число справа]
    sections: [T03]
  - id: num-line/sravnenie-chisel-po-polozheniyu
    title: "Сравнение чисел по положению на луче"
    tree_ref: "Сравнение чисел по положению на луче"
    synonyms: [сравнение по лучу, справа больше, слева меньше, знак сравнения по лучу]
    sections: [T04]

outcomes:  # 1–3, уровни core/standard/deep
  - id: LO-01
    short: Находить координату точки на луче
    action: отсчитывать единичные отрезки от начала отсчёта и называть координату точки
    conditions: на луче с началом отсчёта отмечены точки, деления отмечены через равные отрезки
    criterion: называет координату верно и объясняет, сколько делений отсчитал от начала отсчёта
    level: core
    sections: [T01, T02]
  - id: LO-02
    short: Соседи числа и сравнение по лучу
    action: находить предыдущее и следующее число и сравнивать числа по их положению на луче
    conditions: даны два числа или отмечены две точки луча с подписями
    criterion: называет соседей верно и выбирает знак сравнения по положению точек, а не по памяти
    level: standard
    sections: [T03, T04]
  - id: LO-03
    short: Читать луч с крупным шагом
    action: находить цену деления и читать координаты на луче, где деления идут через несколько единиц
    conditions: дана лента с подписанными не всеми отметками и сказано, через сколько единиц идут деления
    criterion: находит цену деления, переводит номер деления в координату и объясняет ход рассуждения
    level: deep
    sections: [T05]

errors:  # 3–12 ID из errors/catalog.yaml
  - E-num-line-zero-as-first
  - E-num-line-label-shift
  - E-num-line-right-is-smaller
  - E-num-line-neighbor-two-away
  - E-num-line-counts-marks
  - E-num-line-extra-division
