# Входная диагностика (STANDARD.md §6, правило 15): четыре задачи по прямому пререквизиту
# num-compare; outcome записан как `num-compare/LO-NN` (пакет пререквизита ещё не опубликован).
# Схемы ссылаются на разделы своего пакета: `<prereq>/Tnn` запрещает валидатор (REF-SECTION),
# связь с пререквизитом несёт поле `outcome`. Вопрос вынесен в REVIEW.md.
tasks:
  - id: 'D-01'
    type: number
    role: diagnostic
    purpose: procedure
    level: 0
    outcome: 'num-compare/LO-01'
    sections:
      - T04
    minutes: 1
    prompt: 'В двух ящиках лежат болты: в левом {{a|pl:штука,штуки,штук}}, в правом {{b|pl:штука,штуки,штук}}. В каком ящике болтов больше? Введите это количество.'
    answer: 9
    variants:
      - params:
          a: 5
          b: 9
        answer: 9
        solution: |
          ### Ответ
          9

          ### Идея
          Больше там, где количество предметов больше: сравнивают сами количества.

          ### Шаги
          1. Слева 5 болтов, справа 9 болтов.
          2. Сравниваем числа: больше число 9.
          3. Значит, болтов больше в ящике, где их 9.

          ### Проверка
          Считаем по порядку от меньшего количества до большего: 9 приходит последним.

          ### Типичная ошибка
          Сравнивать наугад: числа из условия помогают точно, если сравнить их по величине.
      - params:
          a: 8
          b: 3
        answer: 8
        solution: |
          ### Ответ
          8

          ### Идея
          Больше там, где количество предметов больше: сравнивают сами количества.

          ### Шаги
          1. Слева 8 болтов, справа 3 болтов.
          2. Сравниваем числа: больше число 8.
          3. Значит, болтов больше в ящике, где их 8.

          ### Проверка
          Считаем по порядку от меньшего количества до большего: 8 приходит последним.

          ### Типичная ошибка
          Сравнивать наугад: числа из условия помогают точно, если сравнить их по величине.
    hints:
      - 'Как понять, где предметов больше?'
      - Сравните два числа по величине.
      - 'Сравните два числа из условия: больше то, до которого при счёте доходят позже.'
    solution: |
      ### Ответ
      9

      ### Идея
      Больше там, где количество предметов больше: сравнивают сами количества.

      ### Шаги
      1. Слева 5 болтов, справа 9 болтов.
      2. Сравниваем числа: больше число 9.
      3. Значит, болтов больше в ящике, где их 9.

      ### Проверка
      Считаем по порядку от меньшего количества до большего: 9 приходит последним.

      ### Типичная ошибка
      Сравнивать наугад: числа из условия помогают точно, если сравнить их по величине.
    feedback:
      correct: 'Верно: сравнение количеств даёт правильный ящик.'
      wrong:
        what: Указано не то количество.
        why: Возможно, числа сравнены на глаз, без счёта.
        fix: Сравните числа по величине и возьмите большее.
        next: Повторите сравнение чисел в теме про знаки сравнения.
  - id: 'D-02'
    type: number
    role: diagnostic
    purpose: procedure
    level: 0
    outcome: 'num-compare/LO-01'
    sections:
      - T04
    minutes: 1
    prompt: 'Какое из двух чисел больше: {{a}} или {{b}}? Введите это число.'
    answer: 12
    variants:
      - params:
          a: 12
          b: 7
        answer: 12
        solution: |
          ### Ответ
          12

          ### Идея
          Из двух чисел больше то, которое называют позже при счёте.

          ### Шаги
          1. Первое число — 12, второе — 7.
          2. При счёте число 12 называют позже.
          3. Значит, больше число 12.

          ### Проверка
          Считаем от меньшего числа к большему: порядок счёта подтверждает ответ 12.

          ### Типичная ошибка
          Считать большим число, которое записано первым.
      - params:
          a: 4
          b: 15
        answer: 15
        solution: |
          ### Ответ
          15

          ### Идея
          Из двух чисел больше то, которое называют позже при счёте.

          ### Шаги
          1. Первое число — 4, второе — 15.
          2. При счёте число 15 называют позже.
          3. Значит, больше число 15.

          ### Проверка
          Считаем от меньшего числа к большему: порядок счёта подтверждает ответ 15.

          ### Типичная ошибка
          Считать большим число, которое записано первым.
    hints:
      - 'Как сравнивают два числа?'
      - Больше то число, которое при счёте называют позже.
      - Считайте числа по порядку от меньшего к большему и отметьте, какое встретится первым.
    solution: |
      ### Ответ
      12

      ### Идея
      Из двух чисел больше то, которое называют позже при счёте.

      ### Шаги
      1. Первое число — 12, второе — 7.
      2. При счёте число 12 называют позже.
      3. Значит, больше число 12.

      ### Проверка
      Считаем от меньшего числа к большему: порядок счёта подтверждает ответ 12.

      ### Типичная ошибка
      Считать большим число, которое записано первым.
    feedback:
      correct: 'Верно: сравнение по порядку счёта дало верное число.'
      wrong:
        what: Названо не то число.
        why: Возможно, числа сравнены по количеству цифр или по порядку записи.
        fix: Считайте по порядку и сравните, какое число называют позже.
        next: Вернитесь к сравнению чисел в теме про знаки сравнения.
  - id: 'D-03'
    type: number
    role: diagnostic
    purpose: procedure
    level: 0
    outcome: 'num-compare/LO-02'
    sections:
      - T04
    minutes: 1
    prompt: 'Даны три числа: {{a}}, {{b}} и {{c}}. Введите наименьшее из них.'
    answer: 6
    variants:
      - params:
          a: 6
          b: 14
          c: 9
        answer: 6
        solution: |
          ### Ответ
          6

          ### Идея
          Наименьшее — то, которое при счёте называют раньше остальных.

          ### Шаги
          1. Числа: 6, 14, 9.
          2. Раньше всех при счёте называют 6.
          3. Значит, наименьшее число — 6.

          ### Проверка
          Проверим, что остальные числа больше: 6 называют первым из трёх.

          ### Типичная ошибка
          Выбирать число по его положению в записи, а не по величине.
      - params:
          a: 11
          b: 3
          c: 8
        answer: 3
        solution: |
          ### Ответ
          3

          ### Идея
          Наименьшее — то, которое при счёте называют раньше остальных.

          ### Шаги
          1. Числа: 11, 3, 8.
          2. Раньше всех при счёте называют 3.
          3. Значит, наименьшее число — 3.

          ### Проверка
          Проверим, что остальные числа больше: 3 называют первым из трёх.

          ### Типичная ошибка
          Выбирать число по его положению в записи, а не по величине.
    hints:
      - 'Как найти наименьшее из трёх чисел?'
      - Сравните три числа попарно.
      - 'Из чисел {{a}}, {{b}} и {{c}} наименьшее называют раньше всех при счёте.'
    solution: |
      ### Ответ
      6

      ### Идея
      Наименьшее — то, которое при счёте называют раньше остальных.

      ### Шаги
      1. Числа: 6, 14, 9.
      2. Раньше всех при счёте называют 6.
      3. Значит, наименьшее число — 6.

      ### Проверка
      Проверим, что остальные числа больше: 6 называют первым из трёх.

      ### Типичная ошибка
      Выбирать число по его положению в записи, а не по величине.
    feedback:
      correct: 'Верно: выбрано число, которое называют раньше всех.'
      wrong:
        what: Наименьшее число найдено неверно.
        why: Возможно, сравнение шло по порядку записи чисел.
        fix: Сравните числа попарно и оставьте самое маленькое.
        next: Повторите упорядочивание чисел в теме про сравнение.
