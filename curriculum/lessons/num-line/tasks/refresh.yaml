          ### Шаги
          1. Отметка с подписью 6 стоит левее.
          2. Отметка с подписью 15 стоит правее, до неё отсчитано больше отрезков.
          3. Значит, больше число 15.

          ### Проверка
          Считаем отрезки от начала отсчёта: до 15 их больше.

          ### Типичная ошибка
          E-num-line-right-is-smaller: назвать большим число, стоящее левее.
      - params:
          small: 8
          big: 11
        answer: 11
        solution: |
          ### Ответ
          11

          ### Идея
          Числа на луче растут вправо, поэтому правая отметка подписана большим числом.

          ### Шаги
          1. Отметка с подписью 8 стоит левее.
          2. Отметка с подписью 11 стоит правее, до неё отсчитано больше отрезков.
          3. Значит, больше число 11.

          ### Проверка
          Считаем отрезки от начала отсчёта: до 11 их больше.

          ### Типичная ошибка
          E-num-line-right-is-smaller: назвать большим число, стоящее левее.
      - params:
