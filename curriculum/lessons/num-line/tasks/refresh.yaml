          big: 18
        answer: 18
        solution: |
          ### Ответ
          18

          ### Идея
          Числа на луче растут вправо, поэтому правая отметка подписана большим числом.

          ### Шаги
          1. Отметка с подписью 3 стоит левее.
          2. Отметка с подписью 18 стоит правее, до неё отсчитано больше отрезков.
          3. Значит, больше число 18.

          ### Проверка
          Считаем отрезки от начала отсчёта: до 18 их больше.

          ### Типичная ошибка
          E-num-line-right-is-smaller: назвать большим число, стоящее левее.
