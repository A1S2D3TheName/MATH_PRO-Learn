  - id: 'R-05'
    type: number
    role: refresh
    purpose: meaning
    level: 1
    outcome: 'LO-02'
    sections:
      - T04
    minutes: 2
    prompt: 'На луче отмечены точки: под левой подпись {{small}}, под правой — {{big}}. Какое из этих чисел больше? Введите это число.'
