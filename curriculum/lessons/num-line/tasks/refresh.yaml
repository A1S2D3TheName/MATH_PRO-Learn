    solution: |
      ### Ответ
      9

      ### Идея
      Предыдущее число стоит на один единичный отрезок левее.

      ### Шаги
      1. Данное число — 10.
      2. Идём на один отрезок влево: между отметками нет других.
      3. Под соседней отметкой стоит 9.

      ### Проверка
      Шаг вправо от найденного числа возвращает к подписи {{n}}.

      ### Типичная ошибка
      Взять соседа через одну отметку.
    feedback:
      correct: 'Верно: сосед слева на единицу меньше.'
      wrong:
        what: Названо другое число.
        why: Возможно, между соседними отметками пропущено деление.
        fix: 'Шагните от {{n}} влево на одну отметку.'
        next: Повторите раздел T03.
  - id: 'R-03'
    type: number
    role: refresh
    purpose: procedure
    level: 2
    outcome: 'LO-03'
    sections:
