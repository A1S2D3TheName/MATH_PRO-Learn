# Интервальное повторение (STANDARD.md §8, правило 75): пять задач, у каждой не менее трёх
# вариантов, новые числа и контексты — практику и примеры они не повторяют (правило 172).
tasks:
  - id: 'R-01'
    type: number
    role: refresh
    purpose: procedure
    level: 1
    outcome: 'LO-01'
    sections:
      - T01
    minutes: 2
    prompt: 'На рейке в цехе метки идут через один единичный отрезок. Две метки подписаны {{a}} и {{b}}. Сколько единичных отрезков от одной метки до другой?'
    answer: 7
    variants:
      - params:
          a: 6
          b: 13
        answer: 7
        solution: |
          ### Ответ
          7

          ### Идея
          Число отрезков между метками считают переходами от меньшей подписи к большей.

          ### Шаги
          1. Метки подписаны 6 и 13.
          2. Переходим по меткам вправо: 6, затем следующая, и так до 13.
          3. Переходов получилось 7, значит и отрезков столько же.

          ### Проверка
          Обратный переход от большей подписи к меньшей даёт то же число.

          ### Типичная ошибка
          E-num-line-counts-marks: посчитать подписи вместе с крайними.
      - params:
          a: 2
          b: 10
        answer: 8
        solution: |
          ### Ответ
          8

          ### Идея
          Число отрезков между метками считают переходами от меньшей подписи к большей.

          ### Шаги
          1. Метки подписаны 2 и 10.
          2. Переходим по меткам вправо: 2, затем следующая, и так до 10.
          3. Переходов получилось 8, значит и отрезков столько же.

          ### Проверка
          Обратный переход от большей подписи к меньшей даёт то же число.

          ### Типичная ошибка
          E-num-line-counts-marks: посчитать подписи вместе с крайними.
      - params:
          a: 7
          b: 9
        answer: 2
        solution: |
          ### Ответ
          2

          ### Идея
          Число отрезков между метками считают переходами от меньшей подписи к большей.

          ### Шаги
          1. Метки подписаны 7 и 9.
          2. Переходим по меткам вправо: 7, затем следующая, и так до 9.
          3. Переходов получилось 2, значит и отрезков столько же.

          ### Проверка
          Обратный переход от большей подписи к меньшей даёт то же число.

          ### Типичная ошибка
          E-num-line-counts-marks: посчитать подписи вместе с крайними.
    hints:
      - 'Что лежит между двумя метками рейки?'
      - Между метками лежат отрезки, каждый длиной в один единичный отрезок.
      - 'Считайте переходы от подписи {{a}} до подписи {{b}}.'
    solution: |
      ### Ответ
      7

      ### Идея
      Число отрезков между метками считают переходами от меньшей подписи к большей.

      ### Шаги
      1. Метки подписаны 6 и 13.
      2. Переходим по меткам вправо: 6, затем следующая, и так до 13.
      3. Переходов получилось 7, значит и отрезков столько же.

      ### Проверка
      Обратный переход от большей подписи к меньшей даёт то же число.

      ### Типичная ошибка
      E-num-line-counts-marks: посчитать подписи вместе с крайними.
    feedback:
      correct: 'Верно: число переходов равно числу отрезков между метками.'
      wrong:
        what: Число отрезков не совпало.
        why: Возможно, в счёт попали крайние подписи.
        fix: Считайте переходы, не включая первую подпись.
        next: Перечитайте пример 3 в разделе T01.
      misconceptions:
        - id: 'E-num-line-counts-marks'
          when:
            expr: '(b - a) + 1'
          message: Похоже, посчитаны подписи вместе с крайними метками.
    errors:
      - 'E-num-line-counts-marks'
