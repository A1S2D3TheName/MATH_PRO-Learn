          ### Шаги
          1. Цена деления шкалы — 10 единиц.
          2. Стрелка стоит в 5-м делении от начала.
          3. Отсчитываем деления по 10 и получаем 50.

          ### Проверка
          Обратный счёт: от 50 называем числа через 10 назад — 50, 60, 70, 80 — и приходим к началу шкалы.

          ### Типичная ошибка
          E-num-line-extra-division: посчитать начало отсчёта лишним делением.
      - params:
          k: 4
          step: 25
        answer: 100
        solution: |
          ### Ответ
          100

          ### Идея
          Координату находят по цене деления: каждое деление отвечает за несколько единиц.

          ### Шаги
          1. Цена деления шкалы — 25 единиц.
          2. Стрелка стоит в 4-м делении от начала.
          3. Отсчитываем деления по 25 и получаем 100.

          ### Проверка
          Обратный счёт: от 100 называем числа через 25 назад — 100, 125, 150 — и приходим к началу шкалы.

          ### Типичная ошибка
          E-num-line-extra-division: посчитать начало отсчёта лишним делением.
    hints:
      - 'Сколько единиц стоит за одним делением шкалы?'
      - 'Одно деление — {{step|pl:единица,единицы,единиц}}.'
      - Считайте от начала шкалы по делениям, а не по единицам.
    solution: |
      ### Ответ
      15

      ### Идея
      Координату находят по цене деления: каждое деление отвечает за несколько единиц.

      ### Шаги
      1. Цена деления шкалы — 5 единиц.
      2. Стрелка стоит в 3-м делении от начала.
      3. Отсчитываем деления по 5 и получаем 15.

      ### Проверка
      Обратный счёт: от 15 называем числа через 5 назад — 15, 20 — и приходим к началу шкалы.

