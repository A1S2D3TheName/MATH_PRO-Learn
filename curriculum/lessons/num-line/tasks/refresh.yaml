          2. Стрелка стоит в 3-м делении от начала.
          3. Отсчитываем деления по 5 и получаем 15.

          ### Проверка
          Обратный счёт: от 15 называем числа через 5 назад — 15, 20 — и приходим к началу шкалы.

          ### Типичная ошибка
          E-num-line-extra-division: посчитать начало отсчёта лишним делением.
      - params:
          k: 5
          step: 10
