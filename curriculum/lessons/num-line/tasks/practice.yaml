      E-num-line-extra-division: посчитать начало отсчёта делением и взять лишний шаг.
    feedback:
      correct: 'Верно: точка найдена по цене деления ленты, а не по номеру деления.'
      wrong:
        what: Координата не совпала.
        why: 'Возможно, за одно деление принята одна единица вместо {{step}}.'
        fix: 'Считайте от начала отсчёта по {{step|pl:единица,единицы,единиц}} за каждым делением.'
