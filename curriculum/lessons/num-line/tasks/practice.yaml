# Основной банк темы (STANDARD.md §6–§8): 29 задач без challenge + 1 задача «на подумать».
# Роли: warmup 3, supported 10, independent 16; доли уровней 10/30/30/20/10 ±5 п.п. по всему файлу.
# Сквозные контексты: лента в мастерской, разметка дорожки и участка, шкала прибора.
tasks:
  - id: 'P-01'
    type: number
    role: warmup
    purpose: procedure
    level: 0
    outcome: 'LO-01'
    sections:
      - T01
    minutes: 1
    prompt: 'На ленте отмечены две точки: левая — под подписью {{a}}, правая — под подписью {{b}}. Сколько единичных отрезков между этими точками?'
    answer: 5
    variants:
      - params:
          a: 4
          b: 9
        answer: 5
        solution: |
          ### Ответ
          5

          ### Идея
          Число отрезков между двумя отметками считают переходами от левой отметки к правой.

          ### Шаги
          1. Левая точка стоит под подписью 4.
          2. Идём вправо по отметкам: за 4 идёт 5, потом 6 и так дальше.
          3. Доходим до подписи 9 — на это уходит 5 переходов.

          ### Проверка
          Обратный счёт: от правой отметки влево до левой столько же переходов.

          ### Типичная ошибка
          E-num-line-counts-marks: посчитать сами подписи вместе с крайними — выйдет на один отрезок больше.
      - params:
          a: 2
          b: 8
        answer: 6
        solution: |
          ### Ответ
          6

          ### Идея
          Число отрезков между двумя отметками считают переходами от левой отметки к правой.

          ### Шаги
          1. Левая точка стоит под подписью 2.
          2. Идём вправо по отметкам: за 2 идёт 3, потом 4 и так дальше.
          3. Доходим до подписи 8 — на это уходит 6 переходов.

          ### Проверка
          Обратный счёт: от правой отметки влево до левой столько же переходов.

          ### Типичная ошибка
          E-num-line-counts-marks: посчитать сами подписи вместе с крайними — выйдет на один отрезок больше.
      - params:
          a: 3
          b: 7
        answer: 4
        solution: |
          ### Ответ
          4

          ### Идея
          Число отрезков между двумя отметками считают переходами от левой отметки к правой.

          ### Шаги
          1. Левая точка стоит под подписью 3.
          2. Идём вправо по отметкам: за 3 идёт 4, потом 5 и так дальше.
          3. Доходим до подписи 7 — на это уходит 4 переходов.

          ### Проверка
          Обратный счёт: от правой отметки влево до левой столько же переходов.

          ### Типичная ошибка
          E-num-line-counts-marks: посчитать сами подписи вместе с крайними — выйдет на один отрезок больше.
    hints:
      - Между отметками на ленте лежат промежутки — отрезки.
      - Считайте переходы от левой подписи к правой, а не сами подписи.
      - 'Первый переход ведёт из {{a}} в следующую отметку, последний заканчивается под подписью {{b}}.'
    solution: |
      ### Ответ
      5

      ### Идея
      Число отрезков между двумя отметками считают переходами от левой отметки к правой.

      ### Шаги
      1. Левая точка стоит под подписью 4.
      2. Идём вправо по отметкам: за 4 идёт 5, потом 6 и так дальше.
      3. Доходим до подписи 9 — на это уходит 5 переходов.

      ### Проверка
      Обратный счёт: от правой отметки влево до левой столько же переходов.

      ### Типичная ошибка
      E-num-line-counts-marks: посчитать сами подписи вместе с крайними — выйдет на один отрезок больше.
    feedback:
      correct: 'Верно: между отметками ровно столько переходов, сколько отрезков.'
      wrong:
        what: Число отрезков не совпало.
        why: Возможно, в счёт попали крайние подписи, а не промежутки между ними.
        fix: 'Считайте переходы: из {{a}} в следующую отметку и так до {{b}}.'
        next: Разберите пример 3 в разделе T01 о числе отрезков между отметками.
      misconceptions:
        - id: 'E-num-line-counts-marks'
          when:
            expr: '(b - a) + 1'
          message: 'Похоже, посчитаны подписи вместе с крайними отметками: отрезков на один меньше.'
    errors:
      - 'E-num-line-counts-marks'
