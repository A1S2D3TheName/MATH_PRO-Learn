      - 'Цена деления уже названа в условии: одно деление — {{step|pl:единица,единицы,единиц}}.'
      - 'Считайте от начала отсчёта: первое деление — это уже {{step}}.'
    solution: |
      ### Ответ
      5

      ### Идея
