    minutes: 1
    prompt: 'На ленте деления идут через {{step|pl:единица,единицы,единиц}}, начало отсчёта подписано 0. Точка стоит в {{k}}-м делении от начала отсчёта. Введите координату точки.'
    answer: 5
    variants:
      - params:
          k: 1
          step: 5
        answer: 5
        solution: |
          ### Ответ
          5

          ### Идея
          Каждое деление такой ленты стоит сразу несколько единиц — это цена деления.

          ### Шаги
          1. Цена деления ленты — 5 единиц.
          2. Точка стоит в 1-м делении от начала отсчёта.
          3. Первое деление отвечает за 5 единиц, значит координата точки — 5.

          ### Проверка
          Отсчитайте подписи по порядку от 0: первое деление подписано {{step}}.

          ### Типичная ошибка
          E-num-line-extra-division: посчитать начало отсчёта делением и взять лишний шаг.
      - params:
          k: 1
          step: 10
        answer: 10
        solution: |
          ### Ответ
          10

          ### Идея
          Каждое деление такой ленты стоит сразу несколько единиц — это цена деления.

          ### Шаги
          1. Цена деления ленты — 10 единиц.
          2. Точка стоит в 1-м делении от начала отсчёта.
          3. Первое деление отвечает за 10 единиц, значит координата точки — 10.

          ### Проверка
          Отсчитайте подписи по порядку от 0: первое деление подписано {{step}}.

          ### Типичная ошибка
          E-num-line-extra-division: посчитать начало отсчёта делением и взять лишний шаг.
