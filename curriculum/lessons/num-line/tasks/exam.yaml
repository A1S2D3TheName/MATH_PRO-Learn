    prompt: На ленте отмечены метки под подписями {{a}} и {{b}}. Сколько единичных отрезков между метками?
    answer: 4
    variants:
    - params:
        a: 4
        b: 8
      answer: 4
      solution: '### Ответ

        4


        ### Идея

        Число отрезков между отметками считают переходами от меньшей подписи к большей.


        ### Шаги

        1. Метки подписаны 4 и 8.

        2. Переходим по отметкам вправо: 4, потом следующая, и так до 8.

        3. Переходов 4, значит и отрезков между метками 4.


        ### Проверка

        Обратный переход от большей подписи к меньшей даёт то же число.


        ### Типичная ошибка

        E-num-line-counts-marks: посчитать подписи вместе с крайними отметками.

        '
    - params:
        a: 1
        b: 7
      answer: 6
      solution: '### Ответ

        6


        ### Идея

        Число отрезков между отметками считают переходами от меньшей подписи к большей.


        ### Шаги

        1. Метки подписаны 1 и 7.

        2. Переходим по отметкам вправо: 1, потом следующая, и так до 7.

        3. Переходов 6, значит и отрезков между метками 6.


        ### Проверка

        Обратный переход от большей подписи к меньшей даёт то же число.


        ### Типичная ошибка

        E-num-line-counts-marks: посчитать подписи вместе с крайними отметками.

        '
    hints:
    - Что лежит между двумя метками?
    - Считайте переходы от меньшей подписи к большей.
    - Первый переход ведёт от {{a}} к следующей метке.
    solution: '### Ответ

      4


      ### Идея

      Число отрезков между отметками считают переходами от меньшей подписи к большей.


      ### Шаги

      1. Метки подписаны 4 и 8.

      2. Переходим по отметкам вправо: 4, потом следующая, и так до 8.

      3. Переходов 4, значит и отрезков между метками 4.


      ### Проверка

