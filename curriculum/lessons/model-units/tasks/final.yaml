# Итоговая цепочка (§8): 5 шагов одного сюжета — сборка посылки в мастерской.
# Параметры шагов согласованы: res шага F-01 переходит в F-02, area шага F-03 в F-04, vol шага F-04 в F-05.
title: Сборка посылки
context_id: workshop-parcel
tasks:
  - id: F-01
    type: number
    role: final-step
    purpose: procedure
    level: 1
    outcome: LO-01
    sections: [T02]
    minutes: 1
    depends_on: []
    prompt: Для посылки взвесили груз — {{kg}} кг {{g}} г. Запишите массу в граммах.
    answer: 2300
    variants:
      - params: {kg: 2, g: 300, res: 2300}
        answer: 2300
      - params: {kg: 3, g: 500, res: 3500}
        answer: 3500
      - params: {kg: 1, g: 750, res: 1750}
        answer: 1750
      - params: {kg: 4, g: 50, res: 4050}
        answer: 4050
      - params: {kg: 2, g: 900, res: 2900}
        answer: 2900
      - params: {kg: 5, g: 100, res: 5100}
        answer: 5100
    hints:
      - "Килограммы и граммы переводят по частям: сначала тысячи граммов, затем остаток."
      - Переведите килограммы в граммы умножением на 1000.
      - Умножьте {{kg}} на 1000 и прибавьте {{g}}.
    solution: |
      ### Ответ
      {{res}} г

      ### Идея
      Смешанную запись массы переводим по частям: килограммы в граммы, остаток прибавляем.

      ### Шаги
      1. {{kg}} кг = {{kg}} · 1000 г.
      2. Прибавляем остаток: {{g}} г.
      3. Итого {{res}} г.

      ### Проверка
      ${{kg}} \cdot 1000 + {{g}} = {{res}}$ — исходная запись массы восстановлена.

      ### Типичная ошибка
      E-model-units-mixed-sum-raw: сложение чисел без перевода даёт массу не того порядка —
      для записи {{kg}} кг {{g}} г это ${{kg}} + {{g}}$ вместо {{res}}.
    feedback:
      correct: "Верно: килограммы стали граммами, остаток прибавлен без пересчёта."
      wrong:
        what: Масса груза в граммах не совпала.
        why: Возможно, килограммы не переведены в граммы.
        fix: Умножьте число килограммов на 1000 и прибавьте граммы.
        next: "Проверьте сложением: килограммы, умноженные на 1000, плюс граммы дают ответ."
  - id: F-02
    type: number
    role: final-step
    purpose: method
    level: 1
    outcome: LO-01
    sections: [T02]
    minutes: 1
    prompt: Груз массой {{res}} г разложили в пакеты по {{part}} г. Сколько пакетов получилось?
    answer: 5
    depends_on: [F-01]
    variants:
      - params: {res: 2300, part: 460, count: 5}
        answer: 5
      - params: {res: 3500, part: 500, count: 7}
        answer: 7
      - params: {res: 1750, part: 250, count: 7}
        answer: 7
      - params: {res: 4050, part: 450, count: 9}
        answer: 9
      - params: {res: 2900, part: 290, count: 10}
        answer: 10
      - params: {res: 5100, part: 425, count: 12}
        answer: 12
    hints:
      - Масса груза выражена в граммах — та же единица, что у пакета.
      - Разложить на равные части — значит разделить.
      - Разделите {{res}} на {{part}}.
    solution: |
      ### Ответ
      {{count|pl:пакет,пакета,пакетов}}

      ### Идея
      Число равных частей находят делением всей массы на массу одной части.

      ### Шаги
      1. Масса груза — {{res}} г, одного пакета — {{part}} г.
      2. {{res}} : {{part}} = {{count}}.

      ### Проверка
      Умножьте {{count}} на {{part}}: получится {{res}} г — вся масса груза.

      ### Типичная ошибка
      Делить, не приведя массы к одной единице: если бы груз был записан в килограммах,
      ответ отличался бы в тысячу раз.
    feedback:
      correct: "Верно: число пакетов найдено делением массы груза на массу одного пакета."
      wrong:
        what: Число пакетов не совпало.
        why: Возможно, массы записаны в разных единицах или выполнено умножение.
        fix: Приведите обе массы к граммам и разделите массу груза на массу одного пакета.
        next: Проверьте умножением числа пакетов на массу пакета.
  - id: F-03
    type: number
    role: final-step
    purpose: procedure
    level: 1
    outcome: LO-02
    sections: [T04]
    minutes: 1
    depends_on: []
    prompt: Основание коробки для посылки — {{len}} см на {{wid}} см. Чему равна площадь основания в квадратных сантиметрах?
    answer: 2800
    variants:
      - params: {len: 70, wid: 40, area: 2800}
        answer: 2800
      - params: {len: 60, wid: 30, area: 1800}
        answer: 1800
      - params: {len: 80, wid: 50, area: 4000}
        answer: 4000
      - params: {len: 50, wid: 40, area: 2000}
        answer: 2000
      - params: {len: 90, wid: 20, area: 1800}
        answer: 1800
      - params: {len: 60, wid: 60, area: 3600}
        answer: 3600
    hints:
      - Площадь получают перемножением двух измерений.
      - Оба измерения даны в сантиметрах, значит и квадратная единица будет квадратной.
      - Умножьте {{len}} на {{wid}}.
    solution: |
      ### Ответ
      {{area}} см²

      ### Идея
      Площадь основания — произведение двух измерений, единица получается квадратной.

      ### Шаги
      1. Измерения основания: {{len}} см и {{wid}} см.
      2. {{len}} · {{wid}} = {{area}} см².

      ### Проверка
      Разделите {{area}} на {{wid}}: должно получиться {{len}} см — второе измерение основания.

      ### Типичная ошибка
      E-model-units-area-sum-sides: сложение измерений ${{len}} + {{wid}}$ даёт сумму длин,
      а не площадь.
    feedback:
      correct: "Верно: площадь получена перемножением измерений и записана в квадратных сантиметрах."
      wrong:
        what: Площадь основания не совпала.
        why: Возможно, длина и ширина основания сложены вместо перемножения.
        fix: Перемножьте длину и ширину основания.
        next: "Сверьте единицу ответа: площадь записывают в квадратных сантиметрах."
  - id: F-04
    type: number
    role: final-step
    purpose: procedure
    level: 2
    outcome: LO-02
    sections: [T04]
    minutes: 1
    prompt: Высота коробки {{hgt}} см, а площадь основания {{area}} см². Чему равен объём коробки в кубических сантиметрах?
    answer: 84000
    depends_on: [F-03]
    variants:
      - params: {hgt: 30, area: 2800, vol: 84000}
        answer: 84000
      - params: {hgt: 20, area: 1800, vol: 36000}
        answer: 36000
      - params: {hgt: 20, area: 4000, vol: 80000}
        answer: 80000
      - params: {hgt: 25, area: 2000, vol: 50000}
        answer: 50000
      - params: {hgt: 40, area: 1800, vol: 72000}
        answer: 72000
      - params: {hgt: 15, area: 3600, vol: 54000}
        answer: 54000
    hints:
      - "Объём — это три измерения: площадь основания и высота."
      - Площадь основания уже известна из предыдущего шага.
      - Умножьте {{area}} на {{hgt}}.
    solution: |
      ### Ответ
      {{vol}} см³

      ### Идея
      Объём коробки равен произведению площади основания на высоту.

      ### Шаги
      1. Площадь основания — {{area}} см², высота — {{hgt}} см.
      2. {{area}} · {{hgt}} = {{vol}} см³.

      ### Проверка
      Разделите {{vol}} на {{hgt}}: получится {{area}} см² — площадь основания из предыдущего шага.

      ### Типичная ошибка
      E-model-units-area-volume: ответ в квадратных сантиметрах означает, что перемножены
      только два измерения — третье потеряно.
    feedback:
      correct: "Верно: объём получен по трём измерениям и записан в кубических сантиметрах."
      wrong:
        what: Объём не совпал.
        why: Возможно, перемножены только два измерения.
        fix: Умножьте площадь основания на высоту.
        next: "Проверьте единицу: объём требует кубической единицы."
  - id: F-05
    type: number
    role: final-step
    purpose: transfer
    level: 3
    outcome: LO-02
    sections: [T04]
    minutes: 1
    prompt: Объём коробки равен {{vol}} см³. Сколько литров вмещает коробка, если $1\ \text{л} = 1000\ \text{см}^{3}$?
    answer: 84
    depends_on: [F-04]
    variants:
      - params: {vol: 84000, litres: 84}
        answer: 84
      - params: {vol: 36000, litres: 36}
        answer: 36
      - params: {vol: 80000, litres: 80}
        answer: 80
      - params: {vol: 50000, litres: 50}
        answer: 50
      - params: {vol: 72000, litres: 72}
        answer: 72
      - params: {vol: 54000, litres: 54}
        answer: 54
    hints:
      - Литр крупнее кубического сантиметра.
      - Переходим к крупной единице, значит делим.
      - Разделите {{vol}} на 1000.
    solution: |
      ### Ответ
      {{litres}} л

      ### Идея
      Один литр равен тысяче кубических сантиметров, поэтому объём делим на тысячу.

      ### Шаги
      1. $1\ \text{л} = 1000\ \text{см}^{3}$.
      2. {{vol}} : 1000 = {{litres}} л.

      ### Проверка
      Умножьте {{litres}} на 1000: получится {{vol}} см³ — объём из предыдущего шага.

      ### Типичная ошибка
      E-model-units-multiply-instead-of-divide: умножение вместо деления дало бы
      ${{vol}} \cdot 1000$ см³ — в тысячу раз больше верного.
    feedback:
      correct: "Верно: объём переведён из кубических сантиметров в литры делением на тысячу."
      wrong:
        what: Объём коробки, выраженный в литрах, не совпал.
        why: Возможно, кубические сантиметры умножены на тысячу вместо деления.
        fix: Разделите объём в кубических сантиметрах на 1000.
        next: Проверьте умножением результата на 1000.
