      - id: EB-06
        type: choice
        role: exam
        purpose: method
        level: 2
        outcome: LO-02
        sections: [T04]
        minutes: 2
        points: 1
        prompt: Площадь стены 5 м². Как записать эту же площадь в квадратных дециметрах?
        options:
          - {id: a, text: "500 квадратных дециметров"}
          - {id: b, text: "50 квадратных дециметров", misconception: E-model-units-square-as-linear}
          - {id: c, text: "5000 квадратных дециметров", misconception: E-model-units-milli-for-santi}
          - {id: d, text: "25 квадратных дециметров", misconception: E-model-units-number-as-side}
        answer: a
        hints:
          - В одном метре десять дециметров.
          - Коэффициент для площади применяют дважды.
          - Умножьте 5 на 10 и ещё раз на 10.
        solution: |
          ### Ответ
          500 дм²

          ### Идея
          При переводе площади линейный коэффициент входит дважды, поэтому $10 \cdot 10 = 100$.

          ### Шаги
          1. $1\ \text{м} = 10\ \text{дм}$, значит $1\ \text{м}^{2} = 10 \cdot 10 = 100\ \text{дм}^{2}$.
          2. $5 \cdot 100 = 500\ \text{дм}^{2}$.

          ### Проверка
          $500 : 100 = 5\ \text{м}^{2}$ — площадь восстановлена.

          ### Типичная ошибка
          E-model-units-square-as-linear: однократное применение коэффициента 10 даёт
          $5 \cdot 10 = 50$ дм² — в десять раз меньше верного.
        feedback:
          correct: "Верно: коэффициент для площади применён дважды."
          wrong:
            what: Выбрана запись с неверным числом или единицей.
            why: Возможно, линейный коэффициент применён один раз.
            fix: 'Перемножьте коэффициент сам с собой: $10 \cdot 10 = 100$.'
            next: Проверьте делением результата на 100.
