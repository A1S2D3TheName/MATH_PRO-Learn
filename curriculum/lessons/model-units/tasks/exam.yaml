# Контрольная (§8): два равноценных варианта по 12 задач, 32 минуты работы, уровни от простых
# к сложным, покрытие одинаковое: LO-01, LO-02, LO-03 в обоих вариантах.
variants:
  - id: A
    tasks:
      - id: EA-01
        type: match
        role: exam
        purpose: meaning
        level: 0
        outcome: LO-03
        sections: [T01]
        minutes: 2
        points: 1
        prompt: Установите соответствие между единицей и величиной, которую она измеряет.
        left:
          - {id: e1, text: "гектар"}
          - {id: e2, text: "кубический дециметр"}
          - {id: e3, text: "центнер"}
        right:
          - {id: q1, text: площадь}
          - {id: q2, text: объём}
          - {id: q3, text: масса}
          - {id: q4, text: время}
        answer:
          - {left: e1, right: q1}
          - {left: e2, right: q2}
          - {left: e3, right: q3}
        hints:
          - "Разберите название единицы: основное слово говорит о величине."
          - Приставка гекто означает сотню, а слово «кубический» — три измерения.
          - Центнер и тонна — крупные меры массы.
        solution: |
          ### Ответ
          «гектар» — площадь; «кубический дециметр» — объём; «центнер» — масса.

          ### Идея
          Название единицы сообщает величину: гектар — о площади, «кубический» — об объёме,
          а приставка говорит только о размере мерки.

          ### Шаги
          1. Гектар — это 10 000 квадратных метров, значит площадь.
          2. Кубический дециметр получается из трёх длин, значит объём; это литр.
          3. Центнер — мера массы: $1\ \text{ц} = 100\ \text{кг}$.

          ### Проверка
          Лишняя карточка «время» не подошла: время измеряют секундами, минутами и часами.

          ### Типичная ошибка
          Приписать кубической единице площадь, а гектару — длину: показатель степени и приставка
          говорят, сколько измерений перемножили и во сколько раз мерка крупнее основной.
        feedback:
          correct: "Верно: каждая единица соотнесена со своей величиной по названию."
          wrong:
            what: Одна из пар собрана неверно.
            why: Возможно, основа слова единицы прочитана без учёта слова «квадратный».
            fix: Разберите название единицы на части и определите величину.
            next: Сверьтесь со сводной таблицей единиц в разделе T01.
      - id: EA-02
        type: number
        role: exam
        purpose: procedure
        level: 0
        outcome: LO-01
        sections: [T02]
        minutes: 2
        points: 1
        prompt: Длина скамейки 5 м. Выразите эту длину в сантиметрах.
        answer: 500
        hints:
          - Вспомните, сколько сантиметров в одном метре.
          - Мерка стала мельче, значит мерок больше.
          - Умножьте 5 на 100.
        solution: |
          ### Ответ
          500 см

          ### Идея
          Переход к меньшей единице делают умножением на число мелких единиц в крупной.

          ### Шаги
          1. $1\ \text{м} = 100\ \text{см}$.
          2. $5 \cdot 100 = 500\ \text{см}$.

          ### Проверка
          $500 : 100 = 5$ — длина скамейки в метрах восстановлена.

          ### Типичная ошибка
          E-model-units-convert-direction: деление вместо умножения уменьшило бы число,
          хотя сантиметр мельче метра — мерок должно быть больше.
        feedback:
          correct: "Верно: длина выражена в сантиметрах умножением на сто."
          wrong:
            what: Длина скамейки в сантиметрах не совпала.
            why: Возможно, число метров разделено на сто вместо умножения.
            fix: Умножьте число метров на 100.
            next: Проверьте делением ответа на 100.
      - id: EA-03
        type: table-fill
        role: exam
        purpose: method
        level: 1
        outcome: LO-03
        sections: [T01]
        minutes: 2
        points: 1
        shape: [4, 2]
        prompt: |
          | Измерение | Единица |
          |---|--------|
          | Длина рейки 2 | |
          | Масса мешка цемента 50 | |
          | Объём банки 3 | |
          | Площадь стола 2 | |

          Заполните таблицу: подберите единицу, подходящую измерению и числу.
        answer:
          - {r: 0, c: 1, value: м}
          - {r: 1, c: 1, value: кг}
          - {r: 2, c: 1, value: л}
          - {r: 3, c: 1, value: "м²"}
        hints:
          - Назовите величину и вспомните её основную единицу.
          - Массу сравнивают с гирями, объём — с литровой банкой.
          - Площадь требует единицы с показателем степени.
        solution: |
          ### Ответ
          Длина рейки — м, масса гири — кг, объём банки — л, площадь стола — м².

          ### Идея
          Единицу подбирают по величине, а не по размеру числа.

          ### Шаги
          1. Длину измеряют метрами.
          2. Массу измеряют килограммами.
          3. Объём измеряют литрами.
          4. Площадь измеряют квадратными метрами.

          ### Проверка
          Подставьте единицу к числу и прочитайте: «рейка 2 м» звучит правдоподобно, «рейка 2 кг» — нет.

          ### Типичная ошибка
          Приписать площади линейную единицу: площадь получают перемножением двух длин,
          поэтому её единица квадратная.
        feedback:
          correct: "Верно: единицы подобраны по величинам, записи стали читаемыми."
          wrong:
            what: Одна из единиц не подходит величине.
            why: Возможно, величина определена по числу, а не по тому, что измеряют.
            fix: Назовите величину и подберите её основную единицу.
            next: Проверьте запись на правдоподобие.
      - id: EA-04
        type: number
        role: exam
        purpose: procedure
        level: 1
        outcome: LO-01
        sections: [T03]
        minutes: 3
        points: 1
        prompt: От посёлка до станции 8 км. Сколько это метров?
        answer: 8000
        hints:
          - Приставка кило означает тысячу.
          - Километр крупнее метра, значит метров больше.
          - Умножьте 8 на 1000.
        solution: |
          ### Ответ
          8000 м

          ### Идея
          Приставка кило задаёт множитель 1000.

          ### Шаги
          1. $1\ \text{км} = 1000\ \text{м}$.
          2. $8 \cdot 1000 = 8000\ \text{м}$.

          ### Проверка
          $8000 : 1000 = 8\ \text{км}$ — расстояние восстановлено.

          ### Типичная ошибка
          E-model-units-deci-for-santi: множитель 10 дал бы 80 м, а посёлок и станция дальше
          друг от друга.
        feedback:
          correct: "Верно: километры выражены в метрах с множителем тысяча."
          wrong:
            what: Расстояние в метрах не совпало.
            why: Возможно, взят множитель 100 или 10 вместо 1000.
            fix: Запишите $1\ \text{км} = 1000\ \text{м}$ и умножьте число километров на тысячу.
            next: Проверьте делением ответа на 1000.
      - id: EA-05
        type: number
        role: exam
        purpose: procedure
        level: 1
        outcome: LO-02
        sections: [T04]
        minutes: 3
        points: 1
        prompt: Доска имеет длину 7 м и ширину 2 м. Чему равна её площадь в квадратных метрах?
        answer: 14
        hints:
          - Площадь получают перемножением двух измерений.
          - Оба измерения в метрах — квадратная единица будет квадратной.
          - Умножьте 7 на 2.
        solution: |
          ### Ответ
          14 м²

          ### Идея
          Площадь — произведение двух измерений, поэтому её единица квадратная.

          ### Шаги
          1. Измерения доски: 7 м и 2 м.
          2. $7 \cdot 2 = 14\ \text{м}^{2}$.

          ### Проверка
          $14 : 2 = 7\ \text{м}$ — второе измерение восстановлено.

          ### Типичная ошибка
          E-model-units-area-sum-sides: сложение измерений даёт 9 м — это длина, а не площадь.
        feedback:
          correct: "Верно: площадь получена перемножением измерений и записана в квадратных метрах."
          wrong:
            what: Площадь не совпала.
            why: Возможно, длина и ширина доски сложены вместо перемножения.
            fix: Перемножьте длину и ширину доски.
            next: Сверьте единицу ответа — она должна быть квадратной.
      - id: EA-06
        type: choice
        role: exam
        purpose: meaning
        level: 2
        outcome: LO-03
        sections: [T04]
        minutes: 2
        points: 1
        prompt: Что означает запись площади 7 м²?
        options:
          - {id: a, text: "площадь семи квадратов со стороной 1 метр"}
          - {id: b, text: "длину семь метров", misconception: E-model-units-square-as-linear}
          - {id: c, text: "объём семь кубических метров", misconception: E-model-units-area-volume}
          - {id: d, text: "площадь квадрата семь метров на семь метров", misconception: E-model-units-number-as-side}
        answer: a
        hints:
          - Показатель степени у единицы сообщает, сколько измерений перемножили.
          - Квадратный метр — квадрат со стороной один метр.
          - "Сравните: объём записывают кубическими единицами."
        solution: |
          ### Ответ
          площадь семи квадратов со стороной 1 метр

          ### Идея
          Квадратная единица получается перемножением двух длин, поэтому запись 7 м² описывает
          площадь семи единичных квадратов.

          ### Шаги
          1. 1 м² — площадь квадрата со стороной 1 м.
          2. Число 7 говорит, сколько таких квадратов укладывается.

          ### Проверка
          Прочитайте запись вслух: «семь квадратных метров» — это площадь, а не длина и не объём.

          ### Типичная ошибка
          Читать м² как «семь метров» или как квадрат со стороной семь метров: первое даёт длину,
          второе — площадь 49 м².
        feedback:
          correct: "Верно: запись прочитана как площадь семи единичных квадратов."
          wrong:
            what: Выбрано чтение записи, не совпадающее со смыслом квадратной единицы.
            why: Возможно, показатель степени у единицы не учтён.
            fix: Вспомните, что м² — площадь квадрата со стороной один метр.
            next: Разберите примеры площади в разделе T04.
      - id: EA-07
        type: number
        role: exam
        purpose: procedure
        level: 2
        outcome: LO-01
        sections: [T03]
        minutes: 3
        points: 1
        prompt: Толщина бруска 60 мм. Выразите её в сантиметрах.
        answer: 6
        hints:
          - Сантиметр крупнее миллиметра в десять раз.
          - Переходим к крупной единице, значит делим.
          - Разделите 60 на 10.
        solution: |
          ### Ответ
          6 см

          ### Идея
          Между миллиметром и сантиметром шаг равен десяти, поэтому делим на десять.

          ### Шаги
          1. $1\ \text{см} = 10\ \text{мм}$.
          2. $60 : 10 = 6\ \text{см}$.

          ### Проверка
          $6 \cdot 10 = 60\ \text{мм}$ — толщина восстановлена.

          ### Типичная ошибка
          E-model-units-hundred-for-step: множитель 100 вместо шага 10 дал бы $60 \cdot 100 = 6000$ см —
          шестьдесят метров вместо шести сантиметров.
        feedback:
          correct: "Верно: миллиметры переведены в сантиметры делением на десять."
          wrong:
            what: Толщина в сантиметрах не совпала.
            why: Возможно, использован шаг 100 или 1000.
            fix: Запишите $1\ \text{см} = 10\ \text{мм}$ и разделите толщину на десять.
            next: Проверьте умножением ответа на 10.
      - id: EA-08
        type: number
        role: exam
        purpose: procedure
        level: 2
        outcome: LO-01
        sections: [T02]
        minutes: 3
        points: 1
        prompt: Длина кабеля 9000 см. Выразите её в метрах.
        answer: 90
        hints:
          - Метр крупнее сантиметра в сто раз.
          - Переходим к крупной единице, значит делим.
          - Разделите 9000 на 100.
        solution: |
          ### Ответ
          90 м

          ### Идея
          При переходе от мелкой единицы к крупной число уменьшается во столько раз, во сколько
          крупная мерка больше.

          ### Шаги
          1. $1\ \text{м} = 100\ \text{см}$.
          2. $9000 : 100 = 90\ \text{м}$.

          ### Проверка
          $90 \cdot 100 = 9000\ \text{см}$ — длина кабеля восстановлена.

          ### Типичная ошибка
          E-model-units-multiply-instead-of-divide: умножение на 100 дало бы
          $9000 \cdot 100 = 900 000$ см, то есть девять километров кабеля.
        feedback:
          correct: "Верно: сантиметры переведены в метры делением на сто."
          wrong:
            what: Длина кабеля в метрах не совпала.
            why: Возможно, сантиметры умножены на сто вместо деления.
            fix: Разделите длину в сантиметрах на 100.
            next: Проверьте умножением ответа на 100.
      - id: EA-09
        type: number
        role: exam
        purpose: method
        level: 3
        outcome: LO-01
        sections: [T02]
        minutes: 3
        points: 1
        prompt: Полоса имеет длину 4 м 30 см. Запишите эту длину одним числом в сантиметрах.
        answer: 430
        hints:
          - Переведите только метры, сантиметры уже в нужной единице.
          - В метре сто сантиметров.
          - 4 · 100 = 400, затем прибавьте 30.
        solution: |
          ### Ответ
          430 см

          ### Идея
          Смешанную запись переводим по частям и складываем части одной единицы.

          ### Шаги
          1. $4\ \text{м} = 4 \cdot 100 = 400\ \text{см}$.
          2. $400 + 30 = 430\ \text{см}$.

          ### Проверка
          $430 = 4 \cdot 100 + 30$ — запись 4 м 30 см восстановлена.

          ### Типичная ошибка
          Приписать сантиметры как разряд десятков: 43 см вместо 430 см.
        feedback:
          correct: "Верно: метры переведены, сантиметры прибавлены без пересчёта."
          wrong:
            what: Длина полосы, записанная одним числом, не совпала.
            why: Возможно, метры не переведены в сантиметры.
            fix: Умножьте число метров на 100 и прибавьте сантиметры.
            next: "Проверьте: целые метры, умноженные на 100, плюс остаток дают ответ."
      - id: EA-10
        type: number
        role: exam
        purpose: method
        level: 3
        outcome: LO-02
        sections: [T04]
        minutes: 3
        points: 1
        prompt: Площадь участка 7 м². Выразите её в квадратных сантиметрах.
        answer: 70000
        hints:
          - Квадратный метр — это сто сантиметров на сто сантиметров.
          - Коэффициент для площади получается перемножением двух коэффициентов.
          - Умножьте 7 на 10 000.
        solution: |
          ### Ответ
          70 000 см²

          ### Идея
          При переводе площади линейный коэффициент входит дважды.

          ### Шаги
          1. $1\ \text{м} = 100\ \text{см}$, значит $1\ \text{м}^{2} = 100 \cdot 100 = 10 000\ \text{см}^{2}$.
          2. $7 \cdot 10 000 = 70 000\ \text{см}^{2}$.

          ### Проверка
          $70 000 : 10 000 = 7\ \text{м}^{2}$ — площадь восстановлена.

          ### Типичная ошибка
          E-model-units-square-as-linear: множитель 100 даёт 700 см² — в сто раз меньше верного.
        feedback:
          correct: "Верно: коэффициент применён дважды, как требует площадь."
          wrong:
            what: Площадь в квадратных сантиметрах не совпала.
            why: Возможно, линейный коэффициент применён только один раз.
            fix: 'Соберите квадратный метр из сантиметров: $100 \cdot 100 = 10 000\ \text{см}^{2}$.'
            next: Проверьте делением ответа на 10 000.
      - id: EA-11
        type: number
        role: exam
        purpose: transfer
        level: 3
        outcome: LO-01
        sections: [T02]
        minutes: 3
        points: 1
        prompt: На сколько сантиметров полоса длиной 560 см короче полосы длиной 7 м?
        answer: 140
        hints:
          - Приведите обе длины к одной единице.
          - 7 м выразите в сантиметрах.
          - Из 700 вычтите 560.
        solution: |
          ### Ответ
          140 см

          ### Идея
          Вычитать можно только числа в одной единице, поэтому метры переводим в сантиметры.

          ### Шаги
          1. $7\ \text{м} = 700\ \text{см}$.
          2. $700 - 560 = 140\ \text{см}$.

          ### Проверка
          $560 + 140 = 700\ \text{см}$ — длина второй полосы восстановлена.

          ### Типичная ошибка
          E-model-units-compare-raw: вычитание чисел без перевода дало бы 553 — разность метра
          и сантиметров.
        feedback:
          correct: "Верно: длины приведены к сантиметрам и только затем вычтены."
          wrong:
            what: Разность не совпала.
            why: Возможно, вычитание выполнено до перевода к одной единице.
            fix: Переведите метры в сантиметры и вычтите меньшее из большего.
            next: "Проверьте сложением: разность и меньшая длина дают большую."
      - id: EA-12
        type: number
        role: exam
        purpose: transfer
        level: 4
        outcome: LO-02
        sections: [T04]
        minutes: 3
        points: 1
        prompt: Бак для воды имеет измерения 2 м, 2 м и 3 м. Сколько литров воды в него войдёт, если $1\ \text{м}^{3} = 1000\ \text{л}$?
        answer: 12000
        hints:
          - Сначала найдите объём в кубических метрах.
          - Объём — произведение трёх измерений.
          - Умножьте 2 · 2 · 3, затем результат на 1000.
        solution: |
          ### Ответ
          12 000 л

          ### Идея
          Объём считают по трём измерениям, затем переводят кубические метры в литры.

          ### Шаги
          1. Объём: $2 \cdot 2 \cdot 3 = 12\ \text{м}^{3}$.
          2. $12 \cdot 1000 = 12 000\ \text{л}$.

          ### Проверка
          $12 000 : 1000 = 12\ \text{м}^{3}$ — объём восстановлен.

          ### Типичная ошибка
          E-model-units-area-volume: произведение двух измерений дало бы 6 м³, и объём вышел бы
          в два раза меньше.
        feedback:
          correct: "Верно: объём найден по трём измерениям и переведён в литры."
          wrong:
            what: Объём бака для воды в литрах не совпал.
            why: Возможно, перемножены только два измерения из трёх.
            fix: Перемножьте все три измерения и умножьте результат на 1000.
            next: Проверьте делением ответа на 1000.
  - id: B
    tasks:
      - id: EB-01
        type: match
        role: exam
        purpose: meaning
        level: 0
        outcome: LO-03
        sections: [T01]
        minutes: 2
        points: 1
        prompt: Соотнесите единицу измерения с величиной, к которой она принадлежит.
