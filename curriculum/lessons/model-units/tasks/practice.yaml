  - id: P-07
    type: number
    role: supported
    purpose: procedure
    level: 1
    outcome: LO-01
    sections: [T03]
    minutes: 1
    prompt: Длина детали {{a}} мм. Выразите её в сантиметрах.
    answer: 4
    variants:
      - params: {a: 40}
        answer: 4
        solution: |
          ### Ответ
          4 см

          ### Идея
          В одном сантиметре десять миллиметров, поэтому делим на десять.

          ### Шаги
          1. $1\ \text{см} = 10\ \text{мм}$.
          2. $40 : 10 = 4\ \text{см}$.

          ### Проверка
          $4 \cdot 10 = 40\ \text{мм}$ — исходная длина восстановлена.

          ### Типичная ошибка
          E-model-units-hundred-for-step: множитель 100 вместо шага 10 дал бы
          $40 \cdot 100 = 4000$ см — сорок метров вместо четырёх сантиметров.
      - params: {a: 70}
        answer: 7
        solution: |
          ### Ответ
          7 см

          ### Идея
          В одном сантиметре десять миллиметров, поэтому делим на десять.

          ### Шаги
          1. $1\ \text{см} = 10\ \text{мм}$.
          2. $70 : 10 = 7\ \text{см}$.

          ### Проверка
          $7 \cdot 10 = 70\ \text{мм}$ — исходная длина восстановлена.

          ### Типичная ошибка
          E-model-units-hundred-for-step: множитель 100 вместо шага 10 дал бы
          $70 \cdot 100 = 7000$ см — семьдесят метров вместо семи сантиметров.
      - params: {a: 90}
        answer: 9
        solution: |
          ### Ответ
          9 см

          ### Идея
          В одном сантиметре десять миллиметров, поэтому делим на десять.

          ### Шаги
          1. $1\ \text{см} = 10\ \text{мм}$.
          2. $90 : 10 = 9\ \text{см}$.

          ### Проверка
          $9 \cdot 10 = 90\ \text{мм}$ — исходная длина восстановлена.

          ### Типичная ошибка
          E-model-units-hundred-for-step: множитель 100 вместо шага 10 дал бы
          $90 \cdot 100 = 9000$ см — девяносто метров вместо девяти сантиметров.
    hints:
      - "Сантиметр крупнее миллиметра: сколько миллиметров в одном сантиметре?"
      - Переходим от меньшей единицы к большей, значит делим.
      - Разделите {{a}} на 10.
    solution: |
      ### Ответ
      Число сантиметров равно {{a}} : 10; значение для своего варианта смотрите в шагах ниже.

      ### Идея
      В одном сантиметре десять миллиметров, поэтому при переходе к более крупной единице
      число делят на десять.

      ### Шаги
      1. $1\ \text{см} = 10\ \text{мм}$.
      2. {{a}} : 10.

      ### Проверка
      Умножьте результат на 10: вернётся {{a}} мм — исходная длина.

      ### Типичная ошибка
      E-model-units-hundred-for-step: множитель 100 вместо шага 10 даёт число в сто раз
      больше верного.
    feedback:
      correct: "Верно: между миллиметром и сантиметром шаг равен десяти."
      wrong:
