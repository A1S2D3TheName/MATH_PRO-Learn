    sections: [T02]
    minutes: 1
    shape: [4, 2]
    prompt: |
      | Перевод | Что произойдёт с числом |
      |---|--------|
      | 3 м выразили в сантиметрах | |
      | 8 кг выразили в граммах | |
      | 40 мм выразили в сантиметрах | |
      | 5000 м выразили в километрах | |

      Заполните таблицу: увеличится или уменьшится число при таком переводе?
    answer:
      - {r: 0, c: 1, value: увеличится}
      - {r: 1, c: 1, value: увеличится}
      - {r: 2, c: 1, value: уменьшится}
      - {r: 3, c: 1, value: уменьшится}
    hints:
      - "Сравните мерки в каждой строке: какая единица крупнее."
      - Мельче мерка — больше мерок укладывается в ту же длину или массу.
      - В третьей и четвёртой строках перевод идёт к более крупной единице.
    solution: |
      ### Ответ
      3 м в сантиметрах — увеличится; 8 кг в граммах — увеличится; 40 мм в сантиметрах — уменьшится;
      5000 м в километрах — уменьшится.

      ### Идея
      Величина от перевода не меняется, меняется счёт мерок: чем мельче мерка, тем больше число.

      ### Шаги
      1. Сантиметр мельче метра: $3 \cdot 100 = 300$ — число выросло.
      2. Грамм мельче килограмма: $8 \cdot 1000 = 8000$ — число выросло.
      3. Сантиметр крупнее миллиметра: $40 : 10 = 4$ — число уменьшилось.
      4. Километр крупнее метра: $5000 : 1000 = 5$ — число уменьшилось.

      ### Проверка
      Во всех четырёх строках направление числа согласуется с размером мерки: к мелкой мерке —
      число больше, к крупной — меньше.

      ### Типичная ошибка
      E-model-units-convert-direction: перепутать направление перевода — при переходе к мелкой
      мерке число растёт, а деление его уменьшает.
    feedback:
