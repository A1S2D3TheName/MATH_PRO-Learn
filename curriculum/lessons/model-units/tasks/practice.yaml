      - {id: l2, text: "влезет ли вода в банку"}
      - {id: l3, text: "сколько весит посылка"}
      - {id: l4, text: "сколько времени займёт дорога"}
    right:
      - {id: r1, text: площадь}
      - {id: r2, text: объём}
      - {id: r3, text: масса}
      - {id: r4, text: время}
      - {id: r5, text: длина}
    answer:
      - {left: l1, right: r1}
      - {left: l2, right: r2}
      - {left: l3, right: r3}
      - {left: l4, right: r4}
    hints:
      - "Краска покрывает поверхность, а не линию: подумайте о двух измерениях."
      - "«Влезет ли» — вопрос о месте, которое занимает вода."
      - Взвешивание даёт массу, а дорога занимает промежуток времени.
    solution: |
      ### Ответ
      «сколько краски нужно на стену» — площадь; «влезет ли вода в банку» — объём;
      «сколько весит посылка» — масса; «сколько времени займёт дорога» — время.

      ### Идея
      Величину подсказывает действие: покрытие поверхности — площадь, заполнение сосуда — объём,
      взвешивание — масса, длительность — время.

      ### Шаги
      1. Стену покрывают краской по поверхности, значит нужна площадь.
      2. Вода заполняет банку, значит нужен объём.
      3. Посылку взвешивают, значит нужна масса.
      4. Дорога занимает промежуток, значит нужно время.

      ### Проверка
      Лишняя карточка «длина» не подошла: ни в одной ситуации не измеряют протяжённость
      одного предмета линейкой.

      ### Типичная ошибка
      Перепутать площадь и объём: краска покрывает поверхность (два измерения), а вода заполняет
      сосуд (три измерения).
    feedback:
      correct: "Верно: величина определена по действию, а не по предмету."
      wrong:
        what: Одна из ситуаций сопоставлена не с той величиной.
        why: Возможно, выбран предмет, а не то, что именно в нём измеряют.
        fix: "Назовите действие вслух: покрыть, заполнить, взвесить, продлиться."
        next: "Сверьтесь со сводной таблицей единиц в разделе T01."
