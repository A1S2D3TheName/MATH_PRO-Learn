      - params: {a: 2}
        answer: 2000
        solution: |
          ### Ответ
          2000 г
          ### Идея
          Килограмм крупнее грамма в тысячу раз, поэтому граммов получится в тысячу раз больше.
          ### Шаги
          1. $1\ \text{кг} = 1000\ \text{г}$.
          2. $2 \cdot 1000 = 2000\ \text{г}$.
          ### Проверка
          $2000 : 1000 = 2\ \text{кг}$ — исходная масса восстановлена.
          ### Типичная ошибка
          E-model-units-convert-direction: деление вместо умножения уменьшило бы число,
          а грамм мельче килограмма — значит, граммов должно быть больше.
      - params: {a: 4}
        answer: 4000
        solution: |
          ### Ответ
          4000 г
          ### Идея
          Килограмм крупнее грамма в тысячу раз, поэтому граммов получится в тысячу раз больше.
          ### Шаги
          1. $1\ \text{кг} = 1000\ \text{г}$.
          2. $4 \cdot 1000 = 4000\ \text{г}$.
          ### Проверка
          $4000 : 1000 = 4\ \text{кг}$ — исходная масса восстановлена.
          ### Типичная ошибка
          E-model-units-convert-direction: деление вместо умножения уменьшило бы число,
          а грамм мельче килограмма — значит, граммов должно быть больше.
    hints:
      - Определите, какая единица мельче — грамм или килограмм.
      - Переходим от большей единицы к меньшей, значит умножаем.
      - Умножьте {{a}} на 1000.
    solution: |
      ### Ответ
      Масса в граммах для записи {{a|pl:килограмм,килограмма,килограммов}}.

      ### Идея
      Грамм мельче килограмма, поэтому число растёт.

      ### Шаги
      1. $1\ \text{кг} = 1000\ \text{г}$.
      2. {{a}} · 1000.

      ### Проверка
      Разделите результат на 1000 и сравните с исходными килограммами.

      ### Типичная ошибка
      E-model-units-convert-direction: разделив, получим тысячную долю грамма вместо тысяч граммов.
    feedback:
      correct: "Верно: килограммы выражены в граммах, число выросло в тысячу раз."
      wrong:
        what: Масса мешка картофеля в граммах не совпала.
        why: Возможно, килограммы разделены на тысячу вместо умножения.
        fix: Запишите равенство $1\ \text{кг} = 1000\ \text{г}$ и умножьте число килограммов на тысячу.
        next: "Сравните ответ с массой в килограммах: граммов должно быть больше."
