      wrong:
        what: Объём коробки в литрах не совпал.
        why: Возможно, перемножены только два измерения или забыт перевод в литры.
        fix: Перемножьте все три измерения, затем умножьте результат на 1000.
        next: "Проверьте единицу: объём требует кубической единицы, а литры равны кубическим дециметрам."
  - id: P-24
    type: number
    role: challenge
    purpose: transfer
    level: 5
    optional: true
    outcome: LO-01
    sections: [T04]
    minutes: 2
    prompt: Масса контейнера {{a}} т {{b}} кг. Запишите её одним числом в килограммах.
    answer: 1200
    variants:
      - params: {a: 1, b: 200}
        answer: 1200
        solution: |
          ### Ответ
          1200 кг

          ### Идея
          Смешанную запись переводим по частям: тонны в килограммы, остаток прибавляем.

          ### Шаги
          1. $1\ \text{т} = 1 \cdot 1000 = 1000\ \text{кг}$.
          2. $1000 + 200 = 1200\ \text{кг}$.

          ### Проверка
          $1200 = 1 \cdot 1000 + 200$ — значит, 1 т и 200 кг.

          ### Типичная ошибка
          E-model-units-mixed-sum-raw: сложение чисел без перевода дало бы $1 + 200 = 201$ кг —
          массу не того порядка.

      - params: {a: 2, b: 50}
        answer: 2050
        solution: |
          ### Ответ
          2050 кг

          ### Идея
          Смешанную запись переводим по частям: тонны в килограммы, остаток прибавляем.

          ### Шаги
          1. $2\ \text{т} = 2 \cdot 1000 = 2000\ \text{кг}$.
          2. $2000 + 50 = 2050\ \text{кг}$.

          ### Проверка
          $2050 = 2 \cdot 1000 + 50$ — значит, 2 т и 50 кг.

          ### Типичная ошибка
          E-model-units-mixed-sum-raw: сложение чисел без перевода дало бы $2 + 50 = 52$ кг —
          массу не того порядка.
    hints:
      - Тонна — та же тысяча килограммов.
      - Переведите тонны в килограммы и прибавьте остаток.
      - Умножьте {{a}} на 1000 и прибавьте {{b}}.
    solution: |
      ### Ответ
      Масса в килограммах для записи {{a}} т {{b}} кг.

      ### Идея
      Смешанную запись с крупной единицей переводим по частям.

      ### Шаги
      1. {{a}} т = {{a}} · 1000 кг.
      2. Прибавляем остаток: {{a}} · 1000 + {{b}} кг.

      ### Проверка
      Разложите ответ на тысячи и остаток: тысячи дадут тонны, остаток — килограммы.

      ### Типичная ошибка
      E-model-units-mixed-sum-raw: складывать тонны и килограммы как числа одной единицы
      нельзя — крупную часть сначала переводят в килограммы.
    feedback:
      correct: "Верно: тонны переведены в килограммы, остаток прибавлен."
      wrong:
        what: Масса в килограммах не совпала.
        why: Возможно, тонны не переведены в килограммы.
        fix: Умножьте число тонн на 1000 и прибавьте килограммы.
        next: "Проверьте: тонны, умноженные на 1000, плюс килограммы дают ответ."
