# Основной банк (§8): 24 задачи без challenge + 2 задачи «на подумать», роли warmup/supported/
# independent, доли уровней 13/33/25/21/8 % (допуск ±5 п.п.). Сквозной сюжет — школьная мастерская
# и домашние измерения: лента, ткань, посылка, вода в бутылке, комната.
tasks:
  # ---------------------------------------------------------------- warmup
  - id: P-01
    type: match
    role: warmup
    purpose: meaning
    level: 0
    outcome: LO-03
    sections: [T01]
    minutes: 1
    prompt: Сопоставьте каждую запись с величиной, которую она измеряет.
    left:
      - {id: l1, text: "5 м"}
      - {id: l2, text: "5 кг"}
      - {id: l3, text: "5 л"}
    right:
      - {id: r1, text: длина}
      - {id: r2, text: масса}
      - {id: r3, text: объём}
      - {id: r4, text: время}
    answer:
      - {left: l1, right: r1}
      - {left: l2, right: r2}
      - {left: l3, right: r3}
    hints:
      - Вспомните, какую величину измеряют метром.
      - Килограмм связан с весами, литр — с объёмом сосуда.
      - Начните с пары «5 м — длина», остальные подберутся.
    solution: |
      ### Ответ
      5 м — длина, 5 кг — масса, 5 л — объём.

      ### Идея
      Название единицы прямо указывает на величину: метр измеряет длину, килограмм — массу,
      литр — объём.

      ### Шаги
      1. Метр — единица длины, значит «5 м» говорит о длине.
      2. Килограмм — единица массы, значит «5 кг» говорит о массе.
      3. Литр — единица объёма, значит «5 л» говорит об объёме.

      ### Проверка
      Оставшаяся карточка «время» не подошла ни одной записи: время измеряют секундами, минутами
      и часами, а не метрами, килограммами и литрами.

      ### Типичная ошибка
      Смотреть только на число: у всех трёх записей число 5, а величины разные.
    feedback:
      correct: "Верно: каждая единица назвала свою величину."
      wrong:
        what: Одна из пар собрана неверно.
        why: Возможно, единица сверена с числом, а не с величиной.
        fix: Для каждой записи назовите величину вслух, опираясь на название единицы.
        next: Посмотрите сводную таблицу единиц в разделе T01.
  - id: P-02
    type: number
    role: warmup
    purpose: procedure
    level: 0
    outcome: LO-01
    sections: [T02]
    minutes: 1
    prompt: Сколько сантиметров в {{a|pl:метре,метрах,метрах}}? Ответ запишите числом.
    answer: 200
    variants:
      - params: {a: 2}
        answer: 200
        solution: |
          ### Ответ
          200 см
          ### Идея
          Сантиметр мельче метра в сто раз, поэтому мерок стало в сто раз больше.
          ### Шаги
          1. $1\ \text{м} = 100\ \text{см}$.
          2. $2 \cdot 100 = 200\ \text{см}$.
          ### Проверка
          $200 : 100 = 2$ — вернулись к двум метрам.
          ### Типичная ошибка
          E-model-units-convert-direction: деление вместо умножения уменьшило бы число,
          а мерка стала мельче — значит, мерок должно быть больше.
      - params: {a: 6}
        answer: 600
        solution: |
          ### Ответ
          600 см
          ### Идея
          Сантиметр мельче метра в сто раз, поэтому мерок стало в сто раз больше.
          ### Шаги
          1. $1\ \text{м} = 100\ \text{см}$.
          2. $6 \cdot 100 = 600\ \text{см}$.
          ### Проверка
          $600 : 100 = 6$ — вернулись к шести метрам.
          ### Типичная ошибка
          E-model-units-convert-direction: деление вместо умножения уменьшило бы число,
          а мерка стала мельче — значит, мерок должно быть больше.
    hints:
      - Вспомните, сколько сантиметров укладывается в одном метре.
      - Мерка стала мельче, значит мерок нужно больше — какое действие это даёт?
      - Умножьте {{a}} на 100.
    solution: |
      ### Ответ
      Число сантиметров для записи {{a|pl:метр,метра,метров}}.

      ### Идея
      Перевод из большей единицы в меньшую делают умножением на коэффициент 100.

      ### Шаги
      1. $1\ \text{м} = 100\ \text{см}$.
      2. {{a}} · 100.

      ### Проверка
      Разделите результат на 100 и сравните с исходным числом метров.

      ### Типичная ошибка
      E-model-units-convert-direction: деление даёт долю сантиметра вместо сотен сантиметров.
    feedback:
      correct: "Верно: число выросло в сто раз, как и требует более мелкая мерка."
      wrong:
        what: Число сантиметров не совпало.
        why: Возможно, взято не то действие или не тот коэффициент.
        fix: Проверьте, что сантиметр мельче метра в сто раз, и умножьте на 100.
        next: "Сравните ответ с исходным числом метров: сантиметров должно быть больше."
  - id: P-03
    type: number
    role: warmup
    purpose: procedure
    level: 1
    outcome: LO-01
    sections: [T02]
    minutes: 1
    prompt: В канистре {{a|pl:миллилитр,миллилитра,миллилитров}} бензина. Сколько это литров?
    answer: 3
    variants:
      - params: {a: 3000}
        answer: 3
        solution: |
          ### Ответ
          3 л
          ### Идея
          Литр крупнее миллилитра в тысячу раз, поэтому число уменьшится в тысячу раз.
          ### Шаги
          1. $1\ \text{л} = 1000\ \text{мл}$.
          2. $3000 : 1000 = 3\ \text{л}$.
          ### Проверка
          $3 \cdot 1000 = 3000\ \text{мл}$ — исходный объём восстановлен.
          ### Типичная ошибка
          Умножение вместо деления дало бы 3 000 000 л — такой канистры не существует.
      - params: {a: 5000}
        answer: 5
        solution: |
          ### Ответ
          5 л
          ### Идея
          Литр крупнее миллилитра в тысячу раз, поэтому число уменьшится в тысячу раз.
          ### Шаги
          1. $1\ \text{л} = 1000\ \text{мл}$.
          2. $5000 : 1000 = 5\ \text{л}$.
          ### Проверка
          $5 \cdot 1000 = 5000\ \text{мл}$ — исходный объём восстановлен.
          ### Типичная ошибка
          Умножение вместо деления дало бы 5 000 000 л — такой канистры не существует.
    hints:
      - Определите, какая единица крупнее — литр или миллилитр.
      - Переходим к крупной единице, значит мерок нужно меньше.
      - Разделите {{a}} на 1000.
    solution: |
      ### Ответ
      Объём в литрах для записи {{a|pl:миллилитр,миллилитра,миллилитров}}.

      ### Идея
      Литр крупнее, поэтому делим на тысячу.

      ### Шаги
      1. $1\ \text{л} = 1000\ \text{мл}$.
      2. {{a}} : 1000.

      ### Проверка
      Умножьте результат на 1000: должен вернуться объём в миллилитрах.

      ### Типичная ошибка
      E-model-units-convert-direction: умножение увеличивает число, а литров должно быть меньше.
    feedback:
      correct: "Верно: миллилитры переведены в литры делением на тысячу."
      wrong:
        what: Объём сока в литрах не совпал.
        why: Возможно, миллилитры умножены на тысячу вместо деления.
        fix: Разделите объём в миллилитрах на 1000.
        next: Проверьте умножением результата на 1000.
  # ---------------------------------------------------------------- supported
