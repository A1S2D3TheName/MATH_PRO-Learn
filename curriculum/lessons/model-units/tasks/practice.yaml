    prompt: Коробка имеет измерения {{a}} м, {{b}} м и {{c}} м. Сколько литров воды в неё войдёт, если один кубический метр равен 1000 литрам?
    answer: 6000
    variants:
      - params: {a: 2, b: 3, c: 1}
        answer: 6000
        solution: |
          ### Ответ
          6000 л

          ### Идея
          Объём считают по трём измерениям, затем переводят кубические метры в литры.

          ### Шаги
          1. Объём: $2 \cdot 3 \cdot 1 = 6\ \text{м}^{3}$.
          2. $6 \cdot 1000 = 6000\ \text{л}$.

          ### Проверка
          Разделите 6000 на 1000: вернётся 6 м³ — объём коробки.

          ### Типичная ошибка
          E-model-units-area-volume: произведение двух измерений $2 \cdot 3 = 6$ дало бы
          площадь основания 6 м², а не объём.

      - params: {a: 1, b: 2, c: 4}
        answer: 8000
        solution: |
          ### Ответ
          8000 л

          ### Идея
          Объём считают по трём измерениям, затем переводят кубические метры в литры.

          ### Шаги
          1. Объём: $1 \cdot 2 \cdot 4 = 8\ \text{м}^{3}$.
          2. $8 \cdot 1000 = 8000\ \text{л}$.

          ### Проверка
          Разделите 8000 на 1000: вернётся 8 м³ — объём коробки.

          ### Типичная ошибка
          E-model-units-area-volume: произведение двух измерений $2 \cdot 3 = 6$ дало бы
          площадь основания 6 м², а не объём.
    hints:
      - Сначала найдите объём в кубических метрах.
      - Объём — произведение трёх измерений.
      - Умножьте {{a}} · {{b}} · {{c}} и результат умножьте на 1000.
    solution: |
      ### Ответ
      Объём коробки в литрах для измерений {{a}} м, {{b}} м и {{c}} м.

      ### Идея
      Объём считают по трём измерениям, затем переводят кубические метры в литры.

      ### Шаги
      1. Объём в кубических метрах: {{a}} · {{b}} · {{c}}.
      2. Перевод в литры: результат · 1000.

      ### Проверка
      Разделите ответ на 1000 — должен вернуться объём в кубических метрах; он совпадает
      с произведением трёх измерений.

      ### Типичная ошибка
      E-model-units-area-volume: произведение двух измерений даёт площадь основания, а объём
      требует третьего измерения.
