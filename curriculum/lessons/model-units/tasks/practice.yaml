    sections: [T04]
    minutes: 1
    prompt: Сопоставьте запись с величиной, которую она измеряет.
    left:
      - {id: l1, text: "5 м"}
      - {id: l2, text: "5 м²"}
      - {id: l3, text: "5 м³"}
      - {id: l4, text: "5 кг"}
    right:
      - {id: r1, text: длина}
      - {id: r2, text: площадь}
      - {id: r3, text: объём}
      - {id: r4, text: масса}
      - {id: r5, text: время}
    answer:
      - {left: l1, right: r1}
      - {left: l2, right: r2}
      - {left: l3, right: r3}
      - {left: l4, right: r4}
    hints:
      - Смотрите на показатель степени у единицы.
      - Квадрат означает два измерения, куб — три.
      - Килограмм связан с весами, а не с длиной.
    solution: |
      ### Ответ
      5 м — длина, 5 м² — площадь, 5 м³ — объём, 5 кг — масса.

      ### Идея
      Показатель степени у единицы сообщает, сколько измерений перемножили.

      ### Шаги
      1. Метр без показателя — одно измерение, то есть длина.
      2. Квадратный метр — два измерения, то есть площадь.
      3. Кубический метр — три измерения, то есть объём.
      4. Килограмм — единица массы.

      ### Проверка
      Лишняя карточка «время» осталась без пары: время измеряют секундами, минутами и часами,
      метры с показателями к времени не относятся.

      ### Типичная ошибка
      Приписать площади линейную единицу: метр без показателя степени описывает длину,
      а площадь получается из двух измерений и требует квадратной единицы.
    feedback:
      correct: "Верно: показатель степени и название единицы определены правильно."
      wrong:
        what: Одна из пар собрана неверно.
        why: Возможно, показатель степени у единицы не учтён.
        fix: "Посчитайте, сколько измерений перемножили: одно — длина, два — площадь, три — объём."
        next: Сверьтесь с таблицей единиц в разделе T04.
