# Входная диагностика (§2, правило 15): три короткие задачи без подсказок-опор, по одной проверке
# на каждый прямой пререквизит: model-time (единицы времени и перевод) и num-place-large (запись
# многозначного числа). Ссылки на разделы даны в пререквизитном виде (см. вопросы к мейнтейнеру в PR).
tasks:
  - id: D-01
    type: number
    role: diagnostic
    purpose: procedure
    level: 1
    outcome: model-time/LO-01
    sections: [T01]
    minutes: 1
    prompt: Сколько минут в трёх часах?
    answer: 180
    hints:
      - Вспомните, сколько минут в одном часе.
      - Умножьте число часов на число минут в часе.
      - "Умножьте число часов на 60: три раза по шестьдесят."
    solution: |
      ### Ответ
      180

      ### Идея
      Час и минута — единицы одной величины, поэтому часы переводят в минуты умножением.

      ### Шаги
      1. 1 час = 60 минут.
      2. $3 \cdot 60 = 180$ минут.

      ### Проверка
      $180 : 60 = 3$ — вернулись к трём часам.

      ### Типичная ошибка
      Применить коэффициент 100 вместо 60: в часе шестьдесят минут.
    feedback:
      correct: "Верно: три часа — это 180 минут."
      wrong:
        what: Количество минут не совпало.
        why: Возможно, использован коэффициент из другой системы единиц.
        fix: Возьмите 60 минут на каждый час и пересчитайте.
        next: Проверьте делением обратно на 60.
  - id: D-02
    type: number
    role: diagnostic
    purpose: procedure
    level: 1
    outcome: num-place-large/LO-02
    sections: [T01]
    minutes: 1
    prompt: Запишите цифрами число «сорок две тысячи пятьсот».
    answer: 42500
    hints:
      - "Разбейте название числа на разряды: тысячи и сотни."
      - Сорок две тысячи — это 42 тысячи.
      - Запишите 42 тысячи, к ним припишите 500 без потери разрядов.
    solution: |
      ### Ответ
      42500

      ### Идея
      Название числа читают по разрядам: сначала тысячи, затем сотни.

      ### Шаги
      1. Сорок две тысячи — это $42 \cdot 1000 = 42 000$.
      2. Пятьсот — это 500.
      3. $42 000 + 500 = 42 500$.

      ### Проверка
      Прочитаем запись 42 500 по разрядам: 42 тысячи 500 — совпало с условием.

      ### Типичная ошибка
      Потерять нули внутри числа: 4250 вместо 42 500.
    feedback:
      correct: "Верно: 42 500 записано по разрядам."
      wrong:
        what: Число записано неверно.
        why: Возможно, пропущен нуль в разряде сотен.
        fix: Проверьте, что после тысяч идут три разряда — сотни, десятки, единицы.
        next: Прочитайте свою запись по разрядам вслух.
  - id: D-03
    type: number
    role: diagnostic
    purpose: meaning
    level: 1
    outcome: num-place-large/LO-02
    sections: [T01]
    minutes: 1
    prompt: Сколько сотен в числе 4500?
    answer: 45
    hints:
      - Вспомните, что одна тысяча — это десять сотен.
      - "Разложите число по разрядам: 4500 — это 4 тысячи и 5 сотен."
      - Сосчитайте сотни в тысячах и прибавьте сотни остатка.
    solution: |
      ### Ответ
      45 сотен

      ### Идея
      Число раскладывают по разрядам: сотни считаются и внутри тысяч, и в остатке.

      ### Шаги
      1. $4500 = 4000 + 500$.
      2. В одной тысяче десять сотен, значит в 4000 их $4 \cdot 10 = 40$.
      3. В числе 500 пять сотен: $40 + 5 = 45$.

      ### Проверка
      $45 \cdot 100 = 4500$ — исходное число восстановлено.

      ### Типичная ошибка
      Посчитать сотни только в разряде сотен и потерять тысячи: 5 вместо 45.
    feedback:
      correct: "Верно: 4500 — это 45 сотен, тысячи и сотни сосчитаны вместе."
      wrong:
        what: Число сотен не совпало.
        why: Возможно, учтён только разряд сотен, а тысячи потеряны.
        fix: Разложите число на тысячи и сотни, затем переведите тысячи в сотни.
        next: "Проверьте умножением: число сотен на 100 даёт исходное число."
