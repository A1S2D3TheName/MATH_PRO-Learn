# Интервальное повторение (§8): 5 задач, у параметрических — по 3 варианта.
tasks:
  - id: R-01
    type: number
    role: refresh
    purpose: procedure
    level: 1
    outcome: LO-01
    sections: [T02]
    minutes: 3
    prompt: От рулона отрезали полосу длиной {{a}} м. Какова длина полосы в сантиметрах?
    answer: 300
    variants:
      - params: {a: 3}
        answer: 300
        solution: |
          ### Ответ
          300 см

          ### Идея
          Мерка стала мельче в сто раз, поэтому мерок стало в сто раз больше.

          ### Шаги
          1. $1\ \text{м} = 100\ \text{см}$.
          2. $3 \cdot 100 = 300\ \text{см}$.

          ### Проверка
          $300 : 100 = 3\ \text{м}$ — длина полосы восстановлена.

          ### Типичная ошибка
          E-model-units-convert-direction: деление вместо умножения уменьшило бы число,
          хотя сантиметр мельче метра — значит, мерок должно стать больше.
      - params: {a: 8}
        answer: 800
        solution: |
          ### Ответ
          800 см

          ### Идея
          Мерка стала мельче в сто раз, поэтому мерок стало в сто раз больше.

          ### Шаги
          1. $1\ \text{м} = 100\ \text{см}$.
          2. $8 \cdot 100 = 800\ \text{см}$.

          ### Проверка
          $800 : 100 = 8\ \text{м}$ — длина полосы восстановлена.

          ### Типичная ошибка
          E-model-units-convert-direction: деление вместо умножения уменьшило бы число,
          хотя сантиметр мельче метра — значит, мерок должно стать больше.
      - params: {a: 11}
        answer: 1100
        solution: |
          ### Ответ
          1100 см

          ### Идея
          Мерка стала мельче в сто раз, поэтому мерок стало в сто раз больше.

          ### Шаги
          1. $1\ \text{м} = 100\ \text{см}$.
          2. $11 \cdot 100 = 1100\ \text{см}$.

          ### Проверка
          $1100 : 100 = 11\ \text{м}$ — длина полосы восстановлена.

          ### Типичная ошибка
          E-model-units-deci-for-santi: множитель 10 дал бы $11 \cdot 10 = 110$ см —
          в десять раз меньше верного.
    hints:
      - Метр и сантиметр относятся к одной величине — длине.
      - Сантиметр мельче, значит число вырастет.
      - Умножьте {{a}} на 100.
    solution: |
      ### Ответ
      Длина полосы в сантиметрах для записи {{a|pl:метр,метра,метров}}.

      ### Идея
      Перевод к меньшей единице делают умножением на 100.

      ### Шаги
      1. $1\ \text{м} = 100\ \text{см}$.
      2. {{a}} · 100.

      ### Проверка
      Разделите результат на 100: должно вернуться исходное число метров.

      ### Типичная ошибка
      Деление вместо умножения уменьшает длину — полоса короче метра быть не может.
    feedback:
      correct: "Верно: метры переведены в сантиметры умножением на сто."
      wrong:
        what: Длина полосы ткани в сантиметрах не совпала.
        why: Возможно, метры разделены на сто вместо умножения.
        fix: Умножьте число метров на 100.
        next: Проверьте делением ответа на 100.
  - id: R-02
    type: number
    role: refresh
    purpose: procedure
    level: 1
    outcome: LO-01
    sections: [T03]
    minutes: 3
    prompt: Масса коробки с книгами {{a}} кг. Выразите эту массу в граммах.
    answer: 3000
    variants:
      - params: {a: 3}
        answer: 3000
        solution: |
          ### Ответ
          3000 г

          ### Идея
          Приставка кило задаёт множитель 1000, поэтому граммов получится в тысячу раз больше.

          ### Шаги
          1. $1\ \text{кг} = 1000\ \text{г}$.
          2. $3 \cdot 1000 = 3000\ \text{г}$.

          ### Проверка
          $3000 : 1000 = 3\ \text{кг}$ — масса восстановлена.

          ### Типичная ошибка
          E-model-units-hundred-for-step: множитель 100 вместо 1000 дал бы $3 \cdot 100 = 300$ г —
          массу небольшой чашки вместо коробки с книгами.
      - params: {a: 5}
        answer: 5000
        solution: |
          ### Ответ
          5000 г

          ### Идея
          Приставка кило задаёт множитель 1000, поэтому граммов получится в тысячу раз больше.

          ### Шаги
          1. $1\ \text{кг} = 1000\ \text{г}$.
          2. $5 \cdot 1000 = 5000\ \text{г}$.

          ### Проверка
          $5000 : 1000 = 5\ \text{кг}$ — масса восстановлена.

          ### Типичная ошибка
          E-model-units-hundred-for-step: множитель 100 вместо 1000 дал бы $5 \cdot 100 = 500$ г —
          массу небольшой чашки вместо коробки с книгами.
      - params: {a: 7}
        answer: 7000
        solution: |
          ### Ответ
          7000 г

          ### Идея
          Приставка кило задаёт множитель 1000, поэтому граммов получится в тысячу раз больше.

          ### Шаги
          1. $1\ \text{кг} = 1000\ \text{г}$.
          2. $7 \cdot 1000 = 7000\ \text{г}$.

          ### Проверка
          $7000 : 1000 = 7\ \text{кг}$ — масса восстановлена.

          ### Типичная ошибка
          E-model-units-hundred-for-step: множитель 100 вместо 1000 дал бы $7 \cdot 100 = 700$ г —
          коробка с книгами столько не весит.
    hints:
      - Приставка кило означает тысячу.
      - Грамм мельче килограмма, поэтому число вырастет.
      - Умножьте {{a}} на 1000.
    solution: |
      ### Ответ
      Масса в граммах для записи {{a|pl:килограмм,килограмма,килограммов}}.

      ### Идея
      Кило — кратная приставка с множителем 1000.

      ### Шаги
      1. $1\ \text{кг} = 1000\ \text{г}$.
      2. {{a}} · 1000.

      ### Проверка
      Разделите результат на 1000 и сравните с исходными килограммами.

      ### Типичная ошибка
      Коэффициент 100 относится к сантиметру, а не к килограмму.
    feedback:
      correct: "Верно: килограммы выражены в граммах с множителем тысяча."
      wrong:
        what: Масса коробки с книгами в граммах не совпала.
        why: Возможно, взят множитель 100 вместо 1000.
        fix: Запишите $1\ \text{кг} = 1000\ \text{г}$ и умножьте число килограммов на тысячу.
        next: Проверьте делением ответа на 1000.
  - id: R-03
    type: match
    role: refresh
    purpose: procedure
    level: 0
    outcome: LO-03
    sections: [T01]
    minutes: 3
    prompt: Установите соответствие между единицей измерения и величиной, к которой она относится.
    left:
      - {id: e1, text: "тонна"}
      - {id: e2, text: "квадратный сантиметр"}
      - {id: e3, text: "минута"}
    right:
      - {id: q1, text: масса}
      - {id: q2, text: площадь}
      - {id: q3, text: время}
      - {id: q4, text: объём}
    answer:
      - {left: e1, right: q1}
      - {left: e2, right: q2}
      - {left: e3, right: q3}
    hints:
      - "Разберите название единицы на части: «квадратный» говорит о площади."
      - Тонна — крупная единица массы, как килограмм.
      - Минута относится к ряду единиц времени.
    solution: |
      ### Ответ
      тонна — масса, квадратный сантиметр — площадь, минута — время.

      ### Идея
      Название единицы указывает на величину: слово «квадратный» говорит о двух измерениях,
      а основное слово — о том, что измеряют.

      ### Шаги
      1. Тонна — крупная мера массы: $1\ \text{т} = 1000\ \text{кг}$.
      2. Квадратный сантиметр получают перемножением двух длин, значит это площадь.
      3. Минута измеряет время вместе с секундой и часом.

      ### Проверка
      Лишняя карточка «объём» осталась без пары: объём измеряют литрами и кубическими метрами,
      а среди наших единиц таких нет.

      ### Типичная ошибка
      Приписать квадратную единицу объёму: объём требует кубической единицы, а квадратная
      получается из двух измерений.
    feedback:
      correct: "Верно: единицы соотнесены с величинами по своим названиям."
      wrong:
        what: Одна из пар собрана неверно.
        why: Возможно, название единицы разобрано без учёта слова «квадратный» или приставки.
        fix: "Разберите каждое название: основное слово говорит о величине."
        next: Сверьтесь со сводной таблицей единиц в разделе T01.
  - id: R-04
    type: table-fill
    role: refresh
    purpose: procedure
    level: 2
    outcome: LO-01
    sections: [T03]
    minutes: 3
    shape: [4, 2]
    prompt: |
      | Перевод | Во сколько раз |
      |---|--------|
      | метр → сантиметр | |
      | килограмм → грамм | |
      | дециметр → сантиметр | |
      | километр → метр | |

      Заполните таблицу: укажите, во сколько раз одна единица крупнее другой.
    answer:
      - {r: 0, c: 1, value: 100}
      - {r: 1, c: 1, value: 1000}
      - {r: 2, c: 1, value: 10}
      - {r: 3, c: 1, value: 1000}
    hints:
      - Вспомните приставку каждой единицы.
      - Санти — сотая часть, деци — десятая.
      - Кило и милли — тысячные шаги.
    solution: |
      ### Ответ
      метр → сантиметр — 100, килограмм → грамм — 1000, дециметр → сантиметр — 10,
      километр → метр — 1000.

      ### Идея
      Коэффициент перевода задаёт приставка, а не величина.

      ### Шаги
      1. Санти — сотая доля, значит в метре 100 сантиметров.
      2. Кило — тысяча, значит в килограмме 1000 граммов и в километре 1000 метров.
      3. Деци — десятая доля, значит в дециметре 10 сантиметров.

      ### Проверка
      Умножьте число сантиметров на 100 обратно: 100 сантиметров дают 1 метр — коэффициент
      выбран верно.

      ### Типичная ошибка
      E-model-units-milli-for-santi: множитель тысячу относят к сантиметру, а он принадлежит
      приставке милли — в метре сто сантиметров.
    feedback:
      correct: "Верно: коэффициенты взяты из приставок, а не из величины."
      wrong:
        what: Один из коэффициентов неверен.
        why: Возможно, приставка прочитана как соседняя.
        fix: Разберите приставку каждой единицы по таблице приставок.
        next: Проверьте строку обратным переводом.
  - id: R-05
    type: number
    role: refresh
    purpose: method
    level: 2
    outcome: LO-01
    sections: [T03]
    minutes: 3
    prompt: Ширина шкафа {{a}} сантиметров. Выразите её в дециметрах.
    answer: 2
    variants:
      - params: {a: 20}
        answer: 2
        solution: |
          ### Ответ
          2 дм

          ### Идея
          Дециметр крупнее сантиметра в десять раз, поэтому число уменьшается в десять раз.

          ### Шаги
          1. $1\ \text{дм} = 10\ \text{см}$.
          2. $20 : 10 = 2\ \text{дм}$.

          ### Проверка
          $2 \cdot 10 = 20\ \text{см}$ — ширина восстановлена.

          ### Типичная ошибка
          E-model-units-deci-for-santi: умножение на 10 дало бы 200 дм, то есть двадцать метров.
      - params: {a: 50}
        answer: 5
        solution: |
          ### Ответ
          5 дм

          ### Идея
          Дециметр крупнее сантиметра в десять раз, поэтому число уменьшается в десять раз.

          ### Шаги
          1. $1\ \text{дм} = 10\ \text{см}$.
          2. $50 : 10 = 5\ \text{дм}$.

          ### Проверка
          $5 \cdot 10 = 50\ \text{см}$ — ширина восстановлена.

          ### Типичная ошибка
          E-model-units-deci-for-santi: умножение на 10 дало бы 500 дм, то есть пятьдесят метров.
      - params: {a: 80}
        answer: 8
        solution: |
          ### Ответ
          8 дм

          ### Идея
          Дециметр крупнее сантиметра в десять раз, поэтому число уменьшается в десять раз.

          ### Шаги
          1. $1\ \text{дм} = 10\ \text{см}$.
          2. $80 : 10 = 8\ \text{дм}$.

          ### Проверка
          $8 \cdot 10 = 80\ \text{см}$ — ширина восстановлена.

          ### Типичная ошибка
          E-model-units-deci-for-santi: умножение на 10 дало бы 800 дм, то есть восемьдесят метров.
    hints:
      - Приставка деци означает десятую долю метра.
      - Дециметр крупнее сантиметра, значит число уменьшится.
      - Разделите {{a}} на 10.
    solution: |
      ### Ответ
      Ширина в дециметрах для записи {{a|pl:сантиметр,сантиметра,сантиметров}}.

      ### Идея
      Переход к крупной единице делают делением на число мелких единиц в ней.

      ### Шаги
      1. $1\ \text{дм} = 10\ \text{см}$.
      2. {{a}} : 10.

      ### Проверка
      Умножьте результат на 10 и сравните с числом сантиметров.

      ### Типичная ошибка
      Деление на 100 относится к переводу в метры, здесь шаг равен десяти.
    feedback:
      correct: "Верно: сантиметры переведены в дециметры делением на десять."
      wrong:
        what: Ширина в дециметрах не совпала.
        why: Возможно, использован шаг 100 или выполнено умножение.
        fix: Запишите $1\ \text{дм} = 10\ \text{см}$ и разделите число сантиметров на десять.
        next: Проверьте умножением результата на 10.
