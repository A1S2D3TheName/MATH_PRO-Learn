id: model-units
title: "Величины и единицы измерения"
section: model
stage: 1
hours: 3
grade: "2–4"
prerequisites: [model-time, num-place-large]
scope: >
  Единицы времени уже введены в model-time; здесь они входят в общую таблицу величин.
version: "1.0.0"
summary: >
  Величину измеряют, сравнивая с выбранной единицей, поэтому запись измерения состоит из числа
  и единицы. Внутри одной величины единицы переводят умножением или делением на коэффициент
  из приставки, а результат проверяют обратным переводом и правдоподобностью.
search:
  synonyms:
    - величины и единицы измерения
    - единица измерения длины
    - как перевести метры в сантиметры
    - килограмм и грамм
    - литр и миллилитр
    - квадратный метр
    - кубический метр
    - приставка кило
    - приставка милли
    - запись величины числом с единицей
    - таблица единиц измерения
    - перевод единиц внутри величины
  questions:
    - Что такое величина и единица измерения?
    - Почему число без единицы ничего не значит?
    - Как перевести метры в сантиметры?
    - Как перевести граммы в килограммы?
    - Сколько миллилитров в литре?
    - Что означает приставка кило?
    - Чем санти отличается от милли?
    - Сколько квадратных сантиметров в квадратном метре?
    - Как проверить перевод единиц?
subtopics:
  - id: model-units/quantities
    title: Длина, масса, объём, площадь и их единицы
    tree_ref: Длина, масса, объём, площадь и их единицы
    synonyms: [единицы длины, единицы массы, единицы объёма, квадратные единицы]
    sections: [T01]
  - id: model-units/convert
    title: Перевод единиц внутри одной величины
    tree_ref: Перевод единиц внутри одной величины
    synonyms: [перевод метров в сантиметры, перевод граммов в килограммы, обратный перевод]
    sections: [T02]
  - id: model-units/prefixes
    title: Кратные и дольные приставки
    tree_ref: Кратные и дольные приставки
    synonyms: [кило, санти, милли, деци, таблица приставок]
    sections: [T03]
  - id: model-units/notation
    title: Запись величины числом с единицей
    tree_ref: Запись величины числом с единицей
    synonyms: [число и единица, запись измерения, квадратные и кубические единицы]
    sections: [T04]
outcomes:
  - id: LO-01
    short: Переводит единицы внутри величины
    action: Переводит значение из одной единицы в другую внутри одной величины
    conditions: Даны целые значения и пары единиц с коэффициентом 10, 100 или 1000, включая приставки кило, санти, милли и деци
    criterion: Верно выбирает умножение или деление, записывает результат и проверяет его обратным переводом
    level: core
    sections: [T02, T03]
  - id: LO-02
    short: Записывает величину с единицей
    action: Записывает величину числом с единицей и проверяет правдоподобность записи
    conditions: Даны измерения длины, массы, объёма и площади, включая площади и объёмы с квадратными и кубическими единицами
    criterion: Верно записывает число с нужной единицей, различает квадратные единицы и объёма и отбрасывает неправдоподобный результат
    level: core
    sections: [T04]
  - id: LO-03
    short: Различает величины и их единицы
    action: Определяет величину измерения и выбирает подходящую единицу
    conditions: Даны длина, масса, объём, площадь или время и запись измерения с числом и единицей
    criterion: Верно указывает величину для записи и объясняет, почему запись без единицы неполна
    level: standard
    sections: [T01, T04]
errors:
