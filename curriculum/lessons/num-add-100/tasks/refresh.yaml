  - T01
  - T04
  minutes: 3
  fields:
  - id: step
    label: Первый шаг
  - id: result
    label: Итог
  prompt: 'Выберите разбиение второго слагаемого для ${{a}} + {{b}}$: первым шагом достигните ближайшего большего
    круглого десятка. Введите величину первого шага и итог вычисления.'
  answer: &id001
    step: 6
    result: 51
  hints:
  - 'R-03: Сначала выберите шаг, ведущий к соседнему круглому десятку.'
  - Распределите второе число между первым шагом и остатком; затем выполните оба шага.
  - 'Рассмотрите единицы числа {{a}}: они определяют величину шага до нужного десятка.'
  solution: |
    ### Ответ
    Первый шаг: 6; итог: 51.

    ### Идея
    Выбор шага определяется близостью первого числа к круглому десятку, а не его величиной.

    ### Шаги
    1. Выбираем шаг $6$: $44 + 6 = 50$.
    2. Остаток второго числа: $7 − 6 = 1$.
    3. Завершаем: $50 + 1 = 51$.

    ### Проверка
    Обратное действие: $51 − 7 = 44$.

    ### Типичная ошибка
    Не используйте всё второе число дважды: после первого шага остаётся только его остаток.
