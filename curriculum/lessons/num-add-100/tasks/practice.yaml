  minutes: 1
  prompt: Вычислите ${{a}} + {{b}}$. Введите число.
  answer: 63
  hints:
  - 'P-01: Сопоставьте действие с объединением двух частей.'
  - Сложите отдельно десятки и единицы, затем объедините результаты.
  - Начните с разложения числа {{a}} на десятки и единицы; затем рассмотрите разряды {{b}}.
  solution: |
    ### Ответ
    63

    ### Идея
    Количество сохраняется при разложении по разрядам; одинаковые разряды считаем вместе.

    ### Шаги
    1. Десятки: $40 + 10 = 50$.
    2. Единицы: $8 + 5 = 13$.
    3. Объединяем части: $50 + 13 = 63$.

    ### Проверка
    Восстанавливаем исходное число: $63 − 15 = 48$.

    ### Типичная ошибка
    Не теряйте десяток из единиц.
