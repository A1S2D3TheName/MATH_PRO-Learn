- id: P-02
  type: number
  role: warmup
  purpose: meaning
  level: 0
  outcome: LO-01
  sections:
  - T01
  minutes: 1
  prompt: Для суммы ${{a}} + {{b}}$ выполнен обмен единиц на десяток. Сколько десятков получится в итоговой записи?
    Введите только число десятков.
  answer: 4
  hints:
  - 'P-02: Различите полную сумму и число её десятков.'
  - Посчитайте десятки слагаемых и проверьте, дают ли единицы новый десяток.
  - В числе {{a}} выделите десятки и единицы; затем рассмотрите единицы {{b}}.
  solution: |
    ### Ответ
    4

    ### Идея
    Нужно назвать не всю сумму, а её разряд десятков.

    ### Шаги
    1. Единицы дают $8 + 7 = 15$.
    2. К $3$ исходным десяткам добавляем $1$ от обмена.
    3. В итоговой записи $4$ десятков.

    ### Проверка
    Полная сумма равна $45$; её цифра десятков согласуется с ответом.

    ### Типичная ошибка
    Не смешивайте число десятков с числом единиц в сумме.
