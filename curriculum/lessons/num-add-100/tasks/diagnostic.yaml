- id: D-03
  type: number
  role: diagnostic
  purpose: procedure
  level: 1
  outcome: num-sub-meaning/LO-01
  sections:
  - T02
  minutes: 1
  prompt: Вычислите ${{a}} − {{b}}$. Введите число.
  answer: 6
  hints:
  - 'D-03: вспомните смысл действия из пререквизита.'
  - В диагностике подсказки не открываются; при ошибке вернитесь к указанной теме.
  - Рассмотрите исходное число {{a}}.
  solution: |
    ### Ответ
    6

    ### Идея
    Удаляем указанную часть группы.

    ### Шаги
    1. $9 − 3 = 6$.

    ### Проверка
    $6 + 3 = 9$.

    ### Типичная ошибка
    Не смешивайте счётные единицы и само количество.
  feedback:
    correct: 'D-03: проверен навык пререквизита.'
    wrong:
