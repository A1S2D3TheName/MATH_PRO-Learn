    ### Ответ
    Десятков: 4; единиц: 7.

    ### Идея
    Разряды обозначают разные счётные единицы.

    ### Шаги
    1. Отделяем десятки 4 от единиц 7.

    ### Проверка
    Запись числа 47 имеет цифры десятков 4 и единиц 7.

    ### Типичная ошибка
    Не смешивайте счётные единицы и само количество.
