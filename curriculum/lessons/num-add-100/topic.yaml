outcomes:
- id: LO-01
  short: Складывает с переходом через десяток
  action: Складывает числа в пределах 100 и выбирает разбиение слагаемого для перехода через десяток
  conditions: Даны неотрицательные числа от 0 до 100; сумма не больше 100.
  criterion: верно находит сумму, включая случаи с переходом через десяток
  level: core
  sections:
  - T01
  - T04
  - T05
  - T06
  - T07
  - T08
- id: LO-02
  short: Вычитает с заёмом десятка
  action: Вычитает числа в пределах 100 с обменом десятка и без обмена
  conditions: Даны неотрицательные числа от 0 до 100; вычитаемое не больше уменьшаемого.
  criterion: верно находит разность, раскладывая десяток на единицы
  level: core
  sections:
  - T02
  - T04
  - T05
  - T06
  - T07
  - T08
- id: LO-03
  short: Проверяет результат обратным действием
  action: Проверяет сумму вычитанием и разность сложением, находит ошибку при несовпадении
  conditions: даны два числа и результат сложения или вычитания
  criterion: верно выполняет обратное действие и определяет правильность результата
  level: core
  sections:
  - T03
  - T05
  - T06
  - T07
  - T08
