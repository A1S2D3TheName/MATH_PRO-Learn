title: День погреба
context_id: pogreb-den
scenario: 'День в погребе: утром хозяин пересчитывает банки на полке и часть убирает в ящик, в обед воз
  привозит новые банки, вечером часть банок списывают как испорченные, а к ночи на полке остаётся меньше,
  чем было утром. Все итоги дня находятся вычитанием.'
