  - params:
      a: 14
      b: 5
      c: 6
      d: 4
    answer: 9
    solution: '### Ответ

      9


      ### Идея

      Из группы в 14 банок убирают 5 и пересчитывают то, что осталось.


      ### Шаги

      1. Уменьшаемое — 14, вычитаемое — 5.

      2. Отсчитываем от 14 назад 5 шагов и называем число после каждого шага.

      3. Последнее названное число — 9; запись: $14 - 5 = 9$.


      ### Проверка

      К остатку вернём убранное: 9 + 5 = 14.


      ### Типичная ошибка

      E-num-sub-meaning-count-off-by-one: первый шаг приземляется на само уменьшаемое, и разность выходит
      на единицу больше.

      '
