  - params:
      a: 9
      b: 4
    answer: 5
    solution: '### Ответ

      5


      ### Идея

      Из группы в 9 писем убирают 4 и пересчитывают то, что осталось.


      ### Шаги

      1. Уменьшаемое — 9, вычитаемое — 4.

      2. Отсчитываем от 9 назад 4 шага и называем число после каждого шага.

      3. Последнее названное число — 5; запись: $9 - 4 = 5$.


      ### Проверка

      К остатку вернём убранное: 5 + 4 = 9.


      ### Типичная ошибка

      E-num-sub-meaning-count-off-by-one: первый шаг приземляется на само уменьшаемое, и разность выходит
      на единицу больше.

      '
