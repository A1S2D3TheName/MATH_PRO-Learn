  prompt: Хозяин записал 9 - 4 = 6 и говорит, что запись верна. Что вы ему ответите?
  hints:
  - Проверка должна вернуть уменьшаемое.
  - Сложите разность и вычитаемое и сравните сумму с уменьшаемым.
  - Если сумма не совпала, пересчитайте разность отсчётом назад.
  solution: '### Ответ

    Запись неверна: проверка сложением её не подтверждает, верная разность 5


    ### Идея

    Проверка сложением не сходится, значит в записи ошибка, и её надо найти пересчётом.


    ### Шаги

    1. Складываем разность и вычитаемое из записи: 6 + 4 = 10, а уменьшаемое 9.

    2. Сумма не совпала с уменьшаемым, значит запись неверна.

    3. Отсчитываем назад от 9 четыре шага: 8, 7, 6, 5 — верная разность 5.


    ### Проверка

    Верная разность даёт равенство 5 + 4 = 9, обе части совпали с уменьшаемым.


    ### Типичная ошибка

    Списать несовпадение на «неудобную проверку» и оставить неверную запись.

    '
