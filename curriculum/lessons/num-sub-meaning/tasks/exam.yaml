      ### Шаги

      1. Разность записи — 7, вычитаемое — 4.

      2. Складываем: 7 + 4 = 11.

      3. Сумма равна уменьшаемому — запись подтверждена.


      ### Проверка

      Отсчёт назад от 11 на четыре шага приводит в разность 7.


      ### Типичная ошибка

      E-num-sub-meaning-add-instead: к уменьшаемому прибавляют вычитаемое и получают 15 —
