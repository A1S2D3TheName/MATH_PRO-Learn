    sections:
    - T01
    minutes: 3
    points: 1
    answer: 16
    prompt: Хозяин записал вычитание 8 - 3 = 5, не подписав числа. Введите сумму уменьшаемого, вычитаемого
      и разности.
    hints:
    - Назовите три числа записи по их местам.
    - Первое — уменьшаемое, после минуса — вычитаемое, после равенства — разность.
    - Сложите все три числа.
    solution: '### Ответ

      16


      ### Идея

      Названия чисел зависят от их места в записи.


      ### Шаги

      1. Уменьшаемое 8, вычитаемое 3, разность 5.

      2. Складываем все три числа: 8 + 3 + 5.

      3. Получаем 16.


      ### Проверка

      Вычитаемое и разность в сумме дают уменьшаемое: 3 + 5 = 8, а вместе с уменьшаемым получаем 16.


      ### Типичная ошибка

      E-num-sub-meaning-minus-as-dash: знак «минус» читают как дефис и записывают числа рядом.

      '
    feedback:
      correct: Верно, все три числа названы и сложены.
      wrong:
        what: Сумма не совпала.
        why: Возможно, названы не те числа записи.
        fix: Найдите числа по местам и сложите их.
        next: Проверьте сложением.
