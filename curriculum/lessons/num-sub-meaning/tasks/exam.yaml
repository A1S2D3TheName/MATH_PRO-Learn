      Проверка сложением: разность и вычитаемое в сумме дают уменьшаемое.


      ### Шаги

      1. Разность записи — 5, вычитаемое — 4.

      2. Складываем: 5 + 4 = 9.

      3. Сумма равна уменьшаемому — запись подтверждена.


      ### Проверка

      Отсчёт назад от 9 на четыре шага приводит в разность 5.


