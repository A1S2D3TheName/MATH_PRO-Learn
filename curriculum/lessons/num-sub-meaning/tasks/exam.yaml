# Контрольная (STANDARD.md §8): два равных варианта по 10 задач, уровни идут от простых к
# сложным, сумма минут каждого варианта — 30.
variants:
- id: A
  tasks:
  - id: EA-01
    type: number
    role: exam
    purpose: procedure
    level: 1
    outcome: LO-01
    sections:
    - T01
    - T02
    minutes: 3
    points: 1
    answer: 7
    prompt: Вычислите 13 - 6.
    hints:
    - Вычесть — значит убрать часть группы.
    - Отсчитайте от 13 назад шесть шагов.
    - Первое названное число — 12.
    solution: '### Ответ

      7


      ### Идея

      Вычитание уменьшает группу: из тринадцати убирают шесть.


      ### Шаги

      1. Уменьшаемое 13, вычитаемое 6.

      2. Отсчитываем назад: 12, 11, 10, 9, 8, 7.

      3. Последняя отметка — 7.


      ### Проверка

      К остатку вернём убранное: 7 + 6 = 13.


      ### Типичная ошибка

      E-num-sub-meaning-count-off-by-one: первый шаг приземляется на само уменьшаемое, и разность выходит
      на единицу больше.

      '
    feedback:
      correct: Верно, разность найдена.
      wrong:
        what: Ответ не совпал.
        why: Возможно, старт посчитан за шаг.
        fix: Отсчитайте от 13 ровно шесть шагов влево.
        next: Проверьте сложением.
  - id: EA-02
    type: number
    role: exam
    purpose: procedure
    level: 1
    outcome: LO-01
    sections:
    - T02
    minutes: 3
    points: 1
    answer: 2
    prompt: На полке было 7 банок, 5 унесли. Сколько банок осталось?
    hints:
    - Уберите часть группы и пересчитайте остаток.
    - Отсчитайте от 7 назад пять шагов.
    - Первый шаг из 7 приводит в 6.
    solution: '### Ответ

      2


      ### Идея

      Из семи банок убирают пять и пересчитывают остаток.


      ### Шаги

      1. Уменьшаемое 7, вычитаемое 5.

      2. Отсчитываем назад: 6, 5, 4, 3, 2.

      3. Осталось 2.


      ### Проверка

      2 + 5 = 7, все банки на месте.


      ### Типичная ошибка

      E-num-sub-meaning-add-instead: к уменьшаемому прибавляют вычитаемое, и группа якобы растёт.

      '
    feedback:
      correct: Верно, остаток пересчитан.
      wrong:
        what: Ответ не совпал.
        why: Возможно, группа увеличилась вместо уменьшения.
        fix: Отсчитайте от 7 ровно пять шагов влево.
        next: Проверьте сложением.
  - id: EA-03
    type: number
    role: exam
    purpose: procedure
    level: 1
    outcome: LO-03
    sections:
    - T05
    minutes: 3
    points: 2
    answer: 8
    prompt: Из 8 банок унесли 0. Сколько банок осталось на полке?
    hints:
    - Ноль предметов убрать нельзя.
    - Сколько шагов влево делает ноль?
    - 'Проверьте сложением: разность плюс ноль.'
    solution: '### Ответ

      8


      ### Идея

      Вычитание нуля ничего не убирает.


      ### Шаги

      1. Вычитаемое 0 — убирать нечего.

      2. Ноль прыжков влево оставляют точку на месте.

      3. Осталось 8.


      ### Проверка

      8 + 0 = 8, обе части совпали.


      ### Типичная ошибка

      E-num-sub-meaning-zero-eats: вычитание нуля трактуют как «убрать всё».

      '
    feedback:
      correct: Верно, группа не изменилась.
      misconceptions:
      - id: E-num-sub-meaning-zero-minus-one
        when:
          answer: 7
        message: 'Ноль принят за единицу: из группы «убрали одну банку».'
      wrong:
        what: Ответ не совпал.
        why: Возможно, ноль принят за «убрать всё» или за «убрать одну».
        fix: 'Представьте, что не унесли ни одной банки: группа не меняется.'
        next: Проверьте сложением.
  - id: EA-04
    type: number
    role: exam
    purpose: meaning
    level: 1
