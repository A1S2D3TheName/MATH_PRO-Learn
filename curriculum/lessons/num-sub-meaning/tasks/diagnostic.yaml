  variants:
  - params:
      a: 6
      b: 3
    answer: 9
    solution: '### Ответ

      9


      ### Идея

      К известной группе присоединяют вторую и пересчитывают всё вместе.


      ### Шаги

      1. Первая группа — 6 предметов, вторая — 3.

      2. Досчитываем от 6 вперёд 3 шага: называем числа после старта.

      3. Последнее названное число — 9; запись: $6 + 3 = 9$.


      ### Проверка

      Начнём с 3 и сделаем 6 шагов вперёд; придём в то же число.


      ### Типичная ошибка

      Остановиться на первом слагаемом и не присоединить вторую группу.

      '
