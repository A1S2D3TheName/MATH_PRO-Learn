# Правило 160 требует записывать sections полным путём <prereq-id>/Tnn, но схема
# common.schema.json#/defs/sectionRef допускает только ^T[0-9]{2}$ — конфликт стандарта
# и схемы (вопрос к мейнтейнеру, см. PR). Пока sections указывают разделы текущей темы,
