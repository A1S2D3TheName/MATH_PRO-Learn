    2. Досчитываем от {{a}} вперёд {{b|pl:шаг,шага,шагов}}: называем числа после старта.

    3. Последнее названное число — 9; запись: ${{a}} + {{b}} = 9$.


    ### Проверка

    Начнём с {{b}} и сделаем {{a|pl:шаг,шага,шагов}} вперёд; придём в то же число.


    ### Типичная ошибка

    Остановиться на первом слагаемом и не присоединить вторую группу.

    '
  feedback:
    correct: Верно, две группы объединены и пересчитаны.
    wrong:
