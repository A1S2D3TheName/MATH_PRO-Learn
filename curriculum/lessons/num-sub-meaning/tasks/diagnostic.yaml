- id: D-04
  type: number
  role: diagnostic
  purpose: procedure
  level: 1
  outcome: num-add-meaning/LO-03
  sections:
  - T01
  minutes: 1
  variants:
  - params:
      a: 3
      b: 9
    answer: 6
    solution: '### Ответ

      6


      ### Идея

      Сколько принесли — на столько возросло число, значит искомое равно разнице.


      ### Шаги

      1. Было 3, стало 9: банок стало больше, их принесли.

      2. Отсчитываем от 9 назад 6 шагов до отметки 3.

      3. Число шагов и есть ответ: 6.


      ### Проверка

      К прежнему числу прибавим найденное: 3 + 6 = 9.


      ### Типичная ошибка

      Сложить оба данных числа: 3 + 9 = 12, а не 6. Принесённое — разница между «стало» и «было».

      '
  - params:
      a: 2
      b: 7
    answer: 5
    solution: '### Ответ

      5


      ### Идея

      Сколько принесли — на столько возросло число, значит искомое равно разнице.


      ### Шаги

      1. Было 2, стало 7: банок стало больше, их принесли.

      2. Отсчитываем от 7 назад 5 шагов до отметки 2.

      3. Число шагов и есть ответ: 5.


      ### Проверка

      К прежнему числу прибавим найденное: 2 + 5 = 7.


      ### Типичная ошибка

      Сложить оба данных числа: 2 + 7 = 9, а не 5. Принесённое — разница между «стало» и «было».

      '
  - params:
      a: 5
      b: 8
    answer: 3
    solution: '### Ответ

      3


      ### Идея

      Сколько принесли — на столько возросло число, значит искомое равно разнице.


      ### Шаги

