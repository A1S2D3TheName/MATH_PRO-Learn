      2. Досчитываем от 4 вперёд 6 шагов: называем числа после старта.

      3. Последнее названное число — 10; запись: $4 + 6 = 10$.


      ### Проверка

      Начнём с 6 и сделаем 4 шага вперёд; придём в то же число.


      ### Типичная ошибка

