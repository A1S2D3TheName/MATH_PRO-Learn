    solution: '### Ответ

      5


      ### Идея

      Из группы в 8 банок убирают 3 и пересчитывают то, что осталось.


      ### Шаги

      1. Уменьшаемое — 8, вычитаемое — 3.

      2. Отсчитываем от 8 назад 3 шага и называем число после каждого шага.

      3. Последнее названное число — 5; запись: $8 - 3 = 5$.


      ### Проверка

      К остатку вернём убранное: 5 + 3 = 8.


      ### Типичная ошибка

      E-num-sub-meaning-count-off-by-one: первый шаг приземляется на само уменьшаемое, и разность выходит
      на единицу больше.

      '
