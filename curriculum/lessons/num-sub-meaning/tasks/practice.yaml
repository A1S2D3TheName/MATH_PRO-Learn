      ### Шаги

      1. Первое число записи — 5, это уменьшаемое.

      2. Число после минуса — 2, это вычитаемое.

      3. Разность равна 5 - 2; складываем 5, 2 и разность.


      ### Проверка

      Вычитаемое и разность в сумме дают уменьшаемое: 2 + (5 - 2) = 5.


