      Часть банок переехала с полки в ящик, потом часть вернулась обратно; следим за каждым числом отдельно.


      ### Шаги

      1. На полке было 12, унесли 5: осталось 12 - 5.

      2. Из ящика вернули 2 банок: на полке стало 12 - 5 + 2.

      3. В ящике осталось 5 - 2, потому что 2 банок вернулись на полку.


      ### Проверка

      Оба найденных числа в сумме дают исходное количество 12: на полке столько же банок осталось, сколько
      принесли с ящика.


      ### Типичная ошибка

      Забыть, что возвращённые банки покинули ящик: в ящике тогда останется больше, чем на самом деле.

      '
