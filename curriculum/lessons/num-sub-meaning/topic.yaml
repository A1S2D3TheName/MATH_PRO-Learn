outcomes:
  - id: LO-01
    short: Вычитает удалением части группы
    action: вычисляет разность удалением части группы, называет уменьшаемое, вычитаемое и разность
    conditions: уменьшаемое и вычитаемое — целые числа от 0 до 20, вычитаемое не больше уменьшаемого, разность не больше 20
    criterion: верно называет три числа записи и находит разность, в том числе при равных числах и при нуле
    level: core
    sections: [T01, T02]
  - id: LO-02
    short: Находит неизвестное, проверяет сложением
    action: находит неизвестное слагаемое отсчётом назад и проверяет разность сложением
    conditions: даны два числа из записи a + b = c или a − b = c и запись с пропуском; все числа от 0 до 20
    criterion: верно называет пропущенное число и подбирает равенство, подтверждающее разность
    level: standard
    sections: [T03, T04]
  - id: LO-03
    short: Оценивает разность и разбирает границы
    action: оценивает разность до счёта, отбрасывает невозможный ответ и находит граничные случаи a − 0 и a − a
    conditions: уменьшаемое и вычитаемое — целые числа от 0 до 20; рассматривается набор из двух-трёх возможных ответов или цепочка из двух вычитаний
    criterion: отбрасывает ответ, противоречащий оценке, и верно считает вырожденные случаи и цепочки вычитаний
    level: deep
    sections: [T05]

