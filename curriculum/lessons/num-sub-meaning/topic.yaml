id: num-sub-meaning
title: "Вычитание как удаление и разность"
section: num
stage: 1
hours: 2
grade: "1"
prerequisites: [num-add-meaning]
version: "1.0.0"
summary: >
  Вычитание — это удаление части группы: из уменьшаемого убирают вычитаемое и считают,
  сколько осталось. Тема вводит знак «минус», названия уменьшаемое, вычитаемое и разность,
  движение влево по числовому лучу, нахождение неизвестного слагаемого и проверку вычитания
  сложением. Отдельно разбираются граничные случаи a − 0 и a − a и оценка разности до счёта.

search:
  synonyms:
    - вычитание чисел
    - что такое разность
    - что такое уменьшаемое
    - что такое вычитаемое
    - знак минус
    - вычитание как удаление
    - сколько осталось
    - сколько убрали
    - вычитание по числовому лучу
    - найти неизвестное слагаемое
    - как найти неизвестное уменьшаемое
    - проверить вычитание сложением
    - вычитание для начинающих
    - сколько осталось после отбора
  questions:
    - Что значит вычесть одно число из другого?
    - Как называются числа при вычитании?
    - Почему в записи 8 − 3 уменьшаемое пишут первым?
    - Как вычитание выглядит на числовом луче?
    - Сколько банок останется, если часть убрать?
    - Как найти, сколько банок принесли, если известны бывшее и новое число?
    - Как найти, сколько банок унесли, если известны, сколько было и сколько осталось?
    - Как проверить, что разность посчитана правильно?
    - Чему равна разность, если вычитаемое равно нулю?
    - Почему разность не бывает больше уменьшаемого?

