# Входная диагностика (STANDARD.md §6, правило 15): 4 задачи по прямому пререквизиту
# num-add-properties («Законы сложения»). Outcome записан как `num-add-properties/LO-NN`:
# пакет пререквизита ещё не опубликован, конкретные ID его outcomes нужно согласовать при
# интеграции (тот же приём, что в num-add-meaning для num-line).
tasks:
  - id: D-01
    type: number
    role: diagnostic
    purpose: procedure
    level: 0
    outcome: num-add-properties/LO-01
    sections: [T03]
    minutes: 1
    prompt: 'Посчитайте двумя порядками: сколько будет 8 + 5 и сколько будет 5 + 8? Введите общее значение обеих сумм.'
    answer: 13
    hints:
      - От перестановки слагаемых сумма не меняется — это переместительный закон сложения.
      - Дополните большее слагаемое до десятка и добавьте остаток.
      - Восемь дополняется двумя до десяти, затем прибавляются оставшиеся три.
    solution: |
      ### Ответ
      13

      ### Идея
      Перестановка слагаемых не меняет сумму: 8 + 5 и 5 + 8 — одно значение.

      ### Шаги
      1. Удобнее считать от пяти: 8 + 5 = 8 + (2 + 3).
      2. Десяток: 8 + 2 = 10, затем 10 + 3 = 13.
      3. Порядок 5 + 8 даёт то же 13.

      ### Проверка
      Обе записи — перестановка друг друга, значение обязано совпадать: 13.

      ### Типичная ошибка
      Остановиться после десятка и забыть остаток: 8 + 5 — это 10 и ещё 3.
    feedback:
      correct: Верно, обе суммы дают 13 — перестановка слагаемых работает.
      wrong:
        what: Значение не совпало.
        why: Возможно, счёт сбился при переходе через десяток.
        fix: Дополните восемь до десяти и прибавьте остаток.
        next: Повторите удобную группировку в теме о законах сложения.

  - id: D-02
    type: number
    role: diagnostic
    purpose: procedure
    level: 1
    outcome: num-add-properties/LO-02
    sections: [T02]
    minutes: 1
    prompt: 'Найдите значение, сгруппировав слагаемые удобным способом: 2 + 7 + 8.'
    answer: 17
    hints:
      - "Порядок группировки можно выбрать: ищите пару, дающую десяток."
      - Сочетательный закон разрешает складывать соседние слагаемые в любом группировании.
      - Сложите 2 и 8 — получится десяток, затем прибавьте семь.
    solution: |
      ### Ответ
      17

      ### Идея
      Группировка слагаемых не меняет сумму, поэтому выбираем пару с десятком.

      ### Шаги
      1. Группируем: (2 + 8) + 7.
      2. Десяток: 2 + 8 = 10.
      3. Итог: 10 + 7 = 17.

      ### Проверка
      Прямой счёт слева направо: 2 + 7 = 9, затем 9 + 8 = 17 — то же значение.

      ### Типичная ошибка
      Группировать (2 + 7) + 8 и терять десяток: значение то же, но счёт длиннее.
    feedback:
      correct: Верно, десяток найден, сумма равна 17.
      wrong:
        what: Значение не совпало.
        why: Возможно, группировка выбрана без десятка и счёт сбился.
        fix: Найдите пару слагаемых, дающую ровно десять.
        next: Повторите удобную группировку в теме о законах сложения.

  - id: D-03
    type: number
    role: diagnostic
    purpose: procedure
    level: 0
    outcome: num-add-properties/LO-03
    sections: [T04]
    minutes: 1
    prompt: Чему равно 14 + 0?
    answer: 14
    hints:
      - Прибавление нуля ничего не добавляет к группе предметов.
      - Это правило прибавления нуля из темы о законах сложения.
      - К четырнадцати предметам добавили пустую группу — предметов осталось четырнадцать.
    solution: |
      ### Ответ
      14

      ### Идея
      Ноль предметов ничего не добавляет: группа от прибавления нуля не меняется.

      ### Шаги
      1. К группе из 14 предметов присоединяем пустую группу.
      2. Пересчёт даёт те же 14 предметов.

      ### Проверка
      14 + 0 = 14 — правило прибавления нуля.

      ### Типичная ошибка
      Ответить 0 по ассоциации с нулём: ноль здесь — добавка, а не результат.
    feedback:
      correct: Верно, прибавление нуля оставило 14.
      wrong:
        what: Значение не совпало.
        why: Возможно, ноль из добавки попал в результат.
        fix: Считайте, сколько предметов стало после добавления пустой группы.
        next: Повторите прибавление нуля в теме о законах сложения.

  - id: D-04
    type: number
    role: diagnostic
    purpose: procedure
    level: 1
    outcome: num-add-properties/LO-02
    sections: [T05]
    minutes: 1
    prompt: 'Сложите четыре числа удобным способом: 4 + 9 + 6 + 1.'
    answer: 20
    hints:
      - Ищите пары слагаемых с круглой суммой.
      - Группировка не меняет сумму — складывайте парами в любом порядке.
      - Пары 4 + 6 и 9 + 1 дают по десятку.
    solution: |
      ### Ответ
      20

      ### Идея
      Две пары с десятками считаются быстрее, чем четыре слагаемых подряд.

      ### Шаги
      1. Группируем: (4 + 6) + (9 + 1).
      2. Каждая пара даёт десяток: 10 + 10.
      3. Итог: 20.

      ### Проверка
      Прямой счёт: 4 + 9 = 13, 13 + 6 = 19, 19 + 1 = 20 — то же значение.

      ### Типичная ошибка
      Потерять слагаемое при перегруппировке: в сумме участвуют все четыре числа.
    feedback:
      correct: Верно, две пары дали два десятка.
      wrong:
        what: Значение не совпало.
        why: Возможно, при группировке потеряно или задвоено слагаемое.
        fix: Проверьте, что каждая пара взята из исходных четырёх чисел без повторов.
        next: Повторите группировку слагаемых в теме о законах сложения.
