# Задачи не повторяют практику (условие или ответ); зеркало A/B — одинаковые роли, разные числа.
variants:
  - id: A
    tasks:
      - id: EA-01
        type: number
        role: exam
        purpose: procedure
        level: 0
        outcome: LO-01
        sections: [T01, T02]
        minutes: 2
        points: 1
        prompt: 'Вычислите 7 · 2. Ответ дайте числом.'
        answer: 14
        hints:
          - "Это произведение равных групп: семь групп по два."
          - "Считайте по группам, прибавляя по два, пока не наберёте семь групп."
          - "Сложите семь двоек парами: (2 + 2) + (2 + 2) + (2 + 2) + 2."
        solution: |
          ### Ответ
          14

          ### Идея
          Семь групп по два — произведение 7 · 2.

          ### Шаги
          1. Запись: 7 · 2.
          2. Считаем парами: (2 + 2) + (2 + 2) + (2 + 2) + 2 = 4 + 4 + 4 + 2.
          3. 4 + 4 + 4 = 12, 12 + 2 = 14.

          ### Проверка
          Счёт группами: 2, 4, 6, 8, 10, 12, 14 — семь групп.

          ### Типичная ошибка
          E-num-mult-meaning-add-instead: 7 + 2 = 9 — это сумма множителей, а не произведение.
        feedback:
          correct: Верно, произведение вычислено пересчётом групп.
          wrong:
            what: Значение не совпало.
            why: Возможно, множители сложены вместо умножения.
            fix: Пересчитайте семь групп по два.
            next: Разберите раздел T02.

