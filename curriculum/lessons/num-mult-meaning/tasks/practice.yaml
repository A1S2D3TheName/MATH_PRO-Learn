# Основной банк (STANDARD.md §6–§8): 29 задач, из них 28 в основном маршруте и 1 challenge.
# Роли warmup 3, supported 9, independent 16; доли уровней 10/30/30/20/10 ±5 п.п.
# Сквозной сюжет — пекарня при кафе «Перрон»; контексты чередуются: склад, витрина, зал, дорога.
tasks:
  # ---------------------------------------------------------------- warmup
  - id: P-01
    type: number
    role: warmup
    purpose: procedure
    level: 0
    outcome: LO-01
    sections: [T01]
    minutes: 1
    prompt: 'В поставке {{g}} коробки круассанов, в каждой коробке по {{s|pl:штука,штуки,штук}}. Сколько круассанов в поставке? Ответ дайте числом.'
    answer: 15
    variants:
      - params: {g: 3, s: 5}
        answer: 15
        solution: |
          ### Ответ
          15

          ### Идея
          Группы равные: три коробки по пять штук — это произведение 3 · 5.

          ### Шаги
          1. Число групп 3, размер группы 5.
          2. Считаем по коробкам: 5, 10, 15.
          3. 3 · 5 = 15.

          ### Проверка
          Сложение трёх пятёрок даёт то же число: 5 + 5 + 5 = 15.

          ### Типичная ошибка
          E-num-mult-meaning-add-instead: сложить 3 и 5 — получится число коробок и штук вместе, а не круассанов.
      - params: {g: 2, s: 6}
        answer: 12
        solution: |
          ### Ответ
          12

          ### Идея
          Группы равные: две коробки по шесть штук — это произведение 2 · 6.

          ### Шаги
          1. Число групп 2, размер группы 6.
          2. Считаем по коробкам: 6, 12.
          3. 2 · 6 = 12.

          ### Проверка
          Сложение двух шестёрок даёт то же число: 6 + 6 = 12.

          ### Типичная ошибка
          E-num-mult-meaning-one-group: остановиться на размере одной коробки — шесть штук, не взяв вторую коробку.
      - params: {g: 4, s: 2}
        answer: 8
        solution: |
          ### Ответ
          8

          ### Идея
          Группы равные: четыре коробки по две штуки — это произведение 4 · 2.

          ### Шаги
          1. Число групп 4, размер группы 2.
          2. Считаем по коробкам: 2, 4, 6, 8.
          3. 4 · 2 = 8.

          ### Проверка
          Сложение четырёх двоек даёт то же число: 2 + 2 + 2 + 2 = 8.

          ### Типичная ошибка
          E-num-mult-meaning-add-instead: сложить 4 и 2 вместо пересчёта групп.
    hints:
      - Группы равные, значит количество записывается произведением.
      - Первый множитель — число коробок, второй — сколько штук в коробке.
      - "Считайте по коробкам подряд: {{s}}, затем ещё столько же — и так {{g}} раз."
    solution: |
      ### Ответ
      Произведение {{g}} · {{s}}.

      ### Идея
      Равные группы считаются произведением: число групп — первый множитель, размер группы — второй.

      ### Шаги
      1. Определяем число групп и размер группы.
      2. Записываем произведение {{g}} · {{s}}.
      3. Пересчитываем группы по порядку.

      ### Проверка
      Та же величина получается сложением {{g}} одинаковых слагаемых.

      ### Типичная ошибка
      E-num-mult-meaning-add-instead: произведение — не сумма множителей.
    feedback:
      correct: Верно, коробки пересчитаны группами.
      wrong:
        what: Число круассанов не совпало.
        why: Возможно, множители перепутаны местами или часть коробок не посчитана.
        fix: Пересчитайте коробки по порядку, прибавляя по {{s}}.
        next: Разберите пример 1 раздела T01.

  - id: P-02
    type: numbers
    role: warmup
    purpose: meaning
    level: 0
    outcome: LO-01
    sections: [T01]
    minutes: 1
    fields:
      - {id: groups, label: число групп}
      - {id: size, label: размер группы}
      - {id: product, label: произведение}
    prompt: 'В накладной запись {{g}} · {{s}}. Введите: число групп, размер группы и произведение.'
    answer: {groups: 4, size: 9, product: 36}
    variants:
      - params: {g: 4, s: 9}
        answer: {groups: 4, size: 9, product: 36}
        solution: |
          ### Ответ
          групп 4, размер 9, произведение 36

          ### Идея
          Первый множитель — число групп, второй — размер группы, произведение — всего предметов.

          ### Шаги
          1. Первый множитель 4 — групп 4.
          2. Второй множитель 9 — в группе по 9.
          3. Считаем по группам: 9, 18, 27, 36.

          ### Проверка
          Сумма четырёх девяток: 9 + 9 + 9 + 9 = 36.

          ### Типичная ошибка
          E-num-mult-meaning-add-instead: произведение 4 · 9 — не сумма 4 + 9.
      - params: {g: 5, s: 6}
        answer: {groups: 5, size: 6, product: 30}
        solution: |
          ### Ответ
          групп 5, размер 6, произведение 30

          ### Идея
          Первый множитель — число групп, второй — размер группы, произведение — всего предметов.

          ### Шаги
          1. Первый множитель 5 — групп 5.
          2. Второй множитель 6 — в группе по 6.
          3. Считаем парами групп: 6 + 6 = 12, 6 + 6 = 12, 12 + 12 = 24, и ещё 6 — итого 30.

          ### Проверка
          Сумма пяти шестёрок даёт 30.

          ### Типичная ошибка
          E-num-mult-meaning-group-off: четыре слагаемых вместо пяти дают 24 — на одну группу меньше.
    hints:
      - "Множители уже стоят в записи: важно правильно назвать роль каждого."
      - Первый множитель — сколько групп, второй — сколько предметов в одной группе.
      - "Для произведения считайте по группам: {{s}}, ещё {{s}} — и так по числу групп."
    solution: |
      ### Ответ
      Число групп {{g}}, размер группы {{s}}, произведение {{g}} · {{s}}.

      ### Идея
      В записи a · b первый множитель — число групп, второй — размер группы.

      ### Шаги
      1. Называем число групп по первому множителю.
      2. Называем размер группы по второму множителю.
      3. Произведение — общее число предметов.

      ### Проверка
      Произведение пересчитывается сложением равных слагаемых.

      ### Типичная ошибка
      E-num-mult-meaning-add-instead: складывать множители вместо пересчёта групп.
    feedback:
      correct: Верно, роли множителей названы правильно.
      wrong:
        what: Поля не совпали.
        why: Возможно, группы и размер перепутаны или произведение заменено суммой.
        fix: Вернитесь к правилу чтения записи a · b из раздела T01.
        next: Разберите таблицу имён в разделе T01.

  - id: P-03
    type: number
    role: warmup
    purpose: procedure
    level: 0
    outcome: LO-02
    sections: [T03]
    minutes: 1
    prompt: 'Сетка выложена из {{r}} рядов квадратов, в каждом ряду по {{c|pl:квадрат,квадрата,квадратов}}. Сколько квадратов в сетке?'
    answer: 8
    variants:
      - params: {r: 2, c: 4}
        answer: 8
        solution: |
          ### Ответ
          8

          ### Идея
          Число квадратов сетки — произведение числа рядов и числа столбцов.

          ### Шаги
          1. Рядов 2, в каждом по 4.
          2. Считаем по рядам: 4, 8.
          3. 2 · 4 = 8.

          ### Проверка
          По столбцам: 4 столбца по 2, 4 · 2 = 8 — то же число.

          ### Типичная ошибка
          E-num-mult-meaning-add-instead: сложить 2 и 4 — это число рядов и столбцов, а не клеток.
      - params: {r: 3, c: 2}
        answer: 6
        solution: |
          ### Ответ
          6

          ### Идея
          Число квадратов сетки — произведение числа рядов и числа столбцов.

          ### Шаги
          1. Рядов 3, в каждом по 2.
          2. Считаем по рядам: 2, 4, 6.
          3. 3 · 2 = 6.

          ### Проверка
          По столбцам: 2 столбца по 3, 2 · 3 = 6 — то же число.

          ### Типичная ошибка
          E-num-mult-meaning-one-group: назвать 2 — размер одного ряда, не взяв остальные ряды.
      - params: {r: 2, c: 5}
        answer: 10
        solution: |
          ### Ответ
          10

          ### Идея
          Число квадратов сетки — произведение числа рядов и числа столбцов.

          ### Шаги
          1. Рядов 2, в каждом по 5.
          2. Считаем по рядам: 5, 10.
          3. 2 · 5 = 10.

          ### Проверка
          По столбцам: 5 столбцов по 2, 5 · 2 = 10 — то же число.

          ### Типичная ошибка
          E-num-mult-meaning-add-instead: сложить 2 и 5 вместо умножения.
    hints:
      - Ряды — это равные группы, сетка считается умножением.
      - Число квадратов равно произведению рядов на размер ряда.
      - "Считайте по рядам: {{c}}, затем ещё {{c}} — всего {{r}} раза."
    solution: |
      ### Ответ
      Произведение {{r}} · {{c}}.

      ### Идея
      Каждый ряд — группа; число квадратов равно произведению числа рядов и размера ряда.

      ### Шаги
      1. Определяем число рядов и размер ряда.
      2. Записываем произведение {{r}} · {{c}}.
      3. Считаем по рядам.

      ### Проверка
      Чтение сетки по столбцам даёт то же число квадратов.

      ### Типичная ошибка
      E-num-mult-meaning-add-instead: складывать число рядов и число столбцов.
    feedback:
      correct: Верно, сетка посчитана рядами.
      wrong:
        what: Число квадратов не совпало.
        why: Возможно, стороны сетки сложены, а не умножены.
        fix: Посчитайте квадраты рядами и сравните с ответом.
        next: Разберите раздел T03 о рядах и столбцах.

  # ---------------------------------------------------------------- supported
  - id: P-04
    type: number
    role: supported
    purpose: procedure
    level: 1
    outcome: LO-01
    sections: [T02]
    minutes: 1
    prompt: 'Раскройте произведение {{g}} · {{s}} в сумму равных слагаемых и вычислите его.'
    answer: 10
    variants:
      - params: {g: 5, s: 2}
        answer: 10
        solution: |
          ### Ответ
          10

          ### Идея
          Первый множитель — число слагаемых, второй — размер каждого слагаемого.

          ### Шаги
          1. Пять групп по два — пять слагаемых: 2 + 2 + 2 + 2 + 2.
          2. Группируем парами: (2 + 2) + (2 + 2) + 2 = 4 + 4 + 2.
          3. 4 + 4 = 8, 8 + 2 = 10.

          ### Проверка
          Счёт по группам вслух: 2, 4, 6, 8, 10 — пять групп.

          ### Типичная ошибка
          E-num-mult-meaning-group-off: четыре слагаемых вместо пяти дают 8 — на одну группу меньше.
      - params: {g: 3, s: 4}
        answer: 12
        solution: |
          ### Ответ
          12

          ### Идея
          Первый множитель — число слагаемых, второй — размер каждого слагаемого.

          ### Шаги
          1. Три группы по четыре — три слагаемых: 4 + 4 + 4.
          2. Группируем: (4 + 4) + 4 = 8 + 4.
          3. 8 + 4 = 12.

          ### Проверка
          Счёт по группам: 4, 8, 12 — три группы.

          ### Типичная ошибка
          E-num-mult-meaning-group-off: два слагаемых дают 8 — потеряна третья группа.
      - params: {g: 2, s: 8}
        answer: 16
        solution: |
          ### Ответ
          16

          ### Идея
          Первый множитель — число слагаемых, второй — размер каждого слагаемого.

          ### Шаги
          1. Две группы по восемь — два слагаемых: 8 + 8.
          2. Складываем: 8 + 8 = 16.

          ### Проверка
          Счёт по группам: 8, 16 — две группы.

          ### Типичная ошибка
          E-num-mult-meaning-add-instead: сложить 2 и 8 — это число групп и размер, а не произведение.
    hints:
      - Сколько слагаемых — говорит первый множитель.
      - Каждое слагаемое равно второму множителю.
      - Запишите {{g}} слагаемых по {{s}} и сложите их парами.
    solution: |
      ### Ответ
      Сумма {{g}} слагаемых по {{s}}.

      ### Идея
      Произведение a · b — это сумма a слагаемых, каждое равно b.

      ### Шаги
      1. Записываем {{g}} слагаемых по {{s}}.
      2. Группируем слагаемые парами.
      3. Складываем группы парами.

      ### Проверка
      Число слагаемых должно совпадать с первым множителем.

      ### Типичная ошибка
      E-num-mult-meaning-group-off: одно слагаемое теряется при переходе к сумме.
    feedback:
      correct: Верно, произведение раскрыто суммой и вычислено.
      wrong:
        what: Значение не совпало.
        why: Возможно, слагаемых меньше, чем групп, или слагаемое не равно второму множителю.
        fix: Сверьте число слагаемых с первым множителем.
        next: Разберите цепочку в разделе T02.

  - id: P-05
    type: numbers
    role: supported
    purpose: procedure
    level: 2
    outcome: LO-01
    sections: [T02]
    minutes: 2
    fields:
      - {id: groups, label: множитель-число групп}
      - {id: product, label: произведение}
    prompt: 'В сумме {{k}} одинаковых слагаемых, каждое слагаемое равно {{s}}. Запишите эту сумму произведением: введите число групп и значение произведения.'
    answer: {groups: 2, product: 16}
    variants:
      - params: {k: 2, s: 8}
        answer: {groups: 2, product: 16}
        solution: |
          ### Ответ
          групп 2, произведение 16

          ### Идея
          Сумма равных слагаемых записывается произведением: число слагаемых — первый множитель.

          ### Шаги
          1. Слагаемых 2 — первый множитель 2.
          2. Каждое слагаемое 8 — второй множитель 8: запись 2 · 8.
          3. 8 + 8 = 16.

          ### Проверка
          Произведение 2 · 8 раскрывается в исходную сумму 8 + 8.

          ### Типичная ошибка
          E-num-mult-meaning-add-instead: запись 2 + 8 не является произведением.
      - params: {k: 3, s: 9}
        answer: {groups: 3, product: 27}
        solution: |
          ### Ответ
          групп 3, произведение 27

          ### Идея
          Сумма равных слагаемых записывается произведением: число слагаемых — первый множитель.

          ### Шаги
          1. Слагаемых 3 — первый множитель 3, запись 3 · 9.
          2. Группируем: (9 + 9) + 9 = 18 + 9.
          3. 18 + 9 = 27.

          ### Проверка
          Счёт группами: 9, 18, 27 — три группы.

          ### Типичная ошибка
          E-num-mult-meaning-group-off: два слагаемых дают 18 — на одну группу меньше.
      - params: {k: 4, s: 6}
        answer: {groups: 4, product: 24}
        solution: |
          ### Ответ
          групп 4, произведение 24

          ### Идея
          Сумма равных слагаемых записывается произведением: число слагаемых — первый множитель.

          ### Шаги
          1. Слагаемых 4 — первый множитель 4, запись 4 · 6.
          2. Группируем: (6 + 6) + (6 + 6) = 12 + 12.
          3. 12 + 12 = 24.

          ### Проверка
          Счёт группами: 6, 12, 18, 24 — четыре группы.

          ### Типичная ошибка
          E-num-mult-meaning-add-instead: складывать 4 и 6 вместо суммы слагаемых.
    hints:
      - Число групп в произведении — это число слагаемых в сумме.
      - Второй множитель равен размеру одного слагаемого.
      - "Для значения считайте парами: {{s}} + {{s}}, затем следующие пары — до {{k}} слагаемых."
    solution: |
      ### Ответ
      Произведение {{k}} · {{s}} и его значение.

      ### Идея
      Сумма a равных слагаемых b записывается произведением a · b.

      ### Шаги
      1. Первый множитель — число слагаемых {{k}}.
      2. Второй множитель — размер слагаемого {{s}}.
      3. Значение получаем группировкой слагаемых.

      ### Проверка
      Раскрытие произведения возвращает исходную сумму.

      ### Типичная ошибка
      E-num-mult-meaning-add-instead: суммировать множители вместо слагаемых.
    feedback:
      correct: Верно, сумма записана произведением и вычислена.
      wrong:
        what: Поля не совпали.
        why: Возможно, число групп взято из размера слагаемого.
        fix: Считайте слагаемые в исходной сумме — их число и есть первый множитель.
        next: Разберите пример 2 раздела T02.

  - id: P-06
    type: table-fill
    role: supported
    purpose: procedure
    level: 1
    outcome: LO-01
    sections: [T01, T02]
    minutes: 1
    prompt: 'Заполните пропуски в таблице равных групп: для каждой строки введите произведение.'
    table:
      caption: Равные группы
      columns: [группы, размер группы, всего]
      rows:
        - [2, 7, null]
        - [4, 4, null]
        - [5, 3, null]
    shape: [3, 3]
    answer:
      - {r: 0, c: 2, value: 14}
      - {r: 1, c: 2, value: 16}
      - {r: 2, c: 2, value: 15}
    hints:
      - 'Каждая строка — своя задача о равных группах.'
      - 'Всего = произведение чисел строки: группы — первый множитель.'
      - 'В первой строке считайте двойками до семи слагаемых; в остальных — так же по первому числу строки.'
    solution: |
      ### Ответ
      14, 16, 15

      ### Идея
      Строка таблицы задаёт число групп и размер группы; всего — их произведение.

      ### Шаги
      1. 2 · 7 = 7 + 7 = 14.
      2. 4 · 4 = 4 + 4 + 4 + 4 = 16.
      3. 5 · 3 = 3 + 3 + 3 + 3 + 3 = 15.

      ### Проверка
      Каждое значение не меньше размера группы из своей строки: 14 ≥ 7, 16 ≥ 4, 15 ≥ 3.

      ### Типичная ошибка
      E-num-mult-meaning-add-instead: для первой строки 2 + 7 = 9 вместо 2 · 7 = 14.
    feedback:
      correct: Верно, все строки таблицы посчитаны умножением.
      wrong:
        what: Значения не совпали.
        why: Возможно, в какой-то строке числа сложены вместо умножения.
        fix: Проверьте каждую строку отдельно, считая по размеру группы.
        next: Разберите пример 1 раздела T01.
  - id: P-07
    type: number
    role: supported
    purpose: procedure
    level: 1
    outcome: LO-02
    sections: [T03]
    minutes: 1
    prompt: 'Витрина в зале выложена плиткой: {{r|pl:ряд,ряда,рядов}} по {{c|pl:плитка,плитки,плиток}} в ряду. Сколько плиток в витрине?'
    answer: 24
    variants:
      - params: {r: 4, c: 6}
        answer: 24
        solution: |
          ### Ответ
          24

