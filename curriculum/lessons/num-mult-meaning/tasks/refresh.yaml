# Повторение (STANDARD.md §9): 5 задач по 3 минуты, одна на каждую теоретическую опору темы.
# По 3 варианта на задачу с общими текстами {{param}}.
tasks:
  - id: R-01
    type: number
    role: refresh
    purpose: procedure
    level: 1
    outcome: LO-01
    sections: [T01, T02]
    minutes: 3
    prompt: 'В доставке {{g|pl:корзина,корзины,корзин}} по {{s|pl:булочка,булочки,булочек}}. Запишите количество произведением и вычислите его. Ответ дайте числом.'
    answer: 40
    variants:
      - params: {g: 5, s: 8}
        answer: 40
        solution: |
          ### Ответ
          40

          ### Идея
          Пять корзин по восемь — произведение 5 · 8.

          ### Шаги
          1. Запись: 5 · 8.
          2. Считаем парами: (8 + 8) + (8 + 8) + 8 = 16 + 16 + 8.
          3. 16 + 16 = 32, 32 + 8 = 40.

          ### Проверка
          Счёт корзинами: 8, 16, 24, 32, 40 — пять групп.

          ### Типичная ошибка
          E-num-mult-meaning-add-instead: 5 + 8 = 13 — число корзин и булочек, а не всего булочек.
      - params: {g: 6, s: 4}
        answer: 24
        solution: |
          ### Ответ
          24

          ### Идея
          Шесть корзин по четыре — произведение 6 · 4.

          ### Шаги
          1. Запись: 6 · 4.
          2. Считаем тройками: (4 + 4 + 4) + (4 + 4 + 4) = 12 + 12.
          3. 12 + 12 = 24.

          ### Проверка
          Счёт корзинами: 4, 8, 12, 16, 20, 24 — шесть групп.

          ### Типичная ошибка
          E-num-mult-meaning-add-instead: 6 + 4 = 10 — число корзин и булочек, а не всего булочек.
      - params: {g: 4, s: 7}
        answer: 28
        solution: |
          ### Ответ
          28

          ### Идея
          Четыре корзины по семь — произведение 4 · 7.

          ### Шаги
          1. Запись: 4 · 7.
          2. Считаем парами: (7 + 7) + (7 + 7) = 14 + 14.
          3. 14 + 14 = 28.

          ### Проверка
          Счёт корзинами: 7, 14, 21, 28 — четыре группы.

          ### Типичная ошибка
          E-num-mult-meaning-add-instead: 4 + 7 = 11 — число корзин и булочек, а не всего булочек.
    hints:
      - Равные корзины записываются произведением.
      - Первый множитель — корзины, второй — булочки в корзине.
      - 'Считайте {{g}} · {{s}}, группируя слагаемые по два.'
    solution: |
      ### Ответ
      {{g}} · {{s}}.

      ### Идея
      Равные корзины считаются произведением.

      ### Шаги
      1. Записываем {{g}} · {{s}}.
      2. Раскрываем в сумму равных слагаемых.
      3. Вычисляем группами.

      ### Проверка
      Число групп при счёте совпадает с первым множителем.

      ### Типичная ошибка
      E-num-mult-meaning-add-instead: сумма множителей вместо пересчёта групп.
    feedback:
      correct: Верно, произведение записано и вычислено.
      wrong:
        what: Значение не совпало.
        why: Возможно, множители сложены или потеряна корзина.
        fix: Пересчитайте корзины по порядку.
        next: Повторите раздел T02.

  - id: R-02
    type: number
    role: refresh
    purpose: procedure
    level: 1
    outcome: LO-01
    sections: [T02]
    minutes: 3
    prompt: 'Сумма состоит из {{n}} одинаковых слагаемых, каждое равно {{s}}. Запишите её произведением и вычислите. Ответ дайте числом.'
    answer: 24
    variants:
      - params: {n: 4, s: 6}
        answer: 24
        solution: |
          ### Ответ
          24

          ### Идея
          Четыре шестёрки — произведение 4 · 6.

          ### Шаги
          1. Слагаемых 4 — первый множитель 4.
          2. Запись: 4 · 6.
          3. (6 + 6) + (6 + 6) = 12 + 12 = 24.

          ### Проверка
          Раскрытие 4 · 6 возвращает исходную сумму.

          ### Типичная ошибка
          E-num-mult-meaning-group-off: 3 · 6 = 18 — на одну группу меньше.
      - params: {n: 5, s: 3}
        answer: 15
        solution: |
          ### Ответ
          15

          ### Идея
          Пять троек — произведение 5 · 3.

          ### Шаги
          1. Слагаемых 5 — первый множитель 5.
          2. Запись: 5 · 3.
          3. (3 + 3) + (3 + 3) + 3 = 6 + 6 + 3 = 15.

          ### Проверка
          Счёт слагаемыми: 3, 6, 9, 12, 15 — пять групп.

          ### Типичная ошибка
          E-num-mult-meaning-group-off: 4 · 3 = 12 — на одну группу меньше.
      - params: {n: 3, s: 9}
        answer: 27
        solution: |
          ### Ответ
          27

          ### Идея
          Три девятки — произведение 3 · 9.

          ### Шаги
          1. Слагаемых 3 — первый множитель 3.
          2. Запись: 3 · 9.
          3. (9 + 9) + 9 = 18 + 9 = 27.

          ### Проверка
          Счёт слагаемыми: 9, 18, 27 — три группы.

          ### Типичная ошибка
          E-num-mult-meaning-group-off: 2 · 9 = 18 — на одну группу меньше.
    hints:
      - Число слагаемых — первый множитель.
      - Каждое слагаемое — второй множитель.
      - 'Считайте {{n}} · {{s}}, группируя слагаемые по два.'
    solution: |
      ### Ответ
      {{n}} · {{s}}.

      ### Идея
      Сумма равных слагаемых сворачивается в произведение.

      ### Шаги
      1. Число слагаемых — первый множитель.
      2. Слагаемое — второй множитель.
      3. Записываем {{n}} · {{s}} и вычисляем.

      ### Проверка
      Раскрытие произведения возвращает исходную сумму.

      ### Типичная ошибка
      E-num-mult-meaning-group-off: потеряно одно слагаемое — на одну группу меньше.
    feedback:
      correct: Верно, сумма свёрнута в произведение.
      wrong:
        what: Значение не совпало.
        why: Возможно, потеряно слагаемое или множители перепутаны.
        fix: Сосчитайте число слагаемых заново.
        next: Повторите раздел T02.

  - id: R-03
    type: number
    role: refresh
    purpose: procedure
    level: 1
    outcome: LO-02
    sections: [T03]
    minutes: 3
    prompt: 'Прямоугольник из квадратов: {{r|pl:ряд,ряда,рядов}} по {{c|pl:квадрат,квадрата,квадратов}}. Сколько квадратов в прямоугольнике? Проверьте чтением по столбцам.'
    answer: 27
    variants:
      - params: {r: 3, c: 9}
        answer: 27
        solution: |
          ### Ответ
          27

          ### Идея
          Число квадратов — произведение рядов и столбцов.

          ### Шаги
          1. По рядам: 9, 18, 27.
          2. Запись: 3 · 9 = 27.

          ### Проверка
          По столбцам: 9 столбцов по 3, 9 · 3 = 27 — то же число.

          ### Типичная ошибка
          E-num-mult-meaning-add-instead: 3 + 9 = 12 — стороны, а не квадраты.
      - params: {r: 4, c: 6}
        answer: 24
        solution: |
          ### Ответ
          24

          ### Идея
          Число квадратов — произведение рядов и столбцов.

          ### Шаги
          1. По рядам: 6, 12, 18, 24.
          2. Запись: 4 · 6 = 24.

          ### Проверка
          По столбцам: 6 столбцов по 4, 6 · 4 = 24 — то же число.

          ### Типичная ошибка
          E-num-mult-meaning-add-instead: 4 + 6 = 10 — стороны, а не квадраты.
      - params: {r: 2, c: 8}
        answer: 16
        solution: |
          ### Ответ
          16

          ### Идея
          Число квадратов — произведение рядов и столбцов.

          ### Шаги
          1. По рядам: 8, 16.
          2. Запись: 2 · 8 = 16.

          ### Проверка
          По столбцам: 8 столбцов по 2, 8 · 2 = 16 — то же число.

          ### Типичная ошибка
          E-num-mult-meaning-add-instead: 2 + 8 = 10 — стороны, а не квадраты.
    hints:
      - Число квадратов — произведение рядов и столбцов.
      - 'Считайте по рядам, прибавляя по {{c}} за шаг.'
      - 'Проверьте чтением по столбцам: {{c}} · {{r}} — то же значение.'
    solution: |
      ### Ответ
      {{r}} · {{c}}.

      ### Идея
      Прямоугольная расстановка считается умножением.

      ### Шаги
      1. Записываем {{r}} · {{c}}.
      2. Считаем по рядам.

      ### Проверка
      Чтение по столбцам даёт то же число.

      ### Типичная ошибка
      E-num-mult-meaning-add-instead: сумма сторон вместо числа клеток.
    feedback:
      correct: Верно, прямоугольник посчитан двумя способами.
      wrong:
        what: Число квадратов не совпало.
        why: Возможно, стороны сложены или потерян ряд.
        fix: Считайте по рядам и проверьте по столбцам.
        next: Повторите раздел T03.

  - id: R-04
    type: numbers
    role: refresh
    purpose: procedure
    level: 1
    outcome: LO-01
    sections: [T04]
    minutes: 3
    prompt: 'Вычислите {{a}} · 0 и {{a}} · 1 и введите оба значения: первое — для нулевого множителя, второе — для единичного.'
    fields:
      - {id: zero, label: 'значение при нулевом множителе'}
      - {id: one, label: 'значение при единичном множителе'}
    answer: {zero: 0, one: 6}
    variants:
      - params: {a: 6}
        answer: {zero: 0, one: 6}
        solution: |
          ### Ответ
          0 и 6

          ### Идея
          Нулевой множитель даёт нуль, единица сохраняет число.

          ### Шаги
          1. {{a}} · 0 — шесть пустых групп: 0.
          2. {{a}} · 1 — шесть групп по одному: 1 + 1 + 1 + 1 + 1 + 1 = 6.

          ### Проверка
          Оба значения следуют из пересчёта групп, а не из отдельного правила наизусть.

          ### Типичная ошибка
          E-num-mult-meaning-zero-as-empty: {{a}} · 0 = 6 — перенос прибавления нуля.
      - params: {a: 9}
        answer: {zero: 0, one: 9}
        solution: |
          ### Ответ
          0 и 9

          ### Идея
          Нулевой множитель даёт нуль, единица сохраняет число.

          ### Шаги
          1. {{a}} · 0 — девять пустых групп: 0.
          2. {{a}} · 1 — девять групп по одному: сумма девяти единиц равна 9.

          ### Проверка
          Оба значения следуют из пересчёта групп, а не из отдельного правила наизусть.

          ### Типичная ошибка
          E-num-mult-meaning-zero-as-empty: {{a}} · 0 = 9 — перенос прибавления нуля.
      - params: {a: 12}
        answer: {zero: 0, one: 12}
        solution: |
          ### Ответ
          0 и 12

          ### Идея
          Нулевой множитель даёт нуль, единица сохраняет число.

          ### Шаги
          1. {{a}} · 0 — двенадцать пустых групп: 0.
          2. {{a}} · 1 — двенадцать групп по одному: сумма двенадцати единиц равна 12.

          ### Проверка
          Оба значения следуют из пересчёта групп, а не из отдельного правила наизусть.

          ### Типичная ошибка
          E-num-mult-meaning-zero-as-empty: {{a}} · 0 = 12 — перенос прибавления нуля.
    hints:
      - 'Нулевой множитель — это {{a}} пустых групп.'
      - 'Единичный множитель — {{a}} групп по одному предмету.'
      - 'Считайте {{a}} · 1 как сумму единиц, а {{a}} · 0 — как сумму нулей.'
    solution: |
      ### Ответ
      Значения обоих произведений.

      ### Идея
      Нулевой множитель даёт нуль, единица сохраняет число.

      ### Шаги
      1. {{a}} · 0 — сумма нулей: 0.
      2. {{a}} · 1 — сумма единиц: {{a}}.

      ### Проверка
      Оба значения следуют из пересчёта групп.

      ### Типичная ошибка
      E-num-mult-meaning-zero-as-empty: нулевой множитель не сохраняет второй множитель.
    feedback:
      correct: Верно, крайние случаи умножения применены правильно.
      wrong:
        what: Одно из значений не совпало.
        why: Возможно, нулевой множитель не обнулил произведение.
        fix: Пересчитайте группы с пустыми и единичными группами.
        next: Повторите раздел T04.

  - id: R-05
    type: number
    role: refresh
    purpose: method
    level: 2
    outcome: LO-03
    sections: [T05]
    minutes: 3
    prompt: 'В накладной спор: {{g|pl:коробка,коробки,коробок}} по {{s|pl:чашка,чашки,чашек}} — второй пекарь записал значение на одну коробку меньше. Введите верное значение.'
    answer: 36
    variants:
      - params: {g: 4, s: 9}
        answer: 36
        solution: |
          ### Ответ
          36

          ### Идея
          Спор решается пересчётом группами; прикидка здесь оба ответа пропускает.

          ### Шаги
          1. Запись: 4 · 9.
          2. (9 + 9) + (9 + 9) = 18 + 18.
          3. 18 + 18 = 36.

          ### Проверка
          Значение 27 — три коробки: 3 · 9 = 27 — потеряна одна коробка.

          ### Типичная ошибка
          E-num-mult-meaning-group-off: спорный ответ ровно на одну группу меньше верного.
      - params: {g: 6, s: 3}
        answer: 18
        solution: |
          ### Ответ
          18

          ### Идея
          Спор решается пересчётом группами; прикидка здесь оба ответа пропускает.

          ### Шаги
          1. Запись: 6 · 3.
          2. (3 + 3) + (3 + 3) + (3 + 3) = 6 + 6 + 6.
          3. 6 + 6 + 6 = 18.

          ### Проверка
          Значение 15 — пять коробок: 5 · 3 = 15 — потеряна одна коробка.

          ### Типичная ошибка
          E-num-mult-meaning-group-off: спорный ответ ровно на одну группу меньше верного.
      - params: {g: 7, s: 5}
        answer: 35
        solution: |
          ### Ответ
          35

          ### Идея
          Спор решается пересчётом группами; прикидка здесь оба ответа пропускает.

          ### Шаги
          1. Запись: 7 · 5.
          2. (5 + 5) + (5 + 5) + (5 + 5) + 5 = 10 + 10 + 10 + 5.
          3. 10 + 10 = 20, 20 + 10 = 30, 30 + 5 = 35.

          ### Проверка
          Значение 30 — шесть коробок: 6 · 5 = 30 — потеряна одна коробка.

          ### Типичная ошибка
          E-num-mult-meaning-group-off: спорный ответ ровно на одну группу меньше верного.
    hints:
      - Верную запись даёт пересчёт всех групп.
      - 'Запишите {{g}} · {{s}} и раскройте в сумму.'
      - 'Считайте группами по {{s}}, пока коробки не кончатся.'
    solution: |
      ### Ответ
      {{g}} · {{s}}.

      ### Идея
      Спор решается пересчётом группами.

      ### Шаги
      1. Записываем {{g}} · {{s}}.
      2. Раскрываем в сумму равных слагаемых.
      3. Вычисляем и сравниваем со спорными значениями.

      ### Проверка
      Спорное значение меньше верного ровно на одну группу.

      ### Типичная ошибка
      E-num-mult-meaning-group-off: потеряна одна группа при счёте.
    feedback:
      correct: Верно, спор решён пересчётом групп.
      wrong:
        what: Значение не совпало.
        why: Возможно, при счёте потеряна коробка.
        fix: Пересчитайте группы по порядку.
        next: Повторите раздел T05.
