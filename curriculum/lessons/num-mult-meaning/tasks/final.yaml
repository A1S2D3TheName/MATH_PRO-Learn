    sections: [T04]
    minutes: 1
    depends_on: []
    prompt: 'На складе {{k|pl:полка,полки,полок}}, и все они пустые — по 0 коробок; ещё {{f|pl:полка,полки,полок}}, на каждой по 1 коробке. Сколько коробок на складе?'
    answer: 2
    variants:

      - params: {g: 7, s: 4, r: 3, c: 5, k: 5, f: 2, n: 2, m: 6}
        answer: 2
        solution: |
          ### Ответ
          2

          ### Идея
          Пустые полки дают нулевое произведение, полки по коробке — своё число.

          ### Шаги
          1. Пустые полки: 5 · 0 = 0.
          2. Полки по коробке: 2 · 1 = 2.
          3. 0 + 2 = 2 коробок.

          ### Проверка
          Ненулевой вклад дают только полки с коробками.

          ### Типичная ошибка
          E-num-mult-meaning-zero-as-empty: названо 5 — число пустых полок, а нулевой множитель даёт 0.

      - params: {g: 6, s: 5, r: 2, c: 7, k: 4, f: 3, n: 3, m: 5}
