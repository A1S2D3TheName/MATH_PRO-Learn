# Финальная цепочка (STANDARD.md §8): утро пекарни при кафе «Перрон», 5 шагов с общими
# параметрами; последний шаг собирает итоги предыдущих. По 6 вариантов на шаг; параметры
# вариантов цепочки общие для всех шагов.
title: Утро пекарни
context_id: bakery-morning-opening
scenario: >
  Утро пекарни при кафе «Перрон»: пекарь выгружает лотки с булочками, витрина собирается
  из корзинок, на складе встречаются пустые полки, а к открытию подходят партии пирожных.
  Все числа утра находятся умножением равных групп.
tasks:

  - id: F-01
    type: number
    role: final-step
    purpose: procedure
    level: 1
    outcome: LO-01
    sections: [T01]
    minutes: 1
    depends_on: []
    prompt: 'Пекарь разгружает {{g|pl:лоток,лотка,лотков}} по {{s|pl:булочка,булочки,булочек}}. Сколько булочек привезли? Ответ дайте числом.'
    answer: 28
    variants:

      - params: {g: 7, s: 4, r: 3, c: 5, k: 5, f: 2, n: 2, m: 6}
        answer: 28
        solution: |
          ### Ответ
          28

          ### Идея
          Семь групп по четыре — произведение 7 · 4.

          ### Шаги
          1. Групп 7, размер группы 4: запись 7 · 4.
          2. Считаем парами: (4 + 4) + (4 + 4) + (4 + 4) + 4 = 8 + 8 + 8 + 4.
          3. 8 + 8 = 16, 16 + 8 = 24, 24 + 4 = 28 булочек.

          ### Проверка
          Счёт лотками: 4, 8, 12, 16, 20, 24, 28 — семь групп.

          ### Типичная ошибка
          E-num-mult-meaning-add-instead: 7 + 4 = 11 — это лотки и булочки, а не булочки всего.

      - params: {g: 6, s: 5, r: 2, c: 7, k: 4, f: 3, n: 3, m: 5}
        answer: 30
        solution: |
          ### Ответ
          30

          ### Идея
          Шесть групп по пять — произведение 6 · 5.

          ### Шаги
          1. Групп 6, размер группы 5: запись 6 · 5.
          2. Считаем парами: (5 + 5) + (5 + 5) + (5 + 5) = 10 + 10 + 10.
          3. 10 + 10 = 20, 20 + 10 = 30 булочек.

          ### Проверка
          Счёт лотками: 5, 10, 15, 20, 25, 30 — шесть групп.

          ### Типичная ошибка
          E-num-mult-meaning-add-instead: 6 + 5 = 11 — это лотки и булочки, а не булочки всего.

      - params: {g: 8, s: 3, r: 4, c: 4, k: 6, f: 2, n: 2, m: 7}
        answer: 24
        solution: |
          ### Ответ
          24

          ### Идея
          Восемь групп по три — произведение 8 · 3.

          ### Шаги
          1. Групп 8, размер группы 3: запись 8 · 3.
          2. Считаем парами: (3 + 3) + (3 + 3) + (3 + 3) + (3 + 3) = 6 + 6 + 6 + 6.
          3. 6 + 6 = 12, 12 + 6 = 18, 18 + 6 = 24 булочек.

          ### Проверка
          Счёт лотками: 3, 6, 9, 12, 15, 18, 21, 24 — восемь групп.

          ### Типичная ошибка
          E-num-mult-meaning-add-instead: 8 + 3 = 11 — это лотки и булочки, а не булочки всего.

      - params: {g: 5, s: 7, r: 3, c: 6, k: 3, f: 4, n: 4, m: 2}
        answer: 35
        solution: |
          ### Ответ
          35

          ### Идея
          Пять групп по семь — произведение 5 · 7.

          ### Шаги
          1. Групп 5, размер группы 7: запись 5 · 7.
          2. Считаем парами: (7 + 7) + (7 + 7) + 7 = 14 + 14 + 7.
          3. 14 + 14 = 28, 28 + 7 = 35 булочек.

          ### Проверка
          Счёт лотками: 7, 14, 21, 28, 35 — пять групп.

          ### Типичная ошибка
          E-num-mult-meaning-add-instead: 5 + 7 = 12 — это лотки и булочки, а не булочки всего.

      - params: {g: 4, s: 8, r: 5, c: 2, k: 2, f: 5, n: 2, m: 9}
        answer: 32
        solution: |
          ### Ответ
          32

          ### Идея
          Четыре групп по восемь — произведение 4 · 8.

          ### Шаги
          1. Групп 4, размер группы 8: запись 4 · 8.
          2. Считаем парами: (8 + 8) + (8 + 8) = 16 + 16.
          3. 16 + 16 = 32 булочек.

          ### Проверка
          Счёт лотками: 8, 16, 24, 32 — четыре группы.

          ### Типичная ошибка
          E-num-mult-meaning-add-instead: 4 + 8 = 12 — это лотки и булочки, а не булочки всего.

      - params: {g: 9, s: 2, r: 2, c: 6, k: 7, f: 1, n: 3, m: 4}
        answer: 18
        solution: |
          ### Ответ
          18

          ### Идея
          Девять групп по два — произведение 9 · 2.

          ### Шаги
          1. Групп 9, размер группы 2: запись 9 · 2.
          2. Считаем парами: (2 + 2) + (2 + 2) + (2 + 2) + (2 + 2) + 2 = 4 + 4 + 4 + 4 + 2.
          3. 4 + 4 = 8, 8 + 4 = 12, 12 + 4 = 16, 16 + 2 = 18 булочек.

          ### Проверка
          Счёт лотками: 2, 4, 6, 8, 10, 12, 14, 16, 18 — девять групп.

          ### Типичная ошибка
          E-num-mult-meaning-add-instead: 9 + 2 = 11 — это лотки и булочки, а не булочки всего.

    hints:
      - Лотки — равные группы; количество записывается произведением.
      - Первый множитель — лотки, второй — булочки в лотке.
      - "Считайте {{g}} · {{s}}, группируя слагаемые по два."
    solution: |
      ### Ответ
      Произведение {{g}} · {{s}}.

      ### Идея
      Равные группы считаются произведением.

      ### Шаги
      1. Записываем {{g}} · {{s}}.
      2. Раскрываем в сумму равных слагаемых.
      3. Вычисляем группами.

      ### Проверка
      Число групп при счёте совпадает с первым множителем.

      ### Типичная ошибка
      E-num-mult-meaning-add-instead: сумма множителей вместо пересчёта групп.

    feedback:
      correct: Верно, булочки посчитаны группами.
      wrong:
        what: Число булочек не совпало.
        why: Возможно, потерян лоток или множители сложены.
        fix: Пересчитайте лотки по порядку.
        next: Перейдите к следующему шагу цепочки.

