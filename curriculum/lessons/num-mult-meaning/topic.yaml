outcomes:
  - id: LO-01
    short: Записывает и вычисляет произведение
    action: представляет ситуации с равными группами записью произведения, называет множители и произведение и вычисляет произведение повторным сложением
    conditions: число групп и размер группы — целые числа от 0 до 10, произведение не больше 100; без калькулятора
    criterion: верно записывает произведение по описанию групп, называет оба множителя и значение, включая случаи a · 0, 0 · a, a · 1 и 1 · a
    level: core
    sections:
      - T01
      - T02
      - T04
  - id: LO-02
    short: Считает квадраты прямоугольника
    action: находит число единичных квадратов в прямоугольнике произведением числа рядов и числа столбцов и по записи произведения называет ряды и столбцы
    conditions: стороны прямоугольника — целые числа единичных квадратов от 1 до 10; подсчёт квадратами, без формулы площади
    criterion: верно называет число квадратов и восстанавливает по записи произведения, сколько рядов и сколько столбцов в прямоугольнике
    level: standard
    sections: [T03]
  - id: LO-03
    short: Проверяет и подбирает множители
    action: проверяет произведения прикидкой и пересчётом, отличает равные группы от неравных и находит пропущенный множитель систематическим перебором
    conditions: целые числа от 0 до 10; небольшие конечные наборы групп и записей
    criterion: подтверждает или отвергает запись проверкой, перечисляет кандидатов без пропусков и повторов и называет причину, по которой произведение посчитано неверно
    level: deep
    sections:
      - T02
      - T03
      - T04
      - T05

