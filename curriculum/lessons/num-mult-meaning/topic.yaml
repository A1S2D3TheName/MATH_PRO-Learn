# tree.yaml дословно (правило 6). Поле scope в дереве у темы отсутствует — потому и здесь его нет.
id: num-mult-meaning
title: "Умножение как сумма равных групп"
section: num
stage: 1
hours: 3
grade: "2"
prerequisites: [num-add-properties]
version: "1.0.0"
summary: >
  Умножение — короткая запись для суммы равных групп: 4 · 7 — это четыре группы
  по семь предметов. Тема вводит множители и произведение, связывает произведение
  с прямоугольником из единичных квадратов и разбирает случаи умножения на нуль
  и на единицу.

search:
  synonyms:
    - что такое умножение
    - умножение для начинающих
    - множитель
    - произведение чисел
    - умножение как повторное сложение
    - сумма равных слагаемых
    - группы поровну
    - число умножить на число
    - умножение на ноль
    - умножение на единицу
    - сколько клеток в прямоугольнике
    - знак умножения
  questions:
    - Что значит умножить одно число на другое?
    - Как называются числа при умножении?
    - Почему умножение — это повторное сложение?
    - Когда сумму равных слагаемых можно записать произведением?
    - Что показывает первый множитель и что второй?
    - Сколько квадратов в прямоугольнике из рядов и столбцов?
    - Чему равно число, умноженное на ноль?
    - Что происходит с числом при умножении на единицу?
    - Почему умножение применимо только к равным группам?
    - Как проверить, что произведение посчитано верно?

