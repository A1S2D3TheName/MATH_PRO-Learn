  - id: num-mult-table/tablichnye-sluchai-umnozheniya
    title: "Табличные случаи умножения"
    tree_ref: "Табличные случаи умножения"
    synonyms: [клетка таблицы, произведение однозначных множителей, факты умножения до 10]
    sections: [T01]
  - id: num-mult-table/semeystvo-faktov-iz-odnogo
    title: "Семейство фактов из одного произведения"
    tree_ref: "Семейство фактов из одного произведения"
    synonyms: [четыре связанных записи, факты из одного прямоугольника, связанные равенства]
    sections: [T02]
  - id: num-mult-table/nahozhdenie-neizvestnogo-mnozhitelya
    title: "Нахождение неизвестного множителя"
    tree_ref: "Нахождение неизвестного множителя"
    synonyms: [недостающий множитель, пропуск в равенстве, множитель по произведению]
    sections: [T03]
  - id: num-mult-table/avtomatizm-i-samoproverka
    title: "Автоматизм и самопроверка"
    tree_ref: "Автоматизм и самопроверка"
