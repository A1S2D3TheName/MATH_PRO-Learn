outcomes:
  - id: LO-01
    short: Считает табличный случай
    action: вычисляет табличное произведение множителей от 0 до 10 по таблице, счётом равных групп или проверкой
    conditions: оба множителя — целые числа от 0 до 10 включительно; без калькулятора
    criterion: верно записывает произведение и указывает, какой опорой пользовался — клеткой, счётом групп или проверкой
    level: core
    sections: [T01, T04, T05, T06]
  - id: LO-02
    short: Собирает семейство и множитель
    action: по одному табличному произведению записывает семейство связанных фактов и находит недостающий множитель делением
    conditions: множители от 0 до 10, произведение не больше 100; деление без остатка
    criterion: верно перечисляет связанные записи и находит недостающий множитель, проверяя его умножением
    level: standard
    sections: [T02, T03]

errors:
