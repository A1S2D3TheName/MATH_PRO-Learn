id: num-mult-table
title: "Таблица умножения и связанные факты деления"
section: num
stage: 1
hours: 4
grade: "2–3"
prerequisites: [num-div-meaning]
version: "1.0.0"
summary: >-
  Таблица умножения собирает табличные случаи — произведения множителей от 0 до 10.
  Из одного произведения читают семейство связанных фактов умножения и деления
  и находят недостающий множитель проверкой обратным действием.

search:
  synonyms:
    - таблица умножения
    - табличные случаи
    - табличное умножение
    - выучить таблицу умножения
    - факты умножения
    - связанные факты деления
    - семейство фактов умножения
    - найти неизвестный множитель
    - недостающий множитель
    - сколько будет 7 умножить на 8
    - умножение до десяти
    - деление по таблице умножения
  questions:
    - Как пользоваться таблицей умножения?
    - Что такое табличный случай умножения?
    - Как из одного произведения получить факты деления?
    - Как найти недостающий множитель?
    - Чему равно число умножить на нуль?
    - Чему равно число умножить на единицу?
    - Как проверить табличный факт делением?
    - Почему 3 умножить на 4 и 4 умножить на 3 дают одно произведение?
    - Как не перепутать соседние факты таблицы?

