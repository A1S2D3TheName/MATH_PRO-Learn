# Повторение, по 3 варианта (STANDARD.md §8).
tasks:
- id: R-01
  type: number
  role: refresh
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T01
  minutes: 2
  prompt: "Вычислите ${{a}} \\cdot {{b}}$."
  answer: 12
  hints:
  - "Табличный случай: равные группы."
  - "Число групп равно {{a}}, в группе по {{b}}."
  - "Начните со второго множителя и повторите его столько раз, сколько показывает первый."
  solution: |
    ### Ответ
    12

    ### Идея
    3 равных групп по 4 дают 12.

    ### Шаги
    1. Табличный случай 3 · 4.
    2. Счёт группами по 4 приводит к последнему числу 12.
    3. Запись: 3 · 4 = 12.

    ### Проверка
    12 : 3 = 4.

    ### Типичная ошибка
    E-num-mult-table-add: заменить умножение сложением 3 + 4 = 7.
  feedback:
    correct: Верно извлечён табличный факт при повторении.
    wrong:
      what: Произведение не совпало.
      why: Сложение множителей или сбой счёта.
      fix: Пересчитайте группы.
      next: Карточка раздела T01.
  variants:
