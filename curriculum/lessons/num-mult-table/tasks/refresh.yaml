- id: R-03
  type: number
  role: refresh
  purpose: procedure
  level: 2
  outcome: LO-02
  sections:
  - T02
  minutes: 2
  prompt: "Известно ${{a}} \\cdot {{b}} = {{p}}$. Чему равно ${{p}} : {{a}}$?"
  answer: 8
  hints:
  - Частное семейства возвращает второй множитель.
  - "Разделите произведение на известный множитель {{a}}."
  - "Проверьте умножением частного на {{a}}."
  solution: |
    ### Ответ
    8

    ### Идея
    Деление ищет множитель: какое число с 5 даёт 40.

    ### Шаги
    1. Ищем 40 в строке 5.
    2. Клетка стоит под 8, потому что 5 · 8 = 40.
    3. 40 : 5 = 8.

    ### Проверка
    5 · 8 = 40.

    ### Типичная ошибка
    E-num-mult-table-div-sub: 40 − 5 = 35.
  feedback:
    correct: "Верно: из ${{a}} \\cdot {{b}} = {{p}}$ следует ${{p}} : {{a}} = {{b}}$."
    wrong:
      what: Частное не равно второму множителю.
      why: Вычитание вместо деления.
      fix: Верните второй множитель.
      next: Карточка раздела T02.
  variants:
  - params:
      a: 5
      b: 8
      p: 40
    answer: 8
    solution: |
      ### Ответ
      8

      ### Идея
      Деление ищет множитель: какое число с 5 даёт 40.

      ### Шаги
      1. Ищем 40 в строке 5.
      2. Клетка стоит под 8, потому что 5 · 8 = 40.
      3. 40 : 5 = 8.

      ### Проверка
      5 · 8 = 40.

      ### Типичная ошибка
      E-num-mult-table-div-sub: 40 − 5 = 35.
  - params:
      a: 7
      b: 6
      p: 42
    answer: 6
    solution: |
      ### Ответ
      6

      ### Идея
      Деление ищет множитель: какое число с 7 даёт 42.

