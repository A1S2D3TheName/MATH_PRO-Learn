      2. Счёт группами по 4 приводит к последнему числу 12.
      3. Запись: 3 · 4 = 12.

      ### Проверка
      12 : 3 = 4.

      ### Типичная ошибка
      E-num-mult-table-add: заменить умножение сложением 3 + 4 = 7.
  - params:
