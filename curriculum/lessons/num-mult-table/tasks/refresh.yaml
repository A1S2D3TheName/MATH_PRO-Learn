- id: R-04
  type: number
  role: refresh
  purpose: procedure
  level: 2
  outcome: LO-02
  sections:
  - T03
  minutes: 2
  prompt: "Найдите число, для которого ${{a}} \\cdot \\square = {{p}}$."
  answer: 9
  hints:
  - Пропуск — частное.
  - "Разделите {{p}} на {{a}}."
  - "Проверьте умножением на {{a}}."
  solution: |
    ### Ответ
    9

    ### Идея
    Пропуск в 3 · □ = 27 — это частное 27 : 3.

    ### Шаги
    1. Записываем 3 · □ = 27.
    2. □ = 27 : 3.
    3. 3 · 9 = 27, значит пропуск 9.

    ### Проверка
    3 · 9 = 27.

    ### Типичная ошибка
    E-num-mult-table-missing-sub: вычесть 27 − 3 = 24 вместо частного.
  feedback:
    correct: Верно закрыт пропуск делением.
    wrong:
      what: Пропуск неверен.
      why: Вычитание p − a.
      fix: "Делите, затем умножайте для проверки."
      next: Карточка раздела T03.
    misconceptions:
    - id: E-num-mult-table-missing-sub
      when:
        expr: p - a
      message: Вычтено из произведения.
  errors:
  - E-num-mult-table-missing-sub
  variants:
  - params:
      a: 3
      p: 27
    answer: 9
    solution: |
      ### Ответ
      9

      ### Идея
      Пропуск в 3 · □ = 27 — это частное 27 : 3.

      ### Шаги
      1. Записываем 3 · □ = 27.
      2. □ = 27 : 3.
      3. 3 · 9 = 27, значит пропуск 9.

      ### Проверка
      3 · 9 = 27.

      ### Типичная ошибка
      E-num-mult-table-missing-sub: вычесть 27 − 3 = 24 вместо частного.
  - params:
      a: 8
      p: 24
    answer: 3
    solution: |
      ### Ответ
      3

      ### Идея
      Пропуск в 8 · □ = 24 — это частное 24 : 8.

      ### Шаги
      1. Записываем 8 · □ = 24.
      2. □ = 24 : 8.
      3. 8 · 3 = 24, значит пропуск 3.

      ### Проверка
      8 · 3 = 24.

      ### Типичная ошибка
      E-num-mult-table-missing-sub: вычесть 24 − 8 = 16 вместо частного.
  - params:
      a: 9
      p: 36
    answer: 4
    solution: |
      ### Ответ
      4

      ### Идея
      Пропуск в 9 · □ = 36 — это частное 36 : 9.

      ### Шаги
      1. Записываем 9 · □ = 36.
      2. □ = 36 : 9.
      3. 9 · 4 = 36, значит пропуск 4.

      ### Проверка
      9 · 4 = 36.

      ### Типичная ошибка
      E-num-mult-table-missing-sub: вычесть 36 − 9 = 27 вместо частного.
