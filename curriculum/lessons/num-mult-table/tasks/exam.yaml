    prompt: Вычислите $3 \cdot 3$.
    answer: 9
    hints:
    - Оба множителя равны 3.
    - Три тройки.
    - Сложите 3 + 3 + 3.
    solution: |
      ### Ответ
      9

      ### Идея
      3 групп по 3 дают 9.

      ### Шаги
      1. Табличный случай 3 · 3.
      2. Счёт группами заканчивается на 9.
      3. 3 · 3 = 9.

      ### Проверка
      9 : 3 = 3.

      ### Типичная ошибка
      E-num-mult-table-add: 3 + 3 = 6.
    feedback:
      correct: "Верно: три тройки дают 9."
      wrong:
        what: Произведение не 9.
        why: Сложили 3 + 3 = 6 и остановились.
        fix: Нужны три слагаемых по 3.
        next: Карточка раздела T01.
