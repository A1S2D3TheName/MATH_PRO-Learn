    points: 1
    prompt: Какая запись считает шесть рядов по 4 коробки?
    options:
    - id: a
      text: $6 \cdot 4 = 24$
    - id: b
      text: $6 + 4 = 10$
      misconception: E-num-mult-table-add
    - id: c
      text: $6 \cdot 3 = 18$
      misconception: E-num-mult-table-skip-short
    - id: d
      text: $6 \cdot 5 = 30$
      misconception: E-num-mult-table-neighbor
    answer: a
    hints:
    - Равные ряды — умножение.
    - Первый множитель — число рядов 6.
    - Отбросьте сумму и соседей 6 · 3 и 6 · 5.
    solution: |
      ### Ответ
      $6 \cdot 4 = 24$

      ### Идея
      Шесть равных рядов по 4 — произведение 6 · 4.

      ### Шаги
      1. Рядов 6, в ряду 4.
      2. 6 + 4 считает разные группы.
      3. 6 · 3 и 6 · 5 — соседние клетки.

      ### Проверка
      6 · 4 = 24; 24 : 6 = 4.

      ### Типичная ошибка
      E-num-mult-table-add: 6 + 4 = 10.
    feedback:
      correct: Выбрана запись шести четвёрок.
      wrong:
        what: Выбрана сумма или сосед.
        why: Равные ряды записали сложением.
        fix: "Проверьте: 6 рядов по 4 дают 24."
        next: Карточка раздела T01.
