      2. 18 : 3 = 6 и 18 : 6 = 3.
      3. 3 + 6 и 3 · 7 отбрасываем.

      ### Проверка
      3 · 6 = 18 подтверждает выбранные записи.

      ### Типичная ошибка
      Включить сумму 3 + 6 = 9.
