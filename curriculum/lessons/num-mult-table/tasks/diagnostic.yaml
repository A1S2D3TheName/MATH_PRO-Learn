  type: number
  role: diagnostic
  purpose: procedure
  level: 1
  outcome: num-div-meaning/LO-01
  sections:
  - T02
  minutes: 1
  prompt: "Известно, что $8 \\cdot 4 = 32$. Чему равно $32 : 8$?"
  answer: 4
  hints:
  - Деление — обратное к умножению из того же прямоугольника.
  - "32 : 8 ищет второй множитель в 8 · □ = 32."
  - "Проверьте: 8 умножить на ответ должно дать 32."
  solution: |
    ### Ответ
    4

    ### Идея
    Деление ищет множитель: какое число в произведении с 8 даёт 32.

    ### Шаги
    1. Ищем клетку 32 в строке 8.
    2. Она стоит под 4, потому что 8 · 4 = 32.
    3. Значит 32 : 8 = 4.

    ### Проверка
    8 · 4 = 32.

    ### Типичная ошибка
    E-num-mult-table-div-sub: вычесть 32 − 8 = 24 вместо частного.
  feedback:
    correct: "Верно: из 8 · 4 = 32 сразу следует 32 : 8 = 4."
    wrong:
      what: Частное не совпало с множителем 4.
      why: Связь умножения и деления не использована.
      fix: Верните второй множитель из известного произведения.
      next: "Тема num-div-meaning, проверка умножением."
