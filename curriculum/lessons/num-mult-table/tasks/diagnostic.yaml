# Входная диагностика пререквизита num-div-meaning (STANDARD.md §6, правило 15).
tasks:
- id: D-01
  type: number
  role: diagnostic
  purpose: procedure
  level: 0
  outcome: num-div-meaning/LO-01
  sections:
  - T03
  minutes: 1
  prompt: "Вычислите $15 : 3$."
  answer: 5
  errors:
  - E-num-mult-table-div-sub
  hints:
  - "Деление ищет множитель: какое число в произведении с 3 даёт 15."
  - Сколько троек помещается в 15?
  - "Проверьте умножением: 3 умножить на проверяемое число должно дать 15."
  solution: |
    ### Ответ
    5

    ### Идея
    Деление ищет множитель: какое число в произведении с 3 даёт 15.

    ### Шаги
    1. Ищем клетку 15 в строке 3.
    2. Она стоит под 5, потому что 3 · 5 = 15.
    3. Значит 15 : 3 = 5.

    ### Проверка
    3 · 5 = 15.

    ### Типичная ошибка
    E-num-mult-table-div-sub: вычесть 15 − 3 = 12 вместо частного.
  feedback:
    correct: "Верно: три пятёрки дают 15, поэтому 15 : 3 = 5."
    wrong:
      what: Частное не совпало.
      why: "Возможно, 15 и 3 вычтены, а не разделены."
      fix: "Найдите, какое число в произведении с 3 даёт 15."
      next: "Тема num-div-meaning, деление как поиск множителя."
    misconceptions:
    - id: E-num-mult-table-div-sub
      when:
        answer: 12
      message: "Похоже, 15 и 3 вычтены: 15 − 3 = 12, а нужно частное."
- id: D-02
  type: number
  role: diagnostic
  purpose: meaning
  level: 0
  outcome: num-div-meaning/LO-01
  sections:
  - T03
  minutes: 1
  prompt: "32 коробки разложили по 8 в ряд. Сколько рядов получилось?"
  answer: 4
  hints:
  - Вопрос «сколько рядов» — это деление на размер ряда.
  - Ищем множитель в равенстве □ · 8 = 32.
  - "Проверьте: 8 умножить на число рядов должно дать 32."
  solution: |
    ### Ответ
    4

    ### Идея
    Деление ищет множитель: какое число в произведении с 8 даёт 32.

    ### Шаги
    1. Ищем клетку 32 в строке 8.
    2. Она стоит под 4, потому что 8 · 4 = 32.
    3. Значит 32 : 8 = 4.

    ### Проверка
    8 · 4 = 32.

    ### Типичная ошибка
    E-num-mult-table-div-sub: вычесть 32 − 8 = 24 вместо частного.
  feedback:
    correct: "Верно: 4 ряда по 8 дают 32 коробки."
    wrong:
      what: Число рядов не совпало.
      why: "Возможно, из 32 вычли 8."
      fix: "Спросите, сколько восьмёрок в 32."
      next: "Тема num-div-meaning, деление по содержанию."
- id: D-03
  type: number
  role: diagnostic
  purpose: procedure
  level: 0
  outcome: num-div-meaning/LO-01
  sections:
  - T03
  minutes: 1
  trivial_answer_ok: true
  prompt: "Вычислите $0 : 5$."
  answer: 0
  hints:
  - Сколько пятёрок в нуле предметов?
  - Нуль предметов нельзя разложить ни в одну непустую группу.
  - "Проверка умножением: 5 умножить на ответ должно дать 0."
  solution: |
    ### Ответ
    0

    ### Идея
    Нуль предметов не содержит ни одной пятёрки.

    ### Шаги
    1. Делимое 0, делитель 5.
    2. 5 · 0 = 0, значит частное 0.
    3. Запись: 0 : 5 = 0.

    ### Проверка
    5 · 0 = 0.

    ### Типичная ошибка
    Ответить 5: перепутать с «нуль ничего не меняет» из сложения.
  feedback:
    correct: "Верно: нуль предметов не даёт ни одной пятёрки, 0 : 5 = 0."
    wrong:
      what: Частное не равно нулю.
      why: Нуль в делимом приняли за «ничего не менять».
      fix: "Проверьте умножением: 5 · ответ = 0 только при ответе 0."
      next: "Тема num-div-meaning, свойства нуля."
