  minutes: 1
  prompt: "Найдите число, для которого ${{a}} \\cdot \\square = {{p}}$."
  answer: 8
  hints:
  - Пропуск — частное произведения и известного множителя.
  - "Разделите {{p}} на {{a}}."
  - "Проверьте: {{a}} умножить на найденное число должно дать {{p}}."
  solution: |
    ### Ответ
    8

    ### Идея
    Пропуск в 3 · □ = 24 — это частное 24 : 3.

    ### Шаги
    1. Записываем 3 · □ = 24.
    2. □ = 24 : 3.
    3. 3 · 8 = 24, значит пропуск 8.

    ### Проверка
    3 · 8 = 24.

    ### Типичная ошибка
    E-num-mult-table-missing-sub: вычесть 24 − 3 = 21 вместо частного.
