tasks:
- id: P-01
  type: number
  role: warmup
  purpose: procedure
  level: 0
  outcome: LO-01
  sections:
  - T01
  minutes: 1
  prompt: "Вычислите ${{a}} \\cdot {{b}}$."
  answer: 15
  hints:
  - "Умножение считает равные группы, а не сумму множителей."
  - "Сложите столько групп по {{b}}, сколько показывает {{a}}."
  - "Назовите {{a}} чисел с шагом {{b}}, начиная с {{b}}."
  solution: |
    ### Ответ
    15

    ### Идея
    3 равных групп по 5 дают 15.

    ### Шаги
    1. Табличный случай 3 · 5.
    2. Счёт группами по 5 приводит к последнему числу 15.
    3. Запись: 3 · 5 = 15.

    ### Проверка
    15 : 3 = 5.

    ### Типичная ошибка
    E-num-mult-table-add: заменить умножение сложением 3 + 5 = 8.
  feedback:
    correct: "Верно: {{a|pl:группа,группы,групп}} по {{b}} — клетка ${{a}} \\cdot {{b}}$."
    wrong:
