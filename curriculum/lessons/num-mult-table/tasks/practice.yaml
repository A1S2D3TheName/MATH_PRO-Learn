- id: P-22
  type: match
  role: independent
  purpose: transfer
  level: 3
  outcome: LO-02
  sections:
  - T02
  minutes: 1
  prompt: Соедините произведение с записью деления из того же семейства.
  left:
  - id: l1
    text: $6 \cdot 8 = 48$
  - id: l2
    text: $7 \cdot 5 = 35$
  - id: l3
    text: $9 \cdot 4 = 36$
  right:
  - id: r1
    text: "$48 : 6 = 8$"
  - id: r2
    text: "$35 : 7 = 5$"
  - id: r3
    text: "$36 : 9 = 4$"
  - id: r4
    text: "$48 : 8 = 16$"
  - id: r5
    text: $6 + 8 = 14$
  answer:
  - left: l1
    right: r1
  - left: l2
    right: r2
  - left: l3
    right: r3
  hints:
  - "Деление семейства возвращает второй множитель, а не новое число."
  - "Для 6 · 8 частное 48 : 6 должно быть 8, не 16."
  - Сумма множителей к семейству не относится — это лишняя карточка.
  solution: |
    ### Ответ
    6 · 8 = 48 соединяется с 48 : 6 = 8; 7 · 5 = 35 с 35 : 7 = 5; 9 · 4 = 36 с 36 : 9 = 4.

    ### Идея
    Каждое деление семейства читает второй множитель.

    ### Шаги
    1. 48 : 6 = 8, не 16.
    2. 35 : 7 = 5.
    3. 36 : 9 = 4.
    4. 6 + 8 = 14 лишнее.

    ### Проверка
    Обратное умножение восстанавливает левые записи.

    ### Типичная ошибка
    Соединить 6 · 8 с 48 : 8 = 16 — частное посчитано неверно.
  feedback:
    correct: "Каждое произведение соединено с верным делением семейства, лишние карточки не использованы."
