- id: P-05
  type: choice
  role: supported
  purpose: meaning
  level: 1
  outcome: LO-01
  sections:
  - T01
  minutes: 1
  prompt: Какая запись считает пять рядов по 8 коробок?
  options:
  - id: a
    text: $5 \cdot 8 = 40$
  - id: b
    text: $5 + 8 = 13$
    misconception: E-num-mult-table-add
  - id: c
    text: $5 \cdot 7 = 35$
    misconception: E-num-mult-table-skip-short
  - id: d
    text: $5 \cdot 9 = 45$
    misconception: E-num-mult-table-neighbor
  answer: a
  hints:
  - "Равные ряды записывают умножением, а не сложением множителей."
  - "Пять рядов — первый множитель 5, в ряду 8 — второй."
  - Отбросьте запись со сложением и соседние факты 5 · 7 и 5 · 9.
  solution: |
    ### Ответ
    $5 \cdot 8 = 40$

    ### Идея
    Пять равных рядов по 8 — это произведение 5 · 8.

    ### Шаги
    1. Число рядов 5, размер ряда 8.
    2. Сложение 5 + 8 считает разные группы, не пять восьмёрок.
    3. 5 · 7 и 5 · 9 — соседние клетки, не этот паллет.

    ### Проверка
    5 · 8 = 40; 40 : 5 = 8.

    ### Типичная ошибка
    E-num-mult-table-add: записать 5 + 8 = 13.
  feedback:
    correct: "Верно выбрана запись пяти восьмёрок, а не сумма и не соседняя клетка."
    wrong:
      what: Выбрана не та запись.
      why: Сложение или соседний факт приняты за нужный прямоугольник.
      fix: "Проверьте: 5 рядов по 8 должны дать 40."
      next: Сравнение в T01.
