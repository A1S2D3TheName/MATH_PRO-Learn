      what: Пропуск не совпал.
      why: "Возможно, из произведения вычли множитель."
      fix: "Делите {{p}} на {{a}}, не вычитайте."
      next: Шаги T03.
    misconceptions:
    - id: E-num-mult-table-missing-sub
      when:
        expr: p - a
      message: "Похоже, из произведения вычли известный множитель."
  errors:
  - E-num-mult-table-missing-sub
  variants:
  - params:
      a: 3
      p: 24
    answer: 8
    solution: |
      ### Ответ
      8

