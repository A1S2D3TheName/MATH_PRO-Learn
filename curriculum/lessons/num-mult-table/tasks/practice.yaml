  prompt: "Сколько различных записей в семействе ${{a}} \\cdot {{b}} = {{p}}$? В ответ — число записей."
  answer: 4
  hints:
  - "Если множители разные, умножения не совпадают и деления тоже."
  - "При разных множителях: два умножения и два деления — четыре записи; при равных — две."
  - "Сравните множители пары: если они не равны, совпадений записей нет."
  solution: |
    ### Ответ
    4 при разных множителях, 2 при равных.

    ### Идея
    Разные множители дают четыре различные записи семейства, равные — только две.

    ### Шаги
    1. Умножения: a · b и b · a.
    2. Деления: p : a и p : b.
    3. Если a ≠ b, все четыре записи различны; если a = b, умножения совпадают и деления тоже.

    ### Проверка
    Для 5 · 8 = 40 записи 5 · 8, 8 · 5, 40 : 5, 40 : 8 — четыре разных; для 6 · 6 = 36 — две:
    6 · 6 = 36 и 36 : 6 = 6.

    ### Типичная ошибка
    Считать сумму множителей пятой записью семейства.
  feedback:
    correct: "Верно: при разных множителях записей четыре, при равных множителях — две."
    wrong:
