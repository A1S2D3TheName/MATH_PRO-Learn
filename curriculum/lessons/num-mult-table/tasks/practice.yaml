- id: P-09
  type: multi
  role: supported
  purpose: meaning
  level: 2
  outcome: LO-02
  sections:
  - T02
  minutes: 1
  prompt: Отметьте все записи семейства произведения $4 \cdot 9 = 36$.
  options:
  - id: a
    text: $9 \cdot 4 = 36$
  - id: b
    text: "$36 : 4 = 9$"
  - id: c
    text: $4 + 9 = 13$
    misconception: E-num-mult-table-add
  - id: d
    text: "$36 : 9 = 4$"
  - id: e
    text: $4 \cdot 8 = 32$
    misconception: E-num-mult-table-skip-short
  answer:
  - a
  - b
  - d
  hints:
  - Семейство держится на одном прямоугольнике 4 на 9.
  - В него входят оба умножения с теми же множителями и оба деления 36.
  - Сумма 4 + 9 и сосед 4 · 8 к этому прямоугольнику не относятся.
  solution: |
    ### Ответ
    $9 \cdot 4 = 36$, $36 : 4 = 9$, $36 : 9 = 4$

    ### Идея
    Четыре записи одного прямоугольника: два умножения и два деления.

    ### Шаги
    1. Множители меняются местами: 9 · 4 = 36.
    2. Деления: 36 : 4 = 9 и 36 : 9 = 4.
    3. 4 + 9 = 13 — сумма, 4 · 8 = 32 — соседняя клетка.

    ### Проверка
    4 · 9 = 36 подтверждает все три выбранные записи.

    ### Типичная ошибка
    E-num-mult-table-add: включить сумму множителей в семейство.
