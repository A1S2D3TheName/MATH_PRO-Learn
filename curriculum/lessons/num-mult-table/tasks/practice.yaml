      Пропуск в 3 · □ = 24 — это частное 24 : 3.

      ### Шаги
      1. Записываем 3 · □ = 24.
      2. □ = 24 : 3.
      3. 3 · 8 = 24, значит пропуск 8.

      ### Проверка
      3 · 8 = 24.

      ### Типичная ошибка
      E-num-mult-table-missing-sub: вычесть 24 − 3 = 21 вместо частного.
  - params:
      a: 5
      p: 45
    answer: 9
    solution: |
      ### Ответ
      9

      ### Идея
      Пропуск в 5 · □ = 45 — это частное 45 : 5.

      ### Шаги
      1. Записываем 5 · □ = 45.
      2. □ = 45 : 5.
      3. 5 · 9 = 45, значит пропуск 9.

      ### Проверка
      5 · 9 = 45.

