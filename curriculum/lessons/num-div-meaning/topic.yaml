# Паспорт темы (STANDARD.md §3). Поля section/stage/hours/grade/prerequisites скопированы из
# tree.yaml дословно (правило 6).
id: num-div-meaning
title: "Деление на равные части и по содержанию"
section: num
stage: 1
hours: 3
grade: "2"
prerequisites: [num-mult-meaning]
version: "1.0.0"
summary: >
  Деление находит пропущенный множитель: по общему количеству и одному из чисел о равных
  группах — размеру группы или числу групп — находим другое. Тема вводит делимое, делитель
  и частное, два смысла деления и способ найти частное отсчётом, проверку деления умножением
  и разбор записей с нулём: на нуль делить нельзя.

search:
  synonyms:
    - деление
    - деление чисел
    - что такое делимое
    - что такое делитель
    - что такое частное
    - деление на равные части
    - деление по содержанию
    - деление как неизвестный множитель
    - проверка деления умножением
    - деление на нуль
    - запись деления
    - деление для начинающих
  questions:
    - Что такое делимое, делитель и частное?
    - Как понять, на что делят в задаче?
    - Чем отличаются «сколько групп» и «сколько в одной группе»?
    - Как найти частное без подсказки?
    - Как деление связано с умножением?
    - Как проверить деление умножением?
    - Почему нельзя делить на нуль?
    - Чему равно ноль, разделённое на число?

