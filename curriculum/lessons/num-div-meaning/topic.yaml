  - id: num-div-meaning/delimoe-delitel-chastnoe
    title: "Делимое, делитель, частное"
    tree_ref: "Делимое, делитель, частное"
    synonyms: [названия чисел при делении, запись деления, знак деления]
    sections: [T01]
  - id: num-div-meaning/dva-smysla-deleniya
    title: "Два смысла деления"
    tree_ref: "Два смысла деления"
    synonyms: [сколько групп, сколько в одной группе, деление на равные части и по содержанию]
    sections: [T02, T05]
  - id: num-div-meaning/delenie-kak-neizvestnyy-mnozhitel
    title: "Деление как неизвестный множитель"
    tree_ref: "Деление как неизвестный множитель"
    synonyms: [пропущенный множитель, равенство с окошком, деление и умножение]
    sections: [T03]
  - id: num-div-meaning/proverka-umnozheniem-delenie-na
    title: "Проверка умножением, деление на нуль невозможно"
    tree_ref: "Проверка умножением, деление на нуль невозможно"
    synonyms: [проверка деления, ноль в делителе, проверка частного]
