outcomes:
  - id: LO-01
    short: Решает задачу на деление по смыслу
    action: >-
      по сюжету о равных группах определяет, что ищем — число групп или размер группы,
      записывает деление, называет делимое, делитель и частное и находит частное отсчётом
      или раздачей по одному
    conditions: >-
      делимое не больше 100, делитель и частное — от 1 до 10, предметы раскладываются на равные группы без лишних;
      сюжет о равных группах или прыжки по числовой прямой; без калькулятора
    criterion: >-
      верно определяет смысл деления, записывает деление и находит частное не менее чем
      в 4 случаях из 5, называя ответ вместе с предметом
    level: core
    sections: [T01, T02]
  - id: LO-02
    short: Связывает деление с умножением
    action: >-
      находит пропущенный множитель делением, проверяет частное умножением и различает записи
      с нулём: нуль, делённый на число, даёт нуль, а у записей с нулевым делителем значения нет
    conditions: >-
      равенства вида 6 × ☐ = 42 и ☐ × 6 = 42 и записи деления с делимым от 0 до 100,
      делителем от 0 до 10 и частным от 0 до 10
    criterion: >-
      находит пропущенный множитель и подтверждает или опровергает частное умножением не менее
      чем в 4 случаях из 5; на нулевой делитель отвечает «значения нет» и называет причину
    level: standard
    sections: [T03, T04]
  - id: LO-03
    short: Делит по рядам и столбцам
    action: >-
      по прямоугольнику из рядов и столбцов составляет два деления и отвечает на вопросы
      о рядах и столбцах, объясняя, почему одно частное отвечает на оба смысла деления;
      находит и проверяет умножением частные с делителем 1 и с равными делимым и делителем
    conditions: >-
      прямоугольники до 10 рядов и до 10 столбцов, всего не больше 100 плиток; делитель 1
      и деление числа от 1 до 100 на само себя; запись 0 : 0 различается отдельно
    criterion: >-
      верно отвечает на вопросы о рядах и столбцах и обосновывает частное проверкой умножением
      не менее чем в 4 случаях из 5
    level: deep
    sections: [T05]

