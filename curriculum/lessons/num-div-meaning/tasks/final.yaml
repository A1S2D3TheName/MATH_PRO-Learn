  minutes: 2
  depends_on: []
  errors:
  - E-num-div-meaning-count-off-low
  - E-num-div-meaning-count-off-high
  prompt: Утром в кафе «Перрон» привезли {{a|pl:чашку,чашки,чашек}}. Их разложили по {{b}} в коробку. Сколько коробок получилось?
  hints:
  - Размер коробки известен — по {{b|pl:чашке,чашки,чашек}}; что ищем?
  - Число коробок — сколько раз {{b}} укладывается в {{a}}.
  - Отсчитывайте по {{b}} до {{a}} и считайте шаги.
  feedback:
    correct: 'Верно: отсчёт по размеру коробки дал число коробок для всей цепочки.'
    wrong:
      what: Число коробок получилось другим.
      why: При отсчёте сбились на одну коробку или выбрали не то действие.
      fix: Проверьте ответ умножением на размер коробки.
      next: Вернитесь к разделу T01.
    misconceptions:
    - id: E-num-div-meaning-count-off-low
      when:
        expr: a / b - 1
      message: Похоже, последнюю коробку не засчитали.
    - id: E-num-div-meaning-count-off-high
      when:
        expr: a / b + 1
      message: Похоже, посчитаны отметки вместе с нулём.
  answer: 8
  variants:
  - params: &id001
      a: 48
      b: 6
      k: 2
      d: 4
    answer: 8
    solution: |
      ### Ответ
      8 коробок: 48 : 6 = 8.
      ### Идея
      Известен размер коробки — по 6 чашек, ищем число коробок.
      ### Шаги
      1. Делимое 48, делитель 6.
      2. Отсчёт по 6: 6, 12, 18, 24, 30, 36, 42, 48 — 8 шагов.
      3. 48 : 6 = 8.
      ### Проверка
      8 × 6 = 48: все чашки в коробках.
      ### Типичная ошибка
      Ответ «9» — посчитаны отметки вместе с нулём; проверка 9 × 6 = 54 не возвращает 48.
