title: 'Кафе «Перрон»: от коробок до подносов'
context_id: cafe-perron-cups
scenario: 'Утром в кафе привезли чашки: их раскладывают по коробкам, коробки расставляют по полкам, а чашки одной полки — на подносы; в конце раскладку проверяют умножением. Все шаги решаются целыми числами.'
