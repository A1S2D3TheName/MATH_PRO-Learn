- id: P-24
  type: number
  role: challenge
  purpose: transfer
  level: 5
  outcome: LO-03
  sections:
  - T05
  minutes: 5
  optional: true
  prompt: Из 24 плиток выложили прямоугольник. Рядов в нём на 2 больше, чем плиток в одном ряду. Сколько в нём рядов?
  answer: 6
  hints:
  - Число рядов, умноженное на плитки в ряду, даёт 24.
  - 'Подбирайте длину ряда по порядку: 1, 2, 3 — и считайте, сколько тогда рядов.'
  - 'Если в ряду 2 плитки, рядов на 2 больше, то есть 4: 4 × 2 = 8 — мало. Продолжайте подбор.'
  solution: |
    ### Ответ
    6 рядов.
    ### Идея
    Подбираем длину ряда, пока произведение рядов на длину ряда не станет 24.
    ### Шаги
    1. В ряду 1 плитка — рядов 3: 3 × 1 = 3, мало.
    2. В ряду 2 плитки — рядов 4: 4 × 2 = 8, мало; в ряду 3 — рядов 5: 5 × 3 = 15, мало.
    3. В ряду 4 плитки — рядов 6: 6 × 4 = 24 — подходит.
    4. Дальше произведение только растёт: в ряду 5 — рядов 7, 7 × 5 = 35, больше 24.
    ### Проверка
    24 : 6 = 4 — в ряду 4 плитки, рядов 6, и 6 на 2 больше 4.
    ### Типичная ошибка
    Отвечают «4» — это плитки в ряду, а спрашивают число рядов.
  feedback:
    correct: 'Верно: подбор длины ряда дал прямоугольник 6 рядов по 4 плитки.'
    wrong:
      what: Число рядов не подходит к условию.
      why: Скорее всего, перепутаны ряды и плитки в ряду или подбор остановлен раньше.
      fix: 'Подставьте ответ: рядов × плиток в ряду = 24, и рядов на 2 больше.'
      next: Вернитесь к ключевой заметке раздела T03 о подборе числа в окошко.
