    Столбцы панно 5 × 8 — «8: столбцов столько, сколько плиток в ряду»; плитки в ряду — «40 : 5 = 8»; ряды — «40 : 8 = 5».
    ### Идея
    Сначала решаем, что известно, а потом выбираем: ответить по устройству прямоугольника, разделить на число рядов или на размер ряда.
    ### Шаги
    1. В панно 5 рядов по 8 плиток столбцов столько, сколько плиток в ряду: 8, делить не нужно.
    2. 40 плиток в 5 рядов поровну: 40 : 5 = 8 плиток в ряду.
    3. 40 плиток по 8 в ряду: 40 : 8 = 5 рядов.
    ### Проверка
    5 × 8 = 40 — все три ответа согласуются с одним и тем же панно; карточка «5 × 8 = 40» находит все плитки, о которых не спрашивали.
    ### Типичная ошибка
    Для первого вопроса делят 40 на 5, хотя число 40 в задаче не дано, а столбцы видны из длины ряда.
