  right:
  - id: r1
    text: 0 — в каждой из 4 групп пусто, проверка 0 × 4 = 0
  - id: r2
    text: значения нет — ни одно число после умножения на 0 не даёт 4
  - id: r3
    text: значения нет — подходит любое число, а частное должно быть одно
  - id: r4
    text: 4 — на нуль не делили, число осталось прежним
  prompt: Подберите к каждой записи её значение вместе с причиной. Справа одна карточка лишняя.
  answer:
  - left: l1
    right: r1
  - left: l2
    right: r2
  - left: l3
    right: r3
  hints:
  - 'Причину значения даёт проверка умножением: частное × делитель = делимое.'
  - 'Деление на нуль и деление на единицу — разные вещи: что получается при умножении на 0?'
  - 'Для 4 : 0 подставьте в ☐ × 0 = 4 число 4: верно ли равенство?'
  solution: |
    ### Ответ
    0 : 4 = 0 — в каждой из 4 групп пусто; у 4 : 0 значения нет — ни одно число после умножения на 0 не даёт 4; у 0 : 0 значения нет — подходит любое число.
    ### Идея
    Значение и причину показывает проверка умножением.
    ### Шаги
    1. 0 : 4: ☐ × 4 = 0 — подходит только 0, в каждой группе пусто.
    2. 4 : 0: ☐ × 0 = 4 — произведение с нулём равно 0, числа нет.
    3. 0 : 0: ☐ × 0 = 0 — подходит любое число, частного одного нет.
    ### Проверка
    Карточка «4 — на нуль не делили» не проходит проверку: 4 × 0 = 0, а не 4.
    ### Типичная ошибка
    Деление на нуль путают с делением на единицу и пишут 4 : 0 = 4.
  feedback:
    correct: 'Верно: у каждой записи вы назвали и значение, и причину, которую даёт проверка умножением.'
    wrong:
      what: Значение или причина подобраны неверно.
      why: Скорее всего, деление на нуль приняли за «ничего не делили» или перепутали две причины, по которым значения нет.
