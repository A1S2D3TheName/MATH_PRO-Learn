tasks:
- id: P-01
  type: choice
  role: warmup
  purpose: procedure
  level: 0
  outcome: LO-01
  sections:
  - T01
  minutes: 1
  errors:
  - E-num-div-meaning-mul-instead
  - E-num-div-meaning-add-instead
  - E-num-div-meaning-count-off-low
  - E-num-div-meaning-count-off-high
  options:
  - id: o1
    text: '3'
  - id: o2
    text: '2'
    misconception: E-num-div-meaning-count-off-low
    why: 'Последнюю коробку не засчитали: 2 × 8 = 16, а яблок 24.'
  - id: o3
    text: '4'
    misconception: E-num-div-meaning-count-off-high
    why: 'Посчитали отметки 0, 8, 16, 24 вместо прыжков: 4 × 8 = 32, а яблок 24.'
  - id: o4
    text: '32'
    misconception: E-num-div-meaning-add-instead
    why: 'Сложили данные числа: 24 + 8 = 32 — коробок не бывает больше, чем яблок.'
  - id: o5
    text: '192'
    misconception: E-num-div-meaning-mul-instead
    why: 'Перемножили данные числа: 24 × 8 = 192 — это не число коробок.'
  prompt: 24 яблока разложили по 8 в коробку. Сколько коробок получилось?
  answer: o1
  hints:
  - 'Что ищем: число коробок или сколько яблок в одной коробке?'
  - Размер коробки известен — по 8 яблок. Значит, ищем, сколько раз 8 укладывается в 24.
  - 'Отсчитывайте по 8: 8, 16 — и продолжайте, пока не дойдёте до 24, считая шаги.'
  solution: |
    ### Ответ
    3 коробки: 24 : 8 = 3.
    ### Идея
    Известен размер группы — 8 яблок в коробке, поэтому ищем число групп.
    ### Шаги
    1. Делимое — 24 яблока, делитель — 8 яблок в коробке.
    2. Отсчёт по 8: 8, 16, 24 — три шага.
    3. 24 : 8 = 3.
    ### Проверка
    3 × 8 = 24: три коробки по 8 яблок вмещают все 24.
    ### Типичная ошибка
    Ответ «4» получается, если считать отметки 0, 8, 16, 24 вместо прыжков; проверка 4 × 8 = 32 не возвращает 24.
  feedback:
    correct: 'Верно: по 8 яблок в коробке — отсчёт 8, 16, 24 даёт три коробки.'
    wrong:
      what: Число коробок получилось другим.
      why: Скорее всего, действие выбрано не по вопросу (сложили или перемножили 24 и 8) или при отсчёте сбились на одну коробку.
      fix: Отсчитывайте по 8 до 24 и считайте прыжки, а не отметки; ответ проверьте умножением на 8.
      next: Вернитесь к примеру 2 раздела T01 «Кексы в коробки».
- id: P-02
  type: match
  role: warmup
  purpose: meaning
  level: 0
  outcome: LO-01
  sections:
  - T02
  minutes: 2
  left:
  - id: l1
    text: 18 книг расставили по 3 на полку. Сколько полок заняли книги?
  - id: l2
    text: 18 книг расставили на 6 полок поровну. Сколько книг на одной полке?
  - id: l3
    text: 4 полки, на каждой по 5 книг. Сколько книг всего?
  right:
  - id: r1
    text: Ищем число групп
  - id: r2
    text: Ищем размер группы
  - id: r3
    text: Ищем общее количество
  - id: r4
    text: Ищем делитель
  prompt: Определите по каждой задаче, что ищем. Справа одна карточка лишняя.
  answer:
  - left: l1
    right: r1
  - left: l2
    right: r2
  - left: l3
    right: r3
  hints:
  - 'Посмотрите, что уже известно о полках: сколько книг на одной полке или сколько полок.'
  - «По 3 на полку» — известен размер группы; «на 6 полок поровну» — известно число групп.
  - 'В третьей задаче известны и число полок 4, и книги на каждой: спрашивают о том, чего нет в условии.'
  solution: |
    ### Ответ
    18 книг по 3 на полку — ищем число групп; 18 книг на 6 полок поровну — ищем размер группы; 4 полки по 5 книг — ищем общее количество.
    ### Идея
    Вопрос задачи называет неизвестное: число групп, размер группы или общее количество.
    ### Шаги
    1. «По 3 на полку» — размер группы известен, ищем число полок: 18 : 3 = 6.
    2. «На 6 полок поровну» — число групп известно, ищем книги на полке: 18 : 6 = 3.
    3. «4 полки по 5 книг» — известны группы и их размер, ищем общее количество: 4 × 5 = 20.
    ### Проверка
    6 полок по 3 книги — это 18 книг, и 6 полок по 3 книги — снова 18: два разных вопроса к одним числам; 4 полки по 5 книг — 20 книг. Делитель в каждой задаче дан в условии, его не ищут.
    ### Типичная ошибка
    Все три задачи решают делением: в третьей делить нечего — общее количество находит умножение.
  feedback:
    correct: 'Верно: смысл неизвестного вы определили по тому, что известно о группах.'
    wrong:
      what: Карточка выбрана не для той задачи.
      why: Перепутаны «по 3 на полку» (известен размер группы) и «на 6 полок» (известно число групп).
      fix: Для каждой задачи скажите вслух, что дано о группах и что спрашивают.
      next: Вернитесь к шагам «Как решить задачу на деление» в разделе T02.
- id: P-03
  type: number
  role: supported
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T01
  minutes: 1
  errors:
  - E-num-div-meaning-count-off-low
  - E-num-div-meaning-count-off-high
  prompt: '{{a|pl:чашка,чашки,чашек}} разложили по {{b}} в коробку. Сколько коробок получилось? Опора: отсчитывайте по {{b}} и считайте шаги.'
  hints:
  - 'Что известно о коробках: сколько в каждой или сколько их?'
  - В каждой коробке по {{b}} — ищем, сколько раз {{b}} укладывается в {{a}}.
  - Отсчитывайте по {{b}}, начиная с {{b}}, пока не дойдёте до {{a}}, и считайте шаги.
  feedback:
    correct: 'Верно: размер коробки известен, и отсчёт по нему дал число коробок.'
    wrong:
      what: Число коробок получилось другим.
      why: При отсчёте по размеру коробки сбились на одну коробку или выбрали не то действие.
      fix: 'Отсчитайте ещё раз и проверьте: число коробок, умноженное на размер коробки, должно дать все чашки.'
      next: Разберите пример 1 раздела T01 «Салфетки в пачки».
    misconceptions:
    - id: E-num-div-meaning-count-off-low
      when:
        expr: a / b - 1
      message: 'Похоже, последнюю коробку не засчитали: отсчитайте до самого числа чашек.'
    - id: E-num-div-meaning-count-off-high
      when:
        expr: a / b + 1
      message: 'Похоже, посчитаны отметки вместе с нулём: считайте прыжки.'
  answer: 4
  variants:
  - params:
      a: 28
      b: 7
    answer: 4
    solution: |
      ### Ответ
      4 коробки: 28 : 7 = 4.
      ### Идея
      Известен размер группы — по 7 чашек в коробке, поэтому ищем число групп.
      ### Шаги
      1. Делимое — 28, делитель — 7.
      2. Отсчёт по 7: 7, 14, 21, 28 — 4 шага.
      3. 28 : 7 = 4.
      ### Проверка
      4 × 7 = 28: все чашки разложены.
      ### Типичная ошибка
      Ответ «5» появляется, если считать отметки вместе с нулём; проверка 5 × 7 = 35 не возвращает 28.
  - params:
      a: 30
      b: 5
    answer: 6
    solution: |
      ### Ответ
      6 коробок: 30 : 5 = 6.
      ### Идея
      Известен размер группы — по 5 чашек в коробке, поэтому ищем число групп.
      ### Шаги
      1. Делимое — 30, делитель — 5.
      2. Отсчёт по 5: 5, 10, 15, 20, 25, 30 — 6 шагов.
      3. 30 : 5 = 6.
      ### Проверка
      6 × 5 = 30: все чашки разложены.
      ### Типичная ошибка
      Ответ «7» появляется, если считать отметки вместе с нулём; проверка 7 × 5 = 35 не возвращает 30.
  solution: |
    ### Ответ
    4 коробки: 28 : 7 = 4.
    ### Идея
    Известен размер группы — по 7 чашек в коробке, поэтому ищем число групп.
    ### Шаги
    1. Делимое — 28, делитель — 7.
    2. Отсчёт по 7: 7, 14, 21, 28 — 4 шага.
    3. 28 : 7 = 4.
    ### Проверка
    4 × 7 = 28: все чашки разложены.
    ### Типичная ошибка
    Ответ «5» появляется, если считать отметки вместе с нулём; проверка 5 × 7 = 35 не возвращает 28.
