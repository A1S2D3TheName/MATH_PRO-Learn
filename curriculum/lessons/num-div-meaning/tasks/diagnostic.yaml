tasks:
- id: D-01
  type: number
  role: diagnostic
  purpose: procedure
  level: 1
  outcome: num-mult-meaning/LO-01
  sections:
  - T01
  minutes: 1
  prompt: На полке 4 коробки, в каждой по 6 чашек. Сколько чашек на полке?
  answer: 24
  hints:
  - 'Коробки — равные группы: в каждой одинаково, по 6 чашек.'
  - Общее количество в равных группах находит умножение — сложение одинаковых слагаемых.
  - 'Начните складывать: 6 + 6 = 12 — это две коробки; добавьте ещё две.'
  solution: |
    ### Ответ
    На полке 24 чашки: 4 × 6 = 24.
    ### Идея
    4 равные группы по 6 — это произведение 4 × 6.
    ### Шаги
    1. Групп 4, в каждой по 6 чашек.
    2. 6 + 6 + 6 + 6 = 24, то есть 4 × 6 = 24.
    ### Проверка
    Две коробки — 12 чашек, ещё две — ещё 12: 12 + 12 = 24.
    ### Типичная ошибка
    Ответ «10» получается, если сложить число коробок и число чашек в коробке: 4 + 6 = 10.
  feedback:
    correct: 'Верно: четыре равные группы по 6 чашек дают 24 — это умножение из темы-пререквизита.'
    wrong:
      what: Общее число чашек получилось другим.
      why: Скорее всего, сложили 4 и 6 или пропустили одну коробку при сложении.
      fix: Сложите шесть столько раз, сколько коробок, — четыре раза.
      next: 'Повторите тему «Смысл умножения» (num-mult-meaning): равные группы и повторное сложение.'
- id: D-02
  type: number
  role: diagnostic
  purpose: procedure
  level: 1
  outcome: num-mult-meaning/LO-01
  sections:
  - T03
  minutes: 1
  prompt: Запишите сумму 7 + 7 + 7 + 7 + 7 умножением и найдите её значение.
  answer: 35
  hints:
  - Одинаковые слагаемые — это равные группы.
  - Число групп — сколько раз повторяется слагаемое, размер группы — само слагаемое.
  - 'Складывайте по шагам: 7, 14, 21 — и продолжите ещё два шага.'
  solution: |
    ### Ответ
    35: 5 × 7 = 35.
    ### Идея
    Пять одинаковых слагаемых по 7 — это пять групп по 7.
    ### Шаги
    1. Слагаемое 7 повторяется пять раз: 5 × 7.
    2. Сложение по шагам: 7, 14, 21, 28, 35.
    ### Проверка
    Пары: 7 + 7 = 14, ещё пара — 28, и ещё 7 — 35.
    ### Типичная ошибка
    Ответ «12» получается, если сложить слагаемое и число слагаемых: 7 + 5 = 12.
  feedback:
    correct: 'Верно: пять одинаковых слагаемых по 7 — это 5 × 7 = 35.'
    wrong:
      what: Значение суммы получилось другим.
      why: При сложении по шагам пропущен или добавлен шаг.
      fix: Сложите по шагам ещё раз и сверьте число шагов с числом слагаемых.
      next: Повторите повторное сложение в теме «Смысл умножения» (num-mult-meaning).
- id: D-03
  type: number
  role: diagnostic
  purpose: procedure
  level: 0
  outcome: num-mult-meaning/LO-01
  sections:
  - T04
  minutes: 1
  prompt: Вычислите 6 × 0.
  answer: 0
  hints:
  - Умножение на 0 — это 6 групп, в которых пусто.
  - Сколько предметов в шести пустых группах?
  - Представьте 6 тарелок, на которых ничего не лежит.
  solution: |
    ### Ответ
    6 × 0 = 0.
    ### Идея
    Шесть групп по нулю предметов — предметов нет.
    ### Шаги
    1. 6 × 0 — шесть пустых групп.
    2. Всего предметов 0.
    ### Проверка
    Сложение шести нулей тоже даёт 0.
    ### Типичная ошибка
    Ответ «6» получается, если считать, что умножение на нуль не меняет число.
  feedback:
    correct: 'Верно: шесть пустых групп — ноль предметов; это понадобится для деления с нулём.'
    wrong:
      what: Получился не ноль.
      why: 'Нуль в умножении спутан с единицей: умножение на 1 оставляет число, а на 0 даёт 0.'
      fix: Представьте группы, в которых ничего нет, и сосчитайте предметы.
      next: Повторите умножение на нуль и на единицу в теме «Смысл умножения» (num-mult-meaning).
- id: D-04
  type: match
  role: diagnostic
  purpose: meaning
  level: 1
  outcome: num-mult-meaning/LO-02
  sections:
  - T04
  minutes: 2
  left:
  - id: l1
    text: число 4
  - id: l2
    text: число 5
  - id: l3
    text: число 20
  right:
  - id: r1
    text: число рядов (групп)
  - id: r2
    text: плиток в одном ряду (размер группы)
  - id: r3
    text: всего плиток (произведение)
  - id: r4
    text: сумма рядов и плиток в ряду
  prompt: 'Прямоугольник выложен плитками: 4 ряда по 5 плиток, всего 4 × 5 = 20 плиток. Подберите к каждому числу его роль. Справа одна карточка лишняя.'
  answer:
  - left: l1
    right: r1
  - left: l2
    right: r2
  - left: l3
    right: r3
  hints:
  - Ряды — равные группы плиток.
  - Произведение — это общее количество.
  - 'Начните с числа 20: что оно считает — ряды, плитки в ряду или все плитки?'
  solution: |
    ### Ответ
    4 — число рядов (групп), 5 — плиток в одном ряду (размер группы), 20 — всего плиток (произведение).
    ### Идея
    В записи 4 × 5 = 20 первый множитель — число групп, второй — размер группы.
    ### Шаги
    1. Рядов 4 — это число групп.
    2. В каждом ряду 5 плиток — размер группы.
    3. 20 — все плитки, произведение.
    ### Проверка
    5 + 5 + 5 + 5 = 20: четыре ряда по пять.
    ### Типичная ошибка
    Карточку «сумма рядов и плиток в ряду» выбирают для 20, но 4 + 5 = 9, а не 20.
  feedback:
    correct: 'Верно: в прямоугольнике 4 × 5 вы различили ряды, длину ряда и все плитки.'
    wrong:
      what: Роль числа определена неверно.
      why: Множители прямоугольника легко перепутать с произведением.
      fix: Покажите на рисунке один ряд и все плитки.
      next: Повторите прямоугольник из рядов и столбцов в теме «Смысл умножения» (num-mult-meaning).
