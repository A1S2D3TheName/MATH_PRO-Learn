tasks:
- id: R-01
  type: number
  role: refresh
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T01
  minutes: 2
  errors:
  - E-num-div-meaning-count-off-low
  - E-num-div-meaning-count-off-high
  prompt: '{{a|pl:кекс,кекса,кексов}} разложили по {{b}} в коробку. Сколько коробок получилось?'
  hints:
  - 'Что известно о коробках: сколько их или сколько кексов в каждой?'
  - По {{b}} в коробке — размер группы; ищем число групп.
  - Отсчитывайте по {{b}} до {{a}} и считайте шаги.
  feedback:
    correct: 'Верно: отсчёт по размеру коробки дал число коробок.'
    wrong:
      what: Число коробок получилось другим.
      why: При отсчёте сбились на одну коробку.
      fix: Считайте прыжки по размеру коробки, а не отметки, и проверьте умножением.
      next: Повторите карточку раздела T01.
    misconceptions:
    - id: E-num-div-meaning-count-off-low
      when:
        expr: a / b - 1
      message: Похоже, последнюю коробку не засчитали.
    - id: E-num-div-meaning-count-off-high
      when:
        expr: a / b + 1
      message: Похоже, посчитаны отметки вместе с нулём.
  answer: 4
  variants:
  - params:
      a: 32
      b: 8
    answer: 4
    solution: |
      ### Ответ
      4 коробки: 32 : 8 = 4.
      ### Идея
      Известен размер коробки — по 8 кексов, ищем число коробок.
      ### Шаги
      1. Делимое 32, делитель 8.
      2. Отсчёт по 8: 8, 16, 24, 32 — 4 шага.
      3. 32 : 8 = 4.
      ### Проверка
      4 × 8 = 32.
      ### Типичная ошибка
      Ответ «5» — посчитаны отметки вместе с нулём; проверка 5 × 8 = 40 не возвращает 32.
  - params:
      a: 21
      b: 3
    answer: 7
    solution: |
      ### Ответ
      7 коробок: 21 : 3 = 7.
      ### Идея
      Известен размер коробки — по 3 кексов, ищем число коробок.
      ### Шаги
      1. Делимое 21, делитель 3.
      2. Отсчёт по 3: 3, 6, 9, 12, 15, 18, 21 — 7 шагов.
      3. 21 : 3 = 7.
      ### Проверка
      7 × 3 = 21.
      ### Типичная ошибка
      Ответ «8» — посчитаны отметки вместе с нулём; проверка 8 × 3 = 24 не возвращает 21.
  - params:
      a: 70
      b: 10
    answer: 7
    solution: |
      ### Ответ
      7 коробок: 70 : 10 = 7.
      ### Идея
      Известен размер коробки — по 10 кексов, ищем число коробок.
      ### Шаги
      1. Делимое 70, делитель 10.
      2. Отсчёт по 10: 10, 20, 30, 40, 50, 60, 70 — 7 шагов.
      3. 70 : 10 = 7.
      ### Проверка
      7 × 10 = 70.
      ### Типичная ошибка
      Ответ «8» — посчитаны отметки вместе с нулём; проверка 8 × 10 = 80 не возвращает 70.
  solution: |
    ### Ответ
    4 коробки: 32 : 8 = 4.
    ### Идея
    Известен размер коробки — по 8 кексов, ищем число коробок.
    ### Шаги
    1. Делимое 32, делитель 8.
    2. Отсчёт по 8: 8, 16, 24, 32 — 4 шага.
    3. 32 : 8 = 4.
    ### Проверка
    4 × 8 = 32.
    ### Типичная ошибка
    Ответ «5» — посчитаны отметки вместе с нулём; проверка 5 × 8 = 40 не возвращает 32.
- id: R-02
  type: number
  role: refresh
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T02
  minutes: 2
  errors:
  - E-num-div-meaning-count-off-low
  - E-num-div-meaning-count-off-high
  - E-num-div-meaning-add-instead
  prompt: '{{a|pl:груша,груши,груш}} разложили в {{b|pl:корзину,корзины,корзин}} поровну. Сколько груш в одной корзине?'
  hints:
  - 'Что известно о корзинах: их число или сколько груш в одной?'
  - Число корзин — {{b}}; ищем размер группы раздачей по кругам.
  - За один круг раздачи в корзины уходит столько груш, сколько корзин, — {{b}}; считайте круги до {{a}}.
  feedback:
    correct: 'Верно: раздача по кругам дала, сколько груш в одной корзине.'
    wrong:
      what: Груш в корзине получилось другое число.
      why: Пропущен последний круг раздачи или числа сложили.
      fix: Раздавайте по одной груше в каждую корзину и считайте круги.
      next: Повторите карточку раздела T02.
    misconceptions:
    - id: E-num-div-meaning-count-off-low
      when:
        expr: a / b - 1
      message: Похоже, пропущен последний круг.
    - id: E-num-div-meaning-count-off-high
      when:
        expr: a / b + 1
      message: Похоже, засчитан лишний круг.
    - id: E-num-div-meaning-add-instead
      when:
        expr: a + b
      message: Похоже, данные числа сложили.
  answer: 3
  variants:
  - params:
      a: 27
      b: 9
    answer: 3
    solution: |
      ### Ответ
      В одной корзине 3 груши: 27 : 9 = 3.
      ### Идея
      Известно число корзин — 9, ищем размер группы.
      ### Шаги
      1. Делимое 27, делитель 9.
      2. Раздача по кругам: 9, 18, 27.
      3. Кругов 3: 27 : 9 = 3.
      ### Проверка
      9 × 3 = 27.
      ### Типичная ошибка
      Ответ «2» — пропущен последний круг раздачи; проверка 9 × 2 = 18 не возвращает 27.
  - params:
      a: 45
      b: 5
    answer: 9
    solution: |
      ### Ответ
      В одной корзине 9 груш: 45 : 5 = 9.
      ### Идея
      Известно число корзин — 5, ищем размер группы.
      ### Шаги
      1. Делимое 45, делитель 5.
      2. Раздача по кругам: 5, 10, 15, 20, 25, 30, 35, 40, 45.
      3. Кругов 9: 45 : 5 = 9.
      ### Проверка
      5 × 9 = 45.
      ### Типичная ошибка
      Ответ «8» — пропущен последний круг раздачи; проверка 5 × 8 = 40 не возвращает 45.
  - params:
      a: 16
      b: 4
    answer: 4
    solution: |
      ### Ответ
      В одной корзине 4 груши: 16 : 4 = 4.
      ### Идея
      Известно число корзин — 4, ищем размер группы.
      ### Шаги
      1. Делимое 16, делитель 4.
      2. Раздача по кругам: 4, 8, 12, 16.
      3. Кругов 4: 16 : 4 = 4.
      ### Проверка
      4 × 4 = 16.
      ### Типичная ошибка
      Ответ «3» — пропущен последний круг раздачи; проверка 4 × 3 = 12 не возвращает 16.
  solution: |
    ### Ответ
    В одной корзине 3 груши: 27 : 9 = 3.
    ### Идея
    Известно число корзин — 9, ищем размер группы.
    ### Шаги
    1. Делимое 27, делитель 9.
    2. Раздача по кругам: 9, 18, 27.
    3. Кругов 3: 27 : 9 = 3.
    ### Проверка
    9 × 3 = 27.
    ### Типичная ошибка
    Ответ «2» — пропущен последний круг раздачи; проверка 9 × 2 = 18 не возвращает 27.
- id: R-03
  type: match
  role: refresh
  purpose: meaning
  level: 1
  outcome: LO-01
  sections:
  - T01
  minutes: 3
  left:
  - id: l1
    text: число 42
  - id: l2
    text: число 7
  - id: l3
    text: число 6
  right:
  - id: r1
    text: делимое
  - id: r2
    text: делитель
  - id: r3
    text: частное
  - id: r4
    text: произведение
  prompt: 'Подпишите имя каждого числа в записи 42 : 7 = 6. Справа одна карточка лишняя.'
  answer:
  - left: l1
    right: r1
  - left: l2
    right: r2
  - left: l3
    right: r3
  hints:
  - Имя числа зависит от его места в записи деления.
  - Первым пишут то, что делят; после знака деления — то, на что делят.
  - Число 6 стоит после знака равенства — какое имя у результата деления?
  solution: |
    ### Ответ
    42 — делимое, 7 — делитель, 6 — частное.
    ### Идея
    Имена чисел деления задаёт их место в записи.
    ### Шаги
    1. 42 стоит первым — делимое.
    2. 7 стоит после знака деления — делитель.
    3. 6 стоит после знака равенства — частное.
    ### Проверка
    6 × 7 = 42: частное, умноженное на делитель, даёт делимое.
    ### Типичная ошибка
    Делимое называют произведением: это имя числа в умножении, а не в делении.
  feedback:
    correct: 'Верно: делимое, делитель и частное названы по их местам в записи 42 : 7 = 6.'
    wrong:
      what: Имя числа подписано неверно.
      why: Имена делимого и делителя легко поменять местами.
      fix: 'Прочитайте запись вслух: «сорок два разделить на семь равно шести».'
      next: Повторите таблицу имён в разделе T01.
- id: R-04
  type: number
  role: refresh
  purpose: procedure
  level: 1
  outcome: LO-02
  sections:
  - T03
  minutes: 2
  errors:
  - E-num-div-meaning-add-instead
  - E-num-div-meaning-mul-instead
  prompt: 'Найдите пропущенный множитель: ☐ × {{b}} = {{a}}.'
  hints:
  - Какое число групп по {{b}} даёт {{a}}?
  - Пропущенный множитель находит деление произведения на известный множитель.
  - 'Запишите {{a}} : {{b}} и найдите частное отсчётом по {{b}}.'
  feedback:
    correct: 'Верно: пропущенный множитель найден делением, подстановка возвращает произведение.'
    wrong:
      what: Число в окошке подобрано неверно.
      why: Окошко находят делением, а не сложением или умножением данных чисел.
      fix: Подставьте своё число в окошко и сравните произведение с данным.
      next: Повторите карточку раздела T03.
    misconceptions:
    - id: E-num-div-meaning-add-instead
      when:
        expr: a + b
      message: Похоже, данные числа сложили.
    - id: E-num-div-meaning-mul-instead
      when:
        expr: a * b
      message: Похоже, данные числа перемножили.
  answer: 7
  variants:
  - params:
      a: 42
      b: 6
    answer: 7
    solution: |
      ### Ответ
      В окошке 7: 42 : 6 = 7.
      ### Идея
      Неизвестен первый множитель — число групп по 6; его находит деление.
      ### Шаги
      1. ☐ × 6 = 42, значит, ☐ = 42 : 6.
      2. Отсчёт по 6: 6, 12, 18, 24, 30, 36, 42 — 7 шагов.
      3. В окошке 7.
      ### Проверка
      7 × 6 = 42.
      ### Типичная ошибка
      Ответ «48» — данные числа сложили; 48 групп по 6 намного больше 42.
  - params:
      a: 36
      b: 4
    answer: 9
    solution: |
      ### Ответ
      В окошке 9: 36 : 4 = 9.
      ### Идея
      Неизвестен первый множитель — число групп по 4; его находит деление.
      ### Шаги
      1. ☐ × 4 = 36, значит, ☐ = 36 : 4.
      2. Отсчёт по 4: 4, 8, 12, 16, 20, 24, 28, 32, 36 — 9 шагов.
      3. В окошке 9.
      ### Проверка
      9 × 4 = 36.
      ### Типичная ошибка
      Ответ «40» — данные числа сложили; 40 групп по 4 намного больше 36.
  - params:
      a: 40
      b: 8
    answer: 5
    solution: |
      ### Ответ
      В окошке 5: 40 : 8 = 5.
      ### Идея
      Неизвестен первый множитель — число групп по 8; его находит деление.
      ### Шаги
      1. ☐ × 8 = 40, значит, ☐ = 40 : 8.
      2. Отсчёт по 8: 8, 16, 24, 32, 40 — 5 шагов.
      3. В окошке 5.
      ### Проверка
      5 × 8 = 40.
      ### Типичная ошибка
      Ответ «48» — данные числа сложили; 48 групп по 8 намного больше 40.
  solution: |
    ### Ответ
    В окошке 7: 42 : 6 = 7.
    ### Идея
    Неизвестен первый множитель — число групп по 6; его находит деление.
    ### Шаги
    1. ☐ × 6 = 42, значит, ☐ = 42 : 6.
    2. Отсчёт по 6: 6, 12, 18, 24, 30, 36, 42 — 7 шагов.
    3. В окошке 7.
    ### Проверка
    7 × 6 = 42.
    ### Типичная ошибка
    Ответ «48» — данные числа сложили; 48 групп по 6 намного больше 42.
- id: R-05
  type: match
  role: refresh
  purpose: meaning
  level: 1
  outcome: LO-02
  sections:
  - T04
  minutes: 3
  left:
  - id: l1
    text: '0 : 8'
  - id: l2
    text: '8 : 0'
  - id: l3
    text: '0 : 0'
  right:
  - id: r1
    text: '0'
  - id: r2
    text: 'значения нет: ни одно число после умножения на 0 не даёт 8'
  - id: r3
    text: 'значения нет: подходит любое число, а частное должно быть одно'
  - id: r4
    text: '8'
  prompt: Для каждой записи выберите её значение. Справа одна карточка лишняя.
  answer:
  - left: l1
    right: r1
  - left: l2
    right: r2
  - left: l3
    right: r3
  hints:
  - 'Каждую запись проверяйте умножением: частное × делитель = делимое.'
  - Произведение с нулём равно 0.
  - 'Для 0 : 0 подставьте в ☐ × 0 = 0 два разных числа, например 2 и 5.'
  solution: |
    ### Ответ
    0 : 8 = 0; у 8 : 0 значения нет — ни одно число после умножения на 0 не даёт 8; у 0 : 0 значения нет — подходит любое число, а частное должно быть одно.
    ### Идея
    Значение ищут проверкой умножением.
    ### Шаги
    1. 0 : 8: ☐ × 8 = 0 — подходит только 0.
    2. 8 : 0: ☐ × 0 = 8 — числа нет.
    3. 0 : 0: ☐ × 0 = 0 — подходит любое число.
    ### Проверка
    0 × 8 = 0 подтверждает первую запись.
    ### Типичная ошибка
    Ставят «8» у 8 : 0, путая деление на нуль с делением на единицу; 8 × 0 = 0, а не 8.
  feedback:
    correct: 'Верно: у нулевого делителя значения нет, причём у 8 : 0 и у 0 : 0 — по разным причинам.'
    wrong:
      what: Значение записи подобрано неверно.
      why: Нуль в делимом и нуль в делителе — разные случаи.
      fix: Проверьте каждую запись умножением.
      next: Повторите карточку раздела T04.
