variants:
- id: A
  tasks:
  - id: EA-01
    type: match
    role: exam
    purpose: meaning
    level: 0
    outcome: LO-01
    sections:
    - T02
    minutes: 2
    points: 1
    left:
    - id: l1
      text: 21 ручку поставили по 3 в стакан. Сколько стаканов понадобилось?
    - id: l2
      text: 21 ручку поставили в 7 стаканов поровну. Сколько ручек в одном стакане?
    - id: l3
      text: 5 полок, на каждой по 6 книг. Сколько книг всего?
    right:
    - id: r1
      text: Ищем число групп
    - id: r2
      text: Ищем размер группы
    - id: r3
      text: Ищем общее количество
    - id: r4
      text: Ищем делитель
    prompt: Что неизвестно в каждой задаче? Подберите карточку. Справа одна карточка лишняя.
    answer:
    - left: l1
      right: r1
    - left: l2
      right: r2
    - left: l3
      right: r3
    hints:
    - 'Посмотрите, что известно о группах: размер или число.'
    - «По N» — известен размер группы; «в N … поровну» — известно число групп.
    - 'В третьей задаче известны и число полок, и сколько в каждой: что остаётся найти?'
    solution: |
      ### Ответ
      Первая — ищем число групп, вторая — размер группы, третья — общее количество.
      ### Идея
      Вопрос задачи называет неизвестное.
      ### Шаги
      1. Известен размер группы — ищем число групп делением.
      2. Известно число групп — ищем размер группы делением.
      3. Известны число групп и размер — ищем общее количество умножением.
      ### Проверка
      Делитель в каждой задаче дан в условии, его не ищут.
      ### Типичная ошибка
      Все задачи решают одним действием, не глядя на вопрос.
    feedback:
      correct: 'Верно: по тому, что известно о полках, вы назвали неизвестное в каждой из трёх задач.'
      wrong:
        what: Карточка подобрана не к той задаче.
        why: Перепутаны «по N» и «в N поровну».
        fix: Скажите вслух, что дано о группах.
        next: Повторите раздел T02.
  - id: EA-02
    type: number
    role: exam
    purpose: procedure
    level: 0
    outcome: LO-02
    sections:
    - T04
    minutes: 2
    points: 1
    prompt: 'Чему равно 0 : 4?'
    answer: 0
    hints:
    - Ищите число, которое после умножения на 4 даёт 0.
    - 'Где здесь нуль: в делимом или в делителе?'
    - Подставьте в проверку ☐ × 4 = 0 несколько чисел.
    solution: |
      ### Ответ
      0 : 4 = 0.
      ### Идея
      Нуль, делённый на 4, даёт нуль: 0 предметов в 4 группах — по нулю в каждой.
      ### Шаги
      1. 0 : 4 = ☐ означает ☐ × 4 = 0.
      2. Подходит только 0.
      ### Проверка
      0 × 4 = 0 — делимое восстановлено.
      ### Типичная ошибка
      Пишут «значения нет», путая нуль в делимом с нулём в делителе.
    feedback:
      correct: 'Верно: нуль в делимом даёт нуль, проверка 0 × 4 = 0.'
      wrong:
        what: Ответ не нуль.
        why: Нуль в делимом спутан с нулём в делителе.
        fix: Посмотрите, где стоит нуль.
        next: Повторите пример 3 раздела T04.
  - id: EA-03
    type: number
    role: exam
    purpose: procedure
    level: 1
    outcome: LO-01
    sections:
    - T01
    minutes: 2
    points: 1
    prompt: 36 тарелок разложили по 9 в коробку. Сколько коробок получилось?
    answer: 4
    hints:
    - 'Что известно о коробках: сколько их или сколько тарелок в одной?'
    - По 9 в коробке — размер группы; ищем число коробок.
    - Отсчитывайте по 9 до 36 и считайте шаги.
    solution: |
      ### Ответ
      4 коробки: 36 : 9 = 4.
      ### Идея
      Известен размер группы — по 9, ищем число групп.
      ### Шаги
      1. Делимое 36, делитель 9.
      2. Отсчёт по 9: 9, 18, 27, 36 — 4 шага.
      3. 36 : 9 = 4.
      ### Проверка
      4 × 9 = 36.
      ### Типичная ошибка
      Ответ «5» — посчитаны отметки вместе с нулём; проверка 5 × 9 = 45 не возвращает 36.
    feedback:
      correct: 'Верно: отсчёт по 9 дал 4 коробки — проверка 4 × 9 = 36.'
      wrong:
        what: Число коробок неверное.
        why: При отсчёте сбились на одну коробку или выбрали не то действие.
        fix: Проверьте ответ умножением на размер коробки.
        next: Повторите раздел T01.
  - id: EA-04
    type: number
    role: exam
    purpose: procedure
    level: 1
    outcome: LO-01
    sections:
    - T02
    minutes: 2
    points: 1
    prompt: 45 яблок разложили в 9 корзин поровну. Сколько яблок в одной корзине?
    answer: 5
    hints:
    - 'Что известно: сколько групп или сколько яблок в одной?'
    - Число групп — 9; ищем размер группы раздачей по кругам.
    - Каждый круг раздачи кладёт 9; считайте круги до 45.
    solution: |
      ### Ответ
      В одной корзине 5 яблок: 45 : 9 = 5.
      ### Идея
      Известно число групп — 9, ищем размер группы.
      ### Шаги
      1. Делимое 45, делитель 9.
      2. Раздача по кругам: 9, 18, 27, 36, 45.
      3. Кругов 5: 45 : 9 = 5.
      ### Проверка
      9 × 5 = 45.
      ### Типичная ошибка
      Ответ «4» — пропущен последний круг раздачи; проверка 9 × 4 = 36 не возвращает 45.
    feedback:
      correct: 'Верно: раздача по кругам на 9 дала по 5 в каждой группе.'
      wrong:
        what: Размер группы неверный.
        why: Пропущен или добавлен круг раздачи.
        fix: 'Проверьте: число групп × размер группы = все предметы.'
        next: Повторите раздел T02.
  - id: EA-05
    type: match
    role: exam
    purpose: meaning
    level: 2
    outcome: LO-01
    sections:
    - T01
    minutes: 3
    points: 1
    left:
    - id: l1
      text: число 48
    - id: l2
      text: число 8
    - id: l3
      text: число 6
    right:
    - id: r1
      text: 'делимое: сколько кексов всего'
    - id: r2
      text: 'делитель: сколько кексов в одной коробке'
    - id: r3
      text: 'частное: сколько коробок получилось'
    - id: r4
      text: 'делитель: сколько коробок получилось'
    prompt: 'Задача: «48 кексов разложили по 8 в коробку. Сколько коробок получилось?» Решение: 48 : 8 = 6. Подберите к каждому числу записи его имя и смысл в задаче. Справа одна карточка лишняя.'
    answer:
    - left: l1
      right: r1
    - left: l2
      right: r2
    - left: l3
      right: r3
    hints:
    - Имя числа — по месту в записи, смысл — по задаче.
    - Число 8 стоит после знака деления; что оно означает в задаче?
    - 'Число 6 стоит после знака равенства: это ответ на вопрос задачи.'
    solution: |
      ### Ответ
      48 — делимое: сколько кексов всего; 8 — делитель: сколько кексов в одной коробке; 6 — частное: сколько коробок получилось.
      ### Идея
      Карточка подходит, если верны и имя числа, и его смысл в задаче.
      ### Шаги
      1. 48 стоит первым — делимое, это все предметы.
      2. 8 стоит после знака деления — делитель, это размер одной группы.
      3. 6 — частное, ответ на вопрос задачи.
      ### Проверка
      6 × 8 = 48.
      ### Типичная ошибка
      Делителем называют ответ задачи: в этой задаче ответ — частное.
    feedback:
      correct: 'Верно: в записи 48 : 8 = 6 совпали имена чисел и их смысл в задаче.'
      wrong:
        what: Имя или смысл числа подобраны неверно.
        why: Делитель (размер группы) путают с частным (числом групп).
        fix: Назовите место числа в записи, потом найдите его в задаче.
        next: Повторите таблицу имён раздела T01.
  - id: EA-06
    type: number
    role: exam
    purpose: procedure
    level: 2
    outcome: LO-02
    sections:
    - T03
    minutes: 3
    points: 1
    prompt: 'Найдите пропущенный множитель: 7 × ☐ = 63.'
    answer: 9
    hints:
    - Какое число после умножения на 7 даёт 63?
    - Пропущенный множитель находит деление.
    - 'Запишите 63 : 7 и найдите частное отсчётом по 7.'
    solution: |
      ### Ответ
      В окошке 9: 63 : 7 = 9.
      ### Идея
      Известны произведение 63 и множитель 7; пропущенный множитель находит деление.
      ### Шаги
      1. ☐ = 63 : 7.
      2. Отсчёт по 7: 7, 14, 21, 28, 35, 42, 49, 56, 63 — 9 шагов.
      3. В окошке 9.
      ### Проверка
      7 × 9 = 63.
      ### Типичная ошибка
      Ответ «70» — данные числа сложили; 7 × 70 намного больше 63.
    feedback:
      correct: 'Верно: 63 : 7 = 9, и подстановка 7 × 9 = 63 это подтверждает.'
      wrong:
        what: Число в окошке неверное.
        why: Окошко находят делением, а не сложением или умножением данных чисел.
        fix: Подставьте ответ в окошко.
        next: Повторите раздел T03.
  - id: EA-07
    type: number
    role: exam
    purpose: method
    level: 2
    outcome: LO-02
    sections:
    - T03
    minutes: 3
    points: 1
    prompt: Какое число нужно умножить на 8, чтобы получилось 64?
    answer: 8
    hints:
    - Известны множитель 8 и произведение 64.
    - Запишите вопрос равенством с окошком.
    - 'Равенство ☐ × 8 = 64: какое действие находит окошко?'
    solution: |
      ### Ответ
      Число 8: 8 × 8 = 64.
      ### Идея
      Неизвестен множитель; его находит деление.
      ### Шаги
      1. ☐ × 8 = 64.
      2. ☐ = 64 : 8.
      3. Отсчёт по 8: 8, 16, 24, 32, 40, 48, 56, 64 — 8 шагов.
      ### Проверка
      8 × 8 = 64.
      ### Типичная ошибка
      Ответ «72» — сложили данные числа; подстановка 72 × 8 даёт намного больше 64.
    feedback:
      correct: 'Верно: слово «умножить» не сбило, окошко нашло деление 64 : 8 = 8.'
      wrong:
        what: Найденное число не даёт данного произведения.
        why: Перемножили или сложили данные числа.
        fix: Запишите равенство с окошком и найдите окошко делением.
        next: Повторите пример 2 раздела T03.
  - id: EA-08
    type: match
    role: exam
    purpose: meaning
    level: 2
    outcome: LO-02
    sections:
    - T04
    minutes: 3
    points: 1
    left:
    - id: l1
      text: '0 : 3'
    - id: l2
      text: '3 : 0'
    - id: l3
      text: '0 : 0'
    right:
    - id: r1
      text: 0 — в каждой из 3 групп пусто, проверка 0 × 3 = 0
    - id: r2
      text: значения нет — ни одно число после умножения на 0 не даёт 3
    - id: r3
      text: значения нет — подходит любое число, а частное должно быть одно
    - id: r4
      text: 3 — на нуль не делили, число осталось прежним
    prompt: Для каждой записи подберите значение и причину. Справа одна карточка лишняя.
    answer:
    - left: l1
      right: r1
    - left: l2
      right: r2
    - left: l3
      right: r3
    hints:
    - Причину даёт проверка умножением.
    - Произведение с нулём равно 0.
    - 'Для 3 : 0 подставьте в ☐ × 0 = 3 число 3: верно ли равенство?'
    solution: |
      ### Ответ
      0 : 3 = 0 — в каждой из 3 групп пусто; у 3 : 0 значения нет — ни одно число после умножения на 0 не даёт 3; у 0 : 0 значения нет — подходит любое число.
      ### Идея
      Значение и причину показывает проверка умножением.
      ### Шаги
      1. 0 : 3: ☐ × 3 = 0 — подходит только 0.
      2. 3 : 0: ☐ × 0 = 3 — числа нет.
      3. 0 : 0: ☐ × 0 = 0 — подходит любое число.
      ### Проверка
      Карточка «3 — на нуль не делили» не проходит проверку: 3 × 0 = 0.
      ### Типичная ошибка
      Деление на нуль путают с делением на единицу и пишут 3 : 0 = 3.
    feedback:
      correct: 'Верно: для 0 : 3, 3 : 0 и 0 : 0 вы назвали значение и причину.'
      wrong:
        what: Значение или причина подобраны неверно.
        why: Деление на нуль спутано с делением на единицу или перепутаны две причины.
        fix: Подставьте число в проверку и посмотрите, сколько чисел подходит.
        next: Повторите раздел T04.
  - id: EA-09
    type: number
    role: exam
    purpose: procedure
    level: 2
    outcome: LO-03
    sections:
    - T05
    minutes: 3
    points: 1
    prompt: 'Ученик записал 7 : 7 = 0. Проверьте ответ умножением и запишите верное частное.'
    answer: 1
    hints:
    - Проверка деления — умножение частного на делитель.
    - Умножьте ответ ученика 0 на делитель 7 и сравните с 7.
    - Найдите произведение 0 × 7 и подберите частное так, чтобы проверка вернула 7.
    solution: |
      ### Ответ
      Верное частное — 1: 7 : 7 = 1.
      ### Идея
      Частное проверяют умножением: частное × делитель = делимое.
      ### Шаги
      1. Проверка ответа ученика: 0 × 7 = 0.
      2. 0 ≠ 7 — ответ 0 неверный.
      3. 7 : 7 = 1: число, делённое на само себя, даёт 1.
      ### Проверка
      1 × 7 = 7.
      ### Типичная ошибка
      Путают делитель 1 и деление числа на само себя.
    feedback:
      correct: 'Верно: проверка 0 × 7 = 0 опровергла ответ ученика, а 1 × 7 = 7 подтвердила ваш.'
      wrong:
        what: Частное не проходит проверку.
        why: Делитель 1 и деление числа на само себя легко перепутать.
        fix: Подставьте частное в проверку.
        next: Повторите раздел T05.
  - id: EA-10
    type: number
    role: exam
    purpose: method
    level: 3
    outcome: LO-01
    sections:
    - T01
    minutes: 4
    points: 1
    prompt: В одной пачке 7 листов. Сколько пачек нужно взять, чтобы получилось ровно 49 листов?
    answer: 7
    hints:
    - Слова «сколько нужно взять» похожи на умножение — но что здесь неизвестно?
    - Известно, сколько листов в одной пачке и сколько нужно всего; ищем число групп.
    - 'Запишите деление 49 : 7 и найдите частное отсчётом по 7.'
    solution: |
      ### Ответ
      7 пачек: 49 : 7 = 7.
      ### Идея
      Известен размер группы и общее количество — число групп находит деление.
      ### Шаги
      1. Размер группы — 7, общее количество — 49.
      2. Неизвестно число групп, значит, действие — деление.
      3. Отсчёт по 7: 7, 14, 21, 28, 35, 42, 49 — 7 шагов.
      ### Проверка
      7 × 7 = 49.
      ### Типичная ошибка
      Ответ «56» — сложили данные числа; столько пачек дали бы намного больше 49.
    feedback:
      correct: 'Верно: вопрос «сколько нужно взять» решило деление 49 : 7 = 7.'
      wrong:
        what: Число групп неверное.
        why: Вопрос «сколько нужно» подтолкнул к умножению или сложению данных чисел.
        fix: 'Определите, что неизвестно: число групп при известном размере — это деление.'
        next: Повторите раздел T01.
  - id: EA-11
    type: number
    role: exam
    purpose: transfer
    level: 3
    outcome: LO-02
    sections:
    - T03
    minutes: 4
    points: 1
    prompt: Кузнечик прыгал по числовой прямой от нуля прыжками по 8 единиц и попал в точку 32. Запишите равенство с окошком для числа прыжков и найдите это число.
    answer: 4
    hints:
    - Число прыжков неизвестно — это пропущенный множитель.
    - 'Каждый прыжок — 8; всего пройдено 32: запишите ☐ × 8 = 32.'
    - 'Найдите окошко делением 32 : 8.'
    solution: |
      ### Ответ
      4 прыжка: ☐ × 8 = 32, ☐ = 32 : 8 = 4.
      ### Идея
      Число прыжков — пропущенный множитель; его находит деление.
      ### Шаги
      1. Равенство: ☐ × 8 = 32.
      2. ☐ = 32 : 8.
      3. Точки после прыжков: 8, 16, 24, 32 — 4 прыжка.
      ### Проверка
      4 × 8 = 32.
      ### Типичная ошибка
      Ответ «5» — посчитаны точки вместе с нулём, а не прыжки.
    feedback:
      correct: 'Верно: число прыжков — пропущенный множитель, 32 : 8 = 4.'
      wrong:
        what: Число прыжков неверное.
        why: Посчитаны точки вместе с нулём или пропущен прыжок.
        fix: Считайте только прыжки и проверьте умножением.
        next: Повторите раздел T03 и виджет раздела T01.
  - id: EA-12
    type: numbers
    role: exam
    purpose: meaning
    level: 4
    outcome: LO-03
    sections:
    - T05
    minutes: 4
    points: 1
    fields:
    - id: cols
      label: Сколько столбцов
    - id: percol
      label: Сколько кресел в одном столбце
    prompt: В зале 40 кресел расставлены в 5 рядов поровну, прямоугольником. Впишите, сколько в зале столбцов кресел и сколько кресел в одном столбце.
    answer:
      cols: 8
      percol: 5
    hints:
    - 'Нарисуйте прямоугольник: ряды по горизонтали, столбцы по вертикали.'
    - Столбцов столько, сколько кресел в ряду; в столбце — по одному креслу из каждого ряда.
    - 'Найдите кресла в одном ряду: 40 : 5.'
    solution: |
      ### Ответ
      Столбцов 8, в одном столбце 5 кресел.
      ### Идея
      Кресел в ряду столько, сколько столбцов; в столбце — сколько рядов.
      ### Шаги
      1. В одном ряду 40 : 5 = 8 кресел — столбцов 8.
      2. В столбце по одному креслу из каждого ряда — рядов 5.
      3. В столбце 5 кресел, делить не нужно.
      ### Проверка
      8 × 5 = 40.
      ### Типичная ошибка
      В столбце пишут «8», хотя кресел в столбце столько, сколько рядов.
    feedback:
      correct: 'Верно: 8 столбцов и 5 кресел в столбце — как у прямоугольника 5 × 8.'
      wrong:
        what: Одно из чисел неверное.
        why: Число кресел в столбце находят ещё одним делением, хотя оно равно числу рядов.
        fix: Нарисуйте прямоугольник и подпишите один столбец.
        next: Повторите пример 1 раздела T05.
