  prompt: В строке «{{item}}» ряд из {{icons}} {{icons|pl:ромб,ромба,ромбов}} ◆. При ключе {{key}} предмета на ромб
    запишите общее количество.
  answer: 10
  hints:
  - 'Для случая «полные знаки в архивной строке»: прочитайте значение одного полного ромба.'
  - В случае «полные знаки в архивной строке» считайте предметы группами, а не по количеству рисунков.
  - 'Начните с данных о «полные знаки в архивной строке»: для «{{item}}» повторите группу по {{key}} предмета для
    каждого знака.'
  solution: '### Ответ

    10


    ### Идея

    Сначала прочитываем ключ, затем считаем группы для каждого полного рисунка.


    ### Шаги

    1. У «отсек Резерв» 5 полных знака.

    2. Каждый означает 2 предмета.

    3. Общий счёт равен 10.


    ### Проверка

    Обратная проверка делением групп на ключ возвращает число знаков.


    ### Типичная ошибка

    Число ромбов не является итоговым количеством, если ключ больше единицы.

    '
