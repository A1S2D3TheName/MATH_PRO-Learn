  solution: '### Ответ

    7


    ### Идея

    Два заголовка задают одну клетку; другие записи в той же строке относятся к другим столбцам.


    ### Шаги

    1. Находим строку «Пост у моста».

    2. В ней выбираем столбец «Поздняя смена».

    3. В общей клетке стоит 7.

    4. Сверяем, что значение относится к обеим нужным подписям.


    ### Проверка

    Соседнее значение относится к иному столбцу, поэтому проверка по двум подписям подтверждает выбор.


    ### Типичная ошибка

    Если прочитать только строку или только столбец, можно взять чужую клетку.

    '
