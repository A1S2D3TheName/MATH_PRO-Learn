# Входная диагностика по прямому пререквизиту num-compare.
tasks:
- id: D-01
  type: number
  role: diagnostic
  purpose: procedure
  level: 1
  outcome: num-compare/LO-01
  sections:
  - T01
  minutes: 1
  prompt: Сравните числа 13 и 17. Введите 1, если первое число больше, 2, если больше второе, и 3, если числа равны.
  answer: 2
  hints:
  - Сначала удержите порядок двух чисел так, как они записаны в вопросе.
  - Сопоставьте их величины по знакомому порядку натуральных чисел.
  - Для пары 13 и 17 определите, какое число стоит дальше при счёте, и примените код из условия.
  solution: '### Ответ

    2


    ### Идея

    Сначала сравниваются сами числа, а затем результат сравнения переводится в указанный код.


    ### Шаги

    1. Сравнение 13 и 17 показывает: второе число больше.

    2. По условию этому случаю соответствует код 2.

    3. Записываем код, а не одно из сравниваемых чисел.


    ### Проверка

    Повторно проверьте порядок чисел и соответствие выбранного случая коду.


    ### Типичная ошибка

    Не путайте код ответа с величиной числа и не меняйте местами первое и второе числа.

    '
  feedback:
    correct: 'Верно: в задании «сравнение 13 и 17» выбранные данные отвечают именно на поставленный вопрос.'
    wrong:
      what: Проверьте ход чтения данных в задании «сравнение 13 и 17».
      why: Число или вывод может относиться к другой подписи, ключу или вопросу.
      fix: Снова сопоставьте условие с таблицей или пиктограммой и проверьте каждый выбранный заголовок.
      next: Откройте раздел T01 и вернитесь к случаю «сравнение 13 и 17» после повторного чтения.
