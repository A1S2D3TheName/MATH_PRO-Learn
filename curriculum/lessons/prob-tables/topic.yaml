# Паспорт темы: поля маршрута дословно перенесены из tree.yaml.
id: prob-tables
title: "Таблицы и пиктограммы с данными"
section: prob
stage: 1
hours: 2
grade: "1–2"
prerequisites: [num-compare]
scope: >
  Только чтение готовых таблиц; частоты и средние — в prob-center.
version: "1.0.0"
summary: >
  Тема учит читать готовую таблицу по заголовкам строки и столбца, понимать условный знак
  пиктограммы и отвечать на вопрос с точной ссылкой на клетку. В углублении сверяются две
  готовые записи одних и тех же данных.

search:
  synonyms:
    - чтение таблиц с данными
    - как найти значение в таблице
    - пересечение строки и столбца
    - заголовки таблицы
    - строка и столбец таблицы
    - условный знак пиктограммы
    - что значит один значок на пиктограмме
    - таблица со значками
    - ответ по таблице с указанием клетки
    - вопрос по готовым данным
    - пиктограмма с ключом
    - найти нужную клетку таблицы
  questions:
    - Как найти нужное значение по строке и столбцу?
    - Что сообщает заголовок строки?
    - Что сообщает заголовок столбца?
    - Как прочитать значение, если известны два заголовка?
    - Как узнать число предметов по значкам и условному знаку?
    - Как прочитать половинный значок?
    - Как сослаться на клетку в ответе по таблице?
    - Как проверить, совпадают ли таблица и пиктограмма?
    - Какие вопросы можно решить по готовой таблице?

subtopics:
  - id: prob-tables/stroka-i-stolbec-zagolovki
    title: "Строка и столбец, заголовки"
    tree_ref: "Строка и столбец, заголовки"
    synonyms: [названия строк, названия столбцов, шапка таблицы]
    sections: [T01]
  - id: prob-tables/chtenie-znacheniya-iz-tablicy
    title: "Чтение значения из таблицы"
    tree_ref: "Чтение значения из таблицы"
    synonyms: [считать значение клетки, найти запись по двум названиям]
    sections: [T02]
  - id: prob-tables/piktogramma-i-ee-uslovnyy
    title: "Пиктограмма и её условный знак"
    tree_ref: "Пиктограмма и её условный знак"
    synonyms: [значки с ключом, рисунок вместо количества]
    sections: [T03]
  - id: prob-tables/vopros-po-dannym-i
    title: "Вопрос по данным и ответ со ссылкой на клетку"
    tree_ref: "Вопрос по данным и ответ со ссылкой на клетку"
    synonyms: [обоснование ответа клеткой, вопрос к готовой записи]
    sections: [T04, T05]

outcomes:
  - id: LO-01
    short: "Читать таблицу и пиктограмму"
    action: >
      Читает значение в заданной клетке или в ряду пиктограммы с известным условным знаком
      и называет соответствующие заголовки либо знак.
    conditions: >
      Дана готовая таблица или пиктограмма с подписанными категориями и ключом от одного
      до трёх предметов на значок.
    criterion: >
      Верно называет значение и показывает нужную строку вместе со столбцом либо применяет
      условный знак пиктограммы.
    level: core
    sections: [T01, T02, T03, T04]
  - id: LO-02
    short: "Сверять две записи данных"
    action: >
      Сравнивает значения одних и тех же категорий в таблице и пиктограмме, затем выбирает
      утверждение, подтверждённое обеими записями.
    conditions: >
      Даны таблица и пиктограмма с одинаковыми категориями, ключом от одного до трёх предметов
      на значок и вопросом о прямом чтении значений.
    criterion: >
      Называет совпадающую или первую различающуюся категорию и указывает обе соответствующие
      записи, не добавляя не показанные сведения.
    level: deep
    sections: [T05]

errors:
  - E-prob-tables-adjacent-cell
  - E-prob-tables-key-as-addend
  - E-prob-tables-half-as-full
  - E-prob-tables-half-omitted
