    3 прямые стороны

    ### Идея

    Стороны считают только тогда, когда весь замкнутый контур виден.

    ### Шаги

    1. Проверить запись «полный повёрнутый треугольный контур» на полноту внешней границы.
    2. Если весь контур открыт, посчитать его прямые участки; если край обрезан или часть скрыта, не достраивать её.
    3. Записать 3 прямые стороны.

    ### Проверка

    Для неполного изображения дополнительный кадр может изменить вывод; поворот полного контура сам по себе его не меняет.

    ### Типичная ошибка

    Продлить дугу или скрытую линию в воображении и записать догадку как число сторон.
