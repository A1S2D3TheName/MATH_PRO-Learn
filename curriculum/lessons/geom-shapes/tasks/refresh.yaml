  minutes: 3
  prompt: Сосчитайте прямые стороны у замкнутого контура {{shape}}.
  answer: 3
  hints:
  - Вспомните правило полного обхода замкнутой границы.
  - Считайте участки, а не угловые места или буквы в названии.
  - В пути {{shape}} отметьте каждый переход к соседней вершине.
  solution: |-
    ### Ответ

    3 прямые стороны

    ### Идея

    Сторона — один прямой участок замкнутой границы.

    ### Шаги

    1. Проследить запись пути: A → B → C → A.
    2. Сосчитать каждый переход к соседней вершине, включая последний переход обратно к A.
    3. Записать 3 прямые стороны.

    ### Проверка

    При обходе пути с другой вершины получаются те же 3 перехода.

    ### Типичная ошибка

    Не включить последний переход к началу или повторно сосчитать уже отмеченный участок.
