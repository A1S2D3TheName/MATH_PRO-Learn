# Входная диагностика проверяет только навык счёта предметов из прямого пререквизита.
tasks:
- id: D-01
  type: number
  role: diagnostic
  purpose: procedure
  level: 0
  outcome: num-counting/LO-01
  sections:
  - T01
  minutes: 1
  prompt: 'На табло два ряда точек: ● ● ● / ● ●. Сколько точек видно всего? Ответьте числом.'
  answer: 5
  hints:
  - Просмотрите верхний ряд слева направо.
  - Затем продолжите счёт на нижнем ряду, не начиная заново.
  - Отметьте, что точек расположено в 2 рядах, и пересчитайте каждую один раз.
  solution: '### Ответ

    5


    ### Идея

    Счёт отвечает на вопрос «сколько предметов видно всего».


    ### Шаги

    1. Считаем три точки в верхнем ряду.

    2. Продолжаем тем же счётом на нижнем ряду: ещё две точки.

    3. Всего получается пять точек.


    ### Проверка

    Пересчёт группами даёт 3 и 2, вместе 5.


    ### Типичная ошибка

    Если начать второй ряд снова с первого числительного, часть точек будет пропущена.'
  feedback:
    correct: 'Верно: каждый значок учтён один раз, а счёт продолжен между рядами.'
    wrong:
      what: Количество не совпало с числом видимых значков.
      why: Возможно, счёт начался заново на втором ряду или одна точка пропущена.
      fix: Поставьте мысленную отметку на каждом уже посчитанном значке.
      next: Вернитесь к навыку счёта предметов из num-counting.
- id: D-02
  type: number
  role: diagnostic
  purpose: meaning
  level: 0
  outcome: num-counting/LO-01
  sections:
  - T01
  minutes: 1
  prompt: 'На табло два ряда звёзд: ★ ★ ★ ★ / ★ ★ ★. Сколько звёзд показано на табло?'
  answer: 7
  hints:
  - Считайте видимые значки по одному, не называя их порядковые места.
  - После верхнего ряда продолжайте счёт на нижнем.
  - Проверьте, что обе группы из 2 рядов вошли в общий ответ.
  solution: '### Ответ

    7


    ### Идея

    Нужно сообщить количество значков в двух группах вместе.


    ### Шаги

    1. В верхнем ряду четыре звезды.

    2. В нижнем ряду ещё три звезды.

    3. Объединяем результаты счёта: всего семь.


    ### Проверка

    Повторный пересчёт всех семи значков подтверждает результат.


    ### Типичная ошибка

    Назвать только число значков в верхней группе — это не ответ на вопрос «сколько всего».'
  feedback:
    correct: 'Верно: учтены обе строки, и количество названо для всей панели.'
    wrong:
      what: В ответе число не соответствует всем звёздам на табло.
      why: Одна строка могла остаться без пересчёта или попасть в ответ дважды.
      fix: Считайте слева направо и переходите между рядами, продолжая счёт.
      next: Если счёт предметов вызывает затруднение, повторите num-counting.
- id: D-03
  type: number
  role: diagnostic
  purpose: procedure
  level: 0
  outcome: num-counting/LO-01
  sections:
  - T01
  minutes: 1
  prompt: 'На ленте две группы квадратных меток: ■ ■ ■ / ■ ■ ■. Сколько меток на ленте?'
  answer: 6
  hints:
  - Не считайте форму меток — каждый квадрат соответствует одному предмету.
  - Сведите две группы в один непрерывный счёт.
  - Сравните обе группы с их 2 строками, чтобы не потерять ни одну метку.
  solution: '### Ответ

    6


    ### Идея

    Считаем предметы, а не их форму или расположение.


    ### Шаги

    1. В первой группе три квадратные метки.

    2. Во второй группе также три метки.

    3. Всего на ленте шесть предметов.


    ### Проверка

    Можно посчитать все метки подряд; результат остаётся 6.


    ### Типичная ошибка

    Принять одинаковую форму нескольких меток за одну общую запись — значит не пересчитать предметы.'
  feedback:
    correct: 'Верно: форма значков не помешала пересчитать каждую метку отдельно.'
    wrong:
      what: Общее количество меток посчитано неверно.
      why: Возможно, одинаковые метки были объединены зрительно и не пересчитаны по одной.
      fix: Сосчитайте значки по порядку и переходите между группами без сброса счёта.
      next: Освежите количественный счёт предметов в num-counting.
