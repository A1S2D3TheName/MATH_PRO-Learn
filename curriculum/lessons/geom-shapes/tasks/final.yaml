# Единый контекст финальной цепочки; F-02 и F-03 зависят от F-01, F-04 — от F-03.
title: Проверка меток архивного терминала
context_id: archive-terminal
scenario: В цифровом архиве терминала нужно подписать незнакомые значки, различить предметы и изображения,
  а затем решить, где снимок даёт достаточно сведений для точной записи.
tasks:
- id: F-01
  type: match
  role: final-step
  purpose: procedure
  level: 2
  outcome: LO-01
  sections:
  - T01
  - T03
  minutes: 2
  prompt: В архивном терминале сопоставьте 3 новых контура кнопок с их названиями перед вводом карточек.
  answer:
  - left: a
    right: circle
  - left: b
    right: rectangle
  - left: c
    right: triangle
  hints:
  - Сравните внешний контур каждого знака с известными названиями.
  - Положение кнопки на экране не влияет на число участков.
  - В форме 3 кнопки; запишите по одному названию для каждого контура.
  solution: '### Ответ

    a → круг; b → прямоугольник; c → треугольник


    ### Идея

    Сначала инвентаризируем контуры, чтобы последующие записи в каталоге ссылались на них.


    ### Шаги

    1. A имеет округлую границу — это круг.

    2. B имеет вытянутый четырёхсторонний контур — прямоугольник.

    3. C замыкается тремя прямыми участками — треугольник.


    ### Проверка

    Каждый знак после поворота экрана сопоставляется с тем же контуром.


    ### Типичная ошибка

    Подменить название по месту кнопки, а не по её рисунку.'
  feedback:
    correct: 'Верно: исходные три значка получили подписи для дальнейшей проверки.'
    wrong:
      what: Хотя бы одна карточка оказалась не на своём месте.
      why: Один из контуров сопоставлен с подписью другого.
      fix: Пересчитайте прямые участки и проверьте округлую линию.
      next: Перечитайте T01 и T03.
  left:
  - id: a
    text: 'Кнопка A: ◯'
  - id: b
    text: 'Кнопка B: ▯'
  - id: c
    text: 'Кнопка C: △'
  right:
  - id: circle
    text: круг
  - id: rectangle
    text: прямоугольник
  - id: triangle
    text: треугольник
  - id: square
    text: квадрат
  depends_on: []
- id: F-02
  type: match
  role: final-step
  purpose: meaning
  level: 2
  outcome: LO-02
  sections:
  - T02
  - T04
  minutes: 2
  prompt: 'После шага F-01 заполните архивные 3 записи: сопоставьте каждую с изображением или физическим предметом.'
  answer:
  - left: a
    right: photo
  - left: b
    right: die
  - left: c
    right: mark
  hints:
  - Сверьте, о каком слое архива говорит каждая строка.
  - Не смешивайте снимок с вещью за витриной и метку с биркой.
  - Обработайте все 3 записи после того, как F-01 определил знаки интерфейса.
  solution: '### Ответ

    a → плоское изображение мяча, похожего на шар; b → физический предмет, похожий на куб; c → плоский рисунок
    круга


    ### Идея

    Для точной инвентаризации нужно различить запись на экране, предмет и бумажную метку.


    ### Шаги

    1. Снимок мяча остаётся плоским изображением.

    2. Игральная кость в витрине — физический предмет, похожий на куб.

    3. На бирке напечатан плоский круглый рисунок.


    ### Проверка

    Если архивную картинку убрать, предмет в витрине останется; значит, это разные записи.


    ### Типичная ошибка

    Назвать фотографию мячом, а не изображением мяча.'
  feedback:
    correct: 'Верно: три записи сохранены как разные типы объектов.'
    wrong:
      what: Хотя бы одна карточка оказалась не на своём месте.
      why: Содержимое экрана и предмет перед глазами перепутаны.
      fix: Найдите в каждой строке слова «снимок», «в витрине» или «метка».
      next: Вернитесь к различению в T02 и T04.
  left:
  - id: a
    text: Снимок мяча на экране терминала
  - id: b
    text: Игральная кость в закрытой витрине
  - id: c
    text: Круглая метка на бумажной бирке
  right:
  - id: photo
    text: плоское изображение мяча, похожего на шар
  - id: die
    text: физический предмет, похожий на куб
  - id: mark
    text: плоский рисунок круга
  - id: ball
    text: физический предмет, похожий на шар
  depends_on:
  - F-01
- id: F-03
  type: table-fill
  role: final-step
  purpose: meaning
  level: 3
  outcome: LO-03
  sections:
  - T05
  - T06
  minutes: 2
  prompt: 'После F-01 проверьте 3 снимка архива: заполните вывод по видимому контуру каждого.'
  answer:
  - r: 0
    c: 1
    value: треугольник
  - r: 1
    c: 1
    value: данных недостаточно
  - r: 2
    c: 1
    value: данных недостаточно
  hints:
  - Проверьте, замыкается ли граница в каждом снимке.
  - Две последние записи скрывают часть контура.
  - Среди 3 кадров только первый показывает полный внешний контур.
  solution: '### Ответ

    Вывод должен соответствовать объёму видимых признаков, а не ожидаемому ярлыку.


    ### Идея

    Полный контур и неполный фрагмент дают разный объём оснований для точного имени.


    ### Шаги

    1. В первом кадре полный повёрнутый контур имеет три стороны.

    2. Во втором видна только дуга, которую можно продолжить разными способами.

    3. В третьем закрытые линии не показывают, как заканчивается граница.


    ### Проверка

    Открытие полного кадра или снятие карточки даст новые данные для двух неполных записей.


    ### Типичная ошибка

    Назвать фигуру по дуге или двум линиям, продолжение которых не видно.'
  feedback:
    correct: 'Верно: выводы отделяют полный контур от двух неполных снимков.'
    wrong:
      what: Одна или несколько пустых клеток заполнены неверно.
      why: Предположение о скрытом продолжении принято за наблюдаемый факт.
      fix: Отметьте границу кадра и перечислите, чего именно не видно.
      next: Сверьте критерий достаточности в T05.
  table:
    columns:
    - Снимок
    - Обоснованный вывод
    rows:
    - - Полный перевёрнутый треугольный контур
      - null
    - - Одна дуга обрезана краем кадра
      - null
    - - Две линии, остальное закрыто карточкой
      - null
  shape:
  - 3
  - 2
  depends_on:
  - F-01
- id: F-04
  type: order
  role: final-step
  purpose: transfer
  level: 3
  outcome: LO-03
  sections:
  - T05
  - T06
  minutes: 2
  prompt: Используя проверку снимков F-03, расположите 4 действия для публикации итоговой архивной записи.
  answer:
  - object
  - evidence
  - sufficiency
  - publish
  hints:
  - Запрос в F-03 уже показал, что часть кадров неполна.
  - До публикации проверьте и объект записи, и достаточность снимка.
  - Расположите 4 действия так, чтобы публикация следовала после проверки.
  solution: '### Ответ

    Уточнить, описывается ли знак, снимок или предмет → Перечислить видимые части и скрытые места → Решить,
    достаточно ли сведений для названия → Записать название или запросить полный кадр


    ### Идея

    Финальная запись должна сообщать только то, что установлено по снимку.


    ### Шаги

    1. Сначала уточняем объект вопроса.

    2. Потом перечисляем наблюдаемые и скрытые части.

    3. Оцениваем достаточность и лишь затем записываем название или запрашиваем кадр.


    ### Проверка

    Для полного контура публикуем название; для неопределённого фрагмента просим новые данные.


    ### Типичная ошибка

    Публиковать предполагаемую форму до проверки скрытых частей.'
  feedback:
    correct: 'Верно: последовательность не превращает предположение в архивный факт.'
    wrong:
      what: Действия расположены не в рабочей последовательности.
      why: Решение принято до оценки полноты сведений.
      fix: Поставьте проверку достаточности перед итоговой записью.
      next: Сопоставьте шаги с методом T05 и переносом T06.
  items:
  - id: object
    text: Уточнить, описывается ли знак, снимок или предмет
  - id: evidence
    text: Перечислить видимые части и скрытые места
  - id: sufficiency
    text: Решить, достаточно ли сведений для названия
  - id: publish
    text: Записать название или запросить полный кадр
  depends_on:
  - F-03
