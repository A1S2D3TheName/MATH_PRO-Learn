  solution: '### Ответ

    Выбрать заметное угловое место начала → Отметить первый прямой участок границы → Продолжать по соседним участкам,
    не повторяя отметки → Остановиться при возвращении к началу


    ### Идея

    Инструкция повторяет один полный обход замкнутой границы.


    ### Шаги

    1. Сначала обозначаем точку старта.

    2. Затем отмечаем первый участок.

    3. Продолжаем обход и заканчиваем при возвращении к началу.


    ### Проверка

    У остановки есть ясный критерий: вернулись к исходному месту.


    ### Типичная ошибка

    Начать считать до выбора точки старта или остановиться до замыкания контура.'
