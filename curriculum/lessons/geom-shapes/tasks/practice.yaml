# Практика: 2 warmup, 6 supported, 15 independent; в каждой задаче свои подсказки и разбор.
tasks:
- id: P-01
  type: match
  role: warmup
  purpose: procedure
  level: 0
  outcome: LO-01
  sections:
  - T01
  minutes: 1
  prompt: В каталоге пиктограмм сопоставьте 3 контура A, B и C с названиями фигур.
  answer:
  - left: a
    right: triangle
  - left: b
    right: circle
  - left: c
    right: square
  hints:
  - Сначала сравните внешний контур каждого знака с названиями справа.
  - Обратите внимание на прямые участки и округлую линию.
  - Сверьте все 3 значка по внешней границе, а не по их месту на экране.
  solution: '### Ответ

    a → треугольник; b → круг; c → квадрат


    ### Идея

    Название связывается с контуром, а не с порядком карточек.


    ### Шаги

    1. У A три прямых участка, поэтому подходит название треугольника.

    2. У B округлая линия без угловых мест, поэтому это круг.

    3. У C четыре равных на вид стороны, поэтому на этой карточке это квадрат.


    ### Проверка

    После перестановки карточек контур каждого значка остаётся прежним.


    ### Типичная ошибка

    Выбрать прямоугольник для любого контура с четырьмя сторонами, не сравнив силуэт.'
  feedback:
    correct: 'Верно: три знакомых контура соотнесены с тремя названиями.'
    wrong:
      what: Хотя бы одна карточка оказалась не на своём месте.
      why: Сравнение выполнено только по цвету или месту значка.
      fix: Проследите внешний контур отдельно для A, B и C.
      next: Перечитайте T01 и сравните названия с силуэтами.
  left:
  - id: a
    text: 'Значок A: △'
  - id: b
    text: 'Значок B: ○'
  - id: c
    text: 'Значок C: □'
  right:
  - id: triangle
    text: треугольник
  - id: circle
    text: круг
  - id: square
    text: квадрат
  - id: rectangle
    text: прямоугольник
- id: P-02
  type: match
  role: warmup
  purpose: meaning
  level: 0
  outcome: LO-02
  sections:
  - T02
  minutes: 1
  prompt: 'Сопоставьте 3 записи на упаковке с тем, что спрашивают: плоскую картинку или физическую вещь.'
  answer:
  - left: a
    right: image-ball
  - left: b
    right: solid-ball
  - left: c
    right: solid-cube
  hints:
  - Найдите в каждой записи слова, указывающие на рисунок или настоящую вещь.
  - Фотография и наклейка относятся к изображению; предмет в руке — физическая вещь.
  - У записи с 3 объектами определите, к какому носителю относится каждый запрос.
  solution: '### Ответ

    a → плоское изображение мяча; b → объёмный предмет, похожий на шар; c → объёмный предмет, похожий на куб


    ### Идея

    Нужно отличить картинку от показанного на ней или лежащего рядом предмета.


    ### Шаги

    1. Наклейка содержит плоский рисунок мяча.

    2. В руке находится настоящий предмет, похожий на шар.

    3. Игральная кость — физический предмет, похожий на куб; рисунок куба остаётся лишним вариантом.


    ### Проверка

    Если снять наклейку, мяч в руке останется; это разные объекты.


    ### Типичная ошибка

    Назвать рисунок мяча самим мячом и тем самым смешать изображение с предметом.'
  feedback:
    correct: 'Верно: запись о рисунке отделена от строк о реальных вещах.'
    wrong:
      what: Хотя бы одна карточка оказалась не на своём месте.
      why: Физическая вещь и её фотография перепутаны.
      fix: Спросите себя, можно ли запись взять в руку или только увидеть на странице.
      next: Для различия изображения и вещи перечитайте T02.
  left:
  - id: a
    text: Рисунок мяча на наклейке
  - id: b
    text: Настоящий мяч в руке
  - id: c
    text: Игральная кость в коробке
  right:
  - id: image-ball
    text: плоское изображение мяча
  - id: solid-ball
    text: объёмный предмет, похожий на шар
  - id: solid-cube
    text: объёмный предмет, похожий на куб
  - id: image-cube
    text: плоское изображение куба
  errors:
  - E-geom-shapes-flat-object-swap
- id: P-03
  type: number
  role: supported
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T03
  minutes: 1
  prompt: Сколько прямых сторон у схематического контура {{pattern}}?
  answer: 3
  hints:
  - 'Сначала определите, о чём спрашивают: о прямых участках границы.'
  - Ведите взгляд по замкнутой линии и мысленно ставьте отметку на каждом участке.
  - Начните у вершины контура {{pattern}} и остановитесь при возвращении к началу.
  solution: '### Ответ

    3


    ### Идея

    Число сторон — число прямых участков замкнутого контура.


    ### Шаги

    1. У △ три прямых участка границы.

    2. Отмечаем каждый участок один раз и замыкаем обход.


    ### Проверка

    Повторный обход должен дать то же число прямых участков.


    ### Типичная ошибка

    Можно принять вершины за стороны или повторить стартовый отрезок.'
  feedback:
    correct: 'Хорошо: число получено обходом контура, а не по привычному положению значка.'
    wrong:
      what: Введено число, не равное пересчитанному результату.
      why: Возможно, пересчитаны угловые места, а не прямые участки.
      fix: Разделите вопрос «сколько сторон?» и «сколько вершин?» перед подсчётом.
      next: Вернитесь к примеру с обходом в T03.
  variants:
  - params:
      pattern: △
    answer: 3
    solution: '### Ответ

      3


      ### Идея

      Число сторон — число прямых участков замкнутого контура.


      ### Шаги

      1. У △ три прямых участка границы.

      2. Отмечаем каждый участок один раз и замыкаем обход.


      ### Проверка

      Повторный обход должен дать то же число прямых участков.


      ### Типичная ошибка

      Можно принять вершины за стороны или повторить стартовый отрезок.'
  - params:
      pattern: □
    answer: 4
    solution: '### Ответ

      4


      ### Идея

      Число сторон — число прямых участков замкнутого контура.


      ### Шаги

      1. У □ четыре прямых участка границы.

      2. Отмечаем каждый участок один раз и замыкаем обход.


      ### Проверка

      Повторный обход должен дать то же число прямых участков.


      ### Типичная ошибка

      Можно принять вершины за стороны или повторить стартовый отрезок.'
- id: P-04
  type: match
  role: supported
  purpose: meaning
  level: 1
  outcome: LO-01
  sections:
  - T03
  minutes: 1
  prompt: Соедините 2 подписи на схеме с частью контура, которую они называют.
  answer:
  - left: a
    right: side
  - left: b
    right: vertex
  hints:
  - Одна подпись говорит об участке границы, другая — о точке встречи.
  - 'Найдите, где именно ставится отметка: на линии или рядом с её углом.'
  - Сопоставьте обе подписи из 2 карточек с разными частями рисунка.
  solution: '### Ответ

    a → сторона — прямой участок контура; b → вершина — место встречи сторон


    ### Идея

    Сторона и вершина обозначают разные объекты на одном контуре.


    ### Шаги

    1. Прямой участок — это сторона.

    2. Место встречи соседних сторон — вершина.


    ### Проверка

    В квадрате стороны отмечают на линиях, а вершины — в угловых местах.


    ### Типичная ошибка

    Назвать залитую внутреннюю область вершиной или стороной.'
  feedback:
    correct: 'Верно: линия и место встречи получили разные подписи.'
    wrong:
      what: Хотя бы одна карточка оказалась не на своём месте.
      why: Линейный участок и угловое место смешаны.
      fix: Покажите пальцем сначала на отрезок, затем на место его встречи с соседним.
      next: Перечитайте определения в T03.
  left:
  - id: a
    text: Прямой участок между соседними угловыми местами
  - id: b
    text: Место встречи двух сторон
  right:
  - id: side
    text: сторона — прямой участок контура
  - id: vertex
    text: вершина — место встречи сторон
  - id: fill
    text: закрашенная область внутри рисунка
- id: P-05
  type: match
  role: supported
  purpose: procedure
  level: 1
  outcome: LO-02
  sections:
  - T02
  minutes: 1
  prompt: Сопоставьте 3 карточки дорожного набора с описанием изображения или предмета.
  answer:
  - left: a
    right: flat-ball
  - left: b
    right: solid-ball
  - left: c
    right: flat-cube
  hints:
  - Прочитайте всю формулировку каждой карточки, а не только слово «мяч».
  - Фото и значок — плоские записи; мяч на полке — физическая вещь.
  - 'В наборе 3 карточки: отметьте носитель и затем подходящую знакомую форму.'
  solution: '### Ответ

    a → плоское изображение мяча, похожего на шар; b → объёмная вещь, похожая на шар; c → плоское изображение куба


    ### Идея

    Сначала классифицируем запись, затем связываем её с кубом или шаром.


    ### Шаги

    1. Фотография мяча — плоское изображение предмета, похожего на шар.

    2. Мяч на полке — сама объёмная вещь.

    3. Значок кости — плоское изображение куба; объёмный куб остаётся лишним.


    ### Проверка

    Сравните вопрос «что изображено?» с вопросом «что лежит на полке?».


    ### Типичная ошибка

    Считать пиктограмму куба реальной игральной костью.'
  feedback:
    correct: 'Верно: у каждой строки учтено, изображение это или вещь.'
    wrong:
      what: Хотя бы одна карточка оказалась не на своём месте.
      why: Слова о форме заслонили указание на носитель.
      fix: Найдите в записи признаки фото, значка или настоящего предмета.
      next: Сверьте примеры с таблицей T02.
  left:
  - id: a
    text: Фотография мяча на странице
  - id: b
    text: Настоящий мяч на полке
  - id: c
    text: Плоский значок игральной кости
  right:
  - id: flat-ball
    text: плоское изображение мяча, похожего на шар
  - id: solid-ball
    text: объёмная вещь, похожая на шар
  - id: flat-cube
    text: плоское изображение куба
  - id: solid-cube
    text: объёмная вещь, похожая на куб
  errors:
  - E-geom-shapes-flat-object-swap
- id: P-06
  type: table-fill
  role: supported
  purpose: method
  level: 2
  outcome: LO-02
  sections:
  - T02
  minutes: 2
  prompt: В этих 2 строках отметьте, спрашивают ли о плоской записи или о физической вещи.
  answer:
  - r: 0
    c: 1
    value: плоское изображение
  - r: 1
    c: 1
    value: физический предмет
  hints:
  - Подчеркните существительное, к которому относится запрос.
  - Отделите фотографию на экране от вещи, которую можно взять в ладонь.
  - 'Используйте 2 столбца рассуждения: носитель записи и предмет вопроса.'
  solution: '### Ответ

    Фотография относится к экранному изображению; кость в ладони — к физической вещи.


    ### Идея

    Метод — сначала решить, к какому объекту относится вопрос, а затем назвать его.


    ### Шаги

    1. В первой строке вопрос о фотографии, то есть о плоском изображении.

    2. Во второй строке назван предмет в ладони, поэтому выбираем физическую вещь.


    ### Проверка

    Если убрать экран, фотография исчезнет; игральная кость в ладони остаётся.


    ### Типичная ошибка

    Принять слово «куб» за достаточный ответ и пропустить, о чём именно вопрос.'
  feedback:
    correct: 'Верно: обе строки классифицированы по объекту, который назван.'
    wrong:
      what: Одна или несколько пустых клеток заполнены неверно.
      why: Слова «фотография» и «игральная кость» получили одинаковое описание.
      fix: Сначала найдите объект вопроса, затем подпишите его тип.
      next: Вернитесь к шагам выбора объекта в T02.
  table:
    columns:
    - Запись
    - О чём спрашивают?
    rows:
    - - Фотография куба на экране
      - null
    - - Игральная кость в ладони
      - null
  shape:
  - 2
  - 2
- id: P-07
  type: match
  role: supported
  purpose: procedure
  level: 2
  outcome: LO-03
  sections:
  - T06
  minutes: 3
  prompt: На повёрнутой навигационной панели сопоставьте 3 полных контура с названиями.
  answer:
  - left: a
    right: triangle
  - left: b
    right: rectangle
  - left: c
    right: circle
  hints:
  - Положение значка не заменяет чтение его внешнего контура.
  - Сравните число прямых участков и наличие округлой линии.
  - Просмотрите все 3 полных контура, не ориентируясь на верх страницы.
  solution: '### Ответ

    a → треугольник; b → прямоугольник; c → круг


    ### Идея

    Повёрнутый контур сравнивают с знакомой фигурой по границе.


    ### Шаги

    1. У знака A три прямых участка, значит, это треугольник.

    2. У знака B вытянутый четырёхсторонний контур — прямоугольник.

    3. У знака C линия округлая — это круг.


    ### Проверка

    Мысленно поверните каждый знак обратно; названия останутся согласованными с контурами.


    ### Типичная ошибка

    Назвать перевёрнутый треугольник другой фигурой из-за направления вершины.'
  feedback:
    correct: 'Верно: поворот страницы не изменил выбранные названия.'
    wrong:
      what: Хотя бы одна карточка оказалась не на своём месте.
      why: Ориентация значков принята за признак вида фигуры.
      fix: На мгновение представьте знак повёрнутым и снова проследите границу.
      next: Повторите проверку полного контура в T06.
  left:
  - id: a
    text: 'Знак A: ▽, вершина направлена вниз'
  - id: b
    text: 'Знак B: ▯, длинная сторона стоит вертикально'
  - id: c
    text: 'Знак C: ◯, расположен у края панели'
  right:
  - id: triangle
    text: треугольник
  - id: rectangle
    text: прямоугольник
  - id: circle
    text: круг
  - id: square
    text: квадрат
- id: P-08
  type: order
  role: supported
  purpose: method
  level: 2
  outcome: LO-03
  sections:
  - T05
  - T06
  minutes: 3
  prompt: Расположите 4 действия проверяющего, если часть знака на снимке закрыта.
  answer:
  - scope
  - contour
  - evidence
  - report
  hints:
  - Начните с объекта вопроса, а не с предположения о названии.
  - Проверка границы нужна до выбора карточки с формой.
  - 'Используйте все 4 действия: от формулировки запроса до осторожного вывода.'
  solution: '### Ответ

    Уточнить, спрашивают о знаке, изображении или вещи → Осмотреть видимую границу рисунка → Проверить, закрыта
    ли важная часть контура → Назвать форму или отметить недостаток данных


    ### Идея

    Порядок сохраняет различие между тем, о чём спрашивают, и тем, что видно.


    ### Шаги

    1. Сначала устанавливаем объект вопроса.

    2. Затем осматриваем видимую границу.

    3. Проверяем полноту признаков и выбираем обоснованный ответ.


    ### Проверка

    Если участок закрыт, финальная отметка должна сообщать о недостатке данных.


    ### Типичная ошибка

    Назвать форму до того, как проверено, достаточно ли видимого контура.'
  feedback:
    correct: 'Верно: сначала проверен объект, затем изображение и достаточность признаков.'
    wrong:
      what: Действия расположены не в рабочей последовательности.
      why: Решение принято до проверки закрытого участка.
      fix: Поставьте проверку доступных признаков перед выбором названия.
      next: Сверьте порядок с разделом T05.
  items:
  - id: scope
    text: Уточнить, спрашивают о знаке, изображении или вещи
  - id: contour
    text: Осмотреть видимую границу рисунка
  - id: evidence
    text: Проверить, закрыта ли важная часть контура
  - id: report
    text: Назвать форму или отметить недостаток данных
- id: P-09
  type: choice
  role: independent
  purpose: procedure
  level: 2
  outcome: LO-01
  sections:
  - T03
  minutes: 2
  prompt: На схеме отмечены {{n}} угловых места треугольного контура; пройдите по границе от отметки до возвращения. Сколько прямых сторон увидите?
  answer: a
  hints:
  - Начните с углового места и двигайтесь вдоль внешней границы.
  - Отмечайте прямые участки, а не точки на их концах.
  - Сделайте 1 полный обход контура и остановитесь при возвращении к старту.
  solution: '### Ответ

    3


    ### Идея

    Стороны — прямые участки внешнего контура; здесь число участков n = {{n}}.


    ### Шаги

    1. Начать у углового места и отмечать прямой участок.

    2. Продолжать до первого возвращения к старту.

    3. Записать число отмеченных участков: 3.


    ### Проверка

    Начав с другой вершины, получим те же три участка.


    ### Типичная ошибка

    Остановиться до замыкающей стороны даёт 2; повторный учёт старта даёт 4.'
  feedback:
    correct: 'Верно: обойдены три прямые стороны, старт не добавлен повторно.'
    wrong:
