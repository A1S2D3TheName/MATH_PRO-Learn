  - id: EA-02
    type: number
    role: exam
    purpose: meaning
    level: 1
    outcome: LO-01
    sections:
    - T03
    minutes: 2
    prompt: Маршрутная метка описана как M—N—P—Q—M; каждый штрих между соседями — сторона. Сколько сторон замыкает
      путь?
    answer: 4
    hints:
    - Сначала найдите, какие пары букв соединены штрихом.
    - Последняя связь возвращает маршрут к первой метке.
    - Учтите 1 замыкающий штрих и не записывайте повторную букву как сторону.
    solution: '### Ответ

      4


      ### Идея

      Число сторон — число звеньев между соседними отметками.


      ### Шаги

      1. Считаем M—N, N—P и P—Q.

      2. Учитываем Q—M как последний участок.

      3. Получаем 4 стороны.


      ### Проверка

      В замкнутом пути начало и конец совпали, но нового участка после замыкания нет.


      ### Типичная ошибка

      Не включить Q—M или посчитать повтор M отдельной стороной.'
    feedback:
      correct: 'Верно: замыкающий переход учтён один раз.'
      wrong:
        what: Число не совпало с заданием.
        why: Путь остановлен до возврата к началу или стартовая метка добавлена как ребро.
        fix: Перечислите соединения, а не буквы пути.
        next: Сверьте обход с T03.
    points: 1
