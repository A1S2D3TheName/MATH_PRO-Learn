    outcome: LO-01
    sections:
    - T03
    minutes: 2
    prompt: Расположите 4 действия для пересчёта прямых участков у таблички формы.
    answer:
    - start
    - mark
    - follow
    - finish
    hints:
    - Сначала нужен старт, иначе отметки трудно контролировать.
    - Обход должен следовать вдоль внешней границы.
    - Проверьте все 4 действия; остановка идёт после возврата.
    solution: '### Ответ

      Выбрать угловое место старта → Отметить первый участок → Продолжать к соседним участкам → Остановиться
      при возвращении


      ### Идея

      Один полный обход даёт систематический счёт.


      ### Шаги

      1. Выбрать старт.

      2. Отметить первый прямой отрезок.

      3. Продолжать и завершить при возврате.


      ### Проверка

      При завершении уже учтён каждый участок контура.


      ### Типичная ошибка

      Остановиться раньше замыкания или начать без опорной точки.'
    feedback:
      correct: 'Верно: порядок задаёт полный контролируемый обход.'
      wrong:
        what: Действия расположены не в рабочей последовательности.
        why: Порядок не задаёт ясного старта или правила остановки.
        fix: Поставьте возвращение к началу последним.
        next: Перечитайте T03.
    items:
