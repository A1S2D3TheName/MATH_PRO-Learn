      Кадр на экране и реальная вещь рядом — разные объекты.


      ### Идея

      Монитор содержит плоское изображение; кость на столе — физический предмет.


      ### Шаги

      1. Первая запись явно называет кадр.

      2. Вторая называет вещь на столе.


      ### Проверка

      Если выключить монитор, кость на столе остаётся.


      ### Типичная ошибка

      Считать изображение на экране самой вещью.'
    feedback:
