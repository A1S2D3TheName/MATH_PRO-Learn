  - id: EA-01
    type: match
    role: exam
    purpose: procedure
    level: 1
    outcome: LO-01
    sections:
    - T01
    minutes: 2
    prompt: На панели служебного входа сопоставьте 3 значка с названиями для звуковых подсказок.
    answer:
    - left: a
      right: rectangle
    - left: b
      right: triangle
    - left: c
      right: circle
    hints:
    - Сравните контур, не цвет таблички.
    - 'Знак A вытянут: у него четыре прямых участка, но стороны разной длины.'
    - 'Знак B повёрнут вершиной вниз: поворот не меняет название.'
    solution: '### Ответ


      a → прямоугольник; b → треугольник; c → круг



      ### Идея


      Звуковая подсказка должна называть именно изображённый контур, а не рамку панели или поворот знака.



      ### Шаги


      1. A имеет четыре прямых участка и вытянут — прямоугольник.


      2. B имеет три прямых участка; поворот вершиной вниз его не меняет — треугольник.


      3. C — округлый контур без углов — круг.



      ### Проверка


      Если закрыть названия, контур всё ещё узнаётся по своим частям.



      ### Типичная ошибка


      Принять прямоугольную рамку панели за контур самого значка.'
    feedback:
      correct: 'Верно: три системных значка получили разные и подходящие названия.'
      wrong:
        what: Хотя бы одна карточка оказалась не на своём месте.
        why: Внимание переключено с внутреннего знака на рамку или расположение.
        fix: Смотрите на границу самого символа, не на корпус панели.
        next: Повторите распознавание в T01.
    left:
    - id: a
      text: 'Знак A: ▭'
    - id: b
      text: 'Знак B: ▽'
    - id: c
      text: 'Знак C: ◯'
    right:
