    solution: '### Ответ

      Уточнить, знак или физический указатель в вопросе → Отделить поворот панели от вида контура → Сравнить
      видимую границу со знакомой фигурой → Назвать фигуру или запросить более ясный снимок


      ### Идея

      Новый интерфейс требует отделить контекст от формы.


      ### Шаги

      1. Уточнить предмет вопроса.

      2. Проверить, не мешает ли поворот.

      3. Сравнить границу и сформулировать ответ.


      ### Проверка

      Если контур закрыт, следующий корректный шаг — попросить лучший снимок.


      ### Типичная ошибка

      Называть фигуру до того, как найден объект вопроса.'
