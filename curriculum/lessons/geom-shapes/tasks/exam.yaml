      Колпак — физический предмет, похожий на конус; банка — физический предмет, похожий на цилиндр.



      ### Идея


      Форма вещи определяется её частями, а не случайным видом сбоку.



      ### Шаги


      1. У колпака круглое основание и острие — конус.


      2. У банки два круглых конца и ровный бок — цилиндр.



      ### Проверка


      Колпак катится по кругу вокруг острия, банка на боку катится по прямой.



      ### Типичная ошибка


      Назвать банку конусом из-за широкого донышка или колпак цилиндром из-за круглого основания.'
