id: geom-shapes
title: "Фигуры вокруг нас"
section: geom
stage: 1
hours: 2
grade: "1–2"
prerequisites: [num-counting]
scope: >
  Узнавание формы на глаз и её название; свойства фигур, измерения и доказательства — в
  geom-basic-shapes и дальше.
version: "1.0.0"
summary: >
  Узнавание плоских фигур связывается со счётом сторон и вершин, изображениями и формой знакомых
  предметов. На неоднозначном рисунке ученик отделяет обоснованный вывод от догадки.

search:
  synonyms:
    - плоские фигуры
    - геометрические фигуры вокруг нас
    - треугольник и круг
    - квадрат и прямоугольник
    - куб и шар
    - объёмные формы предметов
    - стороны фигуры
    - углы и вершины на рисунке
    - подсчёт сторон контура
    - узнавание фигур по контуру
    - форма знакомого предмета
    - рисунок фигуры и сам предмет
    - повёрнутые геометрические значки
  questions:
    - Как отличить плоский рисунок от настоящего предмета?
    - Как узнать треугольник, если он повёрнут?
    - Как назвать круглую фигуру на экране?
    - Как посчитать стороны замкнутого контура?
    - Как отличить сторону от вершины на рисунке?
    - Как соотнести мяч и игральную кость с их формами?
    - Как понять, что рисунка недостаточно для точного названия?
    - Как не посчитать одну сторону дважды при обходе контура?

subtopics:
  - id: geom-shapes/treugolnik-pryamougolnik-kvadrat-krug
    title: "Треугольник, прямоугольник, квадрат, круг"
    tree_ref: "Треугольник, прямоугольник, квадрат, круг"
    synonyms: [основные плоские фигуры, силуэты знакомых фигур]
    sections: [T01, T05, T06]
  - id: geom-shapes/kub-shar-i-drugie
    title: "Куб, шар и другие объёмные формы"
    tree_ref: "Куб, шар и другие объёмные формы"
    synonyms: [объёмные предметы, кубическая и шарообразная форма]
    sections: [T02, T06]
  - id: geom-shapes/storony-ugly-vershiny-na
    title: "Стороны, углы, вершины на рисунке"
    tree_ref: "Стороны, углы, вершины на рисунке"
    synonyms: [счёт сторон и вершин, угловые места контура]
    sections: [T03, T05, T06]
  - id: geom-shapes/uznavanie-formy-v-predmete
    title: "Узнавание формы в предмете"
    tree_ref: "Узнавание формы в предмете"
    synonyms: [предметы знакомой формы, форма предмета на изображении]
    sections: [T04, T05, T06]

outcomes:
  - id: LO-01
    short: "Распознавать знакомые фигуры"
    action: >
      Называет плоские фигуры и пересчитывает стороны и вершины их схематических контуров.
    conditions: >
      На рисунке показан треугольник, прямоугольник, квадрат, круг или замкнутый контур с большим числом прямых
      участков; измерительные инструменты и доказательство свойств не требуются.
    criterion: >
      Называет фигуру и получает число сторон и вершин одним обходом контура, не пропуская
      замыкающий участок и не считая стартовую отметку повторно.
    level: core
    sections: [T01, T03]
  - id: LO-02
    short: "Различать рисунок и предмет"
    action: >
      Различает плоское изображение, показанную на нём форму и сам объёмный предмет; соотносит
      знакомый предмет с наиболее похожей знакомой формой.
    conditions: >
      Вопрос явно относится к знаку на странице, изображённой форме либо к физическому предмету;
      знакомые примеры включают шар и куб.
    criterion: >
      Даёт ответ об объекте, который назван в вопросе, и не подменяет изображение предметом или
      форму предмета его фотографией.
    level: standard
    sections: [T02, T04]
  - id: LO-03
    short: "Проверять сложное изображение"
    action: >
      Проверяет узнавание на повёрнутых, схематичных или частично закрытых изображениях и отмечает,
      когда видимых данных недостаточно для точного названия.
    conditions: >
      Контур может быть повёрнут, стилизован, частично перекрыт или помещён в новый контекст;
      измерение и доказательство не требуются.
    criterion: >
      Верно называет форму при достаточных видимых признаках и выбирает «данных недостаточно»,
      если изображение не позволяет надёжно различить варианты.
    level: deep
    sections: [T05, T06]

errors:
  - E-geom-shapes-missing-closing-side
  - E-geom-shapes-repeat-start-side
  - E-geom-shapes-count-ends-as-sides
  - E-geom-shapes-flat-object-swap
  - E-geom-shapes-guesses-partial-outline
