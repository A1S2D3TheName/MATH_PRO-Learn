# Паспорт темы (STANDARD.md §3). Поля section/stage/hours/grade/prerequisites/scope скопированы из
# tree.yaml дословно (правило 6).
#
# Правило 152: оба прямых пререквизита работают в теории — `num-mult-properties` в T01 (компенсация
# при умножении переносится на сложение и вычитание) и T02 (умножение суммы на число ↔ прибавление
# по разрядам); `num-rounding` в T02 (ближайшее круглое число) и T03 (прикидка и оценки суммы
# известны, новое — оценки разности и выбор направления округления).
# Правило 153: подтемы дерева покрыты outcome уровня core (LO-01) и standard (LO-02); deep-outcome
# LO-03 только расширяет приёмы (T05).
id: num-mental-arithmetic
title: "Устное сложение и вычитание: приёмы и прикидка"
section: num
stage: 1
hours: 3
grade: "2–4"
prerequisites: [num-mult-properties, num-rounding]
scope: >
  Устные приёмы сложения и вычитания; приёмы умножения и прикидка произведения — в num-mult-properties.
version: "1.0.0"
summary: >
  Устные приёмы сложения и вычитания чисел до 1000: разложение слагаемого, компенсация,
  прибавление и вычитание по частям, дополнение до круглого числа. До точного счёта ответ
  прикидывают и зажимают оценками сверху и снизу, после счёта проверяют обратным действием.

search:
  synonyms:
    - устный счёт
    - сложение в уме
    - вычитание в уме
    - приёмы устного счёта
    - быстрый счёт без калькулятора
    - компенсация при устном счёте
    - разложение слагаемого
    - прибавление по частям
    - дополнение до круглого числа
    - прикидка суммы и разности
    - оценка сверху и снизу
    - проверка вычитания сложением
    - как посчитать сдачу в уме
  questions:
    - Как быстро сложить в уме 47 и 29?
    - Как вычесть в уме число, близкое к круглому?
    - Что такое компенсация при устном счёте?
    - Почему при вычитании поправку прибавляют?
    - Как прибавлять по частям трёхзначные числа?
    - Как посчитать сдачу с 1000 рублей в уме?
    - Как оценить разность сверху и снизу?
    - Можно ли проверить вычитание сложением?
    - Как понять, что ответ неправдоподобен, не пересчитывая?
    - Как без точного сложения понять, хватит ли денег на покупку?

subtopics:
  - id: num-mental-arithmetic/decompose-compensate
    title: Разложение слагаемого и компенсация
    tree_ref: Разложение слагаемого и компенсация
    synonyms: [дополнить до десятка, округлить слагаемое и сделать поправку, сдвиг обоих чисел разности]
    sections: [T01, T05]
  - id: num-mental-arithmetic/add-by-parts
    title: Прибавление по частям и округление до круглого числа
    tree_ref: Прибавление по частям и округление до круглого числа
    synonyms: [сначала десятки потом единицы, вычитание по частям, счёт вверх до круглого числа]
    sections: [T02, T05]
  - id: num-mental-arithmetic/estimate-bounds
    title: Прикидка до точного вычисления и оценка сверху и снизу
    tree_ref: Прикидка до точного вычисления и оценка сверху и снизу
    synonyms: [прикидка суммы, прикидка разности, хватит ли денег без точного счёта]
    sections: [T03, T05, T06]
  - id: num-mental-arithmetic/inverse-check
    title: Проверка результата обратным действием
    tree_ref: Проверка результата обратным действием
    synonyms: [проверка вычитания сложением, проверка сложения вычитанием, неправдоподобный ответ]
    sections: [T04]

outcomes:
  - id: LO-01
    short: Считает устно приёмами
    action: >
      вычисляет устно сумму и разность, раскладывая слагаемое или вычитаемое на удобные части,
      заменяя число близким круглым с поправкой, прибавляя и вычитая по разрядам и дополняя
      до круглого числа
    conditions: числа от 0 до 1000, результат не больше 1000; без калькулятора, промежуточные результаты можно записывать цепочкой
    criterion: >
      верное значение в 4 случаях из 5; цепочка шагов записана, и каждая поправка сделана
      в нужную сторону
    level: core
    sections: [T01, T02]
  - id: LO-02
    short: Прикидывает и проверяет результат
    action: >
      до точного счёта находит прикидку и оценки сверху и снизу суммы и разности, а после счёта
      проверяет результат обратным действием и отбраковывает неправдоподобный ответ
    conditions: числа от 0 до 1000; округление до десятков или сотен; без калькулятора
    criterion: >
      оценка снизу не больше точного результата, оценка сверху не меньше его, направление
      округления выбрано для каждого числа; проверка обратным действием возвращает исходное число
    level: standard
    sections: [T03, T04]
  - id: LO-03
    short: Выбирает приём и решает оценками
    action: >
      выбирает приём под числа и объясняет выбор, сдвигает оба числа разности на одно и то же
      число, складывает несколько чисел перегруппировкой и решает вопрос «уложимся ли в лимит»
      оценками без точного счёта
    conditions: от двух до шести чисел, каждое от 0 до 1000, сумма не больше 3000; оценки — до десятков
    criterion: >
      выбранная цепочка не длиннее счёта по разрядам; вывод по оценке верен, а если оценки
      вопрос не решают, это названо и выполнен точный счёт
    level: deep
    sections: [T05, T06]

errors:
  - E-num-mental-arithmetic-comp-add-sign
  - E-num-mental-arithmetic-comp-sub-sign
  - E-num-mental-arithmetic-comp-add-forgot
  - E-num-mental-arithmetic-comp-sub-forgot
