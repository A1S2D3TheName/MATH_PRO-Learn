# Финальная цепочка (STANDARD.md §8): один сюжет, 6 шагов, 6 согласованных вариантов.
# depends_on — только там, где шаг использует результат предыдущего (правило 177): F-02 ← F-01,
# F-04 ← F-03, F-05 ← F-04, F-06 ← F-05 и F-02. F-01 и F-03 — самостоятельные начала двух веток
# (оценка и точный счёт), которые сходятся в F-06.
# Производные параметры (ua, U, G, S2, S, C, D, jumps, jsum и др.) объявлены в variants[].params —
# для role: final-step это разрешено (правило 76).
title: Закупка в строительном магазине
context_id: hardware-store
scenario: 'В строительном магазине вы берёте три товара: за {{a}} ₽, за {{b}} ₽ и за {{c}} ₽. С собой у вас {{m}} ₽.'
tasks:
- id: F-01
  type: number
  role: final-step
  purpose: procedure
  level: 1
  outcome: LO-02
  sections: [T03]
  minutes: 1
  depends_on: []
  prompt: Округлите все три цены вверх до десятков и сложите. Какой получилась оценка сверху стоимости покупки?
  answer: 830
  variants:
  - params: {a: 346, b: 298, c: 175, m: 1000, ua: 350, ub: 300, uc: 180, U: 830}
    answer: 830
  - params: {a: 257, b: 399, c: 286, m: 1000, ua: 260, ub: 400, uc: 290, U: 950}
    answer: 950
  - params: {a: 184, b: 197, c: 263, m: 700, ua: 190, ub: 200, uc: 270, U: 660}
    answer: 660
  - params: {a: 412, b: 298, c: 136, m: 1000, ua: 420, ub: 300, uc: 140, U: 860}
    answer: 860
  - params: {a: 523, b: 199, c: 154, m: 1000, ua: 530, ub: 200, uc: 160, U: 890}
    answer: 890
  - params: {a: 168, b: 296, c: 327, m: 900, ua: 170, ub: 300, uc: 330, U: 800}
    answer: 800
  hints:
  - Оценка сверху получается, если каждую цену только увеличить.
  - Округлите каждую цену вверх до десятков и сложите круглые числа.
  - 'Начните с цены {{a}}: до какого десятка она округляется вверх?'
  solution: |
    ### Ответ
    {{U}}

    ### Идея
    Если каждую цену только увеличить, сумма тоже увеличится — получится оценка сверху.

    ### Шаги
    1. Вверх до десятков: {{a}} → {{ua}}, {{b}} → {{ub}}, {{c}} → {{uc}}.
    2. ${{ua}} + {{ub}} + {{uc}} = {{U}}$.

    ### Проверка
    Каждое круглое число больше своей цены меньше чем на 10, поэтому оценка {{U}} больше точной стоимости меньше чем на 30 — это подтвердит шаг 6.

    ### Типичная ошибка
    E-num-mental-arithmetic-bound-nearest: округлить цены по обычному правилу — такая сумма может оказаться меньше точной стоимости.
  feedback:
    correct: 'Верно: все три цены округлены вверх, и сумма круглых чисел — оценка сверху.'
    wrong:
      what: Оценка сверху не совпала.
      why: Возможно, какая-то цена округлена вниз или по обычному правилу.
      fix: Каждую цену округляйте только вверх до десятков.
      next: Пример 2 раздела T03.
- id: F-02
  type: number
  role: final-step
  purpose: meaning
  level: 2
  outcome: LO-02
  sections: [T03]
  minutes: 1
  depends_on: [F-01]
  prompt: Сколько рублей сдачи вы получите самое меньшее, судя по оценке из предыдущего шага?
  answer: 170
  variants:
  - params: {a: 346, b: 298, c: 175, m: 1000, U: 830, G: 170}
    answer: 170
  - params: {a: 257, b: 399, c: 286, m: 1000, U: 950, G: 50}
    answer: 50
  - params: {a: 184, b: 197, c: 263, m: 700, U: 660, G: 40}
    answer: 40
  - params: {a: 412, b: 298, c: 136, m: 1000, U: 860, G: 140}
    answer: 140
  - params: {a: 523, b: 199, c: 154, m: 1000, U: 890, G: 110}
    answer: 110
  - params: {a: 168, b: 296, c: 327, m: 900, U: 800, G: 100}
    answer: 100
  hints:
  - Покупка стоит не больше оценки сверху. Что тогда можно сказать о сдаче?
  - Самая маленькая сдача получится, если покупка стоит ровно столько, сколько оценка сверху.
  - Вычтите оценку из шага 1 из {{m}}.
  solution: |
    ### Ответ
    {{G}}

    ### Идея
    Стоимость покупки не больше оценки сверху, значит, сдача не меньше, чем {{m}} минус оценка.

    ### Шаги
    1. Оценка сверху стоимости — {{U}} ₽ из шага 1.
    2. ${{m}} - {{U}} = {{G}}$ — меньше сдача не будет.

    ### Проверка
    Если бы покупка стоила ровно {{U}} ₽, сдача была бы {{G}} ₽; настоящая стоимость не больше оценки, поэтому настоящая сдача не меньше.

    ### Типичная ошибка
    E-num-mental-arithmetic-bound-nearest: взять прикидку по обычному округлению — тогда «самое меньшее» не гарантировано.
  feedback:
    correct: 'Верно: от оценки сверху стоимости вы перешли к гарантированной сдаче.'
    wrong:
      what: Гарантированная сдача не совпала.
      why: Возможно, вычитали не оценку сверху, а другое число.
      fix: Вычтите из имеющихся денег оценку сверху из шага 1.
      next: Абзац «Оценки суммы» раздела T03.
- id: F-03
  type: number
  role: final-step
  purpose: procedure
  level: 1
  outcome: LO-01
  sections: [T01]
  minutes: 1
  depends_on: []
  prompt: Найдите точную стоимость первых двух товаров, {{a}} + {{b}}, приёмом компенсации.
  answer: 644
  variants:
  - params: {a: 346, b: 298, c: 175, m: 1000, rb: 300, kb: 2, arb: 646, S2: 644}
    answer: 644
  - params: {a: 257, b: 399, c: 286, m: 1000, rb: 400, kb: 1, arb: 657, S2: 656}
    answer: 656
  - params: {a: 184, b: 197, c: 263, m: 700, rb: 200, kb: 3, arb: 384, S2: 381}
    answer: 381
  - params: {a: 412, b: 298, c: 136, m: 1000, rb: 300, kb: 2, arb: 712, S2: 710}
    answer: 710
  - params: {a: 523, b: 199, c: 154, m: 1000, rb: 200, kb: 1, arb: 723, S2: 722}
    answer: 722
  - params: {a: 168, b: 296, c: 327, m: 900, rb: 300, kb: 4, arb: 468, S2: 464}
    answer: 464
  hints:
  - Вторая цена близка к круглому числу.
  - Прибавьте круглое число и уберите разницу между ним и ценой.
  - До какого круглого числа не хватает немного цене {{b}}?
  solution: |
    ### Ответ
    {{S2}}

    ### Идея
    Цена {{b}} близка к круглой {{rb}}: прибавляем круглое число и убираем разницу.

    ### Шаги
    1. ${{a}} + {{rb}} = {{arb}}$.
    2. Лишнее прибавленное — {{kb}} ₽: ${{arb}} - {{kb}} = {{S2}}$.

    ### Проверка
    Вычитанием: ${{S2}} - {{b}} = {{a}}$ — получилась первая цена.

    ### Типичная ошибка
    E-num-mental-arithmetic-comp-add-sign: прибавить разницу вместо вычитания.
  feedback:
    correct: 'Верно: компенсация дала точную стоимость двух товаров.'
    wrong:
      what: Стоимость двух товаров не совпала.
      why: Возможно, поправка сделана не в ту сторону или забыта.
      fix: Прибавили круглое число — лишнее вычтите.
      next: Пример 2 раздела T01.
    misconceptions:
    - id: E-num-mental-arithmetic-comp-add-sign
      when:
        expr: a + 20*ceil (b/10) - b
      message: Разница прибавлена, а её нужно вычесть.
    - id: E-num-mental-arithmetic-comp-add-forgot
      when:
        expr: a + 10*ceil (b/10)
      message: Это сумма с круглым числом — разница не убрана.
  errors: [E-num-mental-arithmetic-comp-add-sign, E-num-mental-arithmetic-comp-add-forgot]
- id: F-04
  type: number
  role: final-step
  purpose: procedure
  level: 2
  outcome: LO-01
  sections: [T02]
  minutes: 1
  depends_on: [F-03]
  prompt: Прибавьте к стоимости двух товаров третью цену по частям. Сколько стоит вся покупка?
  answer: 819
  variants:
  - params: {a: 346, b: 298, c: 175, m: 1000, S2: 644, ch: 100, ct: 70, co: 5, s1: 744, s2: 814, S: 819, U: 830}
    answer: 819
  - params: {a: 257, b: 399, c: 286, m: 1000, S2: 656, ch: 200, ct: 80, co: 6, s1: 856, s2: 936, S: 942, U: 950}
    answer: 942
  - params: {a: 184, b: 197, c: 263, m: 700, S2: 381, ch: 200, ct: 60, co: 3, s1: 581, s2: 641, S: 644, U: 660}
    answer: 644
  - params: {a: 412, b: 298, c: 136, m: 1000, S2: 710, ch: 100, ct: 30, co: 6, s1: 810, s2: 840, S: 846, U: 860}
    answer: 846
  - params: {a: 523, b: 199, c: 154, m: 1000, S2: 722, ch: 100, ct: 50, co: 4, s1: 822, s2: 872, S: 876, U: 890}
    answer: 876
  - params: {a: 168, b: 296, c: 327, m: 900, S2: 464, ch: 300, ct: 20, co: 7, s1: 764, s2: 784, S: 791, U: 800}
    answer: 791
  hints:
  - Третью цену удобно прибавлять разряд за разрядом.
  - Разложите {{c}} на сотни, десятки и единицы и прибавляйте к результату шага 3 по очереди.
  - Первый шаг — прибавить сотни числа {{c}}.
  solution: |
    ### Ответ
    {{S}}

    ### Идея
    К стоимости двух товаров {{S2}} прибавляем {{c}} по разрядам.

    ### Шаги
    1. ${{c}} = {{ch}} + {{ct}} + {{co}}$.
    2. ${{S2}} + {{ch}} = {{s1}}$.
    3. ${{s1}} + {{ct}} = {{s2}}$.
    4. ${{s2}} + {{co}} = {{S}}$.

    ### Проверка
    Оценка сверху из шага 1, {{U}}, не меньше {{S}}; и ${{S}} - {{c}} = {{S2}}$ — вернулись к стоимости двух товаров.

    ### Типичная ошибка
    E-num-mental-arithmetic-parts-lost-ones: остановиться после десятков третьей цены.
  feedback:
    correct: 'Верно: третья цена прибавлена по разрядам, и стоимость покупки не превышает оценку сверху.'
    wrong:
      what: Стоимость покупки не совпала.
      why: Возможно, потеряна часть третьей цены.
      fix: Отмечайте каждую прибавленную часть третьей цены.
      next: Пример 2 раздела T02.
- id: F-05
  type: number
  role: final-step
  purpose: transfer
  level: 3
  outcome: LO-01
  sections: [T02]
  minutes: 1
  depends_on: [F-04]
  prompt: Сколько сдачи вы получите на самом деле? Посчитайте вверх от стоимости покупки до {{m}}.
  answer: 181
  variants:
  - params: {a: 346, b: 298, c: 175, m: 1000, S: 819, jumps: 'от 819 до 820 — 1, до 900 — 80, до 1000 — 100', jsum: 1 + 80 + 100, C: 181}
    answer: 181
  - params: {a: 257, b: 399, c: 286, m: 1000, S: 942, jumps: 'от 942 до 950 — 8, до 1000 — 50', jsum: 8 + 50, C: 58}
    answer: 58
  - params: {a: 184, b: 197, c: 263, m: 700, S: 644, jumps: 'от 644 до 650 — 6, до 700 — 50', jsum: 6 + 50, C: 56}
    answer: 56
  - params: {a: 412, b: 298, c: 136, m: 1000, S: 846, jumps: 'от 846 до 850 — 4, до 900 — 50, до 1000 — 100', jsum: 4 + 50 + 100, C: 154}
    answer: 154
  - params: {a: 523, b: 199, c: 154, m: 1000, S: 876, jumps: 'от 876 до 880 — 4, до 900 — 20, до 1000 — 100', jsum: 4 + 20 + 100, C: 124}
    answer: 124
  - params: {a: 168, b: 296, c: 327, m: 900, S: 791, jumps: 'от 791 до 800 — 9, до 900 — 100', jsum: 9 + 100, C: 109}
    answer: 109
  hints:
  - Сдача — сколько нужно добавить к стоимости покупки, чтобы получить {{m}}.
  - Идите вверх от стоимости из шага 4 через круглые числа и складывайте прыжки.
  - Первый прыжок — от стоимости покупки до ближайшего круглого десятка.
  solution: |
    ### Ответ
    {{C}}

    ### Идея
    Сумма {{m}} круглая — удобен счёт вверх от стоимости покупки.

    ### Шаги
    1. Прыжки: {{jumps}}.
    2. Складываем прыжки: ${{jsum}} = {{C}}$.

    ### Проверка
    Сложением: ${{S}} + {{C}} = {{m}}$ — покупка и сдача вместе дают все деньги.

    ### Типичная ошибка
    E-num-mental-arithmetic-comp-sub-forgot: потерять первый короткий прыжок.
  feedback:
    correct: 'Верно: счёт вверх от стоимости покупки дал точную сдачу.'
    wrong:
      what: Сдача не совпала.
      why: Возможно, потерян первый короткий прыжок или ошибка в стоимости покупки.
      fix: Выпишите все прыжки от стоимости до имеющейся суммы.
      next: Пример 4 раздела T02.
- id: F-06
  type: number
  role: final-step
  purpose: meaning
  level: 3
  outcome: LO-02
  sections: [T04]
  minutes: 1
  depends_on: [F-05, F-02]
  prompt: Сравните точную сдачу с гарантированной из шага 2. На сколько рублей точная сдача больше?
  answer: 11
  variants:
  - params: {a: 346, b: 298, c: 175, m: 1000, C: 181, G: 170, D: 11, U: 830, S: 819}
    answer: 11
  - params: {a: 257, b: 399, c: 286, m: 1000, C: 58, G: 50, D: 8, U: 950, S: 942}
    answer: 8
  - params: {a: 184, b: 197, c: 263, m: 700, C: 56, G: 40, D: 16, U: 660, S: 644}
    answer: 16
  - params: {a: 412, b: 298, c: 136, m: 1000, C: 154, G: 140, D: 14, U: 860, S: 846}
    answer: 14
  - params: {a: 523, b: 199, c: 154, m: 1000, C: 124, G: 110, D: 14, U: 890, S: 876}
    answer: 14
  - params: {a: 168, b: 296, c: 327, m: 900, C: 109, G: 100, D: 9, U: 800, S: 791}
    answer: 9
  hints:
  - Точная сдача не меньше гарантированной — найдите разницу.
  - Вычтите гарантированную сдачу из точной.
  - Возьмите сдачу из шага 5 и сдачу из шага 2.
  solution: |
    ### Ответ
    {{D}}

    ### Идея
    Гарантированная сдача посчитана по оценке сверху, точная — по точной стоимости; разница показывает, насколько оценка превысила стоимость.

    ### Шаги
    1. ${{C}} - {{G}} = {{D}}$.

    ### Проверка
    Оценка сверху больше стоимости ровно на столько же: ${{U}} - {{S}} = {{D}}$; а обратное действие ${{S}} + {{C}} = {{m}}$ подтверждает сдачу.

    ### Типичная ошибка
    E-num-mental-arithmetic-check-subtract-again: проверять сдачу повторным вычитанием тем же путём вместо сложения стоимости и сдачи.
  feedback:
    correct: 'Верно: точная сдача больше гарантированной ровно на то, на что оценка сверху превысила стоимость.'
    wrong:
      what: Разница не совпала.
      why: Возможно, перепутаны точная и гарантированная сдача.
      fix: Из точной сдачи вычтите гарантированную.
      next: Раздел T04 и абзац «Оценки суммы» раздела T03.
