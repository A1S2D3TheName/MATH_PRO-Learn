- id: P-28
  type: number
  role: challenge
  purpose: meaning
  level: 5
  outcome: LO-03
  sections: [T03, T06]
  minutes: 4
  optional: true
  prompt: Три трёхзначных числа округлили до десятков. Когда все три округлили вниз, сумма круглых чисел вышла 1230, а когда все три вверх — 1250. Сколько из трёх чисел оканчиваются нулём?
  answer: 1
  trivial_answer_ok: true
  hints:
  - Подумайте, как меняется одно число, если вместо округления вниз округлить его вверх.
  - Круглое число не меняется, некруглое при переходе от «вниз» к «вверх» вырастает на 10.
  - Разность двух сумм — $1250 - 1230$; сколько десятков она содержит?
  solution: |
    ### Ответ
    1

    ### Идея
    Число, оканчивающееся нулём, при округлении не меняется, а любое другое при переходе от округления вниз к округлению вверх вырастает ровно на 10.

    ### Шаги
    1. Разница сумм: $1250 - 1230 = 20$.
    2. Каждое число, не оканчивающееся нулём, даёт в этой разнице 10, круглое — 0.
    3. 20 — это два раза по 10: нулём не оканчиваются два числа.
    4. Значит, нулём оканчивается одно число из трёх.

    ### Проверка
    Пример: 400, 412 и 425 — вниз $400 + 410 + 420 = 1230$, вверх $400 + 420 + 430 = 1250$.

    ### Типичная ошибка
    E-num-mental-arithmetic-bound-nearest: перепутать округление вниз и вверх с обычным — при обычном округлении разница сумм ничего не говорит о круглых числах.
  feedback:
    correct: 'Верно: разница сумм показывает, сколько чисел выросло при округлении вверх, — их два, значит, круглое одно.'
    wrong:
      what: Количество не совпало.
      why: Возможно, не учтено, что круглое число при округлении не меняется.
      fix: Сравните, на сколько вырастает каждое число при переходе от округления вниз к округлению вверх.
      next: Углубление в конце раздела T03.
