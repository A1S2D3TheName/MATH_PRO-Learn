  answer: 358
  variants:
  - params: {n: 2, lo: 340}
    answer: 358
    solution: |
      ### Ответ
      358

      ### Идея
      При округлении вниз до десятков цена уменьшается самое большее на 9 рублей.

      ### Шаги
      1. Цена больше своего округления вниз не больше чем на 9 ₽: например, 179 округляется вниз до 170.
      2. Товаров 2: $9 \cdot 2 = 18$.
      3. $340 + 18 = 358$.

      ### Проверка
      Цены 179 и 179 ₽ дают оценку снизу $170 + 170 = 340$, а точную сумму $179 + 179 = 358$; ещё больше нельзя — каждая цена уже оканчивается на 9.

      ### Типичная ошибка
      E-num-mental-arithmetic-bound-nearest: путать округление вниз с обычным и считать, что цена больше оценки не больше чем на 4–5 ₽.
