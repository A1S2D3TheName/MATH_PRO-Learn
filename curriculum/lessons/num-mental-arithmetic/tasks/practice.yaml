# Основной банк (STANDARD.md §6–§8): 27 задач без challenge + 1 challenge.
# Роли: warmup 3, supported 10, independent 14. Уровни 0/1/2/3/4: 3/7/8/6/3 задачи (11/26/30/22/11 %).
# LO-01 (core) — P-01…P-10, LO-02 (standard) — P-11…P-18, LO-03 (deep) — P-19…P-27; P-28 — challenge.
# У каждого outcome не меньше двух procedure и по одной meaning, method, transfer (правило 174).
# Общий `solution` задачи с вариантами — шаблон метода; у каждого варианта свой разбор с его числами
# (правило 164: валидатор не поддерживает плейсхолдер {{answer}}, а производные параметры вне условия
# разрешены только шагам финальной цепочки — правило 76).
# Детекторы `feedback.misconceptions[].when.expr` дословно повторяют `formula` своей записи каталога;
# имена параметров задачи совпадают с переменными формулы (a, b, c), поэтому связь однозначна.
tasks:
- id: P-01
  type: number
  role: warmup
  purpose: procedure
  level: 0
  outcome: LO-01
  sections: [T01]
  minutes: 1
  prompt: 'Вычислите {{a}} + {{b}}: сначала дополните {{a}} до ближайшего круглого числа, потом прибавьте остаток.'
  answer: 63
  variants:
  - params: {a: 57, b: 6}
    answer: 63
    solution: |
      ### Ответ
      63

      ### Идея
      Второе слагаемое раскладываем так, чтобы одна часть довела 57 до круглого числа 60.

      ### Шаги
      1. До 60 от 57 не хватает 3, поэтому $6 = 3 + 3$.
      2. Доводим до круглого: $57 + 3 = 60$.
      3. Прибавляем остаток: $60 + 3 = 63$.

      ### Проверка
      По разрядам: единицы $7 + 6 = 13$ — это новый десяток и 3; десятков стало на один больше, получается 63.

      ### Типичная ошибка
      E-num-mental-arithmetic-lost-ten: потерять новый десяток и ответить 53.
  - params: {a: 86, b: 7}
    answer: 93
    solution: |
      ### Ответ
      93

      ### Идея
      Второе слагаемое раскладываем так, чтобы одна часть довела 86 до круглого числа 90.

      ### Шаги
      1. До 90 от 86 не хватает 4, поэтому $7 = 4 + 3$.
      2. Доводим до круглого: $86 + 4 = 90$.
      3. Прибавляем остаток: $90 + 3 = 93$.

      ### Проверка
      По разрядам: единицы $6 + 7 = 13$ — это новый десяток и 3; десятков стало на один больше, получается 93.

      ### Типичная ошибка
      E-num-mental-arithmetic-lost-ten: потерять новый десяток и ответить 83.
  - params: {a: 148, b: 5}
    answer: 153
    solution: |
      ### Ответ
      153

      ### Идея
      Второе слагаемое раскладываем так, чтобы одна часть довела 148 до круглого числа 150.

      ### Шаги
      1. До 150 от 148 не хватает 2, поэтому $5 = 2 + 3$.
      2. Доводим до круглого: $148 + 2 = 150$.
      3. Прибавляем остаток: $150 + 3 = 153$.

      ### Проверка
      По разрядам: единицы $8 + 5 = 13$ — это новый десяток и 3; десятков стало на один больше, получается 153.

      ### Типичная ошибка
      E-num-mental-arithmetic-lost-ten: потерять новый десяток и ответить 143.
  hints:
  - Круглое число прибавлять удобнее всего — найдите ближайшее круглое число после первого слагаемого.
  - 'Разложите второе слагаемое на две части: первая доводит до круглого числа, вторая — остаток.'
  - Сколько не хватает числу {{a}} до ближайшего круглого числа? Отделите столько от {{b}}.
  solution: |
    ### Ответ
    Сумма {{a}} + {{b}}, найденная через ближайшее круглое число.

    ### Идея
    Часть второго слагаемого доводит первое до круглого числа, остаток прибавляют к круглому.

    ### Шаги
    1. Найти, сколько не хватает {{a}} до круглого числа.
    2. Разложить {{b}} на эту часть и остаток.
    3. Прибавить части по очереди.

    ### Проверка
    Сложить по разрядам и сравнить.

    ### Типичная ошибка
    E-num-mental-arithmetic-lost-ten: потерять новый десяток.
  feedback:
    correct: 'Верно: часть второго слагаемого довела сумму до круглого числа, а остаток прибавлен к нему.'
    wrong:
      what: Сумма не совпала.
      why: Возможно, после круглого числа потерян новый десяток.
      fix: Дойдите до круглого числа, затем прибавьте к нему остаток второго слагаемого.
      next: Пример 1 и луч с прыжками в разделе T01.
    misconceptions:
    - id: E-num-mental-arithmetic-lost-ten
      when:
        expr: a + b - 10
      message: 'Ответ на 10 меньше верного: новый десяток потерян, счёт после круглого числа продолжается от него.'
  errors: [E-num-mental-arithmetic-lost-ten]
- id: P-02
  type: number
  role: warmup
  purpose: procedure
  level: 0
  outcome: LO-01
  sections: [T02]
  minutes: 1
  prompt: 'Вычислите {{a}} + {{b}} по частям: прибавьте к {{a}} сначала десятки числа {{b}}, потом его единицы.'
  answer: 68
  variants:
  - params: {a: 43, b: 25}
    answer: 68
    solution: |
      ### Ответ
      68

      ### Идея
      Число 25 раскладываем на десятки и единицы и прибавляем части к 43 по очереди.

      ### Шаги
      1. Раскладываем второе слагаемое по разрядам: $25 = 20 + 5$.
      2. Десятки: $43 + 20 = 63$.
      3. Единицы: $63 + 5 = 68$.

      ### Проверка
      Другим маршрутом — десятки с десятками, единицы с единицами: $40 + 20 = 60$, $3 + 5 = 8$, $60 + 8 = 68$.

      ### Типичная ошибка
      E-num-mental-arithmetic-parts-lost-ones: остановиться после десятков и ответить 63.
  - params: {a: 61, b: 37}
    answer: 98
    solution: |
      ### Ответ
      98

      ### Идея
      Число 37 раскладываем на десятки и единицы и прибавляем части к 61 по очереди.

      ### Шаги
      1. Раскладываем второе слагаемое по разрядам: $37 = 30 + 7$.
      2. Десятки: $61 + 30 = 91$.
      3. Единицы: $91 + 7 = 98$.

      ### Проверка
      Другим маршрутом — десятки с десятками, единицы с единицами: $60 + 30 = 90$, $1 + 7 = 8$, $90 + 8 = 98$.

      ### Типичная ошибка
      E-num-mental-arithmetic-parts-lost-ones: остановиться после десятков и ответить 91.
  - params: {a: 234, b: 52}
    answer: 286
    solution: |
      ### Ответ
      286

      ### Идея
      Число 52 раскладываем на десятки и единицы и прибавляем части к 234 по очереди.

      ### Шаги
      1. Раскладываем второе слагаемое по разрядам: $52 = 50 + 2$.
      2. Десятки: $234 + 50 = 284$.
      3. Единицы: $284 + 2 = 286$.

      ### Проверка
      Другим маршрутом — десятки с десятками, единицы с единицами: $230 + 50 = 280$, $4 + 2 = 6$, $280 + 6 = 286$.

      ### Типичная ошибка
      E-num-mental-arithmetic-parts-lost-ones: остановиться после десятков и ответить 284.
  hints:
  - 'Прибавлять удобно круглыми частями: десятки отдельно, единицы отдельно.'
  - Разложите {{b}} на десятки и единицы и прибавляйте их к {{a}} по очереди.
  - 'Первый шаг — прибавить десятки числа {{b}}: сколько их?'
  solution: |
    ### Ответ
    Сумма {{a}} + {{b}}, найденная по частям.

    ### Идея
    Второе слагаемое раскладывают по разрядам.

    ### Шаги
    1. Разложить {{b}} на десятки и единицы.
    2. Прибавить десятки.
    3. Прибавить единицы.

    ### Проверка
    Сложить десятки с десятками и единицы с единицами.

    ### Типичная ошибка
    E-num-mental-arithmetic-parts-lost-ones: забыть единицы второго слагаемого.
  feedback:
    correct: 'Верно: десятки и единицы второго слагаемого прибавлены по очереди, ни одна часть не потеряна.'
    wrong:
      what: Сумма не совпала.
      why: Возможно, после шага десятков забыты единицы второго слагаемого.
      fix: Запишите разложение второго слагаемого и отмечайте каждую прибавленную часть.
      next: Начало раздела T02 и пример 1.
    misconceptions:
    - id: E-num-mental-arithmetic-parts-lost-ones
      when:
        expr: a + 10*floor (b/10)
      message: Прибавлены только десятки второго слагаемого — его единицы ещё впереди.
  errors: [E-num-mental-arithmetic-parts-lost-ones]
- id: P-03
  type: number
  role: supported
  purpose: procedure
  level: 1
  outcome: LO-01
  sections: [T01]
  minutes: 1
  prompt: 'Вычислите {{a}} + {{b}}: прибавьте {{r}} и сделайте поправку.'
  answer: 85
  variants:
  - params: {a: 36, b: 49, r: 50}
    answer: 85
    solution: |
      ### Ответ
      85

      ### Идея
      Слагаемое 49 заменяем круглым 50, а потом убираем лишнее.

      ### Шаги
      1. Выбор приёма: 49 близко к круглому 50, разница $50 - 49 = 1$.
      2. Прибавляем круглое число: $36 + 50 = 86$.
      3. Прибавили на 1 больше, чем нужно, — лишнее убираем: $86 - 1 = 85$.

      ### Проверка
      По частям: $36 + 40 = 76$, $76 + 9 = 85$.

      ### Типичная ошибка
      E-num-mental-arithmetic-comp-add-sign: прибавить поправку вместо вычитания и получить 87.
  - params: {a: 125, b: 98, r: 100}
    answer: 223
    solution: |
      ### Ответ
      223

      ### Идея
      Слагаемое 98 заменяем круглым 100, а потом убираем лишнее.

      ### Шаги
      1. Выбор приёма: 98 близко к круглому 100, разница $100 - 98 = 2$.
      2. Прибавляем круглое число: $125 + 100 = 225$.
      3. Прибавили на 2 больше, чем нужно, — лишнее убираем: $225 - 2 = 223$.

      ### Проверка
      По частям: $125 + 90 = 215$, $215 + 8 = 223$.

      ### Типичная ошибка
      E-num-mental-arithmetic-comp-add-sign: прибавить поправку вместо вычитания и получить 227.
  hints:
  - Круглое число {{r}} прибавить проще, чем {{b}}, но оно больше нужного.
  - 'Компенсация: прибавьте круглое число и уберите то, что прибавили лишнего.'
  - Насколько {{r}} больше, чем {{b}}? Эту разницу потом вычтите из суммы {{a}} и {{r}}.
  solution: |
    ### Ответ
    Сумма {{a}} + {{b}}, найденная компенсацией.

    ### Идея
    Прибавить круглое число и убрать лишнее.

    ### Шаги
    1. Прибавить {{r}} к {{a}}.
    2. Найти, на сколько {{r}} больше {{b}}.
    3. Вычесть эту разницу.

    ### Проверка
    Сложить по частям и сравнить.

    ### Типичная ошибка
    E-num-mental-arithmetic-comp-add-sign: прибавить поправку вместо вычитания.
  feedback:
    correct: 'Верно: прибавлено круглое число, а лишняя разница убрана — поправка сделана в нужную сторону.'
    wrong:
      what: Сумма не совпала.
      why: Возможно, разницу между круглым числом и слагаемым прибавили, а не вычли, или поправку не сделали.
      fix: 'Спросите себя: я прибавил больше или меньше, чем нужно? Лишнее вычтите.'
      next: Пример 2 раздела T01.
    misconceptions:
    - id: E-num-mental-arithmetic-comp-add-sign
      when:
        expr: a + 20*ceil (b/10) - b
      message: 'Поправка прибавлена, а её нужно вычесть: круглое число уже больше слагаемого.'
    - id: E-num-mental-arithmetic-comp-add-forgot
      when:
        expr: a + 10*ceil (b/10)
      message: Это сумма с круглым числом — поправка ещё не сделана.
  errors: [E-num-mental-arithmetic-comp-add-sign, E-num-mental-arithmetic-comp-add-forgot]
- id: P-04
  type: number
  role: supported
  purpose: procedure
  level: 1
  outcome: LO-01
  sections: [T01]
  minutes: 1
  prompt: 'Вычислите {{a}} − {{b}}: вычтите {{r}} и сделайте поправку.'
  answer: 36
  variants:
  - params: {a: 74, b: 38, r: 40}
    answer: 36
    solution: |
      ### Ответ
      36

      ### Идея
      Вычитаемое 38 заменяем круглым 40, а лишне вычтенное возвращаем.

      ### Шаги
      1. Выбор приёма: 38 близко к круглому 40, разница $40 - 38 = 2$.
      2. Вычитаем круглое число: $74 - 40 = 34$.
      3. Вычли на 2 больше, чем нужно, — возвращаем: $34 + 2 = 36$.

      ### Проверка
      Сложение: $36 + 38 = 74$ — получилось уменьшаемое.

      ### Типичная ошибка
      E-num-mental-arithmetic-comp-sub-sign: вычесть поправку ещё раз и получить 32.
  - params: {a: 251, b: 97, r: 100}
    answer: 154
    solution: |
      ### Ответ
      154

      ### Идея
      Вычитаемое 97 заменяем круглым 100, а лишне вычтенное возвращаем.

      ### Шаги
      1. Выбор приёма: 97 близко к круглому 100, разница $100 - 97 = 3$.
      2. Вычитаем круглое число: $251 - 100 = 151$.
      3. Вычли на 3 больше, чем нужно, — возвращаем: $151 + 3 = 154$.

      ### Проверка
      Сложение: $154 + 97 = 251$ — получилось уменьшаемое.

      ### Типичная ошибка
      E-num-mental-arithmetic-comp-sub-sign: вычесть поправку ещё раз и получить 148.
  hints:
  - Круглое число {{r}} вычесть проще, чем {{b}}, но вычтете вы больше, чем нужно.
  - 'Компенсация при вычитании: лишне вычтенное возвращают прибавлением.'
  - На сколько {{r}} больше {{b}}? Столько нужно вернуть к разности {{a}} и {{r}}.
  solution: |
    ### Ответ
    Разность {{a}} − {{b}}, найденная компенсацией.

    ### Идея
    Вычесть круглое и вернуть лишнее.

    ### Шаги
    1. Вычесть {{r}} из {{a}}.
    2. Найти, на сколько {{r}} больше {{b}}.
    3. Прибавить эту разницу.

    ### Проверка
    Сложить результат с вычитаемым.

    ### Типичная ошибка
    E-num-mental-arithmetic-comp-sub-sign: вычесть поправку ещё раз.
  feedback:
    correct: 'Верно: вычли круглое число и вернули то, что отняли лишнего.'
    wrong:
      what: Разность не совпала.
      why: Возможно, лишне вычтенное не вернули или вычли ещё раз.
      fix: Вычли больше, чем нужно, — значит, разницу прибавляют обратно.
      next: Виджет с шагами и пример 3 раздела T01.
    misconceptions:
    - id: E-num-mental-arithmetic-comp-sub-sign
      when:
        expr: a - 20*ceil (b/10) + b
      message: 'Поправку вычли ещё раз, а её нужно вернуть: круглое число уже отняло лишнее.'
    - id: E-num-mental-arithmetic-comp-sub-forgot
      when:
        expr: a - 10*ceil (b/10)
      message: Это разность с круглым числом — лишне вычтенное ещё не возвращено.
  errors: [E-num-mental-arithmetic-comp-sub-sign, E-num-mental-arithmetic-comp-sub-forgot]
- id: P-05
  type: choice
  role: supported
  purpose: meaning
  level: 1
  outcome: LO-01
  sections: [T01]
  minutes: 1
  prompt: Чтобы найти {{a}} − {{b}}, из {{a}} вычли круглое число {{r}}. Какой ответ верный?
  options: &id001
  - id: a
    text: '41'
    misconception: E-num-mental-arithmetic-comp-sub-sign
    why: 'Поправку 2 вычли ещё раз: 43 − 2.'
  - id: b
    text: '45'
  - id: c
    text: '43'
    misconception: E-num-mental-arithmetic-comp-sub-forgot
    why: 'Это 93 − 50: лишне вычтенное не вернули.'
  - id: d
    text: '55'
    misconception: E-num-mental-arithmetic-ones-swap
    why: Единицы вычли «из большей цифры меньшую», десяток не разменяли.
  answer: b
  variants:
  - params: {a: 93, b: 48, r: 50}
    answer: b
    options: *id001
    solution: |
      ### Ответ
      45

      ### Идея
      Вычли 50 вместо 48 — на 2 больше, чем нужно; лишнее возвращают.

      ### Шаги
      1. $93 - 50 = 43$.
      2. Вычли на 2 больше, чем нужно: $50 - 48 = 2$.
      3. Возвращаем: $43 + 2 = 45$.

      ### Проверка
      $45 + 48 = 93$ — получилось уменьшаемое.

      ### Типичная ошибка
      E-num-mental-arithmetic-comp-sub-sign: вычесть поправку ещё раз и выбрать 41.
  hints:
  - Подумайте, больше или меньше нужного вычли, когда взяли {{r}} вместо {{b}}.
  - Вычтено лишнее — значит, к результату его нужно вернуть.
  - Сначала найдите {{a}} − {{r}}, потом разницу между {{r}} и {{b}}.
  solution: |
    ### Ответ
    Разность {{a}} − {{b}} после поправки.

    ### Идея
    Вычтено лишнее — его возвращают.

    ### Шаги
    1. Вычесть {{r}}.
    2. Найти лишнее.
    3. Вернуть его.

    ### Проверка
    Сложить ответ с вычитаемым.

    ### Типичная ошибка
    E-num-mental-arithmetic-comp-sub-sign: вычесть поправку ещё раз.
  feedback:
    correct: 'Верно: вы вернули к разности то, что вычли лишнего, и выбрали правильный результат.'
    wrong:
      what: Выбран неверный результат.
      why: Поправка сделана не в ту сторону, не сделана, или единицы вычтены «из большей меньшую».
      fix: Найдите разность с круглым числом и верните к ней лишне вычтенное.
      next: Сравнение «Верно / Неверно» в разделе T01.
- id: P-06
  type: number
  role: independent
  purpose: procedure
  level: 2
  outcome: LO-01
  sections: [T02]
  minutes: 1
  prompt: 'Вычислите {{a}} + {{b}} по частям: сотни, десятки, единицы.'
  answer: 671
  variants:
  - params: {a: 253, b: 418}
    answer: 671
    solution: |
      ### Ответ
      671

      ### Идея
      Число 418 раскладываем по разрядам и прибавляем к 253 сотни, десятки и единицы по очереди.

      ### Шаги
      1. Раскладываем второе слагаемое по разрядам: $418 = 400 + 10 + 8$.
      2. Сотни: $253 + 400 = 653$.
      3. Десятки: $653 + 10 = 663$.
      4. Единицы через круглое число: $663 + 7 = 670$, $670 + 1 = 671$.

      ### Проверка
      Вычитанием: $671 - 418 = 253$ — получилось первое слагаемое.

      ### Типичная ошибка
      E-num-mental-arithmetic-parts-lost-ones: остановиться после десятков и ответить 663.
  - params: {a: 367, b: 245}
    answer: 612
    solution: |
      ### Ответ
      612

      ### Идея
      Число 245 раскладываем по разрядам и прибавляем к 367 сотни, десятки и единицы по очереди.

      ### Шаги
      1. Раскладываем второе слагаемое по разрядам: $245 = 200 + 40 + 5$.
      2. Сотни: $367 + 200 = 567$.
