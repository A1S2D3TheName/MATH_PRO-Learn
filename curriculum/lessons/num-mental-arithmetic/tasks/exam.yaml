# transfer. У задач один вариант: параметры нужны, чтобы детекторы однозначно связывались с формулами
# каталога (правило 165). Правило 173 (не больше 20 % баллов на подтему) при четырёх подтемах дерева
# арифметически невыполнимо — распределение и вопрос приведены в описании PR.
variants:
