  - id: EA-08
    type: number
    role: exam
    purpose: meaning
    level: 2
    outcome: LO-02
    sections: [T04]
    minutes: 2
    points: 1
    prompt: 'Разность {{a}} − {{b}} записали как {{w}} и проверили сложением: {{w}} + {{b}} = {{v}}. На сколько записанная разность больше верной?'
    answer: 10
    variants:
    - params: {a: 527, b: 289, w: 248, v: 537}
      answer: 10
      solution: |
        ### Ответ
        10

        ### Идея
        Вычитаемое в проверке верное, поэтому вся разница между проверкой и уменьшаемым — ошибка результата.

        ### Шаги
        1. Проверка дала 537 вместо уменьшаемого 527: на 10 больше.
        2. Лишнее в проверке пришло из записанной разности: она больше верной на 10.

        ### Проверка
        Верная разность: $527 - 289 = 238$, и $248 - 238 = 10$.

        ### Типичная ошибка
        E-num-mental-arithmetic-check-subtract-again: проверять тем же действием и получить число, которое не с чем сравнить.
    hints:
    - Сравните результат проверки с числом из условия.
    - Несовпадение при проверке показывает размер ошибки результата.
    - Сравните 537 с 527.
    solution: |
      ### Ответ
      10

      ### Идея
      Вычитаемое в проверке верное, поэтому вся разница между проверкой и уменьшаемым — ошибка результата.

      ### Шаги
      1. Проверка дала 537 вместо уменьшаемого 527: на 10 больше.
      2. Лишнее в проверке пришло из записанной разности: она больше верной на 10.

      ### Проверка
      Верная разность: $527 - 289 = 238$, и $248 - 238 = 10$.

      ### Типичная ошибка
      E-num-mental-arithmetic-check-subtract-again: проверять тем же действием и получить число, которое не с чем сравнить.
    feedback:
      correct: 'Верно: несовпадение проверки с числом 527 показало, на сколько ошибся результат.'
      wrong:
        what: Размер ошибки найден неверно.
        why: Возможно, сравнили не те числа.
        fix: Сравните результат обратного действия с числом из записи, которое он должен был вернуть.
        next: Определение проверки обратным действием в разделе T04.
  - id: EA-09
