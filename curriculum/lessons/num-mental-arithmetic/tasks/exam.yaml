  - id: EA-01
    type: number
    role: exam
    purpose: procedure
    level: 1
    outcome: LO-01
    sections: [T01]
    minutes: 2
    points: 1
    prompt: 'Вычислите в уме: {{a}} + {{b}}.'
    answer: 373
    variants:
    - params: {a: 275, b: 98}
      answer: 373
      solution: |
        ### Ответ
        373

        ### Идея
        Число 98 близко к круглому 100 — компенсация.

        ### Шаги
        1. Выбор приёма: 98 близко к круглому 100, разница $100 - 98 = 2$.
        2. Прибавляем круглое число: $275 + 100 = 375$.
        3. Прибавили на 2 больше, чем нужно, — лишнее убираем: $375 - 2 = 373$.

        ### Проверка
        Вычитанием: $373 - 98 = 373 - 100 + 2 = 275$.

        ### Типичная ошибка
        E-num-mental-arithmetic-comp-add-sign: прибавить разницу и получить 377.
    hints:
    - Второе слагаемое 98 близко к круглому числу — воспользуйтесь этим.
    - Прибавьте круглое число и уберите то, что прибавили лишнего.
    - Сколько не хватает 98 до 100?
    solution: |
      ### Ответ
      373

      ### Идея
      Число 98 близко к круглому 100 — компенсация.

      ### Шаги
      1. Выбор приёма: 98 близко к круглому 100, разница $100 - 98 = 2$.
      2. Прибавляем круглое число: $275 + 100 = 375$.
      3. Прибавили на 2 больше, чем нужно, — лишнее убираем: $375 - 2 = 373$.

      ### Проверка
      Вычитанием: $373 - 98 = 373 - 100 + 2 = 275$.

      ### Типичная ошибка
      E-num-mental-arithmetic-comp-add-sign: прибавить разницу и получить 377.
    feedback:
      correct: 'Верно: 98 заменено круглым 100, и разница убрана.'
      wrong:
        what: Сумма не совпала.
        why: Возможно, разница прибавлена или забыта.
        fix: Прибавили круглое — лишнее вычтите.
        next: Раздел T01, компенсация.
      misconceptions:
      - id: E-num-mental-arithmetic-comp-add-sign
        when:
          expr: a + 20*ceil (b/10) - b
        message: Разница прибавлена, а её нужно вычесть.
      - id: E-num-mental-arithmetic-comp-add-forgot
