# Интервальное повторение (STANDARD.md §8): 6 задач, у каждой 3 варианта, по одной на приём темы.
# Числа и формулировки не повторяют практику, примеры теории, финальную цепочку и контрольную (правило 172).
tasks:
- id: R-01
  type: number
  role: refresh
  purpose: procedure
  level: 1
  outcome: LO-01
  sections: [T01]
  minutes: 2
  prompt: 'Вычислите в уме: {{a}} + {{b}}.'
  answer: 313
  variants:
  - params: {a: 264, b: 49}
    answer: 313
    solution: |
      ### Ответ
      313

      ### Идея
      Число 49 близко к круглому 50: прибавляем круглое и убираем разницу.

      ### Шаги
      1. Выбор приёма: 49 близко к круглому 50, разница $50 - 49 = 1$.
      2. Прибавляем круглое число: $264 + 50 = 314$.
      3. Прибавили на 1 больше, чем нужно, — лишнее убираем: $314 - 1 = 313$.

      ### Проверка
      Вычитанием: $313 - 49 = 313 - 50 + 1 = 264$.

      ### Типичная ошибка
      E-num-mental-arithmetic-comp-add-sign: прибавить разницу вместо вычитания и получить 315.
  - params: {a: 518, b: 199}
    answer: 717
    solution: |
      ### Ответ
      717

      ### Идея
      Число 199 близко к круглому 200: прибавляем круглое и убираем разницу.

      ### Шаги
      1. Выбор приёма: 199 близко к круглому 200, разница $200 - 199 = 1$.
      2. Прибавляем круглое число: $518 + 200 = 718$.
      3. Прибавили на 1 больше, чем нужно, — лишнее убираем: $718 - 1 = 717$.

      ### Проверка
      Вычитанием: $717 - 199 = 717 - 200 + 1 = 518$.

      ### Типичная ошибка
      E-num-mental-arithmetic-comp-add-sign: прибавить разницу вместо вычитания и получить 719.
  - params: {a: 73, b: 18}
    answer: 91
    solution: |
      ### Ответ
      91

      ### Идея
      Число 18 близко к круглому 20: прибавляем круглое и убираем разницу.

      ### Шаги
      1. Выбор приёма: 18 близко к круглому 20, разница $20 - 18 = 2$.
      2. Прибавляем круглое число: $73 + 20 = 93$.
      3. Прибавили на 2 больше, чем нужно, — лишнее убираем: $93 - 2 = 91$.

      ### Проверка
      Вычитанием: $91 - 18 = 91 - 20 + 2 = 73$.

      ### Типичная ошибка
      E-num-mental-arithmetic-comp-add-sign: прибавить разницу вместо вычитания и получить 95.
  hints:
  - Второе слагаемое близко к круглому — это можно использовать.
  - Прибавьте круглое число и уберите то, что прибавили сверх нужного.
  - До какого круглого числа числу {{b}} не хватает совсем немного?
  solution: |
    ### Ответ
    Сумма {{a}} + {{b}}.

    ### Идея
    Компенсация.

    ### Шаги
    1. Прибавить круглое.
    2. Убрать разницу.

    ### Проверка
    Обратное действие.

    ### Типичная ошибка
    E-num-mental-arithmetic-comp-add-sign.
  feedback:
    correct: 'Верно: компенсация по-прежнему работает — круглое число прибавлено, лишнее убрано.'
    wrong:
      what: Сумма не совпала.
      why: Возможно, разница прибавлена вместо вычитания или забыта.
      fix: Прибавили круглое число — значит, лишнее надо вычесть.
      next: Раздел T01, компенсация при сложении.
    misconceptions:
    - id: E-num-mental-arithmetic-comp-add-sign
      when:
        expr: a + 20*ceil (b/10) - b
      message: Разница прибавлена, а её нужно вычесть.
    - id: E-num-mental-arithmetic-comp-add-forgot
      when:
        expr: a + 10*ceil (b/10)
      message: Это сумма с круглым числом — разница не убрана.
  errors: [E-num-mental-arithmetic-comp-add-sign, E-num-mental-arithmetic-comp-add-forgot]
- id: R-02
  type: number
  role: refresh
  purpose: procedure
  level: 2
  outcome: LO-01
  sections: [T02]
  minutes: 2
  prompt: 'Вычислите в уме по частям: {{a}} − {{b}}.'
  answer: 558
  variants:
  - params: {a: 834, b: 276}
    answer: 558
    solution: |
      ### Ответ
      558

      ### Идея
      Вычитаем 276 по частям, недостающие единицы берём через круглое число.

      ### Шаги
      1. Раскладываем вычитаемое по разрядам: $276 = 200 + 70 + 6$.
      2. Сотни: $834 - 200 = 634$.
      3. Десятки: $634 - 70 = 564$.
      4. Единиц 4, а вычесть надо 6 — идём через круглое число: $564 - 4 = 560$, $560 - 2 = 558$.

      ### Проверка
      Сложением: $558 + 276 = 834$.

      ### Типичная ошибка
      E-num-mental-arithmetic-ones-swap: вычесть единицы «из большей цифры меньшую» и получить 562.
  - params: {a: 615, b: 348}
    answer: 267
    solution: |
      ### Ответ
      267

      ### Идея
      Вычитаем 348 по частям, недостающие единицы берём через круглое число.

      ### Шаги
      1. Раскладываем вычитаемое по разрядам: $348 = 300 + 40 + 8$.
      2. Сотни: $615 - 300 = 315$.
      3. Десятки: $315 - 40 = 275$.
      4. Единиц 5, а вычесть надо 8 — идём через круглое число: $275 - 5 = 270$, $270 - 3 = 267$.

      ### Проверка
      Сложением: $267 + 348 = 615$.

      ### Типичная ошибка
      E-num-mental-arithmetic-ones-swap: вычесть единицы «из большей цифры меньшую» и получить 273.
  - params: {a: 93, b: 47}
    answer: 46
    solution: |
      ### Ответ
      46

      ### Идея
      Вычитаем 47 по частям, недостающие единицы берём через круглое число.

      ### Шаги
      1. Раскладываем вычитаемое по разрядам: $47 = 40 + 7$.
      2. Десятки: $93 - 40 = 53$.
      3. Единиц 3, а вычесть надо 7 — идём через круглое число: $53 - 3 = 50$, $50 - 4 = 46$.

      ### Проверка
      Сложением: $46 + 47 = 93$.

      ### Типичная ошибка
      E-num-mental-arithmetic-ones-swap: вычесть единицы «из большей цифры меньшую» и получить 54.
  hints:
  - Отнимайте вычитаемое разряд за разрядом.
  - Когда единиц в уменьшаемом меньше, чем нужно вычесть, спуститесь до круглого числа.
  - Начните с вычитания сотен или десятков числа {{b}} из {{a}}.
  solution: |
    ### Ответ
    Разность {{a}} − {{b}}.

    ### Идея
    Вычитание по частям.

    ### Шаги
    1. Разложить.
    2. Вычесть по разрядам.

    ### Проверка
    Сложить с вычитаемым.

    ### Типичная ошибка
    E-num-mental-arithmetic-ones-swap.
  feedback:
    correct: 'Верно: вычитание по частям не подвело и через несколько дней — единицы взяты через круглое число.'
    wrong:
      what: Разность не совпала.
      why: Возможно, единицы вычтены «из большей цифры меньшую».
      fix: Спуститесь до круглого числа и вычтите остаток единиц.
      next: Раздел T02, вычитание по частям.
    misconceptions:
    - id: E-num-mental-arithmetic-ones-swap
      when:
        expr: 10*(floor (a/10) - floor (b/10)) + abs (mod (a, 10) - mod (b, 10))
      message: 'Цифры единиц переставлены: десяток не разменян, ответ больше верного.'
  errors: [E-num-mental-arithmetic-ones-swap]
- id: R-03
  type: number
  role: refresh
  purpose: procedure
  level: 2
  outcome: LO-01
  sections: [T02]
  minutes: 2
  prompt: Вам нужно {{a}} ₽, а у вас {{b}} ₽. Сколько рублей не хватает?
  answer: 635
  variants:
  - params: {a: 1000, b: 365}
    answer: 635
    solution: |
      ### Ответ
      635

      ### Идея
      Нужная сумма 1000 круглая — считаем вверх от 365.

      ### Шаги
      1. От 365 до 370 — это 5.
      2. От 370 до 400 — это 30.
      3. От 400 до 1000 — это 600.
      4. Складываем прыжки: $5 + 30 + 600 = 635$.

      ### Проверка
      Сложением: $365 + 635 = 1000$.

      ### Типичная ошибка
      E-num-mental-arithmetic-comp-sub-forgot: потерять первый прыжок до 370 и ответить 630.
  - params: {a: 500, b: 287}
    answer: 213
    solution: |
      ### Ответ
      213

      ### Идея
      Нужная сумма 500 круглая — считаем вверх от 287.

      ### Шаги
      1. От 287 до 290 — это 3.
      2. От 290 до 300 — это 10.
      3. От 300 до 500 — это 200.
      4. Складываем прыжки: $3 + 10 + 200 = 213$.

      ### Проверка
      Сложением: $287 + 213 = 500$.

      ### Типичная ошибка
      E-num-mental-arithmetic-comp-sub-forgot: потерять первый прыжок до 290 и ответить 210.
  - params: {a: 900, b: 746}
    answer: 154
    solution: |
      ### Ответ
      154

      ### Идея
      Нужная сумма 900 круглая — считаем вверх от 746.

      ### Шаги
      1. От 746 до 750 — это 4.
      2. От 750 до 800 — это 50.
      3. От 800 до 900 — это 100.
      4. Складываем прыжки: $4 + 50 + 100 = 154$.

      ### Проверка
      Сложением: $746 + 154 = 900$.

      ### Типичная ошибка
      E-num-mental-arithmetic-comp-sub-forgot: потерять первый прыжок до 750 и ответить 150.
  hints:
  - Нехватка — сколько нужно добавить к тому, что есть, чтобы получить нужное.
  - Считайте вверх от имеющейся суммы через круглые числа и складывайте прыжки.
  - Сколько рублей добавить к {{b}}, чтобы получить ближайшее круглое число?
  solution: |
    ### Ответ
    Нехватка {{a}} − {{b}}.

    ### Идея
    Счёт вверх.

    ### Шаги
    1. Прыжки до круглых чисел.
    2. Сложить прыжки.

    ### Проверка
    Обратное действие.

    ### Типичная ошибка
    E-num-mental-arithmetic-comp-sub-forgot.
  feedback:
    correct: 'Верно: счёт вверх через круглые числа дал нехватку без единого вычитания.'
    wrong:
      what: Нехватка посчитана неверно.
      why: Возможно, потерян первый короткий прыжок.
      fix: Выпишите все прыжки от имеющейся суммы до нужной и сложите их.
      next: Раздел T02, счёт вверх.
    misconceptions:
    - id: E-num-mental-arithmetic-comp-sub-forgot
      when:
        expr: a - 10*ceil (b/10)
      message: 'Первый короткий прыжок потерян: его тоже нужно прибавить.'
  errors: [E-num-mental-arithmetic-comp-sub-forgot]
- id: R-04
  type: numbers
  role: refresh
  purpose: procedure
  level: 2
  outcome: LO-02
  sections: [T03]
  minutes: 2
  prompt: Найдите оценки снизу и сверху для суммы {{a}} + {{b}}, округляя слагаемые до десятков.
  fields:
  - id: lo
    label: Оценка снизу
  - id: hi
    label: Оценка сверху
  answer: &id001 {lo: 680, hi: 700}
  variants:
  - params: {a: 238, b: 455}
    answer: *id001
    solution: |
      ### Ответ
      снизу 680, сверху 700

      ### Идея
      Слагаемые вниз дают оценку снизу, вверх — оценку сверху.

      ### Шаги
      1. Снизу: $230 + 450 = 680$.
      2. Сверху: $240 + 460 = 700$.

      ### Проверка
      Точно: $238 + 455 = 693$ — между 680 и 700.

      ### Типичная ошибка
      E-num-mental-arithmetic-bound-nearest: для оценки снизу округлить по обычному правилу и получить 700.
  - params: {a: 167, b: 324}
    answer: {lo: 480, hi: 500}
    solution: |
      ### Ответ
      снизу 480, сверху 500

      ### Идея
      Слагаемые вниз дают оценку снизу, вверх — оценку сверху.

      ### Шаги
      1. Снизу: $160 + 320 = 480$.
      2. Сверху: $170 + 330 = 500$.

      ### Проверка
      Точно: $167 + 324 = 491$ — между 480 и 500.

      ### Типичная ошибка
      E-num-mental-arithmetic-bound-nearest: для оценки снизу округлить по обычному правилу и получить 490.
  - params: {a: 509, b: 286}
    answer: {lo: 780, hi: 800}
    solution: |
      ### Ответ
      снизу 780, сверху 800

      ### Идея
      Слагаемые вниз дают оценку снизу, вверх — оценку сверху.

      ### Шаги
      1. Снизу: $500 + 280 = 780$.
      2. Сверху: $510 + 290 = 800$.

      ### Проверка
      Точно: $509 + 286 = 795$ — между 780 и 800.

      ### Типичная ошибка
      E-num-mental-arithmetic-bound-nearest: для оценки снизу округлить по обычному правилу и получить 800.
  hints:
  - Для оценок суммы каждое слагаемое округляют в одну и ту же сторону.
  - Оба слагаемых вниз — оценка снизу, оба вверх — оценка сверху.
  - Округлите {{a}} вниз и вверх до десятков.
  solution: |
    ### Ответ
    Оценки суммы {{a}} + {{b}}.

    ### Идея
    Оба вниз и оба вверх.

    ### Шаги
    1. Снизу.
    2. Сверху.

    ### Проверка
    Точная сумма между оценками.

    ### Типичная ошибка
    E-num-mental-arithmetic-bound-nearest.
  feedback:
    correct: 'Верно: у суммы оба слагаемых округлены в одну сторону, и точная сумма зажата между оценками.'
    wrong:
      what: Хотя бы одна оценка не совпала.
      why: Возможно, для оценки снизу использовано обычное округление.
      fix: Для оценки снизу округляйте оба слагаемых только вниз, для оценки сверху — только вверх.
      next: Раздел T03, оценки суммы.
    misconceptions:
    - id: E-num-mental-arithmetic-bound-nearest
      when:
        field:
          id: lo
          expr: 10*floor (a/10 + 1/2) + 10*floor (b/10 + 1/2)
      message: Оценка снизу получена обычным округлением — одно слагаемое при этом выросло.
  errors: [E-num-mental-arithmetic-bound-nearest]
- id: R-05
  type: number
  role: refresh
  purpose: procedure
  level: 1
  outcome: LO-02
  sections: [T04]
  minutes: 2
  prompt: Проверьте сложением запись {{a}} − {{b}} = {{c}}. Какое число получится при проверке?
  answer: 413
  trivial_answer_ok: true
  variants:
  - params: {a: 413, b: 168, c: 245}
    answer: 413
    solution: |
      ### Ответ
      413

      ### Идея
      Проверка вычитания — сложение результата и вычитаемого.

      ### Шаги
      1. $245 + 168 = 413$.
      2. Получилось уменьшаемое 413 — запись верна.

      ### Проверка
      Прикидка: $410 - 170 = 240$ — близко к 245.

      ### Типичная ошибка
      E-num-mental-arithmetic-check-subtract-again: вычесть ещё раз, $245 - 168 = 77$, и ничего не проверить.
  - params: {a: 650, b: 273, c: 377}
    answer: 650
    solution: |
      ### Ответ
      650

      ### Идея
      Проверка вычитания — сложение результата и вычитаемого.

      ### Шаги
      1. $377 + 273 = 650$.
      2. Получилось уменьшаемое 650 — запись верна.

      ### Проверка
      Прикидка: $650 - 270 = 380$ — близко к 377.

      ### Типичная ошибка
      E-num-mental-arithmetic-check-subtract-again: вычесть ещё раз, $377 - 273 = 104$, и ничего не проверить.
  - params: {a: 702, b: 345, c: 367}
    answer: 712
    solution: |
      ### Ответ
      712

      ### Идея
      Проверка вычитания — сложение результата и вычитаемого.

      ### Шаги
      1. $367 + 345 = 712$.
      2. Получилось 712, а не 702 — запись неверна; верно 357.

      ### Проверка
      Верная разность проходит проверку: $357 + 345 = 702$.

      ### Типичная ошибка
      E-num-mental-arithmetic-check-subtract-again: вычесть ещё раз, $367 - 345 = 22$, и ничего не проверить.
  hints:
  - Вспомните, какое действие обратно вычитанию.
  - 'Сложите результат с вычитаемым: верная запись вернёт уменьшаемое.'
  - Сложите {{c}} и {{b}}, например, по частям.
  solution: |
    ### Ответ
    Сумма {{c}} и {{b}}.

    ### Идея
    Проверка сложением.

    ### Шаги
    1. Сложить.
    2. Сравнить с {{a}}.

    ### Проверка
    Прикидка.

    ### Типичная ошибка
    E-num-mental-arithmetic-check-subtract-again.
  feedback:
    correct: 'Верно: обратное действие к вычитанию выбрано правильно, и сложение выполнено точно.'
    wrong:
      what: Число проверки не совпало.
      why: Возможно, проверяли вычитанием или ошиблись в сложении.
      fix: Сложите результат с вычитаемым и сравните с уменьшаемым.
      next: Раздел T04, таблица проверки.
    misconceptions:
    - id: E-num-mental-arithmetic-check-subtract-again
      when:
        expr: c - b
      message: Вычитаемое снова вычтено — проверяют сложением.
  errors: [E-num-mental-arithmetic-check-subtract-again]
- id: R-06
  type: number
  role: refresh
  purpose: procedure
  level: 2
  outcome: LO-03
  sections: [T05]
  minutes: 2
  prompt: Вычислите {{a}} − {{b}}, сдвинув оба числа так, чтобы вычитаемое стало круглым.
  answer: 438
  variants:
  - params: {a: 734, b: 296}
    answer: 438
    solution: |
      ### Ответ
      438

      ### Идея
      Сдвигаем оба числа на 4: вычитаемое станет круглым, разность не изменится.

      ### Шаги
      1. $734 + 4 = 738$, $296 + 4 = 300$.
      2. $738 - 300 = 438$.

      ### Проверка
      Сложением: $438 + 296 = 734$.

      ### Типичная ошибка
      E-num-mental-arithmetic-comp-sub-forgot: сдвинуть только вычитаемое и получить 434.
  - params: {a: 521, b: 197}
    answer: 324
    solution: |
      ### Ответ
      324

      ### Идея
      Сдвигаем оба числа на 3: вычитаемое станет круглым, разность не изменится.

      ### Шаги
      1. $521 + 3 = 524$, $197 + 3 = 200$.
      2. $524 - 200 = 324$.

      ### Проверка
      Сложением: $324 + 197 = 521$.

      ### Типичная ошибка
      E-num-mental-arithmetic-comp-sub-forgot: сдвинуть только вычитаемое и получить 321.
  - params: {a: 863, b: 398}
    answer: 465
    solution: |
      ### Ответ
      465

      ### Идея
      Сдвигаем оба числа на 2: вычитаемое станет круглым, разность не изменится.

      ### Шаги
      1. $863 + 2 = 865$, $398 + 2 = 400$.
      2. $865 - 400 = 465$.

      ### Проверка
      Сложением: $465 + 398 = 863$.

      ### Типичная ошибка
      E-num-mental-arithmetic-comp-sub-forgot: сдвинуть только вычитаемое и получить 463.
  hints:
  - Разность не меняется, если оба числа увеличить на одно и то же.
  - Подберите сдвиг, после которого вычитаемое станет круглым, и прибавьте его к обоим числам.
  - Сколько не хватает {{b}} до круглого? Столько же прибавьте к {{a}}.
  solution: |
    ### Ответ
    Разность после сдвига.

    ### Идея
    Сдвиг обоих чисел.

    ### Шаги
    1. Сдвинуть.
