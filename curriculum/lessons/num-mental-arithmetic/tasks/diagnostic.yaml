# Входная диагностика (STANDARD.md §6, правило 15): по прямым пререквизитам num-mult-properties
# (компенсация и умножение суммы на число) и num-rounding (округление до разряда, оценка суммы сверху).
#
# Правило 160 просит вести `sections` в пакет пререквизита (`<prereq>/Tnn`), но схема
# (`common.schema.json#/$defs/sectionRef`, шаблон ^T[0-9]{2}$) и проверка REF-SECTION принимают только
# разделы своего пакета. Как в topics/_example, здесь стоят разделы этой темы, где навык пререквизита
# работает; связь с пререквизитом несёт `outcome`. Вопрос — в описании PR.
# Подсказки оставлены, хотя правило 15 просит диагностику без них: `schemas/dist.schema.json` требует
# ровно три подсказки у каждой задачи (тот же вопрос в REVIEW.md образца).
# ID outcome пререквизитов (LO-01/LO-02) нужно сверить с принятыми пакетами при интеграции.
tasks:
- id: D-01
  type: number
  role: diagnostic
  purpose: procedure
  level: 1
  outcome: num-mult-properties/LO-02
  sections: [T01]
  minutes: 1
  prompt: 'Вычислите $7 \cdot 29$: умножьте 7 на 30 и сделайте поправку.'
  answer: 203
  hints:
  - Замените множитель 29 близким круглым числом, а потом поправьте результат.
  - 'Компенсация при умножении: с круглым множителем получается лишняя группа — её убирают.'
  - Начните с $7 \cdot 30$; сколько семёрок в этом произведении лишние?
  solution: |
    ### Ответ
    203

    ### Идея
    Множитель 29 заменяют круглым 30, а потом убирают лишнюю группу из семи.

    ### Шаги
    1. $7 \cdot 30 = 210$.
    2. В $7 \cdot 30$ на одну группу из 7 больше, чем в $7 \cdot 29$: $210 - 7 = 203$.

    ### Проверка
    По частям: $7 \cdot 20 + 7 \cdot 9 = 140 + 63 = 203$.

    ### Типичная ошибка
    Ошибка темы-пререквизита, в каталоге её пока нет: остановиться на 210 и не убрать лишнюю группу или вычесть единицу вместо целой группы и получить 209. При сложении тот же сбой — E-num-mental-arithmetic-comp-add-forgot.
  feedback:
    correct: 'Верно: при умножении поправка — целая группа из семи, и её вычли из 210.'
    wrong:
      what: Произведение не совпало с верным.
      why: Возможно, поправку не сделали или вычли единицу вместо целой группы.
      fix: Посчитайте 7 · 30 и вычтите одну группу — семь.
      next: Повторите округление и компенсацию в теме «Свойства умножения и приёмы устного счёта».
- id: D-02
  type: number
  role: diagnostic
  purpose: procedure
  level: 1
  outcome: num-mult-properties/LO-01
  sections: [T02]
  minutes: 1
  prompt: Вычислите $6 \cdot 47$, разложив 47 на десятки и единицы.
  answer: 282
  hints:
  - Удобнее умножать круглые и однозначные числа — разбейте второй множитель на части.
  - 'Умножение суммы на число: каждую часть умножают на 6, результаты складывают.'
  - Запишите $47 = 40 + 7$ и начните с $6 \cdot 40$.
  solution: |
    ### Ответ
    282

    ### Идея
    Умножение суммы на число: 47 = 40 + 7, каждую часть умножаем на 6 и складываем.

    ### Шаги
    1. $6 \cdot 40 = 240$.
    2. $6 \cdot 7 = 42$.
    3. $240 + 42 = 282$.

    ### Проверка
    Компенсацией: $6 \cdot 50 - 6 \cdot 3 = 300 - 18 = 282$.

    ### Типичная ошибка
    Ошибка темы-пререквизита, в каталоге её пока нет: умножить только десятки и ответить 240 — вторая часть числа 47 потеряна. При сложении по частям тот же сбой — E-num-mental-arithmetic-parts-lost-ones.
  feedback:
    correct: 'Верно: обе части числа 47 умножены на 6, и результаты сложены.'
    wrong:
      what: Произведение не совпало.
      why: Возможно, умножена только одна часть числа 47.
      fix: Умножьте на 6 и десятки, и единицы, затем сложите.
      next: Повторите умножение суммы на число в теме «Свойства умножения и приёмы устного счёта».
- id: D-03
  type: number
  role: diagnostic
  purpose: procedure
  level: 0
  outcome: num-rounding/LO-01
  sections: [T03]
  minutes: 1
  prompt: Округлите 645 до сотен.
  answer: 600
  hints:
  - Найдите две соседние круглые сотни, между которыми лежит число.
  - Решает первая отброшенная цифра — та, что стоит сразу правее разряда сотен.
  - Цифра десятков в 645 — четвёрка; сравните её с пятью.
  solution: |
    ### Ответ
    600

    ### Идея
    Округление до сотен решает первая отброшенная цифра — цифра десятков.

    ### Шаги
    1. 645 лежит между соседними сотнями 600 и 700.
    2. Первая отброшенная цифра — 4, она меньше 5, поэтому округляем вниз.

    ### Проверка
    645 ближе к 600: до 600 — 45, до 700 — 55.

    ### Типичная ошибка
    Ошибка темы-пререквизита, в каталоге её пока нет: решать по цифре единиц 5 и округлить вверх до 700.
  feedback:
    correct: 'Верно: цифра десятков 4 меньше пяти, поэтому 645 округляется вниз.'
    wrong:
      what: Сотня выбрана неверно.
      why: Возможно, решение принималось по цифре единиц, а не по первой отброшенной цифре.
      fix: Посмотрите на цифру сразу справа от разряда сотен.
      next: Повторите округление до разряда в теме «Округление и прикидка результата».
- id: D-04
  type: number
  role: diagnostic
  purpose: procedure
  level: 1
  outcome: num-rounding/LO-02
  sections: [T03]
  minutes: 1
  prompt: 'Оцените сумму $38 + 43$ сверху: округлите оба слагаемых вверх до десятков и сложите.'
  answer: 90
  hints:
  - Оценка сверху не меньше точной суммы — слагаемые можно только увеличивать.
  - Замените каждое слагаемое ближайшим круглым десятком сверху.
  - 38 округляется вверх до 40; до какого десятка округляется вверх 43?
  solution: |
    ### Ответ
    90

    ### Идея
    Если оба слагаемых только увеличить, сумма тоже увеличится — это оценка сверху.

    ### Шаги
    1. Вверх до десятков: 38 → 40, 43 → 50.
    2. $40 + 50 = 90$.

    ### Проверка
    Точно: $38 + 43 = 81$, и 81 меньше 90 — оценка действительно сверху.

    ### Типичная ошибка
    E-num-mental-arithmetic-bound-nearest: округлить 43 по обычному правилу вниз до 40 и получить 80 — это меньше точной суммы 81.
  feedback:
    correct: 'Верно: оба слагаемых только выросли, поэтому сумма 90 не меньше точной.'
    wrong:
      what: Оценка сверху не совпала.
      why: Возможно, одно из слагаемых округлено вниз по обычному правилу.
      fix: Для оценки сверху округляйте каждое слагаемое только вверх.
      next: Повторите оценку сверху и снизу в теме «Округление и прикидка результата».
    misconceptions:
    - id: E-num-mental-arithmetic-bound-nearest
      when:
        answer: 80
      message: Слагаемое 43 округлено по обычному правилу вниз — такая сумма может оказаться меньше точной.
  errors: [E-num-mental-arithmetic-bound-nearest]
