# tree.yaml дословно (правило 6).
id: num-add-meaning
title: Сложение как объединение и прибавление
section: num
stage: 1
hours: 2
grade: "1"
prerequisites: [num-line]
version: "1.1.0"
summary: >
  Сложение — это объединение двух групп в одну и движение вправо по числовому лучу.
  Тема вводит знак плюс, названия «слагаемое» и «сумма», случаи прибавления нуля и единицы
  и приём прикидки: сумма не меньше каждого слагаемого.

search:
  synonyms:
    - сложение чисел
    - что такое сумма
    - что такое слагаемое
    - знак плюс
    - сложение как объединение групп
    - прибавление по числовому лучу
    - сложение для начинающих
    - сколько всего предметов
    - прибавить ноль
    - прибавить один
    - сумма двух чисел
    - сложение до десяти
  questions:
    - Что значит сложить два числа?
    - Как называются числа при сложении?
    - Что показывает знак плюс?
    - Как сложить числа по числовому лучу?
    - Чему равно число плюс ноль?
    - Что получится, если прибавить один?
    - Почему сумма не бывает меньше слагаемого?
    - Как проверить, что сумма посчитана правильно?
    - Почему при сложении становится больше, а не меньше?

subtopics:
  - id: num-add-meaning/terms
    title: Слагаемое, сумма, знак плюс
    tree_ref: Слагаемое, сумма, знак плюс
    synonyms: [названия чисел при сложении, знак действия сложения, запись суммы]
    sections: [T01]
  - id: num-add-meaning/combine
    title: Объединение двух групп
    tree_ref: Объединение двух групп
    synonyms: [сколько всего, две группы в одну, сложение по картинке]
    sections: [T02, T05]
  - id: num-add-meaning/move-right
    title: Прибавление как движение вправо по лучу
    tree_ref: Прибавление как движение вправо по лучу
    synonyms: [прыжки по числовому лучу, сдвиг вправо, сложение на прямой]
    sections: [T03]
  - id: num-add-meaning/zero-one
    title: Прибавление нуля и прибавление единицы
    tree_ref: Прибавление нуля и прибавление единицы
    synonyms: [число плюс ноль, число плюс один, следующее число]
    sections: [T04]

outcomes:
  - id: LO-01
    short: Складывает группы, ноль и единицу
    action: вычисляет сумму объединением непересекающихся групп и досчётом, называет слагаемые и сумму
    conditions: слагаемые от 0 до 10, сумма не больше 20; без калькулятора
    criterion: верно называет слагаемые и сумму и вычисляет итог, включая 0 + a, a + 0 и a + 1
    level: core
    sections:
      - T01
      - T02
      - T04
  - id: LO-02
    short: Моделирует сложение на числовом луче
    action: показывает сложение движением вправо по лучу и находит конечную координату по данным прыжкам
    conditions: старт и длина прыжков — целые числа от 0 до 10, шаг луча равен 1
    criterion: верно называет конечную координату и строит единичные прыжки по записи a + b
    level: standard
    sections: [T03]
  - id: LO-03
    short: Проверяет суммы и перебирает
    action: проверяет суммы прикидкой и точным счётом, находит наибольшее допустимое добавление и число разных сумм
    conditions: неотрицательные целые слагаемые до 10, суммы до 20; небольшие конечные наборы
    criterion: отбрасывает невозможный итог, проверяет оставшийся точным счётом и перечисляет случаи без пропусков и повторов
    level: deep
    sections:
      - T02
      - T04
      - T05

errors:
  - E-num-add-meaning-first-group
  - E-num-add-meaning-count-on-off
  - E-num-add-meaning-zero-eats
  - E-num-add-meaning-glue-digits
  - E-num-add-meaning-zero-as-one
