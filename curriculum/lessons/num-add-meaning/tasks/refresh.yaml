  - id: R-05
    type: number
    role: refresh
    purpose: method
    level: 2
    outcome: LO-03
    sections: [T05]
    minutes: 4
    prompt: "Какая из сумм больше: {{a}} + 2 или {{a}} + 1? Введите значение большей из них."
    answer: 5
    variants:
      - params: {a: 3}
        answer: 5
        solution: |
          ### Ответ
          5

          ### Идея
          К известному количеству досчитываем вторую группу. Сам старт не считается новым шагом.

          ### Шаги
          1. Из одного старта 3 два шага уводят дальше одного; выбираем прибавление 2.
          2. Старт — 3, прибавляем 2.
          3. Называем числа после старта: 4, 5. Последнее число — 5.
          4. 3 + 2 = 5.

          ### Проверка
          Меньшая сумма 3 + 1 = 4, большая 3 + 2 = 5; 5 больше 4.

          ### Типичная ошибка
          E-num-add-meaning-count-on-off: первое слово досчёта идёт после старта, не совпадает с ним.
      - params: {a: 5}
        answer: 7
        solution: |
          ### Ответ
          7

          ### Идея
          К известному количеству досчитываем вторую группу. Сам старт не считается новым шагом.

          ### Шаги
          1. Из одного старта 5 два шага уводят дальше одного; выбираем прибавление 2.
          2. Старт — 5, прибавляем 2.
          3. Называем числа после старта: 6, 7. Последнее число — 7.
          4. 5 + 2 = 7.

          ### Проверка
          Меньшая сумма 5 + 1 = 6, большая 5 + 2 = 7; 7 больше 6.

          ### Типичная ошибка
          E-num-add-meaning-count-on-off: первое слово досчёта идёт после старта, не совпадает с ним.
      - params: {a: 6}
        answer: 8
        solution: |
          ### Ответ
          8

          ### Идея
          К известному количеству досчитываем вторую группу. Сам старт не считается новым шагом.

          ### Шаги
          1. Из одного старта 6 два шага уводят дальше одного; выбираем прибавление 2.
          2. Старт — 6, прибавляем 2.
          3. Называем числа после старта: 7, 8. Последнее число — 8.
          4. 6 + 2 = 8.

          ### Проверка
          Меньшая сумма 6 + 1 = 7, большая 6 + 2 = 8; 8 больше 7.

          ### Типичная ошибка
          E-num-add-meaning-count-on-off: первое слово досчёта идёт после старта, не совпадает с ним.
    hints:
      - Обе суммы стартуют из одного числа {{a}}.
      - Одна делает два прыжка вправо, другая — один.
      - Больше прыжков — дальше вправо, значит больше сумма.
    solution: |
      ### Ответ
      Большая сумма — {{a}} + 2.

      ### Идея
      Из одного старта два прыжка уводят дальше, чем один.

      ### Шаги
      1. Обе суммы начинаются в точке {{a}}.
      2. {{a}} + 2 делает на один прыжок больше, поэтому лежит правее.

      ### Проверка
      Точное значение {{a}} + 2 равно ответу.

      ### Типичная ошибка
      Сравнивать по первому слагаемому, не глядя на число прыжков.
      Проверьте также, не пропущен ли единичный переход при счёте (E-num-add-meaning-count-on-off).
    feedback:
      correct: Верно — большая из двух сумм — {{a}} + 2.
      wrong:
        what: Введённое значение не совпало со значением большей суммы.
        why: Возможно, не учтено, что обе суммы стартуют из одной точки.
        fix: "Сравните вторые слагаемые: 2 больше 1."
        next: Карточка раздела T05.
