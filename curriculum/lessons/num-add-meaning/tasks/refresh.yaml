# Повторение (STANDARD.md §8): 5 задач, у каждой не менее трёх вариантов.
tasks:
  - id: R-01
    type: number
    role: refresh
    purpose: procedure
    level: 1
    outcome: LO-01
    sections: [T01, T02]
    minutes: 2
    prompt: Вычислите {{a}} + {{b}}.
    answer: 5
    variants:
      - params: {a: 2, b: 3}
        answer: 5
        solution: |
          ### Ответ
          5

          ### Идея
          К известному количеству досчитываем вторую группу. Сам старт не считается новым шагом.

          ### Шаги
          1. Старт — 2, прибавляем 3.
          2. Называем числа после старта: 3, 4, 5. Последнее число — 5.
          3. 2 + 3 = 5.

          ### Проверка
          Начнём с 3 и выполним единичные прыжки; их число — 2. Конечная координата — 5. Это тот же счёт двух групп в другом порядке.

          ### Типичная ошибка
          E-num-add-meaning-count-on-off: первое слово досчёта идёт после старта, не совпадает с ним.
      - params: {a: 4, b: 4}
        answer: 8
        solution: |
          ### Ответ
          8

          ### Идея
          К известному количеству досчитываем вторую группу. Сам старт не считается новым шагом.

          ### Шаги
          1. Старт — 4, прибавляем 4.
          2. Называем числа после старта: 5, 6, 7, 8. Последнее число — 8.
          3. 4 + 4 = 8.

          ### Проверка
          Начнём с 4 и выполним единичные прыжки; их число — 4. Конечная координата — 8. Это тот же счёт двух групп в другом порядке.

          ### Типичная ошибка
          E-num-add-meaning-count-on-off: первое слово досчёта идёт после старта, не совпадает с ним.
      - params: {a: 5, b: 4}
        answer: 9
        solution: |
          ### Ответ
          9

          ### Идея
          К известному количеству досчитываем вторую группу. Сам старт не считается новым шагом.

          ### Шаги
          1. Старт — 5, прибавляем 4.
          2. Называем числа после старта: 6, 7, 8, 9. Последнее число — 9.
          3. 5 + 4 = 9.

          ### Проверка
          Начнём с 4 и выполним единичные прыжки; их число — 5. Конечная координата — 9. Это тот же счёт двух групп в другом порядке.

          ### Типичная ошибка
          E-num-add-meaning-count-on-off: первое слово досчёта идёт после старта, не совпадает с ним.
    hints:
      - Сложите две группы в одну.
      - Досчитывайте от большего слагаемого.
      - Назовите {{b|pl:число,числа,чисел}} после числа {{a}}.
    solution: |
      ### Ответ
      Сумма чисел {{a}} и {{b}}.

      ### Идея
      Сложение объединяет группы.

      ### Шаги
      1. Старт с большего слагаемого.
      2. Досчитываем меньшее слагаемое и получаем сумму.

      ### Проверка
      Сумма больше каждого слагаемого.

      ### Типичная ошибка
      E-num-add-meaning-count-on-off: Сбиться на единицу при досчитывании.
    feedback:
      correct: Верно — {{a}} + {{b}} — сумма найдена счётом.
      wrong:
        what: Сумма не совпала.
        why: Возможно, сбой при досчитывании.
        fix: Первое слово счёта — число после старта.
        next: Карточка раздела T01.

