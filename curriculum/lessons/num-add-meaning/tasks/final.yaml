# Финальная цепочка (STANDARD.md §8): один сюжет, 5 шагов, общие параметры во всех вариантах.
title: Утро кафе «Перрон»
context_id: cafe-perron-morning
scenario: >
  Утро в кафе «Перрон»: бариста варит кофе в двух машинах, пекарня привозит круассаны,
  в зал заходят гости, а курьер отправляется с доставкой по улице. Все итоги утра
  находятся сложением.
tasks:
  - id: F-01
    type: number
    role: final-step
    purpose: procedure
    level: 1
    outcome: LO-01
    sections: [T01]
    minutes: 1
    depends_on: []
    prompt: К утру первая машина приготовила чашки кофе; их число — {{a}}. Число чашек из второй машины — {{b}}. Сколько всего
      чашек кофе приготовили?
    answer: 5
    variants:
      - params: {a: 2, b: 3, c: 1, d: 4, s: 3, k: 4, g: 2, h: 3}
        answer: 5
        solution: |
          ### Ответ
          5

          ### Идея
          Две машины приготовили две отдельные партии кофе. Считаем все чашки вместе.

          ### Шаги
          1. Первая партия — 2, вторая — 3.
          2. После числа 2 называем: 3, 4, 5.
          3. Последнее число — 5; 2 + 3 = 5.

          ### Проверка
          Посчитаем в другом порядке: от 3 выполним единичные шаги, их число — 2. Придём к 5; чашки обеих машин учтены.

          ### Типичная ошибка
          E-num-add-meaning-first-group: не пропускайте партию второй машины.
      - params: {a: 4, b: 2, c: 3, d: 1, s: 2, k: 5, g: 3, h: 1}
        answer: 6
        solution: |
          ### Ответ
          6

          ### Идея
          Две машины приготовили две отдельные партии кофе. Считаем все чашки вместе.

          ### Шаги
          1. Первая партия — 4, вторая — 2.
          2. После числа 4 называем: 5, 6.
          3. Последнее число — 6; 4 + 2 = 6.

          ### Проверка
          Посчитаем в другом порядке: от 2 выполним единичные шаги, их число — 4. Придём к 6; чашки обеих машин учтены.

          ### Типичная ошибка
          E-num-add-meaning-first-group: не пропускайте партию второй машины.
      - params: {a: 1, b: 5, c: 2, d: 1, s: 4, k: 3, g: 1, h: 4}
        answer: 6
        solution: |
          ### Ответ
          6

          ### Идея
          Две машины приготовили две отдельные партии кофе. Считаем все чашки вместе.

          ### Шаги
          1. Первая партия — 1, вторая — 5.
          2. После числа 1 называем: 2, 3, 4, 5, 6.
          3. Последнее число — 6; 1 + 5 = 6.

          ### Проверка
          Посчитаем в другом порядке: от 5 выполним единичные шаги, их число — 1. Придём к 6; чашки обеих машин учтены.

          ### Типичная ошибка
          E-num-add-meaning-first-group: не пропускайте партию второй машины.
      - params: {a: 3, b: 4, c: 2, d: 1, s: 6, k: 2, g: 4, h: 2}
        answer: 7
        solution: |
          ### Ответ
          7

          ### Идея
          Две машины приготовили две отдельные партии кофе. Считаем все чашки вместе.

          ### Шаги
          1. Первая партия — 3, вторая — 4.
          2. После числа 3 называем: 4, 5, 6, 7.
          3. Последнее число — 7; 3 + 4 = 7.

          ### Проверка
          Посчитаем в другом порядке: от 4 выполним единичные шаги, их число — 3. Придём к 7; чашки обеих машин учтены.

          ### Типичная ошибка
          E-num-add-meaning-first-group: не пропускайте партию второй машины.
      - params: {a: 2, b: 2, c: 0, d: 6, s: 1, k: 6, g: 0, h: 5}
        answer: 4
        solution: |
          ### Ответ
          4

          ### Идея
          Две машины приготовили две отдельные партии кофе. Считаем все чашки вместе.

          ### Шаги
          1. Первая партия — 2, вторая — 2.
          2. После числа 2 называем: 3, 4.
          3. Последнее число — 4; 2 + 2 = 4.

          ### Проверка
          Посчитаем в другом порядке: от 2 выполним единичные шаги, их число — 2. Придём к 4; чашки обеих машин учтены.

          ### Типичная ошибка
          E-num-add-meaning-first-group: не пропускайте партию второй машины.
      - params: {a: 1, b: 1, c: 3, d: 2, s: 5, k: 4, g: 2, h: 2}
        answer: 2
        solution: |
          ### Ответ
          2

          ### Идея
          Две машины приготовили две отдельные партии кофе. Считаем все чашки вместе.

          ### Шаги
          1. Первая партия — 1, вторая — 1.
          2. После числа 1 называем: 2.
          3. Последнее число — 2; 1 + 1 = 2.

          ### Проверка
          Посчитаем в другом порядке: от 1 выполним единичные шаги, их число — 1. Придём к 2; чашки обеих машин учтены.

          ### Типичная ошибка
          E-num-add-meaning-first-group: не пропускайте партию второй машины.
    hints:
      - Кофе из двух машин объединяется в одну партию.
      - Какое действие объединяет группы?
      - Досчитайте {{b|pl:число,числа,чисел}} после числа {{a}}.
    solution: |
      ### Ответ
      Чашек кофе — сумма {{a}} и {{b}}.

      ### Идея
      Две партии кофе объединяются — считаем сложением.

      ### Шаги
      1. Партии: {{a}} и {{b}} (число чашек).
      2. Объединяем: {{a}} + {{b}}.

      ### Проверка
      Чашек больше, чем сварила каждая машина по отдельности.

      ### Типичная ошибка
      E-num-add-meaning-first-group: Посчитать только первую машину.
    feedback:
      correct: Верно — чашки двух машин объединены — {{a}} + {{b}}.
      wrong:
        what: Число чашек не совпало.
        why: Возможно, вторая партия не присоединена.
        fix: Досчитайте {{b}} после {{a}}.
        next: Пример 1 раздела T01.

