# Входная диагностика (STANDARD.md §6, правило 15): 4 задачи по прямому пререквизиту num-line,
# outcome записывается как `num-line/LO-NN` (пакет пререквизита ещё не опубликован).
tasks:
  - id: D-01
    type: number
    role: diagnostic
    purpose: procedure
    level: 0
    outcome: num-line/LO-01
    sections: [T01]
    minutes: 1
    prompt: Начало отсчёта луча отмечено числом 0. Точка A стоит на 6 единичных отрезков правее нуля. Введите координату точки A.
    answer: 6
    hints:
      - Каждый единичный отрезок сдвигает точку на одно число вправо.
      - Считайте отрезки по порядку, начиная с числа, идущего сразу за нулём.
      - Отсчитайте от нуля шесть единичных отрезков подряд и посмотрите, на какой отметке закончится шестой.
    solution: |
      ### Ответ
      6

      ### Идея
      Координата точки — сколько единичных отрезков отложено от нуля до этой точки.

      ### Шаги
      1. От нуля отсчитываем отрезки по одному вправо.
      2. Шестой отрезок заканчивается в точке с координатой 6.

      ### Проверка
      Между 0 и 6 ровно шесть единичных отрезков.

      ### Типичная ошибка
      E-num-add-meaning-zero-eats: Назвать число отрезков на единицу меньше, если считать сам ноль первым шагом.
    feedback:
      correct: Верно, шесть отрезков от нуля приводят в точку 6.
      wrong:
        what: Координата не совпала.
        why: Возможно, счёт отрезков начался не с числа после нуля.
        fix: Отсчитайте от нуля шесть единичных отрезков по порядку.
        next: Повторите координату точки в теме про числовой луч.

  - id: D-02
    type: number
    role: diagnostic
    purpose: procedure
    level: 0
    outcome: num-line/LO-02
    sections: [T01]
    minutes: 1
    prompt: Какое число на числовом луче стоит сразу после числа 7? Введите это число.
    answer: 8
    hints:
      - Числа на луче идут по порядку слева направо.
      - Следующее число на один больше.
      - Сделайте от семи один шаг вправо.
    solution: |
      ### Ответ
      8

      ### Идея
      Сосед числа справа — следующее по счёту число, на единицу больше.

      ### Шаги
      1. На луче за числом 7 идёт число на 1 больше.
      2. 7 и один шаг вправо дают 8.

      ### Проверка
      Между 7 и 8 ровно один единичный отрезок.

      ### Типичная ошибка
      Назвать число слева от 7, перепутав направление луча.
      Проверьте также, не пропущен ли единичный переход при счёте (E-num-add-meaning-count-on-off).
    feedback:
      correct: Верно, сразу после 7 стоит 8.
      wrong:
        what: Названо другое число.
        why: Вероятно, перепутано направление — вправо числа растут.
        fix: Найдите на луче 7 и сделайте один шаг вправо.
        next: Повторите соседей числа в теме про числовой луч.

  - id: D-03
    type: number
    role: diagnostic
    purpose: meaning
    level: 1
    outcome: num-line/LO-02
    sections: [T01]
    minutes: 1
    prompt: Точка B стоит на луче в точке 5, а точка C — в точке 9. Введите координату точки, которая лежит правее.
    answer: 9
    hints:
      - На луче правее стоит то число, которое больше.
      - "Сравните координаты точек: 5 и 9."
      - Найдите оба числа на луче и посмотрите, какое из них стоит дальше от начала отсчёта.
    solution: |
      ### Ответ
      9

      ### Идея
      Чем правее точка на луче, тем больше её координата.

      ### Шаги
      1. Координаты точек: 5 и 9.
      2. 9 больше 5, значит точка C лежит правее.

      ### Проверка
      На луче точка 9 находится дальше от нуля, чем точка 5.

      ### Типичная ошибка
      Выбрать меньшую координату, перепутав «правее» и «ближе к нулю».
      Проверьте также, не пропущен ли единичный переход при счёте (E-num-add-meaning-count-on-off).
    feedback:
      correct: Верно, правее лежит точка с большей координатой.
      wrong:
        what: Выбрана не та координата.
        why: Вероятно, «правее» перепутано с «меньше».
        fix: "Сравните числа: правее стоит большее."
        next: Повторите сравнение чисел по лучу в теме про числовой луч.

  - id: D-04
    type: number
    role: diagnostic
    purpose: procedure
    level: 1
    outcome: num-line/LO-01
    sections: [T01]
    minutes: 1
    prompt: Сколько единичных отрезков укладывается на луче между числами 0 и 10? Введите число.
    answer: 10
    hints:
      - Каждый отрезок соединяет два соседних числа.
      - Посчитайте переходы от нуля к конечной отметке по одному.
      - Сколько отметок встретится на пути после старта, столько и отрезков.
    solution: |
      ### Ответ
      10

      ### Идея
      Число единичных отрезков между 0 и числом равно самому этому числу.

      ### Шаги
      1. От 0 до 1 считаем один отрезок, до 2 — два и так далее.
      2. До числа 10 получается десять отрезков.

      ### Проверка
      Десять шагов по одному приводят из 0 ровно в 10.

      ### Типичная ошибка
      E-num-add-meaning-count-on-off: Посчитать числа-отметки вместо промежутков между ними и получить 11.
    feedback:
      correct: Верно, между 0 и 10 десять единичных отрезков.
      wrong:
        what: Число отрезков не совпало.
        why: Возможно, посчитаны отметки, а не промежутки между ними.
        fix: Считайте сами отрезки-шаги от 0 до 10.
        next: Повторите единичный отрезок в теме про числовой луч.
