          - Выражение складывает группы, а не склеивает цифры.
        solution: |
          ### Ответ
          1 + 3

          ### Идея
          К стоявшей вазе присоединили новые — группы объединяются.

          ### Шаги
          1. Первая группа — 1 ваза, вторая — 3.
          2. Объединение записывается суммой 1 + 3.

          ### Проверка
          Значение выражения 4 — ваз стало больше, чем было.

          ### Типичная ошибка
          E-num-add-meaning-glue-digits: Записать 13, склеив цифры.
