        prompt: Какие из равенств верны? Отметьте все подходящие варианты.
        options:
          - id: a
            text: 5 + 0 = 5
          - id: b
            text: 3 + 1 = 3
            misconception: E-num-add-meaning-first-group
            why: Единица не присоединена.
          - id: c
            text: 2 + 6 = 8
          - id: d
            text: 1 + 3 = 13
            misconception: E-num-add-meaning-glue-digits
            why: Цифры склеены вместо сложения.
          - id: e
            text: 0 + 7 = 0
            misconception: E-num-add-meaning-zero-eats
