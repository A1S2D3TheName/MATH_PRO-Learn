      - id: EB-12
        type: number
        role: exam
        purpose: method
        level: 4
        points: 2
        outcome: LO-03
        sections:
          - T02
          - T05
        minutes: 4
        prompt: Сколько разных значений можно получить, складывая два числа из набора 2, 3 и 4? Одно число разрешено брать дважды.
          Введите количество разных значений.
        answer: 5
        hints:
          - Переберите все пары, включая одинаковые.
          - Выпишите значения и уберите повторы.
          - "Пары для проверки: 2 + 2, 2 + 3, 2 + 4, 3 + 3, 3 + 4, 4 + 4. Равные итоги считайте один раз."
        solution: |
          ### Ответ
          5

          ### Идея
          Перебираем пары без повторения их порядка, затем убираем повторяющиеся значения.

          ### Шаги
          1. Берём по очереди первым слагаемым 2, 3, 4; второе берём из той же позиции или правее.
          2. Вычисления: 2 + 2 = 4; 2 + 3 = 5; 2 + 4 = 6; 3 + 3 = 6; 3 + 4 = 7; 4 + 4 = 8.
          3. Разные значения: 4, 5, 6, 7, 8. Их 5.

          ### Проверка
          У каждой пары есть место в переборе. Обратный порядок не даёт нового значения. Пары 2 + 4 и 3 + 3 дают один итог — его нельзя учитывать дважды.

          ### Типичная ошибка
          E-num-add-meaning-count-on-off: пропустить число при досчёте; отдельно проверьте, что считаете значения, а не пары.
        feedback:
          correct: 'Верно: посчитаны различные значения, а совпавшие итоги учтены один раз.'
          wrong:
            what: Число разных сумм не совпало.
            why: Возможно, посчитаны пары вместо значений или пропущена одна из пар.
            fix: Выпишите значения пар и уберите повторы.
            next: Раздел T05.
