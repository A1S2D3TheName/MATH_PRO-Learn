          wrong:
            what: Выражение не описывает ситуацию.
            why: Возможно, группы не объединены или цифры склеены.
            fix: Запишите сложение двух групп.
            next: Раздел T02.

      - id: EB-11
        type: multi
        role: exam
        purpose: method
        level: 2
