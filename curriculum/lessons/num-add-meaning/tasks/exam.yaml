# Контрольная (STANDARD.md §8, правила 80–81): варианты A и B — по 12 задач, равные суммы баллов,
# одинаковое покрытие outcomes, уровни по неубыванию, разные условия.
variants:
  - id: A
    tasks:
      - id: EA-01
        type: number
        role: exam
        purpose: procedure
        level: 0
        points: 1
        outcome: LO-01
        sections: [T01, T02]
        minutes: 2
        prompt: Вычислите 4 + 3.
        answer: 7
        hints:
          - Сложите две группы в одну.
          - Досчитывайте от большего слагаемого.
          - Назовите три числа после четырёх.
        solution: |
          ### Ответ
          7

          ### Идея
          Группы из четырёх и трёх предметов объединяются.

          ### Шаги
          1. Старт с большего слагаемого 4.
          2. Досчитываем три числа: пять, шесть, семь.

          ### Проверка
          7 больше каждого слагаемого.

          ### Типичная ошибка
          E-num-add-meaning-count-on-off: Сбиться на единицу при досчитывании.
        feedback:
          correct: Верно — 4 + 3 = 7, группы объединены.
          wrong:
            what: Сумма не совпала.
            why: Возможно, сбой при досчитывании.
            fix: Первое слово счёта — число после старта.
            next: Раздел T01.

      - id: EA-02
        type: number
        role: exam
        purpose: procedure
        level: 1
        points: 1
        outcome: LO-01
        sections: [T01]
        minutes: 2
        prompt: Первое слагаемое 7, второе слагаемое 2. Чему равна сумма?
        answer: 9
        hints:
          - Сумма находится объединением групп.
          - Досчитайте второе слагаемое к первому.
          - Назовите два числа после семи.
        solution: |
          ### Ответ
          9

          ### Идея
          По слагаемым находим сумму.

          ### Шаги
          1. Запись: 7 + 2.
          2. Досчитываем два числа после семи.

          ### Проверка
          Сумма больше каждого слагаемого.

          ### Типичная ошибка
          E-num-add-meaning-first-group: Записать одно из слагаемых вместо суммы.
        feedback:
          correct: Верно — 7 + 2 = 9.
          wrong:
            what: Сумма не совпала.
            why: Возможно, второе слагаемое не присоединено.
            fix: Досчитайте два числа после семи.
            next: Раздел T01.

      - id: EA-03
        type: number
        role: exam
        purpose: procedure
        level: 1
        points: 1
        outcome: LO-02
        sections: [T03]
        minutes: 3
        prompt: Точка стоит на координате 5. Она передвинулась на 3 единичных отрезка вправо. Введите новую координату.
        answer: 8
        hints:
          - Каждый отрезок вправо — следующее число.
          - Старт не считается шагом.
          - Назовите три числа после пяти.
        solution: |
          ### Ответ
          8

          ### Идея
          Движение вправо — прибавление.

          ### Шаги
          1. Старт в точке 5.
          2. Три шага вправо: 6, 7, 8.

          ### Проверка
          Новая точка правее старой на три деления.

          ### Типичная ошибка
          E-num-add-meaning-count-on-off: Посчитать старт первым шагом.
        feedback:
          correct: Верно — от точки 5 три шага вправо дают 8.
          wrong:
            what: Координата не совпала.
            why: Возможно, сбой при счёте шагов.
            fix: Первый шаг приземляется на число после старта.
            next: Раздел T03.

      - id: EA-04
        type: number
        role: exam
        purpose: procedure
        level: 1
        points: 1
        outcome: LO-01
        sections: [T04]
        minutes: 2
        prompt: Вычислите 8 + 0.
        answer: 8
        hints:
          - Сравните число пирожков до доставки и после неё.
          - Пустая доставка не добавляет ни одного пирожка.
          - Назовите число, которое не меняется при прибавлении нуля.
        solution: |
          ### Ответ
          8

          ### Идея
          Ноль — пустая группа.

          ### Шаги
          1. К восьми предметам присоединяется пустая группа.
          2. 8 + 0 = 8.

          ### Проверка
          Прыжок на 0 по лучу не двигает точку.

          ### Типичная ошибка
          E-num-add-meaning-zero-eats: Ответить 0 вместо 8.
        feedback:
          correct: Верно — 8 + 0 = 8, пустая группа ничего не добавляет.
          wrong:
            what: Ответ не равен первому слагаемому.
            why: Возможно, ноль принят за результат.
            fix: Пустая группа ничего не добавляет.
            next: Раздел T04.

      - id: EA-05
        type: number
        role: exam
        purpose: meaning
        level: 2
        points: 1
        outcome: LO-01
        sections: [T02]
        minutes: 3
        prompt: В коробке 4 полностью красных яблока и 5 полностью зелёных, других яблок нет. Сколько всего яблок?
        answer: 9
        hints:
          - Яблоки двух цветов — две группы.
          - Вопрос «сколько всего» подсказывает действие.
          - Досчитайте пять чисел после четырёх.
        solution: |
          ### Ответ
          9

          ### Идея
          Группы яблок объединяются в одну.

          ### Шаги
          1. Группы: 4 и 5 яблок.
          2. Объединяем: 4 + 5 = 9.

          ### Проверка
          Яблок больше, чем красных, и больше, чем зелёных по отдельности.

          ### Типичная ошибка
          E-num-add-meaning-first-group: Посчитать яблоки только одного цвета.
        feedback:
          correct: Верно — 4 + 5 = 9 яблок.
          wrong:
            what: Число яблок не совпало.
            why: Возможно, одна из групп не присоединена.
            fix: Пересчитайте яблоки обоих цветов по порядку.
            next: Раздел T02.

      - id: EA-06
        type: number
        role: exam
        purpose: procedure
        level: 2
        points: 1
        outcome: LO-02
        sections: [T03]
        minutes: 3
        prompt: Кафе у метровой отметки 2. Курьер прошёл 6 м в сторону увеличения отметок; соседние отметки отличаются на 1.
          Введите конечную отметку.
        answer: 8
        hints:
          - Отметки растут вдоль улицы.
          - Движение вперёд — вправо по лучу.
          - Прибавьте шесть к отметке 2.
        solution: |
          ### Ответ
          8

          ### Идея
          Улица работает как числовой луч.

          ### Шаги
          1. Старт у отметки 2.
          2. Шесть метров вперёд: 3, 4, 5, 6, 7, 8.

          ### Проверка
          Отметка выросла ровно на шесть.

          ### Типичная ошибка
          E-num-add-meaning-first-group: Остаться на отметке старта.
        feedback:
          correct: Верно — от отметки 2 шесть метров вперёд дают 8.
          wrong:
            what: Отметка не совпала.
            why: Возможно, шаги не прибавлены к старту.
            fix: Назовите шесть отметок после второй.
            next: Раздел T03.

      - id: EA-07
        type: number
        role: exam
        purpose: meaning
        level: 2
        points: 1
        outcome: LO-01
        sections: [T04]
        minutes: 3
        prompt: В витрине 4 пирожка. Привезли 0, ничего не продали и не убрали. Сколько пирожков теперь в витрине?
        answer: 4
        hints:
          - Сколько пирожков в пустой доставке?
          - Пустая группа ничего не добавляет.
          - Запишите 4 + 0.
        solution: |
          ### Ответ
          4

          ### Идея
          Пустая поставка ничего не меняет.

          ### Шаги
          1. В витрине 4 пирожка, привезли 0.
          2. 4 + 0 = 4.

          ### Проверка
          Прыжок на 0 из точки 4 оставляет точку на месте.

          ### Типичная ошибка
          E-num-add-meaning-zero-eats: Ответить 0, «обнулив» витрину.
        feedback:
          correct: Верно — 4 + 0 = 4, доставка не изменила число пирожков.
          wrong:
            what: Число пирожков изменилось.
            why: Возможно, ноль принят за результат.
            fix: Пустая группа ничего не добавляет и не забирает.
            next: Раздел T04.

      - id: EA-08
        type: choice
        role: exam
        purpose: meaning
        level: 2
        points: 2
        outcome: LO-01
        sections: [T02]
        minutes: 3
        prompt: В зале был 1 гость, затем зашли ещё 2 гостя. Никто не ушёл. Какое выражение подходит для подсчёта гостей?
        options:
          - id: a
            text: 1 + 2
          - id: b
            text: 1 + 1
            misconception: E-num-add-meaning-count-on-off
            why: Прибавлено на одного гостя меньше.
          - id: c
            text: "12"
            misconception: E-num-add-meaning-glue-digits
            why: Цифры склеены вместо сложения.
          - id: d
            text: "1"
            misconception: E-num-add-meaning-first-group
            why: Новые гости не присоединены.
        answer: a
        hints:
          - Какие две группы нужно объединить?
          - Новых гостей два, а не один.
          - Выражение складывает группы, а не склеивает цифры.
        solution: |
          ### Ответ
          1 + 2

          ### Идея
          К тем, кто был, присоединились новые гости — группы объединяются.

          ### Шаги
          1. Первая группа — 1 гость, вторая — 2.
          2. Объединение записывается суммой 1 + 2.

          ### Проверка
          Значение выражения 3 — гостей стало больше, чем было.

          ### Типичная ошибка
          E-num-add-meaning-glue-digits: Записать 12, склеив цифры.
        feedback:
          correct: Верно — выражение 1 + 2 описывает объединение групп.
          wrong:
            what: Выражение не описывает ситуацию.
            why: Возможно, группы не объединены или цифры склеены.
            fix: Запишите сложение двух групп.
            next: Раздел T02.

      - id: EA-11
        type: multi
        role: exam
        purpose: method
        level: 2
        points: 2
        outcome: LO-03
        sections: [T04, T05]
        minutes: 4
        prompt: Отметьте все верные равенства.
        options:
          - id: a
            text: 6 + 0 = 6
          - id: b
            text: 2 + 1 = 2
            misconception: E-num-add-meaning-first-group
            why: Единица не присоединена.
          - id: c
            text: 4 + 4 = 8
          - id: d
            text: 1 + 2 = 12
            misconception: E-num-add-meaning-glue-digits
            why: Цифры склеены вместо сложения.
          - id: e
            text: 0 + 9 = 0
            misconception: E-num-add-meaning-zero-eats
            why: Запись неверна — ноль ничего не добавляет, и второе слагаемое не исчезает.
        answer: [a, c]
        hints:
          - Проверяйте каждое равенство отдельно.
          - Ноль не меняет число с любой стороны.
          - Сумма ненулевых чисел больше каждого слагаемого.
        solution: |
          ### Ответ
          Верны 6 + 0 = 6 и 4 + 4 = 8.

          ### Идея
          Каждое равенство проверяется правилом или счётом.

          ### Шаги
          1. 6 + 0 = 6: ноль ничего не добавляет.
          2. 4 + 4 = 8: верный счёт.
          3. Остальные неверны: 2 + 1 равно 3, 1 + 2 равно 3, а 0 + 9 равно 9.

          ### Проверка
          Отмеченные записи подтверждены, остальные опровергнуты.

          ### Типичная ошибка
          E-num-add-meaning-zero-eats: Отметить запись, где ноль обнуляет результат.
        feedback:
          correct: Верно — только 6 + 0 = 6 и 4 + 4 = 8 — остальные записи неверны.
          wrong:
            what: Набор равенств неверен.
            why: Возможно, одна из записей с нулём или склейкой цифр принята за верную.
            fix: Проверьте каждое равенство точным счётом.
            next: Раздел T05.

      - id: EA-09
        type: number
        role: exam
        purpose: method
        level: 3
        points: 2
        outcome: LO-03
        sections: [T05]
        minutes: 3
        prompt: В чужой записи получилось 3 + 6 = 3. Введите правильный ответ.
        answer: 9
        hints:
          - Может ли сумма равняться первому слагаемому, когда второе не ноль?
          - Второе слагаемое 6, значит сумма больше трёх.
          - Досчитайте шесть чисел после трёх.
        solution: |
          ### Ответ
          9

          ### Идея
          Прикидка отвергает ответ из чужой записи, точный счёт исправляет его.

          ### Шаги
          1. Второе слагаемое не ноль, поэтому сумма больше 3.
          2. Досчитываем шесть чисел после трёх: четыре, пять, шесть, семь, восемь, девять.

          ### Проверка
          9 правее обоих слагаемых на луче.

          ### Типичная ошибка
          E-num-add-meaning-first-group: Повторить ошибку из чужой записи: не присоединить вторую группу.
        feedback:
          correct: Верно — 3 + 6 = 9, а не 3.
          wrong:
            what: Ответ не совпал с верной суммой.
            why: Возможно, вторая группа не присоединена.
            fix: Досчитайте шесть чисел после трёх.
            next: Раздел T05.

      - id: EA-10
        type: number
        role: exam
        purpose: transfer
        level: 3
        points: 2
        outcome: LO-02
        sections: [T03]
        minutes: 3
        prompt: Начало карандаша лежит у отметки 4 на линейке с единичными делениями. Карандаш сдвинули на 5 делений вправо.
          Введите новую отметку его начала.
        answer: 9
        hints:
          - Отметки линейки — координаты на луче.
          - Сдвиг вправо прибавляет деления.
          - Прибавьте пять к отметке 4.
        solution: |
          ### Ответ
          9

          ### Идея
          Сдвиг по линейке — та же модель луча в новой обстановке.

          ### Шаги
          1. Старт у отметки 4.
          2. Сдвиг на 5 вправо приводит к отметке 4 + 5 = 9.

          ### Проверка
          Новая отметка правее старой на пять делений.

          ### Типичная ошибка
          E-num-add-meaning-first-group: Не прибавить сдвиг к отметке старта.
        feedback:
          correct: Верно — отметка 4 плюс 5 делений дают 9.
          wrong:
            what: Отметка не совпала.
            why: Возможно, сдвиг не прибавлен к старту.
            fix: Назовите пять отметок после четвёртой.
            next: Раздел T03.

      - id: EA-12
        type: number
        role: exam
        purpose: method
        level: 4
        points: 2
        outcome: LO-03
        sections:
          - T02
          - T05
        minutes: 4
        prompt: Сколько разных значений можно получить, складывая два числа из набора 1, 3 и 5? Одно число разрешено брать дважды.
          Введите количество разных значений.
        answer: 5
        hints:
          - Переберите все пары, включая одинаковые.
          - Выпишите значения и уберите повторы.
          - "Пары для проверки: 1 + 1, 1 + 3, 1 + 5, 3 + 3, 3 + 5, 5 + 5. Равные итоги считайте один раз."
        solution: |
          ### Ответ
          5

          ### Идея
          Перебираем пары без повторения их порядка, затем убираем повторяющиеся значения.

          ### Шаги
          1. Берём по очереди первым слагаемым 1, 3, 5; второе берём из той же позиции или правее.
          2. Вычисления: 1 + 1 = 2; 1 + 3 = 4; 1 + 5 = 6; 3 + 3 = 6; 3 + 5 = 8; 5 + 5 = 10.
          3. Разные значения: 2, 4, 6, 8, 10. Их 5.

          ### Проверка
          У каждой пары есть место в переборе. Обратный порядок не даёт нового значения. Пары 1 + 5 и 3 + 3 дают один итог — его нельзя учитывать дважды.

          ### Типичная ошибка
          E-num-add-meaning-count-on-off: пропустить число при досчёте; отдельно проверьте, что считаете значения, а не пары.
        feedback:
          correct: 'Верно: посчитаны различные значения, а совпавшие итоги учтены один раз.'
          wrong:
            what: Число разных сумм не совпало.
            why: Возможно, посчитаны пары вместо значений или пропущена одна из пар.
            fix: Выпишите значения пар и уберите повторы.
            next: Раздел T05.

