        sections: [T02]
        minutes: 3
        prompt: На столе стояла 1 ваза, затем принесли ещё 3 вазы. Ничего не убрали. Какое выражение подходит для подсчёта ваз?
        options:
          - id: a
            text: 1 + 3
          - id: b
            text: 1 + 2
            misconception: E-num-add-meaning-count-on-off
            why: Прибавлено на одну вазу меньше.
          - id: c
            text: "13"
            misconception: E-num-add-meaning-glue-digits
            why: Цифры склеены вместо сложения.
