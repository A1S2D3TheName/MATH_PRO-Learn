  - id: P-29
    type: multi
    role: independent
    purpose: method
    level: 2
    outcome: LO-03
    sections: [T04, T05]
    minutes: 4
    prompt: Отметьте все верные утверждения.
    options:
      - id: a
        text: 7 + 0 = 7
      - id: b
        text: 0 + 4 = 4
      - id: c
        text: 5 + 1 = 5
        misconception: E-num-add-meaning-first-group
        why: Единица не присоединена, сумма равна первому слагаемому.
      - id: d
        text: 1 + 0 = 10
        misconception: E-num-add-meaning-glue-digits
        why: Цифры склеены вместо сложения.
      - id: e
        text: 6 + 0 = 0
        misconception: E-num-add-meaning-zero-eats
        why: Ноль «съел» шестёрку.
    answer: [a, b]
    hints:
      - Прибавление нуля не меняет число с любой стороны.
      - Прибавление единицы даёт следующее число.
      - Сумма не может оказаться меньше ненулевого слагаемого.
    solution: |
      ### Ответ
      Верны утверждения 7 + 0 = 7 и 0 + 4 = 4.

      ### Идея
      Ноль не меняет число ни на первом, ни на втором месте; единица добавляет один.

      ### Шаги
      1. 7 + 0 = 7: пустая группа ничего не добавляет.
      2. 0 + 4 = 4: пустая группа на первом месте тоже ничего не добавляет.
      3. Остальные записи неверны: 5 + 1 равно 6, 1 + 0 равно 1, а 6 + 0 равно 6.

      ### Проверка
      Каждая отмеченная запись подтверждена правилом, каждая неотмеченная опровергнута.

      ### Типичная ошибка
      E-num-add-meaning-zero-eats: Решить, что ноль в начале записи обнуляет сумму.
    feedback:
      correct: Верно, правила нуля и единицы применены точно.
      wrong:
        what: Набор отмеченных утверждений неверен.
        why: Возможно, одна из записей с нулём истолкована как «обнуление».
        fix: Ноль ничего не добавляет — число остаётся самим собой.
        next: Оба правила в разделе T04.

