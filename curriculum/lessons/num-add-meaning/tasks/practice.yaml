  - id: P-07
    type: table-fill
    role: supported
    purpose: method
    level: 1
    outcome: LO-03
    sections:
      - T02
      - T05
    minutes: 4
    prompt: 'В таблице объединяют непересекающиеся группы. Выберите способ проверки: сначала оцените, должна ли сумма быть больше каждого
      слагаемого, затем досчитайте. Заполните столбец «сумма».'
    table:
      columns: [слагаемое, слагаемое, сумма]
      rows:
        - [3, 4, null]
        - [2, 6, null]
        - [1, 8, null]
    shape: [3, 3]
    answer:
      - {r: 0, c: 2, value: 7}
      - {r: 1, c: 2, value: 8}
      - {r: 2, c: 2, value: 9}
    hints:
      - Сумма в строке — это объединение двух групп этой строки.
      - В первой строке к трём предметам прибавляют четыре.
      - Досчитайте второе слагаемое к первому в каждой строке.
    solution: |
      ### Ответ
      Суммы 7, 8 и 9.

      ### Идея
      В каждой строке складываем два слагаемых.

      ### Шаги
