# Основной банк (STANDARD.md §6–§8): 30 задач без challenge + 1 challenge, роли warmup/supported/
# independent, доли уровней 10/30/30/20/10 (±5 п.п.). Сквозной сюжет — кафе «Перрон».
tasks:
  # ---------------------------------------------------------------- warmup
  - id: P-01
    type: number
    role: warmup
    purpose: procedure
    level: 0
    outcome: LO-01
    sections: [T02]
    minutes: 1
    prompt: Вычислите {{a}} + {{b}}.
    answer: 7
    variants:
      - params: {a: 3, b: 4}
        answer: 7
        solution: |
          ### Ответ
          7

          ### Идея
          К известному количеству досчитываем вторую группу. Сам старт не считается новым шагом.

          ### Шаги
          1. Старт — 3, прибавляем 4.
          2. Называем числа после старта: 4, 5, 6, 7. Последнее число — 7.
          3. 3 + 4 = 7.

          ### Проверка
          Начнём с 4 и выполним единичные прыжки; их число — 3. Конечная координата — 7. Это тот же счёт двух групп в другом порядке.

          ### Типичная ошибка
          E-num-add-meaning-count-on-off: первое слово досчёта идёт после старта, не совпадает с ним.
      - params: {a: 2, b: 6}
        answer: 8
        solution: |
          ### Ответ
          8

          ### Идея
          К известному количеству досчитываем вторую группу. Сам старт не считается новым шагом.

          ### Шаги
          1. Старт — 2, прибавляем 6.
          2. Называем числа после старта: 3, 4, 5, 6, 7, 8. Последнее число — 8.
          3. 2 + 6 = 8.

          ### Проверка
          Начнём с 6 и выполним единичные прыжки; их число — 2. Конечная координата — 8. Это тот же счёт двух групп в другом порядке.

          ### Типичная ошибка
          E-num-add-meaning-count-on-off: первое слово досчёта идёт после старта, не совпадает с ним.
    hints:
      - Сложить — значит объединить две группы и пересчитать, сколько всего.
      - Начните со второго слагаемого и досчитайте столько чисел, сколько показывает первое.
      - После числа {{b}} назовите {{a|pl:следующее число,следующих числа,следующих чисел}} по порядку.
    solution: |
      ### Ответ
      Сумма чисел {{a}} и {{b}}.

      ### Идея
      Объединяем две группы и пересчитываем предметы по порядку.

      ### Шаги
      1. Первое слагаемое {{a}}, второе {{b}}.
      2. К группе с количеством предметов {{b}} присоединяем группу из {{a}} и досчитываем.

      ### Проверка
      Сумма больше каждого слагаемого.

      ### Типичная ошибка
      E-num-add-meaning-first-group: Остановиться на первом слагаемом и не присоединить вторую группу.
    feedback:
      correct: Верно, группы объединены и пересчитаны.
      wrong:
        what: Сумма не совпала.
        why: Возможно, вторая группа не присоединена или счёт сбился на единицу.
        fix: Досчитайте от большего слагаемого столько чисел, сколько показывает меньшее.
        next: Разберите пример 1 раздела T01.

  - id: P-02
    type: number
    role: warmup
    purpose: meaning
    level: 0
    outcome: LO-01
    sections: [T02]
    minutes: 1
    prompt: 'На подносе две отдельные группы напитков: чашки кофе — {{a}}, стаканы сока — {{b}}. Сколько всего напитков на подносе?'
    answer: 5
    variants:
      - params: {a: 2, b: 3}
        answer: 5
        solution: |
          ### Ответ
          5

          ### Идея
          К известному количеству досчитываем вторую группу. Сам старт не считается новым шагом.

          ### Шаги
          1. Старт — 2, прибавляем 3.
          2. Называем числа после старта: 3, 4, 5. Последнее число — 5.
          3. 2 + 3 = 5.

          ### Проверка
          Начнём с 3 и выполним единичные прыжки; их число — 2. Конечная координата — 5. Это тот же счёт двух групп в другом порядке.

          ### Типичная ошибка
          E-num-add-meaning-count-on-off: первое слово досчёта идёт после старта, не совпадает с ним.
      - params: {a: 4, b: 2}
        answer: 6
        solution: |
          ### Ответ
          6

          ### Идея
          К известному количеству досчитываем вторую группу. Сам старт не считается новым шагом.

          ### Шаги
          1. Старт — 4, прибавляем 2.
          2. Называем числа после старта: 5, 6. Последнее число — 6.
          3. 4 + 2 = 6.

          ### Проверка
          Начнём с 2 и выполним единичные прыжки; их число — 4. Конечная координата — 6. Это тот же счёт двух групп в другом порядке.

          ### Типичная ошибка
          E-num-add-meaning-count-on-off: первое слово досчёта идёт после старта, не совпадает с ним.
    hints:
      - Обе группы напитков надо объединить в одну.
      - Какое действие объединяет группы?
      - Старт — {{a}}. Досчитывайте со следующего числа; количество новых шагов — {{b}}.
    solution: |
      ### Ответ
      Всего напитков — сумма {{a}} и {{b}}.

      ### Идея
      Две группы напитков объединяются в одну — это сложение.

      ### Шаги
      1. Первая группа — {{a}}, вторая — {{b}}.
      2. Записываем {{a}} + {{b}} и пересчитываем объединённую группу.

      ### Проверка
      Напитков больше, чем чашек, и больше, чем стаканов по отдельности.

      ### Типичная ошибка
      E-num-add-meaning-first-group: Посчитать только одну из групп.
    feedback:
      correct: Верно, обе группы объединены.
      wrong:
        what: Число напитков не совпало.
        why: Возможно, одна из групп не присоединена к другой.
        fix: Пересчитайте сначала чашки, затем продолжите счёт стаканами.
        next: Модель «группа + группа» в разделе T02.

  - id: P-03
    type: number
    role: warmup
    purpose: procedure
    level: 1
    outcome: LO-02
    sections: [T03]
    minutes: 1
    prompt: Точка с координатой {{x}} переместилась вправо на {{k|pl:единичный отрезок,единичных отрезка,единичных отрезков}}. Введите новую координату.
    answer: 6
    variants:
