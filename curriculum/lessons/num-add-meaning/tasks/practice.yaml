        solution: |
          ### Ответ
          6

          ### Идея
          К известному количеству досчитываем вторую группу. Сам старт не считается новым шагом.

          ### Шаги
          1. Старт — 4, прибавляем 2.
          2. Называем числа после старта: 5, 6. Последнее число — 6.
          3. 4 + 2 = 6.

          ### Проверка
          Начнём с 2 и выполним единичные прыжки; их число — 4. Конечная координата — 6. Это тот же счёт двух групп в другом порядке.

          ### Типичная ошибка
          E-num-add-meaning-count-on-off: первое слово досчёта идёт после старта, не совпадает с ним.
      - params: {x: 3, k: 4}
        answer: 7
        solution: |
          ### Ответ
          7

          ### Идея
          К известному количеству досчитываем вторую группу. Сам старт не считается новым шагом.

          ### Шаги
          1. Старт — 3, прибавляем 4.
          2. Называем числа после старта: 4, 5, 6, 7. Последнее число — 7.
          3. 3 + 4 = 7.

          ### Проверка
          Начнём с 4 и выполним единичные прыжки; их число — 3. Конечная координата — 7. Это тот же счёт двух групп в другом порядке.

          ### Типичная ошибка
          E-num-add-meaning-count-on-off: первое слово досчёта идёт после старта, не совпадает с ним.
    hints:
      - Каждый единичный отрезок вправо — следующее число.
      - Старт — первое слагаемое, число отрезков — второе.
      - Назовите {{k|pl:число,числа,чисел}} подряд сразу после числа {{x}}.
    solution: |
      ### Ответ
      Новая координата — сумма {{x}} и {{k}}.

      ### Идея
      Движение вправо по лучу — это прибавление.

      ### Шаги
      1. Старт в точке {{x}}.
      2. Единичные прыжки в количестве {{k}} приводят в точку {{x}} + {{k}}.

      ### Проверка
      Новая точка правее старой ровно на {{k|pl:отрезок,отрезка,отрезков}}.

      ### Типичная ошибка
      E-num-add-meaning-count-on-off: Назвать сам старт первым шагом и сбиться на единицу.
    feedback:
      correct: Верно, прыжки посчитаны от точки старта.
      wrong:
        what: Координата не совпала.
        why: Вероятно, точка старта названа первым шагом.
        fix: Первый прыжок приземляется на число сразу после старта.
        next: Пример 1 раздела T03.

  - id: P-04
    type: number
    role: warmup
    purpose: procedure
    level: 1
    outcome: LO-01
    sections: [T04]
    minutes: 1
    prompt: Вычислите {{a}} + {{b}}.
    answer: 5
    variants:
      - params: {a: 5, b: 0}
        answer: 5
        solution: |
          ### Ответ
          5

          ### Идея
          К известному количеству досчитываем вторую группу. Сам старт не считается новым шагом.

          ### Шаги
          1. Старт — 5, прибавляем 0.
          2. Ни одного шага не делаем: остаётся 5.
          3. 5 + 0 = 5.

          ### Проверка
          Начнём с 0 и выполним единичные прыжки; их число — 5. Конечная координата — 5. Это тот же счёт двух групп в другом порядке.

          ### Типичная ошибка
          E-num-add-meaning-zero-eats: пустая группа не убирает уже посчитанные предметы.
      - params: {a: 9, b: 0}
        answer: 9
        solution: |
          ### Ответ
          9

          ### Идея
          К известному количеству досчитываем вторую группу. Сам старт не считается новым шагом.

          ### Шаги
          1. Старт — 9, прибавляем 0.
          2. Ни одного шага не делаем: остаётся 9.
          3. 9 + 0 = 9.

          ### Проверка
          Начнём с 0 и выполним единичные прыжки; их число — 9. Конечная координата — 9. Это тот же счёт двух групп в другом порядке.

          ### Типичная ошибка
          E-num-add-meaning-zero-eats: пустая группа не убирает уже посчитанные предметы.
    hints:
      - Что значит прибавить ноль предметов?
      - Ноль — пустая группа, она ничего не добавляет.
      - Посмотрите на прыжок длиной 0 по лучу из точки {{a}}.
    solution: |
      ### Ответ
      {{a}}

      ### Идея
      Прибавить ноль — присоединить пустую группу, число не меняется.

      ### Шаги
      1. Вторая группа пустая: в ней 0 предметов.
      2. Объединение с пустой группой ничего не добавляет: {{a}} + 0 = {{a}}.

      ### Проверка
      На луче прыжок длиной 0 из точки {{a}} оставляет точку на месте.

      ### Типичная ошибка
      E-num-add-meaning-zero-eats: Ответить 0: ноль ничего не «съедает», он ничего не добавляет.
    feedback:
      correct: Верно, прибавление нуля число не меняет.
      wrong:
        what: Ответ не равен первому слагаемому.
        why: Возможно, ноль принят за результат всего выражения.
        fix: "Представьте пустую группу: предметов столько же, сколько было."
        next: Правило a + 0 в разделе T04.
      misconceptions:
        - id: E-num-add-meaning-zero-eats
          when:
            expr: "0"
          message: "Ноль не съедает число: прибавить ноль — значит ничего не добавить, число остаётся прежним."

