  - id: P-30
    type: number
    role: challenge
    optional: true
    purpose: transfer
    level: 5
    outcome: LO-01
    sections: [T02, T05]
    minutes: 5
    prompt: Три разных целых числа, каждое больше нуля, в сумме дают 6. Какое самое большое из этих трёх чисел? Введите одно
      число.
    answer: 3
    hints:
      - Начните с наименьшего возможного числа больше нуля — единицы.
      - Возьмите 1 и 2 и проверьте, подходит ли такая тройка.
      - Сложите 1 и 2, а затем подумайте, каким числом можно дополнить эту сумму до шести.
    solution: |
      ### Ответ
      3

      ### Идея
      Перебираем тройки разных положительных чисел с суммой 6.

      ### Шаги
      1. Наименьшие разные числа больше нуля: 1 и 2; их сумма 3.
      2. Третье число должно дать в сумме 6: это 3, и оно отлично от первых двух.
      3. Расположим числа от меньшего к большему: первое не меньше 1, второе не меньше 2, третье не меньше 3. Их минимальная сумма уже равна 6; увеличение любого числа превысит 6.

      ### Проверка
      1 + 2 + 3 = 6, все числа разные и больше нуля.

      ### Типичная ошибка
      Взять число 0: по условию все три числа больше нуля.
      Проверьте также, не пропущен ли единичный переход при счёте (E-num-add-meaning-count-on-off).
    feedback:
      correct: Верно, тройка единственная.
      wrong:
        what: Число не подходит.
        why: Возможно, тройка не даёт сумму 6 или нарушает условие «разные и больше нуля».
        fix: Начните с 1 и 2 и подберите третье число до суммы 6.
        next: Прикидка суммы в разделе T05.

