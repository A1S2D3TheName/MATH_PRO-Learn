# Паспорт темы (STANDARD.md §3). Поля section/stage/hours/grade/prerequisites/scope скопированы из
# tree.yaml — не редактируйте их здесь (правило 6).
id: num-digits
title: "Цифры и запись чисел до 20"
section: num
stage: 1
hours: 2
grade: "1"
prerequisites: [num-counting]
version: "1.0.0"
summary: >
  Число и цифра — разные вещи: цифра это один знак записи, а число отвечает на вопрос «сколько».
  Тема учит записывать числа первого десятка, раскладывать числа второго десятка на полный
  десяток и ещё несколько, читать запись вслух и проверять запись на ошибки.

search:
  synonyms:  # не менее 10
    - цифры и числа
    - чем цифра отличается от числа
    - сколько цифр в записи числа
    - запись числа до 20
    - как записать число
    - числа первого десятка
    - числа второго десятка
    - состав числа
    - десяток и ещё несколько
    - как читается запись числа
    - чтение записи вслух
    - проверка записи числа
  questions:  # не менее 8 естественных русских вопросов
    - Чем цифра отличается от числа?
    - Сколько цифр в записи числа 17?
    - Как записать число 12 цифрами?
    - Что такое запись числа?
    - Как устроена запись числа второго десятка?
    - Почему 13 записывают двумя цифрами, а не одной?
    - Как число 14 читается вслух?
    - Как проверить, что запись числа не перепутана?

subtopics:
  - id: num-digits/chislo-i-cifra-chem
    title: "Число и цифра, чем они различаются"
    tree_ref: "Число и цифра, чем они различаются"
    synonyms: [цифра и число, чем они различаются, сколько цифр в записи]
    sections: [T01]
  - id: num-digits/zapis-chisel-pervogo-desyatka
    title: "Запись чисел первого десятка"
    tree_ref: "Запись чисел первого десятка"
    synonyms: [запись чисел от 0 до 9, одна цифра, цифры от 0 до 9]
    sections: [T02]
  - id: num-digits/sostav-chisel-vtorogo-desyatka
    title: "Состав чисел второго десятка"
    tree_ref: "Состав чисел второго десятка"
    synonyms: [десяток и ещё несколько, состав числа второго десятка, числа от 11 до 19]
    sections: [T03, T05]
  - id: num-digits/chtenie-zapisi-vsluh
    title: "Чтение записи вслух"
    tree_ref: "Чтение записи вслух"
    synonyms: [как читается число, название числа, запись по названию]
    sections: [T04]

outcomes:  # 1–3, уровни core/standard/deep
  - id: LO-01
    short: Различает число и цифру; пишет до 10
    action: различает число, его запись и цифру, записывает числа первого десятка и называет их цифры
    conditions: числа от 0 до 10, запись без калькулятора
    criterion: верно говорит, сколько цифр в записи, и записывает число от 0 до 9 одной цифрой
    level: core
    sections: [T01, T02]
  - id: LO-02
    short: Пишет числа второго десятка
    action: раскладывает количество на полный десяток и ещё несколько и записывает результат двумя цифрами
    conditions: числа от 11 до 20, «ещё несколько» от 1 до 9
    criterion: верно называет полный десяток и «ещё несколько» и записывает их вместе двумя цифрами
    level: standard
    sections: [T03, T04]
  - id: LO-03
    short: Проверяет запись и находит ошибку
    action: проверяет запись числа по составу, находит переставленную или потерянную цифру и объясняет ошибку
    conditions: записи чисел от 0 до 20, в том числе заведомо испорченные
    criterion: верно называет, какая цифра потеряна или переставлена, и приводит верную запись
    level: deep
    sections: [T03, T04, T05]

errors:  # 3–12 ID из errors/catalog.yaml
  - E-num-digits-first-digit-only
  - E-num-digits-last-digit-only
  - E-num-digits-swapped-digits
  - E-num-digits-ten-only
