# Входная диагностика (STANDARD.md §6, правило 15): 4 задачи по прямому пререквизиту
# num-counting; outcome записывается как `num-counting/LO-01` (пакет пререквизита ещё не
# опубликован).
tasks:
  - id: D-01
    type: number
    role: diagnostic
    purpose: procedure
    level: 0
    outcome: num-counting/LO-01
    sections:
      - T01
    minutes: 1
    prompt: 'Ирина выложила 8 болтов в ряд и назвала их по порядку: «раз, два, три…». Какое число
      она назовёт последним?'
    answer: 8
    hints:
      - Называя числа по порядку, Ирина считает предметы.
      - Последнее названное число отвечает на вопрос «сколько».
      - В ряду 8 болтов — называйте следующее число на каждом болте, начиная с «раз», и остановитесь на последнем.
    solution: |-
      ### Ответ
      8

      ### Идея
      При счёте предметов числа называют по порядку, и последнее названное число равно количеству.

      ### Шаги
      1. Ирина называет числа по порядку: раз, два, три.
      2. Восемь болтов — значит, последним прозвучит «восемь».

      ### Проверка
      Сосчитайте болты ещё раз: восемь названий на восемь болтов.

      ### Типичная ошибка
      Начать счёт с нуля: тогда последнее прозвучавшее число окажется на единицу меньше.
    feedback:
      correct: 'Верно: восемь болтов — и последнее названное число тоже восемь.'
      wrong:
        what: Число не совпало с количеством.
        why: Похоже, счёт сбился на единицу.
        fix: Назовите числа по порядку ещё раз и остановитесь на последнем.
        next: Повторите счёт предметов в теме про счёт.
    trivial_answer_ok: true
  - id: D-02
    type: number
    role: diagnostic
    purpose: procedure
    level: 1
    outcome: num-counting/LO-01
    sections:
      - T01
    minutes: 1
    prompt: В ряду 8 болтов. Сколько болтов стоит после третьего болта?
    answer: 5
    hints:
      - 'Отсчитайте болты по порядку: первый, второй, третий.'
      - Стоящие после третьего — это те болты, что дальше по ряду.
      - Отметьте первые три болта ряда из 8 и считайте остальные, называя за каждым следующее число.
    solution: |-
      ### Ответ
      5

      ### Идея
      Сколько предметов осталось после названной группы — считаем по ряду дальше.

      ### Шаги
      1. В ряду 8 болтов.
      2. Первые три болта названы по порядку.
      3. Считаем остальные: четвёртый, пятый, шестой, седьмой, восьмой — их пять.

      ### Проверка
      Три названных болта и пять оставшихся вместе дают восемь.

      ### Типичная ошибка
      Начать счёт с третьего болта: тогда получится шесть вместо пяти.
    feedback:
      correct: 'Верно: после третьего болта остаётся пять.'
      wrong:
        what: Число не совпало.
        why: Похоже, счёт начался с третьего болта, а не с того, что стоит после него.
        fix: Назовите первые три болта и посчитайте тех, что стоят дальше.
        next: Повторите счёт по ряду в теме про счёт.
  - id: D-03
    type: number
    role: diagnostic
    purpose: procedure
    level: 1
    outcome: num-counting/LO-01
    sections:
      - T01
    minutes: 1
    prompt: 'Ирина считала болты по два: «два, четыре, шесть, восемь, десять». Сколько болтов она
      насчитала?'
    answer: 10
    hints:
      - Счёт по два — это счёт с шагом 2.
      - Последнее названное число и есть количество предметов.
      - Ирина назвала пять чисел с шагом 2 — выпишите их подряд и посмотрите, на каком она остановилась.
    solution: |-
      ### Ответ
      10

      ### Идея
      При счёте по два числа называют с шагом 2, и последнее названное число равно количеству.

      ### Шаги
      1. Ирина назвала: два, четыре, шесть, восемь, десять.
      2. Последнее названное число — десять.
      3. Значит, болтов десять.

      ### Проверка
      Числа 2, 4, 6, 8, 10 идут с шагом 2, и таких шагов пять — по два болта в каждом.

      ### Типичная ошибка
      Сосчитать сами названные числа: получится пять вместо десяти.
    feedback:
      correct: 'Верно: счёт по два дошёл до десяти, значит болтов десять.'
      wrong:
        what: Число не совпало.
        why: Похоже, сосчитаны шаги счёта, а не болты.
        fix: Умножьте число шагов на два болта в каждом шаге.
        next: Повторите счёт по группам в теме про счёт.
    trivial_answer_ok: true
  - id: D-04
    type: number
    role: diagnostic
    purpose: meaning
    level: 1
    outcome: num-counting/LO-01
    sections:
      - T01
    minutes: 1
    prompt: В одной коробке 4 болта, в другой 3. Ирина выложила их в один ряд. Сколько болтов в ряду?
    answer: 7
    hints:
      - Коробки — это две группы, которые Ирина соединила в один ряд.
      - 'Считайте все болты ряда подряд: сначала четыре, потом ещё три.'
      - 'Считайте ряд подряд, начиная с четырёх: четыре из первой коробки и ещё 3 из второй.'
    solution: |-
      ### Ответ
      7

      ### Идея
      Количество в ряду получается, когда группы предметов кладут рядом и считают все вместе.

      ### Шаги
      1. В первой коробке 4 болта.
      2. Во второй коробке 3 болта.
      3. В ряду лежат все: считаем четыре, пять, шесть, семь — всего семь болтов.

      ### Проверка
      Отсчитайте по ряду ещё раз: четыре, пять, шесть, семь.

      ### Типичная ошибка
      Посчитать болты только одной коробки и потерять вторую группу.
    feedback:
      correct: 'Верно: в ряду семь болтов, обе группы учтены.'
      wrong:
        what: Число не совпало.
        why: Похоже, одна из коробок не попала в счёт.
        fix: Отсчитайте болты в ряду подряд, начиная с четырёх.
        next: Повторите счёт по группам в теме про счёт.
