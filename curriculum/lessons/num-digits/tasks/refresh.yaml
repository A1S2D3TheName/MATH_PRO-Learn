        what: Запись названия «{{w}}» не совпала.
        why: Возможно, «ещё несколько» записано раньше десятка.
        fix: Разложите «{{w}}» на десяток и остаток и запишите их по порядку.
        next: 'Раздел T04: от названия к записи.'
  - id: R-03
    type: number
    role: refresh
    purpose: method
    level: 2
    outcome: LO-01
    sections:
      - T05
    minutes: 3
    prompt: Ирина стёрла в журнале первую цифру записи, и осталась {{d}}. Число было из второго десятка.
      Какое число было записано?
    answer: 17
    variants:
      - params:
          d: 7
        answer: 17
        solution: |-
          ### Ответ
          17

          ### Идея
          Число второго десятка записывается двумя цифрами: первая цифра называет полные десятки
          (у чисел от 11 до 19 это 1), вторая — «ещё несколько».

          ### Шаги
          1. Первая цифра стёрта, а число из второго десятка.
          2. Значит, первая цифра записи — 1.
          3. Вторая цифра известна: 7. Запись восстанавливается: 17.

          ### Проверка
          Прочитайте запись вслух: десять и ещё 7.

          ### Типичная ошибка
          Восстановить однозначную запись: тогда стёртая цифра была бы лишней (E-num-digits-first-digit-only).
      - params:
          d: 2
        answer: 12
        solution: |-
          ### Ответ
          12

          ### Идея
          Число второго десятка записывается двумя цифрами: первая цифра называет полные десятки
          (у чисел от 11 до 19 это 1), вторая — «ещё несколько».

          ### Шаги
          1. Первая цифра стёрта, а число из второго десятка.
          2. Значит, первая цифра записи — 1.
          3. Вторая цифра известна: 2. Запись восстанавливается: 12.

          ### Проверка
          Прочитайте запись вслух: десять и ещё 2.

          ### Типичная ошибка
          Восстановить однозначную запись: тогда стёртая цифра была бы лишней (E-num-digits-first-digit-only).
      - params:
          d: 9
        answer: 19
        solution: |-
          ### Ответ
          19

          ### Идея
          Число второго десятка записывается двумя цифрами: первая цифра называет полные десятки
          (у чисел от 11 до 19 это 1), вторая — «ещё несколько».

          ### Шаги
          1. Первая цифра стёрта, а число из второго десятка.
          2. Значит, первая цифра записи — 1.
          3. Вторая цифра известна: 9. Запись восстанавливается: 19.

          ### Проверка
          Прочитайте запись вслух: десять и ещё 9.

          ### Типичная ошибка
          Восстановить однозначную запись: тогда стёртая цифра была бы лишней (E-num-digits-first-digit-only).
    hints:
      - Число второго десятка записывается двумя цифрами.
      - 'Первая цифра записи называет полные десятки: у числа второго десятка это 1, и она стоит перед {{d}}.'
      - Число второго десятка записывается двумя цифрами — назовите первую и впишите её перед известной {{d}}.
    solution: |-
      ### Ответ
      17

      ### Идея
      Число второго десятка записывается двумя цифрами: первая цифра называет полные десятки
      (у чисел от 11 до 19 это 1), вторая — «ещё несколько».

      ### Шаги
      1. Первая цифра стёрта, а число из второго десятка.
      2. Значит, первая цифра записи — 1.
      3. Вторая цифра известна: 7. Запись восстанавливается: 17.

      ### Проверка
      Прочитайте запись вслух: десять и ещё 7.

      ### Типичная ошибка
      Восстановить однозначную запись: тогда стёртая цифра была бы лишней (E-num-digits-first-digit-only).
    feedback:
      correct: 'Верно: стёртая первая цифра восстановлена по правилу двухзначной записи.'
      wrong:
        what: Восстановленная запись не совпала.
        why: Похоже, количество собрано как однозначное число.
        fix: Проверьте, сколько позиций в записи, и восстановите утраченную цифру.
        next: 'Раздел T05: шаги проверки записи.'
