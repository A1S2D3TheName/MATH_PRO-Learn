# Интервальное повторение (STANDARD.md §8): 5 задач с новыми числами, без повторов
# практики и разобранных примеров теории; отклик у каждой карточки свой (правило 170).
tasks:
  - id: R-01
    type: number
    role: refresh
    purpose: procedure
    level: 2
    outcome: LO-02
    sections:
      - T03
    minutes: 3
    prompt: На складе лежит полный ящик — {{a}} болтов — и ещё {{b|pl:болт,болта,болтов}} рядом. Сколько
      болтов на складе? Запишите ответ цифрами.
    answer: 15
    variants:
      - params:
          a: 10
          b: 5
        answer: 15
        solution: |-
          ### Ответ
          15

          ### Идея
          Количество складывается из двух частей: полный десяток — 10 болтов, и ещё 5.
          Записываем части по порядку, и получается запись числа 15.

          ### Шаги
          1. Первая часть — полный десяток, 10 болтов.
          2. Вторая часть — ещё несколько, 5 болтов.
          3. Записываем сначала десяток, потом «ещё несколько»: 15.

          ### Проверка
          В записи 15 первая цифра — 1, это полный десяток, а вторая цифра — 5, это «ещё несколько».

          ### Типичная ошибка
          Записать только полный десяток и забыть про «ещё несколько» (E-num-digits-ten-only).
      - params:
          a: 10
          b: 7
        answer: 17
        solution: |-
          ### Ответ
          17

          ### Идея
          Количество складывается из двух частей: полный десяток — 10 болтов, и ещё 7.
          Записываем части по порядку, и получается запись числа 17.

          ### Шаги
          1. Первая часть — полный десяток, 10 болтов.
          2. Вторая часть — ещё несколько, 7 болтов.
          3. Записываем сначала десяток, потом «ещё несколько»: 17.

          ### Проверка
          В записи 17 первая цифра — 1, это полный десяток, а вторая цифра — 7, это «ещё несколько».

          ### Типичная ошибка
          Записать только полный десяток и забыть про «ещё несколько» (E-num-digits-ten-only).
      - params:
          a: 10
          b: 4
        answer: 14
        solution: |-
          ### Ответ
          14

          ### Идея
          Количество складывается из двух частей: полный десяток — 10 болтов, и ещё 4.
          Записываем части по порядку, и получается запись числа 14.

          ### Шаги
          1. Первая часть — полный десяток, 10 болтов.
          2. Вторая часть — ещё несколько, 4 болтов.
          3. Записываем сначала десяток, потом «ещё несколько»: 14.

          ### Проверка
          В записи 14 первая цифра — 1, это полный десяток, а вторая цифра — 4, это «ещё несколько».

          ### Типичная ошибка
          Записать только полный десяток и забыть про «ещё несколько» (E-num-digits-ten-only).
    hints:
      - 'Количество складывается из двух частей: полный ящик и ещё несколько.'
      - 'Назовите части по порядку: сначала полный ящик, потом «ещё несколько».'
      - 'Назовите обе части по порядку: {{a}} болтов ящика и {{b|pl:болт,болта,болтов}} рядом — и запишите их одну за другой.'
    solution: |-
      ### Ответ
      15

      ### Идея
      Количество складывается из двух частей: полный десяток — 10 болтов, и ещё 5.
      Записываем части по порядку, и получается запись числа 15.

      ### Шаги
      1. Первая часть — полный десяток, 10 болтов.
      2. Вторая часть — ещё несколько, 5 болтов.
      3. Записываем сначала десяток, потом «ещё несколько»: 15.

      ### Проверка
      В записи 15 первая цифра — 1, это полный десяток, а вторая цифра — 5, это «ещё несколько».

      ### Типичная ошибка
      Записать только полный десяток и забыть про «ещё несколько» (E-num-digits-ten-only).
    feedback:
      correct: 'Верно: полный ящик и болты рядом посчитаны вместе и записаны верно.'
      wrong:
        what: Количество болтов на складе не совпало.
        why: 'Похоже, названа только одна из частей: ящик или добавка.'
        fix: Назовите обе части по порядку и запишите их вместе.
        next: 'Раздел T03: количество из двух частей.'
  - id: R-02
