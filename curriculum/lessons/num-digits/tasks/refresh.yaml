    solution: |-
      ### Ответ
      14

      ### Идея
      Название разбирается на части, а части записываются по порядку: сначала десяток, потом «ещё несколько».

      ### Шаги
      1. Разложите название: четырнадцать — это десять и ещё 4.
      2. Запишите части подряд, не переставляя.
      3. Получится запись 14.

      ### Проверка
      Прочитайте запись 14 вслух — получится то же название, которое вам продиктовали.

      ### Типичная ошибка
      Переставить цифры местами при записи: из 14 получится другое число (E-num-digits-swapped-digits).
