    answer: 4
    variants:
      - params:
          a: 10
          b: 3
        answer: 4
        solution: |-
          ### Ответ
          4

          ### Идея
          Запись «1_» читается как «десять и ещё сколько-то», а «ещё несколько» по условию не больше 3.

          ### Шаги
          1. Первая цифра записи — 1, значит запись двухзначная: десяток и «ещё несколько».
          2. «Ещё несколько» принимает значения от 0 до 3.
          3. Каждому значению отвечает своя запись, поэтому записей столько же, сколько значений.

          ### Проверка
          Переберите «ещё несколько» от 0 до 3 и посчитайте записи — их будет 4.

          ### Типичная ошибка
          Отбросить ноль: запись 10 тоже подходит под «1_», ведь «ещё несколько» может быть нулём.
