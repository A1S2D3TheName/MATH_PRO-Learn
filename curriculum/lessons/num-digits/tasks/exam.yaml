          3. Записываем «ещё несколько»: 6.

          ### Проверка
          Десяток и ещё несколько вместе дают 16: проверьте чтением вслух.

          ### Типичная ошибка
          Записать только последнюю цифру и потерять десяток (E-num-digits-last-digit-only).
        feedback:
