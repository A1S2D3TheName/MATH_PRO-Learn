      - id: EA-01
        type: number
        role: exam
        purpose: procedure
        level: 0
        points: 1
        outcome: LO-01
        sections:
          - T01
        minutes: 2
        prompt: Ирина подписала бирку числом 6. Сколько цифр в этой записи?
        answer: 1
        hints:
          - Считайте знаки в записи, а не болты в ящике.
          - Пройдите по записи слева направо и посчитайте каждый знак.
          - 'Прочитайте запись 6 по знакам и отметьте каждый: знаков окажется столько, сколько цифр.'
        solution: |-
          ### Ответ
          1

          ### Идея
          Запись числа 6 содержит одну цифру: нужно посчитать знаки в записи, а не предметы.

          ### Шаги
          1. Посмотрите на запись 6.
          2. Прочитайте запись по знакам: 6.
          3. Знаков в записи — 1.

          ### Проверка
          Числа от 0 до 9 записываются одной цифрой, а числа от 10 до 20 — двумя.

          ### Типичная ошибка
          Считать не знаки в записи, а предметы в ящике: цифр в записи столько же, сколько знаков на бирке.
        trivial_answer_ok: true
        feedback:
          correct: 'Верно: в записи 6 посчитан один знак.'
          wrong:
            what: Число знаков в записи 6 не совпало.
            why: Похоже, за знак записи принят предмет из ящика.
            fix: Посмотрите на цифру 6 и посчитайте знаки в ней.
            next: 'Раздел T01: запись из одной цифры.'
      - id: EA-02
        type: number
        role: exam
        purpose: procedure
        level: 1
        points: 1
        outcome: LO-01
        sections:
          - T04
        minutes: 2
        prompt: Пётр продиктовал вслух «восемнадцать». Переведите это название в запись цифрами.
        answer: 18
        hints:
          - 'Послушайте название: в нём слышны две части.'
          - Первая часть — «десять», вторая — сколько «ещё» сверх него.
          - Разберите «восемнадцать» на «десять» и остаток — и запишите цифры в этом же порядке.
        solution: |-
          ### Ответ
          18

          ### Идея
          Название разбирается на части, а части записываются по порядку: сначала десяток, потом «ещё несколько».

          ### Шаги
          1. Разложите название: восемнадцать — это десять и ещё 8.
          2. Запишите части подряд, не переставляя.
          3. Получится запись 18.

          ### Проверка
          Прочитайте запись 18 вслух — получится то же название, которое вам продиктовали.

          ### Типичная ошибка
          Переставить цифры местами при записи: из 18 получится другое число (E-num-digits-swapped-digits).
        feedback:
          correct: 'Верно: «восемнадцать» записано как 18.'
          wrong:
            what: Запись названия «восемнадцать» не совпала.
            why: Возможно, остаток названия записан раньше десятка.
            fix: Разложите «восемнадцать» на десять и остаток, потом запишите.
            next: 'Раздел T04: от названия к записи.'
