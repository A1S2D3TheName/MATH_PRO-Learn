          wrong:
            what: Вторая цифра записи 16 названа неверно.
            why: Похоже, названа первая цифра записи вместо второй.
            fix: Прочитайте запись 16 вслух и назовите то, что слышно после десятка.
            next: 'Раздел T03: вторая цифра записи.'
