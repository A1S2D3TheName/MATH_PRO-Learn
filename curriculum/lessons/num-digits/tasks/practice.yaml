# Основной банк (STANDARD.md §6–§8): 25 задач без challenge + 1 challenge, роли warmup/supported/
# independent/challenge, доли уровней 10/30/30/20/10 (±5 п.п.). Сквозной сюжет —
# мастерская по ремонту оргтехники, приёмка поставки. Отклик у каждой карточки свой
# (правило 170): он называет предмет и числа именно этой задачи.
tasks:
  - id: P-01
    type: number
    role: warmup
    purpose: procedure
    level: 0
    outcome: LO-01
    sections:
      - T01
    minutes: 1
    prompt: На бирке ящика написано {{n}}. Сколько цифр в этой записи?
    answer: 1
    trivial_answer_ok: true
    variants:
      - params:
          n: 7
        answer: 1
        solution: |-
          ### Ответ
          1

          ### Идея
          Запись числа 7 содержит одну цифру: нужно посчитать знаки в записи, а не предметы.

          ### Шаги
          1. Посмотрите на запись 7.
          2. Прочитайте запись по знакам: 7.
          3. Знаков в записи — 1.

          ### Проверка
          Числа от 0 до 9 записываются одной цифрой, а числа от 10 до 20 — двумя.

          ### Типичная ошибка
          Считать не знаки в записи, а предметы в ящике: цифр в записи столько же, сколько знаков на бирке.
      - params:
          n: 13
        answer: 2
        solution: |-
          ### Ответ
          2

          ### Идея
          Запись числа 13 содержит две цифры: нужно посчитать знаки в записи, а не предметы.

          ### Шаги
          1. Посмотрите на запись 13.
          2. Прочитайте запись по знакам: 1, 3.
          3. Знаков в записи — 2.

          ### Проверка
          Числа от 0 до 9 записываются одной цифрой, а числа от 10 до 20 — двумя.

          ### Типичная ошибка
          Считать не знаки в записи, а предметы в ящике: цифр в записи столько же, сколько знаков на бирке.
    hints:
      - Считайте не предметы в ящике, а знаки в записи.
      - Пройдите по записи слева направо и посчитайте каждый знак.
      - 'Прочитайте запись {{n}} по знакам и отметьте каждый: знаков окажется столько, сколько цифр.'
    solution: |-
      ### Ответ
      1

      ### Идея
      Запись числа 7 содержит одну цифру: нужно посчитать знаки в записи, а не предметы.

      ### Шаги
      1. Посмотрите на запись 7.
      2. Прочитайте запись по знакам: 7.
      3. Знаков в записи — 1.

      ### Проверка
      Числа от 0 до 9 записываются одной цифрой, а числа от 10 до 20 — двумя.

      ### Типичная ошибка
      Считать не знаки в записи, а предметы в ящике: цифр в записи столько же, сколько знаков на бирке.
    feedback:
      correct: 'Верно: в записи {{n}} вы посчитали знаки, а не предметы в ящике.'
      wrong:
        what: Количество цифр в записи {{n}} не совпало.
        why: Похоже, вместо знаков записи сосчитаны болты на бирке.
        fix: Пересчитайте знаки записи {{n}} слева направо.
        next: 'Раздел T01: чем запись отличается от числа.'
  - id: P-02
    type: number
    role: warmup
    purpose: procedure
    level: 0
    outcome: LO-01
    sections:
      - T02
    minutes: 1
    prompt: Пётр назвал вслух «{{w}}». Запишите это число цифрами.
    answer: 7
    trivial_answer_ok: true
    variants:
      - params:
          w: семь
        answer: 7
        solution: |-
          ### Ответ
          7

          ### Идея
          Название разбирается на части, а части записываются по порядку: сначала десяток, потом «ещё несколько».

          ### Шаги
          1. Разложите название: семь — это число 7, у него одна цифра в записи.
          2. Запишите части подряд, не переставляя.
          3. Получится запись 7.

          ### Проверка
          Прочитайте запись 7 вслух — получится то же название, которое вам продиктовали.

          ### Типичная ошибка
          Переставить цифры местами при записи: из 7 получится другое число (E-num-digits-swapped-digits).
      - params:
          w: девять
        answer: 9
        solution: |-
          ### Ответ
          9

          ### Идея
          Название разбирается на части, а части записываются по порядку: сначала десяток, потом «ещё несколько».

          ### Шаги
          1. Разложите название: девять — это число 9, у него одна цифра в записи.
          2. Запишите части подряд, не переставляя.
          3. Получится запись 9.

          ### Проверка
          Прочитайте запись 9 вслух — получится то же название, которое вам продиктовали.

          ### Типичная ошибка
          Переставить цифры местами при записи: из 9 получится другое число (E-num-digits-swapped-digits).
      - params:
          w: пять
        answer: 5
        solution: |-
          ### Ответ
          5

          ### Идея
          Название разбирается на части, а части записываются по порядку: сначала десяток, потом «ещё несколько».

          ### Шаги
          1. Разложите название: пять — это число 5, у него одна цифра в записи.
          2. Запишите части подряд, не переставляя.
          3. Получится запись 5.

          ### Проверка
          Прочитайте запись 5 вслух — получится то же название, которое вам продиктовали.

          ### Типичная ошибка
          Переставить цифры местами при записи: из 5 получится другое число (E-num-digits-swapped-digits).
    hints:
      - Название числа и его запись — два облика одного числа.
      - Для чисел первого десятка запись состоит из одной цифры.
      - В названии «{{w}}» нет слова «десять» — назовите вслух ту единственную цифру, которая ему отвечает.
    solution: |-
      ### Ответ
      7

      ### Идея
      Название разбирается на части, а части записываются по порядку: сначала десяток, потом «ещё несколько».

      ### Шаги
      1. Разложите название: семь — это число 7, у него одна цифра в записи.
      2. Запишите части подряд, не переставляя.
      3. Получится запись 7.

      ### Проверка
      Прочитайте запись 7 вслух — получится то же название, которое вам продиктовали.

      ### Типичная ошибка
      Переставить цифры местами при записи: из 7 получится другое число (E-num-digits-swapped-digits).
    feedback:
      correct: 'Верно: название «{{w}}» переведено в запись без пропусков.'
      wrong:
        what: Запись для «{{w}}» не совпала с названием.
        why: Возможно, части названия записаны в обратном порядке.
        fix: Проговорите «{{w}}» ещё раз и запишите части в том же порядке.
        next: 'Раздел T04: название и запись — два облика одного числа.'
  - id: P-03
    type: number
    role: warmup
    purpose: procedure
    level: 1
    outcome: LO-01
    sections:
      - T01
    minutes: 1
    prompt: В записи числа {{n}} первая цифра — {{d}}. Какая цифра в этой записи вторая? Назовите
      её.
    answer: 2
    trivial_answer_ok: true
    variants:
      - params:
          n: 12
          d: 1
        answer: 2
        solution: |-
          ### Ответ
          2

          ### Идея
          В записи 12 первая цифра 1 — это десяток, значит вторая цифра — «ещё несколько».

          ### Шаги
          1. Первая цифра записи 1 — это десяток.
          2. Вторая цифра отвечает, сколько «ещё» сверх десятка.
          3. Записываем «ещё несколько»: 2.

          ### Проверка
          Десяток и ещё несколько вместе дают 12: проверьте чтением вслух.

          ### Типичная ошибка
          Записать только последнюю цифру и потерять десяток (E-num-digits-last-digit-only).
      - params:
          n: 15
          d: 1
        answer: 5
        solution: |-
          ### Ответ
          5

          ### Идея
          В записи 15 первая цифра 1 — это десяток, значит вторая цифра — «ещё несколько».

          ### Шаги
          1. Первая цифра записи 1 — это десяток.
          2. Вторая цифра отвечает, сколько «ещё» сверх десятка.
          3. Записываем «ещё несколько»: 5.

          ### Проверка
          Десяток и ещё несколько вместе дают 15: проверьте чтением вслух.

          ### Типичная ошибка
          Записать только последнюю цифру и потерять десяток (E-num-digits-last-digit-only).
      - params:
          n: 18
          d: 1
        answer: 8
        solution: |-
          ### Ответ
          8

          ### Идея
          В записи 18 первая цифра 1 — это десяток, значит вторая цифра — «ещё несколько».

          ### Шаги
          1. Первая цифра записи 1 — это десяток.
          2. Вторая цифра отвечает, сколько «ещё» сверх десятка.
          3. Записываем «ещё несколько»: 8.

          ### Проверка
          Десяток и ещё несколько вместе дают 18: проверьте чтением вслух.

          ### Типичная ошибка
          Записать только последнюю цифру и потерять десяток (E-num-digits-last-digit-only).
    hints:
      - В записи числа второго десятка первая цифра — полный десяток.
      - Вторая цифра говорит, сколько «ещё» сверх десятка.
      - 'Прочитайте запись {{n}} по знакам: за первой цифрой {{d}} идёт вторая — назовите её.'
    solution: |-
      ### Ответ
      2

      ### Идея
      В записи 12 первая цифра 1 — это десяток, значит вторая цифра — «ещё несколько».

      ### Шаги
      1. Первая цифра записи 1 — это десяток.
      2. Вторая цифра отвечает, сколько «ещё» сверх десятка.
      3. Записываем «ещё несколько»: 2.

      ### Проверка
      Десяток и ещё несколько вместе дают 12: проверьте чтением вслух.

      ### Типичная ошибка
      Записать только последнюю цифру и потерять десяток (E-num-digits-last-digit-only).
    feedback:
      correct: 'Верно: после первой цифры {{d}} в записи {{n}} стоит именно эта цифра.'
      wrong:
        what: Цифра на втором месте записи {{n}} названа неверно.
        why: Похоже, за вторую цифру принята первая.
        fix: Прочитайте запись {{n}} вслух и послушайте, что идёт после десятка.
        next: 'Раздел T03: состав числа второго десятка.'
  - id: P-04
    type: number
    role: supported
    purpose: procedure
    level: 1
    outcome: LO-02
    sections:
      - T03
    minutes: 1
    prompt: В ящике {{a}} болтов и ещё {{b}}. Сколько всего болтов? Запишите ответ цифрами.
    answer: 13
    variants:
      - params:
          a: 10
          b: 3
        answer: 13
        solution: |-
          ### Ответ
          13

          ### Идея
          Количество складывается из двух частей: полный десяток — 10 болтов, и ещё 3.
          Записываем части по порядку, и получается запись числа 13.

          ### Шаги
          1. Первая часть — полный десяток, 10 болтов.
          2. Вторая часть — ещё несколько, 3 болтов.
          3. Записываем сначала десяток, потом «ещё несколько»: 13.

          ### Проверка
          В записи 13 первая цифра — 1, это полный десяток, а вторая цифра — 3, это «ещё несколько».

          ### Типичная ошибка
          Записать только полный десяток и забыть про «ещё несколько» (E-num-digits-ten-only).
      - params:
          a: 10
          b: 6
        answer: 16
        solution: |-
          ### Ответ
          16

          ### Идея
          Количество складывается из двух частей: полный десяток — 10 болтов, и ещё 6.
          Записываем части по порядку, и получается запись числа 16.

          ### Шаги
          1. Первая часть — полный десяток, 10 болтов.
          2. Вторая часть — ещё несколько, 6 болтов.
          3. Записываем сначала десяток, потом «ещё несколько»: 16.

          ### Проверка
          В записи 16 первая цифра — 1, это полный десяток, а вторая цифра — 6, это «ещё несколько».

          ### Типичная ошибка
          Записать только полный десяток и забыть про «ещё несколько» (E-num-digits-ten-only).
      - params:
          a: 10
          b: 8
        answer: 18
        solution: |-
          ### Ответ
          18

          ### Идея
          Количество складывается из двух частей: полный десяток — 10 болтов, и ещё 8.
          Записываем части по порядку, и получается запись числа 18.

          ### Шаги
          1. Первая часть — полный десяток, 10 болтов.
          2. Вторая часть — ещё несколько, 8 болтов.
          3. Записываем сначала десяток, потом «ещё несколько»: 18.

          ### Проверка
          В записи 18 первая цифра — 1, это полный десяток, а вторая цифра — 8, это «ещё несколько».

          ### Типичная ошибка
          Записать только полный десяток и забыть про «ещё несколько» (E-num-digits-ten-only).
    hints:
      - 'Количество состоит из двух частей: полный ящик и ещё несколько болтов.'
      - 'Назовите части по порядку: сначала полный ящик, потом «ещё несколько».'
      - 'Назовите обе части вслух по порядку: {{a}} болтов ящика и {{b|pl:болт,болта,болтов}} рядом — и запишите их одну за другой.'
    solution: |-
      ### Ответ
      13

      ### Идея
      Количество складывается из двух частей: полный десяток — 10 болтов, и ещё 3.
      Записываем части по порядку, и получается запись числа 13.

      ### Шаги
      1. Первая часть — полный десяток, 10 болтов.
      2. Вторая часть — ещё несколько, 3 болтов.
      3. Записываем сначала десяток, потом «ещё несколько»: 13.

      ### Проверка
      В записи 13 первая цифра — 1, это полный десяток, а вторая цифра — 3, это «ещё несколько».

      ### Типичная ошибка
      Записать только полный десяток и забыть про «ещё несколько» (E-num-digits-ten-only).
    feedback:
      correct: 'Верно: полный ящик и болты рядом названы вместе и записаны двумя цифрами.'
      wrong:
        what: Количество болтов в ящике и рядом не совпало.
        why: 'Похоже, названа только одна из двух частей: ящик или добавка.'
        fix: Назовите вслух десяток и добавку, затем запишите их подряд.
        next: 'Раздел T03: разложение количества на десяток и «ещё несколько».'
      misconceptions:
        - id: E-num-digits-ten-only
          when:
            expr: 10 * ((a + b) // 10)
          message: Записан только полный десяток, «ещё несколько» потеряно.
  - id: P-05
    type: number
    role: supported
    purpose: meaning
    level: 1
    outcome: LO-01
    sections:
      - T01
    minutes: 1
    prompt: На двух бирках написано {{n}} и {{m}}. Сколько всего цифр на обеих бирках?
    answer: 3
    variants:
      - params:
          n: 7
