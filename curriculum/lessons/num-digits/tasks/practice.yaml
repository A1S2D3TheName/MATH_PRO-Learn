          ### Шаги
          1. Однозначные записи подходят: 4 — это 1 запись.
          2. Двузначные записи подходят: 14 — это 1 запись.
          3. Записей, в которых цифра встречается дважды, среди чисел от 0 до 20 нет.
          4. Складываем: 1 + 1 = 2.

          ### Проверка
          Сложите обе группы заново — получается 2 записей.

