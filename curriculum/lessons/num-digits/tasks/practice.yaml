          1. В записи 7 знаков: 1.
          2. В записи 12 знаков: 2.
          3. Всего знаков на двух бирках: 3.

          ### Проверка
          Прочитайте обе записи по знакам и пересчитайте: 3.

          ### Типичная ошибка
          Считать бирки, а не знаки на них: запись из двух цифр даёт два знака, а не один.
      - params:
          n: 3
          m: 4
        answer: 2
        solution: |-
          ### Ответ
          2

          ### Идея
          Цифры считаются в каждой записи отдельно, а потом складываются.

          ### Шаги
          1. В записи 3 знаков: 1.
          2. В записи 4 знаков: 1.
          3. Всего знаков на двух бирках: 2.

          ### Проверка
          Прочитайте обе записи по знакам и пересчитайте: 2.

          ### Типичная ошибка
          Считать бирки, а не знаки на них: запись из двух цифр даёт два знака, а не один.
      - params:
          n: 10
          m: 20
        answer: 4
        solution: |-
          ### Ответ
          4

          ### Идея
          Цифры считаются в каждой записи отдельно, а потом складываются.

          ### Шаги
          1. В записи 10 знаков: 2.
          2. В записи 20 знаков: 2.
          3. Всего знаков на двух бирках: 4.

          ### Проверка
          Прочитайте обе записи по знакам и пересчитайте: 4.

          ### Типичная ошибка
          Считать бирки, а не знаки на них: запись из двух цифр даёт два знака, а не один.
