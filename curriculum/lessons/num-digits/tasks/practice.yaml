      - Считайте знаки в каждой записи отдельно.
      - Числа до девяти дают по одной цифре, числа от 10 до 20 — по две.
      - Обведите каждый знак в записях {{n}} и {{m}} и сосчитайте обведённые знаки на двух бирках.
    solution: |-
      ### Ответ
      3

      ### Идея
      Цифры считаются в каждой записи отдельно, а потом складываются.

      ### Шаги
      1. В записи 7 знаков: 1.
      2. В записи 12 знаков: 2.
      3. Всего знаков на двух бирках: 3.

      ### Проверка
      Прочитайте обе записи по знакам и пересчитайте: 3.

      ### Типичная ошибка
      Считать бирки, а не знаки на них: запись из двух цифр даёт два знака, а не один.
    feedback:
      correct: 'Верно: знаки двух записей сосчитаны по отдельности и сложены.'
      wrong:
        what: Общее число знаков на двух бирках не совпало.
        why: Похоже, посчитаны бирки, а не знаки в записях.
        fix: Посчитайте знаки в каждой записи отдельно и сложите результаты.
        next: 'Раздел T01: сколько знаков в записи.'
