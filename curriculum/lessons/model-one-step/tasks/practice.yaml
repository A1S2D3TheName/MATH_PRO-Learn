      wrong:
        what: Хотя бы одна пара «задача — запись» неверна.
        why: Возможно, запись выбрана по числам, без проверки, где стоит вопрос и что подписано у чисел.
        fix: Для каждой задачи сначала назовите искомое, затем ищите запись с вопросом на том же месте.
        next: 'Раздел T03: примеры кратких записей для целого, части и неизвестного начала.'
