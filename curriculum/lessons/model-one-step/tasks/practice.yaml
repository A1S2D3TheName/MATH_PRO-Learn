# Основной банк (STANDARD.md §6–§8): 24 задачи без challenge + 1 challenge, роли warmup/supported/
# independent, доли уровней 10/30/30/20/10 (±5 п.п.). Числа и сюжеты не повторяют примеры теории.
tasks:
  # ---------------------------------------------------------------- warmup
  - id: P-01
    type: number
    role: warmup
    purpose: procedure
    level: 0
    outcome: LO-02
    sections: [T02]
    minutes: 1
    prompt: В автобусе ехали {{a|pl:пассажир,пассажира,пассажиров}}. На остановке вышли
      {{b|pl:пассажир,пассажира,пассажиров}}. Сколько пассажиров осталось в автобусе? Ответ запишите числом.
    answer: 9
    variants:
      - params: {a: 17, b: 8}
        answer: 9
        solution: |
          ### Ответ
          9 пассажиров.

          ### Идея
          Вышедшие пассажиры — часть тех, кто ехал в автобусе, поэтому остаток находят вычитанием.

          ### Шаги
          1. Данные: ехали — 17 пассажиров, вышли — 8 пассажиров.
          2. Искомое — оставшиеся пассажиры, то есть остаток после удаления части.
          3. Вычисляем: $17 - 8 = 9$.

          ### Проверка
          Сложим остаток и вышедших: $9 + 8 = 17$ — снова получается число ехавших. Остаток 9 меньше 17, как и должно быть после удаления части.

          ### Типичная ошибка
          Сложить ехавших и вышедших ($17 + 8 = 25$): после выхода пассажиров в автобусе не может стать больше, чем было.
      - params: {a: 19, b: 5}
        answer: 14
        solution: |
          ### Ответ
          14 пассажиров.

          ### Идея
          Вышедшие пассажиры — часть тех, кто ехал в автобусе, поэтому остаток находят вычитанием.

          ### Шаги
          1. Данные: ехали — 19 пассажиров, вышли — 5 пассажиров.
          2. Искомое — оставшиеся пассажиры, то есть остаток после удаления части.
          3. Вычисляем: $19 - 5 = 14$.

          ### Проверка
          Сложим остаток и вышедших: $14 + 5 = 19$ — снова получается число ехавших. Остаток 14 меньше 19, как и должно быть после удаления части.

          ### Типичная ошибка
          Сложить ехавших и вышедших ($19 + 5 = 24$): после выхода пассажиров в автобусе не может стать больше, чем было.
      - params: {a: 16, b: 9}
        answer: 7
        solution: |
          ### Ответ
          7 пассажиров.

          ### Идея
          Вышедшие пассажиры — часть тех, кто ехал в автобусе, поэтому остаток находят вычитанием.

          ### Шаги
          1. Данные: ехали — 16 пассажиров, вышли — 9 пассажиров.
          2. Искомое — оставшиеся пассажиры, то есть остаток после удаления части.
          3. Вычисляем: $16 - 9 = 7$.

          ### Проверка
          Сложим остаток и вышедших: $7 + 9 = 16$ — снова получается число ехавших. Остаток 7 меньше 16, как и должно быть после удаления части.

          ### Типичная ошибка
          Сложить ехавших и вышедших ($16 + 9 = 25$): после выхода пассажиров в автобусе не может стать больше, чем было.
      - params: {a: 20, b: 3}
        answer: 17
        solution: |
          ### Ответ
          17 пассажиров.

          ### Идея
          Вышедшие пассажиры — часть тех, кто ехал в автобусе, поэтому остаток находят вычитанием.

          ### Шаги
          1. Данные: ехали — 20 пассажиров, вышли — 3 пассажира.
          2. Искомое — оставшиеся пассажиры, то есть остаток после удаления части.
          3. Вычисляем: $20 - 3 = 17$.

          ### Проверка
          Сложим остаток и вышедших: $17 + 3 = 20$ — снова получается число ехавших. Остаток 17 меньше 20, как и должно быть после удаления части.

          ### Типичная ошибка
          Сложить ехавших и вышедших ($20 + 3 = 23$): после выхода пассажиров в автобусе не может стать больше, чем было.
    hints:
      - Что происходит с количеством пассажиров, когда часть из них выходит на остановке?
      - Выход пассажиров удаляет часть из целого, а удаление части записывают вычитанием.
      - Из числа ехавших {{a}} уберите вышедших {{b}} и запишите, сколько останется.
    solution: |
      ### Ответ
      Остаток после выхода части пассажиров: ${{a}} - {{b}}$ пассажиров.

      ### Идея
      Вышедшие пассажиры — часть тех, кто ехал в автобусе, поэтому остаток находят вычитанием.

      ### Шаги
      1. Данные: ехали — {{a}}, вышли — {{b}}; искомое — оставшиеся пассажиры.
      2. Остаток после удаления части находят вычитанием.
      3. Записываем вычитание ${{a}} - {{b}}$ и вычисляем его.

      ### Проверка
      Прибавьте к полученному остатку число вышедших {{b}} — должно снова получиться {{a}}. Остаток при этом обязан быть меньше {{a}}.

      ### Типичная ошибка
      Сложить оба числа: после удаления части количество не растёт, поэтому сумма на вопрос задачи не отвечает.
    feedback:
      correct: 'Верно: вышедшие пассажиры удалены из общего числа ехавших, остаток меньше исходного количества.'
      wrong:
        what: Число оставшихся пассажиров не совпало.
        why: Возможно, ехавших и вышедших сложили, хотя остановка количество уменьшила.
        fix: Назовите, что считает каждое число, затем из числа ехавших уберите вышедших.
        next: 'Раздел T02: пример, где часть людей уходит из зала.'
  - id: P-02
    type: number
    role: warmup
    purpose: meaning
    level: 0
    outcome: LO-01
    sections: [T01]
    minutes: 1
    trivial_answer_ok: true
    prompt: На причале стоят {{a|pl:яхта,яхты,яхт}} и {{b|pl:катер,катера,катеров}}. Сколько катеров стоит на причале? Ответ
      запишите числом.
    answer: 6
    variants:
      - params: {a: 9, b: 6}
        answer: 6
        solution: |
          ### Ответ
          6 катеров.

          ### Идея
          Искомое уже названо в условии: число с подписью «катеры» известно, вычислять нечего.

          ### Шаги
          1. Данные: яхты — 9, катеры — 6.
          2. Вопрос спрашивает только про катеры, поэтому ответ — число 6 из условия.
          3. Число 9 считает яхты и в ответе на этот вопрос не участвует.

          ### Проверка
          Подпись числа 6 — «катеры», она совпадает с вопросом. Сумма $9 + 6 = 15$ отвечала бы на другой вопрос — сколько всего судов на причале.

          ### Типичная ошибка
          Сложить оба числа из текста ($9 + 6 = 15$): сумма считает все суда, а спрашивают только катеры.
      - params: {a: 12, b: 5}
        answer: 5
        solution: |
          ### Ответ
          5 катеров.

          ### Идея
          Искомое уже названо в условии: число с подписью «катеры» известно, вычислять нечего.

          ### Шаги
          1. Данные: яхты — 12, катеры — 5.
          2. Вопрос спрашивает только про катеры, поэтому ответ — число 5 из условия.
          3. Число 12 считает яхты и в ответе на этот вопрос не участвует.

          ### Проверка
          Подпись числа 5 — «катеры», она совпадает с вопросом. Сумма $12 + 5 = 17$ отвечала бы на другой вопрос — сколько всего судов на причале.

          ### Типичная ошибка
          Сложить оба числа из текста ($12 + 5 = 17$): сумма считает все суда, а спрашивают только катеры.
      - params: {a: 7, b: 8}
        answer: 8
        solution: |
          ### Ответ
          8 катеров.

          ### Идея
          Искомое уже названо в условии: число с подписью «катеры» известно, вычислять нечего.

          ### Шаги
          1. Данные: яхты — 7, катеры — 8.
          2. Вопрос спрашивает только про катеры, поэтому ответ — число 8 из условия.
          3. Число 7 считает яхты и в ответе на этот вопрос не участвует.

          ### Проверка
          Подпись числа 8 — «катеры», она совпадает с вопросом. Сумма $7 + 8 = 15$ отвечала бы на другой вопрос — сколько всего судов на причале.

          ### Типичная ошибка
          Сложить оба числа из текста ($7 + 8 = 15$): сумма считает все суда, а спрашивают только катеры.
      - params: {a: 15, b: 4}
        answer: 4
        solution: |
          ### Ответ
          4 катера.

          ### Идея
          Искомое уже названо в условии: число с подписью «катеры» известно, вычислять нечего.

          ### Шаги
          1. Данные: яхты — 15, катеры — 4.
          2. Вопрос спрашивает только про катеры, поэтому ответ — число 4 из условия.
