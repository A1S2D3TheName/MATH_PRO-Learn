          ### Типичная ошибка
          Сложить оба числа из текста ($15 + 4 = 19$): сумма считает все суда, а спрашивают только катеры.
    hints:
      - 'Прочитайте вопрос ещё раз: про какие именно суда в нём спрашивают?'
      - Число с нужной подписью уже стоит в условии, поэтому действие может не понадобиться.
      - Одно из чисел {{a}} и {{b}} в условии стоит рядом со словом «катеров»; найдите это
        число по подписи и запишите.
    solution: |
      ### Ответ
      Число катеров из условия: {{b}}.

      ### Идея
      Искомое уже названо в условии: число с подписью «катеры» известно, вычислять нечего.

      ### Шаги
      1. Данные: яхты — {{a}}, катеры — {{b}}.
      2. Вопрос спрашивает только про катеры, поэтому ответ — названное в условии число.
      3. Число {{a}} считает яхты и в ответе на этот вопрос не участвует.

      ### Проверка
      Подпись ответа совпадает с вопросом: посчитаны катеры. Сумма {{a}} и {{b}} отвечала бы на вопрос о всех судах причала.

      ### Типичная ошибка
      Сложить оба числа из текста: сумма считает все суда, а спрашивают только катеры.
    feedback:
      correct: 'Верно: число катеров названо в условии, и лишнее действие не понадобилось.'
      wrong:
        what: Названо число, которое считает не катеры.
        why: Возможно, оба числа условия сложили, хотя вопрос про одну группу судов.
        fix: Подпишите, что считает каждое число, и возьмите число с подписью «катеры».
        next: 'Раздел T01: пример с двумя вопросами к одному условию.'
  - id: P-03
    type: number
    role: warmup
    purpose: procedure
    level: 1
    outcome: LO-02
    sections: [T02]
    minutes: 1
    prompt: Утром пекарня испекла {{a|pl:буханка,буханки,буханок}} хлеба, а после обеда — ещё
      {{b|pl:буханка,буханки,буханок}}. Сколько всего буханок испекла пекарня за день? Ответ запишите числом.
    answer: 40
    variants:
      - params: {a: 26, b: 14}
        answer: 40
        solution: |
          ### Ответ
          40 буханок.

          ### Идея
          Утренняя и дневная партии — две части дневного количества, а целое находят сложением частей.

          ### Шаги
          1. Данные: утром — 26 буханок, после обеда — 14 буханок.
          2. Искомое — все буханки за день, то есть целое из двух частей.
          3. Вычисляем: $26 + 14 = 40$.

          ### Проверка
          Вторым действием: $40 - 14 = 26$ — после удаления дневной партии остаётся утренняя. Сумма 40 больше каждой партии по отдельности.

          ### Типичная ошибка
          Назвать только утреннюю партию (26): дневная партия при этом не присоединена к целому.
      - params: {a: 35, b: 17}
        answer: 52
        solution: |
          ### Ответ
          52 буханки.

          ### Идея
          Утренняя и дневная партии — две части дневного количества, а целое находят сложением частей.

          ### Шаги
          1. Данные: утром — 35 буханок, после обеда — 17 буханок.
          2. Искомое — все буханки за день, то есть целое из двух частей.
          3. Вычисляем: $35 + 17 = 52$.

          ### Проверка
          Вторым действием: $52 - 17 = 35$ — после удаления дневной партии остаётся утренняя. Сумма 52 больше каждой партии по отдельности.

          ### Типичная ошибка
          Назвать только утреннюю партию (35): дневная партия при этом не присоединена к целому.
      - params: {a: 28, b: 19}
        answer: 47
        solution: |
          ### Ответ
          47 буханок.

          ### Идея
          Утренняя и дневная партии — две части дневного количества, а целое находят сложением частей.

          ### Шаги
          1. Данные: утром — 28 буханок, после обеда — 19 буханок.
          2. Искомое — все буханки за день, то есть целое из двух частей.
          3. Вычисляем: $28 + 19 = 47$.

          ### Проверка
          Вторым действием: $47 - 19 = 28$ — после удаления дневной партии остаётся утренняя. Сумма 47 больше каждой партии по отдельности.

          ### Типичная ошибка
          Назвать только утреннюю партию (28): дневная партия при этом не присоединена к целому.
      - params: {a: 33, b: 16}
        answer: 49
        solution: |
          ### Ответ
          49 буханок.

          ### Идея
          Утренняя и дневная партии — две части дневного количества, а целое находят сложением частей.

          ### Шаги
          1. Данные: утром — 33 буханки, после обеда — 16 буханок.
          2. Искомое — все буханки за день, то есть целое из двух частей.
          3. Вычисляем: $33 + 16 = 49$.

          ### Проверка
          Вторым действием: $49 - 16 = 33$ — после удаления дневной партии остаётся утренняя. Сумма 49 больше каждой партии по отдельности.

          ### Типичная ошибка
          Назвать только утреннюю партию (33): дневная партия при этом не присоединена к целому.
    hints:
      - Утренняя и дневная партии — две части одного дневного количества. Что делают с частями, чтобы получить целое?
      - Целое из двух частей находят сложением.
      - Сложите утренние {{a}} и дневные {{b}} буханок и запишите дневное количество.
    solution: |
      ### Ответ
      Сумма утренней и дневной партий: ${{a}} + {{b}}$ буханок.

      ### Идея
      Утренняя и дневная партии — две части дневного количества, а целое находят сложением частей.

      ### Шаги
      1. Данные: утром — {{a}}, после обеда — {{b}}; искомое — все буханки за день.
      2. Целое из двух частей находят сложением.
      3. Записываем сложение ${{a}} + {{b}}$ и вычисляем его.

      ### Проверка
      Вычтите из ответа дневную партию {{b}} — должна остаться утренняя партия {{a}}. Сумма больше каждой партии по отдельности.

      ### Типичная ошибка
      Назвать только одну партию: вторая часть при этом не присоединена к целому.
    feedback:
      correct: 'Верно: обе партии объединены в дневное количество, сумма больше каждой партии.'
      wrong:
        what: Дневное количество буханок не совпало.
        why: Возможно, названа только одна партия, а вторая не присоединена.
        fix: Сложите утреннюю и дневную партии как две части одного целого.
        next: 'Раздел T02: пример, где две группы людей объединяются в одну.'
  # ---------------------------------------------------------------- supported
  - id: P-04
    type: number
    role: supported
    purpose: procedure
    level: 1
    outcome: LO-01
    sections: [T01]
    minutes: 2
    prompt: В спортзале {{a|pl:мат,мата,матов}}. Для занятия разложили {{b|pl:мат,мата,матов}}, остальные маты лежат на
      стеллаже. Ещё в зале стоят {{c|pl:скамейка,скамейки,скамеек}}. Сколько матов лежит на стеллаже? Ответ запишите
      числом.
    answer: 15
    variants:
      - params: {a: 24, b: 9, c: 5}
        answer: 15
        solution: |
          ### Ответ
          15 матов.

          ### Идея
          Маты на стеллаже — остаток: из всех матов убирают разложенные. Скамейки к вопросу не относятся.

          ### Шаги
          1. Данные о матах: всего — 24, разложили — 9. Число 5 считает скамейки.
          2. Искомое — маты на стеллаже, то есть остаток после удаления части.
          3. Вычисляем: $24 - 9 = 15$.

          ### Проверка
          Сложим остаток и разложенные маты: $15 + 9 = 24$ — получаются все маты зала. Число скамеек 5 в проверку не входит.

          ### Типичная ошибка
          E-model-one-step-all-numbers: сложить все числа текста ($24 + 9 + 5 = 38$) — скамейки при этом посчитаны как маты.
