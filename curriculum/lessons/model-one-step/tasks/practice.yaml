      - Запись с вопросом у начала («Было — ?») подходит задаче, где сначала было несколько предметов.
      - Остаток после проката — это запись «было, взяли, осталось», а целое из двух групп фруктов — запись со словом
        «всего».
    solution: |
      ### Ответ
      Велосипеды — запись «Было — 18; взяли — 7; осталось — ?»; фрукты — «Апельсины — 13; лимоны — 8; всего — ?»; фломастеры — «Было — ?; положили — 4; стало — 15». Лишняя запись — «Было — 15; взяли — 4; осталось — ?».

      ### Идея
      Краткая запись подходит задаче, если подписи величин и место вопроса совпадают с условием и вопросом.

      ### Шаги
      1. Задача о велосипедах: известно начало 18 и взятая часть 7, неизвестен остаток — это первая запись.
      2. Задача о фруктах: известны две части 13 и 8, неизвестно целое «всего» — это вторая запись.
      3. Задача о фломастерах: неизвестно начало, известны добавка 4 и итог 15 — это третья запись. Четвёртая запись меняет роли чисел 15 и 4 и ни одной задаче не подходит.

      ### Проверка
      Подставим ответы задач в записи: $18 - 7 = 11$ велосипедов осталось; $13 + 8 = 21$ фрукт всего; $15 - 4 = 11$ фломастеров было сначала, и проверка $11 + 4 = 15$ возвращает итог.

      ### Типичная ошибка
      E-model-one-step-unknown-start: соединить задачу о фломастерах с записью «Было — 15» — итог при этом принят за начало, хотя начало как раз неизвестно.
    feedback:
