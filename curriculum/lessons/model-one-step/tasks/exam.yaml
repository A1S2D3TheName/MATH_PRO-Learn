        prompt: >-
          В шкафу 35 свитеров и 24 рубашки; 8 свитеров — детские.
          Сколько всего свитеров и рубашек в шкафу? Сколько свитеров в шкафу не детские?
          Введите два числа.
        fields:
          - {id: total, label: всего свитеров и рубашек}
          - {id: plain, label: свитеров не детские}
        answer: {total: 59, plain: 27}
        hints:
          - Условие содержит два вопроса — для каждого нужны свои данные.
          - Детские свитеры входят в 35 свитеров и отдельной группой не считаются.
          - Для первого вопроса сложите 35 и 24; для второго из 35 уберите 8 детских.
        solution: |
          ### Ответ
          Всего свитеров и рубашек — 59; свитеров не детские — 27.

          ### Идея
          Два вопроса к одному условию собирают разные данные. Первый объединяет две группы;
          второй выделяет часть одной группы. Детские свитеры — часть 35 свитеров.

          ### Шаги
          1. Первый вопрос: целое из свитеров и рубашек, $35 + 24 = 59$.
          2. Детские свитеры (8) входят в 35 свитеров и отдельно не считаются.
          3. Второй вопрос: не детские свитеры — часть целого, $35 - 8 = 27$.

          ### Проверка
          $59 - 24 = 35$ — после удаления рубашек остаются все свитеры; $27 + 8 = 35$ —
          детские и не детские свитеры дают все свитеры шкафа.

          ### Типичная ошибка
          E-model-one-step-all-numbers: ответить на первый вопрос числом $35 + 24 + 8 = 67$ —
          детские свитеры посчитаны дважды.
        feedback:
          correct: 'Верно: всего 59 предметов, а не детских свитеров — 27; данные каждого вопроса выбраны свои.'
          wrong:
