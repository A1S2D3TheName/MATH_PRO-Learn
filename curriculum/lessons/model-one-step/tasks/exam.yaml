        sections: [T03, T04]
        minutes: 3
        prompt: >-
          По краткой записи «Было — ?; Раздали — 23 тетради; Осталось — 43 тетради» составьте
          решение и проверьте его. Сколько тетрадей было сначала? Введите число.
        answer: 66
        hints:
          - Сначала определите, какая величина в записи целое, а какая часть.
          - После раздачи тетрадей стало меньше, значит, в начале их было больше, чем осталось.
          - 'Остаток и разданная часть вместе дают начальное количество: 43 и 23.'
        solution: |
          ### Ответ
          66

          ### Идея
          В ситуации удаления неизвестное начало больше остатка: остаток и разданная часть
          вместе дают начальное количество, поэтому начало находят сложением остатка и разданной части.

          ### Шаги
          1. «Осталось — 43» — остаток после раздачи.
          2. «Раздали — 23» — удалённая часть.
          3. Складываем остаток и удалённую часть: $43 + 23 = 66$.

          ### Проверка
          $66 - 23 = 43$ — из начального количества убирают разданное и получают остаток.
          Начало 66 больше остатка 43: после раздачи тетрадей стало меньше.

          ### Типичная ошибка
          Вычесть из остатка: $43 - 23 = 20$ — начало оказалось бы меньше остатка, и раздать
          23 тетради из 20 было бы невозможно.
        feedback:
          correct: 'Верно: тетрадей было 66 — остаток и разданная часть вместе дают начальное количество: 43 и 23.'
          wrong:
            what: Число тетрадей не совпало с 66.
            why: Возможно, остаток и разданную часть сочли целым и частью в неверную сторону.
            fix: 'Проверьте вычитанием: из вашего ответа должно вычитаться 23 с результатом 43.'
            next: 'Раздел T03: где в записи целое, а где часть.'
