      - id: EA-08
        type: choice
        role: exam
        purpose: method
        level: 2
        points: 1
        outcome: LO-02
        sections: [T02]
        minutes: 2
        prompt: >-
          У Гоши 38 марок — это на 14 больше, чем у Лизы; 9 марок Гоши — с кораблями.
          Каким действием находят, сколько марок у Лизы?
        options:
          - {id: a, text: "Вычесть 14 из 38"}
          - {id: b, text: "Прибавить 14 к 38", misconception: E-model-one-step-more-means-plus}
          - {id: c, text: "Сложить 38, 14 и 9", misconception: E-model-one-step-all-numbers}
          - {id: d, text: "Прибавить 9 к 38", misconception: E-model-one-step-part-as-extra}
        answer: a
        hints:
          - 'Выясните, чьё количество известно и кто больше: Гоша или Лиза.'
          - Фраза «на 14 больше» сравнивает два количества, а известное — большее из них.
          - 'Составьте связь: количество Лизы и ещё 14 дают 38 марок Гоши.'
        solution: |
          ### Ответ
          Вычесть 14 из 38.

          ### Идея
          «На 14 больше» описывает разницу двух количеств: 38 марок — большее, количество
          Лизы — меньшее. Меньшее находят вычитанием разницы из большего.

          ### Шаги
          1. Количество Гоши — 38 марок, это большее количество.
          2. Разница между количествами — 14 марок.
          3. Вычитаем разницу из большего: $38 - 14 = 24$ — столько марок у Лизы.

          ### Проверка
          $24 + 14 = 38$ — к количеству Лизы добавляется разница и получается количество
          Гоши. Слово «больше» не прибавляет марки к Гоше.

          ### Типичная ошибка
          E-model-one-step-more-means-plus: прибавить 14 к 38 и получить 52 — тогда у Лизы
          оказалось бы больше, чем у Гоши, хотя по условию наоборот.
        feedback:
          correct: 'Верно: большее количество известно, меньшее находят вычитанием 14 из 38.'
          wrong:
