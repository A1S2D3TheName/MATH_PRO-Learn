# Контрольная (STANDARD.md §8, правила 80–81): варианты A и B — по 15 задач, равные суммы
# баллов (15), 39 минут работы, уровни по неубыванию 0→4, разные условия и контексты.
# Каждый outcome покрыт в обоих вариантах (по 5 задач). Набор назначений правила 174
# (≥2 procedure, ≥1 meaning, method, transfer на outcome) обеспечен объединением
# не-challenge банка и контрольной: meaning для LO-02 даёт P-06, method — P-08 и EA/EB-08,
# transfer — EA/EB-12. Purpose в задачах контрольной назван по тому, что ученик
# действительно выбирает (правило 162), а не для заполнения квоты в одном варианте.
# Числа не повторяют примеры теории.
variants:
  - id: A
    tasks:
      - id: EA-01
        type: match
        role: exam
        purpose: meaning
        level: 0
        points: 1
        outcome: LO-01
        sections: [T01]
        minutes: 2
        prompt: >-
          Разложите фразы задачи по ролям. Задача: «В оранжерее 34 цветка, 12 из них — розы.
          На подоконнике 3 горшка. Сколько в оранжерее цветков, которые не розы?»
        left:
          - {id: la, text: "34 цветка"}
          - {id: lb, text: "12 роз"}
          - {id: lc, text: "3 горшка"}
          - {id: ld, text: "сколько цветков не розы"}
        right:
          - {id: ra, text: "данное: все цветки оранжереи"}
          - {id: rb, text: "данное: часть цветков — розы"}
          - {id: rc, text: "вопрос задачи — искомое"}
          - {id: rd, text: "не относится к вопросу задачи"}
          - {id: re, text: "краткая запись задачи"}
          - {id: rf, text: "проверка ответа"}
        answer:
          - {left: la, right: ra}
          - {left: lb, right: rb}
          - {left: lc, right: rd}
          - {left: ld, right: rc}
        hints:
          - >-
            У каждой фразы своя роль: что-то описывает ситуацию, что-то спрашивает,
            а что-то к делу не относится.
          - >-
            Данные — числа с подписью, что они считают; искомое названо в вопросе
            и отвечает на него.
          - >-
            Фраза «сколько цветков не розы» отвечает на вопрос «что нужно найти?» —
            остальные роли определите по ней.
        solution: |
          ### Ответ
          «34 цветка» — данные: все цветки; «12 роз» — данные: часть цветков;
          «сколько цветков не розы» — вопрос и искомое; «3 горшка» — не относится к вопросу.

          ### Идея
          Разбор начинают с вопроса: он называет искомое. Данные — числа с подписями,
          которые относятся к этому вопросу.

          ### Шаги
          1. Вопрос «сколько цветков не розы» называет искомое.
          2. «34 цветка» считает все цветки оранжереи — это данные.
          3. «12 роз» уточняет часть 34 цветков — это тоже данные.
          4. «3 горшка» считает не цветки, а горшки: к вопросу о цветках не относится.

          ### Проверка
          Для ответа нужны 34 и 12: розы входят в 34 цветка, поэтому отдельно их не считают.
          Число 3 в вычислении не участвует — оно описывает горшки.

          ### Типичная ошибка
          E-model-one-step-all-numbers: взять все числа текста, включая горшки, и получить
          число, которое не считает ни цветки, ни розы.
        feedback:
          correct: 'Верно: искомое названо вопросом, данные — числа с подписями, а горшки к вопросу не относятся.'
          wrong:
            what: Роль хотя бы одной фразы определена неверно.
            why: Возможно, число сочли данными только потому, что оно есть в тексте.
            fix: Начните с вопроса и спросите у каждого числа, что именно оно считает.
            next: 'Раздел T01: условие, вопрос, данные и искомое.'
        errors: [E-model-one-step-all-numbers]

      - id: EA-02
        type: number
        role: exam
        purpose: procedure
        level: 1
        points: 1
        outcome: LO-01
        sections: [T01]
        minutes: 2
        prompt: >-
          В посылке 38 открыток и 17 марок; 9 открыток — с видами городов.
          Сколько всего открыток и марок в посылке? Введите число.
        answer: 55
        hints:
          - Спросите, какие числа считают открытки и марки вместе.
          - Число 9 уточняет часть открыток и не добавляет в посылку новых вещей.
          - 'Сложите количество открыток и количество марок: 38 и 17.'
        solution: |
          ### Ответ
          55

          ### Идея
          В посылке две группы вещей: открытки и марки. Уточнение о видах городов
          описывает часть открыток и отдельной группой не считается.

          ### Шаги
          1. Данные для вопроса: 38 открыток и 17 марок.
          2. 9 открыток с видами городов уже входят в 38 открыток.
          3. Складываем группы: $38 + 17 = 55$.

          ### Проверка
          $55 - 17 = 38$ — после удаления марок остаются все открытки; сумма больше
          каждого слагаемого, как и положено при объединении групп.

          ### Типичная ошибка
          E-model-one-step-all-numbers: сложить все числа текста, $38 + 17 + 9 = 64$:
          открытки с видами городов посчитаны дважды.
        feedback:
          correct: 'Верно: посчитаны 38 открыток и 17 марок, а уточнение о видах городов не прибавлялось.'
          wrong:
            what: Число не совпало с 55.
            why: Возможно, сложили все числа условия, включая 9 открыток с видами городов.
            fix: 'Выпишите подписи чисел: 9 — часть 38 открыток, а не отдельная группа.'
            next: 'Раздел T01: какие числа относятся к вопросу.'
          misconceptions:
            - id: E-model-one-step-all-numbers
              when:
                expr: '38 + 17 + 9'
              message: 'Похоже, сложены все числа условия: открытки с видами городов уже входят в 38 открыток.'
        errors: [E-model-one-step-all-numbers]

      - id: EA-03
        type: number
        role: exam
        purpose: procedure
        level: 1
        points: 1
        outcome: LO-02
        sections: [T02]
        minutes: 2
        prompt: >-
          В кафе было 35 гостей. Вечером пришли ещё 16 гостей.
          Сколько гостей стало в кафе? Введите число.
        answer: 51
        hints:
          - 'Гостей стало больше: вечерняя группа присоединяется к первой.'
          - Когда части объединяют в одно целое, выбирают сложение.
          - 'Запишите объединение двух групп: 35 и 16.'
        solution: |
          ### Ответ
          51

          ### Идея
          Гости, которые были в кафе, и вечерняя группа — две части одного целого:
          части объединяют сложением.

          ### Шаги
          1. Сначала в кафе было 35 гостей.
          2. Вечером к ним присоединились ещё 16 гостей.
          3. Складываем части: $35 + 16 = 51$.

          ### Проверка
          $51 - 16 = 35$ — если вечерние гости уйдут, останутся те, кто был сначала.
          Сумма 51 больше каждого слагаемого: гостей действительно стало больше.

          ### Типичная ошибка
          Вычесть вместо сложения: $35 - 16 = 19$ — тогда гостей стало бы меньше,
          хотя они только приходили.
        feedback:
          correct: 'Верно: 35 + 16 = 51, вечерние гости присоединились к первым.'
          wrong:
            what: Число гостей не совпало с 51.
            why: 'Возможно, действие выбрано не по смыслу: приход гостей увеличивает количество.'
            fix: Сначала спросите, стало гостей больше или меньше, и только потом записывайте действие.
            next: 'Раздел T02: выбор действия по смыслу ситуации.'

      - id: EA-04
        type: number
        role: exam
        purpose: procedure
        level: 1
        points: 1
        outcome: LO-02
        sections: [T02]
        minutes: 2
        prompt: >-
          В театре стояли 63 кресла. Убрали 28 кресел на склад.
          Сколько кресел осталось в театре? Введите число.
        answer: 35
        hints:
          - После уборки кресел в театре стало меньше.
          - Удаление части из целого — это вычитание.
          - 'Вычтите убранные кресла от всех: 63 и 28.'
        solution: |
          ### Ответ
          35

          ### Идея
          Убранные кресла — часть всех кресел театра; из целого удалили часть,
          поэтому выбирают вычитание.

          ### Шаги
          1. Всего кресел было 63.
          2. Убрали часть — 28 кресел.
          3. Вычитаем: $63 - 28 = 35$.

          ### Проверка
          $35 + 28 = 63$ — оставшиеся и убранные кресла снова дают все кресла театра.

          ### Типичная ошибка
          Сложить вместо вычитания: $63 + 28 = 91$ — кресел стало бы больше, хотя их убирали.
        feedback:
          correct: 'Верно: 63 − 28 = 35, из целого удалена убранная часть.'
          wrong:
            what: Число кресел не совпало с 35.
            why: Возможно, действие выбрано по числам, а не по тому, что кресел стало меньше.
            fix: Запишите, что было целым и какую часть убрали, затем вычитайте.
            next: 'Раздел T02: удаление части.'

      - id: EA-10
        type: number
        role: exam
        purpose: procedure
        level: 1
        points: 1
        outcome: LO-02
        sections: [T02]
        minutes: 3
        prompt: >-
          В копилке было несколько монет. Положили ещё 21 монету, и стало 58 монет.
          Сколько монет было в копилке сначала? Введите число.
        answer: 37
        hints:
          - Искомое — начальное количество, а не итог после добавления.
          - 'Итог 58 состоит из начальных монет и добавленных 21: одна из частей неизвестна.'
          - 'Запишите кратко: «Было — ?; Положили — 21; Стало — 58» и найдите неизвестную часть.'
        solution: |
          ### Ответ
          37

          ### Идея
          Итог 58 — целое, добавленные 21 монета — известная часть; начальное количество —
          вторая часть целого, его находят вычитанием.

          ### Шаги
          1. «Стало — 58» — целое количество монет.
          2. «Положили — 21» — известная часть целого.
          3. Вычитаем часть из целого: $58 - 21 = 37$.

          ### Проверка
          $37 + 21 = 58$ — начальные и добавленные монеты дают итог. Начало 37 меньше
          итога 58, как и положено после добавления.

          ### Типичная ошибка
          E-model-one-step-unknown-start: сложить $21 + 58 = 79$ — начало не может быть
          больше итога после добавления монет.
        feedback:
          correct: 'Верно: сначала было 37 монет — из итога 58 вычтена добавленная часть.'
          wrong:
            what: Число монет не совпало с 37.
            why: Возможно, добавленные монеты прибавлены к итогу вместо нахождения начала.
            fix: 'Спросите, могло ли монет стать больше 58 после добавления 21: начало меньше итога.'
            next: 'Раздел T02: неизвестное начало.'
          misconceptions:
            - id: E-model-one-step-unknown-start
              when:
                expr: '21 + 58'
              message: 'Похоже, добавленные монеты прибавлены к итогу: начало не может превышать 58 после добавления.'
        errors: [E-model-one-step-unknown-start]

      - id: EA-05
        type: number
        role: exam
        purpose: procedure
        level: 2
        points: 1
        outcome: LO-01
        sections: [T01]
        minutes: 2
        prompt: >-
          В мешке лежало 45 кг картофеля и 12 кг моркови. 20 кг картофеля выгрузили в подвал.
          Сколько овощей было в мешке до выгрузки? Введите число.
        answer: 57
        hints:
          - 'Вопрос о времени до выгрузки: какие числа описывают мешок в тот момент?'
          - Выгруженные 20 кг — часть картофеля, уже учтённая в числах мешка.
          - 'Сложите картофель и морковь, которые лежали в мешке: 45 и 12.'
        solution: |
          ### Ответ
          57

          ### Идея
          Вопрос о моменте до выгрузки: считают всё, что лежало в мешке, — картофель и морковь.
          Выгрузка не добавляет овощи, поэтому число 20 кг в сумму не входит.

          ### Шаги
          1. Картофель в мешке — 45 кг.
          2. Морковь в мешке — 12 кг.
          3. Складываем овощи: $45 + 12 = 57$.

          ### Проверка
          $57 - 12 = 45$ — после удаления моркови остаётся картофель. Ответ про момент
          до выгрузки не может зависеть от того, сколько потом выгрузили.

          ### Типичная ошибка
          E-model-one-step-all-numbers: сложить все числа, $45 + 12 + 20 = 77$,
          или прибавить выгруженное к целому, $45 + 20 = 65$: часть картофеля посчитана дважды.
        feedback:
          correct: 'Верно: до выгрузки в мешке было 57 кг овощей — 45 кг картофеля и 12 кг моркови.'
          wrong:
            what: Число килограммов не совпало с 57.
            why: Возможно, к овощам мешка прибавили выгруженные 20 кг — часть уже посчитанного картофеля.
            fix: 'Подпишите каждое число: 20 кг — это выгруженная часть картофеля, а не овощи мешка.'
            next: 'Раздел T01: какие данные описывают искомое.'
          misconceptions:
            - id: E-model-one-step-all-numbers
              when:
                expr: '45 + 12 + 20'
              message: 'Похоже, сложены все числа условия: выгруженные 20 кг уже входят в 45 кг картофеля.'
            - id: E-model-one-step-part-as-extra
              when:
                expr: '45 + 20'
              message: 'Похоже, выгруженные килограммы прибавлены к картофелю второй раз.'
        errors: [E-model-one-step-all-numbers, E-model-one-step-part-as-extra]

      - id: EA-06
        type: table-fill
        role: exam
        purpose: procedure
        level: 2
        points: 1
        outcome: LO-03
        sections: [T03]
        minutes: 3
        prompt: >-
          В ателье было 57 метров ткани. Израсходовали 24 метра.
          Заполните краткую запись задачи: пропущенное число — искомое.
        shape: [1, 3]
        table:
          columns: [Было, Израсходовали, Осталось]
          rows:
            - [57, 24, null]
        answer:
          - {r: 0, c: 2, value: 33}
        hints:
          - Краткая запись оставляет величины с подписями и знак вопроса на месте искомого.
          - Целое — 57 метров, а израсходованные 24 метра — известная часть целого.
          - 'Неизвестную часть находят из целого: запишите вычитание 57 и 24.'
        solution: |
          ### Ответ
          33

          ### Идея
          В записи известно целое и одна часть; искомое — вторая часть, её находят вычитанием.

          ### Шаги
          1. «Было — 57» — целое количество ткани.
          2. «Израсходовали — 24» — известная часть целого.
          3. Вычитаем часть из целого: $57 - 24 = 33$.

          ### Проверка
          $33 + 24 = 57$ — остаток и израсходованная часть снова дают целое.

          ### Типичная ошибка
          Прибавить часть к целому: $57 + 24 = 81$ — остаток получился больше того, что было.
        feedback:
          correct: 'Верно: в краткой записи неизвестен остаток — 57 − 24 = 33.'
          wrong:
            what: Число в пустой клетке не совпало с 33.
            why: Возможно, к целому прибавили израсходованную часть вместо вычитания.
            fix: 'Определите, какая величина целое: «Было» — целое, значит, остаток меньше 57.'
            next: 'Раздел T03: краткая запись и схема.'

