      - id: EA-09
        type: choice
        role: exam
        purpose: meaning
        level: 2
        points: 1
        outcome: LO-03
        sections: [T04]
        minutes: 3
        prompt: >-
          У Тима 42 значка, у Ромы 27 значков; 8 значков у Тима — золотые.
          В чужих решениях вопроса «на сколько значков у Тима больше?» получили ответы
          69, 50 и 77. Какое утверждение о проверке ответов верно?
        options:
          - {id: a, text: "Ответ 69 проверка отбрасывает: разность не может быть больше большего количества; верный ответ — 15"}
          - {id: b, text: "Ответ 69 проверка оставляет: вопрос «на сколько больше» требует сложения", misconception: E-model-one-step-difference-as-sum}
          - {id: c, text: "Ответ 50 проверка оставляет: золотые значки — отдельная группа, её прибавили к 42", misconception: E-model-one-step-part-as-extra}
          - {id: d, text: "Ответ 77 проверка оставляет: сложены все числа условия", misconception: E-model-one-step-all-numbers}
        answer: a
        hints:
          - Проверка на правдоподобие сравнивает ответ с целым до точного пересчёта.
          - Вопрос «на сколько больше» спрашивает разность; меньшее количество здесь не равно
            нулю, поэтому разность меньше большего числа 42.
          - 'Сравните 69 с числом 42: может ли разница значков превысить количество значков Тима?'
        solution: |
          ### Ответ
          Ответ 69 проверка отбрасывает: разность не может быть больше большего количества;
          верный ответ — 15.

          ### Идея
          Проверка на правдоподобие отсекает невозможное: разность 42 и 27 не может быть
          больше 42. Каждый чужой ответ объясняется своим ошибочным действием.

          ### Шаги
          1. Вопрос требует разности: $42 - 27 = 15$.
          2. 69 больше 42 — разности такой быть не может, проверка отбрасывает 69.
          3. 50 получается из $42 + 8$, а 77 — из $42 + 27 + 8$: оба больше 42 и тоже невозможны.

          ### Проверка
          $15 + 27 = 42$ — разность и меньшее количество возвращают большее. Все три чужих
          ответа больше 42, поэтому проверка отбрасывает их; верно только первое утверждение.

          ### Типичная ошибка
          E-model-one-step-difference-as-sum: принять 69 за верный, потому что «на сколько
          больше» якобы требует сложения; проверка сразу показывает, что ответ больше обоих.
        feedback:
