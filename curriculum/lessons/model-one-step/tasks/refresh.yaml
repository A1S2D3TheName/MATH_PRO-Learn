            4. Остаток: $43 - 17 = 26$.

            ### Проверка
            Остаток и унесённые детали дают целое: $26 + 17 = 43$. Ответ 26 меньше 43, как и требует ситуация задачи.

            ### Типичная ошибка
            Согласиться с числом 60 и не сравнить его с целым: проверка на правдоподобие отбрасывает такие ответы ещё до пересчёта.
      - params: {a: 64, b: 35, w: 99}
        answer: 29
