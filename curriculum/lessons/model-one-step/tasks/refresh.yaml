            27 открыток

            ### Идея
            Вопрос «на сколько больше» спрашивает о разнице двух количеств, а не об их сумме.

            ### Шаги
            1. У Ани 61 открытка — большее количество.
            2. У Вити 34 открытки — меньшее количество.
            3. Разность: $61 - 34 = 27$.

            ### Проверка
            Разность и меньшее количество вместе дают большее: $27 + 34 = 61$. Сумма 95 ответила бы на другой вопрос — сколько открыток у двоих вместе.

            ### Типичная ошибка
            E-model-one-step-difference-as-sum: сложить 61 и 34 и получить 95. Вопрос «на сколько больше» требует разности, а не целого.
      - params: {a: 45, b: 19}
