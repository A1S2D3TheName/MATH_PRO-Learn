  - id: R-05
    type: number
    role: refresh
    purpose: transfer
    level: 2
    outcome: LO-03
    sections: [T04]
    minutes: 3
    unit: деталей
    prompt: >
      Ученик решал задачу «В мастерской было {{a|pl:деталь,детали,деталей}}, {{b|pl:деталь,детали,деталей}} унесли в цех» и получил
      ответ {{w|pl:деталь,детали,деталей}}. Сколько деталей осталось в мастерской на самом деле?
    answer: 27
    hints:
      - Сравните ответ ученика с тем, что было — может ли остаток быть больше целого?
      - Число {{w}} в условии названо, но оно не отвечает на вопрос задачи.
      - Из {{a}} вычтите {{b}} и сравните результат с числом {{w}}.
    solution: |
      ### Ответ
      Разность {{a}} − {{b}}.

      ### Идея
      Чужой ответ сначала проверяют на правдоподобие: если из целого унесли ненулевую часть,
      остаток обязан быть меньше целого, каким бы ни оказался пересчёт.

      ### Шаги
      1. Целое — {{a}}: столько деталей было в мастерской.
      2. Часть целого — {{b}}: столько деталей унесли.
      3. Ответ {{w}} больше {{a}}, поэтому он невозможен, и остаток считают заново.
      4. Остаток находят вычитанием части из целого.

      ### Проверка
      Остаток вместе с {{b}} унесёнными деталями должен дать {{a}}; число {{w}} этой проверке
      не отвечает, значит оно ошибочно.

      ### Типичная ошибка
      Согласиться с ответом {{w}}, не сравнив его с целым. Проверка на правдоподобие отбрасывает
      невозможный ответ до точного пересчёта.
    variants:
      - params: {a: 56, b: 29, w: 85}
        answer: 27
        solution: |
            ### Ответ
            27 деталей

            ### Идея
            Ответ ученика 85 больше того, что было в мастерской, значит он невозможен: после того как часть унесли, остаток не может превышать целое.

            ### Шаги
            1. Было 56 деталей — это целое.
            2. Унесли 29 деталей — часть целого.
            3. Ответ 85 отбрасываем: он больше 56, а остаток после удаления части меньше целого.
            4. Остаток: $56 - 29 = 27$.

            ### Проверка
            Остаток и унесённые детали дают целое: $27 + 29 = 56$. Ответ 27 меньше 56, как и требует ситуация задачи.

            ### Типичная ошибка
            Согласиться с числом 85 и не сравнить его с целым: проверка на правдоподобие отбрасывает такие ответы ещё до пересчёта.
