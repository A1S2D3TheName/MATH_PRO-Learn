            1. У Ани 45 открыток — большее количество.
            2. У Вити 19 открыток — меньшее количество.
            3. Разность: $45 - 19 = 26$.

            ### Проверка
            Разность и меньшее количество вместе дают большее: $26 + 19 = 45$. Сумма 64 ответила бы на другой вопрос — сколько открыток у двоих вместе.

            ### Типичная ошибка
            E-model-one-step-difference-as-sum: сложить 45 и 19 и получить 64. Вопрос «на сколько больше» требует разности, а не целого.
      - params: {a: 70, b: 26}
        answer: 44
        solution: |
            ### Ответ
            44 открытки

            ### Идея
            Вопрос «на сколько больше» спрашивает о разнице двух количеств, а не об их сумме.

            ### Шаги
            1. У Ани 70 открыток — большее количество.
            2. У Вити 26 открыток — меньшее количество.
            3. Разность: $70 - 26 = 44$.

            ### Проверка
            Разность и меньшее количество вместе дают большее: $44 + 26 = 70$. Сумма 96 ответила бы на другой вопрос — сколько открыток у двоих вместе.

            ### Типичная ошибка
            E-model-one-step-difference-as-sum: сложить 70 и 26 и получить 96. Вопрос «на сколько больше» требует разности, а не целого.
    feedback:
      correct: Верно, разность показывает, сколько открыток Ани лишние по сравнению с Витей.
      wrong:
        what: Разница коллекций найдена неверно.
        why: Возможно, количества сложены вместо того, чтобы вычесть меньшее из большего.
