# Повторение (STANDARD.md §8): 5 задач, у каждой по три параметрических варианта.
# Правило 172 (`TASK-LEAK`): повторение не повторяет практику, финал и разобранные примеры теории —
# ни условием с числами, ни ответом. Числа здесь не пересекаются с примерами T01–T04, с диагностикой
# и с финальной цепочкой; подсказки и отклики у каждой задачи свои (правила 170–171).
# Правило 164 (`SOLUTION-NO-ANSWER`): значение ответа варианта стоит в `### Ответ` его собственного
# разбора, поэтому у каждого варианта свой `solution` с числами этого варианта.
# Правило 165: `when.expr` детектора повторяет `formula` записи errors/catalog.yaml, а имена
# параметров совпадают с именами в формуле (для E-model-one-step-unknown-start это `b` и `c`).
# Правило 178: после параметра с существительным стоит формат трёх форм `|pl:...`.
tasks:
  - id: R-01
    type: number
    role: refresh
    purpose: procedure
    level: 1
    outcome: LO-02
    sections: [T02]
    minutes: 3
    unit: пассажиров
    prompt: >
      В автобусе ехало {{a|pl:пассажир,пассажира,пассажиров}}. На остановке вышли {{b|pl:пассажир,пассажира,пассажиров}}.
      Сколько пассажиров осталось в автобусе?
    answer: 28
    hints:
      - Пассажиры выходят из автобуса — их количество после этого уменьшается или растёт?
      - Когда часть удаляют из целого, остаток находят вычитанием.
      - Из {{a}} вычтите {{b}} и проверьте, хватает ли единиц в уменьшаемом.
    solution: |
      ### Ответ
      Разность {{a}} − {{b}}.

      ### Идея
      Часть пассажиров вышла, поэтому из целого удаляют часть и остаток находят вычитанием.

      ### Шаги
      1. Целое — {{a}}: столько пассажиров ехало в автобусе до остановки.
      2. Часть целого — {{b}}: столько пассажиров вышло на остановке.
      3. Остаток находят вычитанием части из целого.

      ### Проверка
      Остаток вместе с вышедшими пассажирами должен снова дать {{a}}, а сам остаток обязан быть
      меньше целого: после выхода части пассажиров их не могло стать больше.

      ### Типичная ошибка
      Сложить оба числа: сумма отвечает на вопрос, сколько пассажиров было бы, если бы все остались.
    variants:
      - params: {a: 47, b: 19}
        answer: 28
        solution: |
            ### Ответ
            28 пассажиров

            ### Идея
            Часть пассажиров вышла, значит из целого удалили часть, а остаток находят вычитанием.

            ### Шаги
            1. В автобусе было 47 пассажиров — это целое.
            2. На остановке вышли 19 пассажиров — часть целого.
            3. Остаток: $47 - 19 = 28$.

            ### Проверка
            Остаток и вышедшие пассажиры вместе дают целое: $28 + 19 = 47$. Остаток 28 меньше 47, как и должно быть после того, как часть пассажиров вышла.

            ### Типичная ошибка
            Сложить 47 и 19 и получить 66: после выхода пассажиров их не могло стать больше, чем было.
      - params: {a: 62, b: 25}
        answer: 37
        solution: |
            ### Ответ
            37 пассажиров

            ### Идея
            Часть пассажиров вышла, значит из целого удалили часть, а остаток находят вычитанием.

            ### Шаги
            1. В автобусе было 62 пассажира — это целое.
            2. На остановке вышли 25 пассажиров — часть целого.
            3. Остаток: $62 - 25 = 37$.

            ### Проверка
            Остаток и вышедшие пассажиры вместе дают целое: $37 + 25 = 62$. Остаток 37 меньше 62, как и должно быть после того, как часть пассажиров вышла.

            ### Типичная ошибка
            Сложить 62 и 25 и получить 87: после выхода пассажиров их не могло стать больше, чем было.
      - params: {a: 53, b: 8}
        answer: 45
        solution: |
            ### Ответ
            45 пассажиров

            ### Идея
            Часть пассажиров вышла, значит из целого удалили часть, а остаток находят вычитанием.

            ### Шаги
            1. В автобусе было 53 пассажира — это целое.
            2. На остановке вышли 8 пассажиров — часть целого.
            3. Остаток: $53 - 8 = 45$.

            ### Проверка
            Остаток и вышедшие пассажиры вместе дают целое: $45 + 8 = 53$. Остаток 45 меньше 53, как и должно быть после того, как часть пассажиров вышла.

            ### Типичная ошибка
            Сложить 53 и 8 и получить 61: после выхода пассажиров их не могло стать больше, чем было.
    feedback:
      correct: Верно, остаток вместе с вышедшими пассажирами снова даёт {{a}}.
      wrong:
        what: Остаток не совпал.
        why: Скорее всего, выбрано сложение там, где часть пассажиров вышла из автобуса.
        fix: Из {{a}} вычтите {{b}} и проверьте результат сложением.
        next: Раздел T02, пример про удаление части.
  - id: R-02
    type: number
    role: refresh
    purpose: meaning
    level: 2
    outcome: LO-01
    sections: [T01]
    minutes: 3
    unit: учебников
    prompt: >
      На парте {{a|pl:учебник,учебника,учебников}}. Среди них {{b|pl:задачник,задачника,задачников}} по математике. В шкафу стоит {{c|pl:атлас,атласа,атласов}}.
      Сколько учебников на парте не являются задачниками?
    answer: 26
    errors: [E-model-one-step-part-as-extra, E-model-one-step-all-numbers]
    hints:
      - Атласы стоят в шкафу — относятся ли они к учебникам на парте?
      - Задачники — часть всех учебников, поэтому их число из целого вычитают.
      - Из {{a|pl:учебник,учебника,учебников}} вычтите {{b|pl:задачник,задачника,задачников}}; число {{c|pl:атлас,атласа,атласов}} в решении не участвует.
    solution: |
      ### Ответ
      Разность {{a}} − {{b}}.

      ### Идея
      Число задачников описывает часть учебников, а число атласов — другую величину, которая
      к вопросу об учебниках на парте не относится.

      ### Шаги
      1. Целое — {{a}}: столько учебников на парте.
      2. Часть целого — {{b|pl:задачник,задачника,задачников}}.
      3. Число {{c}} считает атласы в шкафу и в решении не участвует.
      4. Учебники, которые не задачники, находят вычитанием части из целого.

      ### Проверка
      Если к ответу прибавить {{b|pl:задачник,задачника,задачников}}, получится {{a|pl:учебник,учебника,учебников}}; число {{c|pl:атлас,атласа,атласов}} в этой проверке
      не участвует.

      ### Типичная ошибка
      E-model-one-step-part-as-extra: прибавить часть к целому второй раз и считать, что учебников
      стало {{a}} + {{b}}. Задачники уже лежат на парте и входят в {{a}}.
    variants:
      - params: {a: 38, b: 12, c: 5}
        answer: 26
        solution: |
            ### Ответ
            26 учебников

            ### Идея
            Задачники — часть всех учебников на парте, поэтому их число вычитают из целого, а число атласов к вопросу не относится.

            ### Шаги
            1. На парте 38 учебников — это целое.
            2. Среди них 12 задачников — часть целого.
            3. Число 5 атласов считает атласы в шкафу, а не учебники на парте, поэтому в решении оно не участвует.
            4. Остальные учебники: $38 - 12 = 26$.

            ### Проверка
            Обе части снова дают целое: $26 + 12 = 38$. Ответ 26 меньше 38: часть целого не может быть больше самого целого.

            ### Типичная ошибка
            E-model-one-step-part-as-extra: прибавить задачники к целому и получить 50. Но задачники уже входят в 38 учебников, это не отдельная группа.
      - params: {a: 51, b: 24, c: 7}
        answer: 27
        solution: |
            ### Ответ
            27 учебников

            ### Идея
            Задачники — часть всех учебников на парте, поэтому их число вычитают из целого, а число атласов к вопросу не относится.

            ### Шаги
            1. На парте 51 учебник — это целое.
            2. Среди них 24 задачника — часть целого.
            3. Число 7 атласов считает атласы в шкафу, а не учебники на парте, поэтому в решении оно не участвует.
            4. Остальные учебники: $51 - 24 = 27$.

            ### Проверка
            Обе части снова дают целое: $27 + 24 = 51$. Ответ 27 меньше 51: часть целого не может быть больше самого целого.

            ### Типичная ошибка
            E-model-one-step-part-as-extra: прибавить задачники к целому и получить 75. Но задачники уже входят в 51 учебников, это не отдельная группа.
      - params: {a: 44, b: 9, c: 6}
        answer: 35
        solution: |
            ### Ответ
            35 учебников

            ### Идея
            Задачники — часть всех учебников на парте, поэтому их число вычитают из целого, а число атласов к вопросу не относится.

            ### Шаги
            1. На парте 44 учебника — это целое.
            2. Среди них 9 задачников — часть целого.
            3. Число 6 атласов считает атласы в шкафу, а не учебники на парте, поэтому в решении оно не участвует.
            4. Остальные учебники: $44 - 9 = 35$.

            ### Проверка
            Обе части снова дают целое: $35 + 9 = 44$. Ответ 35 меньше 44: часть целого не может быть больше самого целого.

            ### Типичная ошибка
            E-model-one-step-part-as-extra: прибавить задачники к целому и получить 53. Но задачники уже входят в 44 учебников, это не отдельная группа.
    feedback:
      correct: Верно, задачники уже входят в {{a|pl:учебник,учебника,учебников}}, поэтому их число вычитается.
      wrong:
        what: Число учебников не совпало.
        why: Возможно, задачники прибавлены к целому или в решение взято число атласов.
        fix: Подпишите, что считает каждое число, и вычеркните атласы из решения.
        next: Раздел T01, пример про лишнее число.
      misconceptions:
        - id: E-model-one-step-part-as-extra
          when:
            expr: a + b
          message: Похоже, задачники прибавили ко всем учебникам, хотя они уже входят в их число.
        - id: E-model-one-step-all-numbers
          when:
            expr: a + b + c
          message: Похоже, сложены все числа текста, включая число атласов в шкафу.
  - id: R-03
    type: number
    role: refresh
    purpose: procedure
    level: 1
    outcome: LO-02
    sections: [T02]
    minutes: 3
    unit: открыток
    prompt: >
      У Ани {{a|pl:открытка,открытки,открыток}}, а у Вити {{b|pl:открытка,открытки,открыток}}. На сколько открыток у Ани больше, чем у Вити?
    answer: 27
    errors: [E-model-one-step-difference-as-sum]
    hints:
      - Вопрос «на сколько больше» спрашивает о разнице коллекций, а не о том, сколько их всего.
      - Разность двух количеств находят вычитанием меньшего из большего.
      - Вычтите из {{a}} число {{b}} — это и будет разница коллекций.
    solution: |
      ### Ответ
      Разность {{a}} − {{b}}.

      ### Идея
      Вопрос «на сколько больше» спрашивает, какой кусок одной коллекции лишний по сравнению
      с другой, поэтому нужна разность.

      ### Шаги
      1. Большее количество — {{a}}, столько открыток у Ани.
      2. Меньшее количество — {{b}}, столько открыток у Вити.
      3. Разность находят вычитанием меньшего из большего.

      ### Проверка
      Разность в сумме с {{b|pl:открытка,открытки,открыток}} даёт {{a|pl:открытка,открытки,открыток}}. Если бы вопрос был «сколько у них вместе»,
      числа пришлось бы складывать.

      ### Типичная ошибка
      E-model-one-step-difference-as-sum: сложить оба количества. Сумма отвечает на вопрос
      «сколько всего», а не «на сколько больше».
    variants:
