# Входная диагностика по прямому пререквизиту `num-sub-meaning` (STANDARD.md §6, правило 15).
#
# outcome записан как `num-sub-meaning/LO-NN` — пакет пререквизита ещё не опубликован, поэтому
# валидатор не сверяет номера LO. Связь с подтемами пререквизита (tree.yaml):
#   LO-01 — уменьшаемое, вычитаемое, разность;  LO-02 — удаление части группы;
#   LO-03 — нахождение неизвестного слагаемого; LO-04 — связь сложения и вычитания, проверка сложением.
#
# Правило 160 требует вести `sections` диагностики в пакет пререквизита (`num-sub-meaning/Tnn`),
# но проверка REF-SECTION принимает только ID разделов своего пакета: здесь стоят ближайшие по
# смыслу разделы текущей темы, а тему проверяет поле `outcome`. Вопрос к мейнтейнеру — в описании PR.
#
# Подсказки оставлены потому, что `schemas/dist.schema.json` требует ровно три пункта; ни одна
# не называет ответ (правило 168, `HINT-LEAK`). Вопрос к мейнтейнеру — в описании PR.
tasks:
  - id: D-01
    type: number
    role: diagnostic
    purpose: procedure
    level: 1
    outcome: num-sub-meaning/LO-02
    sections: [T02]
    minutes: 2
    unit: книг
    prompt: На полке стояло 17 книг. Вечером 8 книг унесли в читальный зал. Сколько книг осталось на полке?
    answer: 9
    hints:
      - Книги унесли с полки — количество книг после этого стало больше или меньше?
      - Когда из целого убирают часть, остаток находят вычитанием.
      - Запишите вычитание из 17 и сначала проверьте, хватает ли единиц, чтобы вычесть 8.
    solution: |
      ### Ответ
      9 книг

      ### Идея
      Из целого убрали часть, поэтому остаток находят вычитанием.

      ### Шаги
      1. Книг было 17 — это целое.
      2. Унесли 8 книг — это часть целого.
      3. Остаток: $17 - 8 = 9$.

      ### Проверка
      Остаток и унесённые книги вместе снова дают целое: $9 + 8 = 17$.

      ### Типичная ошибка
      Сложить 17 и 8 и получить 25: после того как часть книг унесли, их не могло стать больше.
    feedback:
      correct: Верно, 9 книг осталось на полке и вместе с унесёнными это снова 17.
      wrong:
        what: Остаток не совпал.
        why: Вероятно, выбрано сложение там, где из целого убрали часть.
        fix: Проверьте, что остаток вместе с унесёнными книгами даёт 17.
        next: Повторите удаление части группы в теме «Вычитание как удаление и разность».

  - id: D-02
    type: number
    role: diagnostic
    purpose: meaning
    level: 0
    outcome: num-sub-meaning/LO-01
    sections: [T02]
    minutes: 1
    prompt: Уменьшаемое равно 24, вычитаемое равно 9. Введите разность.
    answer: 15
    hints:
      - Вспомните, какое из двух названных чисел уменьшают.
      - Разность получают, когда из уменьшаемого вычитают вычитаемое.
      - Первое число 24 — уменьшаемое; вычтите из него 9.
    solution: |
      ### Ответ
      15

      ### Идея
      Разность — это результат вычитания вычитаемого из уменьшаемого.

      ### Шаги
      1. Уменьшаемое — 24, вычитаемое — 9.
      2. Разность: $24 - 9 = 15$.

      ### Проверка
      Сложим разность с вычитаемым: $15 + 9 = 24$ — вернулись к уменьшаемому.

      ### Типичная ошибка
      Перепутать уменьшаемое и вычитаемое и начать с числа 9: из меньшего числа большее не вычитают.
    feedback:
      correct: Верно, разность равна 15 — это то, что остаётся от 24 после вычитания 9.
      wrong:
        what: Разность не совпала.
        why: Скорее всего, уменьшаемое и вычитаемое поменяли местами.
        fix: Вычитайте из того числа, которое уменьшают, — из 24.
        next: Повторите названия компонентов вычитания.

  - id: D-03
    type: number
    role: diagnostic
    purpose: procedure
    level: 1
    outcome: num-sub-meaning/LO-03
    sections: [T03]
    minutes: 2
    prompt: К числу 16 прибавили неизвестное число и получили 43. Чему равно неизвестное число?
    answer: 27
    hints:
      - Известен итог и одно из двух слагаемых. Какое действие найдёт второе?
      - Неизвестное слагаемое находят вычитанием известного слагаемого из суммы.
      - Вычтите 16 из 43, сначала вычтите десятки, затем единицы.
    solution: |
      ### Ответ
      27

      ### Идея
      Сумма и одно слагаемое известны, поэтому второе слагаемое находят вычитанием.

      ### Шаги
      1. Сумма — 43, известное слагаемое — 16.
      2. Второе слагаемое: $43 - 16 = 27$.

      ### Проверка
      Сложим оба слагаемых: $16 + 27 = 43$ — получился названный в условии итог.

      ### Типичная ошибка
      Сложить 16 и 43 и получить 59: неизвестное слагаемое меньше суммы, а не больше неё.
    feedback:
      correct: Верно, 27 в сумме с 16 даёт 43.
      wrong:
        what: Второе слагаемое найдено неверно.
        why: Похоже, числа сложили, хотя искали неизвестную часть суммы.
        fix: Из итога 43 вычтите известное слагаемое 16.
        next: Повторите нахождение неизвестного слагаемого.

  - id: D-04
    type: number
    role: diagnostic
    purpose: procedure
    level: 1
    outcome: num-sub-meaning/LO-02
    sections: [T04]
    minutes: 2
    prompt: Ученик выполнил вычитание $52 - 27 = 25$ и проверяет его сложением — складывает разность и вычитаемое. Какое число у него должно получиться?
    answer: 52
    hints:
      - Проверка вычитания сложением возвращает то число, с которого начинали.
      - Сложите разность и вычитаемое, а результат сравните с уменьшаемым.
      - Разность равна 25, вычитаемое равно 27; сложите эти два числа.
    solution: |
      ### Ответ
      52

      ### Идея
      Вычитание проверяют сложением: разность плюс вычитаемое дают уменьшаемое.

      ### Шаги
      1. Разность — 25, вычитаемое — 27.
      2. Складываем: $25 + 27 = 52$.
      3. Получилось уменьшаемое 52, значит вычитание выполнено верно.

      ### Проверка
      Обратное действие возвращает исходную запись: $52 - 27 = 25$.

      ### Типичная ошибка
      Сложить уменьшаемое и вычитаемое: $52 + 27 = 79$ — это новое вычисление, а не проверка.
    feedback:
      correct: Верно, 52 — проверка вернулась к уменьшаемому.
      wrong:
        what: Число при проверке не совпало.
        why: Скорее всего, сложены не разность с вычитаемым, а другие пары чисел.
        fix: Складывайте разность 25 и вычитаемое 27 и сравнивайте с уменьшаемым.
        next: Повторите проверку вычитания сложением.
