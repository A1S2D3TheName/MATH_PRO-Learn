# Финальная цепочка (STANDARD.md §8): один сюжет про школьную теплицу, 5 шагов, 6 согласованных
# вариантов. Каждый шаг получает один и тот же набор params, поэтому общие величины совпадают;
# производные параметры (tot, rest, top, diff, after) посчитаны заранее, а не вычисляются
# в разборе арифметикой над подстановками (правило 166). Имя `e` зарезервировано парсером (§8),
# поэтому нижняя полка — параметр `n`.
# Правило 177: depends_on стоит только там, где шаг действительно берёт результат предыдущего, —
# таких шагов четыре из пяти, F-01 начинает цепочку.
# Правило 172 (`TASK-LEAK`): числа сюжета не повторяют разобранные примеры T01–T04.
# Правило 165: детекторов в цепочке нет — formula записей каталога использует имена `a`, `b`, `c`,
# а в шаге F-04 сравниваются величины `top` и `n`; привязка через `bind` не описана схемой
# tasks.final.schema.json. Ошибки названы в `errors` и разобраны в «Типичная ошибка».
title: Рассада в школьной теплице
context_id: school-greenhouse
scenario: >
  В школьной теплице {{a|pl:горшок,горшка,горшков}} с томатами и {{b|pl:горшок,горшка,горшков}} с перцем, а на отдельной полке стоит
  {{c|pl:горшок,горшка,горшков}} без рассады. Часть горшков забирают на выставку, остальные расставляют по двум
  полкам, а в конце недели в теплицу привозят новую рассаду.
tasks:
  - id: F-01
    type: number
    role: final-step
    purpose: procedure
    level: 1
    outcome: LO-01
    sections: [T01]
    minutes: 1
    unit: горшков
    depends_on: []
    prompt: >
      В школьной теплице {{a|pl:горшок,горшка,горшков}} с томатами и {{b|pl:горшок,горшка,горшков}} с перцем. На отдельной полке стоит
      {{c|pl:горшок,горшка,горшков}} без рассады. Сколько горшков с рассадой в теплице?
    answer: 23
    errors: [E-model-one-step-all-numbers]
    hints:
      - Что спрашивает задача — про горшки с рассадой или про все горшки в теплице?
      - Пустые горшки рассады не содержат, поэтому их число к ответу не ведёт.
      - Сложите {{a}} и {{b}} — число {{c}} считает пустые горшки и в решении не участвует.
    solution: |
      ### Ответ
      {{tot|pl:горшок,горшка,горшков}}

      ### Идея
      Рассада есть только в горшках с томатами и с перцем, поэтому эти две группы объединяют,
      а число пустых горшков к вопросу не относится.

      ### Шаги
      1. Горшков с томатами — {{a}}, горшков с перцем — {{b}}, обе группы входят в искомое целое.
      2. Число {{c}} называет пустые горшки, то есть считает другую величину, и в решении
         не участвует.
      3. Целое находят сложением частей: ${{a}} + {{b}} = {{tot}}$.

      ### Проверка
      Уберём одну часть из целого: ${{tot}} - {{b}} = {{a}}$ — остаются томаты. Пустые горшки
      в проверку не входят.

      ### Типичная ошибка
      E-model-one-step-all-numbers: сложить все три числа текста. Пустые горшки не добавляют
      рассаду, поэтому {{c}} в сумму не входит.
    variants:
      - params: {a: 14, b: 9, c: 5, d: 7, n: 4, g: 6, tot: 23, rest: 16, top: 12, diff: 8, after: 22}
        answer: 23
      - params: {a: 23, b: 16, c: 4, d: 12, n: 6, g: 9, tot: 39, rest: 27, top: 21, diff: 15, after: 36}
        answer: 39
      - params: {a: 31, b: 12, c: 7, d: 15, n: 5, g: 11, tot: 43, rest: 28, top: 23, diff: 18, after: 39}
        answer: 43
      - params: {a: 19, b: 25, c: 6, d: 9, n: 7, g: 8, tot: 44, rest: 35, top: 28, diff: 21, after: 43}
        answer: 44
      - params: {a: 42, b: 17, c: 3, d: 21, n: 8, g: 14, tot: 59, rest: 38, top: 30, diff: 22, after: 52}
        answer: 59
      - params: {a: 27, b: 14, c: 8, d: 16, n: 3, g: 10, tot: 41, rest: 25, top: 22, diff: 19, after: 35}
        answer: 41
    feedback:
      correct: Верно, {{tot}} — это горшки с томатами и с перцем вместе, без пустых.
      wrong:
        what: Число горшков с рассадой не совпало.
        why: Вероятно, в решение взяты пустые горшки или одна из групп пропущена.
        fix: Подпишите, что считает каждое число, и сложите только горшки с рассадой.
        next: Раздел T01, пример про лишнее число.

  - id: F-02
    type: number
    role: final-step
    purpose: procedure
    level: 2
    outcome: LO-02
    sections: [T02]
    minutes: 2
    unit: горшков
    depends_on: [F-01]
    prompt: >
      Всего в теплице {{tot|pl:горшок,горшка,горшков}} с рассадой. {{d|pl:горшок,горшка,горшков}} забрали на школьную выставку.
      Сколько горшков с рассадой осталось в теплице?
    answer: 16
    hints:
      - Горшки увозят из теплицы — количество рассады после этого уменьшается или растёт?
      - Когда часть удаляют из целого, остаток находят вычитанием.
      - Из {{tot}} вычтите {{d}} и проверьте, что результат меньше {{tot}}.
    solution: |
      ### Ответ
      {{rest|pl:горшок,горшка,горшков}}

      ### Идея
      Часть горшков увезли на выставку, значит из целого удалили часть и остаток находят вычитанием.

      ### Шаги
      1. Целое — {{tot|pl:горшок,горшка,горшков}} с рассадой, посчитанное на предыдущем шаге.
      2. Часть целого — {{d|pl:горшок,горшка,горшков}}, столько горшков забрали на выставку.
      3. Остаток: ${{tot}} - {{d}} = {{rest}}$.

      ### Проверка
      Остаток и увезённые горшки вместе дают целое: ${{rest}} + {{d}} = {{tot}}$. Найденный остаток
      меньше целого, как и должно быть после того, как часть горшков увезли.

      ### Типичная ошибка
      Прибавить {{d}} к {{tot}} — после того как часть горшков увезли, рассады не могло стать больше.
    variants:
      - params: {a: 14, b: 9, c: 5, d: 7, n: 4, g: 6, tot: 23, rest: 16, top: 12, diff: 8, after: 22}
        answer: 16
      - params: {a: 23, b: 16, c: 4, d: 12, n: 6, g: 9, tot: 39, rest: 27, top: 21, diff: 15, after: 36}
        answer: 27
      - params: {a: 31, b: 12, c: 7, d: 15, n: 5, g: 11, tot: 43, rest: 28, top: 23, diff: 18, after: 39}
        answer: 28
      - params: {a: 19, b: 25, c: 6, d: 9, n: 7, g: 8, tot: 44, rest: 35, top: 28, diff: 21, after: 43}
        answer: 35
      - params: {a: 42, b: 17, c: 3, d: 21, n: 8, g: 14, tot: 59, rest: 38, top: 30, diff: 22, after: 52}
        answer: 38
      - params: {a: 27, b: 14, c: 8, d: 16, n: 3, g: 10, tot: 41, rest: 25, top: 22, diff: 19, after: 35}
        answer: 25
    feedback:
      correct: Верно, остаток вместе с {{d|pl:горшок,горшка,горшков}}, увезёнными на выставку, снова даёт {{tot}}.
      wrong:
        what: Остаток не совпал.
        why: Скорее всего, выбрано сложение там, где часть горшков увезли из теплицы.
        fix: Из {{tot}} вычтите {{d}} и проверьте результат сложением.
        next: Раздел T02, пример про удаление части.

  - id: F-03
    type: number
    role: final-step
    purpose: method
    level: 2
    outcome: LO-03
    sections: [T03]
    minutes: 1
    unit: горшков
    depends_on: [F-02]
    prompt: >
      Оставшиеся после выставки {{rest|pl:горшок,горшка,горшков}} расставили на две полки: на нижнюю поставили
      {{n|pl:горшок,горшка,горшков}}, остальные — на верхнюю. Сколько горшков оказалось на верхней полке?
    answer: 12
    hints:
      - Какая величина здесь целое, а какая — известная часть этого целого?
      - По схеме две части составляют целое, поэтому неизвестную часть находят вычитанием.
      - Из {{rest}} вычтите {{n}} — столько горшков досталось верхней полке.
    solution: |
      ### Ответ
      {{top|pl:горшок,горшка,горшков}}

      ### Идея
      На схеме целое — все горшки после выставки, один кусок — нижняя полка, второй кусок —
      верхняя. Известны целое и одна часть, значит вторую часть находят вычитанием.

      ### Шаги
      1. Краткая запись: осталось — {{rest}}; на нижней полке — {{n}}; на верхней — ?
      2. Целое — {{rest}}, известная часть — {{n}}.
      3. Неизвестная часть: ${{rest}} - {{n}} = {{top}}$.

      ### Проверка
      Обе части вместе дают целое: ${{top}} + {{n}} = {{rest}}$. Верхняя полка длиннее нижней,
      поэтому следующий шаг сравнивает полки.

      ### Типичная ошибка
      Сложить {{rest}} и {{n}} — обе полки вместе не могут вместить больше горшков, чем осталось
      после выставки.
    variants:
      - params: {a: 14, b: 9, c: 5, d: 7, n: 4, g: 6, tot: 23, rest: 16, top: 12, diff: 8, after: 22}
        answer: 12
      - params: {a: 23, b: 16, c: 4, d: 12, n: 6, g: 9, tot: 39, rest: 27, top: 21, diff: 15, after: 36}
        answer: 21
      - params: {a: 31, b: 12, c: 7, d: 15, n: 5, g: 11, tot: 43, rest: 28, top: 23, diff: 18, after: 39}
        answer: 23
      - params: {a: 19, b: 25, c: 6, d: 9, n: 7, g: 8, tot: 44, rest: 35, top: 28, diff: 21, after: 43}
        answer: 28
      - params: {a: 42, b: 17, c: 3, d: 21, n: 8, g: 14, tot: 59, rest: 38, top: 30, diff: 22, after: 52}
        answer: 30
      - params: {a: 27, b: 14, c: 8, d: 16, n: 3, g: 10, tot: 41, rest: 25, top: 22, diff: 19, after: 35}
        answer: 22
    feedback:
      correct: Верно, верхняя и нижняя полки вместе вмещают {{rest|pl:горшок,горшка,горшков}}.
      wrong:
        what: Число горшков на верхней полке не совпало.
        why: Видимо, целое и часть перепутаны и выбрано сложение вместо вычитания.
        fix: Нарисуйте схему, где целая полоса равна {{rest}}, а известный кусок — {{n}}.
        next: Раздел T03, пример про известное целое и одну часть.

  - id: F-04
    type: number
    role: final-step
    purpose: method
    level: 3
    outcome: LO-02
    sections: [T02]
    minutes: 2
    unit: горшков
    depends_on: [F-03]
    prompt: >
      В теплице горшки стоят на двух полках: на верхней {{top|pl:горшок,горшка,горшков}}, на нижней {{n|pl:горшок,горшка,горшков}}.
      На сколько горшков на верхней полке больше, чем на нижней?
    answer: 8
    errors: [E-model-one-step-difference-as-sum]
    hints:
      - Вопрос «на сколько больше» спрашивает о разнице полок, а не о том, сколько горшков всего.
      - Разность двух количеств находят вычитанием меньшего из большего.
      - Вычтите из {{top}} число {{n}} — разница покажет, на сколько горшков на верхней полке больше.
    solution: |
      ### Ответ
      {{diff|pl:горшок,горшка,горшков}}

      ### Идея
      Вопрос «на сколько больше» спрашивает, какой кусок верхней полки лишний по сравнению
      с нижней, поэтому нужна разность, а не сумма.

      ### Шаги
      1. Большее количество — {{top|pl:горшок,горшка,горшков}}, столько горшков на верхней полке с предыдущего шага.
      2. Меньшее количество — {{n|pl:горшок,горшка,горшков}}, столько горшков на нижней полке.
      3. Разность: ${{top}} - {{n}} = {{diff}}$.

      ### Проверка
      Разность вместе с нижней полкой возвращает верхнюю: ${{diff}} + {{n}} = {{top}}$. Сумма
      полок ответила бы на вопрос, сколько горшков стоит на двух полках вместе.

      ### Типичная ошибка
      E-model-one-step-difference-as-sum: сложить {{top}} и {{n}}. Сумма отвечает на вопрос
      «сколько всего», а не «на сколько больше».
    variants:
      - params: {a: 14, b: 9, c: 5, d: 7, n: 4, g: 6, tot: 23, rest: 16, top: 12, diff: 8, after: 22}
        answer: 8
      - params: {a: 23, b: 16, c: 4, d: 12, n: 6, g: 9, tot: 39, rest: 27, top: 21, diff: 15, after: 36}
        answer: 15
      - params: {a: 31, b: 12, c: 7, d: 15, n: 5, g: 11, tot: 43, rest: 28, top: 23, diff: 18, after: 39}
