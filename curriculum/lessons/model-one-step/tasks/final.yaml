        answer: 52
      - params: {a: 27, b: 14, c: 8, d: 16, n: 3, g: 10, tot: 41, rest: 25, top: 22, diff: 19, after: 35}
        answer: 35
    feedback:
      correct: Верно, итог вырос по сравнению с прежним {{rest}}, и обратное действие его возвращает.
      wrong:
        what: Число горшков после привоза не совпало.
        why: Вероятно, выбрано вычитание там, где к остатку добавилась новая партия.
        fix: Сложите {{rest}} и {{g}} и проверьте, что ответ больше {{rest}}.
        next: Раздел T04, пример про целое после добавления.
