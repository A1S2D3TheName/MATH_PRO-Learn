      - params: {a: 19, b: 25, c: 6, d: 9, n: 7, g: 8, tot: 44, rest: 35, top: 28, diff: 21, after: 43}
        answer: 21
      - params: {a: 42, b: 17, c: 3, d: 21, n: 8, g: 14, tot: 59, rest: 38, top: 30, diff: 22, after: 52}
        answer: 22
      - params: {a: 27, b: 14, c: 8, d: 16, n: 3, g: 10, tot: 41, rest: 25, top: 22, diff: 19, after: 35}
        answer: 19
    feedback:
      correct: Верно, ровно {{diff|pl:горшок,горшка,горшков}} верхней полки лишние по сравнению с нижней.
      wrong:
        what: Разница полок найдена неверно.
        why: Возможно, полки сложили или вычли меньшее из большего не в том порядке.
        fix: Вычтите {{n}} из {{top}} и проверьте, что разность вместе с {{n}} даёт {{top}}.
        next: Раздел T02, пример про сравнение двух количеств.

  - id: F-05
    type: number
    role: final-step
    purpose: procedure
    level: 2
    outcome: LO-03
    sections: [T02, T04]
    minutes: 1
    unit: горшков
    depends_on: [F-02]
    prompt: >
      После выставки в теплице оставалось {{rest|pl:горшок,горшка,горшков}} с рассадой. В конце недели привезли ещё
      {{g|pl:горшок,горшка,горшков}}. Сколько горшков с рассадой стало в теплице? Ответ проверьте — он должен быть
      больше, чем было до привоза.
    answer: 22
    hints:
      - Рассаду привозят в теплицу — её количество после этого уменьшается или растёт?
      - Части объединяют в одно целое, поэтому известный остаток и новую партию складывают.
      - К {{rest}} прибавьте {{g}} и сравните результат с {{rest}}.
    solution: |
      ### Ответ
      {{after|pl:горшок,горшка,горшков}}

      ### Идея
      К прежнему остатку присоединяется новая партия, поэтому части объединяют сложением,
      а проверка на правдоподобие требует, чтобы стало больше, чем было.

      ### Шаги
      1. Было после выставки — {{rest|pl:горшок,горшка,горшков}} с рассадой, посчитано в шаге F-02.
      2. Привезли ещё {{g|pl:горшок,горшка,горшков}} — вторая часть нового целого.
      3. Целое: ${{rest}} + {{g}} = {{after}}$.

      ### Проверка
      Сравнение с исходным числом: новый итог больше прежнего {{rest}}, значит ответ правдоподобен.
      Второе действие: ${{after}} - {{g}} = {{rest}}$ — после удаления новой партии снова
      получается прежний остаток.

      ### Типичная ошибка
      Вычесть {{g}} из {{rest}} — после привоза новой рассады горшков стало больше, а не меньше.
    variants:
      - params: {a: 14, b: 9, c: 5, d: 7, n: 4, g: 6, tot: 23, rest: 16, top: 12, diff: 8, after: 22}
        answer: 22
      - params: {a: 23, b: 16, c: 4, d: 12, n: 6, g: 9, tot: 39, rest: 27, top: 21, diff: 15, after: 36}
        answer: 36
      - params: {a: 31, b: 12, c: 7, d: 15, n: 5, g: 11, tot: 43, rest: 28, top: 23, diff: 18, after: 39}
