# Паспорт темы (STANDARD.md §3). Поля section/stage/hours/grade/prerequisites/scope скопированы из
# tree.yaml дословно (правило 6). Остальные поля описывают содержание темы.
id: model-one-step
title: "Одношаговые текстовые задачи"
section: model
stage: 1
hours: 3
grade: "1–2"
prerequisites: [num-sub-meaning]
version: "0.1.0"
summary: >
  Тема учит разбирать одношаговую текстовую задачу: отделять условие и вопрос от лишних
  сведений, выбирать сложение или вычитание по смыслу ситуации, записывать краткую запись
  или схему и проверять ответ на правдоподобие. Числа в примерах целые, в пределах 100,
  действие одно.

search:
  synonyms:
    - одношаговые задачи
    - текстовые задачи 1 класс
    - текстовые задачи 2 класс
    - как решать задачи по математике
    - краткая запись задачи
    - схема задачи
    - условие и вопрос задачи
    - выбор действия в задаче
    - задачи на сложение и вычитание
    - как понять, что задача на вычитание
    - проверка ответа задачи
    - данные и искомое
  questions:
    - Как понять, что нужно найти в задаче?
    - Чем данные отличаются от условия?
    - Как выбрать действие в текстовой задаче?
    - Почему слово «больше» не всегда означает сложение?
    - Как составить краткую запись задачи?
    - Зачем нужна схема задачи?
    - Как проверить ответ задачи на правдоподобие?
    - Что делать, если в задаче есть лишнее число?
    - Как решить задачу, если неизвестно, сколько было сначала?
    - Сколько действий нужно, чтобы ответить на вопрос задачи?

