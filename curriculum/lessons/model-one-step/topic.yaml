outcomes:
  - id: LO-01
    short: Находит данные, вопрос и искомое
    action: находит в тексте условие, вопрос и данные, называет искомое и отбрасывает сведения, не относящиеся к вопросу
    conditions: одношаговая задача с целыми числами в пределах 100, одним лишним числом или двумя вопросами к одному условию
    criterion: верно называет данные, вопрос и искомое и не использует при решении числа, не нужные для ответа
    level: core
    sections: [T01, T04]
  - id: LO-02
    short: Выбирает сложение или вычитание
    action: определяет по действию в ситуации, что происходит с количеством, и выбирает сложение или вычитание
    conditions: задачи на объединение, удаление части, сравнение на сколько больше или меньше и неизвестное начало, числа в пределах 100
    criterion: верно называет действие и обосновывает выбор смыслом ситуации, а не словом-подсказкой
    level: core
    sections: [T02, T03]
  - id: LO-03
    short: Смешанные задачи и проверка ответа
    action: составляет краткую запись или схему смешанной задачи с лишними данными, двумя вопросами или неизвестным началом и проверяет ответ вторым действием и сравнением с целым
    conditions: одношаговые задачи тех же типов в смешанном наборе, где из трёх величин известны две, а часть чисел текста к вопросу не относится
    criterion: верно расставляет известные величины и неизвестную, получает ответ и проверяет его вторым действием и сравнением с целым
    level: deep
    sections: [T03, T04, T05]

errors:
