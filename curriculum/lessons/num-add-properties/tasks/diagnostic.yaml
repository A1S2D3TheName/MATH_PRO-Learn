tasks:
- id: D-01
  type: number
  role: diagnostic
  purpose: procedure
  level: 0
  outcome: num-add-meaning/LO-01
  sections:
  - T01
  minutes: 1
  prompt: В первой группе 6 книг, во второй группе 3 книги. Сколько книг в двух группах вместе?
  answer: 9
  hints:
  - Сложение объединяет две группы в одну.
  - Пересчитайте все книги объединённой группы по порядку.
  - Начните с числа 6 и сделайте 3 шага досчёта вправо по числовому ряду.
  solution: '### Ответ

    9


    ### Идея

    Сложение объединяет две группы, и итог пересчитывается целиком.


    ### Шаги

    1. Первая группа — 6 книг, вторая — 3 книги.

    2. Объединяем группы и досчитываем: 7, 8, 9.

    3. Всего 9 книг.


    ### Проверка

    Проверка: 9 больше каждой из групп, значит пересчёт объединения выполнен.


    ### Типичная ошибка

    E-num-add-meaning-count-on-off: первое слово досчёта идёт после старта.

    '
  feedback:
    correct: 'Верно: две группы из 6 и 3 книг объединены в одну группу из 9 книг.'
    wrong:
      what: Итог объединения двух групп книг найден неверно.
      why: При досчёте легко назвать стартовое число 6 первым шагом или не присоединить вторую группу.
      fix: Встаньте на число 6 и назовите три следующих числа подряд.
      next: Повторите раздел о сложении как объединении двух групп в пререквизите.
- id: D-02
  type: number
  role: diagnostic
  purpose: procedure
  level: 0
  outcome: num-add-meaning/LO-02
  sections:
  - T03
  minutes: 1
  prompt: Вычислите 8 + 0.
  answer: 8
  hints:
  - Второе слагаемое — ноль, то есть пустая группа.
  - Присоединение пустой группы ничего не меняет.
  - 'В записи $8 + 0$ прибавляется $0$ предметов: сравните её с $8 + 1$ и оставьте старт без сдвига.'
  solution: '### Ответ

    8


    ### Идея

    Ноль — пустая группа: присоединять нечего.


    ### Шаги

    1. К группе из 8 предметов присоединяется пустая группа.

    2. Предметов по-прежнему 8.

    3. 8 + 0 = 8.


    ### Проверка

    Проверка: если прибавить единицу вместо нуля, получилось бы 9 — значит ноль итог не меняет.


    ### Типичная ошибка

    E-num-add-meaning-zero-as-one: ноль не добавляет единичного шага.

    '
  feedback:
    correct: 'Верно: прибавление пустой группы 0 не изменило число 8.'
    wrong:
      what: Сумма с нулём вычислена неверно.
      why: Ноль иногда путают с прибавлением единицы или считают, что он обнуляет сумму.
      fix: На числовом луче шаг + 0 оставляет точку на том же делении.
      next: Повторите свойство прибавления нуля в теме про смысл сложения.
- id: D-03
  type: number
  role: diagnostic
  purpose: meaning
  level: 1
  outcome: num-add-meaning/LO-02
  sections:
  - T01
  minutes: 2
  prompt: У Ани 5 марок и ещё 6 марок. Сколько всего марок у Ани?
  answer: 11
  hints:
  - Две группы марок объединяются в одну.
  - Удобнее досчитывать от большей группы марок.
  - Возьмите группу из 6 марок за старт и отсчитайте от неё 5 следующих чисел.
  solution: '### Ответ

    11


    ### Идея

    Две группы марок объединяются, итог пересчитывается целиком.


    ### Шаги

    1. Первая группа — 5 марок, вторая — 6 марок.

    2. От шести досчитываем пять чисел: 7, 8, 9, 10, 11.

    3. Всего 11 марок.


    ### Проверка

    Проверка: 11 больше каждой из групп, значит обе группы вошли в итог.


    ### Типичная ошибка

    E-num-add-meaning-first-group: вторая группа должна быть присоединена.

    '
  feedback:
    correct: 'Верно: объединение групп из 5 и 6 марок даёт 11 марок.'
    wrong:
      what: Общее количество марок найдено неверно.
      why: При досчёте через десяток легко потерять один шаг и остановиться на 10.
      fix: Начните от 6 и назовите пять чисел подряд по одному.
      next: Повторите досчёт на числовом луче в пререквизите.
- id: D-04
  type: number
  role: diagnostic
  purpose: method
  level: 1
  outcome: num-add-meaning/LO-03
  sections:
  - T04
  minutes: 2
  prompt: Какое число нужно прибавить к 7, чтобы получилось 10?
  answer: 3
  hints:
  - Ищем, сколько шагов не хватает от первого числа до десятка.
  - Досчитайте от старта до десятка по единице на числовом луче.
  - 'Встаньте на точку 7 и посчитайте, сколько единичных шагов ведёт от 7 до 10: 8, 9, 10.'
  solution: '### Ответ

    3


    ### Идея

    Дополнение до десятка находится досчётом от семи.


    ### Шаги

    1. От семи до десяти: 8, 9, 10 — три шага.

    2. Значит, к семи нужно прибавить 3.

    3. Проверка: 7 + 3 = 10.


    ### Проверка

    Парой до десятка здесь будут 7 и 3 — она пригодится при группировке слагаемых.


    ### Типичная ошибка

    E-num-add-meaning-count-on-off: число шагов считается от старта, а не включая его.

    '
  feedback:
    correct: 'Верно: число 7 дополняется до 10 ровно тремя шагами.'
    wrong:
      what: Дополнение числа 7 до 10 найдено неверно.
      why: При подсчёте шагов от 7 до 10 иногда включают в счёт стартовую точку 7.
      fix: Считайте только шаги перехода от 7 к 8, от 8 к 9 и от 9 к 10.
      next: Повторите дополнение числа до десятка на числовом луче.
