  - id: EA-01
    type: number
    role: exam
    purpose: procedure
    level: 0
    points: 1
    outcome: LO-01
    sections:
    - T01
    minutes: 2
    prompt: Вычислите 5 + 9.
    answer: 14
    hints:
    - Сложить — значит объединить две группы предметов в одну.
    - 'По переместительному закону удобнее начать досчёт от большего слагаемого: шагов будет меньше.'
    - Переставьте слагаемые в $5 + 9$ так, чтобы начать с 9, и сделайте 5 шагов вправо.
    solution: '### Ответ

      14


      ### Идея

      Слагаемые можно переставлять: считать удобнее от большего числа.


      ### Шаги

      1. Переставляем слагаемые: $5 + 9 = 9 + 5$.

      2. От 9 досчитываем 5 чисел: 10, 11, 12, 13, 14.

      3. Последнее названное число — 14; значит $5 + 9 = 14$.


      ### Проверка

      Считаем в исходном порядке: от 5 делаем 9 шагов и приходим в 14 — итог тот же.


      ### Типичная ошибка

      E-num-add-properties-swap-shifts: первое слово досчёта — число сразу за стартом; лишний шаг дал бы 15 вместо
      14.

      '
    feedback:
      correct: 'Верно: перестановка $5 + 9 = 9 + 5$ дала верную сумму 14 за пять шагов.'
      wrong:
        what: Сумма $5 + 9$ вычислена неверно.
        why: При досчёте от 9 могло быть включено само стартовое число 9 или потерян последний шаг.
        fix: Встаньте на число 9 и назовите пять следующих чисел подряд.
        next: 'Раздел T01: перестановка слагаемых.'
  - id: EA-02
    type: number
    role: exam
    purpose: transfer
    level: 0
    points: 1
    outcome: LO-01
    sections:
    - T01
    minutes: 2
    prompt: В первой стопке 3 коробки, а во второй — 13 коробок. Сколько коробок в двух стопках вместе?
    answer: 16
    hints:
    - Две стопки коробок объединяются сложением.
    - Начинайте пересчёт со второй стопки, в которой коробок больше.
    - Поставьте первой стопку из 13 коробок и досчитайте к ней ещё 3 коробки по одной.
    solution: '### Ответ

      16


      ### Идея

      Порядок стопок не меняет общего количества коробок: удобнее досчитывать к большей стопке.


      ### Шаги

      1. Записываем сумму и переставляем слагаемые: $3 + 13 = 13 + 3$.

      2. От 13 досчитываем 3 числа: 14, 15, 16.

      3. В двух стопках 16 коробок.


      ### Проверка

      Проверка вторым порядком: $3 + 13 = 16$ — количество коробок не зависит от того, с какой стопки начать.


      ### Типичная ошибка

      E-num-add-properties-swap-shifts: не называйте стартовое число 13 первым шагом досчёта.

      '
    feedback:
      correct: 'Верно: стопки из 3 и 13 коробок дают 16 коробок в любом порядке пересчёта.'
      wrong:
        what: Общее число коробок в двух стопках найдено неверно.
        why: Возможно, при досчёте к 13 коробкам допущен сдвиг на единицу.
        fix: Начните с 13 коробок и назовите три следующих числа подряд.
        next: 'Раздел T01: две группы складываются вместе.'
  - id: EA-03
    type: number
    role: exam
    purpose: meaning
    level: 1
    points: 1
    outcome: LO-01
    sections:
    - T03
    minutes: 3
    prompt: Вычислите 8 + 0 + 5.
    answer: 13
    hints:
    - Среднее слагаемое равно нулю — это пустая группа предметов.
    - Ноль не добавляет шага на числовом луче, но счёт на нём не заканчивается.
    - В записи $8 + 0 + 5$ сложите ненулевые слагаемые 8 и 5, учитывая, что 0 сумму не меняет.
    solution: '### Ответ

      13


      ### Идея

      Пустая группа не добавляет предметов, а остальные слагаемые складываются полностью.


      ### Шаги

      1. Ноль стоит на втором месте и обозначает пустую группу: $8 + 0 = 8$.

      2. Прибавляем третье слагаемое: $8 + 5 = 13$.

      3. Итог — 13.


      ### Проверка

      Сложим сначала ненулевые числа: $(8 + 5) + 0 = 13 + 0 = 13$ — тот же итог.


      ### Типичная ошибка

      E-num-add-properties-after-zero-dropped: нельзя останавливать чтение суммы на нуле; E-num-add-properties-zero-in-middle-step:
      ноль не даёт лишнего шага 14.

      '
    feedback:
      correct: 'Верно: нулевое слагаемое не изменило сумму, а числа 8 и 5 дали 13.'
      wrong:
        what: Сумма $8 + 0 + 5$ вычислена неверно.
        why: Возможно, счёт остановлен на нуле (ответ 8) или ноль посчитан за единицу (ответ 14).
        fix: Сложите 8 и 0, получите 8, а затем прибавьте 5.
        next: 'Раздел T03: прибавление нуля.'
  - id: EA-04
    type: number
    role: exam
    purpose: procedure
    level: 1
    points: 1
    outcome: LO-02
    sections:
    - T02
    minutes: 3
    prompt: Вычислите 6 + 4 + 9, сложив первой пару до десятка.
    answer: 19
    hints:
    - В сумме трёх слагаемых найдите два числа, которые в сумме дают ровно 10.
    - По сочетательному закону сложите эту пару первой.
    - Сначала сложите пару $(6 + 4)$ до десятка, а затем прибавьте оставшееся число 9.
    solution: '### Ответ

      19


      ### Идея

      Пару, которая даёт десяток, складывают первой — к круглому числу легко прибавить оставшееся слагаемое.


      ### Шаги

      1. Находим пару до десятка: $6 + 4 = 10$.

      2. Складываем её первой: $(6 + 4) + 9 = 10 + 9$.

      3. Итог — 19.


      ### Проверка

      Считаем другим способом: $4 + 9 = 13$, затем $6 + 13 = 19$ — тот же итог.


      ### Типичная ошибка

      E-num-add-properties-regroup-loses-ten: не теряйте единицу при переходе от 10 к третьему слагаемому 9.

      '
    feedback:
      correct: 'Верно: пара $6 + 4 = 10$ сложена первой, и прибавление 9 дало 19.'
      wrong:
        what: Сумма $6 + 4 + 9$ найдена неверно.
        why: Возможно, после получения промежуточного десятка потеряна единица или забыто число 9.
        fix: Сложите $6 + 4 = 10$ и прибавьте к десятку 9.
        next: 'Раздел T02: сочетательный закон.'
  - id: EA-05
    type: number
    role: exam
    purpose: method
    level: 1
    points: 1
    outcome: LO-01
    sections:
    - T01
    minutes: 3
    prompt: Вычислите 4 + 12, выбрав для старта большее слагаемое.
    answer: 16
    hints:
    - Сравните оба слагаемых и выберите то, от которого нужно сделать меньше шагов.
    - Переставьте слагаемые так, чтобы большее число стояло первым.
    - Перепишите $4 + 12$ как $12 + 4$ и отсчитайте от точки 12 ровно 4 шага вправо.
    solution: '### Ответ

      16


      ### Идея

      Выбор большего слагаемого для старта сокращает досчёт с двенадцати шагов до четырёх.


      ### Шаги

      1. Переставляем слагаемые: $4 + 12 = 12 + 4$.

      2. От 12 досчитываем 4 числа: 13, 14, 15, 16.

      3. Получаем сумму 16.


      ### Проверка

      В исходном порядке от 4 за двенадцать шагов приходим в ту же точку 16.


      ### Типичная ошибка

      E-num-add-properties-swap-shifts: при старте от 12 первым шагом называют 13, а не 12.

      '
    feedback:
      correct: 'Верно: старт от большего слагаемого 12 сократил счёт до четырёх шагов и дал 16.'
      wrong:
        what: Сумма $4 + 12$ найдена неверно.
        why: При досчёте от 12 могло быть названо само число 12 первым шагом.
        fix: Встаньте на 12 и отсчитайте четыре следующих числа подряд.
        next: 'Раздел T01: досчёт от большего числа.'
  - id: EA-06
    type: number
    role: exam
    purpose: method
    level: 2
    points: 1
    outcome: LO-02
    sections:
    - T04
    minutes: 3
    prompt: Вычислите 18 + 2 + 7 удобным способом.
    answer: 27
    hints:
    - Просмотрите все три слагаемых и найдите пару, дающую круглое число 20.
    - Сложите эту пару первой, а затем прибавьте оставшееся однозначное число.
    - Сгруппируйте первые два числа $(18 + 2)$ до круглого числа 20 и прибавьте к нему 7.
    solution: '### Ответ

      27


      ### Идея

      Пару, которая даёт круглое число 20, складывают первой — так считают устно без лишних переходов.


      ### Шаги

      1. Находим удобную пару до двадцати: $18 + 2 = 20$.

      2. Прибавляем оставшееся слагаемое: $(18 + 2) + 7 = 20 + 7 = 27$.

      3. Итог — 27.


      ### Проверка

      Считаем в другом порядке: $2 + 7 = 9$, затем $18 + 9 = 27$ — тот же итог.


      ### Типичная ошибка

      E-num-add-properties-regroup-loses-ten: после получения 20 не теряйте единицу при прибавлении 7.

      '
    feedback:
      correct: 'Верно: круглая пара $18 + 2 = 20$ сложена первой, и вместе с 7 получилось 27.'
      wrong:
        what: Сумма $18 + 2 + 7$ найдена неверно.
        why: Возможно, не выделена пара $18 + 2 = 20$ или допущен сбой при прибавлении 7 к 20.
        fix: Сначала сложите $18 + 2 = 20$, затем прибавьте 7.
        next: 'Раздел T04: пара до круглого числа.'
  - id: EA-07
    type: number
    role: exam
    purpose: meaning
    level: 2
    points: 1
    outcome: LO-02
    sections:
    - T02
    - T04
    minutes: 3
    prompt: В записи (13 + 7) + 6 скобками выделена удобная пара слагаемых. Чему равна вся сумма трёх слагаемых?
    answer: 26
    hints:
    - Скобки показывают, какие два слагаемых складывают на первом шаге.
    - Найдите промежуточную сумму пары в скобках и не останавливайтесь на ней.
    - Вычислите круглую сумму в скобках $13 + 7$ и прибавьте к полученному числу третье слагаемое 6.
    solution: '### Ответ

      26


      ### Идея

      Скобки отмечают пару, дающую круглое число 20, после чего к ней прибавляется третье слагаемое.


      ### Шаги

      1. Вычисляем сумму пары в скобках: $13 + 7 = 20$.

      2. Прибавляем третье слагаемое за скобками: $20 + 6 = 26$.

      3. Полная сумма равна 26.


      ### Проверка

      По сочетательному закону $13 + (7 + 6) = 13 + 13 = 26$ — группировка не меняет сумму.


      ### Типичная ошибка

      E-num-add-properties-regroup-loses-ten: нельзя останавливаться на промежуточной сумме 20 или терять единицу
      при переходе к 6.

      '
    feedback:
      correct: 'Верно: пара в скобках дала 20, а вместе с третьим слагаемым 6 получилось 26.'
      wrong:
        what: Значение записи $(13 + 7) + 6$ найдено неверно.
        why: Возможно, в ответ записана только промежуточная сумма 20 или потеряна единица на втором шаге.
        fix: Сложите числа в скобках ($13 + 7 = 20$) и прибавьте к результату 6.
        next: 'Разделы T02 и T04: роль скобок и удобная пара.'
  - id: EA-08
    type: number
    role: exam
    purpose: transfer
    level: 3
    points: 1
    outcome: LO-02
    sections:
    - T02
    minutes: 4
    prompt: На трёх полках склада стоят 24 коробки. На первой полке 9 коробок, на второй — 8 коробок. Сколько коробок
      на третьей полке?
    answer: 7
    hints:
    - Общий итог трёх полок равен 24, а количества коробок на первых двух полках известны.
    - Сначала сложите коробки на первой и второй полках, чтобы узнать их промежуточную сумму.
    - Сложите $9 + 8$ на первых двух полках и посчитайте досчётом, сколько шагов не хватает до 24.
    solution: '### Ответ

      7


      ### Идея

      Число коробок на третьей полке дополняет сумму первых двух полок до общего итога 24.


      ### Шаги

      1. Складываем коробки на первых двух полках: $9 + 8 = 17$.

      2. Досчитываем от 17 до 24 по единице: 18, 19, 20, 21, 22, 23, 24 — всего 7 шагов.

      3. На третьей полке 7 коробок; проверяем: $9 + 8 + 7 = 24$.


      ### Проверка

      Проверка другим порядком: $8 + 7 = 15$, затем $9 + 15 = 24$.


      ### Типичная ошибка

      E-num-add-properties-regroup-loses-ten: дополнение ищут от суммы двух известных полок 17, а не от одной полки.

      '
    feedback:
      correct: 'Верно: первые две полки дают 17 коробок, а третья полка из 7 коробок дополняет запас до 24.'
      wrong:
        what: Число коробок на третьей полке найдено неверно.
        why: Возможно, неверно сложены 9 и 8 или при досчёте от 17 до 24 допущен сдвиг на единицу.
        fix: Найдите сумму $9 + 8 = 17$ и отсчитайте шаги от 17 до 24.
        next: 'Раздел T02: сумма трёх слагаемых.'
  - id: EA-09
    type: choice
    role: exam
    purpose: meaning
    level: 3
    points: 1
    outcome: LO-03
    sections:
    - T05
    minutes: 4
    prompt: Ученик проверил сумму 8 + 0 + 6 и записал результат. Какое равенство записано верно?
    options:
    - id: a
      text: 8 + 0 + 6 = 14
      why: 'Ноль шага не добавляет: 8 + 6 = 14, и пустая группа сумму не меняет.'
    - id: b
      text: 8 + 0 + 6 = 8
      misconception: E-num-add-properties-after-zero-dropped
      why: Счёт остановлен на нулевом слагаемом, а число 6 не присоединено.
    - id: c
      text: 8 + 6 = 15
      misconception: E-num-add-properties-swap-shifts
      why: 'При досчёте добавлен один лишний шаг: сумма стала на 1 больше.'
    - id: d
      text: 8 + 6 = 13
      misconception: E-num-add-meaning-count-on-off
      why: 'При досчёте потерян один шаг: сумма стала на 1 меньше.'
    answer: a
    hints:
    - Среднее слагаемое 0 обозначает пустую группу и не меняет сумму.
    - Сложите ненулевые слагаемые и проверьте, не остановлен ли счёт на нуле.
    - Вычислите сумму 8 + 0 + 6 через 8 + 6 и выберите запись с верным итогом.
    solution: '### Ответ

      Верно равенство 8 + 0 + 6 = 14.


      ### Идея

      Ноль среди слагаемых шага не добавляет, но и запись не заканчивает.


      ### Шаги

      1. Складываем ненулевые слагаемые: $8 + 6 = 14$.

      2. Прибавляем пустую группу: $14 + 0 = 14$.

      3. Выбираем верное равенство $8 + 0 + 6 = 14$.


      ### Проверка

      По порядку записи: $8 + 0 = 8$, затем $8 + 6 = 14$ — оба способа дают 14.


      ### Типичная ошибка

      E-num-add-properties-after-zero-dropped: после нуля третье слагаемое 6 обязательно входит в сумму.

      '
    feedback:
      correct: 'Верно: обе суммы равны 13, поэтому запись $7 + 6 = 8 + 5$ является верным равенством.'
      wrong:
        what: Выбрано неверное объяснение для записи $7 + 6 = 8 + 5$.
        why: Равенство двух сумм зависит от совпадения их итогов, а не от совпадения отдельных слагаемых.
        fix: Вычислите $7 + 6$ и $8 + 5$ отдельно и сравните результаты.
        next: 'Раздел T05: сравнение частей равенства.'
  - id: EA-10
    type: number
    role: exam
    purpose: procedure
    level: 3
    points: 1
    outcome: LO-03
    sections:
    - T05
    minutes: 4
    prompt: В записи 4 + 9 + 6 = 10 + □ нужно подобрать такое число в окошко, чтобы равенство стало верным. Введите
      это число.
    answer: 9
    hints:
    - Сначала найдите сумму трёх чисел в левой части равенства удобной группировкой.
    - Правая часть $10 + \square$ должна давать точно такую же сумму, как и левая часть.
    - Сложите в левой части пару $(4 + 6)$ до 10, прибавьте 9 и посмотрите, какое число нужно прибавить к 10 справа.
    solution: '### Ответ

      9


      ### Идея

      Чтобы равенство было верным, правая сумма должна совпасть с левой суммой.


      ### Шаги

      1. В левой части группируем пару до десятка: $(4 + 6) + 9 = 10 + 9 = 19$.

      2. В правой части записано $10 + \square$; чтобы получилось 19, к 10 нужно прибавить 9.

      3. В окошко вписываем число 9.


      ### Проверка

      Подставляем 9: $4 + 9 + 6 = 19$ и $10 + 9 = 19$ — обе части равны.


      ### Типичная ошибка

      E-num-add-properties-regroup-loses-ten: если при группировке $4 + 6 = 10$ потерять единицу или назвать всю
      сумму 19 вместо числа в окошке, равенство нарушится.

      '
    feedback:
      correct: 'Верно: пара $4 + 6$ даёт 10, поэтому в окошке записи $10 + \square$ должно стоять оставшееся слагаемое
        9.'
      wrong:
        what: Число для окошка в равенстве $4 + 9 + 6 = 10 + \square$ найдено неверно.
        why: Возможно, в ответ записана вся левая сумма 19 вместо недостающего слагаемого к 10.
        fix: Вычислите левую часть $(4 + 6) + 9 = 10 + 9$ и сравните её с правой частью $10 + \square$.
        next: 'Раздел T05: три слагаемых в левой части.'
  - id: EA-11
    type: number
    role: exam
    purpose: method
    level: 4
    points: 1
    outcome: LO-03
    sections:
    - T05
    minutes: 4
    prompt: Сравнивают две суммы — 8 + 7 и 6 + 8. На сколько нужно увеличить второе слагаемое второй суммы (число
      8), чтобы обе суммы стали равны? Введите это число.
    answer: 1
    hints:
    - Вычислите отдельно первую сумму и вторую сумму.
    - Посмотрите, сколько единичных шагов не хватает второй сумме до первой.
    - Сравните суммы $8 + 7$ и $6 + 8$ досчётом и определите, сколько единиц нужно добавить ко второму слагаемому
      8.
    solution: '### Ответ

      1


      ### Идея

      Чтобы уравнять две суммы, недостающие шаги от меньшей суммы до большей добавляют к указанному слагаемому.


      ### Шаги

      1. Первая сумма: $8 + 7 = 15$.

      2. Вторая сумма: $6 + 8 = 14$. От 14 до 15 не хватает 1 шага ($14 + 1 = 15$).

      3. Увеличиваем второе слагаемое второй суммы на 1: $8 + 1 = 9$; получаем $6 + 9 = 15$.


      ### Проверка

      Проверка: $8 + 7 = 15$ и $6 + 9 = 15$ — теперь обе суммы равны.


      ### Типичная ошибка

      E-num-add-properties-swap-shifts: сравнивают полные суммы 15 и 14, а не отдельные слагаемые по отдельности.

      '
    feedback:
