      В верном равенстве правая сумма должна совпадать с левой суммой.


      ### Шаги

      1. В левой части группируем пару до десятка: $(3 + 7) + 8 = 10 + 8 = 18$.

      2. В правой части записано $10 + \square$; чтобы получилось 18, к 10 нужно прибавить 8.

      3. В окошко вписываем число 8.


      ### Проверка

      Подставляем 8: $3 + 8 + 7 = 18$ и $10 + 8 = 18$ — обе части равны.


      ### Типичная ошибка

      E-num-add-properties-regroup-loses-ten: не путайте полную сумму 18 с числом 8, которое нужно прибавить к десятку
      в правой части.

      '
    feedback:
      correct: 'Верно: пара $3 + 7$ даёт 10, поэтому в окошке записи $10 + \square$ должно стоять оставшееся слагаемое
        8.'
      wrong:
        what: Число для окошка в равенстве $3 + 8 + 7 = 10 + \square$ найдено неверно.
        why: Возможно, введена вся сумма 18 вместо второго слагаемого правой части или потеряна единица при счёте.
        fix: Сгруппируйте левую часть как $(3 + 7) + 8 = 10 + 8$ и сопоставьте её с $10 + \square$.
        next: 'Раздел T05: три слагаемых в левой части.'
