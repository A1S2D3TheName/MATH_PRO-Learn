      ### Шаги

      1. С 1-м слагаемым можно составить 3 пары: (1-е и 2-е), (1-е и 3-е), (1-е и 4-е).

      2. Со 2-м (из ещё не учтённых) — 2 пары: (2-е и 3-е), (2-е и 4-е); с 3-м — 1 пару: (3-е и 4-е).

      3. Складываем число пар: $3 + 2 + 1 = 6$.


