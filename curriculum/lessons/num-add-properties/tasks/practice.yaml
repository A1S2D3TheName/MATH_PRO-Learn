tasks:
- id: P-01
  type: number
  role: warmup
  purpose: procedure
  level: 0
  outcome: LO-01
  sections:
  - T01
  minutes: 1
  prompt: Сложите {{a}} и {{b}}, начав счёт с большего слагаемого.
  answer: 11
  variants:
  - params:
      a: 4
      b: 7
    answer: 11
    solution: '### Ответ

      11


      ### Идея

      Считать удобнее от большего слагаемого: тогда шагов досчёта меньше.


      ### Шаги

      1. Переставляем слагаемые: 4 + 7 = 7 + 4.

      2. От 7 досчитываем 4 числа: 8, 9, 10, 11.

      3. Последнее названное число — 11; значит 4 + 7 = 11.


      ### Проверка

      Второй порядок слагаемых даёт то же число: 7 + 4 = 11. От перестановки слагаемых сумма не меняется.


      ### Типичная ошибка

      E-num-add-properties-swap-shifts: первое слово досчёта — число сразу за стартом, а не сам старт; лишний шаг
      дал бы 12 вместо 11.

      '
  - params:
      a: 6
      b: 8
    answer: 14
    solution: '### Ответ

      14


      ### Идея

      Считать удобнее от большего слагаемого: тогда шагов досчёта меньше.


      ### Шаги

      1. Переставляем слагаемые: 6 + 8 = 8 + 6.

      2. От 8 досчитываем 6 чисел: 9, 10, 11, 12, 13, 14.

      3. Последнее названное число — 14; значит 6 + 8 = 14.


      ### Проверка

      Второй порядок слагаемых даёт то же число: 8 + 6 = 14. От перестановки слагаемых сумма не меняется.


      ### Типичная ошибка

      E-num-add-properties-swap-shifts: первое слово досчёта — число сразу за стартом, а не сам старт; лишний шаг
      дал бы 15 вместо 14.

      '
  hints:
  - Сложить — значит объединить две группы; удобнее досчитывать к большему слагаемому.
  - 'Переставьте слагаемые так, чтобы начинать с большего числа: тогда шагов досчёта меньше.'
  - Переставьте числа в сумме ${{a}} + {{b}}$ как ${{b}} + {{a}}$ и отсчитайте от ${{b}}$ вправо ${{a|pl:число,числа,чисел}}.
  solution: '### Ответ

    Сумма чисел {{a}} и {{b}}.


    ### Идея

    Слагаемые переставляем так, чтобы досчитывать от большего.


    ### Шаги

    1. Ставим большим слагаемым {{a}} или {{b}} — то, что больше.

    2. Досчитываем к нему меньшее слагаемое по одному.

    3. Называем последнее число — это и есть сумма.


    ### Проверка

    Второй порядок слагаемых даёт тот же итог.


    ### Типичная ошибка

    E-num-add-properties-swap-shifts: первое слово досчёта идёт после старта.

    '
  feedback:
    correct: 'Верно: перестановка слагаемых позволила начать счёт с большего числа.'
    wrong:
      what: Ответ не совпал с суммой.
      why: Возможно, счёт начался не с того числа или одно слагаемое не присоединено.
      fix: Пересчитайте сумму вторым порядком слагаемых и сравните итоги.
      next: 'Раздел T01: перестановка слагаемых.'
    misconceptions:
    - id: E-num-add-properties-swap-shifts
      when:
        expr: a + b + 1
      message: 'Лишний шаг при досчёте: стартовое число названо первым шагом, и ответ стал на 1 больше.'
    - id: E-num-add-meaning-count-on-off
      when:
        expr: a + b - 1
      message: 'Потерян один шаг при досчёте: ответ оказался на 1 меньше верной суммы.'
- id: P-02
  type: number
  role: warmup
  purpose: transfer
  level: 0
  outcome: LO-01
  sections:
  - T01
  minutes: 1
  prompt: На склад привезли {{a|pl:коробку,коробки,коробок}}, затем ещё {{b|pl:коробку,коробки,коробок}}. Сколько
    всего коробок привезли?
  answer: 13
  variants:
  - params:
      a: 4
      b: 9
    answer: 13
    solution: '### Ответ

      13


      ### Идея

      Считать удобнее от большего слагаемого: тогда шагов досчёта меньше.


      ### Шаги

      1. Переставляем слагаемые: $4 + 9 = 9 + 4$.

      2. От 9 досчитываем 4 числа: 10, 11, 12, 13.

      3. Последнее названное число — 13; значит $4 + 9 = 13$.


      ### Проверка

      Второй порядок слагаемых даёт то же число: $4 + 9 = 13$. От перестановки слагаемых сумма не меняется.


      ### Типичная ошибка

      E-num-add-properties-swap-shifts: первое слово досчёта — число сразу за стартом, а не сам старт; лишний шаг
      дал бы 14 вместо 13.

      '
  - params:
      a: 7
      b: 8
    answer: 15
    solution: '### Ответ

      15


      ### Идея

      Считать удобнее от большего слагаемого: тогда шагов досчёта меньше.


      ### Шаги

      1. Переставляем слагаемые: 7 + 8 = 8 + 7.

      2. От 8 досчитываем 7 чисел: 9, 10, 11, 12, 13, 14, 15.

      3. Последнее названное число — 15; значит 7 + 8 = 15.


      ### Проверка

      Второй порядок слагаемых даёт то же число: 8 + 7 = 15. От перестановки слагаемых сумма не меняется.


      ### Типичная ошибка

      E-num-add-properties-swap-shifts: первое слово досчёта — число сразу за стартом, а не сам старт; лишний шаг
      дал бы 16 вместо 15.

      '
  hints:
  - Две партии коробок объединяются в одну общую партию сложением.
  - Начните пересчёт со второй партии, в которой коробок больше.
  - Возьмите большую партию из {{b|pl:коробки,коробок,коробок}} за старт и досчитайте к ней {{a|pl:коробку,коробки,коробок}}
    первой партии.
  solution: '### Ответ

    Итог сложения партий {{a}} и {{b}}.


    ### Идея

    Две партии объединяются в одну; порядок пересчёта на итог не влияет.


    ### Шаги

    1. Считаем партии вместе: {{a}} + {{b}}.

    2. Досчитываем второе слагаемое к большему.

    3. Называем итог и проверяем его вторым порядком.


    ### Проверка

    Оба порядка слагаемых дают одно и то же число коробок.


    ### Типичная ошибка

    E-num-add-properties-swap-shifts: не считайте старт первым шагом досчёта.

    '
  feedback:
    correct: 'Верно: обе партии учтены, итог не зависит от порядка счёта.'
    wrong:
      what: Количество коробок не совпало.
      why: Возможно, посчитана только одна партия или добавлен лишний шаг.
      fix: Сложите партии ещё раз, начав со второй, и сравните итоги.
      next: Пример 1 раздела T01.
    misconceptions:
    - id: E-num-add-properties-swap-shifts
      when:
        expr: a + b + 1
      message: 'Лишний шаг при досчёте: стартовое число названо первым шагом, и ответ стал на 1 больше.'
    - id: E-num-add-meaning-count-on-off
      when:
        expr: a + b - 1
      message: 'Потерян один шаг при досчёте: ответ оказался на 1 меньше верной суммы.'
- id: P-03
  type: number
  role: warmup
  purpose: procedure
  level: 0
  outcome: LO-02
  sections:
  - T02
  minutes: 1
  prompt: Вычислите {{a}} + {{b}} + {{c}}, сложив первой пару до десятка.
  answer: 15
  variants:
  - params:
      a: 3
      b: 7
      c: 5
    answer: 15
    solution: '### Ответ

      15


      ### Идея

      Пара, дающая десяток, считается первой: к круглому числу прибавлять легче.


      ### Шаги

      1. Ищем пару до десятка: 3 + 7 = 10.

      2. Складываем эту пару первой: (3 + 7) + 5 = 10 + 5.

      3. Итог — 15.


      ### Проверка

      Проверим в записанном порядке: 3 + 7 = 10, затем 10 + 5 = 15. Группировка изменила порядок счёта, но не сумму.


      ### Типичная ошибка

      E-num-add-properties-regroup-loses-ten: после верной промежуточной суммы одно слагаемое ещё не учтено; осторожный
      счёт даёт 15.

      '
  - params:
      a: 2
      b: 8
      c: 6
    answer: 16
    solution: '### Ответ

      16


      ### Идея

      Пара, дающая десяток, считается первой: к круглому числу прибавлять легче.


      ### Шаги

      1. Ищем пару до десятка: 2 + 8 = 10.

      2. Складываем эту пару первой: (2 + 8) + 6 = 10 + 6.

      3. Итог — 16.


      ### Проверка

      Проверим в записанном порядке: 2 + 8 = 10, затем 10 + 6 = 16. Группировка изменила порядок счёта, но не сумму.


      ### Типичная ошибка

      E-num-add-properties-regroup-loses-ten: после верной промежуточной суммы одно слагаемое ещё не учтено; осторожный
      счёт даёт 16.

      '
  hints:
  - Первые два числа в этой записи дополняют друг друга до десятка.
  - По сочетательному закону сложите эту пару первой.
  - Сложите сначала пару ({{a}} + {{b}}) до 10, а затем прибавьте к десятку число {{c}}.
  solution: '### Ответ

    Сумма трёх слагаемых {{a}}, {{b}} и {{c}}.


    ### Идея

    Пару, дающую десяток, складывают первой, затем прибавляют третье слагаемое.


    ### Шаги

    1. Находим пару слагаемых, дающую десяток.

    2. Складываем пару и называем промежуточную сумму.

    3. Прибавляем к ней оставшееся слагаемое.


    ### Проверка

    Счёт в записанном порядке даёт тот же итог.


    ### Типичная ошибка

    E-num-add-properties-regroup-loses-ten: следите за промежуточной суммой.

    '
  feedback:
    correct: 'Верно: первые два слагаемых дали десяток, и к нему прибавлено третье число.'
    wrong:
      what: Промежуточная сумма или итог не совпали.
      why: Возможно, при переходе к третьему слагаемому потерян или добавлен один шаг.
      fix: Назовите промежуточную сумму вслух и прибавьте к ней третье слагаемое.
      next: 'Раздел T02: сочетательный закон.'
    misconceptions:
    - id: E-num-add-properties-regroup-loses-ten
      when:
        expr: a + b + c - 1
      message: Промежуточная круглая сумма найдена верно, но на переходе к третьему слагаемому потеряна 1.
- id: P-04
  type: choice
  role: supported
  purpose: method
  level: 1
  outcome: LO-01
  sections:
  - T01
  minutes: 1
  prompt: Ученик проверил сумму 7 + 0 + 5 и записал ответ. Какая запись верна?
  options:
  - id: o1
    text: 7 + 0 + 5 = 12
    why: 'Ноль шага не добавляет: 7 + 5 = 12, и пустая группа итог не меняет.'
  - id: o2
    text: 7 + 0 + 5 = 7
    misconception: E-num-add-properties-after-zero-dropped
    why: Счёт остановлен на нуле, а последнее слагаемое не присоединено.
  - id: o3
    text: 7 + 5 = 13
    misconception: E-num-add-properties-swap-shifts
    why: 'При досчёте назван лишний шаг: сумма стала на единицу больше.'
  - id: o4
    text: 7 + 5 = 11
    misconception: E-num-add-meaning-count-on-off
    why: 'Один шаг потерян: первое слово досчёта пропущено.'
  answer: o1
  hints:
  - 'Ноль — пустая группа: он не добавляет предметов.'
  - Сложите ненулевые слагаемые и убедитесь, что пустая группа итог не изменила.
  - 'Проверьте запись 7 + 0 + 5 прикидкой: сумма ненулевых слагаемых 7 и 5 больше каждого из них.'
  solution: '### Ответ

    Верна запись 7 + 0 + 5 = 12.


    ### Идея

    Ноль среди слагаемых шага не добавляет, но и запись не заканчивает.


    ### Шаги

    1. Складываем ненулевые слагаемые: 7 + 5 = 12.

    2. Прибавляем пустую группу: 12 + 0 = 12.

    3. Сверяем записи: верный итог — 12.


    ### Проверка

    Счёт в записанном порядке: 7 + 0 = 7, затем 7 + 5 = 12 — тот же итог.


    ### Типичная ошибка

    E-num-add-properties-after-zero-dropped: после нуля остальные слагаемые тоже складываются.

    '
  feedback:
    correct: 'Верно: ноль не изменил сумму, все слагаемые учтены.'
    wrong:
      what: Выбрана неверная запись.
      why: Возможно, счёт остановлен на нуле или при досчёте пропущен шаг.
      fix: Сложите ненулевые слагаемые, затем прибавьте ноль и сравните с записями.
      next: 'Раздел T03: прибавление нуля.'
- id: P-05
  type: number
  role: supported
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T03
  minutes: 2
  prompt: Вычислите {{a}} + {{b}}, если одна из партий коробок оказалась пустой.
  answer: 6
  variants:
  - params:
      a: 6
      b: 0
    answer: 6
    solution: '### Ответ

      6


      ### Идея

      Ноль — пустая группа, поэтому сумма равна ненулевому слагаемому.


      ### Шаги

      1. Одно из слагаемых — ноль: 6 + 0.

      2. Ноль шага не добавляет: пустая группа ничего не присоединяет.

      3. Значит, 6 + 0 = 6.


      ### Проверка

      Второй порядок слагаемых даёт то же число: 0 + 6 = 6.


      ### Типичная ошибка

      E-num-add-meaning-zero-as-one: ноль не равен единице: лишний единичный шаг дал бы 7, а верный итог — 6.

      '
  - params:
      a: 9
      b: 0
    answer: 9
    solution: '### Ответ

      9


      ### Идея

      Ноль — пустая группа, поэтому сумма равна ненулевому слагаемому.


      ### Шаги

      1. Одно из слагаемых — ноль: $9 + 0$.

      2. Ноль шага не добавляет: пустая группа ничего не присоединяет.

      3. Значит, $9 + 0 = 9$.


      ### Проверка

      Второй порядок слагаемых даёт то же число: $0 + 9 = 9$.


      ### Типичная ошибка

      E-num-add-meaning-zero-as-one: ноль не равен единице: лишний единичный шаг дал бы 10, а верный итог — 9.

      '
  hints:
  - Пустая партия коробок записывается числом 0.
  - Присоединение пустой партии не меняет количества коробок.
  - В сумме {{a}} + {{b}} найдите ненулевую партию и учтите, что 0 коробок шага не добавляет.
  solution: '### Ответ

    Сумма равна ненулевому слагаемому {{a}}.


    ### Идея

    Пустая партия не добавляет коробок: прибавление нуля число не меняет.


    ### Шаги

    1. Определяем, какая партия пустая.

    2. Ноль шага не добавляет — коробок не прибавилось.

    3. Итог равен числу коробок в ненулевой партии.


    ### Проверка

    Второй порядок слагаемых даёт то же число.


    ### Типичная ошибка

    E-num-add-meaning-zero-as-one: ноль — не единица, лишнего шага нет.

    '
  feedback:
    correct: 'Верно: пустая партия ничего не добавила.'
    wrong:
      what: Итог не совпал с числом коробок в ненулевой партии.
      why: Возможно, ноль принят за единицу и добавлен лишний шаг.
      fix: Уберите пустую партию из счёта и проверьте, изменился ли итог.
      next: Пример 1 раздела T03.
    misconceptions:
    - id: E-num-add-meaning-zero-as-one
      when:
        expr: a + 1
      message: 'Ноль не добавляет шага: лишняя единица даёт ответ на 1 больше верного.'
- id: P-06
  type: table-fill
  role: supported
  purpose: method
  level: 1
  outcome: LO-02
  sections:
  - T02
  minutes: 2
  prompt: 'Заполните пустые клетки таблицы: у каждой суммы найдите пару до десятка, назовите промежуточную сумму
    и итог.'
  table:
    columns:
    - сумма
    - удобная пара
    - промежуточная сумма
    - итог
    rows:
    - - 1 + 9 + 7
      - 1 и 9
      - null
      - null
    - - 5 + 5 + 8
      - 5 и 5
      - 10
      - null
    - - 4 + 7 + 6
      - 4 и 6
      - 10
      - null
  shape:
  - 3
  - 4
  answer:
  - r: 0
    c: 2
    value: 10
  - r: 0
    c: 3
    value: 17
  - r: 1
    c: 3
    value: 18
  - r: 2
    c: 3
    value: 17
  hints:
  - Удобная пара — та, что даёт десяток; она указана во втором столбце каждой строки.
  - Промежуточная сумма — это результат сложения выбранной пары до 10.
  - В каждой из 3 строк запишите промежуточную сумму 10, а затем прибавьте оставшееся слагаемое (7, 8 или 7).
  solution: '### Ответ

    Промежуточные суммы 10, 10 и 10; итоги 17, 18 и 17.


    ### Идея

    В каждой строке первой складывается пара до десятка, затем прибавляется третье слагаемое.


    ### Шаги

    1. $1 + 9 = 10$, затем $10 + 7 = 17$.

    2. $5 + 5 = 10$, затем $10 + 8 = 18$.

    3. $4 + 6 = 10$, затем $10 + 7 = 17$.


    ### Проверка

    Во всех строках итог больше промежуточной суммы 10 на третье слагаемое.


    ### Типичная ошибка

    E-num-add-properties-regroup-loses-ten: промежуточную сумму считают верно, а на переходе теряют единицу.

    '
  feedback:
    correct: 'Верно: пары сложены, промежуточные суммы и итоги совпали.'
    wrong:
      what: Одна из клеток заполнена неверно.
      why: Возможно, в клетке оказался итог вместо промежуточной суммы или потерян шаг перехода.
      fix: 'Пересчитайте строку по шагам: пара, промежуточная сумма, третье слагаемое.'
      next: Пример 1 раздела T02.
- id: P-07
  type: number
  role: supported
  purpose: procedure
  level: 1
  outcome: LO-02
  sections:
  - T02
  minutes: 2
  prompt: 'Найдите удобным способом сумму: {{a}} + {{b}} + {{c}}.'
  answer: 15
  variants:
  - params:
      a: 8
      b: 5
      c: 2
    answer: 15
    solution: '### Ответ

      15


      ### Идея

      Пара, дающая десяток, считается первой: к круглому числу прибавлять легче.


      ### Шаги

      1. Ищем пару до десятка: 8 + 2 = 10.

      2. Складываем эту пару первой: (8 + 2) + 5 = 10 + 5.

      3. Итог — 15.


      ### Проверка

      Проверим в записанном порядке: 8 + 5 = 13, затем 13 + 2 = 15. Группировка изменила порядок счёта, но не сумму.


      ### Типичная ошибка

      E-num-add-properties-regroup-loses-ten: после верной промежуточной суммы одно слагаемое ещё не учтено; осторожный
      счёт даёт 15.

      '
