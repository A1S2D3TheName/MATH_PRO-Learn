tasks:
- id: R-01
  type: number
  role: refresh
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T01
  minutes: 2
  prompt: Найдите сумму чисел {{a}} и {{b}}.
  answer: 12
  variants:
  - params:
      a: 4
      b: 8
    answer: 12
    solution: '### Ответ

      12


      ### Идея

      Считать удобнее от большего слагаемого: тогда шагов досчёта меньше.


      ### Шаги

      1. Переставляем слагаемые: $4 + 8 = 8 + 4$.

      2. От 8 досчитываем 4 числа: 9, 10, 11, 12.

      3. Последнее названное число — 12; значит $4 + 8 = 12$.


      ### Проверка

      Второй порядок слагаемых даёт то же число: $8 + 4 = 12$. От перестановки слагаемых сумма не меняется.


      ### Типичная ошибка

      E-num-add-properties-swap-shifts: первое слово досчёта — число сразу за стартом, а не сам старт; лишний шаг
      дал бы 13 вместо 12.

      '
  - params:
      a: 5
      b: 6
    answer: 11
    solution: '### Ответ

      11


      ### Идея

      Считать удобнее от большего слагаемого: тогда шагов досчёта меньше.


      ### Шаги

      1. Переставляем слагаемые: $5 + 6 = 6 + 5$.

      2. От 6 досчитываем 5 чисел: 7, 8, 9, 10, 11.

      3. Последнее названное число — 11; значит $5 + 6 = 11$.


      ### Проверка

      Второй порядок слагаемых даёт то же число: $6 + 5 = 11$. От перестановки слагаемых сумма не меняется.


      ### Типичная ошибка

      E-num-add-properties-swap-shifts: первое слово досчёта — число сразу за стартом, а не сам старт; лишний шаг
      дал бы 12 вместо 11.

      '
  - params:
      a: 6
      b: 7
    answer: 13
    solution: '### Ответ

      13


      ### Идея

      Считать удобнее от большего слагаемого: тогда шагов досчёта меньше.


      ### Шаги

      1. Переставляем слагаемые: $6 + 7 = 7 + 6$.

      2. От 7 досчитываем 6 чисел: 8, 9, 10, 11, 12, 13.

      3. Последнее названное число — 13; значит $6 + 7 = 13$.


      ### Проверка

      Второй порядок слагаемых даёт то же число: $7 + 6 = 13$. От перестановки слагаемых сумма не меняется.


      ### Типичная ошибка

      E-num-add-properties-swap-shifts: первое слово досчёта — число сразу за стартом, а не сам старт; лишний шаг
      дал бы 14 вместо 13.

      '
  hints:
  - Вспомните переместительный закон сложения для двух слагаемых.
  - Поставьте большее слагаемое на первое место, чтобы сократить досчёт.
  - Переставьте числа в записи ${{b}} + {{a}}$ и отсчитайте от ${{b}}$ ровно {{a|pl:шаг,шага,шагов}} вправо.
  solution: '### Ответ

    Сумма чисел {{a}} и {{b}}.


    ### Идея

    Слагаемые переставляем и досчитываем от большего.


    ### Шаги

    1. Переставляем слагаемые: ${{a}} + {{b}} = {{b}} + {{a}}$.

    2. Досчитываем от ${{b}}$ ровно ${{a}}$ единичных шагов.

    3. Получаем сумму найденному числу.


    ### Проверка

    Второй порядок слагаемых даёт тот же итог найденному числу.


    ### Типичная ошибка

    E-num-add-properties-swap-shifts: первое слово досчёта — после старта.

    '
  feedback:
    correct: 'Верно: перестановка слагаемых позволила быстро досчитать от большего числа.'
    wrong:
      what: Ответ не совпал с суммой двух слагаемых.
      why: Возможно, счёт начался с самого стартового числа или одно слагаемое потеряно.
      fix: Пересчитайте сумму вторым порядком слагаемых и сравните итоги.
      next: Раздел T01.
    misconceptions:
    - id: E-num-add-properties-swap-shifts
      when:
        expr: a + b + 1
      message: 'Лишний шаг при досчёте: стартовое число включено в счёт шагов.'
    - id: E-num-add-meaning-count-on-off
      when:
        expr: a + b - 1
      message: Потерян один шаг при досчёте от большего слагаемого.
- id: R-02
  type: number
  role: refresh
  purpose: procedure
  level: 1
  outcome: LO-02
  sections:
  - T02
  minutes: 3
  prompt: 'Сложите три слагаемых: {{a}} + {{b}} + {{c}}.'
  answer: 16
  variants:
  - params:
      a: 7
      b: 3
      c: 6
    answer: 16
    solution: '### Ответ

      16


      ### Идея

      Пара, дающая десяток, считается первой: к круглому числу прибавлять легче.


      ### Шаги

      1. Ищем пару до десятка: $7 + 3 = 10$.

      2. Складываем эту пару первой: $(7 + 3) + 6 = 10 + 6$.

      3. Итог — 16.


      ### Проверка

      Проверим в записанном порядке: $7 + 3 = 10$, затем $10 + 6 = 16$. Группировка изменила порядок счёта, но не
      сумму.


      ### Типичная ошибка

      E-num-add-properties-regroup-loses-ten: после верной промежуточной суммы одно слагаемое ещё не учтено; осторожный
      счёт даёт 16.

      '
  - params:
      a: 2
      b: 8
      c: 9
    answer: 19
    solution: '### Ответ

      19


      ### Идея

      Пара, дающая десяток, считается первой: к круглому числу прибавлять легче.


      ### Шаги

      1. Ищем пару до десятка: $2 + 8 = 10$.

      2. Складываем эту пару первой: $(2 + 8) + 9 = 10 + 9$.

      3. Итог — 19.


      ### Проверка

      Проверим в записанном порядке: $2 + 8 = 10$, затем $10 + 9 = 19$. Группировка изменила порядок счёта, но не
      сумму.


      ### Типичная ошибка

      E-num-add-properties-regroup-loses-ten: после верной промежуточной суммы одно слагаемое ещё не учтено; осторожный
      счёт даёт 19.

      '
  - params:
      a: 5
      b: 5
      c: 7
    answer: 17
    solution: '### Ответ

      17


      ### Идея

      Пара, дающая десяток, считается первой: к круглому числу прибавлять легче.


      ### Шаги

      1. Ищем пару до десятка: $5 + 5 = 10$.

      2. Складываем эту пару первой: $(5 + 5) + 7 = 10 + 7$.

      3. Итог — 17.


      ### Проверка

      Проверим в записанном порядке: $5 + 5 = 10$, затем $10 + 7 = 17$. Группировка изменила порядок счёта, но не
      сумму.


      ### Типичная ошибка

      E-num-add-properties-regroup-loses-ten: после верной промежуточной суммы одно слагаемое ещё не учтено; осторожный
      счёт даёт 17.

      '
  hints:
  - Посмотрите на первые два числа в сумме трёх слагаемых.
  - Соедините первые два слагаемых скобками, так как они образуют десяток.
  - Сложите сначала пару $({{a}} + {{b}})$, а к полученному десятку прибавьте третье слагаемое ${{c}}$.
  solution: '### Ответ

    Сумма трёх слагаемых {{a}}, {{b}} и {{c}}.


    ### Идея

    Пара до десятка складывается первой.


    ### Шаги

    1. Находим пару до десятка: ${{a}} + {{b}} = 10$.

    2. Складываем её первой: $({{a}} + {{b}}) + {{c}} = 10 + {{c}}$.

    3. Прибавляем третье слагаемое и получаем найденному числу.


    ### Проверка

    Счёт в другом порядке даёт тот же итог найденному числу.


    ### Типичная ошибка

    E-num-add-properties-regroup-loses-ten: проверяйте переход к третьему слагаемому.

    '
  feedback:
    correct: 'Верно: первые два слагаемых собраны в десяток и к ним прибавлено третье.'
    wrong:
      what: Сумма трёх слагаемых найдена неверно.
      why: Возможно, при переходе от промежуточного десятка к третьему слагаемому потеряна единица.
      fix: Назовите промежуточную сумму 10 вслух и прибавьте к ней третье число.
      next: Пример 1 раздела T02.
    misconceptions:
    - id: E-num-add-properties-regroup-loses-ten
      when:
        expr: a + b + c - 1
      message: После получения промежуточного десятка потеряна 1 при прибавлении третьего слагаемого.
- id: R-03
  type: number
  role: refresh
  purpose: meaning
  level: 1
  outcome: LO-01
  sections:
  - T03
  minutes: 3
  prompt: В сумме {{a}} + {{b}} одно слагаемое равно нулю. Найдите сумму.
  answer: 7
  variants:
  - params:
      a: 7
      b: 0
    answer: 7
    solution: '### Ответ

      7


      ### Идея

      Ноль — пустая группа, поэтому сумма равна ненулевому слагаемому.


      ### Шаги

      1. Одно из слагаемых — ноль: $7 + 0$.

      2. Ноль шага не добавляет: пустая группа ничего не присоединяет.

      3. Значит, $7 + 0 = 7$.


      ### Проверка

      Второй порядок слагаемых даёт то же число: $0 + 7 = 7$.


      ### Типичная ошибка

      E-num-add-meaning-zero-as-one: ноль не равен единице: лишний единичный шаг дал бы 8, а верный итог — 7.

      '
  - params:
      a: 11
      b: 0
    answer: 11
    solution: '### Ответ

      11


      ### Идея

      Ноль — пустая группа, поэтому сумма равна ненулевому слагаемому.


      ### Шаги

      1. Одно из слагаемых — ноль: $11 + 0$.

      2. Ноль шага не добавляет: пустая группа ничего не присоединяет.

      3. Значит, $11 + 0 = 11$.


      ### Проверка

      Второй порядок слагаемых даёт то же число: $0 + 11 = 11$.


      ### Типичная ошибка

      E-num-add-meaning-zero-as-one: ноль не равен единице: лишний единичный шаг дал бы 12, а верный итог — 11.

      '
  - params:
      a: 12
      b: 0
    answer: 12
    solution: '### Ответ

      12


      ### Идея

      Ноль — пустая группа, поэтому сумма равна ненулевому слагаемому.


      ### Шаги

      1. Одно из слагаемых — ноль: $12 + 0$.

      2. Ноль шага не добавляет: пустая группа ничего не присоединяет.

      3. Значит, $12 + 0 = 12$.


      ### Проверка

      Второй порядок слагаемых даёт то же число: $0 + 12 = 12$.


      ### Типичная ошибка

      E-num-add-meaning-zero-as-one: ноль не равен единице: лишний единичный шаг дал бы 13, а верный итог — 12.

      '
  hints:
  - Вспомните, какую группу предметов описывает число 0.
  - Присоединение пустой группы оставляет количество предметов прежним.
  - В записи ${{a}} + {{b}}$ найдите ненулевое слагаемое и учтите, что 0 шагов на луче не сдвигает точку.
  solution: '### Ответ

    Сумма равна ненулевому слагаемому {{a}}.


    ### Идея

    Ноль — пустая группа, она числа не меняет.


    ### Шаги

    1. Рассматриваем сумму ${{a}} + {{b}}$.

    2. Нулевое слагаемое шага на луче не добавляет.

    3. Называем итог найденному числу — он равен ненулевому слагаемому.


    ### Проверка

    Прыжок длиной 0 по лучу оставляет точку на месте найденному числу.


    ### Типичная ошибка

    E-num-add-meaning-zero-as-one: ноль не добавляет единичного шага.

    '
  feedback:
    correct: 'Верно: нулевое слагаемое при повторении оставило второе число без изменения.'
    wrong:
      what: Итог отличается от ненулевого слагаемого.
      why: Возможно, ноль принят за единицу или за обнуление суммы.
      fix: 'Сравните сложение с нулём и с единицей: ноль не делает шага вправо.'
      next: Раздел T03.
    misconceptions:
    - id: E-num-add-meaning-zero-as-one
      when:
        expr: a + 1
      message: 'Ноль принят за единичный шаг: ответ оказался на 1 больше ненулевого слагаемого.'
- id: R-04
  type: number
  role: refresh
  purpose: method
  level: 2
  outcome: LO-02
  sections:
  - T04
  minutes: 3
  prompt: Вычислите {{a}} + {{b}} + {{c}}, найдя пару до круглого числа.
  answer: 26
  variants:
  - params:
      a: 11
      b: 9
      c: 6
    answer: 26
    solution: '### Ответ

      26


      ### Идея

      Три слагаемых складываем парами: сначала выбираем пару, дающую круглое число 20.


      ### Шаги

      1. Складываем первыми 11 и 9: $11 + 9 = 20$.

      2. К промежуточной сумме прибавляем оставшееся слагаемое: $20 + 6 = 26$.

      3. Итог — 26.


      ### Проверка

      Считаем в другом порядке: $9 + 6 = 15$, затем $11 + 15 = 26$. Порядок и группировка сумму не меняют.


      ### Типичная ошибка

      E-num-add-properties-regroup-loses-ten: следите за промежуточной суммой — верный итог равен 26.

      '
  - params:
      a: 13
      b: 7
      c: 8
    answer: 28
    solution: '### Ответ

      28


      ### Идея

      Три слагаемых складываем парами: сначала выбираем пару, дающую круглое число 20.


      ### Шаги

      1. Складываем первыми 13 и 7: $13 + 7 = 20$.

      2. К промежуточной сумме прибавляем оставшееся слагаемое: $20 + 8 = 28$.

      3. Итог — 28.


      ### Проверка

      Считаем в другом порядке: $7 + 8 = 15$, затем $13 + 15 = 28$. Порядок и группировка сумму не меняют.


      ### Типичная ошибка

      E-num-add-properties-regroup-loses-ten: следите за промежуточной суммой — верный итог равен 28.

      '
  - params:
      a: 16
      b: 4
      c: 9
    answer: 29
    solution: '### Ответ

      29


      ### Идея

      Три слагаемых складываем парами: сначала выбираем пару, дающую круглое число 20.


      ### Шаги

      1. Складываем первыми 16 и 4: $16 + 4 = 20$.

      2. К промежуточной сумме прибавляем оставшееся слагаемое: $20 + 9 = 29$.

      3. Итог — 29.


      ### Проверка

      Считаем в другом порядке: $4 + 9 = 13$, затем $16 + 13 = 29$. Порядок и группировка сумму не меняют.


      ### Типичная ошибка

      E-num-add-properties-regroup-loses-ten: следите за промежуточной суммой — верный итог равен 29.

      '
  hints:
  - Найдите среди трёх чисел два слагаемых, которые дополняют друг друга до 20.
  - Сложите эту удобную пару первой и зафиксируйте круглое число.
  - Сначала вычислите круглое число $({{a}} + {{b}})$, а затем прибавьте к нему ${{c}}$.
  solution: '### Ответ

    Сумма трёх слагаемых {{a}}, {{b}} и {{c}}.


    ### Идея

    Пара до круглого числа 20 складывается первой.


    ### Шаги

    1. Складываем пару с круглой суммой: ${{a}} + {{b}} = 20$.

    2. Прибавляем к промежуточной сумме третье слагаемое: $20 + {{c}}$.

    3. Получаем итог найденному числу.


    ### Проверка

    Другой порядок счёта даёт тот же итог найденному числу.


    ### Типичная ошибка

    E-num-add-properties-regroup-loses-ten: проверяйте промежуточную сумму.

    '
  feedback:
    correct: 'Верно: пара до двадцати сложена первой, и к ней добавлено третье слагаемое.'
    wrong:
      what: Сумма трёх чисел с парой до двадцати найдена неверно.
      why: Возможно, выбрана неудобная пара или потерян шаг при прибавлении третьего числа к 20.
      fix: Сначала сложите первые два числа до 20, затем прибавьте третье.
      next: Пример 2 раздела T04.
    misconceptions:
    - id: E-num-add-properties-regroup-loses-ten
      when:
        expr: a + b + c - 1
      message: При переходе от круглой суммы 20 к третьему слагаемому потеряна 1.
- id: R-05
  type: number
  role: refresh
  purpose: method
  level: 2
  outcome: LO-02
  sections:
  - T02
  minutes: 2
  prompt: В записи ({{a}} + {{b}}) + {{c}} пару в скобках складывают первой. Введите промежуточную сумму.
  answer: 20
  variants:
  - params:
      a: 17
      b: 3
      c: 5
    answer: 20
    solution: '### Ответ

      20


      ### Идея

      Скобки отмечают пару, которая складывается первой.


      ### Шаги

      1. Пара в скобках: $17 + 3$.

      2. $17 + 3 = 20$.

      3. Промежуточная сумма равна 20.


      ### Проверка

      Проверка: $20 + 5 = 25$ — итог всей записи.


      ### Типичная ошибка

      E-num-add-properties-regroup-loses-ten: не путайте промежуточную сумму с итогом.

      '
  - params:
      a: 8
      b: 2
      c: 9
    answer: 10
    solution: '### Ответ

      10


      ### Идея

      Скобки отмечают пару, которая складывается первой.


      ### Шаги

      1. Пара в скобках: $8 + 2$.

      2. $8 + 2 = 10$.

      3. Промежуточная сумма равна 10.


      ### Проверка

      Проверка: $10 + 9 = 19$ — итог всей записи.


      ### Типичная ошибка

      E-num-add-properties-regroup-loses-ten: считайте только пару в скобках.

      '
  - params:
      a: 15
      b: 5
      c: 8
    answer: 20
    solution: '### Ответ

      20


      ### Идея

      Скобки отмечают пару, которая складывается первой.


      ### Шаги

      1. Пара в скобках: $15 + 5$.

      2. $15 + 5 = 20$.

      3. Промежуточная сумма равна 20.


      ### Проверка

      Проверка: $20 + 8 = 28$ — итог всей записи.


      ### Типичная ошибка

      E-num-add-properties-regroup-loses-ten: третье слагаемое в пару не входит.

      '
  hints:
  - Скобки показывают, какие два слагаемых складывают на первом шаге.
  - Третье число за скобками в промежуточную сумму не входит.
  - Вычислите только сумму внутри скобок для чисел ${{a}}$ и ${{b}}$, не прибавляя ${{c}}$.
  solution: '### Ответ

    Промежуточная сумма пары ({{a}} + {{b}}) в скобках.


    ### Идея

    Скобки отмечают пару, которая складывается первой.


    ### Шаги

    1. Выделяем пару в скобках: ${{a}} + {{b}}$.

    2. Складываем числа в скобках и получаем промежуточную сумму найденному числу.

    3. Третье слагаемое ${{c}}$ оставляем для следующего шага.


    ### Проверка

    Вместе с третьим слагаемым ${{c}}$ промежуточная сумма найденному числу даёт полный итог записи.


    ### Типичная ошибка

    E-num-add-properties-regroup-loses-ten: не подменяйте промежуточную сумму полным итогом.

    '
  feedback:
    correct: 'Верно: найдена именно промежуточная сумма пары в скобках без третьего слагаемого.'
