# Паспорт темы (STANDARD.md §3). Поля section/stage/hours/grade/prerequisites копируются из
# tree.yaml дословно (правило 6); подтемы идут в написании дерева.
id: num-add-properties
title: Законы сложения
section: num
stage: 1
hours: 2
grade: "2"
prerequisites: [num-add-meaning]
version: "1.0.0"
summary: >
  Порядок слагаемых и способ их группировки не меняют сумму. Тема даёт два закона сложения —
  переместительный и сочетательный, — правило прибавления нуля и приём удобной группировки:
  пару, дающую десяток, складывают первой.

search:
  synonyms:
    - переместительный закон сложения
    - сочетательный закон сложения
    - от перестановки слагаемых сумма не меняется
    - как переставить слагаемые
    - группировка слагаемых
    - скобки в сумме
    - удобный порядок сложения
    - сложить три числа
    - сложение трёх слагаемых
    - как сложить числа удобно
    - законы сложения 2 класс
    - прибавление нуля к сумме
  questions:
    - Почему от перестановки слагаемых сумма не меняется?
    - Как переставить слагаемые, чтобы считать было удобнее?
    - Что такое сочетательный закон сложения?
    - Как скобки влияют на сумму трёх слагаемых?
    - Зачем группировать слагаемые при устном счёте?
    - Как найти пару слагаемых, которая даёт десяток?
    - Что происходит с суммой при прибавлении нуля?
    - Как проверить, что равенство с перестановкой слагаемых верно?
    - Можно ли складывать три слагаемых в любом порядке?

subtopics:
  - id: num-add-properties/peremestitelnyy-zakon-i-perestanovka
    title: Переместительный закон и перестановка слагаемых
    tree_ref: Переместительный закон и перестановка слагаемых
    synonyms: [от перестановки слагаемых сумма не меняется, порядок слагаемых, переставить слагаемые]
    sections: [T01]
  - id: num-add-properties/sochetatelnyy-zakon-i-gruppirovka
    title: Сочетательный закон и группировка
    tree_ref: Сочетательный закон и группировка
    synonyms: [группировка слагаемых, скобки в сумме, сложить пару первой]
    sections: [T02]
  - id: num-add-properties/pribavlenie-nulya
    title: Прибавление нуля
    tree_ref: Прибавление нуля
    synonyms: [ноль в сумме, нулевое слагаемое, прибавить ноль]
    sections: [T03]
  - id: num-add-properties/udobnaya-gruppirovka-pri-ustnom
    title: Удобная группировка при устном счёте
    tree_ref: Удобная группировка при устном счёте
    synonyms: [удобный порядок счёта, пара до десятка, устный счёт с группировкой]
    sections: [T04, T05]

outcomes:
  - id: LO-01
    short: Переставляет слагаемые
    action: вычисляет сумму двух слагаемых, переставляя их так, чтобы досчитывать от большего, и называет слагаемые и сумму
    conditions: натуральные числа и нуль, каждое слагаемое не больше 10, сумма не больше 20
    criterion: верно называет сумму при обоих порядках слагаемых в 4 случаях из 5 и объясняет, почему порядок не изменил результат
    level: core
    sections: [T01, T03]
  - id: LO-02
    short: Группирует слагаемые
    action: вычисляет сумму трёх слагаемых, выбирая пару до десятка или до круглого числа, и восстанавливает пропущенную промежуточную сумму в готовой записи
    conditions: три слагаемых от 0 до 20, сумма не больше 100; порядок счёта задан словами или скобками
    criterion: верно называет промежуточную сумму и итог и объясняет, почему выбранная пара удобнее остальных
    level: standard
    sections: [T02, T04]
  - id: LO-03
    short: Проверяет законы и их границы
    action: проверяет истинность равенств с перестановкой и группировкой, находит контрпример к общему утверждению и перечисляет все способы разбить сумму на две части
    conditions: натуральные числа и нуль, суммы не больше 100, три или четыре слагаемых; проверка без полного пересчёта
    criterion: верно различает истинные и ложные равенства, приводит контрпример и перечисляет разбиения без пропусков и повторов
    level: deep
    sections: [T05]

# Правило 72: 3–12 глобальных ID. Первые четыре — собственные механизмы темы; две последние
# записи — родственные ошибки нуля из темы-пререквизита, которые тема отлавливает в трёхчленных суммах.
errors:
