# Паспорт темы (STANDARD.md §3). Поля id, title, section, stage, hours, grade и prerequisites
# скопированы из tree.yaml дословно (правило 6); поля scope у темы в дереве нет.
#
# Правило 152: прямой пререквизит frac-notation работает в теории явно — смысл знаменателя
# и числителя превращается в разметку луча (T01, T02), а «дробь как результат деления» проверяет
# натуральное число в виде дроби (T03).
# Правило 153: каждая подтема дерева входит в outcome уровня core или standard (LO-01, LO-02);
# deep-разделы T05–T06 (LO-03) только углубляют подтемы и в режиме «с нуля за час» не нужны.
id: frac-line
title: Дробь как число на числовой прямой
section: frac
stage: 1
hours: 3
grade: "4"
prerequisites: [frac-notation]
version: "1.0.0"
summary: >
  Дробь — это точка на числовом луче: знаменатель говорит, на сколько равных частей разделить
  единичный отрезок, а числитель — сколько таких частей отсчитать от нуля. Так же отмечают дроби
  больше единицы и записывают натуральные числа дробью, например $3 = \frac{3}{1} = \frac{12}{4}$.

search:
  synonyms:
    - дробь на числовой прямой
    - дробь на числовом луче
    - отметить дробь на луче
    - дробная координата
    - координата дробной точки
    - деление единичного отрезка на части
    - штрихи на числовом луче
    - дробь больше единицы на луче
    - натуральное число в виде дроби
    - дробь со знаменателем один
    - между какими числами лежит дробь
    - найти единицу по дроби на луче
    - доли на координатном луче
  questions:
    - Как отметить дробь на числовом луче?
    - Как разделить единичный отрезок на равные части?
    - Сколько штрихов нужно, чтобы разделить отрезок на пять частей?
    - Как найти координату точки, если она дробная?
    - Где на луче стоит дробь больше единицы?
    - Как понять, между какими натуральными числами лежит дробь?
    - Как записать натуральное число дробью?
    - Что означает знаменатель, равный единице?
    - Как найти единицу на луче, если отмечена только дробь?

subtopics:
  - id: frac-line/unit-parts
    title: Деление единичного отрезка на равные части
    tree_ref: Деление единичного отрезка на равные части
    synonyms: [разметка единичного отрезка, штрихи на луче, равные части отрезка, шаг шкалы]
    sections: [T01, T06]
  - id: frac-line/fraction-point
    title: Дробная точка на прямой
    tree_ref: Дробная точка на прямой
    synonyms: [дробная координата, отметить дробь на луче, координата дробной точки]
    sections: [T02, T05]
  - id: frac-line/between-naturals
    title: Дроби между соседними натуральными числами
    tree_ref: Дроби между соседними натуральными числами
    synonyms: [дробь больше единицы, соседние натуральные числа, участок луча без нуля]
    sections: [T04, T05]
  - id: frac-line/whole-as-fraction
    title: Целое как дробь со знаменателем единица
    tree_ref: Целое как дробь со знаменателем единица
    synonyms: [целое в виде дроби, знаменатель один, натуральное число дробью]
    sections: [T03]

outcomes:
  - id: LO-01
    short: Делит отрезок и читает дробную точку
    action: делит единичный отрезок на равные части, отмечает дробь от 0 до 1 и называет координату отмеченной точки
    conditions: знаменатель от 2 до 10, числитель не больше знаменателя; на луче отмечены 0 и 1 и штрихи на равных расстояниях, рисунок может продолжаться за единицу
    criterion: в 4 случаях из 5 верная координата; число штрихов внутри отрезка на один меньше числа частей
    level: core
    sections: [T01, T02]
  - id: LO-02
    short: Размещает дроби больше 1 и целые
    action: записывает натуральное число дробью, находит соседние натуральные числа для дроби и называет координату штриха на участке луча без нуля
    conditions: знаменатель от 1 до 10, числитель до 20, натуральные числа до 20
    criterion: в 4 случаях из 5 верный числитель, пара соседних чисел или координата; счёт долей после натурального числа продолжается от нуля
    level: standard
    sections: [T03, T04]
  - id: LO-03
    short: Восстанавливает единицу и шаг шкалы
    action: находит длину единичного отрезка по дробной точке и шаг деления по двум подписанным штрихам, затем отмечает нужную дробь
    conditions: известны 0 и одна дробная точка либо две подписи шкалы; длины в клетках, сантиметрах или миллиметрах до 20, знаменатели до 10
    criterion: в 3 случаях из 4 верная длина единицы, доли или координата; длина доли найдена делением на числитель
    level: deep
    sections: [T05, T06]

errors:
  - E-frac-line-marks-as-parts
  - E-frac-line-count-zero-tick
  - E-frac-line-whole-picture
  - E-frac-line-restart
  - E-frac-line-whole-as-one-part
  - E-frac-line-point-as-unit
  - E-frac-line-split-by-denominator
