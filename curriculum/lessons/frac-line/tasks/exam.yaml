    minutes: 1
    prompt: Запишите число 3 дробью со знаменателем 6. В ответ введите числитель.
    answer: 18
    hints:
    - Сколько шестых долей в одном единичном отрезке?
    - В каждом из трёх отрезков столько же шестых.
    - 'Сложите шестые доли за каждый отрезок: 6 + 6 + …'
    solution: |
      ### Ответ
      18

      ### Идея
      Каждое целое размениваем на шестые доли.

      ### Шаги
      1. В единице 6 шестых.
      2. В трёх: $6 + 6 + 6 = 18$.
      3. $3 = \dfrac{18}{6}$.

      ### Проверка
      $18 : 6 = 3$.

      ### Типичная ошибка
      Написать $\dfrac{3}{6}$ — это меньше единицы.
