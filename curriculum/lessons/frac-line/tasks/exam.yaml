  - id: EA-08
    type: number
    role: exam
    purpose: method
    level: 2
    points: 1
    outcome: LO-01
    sections:
    - T02
    minutes: 2
    prompt: Отрезок от 0 до 1 разделён на девятые доли. Точка стоит ровно посередине между штрихами $\dfrac{2}{9}$
      и $\dfrac{8}{9}$. Какая у неё координата?
    answer: 5/9
    hints:
    - На сколько шагов по одной девятой отстоят друг от друга эти штрихи?
    - Середина — штрих, до которого от обоих концов одинаковое число шагов.
    - Выпишите штрихи от $\dfrac{2}{9}$ до $\dfrac{8}{9}$ по порядку и найдите средний.
    solution: |
      ### Ответ
      $\dfrac{5}{9}$

      ### Идея
      Соседние штрихи отличаются на одну девятую; середина — равное число шагов с обеих сторон.

      ### Шаги
      1. Штрихи: $\dfrac{2}{9}, \dfrac{3}{9}, \dfrac{4}{9}, \dfrac{5}{9}, \dfrac{6}{9}, \dfrac{7}{9}, \dfrac{8}{9}$ — шесть шагов.
      2. Три шага от $\dfrac{2}{9}$ вправо и три шага от $\dfrac{8}{9}$ влево ведут в $\dfrac{5}{9}$.

      ### Проверка
      $2 + 3 = 5$ и $5 + 3 = 8$ — по три шага с каждой стороны.

      ### Типичная ошибка
      Найти среднее между числителями, но изменить знаменатель.
    feedback:
      correct: 'Верно: середина — три шага по одной девятой от каждого штриха.'
      wrong:
        what: Координата середины неверна.
        why: Возможно, изменён знаменатель или шаги посчитаны неравно.
        fix: Знаменатель оставьте девятым, найдите средний штрих по числителям.
        next: Раздел T02, счёт по долям.
  - id: EA-09
    type: number
    role: exam
    purpose: meaning
    level: 2
    points: 1
    outcome: LO-02
    sections:
    - T03
    minutes: 2
    prompt: Сколько положительных натуральных чисел можно записать дробью со знаменателем 3, если числитель —
      положительное натуральное число не больше 20?
    answer: 6
    hints:
    - Когда дробь со знаменателем 3 равна натуральному числу?
    - Числитель должен получаться при счёте тройками.
    - Три, шесть, девять… — дойдите до двадцати, не переходя его.
    solution: |
      ### Ответ
      6

      ### Идея
      Натуральным числам отвечают полные группы по три трети.

      ### Шаги
      1. Счёт тройками: 3, 6, 9, 12, 15, 18; следующее число больше 20.
      2. Дроби $\dfrac{3}{3}, \dfrac{6}{3}, \dots, \dfrac{18}{3}$ — числа 1, 2, 3, 4, 5, 6.

      ### Проверка
      $18 : 3 = 6$ — последнее из чисел.

      ### Типичная ошибка
      Посчитать только $\dfrac{3}{3}$.
    feedback:
      correct: 'Верно: натуральным числам отвечают числители из счёта тройками — их шесть до двадцати.'
      wrong:
        what: Количество неверно.
        why: Возможно, пропущены полные группы.
        fix: Выпишите счёт тройками до 20.
        next: Раздел T03, таблица долей.
