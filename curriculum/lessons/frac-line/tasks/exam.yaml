# Контрольная (STANDARD.md §8): варианты A и B по 15 задач и 15 баллов, уровни не убывают.
# На каждый outcome в каждом варианте — две procedure, по одной meaning, method и transfer (правило 174).
# Правило 173 (не более 20 % баллов на подтему) при четырёх подтемах выполнить нельзя — даже при
# одной подтеме на задачу какая-то подтема получит не меньше 25 %; вопрос — в описании PR.
# Задачи с детекторами имеют один вариант с параметрами, чтобы формула каталога вычислялась
# на числах задачи (правило 165).
variants:
- id: A
  tasks:
  - id: EA-01
    type: number
    role: exam
    purpose: procedure
    level: 0
    points: 1
    outcome: LO-01
    sections:
    - T01
    minutes: 1
    prompt: Между 0 и 1 поставили 6 штрихов на равных расстояниях. На сколько равных частей разделился
      единичный отрезок?
    answer: 7
    hints:
    - Считайте промежутки, а не штрихи.
    - Промежутки начинаются в нуле и кончаются в единице.
    - Шесть штрихов внутри — сколько промежутков вокруг них?
    solution: |
      ### Ответ
      7

      ### Идея
      Промежутков на один больше, чем штрихов внутри.

      ### Шаги
      1. Штрихов внутри 6.
      2. Промежутков на один больше: 7.

      ### Проверка
      Семь частей разделены шестью границами: $6 + 1 = 7$.

      ### Типичная ошибка
      Ответить 6 — приравнять штрихи к частям.
    feedback:
      correct: 'Верно: шесть внутренних штрихов дают семь промежутков.'
      wrong:
        what: Число частей неверно.
        why: Возможно, штрихи приравнены к частям.
        fix: Частей на одну больше, чем штрихов внутри.
        next: Раздел T01, пример 3.
    errors:
    - E-frac-line-marks-as-parts
  - id: EA-02
    type: number
    role: exam
    purpose: procedure
    level: 1
    points: 1
    outcome: LO-01
    sections:
    - T02
    minutes: 1
    prompt: Единичный отрезок разделён на 9 равных частей. Точка M стоит на седьмом штрихе справа от нуля.
      Какая координата у точки M?
    answer: 7/9
    hints:
    - Какое число отвечает за размер одной части?
    - Знаменатель — число частей в единичном отрезке, числитель — части от нуля до точки.
    - Одна часть — $\dfrac{1}{9}$; сколько таких частей до седьмого штриха?
    solution: |
      ### Ответ
      $\dfrac{7}{9}$

      ### Идея
      Знаменатель — части единицы, числитель — части до точки.

      ### Шаги
      1. Частей 9 — знаменатель 9.
      2. До седьмого штриха 7 частей — числитель 7.

      ### Проверка
      От M до 1 — 2 части: $7 + 2 = 9$.

      ### Типичная ошибка
      Посчитать штрих в нуле первым и записать $\dfrac{8}{9}$.
    feedback:
      correct: 'Верно: седьмой штрих — семь девятых долей от нуля.'
      wrong:
        what: Координата M неверна.
        why: Возможно, штрих в нуле посчитан первым шагом.
        fix: Считайте части от нуля.
        next: Раздел T02, пример 2.
    errors:
    - E-frac-line-count-zero-tick
  - id: EA-03
    type: number
    role: exam
    purpose: meaning
    level: 1
    points: 1
    outcome: LO-01
    sections:
    - T02
    minutes: 1
    prompt: На луче отмечена точка $\dfrac{2}{7}$. Сколько долей по $\dfrac{1}{7}$ отделяют её от точки
      1?
    answer: 5
    hints:
    - Сколько долей по одной седьмой в единичном отрезке?
    - Две доли уже пройдены от нуля до точки.
    - 'Досчитайте от двух до семи: три, четыре…'
    solution: |
      ### Ответ
      5

      ### Идея
      В единице 7 седьмых, две уже пройдены.

      ### Шаги
      1. В единичном отрезке 7 долей.
      2. До точки 2 доли.
      3. Досчитываем: 3, 4, 5, 6, 7 — 5 долей.

      ### Проверка
      $2 + 5 = 7$.

      ### Типичная ошибка
      Ответить 7 — назвать все доли отрезка.
    feedback:
      correct: 'Верно: из семи седьмых две уже позади, впереди до единицы пять.'
      wrong:
        what: Число долей до единицы неверно.
        why: Возможно, названы все доли отрезка.
        fix: Досчитайте от числителя до знаменателя.
        next: Раздел T02, пример 1.
  - id: EA-04
    type: number
    role: exam
    purpose: procedure
    level: 1
    points: 1
    outcome: LO-02
    sections:
    - T03
    minutes: 1
    prompt: Запишите число 4 дробью со знаменателем 5. В ответ введите числитель.
    answer: 20
    hints:
    - Сколько пятых долей в одном единичном отрезке?
    - В каждом из четырёх отрезков столько же пятых.
    - 'Сложите пятые доли за каждый отрезок: 5 + 5 + …'
    solution: |
      ### Ответ
      20

      ### Идея
      Каждое целое размениваем на пятые доли.

      ### Шаги
      1. В единице 5 пятых.
      2. В четырёх: $5 + 5 + 5 + 5 = 20$.
      3. $4 = \dfrac{20}{5}$.

      ### Проверка
      $20 : 5 = 4$.

      ### Типичная ошибка
      Написать $\dfrac{4}{5}$ — это меньше единицы.
    feedback:
      correct: 'Верно: четыре целых отрезка — это двадцать пятых.'
      wrong:
        what: Числитель неверен.
        why: Возможно, число 4 записано в числитель без размена.
        fix: Разменяйте каждое целое на пять пятых.
        next: Раздел T03, пример 1.
    errors:
    - E-frac-line-whole-as-one-part
  - id: EA-05
    type: numbers
    role: exam
    purpose: procedure
    level: 1
    points: 1
    outcome: LO-02
    sections:
    - T04
    minutes: 2
    prompt: Между какими соседними натуральными числами лежит $\dfrac{17}{6}$?
    fields:
    - id: left
      label: Левое число
    - id: right
      label: Правое число
    answer:
      left: 2
      right: 3
    hints:
    - Сколько шестых в одной единице?
    - Считайте шестые группами по шесть.
    - Шесть, двенадцать, восемнадцать — где окажется семнадцать?
    solution: |
      ### Ответ
      Между 2 и 3: левое 2, правое 3.

      ### Идея
      Полные группы шестых — единицы.

      ### Шаги
      1. $\dfrac{12}{6} = 2$, $\dfrac{18}{6} = 3$.
      2. 17 между 12 и 18 — дробь между 2 и 3.

      ### Проверка
      От 2 до $\dfrac{17}{6}$ — 5 шестых ($12 + 5 = 17$), до 3 — одна ($17 + 1 = 18$).

      ### Типичная ошибка
      Ответить «между 17 и 18» — принять числитель за координату.
    feedback:
      correct: 'Верно: две полные группы по шесть шестых и ещё пять шестых — точка между 2 и 3.'
      wrong:
        what: Соседние числа неверны.
        why: Возможно, числитель принят за координату.
        fix: Считайте группы по шесть.
        next: Раздел T04, пример 2.
  - id: EA-06
    type: number
    role: exam
    purpose: transfer
    level: 1
    points: 1
    outcome: LO-01
    sections:
    - T01
    - T02
    minutes: 2
    prompt: 'Плотник размечает рейку длиной 1 м: между её концами он поставил {{k}} отметок на равных
      расстояниях. Пропил нужен у {{m}}-й отметки от левого конца. На каком расстоянии от левого конца
      пропил? Ответ запишите дробью, в метрах.'
    answer: 3/10
    variants:
    - params: {k: 9, m: 3}
      answer: 3/10
      solution: |
        ### Ответ
        $\dfrac{3}{10}$

        ### Идея
        Частей на одну больше, чем отметок внутри; числитель — части до нужной отметки.

        ### Шаги
        1. 9 отметок внутри делят целое на 10 частей, каждая — $\dfrac{1}{10}$.
        2. До 3-й отметки — 3 части: $\dfrac{3}{10}$ м.

        ### Проверка
        После неё остаётся 7 частей: $3 + 7 = 10$.

        ### Типичная ошибка
        Взять знаменателем число отметок: $\dfrac{3}{9}$.
    hints:
    - 'Рейка — единичный отрезок: левый конец — 0, правый — 1 м.'
    - Отметок внутри на одну меньше, чем получившихся частей.
    - Сосчитайте части, на которые {{k}} отметок делят рейку.
    solution: |
      ### Ответ
      Дробь: части до отметки из всех частей.

      ### Идея
      Части — промежутки между отметками.

      ### Шаги
      1. Число частей.
      2. Части до отметки.

      ### Проверка
      Части до отметки и после дают все.

      ### Типичная ошибка
      Взять знаменателем число отметок.
    feedback:
      correct: 'Верно: девять отметок делят метр на десять частей, и пропил — через три из них.'
      wrong:
        what: Доля найдена неверно.
        why: Похоже, число частей приравнено к числу отметок.
        fix: Частей на одну больше, чем отметок внутри.
        next: Раздел T02, пример 3.
      misconceptions:
      - id: E-frac-line-marks-as-parts
        when:
          expr: m / k
        message: Знаменатель — число отметок, а частей на одну больше.
    errors:
    - E-frac-line-marks-as-parts
