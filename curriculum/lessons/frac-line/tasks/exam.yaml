    minutes: 2
    prompt: Индикатор заряда телефона — полоска от «0» до «полный заряд». Между её концами на равных расстояниях
      стоят {{k}} риски. Заряд дошёл до {{m}}-й риски. Какая доля полного заряда накоплена?
    answer: 3/5
    variants:
    - params: {k: 4, m: 3}
      answer: 3/5
      solution: |
        ### Ответ
        $\dfrac{3}{5}$

        ### Идея
        Частей на одну больше, чем рисок внутри; числитель — части до нужной риски.

        ### Шаги
        1. 4 риски внутри делят целое на 5 частей, каждая — $\dfrac{1}{5}$.
        2. До 3-й риски — 3 части: $\dfrac{3}{5}$.

        ### Проверка
        После неё остаётся 2 части: $3 + 2 = 5$.

        ### Типичная ошибка
        Взять знаменателем число рисок: $\dfrac{3}{4}$.
    hints:
    - 'Полоска — единичный отрезок: «0» — начало, «полный заряд» — 1.'
    - Рисок внутри на одну меньше, чем частей полоски.
    - Сосчитайте части, на которые {{k}} риски делят полоску.
    solution: |
      ### Ответ
      Дробь: части до отметки из всех частей.

      ### Идея
      Части — промежутки между отметками.

      ### Шаги
      1. Число частей.
      2. Части до отметки.

      ### Проверка
      Части до отметки и после дают все.

      ### Типичная ошибка
      Взять знаменателем число отметок.
    feedback:
      correct: 'Верно: четыре риски делят полоску на пять частей, заряд прошёл три из них.'
      wrong:
        what: Доля найдена неверно.
        why: Похоже, число частей приравнено к числу рисок.
        fix: Частей на одну больше, чем рисок внутри.
