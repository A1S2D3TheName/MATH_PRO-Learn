      Промежутков на один больше, чем штрихов внутри.

      ### Шаги
      1. Штрихов внутри 8.
      2. Промежутков на один больше: 9.

      ### Проверка
      Девять частей разделены восемью границами: $8 + 1 = 9$.

      ### Типичная ошибка
      Ответить 8 — приравнять штрихи к частям.
    feedback:
