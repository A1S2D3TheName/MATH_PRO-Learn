  - id: EB-02
    type: number
    role: exam
    purpose: procedure
    level: 1
    points: 1
    outcome: LO-01
    sections:
    - T02
    minutes: 1
    prompt: Единичный отрезок разделён на 8 равных частей. Точка N стоит на третьем штрихе справа от нуля.
      Какая координата у точки N?
    answer: 3/8
    hints:
    - Сколько частей в единичном отрезке?
    - Числитель — сколько частей от нуля до точки.
    - Одна часть — $\dfrac{1}{8}$; посчитайте части до третьего штриха.
    solution: |
      ### Ответ
      $\dfrac{3}{8}$

      ### Идея
      Знаменатель — части единицы, числитель — части до точки.

      ### Шаги
      1. Частей 8 — знаменатель 8.
      2. До третьего штриха 3 части — числитель 3.

      ### Проверка
      От N до 1 — 5 частей: $3 + 5 = 8$.

      ### Типичная ошибка
      Посчитать штрих в нуле первым и записать $\dfrac{4}{8}$.
    feedback:
      correct: 'Верно: третий штрих — три восьмых от нуля.'
      wrong:
        what: Координата N неверна.
        why: Возможно, штрих в нуле посчитан первым шагом.
        fix: Считайте части от нуля.
        next: Раздел T02, пример 2.
    errors:
