    - Распределите промежутки поровну между метрами.
    - На четыре метра приходится двенадцать промежутков. Сколько промежутков — на один метр?
    solution: |
      ### Ответ
      $\dfrac{1}{3}$

      ### Идея
      Промежутки распределяем поровну между метрами.

      ### Шаги
      1. Между подписями 4 метра.
      2. Число промежутков на одном метре: $12 : 4 = 3$.
      3. Один промежуток — $\dfrac{1}{3}$ м.

      ### Проверка
      $3 + 3 + 3 + 3 = 12$.

      ### Типичная ошибка
      Записать $\dfrac{1}{12}$ — взять знаменателем все промежутки.
