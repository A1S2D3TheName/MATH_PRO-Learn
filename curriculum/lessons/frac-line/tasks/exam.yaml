    minutes: 2
    prompt: Точка $\dfrac{{{a}}}{{{n}}}$ стоит в {{d}} клетках от нуля. Сколько клеток занимает одна доля
      $\dfrac{1}{{{n}}}$?
    answer: 3
    variants:
    - params: {a: 3, n: 5, d: 9}
      answer: 3
      solution: |
        ### Ответ
        3

        ### Идея
        До точки уложено 3 доли по $\dfrac{1}{5}$.

        ### Шаги
        1. От 0 до $\dfrac{3}{5}$ — 3 доли.
        2. Одна доля: $9 : 3 = 3$ клетки.

        ### Проверка
        $3 + 3 + 3 = 9$ — доли вместе дают 9 клеток.

        ### Типичная ошибка
        Разделить 9 на знаменатель 5.
    hints:
    - Сколько долей уложено от нуля до точки?
    - Числитель {{a}} — число долей до точки.
    - Разделите {{d|pl:клетка,клетки,клеток}} поровну на {{a}} части.
    solution: |
      ### Ответ
      Длина доли.

      ### Идея
      До точки {{a|pl:доля,доли,долей}}.

      ### Шаги
      1. Доли до точки.
      2. Деление на {{a}}.

      ### Проверка
      Доли вместе дают {{d|pl:клетка,клетки,клеток}}.

      ### Типичная ошибка
      Делить на знаменатель.
    feedback:
      correct: 'Верно: девять клеток поделены на три доли — по три клетки.'
      wrong:
        what: Длина доли неверна.
        why: Похоже, длина поделена на знаменатель.
        fix: Делите на числитель — на число долей до точки.
        next: Раздел T05, заметка о делении на числитель.
      misconceptions:
      - id: E-frac-line-split-by-denominator
        when:
          expr: d / n
