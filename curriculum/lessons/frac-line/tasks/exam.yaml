  - id: EB-15
    type: number
    role: exam
    purpose: method
    level: 4
    points: 1
    outcome: LO-03
    sections:
    - T05
    - T06
    minutes: 4
    prompt: 'На схеме трассы видны только две таблички: $\dfrac{1}{3}$ км и $\dfrac{7}{3}$ км; расстояние
      между ними на схеме — 12 см. Сколько сантиметров на схеме от таблички $\dfrac{1}{3}$ км до столбика
      1 км?'
    answer: 4
    hints:
    - Сколько долей $\dfrac{1}{3}$ между двумя табличками?
    - Найдите, сколько сантиметров занимает одна доля.
    - 'Досчитайте от 1 до 7: 2, 3, …'
    solution: |
      ### Ответ
      4

      ### Идея
      Нуля нет — длину доли находим по двум табличкам.

      ### Шаги
      1. Между $\dfrac{1}{3}$ и $\dfrac{7}{3}$ — 6 долей: 2, 3, 4, 5, 6, 7.
      2. Одна доля: $12 : 6 = 2$ см.
      3. Столбик 1 км — $\dfrac{3}{3}$; от $\dfrac{1}{3}$ до него 2 доли.
      4. $2 + 2 = 4$ см.

      ### Проверка
      От 1 км до $\dfrac{7}{3}$ км — 4 доли, 8 см; $4 + 8 = 12$.

      ### Типичная ошибка
      Разделить расстояние на знаменатель, а не на число долей между табличками.
    feedback:
      correct: 'Верно: шесть третей между табличками дали длину доли, а до единицы — две трети.'
      wrong:
        what: Расстояние до столбика неверно.
        why: Возможно, длина доли найдена делением на знаменатель.
        fix: Сосчитайте доли между табличками.
        next: Раздел T06, пример 2.
