      correct: 'Верно: от единицы, то есть шести шестых, до десяти шестых — четыре части.'
      wrong:
        what: Число частей неверно.
        why: Возможно, доли отсчитаны от нуля.
        fix: Запишите 1 дробью со знаменателем 6.
        next: Раздел T04, пример 4.
