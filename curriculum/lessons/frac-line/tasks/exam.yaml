    sections:
    - T04
    minutes: 2
    prompt: Между какими соседними натуральными числами лежит $\dfrac{19}{4}$?
    fields:
    - id: left
      label: Левое число
    - id: right
      label: Правое число
    answer:
      left: 4
      right: 5
    hints:
    - Сколько четвертей в одной единице?
    - Считайте четверти группами по четыре.
    - Четыре, восемь, двенадцать, шестнадцать… — где окажется девятнадцать?
    solution: |
      ### Ответ
      Между 4 и 5: левое 4, правое 5.

      ### Идея
      Полные группы четвертей — единицы.

      ### Шаги
      1. $\dfrac{16}{4} = 4$, $\dfrac{20}{4} = 5$.
      2. 19 между 16 и 20 — дробь между 4 и 5.

      ### Проверка
      От 4 до $\dfrac{19}{4}$ — 3 четверти ($16 + 3 = 19$), до 5 — одна ($19 + 1 = 20$).

      ### Типичная ошибка
      Ответить «между 19 и 20» — принять числитель за координату.
    feedback:
      correct: 'Верно: четыре полные группы по четыре четверти и ещё три четверти — точка между 4 и 5.'
      wrong:
        what: Соседние числа неверны.
        why: Возможно, числитель принят за координату.
        fix: Считайте группы по четыре.
        next: Раздел T04, пример 1.
