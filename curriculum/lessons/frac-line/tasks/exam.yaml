    - В единичном отрезке шесть шестых — продолжите счёт от этого числа.
    solution: |
      ### Ответ
      4

      ### Идея
      Левый конец участка записываем дробью и досчитываем.

      ### Шаги
      1. $1 = \dfrac{6}{6}$.
      2. От 6 до 10: 7, 8, 9, 10 — 4 части.

      ### Проверка
      $\dfrac{10}{6}$ лежит между $\dfrac{6}{6} = 1$ и $\dfrac{12}{6} = 2$.

      ### Типичная ошибка
      Отсчитать от 1 десять частей.
