    prompt: На луче отмечены 0 и точка $\dfrac{1}{4}$; от 0 до неё 5 клеток. Сколько клеток от 0 до 1?
    answer: 20
    hints:
    - Какую долю единицы показывает точка $\dfrac{1}{4}$?
    - В единице четыре такие доли.
    - Отложите 5 клеток четыре раза подряд.
    solution: |
      ### Ответ
      20

      ### Идея
      В единице четыре четверти.

      ### Шаги
      1. Четверть — 5 клеток.
      2. Единица: $5 + 5 + 5 + 5 = 20$.

      ### Проверка
      $20 : 4 = 5$.

      ### Типичная ошибка
      Ответить 5 — принять точку $\dfrac{1}{4}$ за единицу.
    feedback:
