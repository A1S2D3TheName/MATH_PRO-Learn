        1. До точки 5 долей — 15 клеток.
        2. Одна доля: $15 : 5 = 3$.
        3. Единица — 2 доли: $3 + 3 = 6$.

        ### Проверка
        Точка правее единицы на 3 доли: $6 + 9 = 15$.

        ### Типичная ошибка
        Принять отрезок до точки за одну долю.
