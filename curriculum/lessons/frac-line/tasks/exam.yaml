  - id: EA-15
    type: number
    role: exam
    purpose: method
    level: 4
    points: 1
    outcome: LO-03
    sections:
    - T05
    - T06
    minutes: 4
    prompt: 'На схеме трассы видны только две таблички: $\dfrac{1}{4}$ км и $\dfrac{7}{4}$ км; расстояние
      между ними на схеме — 12 см. Сколько сантиметров на схеме от таблички $\dfrac{1}{4}$ км до столбика
      1 км?'
    answer: 6
    hints:
    - Сколько долей $\dfrac{1}{4}$ между двумя табличками?
    - Найдите, сколько сантиметров занимает одна доля.
    - 'Досчитайте от 1 до 7: 2, 3, …'
    solution: |
      ### Ответ
      6

      ### Идея
      Нуля нет — длину доли находим по двум табличкам.

      ### Шаги
      1. Между $\dfrac{1}{4}$ и $\dfrac{7}{4}$ — 6 долей: 2, 3, 4, 5, 6, 7.
      2. Одна доля: $12 : 6 = 2$ см.
      3. Столбик 1 км — $\dfrac{4}{4}$; от $\dfrac{1}{4}$ до него 3 доли.
      4. $2 + 2 + 2 = 6$ см.

      ### Проверка
      От 1 км до $\dfrac{7}{4}$ км — 3 доли, 6 см; $6 + 6 = 12$.

      ### Типичная ошибка
      Разделить расстояние на знаменатель, а не на число долей между табличками.
    feedback:
      correct: 'Верно: шесть четвертей между табличками дали длину доли, а до единицы — три четверти.'
      wrong:
        what: Расстояние до столбика неверно.
        why: Возможно, длина доли найдена делением на знаменатель.
        fix: Сосчитайте доли между табличками.
        next: Раздел T06, пример 2.
