# Финальная цепочка (STANDARD.md §8): один сюжет — разметка трассы забега, 5 шагов, 6 вариантов.
# depends_on стоит у F-03 (берёт координату пункта с водой из F-02), F-04 (берёт координату фотографа
# из F-03) и F-05 (берёт координату и столбик из F-03 и F-04) — 3 зависимых шага из 5 (правило 177).
# Производные параметры x, left, right, steps разрешены у final-step (правило 76) и подставляются
# в разбор вместо арифметики над параметрами (правило 166).
title: Разметка трассы забега
context_id: race-track
scenario: 'Трасса забега проходит вдоль набережной: старт — столбик 0, дальше через каждый километр стоят
  столбики 1, 2, 3 и 4. Каждый километр разделён табличками на {{n|pl:равную часть,равные части,равных
  частей}}.'
tasks:
- id: F-01
  type: number
  role: final-step
  purpose: procedure
  level: 0
  outcome: LO-01
  sections:
  - T01
  minutes: 1
  depends_on: []
  prompt: Каждый километр трассы разделён табличками на {{n|pl:равную часть,равные части,равных частей}}.
    Сколько табличек стоит между столбиками 0 и 1?
  answer: 4
  variants:
  - params: {n: 5, a: 3, b: 4, x: 7, left: 1, right: 2, steps: 3}
    answer: 4
    solution: |
      ### Ответ
      4

      ### Идея
      Таблички внутри километра — границы между его частями.

      ### Шаги
      1. Частей в километре 5.
      2. Границ между ними на одну меньше: 4 таблички.

      ### Проверка
      С табличками внутри получается 5 промежутков: $4 + 1 = 5$.

      ### Типичная ошибка
      Ответить 5 — приравнять таблички к частям.
