      Между столбиками 1 и 2: левый 1, правый 2.

      ### Идея
      Полные группы долей — полные километры.

      ### Шаги
      1. Фотограф — $\dfrac{7}{5}$ км (шаг F-03).
      2. Группы по 5: 5 — 1 км, 10 — 2 км.
      3. 7 между 5 и 10: столбики 1 и 2.

      ### Проверка
      $5 + 2 = 7$ и $7 + 3 = 10$.

