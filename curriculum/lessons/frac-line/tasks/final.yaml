  - params: {n: 2, a: 1, b: 6, x: 7, left: 3, right: 4, steps: 1}
    answer: 1
    solution: |
      ### Ответ
      1

      ### Идея
      Таблички внутри километра — границы между его частями.

      ### Шаги
      1. Частей в километре 2.
      2. Границ между ними на одну меньше: 1 табличка.

