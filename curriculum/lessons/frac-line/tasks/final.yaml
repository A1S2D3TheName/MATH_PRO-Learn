    answer: 5
    solution: |
      ### Ответ
      5

      ### Идея
      Таблички внутри километра — границы между его частями.

      ### Шаги
      1. Частей в километре 6.
      2. Границ между ними на одну меньше: 5 табличек.

      ### Проверка
      С табличками внутри получается 6 промежутков: $5 + 1 = 6$.

      ### Типичная ошибка
      Ответить 6 — приравнять таблички к частям.
  - params: {n: 8, a: 3, b: 8, x: 11, left: 1, right: 2, steps: 5}
    answer: 7
    solution: |
      ### Ответ
      7

      ### Идея
