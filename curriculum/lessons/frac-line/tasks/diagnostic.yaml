# Входная диагностика пререквизита frac-notation (STANDARD.md §6, правило 15): 4 короткие задачи.
#
# Правило 160 (v1.2) требует вести `sections` диагностики в пакет пререквизита (`frac-notation/Tnn`),
# но схема `common.schema.json#/$defs/sectionRef` (^T[0-9]{2}$) и проверка REF-SECTION валидатора
# принимают только разделы своего пакета, а пакета topics/frac-notation/ в репозитории ещё нет.
# Поэтому, как в topics/_example, здесь стоят ближайшие разделы этой темы, где навык пререквизита
# вспоминается и работает: T01 (знаменатель — число долей), T02 (числитель и знаменатель на луче),
# T03 (дробь как результат деления). Связь с пререквизитом несёт поле `outcome`; ID outcome
# `frac-notation/LO-01` не проверяется валидатором, пока пакета нет. Оба вопроса — в описании PR.
#
# Правило 15 просит диагностику без подсказок, а схема требует ровно три подсказки: они оставлены
# и не называют ответ (правило 168).
tasks:
- id: D-01
  type: number
  role: diagnostic
  purpose: procedure
  level: 0
  outcome: frac-notation/LO-01
  sections:
  - T02
  minutes: 1
  prompt: Целое разделили на 8 равных долей и взяли 3 такие доли. Запишите получившуюся дробь.
  answer: 3/8
  hints:
  - 'Числитель и знаменатель отвечают на разные вопросы: сколько долей взяли и на сколько долей разделили.'
  - Знаменатель — число равных долей в целом, числитель — сколько долей взято.
  - Целое разделено на восемь долей — это число стоит под дробной чертой.
  solution: |
    ### Ответ
    $\dfrac{3}{8}$

    ### Идея
    Знаменатель — сколько равных долей в целом, числитель — сколько долей взято.

    ### Шаги
    1. Долей в целом 8 — знаменатель 8.
    2. Взято 3 доли — числитель 3.

    ### Проверка
    Дробь $\dfrac{3}{8}$ читается «три восьмых»: три доли из восьми.

    ### Типичная ошибка
    Поменять местами числитель и знаменатель и записать $\dfrac{8}{3}$.
  feedback:
    correct: 'Верно: знаменатель — число долей в целом, числитель — сколько долей взято.'
    wrong:
      what: Запись дроби неверна.
      why: Возможно, числитель и знаменатель поменялись местами.
      fix: Под черту — число равных долей целого, над чертой — число взятых долей.
      next: Повторите тему «Числитель, знаменатель и запись дроби».
- id: D-02
  type: number
  role: diagnostic
  purpose: meaning
  level: 0
  outcome: frac-notation/LO-01
  sections:
  - T01
  minutes: 1
  prompt: Одна доля целого записывается дробью $\dfrac{1}{6}$. На сколько равных долей разделено целое?
  answer: 6
  hints:
  - Какая часть записи дроби говорит о числе долей в целом?
  - Знаменатель — на сколько равных долей разделено целое.
  - Посмотрите на число под дробной чертой в записи одной доли.
  solution: |
    ### Ответ
    6

    ### Идея
    Знаменатель единичной дроби — число равных долей в целом.

    ### Шаги
    1. Одна доля записана как $\dfrac{1}{6}$.
    2. Знаменатель 6 — целое разделено на 6 долей.

    ### Проверка
    Шесть долей по $\dfrac{1}{6}$ составляют целое: $1 + 1 + 1 + 1 + 1 + 1 = 6$ долей из 6.

    ### Типичная ошибка
    Ответить 1 — перепутать числитель (взята одна доля) со знаменателем.
  feedback:
    correct: 'Верно: знаменатель единичной дроби говорит, на сколько долей разделено целое.'
    wrong:
      what: Число долей указано неверно.
      why: Возможно, назван числитель, а не знаменатель.
      fix: Знаменатель — число равных долей целого.
      next: Повторите в теме о записи дроби смысл знаменателя.
- id: D-03
  type: number
  role: diagnostic
  purpose: procedure
  level: 1
  outcome: frac-notation/LO-01
  sections:
  - T02
  minutes: 1
  prompt: В записи $\dfrac{7}{9}$ какое число показывает, сколько долей взято?
  answer: 7
  hints:
  - Какое число стоит над дробной чертой, а какое под ней?
  - Над чертой пишут, сколько долей взято.
  - Найдите в записи число над дробной чертой.
  solution: |
    ### Ответ
    7

    ### Идея
    Числитель показывает, сколько долей взято, знаменатель — на сколько долей разделено целое.

    ### Шаги
    1. Над чертой стоит 7 — это числитель.
    2. Числитель и показывает, сколько долей взято.

    ### Проверка
    Дробь читается «семь девятых»: взяли семь долей из девяти.

    ### Типичная ошибка
    Назвать 9 — это число долей во всём целом.
  feedback:
    correct: 'Верно: числитель показывает, сколько долей взято.'
    wrong:
      what: Названо не то число.
      why: Возможно, перепутаны числитель и знаменатель.
      fix: Числитель — над чертой, он считает взятые доли.
      next: Повторите тему «Числитель, знаменатель и запись дроби».
- id: D-04
  type: number
  role: diagnostic
  purpose: procedure
  level: 1
  outcome: frac-notation/LO-01
  sections:
  - T03
  minutes: 1
  prompt: Дробь можно понимать как результат деления числителя на знаменатель. Чему равна дробь $\dfrac{14}{7}$?
  answer: 2
  hints:
  - Какое действие стоит за дробной чертой?
  - Разделите числитель на знаменатель.
  - Сколько раз по семь помещается в четырнадцати?
  solution: |
    ### Ответ
    2

    ### Идея
    Дробная черта означает деление числителя на знаменатель.

    ### Шаги
    1. $\dfrac{14}{7} = 14 : 7$.
    2. $14 : 7 = 2$.

    ### Проверка
    Проверка умножением: $7 \cdot 2 = 14$.

    ### Типичная ошибка
    Ответить 7 — взять знаменатель вместо результата деления.
  feedback:
    correct: 'Верно: дробная черта — это деление, четырнадцать на семь даёт два.'
    wrong:
      what: Значение дроби найдено неверно.
      why: Возможно, деление выполнено не в том порядке или не выполнено вовсе.
      fix: Разделите числитель на знаменатель и проверьте умножением.
      next: Повторите в теме о записи дроби раздел «Дробь как результат деления».
