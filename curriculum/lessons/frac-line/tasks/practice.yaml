  answer: &id001
    left: 2
    right: 3
  variants:
  - params: {p: 8, n: 3}
    answer: *id001
    solution: |
      ### Ответ
      Между 2 и 3: левое число 2, правое 3.

      ### Идея
      Доли отсчитывают группами по знаменателю: каждая полная группа — единичный отрезок.

      ### Шаги
      1. Группы по 3: 3 — точка 1, 6 — точка 2, 9 — точка 3.
      2. 8 лежит между 6 и 9.
      3. Значит, $\dfrac{8}{3}$ лежит между 2 и 3.

      ### Проверка
      От точки 2 до $\dfrac{8}{3}$ — 2 доли ($6 + 2 = 8$), до точки 3 — ещё 1 доля ($8 + 1 = 9$).

      ### Типичная ошибка
      Ответить «между 0 и 1», решив, что дробь не может быть больше единицы.
