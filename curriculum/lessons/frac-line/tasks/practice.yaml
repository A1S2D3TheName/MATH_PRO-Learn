# Основной банк (STANDARD.md §8): 28 задач без challenge — warmup 3, supported 9, independent 16.
# Уровни: 0 — 3, 1 — 9, 2 — 9, 3 — 5, 4 — 2 (10,7 / 32,1 / 32,1 / 17,9 / 7,1 %).
# LO-01 (core) — P-01…P-08, LO-02 (standard) — P-09…P-16, LO-03 (deep) — P-17…P-28.
# Основа — задачи Eureka Math G3 M5 L14–L17 и IM K–5 G3 U5 L5–L9, L13 (см. sources.md): контексты
# и числа заменены, числа натуральные не больше 20, знаменатели не больше 10.
# У каждого варианта свой разбор с числами варианта (правило 164); общий разбор — шаблон метода.
# Детекторы `feedback.misconceptions[].when.expr` совпадают с `formula` записей каталога
# (блок `# --- тема frac-line` в errors/catalog.yaml), имена переменных — параметры вариантов.
tasks:
- id: P-01
  type: number
  role: warmup
  purpose: procedure
  level: 0
  outcome: LO-01
  sections:
  - T01
  minutes: 1
  prompt: Единичный отрезок от 0 до 1 разделили на {{n|pl:равную часть,равные части,равных частей}}. Какую
    долю единичного отрезка составляет одна часть? Запишите ответ дробью.
  answer: 1/3
  variants:
  - params: {n: 3}
    answer: 1/3
    solution: |
      ### Ответ
      $\dfrac{1}{3}$

      ### Идея
      Целое на луче — единичный отрезок. Одна из нескольких равных частей — единичная дробь: в числителе 1, в знаменателе число частей.

      ### Шаги
      1. Целое — отрезок от 0 до 1, его разделили на 3 равные части.
      2. Одна часть из 3 равных — доля $\dfrac{1}{3}$: одна часть взята, 3 части в целом.

      ### Проверка
      3 такие части, отложенные подряд от нуля, доходят ровно до 1 — других частей в отрезке нет.

      ### Типичная ошибка
      Взять знаменателем число штрихов внутри отрезка (2): дробь $\dfrac{1}{2}$ описывает деление на 2, а не на 3 части.
  - params: {n: 5}
    answer: 1/5
    solution: |
      ### Ответ
      $\dfrac{1}{5}$

      ### Идея
      Целое на луче — единичный отрезок. Одна из нескольких равных частей — единичная дробь: в числителе 1, в знаменателе число частей.

      ### Шаги
      1. Целое — отрезок от 0 до 1, его разделили на 5 равных частей.
      2. Одна часть из 5 равных — доля $\dfrac{1}{5}$: одна часть взята, 5 частей в целом.

      ### Проверка
      5 таких частей, отложенные подряд от нуля, доходят ровно до 1 — других частей в отрезке нет.

      ### Типичная ошибка
      Взять знаменателем число штрихов внутри отрезка (4): дробь $\dfrac{1}{4}$ описывает деление на 4, а не на 5 частей.
  - params: {n: 8}
    answer: 1/8
    solution: |
      ### Ответ
      $\dfrac{1}{8}$

      ### Идея
      Целое на луче — единичный отрезок. Одна из нескольких равных частей — единичная дробь: в числителе 1, в знаменателе число частей.

      ### Шаги
      1. Целое — отрезок от 0 до 1, его разделили на 8 равных частей.
      2. Одна часть из 8 равных — доля $\dfrac{1}{8}$: одна часть взята, 8 частей в целом.

      ### Проверка
      8 таких частей, отложенные подряд от нуля, доходят ровно до 1 — других частей в отрезке нет.

      ### Типичная ошибка
      Взять знаменателем число штрихов внутри отрезка (7): дробь $\dfrac{1}{7}$ описывает деление на 7, а не на 8 частей.
  hints:
  - Целое здесь — весь единичный отрезок от 0 до 1.
  - 'Одна часть из нескольких равных — единичная дробь: её числитель 1.'
  - 'Вспомните запись доли из темы о записи дроби: целое разделено на {{n|pl:равную часть,равные части,равных
    частей}} — какой знаменатель у одной из них?'
  solution: |
    ### Ответ
    Единичная дробь со знаменателем {{n}}.

    ### Идея
    Одна из равных частей целого — единичная дробь.

    ### Шаги
    1. Целое — единичный отрезок, частей {{n}}.
    2. Одна часть — дробь с числителем 1 и знаменателем {{n}}.

    ### Проверка
    Столько же таких частей подряд заполняют весь отрезок до 1.

    ### Типичная ошибка
    Взять знаменателем число штрихов внутри отрезка, а не число частей.
  feedback:
    correct: 'Верно: одна часть из {{n}} равных — это единичная дробь со знаменателем {{n}}.'
    wrong:
      what: Дробь не описывает одну из равных частей единичного отрезка.
      why: Возможно, в знаменатель попало число штрихов, а не число частей.
      fix: Знаменатель — сколько равных частей между 0 и 1, числитель — сколько частей взято, то есть
        одна.
      next: Перечитайте начало раздела T01 и пример 1.
- id: P-02
  type: number
  role: warmup
  purpose: procedure
  level: 0
  outcome: LO-01
  sections:
  - T01
  minutes: 1
  prompt: Единичный отрезок нужно разделить на {{n|pl:равную часть,равные части,равных частей}}. Сколько
    штрихов надо поставить между 0 и 1?
  answer: 3
  variants:
  - params: {n: 4}
    answer: 3
    solution: |
      ### Ответ
      3

      ### Идея
      Концы 0 и 1 уже отмечены, а штрихи внутри служат границами между соседними частями.

      ### Шаги
      1. Нужно 4 промежутка между 0 и 1.
      2. Первый промежуток начинается в нуле, последний кончается в единице, а между соседними промежутками стоит по одному штриху.
      3. Границ внутри на одну меньше, чем промежутков: 3 штриха.

      ### Проверка
      Нарисуйте отрезок и 3 штриха внутри — получится 4 части: $3 + 1 = 4$.

      ### Типичная ошибка
      Поставить 4 штриха — тогда частей станет 5, и каждая будет долей $\dfrac{1}{5}$.
  - params: {n: 7}
    answer: 6
    solution: |
      ### Ответ
      6

      ### Идея
      Концы 0 и 1 уже отмечены, а штрихи внутри служат границами между соседними частями.

      ### Шаги
      1. Нужно 7 промежутков между 0 и 1.
      2. Первый промежуток начинается в нуле, последний кончается в единице, а между соседними промежутками стоит по одному штриху.
      3. Границ внутри на одну меньше, чем промежутков: 6 штрихов.

      ### Проверка
      Нарисуйте отрезок и 6 штрихов внутри — получится 7 частей: $6 + 1 = 7$.

      ### Типичная ошибка
      Поставить 7 штрихов — тогда частей станет 8, и каждая будет долей $\dfrac{1}{8}$.
  - params: {n: 10}
    answer: 9
    solution: |
      ### Ответ
      9

      ### Идея
      Концы 0 и 1 уже отмечены, а штрихи внутри служат границами между соседними частями.

      ### Шаги
      1. Нужно 10 промежутков между 0 и 1.
      2. Первый промежуток начинается в нуле, последний кончается в единице, а между соседними промежутками стоит по одному штриху.
      3. Границ внутри на одну меньше, чем промежутков: 9 штрихов.

      ### Проверка
      Нарисуйте отрезок и 9 штрихов внутри — получится 10 частей: $9 + 1 = 10$.

      ### Типичная ошибка
      Поставить 10 штрихов — тогда частей станет 11, и каждая будет долей $\dfrac{1}{11}$.
  hints:
  - Концы отрезка, 0 и 1, уже отмечены — их ставить не нужно.
  - 'Считайте промежутки: каждый штрих внутри отделяет одну часть от следующей.'
  - Нарисуйте отрезок, разделите его на {{n|pl:часть,части,частей}} и сосчитайте границы внутри.
  solution: |
    ### Ответ
    Число штрихов внутри — на один меньше, чем {{n}}.

    ### Идея
    Штрихи внутри — границы между соседними частями.

    ### Шаги
    1. Частей {{n}}.
    2. Внутренних границ на одну меньше, чем частей.

    ### Проверка
    Отрезок с такими штрихами распадается ровно на {{n|pl:равную часть,равные части,равных частей}}.

    ### Типичная ошибка
    Поставить столько штрихов, сколько нужно частей.
  feedback:
    correct: 'Верно: внутренних штрихов на один меньше, чем частей, — концы 0 и 1 уже стоят.'
    wrong:
      what: Число штрихов не даёт нужного числа равных частей.
      why: Скорее всего, число штрихов приравнено к числу частей.
      fix: 'Посчитайте промежутки: частей на одну больше, чем штрихов внутри отрезка.'
      next: Пример 1 и заметка «Сколько штрихов ставить» в разделе T01.
  errors:
  - E-frac-line-marks-as-parts
- id: P-03
  type: number
  role: supported
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T01
  - T02
  minutes: 1
  prompt: Между 0 и 1 на равных расстояниях стоят {{k|pl:штрих,штриха,штрихов}}. Точка A стоит на {{m}}-м
    штрихе справа от нуля. Какая координата у точки A?
  answer: 3/5
  variants:
  - params: {k: 4, m: 3}
    answer: 3/5
    solution: |
      ### Ответ
      $\dfrac{3}{5}$

      ### Идея
      Сначала считаем части, а не штрихи: частей на одну больше, чем штрихов внутри.

      ### Шаги
      1. 4 штриха внутри делят отрезок на 5 частей, знаменатель 5.
      2. От нуля до третьего штриха — 3 части, числитель 3.
      3. Координата точки A — $\dfrac{3}{5}$.

      ### Проверка
      От точки A до 1 остаётся 2 части: $3 + 2 = 5$ — все части отрезка.

      ### Типичная ошибка
      Взять знаменателем число штрихов и записать $\dfrac{3}{4}$.
  - params: {k: 6, m: 2}
    answer: 2/7
    solution: |
      ### Ответ
      $\dfrac{2}{7}$

      ### Идея
      Сначала считаем части, а не штрихи: частей на одну больше, чем штрихов внутри.

      ### Шаги
      1. 6 штрихов внутри делят отрезок на 7 частей, знаменатель 7.
      2. От нуля до второго штриха — 2 части, числитель 2.
      3. Координата точки A — $\dfrac{2}{7}$.

      ### Проверка
      От точки A до 1 остаётся 5 частей: $2 + 5 = 7$ — все части отрезка.

      ### Типичная ошибка
      Взять знаменателем число штрихов и записать $\dfrac{2}{6}$.
  - params: {k: 2, m: 1}
    answer: 1/3
    solution: |
      ### Ответ
      $\dfrac{1}{3}$

      ### Идея
      Сначала считаем части, а не штрихи: частей на одну больше, чем штрихов внутри.

      ### Шаги
      1. 2 штриха внутри делят отрезок на 3 части, знаменатель 3.
      2. От нуля до первого штриха — 1 часть, числитель 1.
      3. Координата точки A — $\dfrac{1}{3}$.

      ### Проверка
      От точки A до 1 остаётся 2 части: $1 + 2 = 3$ — все части отрезка.

      ### Типичная ошибка
      Взять знаменателем число штрихов и записать $\dfrac{1}{2}$.
  - params: {k: 8, m: 5}
    answer: 5/9
    solution: |
      ### Ответ
      $\dfrac{5}{9}$

      ### Идея
      Сначала считаем части, а не штрихи: частей на одну больше, чем штрихов внутри.

      ### Шаги
      1. 8 штрихов внутри делят отрезок на 9 частей, знаменатель 9.
      2. От нуля до пятого штриха — 5 частей, числитель 5.
      3. Координата точки A — $\dfrac{5}{9}$.

      ### Проверка
      От точки A до 1 остаётся 4 части: $5 + 4 = 9$ — все части отрезка.

      ### Типичная ошибка
      Взять знаменателем число штрихов и записать $\dfrac{5}{8}$.
  hints:
  - Сначала узнайте, на сколько частей разделён единичный отрезок.
  - Частей на одну больше, чем штрихов внутри отрезка; знаменатель — число частей.
  - Нарисуйте отрезок с {{k|pl:штрихом,штрихами,штрихами}} внутри и сосчитайте получившиеся части.
  solution: |
    ### Ответ
    Дробь: числитель {{m}}, знаменатель — число частей отрезка.

    ### Идея
    Знаменатель — число частей, а их на одну больше, чем штрихов.

    ### Шаги
    1. Найти число частей между 0 и 1.
    2. Сосчитать части от нуля до точки A.

    ### Проверка
    Части до точки и после неё вместе дают все части отрезка.

    ### Типичная ошибка
    Взять знаменателем число штрихов.
  feedback:
    correct: 'Верно: части посчитаны как промежутки, а числитель — число частей до точки A.'
    wrong:
      what: Координата точки A найдена неверно.
      why: Возможно, знаменатель взят по числу штрихов, а не частей.
      fix: Сосчитайте промежутки между 0 и 1 и части от нуля до точки.
      next: Заметка «Штрихов на один меньше, чем частей» в разделе T01.
    misconceptions:
    - id: E-frac-line-marks-as-parts
      when:
        expr: m / k
      message: Знаменатель равен числу штрихов, а {{k|pl:штрих,штриха,штрихов}} внутри делят отрезок на
        большее число частей.
  errors:
  - E-frac-line-marks-as-parts
- id: P-04
  type: number
  role: supported
  purpose: meaning
  level: 1
  outcome: LO-01
  sections:
  - T02
  minutes: 1
  prompt: На луче отмечена точка $\dfrac{{{m}}}{{{n}}}$. Сколько ещё долей по $\dfrac{1}{{{n}}}$ нужно
    отсчитать от неё вправо, чтобы дойти до 1?
  answer: 2
  variants:
  - params: {m: 3, n: 5}
    answer: 2
    solution: |
      ### Ответ
      2

      ### Идея
      Единичный отрезок состоит из 5 долей по $\dfrac{1}{5}$; точка $\dfrac{3}{5}$ — это 3 из них, остальные лежат между точкой и единицей.

      ### Шаги
      1. До точки — 3 доли по $\dfrac{1}{5}$.
      2. Всего в единичном отрезке 5 таких долей.
      3. Досчитываем от 3 до 5: 4, 5 — ещё 2 доли.

      ### Проверка
      $3 + 2 = 5$ — от 0 до 1 ровно 5 долей по $\dfrac{1}{5}$.

      ### Типичная ошибка
      Ответить 5 — это все доли отрезка, а не те, что остались после точки.
  - params: {m: 5, n: 8}
    answer: 3
    solution: |
      ### Ответ
      3

      ### Идея
      Единичный отрезок состоит из 8 долей по $\dfrac{1}{8}$; точка $\dfrac{5}{8}$ — это 5 из них, остальные лежат между точкой и единицей.

      ### Шаги
      1. До точки — 5 долей по $\dfrac{1}{8}$.
      2. Всего в единичном отрезке 8 таких долей.
      3. Досчитываем от 5 до 8: 6, 7, 8 — ещё 3 доли.

      ### Проверка
      $5 + 3 = 8$ — от 0 до 1 ровно 8 долей по $\dfrac{1}{8}$.

      ### Типичная ошибка
      Ответить 8 — это все доли отрезка, а не те, что остались после точки.
  - params: {m: 2, n: 9}
    answer: 7
    solution: |
      ### Ответ
      7

      ### Идея
      Единичный отрезок состоит из 9 долей по $\dfrac{1}{9}$; точка $\dfrac{2}{9}$ — это 2 из них, остальные лежат между точкой и единицей.

      ### Шаги
      1. До точки — 2 доли по $\dfrac{1}{9}$.
      2. Всего в единичном отрезке 9 таких долей.
      3. Досчитываем от 2 до 9: 3, 4, 5, 6, 7, 8, 9 — ещё 7 долей.

      ### Проверка
      $2 + 7 = 9$ — от 0 до 1 ровно 9 долей по $\dfrac{1}{9}$.

      ### Типичная ошибка
      Ответить 9 — это все доли отрезка, а не те, что остались после точки.
  - params: {m: 1, n: 6}
    answer: 5
    solution: |
      ### Ответ
      5

      ### Идея
      Единичный отрезок состоит из 6 долей по $\dfrac{1}{6}$; точка $\dfrac{1}{6}$ — это 1 из них, остальные лежат между точкой и единицей.

      ### Шаги
      1. До точки — 1 доля по $\dfrac{1}{6}$.
      2. Всего в единичном отрезке 6 таких долей.
      3. Досчитываем от 1 до 6: 2, 3, 4, 5, 6 — ещё 5 долей.

      ### Проверка
      $1 + 5 = 6$ — от 0 до 1 ровно 6 долей по $\dfrac{1}{6}$.

      ### Типичная ошибка
      Ответить 6 — это все доли отрезка, а не те, что остались после точки.
  hints:
  - Сколько долей по $\dfrac{1}{{{n}}}$ помещается во всём отрезке от 0 до 1?
  - Числитель {{m}} показывает, сколько таких долей уже отсчитано от нуля.
  - Досчитайте от {{m}} до {{n}}, называя числа по порядку, и сосчитайте названные числа.
  solution: |
    ### Ответ
    Число долей между точкой и единицей.

    ### Идея
    В единице столько долей, сколько показывает знаменатель.

    ### Шаги
    1. До точки — {{m|pl:доля,доли,долей}}.
    2. Досчитать от {{m}} до {{n}}.

    ### Проверка
    Доли до точки и после неё вместе дают {{n}}.

    ### Типичная ошибка
    Назвать все доли отрезка вместо оставшихся.
  feedback:
    correct: 'Верно: в единице столько долей, сколько показывает знаменатель, и часть из них уже позади.'
    wrong:
      what: Число оставшихся долей не совпадает.
      why: Возможно, посчитаны все доли отрезка или доли до точки, а не после неё.
      fix: Знаменатель — сколько долей до 1, числитель — сколько уже пройдено; досчитайте недостающие.
      next: 'Пример 1 раздела T02: проверка «до единицы остаётся…».'
- id: P-05
  type: number
  role: supported
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T02
  minutes: 2
  prompt: Отрезок от 0 до 1 разделён на {{n|pl:равную часть,равные части,равных частей}}. Штрихи считали
    слева направо и первым назвали штрих в нуле. Точка B оказалась на {{t}}-м по этому счёту штрихе. Какая
    координата у точки B?
  answer: 4/7
  variants:
  - params: {n: 7, t: 5}
    answer: 4/7
    solution: |
      ### Ответ
      $\dfrac{4}{7}$

      ### Идея
      Штрих в нуле — место старта, а не шаг.

      ### Шаги
      1. По счёту, начатому с нуля, точка B — 5-й штрих.
      2. Первый из названных штрихов стоит в нуле, поэтому шагов от нуля до B на один меньше: 4.
      3. Каждый шаг — $\dfrac{1}{7}$, значит, координата B — $\dfrac{4}{7}$.

      ### Проверка
