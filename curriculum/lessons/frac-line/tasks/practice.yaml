      Доли отсчитывают группами по знаменателю: каждая полная группа — единичный отрезок.

      ### Шаги
      1. Группы по 5: 5 — точка 1, 10 — точка 2.
      2. 9 лежит между 5 и 10.
      3. Значит, $\dfrac{9}{5}$ лежит между 1 и 2.

      ### Проверка
      От точки 1 до $\dfrac{9}{5}$ — 4 доли ($5 + 4 = 9$), до точки 2 — ещё 1 доля ($9 + 1 = 10$).

      ### Типичная ошибка
      Ответить «между 0 и 1», решив, что дробь не может быть больше единицы.
