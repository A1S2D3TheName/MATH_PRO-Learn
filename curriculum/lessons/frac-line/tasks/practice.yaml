      ### Идея
      Доли отсчитывают группами по знаменателю: каждая полная группа — единичный отрезок.

      ### Шаги
      1. Группы по 4: 4 — точка 1, 8 — точка 2, 12 — точка 3, 16 — точка 4.
      2. 13 лежит между 12 и 16.
      3. Значит, $\dfrac{13}{4}$ лежит между 3 и 4.

      ### Проверка
