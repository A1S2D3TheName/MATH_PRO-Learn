# Повторение (STANDARD.md §8): 6 коротких задач по три варианта; числа и формулировки не совпадают
# с практикой, примерами теории, финальной цепочкой и контрольной (правило 172).
tasks:
- id: R-01
  type: number
  role: refresh
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T01
  minutes: 2
  prompt: Единичный отрезок разделили {{k|pl:штрихом,штрихами,штрихами}} на равные части. Какую долю единичного
    отрезка составляет одна часть?
  answer: 1/4
  variants:
  - params: {k: 3}
    answer: 1/4
    solution: |
      ### Ответ
      $\dfrac{1}{4}$

      ### Идея
      Частей на одну больше, чем штрихов внутри; одна часть — единичная дробь.

      ### Шаги
      1. 3 штриха внутри — 4 части.
      2. Одна часть из 4 равных — $\dfrac{1}{4}$.

      ### Проверка
      4 части по $\dfrac{1}{4}$, отложенные от нуля, доходят ровно до 1.

      ### Типичная ошибка
      Ответить $\dfrac{1}{3}$ — взять знаменателем число штрихов.
  - params: {k: 5}
    answer: 1/6
    solution: |
      ### Ответ
      $\dfrac{1}{6}$

      ### Идея
      Частей на одну больше, чем штрихов внутри; одна часть — единичная дробь.

      ### Шаги
      1. 5 штрихов внутри — 6 частей.
      2. Одна часть из 6 равных — $\dfrac{1}{6}$.

      ### Проверка
      6 частей по $\dfrac{1}{6}$, отложенные от нуля, доходят ровно до 1.

      ### Типичная ошибка
      Ответить $\dfrac{1}{5}$ — взять знаменателем число штрихов.
  - params: {k: 9}
    answer: 1/10
    solution: |
      ### Ответ
      $\dfrac{1}{10}$

      ### Идея
      Частей на одну больше, чем штрихов внутри; одна часть — единичная дробь.

      ### Шаги
      1. 9 штрихов внутри — 10 частей.
      2. Одна часть из 10 равных — $\dfrac{1}{10}$.

      ### Проверка
      10 частей по $\dfrac{1}{10}$, отложенные от нуля, доходят ровно до 1.

      ### Типичная ошибка
      Ответить $\dfrac{1}{9}$ — взять знаменателем число штрихов.
  hints:
  - Сначала найдите, сколько частей между 0 и 1.
  - Частей на одну больше, чем штрихов внутри отрезка.
  - 'Внутри {{k|pl:штрих,штриха,штрихов}}: сколько промежутков между нулём, штрихами и единицей?'
  solution: |
    ### Ответ
    Единичная дробь: знаменатель — число частей.

    ### Идея
    По штрихам находим число частей.

    ### Шаги
    1. Части — по штрихам.
    2. Одна часть — единичная дробь.

    ### Проверка
    Все части вместе заполняют отрезок.

    ### Типичная ошибка
    Взять знаменателем число штрихов.
  feedback:
    correct: 'Верно: по штрихам найдено число частей, а одна часть — единичная дробь.'
    wrong:
      what: Доля одной части неверна.
      why: Похоже, знаменатель взят по числу штрихов.
      fix: Сначала посчитайте промежутки между 0 и 1.
      next: Раздел T01, заметка «Сколько штрихов ставить».
  errors:
  - E-frac-line-marks-as-parts
- id: R-02
  type: number
  role: refresh
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T02
  minutes: 2
  prompt: От нуля отсчитали {{m|pl:шаг,шага,шагов}} по $\dfrac{1}{{{n}}}$ единичного отрезка. Какая координата
    у точки, где закончился последний шаг?
  answer: 5/6
  variants:
  - params: {m: 5, n: 6}
    answer: 5/6
    solution: |
      ### Ответ
      $\dfrac{5}{6}$

      ### Идея
      Знаменатель — размер шага, числитель — число шагов.

      ### Шаги
      1. Каждый шаг — $\dfrac{1}{6}$.
      2. Сделано 5 шагов: координата $\dfrac{5}{6}$.

      ### Проверка
      До единицы не хватает 1 шага: $5 + 1 = 6$.

      ### Типичная ошибка
      Записать $\dfrac{6}{5}$ — поменять числитель и знаменатель местами.
  - params: {m: 3, n: 10}
    answer: 3/10
    solution: |
      ### Ответ
      $\dfrac{3}{10}$

      ### Идея
      Знаменатель — размер шага, числитель — число шагов.

      ### Шаги
      1. Каждый шаг — $\dfrac{1}{10}$.
      2. Сделано 3 шага: координата $\dfrac{3}{10}$.

      ### Проверка
      До единицы не хватает 7 шагов: $3 + 7 = 10$.

      ### Типичная ошибка
      Записать $\dfrac{10}{3}$ — поменять числитель и знаменатель местами.
  - params: {m: 4, n: 5}
    answer: 4/5
    solution: |
      ### Ответ
      $\dfrac{4}{5}$

      ### Идея
      Знаменатель — размер шага, числитель — число шагов.

      ### Шаги
      1. Каждый шаг — $\dfrac{1}{5}$.
      2. Сделано 4 шага: координата $\dfrac{4}{5}$.

      ### Проверка
      До единицы не хватает 1 шага: $4 + 1 = 5$.

      ### Типичная ошибка
      Записать $\dfrac{5}{4}$ — поменять числитель и знаменатель местами.
  hints:
  - Что в записи дроби отвечает за размер шага, а что — за число шагов?
  - Знаменатель — размер шага, числитель — сколько шагов сделано.
  - После первого шага координата $\dfrac{1}{{{n}}}$, после второго — на одну долю больше; продолжите
    до {{m}}-го шага.
  solution: |
    ### Ответ
    Дробь: числитель {{m}}, знаменатель {{n}}.

    ### Идея
    Числитель считает шаги.

    ### Шаги
    1. Шаг — доля со знаменателем {{n}}.
    2. Шагов {{m}}.

    ### Проверка
    До единицы не хватает оставшихся шагов.

    ### Типичная ошибка
    Поменять числитель и знаменатель.
  feedback:
    correct: 'Верно: число шагов стало числителем, а размер шага — знаменателем.'
    wrong:
      what: Координата неверна.
      why: Возможно, числитель и знаменатель поменялись местами.
      fix: Знаменатель — размер шага, числитель — число шагов.
      next: Раздел T02, пример 1.
- id: R-03
  type: number
  role: refresh
  purpose: procedure
  level: 1
  outcome: LO-02
  sections:
  - T03
  minutes: 2
  prompt: В какой натуральной точке луча стоит дробь $\dfrac{{{p}}}{{{n}}}$?
  answer: 4
  variants:
  - params: {p: 16, n: 4}
    answer: 4
    solution: |
      ### Ответ
      4

      ### Идея
      Полные группы долей — единичные отрезки.

      ### Шаги
      1. Группы по 4: 4, 8, 12, 16.
      2. Групп 4: $\dfrac{16}{4} = 4$.

      ### Проверка
      $16 : 4 = 4$.

      ### Типичная ошибка
      Ответить 16 — принять числитель за координату.
  - params: {p: 10, n: 5}
    answer: 2
    solution: |
      ### Ответ
      2

      ### Идея
      Полные группы долей — единичные отрезки.

      ### Шаги
      1. Группы по 5: 5, 10.
      2. Групп 2: $\dfrac{10}{5} = 2$.

      ### Проверка
      $10 : 5 = 2$.

      ### Типичная ошибка
      Ответить 10 — принять числитель за координату.
  - params: {p: 18, n: 3}
    answer: 6
    solution: |
      ### Ответ
      6

      ### Идея
      Полные группы долей — единичные отрезки.

      ### Шаги
      1. Группы по 3: 3, 6, 9, 12, 15, 18.
      2. Групп 6: $\dfrac{18}{3} = 6$.

      ### Проверка
      $18 : 3 = 6$.

      ### Типичная ошибка
      Ответить 18 — принять числитель за координату.
  hints:
  - Сколько долей $\dfrac{1}{{{n}}}$ в одном единичном отрезке?
  - Каждая полная группа из {{n|pl:доли,долей,долей}} — один единичный отрезок.
  - Сосчитайте группы по {{n}} в {{p|pl:доле,долях,долях}} — или разделите {{p}} на {{n}}.
  solution: |
    ### Ответ
    Натуральное число — число полных групп.

    ### Идея
    Группы долей по {{n}}.

    ### Шаги
    1. Считать группами.
    2. Сосчитать группы.

    ### Проверка
    Деление подтверждает ответ.

    ### Типичная ошибка
    Принять числитель за координату.
  feedback:
    correct: 'Верно: доли сложились в полные единичные отрезки, и их число — искомая точка.'
    wrong:
      what: Натуральная точка указана неверно.
      why: Возможно, за координату принят числитель.
      fix: Разделите числитель на знаменатель.
      next: Раздел T03, пример 2.
- id: R-04
  type: numbers
  role: refresh
  purpose: procedure
  level: 2
  outcome: LO-02
  sections:
  - T04
  minutes: 2
  prompt: Дробь $\dfrac{{{p}}}{{{n}}}$ лежит между двумя соседними натуральными числами. Назовите их.
  fields:
  - id: left
    label: Левое число
  - id: right
    label: Правое число
  answer: &id001
    left: 3
    right: 4
  variants:
  - params: {p: 10, n: 3}
    answer: *id001
    solution: |
      ### Ответ
      Между 3 и 4: левое 3, правое 4.

      ### Идея
      Число полных групп долей — левый сосед.

      ### Шаги
      1. Группы по 3: 9 — точка 3, 12 — точка 4.
      2. 10 между 9 и 12 — дробь между 3 и 4.

      ### Проверка
      $9 + 1 = 10$ и $10 + 2 = 12$.

      ### Типичная ошибка
      Ответить «между 10 и 11» — принять числитель за координату.
  - params: {p: 12, n: 5}
    answer:
      left: 2
      right: 3
    solution: |
      ### Ответ
      Между 2 и 3: левое 2, правое 3.

      ### Идея
      Число полных групп долей — левый сосед.

      ### Шаги
      1. Группы по 5: 10 — точка 2, 15 — точка 3.
      2. 12 между 10 и 15 — дробь между 2 и 3.

      ### Проверка
      $10 + 2 = 12$ и $12 + 3 = 15$.

      ### Типичная ошибка
      Ответить «между 12 и 13» — принять числитель за координату.
  - params: {p: 15, n: 4}
    answer:
      left: 3
      right: 4
    solution: |
      ### Ответ
      Между 3 и 4: левое 3, правое 4.

      ### Идея
      Число полных групп долей — левый сосед.

      ### Шаги
      1. Группы по 4: 12 — точка 3, 16 — точка 4.
      2. 15 между 12 и 16 — дробь между 3 и 4.

      ### Проверка
      $12 + 3 = 15$ и $15 + 1 = 16$.

      ### Типичная ошибка
      Ответить «между 15 и 16» — принять числитель за координату.
  hints:
  - Сколько долей $\dfrac{1}{{{n}}}$ составляют одну единицу?
  - 'Считайте доли группами по {{n}}: число полных групп — левый сосед.'
  - Выпишите числа при счёте группами по {{n}} и найдите, между какими двумя стоит {{p}}.
  solution: |
    ### Ответ
    Два соседних натуральных числа.

    ### Идея
    Группы по {{n|pl:доля,доли,долей}}.

    ### Шаги
    1. Считать группами.
    2. Найти группы вокруг {{p}}.

    ### Проверка
    Доли с двух сторон дают {{n}}.

    ### Типичная ошибка
    Принять числитель за координату.
  feedback:
    correct: 'Верно: число полных групп долей дало левого соседа.'
    wrong:
      what: Соседние числа неверны.
      why: Возможно, доли не сгруппированы по знаменателю.
      fix: Считайте группы по {{n}} до {{p}}.
      next: Раздел T04, пример 2.
- id: R-05
  type: number
  role: refresh
  purpose: procedure
  level: 2
  outcome: LO-03
  sections:
  - T05
  minutes: 3
  prompt: Точка $\dfrac{{{a}}}{{{n}}}$ стоит в {{d|pl:клетке,клетках,клетках}} от нуля. Сколько клеток
    от нуля до единицы?
  answer: 15
  variants:
  - params: {a: 2, n: 5, d: 6}
    answer: 15
    solution: |
      ### Ответ
      15

      ### Идея
      Долю находим по числителю, единицу — по знаменателю.

      ### Шаги
      1. До точки 2 доли: одна доля $6 : 2 = 3$.
      2. Единица — 5 долей: $3 + 3 + 3 + 3 + 3 = 15$.

      ### Проверка
      2 доли по 3 клетки — $3 + 3 = 6$ клеток, как дано.

      ### Типичная ошибка
      Отложить весь отрезок до точки столько раз, сколько показывает знаменатель.
  - params: {a: 3, n: 7, d: 6}
    answer: 14
    solution: |
      ### Ответ
      14

      ### Идея
      Долю находим по числителю, единицу — по знаменателю.

      ### Шаги
      1. До точки 3 доли: одна доля $6 : 3 = 2$.
      2. Единица — 7 долей: $2 + 2 + 2 + 2 + 2 + 2 + 2 = 14$.

      ### Проверка
      3 доли по 2 клетки — $2 + 2 + 2 = 6$ клеток, как дано.

      ### Типичная ошибка
      Отложить весь отрезок до точки столько раз, сколько показывает знаменатель.
  - params: {a: 4, n: 3, d: 12}
    answer: 9
    solution: |
      ### Ответ
      9

      ### Идея
      Долю находим по числителю, единицу — по знаменателю.

      ### Шаги
      1. До точки 4 доли: одна доля $12 : 4 = 3$.
      2. Единица — 3 доли: $3 + 3 + 3 = 9$.

      ### Проверка
      4 доли по 3 клетки — $3 + 3 + 3 + 3 = 12$ клеток, как дано.

      ### Типичная ошибка
      Отложить весь отрезок до точки столько раз, сколько показывает знаменатель.
  hints:
  - Сколько долей $\dfrac{1}{{{n}}}$ уложено от нуля до точки?
  - Длина одной доли — расстояние до точки, делённое на числитель.
  - Разделите {{d}} на {{a}}, а затем отложите полученную долю {{n|pl:раз,раза,раз}}.
  solution: |
    ### Ответ
    Длина единицы в клетках.

    ### Идея
    Доля — по числителю, единица — по знаменателю.

    ### Шаги
    1. Доля — {{d}} : {{a}}.
    2. Единица — {{n|pl:доля,доли,долей}}.

    ### Проверка
    Доли до точки дают {{d|pl:клетка,клетки,клеток}}.

    ### Типичная ошибка
    Принять отрезок до точки за одну долю.
  feedback:
    correct: 'Верно: доля найдена по числителю, единица собрана по знаменателю.'
    wrong:
      what: Длина единицы неверна.
      why: Возможно, отрезок до точки принят за одну долю.
      fix: В отрезке до точки {{a|pl:доля,доли,долей}} — найдите одну.
      next: Раздел T05, пример 2.
    misconceptions:
    - id: E-frac-line-point-as-unit
      when:
        expr: d * n
      message: Отрезок до точки отложен как одна доля, а в нём {{a|pl:доля,доли,долей}}.
  errors:
  - E-frac-line-point-as-unit
- id: R-06
  type: number
  role: refresh
  purpose: transfer
  level: 2
  outcome: LO-03
  sections:
  - T06
  minutes: 2
  prompt: На самодельной линейке подписаны только 0 и {{h}}, а между ними {{p|pl:промежуток,промежутка,промежутков}}
    одинаковой длины. Какой дробью нужно подписать первый штрих после нуля?
  answer: 1/3
  variants:
  - params: {h: 3, p: 9}
    answer: 1/3
    solution: |
      ### Ответ
      $\dfrac{1}{3}$

      ### Идея
      Промежутки распределяем поровну между единичными отрезками.

      ### Шаги
      1. От 0 до 3 — 3 единичных отрезка.
      2. Число промежутков на одном единичном отрезке: $9 : 3 = 3$.
      3. Первый штрих после нуля — $\dfrac{1}{3}$.

      ### Проверка
      $3 + 3 + 3 = 9$ промежутков — как на линейке.

      ### Типичная ошибка
      Подписать $\dfrac{1}{9}$ — взять знаменателем все промежутки линейки.
  - params: {h: 2, p: 12}
    answer: 1/6
    solution: |
      ### Ответ
      $\dfrac{1}{6}$

      ### Идея
      Промежутки распределяем поровну между единичными отрезками.

      ### Шаги
      1. От 0 до 2 — 2 единичных отрезка.
      2. Число промежутков на одном единичном отрезке: $12 : 2 = 6$.
      3. Первый штрих после нуля — $\dfrac{1}{6}$.

      ### Проверка
      $6 + 6 = 12$ промежутков — как на линейке.

      ### Типичная ошибка
      Подписать $\dfrac{1}{12}$ — взять знаменателем все промежутки линейки.
  - params: {h: 4, p: 16}
    answer: 1/4
    solution: |
      ### Ответ
      $\dfrac{1}{4}$

      ### Идея
      Промежутки распределяем поровну между единичными отрезками.

      ### Шаги
      1. От 0 до 4 — 4 единичных отрезка.
      2. Число промежутков на одном единичном отрезке: $16 : 4 = 4$.
      3. Первый штрих после нуля — $\dfrac{1}{4}$.

      ### Проверка
      $4 + 4 + 4 + 4 = 16$ промежутков — как на линейке.

      ### Типичная ошибка
      Подписать $\dfrac{1}{16}$ — взять знаменателем все промежутки линейки.
  hints:
  - Сколько единичных отрезков между подписями 0 и {{h}}?
  - Сначала узнайте, сколько промежутков приходится на один единичный отрезок.
  - Разделите {{p}} поровну на {{h|pl:единичный отрезок,единичных отрезка,единичных отрезков}}.
  solution: |
    ### Ответ
    Единичная дробь.

    ### Идея
    Знаменатель — число промежутков на одном отрезке.

    ### Шаги
    1. Единичные отрезки.
    2. Промежутки на отрезок.

    ### Проверка
    Общее число промежутков на всех единичных отрезках равно {{p}}.

    ### Типичная ошибка
    Взять знаменателем все промежутки.
  feedback:
    correct: 'Верно: подпись первого штриха — единичная дробь с числом промежутков одного отрезка в знаменателе.'
    wrong:
      what: Подпись первого штриха неверна.
      why: Похоже, знаменателем взяты все промежутки линейки.
      fix: Знаменатель — число промежутков на одном единичном отрезке.
      next: Раздел T06, пример 1.
  errors:
  - E-frac-line-whole-picture
