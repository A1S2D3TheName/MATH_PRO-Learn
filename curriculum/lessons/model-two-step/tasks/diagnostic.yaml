# Входная диагностика (STANDARD.md §6, правило 15): 4 задачи по прямым пререквизитам
# model-one-step и num-mult-table.
tasks:
  - id: D-01
    type: number
    role: diagnostic
    purpose: procedure
    level: 0
    outcome: model-one-step/LO-01
    sections: [T01]
    minutes: 1
    prompt: На нижней полке лавки «Переплёт» стоит 24 альбома, а на верхней — на 7 альбомов меньше. Сколько альбомов стоит на верхней полке?
    answer: 17
    hints:
      - Оборот «на 7 меньше» указывает на уменьшение известного количества на 7 единиц.
      - Чтобы уменьшить число на несколько единиц, используют вычитание.
      - Вычтите 7 из 24.
    solution: |
      ### Ответ
      17

      ### Идея
      Слова «на 7 меньше» задают разностное уменьшение: из числа альбомов на нижней полке вычитаем 7.

      ### Шаги
      1. На нижней полке 24 альбома, на верхней на 7 меньше.
      2. Вычитаем: $24 - 7 = 17$.

      ### Проверка
      Прибавим разницу к результату: $17 + 7 = 24$ — совпадает с числом альбомов на нижней полке.

      ### Типичная ошибка
      Прибавить 7 вместо вычитания и получить 31 (`E-model-two-step-wrong-second-op`).
    feedback:
      correct: Верно, уменьшение на 7 находится вычитанием и даёт 17 альбомов.
      wrong:
        what: Количество альбомов на верхней полке найдено неверно.
        why: Возможно, вместо вычитания выполнено сложение или допущена ошибка при переходе через десяток.
        fix: Вычтите 7 из 24 по частям (сначала 4 до 20, затем ещё 3).
        next: Повторите выбор действия по словам «на сколько меньше» в теме `model-one-step`.

  - id: D-02
    type: number
    role: diagnostic
    purpose: procedure
    level: 0
    outcome: num-mult-table/LO-01
    sections: [T02]
    minutes: 1
    prompt: В 6 одинаковых пачках лежит по 8 блокнотов в каждой. Сколько всего блокнотов в этих пачках?
    answer: 48
    hints:
      - Шесть одинаковых пачек по 8 блокнотов образуют 6 равных групп по 8 предметов.
      - Общее число предметов в равных группах находят умножением по таблице умножения.
      - Умножьте 6 на 8.
    solution: |
      ### Ответ
      48

      ### Идея
      В 6 равных группах по 8 блокнотов общее число предметов равно произведению числа пачек на число блокнотов в одной пачке.

      ### Шаги
      1. В каждой из 6 пачек по 8 блокнотов.
      2. По таблице умножения находим: $6 \cdot 8 = 48$.

      ### Проверка
      Разделим 48 блокнотов на 6 папок: $48 : 6 = 8$ блокнотов в каждой пачке.

      ### Типичная ошибка
      Сложить 6 и 8 вместо умножения (`E-model-two-step-add-instead-of-mult`).
    feedback:
      correct: Верно, 6 пачек по 8 блокнотов дают произведение 48.
      wrong:
        what: Общее число блокнотов не совпало.
        why: Возможно, числа 6 и 8 сложены вместо умножения или перепутан табличный случай.
        fix: Вспомните произведение 6 и 8 по таблице умножения.
        next: Повторите таблицу умножения на 6 и 8 в теме `num-mult-table`.

  - id: D-03
    type: number
    role: diagnostic
    purpose: meaning
    level: 1
    outcome: num-mult-table/LO-02
    sections: [T02]
    minutes: 1
    prompt: Мастер разложил 36 открыток поровну в 4 подарочных конверта. Сколько открыток оказалось в каждом конверте?
    answer: 9
    hints:
      - Слова «разложил поровну в 4 конверта» означают разделение 36 предметов на 4 равные части.
      - Чтобы разделить число на равные части, используют деление и связанный табличный факт умножения.
      - Подберите число, которое при умножении на 4 даёт 36.
    solution: |
      ### Ответ
      9

      ### Идея
      Раскладка 36 открыток поровну на 4 конверта — задача на деление на равные части.

      ### Шаги
      1. Всего 36 открыток и 4 равных конверта.
      2. По семейству связанных фактов ($4 \cdot 9 = 36$) делим: $36 : 4 = 9$.

      ### Проверка
      В 4 конвертах по 9 открыток всего $4 \cdot 9 = 36$ открыток.

      ### Типичная ошибка
      Вычесть 4 из 36 вместо деления на 4 равные части (`E-model-two-step-skip-first-sub`).
    feedback:
      correct: Верно, при делении 36 на 4 равных конверта получается по 9 открыток.
      wrong:
        what: Число открыток в одном конверте найдено неверно.
        why: Возможно, вместо деления выполнено вычитание или выбран соседний случай таблицы умножения.
        fix: Разделите 36 на 4, проверив ответ умножением на 4.
        next: Повторите связь умножения и деления в теме `num-mult-table`.

  - id: D-04
    type: choice
    role: diagnostic
    purpose: meaning
    level: 1
    outcome: model-one-step/LO-02
    sections: [T01]
    minutes: 1
    prompt: В {{a}} коробках лежит по {{b}} чашек, и ещё {{c}} чашек стоят на витрине (всего на {{k}} чашек больше, чем в коробках). Какое равенство верно находит общее число всех чашек на втором шаге после вычисления $4 \cdot 6 = 24$?
    options:
      - id: a
        text: "24 + 5 = 29"
      - id: b
        text: "4 * 6 = 24"
        misconception: E-model-two-step-stop-after-first
        why: Записан только промежуточный результат первого шага без прибавления 5 чашек с витрины.
      - id: c
        text: "4 + 6 + 5 = 15"
        misconception: E-model-two-step-add-instead-of-mult
        why: Число коробок 4 сложено с числом чашек 6 в одной коробке вместо умножения.
      - id: d
        text: "4 + 4 + 5 = 13"
        misconception: E-model-two-step-additive-for-mult-compare
        why: Вместо четырёх групп по 6 взята сумма двух четвёрок и пятёрки.
    answer: a
    variants:
      - params: {a: 4, b: 6, c: 5, k: 5}
        answer: a
    hints:
      - В коробках уже насчитали 24 чашки, а на витрине стоят ещё 5 отдельных чашек.
      - Чтобы узнать общее количество, нужно объединить чашки в коробках и чашки на витрине.
      - Сложите промежуточный результат 24 и число чашек на витрине.
    solution: |
      ### Ответ
      24 + 5 = 29

      ### Идея
      К промежуточному результату $4 \cdot 6 = 24$ чашки в коробках прибавляем ещё 5 чашек с витрины.

      ### Шаги
      1. В {{a}} коробках по {{b}} чашек находится $4 \cdot 6 = 24$ чашки.
      2. Прибавляем {{c}} чашек на витрине: $24 + 5 = 29$.

      ### Проверка
      Если из 29 чашек убрать {{k}} чашек витрины, останется $29 - 5 = 24$ чашки в коробках.

      ### Типичная ошибка
      Остановиться на первом равенстве $4 \cdot 6 = 24$ (`E-model-two-step-stop-after-first`) или сложить все числа условия $4 + 6 + 5 = 15$ (`E-model-two-step-add-instead-of-mult`).
    feedback:
      correct: Верно, второй шаг складывает 24 чашки из коробок и 5 чашек с витрины.
      wrong:
        what: Выбрано равенство, которое не доводит счёт до общего числа чашек.
        why: Возможно, выбран только первый шаг или число коробок сложено с размером коробки.
        fix: Возьмите число чашек в коробках (24) и прибавьте к нему 5 чашек с витрины.
        next: Разберите устройство двухшагового плана в разделе T01.
