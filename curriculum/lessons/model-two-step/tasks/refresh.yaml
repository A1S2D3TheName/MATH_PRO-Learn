# Задачи режима «Освежить память» (STANDARD.md §2, §8): 5 задач, суммарно 15 мин.
tasks:
- id: R-01
  type: number
  role: refresh
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T01
  minutes: 3
  prompt: На верхней полке стеллажа стоит {{a}} альбомов, а на нижней — на {{b}} альбомов меньше. Сколько всего
    альбомов стоит на двух полках?
  answer: 31
  variants:
  - params:
      a: 18
      b: 5
    answer: 31
    solution: |
      ### Ответ
      31

      ### Идея
      Сначала вычитанием находим число альбомов на нижней полке (18 минус 5), а затем складываем обе полки.

      ### Шаги
      1. Шаг 1 (промежуточный результат — на нижней полке): $18 - 5 = 13$.
      2. Шаг 2 (всего на двух полках): $18 + 13 = 31$.

      ### Проверка
      Обратный ход: $31 - 18 = 13$, и $18 - 13 = 5$.

      ### Типичная ошибка
      Остановиться после первого шага и записать 13 (`E-model-two-step-stop-after-first`).
  - params:
      a: 25
      b: 7
    answer: 43
    solution: |
      ### Ответ
      43

      ### Идея
      Сначала вычитанием находим число альбомов на нижней полке (25 минус 7), а затем складываем обе полки.

      ### Шаги
      1. Шаг 1 (промежуточный результат — на нижней полке): $25 - 7 = 18$.
      2. Шаг 2 (всего на двух полках): $25 + 18 = 43$.

      ### Проверка
      Обратный ход: $43 - 25 = 18$, и $25 - 18 = 7$.

      ### Типичная ошибка
      Остановиться после первого шага и записать 18 (`E-model-two-step-stop-after-first`).
  - params:
      a: 20
      b: 6
    answer: 34
    solution: |
      ### Ответ
      34

      ### Идея
      Сначала вычитанием находим число альбомов на нижней полке (20 минус 6), а затем складываем обе полки.

      ### Шаги
      1. Шаг 1 (промежуточный результат — на нижней полке): $20 - 6 = 14$.
      2. Шаг 2 (всего на двух полках): $20 + 14 = 34$.

      ### Проверка
      Обратный ход: $34 - 20 = 14$, и $20 - 14 = 6$.

      ### Типичная ошибка
      Остановиться после первого шага и записать 14 (`E-model-two-step-stop-after-first`).
  hints:
  - Вопрос про общее число альбомов требует знать обе полки, а число альбомов на нижней полке ещё неизвестно.
  - Сначала найдите промежуточный результат вычитанием ({{a}} минус {{b}}), а затем прибавьте его к {{a}}.
  - Вычтите {{b}} из {{a}}, а потом сложите полученное число с {{a}}.
  solution: |
    ### Ответ
    31

    ### Идея
    Сначала вычитанием находим число альбомов на нижней полке (18 минус 5), а затем складываем обе полки.

    ### Шаги
    1. Шаг 1 (промежуточный результат — на нижней полке): $18 - 5 = 13$.
    2. Шаг 2 (всего на двух полках): $18 + 13 = 31$.

    ### Проверка
    Обратный ход: $31 - 18 = 13$, и $18 - 13 = 5$.

    ### Типичная ошибка
    Остановиться после первого шага и записать 13 (`E-model-two-step-stop-after-first`).
  feedback:
    correct: Верно, найден промежуточный результат для нижней полки и сумма двух полок.
    wrong:
      what: Ответ не совпадает с общим числом альбомов на двух полках.
      why: Чаще всего забывают прибавить альбомы верхней полки после первого вычитания.
      fix: 'Проверьте: сначала {{a}} минус {{b}}, затем к результату прибавьте {{a}}.'
      next: Раздел T01 — выжимка и карточка.
- id: R-02
  type: number
  role: refresh
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T02
  minutes: 3
  prompt: На столе лежат {{a}} стопок по {{b}} книг и ещё {{c}} отдельных книг. Сколько всего книг лежит на столе?
  answer: 47
  variants:
  - params:
      a: 8
      b: 5
      c: 7
    answer: 47
    solution: |
      ### Ответ
      47

      ### Идея
      Сначала умножением узнаём число книг в 8 равных стопках по 5 штук, а затем прибавляем 7 отдельных книг.

      ### Шаги
      1. Шаг 1 (в 8 стопках): $8 \cdot 5 = 40$.
      2. Шаг 2 (всего с отдельными книгами): $40 + 7 = 47$.

      ### Проверка
      Обратный ход: $47 - 7 = 40$, $40 : 8 = 5$.

      ### Типичная ошибка
      Сложить $8 + 5 + 7 = 20$ вместо умножения (`E-model-two-step-add-instead-of-mult`).
  - params:
      a: 6
      b: 7
      c: 5
    answer: 47
    solution: |
      ### Ответ
      47

      ### Идея
      Сначала умножением узнаём число книг в 6 равных стопках по 7 штук, а затем прибавляем 5 отдельных книг.

      ### Шаги
      1. Шаг 1 (в 6 стопках): $6 \cdot 7 = 42$.
      2. Шаг 2 (всего с отдельными книгами): $42 + 5 = 47$.

      ### Проверка
      Обратный ход: $47 - 5 = 42$, $42 : 6 = 7$.

      ### Типичная ошибка
      Сложить $6 + 7 + 5 = 18$ вместо умножения (`E-model-two-step-add-instead-of-mult`).
  - params:
      a: 7
      b: 8
      c: 6
    answer: 62
    solution: |
      ### Ответ
      62

      ### Идея
      Сначала умножением узнаём число книг в 7 равных стопках по 8 штук, а затем прибавляем 6 отдельных книг.

      ### Шаги
      1. Шаг 1 (в 7 стопках): $7 \cdot 8 = 56$.
      2. Шаг 2 (всего с отдельными книгами): $56 + 6 = 62$.

      ### Проверка
      Обратный ход: $62 - 6 = 56$, $56 : 7 = 8$.

      ### Типичная ошибка
      Сложить $7 + 8 + 6 = 21$ вместо умножения (`E-model-two-step-add-instead-of-mult`).
  hints:
  - Сначала узнайте промежуточный результат — сколько книг лежит в {{a}} одинаковых стопках по {{b}} книг.
  - Равные стопки объединяются умножением, а отдельные {{c}} книг добавляются сложением.
  - Умножьте {{a}} на {{b}}, а затем к полученному произведению прибавьте {{c}}.
  solution: |
    ### Ответ
    47

    ### Идея
    Сначала умножением узнаём число книг в 8 равных стопках по 5 штук, а затем прибавляем 7 отдельных книг.

    ### Шаги
    1. Шаг 1 (в 8 стопках): $8 \cdot 5 = 40$.
    2. Шаг 2 (всего с отдельными книгами): $40 + 7 = 47$.

    ### Проверка
    Обратный ход: $47 - 7 = 40$, $40 : 8 = 5$.

    ### Типичная ошибка
    Сложить $8 + 5 + 7 = 20$ вместо умножения (`E-model-two-step-add-instead-of-mult`).
  feedback:
    correct: Верно, произведение для стопок сложено с отдельными книгами.
    wrong:
      what: Общее число книг найдено неверно.
      why: Возможно, числа сложены вместо умножения или пропущено прибавление отдельных книг.
      fix: Умножьте {{a}} на {{b}} и прибавьте {{c}}.
      next: Раздел T02 — выжимка и карточка.
    misconceptions:
    - id: E-model-two-step-add-instead-of-mult
      when:
        expr: a + b + c
      message: В {{a}} стопках по {{b}} книг — это {{a}} равных групп, их число находят умножением {{a}} на {{b}},
        а не сложением.
    - id: E-model-two-step-stop-after-first
      when:
        expr: a * b
      message: Это только книги в стопках. Прибавьте ещё {{c}} отдельных книг.
- id: R-03
  type: number
  role: refresh
  purpose: meaning
  level: 2
  outcome: LO-02
  sections:
  - T03
  minutes: 3
  prompt: В пятницу мастерская переплела {{a}} словарей, а в субботу — в {{k}} раз больше. Сколько всего словарей
    переплела мастерская за эти два дня?
  answer: 36
  variants:
  - params:
      a: 6
      k: 5
    answer: 36
    solution: |
      ### Ответ
      36

      ### Идея
      Слова «в 5 раз больше» требуют умножения 6 на 5 на первом шаге, а вопрос «Сколько всего?» — сложения с 6 на втором шаге.

      ### Шаги
      1. Шаг 1 (в субботу): $6 \cdot 5 = 30$.
      2. Шаг 2 (за два дня): $6 + 30 = 36$.

      ### Проверка
      Обратный ход: $36 - 6 = 30$, $30 : 6 = 5$.

      ### Типичная ошибка
      Прибавить 5 вместо умножения и получить $6 + (6 + 5) = 17$ (`E-model-two-step-additive-for-mult-compare`).
  - params:
      a: 7
      k: 6
    answer: 49
    solution: |
      ### Ответ
      49

      ### Идея
      Слова «в 6 раз больше» требуют умножения 7 на 6 на первом шаге, а вопрос «Сколько всего?» — сложения с 7 на втором шаге.

      ### Шаги
      1. Шаг 1 (в субботу): $7 \cdot 6 = 42$.
      2. Шаг 2 (за два дня): $7 + 42 = 49$.

      ### Проверка
      Обратный ход: $49 - 7 = 42$, $42 : 7 = 6$.

      ### Типичная ошибка
      Прибавить 6 вместо умножения и получить $7 + (7 + 6) = 20$ (`E-model-two-step-additive-for-mult-compare`).
  - params:
      a: 8
      k: 5
    answer: 48
    solution: |
      ### Ответ
      48

      ### Идея
      Слова «в 5 раз больше» требуют умножения 8 на 5 на первом шаге, а вопрос «Сколько всего?» — сложения с 8 на втором шаге.

      ### Шаги
      1. Шаг 1 (в субботу): $8 \cdot 5 = 40$.
      2. Шаг 2 (за два дня): $8 + 40 = 48$.

      ### Проверка
      Обратный ход: $48 - 8 = 40$, $40 : 8 = 5$.

      ### Типичная ошибка
      Прибавить 5 вместо умножения и получить $8 + (8 + 5) = 21$ (`E-model-two-step-additive-for-mult-compare`).
  hints:
  - 'Обратите внимание на предлог «в {{k}} раз больше»: это кратное сравнение, а не разностное.'
  - На первом шаге умножьте {{a}} на {{k}}, чтобы узнать число словарей за субботу.
  - К числу словарей за субботу (произведению {{a}} и {{k}}) прибавьте {{a}} словарей за пятницу.
  solution: |
    ### Ответ
    36

    ### Идея
    Слова «в 5 раз больше» требуют умножения 6 на 5 на первом шаге, а вопрос «Сколько всего?» — сложения с 6 на втором шаге.

    ### Шаги
    1. Шаг 1 (в субботу): $6 \cdot 5 = 30$.
    2. Шаг 2 (за два дня): $6 + 30 = 36$.

    ### Проверка
    Обратный ход: $36 - 6 = 30$, $30 : 6 = 5$.

    ### Типичная ошибка
    Прибавить 5 вместо умножения и получить $6 + (6 + 5) = 17$ (`E-model-two-step-additive-for-mult-compare`).
  feedback:
    correct: Верно, кратное сравнение выполнено умножением, а затем найдена сумма за два дня.
    wrong:
      what: Общее число словарей за два дня вычислено неверно.
      why: При словах «в {{k}} раз больше» часто по ошибке прибавляют {{k}} вместо умножения или забывают сложить
        оба дня.
      fix: Умножьте {{a}} на {{k}} и прибавьте к результату {{a}}.
      next: Раздел T03 — таблица предлогов «на» и «в».
    misconceptions:
    - id: E-model-two-step-additive-for-mult-compare
      when:
        expr: a + a + k
      message: Слова «в {{k}} раз больше» требуют умножения {{a}} на {{k}}, а не прибавления {{k}}.
- id: R-04
  type: number
  role: refresh
  purpose: method
  level: 2
  outcome: LO-02
  sections:
  - T04
  minutes: 3
  prompt: 'В прямой задаче задумали число закладок в одной пачке, умножили его на {{a}} пачек, затем прибавили ещё
    {{c}} закладок и получили {{t}} закладок. Проверьте расчёт обратным ходом: сколько закладок в одной пачке?'
  answer: 7
  variants:
  - params:
      a: 5
      c: 10
      t: 45
    answer: 7
    solution: |
      ### Ответ
      7

      ### Идея
      Проходим цепочку с конца обратными действиями: сначала вычитаем 10 из 45, затем делим остаток на 5 пачек.

      ### Шаги
      1. Шаг 1 обратного хода (отменяем сложение): $45 - 10 = 35$.
      2. Шаг 2 обратного хода (отменяем умножение): $35 : 5 = 7$.

      ### Проверка
      Прямой ход: $7 \cdot 5 = 35$, $35 + 10 = 45$.

      ### Типичная ошибка
      Прибавить 10 к 45 вместо вычитания (`E-model-two-step-wrong-second-op`).
  - params:
      a: 6
      c: 7
      t: 55
    answer: 8
    solution: |
      ### Ответ
      8

      ### Идея
      Проходим цепочку с конца обратными действиями: сначала вычитаем 7 из 55, затем делим остаток на 6 пачек.

      ### Шаги
      1. Шаг 1 обратного хода (отменяем сложение): $55 - 7 = 48$.
      2. Шаг 2 обратного хода (отменяем умножение): $48 : 6 = 8$.

      ### Проверка
      Прямой ход: $8 \cdot 6 = 48$, $48 + 7 = 55$.

      ### Типичная ошибка
      Прибавить 7 к 55 вместо вычитания (`E-model-two-step-wrong-second-op`).
  - params:
      a: 7
      c: 7
      t: 70
    answer: 9
    solution: |
      ### Ответ
      9

      ### Идея
      Проходим цепочку с конца обратными действиями: сначала вычитаем 7 из 70, затем делим остаток на 7 пачек.

      ### Шаги
      1. Шаг 1 обратного хода (отменяем сложение): $70 - 7 = 63$.
      2. Шаг 2 обратного хода (отменяем умножение): $63 : 7 = 9$.

      ### Проверка
      Прямой ход: $9 \cdot 7 = 63$, $63 + 7 = 70$.

      ### Типичная ошибка
      Прибавить 7 к 70 вместо вычитания (`E-model-two-step-wrong-second-op`).
  hints:
  - При обратном ходе действия отменяют с конца — сначала последнее действие, затем первое.
  - Отмените прибавление {{c}} вычитанием из {{t}}, чтобы узнать число закладок в {{a}} пачках.
  - Разделите разность ({{t}} минус {{c}}) на {{a}}.
  solution: |
    ### Ответ
    7

    ### Идея
    Проходим цепочку с конца обратными действиями: сначала вычитаем 10 из 45, затем делим остаток на 5 пачек.

    ### Шаги
    1. Шаг 1 обратного хода (отменяем сложение): $45 - 10 = 35$.
    2. Шаг 2 обратного хода (отменяем умножение): $35 : 5 = 7$.

    ### Проверка
    Прямой ход: $7 \cdot 5 = 35$, $35 + 10 = 45$.

    ### Типичная ошибка
    Прибавить 10 к 45 вместо вычитания (`E-model-two-step-wrong-second-op`).
  feedback:
    correct: Верно, обратный ход восстановил размер одной пачки.
    wrong:
      what: Исходное число закладок в пачке найдено неверно.
      why: При обратном ходе нужно сначала вычесть {{c}} из {{t}}, а только потом делить на {{a}}.
      fix: Вычтите {{c}} из {{t}} и разделите полученный остаток на {{a}}.
      next: Раздел T04 — правило проверки обратным ходом.
- id: R-05
  type: choice
  role: refresh
  purpose: method
  level: 2
  outcome: LO-03
  sections:
  - T05
  minutes: 3
  prompt: В магазин привезли {{t}} блокнотов. Из них {{c}} блокнотов положили на витрину, а остальные разложили
    поровну в {{n}} коробок (по {{a}} рублей за коробку, в зале было {{b}} покупателей, на полке стояло {{k}} папок).
    Какой план верно находит число блокнотов в одной коробке?
  options:
  - id: a
    text: 'Шаг 1: 40 - 5 = 35 (блокнотов для коробок). Шаг 2: 35 : 5 = 7 (блокнотов в коробке).'
  - id: b
    text: 40 / 5 - 5 = 3
    misconception: E-model-two-step-skip-first-sub
    why: Деление выполнено до вычитания 5 блокнотов витрины; в коробки раскладывали не все 40 блокнотов, а только
      остаток 35.
  - id: c
    text: 7 * 5 = 35
    misconception: E-model-two-step-stop-after-first
    why: Найден только промежуточный остаток 35 блокнотов, но не выполнено деление на 5 коробок.
  - id: d
    text: 7 + 5 + 5 = 17
    misconception: E-model-two-step-add-instead-of-mult
    why: Вместо вычитания и деления сложены числа из условия, включая лишние данные.
  answer: a
  variants:
  - params:
      t: 40
      c: 5
      n: 5
      a: 7
      b: 5
      k: 6
    answer: a
  hints:
  - Числа про цену коробки, покупателей и папки — лишние данные, они не влияют на число блокнотов в коробке.
  - В коробки раскладывали только те блокноты, которые остались после витрины.
  - Сначала вычтите 5 из 40, а затем разделите остаток 35 на 5 коробок.
  solution: |
    ### Ответ
    Шаг 1: 40 - 5 = 35 (блокнотов для коробок). Шаг 2: 35 : 5 = 7 (блокнотов в коробке).

    ### Идея
    Отбрасываем лишние числа и сначала вычитанием находим остаток блокнотов для коробок, а затем делим его на 5 равных коробок.

    ### Шаги
    1. Шаг 1 (остаток для коробок): $40 - 5 = 35$.
    2. Шаг 2 (в одной коробке): $35 : 5 = 7$.

    ### Проверка
    Обратный ход: $7 \cdot 5 = 35$, $35 + 5 = 40$.

    ### Типичная ошибка
    Делить 40 на 5 до вычитания 5 блокнотов витрины (`E-model-two-step-skip-first-sub`).
  feedback:
    correct: Верно, лишние данные отброшены, а вычитание выполнено перед делением на 5 коробок.
    wrong:
      what: Выбран неверный план расчёта.
      why: В коробки раскладывали не все 40 блокнотов, а только остаток после витрины.
      fix: Сначала вычтите 5 из 40, а затем разделите 35 на 5.
      next: Раздел T05 — отбор нужных данных и поиск ошибки в плане.
