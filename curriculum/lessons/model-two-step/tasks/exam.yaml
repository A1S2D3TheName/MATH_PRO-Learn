    prompt: В 6 коробках лежит по 9 маркеров, и ещё 7 маркеров лежат в стакане на столе. Сколько всего маркеров?
    answer: 61
    hints:
    - В 6 равных коробках по 9 маркеров количество находится умножением.
    - Умножьте 6 на 9, а затем прибавьте 7 отдельных маркеров.
    - Найдите произведение 6 и 9 и увеличьте его на 7.
    solution: |
      ### Ответ
      61

      ### Идея
      Умножением находим маркеры в коробках, сложением — общее количество.

      ### Шаги
      1. В 6 коробках: $6 \cdot 9 = 54$.
      2. Всего маркеров: $54 + 7 = 61$.

      ### Проверка
      Обратный ход: $61 - 7 = 54$, $54 : 6 = 9$.

      ### Типичная ошибка
      Сложить $6 + 9 + 7 = 22$ вместо умножения (`E-model-two-step-add-instead-of-mult`).
    feedback:
      correct: Верно, 54 маркера в коробках и 7 в стакане дают 61 маркер.
      wrong:
        what: Общее число маркеров найдено неверно.
        why: Возможно, числа сложены вместо умножения на первом шаге.
        fix: Умножьте 6 на 9 и прибавьте 7.
        next: Раздел T02 — умножение и сложение.
