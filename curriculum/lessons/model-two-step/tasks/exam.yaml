    prompt: На первой витрине «Переплёта» стоит 26 альбомов, а на второй — на 8 альбомов меньше. Сколько всего альбомов
      стоит на двух витринах?
    answer: 44
    hints:
    - Сначала найдите промежуточный результат — сколько альбомов стоит на второй витрине.
    - Вычтите 8 из 26, а затем прибавьте полученное число к 26.
    - Найдите разность 26 и 8 и сложите её с 26.
    solution: |
      ### Ответ
      44

      ### Идея
      Вычитанием находим вторую витрину, сложением — обе витрины вместе.

      ### Шаги
      1. На второй витрине: $26 - 8 = 18$.
      2. Всего на двух витринах: $26 + 18 = 44$.

      ### Проверка
      Обратный ход: $44 - 26 = 18$, и $26 - 18 = 8$.

      ### Типичная ошибка
      Записать в ответ только число альбомов на второй витрине 18 (`E-model-two-step-stop-after-first`).
    feedback:
      correct: Верно, найдены 18 альбомов на второй витрине и общая сумма 44.
      wrong:
        what: Общее число альбомов найдено неверно.
        why: Возможно, записан только результат первого шага.
        fix: Вычтите 8 из 26 и прибавьте результат к 26.
        next: Раздел T01 — промежуточный результат.
