      Умножением находим начальный запас гравюр, вычитанием — остаток.

      ### Шаги
      1. В 7 пачках: $7 \cdot 8 = 56$.
      2. Осталось в пачках: $56 - 14 = 42$.

      ### Проверка
      Обратный ход: $42 + 14 = 56$, $56 : 7 = 8$.

      ### Типичная ошибка
      Прибавить 14 вместо вычитания (`E-model-two-step-wrong-second-op`).
    feedback:
