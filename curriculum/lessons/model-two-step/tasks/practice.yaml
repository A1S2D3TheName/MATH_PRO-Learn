# Основной банк задач (STANDARD.md §8): 25 задач основного банка + 2 задачи challenge.
tasks:
- id: P-01
  type: number
  role: warmup
  purpose: procedure
  level: 0
  outcome: LO-01
  sections:
  - T01
  minutes: 1
  prompt: На первой полке стеллажа стоит {{a}} книг, а на второй — на {{b}} книг меньше. Промежуточный результат
    (число книг на второй полке) равен разности {{a}} и {{b}}. Сколько всего книг на двух полках?
  answer: 31
  variants:
  - params:
      a: 18
      b: 5
    answer: 31
    solution: |
      ### Ответ
      31

      ### Идея
      Сначала вычитанием находим число книг на второй полке, затем складываем обе полки.

      ### Шаги
      1. На второй полке: $18 - 5 = 13$.
      2. Всего книг: $18 + 13 = 31$.

      ### Проверка
      Обратный ход: $31 - 18 = 13$, и $18 - 13 = 5$.

      ### Типичная ошибка
      Остановиться на промежуточном результате 13 (`E-model-two-step-stop-after-first`).
  - params:
      a: 20
      b: 7
    answer: 33
    solution: |
      ### Ответ
      33

      ### Идея
      Сначала вычитанием находим число книг на второй полке, затем складываем обе полки.

      ### Шаги
      1. На второй полке: $20 - 7 = 13$.
      2. Всего книг: $20 + 13 = 33$.

      ### Проверка
      Обратный ход: $33 - 20 = 13$, и $20 - 13 = 7$.

      ### Типичная ошибка
      Остановиться на промежуточном результате 13 (`E-model-two-step-stop-after-first`).
  - params:
      a: 25
      b: 6
    answer: 44
    solution: |
      ### Ответ
      44

      ### Идея
      Сначала вычитанием находим число книг на второй полке, затем складываем обе полки.

      ### Шаги
      1. На второй полке: $25 - 6 = 19$.
      2. Всего книг: $25 + 19 = 44$.

      ### Проверка
      Обратный ход: $44 - 25 = 19$, и $25 - 19 = 6$.

      ### Типичная ошибка
      Остановиться на промежуточном результате 19 (`E-model-two-step-stop-after-first`).
  hints:
  - Сначала вычислите промежуточный результат — сколько книг на второй полке.
  - Для второй полки вычтите {{b}} из {{a}}, а затем прибавьте результат к {{a}}.
  - Найдите разность {{a}} и {{b}} и сложите её с {{a}}.
  solution: |
    ### Ответ
    Сумма {{a}} и разности {{a}} и {{b}}.

    ### Идея
    Вычитанием находим вторую полку, сложением — обе полки.

    ### Шаги
    1. Из {{a}} вычитаем {{b}}.
    2. К {{a}} прибавляем полученную разность.

    ### Проверка
    Вычитание {{a}} из ответа возвращает вторую полку.

    ### Типичная ошибка
    Записать только вторую полку (`E-model-two-step-stop-after-first`).
  feedback:
    correct: Верно, найдено число книг на второй полке и общая сумма по двум полкам.
    wrong:
      what: Общее число книг найдено неверно.
      why: Возможно, записан только результат первого шага.
      fix: Вычтите {{b}} из {{a}} и прибавьте результат к {{a}}.
      next: Раздел T01 — промежуточный результат.
- id: P-02
  type: number
  role: warmup
  purpose: procedure
  level: 0
  outcome: LO-01
  sections:
  - T02
  minutes: 1
  prompt: На столе лежат {{a}} пачек по {{b}} открыток в каждой и ещё {{c}} отдельных открыток. Сколько всего открыток
    на столе?
  answer: 38
  variants:
  - params:
      a: 5
      b: 6
      c: 8
    answer: 38
    solution: |
      ### Ответ
      38

      ### Идея
      Умножением находим открытки в пачках, затем прибавляем отдельные открытки.

      ### Шаги
      1. В 5 пачках: $5 \cdot 6 = 30$.
      2. Всего открыток: $30 + 8 = 38$.

      ### Проверка
      Обратный ход: $38 - 8 = 30$, и $30 : 5 = 6$.

      ### Типичная ошибка
      Сложить $5 + 6 + 8 = 19$ (`E-model-two-step-add-instead-of-mult`).
  - params:
      a: 6
      b: 5
      c: 9
    answer: 39
    solution: |
      ### Ответ
      39

      ### Идея
      Умножением находим открытки в пачках, затем прибавляем отдельные открытки.

      ### Шаги
      1. В 6 пачках: $6 \cdot 5 = 30$.
      2. Всего открыток: $30 + 9 = 39$.

      ### Проверка
      Обратный ход: $39 - 9 = 30$, и $30 : 6 = 5$.

      ### Типичная ошибка
      Сложить $6 + 5 + 9 = 20$ (`E-model-two-step-add-instead-of-mult`).
  - params:
      a: 7
      b: 6
      c: 5
    answer: 47
    solution: |
      ### Ответ
      47

      ### Идея
      Умножением находим открытки в пачках, затем прибавляем отдельные открытки.

      ### Шаги
      1. В 7 пачках: $7 \cdot 6 = 42$.
      2. Всего открыток: $42 + 5 = 47$.

      ### Проверка
      Обратный ход: $47 - 5 = 42$, и $42 : 7 = 6$.

      ### Типичная ошибка
      Сложить $7 + 6 + 5 = 18$ (`E-model-two-step-add-instead-of-mult`).
  hints:
  - Пачки содержат равные группы по {{b}} открыток — это табличное умножение.
  - Сначала умножьте {{a}} на {{b}}, затем прибавьте {{c}} отдельных открыток.
  - Найдите произведение {{a}} и {{b}} и увеличьте его на {{c}}.
  solution: |
    ### Ответ
    Сумма произведения {{a}} на {{b}} и числа {{c}}.

    ### Идея
    Умножением находим пачки, сложением — общий итог.

    ### Шаги
    1. Умножаем {{a}} на {{b}}.
    2. Прибавляем {{c}}.

    ### Проверка
    Вычитаем {{c}} из итога и делим на {{a}}.

    ### Типичная ошибка
    Сложить все три числа (`E-model-two-step-add-instead-of-mult`).
  feedback:
    correct: Верно, произведение равных групп сложено с отдельными открытками.
    wrong:
      what: Общее число открыток не совпало.
      why: Возможно, числа сложены вместо умножения или забыт второй шаг.
      fix: Умножьте {{a}} на {{b}} и прибавьте {{c}}.
      next: Раздел T02 — умножение и сложение.
    misconceptions:
    - id: E-model-two-step-stop-after-first
      when:
        expr: a * b
      message: Вы нашли число открыток в пачках, но забыли прибавить {{c}} отдельных открыток.
    - id: E-model-two-step-add-instead-of-mult
      when:
        expr: a + b + c
      message: Для {{a}} пачек по {{b}} открыток нужно умножать {{a}} на {{b}}, а не складывать.
- id: P-03
  type: choice
  role: warmup
  purpose: meaning
  level: 0
  outcome: LO-01
  sections:
  - T01
  - T02
  minutes: 1
  prompt: В {{a}} стопках лежит по {{b}} тетрадей, а на столе лежат ещё {{c}} тетрадей (на {{k}} меньше десятка).
    Какое равенство показывает верный второй шаг и итоговый ответ после первого шага $5 \cdot 7 = 35$?
  options:
  - id: a
    text: 35 + 6 = 41
  - id: b
    text: 5 * 7 = 35
    misconception: E-model-two-step-stop-after-first
    why: Записан только промежуточный результат первого шага без прибавления 6 тетрадей.
  - id: c
    text: 5 + 7 + 6 = 18
    misconception: E-model-two-step-add-instead-of-mult
    why: Число стопок 5 сложено с размером стопки 7 вместо умножения.
  - id: d
    text: 5 + 5 + 4 = 14
    misconception: E-model-two-step-additive-for-mult-compare
    why: Вместо произведения стопок взята сумма двух пятёрок и четвёрки.
  answer: a
  variants:
  - params:
      a: 5
      b: 7
      c: 6
      k: 4
    answer: a
  hints:
  - Первый шаг уже дал 35 тетрадей в стопках.
  - На втором шаге нужно присоединить к 35 тетрадям ещё 6 тетрадей со стола.
  - Выберите равенство, в котором к 35 прибавляется 6.
  solution: |
    ### Ответ
    35 + 6 = 41

    ### Идея
    Второй шаг использует промежуточный результат 35 и прибавляет к нему 6 отдельных тетрадей.

    ### Шаги
    1. В {{a}} стопках по {{b}} тетрадей: $5 \cdot 7 = 35$.
    2. Прибавляем {{c}} тетрадей на столе: $35 + 6 = 41$ (число {{k}} не влияет на счёт).

    ### Проверка
    Обратный ход: $41 - 6 = 35$ и $35 : 5 = 7$.

    ### Типичная ошибка
    Остановиться на первом действии $5 \cdot 7 = 35$ (`E-model-two-step-stop-after-first`).
  feedback:
    correct: Верно, второй шаг прибавляет 6 тетрадей к промежуточному результату 35.
    wrong:
      what: Выбрано неверное равенство второго шага.
      why: Возможно, выбран только первый шаг или числа сложены вместо умножения.
      fix: Прибавьте 6 тетрадей со стола к 35 тетрадям из стопок.
      next: Раздел T01 — связь первого и второго шага.
- id: P-04
  type: number
  role: supported
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T01
  minutes: 1
  prompt: В запасе кофейни было {{a}} бумажных стаканов. Утром израсходовали {{b}} стаканов, а днём — ещё {{c}}
    стаканов. Сколько стаканов осталось в запасе?
  answer: 21
  variants:
  - params:
      a: 48
      b: 12
      c: 15
    answer: 21
    solution: |
      ### Ответ
      21

      ### Идея
      Сначала складываем расход за утро и день, затем вычитаем сумму из начального запаса.

      ### Шаги
      1. Израсходовали всего: $12 + 15 = 27$.
      2. Осталось: $48 - 27 = 21$.

      ### Проверка
      Последовательное вычитание: $48 - 12 = 36$, $36 - 15 = 21$.

      ### Типичная ошибка
      Остановиться на сумме расхода 27 (`E-model-two-step-stop-after-first`).
  - params:
      a: 56
      b: 14
      c: 18
    answer: 24
    solution: |
      ### Ответ
      24

      ### Идея
      Сначала складываем расход за утро и день, затем вычитаем сумму из начального запаса.

      ### Шаги
      1. Израсходовали всего: $14 + 18 = 32$.
      2. Осталось: $56 - 32 = 24$.

      ### Проверка
      Последовательное вычитание: $56 - 14 = 42$, $42 - 18 = 24$.

      ### Типичная ошибка
      Остановиться на сумме расхода 32 (`E-model-two-step-stop-after-first`).
  - params:
      a: 65
      b: 16
      c: 19
    answer: 30
    solution: |
      ### Ответ
      30

      ### Идея
      Сначала складываем расход за утро и день, затем вычитаем сумму из начального запаса.

      ### Шаги
      1. Израсходовали всего: $16 + 19 = 35$.
      2. Осталось: $65 - 35 = 30$.

      ### Проверка
      Последовательное вычитание: $65 - 16 = 49$, $49 - 19 = 30$.

      ### Типичная ошибка
      Остановиться на сумме расхода 35 (`E-model-two-step-stop-after-first`).
  hints:
  - Удобно сначала узнать промежуточный результат — сколько всего стаканов израсходовали за утро и день.
  - Сложите {{b}} и {{c}}, а затем вычтите полученную сумму из {{a}}.
  - Вычислите сумму {{b}} и {{c}} и отнимите её от {{a}}.
  solution: |
    ### Ответ
    Разность {{a}} и суммы {{b}} и {{c}}.

    ### Идея
    Складываем израсходованные стаканы и вычитаем из {{a}}.

    ### Шаги
    1. Складываем {{b}} и {{c}}.
    2. Из {{a}} вычитаем полученную сумму.

    ### Проверка
    Прибавим к остатку {{b}} и {{c}} — получим {{a}}.

    ### Типичная ошибка
    Остановиться на сумме расхода (`E-model-two-step-stop-after-first`).
  feedback:
    correct: Верно, из начального запаса вычтено общее число израсходованных стаканов.
    wrong:
      what: Остаток стаканов найден неверно.
      why: Возможно, вычтена только одна часть или записан сам расход.
      fix: Сложите {{b}} и {{c}}, затем вычтите эту сумму из {{a}}.
      next: Раздел T01 — пример 2.
- id: P-05
  type: number
  role: supported
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T02
  minutes: 1
  prompt: Для читателей подготовили {{a}} наборов по {{b}} закладок в каждом. За первый час раздали {{c}} закладок.
    Сколько закладок осталось?
  answer: 33
  variants:
  - params:
      a: 6
      b: 7
      c: 9
    answer: 33
    solution: |
      ### Ответ
      33

      ### Идея
      Умножением находим общее число закладок в наборах, затем вычитаем розданные.

      ### Шаги
      1. В 6 наборах: $6 \cdot 7 = 42$.
      2. Осталось: $42 - 9 = 33$.

      ### Проверка
      Обратный ход: $33 + 9 = 42$, $42 : 6 = 7$.

      ### Типичная ошибка
      Прибавить 9 вместо вычитания и получить 51 (`E-model-two-step-wrong-second-op`).
  - params:
      a: 7
      b: 8
      c: 12
    answer: 44
    solution: |
      ### Ответ
      44

      ### Идея
      Умножением находим общее число закладок в наборах, затем вычитаем розданные.

      ### Шаги
      1. В 7 наборах: $7 \cdot 8 = 56$.
      2. Осталось: $56 - 12 = 44$.

      ### Проверка
      Обратный ход: $44 + 12 = 56$, $56 : 7 = 8$.

      ### Типичная ошибка
      Прибавить 12 вместо вычитания и получить 68 (`E-model-two-step-wrong-second-op`).
  - params:
      a: 8
      b: 6
      c: 15
    answer: 33
    solution: |
      ### Ответ
      33

      ### Идея
      Умножением находим общее число закладок в наборах, затем вычитаем розданные.

      ### Шаги
      1. В 8 наборах: $8 \cdot 6 = 48$.
      2. Осталось: $48 - 15 = 33$.

      ### Проверка
      Обратный ход: $33 + 15 = 48$, $48 : 8 = 6$.

      ### Типичная ошибка
      Прибавить 15 вместо вычитания и получить 63 (`E-model-two-step-wrong-second-op`).
  hints:
  - Сначала узнайте промежуточный результат — сколько всего закладок было в {{a}} наборах по {{b}} штук.
  - Когда закладки раздают, их количество уменьшается — на втором шаге нужно вычитание.
  - Умножьте {{a}} на {{b}}, а затем вычтите {{c}}.
  solution: |
    ### Ответ
    Разность произведения {{a}} на {{b}} и числа {{c}}.

    ### Идея
    Умножением находим запас, вычитанием — остаток.

    ### Шаги
    1. Умножаем {{a}} на {{b}}.
    2. Вычитаем {{c}}.

    ### Проверка
    К остатку прибавляем {{c}} и делим на {{a}}.

    ### Типичная ошибка
    Прибавить {{c}} вместо вычитания (`E-model-two-step-wrong-second-op`).
  feedback:
    correct: Верно, из общего числа закладок в наборах вычтены розданные закладки.
    wrong:
      what: Остаток закладок найден неверно.
      why: Возможно, на втором шаге выполнено сложение вместо вычитания.
      fix: Умножьте {{a}} на {{b}} и вычтите {{c}}.
      next: Раздел T02 — умножение и вычитание.
    misconceptions:
    - id: E-model-two-step-stop-after-first
      when:
        expr: a * b
      message: Вы нашли общее число закладок в наборах, но не вычли {{c}} розданных закладок.
    - id: E-model-two-step-wrong-second-op
      when:
        expr: a * b + c
      message: 'Закладки раздали, поэтому их стало меньше: нужно вычесть {{c}}, а не прибавлять.'
- id: P-06
  type: number
  role: supported
  purpose: method
  level: 1
  outcome: LO-01
  sections:
  - T02
  minutes: 1
  prompt: В читальню доставили {{t}} журналов. Из них {{c}} журналов положили на круглый стол, а остальные разложили
    поровну в {{n}} стопок. Сколько журналов в каждой стопке?
  answer: 6
  variants:
  - params:
      t: 45
      c: 9
      n: 6
    answer: 6
    solution: |
      ### Ответ
      6

      ### Идея
      Вычитаем журналы для круглого стола, затем делим остаток поровну на стопки.

      ### Шаги
      1. Осталось для стопок: $45 - 9 = 36$.
      2. В одной стопке: $36 : 6 = 6$.

      ### Проверка
      Обратный ход: $6 \cdot 6 = 36$, $36 + 9 = 45$.

      ### Типичная ошибка
      Остановиться на остатке 36 (`E-model-two-step-stop-after-first`).
  - params:
      t: 57
      c: 8
      n: 7
    answer: 7
    solution: |
      ### Ответ
      7

      ### Идея
      Вычитаем журналы для круглого стола, затем делим остаток поровну на стопки.

      ### Шаги
      1. Осталось для стопок: $57 - 8 = 49$.
      2. В одной стопке: $49 : 7 = 7$.

      ### Проверка
      Обратный ход: $7 \cdot 7 = 49$, $49 + 8 = 57$.

      ### Типичная ошибка
      Остановиться на остатке 49 (`E-model-two-step-stop-after-first`).
  - params:
      t: 68
      c: 12
      n: 7
    answer: 8
    solution: |
      ### Ответ
      8

      ### Идея
      Вычитаем журналы для круглого стола, затем делим остаток поровну на стопки.

      ### Шаги
      1. Осталось для стопок: $68 - 12 = 56$.
      2. В одной стопке: $56 : 7 = 8$.

      ### Проверка
      Обратный ход: $8 \cdot 7 = 56$, $56 + 12 = 68$.

      ### Типичная ошибка
      Остановиться на остатке 56 (`E-model-two-step-stop-after-first`).
  hints:
  - В стопки раскладывали не все {{t}} журналов, а только оставшиеся после круглого стола.
  - Первым шагом найдите остаток вычитанием {{c}} из {{t}}, вторым шагом разделите его на {{n}}.
  - Вычтите {{c}} из {{t}} и разделите полученное число на {{n}}.
  solution: |
    ### Ответ
    Частное от деления разности {{t}} и {{c}} на {{n}}.

    ### Идея
    Вычитанием находим остаток, делением — размер стопки.

    ### Шаги
    1. Вычитаем {{c}} из {{t}}.
    2. Делим остаток на {{n}}.

    ### Проверка
    Умножаем ответ на {{n}} и прибавляем {{c}}.

    ### Типичная ошибка
    Делить до вычитания {{c}} (`E-model-two-step-skip-first-sub`).
  feedback:
    correct: Верно, сначала найден остаток после круглого стола, а затем выполнено деление на стопки.
    wrong:
      what: Число журналов в одной стопке найдено неверно.
      why: Возможно, не вычтены {{c}} журналов перед делением.
      fix: Сначала вычтите {{c}} из {{t}}, затем разделите на {{n}}.
      next: Раздел T02 — вычитание и деление.
- id: P-07
  type: number
  role: supported
  purpose: meaning
  level: 1
  outcome: LO-02
  sections:
  - T03
  minutes: 1
  prompt: В малой коробке лежит {{a}} карандашей, а в большой — в {{k}} раз больше. Сколько всего карандашей в обеих
    коробках?
  answer: 36
  variants:
  - params:
      a: 6
      k: 5
    answer: 36
