      a: 5
      b: 6
      c: 5
      d: 10
      k: 5
      n: 5
      m: 7
    answer: 35
    solution: |
      ### Ответ
      35

      ### Идея
      Сначала умножением находим число каталогов в 5 коробках по 6 штук, а затем прибавляем 5 запасных каталогов.

      ### Шаги
      1. Шаг 1 (в 5 коробках): $5 \cdot 6 = 30$.
      2. Шаг 2 (всего каталогов): $30 + 5 = 35$.

      ### Проверка
      Обратный ход: $35 - 5 = 30$, $30 : 5 = 6$.

      ### Типичная ошибка
      Сложить $5 + 6 + 5 = 16$ вместо умножения (`E-model-two-step-add-instead-of-mult`).
