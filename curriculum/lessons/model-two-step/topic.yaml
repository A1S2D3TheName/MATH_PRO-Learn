# Паспорт темы (STANDARD.md §3). Поля section/stage/hours/grade/prerequisites скопированы из
# tree.yaml дословно (правило 6).
id: model-two-step
title: "Двухшаговые задачи и выбор операций"
section: model
stage: 1
hours: 3
grade: "2–3"
prerequisites: [model-one-step, num-mult-table]
version: "1.0.0"
summary: >
  Двухшаговая задача не решается одним действием: сначала по условию находят промежуточный
  результат, а затем по нему вычисляют итоговый ответ. Тема соединяет все четыре арифметических
  действия, разностное и кратное сравнение и проверку ответа решением обратной задачи.

search:
  synonyms:
    - двухшаговые текстовые задачи
    - задачи в два действия
    - промежуточный результат в задаче
    - план решения текстовой задачи
    - кратное сравнение в задаче
    - разностное и кратное сравнение
    - во сколько раз больше или меньше
    - проверка решением обратной задачи
    - выбор действий в текстовой задаче
    - составные задачи на четыре действия
    - скрытый вопрос в задаче
    - решение задачи по шагам
  questions:
    - Как отличить задачу в два действия от одношаговой?
    - Что такое промежуточный результат в текстовой задаче?
    - Как составить план решения двухшаговой задачи?
    - Чем кратное сравнение отличается от разностного?
    - Когда в задаче нужно умножать, а когда складывать?
    - Почему в некоторых задачах сначала вычитают, а потом делят?
    - Как проверить решение задачи с помощью обратной задачи?
    - Как решить двухшаговую задачу двумя разными способами?
    - Как не перепутать предлоги «на сколько» и «во сколько раз»?

subtopics:
  - id: model-two-step/plan-resheniya-i-promezhutochnyy
    title: "План решения и промежуточный результат"
    tree_ref: "План решения и промежуточный результат"
    synonyms: [скрытый вопрос задачи, первое и второе действие, цепочка из двух шагов]
    sections: [T01, T05]
  - id: model-two-step/sochetanie-dvuh-deystviy
    title: "Сочетание двух действий"
    tree_ref: "Сочетание двух действий"
    synonyms: [комбинация умножения и сложения, деление после вычитания, задачи на четыре операции]
    sections: [T02, T05]
  - id: model-two-step/zadachi-na-raznostnoe-i
    title: "Задачи на разностное и кратное сравнение"
    tree_ref: "Задачи на разностное и кратное сравнение"
    synonyms: [на сколько и во сколько раз, кратное сравнение групп, сравнение на двух полосах]
    sections: [T03]
  - id: model-two-step/proverka-resheniem-obratnoy-zadachi
    title: "Проверка решением обратной задачи"
    tree_ref: "Проверка решением обратной задачи"
    synonyms: [обратный ход по шагам, проверка текстовой задачи, восстановление исходного данного]
    sections: [T04]

outcomes:
  - id: LO-01
    short: Находит промежуточный результат и итог
    action: выделяет в двухшаговой задаче промежуточный вопрос, вычисляет промежуточный результат и итоговый ответ в два действия
    conditions: даны целые неотрицательные числа в пределах 100 и табличные случаи умножения и деления; условие содержит два связанных шага
    criterion: верно указывает промежуточный результат первого шага и итоговое число второго шага с единицей счёта
    level: core
    sections:
      - T01
      - T02
  - id: LO-02
    short: Сравнивает разностно и кратно, проверяет
    action: решает двухшаговые задачи с разностным и кратным сравнением и проверяет найденный ответ решением обратной задачи
    conditions: даны целые числа в пределах 100, обороты «на k больше/меньше» и «в k раз больше/меньше», табличные случаи умножения и деления
    criterion: верно выбирает сложение или вычитание для разностного сравнения и умножение или деление для кратного, находит итог и подтверждает его обратной задачей
    level: standard
    sections:
      - T03
      - T04
  - id: LO-03
    short: Строит два плана и находит ошибку в шаге
    action: сравнивает два разных плана решения одной двухшаговой задачи, отбирает нужные данные при лишних числах и находит неверный шаг в готовом решении
    conditions: даны текстовые условия в пределах 100 с несколькими равными группами, лишним данным или готовым двухшаговым расчётом
    criterion: получает одинаковый ответ двумя допустимыми планами, указывает первое неверное действие и восстанавливает исходное данное обратным ходом
    level: deep
    sections:
      - T01
      - T02
      - T05

errors:
  - E-model-two-step-stop-after-first
  - E-model-two-step-add-instead-of-mult
  - E-model-two-step-additive-for-mult-compare
  - E-model-two-step-wrong-second-op
  - E-model-two-step-skip-first-sub
