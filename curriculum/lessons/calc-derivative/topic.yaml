  - E-calc-derivative-constant-differentiated
  - E-calc-derivative-constant-not-cancelled
  - E-calc-derivative-shifted-value-instead
  - E-calc-derivative-cube-value-instead
  - E-calc-derivative-polynomial-value-instead
  - E-calc-derivative-numerator-limit-instead
