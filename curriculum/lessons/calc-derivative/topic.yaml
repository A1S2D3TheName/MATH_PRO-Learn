id: calc-derivative
title: "Производная — предел, скорость, наклон касательной"
section: calc
stage: 6
hours: 4
grade: "10–11"
prerequisites: [calc-continuity, model-rate]
version: "1.0.0"
summary: >
  Производная — это число, к которому подходит отношение приращений функции и аргумента, когда шаг
  уменьшается. Одно и то же число читается тремя способами: как предел, как мгновенная скорость
  и как наклон касательной.

search:
  synonyms:
    - производная
    - производная функции
    - приращение аргумента
    - приращение функции
    - разностное отношение
    - отношение приращений
    - предел отношения приращений
    - мгновенная скорость
    - скорость изменения функции
    - наклон касательной
    - угловой коэффициент касательной
    - касательная к графику
    - как найти производную через предел
  questions:
    - Что такое производная функции?
    - Как найти производную через предел?
    - Что такое приращение аргумента и приращение функции?
    - Почему предел отношения приращений даёт наклон касательной?
    - Как связаны производная и мгновенная скорость?
    - Как вычислить мгновенную скорость по закону движения?
    - Зачем в определении производной нужен предел?
    - Чем средняя скорость отличается от мгновенной?

subtopics:
  - id: calc-derivative/increments
    title: "Приращение аргумента и приращение функции"
    tree_ref: "Приращение аргумента и приращение функции"
    synonyms: [дельта икс, дельта игрек, изменение аргумента, изменение функции]
    sections: [T01]
  - id: calc-derivative/limit-of-quotient
    title: "Отношение приращений и его предел"
    tree_ref: "Отношение приращений и его предел"
    synonyms: [разностное отношение, средняя скорость изменения, предел разностного отношения]
    sections: [T02]
  - id: calc-derivative/speed-and-slope
    title: "Производная как мгновенная скорость и как наклон"
    tree_ref: "Производная как мгновенная скорость и как наклон"
    synonyms: [мгновенная скорость, наклон касательной, угловой коэффициент касательной]
    sections: [T03]
  - id: calc-derivative/three-views
    title: "Три представления производной и переход между ними"
    tree_ref: "Три представления производной и переход между ними"
    synonyms: [предел и скорость и наклон, переход между представлениями, три языка производной]
    sections: [T04]

outcomes:
  - id: LO-01
    short: Находит приращения и среднюю скорость
    action: вычисляет приращение функции и отношение приращений по формуле, таблице и графику
    conditions: многочлены степени не выше третьей, шаг задан числом или парой точек на графике
    criterion: верный ответ и верный знак приращения в четырёх случаях из пяти
    level: core
    sections: [T01, T02]
  - id: LO-02
    short: Находит производную через предел
    action: выводит производную функции через предел отношения приращений и вычисляет её значение в точке
    conditions: многочлены степени не выше третьей и (в задаче-вызове) функция корень из x, точка и шаг заданы числами
    criterion: предел найден и вычислен без опоры на таблицу производных в четырёх случаях из пяти
    level: standard
    sections: [T02, T03]
  - id: LO-03
    short: Связывает три представления производной
    action: переводит производную с языка предела на язык скорости и наклона касательной и обратно
    conditions: графики, законы движения, многочлены и функции с изломом (модуль)
    criterion: переход выполнен в обе стороны с объяснением выбора представления в четырёх случаях из пяти
    level: deep
    sections: [T03, T04]

errors:
  - E-calc-derivative-square-sum
