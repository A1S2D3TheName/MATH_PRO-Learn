variants:
  - id: A
    tasks:
      - id: EA-01
        type: number
        role: exam
        purpose: procedure
        level: 1
        outcome: LO-01
        sections:
          - T01
        minutes: 2
        points: 1
        prompt: Функция $f(x) = x^2$, точка $x_0 = 4$, сдвиг $\Delta x = 3$. Найдите приращение функции $\Delta
          y$.
        answer: 33
        hints:
          - Приращение — разность значений функции в двух точках.
          - Новая точка равна 7.
          - Вычтите $f(4)$ из $f(7)$.
        solution: |
          ### Ответ
          $\Delta y = 49 - 16 = 33$.

          ### Идея
          Считаем значения функции в двух точках.

          ### Шаги
          1. $f(7) = 49$.
          2. $f(4) = 16$.
          3. $\Delta y = 33$.

          ### Проверка
          Приращение положительно: функция при сдвиге вправо растёт.

          ### Типичная ошибка
          Раскрывать квадрат покомпонентно.
          Общий код ошибки — `E-calc-derivative-square-sum`.
        feedback:
          correct: 'Верно: приращение функции найдено.'
          wrong:
            what: Приращение посчитано неверно.
            why: Возможно, потеряно удвоенное произведение.
            fix: Вычислите значения в двух точках и вычтите.
            next: Раздел T01.
      - id: EA-02
        type: number
        role: exam
        purpose: procedure
        level: 1
        outcome: LO-01
        sections:
          - T02
        minutes: 2
        points: 1
        prompt: Функция $f(x) = x^2$, точка $x_0 = 5$, сдвиг $\Delta x = 2$. Найдите отношение приращений $\Delta
          y / \Delta x$.
        answer: 12
        hints:
          - Сначала найдите приращение функции.
          - 'Новая точка равна 7: вычислите $(7)^2 - 5^2$.' 
          - Разделите приращение функции на шаг 2.
        solution: |
          ### Ответ
          $\Delta y/\Delta x = 2 \cdot 5 + 2 = 12$.

          ### Идея
          Отношение приращений для квадрата равно $2x_0 + \Delta x$.

          ### Шаги
          1. $2x_0 = 10$.
          2. Прибавляем шаг 2: получаем 12.

          ### Проверка
          При шаге 2 наклон секущей больше предела $2x_0 = 10$.

          ### Типичная ошибка
          Переворачивать дробь.
          Общий код ошибки — `E-calc-derivative-inverse-quotient`.
        feedback:
          correct: 'Верно: отношение приращений найдено.'
          wrong:
            what: Отношение посчитано неверно.
            why: Возможно, взято приращение функции без деления на шаг.
            fix: Разделите приращение функции на приращение аргумента.
            next: Раздел T02.
      - id: EA-03
        type: number
        role: exam
        purpose: procedure
        level: 1
        outcome: LO-02
        sections:
          - T02
        minutes: 2
        points: 1
        prompt: Найдите $f'(8)$ для функции $f(x) = x^2 + 5$.
        answer: 16
        hints:
          - Производная показывает скорость изменения функции.
          - Найдите производную $x^2$ по определению, затем посмотрите на слагаемое 5.
          - Постоянное слагаемое в приращении сокращается.
        solution: |
          ### Ответ
          $f'(8) = 2 \cdot 8 = 16$.

          ### Идея
          Постоянное слагаемое не влияет на производную.

          ### Шаги
          1. $\Delta y = (8 + \Delta x)^2 + 5 - (8^2 + 5) = 16\Delta x + (\Delta x)^2$.
          2. $\Delta y/\Delta x = 16 + \Delta x$.
          3. Предел равен 16.

          ### Проверка
          При шаге $\Delta x = 1$ отношение равно 17 — на единицу больше предела, как у параболы.

          ### Типичная ошибка
          Дифференцировать постоянное слагаемое.
          Общий код ошибки — `E-calc-derivative-constant-differentiated`.
        feedback:
          correct: 'Верно: пятёрка в производной не появляется.'
          wrong:
            what: Производная в точке не совпала.
            why: Возможно, в производную попало свободное слагаемое или подставлено значение функции.
            fix: Вычтите значения функции в двух точках.
            next: Раздел T02.
          misconceptions:
            - id: E-calc-derivative-constant-differentiated
              when:
                expr: 2*8 + 5
              message: 'Свободное слагаемое продифференцировано как переменное: $2 \cdot 8 + 5 = 21$.'
            - id: E-calc-derivative-shifted-value-instead
              when:
                expr: 8^2 + 5
              message: 'Подставлено значение функции вместо производной: $f(8) = 69$.'
            - id: E-calc-derivative-multiplier-lost
              when:
                expr: '8'
              message: 'Потерян множитель 2: ответ совпал с $x_0$ вместо $2x_0$.'
        errors:
          - E-calc-derivative-constant-differentiated
          - E-calc-derivative-shifted-value-instead
          - E-calc-derivative-multiplier-lost
      - id: EA-04
        type: number
        role: exam
        purpose: procedure
        level: 2
        outcome: LO-02
        sections:
          - T02
        minutes: 2
        points: 1
        prompt: Функция $f(x) = x^2$. Найдите $f'(x_0)$ в точке $x_0 = 6$.
        answer: 12
        hints:
          - Производная — предел отношения приращений.
          - Запишите приращение функции и упростите дробь.
          - 'Многочлен от шага непрерывен: предел равен значению при $\Delta x = 0$.' 
        solution: |
          ### Ответ
          $f'(6) = 2 \cdot 6 = 12$.

          ### Идея
          Вычисляем производную по определению — как предел отношения приращений.

          ### Шаги
          1. $\Delta y = (6 + \Delta x)^2 - 36 = 12\Delta x + (\Delta x)^2$.
          2. $\Delta y/\Delta x = 12 + \Delta x$ при $\Delta x \ne 0$.
          3. Предел равен 12.

          ### Проверка
          При шаге $\Delta x = 1$ отношение равно 13 — на 1 больше предела.

          ### Типичная ошибка
          Терять множитель 2.
          Общий код ошибки — `E-calc-derivative-multiplier-lost`.
        feedback:
          correct: 'Верно: производная квадрата равна $2x_0$.'
          wrong:
            what: Производная найдена неверно.
            why: Возможно, потерян множитель 2.
            fix: Сократите дробь заново.
            next: Раздел T02.
      - id: EA-05
        type: number
        role: exam
        purpose: method
        level: 2
        outcome: LO-02
        sections:
          - T02
        minutes: 3
        points: 1
        prompt: Функция $f(x) = 4x - 3$. Найдите её производную $f'(x)$.
        answer: 4
        hints:
          - У линейной функции скорость изменения постоянна.
          - Сравните значения функции в точках $x$ и $x + \Delta x$.
          - Запишите приращение $f(x + \Delta x) - f(x)$ и раскройте скобки.
        solution: |
          ### Ответ
          $f'(x) = 4$.

          ### Идея
          Приращение линейной функции пропорционально шагу.

          ### Шаги
          1. $\Delta y = 4\Delta x$.
          2. $\Delta y/\Delta x = 4$.
          3. Предел постоянной равен ей самой.

          ### Проверка
          Свободное слагаемое $-3$ на наклон не влияет.

          ### Типичная ошибка
          Оставлять свободное слагаемое в производной.
          Общий код ошибки — `E-calc-derivative-constant-differentiated`.
        feedback:
          correct: 'Верно: производная линейной функции — коэффициент при $x$.'
          wrong:
            what: Производная найдена неверно.
            why: Возможно, в ответе осталось свободное слагаемое.
            fix: Найдите приращение функции и разделите на шаг.
            next: Раздел T02.
      - id: EA-06
        type: numbers
        role: exam
        purpose: procedure
        level: 2
        outcome: LO-03
        sections:
          - T03
        minutes: 3
        points: 1
        prompt: Тело движется по закону $s(t) = 5t^2$ (метры, секунды). Найдите мгновенную скорость в момент 2 с
          и среднюю скорость на отрезке от 2 до 4 с. Ответы введите в м/с.
        answer:
          v: 20
          avg: 30
        fields:
          - id: v
            label: Мгновенная скорость в момент 2 с
            unit: м/с
          - id: avg
            label: Средняя скорость на отрезке [2; 4]
            unit: м/с
        hints:
          - Мгновенная скорость — предел отношения приращений пути и времени.
          - Для $s(t) = 5t^2$ отношение равно $5(2t_0 + h)$.
          - Средняя скорость — значение отношения при шаге $h = 2$.
        solution: |
          ### Ответ
          Мгновенная скорость 20 м/с, средняя на отрезке — 30 м/с.

          ### Идея
          Считаем отношение приращений и берём предел и значение при шаге 2.

          ### Шаги
          1. $\Delta s/\Delta t = 5(2t_0 + h) = 20 + 5h$.
          2. При $h \to 0$: 20 м/с.
          3. При $h = 2$: 30 м/с.

          ### Проверка
          Средняя скорость больше мгновенной в начале отрезка: тело разгоняется.

          ### Типичная ошибка
          Считать среднюю скорость равной мгновенной.
          Общий код ошибки — `E-calc-derivative-finite-step`.
        feedback:
          correct: 'Верно: обе скорости найдены из отношения приращений.'
          wrong:
            what: Одна из скоростей неверна.
            why: Возможно, средняя скорость взята как мгновенная.
            fix: Подставьте нужное значение шага в отношение приращений.
            next: Раздел T03.
      - id: EA-07
        type: number
        role: exam
        purpose: procedure
        level: 2
        outcome: LO-03
        sections:
          - T03
        minutes: 2
        unit: км/ч
        points: 1
        prompt: Тело движется по закону $s(t) = 5t^2$ (путь в метрах, время в секундах). Найдите мгновенную
          скорость в момент 3 с и выразите её в километрах в час.
        answer: 108
        hints:
          - Мгновенная скорость — это производная пути, то есть предел отношения $\Delta s / \Delta t$.
          - Запишите отношение приращений, упростите и найдите предел — это скорость в м/с.
          - 'Переведите м/с в км/ч: в одном часе 3600 секунд, в одном километре 1000 метров.' 
        solution: |
          ### Ответ
          30 м/с = 108 км/ч.

          ### Идея
          Сначала берём производную пути — она и есть мгновенная скорость, — затем переводим единицы.

          ### Шаги
          1. $\Delta s = 5(3 + \Delta t)^2 - 5 \cdot 3^2 = 30\Delta t + 5(\Delta t)^2$.
          2. $\dfrac{\Delta s}{\Delta t} = 30 + 5\Delta t$, предел при $\Delta t \to 0$ равен 30 м/с.
          3. Перевод: $30 \cdot 3{,}6 = 108$ км/ч.

          ### Проверка
          Проверка: 20 м/с — это 72 км/ч, значит 30 м/с больше 72 и меньше 144.

          ### Типичная ошибка
          Делить на 3,6 вместо умножения.
        feedback:
          correct: 'Верно: производная дала 30 м/с, умножение на 3,6 перевело их в км/ч.'
          wrong:
            what: Скорость или перевод единиц найдены неверно.
            why: Возможно, вместо предела отношения приращений взято его значение при конечном шаге либо множитель 3,6 применён делением.
            fix: Получите 30 м/с из предела, затем умножьте на $3600/1000 = 3{,}6$.
            next: Пример 1 раздела T03.
      - id: EA-08
        type: number
        role: exam
        purpose: procedure
        level: 3
        outcome: LO-01
        sections:
          - T01
          - T02
        minutes: 3
        points: 2
        prompt: Функция $f(x) = x^2$. Найдите среднюю скорость изменения функции на отрезке от 3 до 5.
        answer: 8
        hints:
          - Средняя скорость изменения — отношение приращений.
          - Приращение функции равно $25 - 9$.
          - Делите приращение функции на длину отрезка.
        solution: |
          ### Ответ
          Средняя скорость изменения равна 8.

          ### Идея
          Считаем отношение приращений на отрезке.

          ### Шаги
          1. $\Delta y = 25 - 9 = 16$.
          2. $\Delta x = 5 - 3 = 2$.
          3. Отношение равно 8.

          ### Проверка
          То же даёт формула $x_0 + x_1 = 8$.

          ### Типичная ошибка
          Делить длину отрезка на приращение функции.
          Общий код ошибки — `E-calc-derivative-inverse-quotient`.
        feedback:
          correct: 'Верно: отношение приращений найдено.'
          wrong:
            what: Средняя скорость изменения неверна.
            why: Возможно, дробь перевёрнута.
            fix: Делите $\Delta y$ на $\Delta x$.
            next: Раздел T02.
      - id: EA-09
        type: match
        role: exam
        purpose: meaning
        level: 3
        outcome: LO-03
        sections:
          - T04
        minutes: 3
        points: 2
        prompt: Сопоставьте запись производной и её прочтение.
        answer:
          - left: lim
            right: r-num
          - left: speed
            right: r-speed
          - left: slope
            right: r-slope
        left:
          - id: lim
            text: $\lim\limits_{\Delta x \to 0} \dfrac{\Delta y}{\Delta x}$
          - id: speed
            text: скорость спидометра в момент
          - id: slope
            text: наклон касательной
        right:
          - id: r-num
            text: число, к которому подходят отношения на уменьшающихся промежутках
          - id: r-speed
            text: мгновенная скорость движения
          - id: r-slope
            text: угловой коэффициент касательной
          - id: r-avg
            text: средняя скорость на всём отрезке
        hints:
          - Все три записи говорят об одном числе.
          - Исходное определение — предел отношения приращений.
          - Лишняя карточка описывает среднюю скорость без предела.
        solution: |
          ### Ответ
          Предел → число, скорость → мгновенная скорость, наклон → угловой коэффициент.

          ### Идея
          Различаем три языка описания одной величины.

          ### Шаги
          1. Предел — определение производной.
          2. В движении производная даёт мгновенную скорость.
          3. На графике производная даёт наклон касательной.

          ### Проверка
          Лишняя карточка — средняя скорость на отрезке, она не связана с пределом.

          ### Типичная ошибка
          Считать, что языки дают разные числа.
        feedback:
          correct: 'Верно: три языка описывают одно число.'
          wrong:
            what: Пары сопоставлены неверно.
            why: Возможно, средняя скорость принята за мгновенную.
            fix: Сопоставляйте по смыслу предела.
            next: Раздел T04.
      - id: EA-10
        type: number
        role: exam
        purpose: method
        level: 3
        outcome: LO-02
        sections:
          - T02
        minutes: 3
        points: 2
        prompt: Для функции $f(x) = x^2$ найдите точку $x_0$, в которой $f'(x_0) = 16$.
        answer: 8
        hints:
          - Производная квадрата равна $2x$.
          - Составьте уравнение $2x = 16$.
          - Разделите обе части на 2.
        solution: |
          ### Ответ
          Искомая точка — $x_0 = 8$.

          ### Идея
          Приравниваем производную к заданному значению.

          ### Шаги
          1. $f'(x) = 2x$.
          2. $2x = 16$.
          3. $x = 8$.

          ### Проверка
          Подстановка: $2 \cdot 8 = 16$ — сходится.

          ### Типичная ошибка
          Умножать вместо деления: получится 32 вместо 8.
          Общий код ошибки — `E-calc-derivative-multiply-instead-of-divide`.
        feedback:
          correct: 'Верно: точка найдена из уравнения.'
          wrong:
            what: Точка найдена неверно.
            why: Возможно, уравнение решено умножением вместо деления.
            fix: Сначала выпишите производную как функцию, затем делите обе части на 2.
            next: Раздел T02.
          misconceptions:
            - id: E-calc-derivative-multiply-instead-of-divide
              when:
                expr: 2*16
              message: 'Уравнение $2x = 16$ решено умножением: точка ушла вдвое дальше.'
        errors:
          - E-calc-derivative-multiply-instead-of-divide
      - id: EA-11
        type: number
        role: exam
        purpose: transfer
        level: 4
        outcome: LO-03
        sections:
          - T03
        minutes: 4
        points: 3
        unit: м/с
        prompt: Тело движется по закону $s(t) = 5t^2$ (метры, секунды). На отрезке от 2 с до 5 с его средняя
          скорость равна 35 м/с. Найдите мгновенную скорость в момент 4 с. Ответ введите в м/с.
        answer: 40
        hints:
          - 'Мгновенная скорость — производная пути: для $s(t) = 5t^2$ скорость равна $v(t) = 10t$.'
          - Средняя скорость на отрезке — наклон секущей, а не предел.
          - Подставьте момент 4 с в закон скорости.
        solution: |
          ### Ответ
          Мгновенная скорость равна 40 м/с.

          ### Идея
          Средняя скорость на отрезке — не мгновенная скорость в его конце.

          ### Шаги
          1. Закон скорости: $v(t) = 10t$.
          2. $v(4) = 40$ м/с.
          3. Средняя 35 м/с — наклон секущей на отрезке, а не предел.

          ### Проверка
          При шаге 1 в момент 4 с отношение равно $5(2 \cdot 4 + 1) = 45$ м/с — больше предела 40.

          ### Типичная ошибка
          Принять среднюю скорость на отрезке за мгновенную.
          Общий код ошибки — `E-calc-derivative-finite-step`.
        feedback:
          correct: 'Верно: мгновенная скорость найдена по закону скорости.'
          wrong:
            what: Мгновенная скорость не совпала.
            why: Возможно, вместо мгновенной скорости взята средняя на отрезке.
            fix: Найдите производную пути $v(t) = 10t$ и подставьте момент.
            next: Раздел T03.
          misconceptions:
            - id: E-calc-derivative-finite-step
              when:
                expr: '35'
              message: 'В ответе стоит средняя скорость на отрезке: это наклон секущей, а не предел.'
        errors:
          - E-calc-derivative-finite-step
      - id: EA-12
        type: numbers
        role: exam
        purpose: method
        level: 4
        outcome: LO-03
        sections:
          - T04
        minutes: 4
        points: 3
        prompt: Для функции $f(x) = |x - 1|$ найдите отношение приращений в точке $x_0 = 1$ при шаге
          слева и при шаге справа. Ответы введите двумя числами.
        answer:
          left: -1
          right: 1
        fields:
          - id: left
            label: Отношение приращений при шаге слева
          - id: right
            label: Отношение приращений при шаге справа
        hints:
          - Модуль раскрывается по-разному слева и справа от точки.
          - При шаге $h$ приращение функции равно $|h|$.
          - Разделите $|h|$ на $h$ при $h \ne 0$ отдельно для двух знаков шага.
        solution: |
          ### Ответ
          Слева отношение равно $-1$, справа — $1$.

          ### Идея
          Излом в точке: слева и справа разные наклоны.

          ### Шаги
          1. При $h > 0$: $\Delta y = |h| = h$, отношение равно 1.
          2. При $h < 0$: $\Delta y = |h| = -h$, отношение равно $-1$.
          3. Разные односторонние значения — производной в точке нет.

          ### Проверка
          При шаге 0,1 отношение равно 1, при шаге −0,1 — −1: общего предела нет.

          ### Типичная ошибка
          Объявить предел нулём, потому что приращение функции стремится к нулю.
        feedback:
          correct: 'Верно: односторонние отношения равны $-1$ и $1$, предела нет.'
          wrong:
            what: Одно из отношений приращений найдено неверно.
