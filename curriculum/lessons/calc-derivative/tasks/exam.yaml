          - 'Переведите м/с в км/ч: в одном часе 3600 секунд, в одном километре 1000 метров.' 
        solution: |
          ### Ответ
          40 м/с = 144 км/ч.

          ### Идея
          Сначала берём производную пути — она и есть мгновенная скорость, — затем переводим единицы.

          ### Шаги
          1. $\Delta s = 5(4 + \Delta t)^2 - 5 \cdot 4^2 = 40\Delta t + 5(\Delta t)^2$.
          2. $\dfrac{\Delta s}{\Delta t} = 40 + 5\Delta t$, предел при $\Delta t \to 0$ равен 40 м/с.
          3. Перевод: $40 \cdot 3{,}6 = 144$ км/ч.

          ### Проверка
          Проверка: 20 м/с — это 72 км/ч, значит 40 м/с вдвое больше.

          ### Типичная ошибка
          Делить на 3,6 вместо умножения.
