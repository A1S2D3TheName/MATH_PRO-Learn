tasks:
  - id: D-01
    type: number
    role: diagnostic
    purpose: meaning
    level: 1
    outcome: calc-continuity/LO-01
    sections:
      - T01
    minutes: 2
    prompt: Функция задана формулой $f(x) = \dfrac{x^2 - 9}{x - 3}$ при $x \ne 3$. Найдите
      $\lim\limits_{x \to 3} f(x)$.
    answer: 6
    hints:
      - Разложите числитель на множители.
      - 'Разность квадратов: $x^2 - 9 = (x - 3)(x + 3)$.' 
      - Сократите дробь на $x - 3$ и подставьте $x = 3$.
    solution: |
      ### Ответ
      Предел равен 6.

      ### Идея
      Неопределённость $0/0$ снимается сокращением на общий множитель.

      ### Шаги
      1. $x^2 - 9 = (x - 3)(x + 3)$.
      2. При $x \ne 3$: $f(x) = x + 3$.
      3. Предел при $x \to 3$ равен $3 + 3 = 6$.

      ### Проверка
      При $x = 2$ дробь равна $(4 - 9)/(2 - 3) = 5$, и $2 + 3 = 5$ — сокращённая форма верна.

      ### Типичная ошибка
      Подставлять $x = 3$ сразу: получится неопределённость $0/0$ — сначала сокращают.
    feedback:
      correct: 'Верно: неопределённость снята сокращением, предел равен 6.'
      wrong:
        what: Предел найден неверно.
        why: Возможно, дробь не сокращена или предел взят не в той точке.
        fix: Разложите числитель на множители и сократите на $x - 3$.
        next: Вернитесь к теме calc-continuity.
  - id: D-02
    type: number
    role: diagnostic
    purpose: procedure
    level: 1
    outcome: calc-continuity/LO-01
    sections:
      - T01
    minutes: 2
    prompt: 'Функция задана так: $f(x) = x^2$ при $x \ne 1$, а $f(1) = a$. При каком значении $a$ функция непрерывна
      в точке 1?'
    answer: 1
    hints:
      - Для непрерывности предел в точке должен совпасть со значением функции.
      - Предел при $x \to 1$ найдите по формуле $x^2$.
      - Найденный предел и есть нужное значение $a$.
    solution: |
      ### Ответ
      При $a = 1$.

      ### Идея
      Непрерывность требует, чтобы значение в точке равнялось пределу по формуле.

      ### Шаги
      1. По формуле $x^2$ предел при $x \to 1$ равен 1.
      2. Чтобы функция была непрерывной, $f(1)$ должно равняться этому пределу.
      3. Значит, $a = 1$.

      ### Проверка
      При $a = 1$ график — обычная парабола без прокола.

      ### Типичная ошибка
      Приравнивать значение не к пределу, а к приращению аргумента.
    feedback:
      correct: 'Верно: значение в точке совпало с пределом по формуле.'
      wrong:
        what: Значение $a$ найдено неверно.
        why: Возможно, перепутаны предел и значение функции.
        fix: Найдите предел по формуле и приравняйте к нему значение в точке.
        next: Вернитесь к теме calc-continuity.
  - id: D-03
    type: number
    role: diagnostic
    purpose: procedure
    level: 1
    outcome: model-rate/LO-01
    sections:
      - T01
    minutes: 2
    prompt: Автомобиль проехал 150 км за 2 часа. Найдите его среднюю скорость. Ответ введите в км/ч.
    answer: 75
    hints:
      - Средняя скорость — это путь, делённый на время движения.
      - Разделите пройденное расстояние на затраченное время.
      - 'Проверьте размерность: километры делим на часы — получатся км/ч.' 
    solution: |
      ### Ответ
      Средняя скорость равна 75 км/ч.

      ### Идея
      Средняя скорость — отношение всего пути ко всему времени.

      ### Шаги
      1. Путь равен 150 км.
      2. Время равно 2 ч.
      3. Скорость: $150 : 2 = 75$ км/ч.

      ### Проверка
      За два часа при скорости 75 км/ч машина проедет 150 км — сходится.

      ### Типичная ошибка
      Делить время на путь вместо пути на время.
      Общий код ошибки — `E-calc-derivative-inverse-quotient`.
    feedback:
      correct: 'Верно: путь разделён на время.'
      wrong:
        what: Средняя скорость посчитана неверно.
        why: Возможно, время разделено на путь.
        fix: Делите весь путь на всё время.
        next: Вернитесь к теме model-rate.
  - id: D-04
    type: numbers
    role: diagnostic
    purpose: transfer
    level: 1
    outcome: model-rate/LO-01
    sections:
      - T01
    minutes: 2
    prompt: Поезд прошёл 240 км за 3 часа, а затем ещё 180 км за 2 часа. Найдите среднюю скорость на первом участке
      и среднюю скорость на всём пути. Ответы введите в км/ч.
    answer:
      first: 80
      all: 84
    fields:
      - id: first
        label: Средняя скорость на первом участке
        unit: км/ч
      - id: all
        label: Средняя скорость на всём пути
        unit: км/ч
    hints:
      - Средняя скорость на участке — путь участка, делённый на его время.
      - Для всего пути сложите оба расстояния и оба времени.
      - Сложите пути и сложите времена — затем делите путь на время.
    solution: |
      ### Ответ
      На первом участке 80 км/ч, на всём пути 84 км/ч.

      ### Идея
      Средняя скорость считается по всему пути: делим суммарное расстояние на суммарное время.

      ### Шаги
      1. Первый участок: $240 : 3 = 80$ км/ч.
      2. Весь путь: $240 + 180 = 420$ км за $3 + 2 = 5$ ч.
      3. $420 : 5 = 84$ км/ч.

      ### Проверка
      Средняя на всём пути больше 80 км/ч: второй участок пройден быстрее.

      ### Типичная ошибка
      Усреднять скорости напрямую, не учитывая время на участках.
    feedback:
      correct: 'Верно: скорости найдены по своим участкам и по всему пути.'
      wrong:
        what: Одна из средних скоростей неверна.
        why: Возможно, скорости усреднены без учёта времени на участках.
        fix: Складывайте пути и времена, затем делите одно на другое.
        next: Вернитесь к теме model-rate.
