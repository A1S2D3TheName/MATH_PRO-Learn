  - id: R-04
    type: match
    role: refresh
    purpose: meaning
    level: 2
    outcome: LO-03
    sections:
      - T04
    minutes: 3
    prompt: Для функции $f(x) = x^2$ сопоставьте вопрос и число-ответ.
    answer:
      - left: q-value
        right: n-nine
      - left: q-deriv
        right: n-six
      - left: q-avg
        right: n-eight
    left:
      - id: q-value
        text: значение функции в точке 3
      - id: q-deriv
        text: значение производной в точке 3
      - id: q-avg
        text: средняя скорость изменения на отрезке $[3; 5]$
    right:
      - id: n-four
        text: '4'
      - id: n-six
        text: '6'
      - id: n-eight
        text: '8'
      - id: n-nine
        text: '9'
    hints:
      - Значение функции — ордината точки, производная — наклон касательной.
      - Средняя скорость изменения — отношение приращений на отрезке.
      - На отрезке от 3 до 5 приращение функции равно 16.
    solution: |
      ### Ответ
      $f(3) = 9$, $f'(3) = 6$, средняя скорость изменения на $[3; 5]$ равна 8.

      ### Идея
      Для каждого вопроса выбираем свою величину.

      ### Шаги
      1. $f(3) = 3^2 = 9$.
      2. $f'(3) = 2 \cdot 3 = 6$.
      3. Средняя скорость: $(25 - 9)/(5 - 3) = 8$.

      ### Проверка
      Лишняя карточка 4 — значение функции в точке 2, к вопросам она не подходит.

      ### Типичная ошибка
      Считать значение функции и значение производной одним и тем же.
    feedback:
      correct: 'Верно: значение, производная и средняя скорость различены.'
      wrong:
        what: Пары сопоставлены неверно.
        why: Возможно, значение функции и наклон касательной перепутаны.
        fix: Проверьте каждую пару вычислением.
        next: Карточка раздела T04.
  - id: R-05
