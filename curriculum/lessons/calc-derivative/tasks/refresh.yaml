tasks:
  - id: R-01
    type: number
    role: refresh
    purpose: procedure
    level: 1
    outcome: LO-01
    sections:
      - T01
    minutes: 3
    prompt: Функция $f(x) = x^2$, начальная точка $x_0 = {{x0}}$, сдвиг $\Delta x = 2$. Найдите приращение функции
      $\Delta y$.
    answer: '8'
    hints:
      - Приращение функции — разность значений в новой и старой точках.
      - Новая точка равна $x_0 + 2$.
      - Вычтите из значения в новой точке значение в старой.
    solution: |
      ### Ответ
      $\Delta y = 4 \cdot {{x0}} + 4$.

      ### Идея
      Подставляем обе точки и вычитаем.

      ### Шаги
      1. $f(x_0 + 2) = (x_0 + 2)^2$.
      2. $\Delta y = (x_0 + 2)^2 - x_0^2 = 4x_0 + 4$.

      ### Проверка
      При $x_0 = 1$ получается 8: значение выросло с 1 до 9.

      ### Типичная ошибка
      Раскрывать квадрат покомпонентно.
      Общий код ошибки — `E-calc-derivative-square-sum`.
    feedback:
      correct: 'Верно: приращение посчитано по определению.'
      wrong:
        what: Приращение найдено неверно.
        why: Возможно, потеряно удвоенное произведение.
        fix: Раскройте квадрат суммы полностью.
        next: Карточка раздела T01.
