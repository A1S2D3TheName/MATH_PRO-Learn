    prompt: Тело движется по закону $s(t) = 5t^2$. Найдите приращение пути $\Delta s$ за интервал от $t_0 = {{t0}}$
      с до $t_0 + 1$ с.
    answer: '15'
    hints:
      - Приращение пути — разность значений функции пути.
      - Сначала найдите путь в начале и в конце интервала.
      - Вычтите $5t_0^2$ из $5(t_0 + 1)^2$.
    solution: |
      ### Ответ
      $\Delta s = 5(2 \cdot {{t0}} + 1)$ метров.

      ### Идея
      Считаем разность значений функции пути на интервале длиной 1 с.

      ### Шаги
      1. $s(t_0 + 1) = 5(t_0 + 1)^2$.
      2. $\Delta s = 5(2t_0 + 1)$.

      ### Проверка
      При $t_0 = 1$ приращение равно 15 метрам — это согласуется с формулой скорости $v(t) = 10t$.

      ### Типичная ошибка
      Путать путь с приращением пути.
