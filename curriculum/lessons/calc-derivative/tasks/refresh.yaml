  - id: R-02
    type: number
    role: refresh
    purpose: procedure
    level: 1
    outcome: LO-02
    sections:
      - T02
    minutes: 3
    prompt: Функция $f(x) = x^2$, точка $x_0 = {{x0}}$, сдвиг $\Delta x = {{h}}$. Найдите отношение приращений $\Delta
      y / \Delta x$.
    answer: '5'
    hints:
      - Отношение приращений — это наклон секущей.
      - Сначала найдите приращение функции.
      - Для квадрата приращение равно $2x_0h + h^2$; разделите на $h$.
    solution: |
      ### Ответ
      $\Delta y/\Delta x = 2 \cdot {{x0}} + {{h|()}}$.

      ### Идея
      Делим приращение функции на приращение аргумента.

      ### Шаги
      1. $\Delta y = 2x_0 h + h^2$.
      2. После деления на $h$ остаётся $2x_0 + h$.

      ### Проверка
      При $x_0 = 2$ и $h = 1$ выходит 5 — согласуется с таблицей раздела T02.

      ### Типичная ошибка
      Переворачивать дробь.
      Общий код ошибки — `E-calc-derivative-inverse-quotient`.
    feedback:
      correct: 'Верно: отношение приращений найдено.'
      wrong:
        what: Отношение посчитано неверно.
        why: Возможно, дробь перевёрнута или не сокращён шаг.
        fix: Разделите приращение функции на приращение аргумента.
        next: Карточка раздела T02.
    variants:
