  - id: R-03
    type: number
    role: refresh
    purpose: procedure
    level: 2
    outcome: LO-02
    sections:
      - T02
    minutes: 3
    prompt: Функция $f(x) = x^2$. Найдите $f'(x_0)$ в точке $x_0 = {{x0}}$.
    answer: '8'
    hints:
      - Производная — предел отношения приращений.
      - Для квадрата после сокращения остаётся $2x_0 + \Delta x$.
      - Перейдите к пределу при $\Delta x \to 0$ и подставьте точку из условия.
    solution: |
      ### Ответ
      $f'({{x0}}) = 2 \cdot {{x0}}$.

      ### Идея
      Вычисляем предел упрощённого отношения приращений.

      ### Шаги
      1. $\Delta y/\Delta x = 2x_0 + \Delta x$.
      2. При $\Delta x \to 0$ получаем $2x_0$.

      ### Проверка
      При шаге 1 отношение равно $2 \cdot {{x0}} + 1$ — на единицу больше предела.

      ### Типичная ошибка
      Терять множитель 2.
      Общий код ошибки — `E-calc-derivative-multiplier-lost`.
    feedback:
      correct: 'Верно: производная квадрата равна $2x_0$.'
      wrong:
        what: Производная найдена неверно.
        why: Возможно, потерян множитель 2.
        fix: 'Сократите дробь заново: $2x_0\Delta x$ делится на $\Delta x$ целиком.'
        next: Карточка раздела T02.
    variants:
      - params:
          x0: 4
        answer: '8'
        solution: |
          ### Ответ
          $f'(4) = 2 \cdot 4$.
          Числовое значение: $8$.

          ### Идея
          Вычисляем предел упрощённого отношения приращений.

          ### Шаги
          1. $\Delta y/\Delta x = 2x_0 + \Delta x$.
          2. При $\Delta x \to 0$ получаем $2x_0$.

          ### Проверка
          При шаге 1 отношение равно $2 \cdot 4 + 1$ — на единицу больше предела.

          ### Типичная ошибка
          Терять множитель 2.
          Общий код ошибки — `E-calc-derivative-multiplier-lost`.
      - params:
          x0: 5
        answer: '10'
        solution: |
          ### Ответ
          $f'(5) = 2 \cdot 5$.
          Числовое значение: $10$.

          ### Идея
          Вычисляем предел упрощённого отношения приращений.

          ### Шаги
          1. $\Delta y/\Delta x = 2x_0 + \Delta x$.
          2. При $\Delta x \to 0$ получаем $2x_0$.

          ### Проверка
          При шаге 1 отношение равно $2 \cdot 5 + 1$ — на единицу больше предела.

          ### Типичная ошибка
          Терять множитель 2.
          Общий код ошибки — `E-calc-derivative-multiplier-lost`.
      - params:
          x0: 6
        answer: '12'
        solution: |
          ### Ответ
          $f'(6) = 2 \cdot 6$.
          Числовое значение: $12$.

          ### Идея
          Вычисляем предел упрощённого отношения приращений.

          ### Шаги
          1. $\Delta y/\Delta x = 2x_0 + \Delta x$.
          2. При $\Delta x \to 0$ получаем $2x_0$.

          ### Проверка
          При шаге 1 отношение равно $2 \cdot 6 + 1$ — на единицу больше предела.

          ### Типичная ошибка
