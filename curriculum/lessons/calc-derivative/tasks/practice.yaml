      1. Средняя скорость на отрезке $[t_0; t_0 + 1]$: $5(2t_0 + 1) = 10t_0 + 5$ м/с.
      2. Уравнение: $10t = 10t_0 + 5$.
      3. Решение: $t = t_0 + \frac{1}{2}$ с.

      ### Проверка
      При $t_0 = {{t0}}$: $v({{t0}} + 0{,}5) = 10 \cdot {{t0}} + 5$ м/с — это и есть средняя
      скорость на отрезке $[{{t0}}; {{t0}} + 1]$.

      ### Типичная ошибка
      Взять мгновенную скорость в начале отрезка: средняя скорость на $[t_0; t_0 + 1]$ равна
      мгновенной не в начале, а в середине отрезка.
