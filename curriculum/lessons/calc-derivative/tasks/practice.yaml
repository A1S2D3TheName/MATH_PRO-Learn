  - id: P-03
    type: number
    role: warmup
    purpose: procedure
    level: 0
    outcome: LO-01
    sections:
      - T02
    minutes: 1
    prompt: Функция $f(x) = x^2$, начальная точка $x_0 = {{x0}}$, приращение аргумента $\Delta x = {{h}}$. Найдите
      отношение приращений $\Delta y / \Delta x$.
    answer: '5'
    hints:
      - Отношение приращений — это подъём, делённый на шаг вправо.
      - Сначала найдите $\Delta y$ как разность значений функции.
      - Запишите разность $({{x0}} + {{h|()}})^2 - {{x0}}^2$ и разделите её на шаг ({{h|()}}).
    solution: |
      ### Ответ
      $\Delta y/\Delta x = 2 \cdot {{x0}} + {{h|()}}$.

      ### Идея
      Делим приращение функции на приращение аргумента, а не наоборот.

      ### Шаги
      1. $\Delta y = ({{x0}} + ({{h|()}}))^2 - {{x0}}^2 = 2 \cdot {{x0}} \cdot {{h|()}} + {{h|()}}^2$.
      2. $\Delta y / \Delta x = 2 \cdot {{x0}} + {{h|()}}$.

      ### Проверка
      При шаге $\Delta x = 1$ отношение равно $2x_0 + 1$ — это согласуется с примерами раздела T01.

      ### Типичная ошибка
      Переворачивать дробь и делить $\Delta x$ на $\Delta y$ — другая величина.
      Общий код ошибки — `E-calc-derivative-inverse-quotient`.
    feedback:
      correct: 'Верно: сверху приращение функции, снизу — приращение аргумента.'
      wrong:
        what: Отношение приращений посчитано неверно.
        why: Возможно, дробь перевёрнута или в числителе потеряно удвоенное произведение.
        fix: Сначала полностью раскройте $\Delta y$, затем делите на $\Delta x$.
        next: Вернитесь к определению разностного отношения в разделе T02.
      misconceptions:
        - id: E-calc-derivative-inverse-quotient
          when:
            expr: h / (2*x0*h + h^2)
          message: 'Дробь перевёрнута: сверху стоит приращение аргумента.'
    errors:
      - E-calc-derivative-inverse-quotient
    variants:
