    prompt: Тело движется по закону $s(t) = 5t^2$. Найдите мгновенную скорость в момент $t_0 = {{t0}}$ с и среднюю
      скорость на отрезке от $t_0$ до $t_0 + ({{h|()}})$ с. Ответы введите в м/с.
    answer: &id003
      v: '20'
