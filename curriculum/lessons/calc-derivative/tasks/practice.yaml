    prompt: Тело движется по закону $s(t) = 5t^2$ (путь в метрах, время в секундах). Найдите момент времени
      $t$, в котором мгновенная скорость тела равна средней скорости на отрезке от $t_0 = {{t0}}$ с до
      $t_0 + 1$ с. Ответ введите в секундах.
    answer: '3/2'
    hints:
      - Средняя скорость на отрезке — отношение приращения пути к длительности отрезка.
      - 'Мгновенная скорость — производная пути: $v(t) = 10t$.'
      - Приравняйте $10t$ средней скорости на отрезке и решите уравнение.
    solution: |
      ### Ответ
      Момент равен $\frac{2 \cdot {{t0}} + 1}{2}$ с.

      ### Идея
      Скорость $v(t) = 10t$ растёт равномерно, поэтому средняя на отрезке равна мгновенной
      в его середине.

