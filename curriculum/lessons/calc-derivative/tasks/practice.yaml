  - id: P-16
    type: number
    role: independent
    purpose: procedure
    level: 2
    outcome: LO-02
    sections:
      - T02
    minutes: 2
    prompt: Найдите $f'({{x0}})$ для функции $f(x) = x^2 + {{c}}$.
    answer: '6'
    hints:
      - Производная отвечает на вопрос о скорости изменения, а не о значении функции.
      - Найдите производную $x^2$ по определению, затем посмотрите на слагаемое ${{c}}$.
      - В приращении свободное слагаемое вычитается само из себя.
    solution: |
      ### Ответ
      $f'({{x0}}) = 2 \cdot {{x0}}$.

      ### Идея
      Постоянное слагаемое сдвигает график, но наклон в точке не меняет.

      ### Шаги
      1. $\Delta y = ({{x0}} + \Delta x)^2 + {{c}} - ({{x0}}^2 + {{c}}) = 2 \cdot {{x0}} \cdot \Delta x + (\Delta x)^2$.
      2. $\Delta y / \Delta x = 2 \cdot {{x0}} + \Delta x$.
      3. Предел равен $2 \cdot {{x0}}$.

      ### Проверка
      При шаге $\Delta x = 1$ отношение равно $2 \cdot {{x0}} + 1$ — на единицу больше предела,
      как у параболы.

      ### Типичная ошибка
      Дифференцировать постоянное слагаемое вместе с переменным.
      Общий код ошибки — `E-calc-derivative-constant-differentiated`.
    feedback:
      correct: 'Верно: слагаемое ${{c}}$ в производной не появилось.'
      wrong:
        what: Производная в точке не совпала.
        why: Возможно, в ответе осталось свободное слагаемое или подставлено значение функции.
        fix: 'Вычтите значения функции в двух точках: постоянные слагаемые сократятся.'
        next: Перечитайте пример 2 раздела T02.
      misconceptions:
        - id: E-calc-derivative-constant-differentiated
          when:
            expr: 2*x0 + c
          message: 'Свободное слагаемое продифференцировано как переменное: $2x_0 + {{c}}$ вместо $2x_0$.'
        - id: E-calc-derivative-shifted-value-instead
          when:
            expr: x0^2 + c
          message: 'Подставлено значение функции вместо производной: $f({{x0}}) = x_0^2 + {{c}}$.'
        - id: E-calc-derivative-multiplier-lost
          when:
            expr: x0
          message: 'Потерян множитель 2: ответ совпал с $x_0$ вместо $2x_0$.'
    errors:
      - E-calc-derivative-constant-differentiated
      - E-calc-derivative-shifted-value-instead
      - E-calc-derivative-multiplier-lost
    variants:
