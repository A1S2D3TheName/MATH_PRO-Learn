      - Сократите дробь при $\Delta x \ne 0$ и перейдите к пределу — многочлен от шага непрерывен.
    solution: |
      ### Ответ
      $f'({{x0}}) = 2 \cdot {{a|()}} \cdot {{x0}} + {{b|()}}$.

      ### Идея
      Производная многочлена считается по определению: приращение, сокращение, предел.

