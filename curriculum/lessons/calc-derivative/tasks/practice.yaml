      - T03
    minutes: 5
    prompt: Парабола задана уравнением $y = x^2 - {{m}}x$. В точке $x_0$ касательная к ней горизонтальна. Найдите
      $x_0$.
    answer: '1'
    hints:
      - Горизонтальная касательная имеет нулевой наклон.
      - Наклон касательной — это производная параболы в точке $x_0$.
      - Вычислите приращение функции и посмотрите, при каком $x_0$ предел отношения равен нулю.
    solution: |
      ### Ответ
      Горизонтальная касательная в точке $x_0$, где производная равна нулю; для этой параболы $f'(x) = 2x - m$, значит $x_0 = m/2$.

      ### Идея
      Нулевой наклон касательной означает равенство нулю производной.

      ### Шаги
      1. $\Delta y = (x_0 + h)^2 - m(x_0 + h) - x_0^2 + mx_0 = 2x_0 h + h^2 - mh$.
      2. После деления на $h$: $2x_0 + h - m$.
      3. Предел равен $2x_0 - m$; он обращается в нуль при $x_0 = m/2$.

      ### Проверка
      Для $m = 2$ получается $x_0 = 1$: касательная $y = -1$ горизонтальна в вершине параболы.

      ### Типичная ошибка
      Считать, что горизонтальная касательная всегда проходит через $x = 0$.
