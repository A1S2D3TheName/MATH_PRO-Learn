      wrong:
        what: Порядок шагов нарушен.
        why: Возможно, предельный переход поставлен раньше сокращения дроби.
        fix: 'Помните: $\Delta x = 0$ подставляют только в упрощённое выражение.'
        next: Перечитайте пример 1 раздела T02.
  - id: P-25
    type: number
    role: independent
    purpose: transfer
