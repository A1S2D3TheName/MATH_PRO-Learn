  - id: P-02
    type: choice
    role: warmup
    purpose: meaning
    level: 0
    outcome: LO-03
    sections:
      - T02
    minutes: 2
    prompt: Что даёт предел отношения приращений $\dfrac{\Delta y}{\Delta x}$ для функции $f(x) = x^2$
      в точке $x_0 = 3$, когда $\Delta x \to 0$?
    answer: a
    options:
      - id: a
        text: 'Число, к которому подходят отношения: мгновенную скорость изменения функции и наклон касательной
          в точке.'
      - id: b
        text: Нуль, потому что и приращение функции, и приращение аргумента стремятся к нулю.
        misconception: E-calc-derivative-numerator-limit-instead
        why: Числитель и знаменатель уменьшаются вместе, а их отношение при этом подходит к числу.
      - id: c
        text: 'Обратную величину: приращение аргумента, делённое на приращение функции.'
        misconception: E-calc-derivative-inverse-quotient
        why: В определении производной делят изменение функции на изменение аргумента.
      - id: d
        text: Значение функции в этой точке.
        misconception: E-calc-derivative-value-instead
        why: Предел разностного отношения — не значение функции, а скорость её изменения.
    errors:
      - E-calc-derivative-numerator-limit-instead
      - E-calc-derivative-inverse-quotient
      - E-calc-derivative-value-instead
    hints:
      - Предел — это число, к которому подходят значения дроби при уменьшении шага.
      - Для $f(x) = x^2$ в точке 3 отношение равно $6 + \Delta x$; к чему оно подходит?
      - При уменьшении шага добавка в выражении $6 + \Delta x$ становится всё меньше.
    solution: |
      ### Ответ
      Вариант a: предел отношения приращений — это производная функции в точке: мгновенная скорость
      изменения и наклон касательной.

      ### Идея
      Уменьшаем шаг и следим, к какому числу подходит отношение.

      ### Шаги
      1. При $\Delta x = 1$ отношение равно 7, при $\Delta x = 0{,}01$ — уже 6,01.
      2. Разность с числом 6 уменьшается вместе с шагом, значит предел равен 6.
      3. Это число — производная: мгновенная скорость и наклон касательной в точке.

      ### Проверка
      При шаге $0{,}01$ отношение отличается от 6 ровно на $0{,}01$.

      ### Типичная ошибка
      Считать предел равным нулю, потому что оба приращения стремятся к нулю.
    feedback:
      correct: 'Верно: предел отношения приращений — это производная в точке.'
      wrong:
        what: Выбран неверный смысл предела.
        why: Отношение двух стремящихся к нулю величин не обязано стремиться к нулю.
        fix: Сократите $\Delta x$ в дроби и посмотрите на упрощённое выражение.
        next: 'Перечитайте раздел T02: предел отношения приращений.'
  - id: P-04
    type: number
    role: supported
    purpose: procedure
    level: 1
    outcome: LO-01
    sections:
      - T01
    minutes: 1
    prompt: Функция $f(x) = x^2 + {{c}}$. Найдите приращение функции $\Delta y$ при переходе из точки $x_0 = {{x0}}$
      в точку $x_0 + \Delta x$, где $\Delta x = {{h}}$.
    answer: '5'
    hints:
      - Приращение — разность значений функции в двух точках.
      - Вычтите значение в старой точке из значения в новой.
      - Свободное слагаемое ${{c}}$ есть в обеих точках — что происходит при вычитании?
    solution: |
      ### Ответ
      $\Delta y = 2 \cdot {{x0}} \cdot {{h|()}} + {{h|()}}^2$; постоянное слагаемое сокращается.

      ### Идея
      Подставляем обе точки в формулу функции; слагаемое ${{c}}$ есть и там, и там.

      ### Шаги
      1. $f({{x0}} + ({{h|()}})) = ({{x0}} + ({{h|()}}))^2 + {{c}}$.
      2. $f({{x0}}) = {{x0}}^2 + {{c}}$.
      3. После вычитания остаётся $2 \cdot {{x0}} \cdot {{h|()}} + {{h|()}}^2$.

      ### Проверка
      Сравните с той же функцией без слагаемого ${{c}}$: приращение одинаково — постоянная не влияет.

      ### Типичная ошибка
      Оставлять свободное слагаемое в приращении: тогда ответ завышен на ${{c}}$.
      Общий код ошибки — `E-calc-derivative-constant-not-cancelled`.
    feedback:
      correct: 'Верно: постоянное слагаемое в приращении сокращается.'
      wrong:
        what: Приращение содержит лишнее слагаемое.
        why: Свободное слагаемое вычитается само из себя.
        fix: Вычтите $f(x_0)$ из $f(x_0 + \Delta x)$ полностью, не сокращая вычисления.
        next: Перечитайте пример 3 в разделе T02.
      misconceptions:
        - id: E-calc-derivative-constant-not-cancelled
          when:
            expr: 2*x0*h + h^2 + c
          message: 'Свободное слагаемое осталось в приращении: оно не сократилось при вычитании.'
    errors:
      - E-calc-derivative-constant-not-cancelled
    variants:
      - params:
          x0: 2
          h: 1
          c: 5
        answer: '5'
        solution: |
          ### Ответ
          $\Delta y = 2 \cdot 2 \cdot 1 + 1^2$; постоянное слагаемое сокращается.
          Числовое значение: $5$.

          ### Идея
          Подставляем обе точки в формулу функции; слагаемое $5$ есть и там, и там.

          ### Шаги
          1. $f(2 + (1)) = (2 + (1))^2 + 5$.
          2. $f(2) = 2^2 + 5$.
          3. После вычитания остаётся $2 \cdot 2 \cdot 1 + 1^2$.

          ### Проверка
          Сравните с той же функцией без слагаемого $5$: приращение одинаково — постоянная не влияет.

          ### Типичная ошибка
          Оставлять свободное слагаемое в приращении: тогда ответ завышен на $5$.
          Общий код ошибки — `E-calc-derivative-constant-not-cancelled`.
      - params:
          x0: 3
          h: 1
          c: 5
        answer: '7'
        solution: |
          ### Ответ
          $\Delta y = 2 \cdot 3 \cdot 1 + 1^2$; постоянное слагаемое сокращается.
          Числовое значение: $7$.

          ### Идея
          Подставляем обе точки в формулу функции; слагаемое $5$ есть и там, и там.

          ### Шаги
