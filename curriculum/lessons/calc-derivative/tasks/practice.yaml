          x0: 2
          h: 1
        answer: '5'
        solution: |
          ### Ответ
          $\Delta y/\Delta x = 2 \cdot 2 + 1$.
          Числовое значение: $5$.

          ### Идея
          Делим приращение функции на приращение аргумента, а не наоборот.

          ### Шаги
          1. $\Delta y = (2 + (1))^2 - 2^2 = 2 \cdot 2 \cdot 1 + 1^2$.
          2. $\Delta y / \Delta x = 2 \cdot 2 + 1$.

          ### Проверка
          При шаге $\Delta x = 1$ отношение равно $2x_0 + 1$ — это согласуется с примерами раздела T01.

          ### Типичная ошибка
          Переворачивать дробь и делить $\Delta x$ на $\Delta y$ — другая величина.
          Общий код ошибки — `E-calc-derivative-inverse-quotient`.
      - params:
          x0: 3
          h: 1
        answer: '7'
        solution: |
          ### Ответ
          $\Delta y/\Delta x = 2 \cdot 3 + 1$.
          Числовое значение: $7$.

          ### Идея
          Делим приращение функции на приращение аргумента, а не наоборот.

          ### Шаги
