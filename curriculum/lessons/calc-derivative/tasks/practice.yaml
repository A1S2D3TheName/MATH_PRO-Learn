      | {{x0}} | {{y0}} |
      | {{x1}} | {{y1}} |

      Найдите среднюю скорость изменения функции на отрезке от ${{x0}}$ до ${{x1}}$.
    answer: '39'
    hints:
      - Средняя скорость изменения — это отношение приращений двух величин из таблицы.
      - Возьмите разность значений функции и разность значений аргумента.
      - 'Порядок вычитания один и тот же сверху и снизу: $f(x_1) - f(x_0)$ и $x_1 - x_0$.'
    solution: |
      ### Ответ
      Средняя скорость изменения равна $\dfrac{f(x_1) - f(x_0)}{x_1 - x_0}$.

      ### Идея
      По таблице считаем приращения и делим одно на другое.

      ### Шаги
      1. $\Delta y = {{y1}} - {{y0}}$.
      2. $\Delta x = {{x1}} - {{x0}}$.
      3. Отношение равно среднему изменению на единицу аргумента.

      ### Проверка
      Для $f(x) = x^3$ то же число равно $x_0^2 + x_0 x_1 + x_1^2$ — проверьте подстановкой.

      ### Типичная ошибка
      Переворачивать дробь или делить значение функции на аргумент вместо приращений.
      Общий код ошибки — `E-calc-derivative-inverse-quotient`.
