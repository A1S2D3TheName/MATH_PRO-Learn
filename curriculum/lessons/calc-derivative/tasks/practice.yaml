          k: 1
        answer:
          left: '-1'
          right: '1'
      - params:
          k: 2
        answer:
          left: '-2'
          right: '2'
      - params:
          k: 3
        answer:
          left: '-3'
          right: '3'
      - params:
          k: 4
        answer:
          left: '-4'
          right: '4'
      - params:
          k: 5
        answer:
          left: '-5'
          right: '5'
      - params:
          k: 6
        answer:
          left: '-6'
          right: '6'

  - id: P-30
    type: number
    role: independent
    purpose: transfer
    level: 3
    outcome: LO-01
    sections:
      - T01
      - T02
    minutes: 2
    prompt: На графике функции $f(x) = x^3$ отмечены точки $A({{x0}}; {{y0}})$ и $B({{x1}}; {{y1}})$.
      Найдите среднюю скорость изменения функции на отрезке от A до B.
    answer: '39'
    hints:
      - Средняя скорость изменения — отношение приращений функции и аргумента.
      - Вычтите из ординаты точки B ординату точки A и из абсциссы B — абсциссу A.
      - Разделите приращение функции на приращение аргумента.
    solution: |
      ### Ответ
      Средняя скорость изменения равна $\dfrac{\Delta y}{\Delta x}$, где $\Delta y = {{y1}} - {{y0}}$
      и $\Delta x = {{x1}} - {{x0}}$.

      ### Идея
      По двум точкам графика считаем отношение приращений — как по таблице.

      ### Шаги
      1. $\Delta y = {{y1}} - {{y0}}$.
      2. $\Delta x = {{x1}} - {{x0}}$.
      3. Отношение $\Delta y/\Delta x$ — средняя скорость изменения.

      ### Проверка
      Для куба то же число равно $x_0^2 + x_0 x_1 + x_1^2$ — проверьте подстановкой.

