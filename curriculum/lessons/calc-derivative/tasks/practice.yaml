tasks:
  - id: P-01
    type: number
    role: warmup
    purpose: procedure
    level: 0
    outcome: LO-01
    sections:
      - T01
    minutes: 1
    prompt: Функция $f(x) = x^2$, начальная точка $x_0 = {{x0}}$, сдвиг $\Delta x = 1$. Найдите приращение функции
      $\Delta y$.
    answer: '5'
    hints:
      - 'Приращение функции — это разность значений: в новой точке минус в старой.'
      - Сначала найдите значение в точке $x_0 + \Delta x$, затем вычтите значение в точке $x_0$.
      - Значение в новой точке равно $({{x0}} + 1)^2$; из него вычтите значение в точке ${{x0}}$.
    solution: |
      ### Ответ
      $\Delta y = 2 \cdot {{x0}} + 1$.

      ### Идея
      Из значения функции в новой точке вычитаем значение в старой; знак результата
      показывает, выросла функция или уменьшилась.

      ### Шаги
      1. $f({{x0}} + 1) = ({{x0}} + 1)^2$.
      2. $f({{x0}}) = {{x0}}^2$.
      3. $\Delta y = ({{x0}} + 1)^2 - {{x0}}^2$ — по формуле квадрата суммы получается $2 \cdot {{x0}} + 1$.

      ### Проверка
      При сдвиге влево на 1 из той же точки приращение равно $1 - 2 \cdot {{x0}}$ — отрицательно:
      значение функции уменьшилось.

      ### Типичная ошибка
      Раскрывать квадрат покомпонентно: $(x_0 + \Delta x)^2 \ne x_0^2 + (\Delta x)^2$.
      Общий код ошибки — `E-calc-derivative-square-sum`.
    feedback:
      correct: 'Верно: значение в новой точке минус значение в старой.'
      wrong:
        what: Приращение функции посчитано неверно.
        why: Возможно, квадрат суммы раскрыт покомпонентно или перепутаны новая и старая точки.
        fix: Раскройте $({{x0}} + 1)^2$ полностью и вычтите ${{x0}}^2$.
        next: Перечитайте раздел T01 о приращении функции.
      misconceptions:
        - id: E-calc-derivative-square-sum
          when:
            expr: '1'
          message: 'Квадрат суммы раскрыт покомпонентно: в приращении потеряно удвоенное произведение.'
    errors:
      - E-calc-derivative-square-sum
    variants:
      - params:
          x0: 2
        answer: '5'
        solution: |
          ### Ответ
          $\Delta y = 2 \cdot 2 + 1$.
          Числовое значение: $5$.

          ### Идея
          Из значения функции в новой точке вычитаем значение в старой; знак результата
          показывает, выросла функция или уменьшилась.

          ### Шаги
          1. $f(2 + 1) = (2 + 1)^2$.
          2. $f(2) = 2^2$.
          3. $\Delta y = (2 + 1)^2 - 2^2$ — по формуле квадрата суммы получается $2 \cdot 2 + 1$.

          ### Проверка
          При сдвиге влево на 1 из той же точки приращение равно $1 - 2 \cdot 2$ — отрицательно:
          значение функции уменьшилось.

          ### Типичная ошибка
          Раскрывать квадрат покомпонентно: $(x_0 + \Delta x)^2 \ne x_0^2 + (\Delta x)^2$.
          Общий код ошибки — `E-calc-derivative-square-sum`.
      - params:
          x0: 3
        answer: '7'
        solution: |
