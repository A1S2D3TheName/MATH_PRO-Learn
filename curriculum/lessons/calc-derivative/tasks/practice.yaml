          значение функции уменьшилось.

          ### Типичная ошибка
          Раскрывать квадрат покомпонентно: $(x_0 + \Delta x)^2 \ne x_0^2 + (\Delta x)^2$.
          Общий код ошибки — `E-calc-derivative-square-sum`.
      - params:
