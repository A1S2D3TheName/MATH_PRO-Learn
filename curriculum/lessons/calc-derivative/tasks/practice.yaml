      - Сравните значения функции в точках $x_0$ и $x_0 + \Delta x$.
      - Приращение функции равно $k\Delta x$ при любом шаге — отсюда и производная.
    solution: |
      ### Ответ
      Производная равна коэффициенту при $x$, то есть ${{k}}$.

      ### Идея
      Приращение линейной функции пропорционально шагу, поэтому отношение не зависит от шага.

      ### Шаги
      1. $\Delta y = ({{k}}(x_0 + \Delta x) + {{b}}) - ({{k}}x_0 + {{b}}) = {{k}}\Delta x$.
      2. $\Delta y/\Delta x = {{k}}$ при любом $\Delta x \ne 0$.
      3. Предел постоянной равен ей самой: $f'(x) = {{k}}$.

      ### Проверка
      Свободное слагаемое ${{b}}$ сдвигает прямую, но наклон не меняет.

