  - id: P-24
    type: multi
    role: challenge
    purpose: meaning
    level: 5
    outcome: LO-03
    sections:
      - T04
    minutes: 6
    optional: true
    prompt: Отметьте все верные утверждения о функции $f(x) = x|x|$ в точке $x_0 = 0$.
    answer:
      - a
      - b
      - c
    options:
      - id: a
        text: При шаге $h > 0$ отношение приращений равно $h$.
      - id: b
        text: При шаге $h < 0$ отношение приращений равно $-h$.
      - id: c
        text: Производная в нуле существует и равна нулю.
      - id: d
        text: Производная в нуле равна 1.
        misconception: E-calc-derivative-multiplier-lost
        why: 'В приращении $h|h|$ потерян множитель $h$: осталось $|h|$, и отношение равно $\pm 1$.'
    hints:
      - 'Запишите приращение функции $f(x) = x|x|$ в нуле: $\Delta y = h|h|$.' 
      - Раскройте модуль отдельно для положительного и отрицательного шага.
      - Оба отношения стремятся к одному числу — сравните его с нулём.
    solution: |
      ### Ответ
      Верны утверждения A, B и C: отношение приращений равно $|h|$ и стремится к нулю.

      ### Идея
      Функция $x|x|$ гладкая в нуле: модуль «съедает» знак, а множитель $x$ даёт лишнюю степень.

      ### Шаги
      1. При $h > 0$: $\Delta y = h \cdot h = h^2$, отношение равно $h$.
      2. При $h < 0$: $\Delta y = h \cdot (-h) = -h^2$, отношение равно $-h$.
      3. Оба отношения равны $|h|$ и стремятся к 0 — производная существует и равна 0.

      ### Проверка
      При шаге $h = 0{,}1$ отношение равно $0{,}1$, при шаге $h = -0{,}1$ — тоже $0{,}1$ по модулю:
      оба стремятся к нулю.

      ### Типичная ошибка
      Путать $x|x|$ с модулем $|x|$: у модуля в нуле производной нет, а у $x|x|$ — есть.
    feedback:
      correct: 'Верно: отношение равно $|h|$, производная в нуле равна нулю.'
      wrong:
        what: Набор утверждений неверен.
        why: Возможно, модуль раскрыт одной формулой для обеих сторон или функция принята за $|x|$.
        fix: Запишите $\Delta y = h|h|$ и раскройте модуль по знаку шага.
        next: Перечитайте раздел T04 о функции с изломом.
    errors:
      - E-calc-derivative-multiplier-lost
  - id: P-29
    type: numbers
    role: supported
    purpose: meaning
    level: 2
    outcome: LO-03
    sections:
      - T04
    minutes: 3
    prompt: >-
      Для функции $f(x) = {{k}}|x|$ найдите отношение приращений в точке $x_0 = 0$ двумя способами:
      при шаге слева ($\Delta x < 0$) и при шаге справа ($\Delta x > 0$).
    answer:
      left: '-1'
      right: '1'
    fields:
      - id: left
        label: Отношение приращений при шаге слева
      - id: right
        label: Отношение приращений при шаге справа
    hints:
      - Модуль по-разному раскрывается для положительного и отрицательного аргумента.
      - При $\Delta x > 0$ верно $|0 + \Delta x| = \Delta x$; при $\Delta x < 0$ верно
        $|0 + \Delta x| = -\Delta x$.
      - Запишите ${{k}}|\Delta x|$ с раскрытым модулем и разделите на $\Delta x$ при $\Delta x \ne 0$.
    solution: |
      ### Ответ
      Слева $-{{k}}$, справа ${{k}}$.

      ### Идея
      Модуль — это две разные формулы по разные стороны от нуля, поэтому отношение приращений
      считают отдельно для каждого знака шага.

      ### Шаги
      1. При $\Delta x > 0$: $\Delta y = {{k}}|\Delta x| - 0 = {{k}}\Delta x$, отношение равно ${{k}}$.
      2. При $\Delta x < 0$: $|\Delta x| = -\Delta x$, поэтому $\Delta y = -{{k}}\Delta x$,
         и отношение равно $-{{k}}$.
      3. Оба числа получены при $\Delta x \ne 0$; деление законно.

      ### Проверка
      Значения различаются знаком, как и наклоны двух ветвей графика: левая идёт вниз, правая вверх.

      ### Типичная ошибка
      Объявлять оба отношения нулевыми: при $\Delta x \to 0$ приращение функции тоже стремится
      к нулю, но его отношение к шагу — нет.
    feedback:
      correct: 'Верно: слева и справа получаются разные числа.'
      wrong:
        what: Одно из отношений приращений найдено неверно.
        why: Возможно, модуль раскрыт одной и той же формулой для обеих сторон.
        fix: Раскройте $|\Delta x|$ отдельно при $\Delta x > 0$ и при $\Delta x < 0$.
        next: Перечитайте раздел T04 о функции с изломом.
    variants:
