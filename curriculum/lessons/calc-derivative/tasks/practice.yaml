    answer:
      - a
      - b
      - d
    options:
      - id: a
        text: Производные этих функций совпадают во всех точках.
      - id: b
        text: График $f$ получается из графика $g$ сдвигом вверх на 5 единиц.
      - id: c
        text: Производная $f$ больше производной $g$ на 5.
        misconception: E-calc-derivative-constant-differentiated
        why: Свободное слагаемое в приращении сокращается, поэтому на производную оно не влияет.
      - id: d
        text: В точке $x = 0$ обе производные равны нулю.
    hints:
