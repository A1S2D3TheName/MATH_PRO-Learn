  - id: P-13
    type: expression
    role: independent
    purpose: procedure
    level: 3
    outcome: LO-02
    sections:
      - T02
    minutes: 2
    prompt: Функция $f(x) = {{a}}x^2$. Пользуясь определением производной, найдите $f'(x)$. Ответ запишите выражением
      с $x$ — например, в виде `4*x`.
    answer: 6*x
    vars:
      - x
    domain:
      - name: x
        min: -5
        max: 5
    hints:
      - 'Повторите вывод для $f(x) = x^2$: отношение приращений равно $2x + \Delta x$.'
      - При умножении функции на число множитель выносится из приращения.
      - Запишите приращение $a(x + \Delta x)^2 - ax^2$ и сократите дробь.
    solution: |
      ### Ответ
      $f'(x) = 2 \cdot {{a}} \cdot x$.

      ### Идея
      Общий множитель $a$ можно вынести за скобку, а предел для $x^2$ уже известен.

      ### Шаги
      1. $\Delta y = a(x + \Delta x)^2 - ax^2 = a(2x\Delta x + (\Delta x)^2)$.
      2. После деления на $\Delta x$: $a(2x + \Delta x)$.
      3. Предел равен $2ax$.

      ### Проверка
      Проверка на коэффициенте: при $a = 1$ получается прежний ответ $2x$.

      ### Типичная ошибка
      Терять множитель и записывать $ax$ вместо $2ax$.
      Общий код ошибки — `E-calc-derivative-multiplier-lost`.
    feedback:
      correct: 'Верно: множитель выносится, а предел даёт $2ax$.'
      wrong:
        what: Производная записана неверно.
        why: Возможно, потерян множитель 2 или не вынесен коэффициент.
        fix: Раскройте квадрат суммы целиком, затем разделите на $\Delta x$.
        next: Сверьтесь с примером 2 раздела T02.
    errors:
      - E-calc-derivative-multiplier-lost
    variants:
      - params:
          a: 3
        answer: 6*x
      - params:
          a: -2
        answer: -4*x
      - params:
          a: 5
        answer: 10*x
      - params:
          a: -3
        answer: -6*x
      - params:
          a: 4
        answer: 8*x
      - params:
          a: -5
        answer: -10*x
