      - Предел даёт мгновенную скорость, подстановка шага — среднюю.
    solution: |
      ### Ответ
      Мгновенная скорость $v = 10 \cdot {{t0}}$ м/с, средняя на отрезке — $5(2 \cdot {{t0}} + {{h|()}})$ м/с.

      ### Идея
      Считаем отношение приращений пути и времени, затем берём предел и значение при шаге $h$.

