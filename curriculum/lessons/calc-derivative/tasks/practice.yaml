      1. $\Delta y = a(x_0 + \Delta x)^2 + b(x_0 + \Delta x) - ax_0^2 - bx_0
         = (2ax_0 + b)\Delta x + a(\Delta x)^2$.
      2. При $\Delta x \ne 0$: $\Delta y/\Delta x = 2ax_0 + b + a\Delta x$.
      3. Предел при $\Delta x \to 0$: многочлен от шага непрерывен, предел равен $2ax_0 + b$.

