          После домножения числитель равен шагу:
          $(\sqrt{x_0 + h} - \sqrt{x_0})(\sqrt{x_0 + h} + \sqrt{x_0}) = h$.

          ### Типичная ошибка
          Объявлять предел нулём: приращение функции стремится к нулю, но отношение к шагу — нет.
