    sections:
      - T02
    minutes: 2
    prompt: Расставьте шаги вывода производной по определению в правильном порядке.
    answer:
      - step-delta
      - step-expand
      - step-divide
      - step-limit
    items:
      - id: step-delta
        text: записать приращение функции $\Delta y = f(x_0 + \Delta x) - f(x_0)$
      - id: step-expand
        text: подставить формулу функции и раскрыть квадрат суммы
      - id: step-divide
        text: разделить на $\Delta x$ при $\Delta x \ne 0$ и сократить дробь
      - id: step-limit
        text: перейти к пределу при $\Delta x \to 0$
    hints:
      - 'Начните с приращения функции: без него нет отношения.'
      - Деление на $\Delta x$ возможно только при ненулевом шаге, поэтому предел идёт последним.
      - 'Раскрытие квадрата предшествует сокращению: иначе дробь не упростить.'
    solution: |
      ### Ответ
      Порядок: приращение функции → раскрыть квадрат суммы → разделить на $\Delta x$ → предел.

      ### Идея
      Определение производной задаёт жёсткую последовательность действий.

      ### Шаги
      1. Сначала выписываем $\Delta y$.
      2. Затем упрощаем числитель и делим на $\Delta x$.
      3. Только после сокращения переходим к пределу.

      ### Проверка
      На примере $f(x) = x^2$ эта последовательность даёт $2x_0$.

      ### Типичная ошибка
      Подставлять $\Delta x = 0$ до сокращения: тогда получается неопределённость.
    feedback:
