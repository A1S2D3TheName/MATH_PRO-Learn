  - id: P-19
    type: match
    role: independent
    purpose: meaning
    level: 2
    outcome: LO-03
    sections:
      - T04
    minutes: 2
    prompt: Сопоставьте функцию и её производную.
    answer:
      - left: f-square
        right: d-two-x
      - left: f-line
        right: d-two
      - left: f-three
        right: d-six-x
    left:
      - id: f-square
        text: $f(x) = x^2$
      - id: f-line
        text: $f(x) = 2x + 1$
      - id: f-three
        text: $f(x) = 3x^2$
    right:
      - id: d-two-x
        text: $f'(x) = 2x$
      - id: d-two
        text: $f'(x) = 2$
      - id: d-six-x
        text: $f'(x) = 6x$
      - id: d-value
        text: $f'(x) = x^2$
    hints:
      - Производная квадрата равна $2x$, а линейная функция растёт с постоянной скоростью.
      - Множитель перед $x^2$ выносится в производную.
      - Лишняя карточка — значение функции, а не производная.
    solution: |
      ### Ответ
      $x^2 \to 2x$, $2x + 1 \to 2$, $3x^2 \to 6x$.

      ### Идея
      Постоянное слагаемое сокращается в приращении, а множитель перед $x^2$ переходит в производную.

      ### Шаги
      1. $f(x) = x^2$ даёт $f'(x) = 2x$.
      2. У линейной функции производная равна коэффициенту при $x$.
      3. У $3x^2$ производная равна $6x$: множитель 3 сохраняется.

      ### Проверка
      Лишняя карточка $x^2$ — значение функции, записанное как производная.

      ### Типичная ошибка
      Записывать значение функции вместо производной.
      Общий код ошибки — `E-calc-derivative-value-instead`.
    feedback:
      correct: 'Верно: пары соответствуют производным.'
      wrong:
        what: Пары составлены неверно.
        why: Возможно, функция сопоставлена своему значению вместо производной.
        fix: 'Проверьте каждую пару по определению: отношение приращений в пределе.'
        next: Перечитайте раздел T04.
    errors:
      - E-calc-derivative-value-instead
  - id: P-20
    type: number
    role: independent
    purpose: procedure
    level: 2
    outcome: LO-03
    sections:
      - T03
    minutes: 3
    unit: км/ч
    prompt: Тело движется по закону $s(t) = 5t^2$ (путь в метрах, время в секундах). Найдите мгновенную скорость
      в момент $t_0 = {{t0}}$ с и выразите её в километрах в час.
    answer: '72'
    hints:
      - Мгновенная скорость — это предел отношения приращений пути и времени, то есть производная $s'(t_0)$.
      - Сначала найдите скорость в метрах в секунду, а затем переведите метры в километры, а секунды — в часы.
      - Запишите отношение приращений для $s(t) = 5t^2$, упростите и найдите предел — это
        скорость в м/с.
    solution: |
      ### Ответ
      $36 \cdot {{t0}}$ км/ч.

      ### Идея
      Сначала берём производную пути — она и есть мгновенная скорость, — затем переводим единицы.

      ### Шаги
      1. $\Delta s = 5(2 t_0 h + h^2)$, значит $\dfrac{\Delta s}{\Delta t} = 5(2t_0 + h)$ м/с.
      2. При $h \to 0$ получаем мгновенную скорость $v(t_0) = 10 t_0$ м/с.
      3. Перевод единиц: $10 t_0 \cdot 3{,}6 = 36 t_0$ км/ч.

      ### Проверка
      $10 \cdot {{t0}} \cdot 3{,}6 = 36 \cdot {{t0}}$ — перевод единиц сходится с примером 1 раздела T03.

      ### Типичная ошибка
      Перевести единицы делением на 3,6 вместо умножения — тогда скорость занижается в 12,96 раза.
    feedback:
      correct: 'Верно: производная дала скорость в м/с, умножение на 3,6 перевело её в км/ч.'
      wrong:
        what: Скорость или перевод единиц посчитаны неверно.
        why: Возможно, вместо предела отношения приращений взято само отношение при шаге $h$ либо множитель 3,6 применён делением.
        fix: Сначала получите $10 t_0$ м/с из предела, затем умножьте на $3600/1000 = 3{,}6$.
        next: Перечитайте пример 1 и пример 2 раздела T03.
    variants:
