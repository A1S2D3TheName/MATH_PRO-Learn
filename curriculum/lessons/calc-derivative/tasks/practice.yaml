      - Сдвиг графика вверх не поворачивает касательную ни в одной точке.
      - Производная $x^2$ равна $2x$; прибавление пятёрки её не меняет.
    solution: |
      ### Ответ
      Верны утверждения A, B и D; производные обеих функций равны $2x$.

      ### Идея
      Разбираем каждое утверждение по отдельности.

      ### Шаги
      1. $\Delta y$ для $f$ равно $\Delta y$ для $g$: пятёрки сокращаются.
      2. Производная обеих функций равна $2x$, в нуле она равна 0.
      3. Утверждение «больше на 5» неверно: слагаемое 5 в производной не появляется.

      ### Проверка
      Подстановка $x = 3$: обе производные равны 6, а не 11.

