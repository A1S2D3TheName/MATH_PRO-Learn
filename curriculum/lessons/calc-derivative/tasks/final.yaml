      - Используйте приращение из первого шага.
      - Разделите $2x_0h + h^2$ на $h$ при $h \ne 0$.
    solution: |
      ### Ответ
      $\Delta y/\Delta x = 2 \cdot {{x0}} + {{h|()}}$.

      ### Идея
      Делим приращение функции на приращение аргумента.

      ### Шаги
      1. $\Delta y = 2x_0 h + h^2$.
      2. После сокращения: $\Delta y/\Delta x = 2x_0 + h$.

