    level: 2
    outcome: LO-01
    sections:
      - T01
    minutes: 2
    prompt: Шаг 1. Функция $f(x) = x^2$. Найдите приращение функции $\Delta y$ при переходе из точки $x_0 = {{x0}}$
      в точку $x_0 + {{h}}$.
    answer: '7'
    hints:
      - Приращение — разность значений функции в новой и старой точках.
      - Новая точка равна $x_0 + {{h}}$.
      - Раскройте $(x_0 + h)^2$ и вычтите $x_0^2$.
    solution: |
      ### Ответ
      $\Delta y = 2 \cdot {{x0}} \cdot {{h|()}} + {{h|()}}^2$.

      ### Идея
      Считаем разность значений функции.

      ### Шаги
      1. $f(x_0 + h) = (x_0 + h)^2$.
      2. $\Delta y = 2x_0 h + h^2$.

      ### Проверка
      При $h = 1$ получается $2x_0 + 1$ — формула из раздела T01.

      ### Типичная ошибка
      Раскрывать квадрат покомпонентно.
      Общий код ошибки — `E-calc-derivative-square-sum`.
    feedback:
      correct: 'Верно: приращение функции найдено.'
      wrong:
        what: Приращение посчитано неверно.
        why: Возможно, потеряно удвоенное произведение.
        fix: Раскройте квадрат суммы полностью.
        next: Перечитайте раздел T01.
      misconceptions:
        - id: E-calc-derivative-square-sum
          when:
