    prompt: Шаг 4. Функция $f(x) = x^3$. Найдите наклон секущей в точке $x_0 = {{x0}}$ при шаге $h = 1$ и
      производную $f'(x_0)$ по определению. Ответы введите двумя числами.
    answer:
      sec: '37'
      diff: '10'
    fields:
      - id: sec
        label: Наклон секущей при шаге 1
      - id: diff
        label: На сколько наклон секущей больше производной
    hints:
      - Наклон секущей — значение отношения приращений при шаге 1, производная — предел того же
        отношения.
      - Раскройте куб суммы $(x_0 + 1)^3$.
      - 'Сравните наклон секущей с пределом: разность — линейная функция от $x_0$.' 
    solution: |
      ### Ответ
      Наклон секущей равен $3 \cdot {{x0}}^2 + 3 \cdot {{x0}} + 1 = {{sec}}$; производная равна
      $3 \cdot {{x0}}^2 = {{der}}$; разность равна $3 \cdot {{x0}} + 1 = {{diff}}$.

      ### Идея
      Повторяем выкладку шагов 2–3, но для куба: сначала отношение приращений, затем предел.

      ### Шаги
      1. $\Delta y = (x_0 + 1)^3 - x_0^3 = 3x_0^2 + 3x_0 + 1$.
      2. Наклон секущей: $\Delta y/1 = 3x_0^2 + 3x_0 + 1$.
      3. Предел: $f'(x_0) = 3x_0^2$; разность равна $3x_0 + 1$.

      ### Проверка
      При $x_0 = {{x0}}$: секущая ${{sec}}$, предел ${{der}}$, разность ${{diff}}$ — сходится.

      ### Типичная ошибка
      Принять наклон секущей при шаге 1 за производную.
    feedback:
      correct: 'Верно: секущая и предел различены, разность найдена.'
      wrong:
        what: Одно из чисел найдено неверно.
        why: Возможно, наклон секущей при шаге 1 принят за производную.
        fix: Сначала сократите дробь, затем берите предел; наклон секущей — значение при шаге 1.
        next: Перечитайте пример 4 раздела T04.
