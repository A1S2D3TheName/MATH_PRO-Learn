title: От приращения к производной
context_id: parabola-at-point
scenario: 'Исследуем функцию $f(x) = x^2$ в точке $x_0 = {{x0}}$: шаг за шагом пройдём от приращения функции
  к производной; на последнем шаге перенесём выкладку на куб.'
