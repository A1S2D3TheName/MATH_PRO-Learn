# Входная диагностика (STANDARD.md §6, правило 15): 4 задачи по прямому пререквизиту num-mult-table,
# outcome записывается как `num-mult-table/LO-NN` (пакет пререквизита ещё не опубликован).
tasks:
- id: D-01
  type: number
  role: diagnostic
  purpose: procedure
  level: 0
  outcome: num-mult-table/LO-01
  sections:
  - T01
  minutes: 1
  prompt: Найдите произведение 7 × 8. Введите ответ числом.
  answer: 56
  hints:
  - Вспомните факт про семь восьмёрок.
  - Можно досчитать группами по 8.
  - 'Проверьте обратным фактом: произведение делится на 8.'
  solution: '### Ответ

    56


    ### Идея

    Восстанавливаем табличный факт: семь восьмёрок.


    ### Шаги

    1. Считаем группами по 8 семь раз: 8, 16, 24, 32, 40, 48, 56.

    2. Факт: 7 × 8 = 56.


    ### Проверка

    Обратный факт: 56 ÷ 8 = 7.


    ### Типичная ошибка

    Перепутан соседний факт — пересчитываем рядами.

    '
  feedback:
    correct: Верно, факт помнится.
    wrong:
      what: 'Произведение семи восьмёрок не совпало.'
      why: Возможно, перепутана строка таблицы.
      fix: Пересчитайте группами по 8.
      next: 'Таблица умножения: соседние факты.'
- id: D-02
  type: number
  role: diagnostic
  purpose: procedure
  level: 0
  outcome: num-mult-table/LO-02
  sections:
  - T01
  minutes: 1
  prompt: Сколько раз число 6 содержится в 42? Введите ответ числом.
  answer: 7
  hints:
  - Это обратный вопрос к факту таблицы.
  - Считайте шестёрками до 42.
  - Сколько шагов по 6 до 42 — столько и ответ.
  solution: '### Ответ

    7


    ### Идея

    Деление — обратный вопрос: сколько шестёрок в сорока двух.


    ### Шаги

    1. Считаем шестёрками: 6, 12, 18, 24, 30, 36, 42.

    2. Шагов семь.


    ### Проверка

    Проверка умножением: 6 × 7 = 42.


    ### Типичная ошибка

    Счесть до 42 единицами и сбиться.

    '
  feedback:
    correct: Верно, деление найдено.
    wrong:
      what: 'Число шагов по 6 не совпало.'
      why: Счёт шагами сбился.
      fix: Пересчитайте шестёрками.
      next: Факты семейства чисел.
- id: D-03
  type: number
  role: diagnostic
  purpose: meaning
  level: 1
  outcome: num-mult-table/LO-02
  sections:
  - T01
  minutes: 1
  prompt: В зале 4 ряда по 9 кресел. Сколько кресел всего? Введите число кресел.
  answer: 36
  hints:
  - Ряды перемножаем с числом кресел в ряду.
  - Каждый ряд даёт по 9 кресел.
  - Сложите четыре девятки.
  solution: '### Ответ

    36


    ### Идея

    Ряды на колонки — смысл умножения.


    ### Шаги

    1. Рядов 4, в каждом 9 кресел.

    2. 4 × 9 = 36.


    ### Проверка

    Тот же зал: 9 рядов по 4 — 36.


    ### Типичная ошибка

    Сложить ряды и колонки вместо умножения.

    '
  feedback:
    correct: Верно, ряды умножены.
    wrong:
      what: Число кресел не совпало.
      why: Ряды сложены с колонками.
      fix: Умножьте 4 на 9.
      next: 'Смысл умножения: ряды на колонки.'
- id: D-04
  type: number
  role: diagnostic
  purpose: meaning
  level: 1
  outcome: num-mult-table/LO-01
  sections:
  - T01
  minutes: 1
  prompt: Известно, что 6 × 7 = 42. Чему равно 7 × 6? Введите ответ числом.
  answer: 42
  hints:
  - Множители можно менять местами.
  - Новое произведение считать заново не обязательно.
  - Проверьте тем же фактом.
  solution: '### Ответ

    42


    ### Идея

    Перестановка множителей факт не меняет.


    ### Шаги

    1. Знаем 6 × 7 = 42.

    2. Меняем местами: 7 × 6 — то же число.


    ### Проверка

    Ряды и колонки того же класса: 42.


    ### Типичная ошибка

    Посчитать новое произведение с нуля и сбиться.

    '
  feedback:
    correct: Верно, факт перенесён.
    wrong:
      what: 'Значение 7 × 6 не совпало.'
      why: Произведение пересчитано с ошибкой.
      fix: Меняйте множители местами смело.
      next: Свойства умножения, раздел T01.
