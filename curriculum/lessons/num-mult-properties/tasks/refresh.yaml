      ### Шаги

      1. 37 ≈ 40, 13 ≈ 10.

      2. Оценка: 400.


      ### Проверка

      Точный счёт лежит рядом с оценкой.


      ### Типичная ошибка

      Перепутать округления множителей.

      '
  - params:
      a: 26
      b: 19
      ra: 30
      rb: 20
    answer: 600
    solution: '### Ответ

      600


      ### Идея

      Оценка — произведение округлённых множителей.


      ### Шаги

      1. 26 ≈ 30, 19 ≈ 20.

      2. Оценка: 600.


      ### Проверка

      Точный счёт лежит рядом с оценкой.


      ### Типичная ошибка

      Перепутать округления множителей.

      '
  - params:
      a: 41
      b: 22
      ra: 40
      rb: 20
    answer: 800
    solution: '### Ответ

      800


      ### Идея

      Оценка — произведение округлённых множителей.


      ### Шаги

      1. 41 ≈ 40, 22 ≈ 20.

      2. Оценка: 800.


      ### Проверка

      Точный счёт лежит рядом с оценкой.


      ### Типичная ошибка

      Перепутать округления множителей.

      '
  hints:
  - Округляйте каждый множитель отдельно.
  - Круглые числа перемножаются таблицей.
  - Оценка — ориентир, а не точный ответ.
  solution: '### Ответ

    {{ra}} × {{rb}}


    ### Идея

    Оценка произведения — произведение округлённых множителей.


    ### Шаги

    1. Округляем оба множителя.

    2. Перемножаем круглые числа.


    ### Проверка

    Точный счёт лежит рядом с оценкой.


    ### Типичная ошибка

    Округлить один множитель и забыть второй.

    '
  feedback:
    correct: Верно, множители округлены и перемножены.
    wrong:
      what: 'Оценка обоих множителей не совпала.'
      why: Ошибка в одном из округлений.
      fix: Округлите до десятков оба множителя.
      next: Раздел T04.
- id: R-05
  type: number
  role: refresh
  purpose: method
  level: 2
  outcome: LO-02
  sections:
  - T03
  minutes: 3
  prompt: Ученик посчитал {{a}} × ({{b}} × 10) как {{a}} × {{b}} = {{p}}. На сколько его ответ меньше верного?
  answer: 252
  variants:
  - params:
      a: 7
      b: 4
      p: 28
    answer: 252
    solution: '### Ответ

      252


      ### Идея

      Потеря перевода десятков занижает ответ в 10 раз; находим разность.


      ### Шаги

      1. Верно: 28 × 10 = 280.

      2. Ученик: 28. Разность: 252.


      ### Проверка

      Проверка сложением: 252 + 28 = 280 — верный счёт.


      ### Типичная ошибка

      Сравнение вести от меньшего к большему.

      '
  - params:
      a: 6
      b: 3
      p: 18
    answer: 162
    solution: '### Ответ

      162


      ### Идея

      Потеря перевода десятков занижает ответ в 10 раз; находим разность.


      ### Шаги

      1. Верно: 18 × 10 = 180.

      2. Ученик: 18. Разность: 162.


      ### Проверка

      Проверка сложением: 162 + 18 = 180 — верный счёт.


      ### Типичная ошибка

      Сравнение вести от меньшего к большему.

      '
  - params:
      a: 8
      b: 5
      p: 40
    answer: 360
    solution: '### Ответ

      360


      ### Идея

      Потеря перевода десятков занижает ответ в 10 раз; находим разность.


      ### Шаги

      1. Верно: 40 × 10 = 400.

      2. Ученик: 40. Разность: 360.


      ### Проверка

      Проверка сложением: 360 + 40 = 400 — верный счёт.


      ### Типичная ошибка

      Сравнение вести от меньшего к большему.

      '
  hints:
  - Сравните остановку на десятках с полным счётом.
  - 'Начните с полного счёта: {{p}} × 10 — это верный результат.'
  - 'Остаётся сравнить его с ответом ученика {{p}}.'
  solution: '### Ответ

    {{p}} × 10 − {{p}}


    ### Идея

    Потерянный перевод десятков занижает ответ; находим разность.


    ### Шаги

    1. Верно: {{p}} × 10.

    2. Ученик: p.

    3. Разность ответов.


    ### Проверка

    Разность положительна: ответ ученика меньше.


    ### Типичная ошибка

    Сравнение в обратную сторону.

    '
  feedback:
    correct: Верно, потеря найдена.
    wrong:
      what: 'Разность верного и неверного ответов не совпала.'
      why: Посчитана не та разность.
      fix: Верный ответ минус ответ ученика.
      next: Раздел T03.
    misconceptions:
    - id: E-num-mult-properties-stop-after-first
      when:
        expr: a * b
      message: Табличная часть без перевода десятков.
  errors:
  - E-num-mult-properties-stop-after-first
