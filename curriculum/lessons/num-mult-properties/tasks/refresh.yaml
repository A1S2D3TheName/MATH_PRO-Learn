# Повторение (STANDARD.md §8): 5 задач, у каждой параметрической не менее трёх вариантов.
tasks:
- id: R-01
  type: number
  role: refresh
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T01
  minutes: 3
  prompt: 'Умножьте в любом удобном порядке: {{a}} × {{b}} × {{c}}.'
  answer: 40
  variants:
  - params:
      a: 2
      b: 4
      c: 5
    answer: 40
    solution: '### Ответ

      40


      ### Идея

      Меняем порядок множителей так, чтобы шаг остался табличным.


      ### Шаги

      1. Удобная пара: 2 × 5 = 10.

      2. Оставшийся множитель: 10 × 4 = 40.


      ### Проверка

      Слева направо выходит то же число.


      ### Типичная ошибка

      Забыть третий множитель.

      '
  - params:
      a: 3
      b: 3
      c: 6
    answer: 54
    solution: '### Ответ

      54


      ### Идея

      Меняем порядок множителей так, чтобы шаг остался табличным.


      ### Шаги

      1. Удобная пара: 3 × 6 = 18.

      2. Оставшийся множитель: 18 × 3 = 54.


      ### Проверка

      Слева направо выходит то же число.


      ### Типичная ошибка

      Забыть третий множитель.

      '
  - params:
      a: 2
      b: 7
      c: 5
    answer: 70
    solution: '### Ответ

      70


      ### Идея

      Меняем порядок множителей так, чтобы шаг остался табличным.


      ### Шаги

      1. Удобная пара: 2 × 5 = 10.

      2. Оставшийся множитель: 10 × 7 = 70.


      ### Проверка

      Слева направо выходит то же число.


      ### Типичная ошибка

      Забыть третий множитель.

      '
  hints:
  - Скобки переставляем — ответ не изменится.
  - Найдите пару с круглым произведением.
  - Третий множитель умножайте в конце.
  solution: '### Ответ

    {{a}} × ({{b}} × {{c}})


    ### Идея

    Группируем так, чтобы шаг остался привычным.


    ### Шаги

    1. Удобная пара множителей.

    2. Умножение на третий.


    ### Проверка

    Любой порядок даёт одно число.


    ### Типичная ошибка

    Оставить пару без третьего множителя.

    '
  feedback:
    correct: Верно, порядок удобен.
    wrong:
      what: 'Произведение трёх чисел не совпало.'
      why: Множитель потерян.
      fix: Перемножьте все три числа.
      next: Раздел T01.
- id: R-02
  type: number
  role: refresh
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T02
  minutes: 3
  prompt: 'Раскройте скобки и посчитайте: {{a}} × ({{b}} + {{c}}).'
  answer: 65
  variants:
  - params:
      a: 5
      b: 10
      c: 3
    answer: 65
    solution: '### Ответ

      65


      ### Идея

      Внешний множитель доходит до обеих частей скобки.


      ### Шаги

      1. 5 × 10 = 50, 5 × 3 = 15.

      2. Сумма частей: 65.


      ### Проверка

      Прямое 5 × 13 = 65.


      ### Типичная ошибка

      Прибавить часть скобки без множителя.

      '
  - params:
      a: 7
      b: 10
      c: 2
    answer: 84
    solution: '### Ответ

      84


      ### Идея

      Внешний множитель доходит до обеих частей скобки.


      ### Шаги

      1. 7 × 10 = 70, 7 × 2 = 14.

      2. Сумма частей: 84.


      ### Проверка

      Прямое 7 × 12 = 84.


      ### Типичная ошибка

      Прибавить часть скобки без множителя.

      '
  - params:
      a: 4
      b: 10
      c: 6
    answer: 64
    solution: '### Ответ

      64


      ### Идея

      Внешний множитель доходит до обеих частей скобки.


      ### Шаги

      1. 4 × 10 = 40, 4 × 6 = 24.

      2. Сумма частей: 64.


      ### Проверка

      Прямое 4 × 16 = 64.


      ### Типичная ошибка

      Прибавить часть скобки без множителя.

      '
  hints:
  - Каждая часть скобки получает внешний множитель.
  - Сложите частичные произведения.
  - Проверьте прямым счётом.
  solution: '### Ответ

    {{a}} × {{b}} + {{a}} × {{c}}


    ### Идея

    Множим обе части скобки, затем складываем.


    ### Шаги

    1. Первая часть.

    2. Вторая часть.

    3. Сложение.


    ### Проверка

    Прямое произведение совпадает.


    ### Типичная ошибка

    Часть скобки без множителя.

    '
  feedback:
    correct: Верно, скобка раскрыта.
    wrong:
      what: Раскрытие не сошлось.
      why: Множитель дошёл только до первой части.
      fix: 'Раскройте скобку: множитель идёт в обе части.'
      next: Раздел T02.
- id: R-03
  type: number
  role: refresh
  purpose: procedure
  level: 2
  outcome: LO-02
  sections:
  - T03
  minutes: 3
  prompt: Сначала считайте {{r}} × {{b}}, затем вычтите {{d}} × {{b}}. Введите итог.
  answer: 63
  variants:
  - params:
      r: 10
      d: 1
      b: 7
    answer: 63
    solution: '### Ответ

      63


      ### Идея

      Круглое произведение минус лишние группы — компенсация.


      ### Шаги

      1. 10 × 7 = 70.

      2. Убираем 1 групп по 7: 63.


      ### Проверка

      Прямое 9 × 7 = 63.


      ### Типичная ошибка

      Поправку прибавить вместо вычитания.

      '
  - params:
      r: 10
      d: 1
      b: 6
    answer: 54
    solution: '### Ответ

      54


      ### Идея

      Круглое произведение минус лишние группы — компенсация.


      ### Шаги

      1. 10 × 6 = 60.

      2. Убираем 1 групп по 6: 54.


      ### Проверка

      Прямое 9 × 6 = 54.


      ### Типичная ошибка

      Поправку прибавить вместо вычитания.

      '
  - params:
      r: 10
      d: 2
      b: 9
    answer: 72
    solution: '### Ответ

      72


      ### Идея

      Круглое произведение минус лишние группы — компенсация.


      ### Шаги

      1. 10 × 9 = 90.

      2. Убираем 2 групп по 9: 72.


      ### Проверка

      Прямое 8 × 9 = 72.


      ### Типичная ошибка

      Поправку прибавить вместо вычитания.

      '
  hints:
  - Это округление вверх с возвратом лишнего.
  - Лишних групп ровно {{d|pl:группа,группы,групп}} по {{b}}.
  - Круглое произведение уже содержит лишние группы.
  solution: '### Ответ

    {{r}} × {{b}} − {{d}} × {{b}}


    ### Идея

    Компенсация: лишнее, взятое округлением, возвращаем.


    ### Шаги

    1. Круглое произведение.

    2. Вычитание лишних групп.


    ### Проверка

    Прямое умножение подтверждает итог.


    ### Типичная ошибка

    Вычитать d без размера группы.

    '
  feedback:
    correct: Верно, компенсация применена.
    wrong:
      what: Итог не совпал.
      why: Поправка взята неверно.
      fix: Вычтите ровно {{d|pl:группа,группы,групп}} по {{b}}.
      next: Раздел T03.
