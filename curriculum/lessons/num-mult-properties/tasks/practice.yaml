      ### Проверка

      Рядами по 50: 9 × 50 = 450.


      ### Типичная ошибка

      Приписать лишний нуль или забыть его — ответ уедет в 10 раз.

      '
  hints:
  - Приписать нуль — значит перевести десятки в единицы.
  - Начните с табличной части {{a}} × {{b}}.
  - 'Проверьте: ответ в десять раз больше табличной части.'
  solution: '### Ответ

    табличная часть и нуль


    ### Идея

    Число десятков находим таблицей, переводим приписыванием нуля.


    ### Шаги

    1. Табличная часть: {{a}} × {{b}}.

    2. Приписываем нуль.


    ### Проверка

    Ряды по {{b|pl:десяток,десятка,десятков}} десятков дают тот же итог.


    ### Типичная ошибка

    Приписать лишний нуль или забыть его — ответ уедет в 10 раз.

    '
  feedback:
    correct: Верно, нуль приписан к табличной части.
    wrong:
      what: 'Значение с дописанным нулём не совпало.'
      why: Нуль приписан дважды или потерян.
      fix: Один нуль — один множитель 10.
      next: Раздел T03.
    misconceptions:
    - id: E-num-mult-properties-stop-after-first
      when:
        expr: a * b
      message: Табличная часть найдена, перевод десятков пропущен.
  errors:
  - E-num-mult-properties-stop-after-first
