# Основной банк (STANDARD.md §6–§8): 26 задач без challenge + 1 challenge, роли warmup/supported/
# independent/challenge, доли уровней 10/30/30/20/10 (±5 п.п.). Сюжеты: школьный класс, библиотека,
# витрина кондитерской и автобусы.
tasks:
- id: P-01
  type: number
  role: warmup
  purpose: procedure
  level: 0
  outcome: LO-01
  sections:
  - T01
  minutes: 1
  prompt: Найдите произведение {{a}} × {{b}}.
  answer: 56
  variants:
  - params:
      a: 7
      b: 8
    answer: 56
    solution: '### Ответ

      56


      ### Идея

      Берём факт из таблицы: множители читаются как число рядов и размер ряда.


      ### Шаги

      1. Имеем 7 × 8.

      2. По таблице 7 × 8 = 56.


      ### Проверка

      Обратный факт: 56 ÷ 8 = 7.


      ### Типичная ошибка

      Пропуск факта в ряду таблицы сбивает на одно произведение; пересчитываем группами.

      '
  - params:
      a: 6
      b: 9
    answer: 54
    solution: '### Ответ

      54


      ### Идея

      Берём факт из таблицы: множители читаются как число рядов и размер ряда.


      ### Шаги

      1. Имеем 6 × 9.

      2. По таблице 6 × 9 = 54.


      ### Проверка

      Обратный факт: 54 ÷ 9 = 6.


      ### Типичная ошибка

      Пропуск факта в ряду таблицы сбивает на одно произведение; пересчитываем группами.

      '
  hints:
  - Вспомните факт про семь восьмёрок или про шесть девяток.
  - 'Считайте группами: по {{b}} ровно {{a}} раз.'
  - Проверьте обратным фактом через деление.
  solution: '### Ответ

    {{a}} × {{b}}


    ### Идея

    Берём факт из таблицы умножения.


    ### Шаги

    1. Первый множитель — число групп, второй — размер группы.

    2. Находим значение по таблице.


    ### Проверка

    Обратный факт через деление возвращает первый множитель.


    ### Типичная ошибка

    Пропуск факта в ряду таблицы сбивает на одно произведение; пересчитываем группами.

    '
  feedback:
    correct: Верно, факт найден.
    wrong:
      what: 'Произведение {{a}} × {{b}} не совпало.'
      why: Возможно, взят соседний факт вместо нужного.
      fix: 'Пересчитайте группами по {{b}} и назовите факт.'
      next: Раздел T01.
- id: P-02
  type: number
  role: warmup
  purpose: meaning
  level: 0
  outcome: LO-01
  sections:
  - T01
  minutes: 1
  prompt: В классе {{r|pl:ряд,ряда,рядов}}, в каждом ряду по {{c|pl:парта,парты,парт}}. Сколько всего парт в классе?
  answer: 28
  variants:
  - params:
      r: 4
      c: 7
    answer: 28
    solution: '### Ответ

      28


      ### Идея

      Ровные ряды парт — это произведение числа рядов на размер ряда.


      ### Шаги

      1. Рядов 4, в каждом по 7 парт.

      2. Всего: 4 × 7 = 28 парт.


      ### Проверка

      Разворот класса: 7 колонок по 4 — снова 28.


      ### Типичная ошибка

      Перепутать число рядов и размер группы: ряды пересчитываем по схеме класса.

      '
  - params:
      r: 6
      c: 3
    answer: 18
    solution: '### Ответ

      18


      ### Идея

      Ровные ряды парт — это произведение числа рядов на размер ряда.


      ### Шаги

      1. Рядов 6, в каждом по 3 парты.

      2. Всего: 6 × 3 = 18 парт.


      ### Проверка

      Разворот класса: 3 колонки по 6 — снова 18.


      ### Типичная ошибка

      Перепутать число рядов и размер группы: ряды пересчитываем по схеме класса.

      '
  hints:
  - Парты стоят рядами — важны и число рядов, и размер ряда.
  - Каждый ряд даёт одинаковое число парт.
  - Умножьте число рядов на число парт в ряду.
  solution: '### Ответ

    {{r}} × {{c}} — всего парт


    ### Идея

    Ровные ряды парт считаем произведением рядов на размер ряда.


    ### Шаги

    1. Рядов {{r|pl:ряд,ряда,рядов}}, в каждом по {{c|pl:парта,парты,парт}}.

    2. Находим значение по таблице.


    ### Проверка

    Разворот класса: колонок {{c|pl:колонка,колонки,колонок}}, в каждой по {{r|pl:парта,парты,парт}} — итог тот же.


    ### Типичная ошибка

    Перепутать число рядов и размер группы: ряды пересчитываем по схеме класса.

    '
  feedback:
    correct: Верно, весь класс посчитан.
    wrong:
      what: Число парт не совпало.
      why: Ряды перемножены не с тем числом.
      fix: Уточните число рядов и размер ряда.
      next: Раздел T01, пример с партами.
- id: P-03
  type: number
  role: warmup
  purpose: procedure
  level: 1
  outcome: LO-02
  sections:
  - T03
  minutes: 1
  prompt: Найдите {{a}} × ({{b}} × 10).
  answer: 240
  variants:
  - params:
      a: 8
      b: 3
    answer: 240
    solution: '### Ответ

      240


      ### Идея

      Второй множитель — десяток: сначала табличная часть, затем перевод десятков в единицы.


      ### Шаги

      1. Считаем 8 × 3 = 24.

      2. Это десятки: 24 × 10 = 240.


      ### Проверка

      Проверка рядами: 8 × 30 = 240.


      ### Типичная ошибка

      Забыть домножить на 10 и оставить только табличную часть.

      '
  - params:
      a: 7
      b: 5
    answer: 350
    solution: '### Ответ

      350


      ### Идея

      Второй множитель — десяток: сначала табличная часть, затем перевод десятков в единицы.


      ### Шаги

      1. Считаем 7 × 5 = 35.

      2. Это десятки: 35 × 10 = 350.


      ### Проверка

      Проверка рядами: 7 × 50 = 350.


      ### Типичная ошибка

      Забыть домножить на 10 и оставить только табличную часть.

      '
  hints:
  - Сколько будет {{a}} × {{b}} — настолько и десятков.
  - 'Группировку можно переставить: начните с табличной части.'
  - К значению табличной части припишите нуль — это перевод десятков в единицы.
  solution: '### Ответ

    {{a}} × ({{b}} × 10)


    ### Идея

    Десятки считаем таблицей, затем переводим в единицы.


    ### Шаги

    1. {{a}} × {{b}} — число десятков.

    2. Умножаем десятки на 10.


    ### Проверка

    Проверка рядами по {{b|pl:десятку,десяткам,десяткам}} десяткам ведёт к тому же числу.


    ### Типичная ошибка

    Забыть домножить на 10 и оставить только табличную часть.

    '
  feedback:
    correct: Верно, десятки переведены.
    wrong:
      what: 'Значение с множителем 10 не совпало.'
      why: Возможно, остановились на табличной части.
      fix: Не забудьте умножить на 10.
      next: Раздел T03.
    misconceptions:
    - id: E-num-mult-properties-stop-after-first
      when:
        expr: a * b
      message: Табличная часть найдена, десятки потеряны.
  errors:
  - E-num-mult-properties-stop-after-first
- id: P-04
  type: number
  role: warmup
  purpose: procedure
  level: 0
  outcome: LO-03
  sections:
  - T04
  minutes: 1
  prompt: 'Множители {{a}} × {{b}} округлили до десятков: получилось {{ra}} × {{rb}}. Введите оценку произведения.'
  answer: 600
  variants:
  - params:
      a: 34
      b: 18
      ra: 30
      rb: 20
    answer: 600
    solution: '### Ответ

      600


      ### Идея

      Оценка — произведение округлённых множителей; здесь округления уже подобраны.


      ### Шаги

      1. Берём округлённые числа: 30 и 20.

      2. Оценка: 30 × 20 = 600.


      ### Проверка

      Точное 34 × 18 = 612 лежит рядом с 600.


      ### Типичная ошибка

      Принять оценку за точный ответ: оценка лишь соседствует с истиной.

      '
  - params:
      a: 12
      b: 19
      ra: 10
      rb: 20
    answer: 200
    solution: '### Ответ

      200


      ### Идея

      Оценка — произведение округлённых множителей; здесь округления уже подобраны.


      ### Шаги

      1. Берём округлённые числа: 10 и 20.

      2. Оценка: 10 × 20 = 200.


      ### Проверка

      Точное 12 × 19 = 228 лежит рядом с 200.


      ### Типичная ошибка

      Принять оценку за точный ответ: оценка лишь соседствует с истиной.

      '
  hints:
  - Округлённые множители уже записаны — их и перемножаем.
  - Оценка отвечает быстро и близко, но не точно.
  - 'Проверьте порядок: точный ответ рядом с оценкой.'
  solution: '### Ответ

    {{ra}} × {{rb}}


    ### Идея

    Оценка произведения — произведение округлённых множителей.


    ### Шаги

    1. Берём округлённые {{ra}} и {{rb}}.

    2. Перемножаем круглые числа.


    ### Проверка

    Точный счёт частями лежит рядом с оценкой.


    ### Типичная ошибка

    Принять оценку за точный ответ: оценка лишь соседствует с истиной.

    '
  feedback:
    correct: Верно, круглые множители перемножены.
    wrong:
      what: 'Оценка {{ra}} × {{rb}} не совпала.'
      why: Перемножены не те числа.
      fix: Умножьте округлённые множители.
      next: Раздел T04.
- id: P-05
  type: number
  role: supported
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T01
  minutes: 2
  prompt: 'Вычислите, группируя удобно: {{a}} × {{b}} × {{m}}.'
  answer: 60
  variants:
  - params:
      a: 3
      b: 4
      m: 5
    answer: 60
    solution: '### Ответ

      60


      ### Идея

      Скобки в одном произведении переставляем так, чтобы шаг остался табличным.


      ### Шаги

      1. Удобная пара: 4 × 5 = 20.

      2. Тогда 3 × 20 = 60.


      ### Проверка

      Прямой счёт слева направо: 12 × 5 = 60.


      ### Типичная ошибка

      Оставить только первую пару множителей — произведение не досчитано.

      '
  - params:
      a: 2
      b: 3
      m: 5
    answer: 30
    solution: '### Ответ

      30


      ### Идея

      Скобки в одном произведении переставляем так, чтобы шаг остался табличным.


      ### Шаги

      1. Удобная пара: 3 × 5 = 15.

      2. Тогда 2 × 15 = 30.


      ### Проверка

      Прямой счёт слева направо: 6 × 5 = 30.


      ### Типичная ошибка

      Оставить только первую пару множителей — произведение не досчитано.

      '
  - params:
      a: 4
      b: 5
      m: 2
    answer: 40
    solution: '### Ответ

      40


      ### Идея

      Скобки в одном произведении переставляем так, чтобы шаг остался табличным.


      ### Шаги

      1. Удобная пара: 5 × 2 = 10.

      2. Тогда 4 × 10 = 40.


      ### Проверка

      Прямой счёт слева направо: 20 × 2 = 40.


      ### Типичная ошибка

      Оставить только первую пару множителей — произведение не досчитано.

      '
  hints:
  - Иногда выгоднее сначала умножить последние два множителя.
  - Найдите пару с круглым или табличным произведением.
  - 'Скобки переставляем знаком умножения: группы можно собирать заново.'
  solution: '### Ответ

    {{a}} × ({{b}} × {{m}})


    ### Идея

    Группируем так, чтобы последний шаг остался табличным.


    ### Шаги

    1. Ищем удобную пару множителей.

    2. Умножаем пару.

    3. Умножаем на оставшийся множитель.


    ### Проверка

    Прямой счёт слева направо обязан дать то же число.


    ### Типичная ошибка

    Оставить только первую пару множителей — произведение не досчитано.

    '
  feedback:
    correct: Верно, произведение собрано.
    wrong:
      what: 'Значение трёх множителей не совпало.'
      why: Один из множителей потерян.
      fix: 'Перемножьте множители по шагам, без пропусков.'
      next: Раздел T01.
    misconceptions:
    - id: E-num-mult-properties-stop-after-first
      when:
        expr: a * b
      message: Первая пара умножена, третий множитель потерян.
  errors:
  - E-num-mult-properties-stop-after-first
- id: P-06
  type: number
  role: supported
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T02
  minutes: 2
  prompt: Найдите {{a}} × ({{b}} + {{c}}), умножая на обе части скобки.
  answer: 72
  variants:
  - params:
      a: 6
      b: 10
      c: 2
    answer: 72
    solution: '### Ответ

      72


      ### Идея

      Внешний множитель доходит до обеих частей скобки, затем части складывают.


      ### Шаги

      1. 6 × 10 = 60, 6 × 2 = 12.

      2. Складываем части: 60 + 12 = 72.


      ### Проверка

      Прямое произведение: 6 × 12 = 72.


      ### Типичная ошибка

      Умножить на первую часть и прибавить вторую без множителя.

      '
  - params:
      a: 4
      b: 10
      c: 3
    answer: 52
    solution: '### Ответ

      52


      ### Идея

      Внешний множитель доходит до обеих частей скобки, затем части складывают.


      ### Шаги

      1. 4 × 10 = 40, 4 × 3 = 12.

      2. Складываем части: 40 + 12 = 52.


      ### Проверка

      Прямое произведение: 4 × 13 = 52.


      ### Типичная ошибка

      Умножить на первую часть и прибавить вторую без множителя.

      '
  - params:
      a: 3
      b: 10
      c: 5
    answer: 45
    solution: '### Ответ

      45


      ### Идея

      Внешний множитель доходит до обеих частей скобки, затем части складывают.


      ### Шаги

      1. 3 × 10 = 30, 3 × 5 = 15.

      2. Складываем части: 30 + 15 = 45.


      ### Проверка

      Прямое произведение: 3 × 15 = 45.


      ### Типичная ошибка

      Умножить на первую часть и прибавить вторую без множителя.

      '
  hints:
  - Скобка складывается после умножения, а не до.
  - Внешний множитель доходит до обеих частей.
  - Сложите два частичных произведения.
  solution: '### Ответ

    {{a}} × {{b}} + {{a}} × {{c}}


    ### Идея

    Каждая часть скобки получает свой множитель, части складывают.


    ### Шаги

    1. Умножаем на {{b}}.

    2. Умножаем на {{c}}.

    3. Складываем.


    ### Проверка

    Прямое произведение того же значения подтверждает счёт.


    ### Типичная ошибка

    Умножить на первую часть и прибавить вторую без множителя.

    '
  feedback:
    correct: Верно, обе части умножены.
    wrong:
      what: 'Значение разложения не совпало.'
      why: Вторая часть скобки осталась без множителя.
      fix: Умножьте и на {{b}}, и на {{c}}, затем сложите.
      next: Раздел T02.
    misconceptions:
    - id: E-num-mult-properties-distribute-partial
      when:
        expr: a * b + c
      message: К первому произведению прибавлено второе слагаемое без множителя.
  errors:
  - E-num-mult-properties-distribute-partial
