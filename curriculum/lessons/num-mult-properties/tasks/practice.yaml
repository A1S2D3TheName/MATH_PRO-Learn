- id: P-27
  type: number
  role: challenge
  purpose: method
  level: 5
  outcome: LO-03
  sections:
  - T05
  minutes: 5
  prompt: Произведение двух двузначных чисел равно 612. Если каждый множитель округлить до ближайшего десятка и перемножить,
    получится 600. Введите наибольший из множителей.
  optional: true
  answer: 34
  hints:
  - Переберите пары двузначных делителей 612 — их немного.
  - 'Проверяйте пару по округлениям: произведение округлённых чисел должно дать ровно 600.'
  - Разложите 612 на два двузначных делителя и проверьте округления.
  solution: '### Ответ

    34


    ### Идея

    Идём от делителей 612 и отсекаем лишнее прикидкой.


    ### Шаги

    1. 612 = 2 × 2 × 3 × 3 × 17.

    2. Двузначные пары: 12 × 51, 17 × 36, 18 × 34.

    3. Округления: 10 × 50 = 500 — нет; 20 × 40 = 800 — нет; 20 × 30 = 600 — да.


    ### Проверка

    Точный счёт: 18 × 34 = 612, оба условия задачи выполнены.


    ### Типичная ошибка

    Оставить пару 17 и 36 — её прикидка даёт 800.

    '
  feedback:
    correct: Верно, пара отобрана прикидкой.
    wrong:
      what: Множитель не подходит.
      why: Проверено только произведение, но не прикидка.
      fix: Переберите пары и проверьте округление каждой.
      next: Галерея приёмов раздела T05.
