    prompt: Найдите произведение 6 × 8.
    answer: 48
    hints:
    - Вспомните факт про восемь.
    - Можно досчитать группами.
    - Проверьте делением.
    solution: '### Ответ

      48


      ### Идея

      Табличный факт: шесть восьмёрок.


      ### Шаги

      1. Группами по 8 шесть раз.

      2. Факт: 6 × 8 = 48.


      ### Проверка

      Обратный факт: 48 ÷ 8 = 6.


      ### Типичная ошибка

      Пропущенный шаг по 8 уводит итог ровно на 8.

      '
    feedback:
      correct: 'Верно: произведение 6 × 8 названо по таблице.'
      wrong:
        what: 'Произведение 6 × 8 не совпало.'
        why: Пропущен соседний факт.
        fix: 'Пересчитайте группами по 8 и назовите факт.'
        next: Раздел T01.
