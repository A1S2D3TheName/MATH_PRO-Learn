# Паспорт темы (STANDARD.md §3). Поля section/stage/hours/grade/prerequisites/scope скопированы из
# tree.yaml дословно (правило 6).
id: num-mult-properties
title: Свойства умножения и приёмы устного счёта
section: num
stage: 1
hours: 2
grade: "3"
prerequisites: [num-mult-table]
version: "1.0.0"
summary: >
  Умножение можно считать удобно: менять множители местами и по-разному группировать, заменять
  множитель суммой и умножать на множитель оба её слагаемых, округлять множитель до десятка
  и убирать лишнюю группу. Тема учит этим приёмам устного счёта и проверять произведение прикидкой.

search:
  synonyms:
    - перестановка множителей
    - сочетательный закон умножения
    - скобки при умножении
    - группировка множителей
    - умножение суммы на число
    - разбить множитель на части
    - площадь прямоугольника по частям
    - умножение на круглые десятки
    - приём округления множителя
    - удобный порядок умножения
    - умножение на круглое число
    - девять раз по восемь через десять
    - оценка произведения
    - прикидка результата умножения
    - соседний факт умножения
  questions:
    - Почему от перестановки множителей произведение не меняется?
    - Что показывают скобки в произведении трёх чисел?
    - Как умножить число на сумму, не вычисляя громоздкое выражение?
    - Как разбиение 6 × 12 на 6 × 10 и 6 × 2 помогает считать?
    - Как связано 5 × 7 с 6 × 7?
    - Как считать 7 × 50, если известно 7 × 5?
    - Зачем округлять множитель до десятка и потом вычитать лишнюю группу?
    - Как прикидкой проверить, что произведение посчитано правдоподобно?
    - Всегда ли оценка отличается от точного ответа?
    - Что потеряно, если вместо 7 × 50 = 350 записано 35?

subtopics:
  - id: num-mult-properties/peremestitelnyy-i-sochetatelnyy-zakony
    title: Переместительный и сочетательный законы умножения
    tree_ref: Переместительный и сочетательный законы умножения
    synonyms: [перестановка множителей, группировка множителей, скобки в произведении, соседний факт умножения]
    sections: [T01]
  - id: num-mult-properties/umnozhenie-summy-na-chislo
    title: Умножение суммы на число
    tree_ref: Умножение суммы на число
    synonyms: [разбить множитель на части, площадь через части, разложение множителя]
    sections: [T02]
  - id: num-mult-properties/okruglenie-i-kompensaciya-pri
    title: Округление и компенсация при устном счёте
    tree_ref: Округление и компенсация при устном счёте
    synonyms: [добавить и убрать группу, умножение на десятки, сверстка множителя]
    sections: [T03]
  - id: num-mult-properties/prikidka-proizvedeniya
    title: Прикидка произведения
    tree_ref: Прикидка произведения
    synonyms: [оценка произведения, прикидка перед вычислением, правдоподобие ответа]
    sections: [T04, T05]

outcomes:
  - id: LO-01
    short: Считает, меняя и группируя множители
    action: >
      меняет множители местами, выбирает группировку в произведении трёх чисел и находит
      неизвестный факт через соседний известный
    conditions: "множители от 0 до 10 и круглые десятки; произведение не больше 1000; без калькулятора"
    criterion: верно называет произведение после перестановки или перегруппировки и объясняет смысл множителей
    level: core
    sections:
      - T01
      - T02
  - id: LO-02
    short: Считает на десятки, прикидывает
    action: >
      умножает число на круглые десятки через табличный факт, применяет округление множителя
      с поправкой и оценивает произведение округлением обоих множителей
    conditions: "один множитель от 2 до 9; второй — круглые десятки до 90 или двузначное число до 40; без калькулятора"
    criterion: находит значение округлённого произведения, вносит поправку верного направления и получает оценку округлённым умножением
    level: standard
    sections:
      - T03
      - T04
  - id: LO-03
    short: Сверяет с прикидкой и выбирает приём
    action: >
      сравнивает точное произведение с оценкой, выбирает удобный приём из нескольких и объясняет
      выбор
    conditions: множители до 100; десятки и единицы; сравнение оценки с точным значением; без калькулятора
    criterion: оценивает правдоподобие точного ответа по прикидке и обосновывает выбор приёма для данного случая
    level: deep
    sections:
      - T04
      - T05

errors:
  - E-num-mult-properties-stop-after-first
  - E-num-mult-properties-distribute-partial
  - E-num-mult-properties-compensation-add
  - E-num-mult-properties-group-size-mixup
