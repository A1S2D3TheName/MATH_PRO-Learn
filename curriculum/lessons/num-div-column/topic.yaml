outcomes:
  - id: LO-01
    short: Делит уголком без остатка
    action: ведёт запись уголком, называет неполное делимое и цифру частного на каждом шаге и получает частное
    conditions: делимое — трёх- и четырёхзначное число, делитель — однозначное число от 2 до 9, деление без остатка
    criterion: верно записывает частное, подтверждает его умножением на делитель и называет неполные делимые по порядку
    level: core
    sections: [T01, T02, T03]
  - id: LO-02
    short: Делит с остатком и проверяет
    action: находит частное и остаток по записи уголком и подтверждает результат проверкой вида a = bq + r
    conditions: делимое до пяти знаков, делитель однозначный от 2 до 9; остаток меньше делителя
    criterion: отвечает парой «частное и остаток», проверяет её умножением с прибавлением остатка и отвергает остаток, не меньший делителя
    level: standard
    sections: [T03, T04]
  - id: LO-03
    short: Находит ошибку и нуль частного
    action: проверяет готовую запись уголком, находит первое неверное действие, вписывает нуль в частном и определяет число цифр частного
    conditions: делимое до пяти знаков, делитель от 2 до 99; среди случаев есть нуль внутри частного и остаток, выписанный неверно
    criterion: указывает неверный шаг и верный результат, отличает случай, где нуль в частном обязателен, и верно называет число цифр частного
    level: deep
    sections: [T05]

