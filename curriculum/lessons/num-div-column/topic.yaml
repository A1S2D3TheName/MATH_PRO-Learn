id: num-div-column
title: "Деление уголком с остатком"
section: num
stage: 1
hours: 4
grade: "3–4"
prerequisites: [num-mult-column]
version: "1.0.0"
summary: >
  Деление многозначного числа на однозначное раскладывается на короткие шаги: на каждом шаге
  делится неполное делимое — часть записи делимого, а там, где целой части не выделяется,
  в частном ставится нуль. Тема вводит запись уголком, подбор цифры частного, случай без остатка
  и деление с остатком с проверкой вида a = bq + r, где остаток меньше делителя.

