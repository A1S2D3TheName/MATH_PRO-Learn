- id: P-31
  type: number
  role: challenge
  purpose: transfer
  level: 5
  outcome: LO-02
  sections:
  - T04
  minutes: 5
  prompt: Найдите наибольшее трёхзначное число, которое при делении на 9 даёт остаток 4.
  answer: 994
  optional: true
  hints:
  - 'Запишите условие равенством: искомое число равно 9q + 4.'
  - Наибольшее трёхзначное число — 999, а дальше двигайтесь вниз на девятки.
  - Проверьте, что найденное число не превосходит 999 и остаток 4 меньше 9.
  solution: '### Ответ

    994


    ### Идея

    Числа с остатком 4 при делении на 9 идут через каждые девять: 9q + 4. Из них нужно взять наибольшее
    трёхзначное.


    ### Шаги

    1. Наибольшее трёхзначное число 999; проверяем: 999 : 9 = 111, остаток 0.

    2. Уменьшаем на 9, пока остаток не станет равным 4: 999 → 990 → 981 → 972 → 963 → 954 → 945 → 936
    → 927 → 918 → 909 → 900 → 891 → ... → 990 − 9k.

    3. Прямой путь короче: 999 − 5 = 994, и 994 = 9 · 110 + 4, потому что 9 · 110 = 990.


    ### Проверка

    994 : 9 = 110 и остаток 4; остаток 4 < 9, число 994 трёхзначное, а 994 + 9 = 1003 — уже четырёхзначное,
    значит больше подходящих чисел нет.


    ### Типичная ошибка

    E-num-div-column-check-without-remainder: остановиться на кратном 990 и забыть прибавить остаток 4,
    либо прибавить 4 к 999 и выйти за пределы трёхзначных чисел (1003).

    '
  feedback:
    correct: 'Наибольшее подходящее число найдено: 994 = 9 · 110 + 4.'
    wrong:
      what: Число не подходит по остатку или не является наибольшим.
      why: Проверьте равенство a = bq + r и сравните с границей трёхзначных чисел.
      fix: Прибавьте к произведению остаток и проверьте, что следующее подходящее число уже четырёхзначное.
      next: Разберите пример 1 раздела T04.
- id: P-32
  type: number
  role: challenge
  purpose: transfer
  level: 5
  outcome: LO-03
  sections:
  - T05
  minutes: 5
  prompt: При делении задуманного трёхзначного числа на однозначный делитель получилось частное 38 и остаток
    5, а если к задуманному числу прибавить 2, оно разделится на тот же делитель без остатка и даст частное
    39. Найдите задуманное число.
  answer: 271
  optional: true
  hints:
  - Подумайте, сколько единиц не хватало остатку 5 до полной целой части (делителя), если после прибавления
    2 частное выросло ровно на 1, а остаток стал 0.
  - Делитель равен b = 5 + 2 = 7 (при этом условие 5 < 7 выполнено).
  - Восстановите делимое по формуле a = b · q + r при b = 7, q = 38, r = 5.
  solution: '### Ответ

    271


    ### Идея

    Прибавление 2 превратило остаток 5 в ровно одну новую целую часть (частное выросло с 38 до 39, а остаток
    обнулился), значит делитель равен 5 + 2 = 7.


    ### Шаги

    1. Находим делитель: к остатку 5 добавили 2 и получили ровно одну целую часть, поэтому b = 5 + 2 =
    7 (условие r < b: 5 < 7 выполнено).

    2. Восстанавливаем задуманное делимое по формуле a = b · q + r: a = 7 · 38 + 5 = 266 + 5 = 271.

    3. Проверяем второе условие: 271 + 2 = 273, и 273 : 7 = 39 без остатка.


    ### Проверка

    271 — трёхзначное число; 271 : 7 = 38 (остаток 5), так как 7 · 38 = 266 и 271 − 266 = 5 < 7.


    ### Типичная ошибка

    E-num-div-column-check-without-remainder: вычислить произведение 7 · 38 = 266 и забыть прибавить остаток
    5.

    '
  feedback:
    correct: 'Число найдено верно: 7 · 38 + 5 = 271.'
    wrong:
      what: Искомое число не совпало.
      why: Скорее всего, остаток забыт или прибавлен к частному, а не к произведению.
      fix: Восстановите равенство a = bq + r с данными числами.
      next: Разберите пример 1 раздела T04.
