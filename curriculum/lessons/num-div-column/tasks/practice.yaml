  hints:
  - Сравнивайте начало записи делимого с делителем слева направо.
  - Если первая цифра меньше делителя, к ней присоединяется вторая цифра.
  - 'Оставшаяся карточка с числом 5 не подходит ни одному делению: сравнивайте с делителями.'
  solution: '### Ответ

    212 : 4 → 21, 864 : 4 → 8, 1027 : 4 → 10, 2415 : 5 → 24.


    ### Идея

    Первое неполное делимое — наименьшее начало записи делимого, которое не меньше делителя.


    ### Шаги

    1. 212 : 4: 2 < 4, значит берём две цифры — 21.

    2. 864 : 4: 8 ≥ 4, хватает одной цифры — 8.

    3. 1027 : 4 даёт 10, а 2415 : 5 — 24; карточка 5 — делитель, а не неполное делимое.


    ### Проверка

    Каждое неполное делимое не меньше своего делителя: 21 ≥ 4, 8 ≥ 4, 10 ≥ 4, 24 ≥ 5.


    ### Типичная ошибка

    E-num-div-column-shift-quotient: считать первым неполным делимым первую цифру делимого, даже когда
    она меньше делителя.

    '
  feedback:
    correct: Все четыре деления соединены с верными неполными делимыми.
    wrong:
