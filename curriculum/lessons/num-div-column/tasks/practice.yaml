- id: P-05
  type: table-fill
  role: supported
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T01
  minutes: 2
  prompt: 'Заполните таблицу шагов деления 486 : 3: укажите цифру частного на каждом шаге.'
  answer:
  - r: 0
    c: 3
    value: 1
  - r: 1
    c: 3
    value: 6
  - r: 2
    c: 3
    value: 2
  table:
    columns:
    - шаг
    - неполное делимое
    - деление
    - цифра частного
    - остаток
    rows:
    - - 1
      - 4
      - '4 : 3'
      - null
      - 1
    - - 2
      - 18
      - '18 : 3'
      - null
      - 0
    - - 3
      - 6
      - '6 : 3'
      - null
      - 0
  shape:
  - 3
  - 5
  hints:
  - 'Число 4 делится на 3 один раз: произведение 3 · 2 = 6 уже не помещается в 4.'
  - После первого шага остаётся 1, и к ней сносится цифра 8.
  - На каждом шаге в столбце «остаток» стоит число меньше делителя.
  solution: '### Ответ

    Цифры частного по шагам: 1, 6, 2.


    ### Идея

    Каждая строка таблицы — один шаг: неполное делимое, деление и остаток, который переходит в следующую
    строку.


    ### Шаги

    1. 4 : 3 = 1, остаток 1 — первая цифра частного.

    2. Остаток 1 и снесённая 8 дают 18; 18 : 3 = 6, остаток 0.

    3. Сносим 6; 6 : 3 = 2, остаток 0.


    ### Проверка

    Частное 162: 162 · 3 = 486 — делимое получилось.


    ### Типичная ошибка

    E-num-div-column-digit-by-digit: в первой строке делить цифры по отдельности и забыть, что остаток
    1 переходит в следующее неполное делимое.

    '
  feedback:
    correct: Таблица шагов заполнена верно, частное 162 подтверждается умножением.
    wrong:
      what: Хотя бы одна цифра частного неверна.
      why: 'Проверьте столбец остатков: он показывает, что переходит в следующую строку.'
      fix: Пересчитайте шаг, начиная с его неполного делимого.
      next: Перечитайте таблицу в разделе T01.
- id: P-06
  type: numbers
  role: supported
  purpose: method
  level: 1
  outcome: LO-01
  sections:
  - T02
  - T03
  minutes: 2
  prompt: 'Для деления {{a}} : {{b}} определите первое неполное делимое и число цифр частного.'
  answer:
    first: 24
    digits: 3
  fields:
  - id: first
    label: Первое неполное делимое
  - id: digits
    label: Число цифр частного
  variants:
  - params:
      a: 2415
      b: 5
    answer:
      first: 24
      digits: 3
    solution: '### Ответ

      Первое неполное делимое 24, цифр в частном: 3.


      ### Идея

      Первую цифру частного даёт наименьшее начало записи делимого, которое не меньше делителя.


      ### Шаги

      1. 2 < 5, поэтому берём две первые цифры: 24.

      2. 24 : 5 = 4, остаток 4; далее 41 : 5 = 8, остаток 1; 15 : 5 = 3.

      3. Цифр в частном три: 4, 8, 3.


      ### Проверка

      483 · 5 = 2415 — делимое получилось.


      ### Типичная ошибка

      E-num-div-column-shift-quotient: сдвинуть первую цифру частного на разряд влево.

      '
  - params:
      a: 212
      b: 4
    answer:
      first: 21
      digits: 2
    solution: '### Ответ

      Первое неполное делимое 21, цифр в частном: 2.


      ### Идея

      Первая цифра делимого меньше делителя, поэтому неполное делимое склеено из двух цифр, и одно место
      в частном уже занято.


      ### Шаги

      1. 2 < 4, берём две цифры: 21.

      2. 21 : 4 = 5, остаток 1; 12 : 4 = 3, остаток 0.

      3. Частное 53 — две цифры, а не три.


      ### Проверка

      53 · 4 = 212 — верно; число цифр частного на единицу меньше числа цифр делимого.


      ### Типичная ошибка

      E-num-div-column-shift-quotient: поставить пятёрку над первой цифрой делимого.

      '
  hints:
  - Сравните первые цифры делимого с делителем, двигаясь слева направо.
  - Первое неполное делимое — наименьшее начало записи, которое не меньше делителя.
  - Если первое неполное делимое состоит из двух цифр, то цифр в частном на одну меньше, чем в делимом
    (раздел T03).
  solution: '### Ответ

    Первое неполное делимое 24, в частном три цифры.


    ### Идея

    Разряд первой цифры частного определяет, сколько цифр будет в ответе.


    ### Шаги

    1. Первая цифра 2 меньше делителя 5, поэтому берём две первые цифры.

    2. 24 не меньше 5 — это первое неполное делимое; его последняя цифра стоит в разряде сотен.

    3. Цифры частного: 4, 8, 3 — значит в ответе три цифры (это подтверждает и правило счёта разрядов:
    4 − 2 + 1 = 3).


    ### Проверка

    Ожидаемое число цифр и фактическое частное 483 совпадают, а 483 · 5 = 2415.


    ### Типичная ошибка

    E-num-div-column-shift-quotient: считать, что первая цифра частного встанет над первой цифрой делимого;
    тогда ответ сдвинется на разряд.

    '
  feedback:
    correct: Первое неполное делимое и число цифр частного определены верно.
    wrong:
      what: Ответ не совпал хотя бы в одном поле.
      why: Число цифр частного связано с тем, сколько цифр заняло первое неполное делимое.
      fix: Пересчитайте по шагам и сверьте число знаков в частном.
      next: Посмотрите пример 2 раздела T02.
