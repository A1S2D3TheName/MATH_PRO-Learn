    Каждое утверждение проверяется либо примером, либо правилом проверки.


    ### Шаги

    1. Утверждение «для проверки достаточно умножить частное на делитель» верно, когда остаток равен нулю.

    2. Утверждение «нуль в частном можно не писать» неверно: без нуля разряды смещаются.

    3. Утверждение о разряде нуля верно: 6072 : 6 = 1012, и нуль стоит в разряде сотен.


