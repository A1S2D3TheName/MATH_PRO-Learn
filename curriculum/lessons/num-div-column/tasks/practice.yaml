  - Подставьте числа в равенство и сравните результат с делимым.
  solution: '### Ответ

    247 : 9 = 27, остаток 4.


    ### Идея

    Проверяются два условия сразу: остаток меньше делителя и равенство a = bq + r.


    ### Шаги

    1. Запись 247 : 9 = 27 (остаток 4): остаток 4 < 9, проверка 27 · 9 + 4 = 243 + 4 = 247.

    2. Запись 247 : 9 = 26 (остаток 13) не подходит: остаток больше делителя, значит в частном не хватает
    целой части.

    3. Запись 247 : 9 = 274 — остаток приписан к частному; запись 247 : 9 = 27 без остатка не восстанавливает
    делимое.


