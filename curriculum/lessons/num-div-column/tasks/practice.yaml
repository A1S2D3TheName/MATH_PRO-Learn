tasks:
- id: P-01
  type: choice
  role: warmup
  purpose: meaning
  level: 0
  outcome: LO-01
  sections:
  - T01
  minutes: 1
  prompt: Разделите 864 на 4. Какое частное получится?
  answer: a
  options:
  - id: a
    text: '216'
  - id: b
    text: '211'
    misconception: E-num-div-column-digit-by-digit
    why: 'Похоже, цифры поделены по отдельности: остаток 2 от шага 6 : 4 не был присоединён к четвёрке.'
  - id: c
    text: '2160'
    misconception: E-num-div-column-shift-quotient
    why: 'Частное получилось в десять раз больше: похоже, лишний нуль в записи раздвинул разряды.'
  - id: d
    text: '21'
    misconception: E-num-div-column-missed-digit
    why: 'В частном потеряна последняя цифра: деление закончилось, когда остались неснесённые разряды.'
  hints:
  - Посмотрите на первую цифру делимого и решите, делится ли она на 4.
  - Дальше остаток шага присоединяется к следующей снесённой цифре.
  - Проверьте выбранный ответ умножением на 4.
  solution: '### Ответ

    216


    ### Идея

    Делим по шагам: 8, потом 6, потом 4, но каждая следующая цифра берётся вместе с остатком предыдущего
    шага.


    ### Шаги

    1. Первое неполное делимое 8: 8 : 4 = 2, остаток 0.

    2. Сносим 6: 6 : 4 = 1, остаток 2.

    3. Сносим 4: остаток 2 и цифра 4 дают 24, а 24 : 4 = 6, остаток 0.


    ### Проверка

    216 · 4 = 864 — делимое получилось, значит частное верное.


    ### Типичная ошибка

    E-num-div-column-digit-by-digit: делить каждую цифру отдельно и не присоединять остаток — тогда получится
    211.

    '
  feedback:
    correct: 'Частное 216 найдено верно: проверка умножением сходится.'
    wrong:
      what: Выбранное частное не подтверждается умножением.
      why: Ошибка обычно в переносе остатка на следующий шаг или в лишнем разряде.
      fix: Умножьте выбранное частное на 4 и сравните с делимым.
      next: Разберите пример 1 раздела T01.
- id: P-02
  type: number
  role: warmup
  purpose: procedure
  level: 0
  outcome: LO-01
  sections:
  - T01
  minutes: 1
  prompt: Разделите {{a}} на {{b}} и запишите частное.
  answer: 32
  variants:
  - params:
      a: 64
      b: 2
    answer: 32
    solution: '### Ответ

      32


      ### Идея

      Идём слева направо по разрядам: на каждом шаге делим неполное делимое — остаток предыдущего шага
      вместе со следующей цифрой делимого.


      ### Шаги

      1. Неполное делимое 6: делим 6 : 2 = 3 (2 · 3 = 6), остаток 0 — это 3 в разряде десятков.

      2. Неполное делимое 4: делим 4 : 2 = 2 (2 · 2 = 4), остаток 0 — это 2 в разряде единиц.


      ### Проверка

      32 · 2 = 64 — получилось делимое, значит деление выполнено верно, остаток равен нулю.


      ### Типичная ошибка

      E-num-div-column-shift-quotient: дописать в конце частного лишний нуль: получится 320 вместо 32
      (проверка 320 · 2 = 640 ≠ 64).

      '
  - params:
      a: 39
      b: 3
    answer: 13
    solution: '### Ответ

      13


      ### Идея

      Идём слева направо по разрядам: на каждом шаге делим неполное делимое — остаток предыдущего шага
      вместе со следующей цифрой делимого.


      ### Шаги

      1. Неполное делимое 3: делим 3 : 3 = 1 (3 · 1 = 3), остаток 0 — это 1 в разряде десятков.

      2. Неполное делимое 9: делим 9 : 3 = 3 (3 · 3 = 9), остаток 0 — это 3 в разряде единиц.


      ### Проверка

      13 · 3 = 39 — получилось делимое, значит деление выполнено верно, остаток равен нулю.


      ### Типичная ошибка

      E-num-div-column-shift-quotient: дописать в конце частного лишний нуль: получится 130 вместо 13
      (проверка 130 · 3 = 390 ≠ 39).

      '
  hints:
  - Проверьте, делится ли каждая цифра делимого на делитель по отдельности.
  - Если первая цифра не меньше делителя, она и будет первым неполным делимым.
  - Сначала найдите, сколько раз делитель укладывается в первую цифру.
  solution: '### Ответ

    32


    ### Идея

    Идём слева направо по разрядам: на каждом шаге делим неполное делимое — остаток предыдущего шага вместе
    со следующей цифрой делимого.


    ### Шаги

    1. Неполное делимое 6: делим 6 : 2 = 3 (2 · 3 = 6), остаток 0 — это 3 в разряде десятков.

    2. Неполное делимое 4: делим 4 : 2 = 2 (2 · 2 = 4), остаток 0 — это 2 в разряде единиц.


    ### Проверка

    32 · 2 = 64 — получилось делимое, значит деление выполнено верно, остаток равен нулю.


    ### Типичная ошибка

    E-num-div-column-shift-quotient: дописать в конце частного лишний нуль: получится 320 вместо 32 (проверка
    320 · 2 = 640 ≠ 64).

    '
  feedback:
    correct: Частное найдено верно, проверка умножением сходится.
    wrong:
      what: Частное не совпало.
      why: 'Проверьте подбор цифры на каждом шаге: произведение цифры на делитель не должно превосходить
        неполное делимое.'
      fix: Умножьте полученное частное на делитель и сравните с делимым.
      next: Вернитесь к примеру 1 раздела T01.
    misconceptions:
    - id: E-num-div-column-shift-quotient
      when:
        expr: a // b * 10
      message: В частном записан лишний нуль справа. После сноса последней цифры делимого дописан нуль,
        которого нет в разрядах частного. Сверьте число цифр частного с разрядами делимого и проверьте
        ответ умножением на делитель.
- id: P-03
  type: order
  role: warmup
  purpose: procedure
  level: 0
  outcome: LO-01
  sections:
  - T02
  minutes: 2
  prompt: 'Расставьте действия деления 936 : 3 в том порядке, в котором они выполняются в записи уголком.'
  answer:
  - s1
  - s2
  - s3
  - s4
  - s5
  items:
  - id: s1
    text: Выбрать первое неполное делимое — цифру 9
  - id: s2
    text: '9 : 3 = 3, остаток 0'
  - id: s3
    text: Снести цифру 3 и получить неполное делимое 3
  - id: s4
    text: '3 : 3 = 1, остаток 0; затем снести 6'
  - id: s5
    text: '6 : 3 = 2, остаток 0; проверить 312 · 3 = 936'
  hints:
  - Первое действие — выбор неполного делимого, а не первая цифра частного.
  - После вычитания произведения обязательно сносят следующую цифру делимого.
  - 'Проверка стоит последней: она использует уже готовое частное.'
  solution: '### Ответ

    Сначала делим 9 на 3, затем сносим 3 и делим её, потом сносим 6 и делим её.


    ### Идея

    Каждый шаг состоит из пары действий: поделить неполное делимое и снести следующую цифру.


    ### Шаги

    1. Первое неполное делимое 9 (оно не меньше делителя 3), делим: 9 : 3 = 3, остаток 0.

    2. Сносим 3, делим: 3 : 3 = 1, остаток 0.

    3. Сносим 6, делим: 6 : 3 = 2, остаток 0.


    ### Проверка

    Частное собирается из цифр 3, 1, 2, то есть 312; умножение 312 · 3 = 936 подтверждает порядок шагов.


    ### Типичная ошибка

    E-num-div-column-early-stop: остановиться на первом шаге, где остаток стал нулём, — тогда в частном
    останется одна цифра вместо трёх.

    '
  feedback:
    correct: 'Порядок шагов восстановлен верно: делим, сносим, снова делим.'
    wrong:
      what: Порядок шагов нарушен.
      why: Возможно, снос следующей цифры поставлен раньше деления неполного делимого.
      fix: Проверьте пары «делим неполное делимое → сносим следующую цифру».
      next: Перечитайте пример 1 раздела T02.
