  solution: '### Ответ

    Остатки в строках: 4, 7 и 2.


    ### Идея

    Остаток восстанавливается из равенства a = bq + r: r = a − bq.


    ### Шаги

    1. Первая строка: 1234 − 5 · 246 = 1234 − 1230 = 4.

    2. Вторая строка: 2500 − 9 · 277 = 2500 − 2493 = 7.

    3. Третья строка: 1017 − 5 · 203 = 1017 − 1015 = 2.


    ### Проверка

    Каждый остаток меньше своего делителя: 4 < 5, 7 < 9, 2 < 5.


    ### Типичная ошибка

    E-num-div-column-check-without-remainder: проверять деление одним умножением и считать остаток ошибкой
    вместо отдельного числа.

