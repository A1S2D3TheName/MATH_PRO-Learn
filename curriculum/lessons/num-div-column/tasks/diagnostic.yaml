# Входная диагностика (STANDARD.md §6, правило 15): 4 короткие задачи по прямому пререквизиту
# num-mult-column — письменному умножению в столбик, неполным произведениям и умножению на числа
# с нулями. Outcome записывается полным путём `num-mult-column/LO-NN`: пакет пререквизита ещё не
# опубликован, поэтому ссылка ведёт на результат темы-пререквизита, а не на текущую тему.
#
# Расхождение в стандарте (вопрос в отчёт): правило 160 требует писать раздел диагностики как
# `<prereq-id>/Tnn`, но схема tasks.diagnostic.schema.json допускает в `sections` только `^T[0-9]{2}$`,
# а REF-SECTION знает лишь разделы текущего пакета. Взят минимально компромиссный вариант: разделы
# текущей темы, где умножение в столбик действительно используется (подбор цифры частного и проверка).
tasks:
  - id: D-01
    type: number
    role: diagnostic
    purpose: procedure
    level: 0
    outcome: num-mult-column/LO-01
    sections: [T01]
    minutes: 1
    prompt: Вычислите 214 · 3.
    answer: 642
    hints:
      - Умножение в столбик начинается с младшего разряда множителя.
      - Каждую цифру множимого умножайте по очереди и сразу записывайте перенос.
      - Сначала 3 · 4, потом 3 · 1 с учётом переноса, потом 3 · 2.
    solution: |
      ### Ответ
      642

      ### Идея
      Умножаем каждую цифру числа 214 на 3 по разрядам, начиная с единиц, и переносим десятки
      в следующий разряд.

      ### Шаги
      1. Единицы: 3 · 4 = 12 — пишем 2, в уме 1.
      2. Десятки: 3 · 1 = 3, плюс перенос 1 получается 4.
      3. Сотни: 3 · 2 = 6.

      ### Проверка
      Прикидка: 214 близко к 200, а 200 · 3 = 600; ответ 642 чуть больше и не противоречит оценке.

      ### Типичная ошибка
      Забыть перенос из разряда единиц: тогда в ответе получится 632 вместо 642.
    feedback:
      correct: Верно, 214 · 3 = 642.
      wrong:
        what: Результат умножения не совпал.
        why: Обычно теряется перенос из переполненного разряда.
        fix: Пересчитайте разряды по порядку и каждый раз записывайте перенос.
        next: Умножение в столбик разобрано в теме num-mult-column.

  - id: D-02
    type: number
    role: diagnostic
    purpose: procedure
    level: 0
    outcome: num-mult-column/LO-01
    sections: [T01]
    minutes: 1
    prompt: Вычислите 47 · 6.
    answer: 282
    hints:
      - Множимое двузначное, поэтому ходов два — сначала единицы, потом десятки.
      - При умножении единиц получится двузначное число — его первая цифра идёт в перенос.
      - 6 · 7 = 42, а затем 6 · 4 с учётом переноса.
    solution: |
      ### Ответ
      282

      ### Идея
      Число 47 умножается на 6 по разрядам; переполнение разряда единиц переходит в десятки.

      ### Шаги
      1. Единицы: 6 · 7 = 42 — пишем 2, в уме 4.
      2. Десятки: 6 · 4 = 24, плюс перенос 4 получается 28.
      3. В ответе записаны обе части: 28 и 2, то есть 282.

      ### Проверка
      Сложение вместо умножения: 47 · 6 = 47 + 47 + 47 + 47 + 47 + 47 = 282 — обе оценки сходятся.

      ### Типичная ошибка
      Не прибавить перенос к десяткам: тогда получится 262 вместо 282.
    feedback:
      correct: Верно, 47 · 6 = 282.
      wrong:
        what: Результат умножения не совпал.
        why: Возможно, перенос прибавлен к неверному разряду или потерян.
        fix: Выпишите перенос рядом с разрядом и прибавьте его на следующем шаге.
        next: Повторите умножение в столбик в теме num-mult-column.

  - id: D-03
    type: number
    role: diagnostic
    purpose: meaning
    level: 1
    outcome: num-mult-column/LO-02
    sections: [T01]
    minutes: 1
    prompt: >
      При умножении 236 на 24 первое неполное произведение равно 236 · 4 = 944.
      Чему равно второе неполное произведение?
    answer: 4720
    hints:
      - Множитель 24 состоит из четырёх единиц и двух десятков.
      - Десяткам соответствует умножение на 20, а не на 2.
      - Второе неполное произведение — это 236 · 20; при записи оно сдвигается на разряд влево.
    solution: |
      ### Ответ
      4720

      ### Идея
      Второе неполное произведение считает десятки множителя: 236 · 20 = 236 · 2 · 10.

      ### Шаги
      1. Двойка множителя 24 стоит в разряде десятков, значит умножаем на 20.
      2. 236 · 2 = 472.
      3. Умножение на 20 добавляет нуль: 4720.

      ### Проверка
      Части складываются в целое: 944 + 4720 = 5664, а 236 · 24 = 236 · 20 + 236 · 4 = 5664.

      ### Типичная ошибка
      Умножить на 2 вместо 20 и получить 472: тогда второе неполное произведение окажется
      на разряд левее нужного места.
    feedback:
      correct: Верно, второе неполное произведение равно 4720.
      wrong:
        what: Неполное произведение не совпало.
        why: Обычно разряд множителя не учтён, и вместо десятков взяты единицы.
        fix: Посмотрите, в каком разряде стоит цифра множителя, и припишите нуль для десятков.
        next: Неполные произведения разобраны в теме num-mult-column.

  - id: D-04
    type: number
    role: diagnostic
    purpose: procedure
    level: 1
    outcome: num-mult-column/LO-01
    sections: [T05]
    minutes: 1
    prompt: Вычислите 608 · 4.
    answer: 2432
    hints:
      - Нуль внутри множимого — обычный разряд, он тоже участвует в умножении.
      - Начните с единиц и не забывайте перенос.
      - 4 · 8 = 32, затем 4 · 0 и перенос, затем 4 · 6.
    solution: |
      ### Ответ
      2432

      ### Идея
      Внутренний нуль числа 608 — полноценный разряд: 4 · 0 = 0, к нему добавляется перенос.

      ### Шаги
      1. Единицы: 4 · 8 = 32 — пишем 2, в уме 3.
      2. Десятки: 4 · 0 = 0, плюс перенос 3 получается 3.
      3. Сотни: 4 · 6 = 24.

      ### Проверка
      Прикидка: 600 · 4 = 2400, и ответ 2432 близок к этой оценке.

      ### Типичная ошибка
      Пропустить нулевой разряд: тогда в ответе пропадёт цифра и получится 232 или 2132.
    feedback:
      correct: Верно, 608 · 4 = 2432.
      wrong:
        what: Результат умножения не совпал.
        why: Обычно нулевой разряд пропущен или перенос потерян.
        fix: Пересчитайте разряд за разрядом, включая нуль.
        next: Умножение на числа с нулями разобрано в теме num-mult-column.
