    minutes: 2
    prompt: Разделите 3264 на 8. Введите частное.
    answer: 408
    hints:
    - Найдите первое неполное делимое — начало записи 3264, не меньшее 8.
    - Идите по разрядам, каждый раз присоединяя остаток к снесённой цифре.
    - Проверьте ответ умножением на 8.
    solution: '### Ответ

      408


      ### Идея

      Идём по разрядам слева направо: на каждом шаге делим неполное делимое, а остаток шага

      присоединяем к следующей цифре делимого.


      ### Шаги

      1. Неполное делимое 32: делим 32 : 8 = 4 (8 · 4 = 32), остаток 0 — это 4 в разряде сотен.

      2. Неполное делимое 6: делим 6 : 8 = 0 (8 · 0 = 0), остаток 6 — это 0 в разряде десятков.

      3. Неполное делимое 64: делим 64 : 8 = 8 (8 · 8 = 64), остаток 0 — это 8 в разряде единиц.


      ### Проверка

      408 · 8 = 3264 — произведение вернуло делимое, значит остаток нулевой.


      ### Типичная ошибка

      E-num-div-column-digit-by-digit: делить цифры по отдельности и терять остаток шага.

      '
    feedback:
      correct: 'Частное верное: 8 · 408 = 3264.'
      wrong:
        what: Частное не совпало.
        why: Проверьте перенос остатка между шагами.
        fix: Пересчитайте деление и сверьте умножение.
        next: Раздел T02.
    points: 1
