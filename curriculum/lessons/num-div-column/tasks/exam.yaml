    minutes: 2
    prompt: Найдите остаток при делении 2037 на 5.
    answer: 2
    hints:
    - Сначала найдите целую часть частного.
    - Остаток — это разность делимого и произведения делителя на частное.
    - Проверьте, что остаток меньше пяти.
    solution: '### Ответ

      2


      ### Идея

      Остаток — это число, которое остаётся после выделения всех целых частей: r = a − b · q.


      ### Шаги

      1. Неполное делимое 20: делим 20 : 5 = 4 (5 · 4 = 20), остаток 0 — это 4 в разряде сотен.

      2. Неполное делимое 3: делим 3 : 5 = 0 (5 · 0 = 0), остаток 3 — это 0 в разряде десятков.

      3. Неполное делимое 37: делим 37 : 5 = 7 (5 · 7 = 35), остаток 2 — это 7 в разряде единиц.


      ### Проверка

      407 · 5 + 2 = 2035 + 2 = 2037, и остаток 2 меньше делителя 5.


      ### Типичная ошибка

      E-num-div-column-remainder-too-big: оставить остаток не меньше делителя.

      '
    feedback:
      correct: Остаток найден верно и меньше делителя.
      wrong:
        what: Остаток не совпал.
        why: Проверьте произведение делителя и частного.
        fix: Вычтите произведение из делимого.
        next: Раздел T04.
