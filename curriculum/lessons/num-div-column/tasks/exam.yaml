    solution: '### Ответ

      3087


      ### Идея

      На двух складах по 4 паллеты — всего 2 · 4 = 8 равных паллет. Разделим 24 696 на 8 уголком, следя
      за нулём во внутреннем разряде частного.


      ### Шаги

      1. Общее число паллет: 2 · 4 = 8. Неполное делимое 24: делим 24 : 8 = 3 (8 · 3 = 24), остаток 0
      — это 3 в разряде тысяч.

      2. Неполное делимое 6: делим 6 : 8 = 0 (8 · 0 = 0), остаток 6 — это 0 в разряде сотен.

      3. Неполное делимое 69: делим 69 : 8 = 8 (8 · 8 = 64), остаток 5 — это 8 в разряде десятков.

      4. Неполное делимое 56: делим 56 : 8 = 7 (8 · 7 = 56), остаток 0 — это 7 в разряде единиц.


      ### Проверка

      3087 · 8 = 24 696 (или по этапам: 3087 · 4 = 12 348 на складе, 12 348 · 2 = 24 696).


      ### Типичная ошибка

      E-num-div-column-missed-digit: пропустить нуль в разряде сотен, когда снесённая цифра 6 оказалась
      меньше делителя 8.

      '
