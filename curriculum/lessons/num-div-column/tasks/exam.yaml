    prompt: Разделите 4129 на 8. Введите частное и остаток в отдельные поля.
    answer:
      quotient: 516
      remainder: 1
    hints:
    - Первое неполное делимое — 41.
    - Последнее число под чертой станет остатком.
    - Проверьте найденную пару чисел по формуле a = b · q + r и убедитесь, что остаток строго меньше 8.
    solution: '### Ответ

      частное 516, остаток 1


      ### Идея

      Делим по разрядам так же, как без остатка; последнее число под чертой меньше делителя —

      это остаток.


      ### Шаги

      1. Неполное делимое 41: делим 41 : 8 = 5 (8 · 5 = 40), остаток 1 — это 5 в разряде сотен.

      2. Неполное делимое 12: делим 12 : 8 = 1 (8 · 1 = 8), остаток 4 — это 1 в разряде десятков.

      3. Неполное делимое 49: делим 49 : 8 = 6 (8 · 6 = 48), остаток 1 — это 6 в разряде единиц.


      ### Проверка

      516 · 8 + 1 = 4128 + 1 = 4129, и остаток 1 < 8.


      ### Типичная ошибка

      E-num-div-column-remainder-as-quotient: записать остаток числом, не меньшим делителя, или приписать
      его к частному.

      '
    feedback:
      correct: 'Частное и остаток верны: 8 · 516 + 1 = 4129.'
      wrong:
        what: Пара чисел не совпала с проверкой.
        why: Проверьте оба числа равенством a = b · q + r.
        fix: Пересчитайте последний шаг деления.
        next: Раздел T04.
    fields:
    - id: quotient
      label: Частное
    - id: remainder
      label: Остаток
    points: 1
