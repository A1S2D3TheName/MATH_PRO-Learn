  - id: EA-08
    type: order
    role: exam
    purpose: method
    level: 2
    outcome: LO-03
    sections:
    - T05
    minutes: 3
    prompt: 'Расставьте шаги деления 1512 : 24 в порядке выполнения.'
    answer:
    - s1
    - s2
    - s3
    - s4
    - s5
    hints:
    - Первый шаг — выбор первого неполного делимого.
    - Снос следующей цифры идёт после вычитания произведения.
    - Проверка завершает работу.
    solution: '### Ответ

      выбрать неполное делимое 151 → подобрать цифру 6 → вычесть 144 и снести 2 → подобрать цифру 3 →
      проверить 63 · 24


      ### Идея

      Запись уголком идёт циклом: выбрать неполное делимое, подобрать цифру частного, вычесть произведение,
      снести следующую цифру. Остановка — когда цифры делимого закончились.


      ### Шаги

      1. Первым идёт выбор первого неполного делимого 151: 15 < 24, поэтому берём три первые цифры.

      2. Затем подбирается первая цифра частного 6, вычитается 144, и к остатку 7 сносится 2 (получается
      72).

      3. Подбирается вторая цифра частного 3 (24 · 3 = 72, остаток 0), и деление завершается проверкой
      63 · 24 = 1512.


      ### Проверка

      Собранное из цифр частное 63 подтверждается умножением: 63 · 24 = 1512.


      ### Типичная ошибка

      E-num-div-column-early-stop: снести следующую цифру раньше, чем подобрана цифра частного и найден
      остаток шага.

      '
    feedback:
      correct: Порядок шагов восстановлен верно.
      wrong:
        what: Порядок нарушен.
        why: Обычно снос цифры поставлен раньше подбора цифры частного.
        fix: 'Проверьте цикл: неполное делимое → цифра → вычитание → снос.'
        next: Раздел T05.
    items:
    - id: s1
      text: 'Выбрать первое неполное делимое: 151 (24 · 6 = 144 ≤ 151)'
    - id: s2
      text: 'Подобрать цифру частного 6 и вычесть 144 из 151: остаток 7'
    - id: s3
      text: 'Снести цифру 2: новое неполное делимое 72'
    - id: s4
      text: 'Подобрать цифру 3: 24 · 3 = 72, остаток 0'
    - id: s5
      text: 'Проверить: 63 · 24 = 1512'
    points: 1
