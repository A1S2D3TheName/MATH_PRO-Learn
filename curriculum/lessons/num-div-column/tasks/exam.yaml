    prompt: 'Проверьте запись «4718 : 7 = 674, остаток 0» и введите 1, если она верна, и 0, если неверна.'
    answer: 1
    hints:
    - Проверка деления с остатком — умножение с прибавлением остатка.
    - Остаток здесь нулевой, поэтому достаточно умножения.
    - Сравните произведение с делимым.
    solution: '### Ответ

      1 (верно)


      ### Идея

      Запись проверяется равенством a = b · q + r: произведение частного на делитель плюс остаток

      должно вернуть делимое, а остаток — быть меньше делителя.


      ### Шаги

      1. Подставляем числа: 674 · 7 + 0 = 4718 + 0 = 4718.

      2. Сравниваем с делимым 4718: результат совпал.

      3. Остаток 0 меньше делителя 7.


      ### Проверка

      Обратный ход: 4718 : 7 = 674 (остаток 0) — обе записи согласованы.


      ### Типичная ошибка

      E-num-div-column-check-without-remainder: проверять умножением без остатка и отвергать верную запись.

      '
    feedback:
      correct: 'Запись верна: 7 · 674 = 4718.'
      wrong:
        what: Оценка записи не совпала.
        why: Проверьте умножение частного на делитель.
        fix: Сравните произведение с делимым из записи.
        next: Раздел T04.
    points: 1
  - id: EA-10
    type: number
    role: exam
    purpose: transfer
    level: 3
    outcome: LO-03
    sections:
    - T03
    - T05
    minutes: 3
    prompt: 'В записи «6048 : 6 = 108» потеряна одна цифра частного. Введите верное частное.'
    answer: 1008
    hints:
    - Посчитайте, сколько цифр должно быть в частном.
    - Первое неполное делимое здесь 6, поэтому нуль появится внутри частного.
    - Проверьте итог умножением на 6.
    solution: '### Ответ

      1008


      ### Идея

      В записи 6048 : 6 = 108 частное на одну цифру короче верного: в делимом четыре цифры, в первом неполном
      делимом 6 одна цифра, значит в частном четыре цифры (4 − 1 + 1 = 4), а не три.


      ### Шаги

      1. Неполное делимое 6: делим 6 : 6 = 1 (6 · 1 = 6), остаток 0 — это 1 в разряде тысяч.

      2. Неполное делимое 0: делим 0 : 6 = 0 (6 · 0 = 0), остаток 0 — это 0 в разряде сотен.

      3. Неполное делимое 4: делим 4 : 6 = 0 (6 · 0 = 0), остаток 4 — это 0 в разряде десятков.

      4. Неполное делимое 48: делим 48 : 6 = 8 (6 · 8 = 48), остаток 0 — это 8 в разряде единиц.


      ### Проверка

      1008 · 6 = 6048 — произведение вернуло делимое, а запись 108 этого не делает: 108 · 6 = 648.


      ### Типичная ошибка

      E-num-div-column-missed-digit: записать только один нуль вместо двух подряд, когда два неполных
      делимых (0 и 4) оказались меньше делителя 6.

      '
    feedback:
      correct: 'Верное частное найдено: 6 · 1008 = 6048.'
      wrong:
        what: Частное не совпало.
        why: Проверьте число цифр частного и место нуля.
        fix: Разберите запись по шагам заново.
        next: Раздел T05.
    points: 2
  - id: EA-11
    type: number
    role: exam
    purpose: transfer
    level: 3
    outcome: LO-02
    sections:
    - T04
    minutes: 3
    prompt: Найдите наибольшее двузначное число, которое при делении на 7 даёт остаток 3.
    answer: 94
    hints:
    - 'Такие числа идут через каждые семь: 7 · k + 3.'
    - Начните с наибольшего двузначного числа 99 и уменьшите его до нужного остатка.
    - Проверьте, что следующее подходящее число уже трёхзначное.
    solution: '### Ответ

      94


      ### Идея

      Числа, дающие при делении на 7 остаток 3, идут через каждые 7: это числа вида 7 · k + 3. Из них
      нужно наибольшее двузначное.


      ### Шаги

      1. Наибольшее двузначное число — 99; вычитаем остаток: 99 − 3 = 96.

      2. Делим на 7 целую часть: 96 : 7 = 13 (остаток 5).

      3. Искомое число: 7 · 13 + 3 = 94.


      ### Проверка

      94 = 7 · 13 + 3, остаток 3 < 7; следующее такое число 101 уже не двузначное.


      ### Типичная ошибка

      E-num-div-column-check-without-remainder: остановиться на 96 и не прибавить остаток.

      '
    feedback:
      correct: Наибольшее число 94 проверяется равенством 7 · 13 + 3 = 94.
      wrong:
        what: Число не подходит по остатку или не является наибольшим.
        why: Проверьте равенство и границу двузначных чисел.
        fix: Прибавьте к произведению остаток и сравните с 99.
        next: Раздел T04.
    points: 2
  - id: EA-12
    type: number
    role: exam
    purpose: transfer
    level: 4
    outcome: LO-01
    sections:
    - T02
    - T03
    minutes: 4
    prompt: В типографии отпечатали 31104 открытки. Весь тираж разложили поровну в 3 контейнера, а открытки
      из каждого контейнера упаковали поровну в 3 выставочные коробки (всего 9 равных коробок). Сколько открыток оказалось в одной
      выставочной коробке?
    answer: 3456
    hints:
    - 'Можно делить последовательно (сначала на 3 контейнера, потом результат на 3 коробки) или сразу
      найти общее число коробок: 3 · 3 = 9.'
    - При делении 31 104 на 9 первое неполное делимое — 31, значит в частном будет 4 цифры.
    - Проверьте найденное число открыток умножением на 9.
    solution: '### Ответ

      3456


      ### Идея

