  minutes: 1
  prompt: После укладки коробок первой и второй партий (шаги F-01 и F-02) третью партию из {{n|pl:открытки,открыток,открыток}}
    упаковывают по {{f|pl:штуке,штуки,штук}} в пачку. Сколько открыток останется вне полных пачек?
  answer: 2
  hints:
  - 'Вопрос про остаток: целые конверты собираются, а неполный набор остаётся.'
  - Найдите частное и посмотрите на последнее число под чертой.
  - Убедитесь, что остаток меньше делителя.
  solution: '### Ответ

    2


    ### Идея

    После расчёта коробок первых двух партий (F-01 и F-02) делим 1738 на 4 с остатком: последнее число
    под чертой — открытки вне полных пачек.


    ### Шаги

    1. Неполное делимое 17: делим 17 : 4 = 4 (4 · 4 = 16), остаток 1 — это 4 в разряде сотен.

    2. Неполное делимое 13: делим 13 : 4 = 3 (4 · 3 = 12), остаток 1 — это 3 в разряде десятков.

    3. Неполное делимое 18: делим 18 : 4 = 4 (4 · 4 = 16), остаток 2 — это 4 в разряде единиц.


    ### Проверка

    434 · 4 + 2 = 1736 + 2 = 1738, и остаток 2 меньше делителя 4.


    ### Типичная ошибка

    E-num-div-column-remainder-too-big: оставить остаток не меньше делителя 4, не выделив последнюю целую
    пачку.

    '
