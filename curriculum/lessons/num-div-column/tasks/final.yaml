title: Утро в типографии «Литограф»
context_id: litograf-morning
scenario: 'Утро в типографии: свежий тираж афиш раскладывают по коробкам, бланки заказов — по пачкам,
  наклейки для упаковки раскладывают по конвертам, а кладовщик проверяет запись в накладной. Все итоги
  утра получаются делением.'
tasks:
- id: F-01
  type: number
  role: final-step
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T01
  - T02
  minutes: 1
  prompt: Утро в типографии «Литограф». Свежий тираж афиш — {{a|pl:лист,листа,листов}} — раскладывают
    поровну в {{b}} коробок. Сколько афиш окажется в каждой коробке?
  answer: 608
  hints:
  - Коробки одинаковые, поэтому число афиш в них — частное от деления тиража на число коробок.
  - Первое неполное делимое — начало записи тиража, которое не меньше числа коробок.
  - Проверьте итог умножением числа коробок на найденное частное.
  solution: '### Ответ

    608


    ### Идея

    Число открыток в одной коробке первой партии находится делением уголком 3648 на 6.


    ### Шаги

    1. Неполное делимое 36: делим 36 : 6 = 6 (6 · 6 = 36), остаток 0 — это 6 в разряде сотен.

    2. Неполное делимое 4: делим 4 : 6 = 0 (6 · 0 = 0), остаток 4 — это 0 в разряде десятков.

    3. Неполное делимое 48: делим 48 : 6 = 8 (6 · 8 = 48), остаток 0 — это 8 в разряде единиц.


    ### Проверка

    608 · 6 = 3648 — произведение вернуло делимое, остаток равен нулю.


    ### Типичная ошибка

    E-num-div-column-missed-digit: пропустить нуль в частном, когда неполное делимое меньше делителя 6.

    '
  feedback:
    correct: 'Тираж разложен верно: проверка умножением сходится.'
    wrong:
      what: Число афиш в коробке не совпало.
      why: Обычно теряется остаток шага или сдвигается разряд частного.
      fix: Разделите тираж заново и сверьте произведение с делимым.
      next: Шаги записи уголком — раздел T02.
    misconceptions:
    - id: E-num-div-column-shift-quotient
      when:
        expr: a // b * 10
      message: В частном первой партии записан лишний нуль справа. После сноса последней цифры делимого
        дописан лишний разряд. Сверьте число цифр частного с разрядами делимого и проверьте ответ умножением
        на делитель.
