      (шаг F-02).


      ### Шаги

      1. Из шага F-01 в коробке первой партии: 4536 : 9 = 504.

      2. Из шага F-02 в коробке второй партии: 3168 : 8 = 396.

      3. Всего открыток в двух коробках: 504 + 396 = 900.


      ### Проверка

      504 · 9 = 4536 и 396 · 8 = 3168, сумма 900 − 504 = 396.


