- id: R-05
  type: number
  role: refresh
  purpose: transfer
  level: 2
  outcome: LO-02
  sections:
  - T04
  minutes: 3
  prompt: '{{a|pl:лист,листа,листов}} разложили в пачки по {{b}} листов, заполняя каждую пачку целиком.
    Сколько полных пачек получилось?'
  answer: 516
  hints:
  - Полная пачка — это одна целая часть при делении.
  - 'Остаток в пачку не складывается: он остаётся лишним.'
  - Проверьте ответ умножением на {{b}}.
  solution: '### Ответ

    516


    ### Идея

    Полная пачка — это одна целая часть при делении: неполный остаток в пачку не входит.


    ### Шаги

    1. Неполное делимое 41: делим 41 : 8 = 5 (8 · 5 = 40), остаток 1 — это 5 в разряде сотен.

    2. Неполное делимое 12: делим 12 : 8 = 1 (8 · 1 = 8), остаток 4 — это 1 в разряде десятков.

    3. Неполное делимое 49: делим 49 : 8 = 6 (8 · 6 = 48), остаток 1 — это 6 в разряде единиц.


    ### Проверка

    516 · 8 = 4128 ≤ 4129, а ещё одна пачка потребовала бы 4136 листов — это больше 4129. Значит полных
    пачек ровно 516, а 1 листа остаются вне пачек.


    ### Типичная ошибка

    E-num-div-column-remainder-as-quotient: дописать остаток к числу пачек.

    '
  feedback:
    correct: Число полных пачек найдено верно.
    wrong:
      what: Число пачек не совпало.
      why: Возможно, остаток прибавлен к частному или потерян разряд.
