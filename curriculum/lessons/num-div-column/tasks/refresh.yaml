  - T02
  minutes: 3
  prompt: 'Найдите частное: {{a}} : {{b}}.'
  answer: 172
  hints:
  - Начните с первого неполного делимого — наименьшего начала записи делимого, не меньшего делителя.
  - Каждая следующая цифра частного получается из остатка шага и снесённой цифры.
  - Проверьте итог умножением частного на делитель.
  solution: '### Ответ

    172


    ### Идея

    Идём по разрядам слева направо: на каждом шаге делим неполное делимое, а остаток шага

    присоединяем к следующей цифре делимого.


    ### Шаги

    1. Неполное делимое 6: делим 6 : 4 = 1 (4 · 1 = 4), остаток 2 — это 1 в разряде сотен.

    2. Неполное делимое 28: делим 28 : 4 = 7 (4 · 7 = 28), остаток 0 — это 7 в разряде десятков.

    3. Неполное делимое 8: делим 8 : 4 = 2 (4 · 2 = 8), остаток 0 — это 2 в разряде единиц.


    ### Проверка

    172 · 4 = 688 — произведение вернуло делимое, значит остаток нулевой.


    ### Типичная ошибка

    E-num-div-column-digit-by-digit: делить цифры по отдельности и терять остаток шага.

    '
  feedback:
    correct: Частное найдено верно, проверка умножением сходится.
    wrong:
      what: Частное не совпало.
      why: Частая причина — потерянный остаток шага или сдвиг разряда.
      fix: Пересчитайте шаги по порядку и сверьте произведение с делимым.
      next: Вернитесь к примеру 1 раздела T02.
    misconceptions:
    - id: E-num-div-column-shift-quotient
      when:
        expr: a // b * 10
      message: В частном записан лишний нуль справа. После последнего шага деления дописан нуль, которого
        нет в разрядах частного. Сверьте число цифр частного с разрядами делимого и проверьте ответ умножением
        на делитель.
