- id: R-02
  type: number
  role: refresh
  purpose: procedure
  level: 1
  outcome: LO-02
  sections:
  - T04
  minutes: 3
  prompt: Найдите остаток при делении {{a}} на {{b}}.
  answer: 3
  hints:
  - Остаток — это число, которое остаётся после вычитания произведения частного на делитель.
  - Сначала получите частное, потом посчитайте остаток.
  - Проверьте, что остаток меньше делителя.
  solution: '### Ответ

    3


    ### Идея

    Остаток — это число, которое остаётся после выделения всех целых частей: r = a − b · q.


    ### Шаги

    1. Неполное делимое 17: делим 17 : 4 = 4 (4 · 4 = 16), остаток 1 — это 4 в разряде сотен.

    2. Неполное делимое 13: делим 13 : 4 = 3 (4 · 3 = 12), остаток 1 — это 3 в разряде десятков.

    3. Неполное делимое 19: делим 19 : 4 = 4 (4 · 4 = 16), остаток 3 — это 4 в разряде единиц.


    ### Проверка

    434 · 4 + 3 = 1736 + 3 = 1739, и остаток 3 меньше делителя 4.


    ### Типичная ошибка

    E-num-div-column-remainder-too-big: оставить остаток не меньше делителя.

    '
  feedback:
    correct: Остаток найден верно и меньше делителя.
    wrong:
      what: Остаток не совпал.
      why: Возможно, взято произведение с округлением или остаток не меньше делителя.
      fix: Вычтите произведение делителя и частного из делимого.
      next: Разберите пример 1 раздела T04.
    misconceptions:
    - id: E-num-div-column-remainder-too-big
      when:
        expr: a - b * (a // b - 1)
      message: Остаток оказался не меньше делителя. Последняя цифра частного занижена на единицу, поэтому
        в остатке осталась ещё одна целая часть. Увеличьте последнюю цифру частного на 1 и вычтите делитель
        из остатка.
