  answer:
  - r: 0
    c: 2
    value: 62
  - r: 1
    c: 0
    value: 2437
  - r: 2
    c: 3
    value: 8
  hints:
  - 'Пропущенное произведение восстанавливается делением: делимое разделить на делитель.'
  - Пропущенное делимое — это сумма произведения и остатка.
  - Остаток должен быть меньше делителя.
  solution: '### Ответ

    Частное 62, делимое 2437, остаток 8.


    ### Идея

    Каждая строка таблицы — равенство a = b · q + r; по двум известным числам третье находится

    обратным действием.


    ### Шаги

    1. Первая строка: 1736 : 28 = 62, остаток 0 — проверка 28 · 62 = 1736.

    2. Вторая строка: 6 · 406 + 1 = 2436 + 1 = 2437.

    3. Третья строка: 5003 − 9 · 555 = 5003 − 4995 = 8, и 8 < 9.


    ### Проверка

    Все три строки восстанавливают своё делимое: 1736, 2437 и 5003.


    ### Типичная ошибка

    E-num-div-column-remainder-too-big: оставить остаток, не меньший делителя.

    '
