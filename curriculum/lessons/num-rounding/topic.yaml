id: num-rounding
title: Округление и прикидка
section: num
stage: 1
hours: 2
grade: 3–4
prerequisites: [num-place-large, num-compare]
version: 0.1.0
summary: |
  Тема переводит многозначные числа на круглые: округление до разряда, прикидка суммы и
  произведения, оценка результата сверху и снизу. Ученик учится выбирать разряд округления,
  строить коридор границ и ловить неправдоподобные ответы. Приём опирается на разрядную сетку
  и сравнение чисел из тем-пререквизитов и готовит оценочное счисление следующих тем.
search:
  synonyms:
    - округление чисел
    - округление до разряда
    - округление до сотен
    - округление до десятков
    - округление до тысяч
    - прикидка
    - прикидка результата
    - оценка ответа
    - оценка сверху и снизу
    - границы ответа
    - коридор границ
    - проверка правдоподобности ответа
    - примерный счёт
    - грубая оценка результата
  questions:
    - как округлить число до сотен?
    - как округлить многозначное число до заданного разряда?
    - что значит прикинуть ответ?
    - как прикинуть сумму и произведение?
    - как оценить ответ сверху и снизу?
    - что такое нижняя и верхняя границы оценки?
    - как проверить, правдоподобен ли ответ?
    - почему ответ получился слишком большой или слишком маленький?
    - какой разряд округления выбрать при прикидке?
    - как ловить ошибки округления?
subtopics:
  - id: num-rounding/okruglenie-do-razryada-po
    title: Округление до разряда по первой отброшенной цифре
    tree_ref: Округление до разряда по первой отброшенной цифре
    synonyms: [округление до разряда, ближайшее кратное, правило первой отброшенной цифры]
    sections: [T01]
  - id: num-rounding/prikidka-summy-i-proizvedeniya
    title: Прикидка суммы и произведения
    tree_ref: Прикидка суммы и произведения
    synonyms: [прикидка результата, прикидка суммы, прикидка произведения, оценка на круглых]
    sections: [T02]
  - id: num-rounding/ocenka-sverhu-i-snizu
    title: Оценка сверху и снизу
    tree_ref: Оценка сверху и снизу
    synonyms: [границы ответа, верхняя и нижняя оценка, коридор границ]
    sections: [T03, T05]
  - id: num-rounding/obnaruzhenie-nepravdopodobnogo-otveta
    title: Обнаружение неправдоподобного ответа
    tree_ref: Обнаружение неправдоподобного ответа
    synonyms: [проверка правдоподобности, неправдоподобный ответ, проверка оценкой]
    sections: [T04, T05]
outcomes:
  - id: LO-01
    short: Округляет до разряда
    action: Округляет многозначное число до заданного разряда по первой отброшенной цифре
    conditions: Даны многозначные числа и разряд округления — от десятков до тысяч
    criterion: Из трёх заданий на округление верны не меньше двух, ответ кратен разряду
    level: core
    sections: [T01]
  - id: LO-02
    short: Прикидывает и оценивает
    action: Прикидывает результат и строит оценку сверху и снизу
    conditions: Даны арифметические действия над двузначными и трёхзначными числами
    criterion: Прикидка и обе границы посчитаны верно, точный ответ лежит в коридоре
    level: standard
    sections: [T02, T03, T04]
  - id: LO-03
    short: Проверяет и выбирает точность
    action: Проверяет правдоподобность ответа и выбирает разряд оценки под задачу
    conditions: Даны задачи с оценкой, границами и заявленным ответом
    criterion: Неправдоподобный ответ найден, разряд оценки выбран и обоснован
    level: deep
    sections: [T03, T04, T05]
