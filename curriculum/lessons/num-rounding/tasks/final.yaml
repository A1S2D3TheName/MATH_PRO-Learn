# Финальная цепочка (§8). История: смета на поход выходного дня из трёх покупок —
# хлеб, тушёнка и компот. Варианты согласованы: общие параметры a, b, c во всех шагах
# одного варианта совпадают (код FINAL-CHAIN); производный параметр каждого шага
# (est, hi, exact, rest) объявлен в variants[].params и подставлен в общий разбор —
# для final-step это разрешено правилом 76.
# Шаг F-04 опирается на результат F-02: сначала верхняя граница отвечает, есть ли
# гарантия, потом точная сумма даёт остаток. Бюджеты подобраны так, что в трёх
# вариантах верхняя граница укладывается в кассу (гарантия есть), а в трёх — нет.
title: Смета на поход
context_id: final-pohod
scenario: >
  Вы собираетесь в поход с друзьями на выходные. Хлеб стоит a рублей, тушёнка — b рублей,
  компот — c рублей. Смету сначала прикидывают, потом ограничивают сверху, считают точно
  и решают, хватит ли денег, которые есть с собой.
tasks:
  - id: F-01
    type: number
    role: final-step
    purpose: procedure
    level: 1
    outcome: LO-01
    sections: [T02]
    minutes: 2
    prompt: "Поход: хлеб {{a}} р., тушёнка {{b}} р., компот {{c}} р. Прикиньте общий счёт до десятков."
    answer: 120
    hints:
      - "Прикидка округляет каждую цену до десятков."
      - "Округлите {{a}}, {{b}}, {{c}} и сложите."
      - "Прикидка покажет порядок счёта."
    solution: |
      ### Ответ
      {{est}}

      ### Идея
      Прикидка округляет все цены до десятков и складывает.

      ### Шаги
      1. Округлите {{a}} до десятков.
      2. Округлите {{b}} и {{c}} до десятков.
      3. Сложите округлённые цены.

      ### Проверка
      Прикидка того же порядка, что и точная сумма {{a}} + {{b}} + {{c}}: цены сдвинуты
      не больше чем на пять рублей каждая.

      ### Типичная ошибка
      Округлить одну цену и сложить с точными.
    feedback:
      correct: "Верно: счёт прикинут на десятках."
      wrong:
        what: "Прикидка счёта посчитана неверно."
        why: "В прикидке округляются все цены."
        fix: "Округлите каждую цену до десятков и сложите заново."
        next: "Вернитесь к разделу T02."
    depends_on: []
    variants:
      - params: { a: 45, b: 38, c: 32, budget: 132, est: 120 }
        answer: 120
      - params: { a: 56, b: 34, c: 29, budget: 128, est: 120 }
        answer: 120
      - params: { a: 63, b: 47, c: 25, budget: 152, est: 140 }
        answer: 140
      - params: { a: 38, b: 52, c: 44, budget: 140, est: 130 }
        answer: 130
      - params: { a: 71, b: 28, c: 36, budget: 146, est: 140 }
        answer: 140
      - params: { a: 44, b: 57, c: 33, budget: 155, est: 130 }
        answer: 130

  - id: F-02
    type: number
    role: final-step
    purpose: procedure
    level: 2
    outcome: LO-02
    sections: [T03]
    minutes: 3
    prompt: "Найдите верхнюю границу счёта: округлите вверх до десятков {{a}}, {{b}} и {{c}} и сложите."
    answer: 130
    hints:
      - "Верхняя граница округляет каждую цену вверх."
      - "Округление вверх — до следующего кратного десяти."
      - "Точная сумма не может превысить результат."
    solution: |
      ### Ответ
      {{hi}}

      ### Идея
      Верхняя граница — сумма цен, округлённых вверх: она обещает «счёт не больше этой суммы».

      ### Шаги
      1. Округлите вверх до десятков {{a}}, {{b}} и {{c}}.
      2. Сложите округлённые цены.

      ### Проверка
      Точная сумма {{exact}} не больше границы {{hi}}: обещание выполнено.

      ### Типичная ошибка
      Округлить вверх одно число, а два других — по обычному правилу.
    feedback:
      correct: "Верно: верхняя граница счёта построена."
      wrong:
        what: "Граница посчитана неверно."
        why: "Для верхней границы каждая цена округляется вверх."
        fix: "Округлите каждую цену вверх до десятков и сложите."
        next: "Разбор границ — в разделе T03."
    depends_on: []
    variants:
      - params: { a: 45, b: 38, c: 32, budget: 132, est: 120, hi: 130, exact: 115 }
        answer: 130
      - params: { a: 56, b: 34, c: 29, budget: 128, est: 120, hi: 130, exact: 119 }
        answer: 130
      - params: { a: 63, b: 47, c: 25, budget: 152, est: 140, hi: 150, exact: 135 }
        answer: 150
      - params: { a: 38, b: 52, c: 44, budget: 140, est: 130, hi: 150, exact: 134 }
        answer: 150
      - params: { a: 71, b: 28, c: 36, budget: 146, est: 140, hi: 150, exact: 135 }
        answer: 150
      - params: { a: 44, b: 57, c: 33, budget: 155, est: 130, hi: 150, exact: 134 }
        answer: 150

  - id: F-03
    type: number
    role: final-step
    purpose: procedure
    level: 2
    outcome: LO-03
    sections: [T02]
    minutes: 3
    prompt: "Теперь посчитайте точную сумму: {{a}} + {{b}} + {{c}}."
    answer: 115
    hints:
      - "Точная сумма считается без округления."
      - "Складывайте по разрядам: единицы, потом десятки."
      - "Результат должен лежать внутри коридора из предыдущего шага."
    solution: |
      ### Ответ
      {{exact}}

      ### Идея
      Точное вычисление закрывает вопрос, который оценки только обрамляют.

      ### Шаги
      1. Сложите {{a}} и {{b}}.
      2. Прибавьте {{c}}.

      ### Проверка
      Точная сумма {{exact}} лежит между нижней границей и верхней {{hi}}: коридор построен верно.

      ### Типичная ошибка
      Перенести прикидку {{est}} в место точного ответа.
    feedback:
      correct: "Верно: точная сумма посчитана и легла внутрь коридора."
      wrong:
        what: "Точная сумма посчитана неверно."
        why: "Сложение идёт по разрядам, без округления."
        fix: "Пересчитайте сумму по разрядам."
        next: "Сопоставьте ответ с прикидкой {{est}}."
    depends_on: []
    variants:
      - params: { a: 45, b: 38, c: 32, budget: 132, est: 120, hi: 130, exact: 115 }
        answer: 115
      - params: { a: 56, b: 34, c: 29, budget: 128, est: 120, hi: 130, exact: 119 }
        answer: 119
      - params: { a: 63, b: 47, c: 25, budget: 152, est: 140, hi: 150, exact: 135 }
        answer: 135
      - params: { a: 38, b: 52, c: 44, budget: 140, est: 130, hi: 150, exact: 134 }
        answer: 134
      - params: { a: 71, b: 28, c: 36, budget: 146, est: 140, hi: 150, exact: 135 }
        answer: 135
      - params: { a: 44, b: 57, c: 33, budget: 155, est: 130, hi: 150, exact: 134 }
        answer: 134

  - id: F-04
    type: number
    role: final-step
    purpose: meaning
    level: 3
    outcome: LO-03
    sections: [T04]
    minutes: 5
    prompt: "Денег с собой {{budget}} р., верхняя граница счёта — {{hi}} р. Сколько рублей останется после точной оплаты?"
    answer: 17
    hints:
      - "Сравните верхнюю границу {{hi}} с суммой {{budget}}: граница обещает «не больше»."
      - "Гарантия есть, только если граница не больше денег с собой."
      - "Остаток — это разность {{budget}} и точной суммы {{exact}}."
    solution: |
      ### Ответ
      {{rest}}

      ### Идея
      Верхняя граница сначала отвечает на вопрос «хватит ли гарантированно», а остаток даёт
      только точная сумма.

      ### Шаги
      1. Сравните границу {{hi}} с деньгами {{budget}}: если граница не больше денег, покупка
      гарантирована, если больше — вердикт даёт точный счёт.
      2. Точная сумма равна {{exact}}.
      3. Остаток: {{budget}} − {{exact}} = {{rest}}.

      ### Проверка
      {{exact}} + {{rest}} = {{budget}}, и точная сумма {{exact}} не больше верхней границы {{hi}}.

      ### Типичная ошибка
      Решить по прикидке {{est}}: она не даёт ни гарантии, ни точного остатка.
    feedback:
      correct: "Верно: остаток посчитан от точной суммы, а не от оценки."
      wrong:
        what: "Остаток посчитан по прикидке или по верхней границе."
        why: "Остаток в кассе даёт только точная сумма: оценка округляет цены."
        fix: "Вычтите точную сумму из денег, которые есть с собой."
        next: "Разбор спорных границ — в разделе T04."
    depends_on: [F-01, F-02, F-03]
    variants:
      - params: { a: 45, b: 38, c: 32, budget: 132, est: 120, hi: 130, exact: 115, rest: 17 }
        answer: 17
      - params: { a: 56, b: 34, c: 29, budget: 128, est: 120, hi: 130, exact: 119, rest: 9 }
        answer: 9
      - params: { a: 63, b: 47, c: 25, budget: 152, est: 140, hi: 150, exact: 135, rest: 17 }
        answer: 17
      - params: { a: 38, b: 52, c: 44, budget: 140, est: 130, hi: 150, exact: 134, rest: 6 }
        answer: 6
      - params: { a: 71, b: 28, c: 36, budget: 146, est: 140, hi: 150, exact: 135, rest: 11 }
        answer: 11
      - params: { a: 44, b: 57, c: 33, budget: 155, est: 130, hi: 150, exact: 134, rest: 21 }
        answer: 21
