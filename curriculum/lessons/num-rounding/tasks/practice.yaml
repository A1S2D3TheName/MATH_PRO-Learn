          Округлить нужно оба числа — и уменьшаемое, и вычитаемое.

  - id: P-07
    type: match
    role: supported
    purpose: meaning
    level: 1
    outcome: LO-02
    sections: [T03]
    minutes: 2
    prompt: "Сопоставьте ситуации и вид оценки, который в них нужен."
    answer: [{left: l1, right: r1}, {left: l2, right: r2}, {left: l3, right: r3}]
    left:
      - id: l1
        text: "Хватит ли денег: важен гарантированный максимум трат"
      - id: l2
        text: "Сколько товара получится точно не меньше: важен гарантированный минимум"
      - id: l3
        text: "Нужен сам результат, оценки не хватает"
    right:
      - id: r1
        text: "Оценка сверху"
      - id: r2
        text: "Оценка снизу"
      - id: r3
        text: "Точный расчёт"
      - id: r4
        text: "Прикидка одной цифрой"
    hints:
      - "Оценка сверху гарантирует «не больше», оценка снизу — «не меньше»."
      - "Гарантированный максимум — это граница, которая не даёт занизить траты."
      - "Если нужен сам результат, границы не заменяют вычисление."
    solution: |
      ### Ответ
      l1 → r1, l2 → r2, l3 → r3

      ### Идея
      Границы работают как обещания: сверху — «столько не выйдет», снизу — «столько получится».

      ### Шаги
      1. Максимум трат — оценка сверху: точная сумма не больше её.
      2. Гарантированный минимум — оценка снизу: точное значение не меньше её.
      3. Сам результат даёт только точный расчёт.

      ### Проверка
      Прикидка одной цифрой (r4) не обещает ни минимума, ни максимума — она оставлена без пары.

      ### Типичная ошибка
      Перепутать направление границ: считать, что «сверху» означает «ответ равен ей».
    feedback:
      correct: "Верно: каждая ситуация сопоставлена со своим обещанием оценки."
      wrong:
        what: "В паре перепутаны границы."
        why: "Оценка сверху и снизу отличаются направлением обещания."
        fix: "Вспомните: сверху — «не больше», снизу — «не меньше»."
        next: "Вернитесь к разделу T03 и примеру 1 с коридором 50–70."

