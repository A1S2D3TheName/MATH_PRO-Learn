  - id: P-06
    type: number
    role: supported
    purpose: procedure
    level: 1
    outcome: LO-02
    sections: [T02]
    minutes: 2
    prompt: "Прикиньте разность: округлите {{a}} и {{b}} до ближайших {{s}} и вычтите округлённые числа."
    answer: 400
    hints:
      - "Округление до {{s}} применяется и к {{a}}, и к {{b}}."
      - "Прикидка разности — это разность округлённых чисел."
      - "После округления вычитание идёт на круглых значениях."
    solution: |
      ### Ответ
      Прикидка: {{a}} и {{b}} округляются до {{s}} и из первого вычитается второе.

      ### Идея
      Прикидка переводит оба числа на круглые и считает разность.

      ### Шаги
      1. Округлите {{a}} до {{s}}.
      2. Округлите {{b}} до {{s}}.
      3. Вычтите округлённое {{b}} из округлённого {{a}}.

      ### Проверка
      Прикидка близка к точной разности {{a}} − {{b}}.

      ### Типичная ошибка
      Округлить только уменьшаемое, а вычитаемое оставить точным.
    feedback:
      correct: "Верно: оба числа округлены, разность посчитана на круглых."
      wrong:
        what: "Прикидка разности посчитана с одним точным числом."
        why: "В прикидке округляются оба числа действия."
        fix: "Округлите {{a}} и {{b}} до {{s}}, затем вычитайте."
        next: "Сравните с примером 2 раздела T03 про разность 52 − 19."
    variants:
