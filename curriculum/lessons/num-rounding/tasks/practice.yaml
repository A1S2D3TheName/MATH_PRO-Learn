  - id: P-16
    type: choice
    role: independent
    purpose: method
    level: 3
    outcome: LO-03
    sections: [T05]
    minutes: 5
    prompt: 'Смета: 453 + 278. Нужно решить, хватит ли 700 рублей, и сделать это оценкой.
      Как действовать?'
    answer: a
    options:
      - id: a
        text: 'Построить границы до сотен: 600 и 800. Лимит 700 попал внутрь коридора,
          значит без точного расчёта вердикта не будет.'
      - id: b
        text: 'Округлить оба числа вверх и взять 800 как ответ: денег хватит с запасом.'
        why: "Верхняя граница обещает «не больше 800», но не равенство — 800 это не сумма покупок."
        misconception: E-num-rounding-ceil-always
      - id: c
        text: 'Округлить оба числа вниз до сотен — получится 600, значит 700 хватит
          с большим запасом.'
        why: "Нижняя граница — гарантированный минимум, а не фактическая трата."
        misconception: E-num-rounding-truncate
      - id: d
        text: 'Округлить только 453 до сотен (400) и сложить с точным 278: получится 678,
          и 700 хватит.'
        why: Смесь округлённого и точного числа не даёт ни границы, ни прикидки.
        misconception: E-num-rounding-one-exact
    hints:
      - 'Граница — это обещание: верхняя даёт «не больше», нижняя — «не меньше».'
      - 'Лимит, попавший внутрь коридора, оценка не различает: считайте точную сумму.'
      - 'Нижняя граница равна 400 + 200 = 600, а лимит 700 больше: одной границы мало.'
    solution: |
      ### Ответ
      Вариант a: лимит 700 лежит внутри коридора 600–800, вердикт даёт точный расчёт.

      ### Идея
      Метод выбирается по роли границы: «не больше» подтверждает «хватит», «не меньше» —
      «не хватит», а если лимит внутри коридора, оценка не даёт вердикта.

      ### Шаги
      1. Границы до сотен: снизу 400 + 200 = 600, сверху 500 + 300 = 800.
      2. Лимит 700 попал внутрь коридора: нижняя граница до него не дотягивается, верхняя
      его превышает, и ни одна из них не отвечает на вопрос.
      3. Точный расчёт: 453 + 278 = 731, а 731 > 700 — семисот рублей не хватает.

      ### Проверка
      Точная сумма 731 лежит внутри коридора 600–800, то есть границы верны, но вердикт
      дал только точный счёт: обе оценки молчали именно потому, что лимит оказался между ними.

      ### Типичная ошибка
      Выдать одну из границ за ответ или смешать округлённое число с точным.
    feedback:
      correct: "Верно: при лимите внутри коридора оценка не даёт вердикта — нужен точный счёт."
      wrong:
        what: "Выбран способ, который не отвечает на вопрос про лимит."
        why: "Границы обещают диапазон, а не точную сумму: лимит надо сравнить с обоими концами."
        fix: "Постройте коридор и проверьте, лежит ли лимит внутри него."
        next: "Разбор границ и лимитов — в разделе T05."
