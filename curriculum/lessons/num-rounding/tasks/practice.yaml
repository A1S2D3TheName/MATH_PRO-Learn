# Практика (§8): 20 задач основного банка + 1 challenge. Доли уровней 10/30/30/20/10
# считаются по основному банку; роли: 3 warmup, 6 supported, 11 independent, 1 challenge.
# У параметрических задач есть персональные разборы вариантов (правило 164: «### Ответ»
# содержит значение ответа варианта).
tasks:
  - id: P-01
    type: number
    role: warmup
    purpose: procedure
    level: 0
    outcome: LO-01
    sections: [T01]
    minutes: 1
    prompt: "Округлите {{n}} до ближайших {{s}}. Запишите результат."
    answer: 280
    hints:
      - "Найдите два соседних кратных {{s}}, между которыми лежит {{n}}."
      - "Посмотрите на первую отброшенную цифру числа {{n}}."
      - "Она решает: меньше 5 — берётся сосед снизу, 5 и больше — сверху."
    solution: |
      ### Ответ
      {{n}}, округлённое до {{s}}.

      ### Идея
      Решает первая отброшенная цифра.

      ### Шаги
      1. Найдите соседние кратные {{s}}.
      2. Посмотрите на первую отброшенную цифру.
      3. Выберите ближайшее кратное и обнулите хвост.

      ### Проверка
      Расстояние до выбранного кратного меньше, чем до соседнего.

      ### Типичная ошибка
      Просто отбросить хвост — ответ получится заниженным.
    feedback:
      correct: "Верно: выбрано ближайшее кратное, хвост обнулён."
      wrong:
        what: "Округление получилось заниженным."
        why: "Хвост просто отброшен, правило «5 и больше — вверх» не применено."
        fix: "Сравните хвост с половиной разряда и решите, к какому соседу число ближе."
        next: "Прогоните ещё пару округлений из раздела T01."
    errors: [E-num-rounding-truncate]
    variants:
      - params: { n: 278, s: 10 }
        answer: 280
        solution: |
          ### Ответ
          280

          ### Идея
          Решает первая отброшенная цифра: она показывает, к какому соседу по разряду ближе число.

          ### Шаги
          1. Соседние кратные 10 для числа 278 — 270 и 280.
          2. Хвост числа — 8, первая отброшенная цифра равна 8.
          3. Цифра 8 — «5 и больше», поэтому ответ 280.

          ### Проверка
          От 278 до 280 — 2, до соседа 270 — 8: ближе 280.

          ### Типичная ошибка
          Отбросить хвост и записать кратное снизу — это занижение, а не округление.
      - params: { n: 478, s: 10 }
        answer: 480
        solution: |
          ### Ответ
          480

          ### Идея
          Решает первая отброшенная цифра: она показывает, к какому соседу по разряду ближе число.

          ### Шаги
          1. Соседние кратные 10 для числа 478 — 470 и 480.
          2. Хвост числа — 8, первая отброшенная цифра равна 8.
          3. Цифра 8 — «5 и больше», поэтому ответ 480.

          ### Проверка
          От 478 до 480 — 2, до соседа 470 — 8: ближе 480.

          ### Типичная ошибка
          Отбросить хвост и записать кратное снизу — это занижение, а не округление.

  - id: P-02
    type: choice
    role: warmup
    purpose: meaning
    level: 0
    outcome: LO-01
    sections: [T01]
    minutes: 1
    prompt: "Запись «387 ≈ 400 (до сотен)» верна. Какая мысль объясняет такой результат?"
    answer: a
    options:
      - id: a
        text: "Хвост 87 больше половины разряда (50), значит 387 ближе к 400, чем к 300."
      - id: b
        text: "При округлении цифру сотен всегда увеличивают на единицу."
        why: "Правило «5 и больше» превращено в «всегда вверх» — и случаи вниз исчезают."
        misconception: E-num-rounding-ceil-always
      - id: c
        text: "Число округляют до десятков — разрядом правее заданного, получается 390."
        why: "Разряд округления задан в условии: просят сотни, а отвечают десятками."
        misconception: E-num-rounding-wrong-place
      - id: d
        text: "Хвост 87 отбрасывают, а сотни оставляют как есть — получается 300."
        why: "Отбрасывание хвоста даёт 300, а записи ≈ 400 это не объясняет."
        misconception: E-num-rounding-truncate
    hints:
      - "Округление выбирает ближайшее кратное 100: 300 или 400."
      - "Половина разряда — это 50; сравните с ней хвост 87."
      - "Запись «≈» означает «заменили ближайшим кратным», а не «прибавили 100»."
    solution: |
      ### Ответ
      Вариант a: хвост 87 больше 50, число ближе к 400.

      ### Идея
      Округление до сотен — выбор между соседями 300 и 400.

      ### Шаги
      1. Хвост числа 387 после сотен равен 87.
      2. Половина разряда — 50, а 87 > 50.
      3. Значит число ближе к 400.

      ### Проверка
      От 387 до 400 — 13, до 300 — 87: расстояние до 400 меньше.

      ### Типичная ошибка
      Считать, что округление всегда увеличивает число или что хвост просто отбрасывают.
    feedback:
      correct: "Верно: решение принимает хвост 87, а не цифра сотен."
      wrong:
        what: "Выбрана мысль с неверным механизмом."
        why: "Округление сравнивает хвост с половиной разряда, а не следует одной привычке."
        fix: "Вернитесь к правилу первой отброшенной цифры из T01."
        next: "Проверьте себя на числах 312 и 357: ответы разные, и это не случайно."

  - id: P-03
    type: number
    role: warmup
    purpose: procedure
    level: 1
    outcome: LO-02
    sections: [T02]
    minutes: 2
    prompt: "Прикиньте сумму: округлите {{a}} и {{b}} до ближайших {{s}} и сложите округлённые числа."
    answer: 600
    hints:
      - "Округление идёт до ближайших {{s}}: посмотрите на первую отброшенную цифру."
      - "Прикидка складывает два округлённых числа, а не одно."
      - "Сначала округлите {{a}}, потом {{b}}, и только потом сложите."
    solution: |
      ### Ответ
      Прикидка: округлите до {{s}} {{a}} и {{b}} и сложите.

      ### Идея
      Прикидка — округление всех чисел задачи и действия на круглых.

      ### Шаги
      1. Округлите {{a}} до {{s}}.
      2. Округлите {{b}} до {{s}}.
      3. Сложите округлённые значения.

      ### Проверка
      Прикидка близка к точной сумме {{a}} + {{b}} — порядок ответа совпадает.

      ### Типичная ошибка
      Округлить только одно слагаемое, а второе сложить как есть.
    feedback:
      correct: "Верно: округлены оба слагаемых, прикидка посчитана на круглых числах."
      wrong:
        what: "Прикидка посчитана с одним точным слагаемым."
        why: "Смесь округлённого и точного числа не даёт ни прикидки, ни точного ответа."
        fix: "Округлите оба числа до {{s}}, затем сложите."
        next: "Прогоните прикидку для 58 + 22 из раздела T02."
    errors: [E-num-rounding-one-exact]
    variants:
      - params: { a: 342, b: 259, s: 100 }
        answer: 600
        solution: |
          ### Ответ
          600

          ### Идея
          Прикидка округляет оба слагаемых и считает уже на круглых числах.

          ### Шаги
          1. 342 округляется до 300.
          2. 259 округляется до 300.
          3. Прикидка: 300 + 300 = 600.

          ### Проверка
          Точная сумма 601 близка к прикидке 600 — порядок ответа совпадает.

          ### Типичная ошибка
          Округлить одно слагаемое и сложить с точным вторым — это смесь прикидки и вычисления.
      - params: { a: 178, b: 244, s: 100 }
        answer: 400
        solution: |
          ### Ответ
          400

          ### Идея
          Прикидка округляет оба слагаемых и считает уже на круглых числах.

          ### Шаги
          1. 178 округляется до 200.
          2. 244 округляется до 200.
          3. Прикидка: 200 + 200 = 400.

          ### Проверка
          Точная сумма 422 близка к прикидке 400 — порядок ответа совпадает.

          ### Типичная ошибка
          Округлить одно слагаемое и сложить с точным вторым — это смесь прикидки и вычисления.

  - id: P-04
    type: number
    role: supported
    purpose: procedure
    level: 1
    outcome: LO-01
    sections: [T01]
    minutes: 2
    prompt: "Округлите {{n}} до ближайших {{s}}. Обратите внимание на переходы через разряд."
    answer: 4000
    hints:
      - "Первая отброшенная цифра числа {{n}} решает направление."
      - "Если хвост больше половины {{s}}, единица прибавляется к разряду округления."
      - "Прибавление может «перетечь» в следующий разряд — так и должно получиться."
    solution: |
      ### Ответ
      {{n}}, округлённое до {{s}}.

      ### Идея
      Переход через 9 меняет соседние разряды — и ответ уходит на круглое кратное.

      ### Шаги
      1. Найдите соседние кратные {{s}} для {{n}}.
      2. Решите по первой отброшенной цифре, вверх идти или вниз.
      3. Обнулите хвост; если единица перетекает через 9 — так и запишите.

      ### Проверка
      Ответ кратен {{s}}, и расстояние от {{n}} до него меньше, чем до соседа.

      ### Типичная ошибка
      Отбросить хвост и не заметить, что 9 сотен почти равны тысяче.
