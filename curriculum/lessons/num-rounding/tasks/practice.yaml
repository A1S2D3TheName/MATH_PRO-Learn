        answer: 400
        solution: |
          ### Ответ
          400

          ### Идея
          Прикидка округляет оба числа и вычитает уже круглые значения.

          ### Шаги
          1. 724 округляется до 700.
          2. 268 округляется до 300.
          3. Прикидка: 700 − 300 = 400.

          ### Проверка
          Точная разность 456 близка к прикидке 400 — направление и величина совпадают.

          ### Типичная ошибка
          Округлить нужно оба числа — и уменьшаемое, и вычитаемое.
      - params: { a: 541, b: 189, s: 100 }
        answer: 300
