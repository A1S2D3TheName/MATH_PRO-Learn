          Прикидка округляет оба числа и вычитает уже круглые значения.

          ### Шаги
          1. 541 округляется до 500.
          2. 189 округляется до 200.
          3. Прикидка: 500 − 200 = 300.

          ### Проверка
          Точная разность 352 близка к прикидке 300 — направление и величина совпадают.

