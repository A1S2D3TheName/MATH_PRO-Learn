          1. Соседние кратные 1 000 для числа 3 978 — 3 000 и 4 000.
          2. Хвост числа — 978, первая отброшенная цифра равна 9.
          3. Цифра 9 — «5 и больше», поэтому ответ 4 000.

          ### Проверка
          От 3 978 до 4 000 — 22, до соседа 3 000 — 978: ближе 4 000.

          ### Типичная ошибка
          Отбросить хвост — значит занизить ответ: 9 сотен почти тысяча.
      - params: { n: 29504, s: 1000 }
