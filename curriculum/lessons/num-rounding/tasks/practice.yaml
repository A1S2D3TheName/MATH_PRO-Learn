          Решает первая отброшенная цифра: она показывает, к какому соседу по разряду ближе число.

          ### Шаги
          1. Соседние кратные 1 000 для числа 29 504 — 29 000 и 30 000.
          2. Хвост числа — 504, первая отброшенная цифра равна 5.
          3. Цифра 5 — «5 и больше», поэтому ответ 30 000.

