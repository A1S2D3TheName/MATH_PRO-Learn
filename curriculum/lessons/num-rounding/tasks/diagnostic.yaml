# Входная диагностика (правило 15). Два пререквизита — num-place-large и num-compare —
# проверяются двумя задачами каждый. Поле outcome несёт связь с пререквизитом; sections —
# ближайшие разделы своего пакета (см. REVIEW.md: правило 160 требует <prereq>/Tnn, но
# REF-SECTION валидатора принимает только ID разделов своего пакета). Правило 15 говорит
# «без подсказок», а схема задачи требует ровно три подсказки — подсказки оставлены для
# прохождения схемы (вопрос мейнтейнеру в PR).
tasks:
  - id: D-01
    type: number
    role: diagnostic
    purpose: procedure
    level: 1
    outcome: num-place-large/LO-01
    sections: [T01]
    minutes: 2
    prompt: "В числе 37 482 какая цифра стоит в разряде тысяч? Запишите её."
    answer: 7
    hints:
      - "Разряды числа читаются справа налево: единицы, десятки, сотни, тысячи."
      - "Класс единиц занимает три разряда, дальше начинается класс тысяч."
      - "Выпишите число под разрядную сетку и найдите разряд тысячи."
    solution: |
      ### Ответ
      7

      ### Идея
      Разряды и классы многозначного числа — материал темы `num-place-large`.

      ### Шаги
      1. Справа налево: 2 — единицы, 8 — десятки, 4 — сотни.
      2. Дальше идёт класс тысяч: 7 — разряд тысяч, 3 — разряд десятков тысяч.

      ### Проверка
      Число читается «тридцать семь тысяч четыреста восемьдесят два» — тысячи названы семь.

      ### Типичная ошибка
      Считать разряды слева направо и назвать тройку цифр 3-7-4 как «тысячи».
    feedback:
      correct: "Верно: в классе тысяч первая цифра слева — это десятки тысяч, а разряд тысяч держит 7."
      wrong:
        what: "Названа не та цифра."
        why: "Разряды читаются справа налево, и класс тысяч начинается после сотен."
        fix: "Выпишите разрядную сетку и проставьте цифры под разряды."
        next: "Если разряды плывут — вернитесь к теме `num-place-large` о разрядной сетке."

  - id: D-02
    type: number
    role: diagnostic
    purpose: procedure
    level: 1
    outcome: num-place-large/LO-01
    sections: [T01]
    minutes: 2
    prompt: "Запишите число: 5 десятков тысяч, 3 тысячи, 0 сотен, 6 десятков и 4 единицы."
    answer: 53064
    hints:
      - "Каждый разряд даёт свою цифру в записи числа."
      - "Сотен в числе нет — в разряд сотен подставляется 0."
      - "Соберите число по классам: 53 тысячи и 64 единицы."
    solution: |
      ### Ответ
      53 064

      ### Идея
      Число собирается из разрядов слева направо, пустой разряд заполняется нулём.

      ### Шаги
      1. Класс тысяч: 5 десятков тысяч и 3 тысячи — это 53.
      2. Класс единиц: 0 сотен, 6 десятков, 4 единицы — это 064.

      ### Проверка
      Чтение по классам: «пятьдесят три тысячи шестьдесят четыре» — совпадает с условием.

      ### Типичная ошибка
      Пропустить разряд сотен и записать 5 364 — число потеряет класс и станет в десять раз меньше.
    feedback:
      correct: "Верно: пустой разряд сотен заполнен нулём, классы собраны верно."
      wrong:
        what: "Число записано с пропуском разряда."
        why: "Нулевой разряд всё равно требует своей позиции в записи."
        fix: "Разряды без цифр записываются нулём: 0 сотен — это цифра 0."
        next: "Освежите разрядную сетку в теме `num-place-large`."

  - id: D-03
    type: order
    role: diagnostic
    purpose: procedure
    level: 1
    outcome: num-compare/LO-01
    sections: [T04]
    minutes: 2
    prompt: "Расположите числа по возрастанию — от меньшего к большему."
    answer: ['a', 'b', 'c']
    items:
      - id: a
        text: "48 027"
      - id: b
        text: "48 275"
      - id: c
        text: "48 301"
    hints:
      - "Сравнение многозначных чисел начинается со старшего разряда."
      - "У всех трёх чисел одинаковы десятки тысяч и тысячи — сравнивают сотни."
      - "0 сотен меньше 2 сотен, а 2 сотни меньше 3 сотен."
    solution: |
      ### Ответ
      48 027 → 48 275 → 48 301

      ### Идея
      Сравнение по старшему разряду — навык темы `num-compare`.

      ### Шаги
      1. Десятки тысяч и тысячи равны у всех чисел (48 тысяч).
      2. Сотни: 0, 2, 3 — по ним и строится порядок.

      ### Проверка
      Разности между соседями положительны: 48 275 − 48 027 = 248, 48 301 − 48 275 = 26.

      ### Типичная ошибка
      Сравнивать числа по длине записи или по первым цифрам слева без продвижения по разрядам.
    feedback:
      correct: "Верно: порядок задают сотни, остальные разряды у чисел совпадают."
      wrong:
        what: "Порядок нарушен."
        why: "Разряды сравниваются от старшего к младшему, и первый различающийся разряд решает."
        fix: "Найдите первый разряд слева, где цифры различаются, и по нему упорядочьте."
        next: "Повторите сравнение по старшему разряду в теме `num-compare`."

  - id: D-04
    type: number
    role: diagnostic
    purpose: procedure
    level: 1
    outcome: num-compare/LO-01
    sections: [T04]
    minutes: 2
    prompt: "Какое из чисел меньше: 6 080 или 6 008? Запишите его."
    answer: 6008
    hints:
      - "Одинаковые старшие разряды пропускаются до первого различия."
      - "Сотни у обоих чисел нулевые, значит сравнивают десятки."
      - "0 десятков против 8 десятков: ноль меньше."
    solution: |
      ### Ответ
      6 008

      ### Идея
      Сравнение идёт по старшему разряду, где цифры различаются, — приём темы `num-compare`.

      ### Шаги
      1. Десятки тысяч и тысячи равны (6 тысяч).
      2. Сотни равны (0), десятки: 0 против 8 — 0 меньше.

      ### Проверка
      6 080 − 6 008 = 72, разность положительна, значит 6 008 действительно меньше.

      ### Типичная ошибка
      Сравнить по последним цифрам (0 и 8) или решить, что 6 080 меньше, потому что «80 меньше 008».
    feedback:
      correct: "Верно: различие найдено в разряде десятков."
      wrong:
        what: "Названо не то число."
        why: "Различающийся разряд — десятки, а не единицы и не длина числа."
        fix: "Сравнивайте разряды слева направо и остановитесь на первом различии."
        next: "Ещё раз прогоните сравнение по разрядам в теме `num-compare`."

