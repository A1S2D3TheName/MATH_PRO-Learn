variants:
# Контрольная (§8). Два варианта по 12 задач: уровни идут по неубыванию (правило 81),
# суммы баллов и покрытие outcomes совпадают (правило 80), дословных повторов условий нет.
# Формы ответа перемешаны (правило 175). Каждый вариант — 38 минут.
  - id: A
    tasks:
    - id: EA-01
      type: number
      role: exam
      purpose: procedure
      level: 1
      outcome: LO-01
      sections: [T01]
      minutes: 2
      prompt: "Округлите 478 до ближайших сотен."
      answer: 500
      points: 1
      hints:
        - "Решает цифра десятков числа 478."
        - "Сравните хвост с половиной сотни — 50."
        - "Ответ должен быть кратен сотне."
      solution: |
        ### Ответ
        500
  
        ### Идея
        Ближайшая сотня выбирается по первой отброшенной цифре.
  
        ### Шаги
        1. Соседние сотни: 300 и 400... нет: 400 и 500.
        2. Хвост числа 478 — 78, он больше 50.
        3. Ответ 500.
  
        ### Проверка
        Расстояние от 478 до ответа меньше, чем до соседней сотни.
  
        ### Типичная ошибка
        Отбросить хвост и получить 400... 400 — это 400.
      feedback:
        correct: "Верно: выбрана ближайшая сотня."
        wrong:
          what: "Сотня выбрана неверно."
          why: "Решение принимает хвост числа."
          fix: "Сравните хвост с 50 и повторите."
          next: "Разбор правила — в разделе T01."

    - id: EA-02
      type: match
      role: exam
      purpose: procedure
      level: 1
      outcome: LO-02
      sections: [T02]
      minutes: 2
      prompt: "Сопоставьте выражения и их прикидки."
      answer: [{left: l1, right: r1}, {left: l2, right: r2}, {left: l3, right: r3}]
      points: 1
      left:
        - id: l1
          text: "24 + 29"
        - id: l2
          text: "487 + 312"
        - id: l3
          text: "12 · 19"
      right:
        - id: r1
          text: "≈ 50 (до десятков)"
        - id: r2
          text: "≈ 800 (до сотен)"
        - id: r3
          text: "≈ 200 (до круглых)"
        - id: r4
          text: "≈ 50 000 (до тысяч)"
      hints:
        - "Прикидка округляет числа выражения и считает на круглых."
        - "Разряд прикидки подбирается под величину чисел."
        - "Сравните порядок ответа с вариантами справа."
      solution: |
        ### Ответ
        l1 → r1, l2 → r2, l3 → r3
  
        ### Идея
        Прикидка переводит выражение на круглые числа.
  
        ### Шаги
        1. 24 + 29 до десятков: 20 + 30 = 50 — это карточка r1.
        2. 487 + 312 до сотен: 500 + 300 = 800 — карточка r2.
        3. 12 · 19 до десятков: 10 · 20 = 200 — карточка r3.
  
        ### Проверка
        Точные значения: 24 + 29 = 53, 487 + 312 = 799, 12 · 19 = 228. Каждая прикидка того
        же порядка, что и точный результат, а лишняя карточка «≈ 50 000 (до тысяч)» не подходит
        ни к одному выражению.
  
        ### Типичная ошибка
        Округлить одно число выражения и оставить второе точным.
      feedback:
        correct: "Верно: прикидки подобраны по величине выражений."
        wrong:
          what: "Прикидка не соответствует выражению."
          why: "Прикидка сохраняет порядок величины."
          fix: "Округлите числа и посчитайте заново."
          next: "Разбор прикидки — в разделе T02."

    - id: EA-03
      type: numbers
      role: exam
      purpose: procedure
      level: 1
      outcome: LO-03
      sections: [T03]
      minutes: 2
      prompt: "Найдите границы суммы 268 + 341 при округлении до сотен: «низ» и «верх»."
      answer: { lo: 500, hi: 700 }
      points: 1
      fields:
        - id: lo
          label: "Нижняя граница"
        - id: hi
          label: "Верхняя граница"
      hints:
        - "«Низ» — округление обоих чисел вниз."
        - "«Верх» — округление обоих чисел вверх."
        - "Точная сумма лежит между полями."
      solution: |
        ### Ответ
        500, 700
  
        ### Идея
        Границы суммы строятся согласованным округлением.
  
        ### Шаги
        1. Вниз: 200 + 300 = 500.
        2. Вверх: 300 + 400 = 700.
  
        ### Проверка
        Точная сумма 609 лежит между 500 и 700.
  
        ### Типичная ошибка
        Округлить оба числа в одну сторону.
      feedback:
        correct: "Верно: коридор суммы построен."
        wrong:
          what: "Границы посчитаны неверно."
          why: "У границ разные направления округления."
          fix: "Пересчитайте: «низ» — всё вниз, «верх» — всё вверх."
          next: "Пример 1 раздела T03."

    - id: EA-04
      type: choice
      role: exam
      purpose: method
      level: 1
      outcome: LO-01
      sections: [T02]
      minutes: 3
      prompt: "Каким разрядом удобно прикинуть 3 649 + 2 178, чтобы быстро сравнить сумму с 5 000?"
      answer: a
      points: 1
      options:
        - id: a
          text: "До тысяч: 4 000 + 2 000 — порядок ответа виден сразу."
        - id: b
          text: "До сотен, на разряд правее: 3 600 + 2 200 — мельче, значит точнее."
          why: "Разряд выбирают под величину чисел и цель сравнения, а не «чем мельче, тем лучше»."
          misconception: E-num-rounding-wrong-place
        - id: c
          text: "Округлить только 3 649 до тысяч (4 000) и прибавить точное 2 178."
          why: "Смесь округлённого и точного числа не даёт прикидки."
          misconception: E-num-rounding-one-exact
        - id: d
          text: "Округлить оба числа вверх: 4 000 + 3 000 — так надёжнее."
          why: "Округление вверх нужно для верхней границы, а не для прикидки суммы."
          misconception: E-num-rounding-ceil-always
      hints:
        - "Прикидка должна считаться быстрее точного сложения."
        - "Чем крупнее разряд, тем быстрее счёт, но грубее оценка."
        - "Округлите 3 649 до тысяч и сравните результат с 5 000."
      solution: |
        ### Ответ
        Вариант a: до тысяч.

        ### Идея
        Разряд прикидки выбирают по величине чисел: четырёхзначные числа удобно округлять
        до тысяч, если нужен только порядок ответа.

        ### Шаги
        1. 3 649 округляется до тысяч: 4 000.
        2. 2 178 округляется до тысяч: 2 000.
        3. Прикидка 4 000 + 2 000 = 6000 сравнима с 5 000 одним взглядом.

        ### Проверка
        Точная сумма 5 827 того же порядка, что и прикидка: оценка годилась для сравнения,
        а округление до сотен (3 600 + 2 200) лишь удлинило бы счёт.

        ### Типичная ошибка
        Брать разряд мельче нужного или смешивать разные разряды в одной прикидке.
      feedback:
        correct: "Верно: до тысяч прикидка считается в уме и сразу сравнима с 5 000."
        wrong:
          what: "Разряд выбран не под цель сравнения."
          why: "Прикидка должна быть быстрой: разряд берут по величине чисел, а округление — по правилу первой отброшенной цифры."
          fix: "Округлите оба числа до тысяч и сравните сумму с 5 000."
          next: "Разбор — в разделе T02."

    - id: EA-05
      type: match
      role: exam
      purpose: method
      level: 1
      outcome: LO-02
      sections: [T02]
      minutes: 2
      prompt: "Сопоставьте задачи и разряд округления для прикидки."
      answer: [{left: l1, right: r1}, {left: l2, right: r2}, {left: l3, right: r3}]
      points: 1
      left:
        - id: l1
          text: "24 + 29 на сдачу"
        - id: l2
          text: "487 + 312 на проверку"
        - id: l3
          text: "4 830 − 1 970 в расписании"
      right:
        - id: r1
          text: "До десятков"
        - id: r2
          text: "До сотен"
        - id: r3
          text: "До тысяч"
        - id: r4
          text: "До единиц"
      hints:
        - "Двузначным числам хватает десятков."
        - "Сотни годятся для трёхзначных."
        - "Четырёхзначные прикидывают тысячами."
      solution: |
        ### Ответ
        l1 → r1, l2 → r2, l3 → r3
  
        ### Идея
        Разряд выбирается по величине чисел.
  
        ### Шаги
        1. Двузначные — десятки.
        2. Трёхзначные — сотни.
        3. Четырёх- и пятизначные — тысячи.
  
        ### Проверка
        Прикидка каждого выражения близка к точному результату и считается быстро.
  
        ### Типичная ошибка
        Округлить до единиц — прикидка превратится в точное вычисление.
      feedback:
        correct: "Верно: разряд подобран под каждую задачу."
        wrong:
          what: "Разряды перепутаны."
          why: "Разряд прикидки следует за величиной чисел."
          fix: "Оцените порядок чисел каждой задачи."
          next: "Пример 1 раздела T05."

    - id: EA-06
      type: numbers
      role: exam
      purpose: procedure
      level: 2
      outcome: LO-03
      sections: [T03]
      minutes: 3
      prompt: "Оцените разность 724 − 268 снизу и сверху при округлении до сотен."
      answer: { lo: 400, hi: 600 }
      points: 1
      fields:
        - id: lo
          label: "Нижняя граница"
        - id: hi
          label: "Верхняя граница"
      hints:
        - "Разность уменьшается от роста вычитаемого."
        - "Для «низа»: вниз 724, вверх 268."
        - "Для «верха» — наоборот."
      solution: |
        ### Ответ
        400, 600
  
        ### Идея
        Границы разности округляют числа в разные стороны.
  
        ### Шаги
        1. Низ: 700 − 300 = 400.
        2. Верх: 800 − 200 = 600.
  
        ### Проверка
        Точная разность 456 лежит между 400 и 600.
  
        ### Типичная ошибка
        Округлить оба числа в одну сторону.
      feedback:
        correct: "Верно: границы разности разведены по направлениям."
        wrong:
          what: "Границы посчитаны неверно."
          why: "У разности числа играют противоположные роли."
          fix: "«Низ» — уменьшаемое вниз, вычитаемое вверх."
          next: "Пример 2 раздела T03."

    - id: EA-07
      type: number
      role: exam
      purpose: transfer
      level: 2
      outcome: LO-01
      sections: [T01]
      minutes: 3
      prompt: "Поезд идёт 268 минут. Для расписания «около» округлите время до ближайших десятков."
      answer: 270
      points: 1
      hints:
        - "Десятки — разряд округления."
        - "Решает цифра единиц числа 268."
        - "Ответ кратен десяти."
      solution: |
        ### Ответ
        270
  
        ### Идея
        То же округление, что в T01, применённое к времени.
  
        ### Шаги
        1. Соседние десятки: 260 и 270.
        2. Хвост 8 больше 5... проверьте первую отброшенную цифру (8).
        3. Ответ 270.
  
        ### Проверка
        От 268 до ответа ближе, чем до соседнего десятка.
  
        ### Типичная ошибка
        Округлить до сотен или отбросить хвост.
      feedback:
        correct: "Верно: время округлено для расписания."
        wrong:
          what: "Округление времени неверно."
          why: "Правило одно: ближайшее кратное десяти."
          fix: "Сравните цифру единиц с 5."
          next: "Разбор правила — в разделе T01."

    - id: EA-08
      type: choice
      role: exam
      purpose: meaning
      level: 2
      outcome: LO-02
      sections: [T02]
      minutes: 3
      prompt: "Прикидка суммы 387 + 293 дала 700 при точной сумме 680. Что гарантирует прикидка?"
      answer: a
      points: 1
      options:
        - id: a
          text: "Порядок ответа: сумма — «около 700», а не «около 70»."
        - id: b
          text: "Точное значение равно 700: прикидка и есть ответ."
          why: "Прикидка — оценка, а не результат: она округляет оба числа и потому смещается."
          misconception: E-num-rounding-estimate-is-answer
        - id: c
          text: "Надо округлять вниз: 300 + 200 — так прикидка точнее."
          why: "Округление вниз — это нижняя граница, а не более точная прикидка: правило первой отброшенной цифры работает в обе стороны."
          misconception: E-num-rounding-truncate
        - id: d
          text: "Ничего: прикидка всегда округляет вверх, поэтому она только завышает."
          why: "Правило первой отброшенной цифры работает в обе стороны, а прикидка задаёт порядок ответа."
          misconception: E-num-rounding-ceil-always
      hints:
        - "Прикидка округляет оба числа и потому почти никогда не совпадает с точной суммой."
        - "Полезность прикидки — в порядке величины, а не в точном значении."
        - "Сравните прикидку 700 с точной суммой 680: разница есть, порядок один."
      solution: |
        ### Ответ
        Вариант a: прикидка гарантирует порядок ответа.

        ### Идея
        Прикидка — фильтр по величине, а не вычисление: она отсекает ответы другого порядка.

        ### Шаги
        1. 387 ≈ 400, 293 ≈ 300, прикидка равна 400 + 300 = 700.
        2. Точная сумма 680 — того же порядка.
        3. Ответы вроде 70 или 7000 отсекаются сразу.

        ### Проверка
        Ошибка прикидки 20 не мешает видеть порядок: точная сумма отличается
        от оценки меньше чем на один разряд округления.

        ### Типичная ошибка
        Требовать от прикидки точного числа или округлять все числа в одну сторону.
      feedback:
        correct: "Верно: прикидка задаёт порядок ответа, а не точное значение."
        wrong:
          what: "Прикидке приписано чужое свойство."
          why: "Прикидка округляет числа по правилу первой отброшенной цифры и потому даёт диапазон, а не точную сумму."
          fix: "Сверьте порядок прикидки и точного ответа, а не их значения."
          next: "Разбор — в разделе T02."

    - id: EA-09
      type: choice
      role: exam
      purpose: meaning
      level: 2
      outcome: LO-03
      sections: [T04]
      minutes: 3
      prompt: "В отчёте записано: 2 749 ≈ 2 750 (до сотен). Что говорит о записи проверка без точного пересчёта?"
      answer: a
      points: 1
      options:
        - id: a
          text: "Запись неверна: округлённое до сотен число кратно 100, а 2 750 им не является; верный ответ 2 700."
        - id: b
          text: "Запись верна: при округлении меняются десятки и единицы, хвост 49 округляется до 50."
          why: "Округление до сотен заменяет весь хвост нулями, а не округляет хвост отдельно."
          misconception: E-num-rounding-wrong-place
        - id: c
          text: "Запись верна: округление всегда идёт вверх, 2 749 даёт 2 800, и 2 750 — шаг по пути к нему."
          why: "Вверх идут только при хвосте от половины разряда; здесь хвост 49 меньше 50."
          misconception: E-num-rounding-ceil-always
        - id: d
          text: "Запись верна: хвост 49 отбрасывают, а две последние цифры округляют отдельно — получается 2 750."
          why: "Отброшенный хвост не округляют и не приписывают обратно к округлённому числу."
          misconception: E-num-rounding-truncate
      hints:
        - "Проверка кратности работает до всякого счёта."
        - "Округлённое до сотен число оканчивается двумя нулями."
        - "Сравните запись 2 750 с кратными 100: 2 700 и 2 800."
      solution: |
        ### Ответ
        Вариант a: запись неверна, верный ответ 2 700.

        ### Идея
        Округлённое до разряда число кратно этому разряду — это проверяют раньше вычислений.

        ### Шаги
        1. Разряд округления — сотни, значит ответ обязан делиться на 100.
        2. Число 2 750 на 100 не делится: это 27 сотен и ещё 50.
        3. Верное округление: хвост 49 меньше половины разряда, поэтому 2 749 → 2 700.

        ### Проверка
        Проверим ответ подстановкой: 2 700 кратно 100, расстояние от 2 749 до 2 700 равно 49,
        а до 2 800 — 51, значит выбрано ближайшее кратное.

        ### Типичная ошибка
        Принимать запись с «округлённым хвостом»: округление до сотен не оставляет десятки.
      feedback:
        correct: "Верно: кратность разряду сразу показывает, что запись не может быть ответом округления."
        wrong:
          what: "Запись признана верной или отвергнута не по тому признаку."
          why: "Проверка начинается с кратности разряду, а не с подсчёта цифр."
          fix: "Проверьте, делится ли заявленное число на разряд округления."
          next: "Разбор — в разделе T04."

    - id: EA-10
      type: match
      role: exam
      purpose: transfer
      level: 3
      outcome: LO-02
      sections: [T03, T04]
      minutes: 5
      prompt: "Сопоставьте ситуации и оценки, которые в них работают."
      answer: [{left: l1, right: r1}, {left: l2, right: r2}, {left: l3, right: r4}]
      points: 1
      left:
        - id: l1
          text: "Хватит ли 500 рублей на покупки?"
        - id: l2
          text: "Не меньше скольких рублей выйдет сдача?"
        - id: l3
          text: "Как быстро проверить калькулятор?"
      right:
        - id: r1
          text: "Верхняя граница"
        - id: r2
          text: "Нижняя граница"
        - id: r3
          text: "Точный расчёт"
        - id: r4
          text: "Прикидка до сотен"
      hints:
        - "Вопрос «хватит ли» требует гарантированного максимума трат."
        - "Обещание «не меньше» даёт нижняя граница."
        - "Калькулятор проверяют не пересчётом, а быстрой прикидкой порядка."
      solution: |
        ### Ответ
        l1 → r1, l2 → r2, l3 → r4
  
        ### Идея
        Ситуация диктует обещание оценки: лимит требует максимума, гарантия — минимума,
        а проверка чужого результата — быстрой прикидки.
  
        ### Шаги
        1. Лимит трат — верхняя граница: она обещает «не больше».
        2. Гарантия минимума — нижняя граница: она обещает «не меньше».
        3. Калькулятор проверяют прикидкой: считают на круглых числах и смотрят, совпадает
        ли порядок ответа.
  
        ### Проверка
        Точный расчёт (r3) остался без пары: там, где нужен сам результат, оценка не годится,
        но здесь ни одна ситуация его не требует.
  
        ### Типичная ошибка
        Проверять калькулятор точным пересчётом: тогда проверка повторяет вычисление и не
        ловит потерю разряда.
      feedback:
        correct: "Верно: каждая ситуация получила оценку со своим обещанием."
        wrong:
          what: "Ситуация сопоставлена не с той оценкой."
