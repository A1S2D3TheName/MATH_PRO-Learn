      answer: [{left: l1, right: r1}, {left: l2, right: r2}, {left: l3, right: r3}]
      points: 1
      left:
        - id: l1
          text: "36 + 28"
        - id: l2
          text: "712 + 189"
        - id: l3
          text: "21 · 18"
      right:
        - id: r1
          text: "≈ 70 (до десятков)"
        - id: r2
          text: "≈ 900 (до сотен)"
