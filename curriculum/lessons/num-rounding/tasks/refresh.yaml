# Повторение (§8): 4 задачи, у параметрических — минимум 3 варианта (правило 75).
# Условия не дублируют практику и разобранные примеры (код TASK-LEAK).
tasks:
  - id: R-01
    type: number
    role: refresh
    purpose: procedure
    level: 1
    outcome: LO-01
    sections: [T01]
    minutes: 2
    prompt: "Округлите {{n}} до ближайших {{s}}."
    answer: 430
    hints:
      - "Решает первая отброшенная цифра числа {{n}}."
      - "Меньше 5 — вниз, 5 и больше — вверх."
      - "Ответ должен быть кратен {{s}}."
    solution: |
      ### Ответ
      {{n}}, округлённое до {{s}}.

      ### Идея
      Ближайшее кратное {{s}} выбирается по первой отброшенной цифре.

      ### Шаги
      1. Найдите соседние кратные {{s}}.
      2. Решите по первой отброшенной цифре.
      3. Обнулите хвост.

      ### Проверка
      Ответ кратен {{s}} и ближе к {{n}}, чем сосед.

      ### Типичная ошибка
      Отбросить хвост без сравнения с половиной разряда.
    feedback:
      correct: "Верно: правило первой отброшенной цифры применено."
      wrong:
        what: "Округление получилось неверным."
        why: "Решение принимает хвост числа, а не привычка."
        fix: "Сравните хвост с половиной {{s}} и повторите."
        next: "Ещё раз прогоните примеры раздела T01."
    variants:
      - params: { n: 428, s: 10 }
        answer: 430
        solution: |
          ### Ответ
          430

          ### Идея
          Решает первая отброшенная цифра: она показывает, к какому соседу по разряду ближе число.

          ### Шаги
          1. Соседние кратные 10 для числа 428 — 420 и 430.
          2. Хвост числа — 8, первая отброшенная цифра равна 8.
          3. Цифра 8 — «5 и больше», поэтому ответ 430.

          ### Проверка
          От 428 до 430 — 2, до соседа 420 — 8: ближе 430.

          ### Типичная ошибка
          Кратность разряду — быстрая самопроверка округления.
      - params: { n: 1763, s: 100 }
        answer: 1800
        solution: |
          ### Ответ
          1 800

          ### Идея
          Решает первая отброшенная цифра: она показывает, к какому соседу по разряду ближе число.

          ### Шаги
          1. Соседние кратные 100 для числа 1 763 — 1 700 и 1 800.
          2. Хвост числа — 63, первая отброшенная цифра равна 6.
          3. Цифра 6 — «5 и больше», поэтому ответ 1 800.

          ### Проверка
          От 1 763 до 1 800 — 37, до соседа 1 700 — 63: ближе 1 800.

          ### Типичная ошибка
          Кратность разряду — быстрая самопроверка округления.
      - params: { n: 5412, s: 1000 }
        answer: 5000
        solution: |
          ### Ответ
          5 000

          ### Идея
          Решает первая отброшенная цифра: она показывает, к какому соседу по разряду ближе число.

          ### Шаги
          1. Соседние кратные 1 000 для числа 5 412 — 5 000 и 6 000.
          2. Хвост числа — 412, первая отброшенная цифра равна 4.
          3. Цифра 4 — «меньше 5», поэтому ответ 5 000.

          ### Проверка
          От 5 412 до 5 000 — 412, до соседа 6 000 — 588: ближе 5 000.

          ### Типичная ошибка
          Кратность разряду — быстрая самопроверка округления.

  - id: R-02
    type: number
    role: refresh
    purpose: procedure
    level: 2
    outcome: LO-02
    sections: [T02]
    minutes: 3
    prompt: "Прикиньте сумму: округлите {{a}} и {{b}} до ближайших {{s}} и сложите округлённые числа."
    answer: 400
    hints:
      - "Прикидка округляет оба числа."
      - "Округление идёт до {{s}}."
      - "Складывать — уже округлённые значения."
    solution: |
      ### Ответ
      Прикидка суммы {{a}} + {{b}} до {{s}}.

      ### Идея
      Прикидка — округление всех чисел и действие на круглых.

      ### Шаги
      1. Округлите {{a}} до {{s}}.
      2. Округлите {{b}} до {{s}}.
      3. Сложите округлённые значения.

      ### Проверка
      Прикидка близка к точной сумме {{a}} + {{b}}.

      ### Типичная ошибка
      Сложить округлённое с точным.
    feedback:
      correct: "Верно: прикидка посчитана на двух округлённых числах."
      wrong:
        what: "Прикидка посчитана неверно."
        why: "Округлить нужно оба слагаемых."
        fix: "Округлите {{a}} и {{b}} до {{s}}, затем сложите."
        next: "Пример 2 раздела T02 — про прикидку 387 + 293."
    variants:
      - params: { a: 267, b: 148, s: 100 }
        answer: 400
        solution: |
          ### Ответ
          400

          ### Идея
          Прикидка округляет оба слагаемых и считает уже на круглых числах.

          ### Шаги
          1. 267 округляется до 300.
          2. 148 округляется до 100.
          3. Прикидка: 300 + 100 = 400.

          ### Проверка
          Точная сумма 415 близка к прикидке 400 — порядок ответа совпадает.

          ### Типичная ошибка
          Округляются оба слагаемых — иначе это не прикидка.
      - params: { a: 435, b: 286, s: 100 }
        answer: 700
        solution: |
          ### Ответ
          700

          ### Идея
          Прикидка округляет оба слагаемых и считает уже на круглых числах.

          ### Шаги
          1. 435 округляется до 400.
          2. 286 округляется до 300.
          3. Прикидка: 400 + 300 = 700.

          ### Проверка
          Точная сумма 721 близка к прикидке 700 — порядок ответа совпадает.

          ### Типичная ошибка
          Округляются оба слагаемых — иначе это не прикидка.
      - params: { a: 1874, b: 2536, s: 1000 }
        answer: 5000
        solution: |
          ### Ответ
          5 000

          ### Идея
          Прикидка округляет оба слагаемых и считает уже на круглых числах.

          ### Шаги
          1. 1 874 округляется до 2 000.
          2. 2 536 округляется до 3 000.
          3. Прикидка: 2 000 + 3 000 = 5 000.

          ### Проверка
          Точная сумма 4 410 лежит в том же коридоре, что и прикидка: границы до тысяч дают
          1 000 + 2 000 = 3 000 и 2 000 + 3 000 = 5 000. Порядок ответа совпадает, а сами
          тысячи здесь слишком крупный разряд: для близкой оценки брали бы сотни.

          ### Типичная ошибка
          Округляются оба слагаемых — иначе это не прикидка.

  - id: R-03
    type: match
    role: refresh
    purpose: meaning
    level: 1
    outcome: LO-02
    sections: [T03]
    minutes: 3
    prompt: "Сопоставьте вопросы и оценки, которые на них отвечают."
    answer: [{left: l1, right: r1}, {left: l2, right: r2}, {left: l3, right: r3}]
    left:
      - id: l1
        text: "Какой счёт «с потолка» опровергнут точно?"
      - id: l2
        text: "Сколько товара получится гарантированно?"
      - id: l3
        text: "Каков итог без погрешности?"
    right:
      - id: r1
        text: "Верхняя оценка"
      - id: r2
        text: "Нижняя оценка"
      - id: r3
        text: "Точный расчёт"
      - id: r4
        text: "Прикидка одной цифрой"
    hints:
      - "Опровержение «с потолка» — это граница, которая не даёт завысить."
      - "Гарантированный минимум даёт нижняя оценка."
      - "Без погрешности считает только точное вычисление."
    solution: |
      ### Ответ
      l1 → r1, l2 → r2, l3 → r3

      ### Идея
      Разные вопросы требуют разных оценок.

      ### Шаги
      1. «С потолка» опровергает верхняя оценка: ответ не больше неё.
      2. Гарантированный минимум — нижняя оценка.
      3. Итог без погрешности — точный расчёт.

      ### Проверка
      У каждой пары своё обещание: верхняя оценка не даёт завысить ответ, нижняя — занизить,
      точный расчёт снимает погрешность. Прикидка одной цифрой (r4) не обещает ничего из этого
      и осталась без пары.

      ### Типичная ошибка
      Считать, что любая оценка отвечает на любой вопрос.
    feedback:
      correct: "Верно: каждому вопросу — своя оценка."
      wrong:
        what: "В паре не тот вид оценки."
        why: "Оценки отличаются обещаниями, а не видом записи."
        fix: "Вспомните, что гарантирует каждая граница."
        next: "Разбор коридоров — в разделе T03."

  - id: R-04
    type: order
    role: refresh
    purpose: procedure
    level: 1
    outcome: LO-01
    sections: [T01]
    minutes: 3
    prompt: "Расположите шаги округления до разряда по порядку."
    answer: ['s1', 's2', 's3']
    items:
      - id: s1
        text: "Найти первую отброшенную цифру"
      - id: s2
        text: "Решить: вниз или вверх"
      - id: s3
        text: "Обнулить хвост и записать ответ"
    hints:
      - "Сначала смотрят на цифру правее разряда округления."
      - "Решение по цифре — 5 и больше вверх, меньше 5 вниз."
      - "Последним делается запись ответа."
    solution: |
      ### Ответ
      s1 → s2 → s3

      ### Идея
      Порядок шагов закрепляет правило первой отброшенной цифры.

      ### Шаги
      1. Сначала находится сама цифра решения.
      2. Потом принимается решение по её величине.
      3. Хвост обнуляется при записи ответа.

      ### Проверка
      Без первого шага нечего сравнивать, без второго — нечего записывать.

      ### Типичная ошибка
      Обнулить хвост до решения — получится просто округление вниз.
    feedback:
      correct: "Верно: шаги стоят по логике правила."
      wrong:
        what: "Порядок шагов нарушен."
        why: "Решение по цифре предшествует записи ответа."
        fix: "Пересоберите: цифра → решение → запись."
        next: "Правило разобрано в разделе T01."

  - id: R-05
    type: numbers
    role: refresh
    purpose: procedure
    level: 2
    outcome: LO-03
    sections: [T03]
    minutes: 3
    prompt: "Найдите границы суммы {{a}} + {{b}} при округлении до {{s}}: «низ» и «верх»."
    answer: { lo: 50, hi: 70 }
    fields:
      - id: lo
        label: "Нижняя граница"
      - id: hi
        label: "Верхняя граница"
    hints:
      - "Для «низа» округлите вниз {{a}} и {{b}}."
      - "Для «верха» округлите вверх {{a}} и {{b}}."
      - "Точная сумма должна лежать между границами."
    solution: |
      ### Ответ
      Границы суммы {{a}} + {{b}} до {{s}}.

      ### Идея
      «Низ» округляет всё вниз, «верх» — всё вверх.

      ### Шаги
      1. Округлите вниз {{a}} и {{b}} до {{s}}, сложите.
      2. Округлите вверх {{a}} и {{b}} до {{s}}, сложите.

      ### Проверка
      Точная сумма {{a}} + {{b}} лежит между границами.

      ### Типичная ошибка
      Округлить оба числа в одну сторону.
    feedback:
      correct: "Верно: коридор суммы построен."
      wrong:
        what: "Границы посчитаны неверно."
        why: "У границ разные направления округления."
        fix: "«Низ» — всё вниз, «верх» — всё вверх."
        next: "Разбор границ — в разделе T03."
    variants:
      - params: { a: 27, b: 38, s: 10 }
        answer: { lo: 50, hi: 70 }
        solution: |
          ### Ответ
          50, 70

          ### Идея
          Нижняя граница округляет слагаемые вниз, верхняя — вверх.

          ### Шаги
          1. Вниз до 10: 27 → 20, 38 → 30; сумма 50.
          2. Вверх до 10: 27 → 30, 38 → 40; сумма 70.

          ### Проверка
          Точная сумма 65 лежит между 50 и 70: 50 < 65 < 70.

          ### Типичная ошибка
          Округлить оба числа в одну сторону: для суммы «низ» требует округления вниз обоих
          слагаемых, а «верх» — вверх обоих; противоположные направления нужны только у разности.
      - params: { a: 152, b: 263, s: 100 }
        answer: { lo: 300, hi: 500 }
        solution: |
          ### Ответ
          300, 500

          ### Идея
          Нижняя граница округляет слагаемые вниз, верхняя — вверх.

          ### Шаги
          1. Вниз до 100: 152 → 100, 263 → 200; сумма 300.
          2. Вверх до 100: 152 → 200, 263 → 300; сумма 500.

          ### Проверка
          Точная сумма 415 лежит между 300 и 500: 300 < 415 < 500.

          ### Типичная ошибка
          Округлить оба числа в одну сторону: для суммы «низ» требует округления вниз обоих
          слагаемых, а «верх» — вверх обоих; противоположные направления нужны только у разности.
      - params: { a: 47, b: 26, s: 10 }
        answer: { lo: 60, hi: 80 }
        solution: |
          ### Ответ
          60, 80

          ### Идея
          Нижняя граница округляет слагаемые вниз, верхняя — вверх.

          ### Шаги
          1. Вниз до 10: 47 → 40, 26 → 20; сумма 60.
          2. Вверх до 10: 47 → 50, 26 → 30; сумма 80.

          ### Проверка
          Точная сумма 73 лежит между 60 и 80: 60 < 73 < 80.

          ### Типичная ошибка
          Округлить оба числа в одну сторону: для суммы «низ» требует округления вниз обоих
          слагаемых, а «верх» — вверх обоих; противоположные направления нужны только у разности.

