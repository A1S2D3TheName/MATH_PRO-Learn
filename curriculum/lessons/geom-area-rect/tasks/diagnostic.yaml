tasks:
- id: D-01
  type: number
  role: diagnostic
  purpose: procedure
  level: 0
  outcome: geom-measure/LO-01
  sections:
  - T01
  minutes: 1
  prompt: На линейке отмечены сантиметры. Отрезок начинается у отметки 0 и заканчивается
    у отметки {{a}}. Чему равна его длина в сантиметрах?
  answer: '7'
  variants:
  - params:
      a: 7
    answer: '7'
    solution: '### Ответ

      7


      ### Идея

      Длина — число единичных отрезков от нуля до конца.


      ### Шаги

      1. От нуля отсчитываем отрезки по 1 см.

      2. Отметка 7 означает 7 отрезков.


      ### Проверка

      От 0 до 7 ровно 7 сантиметров.


      ### Типичная ошибка

      Посчитать отметки вместо промежутков.'
  hints:
  - Сколько единичных отрезков укладывается от нуля до отметки?
  - Каждый сантиметр — один отрезок между соседними делениями.
  - Отсчитайте от нуля {{a}} отрезков по 1 см.
  solution: '### Ответ

    7


    ### Идея

    Длина — число единичных отрезков от нуля.


    ### Шаги

    1. От нуля до {{a}} ровно {{a}} отрезков.


    ### Проверка

    Линейка показывает {{a}} см.


    ### Типичная ошибка

    Считать отметки, а не промежутки.'
  feedback:
    correct: Верно, длина отрезка равна числу сантиметров до отметки.
    wrong:
      what: Длина не совпала.
      why: Возможно, посчитаны деления, а не отрезки.
      fix: Считайте промежутки между делениями от нуля.
      next: Повторите измерение длины в теме geom-measure.
- id: D-02
  type: number
  role: diagnostic
  purpose: procedure
  level: 1
  outcome: geom-measure/LO-01
  sections:
  - T01
  minutes: 1
  prompt: Отрезок длиной {{a}} см перевели в миллиметры. Сколько миллиметров в этом
    отрезке? (1 см = 10 мм)
  answer: '40'
  variants:
  - params:
      a: 4
    answer: '40'
  hints:
  - Во сколько раз миллиметр меньше сантиметра?
  - Умножьте сантиметры на 10.
  - Отрезок {{a}} см — это {{a}} раз по 10 мм.
  solution: '### Ответ

    40


    ### Идея

    1 см = 10 мм, поэтому сантиметры умножают на 10.


    ### Шаги

    1. 4 см = 4·10 мм.

    2. 4·10 = 40 мм.


    ### Проверка

    40 мм :10 =4 см — обратное деление совпало.


    ### Типичная ошибка

    Разделить вместо умножения.'
  feedback:
    correct: Верно, сантиметры переведены в миллиметры умножением на 10.
    wrong:
      what: Число миллиметров не совпало.
      why: Возможно, перепутано умножение и деление.
      fix: Умножьте сантиметры на 10.
      next: Повторите единицы длины.
- id: D-03
  type: number
  role: diagnostic
  purpose: procedure
  level: 1
  outcome: num-mult-meaning/LO-01
  sections:
  - T01
  minutes: 1
  prompt: В коробке {{a}} рядов, в каждом ряду по {{b}} предмета. Сколько предметов
    всего?
  answer: '12'
  variants:
  - params:
      a: 3
      b: 4
    answer: '12'
  hints:
  - Ряды — равные группы.
  - Сложите группы умножением.
  - Всего {{a}} группы по {{b}} предметов.
  solution: '### Ответ

    12


    ### Идея

    Равные группы считают умножением.


    ### Шаги

    1. В ряду 4 предмета.

    2. Рядов 3: 3·4=12.


    ### Проверка

    4+4+4=12 — сложение одинаковых слагаемых даёт то же число.


    ### Типичная ошибка

    Сложить 3+4 вместо умножения.'
  feedback:
    correct: Верно, ряды — равные группы, их объединяет умножение.
    wrong:
      what: Число предметов не совпало.
      why: Возможно, сложены число рядов и число в ряду.
      fix: Умножьте число рядов на число в ряду.
      next: Повторите смысл умножения.
- id: D-04
  type: number
  role: diagnostic
  purpose: procedure
  level: 1
  outcome: num-mult-meaning/LO-01
  sections:
  - T01
  minutes: 1
  prompt: Вычислите {{a}} \cdot {{b}}.
  answer: '20'
  variants:
  - params:
      a: 4
      b: 5
    answer: '20'
  hints:
  - Умножение — сложение одинаковых чисел.
  - Сколько будет {{a}} раз по {{b}}?
  - Посчитайте {{b}}+{{b}}+... ({{a}} раза).
  solution: '### Ответ

    20


    ### Идея

    Умножение — сумма равных слагаемых.


    ### Шаги

    1. 4·5 = 5+5+5+5.

    2. 20.


    ### Проверка

    5·4=20 — перестановка не меняет результат.


    ### Типичная ошибка

    Сложить 4+5 вместо 4·5.'
  feedback:
    correct: Верно, умножение выполнено.
    wrong:
      what: Произведение не совпало.
      why: Возможно, сложены множители.
      fix: Сложите {{a}} раз число {{b}}.
      next: Повторите таблицу умножения.
