tasks:
- id: P-01
  type: number
  role: warmup
  purpose: procedure
  level: 0
  outcome: LO-01
  sections:
  - T01
  minutes: 1
  prompt: На клетчатой бумаге прямоугольник {{a}} на {{b}} клеток. Сколько клеток его покрывают?
  answer: '12'
  hints:
  - Сколько клеток в одном ряду?
  - Сколько таких рядов в прямоугольнике?
  - В ряду {{a|pl:клетка,клетки,клеток}}, рядов {{b}} — умножьте.
  solution: |-
    ### Ответ
    12

    ### Идея
    Ряды — равные группы клеток.

    ### Шаги
    1. В ряду 4 клетки.
    2. Рядов 3.
    3. 4·3=12.

    ### Проверка
    По столбцам 3·4=12 — то же число.

    ### Типичная ошибка
    Пропустить последний ряд (E-geom-area-rect-one-row).
  feedback:
    correct: Верно, ряды посчитаны.
    wrong:
      what: Число клеток не совпало.
      why: Возможно, посчитан один ряд.
      fix: Умножьте клетки в ряду на число рядов.
      next: Разберите пример 1 раздела T01.
  errors:
  - E-geom-area-rect-one-row
  variants:
  - params:
      a: 4
      b: 3
    answer: '12'
    solution: |-
      ### Ответ
      12

      ### Идея
      Ряды — равные группы.

      ### Шаги
      1. В ряду 4 клетки.
      2. Рядов 3.
      3. 4·3=12.

      ### Проверка
      Столбцы 3·4=12 совпало.

      ### Типичная ошибка
      Пропущен последний ряд.
  - params:
      a: 5
      b: 2
    answer: '10'
    solution: |-
      ### Ответ
      10

      ### Идея
      Ряды — равные группы.

      ### Шаги
      1. В ряду 5 клеток.
      2. Рядов 2.
      3. 5·2=10.

      ### Проверка
      Столбцы 2·5=10 совпало.

      ### Типичная ошибка
      Пропущен последний ряд.
- id: P-02
  type: choice
  role: warmup
  purpose: meaning
  level: 0
  outcome: LO-01
  sections:
  - T01
  minutes: 1
  prompt: Что измеряет площадь фигуры?
  options:
  - id: a
    text: Число единичных квадратов, покрывающих фигуру без зазоров и наложений
  - id: b
    text: Длину границы вокруг фигуры
    misconception: E-geom-area-rect-perimeter
  - id: c
    text: Число клеток без последнего ряда
    misconception: E-geom-area-rect-one-row
  - id: d
    text: Сумму длин двух соседних сторон
    misconception: E-geom-area-rect-add-sides
  answer: a
  hints:
  - Площадь связана с покрытием, а не с обходом.
  - Вспомните определение через единичные квадраты.
  - Выберите то, что считает квадраты внутри.
  solution: |-
    ### Ответ
    Число единичных квадратов, покрывающих фигуру без зазоров и наложений

    ### Идея
    Площадь — мера покрытия.

    ### Шаги
    1. Покрытие без зазоров.
    2. Считают квадраты внутри.

    ### Проверка
    Длина границы — периметр, пропуск последнего ряда занижает площадь.

    ### Типичная ошибка
    Путать площадь с периметром или одним рядом.
  feedback:
    correct: Верно, площадь — число квадратов внутри.
    wrong:
      what: Выбран неверный смысл.
      why: Возможно, площадь путают с длиной границы.
      fix: Вспомните определение площади через квадраты.
      next: Раздел T01, заметка Главная мысль.
  errors:
  - E-geom-area-rect-perimeter
  - E-geom-area-rect-one-row
  - E-geom-area-rect-add-sides
