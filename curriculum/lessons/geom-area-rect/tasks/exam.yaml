    prompt: Прямоугольник на клетчатой бумаге 6 клеток на 4 клетки. Сколько клеток его покрывают?
    answer: '24'
    hints:
    - Сколько клеток в одном ряду?
    - Сколько таких рядов?
    - Умножьте 6 на 4.
    solution: |
      ### Ответ

      24

      ### Идея

      Площадь — число клеток, ряды — равные группы.

      ### Шаги

      1. В ряду 6 клеток.
      2. Рядов 4.
      3. 6·4=24.

      ### Проверка

      Столбцы 4·6=24.

      ### Типичная ошибка

      Один ряд 6.
    feedback:
      correct: Верно — 6·4=24 клетки.
      wrong:
        what: Клеток не 24.
        why: Возможно, посчитан один ряд.
        fix: В каждом ряду 6, рядов 4 — умножьте.
        next: Раздел T01.
    role: exam
    level: 1
    purpose: procedure
