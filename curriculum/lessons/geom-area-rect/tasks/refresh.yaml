tasks:
- id: R-01
  type: number
  role: refresh
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T01
  - T02
  minutes: 3
  prompt: Прямоугольник имеет стороны {{a}} см и {{b}} см. Найдите его площадь в квадратных сантиметрах.
  answer: '24'
  variants:
  - params:
      a: 6
      b: 4
    answer: '24'
    solution: |
      ### Ответ

      24

      ### Идея

      Площадь — число квадратов, ряды — равные группы.

      ### Шаги

      1. В ряду 6 квадратов.
      2. Рядов 4.
      3. 6·4=24.

      ### Проверка

      Проверка по столбцам: 4·6=24 совпало.

      ### Типичная ошибка

      E-geom-area-rect-perimeter: ответ 20 — периметр, а не площадь.
  - params:
      a: 5
      b: 7
    answer: '35'
    solution: |
      ### Ответ

      35

      ### Идея

      Площадь — число квадратов.

      ### Шаги

      1. В ряду 5 квадратов.
      2. Рядов 7.
      3. 5·7=35.

      ### Проверка

      Столбцы 7·5=35.

      ### Типичная ошибка

      E-geom-area-rect-add-sides: 12 — сумма, а не произведение.
  - params:
      a: 8
      b: 3
    answer: '24'
    solution: |
      ### Ответ

      24

      ### Идея

      Площадь — число квадратов.

      ### Шаги

      1. В ряду 8 квадратов.
      2. Рядов 3.
      3. 8·3=24.

      ### Проверка

      Перестановка 3·8=24.

      ### Типичная ошибка

      E-geom-area-rect-one-row: 18 — не учтён последний ряд.
  hints:
  - Сколько квадратов в одном ряду?
  - Сколько таких рядов?
  - Умножьте {{a}} на {{b}}.
  solution: |
    ### Ответ

    {{a}}·{{b}} см²

    ### Идея

    Площадь прямоугольника — произведение сторон.

    ### Шаги

    1. В ряду {{a}} квадратов.
    2. Рядов {{b}}.
    3. {{a}}·{{b}} — площадь.

    ### Проверка

    Столбцы дают то же произведение.

    ### Типичная ошибка

    Не путайте с периметром 2·({{a}}+{{b}}) и суммой {{a}}+{{b}}.
  feedback:
    correct: Верно — площадь {{a}}·{{b}} см² найдена умножением сторон.
    wrong:
      what: Площадь не совпала.
      why: Возможно, стороны сложены или взят периметр.
      fix: 'Вспомните ряды: {{a}} в ряду, {{b|pl:ряд,ряда,рядов}} — умножьте.'
      next: Карточка раздела T02 — формула площади прямоугольника.
  errors:
  - E-geom-area-rect-perimeter
  - E-geom-area-rect-add-sides
  - E-geom-area-rect-one-row
- id: R-02
  type: number
  role: refresh
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T02
  minutes: 3
  prompt: Квадрат имеет сторону {{s}} см. Найдите его площадь.
  answer: '49'
  variants:
  - params:
      s: 7
    answer: '49'
    solution: |
      ### Ответ

      49

      ### Идея

      Квадрат — прямоугольник с равными сторонами.

      ### Шаги

      1. Сторона 7.
      2. 7·7=49.

      ### Проверка

      Проверка 7·7.

      ### Типичная ошибка

      Ошибка периметра: 28.
  - params:
      s: 5
    answer: '25'
    solution: |
      ### Ответ

      25

      ### Идея

      Квадрат — прямоугольник.

      ### Шаги

      5·5=25.

      ### Проверка

      Проверка.

      ### Типичная ошибка

      Ошибка сложения: 10.
  - params:
      s: 9
    answer: '81'
    solution: |
      ### Ответ

      81

      ### Идея

      Квадрат.

      ### Шаги

      9·9=81.

      ### Проверка

      Проверка.

      ### Типичная ошибка

      Один ряд: 9.
  hints:
  - Квадрат — прямоугольник с равными сторонами.
  - Площадь квадрата — сторона умножить на себя.
  - Вычислите {{s}}·{{s}}.
  solution: |
    ### Ответ

    {{s}}·{{s}}

    ### Идея

    Площадь квадрата — квадрат стороны.

    ### Шаги

    1. Сторона {{s}}.
    2. {{s}}·{{s}} — площадь.

    ### Проверка

    Проверка: {{s}}·{{s}}.

    ### Типичная ошибка

    Не путайте с периметром 4·{{s}}.
  feedback:
    correct: Верно — площадь квадрата {{s}}·{{s}}.
    wrong:
      what: Площадь квадрата не совпала.
      why: Возможно, взят периметр.
      fix: Сторона умножается на себя.
      next: Раздел T02 — площадь квадрата.
- id: R-03
  type: number
  role: refresh
  purpose: method
  level: 2
  outcome: LO-01
  sections:
  - T02
  minutes: 3
  prompt: Площадь прямоугольника {{S}} см², одна сторона {{a}} см. Найдите другую сторону.
  answer: '6'
  variants:
  - params:
      S: 24
      a: 4
    answer: '6'
    solution: |
      ### Ответ

      6

      ### Идея

      Обратная операция к умножению.

      ### Шаги

      24:4=6.

      ### Проверка

      6·4=24.

      ### Типичная ошибка

      Сложение: 20.
  - params:
      S: 35
      a: 5
    answer: '7'
    solution: |
      ### Ответ

      7

      ### Идея

      Деление.

      ### Шаги

      35:5=7.

      ### Проверка

      7·5=35.

      ### Типичная ошибка

      Сумма 30.
  - params:
      S: 32
      a: 8
    answer: '4'
    solution: |
      ### Ответ

      4

      ### Идея

      Деление.

      ### Шаги

      32:8=4.

      ### Проверка

      4·8=32.

      ### Типичная ошибка

      Один ряд 8.
  hints:
  - Площадь — произведение сторон.
  - Как найти неизвестный множитель?
  - Разделите {{S}} на {{a}}.
  solution: |
    ### Ответ

    {{S}}:{{a}}

    ### Идея

    Неизвестная сторона — площадь делить на известную.

    ### Шаги

    1. S = a·b.
    2. b = S:a = {{S}}:{{a}}.

    ### Проверка

    Проверка умножением.

    ### Типичная ошибка

    Не складывать.
  feedback:
    correct: Верно — вторая сторона {{S}}:{{a}}.
    wrong:
      what: Сторона не совпала.
      why: Возможно, сложены площадь и сторона.
      fix: Разделите площадь на известную сторону.
      next: Раздел T02 — обратная задача.
- id: R-04
  type: number
  role: refresh
  purpose: procedure
  level: 2
  outcome: LO-02
  sections:
  - T03
  minutes: 2
  prompt: Переведите {{v}} дм² в квадратные сантиметры.
  answer: '500'
  variants:
  - params:
      v: 5
    answer: '500'
    solution: |
      ### Ответ

      500

      ### Идея

      1 дм² =100 см².

      ### Шаги

      5·100=500.

      ### Проверка

      500:100=5.

      ### Типичная ошибка

      ×10 даёт 50.
  - params:
      v: 3
    answer: '300'
    solution: |
      ### Ответ

      300

      ### Идея

      1 дм²=100 см².

      ### Шаги

      3·100=300.

      ### Проверка

      300:100=3.

      ### Типичная ошибка

      ×10 даёт 30.
  - params:
      v: 8
    answer: '800'
    solution: |
      ### Ответ

      800

      ### Идея

      1 дм²=100.

      ### Шаги

      8·100=800.

      ### Проверка

      800:100=8.

      ### Типичная ошибка

      ×10 80.
  hints:
  - Сколько см² в 1 дм²?
  - 1 дм =10 см, поэтому 1 дм² =10·10 см².
  - Умножьте {{v}} на 100.
  solution: |
    ### Ответ

    {{v}}·100 см²

    ### Идея

    Перевод квадратных единиц — умножение на 100.

    ### Шаги

    1 дм²=100 см², поэтому {{v}} дм² = {{v}}·100 см².

    ### Проверка

    Обратное деление на 100.

    ### Типичная ошибка

    Линейный перевод ×10 даёт ошибку.
  feedback:
    correct: Верно — {{v}} дм² = {{v}}·100 см².
    wrong:
      what: Перевод не совпал.
      why: Возможно, умножили на 10.
      fix: 1 дм²=100 см².
      next: Раздел T03 — единицы площади.
  errors:
  - E-geom-area-rect-unit-linear
- id: R-05
  type: number
  role: refresh
  purpose: method
  level: 2
  outcome: LO-02
  sections:
  - T04
  minutes: 3
  prompt: 'Фигура составлена из двух прямоугольников без наложений: первый {{a}}×{{b}}, второй {{c}}×{{d}}. Найдите её площадь.'
  answer: '34'
  variants:
  - params:
      a: 6
      b: 4
      c: 5
      d: 2
    answer: '34'
    solution: |
      ### Ответ

      34

      ### Идея

      Площадь сложением частей.

      ### Шаги

      6·4=24, 5·2=10, сумма 34.

      ### Проверка

      Дополнение до 6·6=36 минус 2.

      ### Типичная ошибка

      Bounding 36.
  - params:
      a: 7
      b: 3
      c: 4
      d: 5
    answer: '41'
    solution: |
      ### Ответ

      41

      ### Идея

      Сложением.

      ### Шаги

      7·3=21,4·5=20, сумма41.

      ### Проверка

      41.

      ### Типичная ошибка

      Bounding 35.
  - params:
      a: 8
      b: 2
      c: 6
      d: 3
    answer: '34'
    solution: |
      ### Ответ

      34

      ### Идея

      Сложением.

      ### Шаги

      8·2=16,6·3=18, сумма34.

      ### Проверка

      34.

      ### Типичная ошибка

      Bounding.
  hints:
  - Площадь составной фигуры — сумма площадей частей.
  - Найдите площади каждого прямоугольника.
  - Сложите {{a}}·{{b}} и {{c}}·{{d}}.
  solution: |
    ### Ответ

    {{a}}·{{b}}+{{c}}·{{d}}

    ### Идея

    Составную фигуру разбивают на прямоугольники без наложений.

    ### Шаги

    1. {{a}}·{{b}}.
    2. {{c}}·{{d}}.
    3. Сумма.

    ### Проверка

    Проверка дополнением.

    ### Типичная ошибка

    Целый описанный прямоугольник — ошибка.
  feedback:
    correct: Верно — площадь суммой частей.
    wrong:
      what: Площадь не совпала.
      why: Возможно, взята площадь описанного прямоугольника.
      fix: Разбейте на части без наложений.
      next: Раздел T04 — составные фигуры.
  errors:
  - E-geom-area-rect-composite-bounding
