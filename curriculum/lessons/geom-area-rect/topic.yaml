id: geom-area-rect
title: "Площадь прямоугольника и квадрата"
section: geom
stage: 1
hours: 3
grade: "3"
prerequisites: [geom-measure, num-mult-meaning]
scope: >
  Периметр не нужен как пререквизит: площадь выводится из покрытия квадратами. Площади треугольника и других фигур — в geom-area-tri и geom-area-advanced.
version: "1.0.0"
summary: >
  Находит площадь прямоугольника и квадрата подсчётом единичных квадратов и по формуле длина × ширина, переводит квадратные единицы и вычисляет площадь составной фигуры из прямоугольников сложением частей.

