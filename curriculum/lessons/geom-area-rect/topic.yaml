outcomes:
  - id: LO-01
    short: Находит площадь прямоугольника
    action: вычисляет площадь прямоугольника и квадрата подсчётом единичных квадратов и по длинам сторон
    conditions: стороны — целые числа от 1 до 20, единицы названы (см, м, клетки), фигуры на сетке без вырезов и наложений
    criterion: верно находит площадь и называет единицу площади, отличает площадь от периметра, для квадрата применяет сторону × сторона
    level: core
    sections: [T01, T02]
  - id: LO-02
    short: Переводит единицы и складывает части
    action: переводит квадратные единицы и находит площадь составной фигуры из 2–3 прямоугольников
    conditions: линейные размеры — целые от 1 до 20, перевод в пределах 1 м² = 10 000 см², составные фигуры без наложений, размеры согласованы
    criterion: верно выполняет перевод с коэффициентами 100 и 10 000 и находит площадь сложением частей или дополнением до прямоугольника
    level: standard
    sections: [T03, T04]
  - id: LO-03
    short: Применяет площадь в переносе
    action: выбирает метод вычисления площади в новых контекстах, перебирает варианты и обосновывает выбор
    conditions: размеры — целые от 1 до 20, фигуры без наложений, перевод в пределах 10 000 см², требуется выбор разбиения или проверка
    criterion: верно выбирает метод (разбиение, дополнение, перевод) и находит площадь в задачах на перенос и выбор метода
    level: deep
    sections: [T02, T04]

