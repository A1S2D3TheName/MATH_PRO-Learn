      ### Идея

      Одна группа булочек — это доля $\dfrac{1}{8}$ от всех 24 булочек, её находят делением на равные части.

      ### Шаги

      1. Всего 24 булочки, число равных групп равно 8.
      2. Делим общее число булочек на число групп: $24 : 8 = 3$.

      ### Проверка

      Умножаем число булочек в одной группе на число групп: $3 \cdot 8 = 24$.

      ### Типичная ошибка

      Умножить $24 \cdot 8 = 192$ или назвать остаток в остальных группах ($24 - 3 = 21$) вместо одной доли 3.
