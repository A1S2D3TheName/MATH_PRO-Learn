  prompt: Одну долю ленты после {{k|pl:сгиба,сгибов,сгибов}} пополам записывают единичной дробью
    $\dfrac{1}{d}$. Какое число $d$ стоит внизу этой записи?
  answer: 4
  hints:
  - Вспомните, что показывает нижнее число под чертой в записи единичной дроби.
  - Сверху стоит 1 (одна взятая доля), а снизу — на сколько всего равных долей разделена лента.
  - Используйте число всех равных долей ленты после {{k}} сгибов пополам из первого шага.
  solution: |-
    ### Ответ

    4

    ### Идея

    В записи единичной дроби $\dfrac{1}{4}$ сверху стоит $1$ (одна доля), а снизу — общее число равных долей целого.

    ### Шаги

    1. На первом шаге после 2 сгибов пополам получили 4 равные доли.
    2. Записываем одну долю ленты как $\dfrac{1}{4}$: нижнее число равно 4.

    ### Проверка

    Нижнее число 4 совпадает с числом всех равных долей ленты после 2 сгибов.

    ### Типичная ошибка

    Записать внизу 3 (результат сложения 2 + 1) вместо числа равных долей 4.
