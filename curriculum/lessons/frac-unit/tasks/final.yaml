  minutes: 2
  prompt: Упаковочную ленту в пекарне «Корка» складывают пополам поперёк через все слои {{k|pl:раз,раза,раз}}
    подряд, и все куски совпадают. На сколько равных долей разделена лента? Введите число.
  answer: 4
  hints:
  - Проследите, во сколько раз увеличивается число равных долей ленты при каждом поперечном сгибе пополам.
  - На каждом сгибе пополам через все слои число долей удваивается, а не увеличивается на 1.
  - Начните с 2 долей после первого сгиба и удвойте их для {{k}} сгибов подряд.
  solution: |-
    ### Ответ

    4

    ### Идея

    У упаковочной ленты каждый поперечный сгиб пополам через все слои удваивает число равных долей.

    ### Шаги

    1. Первый сгиб пополам делит ленту на $2$ равные доли.
    2. Второй сгиб пополам удваивает число долей: $2 \cdot 2 = 4$.

    ### Проверка

    Наложение: после 2 сгибов совпадают все 4 куска, а не 3.

    ### Типичная ошибка

    Назвать 3 доли, прибавив единицу к числу сгибов (2 + 1 = 3) вместо удвоения.
