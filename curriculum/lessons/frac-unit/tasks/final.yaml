# Финальная связная цепочка задач по единому сценарию (STANDARD.md §8).
title: Заказ в пекарне «Корка»
context_id: korka-order
scenario: Пекарня «Корка» режет один торт на равные доли и раскладывает булочки на столько же групп. Числа
  заказа вымышлены.
