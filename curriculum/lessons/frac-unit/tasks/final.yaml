      when:
        expr: n * d
      message: Вы умножили ({{n}}) на ({{d}}), а нужно разделить ({{n}}) на ({{d}}).
    - id: E-frac-unit-rest-instead
      when:
        expr: n - n / d
      message: Это булочки в остальных коробках вместе, а спрашивают про одну долю $\dfrac{1}{{{d}}}$.
