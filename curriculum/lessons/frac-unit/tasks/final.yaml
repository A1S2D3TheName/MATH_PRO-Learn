  prompt: В пекарне испекли {{n|pl:булочку,булочки,булочек}} и разложили их поровну на {{d|pl:коробку,коробки,коробок}}
    (по числу долей ленты). Сколько булочек в одной такой доле $\dfrac{1}{{{d}}}$?
  answer: 2
  hints:
  - В условии известно общее число булочек на лотке и число равных коробок.
  - Чтобы найти одну единичную долю лотка, общее число булочек делят на число равных коробок.
  - Возьмите общее число булочек ({{n}}) и разделите его на число равных коробок из условия.
  solution: |-
    ### Ответ

    2

    ### Идея

    Одна группа булочек — это доля $\dfrac{1}{4}$ от всех 8 булочек, её находят делением на равные части.

    ### Шаги

    1. Всего 8 булочек, число равных групп равно 4.
    2. Делим общее число булочек на число групп: $8 : 4 = 2$.

    ### Проверка

    Умножаем число булочек в одной группе на число групп: $2 \cdot 4 = 8$.

    ### Типичная ошибка

    Умножить $8 \cdot 4 = 32$ или назвать остаток в остальных группах ($8 - 2 = 6$) вместо одной доли 2.
