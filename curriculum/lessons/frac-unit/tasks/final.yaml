      why: При переходе от всех ({{n}}) штук к одной из ({{d}}) равных долей нужно выполнить деление.
      fix: Разделите общее число булочек ({{n}}) на число коробок ({{d}}).
      next: Перечитайте раздел T03 про нахождение доли группы предметов.
    misconceptions:
