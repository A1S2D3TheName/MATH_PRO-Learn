- id: P-05
  type: number
  role: supported
  purpose: meaning
  level: 1
  outcome: LO-01
  sections:
  - T02
  minutes: 2
  prompt: Целое разрезано на {{p|pl:равную долю,равные доли,равных долей}}. Каждую долю разрезали ещё
    пополам. На сколько равных долей разрезано целое теперь? Введите число.
  hints:
  - Каждую из начальных равных долей пирога делят ещё пополам.
  - Если каждая доля делится на две части, общее число долей увеличивается вдвое.
  - Умножьте начальное число долей ${{p}}$ на два и запишите полученное общее число частей.
  solution: |
    ### Ответ
    4

    ### Идея
    Половина каждой уже полученной доли удваивает число долей целого.

    ### Шаги
    1. Сначала долей 2.
    2. Каждую разрезают пополам, поэтому новых долей вдвое больше: $2 \cdot 2 = 4$.
    3. Это не 3: к числу долей не переходят на соседнюю отметку луча.

    ### Проверка
    На месте каждой старой доли лежат 2 новые. Старых долей 2, новых $2 \cdot 2 = 4$.

    ### Типичная ошибка
    Ошибка — назвать 3, сдвинувшись на одно деление луча. Половина доли удваивает число долей.
  feedback:
    correct: 'Верно: число долей удвоилось, а не сдвинулось на 1.'
    wrong:
      what: Число новых долей не вдвое больше исходного.
      why: Половину доли иногда записывают как следующее число на луче.
      fix: Разрежьте каждую долю пополам и пересчитайте новые куски.
      next: Разберите половину половины в разделе T02.
    misconceptions:
    - id: E-frac-unit-half-adds-one
      when:
        expr: p + 1
      message: К числу долей прибавлена единица вместо удвоения.
  answer: 4
