  - id: r2
    text: $\dfrac{1}{3}$
  - id: r3
    text: $\dfrac{1}{4}$
  - id: r4
    text: $\dfrac{1}{6}$
- id: P-03
  type: number
  role: warmup
  purpose: procedure
  level: 1
  outcome: LO-02
  sections:
  - T03
  minutes: 2
  prompt: '{{n|pl:булочка,булочки,булочек}} раскладывают на {{d|pl:равную долю,равные доли,равных долей}}.
    Сколько булочек в одной доле? Введите число.'
  hints:
  - Посмотрите, сколько всего ягод лежит в миске и на сколько равных долей их делят.
  - Чтобы найти одну долю группы предметов, общее число делят на число равных долей.
  - Возьмите общее число ягод ({{n}}) и разделите его на число равных долей из условия.
  solution: |
    ### Ответ
    3

    ### Идея
    Одна доля булочек — одна равная часть предметов. Её находят делением, не умножением.

    ### Шаги
    1. Целое — булочки, предметов 6, долей 2.
    2. Одна доля — частное: $6 : 2 = 3$.
    3. В одной доле 3.

    ### Проверка
    Проверка другим действием: $3 \cdot 2 = 6$. Произведение возвращает все предметы, значит частное было одной долей.

    ### Типичная ошибка
    Умножение числа предметов на число долей повторяет всю группу, а не выделяет одну долю. Пересчёт остальных долей тоже не является одной долей.
  feedback:
    correct: 'Верно: в одной доле булочек столько, сколько даёт деление.'
    wrong:
      what: Число булочек в одной доле не совпало.
      why: Возможно, булочки умножили на число долей.
      fix: Разложите булочки на равные группы и пересчитайте одну.
      next: Разберите шаги в разделе T03.
