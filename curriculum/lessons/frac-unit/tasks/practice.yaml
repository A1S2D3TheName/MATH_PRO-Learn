tasks:
- id: P-01
  type: number
  role: warmup
  purpose: meaning
  level: 0
  outcome: LO-01
  sections:
  - T01
  minutes: 1
  prompt: Одну равную долю целого называют «{{label}}». На сколько равных долей разрезано это целое? Введите
    число долей.
  hints:
  - Вспомните, на сколько равных частей делят целое для каждого словесного имени доли.
  - Половин у целого две, третей — три, а четвертей — четыре.
  - Определите, сколько равных долей со словом «{{label}}» укладывается в одном целом.
  solution: |
    ### Ответ
    4

    ### Идея
    Имя «четверть» задаёт число равных долей.

    ### Шаги
    1. Долю называют «четверть».
    2. Таких равных долей в целом 4.
    3. Введите это число.

    ### Проверка
    4 такие доли закрывают целое: имя и число частей согласованы.

    ### Типичная ошибка
    Соседнее слово в речи называет другое число долей.
  feedback:
    correct: 'Верно: имя доли назвало число равных частей целого.'
    wrong:
      what: Число долей не совпало с именем.
      why: Слово «половина», «треть» или «четверть» уже задаёт число частей.
      fix: Вернитесь к имени и посчитайте, сколько таких долей закрывают целое.
      next: Разберите имена в разделе T02.
  answer: 4
