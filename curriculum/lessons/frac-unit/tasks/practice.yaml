- id: P-04
  type: number
  role: supported
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T01
  minutes: 2
  prompt: Полоску сложили пополам поперёк через все слои {{k|pl:раз,раза,раз}} подряд, и каждый
    раз куски совпали. Сколько равных долей получилось? Введите число.
  hints:
  - Каждый новый сгиб пополам через все слои удваивает число слоёв ленты.
  - Умножайте число частей на два столько раз, сколько сгибов пополам сделано.
  - Вычислите степень двойки $2^{{k}}$ при числе сгибов $k = {{k}}$ и проверьте результат.
  solution: |
    ### Ответ
    4

    ### Идея
    У полоски каждый сгиб пополам удваивает число равных долей, если куски совпадают.

    ### Шаги
    1. Складываний пополам: 2. На каждом сгибе число долей удваивается.
    2. После сгиба 1 долей $1 \cdot 2 = 2$.
    3. После сгиба 2 долей $2 \cdot 2 = 4$.
    4. После 2 сгибов равных долей 4.

    ### Проверка
    Наложение: после последнего сгиба совпадают 4 куска, не 3. К числу сгибов единицу не прибавляют.

    ### Типичная ошибка
    Ошибка — назвать 3 доли, прибавив единицу к числу сгибов. Удвоение на каждом сгибе даёт 4.
  feedback:
    correct: 'Верно: на каждом сгибе число долей удвоилось.'
    wrong:
      what: Число долей не совпало с удвоением на каждом сгибе.
      why: К числу сгибов иногда прибавляют единицу вместо удвоения.
      fix: 'Наложите куски: их вдвое больше после каждого сгиба.'
      next: Вернитесь к складыванию в разделе T01.
    misconceptions:
    - id: E-frac-unit-extra-piece
      when:
        expr: k + 1
      message: К числу сгибов прибавлена единица, а доли на каждом сгибе удваиваются.
  answer: 4
  variants:
  - params:
      k: 2
    answer: 4
    solution: |
      ### Ответ
      4

      ### Идея
      У полоски каждый сгиб пополам удваивает число равных долей, если куски совпадают.

      ### Шаги
      1. Складываний пополам: 2. На каждом сгибе число долей удваивается.
      2. После сгиба 1 долей $1 \cdot 2 = 2$.
      3. После сгиба 2 долей $2 \cdot 2 = 4$.
      4. После 2 сгибов равных долей 4.

      ### Проверка
      Наложение: после последнего сгиба совпадают 4 куска, не 3. К числу сгибов единицу не прибавляют.

      ### Типичная ошибка
      Ошибка — назвать 3 доли, прибавив единицу к числу сгибов. Удвоение на каждом сгибе даёт 4.
  - params:
      k: 3
    answer: 8
    solution: |
      ### Ответ
      8

      ### Идея
      У полоски каждый сгиб пополам удваивает число равных долей, если куски совпадают.

      ### Шаги
      1. Складываний пополам: 3. На каждом сгибе число долей удваивается.
      2. После сгиба 1 долей $1 \cdot 2 = 2$.
      3. После сгиба 2 долей $2 \cdot 2 = 4$.
      4. После сгиба 3 долей $4 \cdot 2 = 8$.
      5. После 3 сгибов равных долей 8.

      ### Проверка
      Наложение: после последнего сгиба совпадают 8 кусков, не 4. К числу сгибов единицу не прибавляют.

      ### Типичная ошибка
      Ошибка — назвать 4 доли, прибавив единицу к числу сгибов. Удвоение на каждом сгибе даёт 8.
  - params:
