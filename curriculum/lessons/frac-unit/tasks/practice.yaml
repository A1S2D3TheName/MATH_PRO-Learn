      2. После сгиба 1 долей $1 \cdot 2 = 2$.
      3. После сгиба 2 долей $2 \cdot 2 = 4$.
      4. После сгиба 3 долей $4 \cdot 2 = 8$.
      5. После 4 сгибов равных долей 16.

