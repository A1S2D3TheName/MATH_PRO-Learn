- id: P-02
  type: match
  role: warmup
  purpose: procedure
  level: 0
  outcome: LO-01
  sections:
  - T02
  minutes: 1
  prompt: Сопоставьте каждое словесное название единичной доли с её записью через черту.
  hints:
  - Посмотрите на число под чертой в каждой записи $\dfrac{1}{d}$.
  - 'Нижнее число показывает, на сколько равных частей разделено целое: 2 — половина, 3 — треть, 4 — четверть.'
  - Соедините каждую запись $\dfrac{1}{2}$, $\dfrac{1}{3}$ и $\dfrac{1}{4}$ с соответствующим словесным
    названием доли.
  solution: |-
    ### Ответ

    половина — $\dfrac{1}{2}$, треть — $\dfrac{1}{3}$, четверть — $\dfrac{1}{4}$

    ### Идея

    Нижнее число в записи единичной дроби $\dfrac{1}{d}$ показывает, на сколько равных долей разделено одно целое.

    ### Шаги

    1. Половина — 1 доля из 2 равных частей: $\dfrac{1}{2}$.
    2. Треть — 1 доля из 3 равных частей: $\dfrac{1}{3}$.
    3. Четверть — 1 доля из 4 равных частей: $\dfrac{1}{4}$ (карточка $\dfrac{1}{6}$ — одна шестая — остаётся лишней).

    ### Проверка

    У всех трёх записей сверху стоит 1, а нижние числа 2, 3 и 4 соответствуют словам «половина», «треть» и «четверть».

    ### Типичная ошибка

    Перепутать четверть ($\dfrac{1}{4}$) и одну шестую ($\dfrac{1}{6}$) или сопоставить треть с $\dfrac{1}{4}$.
  feedback:
    correct: 'Верно: половина — 1/2, треть — 1/3, четверть — 1/4.'
    wrong:
      what: Соответствие между словами и записями долей установлено неверно.
      why: Нижнее число в записи должно совпадать с числом равных частей в названии доли.
      fix: 'Проверьте: половина — 2 части, треть — 3 части, четверть — 4 части.'
      next: Перечитайте таблицу имён и записей долей в разделе T02.
  answer:
  - left: l1
    right: r1
  - left: l2
    right: r2
  - left: l3
    right: r3
  left:
  - id: l1
    text: половина
  - id: l2
    text: треть
  - id: l3
    text: четверть
  right:
