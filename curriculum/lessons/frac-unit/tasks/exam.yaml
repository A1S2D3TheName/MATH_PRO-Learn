    prompt: У одного и того же торта сравнивают одну долю из 4 ($\dfrac{1}{4}$) и одну долю из 8 ($\dfrac{1}{8}$).
      Введите нижнее число более крупной доли.
    answer: 4
    hints:
    - Обе доли берут от одного и того же торта — сравните, на сколько кусков его делят.
    - Чем на меньшее число равных кусков разрезан один и тот же торт, тем крупнее каждый кусок.
    - Сравните нижние числа 4 и 8 у долей $\dfrac{1}{4}$ и $\dfrac{1}{8}$ одного торта.
    solution: |-
      ### Ответ

      4

      ### Идея

      У одного и того же торта крупнее та единичная доля, у которой нижнее число меньше.

      ### Шаги

      1. Сравниваем числа долей одного торта: $4 < 8$.
      2. При делении на 4 куска каждый кусок вдвое крупнее, чем при делении на 8 кусков.

      ### Проверка

      Две восьмые доли ($\dfrac{1}{8}$) укладываются в одной четверти ($\dfrac{1}{4}$).

      ### Типичная ошибка

      Выбрать большее число 8, забыв, что 8 — это число частей при более мелкой нарезке.
    feedback:
      correct: 'Верно: четверть (нижнее число 4) крупнее одной восьмой того же торта.'
      wrong:
