      У одного и того же круга крупнее та единичная доля, у которой нижнее число меньше.

      ### Шаги

      1. Сравниваем числа долей одного круга: $2 < 6$.
      2. Половина круга ($\dfrac{1}{2}$) втрое крупнее одной шестой круга ($\dfrac{1}{6}$).

      ### Проверка

      Три сектора по $\dfrac{1}{6}$ как раз складываются в одну половину круга $\dfrac{1}{2}$.

      ### Типичная ошибка

      Выбрать большее число 6, забыв, что при делении на 6 частей каждая доля становится мельче.
    feedback:
      correct: 'Верно: половина круга (нижнее число 2) крупнее одной шестой того же круга.'
      wrong:
        what: Нижнее число более крупной доли круга указано неверно.
        why: При делении того же круга на 6 частей сектор получается мельче, чем при делении на 2 части.
        fix: Из двух нижних чисел 2 и 6 выберите меньшее.
        next: Повторите сравнение долей одного целого в разделе T04.
