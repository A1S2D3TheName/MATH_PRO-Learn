    prompt: Лист бумаги сложили пополам поперёк через все слои 2 раза подряд, и все куски совпали. Сколько
      равных долей получилось? Введите число.
    answer: 4
    hints:
    - Проследите, как меняется число долей листа после каждого сгиба пополам.
    - Второй сгиб пополам делит пополам каждую из двух половин первого сгиба.
    - Удвойте 2 доли первого сгиба при втором сгибе ($2 \cdot 2$), не прибавляя 1 к числу сгибов 2.
    solution: |-
      ### Ответ

      4

      ### Идея

      Каждый сгиб пополам поперёк через все слои удваивает число равных долей.

      ### Шаги

      1. Первый сгиб пополам даёт 2 доли.
      2. Второй сгиб пополам удваивает их: $2 \cdot 2 = 4$ равные доли.

      ### Проверка

      Четыре четверти листа полностью совпадают при наложении.

      ### Типичная ошибка

      Прибавить к 2 сгибам единицу ($2 + 1 = 3$) вместо удвоения ($2 \cdot 2 = 4$).
    feedback:
      correct: 'Верно: после двух сгибов пополам через все слои получается 4 равные доли ($2 \cdot 2 =
        4$).'
      wrong:
        what: Число равных долей после 2 сгибов пополам найдено неверно.
        why: Прибавлена единица к числу сгибов вместо удвоения числа долей.
        fix: Умножьте 2 доли после первого сгиба на 2.
        next: Повторите правило удвоения долей при сгибах в разделе T01.
