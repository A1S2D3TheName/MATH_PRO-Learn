    minutes: 3
    points: 1
    prompt: 'В коробке 12 карандашей, а в пенале 18 карандашей. Что больше по числу карандашей: половина
      коробки или половина пенала? Введите это большее число карандашей.'
    answer: 9
    hints:
    - Здесь сравниваются половины ($\dfrac{1}{2}$) двух разных целых — коробки и пенала.
    - Найдите половину каждого целого делением на 2 и сравните полученные числа карандашей.
    - 'Вычислите $12 : 2$ для коробки и $18 : 2$ для пенала и запишите большее из двух частных.'
    solution: |-
      ### Ответ

      9

      ### Идея

      Находим половину коробки (12 карандашей) и половину пенала (18 карандашей) делением на 2 и выбираем большее число.

      ### Шаги

      1. Половина коробки: $12 : 2 = 6$ карандашей.
      2. Половина пенала: $18 : 2 = 9$ карандашей.
      3. Сравниваем: $9 > 6$.

      ### Проверка

      Пенал больше коробки ($18 > 12$), поэтому и половина пенала больше половины коробки ($9 > 6$).

      ### Типичная ошибка

      Записать половину меньшей группы ($12 : 2 = 6$) или само число 18 без деления пополам.
    feedback:
      correct: 'Верно: половина пенала содержит 9 карандашей ($18 : 2 = 9$), что больше половины коробки
        ($12 : 2 = 6$).'
      wrong:
        what: Большее число карандашей из двух половин найдено неверно.
        why: Нужно разделить на 2 большее целое (18 карандашей в пенале).
        fix: Разделите 18 на 2 и сверьте, что $9 > 6$.
        next: Повторите сравнение одноимённых долей разных целых в разделе T05.
