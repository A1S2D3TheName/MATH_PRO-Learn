    minutes: 1
    points: 1
    prompt: Сопоставьте словесное имя единичной доли с её записью через черту.
    answer:
    - left: l1
      right: r1
    - left: l2
      right: r2
    - left: l3
      right: r3
    hints:
    - Вспомните, на сколько равных частей делят целое для каждого словесного названия.
    - Это число равных частей всегда записывается под чертой единичной дроби $\dfrac{1}{d}$.
    - Сопоставьте половину с нижним числом 2, четверть — с 4, а одну шестую — с 6 (карточка $\dfrac{1}{8}$
      лишняя).
    solution: |-
      ### Ответ

      половина — $\dfrac{1}{2}$, четверть — $\dfrac{1}{4}$, одна шестая — $\dfrac{1}{6}$

      ### Идея

      Нижнее число в записи $\dfrac{1}{d}$ показывает, на сколько равных долей разделено одно целое.

      ### Шаги

      1. Половина — 1 доля из 2 ($\dfrac{1}{2}$).
      2. Четверть — 1 доля из 4 ($\dfrac{1}{4}$).
      3. Одна шестая — 1 доля из 6 ($\dfrac{1}{6}$).

      ### Проверка

      Нижние числа 2, 4 и 6 точно соответствуют названиям долей.

      ### Типичная ошибка

      Сопоставить четверть с $\dfrac{1}{6}$ или одну шестую с $\dfrac{1}{8}$.
    feedback:
      correct: 'Верно: половина — 1/2, четверть — 1/4, одна шестая — 1/6.'
      wrong:
        what: Словесные имена долей сопоставлены с записями неверно.
        why: Нижнее число под чертой должно равняться числу всех равных частей целого.
        fix: 'Проверьте нижние числа: у половины — 2, у четверти — 4, у одной шестой — 6.'
        next: Повторите таблицу имён и записей долей в разделе T02.
