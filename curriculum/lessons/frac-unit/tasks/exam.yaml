    minutes: 2
    points: 1
    prompt: 10 болтов раскладывают поровну на 5 равных долей. Сколько болтов в одной доле? Введите число.
    answer: 2
    hints:
    - Целое — группа из 10 болтов, которую делят на равные части.
    - Чтобы найти число болтов в одной доле, общее число болтов делят на число долей.
    - 'Разделите 10 болтов на 5 равных долей ($10 : 5$) и проверьте ответ умножением на 5.'
    solution: |-
      ### Ответ

      2

      ### Идея

      Одна пятая доля от 10 болтов находится делением на 5 равных частей.

      ### Шаги

      1. Всего 10 болтов, равных долей — 5.
      2. Делим $10 : 5 = 2$ болта в одной доле.

      ### Проверка

      Умножаем: $2 \cdot 5 = 10$ болтов во всех 5 долях.

      ### Типичная ошибка

      Умножить $10 \cdot 5 = 50$ или вычесть $10 - 2 = 8$ (остальные четыре доли) вместо одной доли 2.
    feedback:
      correct: 'Верно: в одной пятой доле от 10 болтов ровно 2 болта ($10 : 5 = 2$).'
      wrong:
        what: Число болтов в одной доле найдено неверно.
        why: Вместо деления 10 на 5 выполнено умножение или взят остаток.
        fix: 'Разделите 10 болтов на 5 равных долей ($10 : 5$).'
        next: Повторите нахождение доли группы в разделе T03.
