  - id: EA-01
    type: number
    role: exam
    purpose: procedure
    level: 0
    outcome: LO-01
    sections:
    - T01
    minutes: 1
    points: 1
    prompt: Ленту сложили пополам поперёк 1 раз, и её концы совпали. На сколько равных долей разделена
      лента? Введите число.
    answer: 2
    hints:
    - Представьте ленту, которую согнули пополам край к краю.
    - Линия одного поперечного сгиба пополам делит целую ленту на две совпадающие половины.
    - Посчитайте, сколько равных частей получается из 1 целой ленты после 1 сгиба пополам ($1 \cdot 2$).
    solution: |-
      ### Ответ

      2

      ### Идея

      Один поперечный сгиб пополам делит целую ленту на две совпадающие половины.

      ### Шаги

      1. Была 1 целая лента.
      2. После 1 сгиба пополам получилось $1 \cdot 2 = 2$ равные доли.

      ### Проверка

      При наложении обе половины ленты полностью совпадают.

      ### Типичная ошибка

      Назвать число сгибов 1 вместо числа полученных равных долей 2.
    feedback:
      correct: 'Верно: один поперечный сгиб пополам делит ленту ровно на 2 равные доли.'
      wrong:
        what: Число равных долей ленты после одного сгиба пополам найдено неверно.
        why: Перепутано число сгибов (1) с числом частей по обе стороны от линии сгиба.
        fix: 'Посчитайте части по обе стороны от одного сгиба пополам: их две.'
        next: Повторите складывание полоски пополам в разделе T01.
  - id: EA-02
