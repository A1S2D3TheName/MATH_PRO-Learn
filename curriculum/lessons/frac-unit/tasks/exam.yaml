      на 3 равные части. Сколько равных долей получилось во всей ленте? Введите число.
    answer: 6
    hints:
    - 'Проследите два шага: сначала сгиб пополам, затем разрезание каждой половины.'
    - После 1 сгиба пополам получилось 2 половины, и в каждой половине сделали по 3 равные части.
    - Умножьте 2 половины ленты на 3 равные части в каждой половине ($2 \cdot 3$).
    solution: |-
      ### Ответ

      6

      ### Идея

      Сначала сгиб пополам даёт 2 половины, а затем каждая половина делится на 3 равные доли.

      ### Шаги

      1. После 1 сгиба пополам получилось 2 равные половины.
      2. Каждая из 2 половин разделена на 3 части: $2 \cdot 3 = 6$ равных долей.

      ### Проверка

      Шесть равных частей по 3 в каждой половине: $6 : 3 = 2$ половины.

      ### Типичная ошибка

      Сложить $2 + 3 = 5$ или оставить число 3 (доли только одной половины).
    feedback:
