  minutes: 1
- id: D-02
  outcome: num-div-meaning/LO-02
  prompt: 12 одинаковых кубиков раскладывают в стопки по 3 кубика в каждую. Сколько стопок получится?
    Введите число.
  answer: 4
  hints:
  - Число в условии показывает размер каждой одинаковой стопки.
  - Чтобы узнать, сколько раз по нескольку предметов укладывается в общем числе, используют деление по
    содержанию.
  - 'Разделите 12 кубиков по 3 кубика в стопке ($12 : 3$) и проверьте ответ умножением.'
  solution: |
    ### Ответ
    4

    ### Идея
    Раскладка 12 кубиков по 3 в каждую стопку — это деление по содержанию.

    ### Шаги
    1. В каждой стопке по 3 кубика.
    2. Узнаём, сколько раз по 3 укладывается в 12: $12 : 3 = 4$.

    ### Проверка
    $4 \cdot 3 = 12$ кубиков — сходится.

    ### Типичная ошибка
    Вычитать $12 - 3 = 9$: вычитание убирает только одну стопку, а нужно разложить все 12 кубиков.
  feedback:
    correct: 'Верно: из 12 кубиков по 3 в стопке получается 4 стопки ($12 : 3 = 4$).'
    wrong:
      what: Число стопок определено неверно.
      why: Нужно узнать, сколько раз по 3 кубика укладывается в 12 кубиках.
      fix: 'Посчитайте, сколько раз по 3 кубика содержится в 12 кубиках ($12 : 3$).'
      next: Повторите деление по содержанию в теме «Смысл деления».
  type: number
  role: diagnostic
  purpose: procedure
  level: 0
  sections:
  - T01
  minutes: 1
- id: D-03
  outcome: num-div-meaning/LO-03
  prompt: 15 карандашей разложили поровну в 5 коробок. Какое число карандашей в одной коробке при умножении
    на 5 снова даст 15? Введите число.
  answer: 3
  hints:
  - Вспомните связь между делением поровну и проверкой умножением.
  - Частное от деления общего числа карандашей на число коробок при умножении на число коробок возвращает
    общее число.
  - Подберите число, которое при умножении на 5 даёт 15, то есть разделите 15 на 5.
  solution: |
    ### Ответ
    3

    ### Идея
    Деление проверяется умножением: число карандашей в одной коробке, умноженное на 5 коробок, должно дать 15.

    ### Шаги
    1. Ищем такое число $q$, что $q \cdot 5 = 15$.
    2. Находим его делением: $15 : 5 = 3$.

    ### Проверка
    $3 \cdot 5 = 15$ карандашей — верно.

    ### Типичная ошибка
    Вычитать $15 - 5 = 10$ вместо поиска множителя, дающего в произведении 15.
  feedback:
    correct: 'Верно: в одной коробке 3 карандаша, потому что $3 \cdot 5 = 15$.'
    wrong:
      what: Число карандашей в одной коробке не прошло проверку умножением на 5.
      why: В 5 одинаковых коробках всего 15 карандашей, значит размер одной коробки при умножении на 5
        должен давать 15.
      fix: Разделите 15 на 5 и проверьте, что результат при умножении на 5 даёт 15.
      next: Повторите связь деления и умножения в теме «Смысл деления».
  type: number
  role: diagnostic
  purpose: meaning
  level: 0
  sections:
  - T03
  minutes: 1
- id: D-04
  outcome: num-div-meaning/LO-01
  prompt: 20 жетонов разложили на 4 одинаковые группы. Сколько жетонов в одной группе, если проверка собирает
    все 4 группы обратно умножением? Введите число.
  answer: 5
  hints:
  - Все 20 жетонов разделены на четыре равные группы.
  - Размер одной группы находится делением общего числа жетонов на число групп.
  - 'Разделите 20 жетонов на 4 равные группы ($20 : 4$) и проверьте ответ умножением.'
  solution: |
    ### Ответ
    5

    ### Идея
    Чтобы узнать число жетонов в одной из 4 равных групп, делим общее число жетонов на 4.

    ### Шаги
    1. Всего 20 жетонов, равных групп 4.
    2. Делим поровну: $20 : 4 = 5$ жетонов в одной группе.

    ### Проверка
    Собираем 4 группы по 5 жетонов: $5 \cdot 4 = 20$ жетонов.

    ### Типичная ошибка
    Путать число групп (4) с числом жетонов в одной группе (5).
  feedback:
    correct: 'Верно: в одной группе 5 жетонов, так как $20 : 4 = 5$ и $5 \cdot 4 = 20$.'
    wrong:
      what: Размер одной группы жетонов найден неверно.
      why: При делении 20 жетонов на 4 равные группы нужно разделить 20 на 4.
      fix: 'Вычислите $20 : 4$ и проверьте, что произведение результата на 4 равно 20.'
      next: Повторите деление на равные части и его проверку умножением.
