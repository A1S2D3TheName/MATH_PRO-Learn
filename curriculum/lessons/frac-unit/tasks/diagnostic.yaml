tasks:
- id: D-01
  outcome: num-div-meaning/LO-01
  prompt: 8 одинаковых яблок раскладывают поровну на 4 тарелки. Сколько яблок окажется на одной тарелке?
    Введите число.
  answer: 2
  hints:
  - В условии известно общее число яблок и число равных тарелок.
  - Раскладка поровну на заданное число групп — это деление на равные части.
  - 'Разделите 8 яблок на 4 тарелки ($8 : 4$) и проверьте результат умножением.'
  solution: |
    ### Ответ
    2

    ### Идея
    Раскладка 8 яблок поровну на 4 тарелки — это деление на равные части.

    ### Шаги
    1. Всего 8 яблок, их делят поровну на 4 тарелки.
    2. Находим число яблок на одной тарелке: $8 : 4 = 2$.

    ### Проверка
    $2 \cdot 4 = 8$ яблок — сходится с условием.

    ### Типичная ошибка
    Умножать $8 \cdot 4 = 32$ вместо деления: при раскладке поровну на 4 тарелки на каждой тарелке яблок меньше, чем всего.
  feedback:
    correct: 'Верно: на каждой из 4 тарелок по 2 яблока ($8 : 4 = 2$).'
    wrong:
      what: Число яблок на одной тарелке найдено неверно.
      why: При раскладке 8 яблок поровну на 4 тарелки общее число нужно делить на число тарелок, а не
        умножать или вычитать.
      fix: Разделите общее число яблок (8) на число тарелок (4).
      next: Повторите деление на равные части в теме «Смысл деления».
  type: number
  role: diagnostic
  purpose: procedure
  level: 0
  sections:
