  prompt: У одного и того же круга сравнивают одну долю из {{a}} и одну долю из {{b}}. Введите нижнее
    число более крупной доли.
  hints:
  - Обе доли взяты от одного и того же круга — сравните, на сколько секторов его делят.
  - Чем на меньшее число равных частей делят одно и то же целое, тем крупнее получается каждая доля.
  - Сравните числа долей {{a}} и {{b}} у этого круга и выберите то, при котором доля крупнее.
  solution: |
    ### Ответ
    2

    ### Идея
    У одного целого единичная доля с меньшим нижним числом крупнее.

    ### Шаги
    1. Сравнивают нижние числа 2 и 6.
    2. Меньшее из них — 2.
    3. Крупнее доля с нижним числом 2.

    ### Проверка
    Более мелких долей в одной крупной: $6 : 2 = 3$. Одна доля из 6 короче.

    ### Типичная ошибка
    Ошибка — назвать 6, большее нижнее число. Оно показывает более мелкую долю.
  feedback:
    correct: 'Верно: у крупной доли круга нижнее число меньше.'
    wrong:
      what: Названо не нижнее число крупной доли.
      why: Большее нижнее число относится к мелкой доле.
      fix: Сравните числа частей.
      next: Освежите раздел T04.
    misconceptions:
    - id: E-frac-unit-pick-larger-bottom
      when:
        expr: b
      message: Названо большее нижнее число.
  answer: 2
  variants:
