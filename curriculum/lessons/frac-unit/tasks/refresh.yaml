- id: R-02
  type: number
  role: refresh
  purpose: procedure
  level: 1
  outcome: LO-02
  sections:
  - T03
  minutes: 2
  prompt: '{{n|pl:гвоздь,гвоздя,гвоздей}} делят на {{d|pl:равную долю,равные доли,равных долей}}. Сколько
    гвоздей в одной доле? Введите число.'
  hints:
  - В условии общее число гвоздей делят поровну на заданное число равных долей.
  - Число предметов в одной доле находится делением общего числа гвоздей на число долей.
  - Возьмите общее число гвоздей ({{n}}) и разделите его на число равных долей из условия.
  solution: |
    ### Ответ
    2

    ### Идея
    Одна доля гвоздей — одна равная часть предметов. Её находят делением, не умножением.

    ### Шаги
    1. Целое — гвозди, предметов 10, долей 5.
    2. Одна доля — частное: $10 : 5 = 2$.
    3. В одной доле 2.

    ### Проверка
    Проверка другим действием: $2 \cdot 5 = 10$. Произведение возвращает все предметы, значит частное было одной долей.

    ### Типичная ошибка
    Умножение числа предметов на число долей повторяет всю группу, а не выделяет одну долю. Пересчёт остальных долей тоже не является одной долей.
  feedback:
    correct: 'Верно: в одной доле гвоздей стоит частное.'
    wrong:
      what: Число гвоздей в доле не совпало.
      why: Гвозди могли умножить на число долей.
      fix: Разложите их поровну.
      next: Освежите раздел T03.
  answer: 2
  variants:
