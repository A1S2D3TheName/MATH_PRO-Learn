# Задачи для режима «Освежить память» (STANDARD.md §8).
tasks:
- id: R-01
  type: number
  role: refresh
  purpose: procedure
  level: 1
  outcome: LO-01
  sections:
  - T01
  minutes: 2
  prompt: Полотенце сложили пополам поперёк через все слои {{k|pl:раз,раза,раз}} подряд, и все куски
    совпали. Сколько равных долей получилось?
  hints:
  - Вспомните, что происходит с каждой долей при новом сгибе полотенца пополам поперёк через все слои.
  - На каждом сгибе пополам число равных долей удваивается, а не увеличивается на единицу.
  - Начните с 2 долей после первого сгиба и удвойте их нужное число раз для {{k}} сгибов.
  solution: |
    ### Ответ
    4

    ### Идея
    У полотенца каждый сгиб пополам удваивает число равных долей, если куски совпадают.

    ### Шаги
    1. Складываний пополам: 2. На каждом сгибе число долей удваивается.
    2. После сгиба 1 долей $1 \cdot 2 = 2$.
    3. После сгиба 2 долей $2 \cdot 2 = 4$.
    4. После 2 сгибов равных долей 4.

    ### Проверка
    Наложение: после последнего сгиба совпадают 4 куска, не 3. К числу сгибов единицу не прибавляют.

    ### Типичная ошибка
    Ошибка — назвать 3 доли, прибавив единицу к числу сгибов. Удвоение на каждом сгибе даёт 4.
  feedback:
    correct: 'Верно: доли полотенца удвоились на каждом сгибе.'
    wrong:
      what: Число долей полотенца не совпало.
      why: К числу сгибов могли прибавить единицу.
      fix: Удвойте доли на каждом сгибе.
      next: Освежите раздел T01.
  answer: 4
