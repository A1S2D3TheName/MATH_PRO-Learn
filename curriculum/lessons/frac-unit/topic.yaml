    title: Равные доли
    tree_ref: Равные доли и деление пополам, на четыре части
    synonyms: [равные части, складывание пополам, деление на четыре доли]
    sections: [T01]
  - id: frac-unit/names
    title: Половина, треть и четверть
    tree_ref: Половина, треть, четверть как слова и как запись
    synonyms: [одна вторая, одна третья, одна четвёртая, запись единичной дроби]
    sections: [T02, T04]
  - id: frac-unit/group
    title: Доля группы предметов
    tree_ref: Доля от группы предметов
    synonyms: [одна доля предметов, частное как одна доля, разложить на равные группы]
    sections: [T03, T05]
  - id: frac-unit/models
    title: Полоска и круг
    tree_ref: Модель полоски и круга
    synonyms: [полоска долей, круг равных кусков, одна и та же доля на двух моделях]
