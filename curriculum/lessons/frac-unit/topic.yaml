outcomes:
  - id: LO-01
    short: Делит целое на равные доли
    action: делит одно целое на равные доли и записывает одну долю единичной дробью
    conditions: одно целое — полоска или круг; число равных долей от 2 до 8; сверху в записи стоит 1
    criterion: верно отличает равные доли от неравных кусков, называет половину, треть или четверть и записывает одну долю
    level: core
    sections: [T01, T02]
  - id: LO-02
    short: Находит одну долю группы
    action: находит число предметов в одной доле группы и показывает ту же долю на полоске или круге
    conditions: группа из 2–20 предметов делится нацело на 2–10 равных долей; целое на модели и группа заданы явно
    criterion: верно называет число предметов в одной доле и отмечает одну долю на модели того же числа частей
    level: standard
    sections: [T02, T03]
  - id: LO-03
    short: Сравнивает доли одного целого
    action: сравнивает две единичные дроби одного целого и находит, сколько таких долей составляют целое
    conditions: числа долей от 2 до 12; сравнение долей только при одном и том же целом; разные целые названы отдельно
    criterion: верно выбирает более крупную долю одного целого и называет, сколько единичных долей дают это целое
    level: deep
    sections: [T04, T05]

