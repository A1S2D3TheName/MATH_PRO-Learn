# tree.yaml дословно (правило 6).
id: frac-unit
title: Доля целого и единичная дробь
section: frac
stage: 1
hours: 3
grade: "3"
prerequisites: [num-div-meaning]
scope: Доля целого не требует формулы площади; знаменатель как число долей.
version: "1.0.0"
summary: >
  Если одно целое разделено на d >= 2 равных частей, то каждая такая часть называется долей
  и записывается единичной дробью 1/d. Половина, треть и четверть получают имена и короткую
  запись с единицей сверху, а число предметов в одной доле группы всегда находится делением
  на число равных долей.

search:
  synonyms:
    - доля целого
    - единичная дробь
    - что такое половина
    - что такое четверть
    - одна треть
    - равные доли
    - одна доля группы
    - половина от количества
    - запись одну вторую
    - разрезать на равные части
    - модель полоски и круга
    - одна доля из нескольких
  questions:
    - Что такое доля целого?
    - Чем равные доли отличаются от неравных кусков?
    - Как записать половину, треть и четверть?
    - Что стоит сверху и снизу в записи единичной дроби?
    - Как найти одну долю группы предметов?
    - Почему четверть меньше половины одного и того же целого?
    - Сколько единичных долей составляют целое?
    - Можно ли сравнить половины разных целых?
    - Почему половина половины — это четверть, а не треть?

