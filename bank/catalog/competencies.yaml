# Измерения компетенций MATH_PRO — минимальный набор.
# Схема: math_repo_education/schemas/competency.schema.json
# Протоколы развёрнуты в specs/DIAGNOSTIC-SPEC.md.
#
# Важно: пять измерений НЕ сводятся в один балл. У них разные единицы,
# разные сроки и разные искажения. IQ-подобные тесты (reasoning, memory,
# speed) — отдельный контур: они не дают предметных компетенций.

- id: immediate_mastery
  title: Немедленное освоение
  definition: >-
    Ученик решает задачу сразу после объяснения, без подсказок и без
    предварительной попытки; измеряется на «свежем» материале в пределах
    одной учебной сессии.
  observable_signal:
    - решение получено с первой попытки, число подсказок = 0
    - правильный ответ и корректный ход рассуждения
    - время решения в пределах домена (не как отдельный балл, а как флаг)
    - задача взята из того же домена, что и объяснение
  protocol:
    procedure: >-
      После объяснения темы — 3–5 задач того же домена, подобранные по
      уровню (из банка источника). Подсказки не предлагаются, пока ученик
      не попросит; просьба фиксируется, но не прерывает зачёт: задача,
      решённая после подсказки, идёт в отдельную категорию «с подсказкой»
      и в зачёт освоения не идёт.
    instrumentation:
      - math-prm800k (уровни 1–5, предметная разметка)
      - ultimate-aptitude (сложность, разбор)
      - exercism-python (машинные тесты)
      - thealgorithms-python (справочник решений)
    interval_days: []
    source_ids: [math-prm800k, ultimate-aptitude, treecut-math, ai-tutor-socratic,
                 forallx, exercism-python, thealgorithms-python, sympy-books]
  confounders:
    - усталость и время суток — фиксировать в журнале сессии
    - формат задачи (знакомый/незнакомый) — при первом показе помечать
    - подсказки со стороны — протоколировать, иначе измерение не чистое
    - перенос: если задача решается с первого раза, но через 2 недели
      забыта — это не отменяет immediate mastery, но показывает, что
      измерение удержания не пройдено
  not_measured_by:
    - delayed_retention
    - transfer
    - iq-подобные тесты (способности не равны знанию предмета)

- id: delayed_retention
  title: Отложенное удержание
  definition: >-
    Навык сохраняется спустя дни и недели: ученик решает новую задачу на
    тот же принцип без повторения объяснения и без напоминания правила.
  observable_signal:
    - решение верно через 7 и более дней после объяснения
    - объяснение правила не запрашивалось
    - доля решённых задач на повторе выше доли на первом занятии
    - интервальный план выполнен (1/3/7/16/35/75 дней)
  protocol:
    procedure: >-
      По лестнице интервалов (1/3/7/16/35/75 дней) выдавать новые задачи
      на тот же принцип, но не повторяя условия исходных. Отметка «решено
      с первого раза» — основной сигнал; «решено после подсказки»
      засчитывается как частичное удержание и помечается отдельно.
    instrumentation:
      - fsrs4anki (модель DSR: стабильность, извлекаемость)
      - fsrs-scheduler (описание законов забывания)
      - pykt (отслеживание усвоения)
      - math-prm800k (сплит train/test как аналог «свежего» материала)
    interval_days: [1, 3, 7, 16, 35, 75]
    source_ids: [fsrs4anki, fsrs-scheduler, pykt, pyedmine, math-prm800k]
  confounders:
    - повторение того же условия учит условию, а не принципу — брать новые
    - мотивация и нагрузка вне математики
    - число повторов внутри интервала: больше трёх подряд — интервал
      фактически сокращён
  not_measured_by:
    - immediate_mastery
    - transfer

- id: transfer
  title: Перенос
  definition: >-
    Ученик решает незнакомую задачу, в которой тот же математический
    принцип применён в другом контексте, другой форме записи или в
    другой предметной оболочке.
  observable_signal:
    - задача не совпадает с разобранной ни условием, ни числами
    - решение получено верно без подсказки метода
    - ученик сам называет применённый принцип
    - верно перенесён принцип, а не воспроизведён шаблон
  protocol:
    procedure: >-
      Строить пары «исходная задача → задача на тот же принцип» (в каталоге
      это role: transfer и paired_with). Отдельно — межпредметный перенос
      (арифметика → программирование, алгебра → геометрия). Пара из
      TreeCut (решаемая/нерешаемая) проверяет устойчивость переноса:
      ученик должен заметить, что условие изменилось.
    instrumentation:
      - treecut-math (нерешаемые варианты)
      - math-prm800k (предметные пересечения)
      - exercism-python (перенос в код)
      - thealgorithms-python (перенос принципа в реализацию)
    interval_days: []
    source_ids: [treecut-math, math-prm800k, exercism-python, thealgorithms-python,
                 sympy-books, ultimate-aptitude, minif2f, imosllean4]
  confounders:
    - если новая задача сложнее по навыку, а не по контексту, падение
      балла не означает отсутствие переноса — разделять эти причины
    - узнаваемость структуры (та же схема, другие числа) — это не перенос
  not_measured_by:
    - immediate_mastery
    - delayed_retention

- id: error_diagnosis
  title: Диагностика ошибок
  definition: >-
    Ученик способен обнаружить и объяснить собственную ошибку: назвать,
    в каком шаге рассуждения она возникла, и что именно в этом шаге
    неверно.
  observable_signal:
    - ученик указывает на конкретный шаг, а не на всю задачу
    - называет тип ошибки (арифметическая, логическая, неверно прочитанное
      условие, неверно выбранный метод)
    - после объяснения ошибки исправляет её и решает задачу
    - при наличии эталонной разметки — совпадение с меткой шага
  protocol:
    procedure: >-
      Сначала решение ученика целиком (без подсказок), затем — просьба
      найти в нём ошибку, затем — объяснение, затем — исправление. Ошибка
      не навязывается: если ученик не видит её сам, это отдельная отметка
      «ошибка не обнаружена», а не неудача. Эталонные разметки шагов
      (PRM800K) и каталог типичных заблуждений используются как точка
      сравнения, а не как готовый ответ ученику.
    instrumentation:
      - math-prm800k (метки шагов PRM800K, включая ошибочные)
      - ai-tutor-socratic (каталог заблуждений, граф знаний)
      - treecut-math (задачи без ответа)
      - errors/catalog.yaml (каталог ошибок MATH_PRO)
      - educdm (модели диагностики по компетенциям)
    interval_days: []
    source_ids: [math-prm800k, ai-tutor-socratic, treecut-math, educdm, forallx,
                 pyedmine]
  confounders:
    - подсказка «найди ошибку» сама намекает, что ошибка есть — если
      ученик её не видит, сначала спросить «верен ли ход?»
    - привычка отвечать «неверно» без анализа
  not_measured_by:
    - immediate_mastery

- id: independence
  title: Самостоятельность
  definition: >-
    Потребность в помощи ИИ уменьшается по мере обучения: ученик решает
    раньше, чем просит подсказку, а к концу темы умеет проверять и
    исправлять решение сам.
  protocol:
    procedure: >-
      Измерять не «просил ли подсказку», а долю задач, решённых без
      обращения к ИИ, и время до первой просьбы. Отдельно считать
      добровольные проверки: правильность ответа ученик проверяет сам.
      Метрика — тренд по неделям, а не порог за один день.
    instrumentation:
      - mathpro/progress/store.py (журнал сессий и попыток)
      - mathpro/progress/rules.py (правила подсказок)
      - exercism-python (машинная проверка без ИИ)
    interval_days: [7, 14, 30]
    source_ids: [exercism-python, thealgorithms-python, sympy-books]
  confounders:
    - привычка спрашивать быстрее, чем думать, — это свойство интерфейса,
      а не ученика
    - разная сложность задач в разные дни
  not_measured_by:
    - immediate_mastery
